body:
  text: 遼史卷一百一列傳第三十一蕭陶蘇斡耶律阿息保蕭乙薛蕭胡篤蕭陶蘇斡字乙辛隱突呂不部人四世祖因吉髮長五尺時呼為長髮因吉祖里拔奧隗部節度使陶蘇斡謹願不妄交伯父留哥坐事免官聞重元亂挈家赴行在時陶蘇斡雖幼已如成人補筆硯小底纍遷祗候郎君轉樞密院侍御咸雍五年遷崇德宮使會有訴北南院聽訟不直者事下陶蘇斡悉改正之為耶律阿思所忌帝欲召用輒為所沮八年歷漠北滑水馬羣太保數年不調嘗曰用才未盡不若間乾統中遷漠南馬羣太保以大風傷草馬多死鞭之三百免官九年徙天齊殿宿衛明年穀價翔踊宿衛士多不給陶蘇斡出私廩賙之召同知南院樞密使事天慶四年為漢人行宮副部署時金兵初起攻陷寧江州天祚召羣臣議陶蘇斡曰女直國雖小其人勇而善射自執我叛人蕭海里勢益張我兵久不練若遇強敵稍有不利諸部離心不可制矣為今之計莫若大發諸道兵以威壓之庶可服也北院樞密使蕭得里底曰如陶蘇斡之謀徒示弱耳但發滑水以北兵足以拒之遂不用其計數月間邊兵屢北人益不安饒州渤海結構頭下城以叛有步騎三萬餘招之不下陶蘇斡帥兵往討擒其渠魁斬首數千級得所掠物悉還其主及耶律章奴叛陶蘇斡與留守耶律大悲奴為守禦章奴既平陶蘇斡請曰今邊兵懈弛若清暑嶺西則漢人嘯聚民心益搖臣愚以為宜罷此行不納乃命陶蘇斡控扼東路招集散卒後以太子太傅致仕卒耶律阿息保字特里典五院部人祖胡劣太祖時徙居西北部世為招討司吏阿息保慷慨有大志年十六以才幹補內史天慶初轉樞密院侍御金人起兵城境上遣阿息保問之金人曰若歸阿疏敢不聽命阿息保具以聞金兵陷寧江州邊兵屢敗遣阿息保與耶律章奴等齎書而東冀以脅降阿息保曰臣前使依詔開諭略無所屈將還謂臣曰若所請不遂無相見今臣請獨往不聽將行別蕭得里底曰不肖適異國必無生還願公善輔國家既至阿息保見執久乃遁歸及天祚敗績遷都巡捕使六年從阿疏討耶律章奴加領軍衛大將軍阿疏將兵而東阿息保送至軍乃還天祚怒其專鞭之三百尋為奚六部禿里太尉後阿疏反阿息保以偏師進擊臨陳墜馬被擒因阿疏有舊得免時阿疏頗好殺阿息保謂曰欲舉大事何以殺為由是全活者衆會阿疏敗乃還以戰失利囚中京數歲保大二年金兵至中京始出獄尋為敵烈皮室詳穩是時魏王淳僭號屢遣人以書來招阿息保封書以獻因諫曰東兵甚鋭未可輕敵及石輦鐸之敗天祚奔竄召阿息保不時至疑有二心並怒為淳所招殺之初阿息保知國將亡前後諫甚切及死以非罪人尤惜之蕭乙薛字特免國舅少父房之後性謹願壽隆間纍任劇官天慶初知國舅詳穩事遷殿前副點檢金兵起為行軍副都統以戰失利罷職六年出為武定軍節度使遷西京留守明年討劇賊董厖兒戰易水西大破之以功為北府宰相加左僕射兼東北路都統十年金兵陷上京詔兼上京留守東北路統軍使為政寬猛得宜民之窮困者輒加振恤衆咸愛之保大二年金兵大至乙薛軍潰左遷西南面招討使以部民流散不赴及天祚播遷給侍從不闕拜殿前都點檢凡金兵所過諸營敗卒復聚上京遣乙薛為上京留守以安撫之明年盧彥倫以城叛乙薛被執數月以居官無過得釋後為耶律大石所殺蕭胡篤字合朮隱其先撒葛只太祖時願隸宮分遂為太和宮分人曾祖敵魯明醫人有疾觀其形色即知病所在統和中宰相韓德讓貴寵敵魯希旨言德讓宜賜國姓籍橫帳由是世預太醫選子孫因之入官者衆胡篤為人便佞與物無忤清寧初補近侍大安元年為彰愍宮太師壽隆二年轉永興宮太師天慶初纍遷至殿前副點檢五年從天祚東征為先鋒都統臨事猶豫凡隊伍皆以圍場名號之進至剌離水與金兵戰敗大軍亦却及討耶律章奴以籍私奴為軍遷知北院樞密使事卒胡篤長于騎射見天祚好遊畋每言從禽之樂以逢其意天祚悅而從之國政隳廢自此始云論曰甚矣承平日久上下狃於故常之可畏也天慶之間女直方熾惟陶蘇斡明於料敵善於忠諫惜乎天祚痼蔽不見信用阿息保不死阿疏之難乙薛甘忍盧彥倫之執大節已失矣他有所長亦奚足取胡篤以遊畋逢迎天祚而隳國政可勝罪哉
