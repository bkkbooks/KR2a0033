body:
  text: 遼史卷五十四志第二十三樂志遼有國樂有雅樂有大樂有散樂有鐃歌橫吹樂舊史稱聖宗興宗咸通音律聲氣歌辭舞節徵諸太常儀鳳教坊不可得按紀志遼朝雜禮參考史籍定其可知者以補一代之闕文嗚呼咸韶夏武之樂聲亡書逸河間作記史遷因以為書寥乎希哉遼之樂觀此足矣國樂遼有國樂猶先王之風其諸國樂猶諸侯之風故志其略正月朔日朝賀用宮懸雅樂元會用大樂曲破後用散樂角抵終之是夜皇帝燕飲用國樂七月十三日皇帝出行宮三十里卓帳十四日設宴應從諸軍隨各部落動樂十五日中元大宴用樂春飛放杏堝皇帝射獲頭鵝薦廟燕飲樂工數十人執小樂器侑酒諸國樂太宗會同三年晉宣徽使楊端王朓等及諸國使朝見皇帝御便殿賜宴端朓起進酒作歌舞上為舉觴極歡會同三年端午日百僚及諸國使稱賀如式燕飲命回鶻燉煌二使作本國舞天祚天慶二年駕幸混同江頭魚酒筵半酣上命諸酋長次第歌舞為樂女直阿骨打端立直視辭以不能上謂蕭奉先曰阿骨打意氣雄豪顧視不常可託以邊事誅之不然恐貽後患奉先奏阿骨打無大過殺之傷向化之意蕞爾小國又何能為雅樂自漢以後相承雅樂有古頌焉有古大雅焉遼闕郊廟禮無頌樂大同元年太宗自汴將還得晉太常樂譜宮懸樂架委所司先赴中京聖宗太平元年尊號冊禮設宮懸於殿庭舉麾位在殿第三重西階之上協律郎各入就舉麾位太常博士引太常卿太常卿引皇帝將仗動協律郎舉麾太樂令令撞黃鍾之鍾左右鍾皆應工人舉柷樂作皇帝即御坐扇合樂止王公入門樂作至位樂止通事舍人引押冊大臣初動樂作置冊殿前香案訖就位樂止舁冊官奉冊初動樂作升殿置冊御坐前就西墉北上位樂止大臣上殿樂作至殿欄內位樂止大臣降殿階樂作復位樂止王公三品以上出樂作太常博士引太常卿太常卿引皇帝降御坐入閣樂止興宗重熙九年上契丹冊皇帝出奏隆安之樂聖宗統和元年冊承天皇太后設宮懸簨簴太樂工協律郎入太后儀衛動舉麾太和樂作太樂令太常卿導引升御坐簾捲樂止文武三品以上入舒和樂作至位樂止皇帝入門雍和樂作至殿前位樂止宰相押冊皇帝隨冊樂作至殿前置冊於案樂止翰林學士大將軍舁冊樂作置御坐前樂止丞相上殿樂作至讀冊位樂止皇帝下殿樂作至位樂止太后宣答訖樂作皇帝至西閣樂止親王丞相上殿樂作退班出樂止下簾樂作皇太后入內樂止冊皇太子儀太子初入門貞安之樂作冊禮樂工次第四隅各置建鼓一虡樂工各一人宮懸每面九虡每虡樂工一人樂虡近北置柷敔各一樂工各一人樂虡內坐部樂工左右各一百二人樂虡西南武舞六十四人執小旗二人樂虡東南文舞六十四人執小旗二人協律郎二人太樂令一人唐十二和樂遼初用之豫和祀天神順和祭地祇永和享宗廟肅和登歌奠玉帛雍和入俎接神壽和酌獻飲神太和節升降舒和節出入昭和舉酒休和以飯正和皇后受冊以行承和太子以行遼十二安樂初梁改唐十二和樂為九慶樂後唐建唐宗廟仍用十二和樂晉改為十二同樂遼雜禮天子出入奏隆安太子行奏貞安則是遼嘗改樂名矣餘十安樂名缺遼雅樂歌辭文闕不具八音器數大抵因唐之舊八音金鎛鍾石球磬絲琴瑟竹籥簫竾匏笙竽土塤革鼓鼗木柷敔十二律用周黍尺九寸管空徑三分為本道宗大康中詔行秬黍所定升斗嘗定律矣其法大抵用古律焉大樂自漢以來因秦楚之聲置樂府至隋高祖詔求知音者鄭譯得西域蘇祗婆七旦之聲求合七音八十四調之說由是雅俗之樂皆此聲矣用之朝廷別於雅樂者謂之大樂晉高祖使馮道劉昫冊應天太后太宗皇帝其聲器工官與法駕同歸於遼聖宗統和元年冊承天皇太后童子弟子隊樂引太后輦至金鑾門天祚皇帝天慶元年上壽儀皇帝出東閣鳴鞭樂作簾捲扇開樂止太尉執臺分班太樂令舉麾樂作皇帝飲酒訖樂止應坐臣僚東西外殿太樂令引堂上樂升大臣執臺太樂令奏舉觴登歌樂作飲訖樂止行臣僚酒遍太樂令奏巡周舉麾樂作飲訖樂止太常卿進御食太樂令奏食遍樂作文舞入三變引出樂止次進酒行臣僚酒舉觴巡周樂作飲訖樂止次進食食遍樂作武舞入三變引出樂止扇合簾下鳴鞭樂作皇帝入西閣樂止大樂器本唐太宗七德九功之樂武后毀唐宗廟七德九功樂舞遂亡自後宗廟用隋文武二舞朝廷用高宗景雲樂代之元會第一奏景雲樂舞杜佑通典已稱諸樂並亡唯景雲樂舞僅存唐末五代板蕩之餘在者希矣遼國大樂晉代所傳雜禮雖見坐部樂工左右各一百二人蓋亦以景雲遺工充坐部其坐立部樂自唐已亡可考者唯景雲四部樂舞而已玉磬方響搊箏筑臥箜篌大箜篌小箜篌大琵琶小琵琶大五絃小五絃吹葉大笙小笙觱篥簫銅鈸長笛尺八笛短笛以上皆一人毛員鼓連鼗鼓貝以上皆二人餘每器工一人歌二人舞二十人分四部景雲舞八人慶雲樂舞四人破陳樂舞四人承天樂舞四人大樂調雅樂有七音大樂亦有七聲謂之七旦一曰娑力平聲二曰雞識長聲三曰沙識質直聲四曰沙侯加濫應聲五曰沙臘應和聲六曰般贍五聲七曰俟利斛牛聲自隋以來樂府取其聲四旦二十八調為大樂娑力旦正宮高宮中呂宮道調宮南呂宮仙呂宮黃鍾宮雞識旦越調大食調高大食調雙調小食調歇指調林鍾商調沙識旦大食角高大食角雙角小食角歇指角林鍾角越角般涉旦中呂調正平調高平調仙呂調黃鍾調般涉調高般涉調右四旦二十八調不用黍律以琵琶絃叶之皆從濁至清迭更其聲下益濁上益清七七四十九調餘二十一調失其傳蓋出九部樂之龜茲部云大樂聲各調之中度曲協音其聲凡十曰五凡工尺上一四六勾合近十二雅律於律呂各闕其一猶雅音之不及商也散樂殷人作靡靡之樂其聲往而不反流為鄭衛之聲秦漢之間秦楚聲作鄭衛寖亡漢武帝以李延年典樂府稍用西涼之聲今之散樂俳優歌舞雜進往往漢樂府之遺聲晉天福三年遣劉昫以伶官來歸遼有散樂蓋由此矣遼冊皇后儀呈百戲角抵戲馬以為樂皇帝生辰樂次酒一行觱篥起歌酒二行歌手伎入酒三行琵琶獨彈餅茶致語食入雜劇進酒四行闕酒五行笙獨吹鼓笛進酒六行箏獨彈築毬酒七行歌曲破角抵曲宴宋國使樂次酒一行觱篥起歌酒二行歌酒三行歌手伎入酒四行琵琶獨彈餅茶致語食入雜劇進酒五行闕酒六行笙獨吹合法曲酒七行箏獨彈酒八行歌擊架樂酒九行歌角抵散樂以三音該三才之義四聲調四時之氣應十二管之數截竹為四竅之笛以叶音聲而被之絃歌三音天音揚地音抑人音中皆有聲無文四時春聲曰平夏聲曰上秋聲曰去冬聲曰入散樂器觱篥簫笛笙琵琶五絃箜篌箏方響杖鼓第二鼓第三鼓腰鼓大鼓鞚拍板雜戲自齊景公用倡優侏儒至漢武帝設魚龍曼延之戲後漢有繩舞自刳之伎杜佑以為多幻術皆出西域哇俚不經故不具述鼓吹樂鼓吹樂一曰短簫鐃歌樂自漢有之謂之軍樂遼雜禮朝會設熊羆十二案法駕有前後部鼓吹百官鹵簿皆有鼓吹樂前部鼓吹令二人掆鼓十二金鉦十二大鼓百二十長鳴百二十鐃十二鼓十二歌二十四管二十四簫二十四笳二十四後部鼓吹丞二人大角百二十羽葆十二鼓十二管二十四簫二十四鐃十二鼓十二簫二十四笳二十四右前後鼓吹行則導駕奏之朝會則列仗設而不奏橫吹樂橫吹亦軍樂與鼓吹分部而同用皆屬鼓吹令前部大橫吹百二十節鼓二笛二十四觱篥二十四笳二十四桃皮觱篥二十四掆鼓十二金鉦十二小鼓百二十中鳴百二十羽葆十二鼓十二管二十四簫二十四笳二十四後部小橫吹百二十四笛二十四簫二十四觱篥二十四桃皮觱篥二十四百官鼓吹橫吹樂自四品以上各有增損見儀衛志自周衰先王之樂寖以亡缺周南變為秦風始皇有天下鄭衛秦燕趙楚之聲迭進而雅聲亡矣漢唐之盛文事多西音是為大樂散樂武事皆北音是為鼓吹橫吹樂雅樂在者其器雅其音亦西云
