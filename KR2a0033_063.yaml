body:
  text: 遼史卷六十三表第一世表天開於子地闢於丑人生於寅天地人之初一焉耳矣天動也有恆度地靜也有恆形人動靜無方居止靡常天主流行地主蓄泄二氣無往而弗達亦惟人之所在而畀付焉庖犧氏降炎帝氏黃帝氏子孫衆多王畿之封建有限王政之布濩無窮故君四方者多二帝子孫而自服土中者本同出也考之宇文周之書遼本炎帝之後而耶律儼稱遼為軒轅後儼志晚出盍從周書蓋炎帝之裔曰葛烏菟者世雄朔陲後為冒頓可汗所襲保鮮卑山以居號鮮卑氏既而慕容燕破之析其部曰宇文曰庫莫奚曰契丹契丹之名昉見于此隋唐之際契丹之君號大賀氏武后遣將擊潰其衆大賀氏微別部長過折代之過折尋滅迭剌部長涅里立迪輦組里為阻午可汗更號遙輦氏唐賜國姓曰李懷秀既而懷秀叛唐更封楷落為王而涅里之後曰耨里思者左右懷秀楷落至于屈戍幾百年國勢復振至耨里思之孫曰阿保機功業勃興號世里氏是為遼太祖於是世里氏與大賀遙輦號三耶律自時厥後國日益大起唐季涉五代宋二百餘年名隨代遷字傳音轉此其言語文字之相通可考而知者也其所不可知者有若奇首可汗胡剌可汗蘇可汗昭古可汗皆遼之先而世次不可考矣托其可知者作遼世表帝統契丹先世漢冒頓可汗以兵襲東胡滅之餘衆保鮮卑山因號鮮卑魏青龍中部長比能稍桀驁為幽州刺史王雄所害散徙潢水之南黃龍之北晉鮮卑葛烏菟之後曰普回普回有子莫那自陰山南徙始居遼西九世為慕容晃所滅鮮卑衆散為宇文氏或為庫莫奚或為契丹元魏契丹國在庫莫奚東異族同類東部鮮卑之別支也至是始自號契丹為慕容氏所破俱竄松漠之間道武帝登國間大破之遂與庫莫奚分背經數十年稍滋蔓有部落於和龍之北數百里太武帝太平真君以來歲致名馬獻文時使莫弗紇何辰來獻始班諸國末欣服萬丹部何大何部伏弗郁部羽陵部日連部匹潔部黎部吐六于部以名馬文皮來貢得交市于和龍密雲之間太和三年高句麗與蠕蠕謀取地豆于以分之契丹懼莫弗賀勿于率其部落車三千乘衆萬餘口內附止於白狼水東北齊天保四年九月契丹犯塞文宣帝親討之至平州乃趨長司徒潘相樂率精騎五千自東道趨青山安德王韓軌帥騎四千東斷走路帝親踰山嶺奮擊虜男女十餘萬雜畜數十萬相樂又於青山大破別部所虜生口分置諸州復為突厥所逼又以萬家寄處高麗境內隋開皇四年率諸莫弗賀來謁五年悉衆款塞高祖納之聽居故地六年諸部相攻不止又與突厥相侵高祖使使諭解之別部出伏等違高麗率衆內附置於渴奚那頡之北開皇末別部四千餘戶違突厥來降高祖給糧遣還固辭不去部落漸衆遂北徙逐水草當遼西正北二百里依紇臣水而居東西亙五百里南北三百里分為十部兵多者三千少者千餘有征伐酋帥相與議之興兵則合符契突厥沙鉢略可汗遣吐屯潘垤統之契丹殺吐屯大業七年貢方物唐契丹地直京師東北五千里而贏東距高麗西奚南營州北靺鞨室韋阻冷陘山以自固射獵居處無常其君大賀氏有勝兵四萬析八部臣于突厥以為俟斤凡調發攻戰則諸部畢會獵則部得自行與奚不平每鬬不利輒遁保鮮卑山武德初大帥孫敖曹與靺鞨長突地稽俱來朝二年入犯平州境六年君長咄羅獻名馬豐貂貞觀二年摩會來降突厥請以梁師都易契丹太宗曰契丹突厥不同類師都唐編戶我將擒之不可易降者三年摩會入朝賜鼓纛由是有常貢帝伐高麗悉發契丹奚首領從軍還過營州以窟哥為左武衛將軍大帥辱紇主據曲率衆來歸即其部為玄州以據曲為刺史隸營州都督府窟哥舉部內屬乃置松漠都督府以窟哥為都督封無極男賜姓李氏以達稽部為峭落州紇便部為彈汗州獨活部為無逢州芬問部為羽陵州突便部為日連州芮奚部為徒河州墜斤部為萬丹州伏部為匹黎赤山二州俱隸松漠府以辱紇主為刺史窟哥死與奚叛行軍總管阿史德樞賓執松漠都督阿不固獻于東都窟哥二孫曰枯莫離彈汗州刺史歸順郡王曰盡忠松漠都督敖曹曾孫曰萬榮歸誠州刺史時營州都督趙文翽數侵侮其下盡忠等怨望與萬榮共舉兵殺文翽據營州自號無上可汗推萬榮為帥不二旬衆數萬攻崇州執擊討副使許欽寂武后怒詔將軍曹仁師等二十八將擊之更號萬榮曰萬斬盡忠曰盡滅戰西硤石黃獐谷王師敗績進攻平州不克武后益發兵擊契丹萬榮夜襲檀州清邊道副總管張九節拒戰萬榮敗走俄盡忠死突厥默啜襲破其部萬榮收散兵復振別將駱務整何阿小入冀州殺刺史陸寶積掠數千人武后聞盡忠死詔夏官尚書王孝傑等率兵十七萬討萬榮戰東硤石敗績孝傑死之萬榮進屠幽州又詔御史大夫婁師德等率兵二十萬擊之萬榮乘鋭鼓行而南殘瀛州屬縣神兵道總管楊玄基率奚兵掩擊大破萬榮執何阿小別將李楷固駱務整降萬榮委軍走玄基與奚四面合擊萬榮衆潰東走張九節設三伏待之萬榮窮蹙與家奴輕騎走潞河東憊甚臥林下奴斬其首以獻九節傳東都契丹餘衆不能立遂附突厥開元二年盡忠從父弟失活率部落歸唐失活玄宗賜丹書鐵券開元四年與奚長李大酺偕來詔復置松漠府以失活為都督封松漠郡王仍置靜析軍以失活為經略大使八部長皆為刺史五年以楊氏為永樂公主下嫁失活六年卒娑固失活之弟帝以娑固襲爵開元七年十一月娑固與公主來朝衙官可突于勇悍得衆心娑固欲除之事泄可突于攻之娑固奔營州都督許欽淡及奚君李大酺攻可突于不勝娑固大酺皆死韓愈作可突干劉昫宋祁及唐會要皆作可突于鬱于娑固從父弟也可突于推以為主遣使謝罪玄宗册立襲娑固位開元十年鬱于入朝以慕容氏為燕郡公主下嫁鬱于卒咄于鬱于之弟襲官爵開元十三年咄于復與可突于猜阻與公主來奔改封遼陽王邵固咄于之弟國人共立之開元十三年冬朝于行在從封禪泰山改封廣化郡王以陳氏為東光公主下嫁邵固十八年為可突于所弒以其衆降突厥東光公主走平盧屈列不知其世系可突于立之開元二十二年六月幽州節度使張守圭大破可突于十二月又破之斬屈列及可突于等傳首東都餘衆散走山谷過折本契丹部長為松漠府衙官斬可突于及屈列歸唐幽州節度使張守圭立之封北平郡王是年可突于餘黨泥禮弒過折屠其家一子剌乾走安東拜左驍衛將軍自此契丹中衰大賀氏附庸於奚王以通于唐朝貢歲至至德寶應間再至大曆中十三至貞元九年十年十一年三至元和中七至太和開成間四至泥禮耶律儼遼史書為涅里陳大任書為雅里蓋遼太祖之始祖也李懷秀唐賜姓名契丹名迪輦俎里本八部大帥天寶四年降唐拜松漠都督安祿山表請討契丹懷秀發兵十萬與祿山戰潢水南祿山大敗自是與祿山兵連不解耶律儼紀云太祖四代祖耨里思為迭剌部夷離堇遣將只里姑括里大敗范陽安祿山于潢水適當懷秀之世則懷秀固遙輦氏之首君為阻午可汗明矣楷落以唐封恭仁王代松漠都督遂稱契丹王其後寖大貞元四年犯北邊幽州以聞自祿山反河北割據道隔不通世次不可悉考契丹王屈戍武宗會昌二年授雲麾將軍是為耶瀾可汗幽州節度使張仲武奏契丹舊用回鶻印乞賜聖造詔以奉國契丹為文高麗古今録作屈戌契丹王習爾是為巴剌可汗咸通中再遣使貢獻部落寖強契丹王欽德習爾之族也是為痕德堇可汗光啓中鈔掠奚室韋諸部皆役服之數與劉仁恭相攻晚年政衰八部大人法常三歲代迭剌部耶律阿保機建旗鼓自為一部不肯受代自號為王盡有契丹國遙輦氏遂亡蕭韓家奴有言先世遙輦可汗窪之後國祚中絶自夷離堇雅里立阻午可汗大位始定今以唐史遼史參考大賀氏絶于邵固雅里所立則懷秀也其間唯屈列過折二世屈列乃可突于所立過折以別部長為雅里所殺唐史稱泥里為可突于餘黨則窪可汗者殆為屈列耶
