body:
  text: 遼史卷八十二列傳第十二耶律隆運德威滌魯制心耶律勃古哲蕭陽阿武白蕭常哥耶律虎古磨魯古耶律隆運本姓韓名德讓西南面招討使匡嗣之子也統和十九年賜名德昌二十二年賜姓耶律二十八年復賜名隆運重厚有智略明治體喜建功立事侍景宗以謹飭聞加東頭承奉官補樞密院通事轉上京皇城使遙授彰德軍節度使代其父匡嗣為上京留守權知京事甚有聲尋復代父守南京時人榮之宋兵取河東侵燕五院糾詳穩奚底統軍蕭討古等敗歸宋兵圍城招脅甚急人懷二心隆運登城日夜守禦援軍至圍解及戰高梁河宋兵敗走隆運邀擊又破之以功拜遼興軍節度使徵為南院樞密使景宗疾大漸與耶律斜軫俱受顧命立梁王為帝皇后為皇太后稱制隆運總宿衛事太后益寵任之統和元年加開府儀同三司兼政事令四年宋遣曹彬米信將十萬衆來侵隆運從太后出師敗之加守司空封楚國公師還與北府宰相室昉共執國政上言山西四州數被兵加以歲饑宜輕稅賦以來流民從之六年太后觀擊鞠胡里室突隆運墜馬命立斬之詔率師伐宋圍沙堆敵乘夜來襲隆運嚴軍以待敗走之封楚王九年復言燕人挾姦苟免賦役貴族因為囊橐可遣北院宣徽使趙智戒諭從之十一年丁母憂詔強起之明年室昉致政以隆運代為北府宰相仍領樞密使監修國史賜興化功臣十二年六月奏三京諸鞫獄官吏多因請託曲加寬貸或妄行搒掠乞行禁止上可其奏又表請任賢去邪太后喜曰進賢輔政真大臣之職優加賜賚服闋加守太保兼政事令會北院樞密使耶律斜軫薨詔隆運兼之久之拜大丞相進王齊總二樞府事以南京平州歲不登奏免百姓農器錢及請平諸郡商賈價並從之二十二年從太后南征及河許宋成而還徙王晉賜姓出宮籍隸橫帳季父房後乃改賜今名位親王上賜田宅及陪葬地從伐高麗還得末疾帝與后臨視醫藥薨年七十一贈尚書令諡文忠官給葬具建廟乾陵側無子清寧三年以魏王貼不子耶魯為嗣天祚立以皇子敖盧斡繼之弟德威姪制心德威性剛介善馳射保寧初歷上京皇城使儒州防禦使改北院宣徽使乾亨末丁父喪強起復職權西南招討使統和初党項寇邊一戰却之賜劍許便宜行事領突呂不迭剌二糾軍以討平稍古葛功真授招討使夏州李繼遷叛宋內附德威請納之既得繼遷諸夷皆從璽書褒獎與惕隱耶律善補敗宋將楊繼業加開府儀同三司政事門下平章事未幾以山西城邑多陷奪兵柄李繼遷受賂潛懷二心奉詔率兵往諭繼遷託以西征不出德威至靈州俘掠而還年五十五卒贈兼侍中子雱金終彰國軍節度使二孫謝十滌魯謝十終惕隱滌魯字遵寧幼養宮中授小將軍重熙初歷北院宣徽使右林牙副點檢拜惕隱改西北路招討使封漆水郡王請減軍籍三千二百八十人後以私取回鶻使者獺毛裘及私取阻卜貢物事覺決大杖削爵免官俄起為北院宣徽使十九年改烏古敵烈部都詳穩尋為東北路詳穩封混同郡王清寧初徙王鄧擢拜南府宰相以年老乞骸骨更王漢大康中薨年八十滌魯神情秀徹聖宗子視之興宗待以兄禮雖貴愈謙初為都點檢扈從獵黑嶺獲熊上因樂飲謂滌魯曰汝有求乎對曰臣富貴踰分不敢他望惟臣叔先朝優遇身歿之後不肖子坐罪籍沒四時之薦享諸孫中得赦一人以主祭臣願畢矣詔免籍復其産子燕五官至南京步軍都指揮使制心小字可汗奴父德崇善醫視人形色輒決其病纍官至武定軍節度使制心善調鷹隼統和中為歸化州刺史開泰中拜上京留守進漢人行宮都部署封漆水郡王以皇后外弟恩遇日隆樞密副使蕭合卓用事制心奏合卓寡識度無行檢上默然每內宴歡洽輒避之皇后不悅曰汝不樂耶制心對曰寵貴鮮能長保以是為憂耳太平中歷中京留守惕隱南京留守徙王燕遷南院大王或勸制心奉佛對曰吾不知佛法惟心無私則近之矣一日沐浴更衣而臥家人聞絲竹之聲怪而入視則已逝矣年五十三贈政事令追封陳王守上京時酒禁方嚴有捕獲私醞者一飲而盡笑而不詰卒之日部民若哀父母耶律勃古哲字蒲奴隱六院夷離堇蒲古只之後勇悍善治生保寧中為天德軍節度使歷南京侍衛馬步軍都指揮使以討平党項羌阿理撒米僕里鱉米遷南院大王聖宗即位太后稱制會羣臣議軍國事勃古哲上疏陳便宜數事稱旨即日兼領山西路諸州事統和四年宋將曹彬等侵燕勃古哲擊之甚力賜輸忠保節致主功臣總知山西五州會有告勃古哲曲法虐民者按之有狀以大杖決之八年為南京統軍使卒子爻里官至詳穩蕭陽阿字稍隱端毅簡嚴識遼漢字通天文相法父卒自五蕃部親挽喪車至奚王嶺人稱其孝年十九為本班郎君歷鐵林鐵鷂大鷹三軍詳穩乾統元年由烏古敵烈部屯田太保為易州刺史幸臣劉彥良嘗以事至州怙寵恣橫為陽阿所沮彥良歸妄加毀訾尋遣人代陽阿州民千餘詣闕請留即日授武安州觀察使歷烏古涅里順義彰信等軍節度使權知東北路統軍使事聞耶律狼不鐸魯斡等叛獨引麾下三十餘人追捕之身被二創生擒十餘人送之行在坐不獲首惡免官未幾權南京留守卒武白不知何郡人為宋國子博士差知相州至通利軍為我軍所俘詔授上京國子博士改臨潢縣令遷廣德軍節度副使先是有訟宰相劉慎行與子婦姚氏私者有司出其罪聖宗詔白鞫之白正其事使高麗還權中京留守時慎行諸子皆處權要以白斷百姓分籍事不直坐左遷未幾遷尚書左丞知樞密事拜遼興軍節度使致仕卒蕭常哥字胡獨堇國舅之族祖約直同政事門下平章事父實老纍官節度使常哥魁偉寡言年三十餘始為祗候郎君歷本族將軍松山州刺史壽隆二年以女為燕王妃拜永興宮使及妃生子為南院宣徽使尋改漢人行宮都部署乾統初加太子太師為國舅詳穩二年改遼興軍節度使召為北府宰相以柴冊禮加兼侍中天慶元年致仕卒諡曰欽肅耶律虎古字海鄰六院夷離堇覿烈之孫少穎悟重然諾保寧初補御盞郎君十年使宋還以宋取河東之意聞上燕王韓匡嗣曰何以知之虎古曰諸僭號之國宋皆併收惟河東未下今宋講武習戰意必在漢匡嗣力沮乃止明年宋果伐漢帝以虎古能料事器之乃曰吾與匡嗣慮不及此授涿州刺史統和初皇太后稱制召赴京師與韓德讓以事相忤德讓怒取護衛所執戎仗擊其腦卒子磨魯古磨魯古字遙隱有智識善射統和初拜南面林牙四年宋侵燕太后親征磨魯古為前鋒手中流矢拔而復進太后既至磨魯古以創不能戰與北府宰相蕭繼先巡邏境上纍遷北院大王六年伐宋為先鋒與耶律奴瓜破其將李忠吉于定州以疾卒于軍論曰德讓在統和間位兼將相其克敵制勝進賢輔國功業茂矣至賜姓名王齊晉抑有寵於太后而致然歟宗族如德威平党項滌魯完宗祀制心不苟合家聲益振豈無所自哉若勃古之忠陽阿之孝武白之直亦彬彬乎一代之良臣矣
