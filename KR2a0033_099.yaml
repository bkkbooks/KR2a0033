body:
  text: 遼史卷九十九列傳第二十九蕭巖壽耶律撒剌蕭速撒耶律撻不也蕭撻不也蕭忽古耶律石柳蕭巖壽乙室部人性剛直尚氣仕重熙末道宗即位皇太后屢稱其賢由是進用上出獵較巖壽典其事未嘗高下于心帝益重之歷文班太保同知樞密院事咸雍四年從耶律仁先伐阻卜破之有詔留屯亡歸者衆由是鐫兩官十年討敵烈部有功為其部節度使大康元年同知南院宣徽使事遷北面林牙密奏乙辛以皇太子知國政心不自安與張孝傑數相過從恐有陰謀動搖太子上悟出乙辛為中京留守會乙辛生日上遣近臣耶律白斯本賜物為壽乙辛因私屬白上臣見姦人在朝陛下孤危身雖在外竊用寒心白斯本還以聞上遣人賜乙辛車諭曰無慮弗用行將召矣由是反疑巖壽出為順義軍節度使乙辛復入為樞密使流巖壽於烏隗路終身拘作巖壽雖竄逐恆以社稷為憂時人為之語曰以狼牧羊何能久長三年乙辛誣巖壽與謀廢立事執還殺之年四十九乾統間贈同中書門下平章事繪像宜福殿巖壽廉直面折廷諍多與乙辛忤故及於難耶律撒剌字董隱南院大王磨魯古之孫性忠直沉厚清寧初纍遷西南面招討使以治稱咸雍九年改北院大王未幾為契丹行宮都部署大康二年耶律乙辛為中京留守詔百官廷議欲復召之羣臣無敢正言撒剌獨奏曰蕭巖壽言乙辛有罪不可為樞臣故陛下出之今復召恐天下生疑進諫者三不納左右為之震悚乙辛復為樞密使見撒剌讓曰與君無憾何獨異議撒剌曰此社稷計何憾之有乙辛誣撒剌與速撒同謀廢立詔按無迹出為始平軍節度使及蕭訛都斡誣首竟遣使殺之乾統間追封漆水郡王繪像宜福殿仍追贈三子官爵蕭速撒字禿魯堇突呂不部人性沉毅重熙間纍遷右護衛太保蒲奴里叛從耶律義先往討執首亂陶得里以歸清寧中歷北面林牙彰國軍節度使入為北院樞密副使咸雍十年經略西南邊撤宋堡障戍以皮室軍上嘉之大康二年知北院樞密使事耶律乙辛權寵方盛附麗者多至通顯速撒未嘗造門乙辛銜之誣構速撒首謀廢立按之無驗出為上京留守乙辛復令蕭訛都斡以前事誣告上怒不復加訊遣使殺之時方盛暑尸諸原野容色不變烏鵲不敢近乾統間追封蘭陵郡王繪像宜福殿耶律撻不也字撒班系出季父房父高家仕至林牙重熙間破夏人于金肅軍有功優加賞賚撻不也清寧中補牌印郎君纍遷永興宮使九年平重元之亂以功知點檢司事賜平亂功臣為懷德軍節度使咸雍五年遷遙輦剋大康三年授北院宣徽使耶律乙辛謀害太子撻不也知其姦欲殺乙辛及蕭特里得蕭十三等乙辛知之令其黨誣構撻不也與廢立事殺之乾統間追封漆水郡王繪像宜福殿蕭撻不也字斡里端國舅郡王高九之孫性剛直咸雍中補祗候郎君大康元年為彰愍宮使尚趙國公主拜駙馬都尉三年改同知漢人行宮都部署與北院宣徽使耶律撻不也善乙辛嫉之令人誣告謀廢立事不勝搒掠誣伏上引問昏聵不能自陳遂見殺乾統間追封蘭陵郡王繪像宜福殿蕭忽古字阿斯憐性忠直趫捷有力甫冠補禁軍咸雍初從招討使耶律趙三討番部之違命者及請降來介有能躍駝峯而上者以儇捷相詫趙三問左右誰能此忽古被重鎧而出手不及峯一躍而上使者大駭趙三以女妻之帝聞召為護衛時北院樞密使耶律乙辛以狡佞得幸肆行凶暴忽古伏于橋下伺其過欲殺之俄以暴雨壞橋不果後又欲殺于獵所為親友所沮大康三年復欲殺乙辛及蕭得里特等乙辛知而械繫之考劾不服流于邊及太子廢徙于上京召忽古至殺之乾統初追贈龍虎衛上將軍耶律石柳字酬宛六院部人祖獨南院大王父安十統軍副使石柳性剛直有經世志始為牌印郎君大康初為夷離畢郎君時樞密使耶律乙辛誣殺皇后謀廢太子斥忠賢進姦黨石柳惡其所為乙辛覺之太子既廢以石柳附太子流鎮州天祚即位召為御史中丞時方治乙辛黨有司不以為意石柳上書曰臣前為姦臣所陷斥竄邊郡幸蒙召用不敢隱默恩賞明則賢者勸刑罰當則姦人消二者既舉天下不勞而治臣見耶律乙辛身出寒微位居樞要竊權肆惡不勝名狀蔽先帝之明誣陷順聖構害忠讜敗國罔上自古所無賴廟社之休陛下獲纂成業積年之寃一旦洗雪正陛下英斷克成孝道之秋如蕭得𩹉特實乙辛之黨耶律合魯亦不為早辨賴陛下之明遂正其事臣見陛下多疑故有司顧望不切推問乙辛在先帝朝權寵無比先帝若以順考為實則乙辛為功臣陛下豈得立耶先帝黜逐嬖后詔陛下在左右是亦悔前非也陛下詎可忘父讎不報寬逆黨不誅今靈骨未獲而求之不切傳曰聖人之德無加于孝昔唐德宗因亂失母思慕悲傷孝道益著周公誅飛廉惡來天下大悅今逆黨未除大寃不報上無以慰順考之靈下無以釋天下之憤怨氣上結水旱為沴臣願陛下下明詔求順考之瘞所盡收逆黨以正邦憲快四方忠義之心昭國家賞罰之用然後致治之道可得而舉矣謹別録順聖升遐及乙辛等事昧死以聞書奏不報聞者莫不歎惋乾統中遙授靜江軍節度使卒子馬哥同中書門下平章事論曰易言履霜堅冰至謹始也使道宗能從巖壽撒剌之諫后何得而誣太子何得而廢哉速撒撻不也以忠言見殺國欲無亂得乎石柳之書亦幸出於乙辛既敗之後獲行其説有國家者可不知人哉
