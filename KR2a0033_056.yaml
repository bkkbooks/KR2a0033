body:
  text: 遼史卷五十六志第二十五儀衞志二國服上古之人網罟禽獸食肉衣皮以儷鹿韋掩前後謂之鞸然後夏葛冬裘之製興焉周公陳王業七月之詩至於一日于貉三月條桑八月載績公私之用由是出矣契丹轉居薦草之間去邃古之風猶未遠也太祖仲父述瀾以遙輦氏于越之官占居潢河沃壤始置城邑為樹藝桑麻組織之教有遼王業之隆其亦肇迹於此乎太祖帝北方太宗制中國紫銀之鼠羅綺之篚麇載而至纖麗耎毳被土綢木於是定衣冠之制北班國制南班漢制各從其便焉詳國服以著厥始云祭服遼國以祭山為大禮服飾尤盛大祀皇帝服金文金冠白綾袍紅帶懸魚三山紅垂飾犀玉刀錯絡縫烏鞾小祀皇帝硬帽紅克絲龜文袍皇后戴紅帕服絡縫紅袍懸玉佩雙同心帕絡縫烏鞾臣僚命婦服飾各從本部旗幟之色朝服太祖丙寅歲即皇帝位朝服衷甲以備非常其後行瑟瑟禮大射柳即此服聖宗統和元年冊承天皇太后給三品以上用漢法服三品以下用大射柳之服皇帝服實里薛袞冠絡縫紅袍垂飾犀玉帶錯絡縫鞾謂之國服袞冕太宗更以錦袍金帶臣僚戴氈冠金花為飾或加珠玉翠毛額後垂金花織成夾帶中貯髮一總或紗冠制如烏紗帽無簷不擫雙耳額前綴金花上結紫帶末綴珠服紫窄袍繫鞢帶以黃紅色絛裹革為之用金玉水晶靛石綴飾謂之盤紫太宗更以錦袍金帶會同元年羣臣高年有爵秩者皆賜之公服謂之展裹著紫興宗重熙二十二年詔八房族巾幘道宗清寧元年詔非勳戚之後及夷離菫副使幷承應有職事人不帶巾皇帝紫皂幅巾紫窄袍玉束帶或衣紅襖臣僚亦幅巾紫衣常服宰相中謝儀帝常服高麗使入見儀臣僚便衣謂之盤裹綠花窄袍中單多紅綠色貴者披貂裘以紫黑色為貴青次之又有銀鼠尤潔白賤者貂毛羊鼠沙狐裘田獵服皇帝幅巾擐甲戎裝以貂鼠或鵝項鴨頭為扞腰蕃漢諸司使以上並戎裝衣皆左衽黑綠色弔服太祖叛弟剌哥等降素服受之素服乘赭白馬漢服黃帝始制冕冠章服後王以祀以祭以享夏收殷冔周弁以朝冠端以居所以別尊卑辨儀物也厥後唐以冕冠青衣為祭服通天絳袍為朝服平巾幘袍襴為常服大同元年正月朔太宗皇帝入晉備法駕受文武百官賀于汴京崇元殿自是日以為常是年北歸唐晉文物遼則用之左右采訂摭其常用者存諸篇祭服終遼之世郊丘不建大裘冕服不書袞冕祭祀宗廟遣上將出征飲至踐阼加元服納后若元日受朝則服之金飾垂白珠十二旒以組為纓色如其綬黈纊充耳玉簪導玄衣纁裳十二章八章在衣日月星龍華蟲火山宗彝四章在裳藻粉米黼黻衣褾領為升龍織成文各為六等龍山以下每章一行行十二白紗中單黼領青褾襈裾黻革帶大帶劍佩綬舄加金飾元日朝會儀皇帝服袞冕朝服乾亨五年聖宗冊承天太后給三品以上法服雜禮冊承天太后儀侍中就席解劍脫履重熙五年尊號冊禮皇帝服龍袞北南臣僚並朝服蓋遼制會同中太后北面臣僚國服皇帝南面臣僚漢服乾亨以後大禮雖北面三品以上亦用漢服重熙以後大禮並漢服矣常朝仍遵會同之制皇帝通天冠諸祭還及冬至朔日受朝臨軒拜王公元會冬會服之冠加金博山附蟬十二首施珠翠黑介幘髮纓翠緌玉若犀簪導絳紗袍白紗中單褾領朱襈裾白裙襦絳蔽膝白假帶方心曲領其革帶佩劍綬韈舄若未加元服則雙童髻空頂黑介幘雙玉導加寶飾元日上壽儀皇帝服通天冠絳紗袍皇太子遠遊冠謁廟還宮元日冬至朔日入朝服之三梁冠加金附蟬九首施珠翠黑介幘髮纓翠緌犀簪導絳紗袍白紗中單皂領褾襈裾白裙襦白假帶方心曲領絳紗蔽膝其革帶劍佩綬韈舄與上同後改用白韈黑舄未冠則雙童髻空頂黑介幘雙玉導加寶飾冊皇太子儀皇太子冠遠遊服絳紗袍親王遠遊冠陪祭朝饗拜表大事服之冠三梁加金附蟬黑介幘青緌導絳紗單衣白紗中單皂領襈裾白裙襦革帶鈎假帶曲領方心絳紗蔽膝韈舄劍佩綬二品以上同諸王遠遊冠三梁黑介幘青緌三品以上進賢冠三梁寶飾五品以上進賢冠二梁金飾九品以上進賢冠一梁無飾七品以上去劍佩綬八品以下同公服公服勘箭儀閤使公服繫履遼國嘗用公服矣皇帝翼善冠朔視朝用之柘黃袍九環帶白練裙襦六合鞾皇太子遠遊冠五日常朝元日冬至受朝服絳紗單衣白裙襦革帶金鈎假帶方心紛鞶囊白韈烏皮履一品以下五品以上冠幘纓簪導謁見東宮及餘公事服之絳紗單衣白裙襦帶鈎假帶方心韈履紛鞶囊六品以下冠幘纓簪導去紛鞶囊餘並同常服遼國謂之穿執起居禮臣僚穿執言穿鞾執笏也皇帝柘黃袍衫折上頭巾九環帶六合鞾起自宇文氏唐太宗貞觀已後非元日冬至受朝及大祭祀皆常服而已皇太子進德冠九琪金飾絳紗單衣白裙襦白韈烏皮履五品以上幞頭亦曰折上巾紫袍牙笏金玉帶文官佩手巾算袋刀子礪石金魚袋武官鞢七事佩刀刀子磨石契苾真噦厥針筒火石袋烏皮六合鞾六品以下幞頭緋衣木笏銀帶銀魚袋佩鞾同八品九品幞頭綠袍鍮石帶鞾同
