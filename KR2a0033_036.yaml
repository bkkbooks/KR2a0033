body:
  text: 遼史卷三十六志第六兵衞志下五京鄉丁遼建五京臨潢契丹故壤遼陽漢之遼東為渤海故國中京漢遼西地自唐以來契丹有之三京丁籍可紀者二十二萬六千一百蕃漢轉戶為多析津大同故漢地籍丁八十萬六千七百契丹本戶多隸宮帳部族其餘蕃漢戶丁分隸者皆不與焉太祖建皇都于臨潢府太宗定晉晉主石敬瑭來獻十六城乃定四京改皇都為上京有丁一十六萬七千二百臨潢府臨潢縣丁七千長泰縣丁八千保和縣丁六千定霸縣丁六千宣化縣丁四千潞縣丁六千易俗縣丁一千五百遷遼縣丁一千五百祖州長霸縣丁四千咸寧縣丁二千越王城丁二千懷州扶餘縣丁三千顯理縣丁二千慶州玄寧縣丁一萬二千泰州興國縣丁一千四百長春州長春縣丁四千烏州愛民縣丁二千永州長寧縣丁九千義豐縣丁三千慈仁縣丁八百儀坤州廣義縣丁五千龍化州龍化縣丁二千降聖州永安縣丁一千五百饒州長樂縣丁八千臨河縣丁二千安民縣丁二千頭下徽州丁二萬成州丁八千懿州丁八千渭州丁二千原州丁一千壕州丁一萬二千福州丁五百橫州丁四百鳳州丁一千遂州丁一千豐州丁一千順州丁二千閭州丁二千松山州丁一千豫州丁一千寧州丁六百東京本渤海以其地建南京遼陽府統縣六轄軍府州城二十六有丁四萬一千四百天顯十三年太宗改為東京遼陽府遼陽縣丁三千仙鄉縣丁三千鶴野縣丁二千四百析木縣丁二千紫蒙縣丁二千興遼縣丁二千開州開遠縣丁二千鹽州丁五百穆州丁五百賀州丁五百定州定東縣丁一千六百保州來遠縣丁二千辰州丁四千盧州丁五百鐵州丁二千興州丁三百湯州丁七百崇州丁一千海州丁三千耀州丁一千二百嬪州丁七百淥州丁四千桓州丁一千豐州丁五百正州丁七百慕州丁三百南京析津府統縣十一轄軍府州城九有丁五十六萬六千析津府析津縣丁四萬宛平縣丁四萬四千昌平縣丁一萬四千良鄉縣丁一萬四千潞縣丁一萬一千安次縣丁二萬四千武清縣丁二萬永清縣丁一萬香河縣丁一萬四千玉河縣丁二千漷陰縣丁一萬順州懷柔縣丁一萬檀州密雲縣丁一萬行唐縣丁六千涿州范陽縣丁二萬固安縣丁二萬新城縣丁二萬歸義縣丁八萬易州易縣丁五萬淶水縣丁五萬四千容城縣丁一萬薊州漁陽縣丁八千三河縣丁六千玉田縣丁六千平州盧龍縣丁一萬四千安喜縣丁一萬望都縣丁六千灤州義豐縣丁八千馬城縣丁六千石城縣丁六千營州廣寧縣丁六千景州遵化縣丁六千西京大同府統縣七轄軍府州城十七有丁三十二萬二千七百大同府大同縣丁二萬雲中縣丁二萬天成縣丁一萬長青縣丁八千奉義縣丁六千懷仁縣丁六千懷安縣丁六千弘州永寧縣丁二萬順聖縣丁六千德州宣德縣丁六千豐州富民縣丁二千四百振武縣鄉兵三百奉聖州永興縣丁一萬六千礬山縣丁六千龍門縣丁八千望雲縣丁二千歸化州文德縣丁二萬可汗州懷來縣丁六千儒州縉山縣丁一萬蔚州靈仙縣丁四萬定安縣丁二萬飛狐縣丁一萬靈丘縣丁六千廣陵縣丁六千應州金城縣丁一萬六千渾源縣丁一萬河陰縣丁六千朔州鄯陽縣丁八千寧遠縣丁四千馬邑縣丁六千金肅軍防秋兵一千武州神武縣丁一萬河清軍防秋兵一千聖宗統和二十三年城七金山建大定府號中京統縣九轄軍府州城二十三草創未定丁籍莫考可見者一縣高州三韓縣丁一萬大約五京民丁可見者一百一十萬七千三百為鄉兵屬國軍遼屬國可紀者五十有九朝貢無常有事則遣使徵兵或下詔專征不從者討之助軍衆寡各從其便無常額又有鐵不得國者興宗重熙十七年乞以兵助攻夏國詔不許吐谷渾鐵驪靺鞨兀惹黑車子室韋西奚東部奚烏馬山奚斜離底突厥党項小蕃沙陀阻卜烏古素昆那胡母思山蕃波斯大食甘州回鶻新羅烏孫燉煌賃烈要里回鶻轄戞斯吐蕃黃室韋小黃室韋大黃室韋阿薩蘭回鶻于闐師子北女直河西党項南京女直沙州燉煌曷蘇舘沙州回鶻查只底蒲盧毛𩽆蒲奴里大蕃高昌回拔頗里達里底拔思母敵烈粘八葛梅里急耶覩刮鼻骨德和州回鶻斡朗改高麗西夏女直遼之為國鄰於梁唐晉漢周宋晉以恩故始則父子一家終則寇讎相攻梁唐周隱然一敵國宋惟太宗征北漢遼不能救餘多敗衄縱得亦不償失良由石晉獻土中國失五關之固然也高麗小邦屢喪遼兵非以險阻足恃故歟西夏彈丸之地南敗宋東抗遼雖西北士馬雄勁元昊諒祚智勇過人能使党項阻卜掣肘大國蓋亦襟山帶河有以助其勢耳雖然宋久失地利而舊志言兵唯以敵宋為務踰三關聚議北京猶不敢輕進豈不以大河在前三鎮在後臨事好謀之審不容不然歟二帳十二宮一府五京有兵一百六十四萬二千八百宮丁大首領諸部族中京頭下等州屬國之衆皆不與焉不輕用之所以長世邊境戍兵又得高麗大遼事跡載東境戍兵以備高麗女直等國見其守國規模布置簡要舉一可知三邊矣東京至鴨淥西北峰為界黃龍府正兵五千咸州正兵一千東京沿女直界至鴨淥江軍堡凡七十各守軍二十人計正兵一千四百來遠城宣義軍營八太子營正兵三百大營正兵六百蒲州營正兵二百新營正兵五百加陀營正兵三百王海城正兵三百柳白營正兵四百沃野營正兵一千神虎軍城正兵一萬大康十年置右一府一州二城七十堡八營計正兵二萬二千
