body:
  text: 遼史卷六本紀第六穆宗上穆宗孝安敬正皇帝諱璟小字述律太宗皇帝長子母曰靖安皇后蕭氏會同二年封壽安王天祿五年秋九月癸亥世宗遇害逆臣察割等伏誅丁卯即皇帝位羣臣上尊號曰天順皇帝改元應曆戊辰如南京是月遣劉承訓告哀于漢冬十一月漢周南唐各遣使來弔乙亥詔朝會依嗣聖皇帝故事用漢禮十二月甲辰漢遣使獻弓矢鞍馬壬子鐵驪鼻骨德皆來貢二年春正月戊午朔南唐遣使奉蠟丸書及進犀兕甲萬屬壬戌太尉忽古質謀逆伏誅二月癸卯女直來貢三月癸亥南唐遣使奉蠟丸書丁卯復遣使來貢甲申以耶律撻烈為南院大王夏四月丙戌朔日有食之己亥鐵驪進鷹鶻五月丙辰朔視朝壬午南唐遣使來貢六月壬辰國舅政事令蕭眉古得宣政殿學士李澣等謀南奔事覺詔暴其罪乙未祭天地壬寅漢為周所侵遣使求援命中臺省右相高模翰赴之丁未命乳媼之兄曷魯世為阿速石烈夷離菫秋七月乙亥政事令婁國林牙敵烈侍中神都郎君海里等謀亂就執八月己丑眉古得婁國等伏誅杖李澣而釋之九月甲寅朔雲州進嘉禾四莖二穗戊午詔以先平察割日用白黑羊玄酒祭天歲以為常壬戌獵炭山祭天庚辰敵烈部來貢冬十月甲申朔漢遣使進葡萄酒甲午司徒老古等獻白雉戊申回鶻及轄戞斯皆遣使來貢十一月癸丑朔視朝己巳地震己卯日南至始用舊制行拜日禮朔州民進黑兔十二月癸未朔高模翰及兵圍晉州辛卯以生日飯僧釋繫囚甲辰獵于近郊祀天地辛亥明王安端薨三年春閏正月壬午朔漢以高模翰却周軍遣使來謝二月辛亥朔詔用嗣聖皇帝舊璽甲子太保敵烈修易州城鎮州以兵來挑戰却之三月庚辰朔南唐遣使來貢因附書于漢詔達之庚寅如應州擊鞠丁酉漢遣使進毬衣及馬庚子觀漁於神德湖夏四月庚申鐵驪來貢五月壬寅漢遣使言石晉樹先帝聖德神功碑為周人所毀請再刻許之六月丁卯應天皇太后崩秋七月不視朝八月壬子以生日釋囚己未漢遣使求援三河烏古吐蕃吐谷渾鼻骨德皆遣使來貢九月庚子漢遣使貢藥冬十月己酉命太師唐骨德治大行皇太后園陵李胡子宛郎君嵇幹敵烈謀反事覺辭逮太平王罨撒葛林牙華割郎君新羅等皆執之十一月辛丑諡皇太后曰貞烈葬祖陵漢遣使來會是冬駐蹕奉聖州以南京水詔免今歲租四年春正月戊寅回鶻來貢己丑華割嵇幹等伏誅宛及罨撒葛皆釋之是月周主威殂養子晉王柴榮嗣立二月丙午朔周攻漢命政事令耶律敵祿援之丙辰漢遣使進茶藥幸南京夏五月乙亥忻代二州叛漢遣南院大王撻烈助敵祿討之丁酉撻烈敗周將符彥卿於忻口六月癸亥撻烈獻所獲秋七月乙酉漢民有為遼軍誤掠者遣使來請詔悉歸之九月丙申漢為周人所侵遣使來告冬十一月彰國軍節度使蕭敵烈大保許從贇奏忻代二州捷十二月辛酉朔謁祖陵庚午漢遣使來貢是冬駐蹕杏堝五年春正月辛未朔鼻骨德來貢二月庚子朔日有食之庚申漢遣使請上尊號不許壬戌如褭潭夏四月己酉周侵漢漢遣使求援癸丑命郎君蕭海瓈世為北府宰相秋九月庚辰漢主有疾遣使來告冬十月壬申女直來貢丁亥謁太宗廟庚寅南唐遣使來貢十一月乙未朔漢主崇殂子承鈞遣使來告且求嗣立遣使弔祭遂封冊之十二月乙丑朔謁太祖廟辛巳漢遣使來議軍事六年夏五月丁酉謁懷陵六月甲子漢遣使來議軍事秋七月不視朝九月戊午謁祖陵冬十一月壬寅鼻骨德來貢十二月己未朔謁太祖廟七年春正月庚子鼻骨德來貢二月辛酉南唐遣使奉蠟丸書辛未駐蹕潢河夏四月戊午朔還上京初女巫肖古上延年藥方當用男子膽和之不數年殺人甚多至是覺其妄辛巳射殺之五月辛卯漢遣使來貢六月丙辰朔周遣使來聘南唐遣使來貢八月己未周遣使來聘是秋不聽政冬十月庚申獵于七鷹山十二月丁巳詔大臣曰有罪者法當刑朕或肆怒濫及無辜卿等切諫無或面從辛巳還上京八年春二月乙丑駐蹕潢河夏四月甲寅南京留守蕭思溫攻下沿邊州縣遣人勞之五月周陷束城縣六月辛未蕭思溫請益兵乞駕幸燕秋七月獵于拽剌山迄于九月射鹿諸山不視朝冬十一月辛酉漢遣使來告周復來侵乙丑使再至十二月庚辰又至九年春正月戊辰駐蹕潢河夏四月丙戌周來侵戊戌以南京留守蕭思溫為兵馬都總管擊之是月周拔益津瓦橋淤口三關五月乙巳朔陷瀛莫二州癸亥如南京辛未周兵退六月乙亥朔視朝戊寅復容城縣庚申西幸如懷州是月周主榮殂子宗訓立秋七月發南京軍戍范陽冬十二月戊寅還上京庚辰王子敵烈前宣徽使海思及蕭達干等謀反事覺鞫之辛巳祀天地祖考告逆黨事敗丙申召羣臣議時政十年春正月周殿前都點檢趙匡胤廢周自立建國號宋夏五月乙巳謁懷陵壬子漢以潞州歸附來告丙寅至自懷陵六月庚申漢以宋兵圍石州來告遣大同軍節度使阿剌率四部往援詔蕭思溫以三部兵助之秋七月己亥朔宋兵陷石州潞州復叛漢使來告辛酉政事令耶律壽遠太保楚阿不等謀反伏誅以酒脯祠天地于黑山八月如秋山幸懷州庚午以鎮茵石狻猊擊殺近侍古哥冬十月丙子李胡子喜隱謀反辭連李胡下獄死十一月海思獄中上書陳便宜十一年春二月丙寅釋喜隱辛亥司徒烏里只子迭剌哥誣告其父謀反復詐乘傳及殺行人以其父請杖而釋之三月丙辰蕭思溫奏老人星見乞行赦宥閏月甲子朔如潢河夏四月癸巳朔日有食之是月射鹿不視朝五月乙亥司天王白李正等進曆六月甲午赦冬十一月歲星犯月十二年春正月甲戌夜觀燈二月己丑朔以御史大夫蕭護思為北院樞密使賜對衣鞍馬夏五月庚午以旱命左右以水相沃頃之果雨六月甲午祠木葉山及潢河秋如黑山赤山射鹿十三年春正月自丁巳晝夜酣飲者九日丙寅宋欲城益津關命南京留守高勳統軍使崔廷勳以兵擾之癸酉殺獸人海里二月庚寅漢遣使來告欲巡邊徼乞張聲援壬辰如潢河癸巳觀羣臣射賜物有差乙巳老人星見三月癸丑朔殺鹿人彌里吉梟其首以示掌鹿者夏四月壬寅獵于潢河五月壬戌視斡朗改國所進花鹿生麛六月癸未近侍傷獐杖殺之甲申殺獐人霞馬壬辰詔諸路錄囚秋七月辛亥朔漢以宋侵來告乙丑薦時羞於廟八月甲申以生日縱五坊鷹鶻戊戌幸近山呼鹿射之旬有七日而後返九月庚戌朔以青牛白馬祭天地飲于野次終夕乃罷辛亥以酒脯祭天地復終夜酣飲冬十月丙申漢以宋侵來告十一月庚午獵飲于虞人之家凡四日十二月戊子射野鹿賜虞人物有差庚寅殺彘人曷主
