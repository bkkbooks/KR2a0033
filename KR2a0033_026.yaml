body:
  text: 遼史卷二十六本紀第二十六道宗六壽隆元年春正月己亥如混同江庚戌西南面招討司奏拔思母來侵蕭阿魯帶等擊破之乙卯振奉聖州貧民二月戊辰賜左右二皮室貧民錢癸酉高麗遣使來貢乙亥駐蹕魚兒濼三月丙午賜東北路貧民絹夏四月丁卯斡特剌奏討耶覩刮捷乙亥女直遣使來貢庚寅録西北路有功將士五月乙未朔左夷離畢耶律吐𩽆為惕隱南京宣徽使耶律特末為北院大王癸卯贈陳亡者官丁巳駐蹕特禮嶺六月己巳以知奚六部大王事回里不為本部大王權參知政事趙孝嚴為漢人行宮都部署圍場都管撒八以討阻卜功加鎮國大將軍癸巳阻卜長禿里底及圖木葛來貢秋七月庚子阻卜長猛達斯等來貢癸卯獵沙嶺癸丑頗里八部來附進方物甲寅斡特剌奏磨古斯捷九月甲寅祠木葉山丙辰詔西京炮人弩人教西北路漢軍冬十月甲子駐蹕藕絲淀甲戌以北面林牙耶律大悲奴為右夷離畢癸未以參知政事王師儒為樞密副使漢人行宮都部署趙孝嚴參知政事壬辰録討阻卜有功將士十一月丙申女直遣使進馬己亥以都統斡特剌為西北路招討使封漆水郡王甲辰夏國進貝多葉佛經庚申高麗王昱疾命其叔顒權知國事十二月癸亥朔以知北院樞密使事耶律阿思為北院樞密使是年放進士陳衡甫等百三十人二年春正月甲午如春水癸卯西南面招討司討拔思母破之乙卯駐蹕瑟尼思辛酉市牛給烏古敵烈隈烏古部貧民二月癸亥振達麻里別古部夏四月己卯振西北邊軍六月辛酉駐蹕撒里乃秋七月甲午阻卜來貢丙午獵赤山八月乙丑頗里八部進馬九月丙午徙烏古敵烈部于烏納水以扼北邊之衝冬十月戊辰駐蹕藕絲淀庚辰高麗遣使來貢十二月己未斡特剌討梅里急破之壬戌南府宰相耶律鐸魯斡致仕癸亥蕭撻不也為府宰相耶律大悲奴殿前都點檢乙亥夏國獻宋俘三年春正月丁亥如春水壬寅烏古部節度使耶律陳家奴以功加尚書右僕射癸卯駐蹕雙山二月丙辰朔南京水遣使振之閏月丙午阻卜長猛撒葛粘八葛長禿骨撒梅里急長忽魯八等請復舊地貢方物從之三月辛酉燕國王延禧生子癸亥賜名撻魯妃之父長哥遷左監門衛上將軍仍賜官屬錢是春高麗王昱薨夏四月南府宰相趙廷睦出知興中府事參知政事牛溫舒兼同知樞密院事五月癸亥斡特剌討阻卜破之己巳駐蹕撒里乃六月甲申詔罷諸路馳馹貢新丙戌詔每冬駐蹕之所宰相以下構宅毋役其民辛丑夏人來告宋城要地遣使之宋諭與夏和庚戌以契丹行宮都部署耶律吾也為南院大王秋七月壬子朔獵黑嶺八月己亥蒲盧毛𩽆部長率其民來歸乙巳彗星見西方九月壬申駐蹕藕絲淀丁丑以武定軍節度使梁援為漢人行宮都部署戊寅斡特刺奏討梅里急捷己卯五國部長來貢冬十月庚戌以西北路招討使斡特剌為南府宰相十一月乙卯蒲盧毛𩽆部來貢戊午以安車召醫巫閭山僧志達己未以中京留守韓資讓知樞密院事同知南院樞密使事蕭藥師奴知右夷離畢丁丑西北路統軍司奏討梅里急捷四年春正月壬子如魚兒濼己巳徙阻卜等貧民于山前辛未宋遣使來饋錦綺三月庚午幸春州丙子有司奏黃河清夏四月辛丑以雨罷獵五月癸酉那也奏北邊捷甲戌駐蹕撒里乃六月戊寅朔夏國為宋所攻遣使求援丁亥以遼興軍節度使涅里為惕隱前知惕隱事耶律郭三為南京統軍使甲午以參知政事牛溫舒兼知中京留守事秋七月戊午如黑嶺冬十月乙亥朔駐蹕藕絲淀己卯以南府宰相斡特剌兼契丹行宮都部署以傅導燕國王延禧十一月乙巳朔知右夷離畢事蕭藥師奴樞密直學士耶律儼使宋諷與夏和辛酉夏復遣使求援十二月壬辰為燕國王延禧行再生禮曲赦三百里內囚五年春正月乙巳如魚兒濼己酉詔夏國王李乾順伐拔思母等部夏五月壬戌藥師奴等使宋回奏宋罷兵癸亥謁乾陵戊辰以南府宰相斡特剌兼西北路招討使禁軍都統己巳駐蹕沿柳湖六月甲申以奚六部大王回離保為契丹行宮都部署知右夷離畢事蕭藥師奴南面林牙兼知契丹行宮都部署事乙未五國部長來朝戊戌阻卜來貢己亥以興聖宮使耶律郝家奴為右夷離畢秋七月壬寅朔惕德長禿的等來貢辛亥如大牢古山閏九月丙子駐蹕獨盧金冬十月己亥朔高麗王顒遣使乞封册丁巳斡特剌奏討耶覩刮捷丙寅以同知南京留守事蕭得里底知北院樞密使事丁卯宋遣郭知章曹平來聘戊辰振遼州飢仍免租賦一年十一月甲戌振南北二糾乙酉夏國以宋罷兵遣使來謝十二月甲子以參知政事趙孝嚴為漢人行宮都部署漢人行宮都部署梁援為遼興軍節度使六年春正月癸酉南院大王耶律吾也薨壬午以太師致仕禿開起為奚六部大王丁亥如春水辛卯斡特剌執磨古斯來獻丙申詔問民疾苦二月丁未以烏古部節度使陳家奴為南院大王己酉磔磨古斯于市癸丑出絹賜五院貧民辛酉宋遣使告宋主煦殂弟佶嗣位即日遣使弔祭三月甲申弛朔州山林之禁夏四月丁酉朔日有食之癸卯如炭山五月壬午烏古部討茶扎剌破之乙酉漢人行宮都部署趙孝嚴薨丙戌駐蹕納葛濼辛卯宋遣使饋先帝遺物乙未以東京留守何魯掃古為惕隱南院宣徽使蕭常哥為漢人行宮都部署六月庚子遣使賀宋主辛丑以有司案牘書宋帝嗣位為登寶位詔奪宰相鄭顓以下官出顓知興中府事韓資讓為崇義軍節度使御史中丞韓君義為廣順軍節度使癸丑阻卜長來貢戊午遣使決五京滯獄己未以遼興軍節度使梁援為樞密副使秋七月庚午如沙嶺壬申耶覩刮諸部寇西北路八月斡特剌以兵擊敗之使來獻捷九月癸未望祠木葉山戊子駐蹕藕絲淀冬十月壬寅以樞密副使王師儒監修國史癸卯五國諸部長來貢甲寅以平州飢復其租賦一年十一月壬申以天德軍民田世榮三世同居詔官之令一子三班院祗候丙子召醫巫閭山僧志達設壇於內殿戊子夏國王李乾順遣使請尚公主十二月乙未女直遣使來貢己亥以知右夷離畢事郝家奴為北面林牙辛亥詔燕國王延禧擬注大將軍以下官庚申鐵驪來貢宋遣使來謝帝不豫是歲封高麗王顒長子俁為三韓國公放進士康秉儉等八十七人七年春正月壬戌朔力疾御清風殿受百官及諸國使賀是夜白氣如練自天而降黑雲起于西北疾飛有聲北有青赤黑白氣相雜而落癸亥如混同江甲戌上崩于行宮年七十遺詔燕國王延禧嗣位六月庚子上尊諡仁聖大孝文皇帝廟號道宗贊曰道宗初即位求直言訪治道勸農興學救災恤患粲然可觀及夫謗訕之令既行告訐之賞日重羣邪並興讒巧競進賊及骨肉皇基寖危衆正淪胥諸部反側甲兵之用無寧歲矣一歲而飯僧三十六萬一日而祝髮三千徒勤小惠蔑計大本尚足與論治哉
