body:
  text: 遼史卷百十三列傳第四十三逆臣中蕭翰耶律牒蠟耶律朗耶律劉哥盆都耶律海思耶律敵獵蕭革蕭翰一名敵烈字寒真宰相敵魯之子天贊初唐兵圍鎮州節度使張文禮遣使告急翰受詔與康末怛往救克之殺其將李嗣昭拔石城會同初領漢軍侍衛八年伐晉敗晉將杜重威追至望都翰奏曰可令軍下馬而射帝從其言軍士步進敵人持短兵猝至我軍失利帝悔之曰此吾用言之過至此及從駕入汴為宣武軍節度使會帝崩欒城世宗即位翰聞之委事於李從敏徑趨行在是年秋世宗與皇太后相拒於潢河橫渡和議未定太后問翰曰汝何怨而叛對曰臣母無罪太后殺之以此不能無憾初耶律屋質以附太后被囚翰聞而快之即囚所謂曰汝嘗言我輩不及今在狴犴何也對曰第願公不至如此翰默然天祿二年尚帝妹阿不里後與天德謀反下獄復結惕隱劉哥及其弟盆都亂耶律石剌告屋質屋質遽入奏之翰等不伏帝不欲發其事屋質固諍以為不可乃詔屋質鞫按翰伏辜帝竟釋之復與公主以書結明王安端反屋質得其書以奏翰伏誅牒蠟字述蘭六院夷離堇蒲古只之後天顯中為中臺省右相會同元年與趙思溫持節冊晉帝及我師伐晉至滹沱河降晉將杜重威牒蠟功居多大同元年平相州之叛斬首數萬級世宗即位遣使馳報仍命牒蠟執偏將朮者以來其使誤入朮者營朮者得詔反誘牒蠟執送太后牒蠟亡歸世宗和約既成封燕王為南京留守天祿五年察割弒逆牒蠟方醉其妻扶入察割之幕因從之明旦壽安王討亂凡脅從者皆棄兵降牒蠟不降陵遲而死妻子皆誅朗字歐新季父房罨古只之孫性輕佻多力人呼為虎斯天顯間以材勇進每戰輒克由是得名會同九年太宗入汴命知澶淵控扼河渡天祿元年燕趙已南皆應劉知遠朗與汴守蕭翰棄城歸闕先是朗祖罨古只為其弟轄底詐取夷離堇自是族中無任六院職事者世宗不悉其事以朗為六院大王及察割作亂遣人報朗曰事成矣朗遣詳穩蕭胡里以所部軍往命曰當持兩端助其勝者穆宗即位伏誅籍其家屬劉哥字明隱太祖弟寅底石之子幼驕狠好陵侮人長益凶狡太宗惡之使守邊徼纍遷西南邊大詳穩會同十年叔父安端從帝伐晉以病先歸與劉哥鄰居世宗立於軍中安端議所往劉哥首建附世宗之策以本部兵助之時太后命皇太弟李胡率兵而南劉哥安端遇於泰德泉既接戰安端墜馬王子天德馳至欲以鎗刺之劉哥以身衛安端射天德貫甲不及膚安端得馬復戰太弟兵敗劉哥與安端朝于行在及和議成太后問劉哥曰汝何怨而叛對曰臣父無罪太后殺之以此怨耳事平以功為惕隱天祿中與其弟盆都王子天德侍衛蕭翰謀反耶律石剌發其事劉哥以飾辭免後請帝博欲因進酒弒逆帝覺之不果被囚一日召劉哥鎖項以博帝問汝實反耶劉哥誓曰臣若有反心必生千頂疽死遂貰之耶律屋質固諍以為罪在不赦上命屋質按之具服詔免死流烏古部果以千頂疽死弟盆都盆都殘忍多力膚若蛇皮天祿初以族屬為皮室詳穩二年與兄劉哥謀反免死使於轄戞斯國既還復預察割之亂陵遲而死異母弟二人化葛里奚蹇應曆初無職任以族子甚見優禮三年或告化葛里奚蹇與衛王宛謀逆下獄飾辭獲免四年春復謀反伏誅海思字鐸袞隋國王釋魯之庶子機警口辨會同五年詔求直言時海思年十八衣羊裘乘牛詣闕有司問曰汝何故來對曰應詔言事苟不以貧稚見遺亦可備直言之選有司以聞會帝將出獵使謂曰俟吾還則見之海思曰臣以陛下急於求賢是以來耳今反緩於獵請從此歸帝聞即召見賜坐問以治道命明王安端與耶律頗德試之數日安端等奏曰海思之材臣等所不及帝召海思問曰與汝言者何如人也對曰安端言無收檢若空車走峻坂頗德如著靴行曠野射鴇帝大笑擢宣徽使屢任以事帝知其貧以金器賜之海思即散于親友後從帝伐晉有功世宗即位於軍中皇太后以兵逆於潢河橫渡太后遣耶律屋質責世宗自立屋質至帝前諭旨不屈世宗遣海思對亦不遜且命之曰汝見屋質勿懼海思見太后還不稱旨既和領太后諸局事穆宗即位與冀王敵烈謀反死獄中敵獵字烏輦六院夷離堇朮不魯之子少多詐世宗即位為羣牧都林牙察割謀亂官僚多被囚繫及壽安王與耶律屋質率兵來討諸黨以次引去察割度事不成即詣囚所持弓矢脅曰悉殺此曹敵獵進曰殺何益於事竊料屋質將立壽安王故為此舉且壽安未必知若遣人藉此為辭庶可免察割曰如公言誰可使者敵獵曰大王若不疑敵獵請與罨撒葛同往說之察割遣之壽安王用敵獵計誘殺察割凡被脅之人無一被害者皆敵獵之力亂既平帝嘉賞然未顯用敵獵失望居常怏怏結羣不逞陰懷不軌應曆二年與其黨謀立婁國事覺陵遲死蕭革小字滑哥字胡突堇國舅房林牙和尚之子警悟多智數太平初纍遷官職游近習間以諛悅相比昵為流輩所稱由是名達於上重熙初拜北面林牙十二年為北院樞密副使帝嘗與近臣宴謂革曰朕知卿才故自拔擢卿宜勉力革曰臣不才誤蒙聖知無以報萬一惟竭愚忠安敢怠明年拜北府宰相十五年改同知北院樞密事革怙寵專權同僚具位而已時夷離畢耶律義先知革姦佞因侍燕言革所短用之將敗事帝不聽一日上令義先對革巡擲義先酒酣曰臣備位大臣縱不能進忠去佞安能與賊博乎革銜之佯言曰公相謔不既甚乎義先詬詈不已帝怒皇后解之曰義先酒狂醒可治也翌日上詔革謂曰義先無禮可痛繩之革曰義先之才豈逃聖鑒然天下皆知忠直今以酒過為罪恐咈人望帝以革犯而不校眷遇益厚其矯情媚上多此類拜南院樞密使詔班諸王上封吳王改知北院進王鄭兼中書令帝大漸詔革曰大位不可一日曠朕若弗寤宜即令燕趙國王嗣位清寧元年復為南院樞密使更王楚復徙北院與國舅蕭阿剌同掌朝政革多私撓阿剌每裁正之由是有隙出阿剌為東京留守會南郊阿剌以例赴闕帝訪羣臣以時務阿剌陳利病言甚激切革伺帝意不悅因譖曰阿剌恃寵有慢上心非臣子禮帝大怒縊阿剌于殿下後上知革姦計寵遇漸衰八年致仕封鄭國王九年秋革以其子為重元壻革預其謀陵遲殺之
