body:
  text: 遼史卷六十七表第五外戚表漢外戚有新室之患晉宗室有八王之難遼史耶律蕭氏十居八九宗室外戚勢分力敵相為唇齒以翰邦家是或一道然以是而興亦以是而亡又其法之弊也契丹外戚其先曰二審密氏曰拔里曰乙室已至遼太祖娶述律氏述律本回鶻糯思之後大同元年太宗自汴將還留外戚小漢為汴州節度使賜姓名曰蕭翰以從中國之俗由是拔里乙室已述律三族皆為蕭姓拔里二房曰大父少父乙室已亦二房曰大翁小翁世宗以舅氏塔列葛為國舅別部三族世預北宰相之選自太祖神册二年命阿骨只始也聖宗合拔里乙室已二國舅帳為一與別部為二此遼外戚之始末也作外戚表
