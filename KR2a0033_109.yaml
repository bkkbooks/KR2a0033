body:
  text: 遼史卷一百九列傳第三十九伶官羅衣輕伶官之微者也五代史列鏡新磨於傳是必有所取矣遼之伶官當時固多然能因詼諧示諫以消未形之亂惟羅衣輕耳孔子曰君子不以人廢言是宜傳羅衣輕不知其鄉里滑稽通變一時諧謔多所規諷興宗敗於李元昊也單騎突出幾不得脫先是元昊獲遼人輒劓其鼻有奔北者惟恐追及故羅衣輕止之曰且觀鼻在否上怒以毳索繫帳後將殺之太子笑曰打諢底不是黃幡綽羅衣輕應聲曰行兵底亦不是唐太宗上聞而釋之上嘗與太弟重元狎昵宴酣許以千秋萬歲後傳位重元喜甚驕縱不法又因雙陸賭以居民城邑帝屢不競前後已償數城重元既恃梁孝王之寵又多鄭叔段之過朝臣無敢言者道路以目一日復博羅衣輕指其局曰雙陸休癡和你都輸去也帝始悟不復戲清寧間以疾卒宦官王繼恩趙安仁周禮寺人掌中門之禁至巷伯詩列于雅勃貂功著于晉雖忠於所事而非其職矣漢唐中世竊權蠹政有不忍言者是皆寵遇之過遼宦者二人其賢不肖皆可為後世鑑故傳焉王繼恩棣州人睿智皇后南征繼恩被俘初皇后以公私所獲十歲已下兒容貌可觀者近百人載赴涼陘並使閹為豎繼恩在焉聰慧通書及遼語擢內謁者內侍左廂押班聖宗親政纍遷尚衣庫使左承宣監門衛大將軍靈州觀察使內庫都提點繼恩好清談不喜權利每得賜賚市書至萬卷載以自隨誦讀不倦每宋使來聘繼恩多充宣賜使後不知所終趙安仁字小喜深州樂壽人自幼被俘統和中為黃門令秦晉國王府祗候王薨授內侍省押班御院通進開泰八年與李勝哥謀奔南土為遊兵所擒初仁德皇后與欽哀有隙欽哀密令安仁伺皇后動靜無不知者仁德皇后威權既重安仁懼禍復謀亡歸仁德欲誅之欽哀以言營救聖宗曰小喜言父母兄弟俱在南朝每一念神魂隕越今為思親冒死而亡亦孝子用心實可憐憫赦之重熙初欽哀攝政欲廢帝立少子重元帝與安仁謀遷太后慶州守陵授安仁左承宣監門衛大將軍充契丹漢人渤海內侍都知兼都提點會上思太后親馭奉迎太后責曰汝負萬死我嘗營救不望汝報何為離間我母子耶安仁無答後不知所終論曰名器所以礪天下非賢而有功則不可授況宦者乎繼恩為內謁者安仁為黃門令似矣何至溺於私愛而授以觀察使大將軍耶易曰負且乘致寇至此安仁所以不克有終繼恩幸而免歟
