body:
  text: 遼史卷七本紀第七穆宗下十四年春正月戊寅朔奉安神纛戊戌漢以宋將來襲馳告二月壬子詔西南面招討使撻烈進兵援漢癸亥如潢河戊辰支解鹿人沒答海里等七人于野封土識其地己巳如老林東濼壬申漢以敗宋兵石州來告夏四月丁巳漢以擊退宋軍遣使來謝是月黃龍府甘露降五月射舐鹿于白鷹山至于浹旬六月丙午朔獵于玉山竟月忘返秋七月壬辰以酒脯祀黑山八月乙巳如磑子嶺呼鹿射之獲鹿四賜虞人女瓌等物有差丁未還宮戊申以生日值天赦不受賀曲赦京師囚乙卯録囚九月黃室韋叛冬十月丙午近侍烏古者進石錯賜白金二百五十兩丙辰以掌鹿矧思代斡里為閘撒狘賜金帶金盞銀二百兩所隸死罪以下得專之十一月壬午日南至宴飲達旦自是晝寢夜飲殺近侍小六於禁中十二月丙午以黑兔祭神烏古叛掠民財畜詳穩僧隱與戰敗績僧隱及乙實等死之十五年春正月己卯以樞密使雅里斯為行軍都統虎軍詳穩楚思為行軍都監益以突呂不部軍三百合諸部兵討之烏古夷離堇子勃勒底獨不叛詔褒之是月老人星見二月壬寅朔日有食之上東幸甲寅以獲鴨除鷹坊刺面腰斬之刑復其徭役是月烏古殺其長窣離底餘衆降復叛三月癸酉近侍東兒進匕筯不時手刃刺之丁丑大黃室韋酋長寅尼吉叛癸未五坊人四十戶叛入烏古癸巳虞人沙剌迭偵鵝失期加炮烙鐵梳之刑而死夏四月乙巳小黃室韋叛雅里斯楚思等擊之為室韋所敗遣使詰之乙卯以禿里代雅里斯為都統以女古為監軍率輕騎進討仍令撻馬尋吉里持詔招諭五月壬申尋吉里奏諭之不從雅里斯以撻凜蘇二羣牧兵追至柴河與戰不利甲申庫古只奏室韋長寅尼吉亡入敵烈六月辛亥俞魯古獻良馬賜銀二千兩以近侍忽剌比馬至先以聞賜銀千兩是月敵烈來降秋七月甲戌雅里斯奏烏古至河德濼遣夷離堇畫里夷離畢常思擊之丁丑烏古掠上京北榆林峪居民遣林牙蕭幹討之庚辰雅里斯等與烏古戰不利冬十月丁未常思與烏古戰敗之十二月甲辰以近侍喜哥私歸殺其妻丁未殺近侍隨魯駐蹕黑山平淀十六年春正月丁卯朔被酒不受賀甲申微行市中賜酒家銀絹乙酉殺近侍白海及家僕衫福押剌葛樞密使門吏老古撻馬失魯三月己巳東幸庚午獲鴨甲申獲鵝皆飲達旦五月甲申以歲旱泛舟于池禱雨不雨捨舟立水中而禱俄頃乃雨六月丙申以白海死非其罪賜其家銀絹秋七月壬午諭有司凡行幸之所必高立標識令民勿犯違以死論八月丁酉漢遣使貢金器鎧甲閏月乙丑觀野鹿入馴鹿羣立馬飲至晡九月庚子以重九宴飲夜以繼日至壬子乃罷己未殺狼人裊里冬十月庚辰漢主有母喪遣使賻弔十二月甲子幸酒人拔剌哥家復幸殿前都點檢耶律夷臘葛第宴飲連日賜金盂細錦及孕馬百匹左右授官者甚衆戊辰漢遣使來貢是冬駐蹕黑山平淀十七年春正月庚寅朔林牙蕭幹郎君耶律賢適討烏古還帝執其手賜卮酒授賢適右皮室詳穩雅里斯楚思霞里三人賜醨酒以辱之乙卯夷離畢骨欲獻烏古俘二月甲子高勳奏宋將城益津關請以偏師擾之上從之夏四月戊辰殺鷹人敵魯丙子射柳祈雨復以水沃羣臣五月辛卯殺鹿人札葛壬辰北府宰相蕭海璃薨輟朝罷重五宴六月己未支解雉人壽哥念古殺鹿人四十四人是夏駐蹕裊潭秋八月辛酉生日以政事令阿不底病亟不受賀九月自丙戌朔獵于黑山赤山至于月終冬十月乙丑殺酒人粹你十一月辛卯殺近侍廷壽壬辰殺豕人阿不札曷魯朮里者涅里括庚子司天臺奏月當食不虧上以為祥歡飲達旦壬寅殺鹿人唐果直哥撒剌十二月辛未手殺饔人海里復臠之是冬駐蹕黑河平淀十八年春正月乙酉朔宴于宮中不受賀己亥觀燈于市以銀百兩市酒命羣臣亦市酒縱飲三夕二月乙卯幸五坊使霞實里家宴飲達旦三月甲申朔如潢河乙酉獲鴐鵝祭天地造大酒器刻為鹿文名曰鹿甒貯酒以祭天庚戌殺鶻人胡特魯近侍化葛及監囚海里仍銼海里之尸夏四月癸丑朔殺彘人抄里只己巳詔左右從班有材器幹局者不次擢用老耄者增俸以休于家五月丁亥重五以被酒不受賀壬辰獲鵝于述古水野飲終夜丁酉與政事令蕭排押南京留守高勳太師昭古劉承訓等酣飲連日夜己亥殺鹿人頗德臘哥陶瑰札不哥蘇古涅雛保彌古特敵答等六月丙辰殺彘人屯奴己未為殿前都點檢夷臘葛置神帳曲赦京畿囚甲戌撻烈於雕窠中得牝犬來進是夏清暑裊潭秋七月辛丑漢主承鈞殂子繼元立來告遣使弔祭九月戊子殺詳穩八剌拽剌痕篤等四人己丑登小山祭天地戊戌知宋欲襲河東諭西南面都統南院大王撻烈豫為之備己亥獵熊以喚鹿人鋪姑並掖庭戶賜夷臘葛甲辰以夷臘葛兼政事令仍以黑山東抹真之地數十里賜之以女瓌為近侍女直詳穩戞陌為本部夷離堇是秋獵于西京諸山冬十月辛亥朔宋圍太原詔撻烈為兵馬總管發諸道兵救之十一月癸卯冬至被酒不受賀十二月丁丑殺酒人搭烈葛是冬駐蹕黑山東川十九年春正月己卯朔宴宮中不受賀己丑立春被酒命殿前都點檢夷臘葛代行擊土牛禮甲午與羣臣為葉格戲戊戌醉中驟加左右官乙巳詔太尉化哥曰朕醉中處事有乖無得曲從酒解可覆奏自立春飲至月終不聽政二月甲寅漢劉繼元嗣立遣使乞封册辛酉遣韓知範册為皇帝癸亥殺前導末及益剌銼其尸棄之甲子漢遣使進白麃己巳如懷州獵獲熊歡飲方醉馳還行宮是夜近侍小哥盥人花哥庖人辛古等六人反帝遇弒年三十九廟號穆宗後附葬懷陵重熙二十一年諡曰孝安敬正皇帝贊曰穆宗在位十八年知女巫妖妄見誅諭臣下濫刑切諫非不明也而荒耽于酒畋獵無厭偵鵝失期加炮烙鐵梳之刑獲鴨甚歡除鷹坊刺面之令賞罰無章朝政不視而嗜殺不已變起肘腋宜哉
