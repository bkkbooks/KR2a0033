body:
  text: 遼史卷五十七志第二十六儀衛志三符印遙輦氏之世受印于回鶻至耶瀾可汗請印於唐武宗始賜奉國契丹印太祖神冊元年梁幽州刺史來歸詔賜印綬是時太祖受位遙輦十年矣會同九年太宗伐晉末帝表上傳國寶一金印三天子符瑞於是歸遼傳國寶秦始皇作用藍玉螭紐六面其正面文受命于天既壽永昌魚鳥篆子嬰以上漢高祖王莽篡漢平皇后投璽殿階螭角微玷獻帝失之孫堅得于井中傳至孫權以歸于魏魏文帝隸刻肩際曰大魏受漢傳國之寶唐更名受命寶晉亡歸遼自三國以來僭僞諸國往往模擬私製歷代府庫所藏不一莫辨真僞聖宗開泰十年馳驛取石晉所上玉璽于中京興宗重熙七年以有傳國寶者為正統賦試進士天祚保大二年遺傳國璽于桑乾河玉印太宗破晉北歸得于汴宮藏隨駕庫穆宗應曆二年詔用太宗舊寶御前寶金鑄文曰御前之寶以印臣僚宣命詔書寶文曰書詔之寶凡書詔批答用之契丹寶受契丹冊儀符寶郎捧寶置御坐東金印三晉帝所上其文未詳皇太后寶制未詳天顯二年應天皇太后稱制羣臣上璽綬冊承天皇太后儀符寶郎奉寶置皇太后坐右皇后印文曰皇后教印皇太子寶未詳其制重熙九年冊皇太子儀中書令授皇太子寶印吏部印文曰吏部之印銀鑄以印文官制誥兵部印文曰兵部之印銀鑄以印軍職制誥契丹樞密院契丹諸行軍部署漢人樞密院中書省漢人諸行宮都部署印並銀鑄文不過六字以上以銀朱為色南北王以下內外百司印並銅鑄以黃丹為色諸稅務以赤石為色杓窊印杓窊鷙鳥之總名以為印紐取疾速之義行軍詔賜將帥用之道宗賜耶律仁先鷹紐印即此符契自大賀氏八部用兵則合契而動不過刻木為牉合太祖受命易以金魚金魚符七枚黃金鑄長六寸各有字號每魚左右判合之有事以左半先授守將使者執右半大小長短字號合同然後發兵事訖歸于內府銀牌二百面長尺刻以國字文曰宜速又曰敕走馬牌國有重事皇帝以牌親授使者手劄給驛馬若干驛馬闕取它馬代法晝夜馳七百里其次五百里所至如天子親臨須索更易無敢違者使回皇帝親受之手封牌印郎君收掌木契正面為陽背面為陰閣門喚仗則用之朝賀之禮宣徽使請陽面木契下殿至于殿門以契授西上閣門使云授契行勘勘契官聲喏跪受契舉手勘契同俯興鞠躬奏內外勘契同閣門使云准敕勘契行勘勘契官執陰面木契聲喏平身立少退近後引聲云軍將門仗官齊聲喏勘契官云內出喚仗木契一隻准敕付左右金吾仗行勘勘契官云合不合門仗官云合凡再勘契官云同不同門仗官云同亦再勘契官近前鞠躬奏勘官左金吾引駕仗勾畫都知某官某對御勘同平身少退近後右手舉契云其契謹付閣門使進入閣門使引聲喏門仗官下聲喏勘契官跪以契授閣門使上殿納契宣徽使受契閣門使下殿奉敕喚仗木箭內箭為雄外箭為雌皇帝行幸則用之還宮勘箭官執雌箭東上閣門使執雄箭如勘契之儀詳具禮儀志
