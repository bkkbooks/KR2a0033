body:
  text: 遼史卷四十一志第十一地理志五西京道西京大同府陶唐冀州之域虞分並州夏復屬冀州周職方正北曰並州戰國屬趙武靈王始置雲中郡秦屬代王國後為平城縣魏屬新興郡晉仍屬雁門劉琨表封猗盧為代王都平城元魏道武於此遂建都邑孝文帝改為司州牧置代尹遷都洛邑改萬年又置怛州高齊文宣帝廢州為安鎮今謂之東城尋復州周復安鎮改朔州隋仍為鎮唐武德四年置北州七年廢貞觀十四年移雲中定襄縣於此永淳元年默啜為民患移民朔州開元十八年置雲州天寶元年改雲中郡乾元元年曰雲州乾符三年大同軍節度使李國昌子克用為雲中守捉使殺防禦使據州以聞僖宗赦克用以國昌為大同軍防禦使不受命廣明元年李琢攻國昌國昌兵敗與克用奔北地黃巢入京師詔發代北軍尋赦國昌使討賊克用率三萬五千騎而南收京師功第一國昌封隴西郡王國昌卒克用取雲州既而所向失利乃卑詞厚禮與太祖會于雲州之東城謀大舉兵攻梁不果克用子存勗滅梁是為唐莊宗同光三年復以雲州為大同軍節度使晉高祖代唐以契丹有援立功割山前代北地為賂大同來屬因建西京敵樓棚櫓具廣袤二十里門東曰迎春南曰朝陽西曰定西北曰拱極元魏宮垣占城之北面雙闕尚在遼既建都用為重地非親王不得主之清寧八年建華嚴寺奉安諸帝石像銅像又有天王寺留守司衙南曰西省北門之東曰大同府北門之西曰大同驛初為大同軍節度重熙十三年升為西京府曰大同統州二縣七大同縣本大同川地重熙十七年西夏犯邊析雲中縣置戶一萬雲中縣趙置沿革與京府同戶一萬天成縣本極塞之地魏道武帝置廣牧縣唐武德五年置定襄縣遼析雲中置在京北一百八十里戶五千長青縣本白登臺地冒頓單于縱精騎三十餘萬圍漢高帝於白登七日即此遼始置縣有青陂梁元帝橫吹曲云朝跋青陂暮上白登在京東北一百一十里戶四千奉義縣本漢陶林縣地後唐武皇與太祖會此遼析雲中置戶三千懷仁縣本漢沙南縣元魏葛榮亂縣廢隋開皇二年移雲內于此大業二年置大利縣屬雲州改屬定襄郡隋末陷突厥李克用敗赫連鐸駐兵於此遼改懷仁在京南六十里戶三千懷安縣本漢夷輿縣地歷魏至隋為突厥所據唐克頡利縣遂廢為懷荒鎮高勳鎮燕奏分歸化州文德縣置初隸奉聖州後來屬在州西北二百八十里戶三千弘州博寧軍下刺史東魏靜帝置北靈丘縣唐初地陷突厥開元中置橫野軍安邊縣天寶亂廢後為襄陰村統和中以寰州近邊為宋將潘美所破廢之乃於此置弘州初軍曰永寧有桑乾河白道泉白登山亦曰火燒山有火井統縣二永寧縣戶一萬順聖縣本魏安塞軍五代兵廢高勳鎮幽州奏景宗分永興縣置初隸奉聖州在州西北二百八十里戶三千德州下刺史唐會昌中以西德店置德州開泰八年以漢戶復置有步落泉金河山野狐嶺白道坂縣一宣德縣本漢桐過縣地屬雲中郡後隸定襄郡漢末廢高齊置紫阿鎮唐會昌中置縣戶三千豐州天德軍節度使秦為上郡北境漢屬五原郡地磧鹵少田疇自晉永嘉之亂屬赫連勃勃後周置永豐鎮隋開皇中升永豐縣改豐州大業七年為五原郡義寧元年太守張遜奏改歸順郡唐武德元年為豐州總管府六年省遷民於白馬縣遂廢貞觀四年分靈州境置豐州都督府領蕃戶天寶初改九原郡乾元元年復豐州後入回鶻會昌中克之後唐改天德軍太祖神冊五年攻下更名應天軍復為州有大鹽濼九十九泉沒越濼古磧口青冢即王昭君墓兵事屬西南面招討司統縣二富民縣本漢臨戎縣遼改今名戶一千二百振武縣本漢定襄郡盛樂縣背負陰山前帶黃河元魏嘗都盛樂即此唐武德四年克突厥建雲中都督府麟德三年改單于大都督府聖曆元年又改安北都督開元七年割隸東受降城八年置振武軍節度使會昌五年為安北都護府後唐莊宗以兄嗣本為振武節度使太祖神冊元年伐吐渾還攻之盡俘其民以東唯存鄉兵三百人防戍後更為縣雲內州開遠軍下節度本中受降城地遼初置代北雲朔招討司改雲內州清寧初升有威塞軍古可敦城大同川天安軍永濟柵安樂戍拂雲堆兵事屬西南面招討司統縣二柔服縣寧人縣天德軍本中受降城唐開元中廢橫塞軍置天安軍於大同川乾元中改天德軍移永濟柵今治是也太祖平党項遂破天德盡掠吏民以東後置招討司漸成井邑乃以國族為天德軍節度使有黃河黑山峪廬城威塞軍秦長城唐長城又有牟那山鉗耳觜城在其北寧邊州鎮西軍下刺史本唐隆鎮遼置兵事屬西南面招討司奉聖州武定軍上節度本唐新州後唐置團練使總山後八軍莊宗以弟存矩為之軍亂殺存矩于祁州擁大將盧文進亡歸太祖克新州莊宗遣李嗣源復取之同光二年升威塞軍石晉高祖割獻太宗改升有兩河會溫泉龍門山涿鹿山東南至南京三百里西北至西京四百四十里兵事屬西京都部署司統州三縣四永興縣本漢涿鹿縣地黃帝與蚩尤戰于此戶八千礬山縣本漢軍都縣山出白緑礬故名有礬山桑乾河在州南六十里戶三千龍門縣有龍門山石壁對峙高數百尺望之若門徼外諸河及沙漠潦水皆於此趣海雨則俄頃水踰十仞晴則清淺可涉實塞北控扼之衝要也在州東北二百八十里戶四千望雲縣本望雲川地景宗於此建潛邸因而成井肆穆宗崩景宗入紹國統號御莊後置望雲縣直隸彰愍宮附庸于此在州東北二百六十里戶一千歸化州雄武軍上刺史本漢下洛縣元魏改文德縣唐升武州僖宗改毅州後唐太祖復武州明宗又為毅州潞王仍為武州晉高祖割獻于遼改今名有桑乾河會河川愛陽川炭山又謂之陘頭有涼殿承天皇后納涼於此山東北三十里有新涼殿景宗納涼於此唯松棚數陘而已斷雲嶺極高峻故名州西北至西京四百五十里統縣一文德縣本漢女祁縣地元魏置戶一萬可汗州清平軍下刺史本漢潘縣元魏廢北齊置北燕郡改懷戎縣隋廢郡屬涿郡唐武德中復置北燕州縣仍舊貞觀八年改媯州五代時奚王去諸以數千帳徙媯州自別為西奚號可汗州太祖因之有媯泉在城中相傳舜嬪二女於此又有溫泉版泉磨笄山雞鳴山喬山歷山統縣一懷來縣本懷戎縣太祖改戶三千儒州縉陽軍中刺史唐置後唐同光二年隸新州太宗改奉聖州仍屬有南溪河沽河宋王峪桃峪口統縣一縉山縣本漢廣宀心縣地唐天寶中割媯川縣置戶五千蔚州忠順軍上節度周職方並州川曰漚夷在州境飛狐縣趙襄子滅代武靈王置代郡項羽徙趙歇為代王歇還趙立陳餘王代漢韓信斬餘復置代郡文帝初封代皆此地周宣帝始置蔚州隋開皇中廢唐武德四年復置至德二年改興唐縣乾元元年仍舊大中後朱邪執宜為刺史有功賜姓名李國昌子克用乞為留後僖宗不許廣明初攻敗國昌代北無備太祖來攻克之俘掠居民而去石晉獻地升忠順軍後更武安軍統和四年入宋尋復之降刺史隸奉聖州升觀察復忠順軍節度兵事屬西京都部署司統縣五靈仙縣唐置興唐縣梁改隆化縣後唐同光初復置晉改今名戶二萬定安縣本漢東安陽縣地久廢後唐太祖伐劉仁恭次蔚州晨霧晦冥占不利深入會雷電大作燕軍解去即此遼置定安縣西北至州六十里戶一萬飛狐縣後周大象二年置廣昌縣于五龍城即此隋仁壽元年改名飛狐相傳有狐於紫荊嶺食五粒松子成飛仙故云西北至州一百四十里戶五千靈丘縣漢置後漢省東魏復置屬靈丘郡隋開皇中罷郡來屬大業初改隸代州唐武德六年仍舊東北至州一百八十里戶三千廣陵縣本漢延陵縣隋唐為鎮州後唐同光初分興唐縣置石晉割屬遼東南至州四十里戶三千應州彰國軍上節度唐武德中置金城縣後改應州後唐明宗州人也天成元年升彰國軍節度興唐軍寰州隸焉遼因之北龍首山南雁門兵事屬西京都部署司統縣三金城縣本漢陰館縣地漢末廢為陰館城隋大業末陷突厥唐始置金城縣遼因之戶八千渾源縣唐置有渾源川在州東南一百五十里戶五千河陰縣本漢陰館縣地初隸朔州清寧中來屬戶三千朔州順義軍下節度本漢馬邑縣地元魏孝文帝始置朔州在今州北三百八十里定襄故城葛榮亂廢高齊天保六年復置在今州南四十七里新城八年徙馬邑即今城武成帝置北道行臺周武帝置朔州總管府隋大業三年改馬邑郡唐武德四年復朔州遼升順義軍節度兵事屬西京都部署司統州一縣三鄯陽縣本漢定襄縣地建安中置新興郡元魏置桑乾郡高齊置招遠縣郡仍舊隋開皇三年罷郡隸朔州大業元年初名鄯陽縣遼因之戶四千寧遠縣齊天保六年於朔州西置招遠縣唐乾元元年改今名遼因之有寧遠鎮東至朔州八十里戶二千馬邑縣漢置屬雁門郡唐開元五年析鄯陽縣東三十里置大同軍倚郭置馬邑縣南至朔州四十里戶三千武州宣威軍下刺史趙惠王置武川塞魏置神武縣唐末置武州後唐改毅州重熙九年復武州號宣威軍統縣一神武縣魏置晉改新城後唐太祖生神武川之新城即此初隸朔州後置州併寧遠為一縣來屬戶五千東勝州武興軍下刺史隋開皇七年置勝州大業五年改榆林郡唐貞觀五年於南河地置决勝州故謂此為東勝州天寶七年又為榆林郡乾元元年復為勝州太祖神冊元年破振武軍勝州之民皆趨河東州廢晉割代北來獻復置兵事屬西南面招討司統縣二榆林縣河濱縣金肅州重熙十二年伐西夏置割燕民三百戶防秋軍一千實之屬西南面招討司河清軍西夏歸遼開直路以趨上京重熙十二年建城號河清軍徙民五百戶防秋兵一千人實之屬西南面招討司
