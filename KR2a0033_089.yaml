body:
  text: 遼史卷八十九列傳第十九耶律庶成庶針蒲魯楊耶律韓留楊佶耶律和尚耶律庶成字喜隱小字陳六季父房之後父吳九檢校太師庶成幼好學書過目不忘善遼漢文字於詩尤工重熙初補牌印郎君纍遷樞密直學士與蕭韓家奴各進四時逸樂賦帝嗟賞初契丹醫人鮮知切脈審藥上命庶成譯方脈書行之自是人皆通習雖諸部族亦知醫事時入禁中參決疑議偕林牙蕭韓家奴等撰實録及禮書與樞密副使蕭德修定法令上詔庶成曰方今法令輕重不倫法令者為政所先人命所繫不可不慎卿其審度輕重從宜修定庶成參酌古今刊正訛謬成書以進帝覽而善之庶成方進用為妻胡篤所誣以罪奪官絀為庶耶律使吐蕃凡十二年清寧間始歸帝知其誣詔復本族仍遷所奪官卒庶成嘗為林牙夢善卜者胡呂古卜曰官止林牙因妻得罪及置於理法當離婚胡篤適有娠至期不産而死剖視之其子以手抱心識者謂誣夫之報有詩文行于世弟庶針庶針字陳甫善屬文重熙中為本族將軍咸雍元年同知東京留守事俄徙烏衍突厥部節度使九年知薊州事明年遷都林牙上表乞廣本國姓氏曰我朝創業以來法制修明惟姓氏止分為二耶律與蕭而已始太祖制契丹大字取諸部鄉里之名續作一篇著于卷末臣請推廣之使諸部各立姓氏庶男女婚媾有合典禮帝以舊制不可遽釐不聽大康二年出耶律乙辛為中京留守庶針與耶律孟簡表賀頃之乙辛復為樞密使專權恣虐庶針私見乙辛泣曰前抗表非庶針之願也乙辛信其言乃得自安聞者鄙之八年致仕卒子蒲魯蒲魯字乃展幼聰悟好學甫七歲能誦契丹大字習漢文未十年博通經籍重熙中舉進士第主文以國制無契丹試進士之條聞于上以庶針擅令子就科目鞭之二百尋命蒲魯為牌印郎君應詔賦詩立成以進帝嘉賞顧左右曰文才如此必不能武事蒲魯奏曰臣自蒙義方兼習騎射在流輩中亦可周旋帝未之信會從獵三矢中三兔帝奇之轉通進是時父庶針嘗寄戒諭詩蒲魯答以賦衆稱其典雅寵遇漸隆清寧初卒楊字昌時安次人幼通五經大義聖宗聞其穎悟詔試詩授祕書省校書郎太平十一年擢進士乙科為著作佐郎重熙十二年纍遷樞密都承旨權度支使登對稱旨進樞密副使歷長寧軍節度使山西路轉運使知興中府清寧初入知南院樞密使與姚景行同總朝政請行柴冊禮封趙國公以足疾復知興中府咸雍初徙封齊召賜同德功臣尚書左僕射兼中書令拜樞密使改封晉給宰相樞密使兩廳傔從封趙王屢請歸政益賜保節功臣致仕大康五年例改遼西郡王薨耶律韓留字速寧仲父隋國王之後有明識篤行義舉止嚴重工為詩統和間召攝御院通進開泰三年稍遷烏古敵烈部都監俄知詳穩事敵烈部叛將宮分軍從樞密使耶律世良討平之加千牛衛大將軍重熙元年纍遷至同知上京留守改奚六部禿里太尉性不苟合為樞密使蕭解里所忌上欲召用韓留解里言目病不能視議遂寢四年召為北面林牙帝曰朕早欲用卿聞有疾故待之至今韓留對曰臣昔有目疾才數月耳然亦不至于昏第臣駑拙不能事權貴是以不獲早覩天顏非陛下聖察則愚臣豈有今日耶詔進述懷詩上嘉歎方將大用卒楊佶字正叔南京人幼穎悟異常讀書自能成句識者奇之弱冠聲名籍甚統和二十四年舉進士第一歷校書郎大理正開泰六年轉儀曹郎典掌書命加諫議大夫出知易州治尚清簡徵發期會必信入為大理少卿纍遷翰林學士文章號得體八年燕地饑疫民多流殍以佶同知南京留守事發倉廩振乏絶貧民鬻子者計傭而出之宋遣梅詢賀千齡節詔佶迎送多唱酬詢每見稱賞復為翰林學士重熙元年升翰林學士承旨丁母憂起復工部尚書歷忠順軍節度使朔武等州觀察處置使天德軍節度使加特進檢校太師同中書門下平章事復拜參知政事兼知南院樞密使十五年出為武定軍節度使境內亢旱苗稼將槁視事之夕雨澤霑足百姓歌曰何以蘇我上天降雨誰其撫我楊公為主陽水失故道歲為民害乃以己俸創長橋人不病涉及被召郡民攀轅泣送上御清涼殿宴勞之即日除吏部尚書兼門下侍郎同中書門下平章事上曰卿今日何減呂望之遇文王佶對曰呂望比臣遭際有十年之晚上悅其居相位以進賢為己任事總大綱責成百司人人樂為之用三請致政許之月給錢粟傔隸四時遣使存問卒有登瀛集行于世耶律和尚字特抹系出季父房善滑稽重熙初補祗候郎君時帝篤于親親凡三父之後皆序父兄行第於和尚尤狎愛然每侍宴飲雖詼諧未嘗有一言之過由是上益重之歷積慶永興宮使纍遷至同知南院宣徽使事南面林牙十六年出為懷化軍節度使俄召為御史大夫二十三年因大冊加天平軍節度使檢校太師徙中京路按問使卒和尚雅有美行數以財恤親友人皆愛重然嗜酒不事事以故不獲柄用或以為言答曰吾非不知顧人生如風燈石火不飲將何為晚年沈湎尤甚人稱為酒仙云論曰庶成定法令治民者不容高下其手庶針雖嘗表請廣姓氏以秩典禮其隨勢俯仰則有愧於其子蒲魯矣楊為上寵遇迭封王爵而功業不少概見然得愛民治國之要其楊佶哉
