body:
  text: 遼史卷三十本紀第三十天祚皇帝四五年春正月辛巳黨項小斛祿遣人請臨其地戊子趨天德過沙漠金兵忽至上徒步出走近侍進珠帽却之乘張仁貴馬得脫至天德己丑遇雪無禦寒具朮者以貂裘帽進途次絶糧朮者進與棗欲朮者即跪坐倚之假寐朮者輩惟齧冰雪以濟飢過天德至夜將宿民家紿曰偵騎其家知之乃叩馬首跪而大慟潛宿其家居數日嘉其忠遙授以節度使遂趨黨項以小斛祿為西南面招討使總知軍事仍賜其子及諸校爵賞有差二月至應州新城東六十里為金人完顏婁室等所獲八月癸卯至金丙午降封海濱王以疾終年五十有四在位二十四年金皇統元年二月改封豫王五年葬于廣寧府閭陽縣乾陵傍耶律淳者世號為北遼淳小字涅里興宗第四孫南京留守宋魏王和魯斡之子清寧初太后鞠育之既長篤好文學昭懷太子得罪上欲以淳為嗣上怒耶律白斯不知與淳善出淳為彰聖等軍節度使天祚即位進王鄭乾統二年加越王六年拜南府宰相首議制兩府禮儀上喜徙王魏其父和魯斡薨即以淳襲父守南京冬夏入朝寵冠諸王天慶五年東征都監章奴濟鴨子河與淳子阿撒等三百餘人亡歸先遣敵里等以廢立之謀報淳淳斬敵里首以獻進封秦晉國王拜都元帥賜金券免漢拜禮不名許自擇將士乃募燕雲精兵東至錦州隊長武朝彥作亂劫淳淳匿而免收朝彥誅之會金兵至聚兵戰于阿里軫斗敗績收亡卒數千人拒之淳入朝釋其罪詔南京刻石紀功保大二年天祚入夾山奚王回離保林牙耶律大石等引唐靈武故事議欲立淳淳不從官屬勸進曰主上蒙塵中原擾攘若不立王百姓何歸宜熟計之遂即位百官上號天錫皇帝改保大二年為建福元年大赦放進士李寶信等一十九人遙降天祚為湘陰王以燕雲平上京中京遼西六路淳主之沙漠以北南北路兩都招討府諸蕃部族等仍隸天祚自此遼國分矣封其妻普賢女為德妃以回離保知北院樞密使事軍旅之事悉委大石又遣使報宋免歲幣結好宋人發兵問罪擊敗之尋遣使奉表于金乞為附庸事未決淳病死年六十百官偽諡曰孝章皇帝廟號宣宗葬燕西香山永安陵遺命遙立秦王定以存社稷德妃為皇太后稱制改建福為德興元年放進士李球等百八人時宋兵來攻戰敗之由是人心大悅兵勢日振宰相李純等潛納宋兵居民內應抱關者被殺甚衆翌日攻內東門衛兵力戰宋軍大潰踰城而走死者相藉五表于金求立秦王不從而金兵大至德妃奔天德軍見天祚天祚怒誅德妃降淳庶人除其屬籍耶律雅里者天祚皇帝第二子也字撒鸞七歲欲立為皇太子別置禁衛封梁王保大三年金師圍青冢寨雅里在軍中太保特母哥挾之出走間道行至陰山聞天祚失利趨雲內雅里馳赴時扈從者千餘人多於天祚天祚慮特母哥生變欲誅之責以不能全救諸王將訊之仗劍召雅里問曰特母哥教汝何為雅里對曰無他言乃釋之天祚渡河奔夏隊帥耶律敵列等劫雅里北走至沙嶺見蛇橫道而過識者以為不祥後三日羣僚共立雅里為主雅里遂即位改元神曆命士庶上便宜雅里性寬大惡誅殺獲亡者笞之而已有自歸者即官之因謂左右曰欲附來歸不附則去何須威逼耶每取唐貞觀政要及林牙資忠所作治國詩令侍從讀之烏古部節度使糾哲迭烈部統軍撻不也都監突里不等各率其衆來附自是諸部繼至而雅里日漸荒怠好擊鞠特母哥切諫乃不復出以耶律敵列為樞密使特母哥副之敵列劾西北路招討使蕭糾里熒惑衆心志有不臣與其子麻涅並誅之以遙設為招討使與諸部戰數敗杖免官從行有疲困者輒振給之直長保德諫曰今國家空虛賜賚若此將何以相給耶雅里怒曰昔畋於福山卿誣獵官今復有此言若無諸部我將何取不納初令羣牧運鹽濼倉粟而民盜之議籍以償雅里乃自為直每粟一車償一羊三車一牛五車一馬八車一駝左右曰今一羊易粟二斗且不可得乃償一車雅里曰民有則我有若令盡償民何堪後獵查剌山一日而射黃羊四十狼二十一因致疾卒年三十耶律大石者世號為西遼大石字重德太祖八代孫也通遼漢字善騎射登天慶五年進士第擢翰林應奉尋升承旨遼以翰林為林牙故稱大石林牙曆泰祥二州刺史遼興軍節度使保大二年金兵日逼天祚播越與諸大臣立秦晉王淳為帝淳死立其妻蕭德妃為太后以守燕及金兵至蕭德妃歸天祚天祚怒誅德妃而責大石曰我在汝何敢立淳對曰陛下以全國之勢不能一拒敵棄國遠遁使黎民塗炭即立十淳皆太祖子孫豈不勝乞命於他人耶上無以答賜酒食赦其罪大石不自安遂殺蕭乙薛坡里括自立為王率鐵騎二百宵遁北行三日過黑水見白達達詳穩牀古兒牀古兒獻馬四百駝二十羊若干西至可敦城駐北庭都護府會威武崇德會蕃新大林紫河駝等七州及大黃室韋敵剌王紀剌茶赤剌也喜鼻古德尼剌達剌乖達密里密兒紀合主烏古里阻卜普速完唐古忽母思奚的糾而畢十八部王衆諭曰我祖宗艱難創業歷世九主歷年二百金以臣屬逼我國家殘我黎庶屠翦我州邑使我天祚皇帝蒙塵于外日夜痛心疾首我今仗義而西欲借力諸蕃翦我仇敵復我疆宇惟爾衆亦有軫我國家憂我社稷思共救君父濟生民於難者乎遂得精兵萬餘置官吏立排甲具器仗明年二月甲午以青牛白馬祭天地祖宗整旅而西先遺書回鶻王畢勒哥曰昔我太祖皇帝北征過卜古罕城即遣使至甘州詔爾祖烏母主曰汝思故國耶朕即為汝復之汝不能返耶朕則有之在朕猶在爾也爾祖即表謝以為遷國于此十有餘世軍民皆安土重遷不能復返矣是與爾國非一日之好也今我將西至大食假道爾國其勿致疑畢勒哥得書即迎至邸大宴三日臨行獻馬六百駝百羊三千願質子孫為附庸送至境外所過敵者勝之降者安之兵行萬里歸者數國獲駝馬牛羊財物不可勝計軍勢日盛鋭氣日倍至尋思干西域諸國舉兵十萬號忽兒珊來拒戰兩軍相望二里許諭將士曰彼軍雖多而無謀攻之則首尾不救我師必勝遣六院司大王蕭斡里剌招討副使耶律松山等將兵二千五百攻其右樞密副使蕭剌阿不招討使耶律朮薛等將兵二千五百攻其左自以衆攻其中三軍俱進忽兒珊大敗僵尸數十里駐軍尋思干凡九十日回回國王來降貢方物又西至起兒漫文武百官册立大石為帝以甲辰歲二月五日即位年三十八號葛兒罕復上漢尊號曰天祐皇帝改元延慶追諡祖父為嗣元皇帝祖母為宣義皇后册元妃蕭氏為昭德皇后因謂百官曰朕與卿等行三萬里跋涉沙漠夙夜艱勤賴祖宗之福卿等之力冒登大位爾祖爾父宜加恤典共享尊榮自蕭斡里剌等四十九人祖父封爵有差延慶三年班師東歸馬行二十日得善地遂建都城號虎思斡耳𩽆改延慶為康國元年三月以六院司大王蕭斡里剌為兵馬都元帥敵剌部前同知樞密院事蕭查剌阿不副之茶赤剌部禿魯耶律燕山為都部署護衛耶律鐵哥為都監率七萬騎東征以青牛白馬祭天樹旗以誓于衆曰我大遼自太祖太宗艱難而成帝業其後嗣君耽樂無厭不恤國政盜賊𧔧起天下土崩朕率爾衆遠至朔漠期復大業以光中興此非朕與爾世居之地申命元帥斡里剌曰今汝其往信賞必罰與士卒同甘苦擇善水草以立營量敵而進毋自取禍敗也行萬餘里無所得牛馬多死勒兵而還大石曰皇天弗順數也康國十年歿在位二十年廟號德宗子夷列年幼遺命皇后權國后名塔不煙號感天皇后稱制改元咸清在位七年子夷列即位改元紹興籍民十八歲以上得八萬四千五百戶在位十三年歿廟號仁宗子幼遺詔以妹普速完權國稱制改元崇福號承天太后後與駙馬蕭𩽆魯不弟朴古只沙里通出駙馬為東平王羅織殺之駙馬父斡里剌以兵圍其宮射殺普速完及朴古只沙里普速完在位十四年仁宗次子直魯古即位改元天禧在位三十四年時秋出獵乃蠻王屈出律以伏兵八千擒之而據其位遂襲遼衣冠尊直魯古為太上皇皇后為皇太后朝夕問起居以侍終焉直魯古死遼絶耶律淳在天祚之世歷王大國受賜金券贊拜不名一時恩遇無與為比當天祚播越以都元帥留守南京獨不可奮大義以激燕民及諸大臣興勤王之師東拒金而迎天祚乎乃自取之是篡也况忍王天祚哉大石既帝淳而王天祚矣復歸天祚天祚責以大義乃自立為王而去之幸藉祖宗餘威遺智建號萬里之外雖寡母弱子更繼迭承幾九十年亦可謂難矣然淳與雅里大石之立皆在天祚之世有君而復君之其可乎哉諸葛武侯為獻帝發喪而後立先主為帝者不可同年語矣故著以為戒云贊曰遼起朔野兵甲之盛鼓行外席卷河朔樹晉植漢何其壯歟太祖太宗乘百戰之勢輯新造之邦英謀睿略可謂遠矣雖以世宗中才穆宗殘暴連遘弒逆而神器不搖蓋由祖宗威令猶足以震疊其國人也聖宗以來內修政治外拓疆宇既而申固鄰好四境乂安維持二百餘年之基有自來矣降臻天祚既丁末運又觖人望崇信姦回自椓國本羣下離心金兵一集內難先作廢立之謀叛亡之迹相繼𧔧起馴致土崩瓦解不可復支良可哀也耶律與蕭世為甥舅義同休戚奉先挾私滅公首禍構難一至於斯天祚窮蹙始悟奉先誤己不幾晚乎淳雅里所謂名不正言不順事不成者也大石苟延彼善於此亦幾何哉
