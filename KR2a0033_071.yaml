body:
  text: 遼史卷七十一列傳第一后妃肅祖昭烈皇后蕭氏懿祖莊敬皇后蕭氏玄祖簡獻皇后蕭氏德祖宣簡皇后蕭氏太祖淳欽皇后述律氏太宗靖安皇后蕭氏世宗懷節皇后蕭氏世宗妃甄氏穆宗皇后蕭氏景宗睿智皇后蕭氏聖宗仁德皇后蕭氏聖宗欽哀皇后蕭氏興宗仁懿皇后蕭氏興宗貴妃蕭氏道宗宣懿皇后蕭氏道宗惠妃蕭氏天祚皇后蕭氏天祚德妃蕭氏天祚文妃蕭氏天祚元妃蕭氏書始嬪虞詩興關雎國史記載往往自家而國以立天下之本然尊卑之分不可易也司馬遷列呂后于紀班固因之而傳元后於外戚之後范曄登后妃于帝紀天子紀年以事謂之紀后曷為而紀之自晉史列諸后以首傳隋唐以來莫之能易也遼因突厥稱皇后曰可敦國語謂之俚寋尊稱曰耨斡蓋以配后土而母之云太祖稱帝尊祖母曰太皇太后母曰皇太后嬪曰皇后等以徽稱加以美號質於隋唐文於故俗后族唯乙室拔里氏而世任其國事太祖慕漢高皇帝故耶律兼稱劉氏以乙室拔里比蕭相國遂為蕭氏耶律儼陳大任遼史后妃傳大同小異酌取其當著于篇肅祖昭烈皇后蕭氏小字卓真歸肅祖生四子見皇子表乾統三年追尊昭烈皇后懿祖莊敬皇后蕭氏小字牙里辛肅祖嘗過其家曰同姓可結交異姓可結婚知為蕭氏為懿祖聘焉生男女七人乾統三年追尊莊敬皇后玄祖簡獻皇后蕭氏小字月里𩽆玄祖為狠德所害后嫠居恐不免命四子往依鄰家耶律臺押乃獲安太祖生后以骨相異常懼有陰圖害者鞠之別帳重熙二十一年追尊簡獻皇后德祖宣簡皇后蕭氏小字巖母斤遙輦氏宰相剔剌之女男女六人太祖長子也天顯八年崩祔德陵重熙二十一年追尊宣簡皇后太祖淳欽皇后述律氏諱平小字月理𩽆其先回鶻人糯思生魏寧舍利魏寧生慎思梅里慎思生婆姑梅里婆姑娶勻德恝王女生后于契丹右大部婆姑名月碗仕遙輦氏為阿扎割只后簡重果斷有雄略嘗至遼土二河之會有女子乘青牛車倉卒避路忽不見未幾童謠曰青牛嫗曾避路蓋諺謂地祇為青牛嫗云太祖即位羣臣上尊號曰地皇后神册元年大册加號應天大明地皇后行兵御衆后嘗與謀太祖嘗渡磧擊黨項黃頭臭泊二室韋乘虛襲之后知勒兵以待奮擊大破之名震諸夷時晉王李存勗欲結援以叔母事后幽州劉守光遣韓延徽求援不拜太祖怒留之使牧馬后曰守節不屈賢者也宜禮用之太祖乃召延徽與語大悅以為謀主吳主李獻猛火油以水沃之愈熾太祖選三萬騎以攻幽州后曰豈有試油而攻人國者指帳前樹曰無皮可以生乎太祖曰不可后曰幽州之有土有民亦猶是耳吾以三千騎掠其四野不過數年困而歸我矣何必為此萬一不勝為中國笑吾部落不亦解體乎其平渤海后與有謀太祖崩后稱制攝軍國事及葬欲以身殉親戚百官力諫因斷右腕納于柩太宗即位尊為皇太后會同初上尊號曰廣德至仁昭烈崇簡應天皇太后初太祖嘗謂太宗必興我家后欲令皇太子倍避之太祖册倍為東丹王太祖崩太宗立東丹王避之唐太后常屬意於少子李胡太宗崩世宗即位于鎮陽太后怒遣李胡以兵逆擊李胡敗太后親率師遇于潢河之橫渡賴耶律屋質諫罷兵遷太后于祖州應曆三年崩年七十五祔祖陵諡曰貞烈重熙二十一年更今諡太宗靖安皇后蕭氏小字溫淳欽皇后弟室室魯之女帝為大元帥納為妃生穆宗及即位立為皇后性聰慧潔素尤被寵顧雖軍旅田獵必與天顯十年崩諡彰德葬奉陵重熙二十一年更今諡世宗懷節皇后蕭氏小字撒葛只淳欽皇后弟阿古只之女帝為永康王納之生景宗天祿末立為皇后明年秋生萌古公主在蓐察割作亂弒太后及帝后乘步輦直詣察割請畢收殮明日遇害諡曰孝烈皇后重熙二十一年更今諡世宗妃甄氏後唐宮人有姿色帝從太宗南征得之寵遇甚厚生寧王只沒及即位立為皇后嚴明端重風神間雅內治有法莫干以私劉知遠郭威稱帝世宗承強盛之資奄奄歲時后與參帷幄密贊大謀不果用察割作亂遇害景宗立葬二后于醫巫閭山建廟陵寢側穆宗皇后蕭氏父知璠內供奉翰林承旨后生有雲氣馥郁久之幼有儀則帝居藩納為妃及正位中宮性柔婉不能規正無子景宗睿智皇后蕭氏諱綽小字燕燕北府宰相思溫女早慧思溫嘗觀諸女掃地惟后潔除喜曰此女必能成家帝即位選為貴妃尋册為皇后生聖宗景宗崩尊為皇太后攝國政后泣曰母寡子弱族屬雄強邊防未靖奈何耶律斜軫韓德讓進曰信任臣等何慮之有於是后與斜軫德讓參決大政委于越休哥以南邊事統和元年上尊號曰承天皇太后二十四年加上尊號曰睿德神略應運啓化承天皇太后二十七年崩諡曰聖神宣獻皇后重熙二十一年更今諡后明達治道聞善必從故羣臣咸竭其忠習知軍政澶淵之役親御戎車指麾三軍賞罰信明將士用命聖宗稱遼盛主后教訓為多聖宗仁德皇后蕭氏小字菩薩哥睿智皇后弟隗因之女年十二美而才選入掖庭統和十九年册為齊天皇后嘗以草莛為殿式密付有司令造清風天祥八方三殿既成益寵異所乘車置龍首鴟尾飾以黃金又造九龍輅諸子車以白金為浮圖各有巧思夏秋從行山谷間花木如繡車服相錯人望之以為神仙生皇子二皆早卒開泰五年宮人耨斤生興宗后養為子帝大漸耨斤詈后曰老物寵亦有既耶左右扶后出帝崩耨斤自立為皇太后是為欽哀皇后護衛馮家奴喜孫等希旨誣告北府宰相蕭浞卜國舅蕭匹敵謀逆詔令鞫治連及后興宗聞之曰皇后侍先帝四十年撫育眇躬當為太后今不果反罪之可乎欽哀曰此人若在恐為後患帝曰皇后無子而老雖在無能為也欽哀不從遷后于上京車駕春搜欽哀慮帝懷鞠育恩馳遣人加害使至后曰我實無辜天下共知卿待我浴而後就死可乎使者退比反后已崩年五十是日若有見后于木葉山陰者乘青蓋車衛從甚嚴追尊仁德后皇與欽哀並祔慶陵聖宗欽哀皇后蕭氏小字耨斤淳欽皇后弟阿古只五世孫黝面狠視母嘗夢金柱擎天諸子欲上不能后後至與僕從皆升異之久之入宮嘗拂承天太后榻獲金雞吞之膚色光澤勝常太后驚異曰是必有奇子已而生興宗仁德皇后無子取而養之如己出后以興宗侍仁德皇后謹不悅聖宗崩令馮家奴等誣仁德皇后與蕭浞卜蕭匹敵等謀亂徙上京害之自立為皇太后攝政以生辰為應聖節重熙元年尊為仁慈聖善欽孝廣德安靖貞純寬厚崇覺儀天皇太后三年后陰召諸弟議欲立少子重元重元以所謀白帝帝收太后符璽遷于慶州七括宮六年秋帝悔之親馭奉迎侍養益孝謹后常不懌帝崩殊無戚容見崇聖皇后悲泣如禮謂曰汝年尚幼何哀痛如是清寧初尊為太皇太后崩諡曰欽哀皇后后初攝政追封曾祖為蘭陵郡王父為齊國王諸弟皆王之雖漢五侯無以過興宗仁懿皇后蕭氏小字撻里欽哀皇后弟孝穆之長女性寬容姿貌端麗帝即位入宮生道宗重熙四年立為皇后二十三年號貞懿慈和文惠孝敬廣愛崇聖皇后道宗即位尊為皇太后清寧二年上尊號曰慈懿仁和文惠孝敬廣愛宗天皇太后九年秋敦睦宮使耶律良以重元與其子涅魯古反狀密告太后乃言于帝帝疑之太后曰此社稷大事宜早為計帝始戒嚴及戰太后親督衛士破逆黨大康二年崩諡仁懿皇后仁慈淑謹中外咸德凡正旦生辰諸國貢幣悉賜貧瘠嘗夢重元曰臣骨在太子山北不勝寒溧寤即命屋之慈憫類此興宗貴妃蕭氏小字三駙馬都尉匹里之女選入東宮帝即位立為皇后重熙初以罪降貴妃道宗宣懿皇后蕭氏小字觀音欽哀皇后弟樞密使惠之女姿容冠絶工詩善談論自制歌詞尤善琵琶重熙中帝王燕趙納為妃清寧初立為懿德皇后皇太叔重元妻以艷冶自矜后見之戒曰為貴家婦何必如此后生太子濬有專房寵好音樂伶官趙惟一得侍左右大康初宮婢單登教坊朱頂鶴誣后與惟一私樞密使耶律乙辛以聞詔乙辛與張孝傑劾狀因而實之族誅惟一賜后自盡歸其尸於家乾統初追諡宣懿皇后合葬慶陵道宗惠妃蕭氏小字坦思駙馬都尉霞抹之妹大康二年乙辛譽之選入掖庭立為皇后居數歲未見皇嗣后妹斡特懶先嫁乙辛子綏也后以宜子言于帝離婚納宮中八年皇孫延禧封梁王降為惠妃徙乾陵斡特懶還其家頃之其母燕國夫人厭魅梁王伏誅貶妃為庶人幽于宜州諸弟沒入興聖宮天慶六年召還封太皇太妃後二年奔黑頂山卒葬太子山天祚皇后蕭氏小字奪里懶宰相繼先五世孫大安三年入宮明年封燕國王妃乾統初册為皇后性間淑有儀則兄弟奉先保先等緣后寵柄任女直亂從天祚西狩以疾崩天祚德妃蕭氏小字師姑北府宰相常哥之女壽隆二年入宮封燕國妃生子撻魯乾統三年改德妃以柴册禮封撻魯為燕國王加妃號贊翼王薨以哀戚卒天祚文妃蕭氏小字瑟瑟國舅大父房之女乾統初帝幸耶律撻葛第見而悅之匿宮中數月皇太叔和魯斡勸帝以禮選納三年冬立為文妃生蜀國公主晉王敖盧斡尤被寵幸以柴册加號承翼善歌詩女直亂作日見侵迫帝畋遊不恤忠臣多被疏斥妃作歌諷諫其詞曰勿嗟塞上兮暗紅塵勿傷多難兮畏夷人不如塞姦邪之路兮選取賢臣直須臥薪嘗膽兮激壯士之捐身可以朝清漠北兮夕枕燕雲又歌曰丞相來朝兮劍佩鳴千官側目兮寂無聲養成外患兮嗟何及禍盡忠臣兮罰不明親戚並居兮藩屏位私門潛畜兮爪牙兵可憐往代兮秦天子猶向宮中兮望太平天祚見而銜之播遷以來郡縣所失幾半上頗有倦勤之意諸皇子敖盧斡最賢素有人望元后兄蕭奉先深忌之誣南軍都統余覩謀立晉王以妃與聞賜死天祚元妃蕭氏小字貴哥燕國妃之妹年十七册為元妃性沉靜嘗晝寢近侍盜貂裀妃覺而不言宮掖稱其寬厚從天祚西狩以疾薨論曰遼以鞍馬為家后妃往往長於射御軍旅田獵未嘗不從如應天之奮擊室韋承天之御戎澶淵仁懿之親破重元古所未有亦其俗也靖安無毀無譽齊天巧思乃奢侈之漸宣懿度曲知音豈致誣衊之階乎文妃能歌詩諷諫而謂謀私其子非矣若簡憲之艱危保孤懷節之從容就義雖烈丈夫何以過之欽哀狠桀賊殺嫡后而興宗不能防間其母惜哉
