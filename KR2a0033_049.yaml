body:
  text: 遼史卷四十九志第十八禮志一理自天設情由人生以理制情而禮樂之用行焉林豺梁獺是生郊禘窪尊燔黍是生燕饗虆梩瓦棺是生喪葬儷皮緇布是生婚冠皇造帝秩三王彌文一文一質蓋本于忠變通革弊與時宜之唯聖人為能通其意執理者膠瑟聚訟不適人情徇情者稊稗綿蕝不中天理秦漢而降君子無取焉遼本朝鮮故壤箕子八條之教流風遺俗蓋有存者自其上世緣情制宜隱然有尚質之風遙輦胡剌可汗制祭山儀蘇可汗制瑟瑟儀阻午可汗制柴冊再生儀其情朴其用儉敬天恤災施惠本孝出於悃忱殆有得於膠瑟聚訟之表者太古之上椎輪五禮何以異茲太宗克晉稍用漢禮今國史院有金陳大任遼禮儀志皆其國俗之故又有遼朝雜禮漢儀為多別得宣文閣所藏耶律儼志視大任為加詳存其略著于篇吉儀祭山儀設天神地祗位于木葉山東鄉中立君樹前植羣樹以像朝班又偶植二樹以為神門皇帝皇后至夷離畢具禮儀牲用赭白馬玄牛赤白羊皆牡僕臣曰旗鼓拽剌殺牲體割懸之君樹太巫以酒酹牲禮官曰敵烈麻都奏儀辦皇帝服金文金冠白綾袍絳帶懸魚三山絳垂飾犀玉刀錯絡縫烏靴皇后御絳絡縫紅袍懸玉佩雙結帕絡縫烏靴皇帝皇后御鞍馬羣臣在南命婦在北服從各部旗幟之色以從皇帝皇后至君樹前下馬升南壇御榻坐羣臣命婦分班以次入就位合班拜訖復位皇帝皇后詣天神地祇位致奠閤門使讀祝訖復位坐北府宰相及惕隱以次致奠于君樹徧及羣樹樂作羣臣命婦退皇帝率孟父仲父季父之族三匝神門樹餘族七匝皇帝皇后再拜在位者皆再拜上香再拜如初皇帝皇后升壇御龍文方茵坐再聲警詣祭東所羣臣命婦從班列如初巫衣白衣惕隱以素巾拜而冠之巫三致辭每致辭皇帝皇后一拜在位者皆一拜皇帝皇后各舉酒二爵肉二器再奠大臣命婦右持酒左持肉各一器少後立一奠命惕隱東向擲之皇帝皇后六拜在位者皆六拜皇帝皇后復位坐命中丞奉茶果餅餌各二器奠于天神地祗位執事郎君二十人持福酒胙肉詣皇帝皇后前太巫奠酹訖皇帝皇后再拜在位者皆再拜皇帝皇后一拜飲福受胙復位坐在位者以次飲皇帝皇后率羣臣復班位再拜聲蹕一拜退太宗幸幽州大悲閣遷白衣觀音像建廟木葉山尊為家神於拜山儀過樹之後增詣菩薩堂儀一節然後拜神非胡剌可汗之故也興宗先有事于菩薩堂及木葉山遼河神然後行拜山儀冠服節文多所變更後因以為常神主樹木懸牲告辦班位奠祝致嘏飲福往往暗合于禮天理人情放諸四海而準信矣夫興宗更制不能正以經術無以大過於昔故不載瑟瑟儀若旱擇吉日行瑟瑟儀以祈雨前期置百柱天棚及期皇帝致奠于先帝御容乃射柳皇帝再射親王宰執以次各一射中柳者質誌柳者冠服不中者以冠服質之不勝者進飲於勝者然後各歸其冠服又翼日植柳天棚之東南巫以酒醴黍稗薦植柳祝之皇帝皇后祭東方畢子弟射柳皇族國舅羣臣與禮者賜物有差既三日雨則賜敵烈麻都馬四疋衣四襲否則以水沃之道宗清寧元年皇帝射柳訖詣風師壇再拜柴冊儀擇吉日前期置柴冊殿及壇壇之制厚積薪以木為三級壇置其上席百尺氈龍文方茵又置再生母后搜索之室皇帝入再生室行再生儀畢八部之叟前導後扈左右扶翼皇帝冊殿之東北隅拜日畢乘馬選外戚之老者御皇帝疾馳仆御者從者以氈覆之皇帝詣高阜地大臣諸部帥列儀仗遙望以拜皇帝遣使敕曰先帝升遐有伯叔父兄在當選賢者沖人不德何以為謀羣臣對曰臣等以先帝厚恩陛下明德咸願盡心敢有他圖皇帝令曰必從汝等所願我將信明賞罰爾有功陟而任之爾有罪黜而棄之若聽朕命則當謨之僉曰唯帝命是從皇帝于所識之地封土石以誌之遂行拜先帝御容宴饗羣臣翼日皇帝出冊殿護衞太保扶翼升壇奉七廟神主置龍文方茵北南府宰相率羣臣圜立各舉氈邊贊祝訖樞密使奉玉寶玉冊入有司讀冊訖樞密使稱尊號以進羣臣三稱萬歲皆拜宰相北南院大王諸部帥進赭白羊各一羣皇帝更衣拜諸帝御容遂宴羣臣賜賚各有差拜日儀皇帝升露臺設褥向日再拜上香門使通閣使或副應拜臣僚殿左右階陪位再拜皇帝昇坐奏牓訖北班起居畢時相已下通名再拜不出班奏聖躬萬福又再拜各祗候宣徽已下橫班同諸司閤門北面先奏事餘同教坊與臣僚同告廟儀至日臣僚昧爽朝服詣太祖廟次引臣僚合班先見御容再拜畢引班首左上至褥位再拜贊上香揖欄內上香畢復褥位再拜各祗候立定左右舉告廟祝版於御容前跪捧中書舍人俛跪讀訖俛興退引班首左下復位又再拜分引上殿次第進酒三分班引出謁廟儀至日昧爽南北臣僚各具朝服赴廟車駕至臣僚於門外依位序立望駕鞠躬班首不出班奏聖躬萬福舍人贊各祗候畢皇帝降車分引南北臣僚左右入至丹墀褥位合班定皇帝升露臺褥位宣徽贊皇帝再拜殿上下臣僚陪位皆再拜上香畢退復位再拜分引臣僚左右上殿位立進御容酒依常禮若即退再拜舍人贊好去引退禮畢告廟謁廟皆曰拜容以先帝先后生辰及忌辰行禮自太宗始也其後正旦皇帝生辰諸節辰皆行之若忌辰及車駕行幸亦嘗遣使行禮凡瑟瑟柴冊再生納后則親行之凡柴冊親征則告幸諸京則謁四時有薦新孟冬朔拜陵儀有司設酒饌于山陵皇帝皇后駕至敵烈麻都奏儀辦閤門使贊皇帝皇后詣位四拜訖巫贊祝燔胙及時服酹酒薦牲大臣命婦以次燔胙四拜皇帝皇后率羣臣命婦循諸陵各三匝還宮翼日羣臣入謝爇節儀皇帝即位凡征伐叛國俘掠人民或臣下進獻人口或犯罪沒官戶皇帝親覽閒田建州縣以居之設官治其事及帝崩所置人戶府庫錢粟穹廬中置小氈殿帝及后妃皆鑄金像納焉節辰忌日朔望皆致祭于穹廬之前又築土為臺高丈餘置大盤于上祭酒食撒於其中焚之國俗謂之爇節歲除儀初夕敕使及夷離畢率執事郎君至殿前以鹽及羊膏置爐中燎之巫及大巫以次贊祝火神訖閤門使贊皇帝面火再拜初皇帝皆親拜至道宗始命夷離畢拜之
