body:
  text: 遼史卷十二本紀第十二聖宗三五年春正月乙丑破束城縣縱兵大掠丁卯次文安遣人諭降不聽遂擊破之盡殺其丁壯俘其老幼戊寅上還南京己卯御元和殿大賚將士壬辰如華林天柱二月甲午朔至自天柱三月癸亥朔幸長春宮賞花釣魚以牡丹徧賜近臣歡宴累日丁丑以諦居部下拽剌解里偵候有功命入御盞郎君班祇候夏四月癸巳朔幸南京丁酉上率百僚冊上皇太后尊號曰睿德神略應運啟化承天皇太后禮畢羣臣上皇帝尊號曰至德廣孝昭聖天輔皇帝戊戌詔有司條上勳舊等第加恩癸丑清暑冰井六月壬辰朔召大臣決庶政丙申以耶律蘇為遙郡刺史秋七月戊辰涅剌部節度使撒葛里有惠政民請留從之是月獵平地松林九月丙戌幸南京是冬止焉六年春正月庚申如華林天柱二月丁未奚王籌寧殺無罪人李浩所司議貴請貸其罪令出錢贍浩家從之甲寅大同軍節度使同平章政事劉京致仕三月己未休哥奏宋事宜上親覽之丙寅以司天趙宗德齊泰王守平邵祺閻梅從征四載言天象數有徵賜物有差癸未李繼遷遣使來貢夏四月乙未幸南京丁酉胡里室橫突韓德讓墮馬皇太后怒殺之戊戌幸宋國王休哥第五月癸亥南府宰相耶律沙薨閏月丙戌朔奉聖州言太祖所建金鈴閣壞乞加修繕詔以南征恐重勞百姓待軍還治之壬寅阿薩蘭回鶻來貢甲寅烏隈于厥部以歲貢貂鼠青鼠皮非土產皆於他處貿易以獻乞改貢詔自今止進牛馬六月癸亥党項太保阿剌恍來朝貢方物乙丑諭諸道兵馬備南征攻城器具乙酉夷離菫阿魯勃送沙州節度使曹恭順還授于越秋七月丙戌觀市己亥遣南面招討使韓德威討河湟諸蕃違命者賜休哥排亞部諸軍戰馬己酉駐蹕于洛河壬子加韓德威開府儀同三司兼政事令門下平章事東京留守兼侍中漆水郡王耶律抹只為大同軍節度使癸丑排亞請增置涿州驛傳八月丙辰以青牛白馬祭天地戊午休哥與排亞裊里曷捉生將至易州遇宋兵殺其指揮使而還庚申幸黎園溫湯癸亥以將伐宋遣使祭木葉山丁丑瀕海女直遣使速魯里來朝西北路管押詳穩速撒哥以伐折立助里二部上所俘獲東路林牙蕭勤德及統軍石老以擊敗女直兵獻俘大同軍節度使耶律抹只奏今歲霜旱乏食乞增價折粟以利貧民詔從之濱海女直遣厮魯里來修土貢九月丙申化哥與朮不姑舂古里來貢休哥遣詳穩意德里獻所獲宋諜者丁酉皇太后幸韓德讓帳厚加賞賚命從臣分朋雙陸以盡歡戊戌幸南京己亥有事于太宗皇帝廟以唐元德為奉陵軍節度使癸卯祭旗鼓南伐庚戌次涿州射帛書諭城中降不聽冬十月乙卯縱兵四面攻之城破乃降因撫諭其衆駙馬蕭勤德太師闥覽皆中流矢勤德載帝車中以歸聞宋軍退遣斜軫排亞等追擊大敗之戊午攻沙堆驛破之己巳以黑白羊祭天地庚午以宋降軍分置七指揮號歸聖軍壬申行軍參謀宣政殿學士馬得臣言諭降宋軍恐終不為用請並放還詔不允丙子籌寧奏破狼山捷辛巳復奏敗宋兵于益津關癸未進軍長城口宋定州守將李興以兵來拒休哥擊敗之追奔五六里十一月甲申朔上以將攻長城口詔諸軍備攻具庚寅駐長城口督大軍四面進攻士潰圍委城遁斜軫招之不降上與韓德讓邀擊之殺獲殆盡獲者分隸燕軍辛卯攻滿城圍之甲午拔其城軍士開北門遁上使諭其將領乃率衆降戊戌攻下祁州縱兵大掠己亥拔新樂庚子破小狼山砦丁未宋軍千人出益津關國舅郎君桃委詳穩十哥擊走之殺副將一人己酉休哥獻黃皮室詳穩徇地莫州所獲馬二十匹士卒二十人命賜降者衣帶使隸燕京辛亥西路又送降卒二百餘人給寒者裘衣以馬得臣權宣徽院事十二月甲寅朔賜皮室詳穩乞得禿骨里戰馬橫帳郎君達打里劫掠命杖之丙辰畋于沙河休哥獻奚詳穩耶魯所獲宋諜丁巳遣北宰相蕭繼遠等往覘安平侍衞馬軍司奏攻祁州新樂都頭劉贊等三十人有功乞加恩賞是月大軍駐宋境是歲詔開貢舉放高舉一人及第七年春正月癸未朔班師戊子宋雞壁砦守將郭榮率衆來降詔屯南京庚寅次長城口三卒出營劫掠笞以徇衆以所獲物分賜左右壬辰李繼遷與兄繼捧有怨乞與通好上知其非誠不許癸巳諭諸軍趣易州己亥禁部從伐民桑梓癸卯攻易州宋兵出遂城來援遣鐵林軍擊之擒其指揮使五人甲辰大軍齊進破易州降刺史劉墀守陴士卒南遁上帥師邀之無敢出者即以馬質為刺史趙質為兵馬都監遷易州軍民于燕京以東京騎將夏貞顯之子仙壽先登授高州刺史乙巳幸易州御五花樓撫諭士庶丙午以青牛白馬祭天地詔諭三京諸道戊申次淶水謁景宗皇帝廟詔遣涿州刺史耶律守雄護送易州降人八百還隸本貫己酉次岐溝射鬼箭辛亥還次南京六軍解嚴二月壬子朔上御元和殿受百官賀詔雞壁砦民二百戶徙居檀順薊三州甲寅回鶻于闐師子等國來貢乙卯大饗軍士爵賞有差樞密使韓德讓封楚國王駙馬都尉蕭寧遠同政事門下平章事是日幸長春宮甲子詔南征所俘有親屬分隸諸帳者給官錢贖之使相從乙丑賞南征女直軍使東還丙寅禁舉人匿名飛書謗訕朝廷癸酉吐蕃党項來貢甲戌雲州租賦請止輸本道從之丙子以女直活骨德為本部相分遣巫覡祭名山大川丁丑皇子佛寶奴生戊寅阿薩蘭于闐轄烈並遣使來貢三月壬午朔遣使祭木葉山禁芻牧傷禾宋進士十七人挈家來歸命有司考其中第者補國學官餘授縣主簿尉李繼遷遣使來貢丁亥詔知易州趙質收戰亡士卒骸骨築京觀戊子賜于越宋國王紅珠筋線命入內神帳行再生禮皇太后賜物甚厚以雞壁砦民成廷朗等八戶隸飛狐己丑詔免雲州逋賦乙室王貫寧擊鞠為所部郎君高四縱馬突死詔訊高四罪丙申詔開奇峰路通易州市戊戌以王子帳耶律襄之女封義成公主下嫁李繼遷是春駐蹕延芳淀夏四月甲寅還京乙卯國舅太師蕭闥覽為子排亞請尚皇女延壽公主許之丙辰謁太宗皇帝廟以御史大夫烏骨領乙室大王己未幸延壽寺飯僧甲子諫議大夫馬得臣以上好擊毬上疏切諫臣伏見陛下聽朝之暇以擊毬為樂臣思此事有三不宜上下分朋君臣爭勝君得臣奪君輸臣喜一不宜也往來交錯前後遮約爭心競起禮容全廢若貪月杖誤拂天衣臣既失儀君又難責二不宜也輕萬乘之貴逐廣場之娛地雖平至為堅确馬雖良亦有驚蹶或因奔擊失其控御聖體寧無虧損太后豈不驚懼三不宜也臣望陛下念繼承之重止危險之戲疏奏大嘉納之丁卯吐渾還金回鶻安進吐蕃獨𩽆等自宋來歸皆賜衣帶皇太后謁奇首可汗廟丙子以舍利軍耶律杳為常袞己卯駐蹕儒州龍泉五月庚辰朔遣宣徽使蒲領等率兵分道備宋以遙輦副使控骨離為舍利拽剌詳穩辛巳祭風伯于儒州白馬村休哥引軍至滿城招降卒七百餘人遣使來獻詔隸東京辛卯獵桑乾河壬辰燕京奏宋兵至邊時暑未敢與戰且駐易州俟彼動則進擊退則班師從之六月庚戌朔以太師柘母迎合撾之二十辛酉詔燕樂密雲二縣荒地許民耕種免賦役十年甲戌宣政殿學士馬得臣卒詔贈太子少保賜錢十萬粟百石乙亥詔出諸畜賜邊部貧民是月休哥排亞破宋兵于泰州秋七月乙酉御含涼殿視朝丙戌以中丞耶律覈麥哥權夷離畢橫帳郎君耶律延壽為御史大夫癸巳遣兵南征甲午以迪離畢涅剌烏濊三部各四人益東北路夫人婆里德仍給印綬丁酉勞南征將士是日帝與皇太后謁景宗皇帝廟八月庚午放進士高正等二人及第冬十月禁罝網捕兔十一月甲申于闐張文寶進內丹書十二月甲寅鈎魚于沈子濼癸亥獵于好草嶺
