body:
  text: 遼史卷五十九志第二十八食貨志上契丹舊俗其富以馬其強以兵縱馬於野弛兵於民有事而戰彍騎介夫卯命辰集馬逐水草人仰湩酪挽強射生以給日用糗糧芻茭道在是矣以是制勝所向無前及其有國內建宗廟朝廷外置郡縣牧守制度日增經費日廣上下相師服御浸盛而食貨之用斯為急矣於是五京及長春遼西平州置鹽鐵轉運度支錢帛諸司以掌出納其制數差等雖不可悉而大要散見舊史若農穀租賦鹽鐵貿易坑冶泉幣羣牧逐類採托緝而為篇以存一代食貨之略初皇祖勻德實為大迭烈府夷離堇喜稼穡善畜牧相地利以教民耕仲父述瀾為于越飭國人樹桑麻習組織太祖平諸弟之亂弭兵輕賦專意於農嘗以戶口滋繁糾轄疏遠分北大濃兀為二部程以樹藝諸部效之太宗會同初將東獵三剋奏減輜重疾趨北山取物以備國用無害農務尋詔有司勸農桑教紡績以烏古之地水草豐美命甌昆石烈居之益以海勒水之善地為農田三年詔以諧里河臚朐河近地賜南院歐堇突呂乙斯勃北院溫納河剌三石烈人以事耕種八年駐蹕赤山宴從臣問軍國要務左右對曰軍國之務愛民為本民富則兵足兵足則國強上深然之是年詔徵諸道兵仍戒敢有傷禾稼者以軍法論應曆間雲州進嘉禾時謂重農所召保寧七年漢有宋兵使來乞糧詔賜粟二十萬斛助之非經費有餘其能若是聖宗乾亨五年詔曰五稼不登開帑藏而代民稅螟蝗為災罷徭役以恤飢貧統和三年帝嘗過䤝城見乙室奧隗部下婦人迪輦等黍過熟未穫遣人助刈太師韓德讓言兵後逋民棄業禾稼棲畝募人穫之以半給穫者政事令室昉亦言山西諸州給軍興民力凋敝田穀多躪於邊兵請復今年租六年霜旱災民飢詔三司舊以稅錢折粟估價不實其增以利民又徙吉避寨居民三百戶于檀順薊三州擇沃壤給牛種穀十三年詔諸道置義倉歲秋社民隨所穫戶出粟庤倉社司籍其目歲儉發以振民十五年詔免南京舊欠義倉粟仍禁諸軍官非時畋牧妨農開泰元年詔曰朕惟百姓徭役煩重則多給工價年穀不登發倉以貸田園蕪廢者則給牛種以助之太平初幸燕燕民以年豐進土産珍異上禮高年惠魚衆寡賜酺連日九年燕地飢戶部副使王嘉請造船募習海漕者移遼東粟餉燕議者稱道險不便而寢興宗即位遣使閲諸道禾稼是年通括戶口詔曰朕於早歲習知稼穡力辦者廣務耕耘罕聞輸納家食者全虧種植多至流亡宜通檢括普遂均平禁諸職官不得擅造酒糜穀有婚祭者有司給文字始聽道宗初年西北雨穀三十里春州斗粟六錢時西蕃多叛上欲為守禦計命耶律唐古督耕稼以給西軍唐古率衆田臚朐河側歲登上熟移屯鎮州凡十四稔積粟數十萬斛每斗不過數錢以馬人望前為南京度支判官公私兼裕檢括戶口用法平恕乃遷中京度支使視事半歲積粟十五萬斛擢左散騎常侍遼之農穀至是為盛而東京如咸信蘇復辰海同銀烏遂春泰等五十餘城內沿邊諸州各有和糴倉依祖宗法出陳易新許民自願假貸收息二分所在無慮二三十萬碩雖纍兵興未嘗用乏逮天慶間金兵大入盡為所有會天祚播遷耶律敵烈等逼立梁王雅里令羣牧人戶運鹽濼倉粟人戶侵耗議籍其産以償雅里自定其直粟一車一羊三車一牛五車一馬八車一駝從者曰今一羊易粟二斗尚不可得此直太輕雅里曰民有則我有若令盡償衆何以堪事雖無及然使天未絶遼斯言亦足以收人心矣夫賦稅之制自太祖任韓延徽始制國用太宗籍五京戶丁以定賦稅戶丁之數無所於考聖宗乾亨間以上京云為戶訾具實饒善避徭役遺害貧民遂勒各戶凡子錢到本悉送歸官與民均差統和中耶律昭言西北之衆每歲農時一夫偵候一夫治公田二夫給糾官之役當時沿邊各置屯田戍兵易田積穀以給軍餉故太平七年詔諸屯田在官斛粟不得擅貸在屯者力耕公田不輸稅賦此公田制也餘民應募或治間田或治私田則計畝出粟以賦公上統和十五年募民耕灤河曠地十年始租此在官間田制也又詔山前後未納稅戶並於密雲燕樂兩縣占田置業入稅此私田制也各部大臣從上征伐俘掠人戶自置郛郭為頭下軍州凡市井之賦各歸頭下惟酒稅赴納上京此分頭下軍州賦為二等也先是遼東新附地不榷酤而鹽麥曲之禁亦弛馮延休韓紹勳相繼商利欲與燕地平山例加繩約其民病之遂起大延琳之亂連年詔復其租民始安靖南京歲納三司鹽鐵錢折絹大同歲納三司稅錢折粟開遠軍故事民歲輸稅斗粟折五錢耶律抹只守郡表請折六錢亦皆利民善政也
