body:
  text: 遼史卷十一本紀第十一聖宗二四年春正月甲戌觀漁土河林牙耶律謀魯姑彰德軍節度使蕭闥覽上東征俘獲賜詔奬諭丙子樞密使耶律斜軫林牙勤德等上討女直所獲生口十餘萬馬二十餘萬及諸物己卯朝皇太后決滯訟壬午樞密使斜軫林牙勤德謀魯姑節度使闥覽統軍使室羅侍中抹只奚王府監軍迪烈與安吉等克女直還軍遣近侍泥里吉詔旌其功仍執手撫諭賜酒果勞之甲午幸長濼二月壬寅以四番都統軍李繼忠為檢校司徒上柱國癸卯西夏李繼遷叛宋來降以為定難軍節度使銀夏綏宥等州觀察處置等使特進檢校太師都督夏州諸軍事西番酋帥瓦泥乞移為保大軍節度使鄜坊等州觀察處置等使甲寅耶律斜軫蕭闥覽謀魯姑等族帥來朝行飲至之禮賞賚有差丙寅行次裊里井三月甲戌于越休哥奏宋遣曹彬崔彥進米信由雄州道田重進飛狐道潘美楊繼業雁門道來侵岐溝涿州固安新城皆陷詔宣徽使蒲領馳赴燕南與休哥議軍事分遣使者徵諸部兵益休哥以擊之復遣東京留守耶律抹只以大軍繼進賜劍專殺乙亥以親征告陵廟山川丙子統軍使耶律頗德敗宋軍于固安休哥絶其糧餉擒將吏獲馬牛器仗甚衆庚辰寰州刺史趙彥章以城叛附于宋辛巳宋兵入涿州順義軍節度副使趙希贊以朔州叛附于宋時上與皇太后駐兵駝羅口詔趣東征兵馬以為應援壬午詔林牙勤德以兵守平州之海岸以備宋仍報平州節度使迪里姑若勤德未至遣人趣行馬乏則括民馬鎧甲闕則取於顯州之甲坊癸未遼軍與宋田重進戰于飛狐不利冀州防禦使大鵬翼康州刺史馬贇馬軍指揮使何萬通陷焉丁亥以北院樞密使耶律斜軫為山西兵馬都統以北院宣徽使蒲領為南征都統以副于越休哥彰國軍節度使艾正觀察判官宋雄以應州叛附于宋庚寅遣飛龍使亞剌文班吏亞達哥閲馬以給先發諸軍詔駙馬都尉蕭繼遠領之辛卯武定軍馬步軍都指揮使郢州防禦使呂行德副都指揮使張繼從馬軍都指揮使劉知進等以飛狐叛附于宋癸巳賜林牙謀魯姑旗鼓四劍一率禁軍之驍鋭者南助休哥丙申步軍都指揮使穆超以靈丘叛附于宋詔遣使賜樞密使斜軫密旨及彰國軍節度使杓窊印以趣征討夏四月己亥朔次南京北郊庚子惕隱瑤升西南面招討使韓德威以捷報辛丑宋潘美陷雲州壬寅遣抹只謀魯姑勤德等領偏師以助休哥仍賜旗鼓杓窊印撫諭將校癸卯休哥復以捷報上以酒脯祭天地率羣臣賀于皇太后詔勤德還軍丙午頗德上所獲鎧仗數戊申監軍宣徽使蒲領奏敵軍引退而奚王籌寧北大王蒲奴寧統軍使頗德等以兵追躡皆勝之遣敞史勤德持詔褒美及詔侍中抹只統諸軍赴行在所頻不部節度使和盧覩黃皮室詳穩解里等各上所獲兵甲又詔兩部突騎赴蔚州以助闥覽橫帳郎君老君奴率諸郎君巡徼居庸之北將軍化哥統平州兵馬橫帳郎君奴哥為黃皮室都監郎君謁里為北府都監各以步兵赴蔚州以助斜軫庚戌以斜軫為諸路兵馬都統闥覽兵馬副部署迪子都監以代善補韓德威癸丑以艾正趙希贊及應州朔州節度副使奚軍小校隘離轄渤海小校貫海等叛入于宋籍其家屬分賜有功將校宋將曹彬米信北渡拒馬河與于越休哥對壘挑戰南北列營長六七里時上次涿州東五十里甲寅詔于越休哥奚王籌寧宣徽使蒲領南北二王等嚴備水道無使敵兵得潛至涿州乙卯休哥等敗宋軍獻所獲器甲貨財賜詔褒美蔚州左右都押衙李存璋許彥欽等殺節度使蕭啜里執監城使銅州節度使耿紹忠以城叛附于宋丙辰復涿州告天地戊午上次沙姑河之北淀召林牙勤德議軍事諸將校各以所俘獲來上奚王籌寧南北二王率所部將校來朝以近侍粘米里所進自落鴇祭天地己未休哥蒲領來朝詔三司給軍前夏衣布庚申上朝皇太后辛酉大軍次固安壬戌圍固安城統軍使頗德先登城遂破大縱俘獲居民先被俘者命以官物贖之甲子賞攻城將士有差五月庚午遼師與曹彬米信戰于岐溝關大敗之追至拒馬河溺死者不可勝紀餘衆奔高陽又為遼師衝擊死者數萬棄戈甲若丘陵挽漕數萬人匿岐溝空城中圍之壬申以皇太后生辰縱還癸酉班師還次新城休哥蒲領奏宋兵奔逃者皆殺之甲戌以軍捷遣使分諭諸路京鎮丁丑詔諸將校論功行賞無有不實己卯次固安南以青牛白馬祭天地庚辰以所俘宋人射鬼箭詔遣詳穩排亞率弘義宮兵及南北皮室郎君拽剌四軍赴應朔二州界與惕隱瑤升招討韓德威等同禦宋兵在山西之未退者辛巳以瑤升軍赴山西壬午還次南京癸未休哥籌寧蒲奴寧進俘獲斜軫遣判官蒲姑奏復蔚州斬首二萬餘級乘勝攻下靈丘飛狐賜蒲姑酒及銀器丙戌御元和殿大宴從軍將校封休哥為宋國王加蒲領籌寧蒲奴寧及諸有功將校爵賞有差丁亥發南京詔休哥備器甲儲粟待秋大舉南征戊子斜軫奏宋軍復圍蔚州擊破之詔以兵授瑤升韓德威等壬辰以宋兵至平州瑤升韓德威不盡追殺降詔詰責仍諭據城未降者必盡掩殺無使遁逃癸巳以軍前降卒分賜扈從乙未賞頗德諸將校士卒六月戊戌朔詔韓德威赴闕加統軍使頗德檢校太師甲辰詔南京留守休哥遣炮手西助斜軫乙巳以夷離畢姪里古部送輜重行宮暑行日五十里人馬疲乏遣使讓之丁未度居庸關壬子南京留守奏百姓歲輸三司鹽鐵錢折絹不如直詔增之甲寅斜軫奏復寰州乙卯皇太妃諸王公主迎上嶺表詔御幄道傍置景宗御容率從臣進酒陳俘獲于前遂大宴戊午幸涼陘以所俘分賜皇族及乳母己未聞所遣宣諭回鶻核列哿國度里亞里等為朮不姑邀留詔速撒賜朮不姑貨幣諭以朝廷來遠之意使者由是乃得行癸亥以節度使韓毗哥翰林學士邢抱朴等充雲州宣諭招撫使丙寅以太尉王八所俘生口分賜趙妃及于越迪輦乙里婉秋七月丙子樞密使斜軫遣侍御涅里底幹勤哥奏復朔州擒宋將楊繼業及上所獲將校印綬誥敕賜涅里底等酒及銀器辛巳以捷告天地以宋歸命者二百四十人分賜從臣又以殺敵多詔上京開龍寺建佛事一月飯僧萬人辛卯斜軫奏大軍至蔚州營于州左得諜報敵兵且至乃設伏以待敵至縱兵逆擊追奔逐北至飛狐口遂乘勝鼓行而西入寰州殺守城吏卒千餘人宋將楊繼業初以驍勇自負號楊無敵北據雲朔數州至是引兵南出朔州三十里至狼牙村惡其名不進左右固請乃行遇斜軫伏四起中流矢墮馬被擒瘡發不食三日死遂函其首以獻詔詳穩轄麥室傳其首于越休哥以示諸軍仍以朔州之捷宣諭南京平州將吏自是宋守雲應諸州者聞繼業死皆棄城遁八月丁酉朔置先離闥覽官六員領于骨里女直迪烈于等諸部人之隸宮籍者以北大王蒲奴寧為山後五州都管乙巳韓德讓奏宋兵所掠州郡其逃民禾稼宜募人收穫以其半給收者從之乙卯斜軫還自軍獻俘己未用室昉韓德讓言復山西今年租賦詔第山西諸將校功過而賞罰之乙室帳宰相安寧以功過相當追告身一通諦居部節度使佛奴笞五十惕隱瑤升拽剌歘烈朔州節度使慎思應州節度使骨只雲州節度使化哥軍校李元迪蔚州節度使佛留都監崔其劉繼琛皆以聞敵逃遁奪官歘烈仍配隸本貫領國舅軍王六笞五十壬戌以斜軫所部將校前破女直後有宋捷第功加賞癸亥加斜軫守太保九月丙寅朔皇太妃以上納后進衣物駝馬以助會親頒賜甲戌次黑河以重九登高于高水南阜祭天賜從臣命婦菊花酒丁丑次河陽北戊寅內外命婦進會親禮物辛巳納皇后蕭氏丙戌次儒州以大軍將南征詔遣皮室詳穩乞的郎君拽剌先赴本軍繕甲兵己丑召北大王蒲奴寧赴行在所甲午皇太后行再生禮冬十月丙申朔黨項阻卜遣使來貢丁酉皇太后復行再生禮為帝祭神祈福己亥以乙室王帳郎君吳留為御史大夫政事令室昉奏山西四州自宋兵後人民轉徙盜賊充斥乞下有司禁止命新州節度使蒲打里選人分道巡檢北大王帳郎君曷葛只里言本府王蒲奴寧十七罪詔橫帳太保核國底鞫之蒲奴寧伏其罪十一笞二十釋之曷葛只里亦伏誣告六事命詳酌罪之知事勤德連坐杖一百免官甲辰出居庸關乙巳詔諸京鎮相次軍行諸細務權停理問庚戌分遣拽剌沿邊偵候辛亥命皇族廬帳駐東京延芳淀壬子詔以敕榜付于越休哥以南征諭拒馬河南六州乙卯幸南京戊午以南院大王留寧言復南院部民今年租賦壬戌以銀鼠青鼠及諸物賜京官僧道耆老甲子上與大臣分朋擊鞠十一月丙寅朔黨項來貢庚午以政事令韓德讓守司徒壬申以古北松亭榆關征稅不法致阻商旅遣使鞫之女直請以兵從征許之癸酉御正殿大勞南征將校丙子南伐次狹底堝皇太后親閲輜重兵甲丁丑以休哥為先鋒都統戊寅日南至上率從臣祭酒景宗御容辛巳詔以北大王蒲奴寧居奉聖州山西五州公事並聽與節度使蒲打里共裁決之癸未祭日月為駙馬都尉勤德祈福乙酉置諸部監勒所部各守營伍毋相錯雜丙戌遣謀魯姑蕭繼遠沿邊巡徼以所獲宋卒射鬼箭丁亥以青牛白馬祭天地辛卯次白佛塔川獲自落馴狐以為吉徵祭天地詔駙馬都尉蕭繼遠林牙謀魯姑太尉林八等固守封疆毋漏間諜軍中無故不得馳馬及縱諸軍殘南境桑果壬辰至唐興縣時宋軍屯滹沱橋北選將亂射之橋不能守進焚其橋癸巳涉沙河休哥來議事北皮室詳穩排亞獻所獲宋諜二人上賜衣物令還招諭泰州楮特部節度使盧補古都監耶律盻與宋戰于泰州不利甲午祭麃鹿神以盧補古臨陳遁逃奪告身一通其判官都監各杖之郎君拽剌雙骨里遇宋先鋒於望都擒其士卒九人獲甲馬十一賜酒及銀器乙未以盧補古等罪詔諭諸軍以御盞郎君化哥權楮特部節度使橫帳郎君佛留為都監代盧補古權領國舅軍桃畏請置二校領散卒詔以郎君世音頗德等充命彰德軍節度使蕭闥覽將軍迪子略地東路詔休哥排亞等議軍事十二月己亥休哥敗宋軍於望都遣人獻俘壬寅營于滹沱北詔休哥以騎兵絶宋兵毋令入邢州命太師王六謹偵候癸卯小校曷主遇宋輜重引兵殺獲甚衆並焚其芻粟甲辰詔南大王與休哥合勢進討宰相安寧領迪離部及三剋軍殿上率大軍與宋將劉廷讓李敬源戰于莫州敗之乙巳擒宋將賀令圖楊重進等國舅詳穩撻烈哥宮使蕭打里死之丙午詔休哥以下入內殿賜酒勞之丁未築京觀復以南京禁軍擊楊團城守將以城降詔禁侵掠己酉營神榆村詔上楊團城粟麥兵甲之數辛亥以黑白二牲祭天地癸丑拔馮母鎮大縱俘掠丙辰邢州降丁巳拔深州以不即降誅守將以下縱兵大掠李繼遷引五百騎發塞願婚大國永作藩輔詔以王子帳節度使耶律襄之女汀封義成公主下嫁賜馬三千匹
