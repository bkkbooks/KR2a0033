body:
  text: 遼史卷七十三列傳第三耶律曷魯蕭敵魯阿古只耶律斜涅赤老古頗德耶律欲穩耶律海里耶律曷魯字控溫一字洪隱迭剌部人祖匣馬葛簡憲皇帝兄父偶思遙輦時為本部夷離堇曷魯其長子也性質厚在髫鬌與太祖遊從父釋魯奇之曰興我家者必二兒也太祖既長相與易裘馬為好然曷魯事太祖彌謹會滑哥弒其父釋魯太祖顧曷魯曰滑哥弒父料我必不能容將反噬我今彼歸罪臺哂為解我姑與之是賊吾不忘也自是曷魯常佩刀從太祖以備不虞居久之曷魯父偶思病召曷魯曰阿保機神略天授汝率諸弟赤心事之已而太祖來問疾偶思執其手曰爾命世奇才吾兒曷魯者他日可委以事吾已諭之矣既而以諸子屬之太祖為撻馬狘沙里參預部族事曷魯領數騎召小黃室韋來附太祖素有大志而知曷魯賢軍國事非曷魯議不行會討越兀與烏古部曷魯為前鋒戰有功及太祖為迭剌部夷離堇討奚部其長朮里逼險而壘攻莫能下命曷魯持一笴往諭之既入為所執乃說奚曰契丹與奚言語相通實一國也我夷離堇於奚豈有輘轢之心哉漢人殺我祖奚首夷離堇怨次骨日夜思報漢人顧力單弱使我求援於奚傳矢以示信耳夷離堇受命於天撫下以德故能有此衆也今奚殺我違天背德不祥莫大焉且兵連禍結當自此始豈爾國之利乎朮里感其言乃降太祖為于越秉國政欲命曷魯為迭刺部夷離堇辭曰賊在君側未敢遠去太祖討黑車子室韋幽州劉仁恭遣養子趙霸率衆來救曷魯伏兵桃山俟霸衆過半而要之與太祖合擊斬獲甚衆遂降室韋太祖會李克用于雲州時曷魯侍克用顧而壯之曰偉男子為誰太祖曰吾族曷魯也會遙輦痕德堇可汗歿羣臣奉遺命請立太祖太祖辭曰昔吾祖夷離堇雅里嘗以不當立而辭今若等復為是言何歟曷魯進曰曩吾祖之辭遺命弗及符瑞未見第為國人所推戴耳今先君言猶在耳天人所與若合符契天不可逆人不可拂而君命不可違也太祖曰遺命固然汝焉知天道曷魯曰聞于越之生也神光屬天異香盈幄夢受神誨龍錫金佩天道無私必應有德我國削弱齮齕於鄰部日久以故生聖人以興起之可汗知天意故有是命且遙輦九營布非無可立者小大臣民屬心于越天也昔者于越伯父釋魯嘗曰吾猶蛇兒猶龍也天時人事幾不可失太祖猶未許是夜獨召曷魯責曰衆以遺命迫我汝不明吾心而亦俯隨耶曷魯曰在昔夷離堇雅里雖推戴者衆辭之而立阻午為可汗相傳十餘世君臣之分亂紀綱之統隳委質他國若綴斿然羽檄𧔧午民疲奔命興王之運實在今日應天順人以答顧命不可失也太祖乃許明日即皇帝位命曷魯總軍國事時制度未講國用未充扈從未備而諸弟剌葛等往往覬非望太祖宮行營始置腹心部選諸部豪健二千餘充之以曷魯及蕭敵魯總焉已而諸弟之亂作太祖命曷魯總領軍事討平之以功為迭剌部夷離堇時民更兵焚剽日以抏敝曷魯撫輯有方畜牧益滋民用富庶乃討烏古部破之自是震懾不敢復叛乃請制朝儀建元率百官上尊號太祖既備禮受冊拜曷魯為阿魯敦于越阿魯敦者遼言盛名也後太祖伐西南諸夷數為前鋒神冊二年從逼幽州與唐節度使周德威拒戰可汗州西敗其軍遂圍幽州未下太祖以時暑班師留曷魯與盧國用守之俄而救兵繼至曷魯等以軍少無援退三年七月皇都既成燕羣臣以落之曷魯是日得疾薨年四十七既葬賜名其阡宴答山曰于越峪詔立石紀功清寧間命立祠上京初曷魯病革太祖臨視問所欲言曷魯曰陛下聖德寬仁羣生咸遂帝業隆興臣既蒙寵遇雖瞑目無憾惟析迭剌部議未決願亟行之及薨太祖流涕曰斯人若登三五載吾謀蔑不濟矣後太祖二十一功臣各有所擬以曷魯為心云子惕剌撒剌俱不仕論曰曷魯以肺腑之親任帷幄之寄言如蓍龜謀成戰勝可謂算無遺策矣其君臣相得之誠庶吳漢之於光武歟夫信其所可信智也太祖有焉故曰惟聖知聖惟賢知賢斯近之矣蕭敵魯字敵輦其母為德祖女弟而淳欽皇后又其女兄也五世祖曰胡母里遙輦氏時嘗使唐唐留之幽州一夕折關遁歸國由是世為決獄官敵魯性寬厚膂力絶人習軍旅事太祖潛藩日侍左右凡征討必與行陳既即位敵魯與弟阿古只耶律釋魯耶律曷魯偕總宿衛拜敵魯北府宰相世其官太祖征奚及討劉守光敵魯略地海濱殺獲甚衆頃之剌葛等作亂潰而北走敵魯率輕騎追之兼晝夜行至榆河敗其黨獲剌葛以獻太祖嘉之錫賚甚渥後討西南夷功居諸將先神冊三年十二月卒敵魯有膽略聞敵所在即馳赴親冒矢石前後戰未嘗少衄必勝乃止以故在太祖功臣列喻以手云弟阿古只阿古只字撒本少卓越自放不羈長驍勇善射臨敵敢前每射甲楯輒洞貫太祖為于越時以材勇充任使既即位與敵魯總腹心部剌葛之亂也淳欽皇后軍黑山阻險自固太祖方經略奚地命阿古只統百騎往衛之逆黨迭里特耶律滑哥素憚其勇略相戒曰是不可犯也剌葛既北走與敵魯追擒于榆河神冊初元討西南夷有功徇山西諸郡縣又下之敗周德威軍三年以功拜北府宰相世其職天贊初與王郁略地燕趙破磁窯鎮太祖西征悉諉以南面邊事攻渤海破扶餘城獨將騎兵五百敗老相軍三萬渤海既平改東丹國頃之已降郡縣復叛盜賊蜂起阿古只與康默記討之所向披靡會賊游騎七千自鴨淥府來援勢張甚阿古只帥麾下精鋭直犯其鋒一戰克之斬馘三千餘遂進軍破回跋城以病卒功臣中喻阿古只為耳云子安團官至右皮室詳穩耶律斜涅赤字撒剌六院部舍利裊古直之族始字鐸碗早隸太祖幕下嘗有疾賜樽酒飲而愈遼言酒樽曰撒剌故詔易字焉太祖即位掌腹心部天贊初分迭剌部為北南院斜涅赤為北院夷離堇帝西征至流沙威聲大振諸夷潰散乃命斜涅赤撫集之及討渤海破扶餘城斜涅赤從太子大元帥率衆夜圍忽汗城大諲撰降已而復叛命諸將分地攻之詰旦斜涅赤感勵士伍鼓譟登陴敵震懾莫敢禦遂破之天顯中卒年七十居佐命功臣之一姪老古頗德老古字撒懶其母淳欽皇后姊也老古幼養宮掖既長沉毅有勇略隸太祖帳下既即位屢有戰功剌葛之亂也欲乘我不備為掩襲計紿降太祖將納之命老古耶律欲穩嚴號令勒士卒控轡以防其變逆黨知有備懼而遁以功授右皮室詳穩典宿衛太祖侵燕趙遇唐兵雲碧店老古恃勇輕敵直犯其鋒戰久之被數創歸營而卒太祖深悼惜之佐命功臣其一也頗德字兀古鄰弱冠事太祖天顯初為左皮室詳穩典宿衛遷南院夷離堇治有聲石敬瑭破張敬達軍於太原北時頗德勒兵為援敬達遁敬瑭追至晉安寨圍之頗德領輕騎襲潞州塞其餉道唐諸將懼殺敬達以降會同初改迭剌部夷離堇為大王即拜頗德既而加採訪使舊制肅祖以下宗室稱院德祖宗室號三父房稱橫帳百官子弟及籍沒人稱著帳耶律斜的言橫帳班列不可與北南院並太宗詔在廷議皆曰然乃詔橫帳班列居上頗德奏曰臣伏見官制北南院大王品在惕隱上今橫帳始圖爵位之高願與北南院參任茲又恥與同列夫橫帳與諸族皆臣也班列奚以異帝乃諭百官曰朕所不知卿等不宜面從詔仍舊制其強直不撓如此頗德狀貌秀偉初太祖見之曰是子風骨異常兒必為國器後果然卒年四十九耶律欲穩字轄剌干突呂不部人祖臺押遙輦時為北邊拽剌簡獻皇后與諸子之罹難也嘗倚之以免太祖思其功不忘又多欲穩嚴重有濟世志乃命典司近部以遏諸族窺覬之想欲穩既見器重益感奮思報太祖始置宮分以自衛欲穩率門客首附宮籍帝益嘉其忠詔以臺押配享廟廷及平剌葛等亂以功遷奚迭剌部夷離堇從征渤海有功天顯初卒後諸帝以太祖之與欲穩也為故往往取其子孫為友宮分中稱八房皆其後也弟霞里終奚六部禿里耶律海里字涅剌昆遙輦昭古可汗之裔太祖傳位海里與有力焉初受命屬籍比局萌覬覦而遙輦故族尤觖望海里多先帝知人之明而素服太祖威德獨歸心焉以故太祖託為耳目數從征討既清內亂始置遙輦敞穩命海里領之天顯初征渤海海里將遙輦糾破忽汗城師般卒
