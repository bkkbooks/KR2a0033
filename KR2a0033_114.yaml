body:
  text: 遼史卷百十四列傳第四十四逆臣下蕭胡覩蕭迭里得古迭耶律撒剌竹奚回離保蕭特烈蕭胡覩字乙辛口吃視斜髮鬈伯父孝穆見之曰是兒狀貌族中未嘗有及壯魁梧桀傲好揚人惡重熙中為祇候郎君俄遷興聖宮使尚秦國長公主授駙馬都尉以不諧離婚復尚齊國公主為北面林牙清寧中歷北南院樞密副使代族兄朮哲為西北路招討使時蕭革與蕭阿剌俱為樞密使不協革以朮哲為阿剌所愛嫉之朮哲受代赴闕先嘗借官粟留直而去胡覩希革意發其事朮哲因得罪胡覩又欲耍權歲時獻遺珍玩畜産于革二人相愛過于兄弟胡覩族弟敵烈為北剋薦國舅詳穩蕭胡篤于胡覩胡覩見其辨給壯勇傾心交結每遇休沐言論終日人皆怪之會胡覩同知北院樞密事奏胡篤及敵烈可用帝以敵烈為旗鼓拽剌詳穩胡篤為宿直官及革搆陷其兄阿剌胡篤陰為之助時人醜之耶律乙辛知北院樞密事胡覩位在乙辛下意怏怏不平初胡覩嘗與重元子涅魯古謀逆欲其速發會車駕獵太子山遂與涅魯古脅弩手軍犯行宮既戰涅魯古中流矢而斃衆皆逃散時同黨耶律撒剌竹適在圍場聞亂率獵夫來援其黨謂胡覩等曰我軍甚衆乘其無備中夜決戰事冀有成若至明日其誰從我胡覩曰倉卒中黑白不辨若內外軍相應則吾事去矣黎明而發何遲之有重元聽胡覩之計令四面巡警待旦是夜同黨立重元僭位號胡覩自為樞密使明日戰敗胡覩被創單騎遁走至十七濼投水死五子同日誅之蕭迭里得字胡覩堇國舅少父房之後父雙古尚鈿匿公主仕至國舅詳穩迭里得幼警敏不羈好射獵太平中以外戚補祇候郎君歷延昌宮使殿前副點檢重熙十三年伐夏迭里得將偏師首入敵境多所俘掠遷都點檢改烏古敵烈部都詳穩十八年再舉西伐迭里得奏軍馬器械之事務在選將夏人豈為難制但嚴設斥堠不用掩襲計何慮不勝帝曰卿其速行無後軍期既而迭里得失利還復為都點檢十九年夏人來侵金肅軍上遣迭里得率輕兵督戰至河南三角川斬候者八人擒觀察使以功命知漢人行宮都部署事出為西南面招討使族弟黃八家奴告其主私議宮掖事迭里得寢之事覺決大杖削爵為民清寧中上以所坐事非迭里得所犯起為南京統軍使至是從重元子涅魯古等亂敗走被擒伏誅古迭本宮分人不知姓氏好戲狎不喜繩檢膂力過人善擊鞠重熙初為護衛歷宿直官十三年西征以古迭為先鋒夏人伏兵掩之古迭力戰麾下士多歿乃單騎突出遇夏王李元昊來圍勢甚急古迭馳射應弦輒仆躍馬直擊中堅夏兵不能當晡乃還營改興聖宮太保清寧九年從重元涅魯古亂與扈從兵戰敗而遁追擒之陵遲而死撒剌竹孟父房滌冽之孫性凶暴清寧中纍遷宣徽使改殿前都點檢首與重元謀亂會帝獵灤河重元恐事泄與扈從軍倉卒而戰其子涅魯古既死同黨潰散撒剌竹適在畋所聞亂劫獵夫以援既至知涅魯古已死大悔恨之謂曰我輩惟有死戰胡為若兒戲自取殞滅今行宮無備乘夜劫之大事可濟若俟明旦彼將有備安知我衆不二一失機會悔將無及重元蕭胡覩等曰今夕但可四面圍之勿令外軍得入彼何能備不從遲明投仗而走撒剌竹戰死奚回離保一名翰字挼懶奚王忒鄰之後善騎射趫捷而勇與其兄鱉里剌齊名大安中車駕幸中京補護衛稍遷鐵鷂軍詳穩天慶間徙北女直詳穩兼知咸州路兵馬事改東京統軍既而諸蕃入寇悉破之遷奚六部大王兼總知東路兵馬事保大二年金兵至天祚播遷回離保率吏民立秦晉國王淳為帝淳僞署回離保知北院樞密事兼諸軍都統屢敗宋兵淳死其妻普賢女攝事是年金兵由居庸關入回離保知北院即箭笴山自立號奚國皇帝改元天復設奚漢渤海三樞密院改東西節度使為二王分司建官時奚人巴輒韓家奴等引兵擊附近契丹部落劫掠人畜羣情大駭會回離保為郭藥師所敗一軍離心其黨耶律阿古哲與其甥乙室八斤等殺之僞立凡八月蕭特烈字訛都碗遙輦窪可汗宮分人乾統中入宿衛出為順義軍節度使天慶四年同知咸州路兵馬事五年以兵敗奪節度使保大元年遷隗古部節度使及天祚在山西集羣牧兵特烈為副統軍聞金兵將至特烈諭士卒以君臣之義死戰于石輦鐸金兵不戰特烈伺間欲攻之天祚喜甚召嬪御諸子登高同觀將詫之金兵望日月旗知天祚在其下以徑兵直趨奮擊無敢當者天祚遁走特烈所至招集散亡尋為中軍都統復敗于梯己山天祚決意渡河奔夏從臣切諫不聽人情惶懼不知所為特烈陰謂耶律兀直曰事勢如此億兆離心正我輩效節之秋不早為計奈社稷何遂共劫梁王雅里奔西北諸部僞立為帝特烈自為樞密使雅里卒欲擇可立者會耶律兀直言朮烈才德純備兼興宗之孫衆皆曰可遂僭立焉特烈僞職如故未三旬與朮烈俱為亂兵所殺論曰遼之秉國鈞握兵柄節制諸部帳非宗室外戚不使豈不以為帝王久長萬世之計哉及夫肆叛逆致亂亡皆是人也有國家者可不深戒矣乎
