body:
  text: 遼史卷九十一列傳第二十一耶律韓八耶律唐古蕭朮哲藥師奴耶律玦耶律僕里篤耶律韓八字嘲隱倜儻有大志北院詳穩古之五世孫太平中游京師寓行宮側惟囊衣匹馬而已帝微服出獵見而問之曰汝為何人韓八初不識漫應曰我北院部人韓八來覓官耳帝與語知有長才陰識之會北院奏南京疑獄久不決帝召韓八馳驛審録舉朝皆驚韓八量情處理人無寃者上嘉之籍羣牧馬闕其二同事者考尋不已韓八略不加詰即先馳奏帝益信任景福元年為左夷離畢徙北面林牙眷遇優異重熙六年改北院大王政務寬仁復為左夷離畢十二年再為北院大王入朝帝從容謂曰卿守邊任重當實府庫振貧乏以報朕既受詔愈竭忠謹知無不言便益為多卒年五十五上聞悼惜死之日篋無舊蓄椸無新衣遣使弔祭給葬具韓八平居不屑細務喜慍不形嘗失所乘馬家僮以同色者代之數月不覺耶律唐古字敵隱于越屋質之庶子廉謹善屬文統和二十四年述屋質安民治盜之法以進補小將軍遷西南面巡檢歷豪州刺史唐古部詳穩嚴立科條禁姦民鬻馬於宋夏界因陳弭私販安邊境之要太后嘉之詔邊郡遵行著為令朝議欲廣西南封域黑山之西綿亙數千里唐古言戍壘太遠卒有警急赴援不及非良策也從之西蕃來侵詔議守禦計命唐古勸督耕稼以給西軍田于臚朐河側是歲大熟明年移屯鎮州凡十四稔積粟數十萬斛斗米數錢重熙間改隗衍党項部節度使先是築可敦城以鎮西域諸部縱民畜牧反招寇掠重熙四年上疏曰自建可敦城已來西蕃數為邊患每煩遠戍歲月既久國力耗竭不若復守故疆省罷戍役不報是年致仕乞勒其父屋質功于石帝命耶律庶成製文勒石上京崇孝寺卒年七十八蕭朮哲字石魯隱孝穆弟高九之子以戚屬加監門衛上將軍重熙十三年將衛兵討李元有功遷興聖宮使蒲奴里部長陶得里叛朮哲為統軍都監從都統耶律義先擊之擒陶得里朮哲與義先不協誣義先罪免官稍遷西南面招討都監坐事下獄以太后言杖而釋之清寧初為國舅詳穩西北路招討使私取官粟三百斛及代留畜産令主者鬻之以償後族弟胡覩到部發其事帝怒決以大杖免官尋起為昭德軍節度使徵為北院宣徽使九年上以朮哲先為招討威行諸部復為西北路招討使訓士卒增器械省追呼嚴號令人不敢犯邊境晏然十年入朝封柳城郡王咸雍二年拜北府宰相為北院樞密使耶律乙辛所忌誣朮哲與護衛蕭忽古等謀害乙辛詔獄無狀罷相出鎮順義軍卒追王晉宋梁三國姪藥師奴藥師奴幼穎悟謹禮法補祗候郎君大康中為興聖宮使纍遷同知殿前點檢司事上嘉其宿衛嚴肅遷右夷離畢夏王李乾順為宋所攻求解帝命藥師奴持節使宋請罷兵通好宋從之拜南面林牙改漢人行宮副部署乾統初出為安東軍節度使卒耶律玦字吾展遙輦鮮質可汗之後重熙初召修國史補符寶郎纍遷知北院副部署事入見太后后顧左右曰先皇謂玦必為偉人果然除樞密副使出為西南面招討都監歷同簽南京留守事南面林牙皇弟秦國王為遼興軍節度使以玦同知使事多所匡正十年復為樞密副使咸雍初兼北院副部署及秦國王為西京留守請玦為佐從之歲中獄空者三召為孟父房敞穩玦不喜貨殖帝知其貧賜宮戶十嘗謂宰相曰契丹忠正無如玦者漢人則劉伸而已然熟察之玦優於伸先是西北諸部久不能平上遣玦問狀執弛慢者痛繩之以酒疾卒耶律僕里篤字燕隱六院林牙突呂不也四世孫開泰間為本班郎君有捕盜功樞密使蕭朴薦之遷率府率太平中同知南院宣徽事纍遷彰聖軍節度使重熙十六年知興中府以獄空聞十八年伐夏攝西南面招討使十九年夏人侵金肅軍敗之斬首萬餘級加右武衛上將軍時近邊羣牧數被寇掠遷倒塌嶺都監以治之桴鼓不鳴二十年知金肅軍事宰相趙惟節總領邊城橋道芻粟請二帝命僕里篤副之以稱職聞清寧初歷長寧匡義二軍節度使致仕咸雍間卒子阿固質終倒塌嶺都監論曰韓八因帝微行才始見售及任以事落落知大體不負上之知矣唐古朮哲經略西北邊勸農積粟訓練士卒敵人不敢犯玦以忠直見稱於上僕里篤以幹敏為宰相佐在鎮俱以獄空聞之數人者豈特甲胄之士抑亦李牧程不識之亞歟
