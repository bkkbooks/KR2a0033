body:
  text: 遼史卷一百二列傳第三十二蕭奉先李處溫張琳耶律余覩蕭奉先天祚元妃之兄也外寬內忌因元妃為上眷倚纍官樞密使封蘭陵郡王天慶二年上幸混同江鈎魚故事生女直酋長在千里內者皆朝行在適頭魚宴上使諸酋次第歌舞為樂至阿骨打但端立直視辭以不能再三旨諭不從上密謂奉先曰阿骨打跋扈若此可託以邊事誅之奉先曰彼粗人不知禮義且無大過殺之傷向化心設有異志蕞爾小國亦何能為上乃止四年阿骨打起兵犯寧江州東北路統軍使蕭撻不也戰失利上命奉先弟嗣先為都統將番漢兵往討屯出河店女直乃潛渡混同江乘我師未備來襲嗣先敗績軍將往往遁去奉先懼弟被誅乃奏東征潰軍逃罪所至劫掠若不肆赦將嘯聚為患從之嗣先詣闕待罪止免官而已由是士無鬬志遇敵輒潰郡縣所失日多初奉先誣耶律余覩結駙馬蕭昱謀立其甥晉王事覺殺昱余覩在軍中聞之懼奔女直保大二年余覩為女直監軍引兵奄至上憂甚奉先曰余覩乃王子班之苗裔此來實無亡遼心欲立晉王耳若以社稷計不惜一子誅之可不戰而退遂賜晉王死中外莫不流涕人心益解體當女直之兵未至也奉先逢迎天祚言女直雖能攻我上京終不能遠離巢穴而一旦越三千里直搗雲中計無所出惟請播遷夾山天祚方悟顧謂奉先曰汝父子誤我至此殺之何益汝去毋從我行恐軍心忿怒禍必及我奉先父子慟哭而去為左右執送女直兵女直兵斬其長子昂送奉先及次子昱於其國主道遇我兵奪歸天祚並賜死李處溫析津人伯父儼大康初為將作少監纍官參知政事封漆水郡王雅與北樞密使蕭奉先友舊執政十餘年善逢迎取媚天祚又寵任之儼卒奉先薦處溫為相處溫因奉先有援己力傾心阿附以固權位而貪樜尤甚凡所接引類多小人保大初金人陷中京諸將莫能支天祚懼奔夾山兵勢日迫處溫與族弟處能子奭外假怨軍聲援結都統蕭幹謀立魏國王淳召番漢官屬詣魏王府勸進魏國王將出奭乃持赭袍衣之令百官拜舞稱賀魏王固辭不得遂稱天錫皇帝以處溫守太尉處能直樞密院奭為少府少監左企弓以下及親舊與其事者賜官有差會魏國王病自知不起密授處溫番漢馬步軍都元帥意將屬以後事及病亟蕭幹等矯詔南面宰執入議獨處溫稱疾不至陰聚勇士為備紿云奉密旨防他變魏國王卒蕭幹擁契丹兵宣言當立王妃蕭氏為太后權主軍國事衆無敢異者幹以后命召處溫至時方多難未欲即誅但追毀元帥劄子處能懼及禍落髮為僧尋有永清人傅遵説隨郭藥師入燕被擒具言處溫嘗遺易州富民趙履仁書達宋將童貫欲挾蕭后納土歸宋后執處溫問之處溫曰臣父子於宣宗有定策功宜世蒙宥容可使因讒獲罪后曰向使魏國王如周公則終享親賢之名於後世誤王者皆汝父子何功之有並數其前罪惡處溫無以對乃賜死奭亦伏誅張琳瀋州人幼有大志壽隆末為祕書中允天祚即位纍遷戶部使頃之擢南府宰相初天祚之敗於女直也意謂蕭奉先不知兵乃召琳付以東征事琳以舊制凡軍國大計漢人不與辭之上不允琳奏曰前日之敗失於輕舉若用漢兵二十萬分道進討無不克者上許其半仍詔中京上京長春遼西四路計戶産出軍時有起至二百軍者生業蕩散民甚苦之四路軍甫集尋復遁去及中京陷天祚幸雲中留琳與李處溫佐魏國王淳守南京處溫父子召琳欲立淳為帝琳曰王雖帝胄初無上命攝政則可即真則不可處溫曰今日之事天人所與豈可易也琳雖有難色亦勉從之淳既稱帝諸將咸居權要琳獨守太師十日一朝平章軍國大事陽以元老尊之實則不使與政琳由是鬱悒而卒耶律余覩一名余都姑國族之近者也慷慨尚氣義保大初歷官副都統其妻天祚文妃之妹文妃生晉王最賢國人皆屬望時蕭奉先之妹亦為天祚元妃生秦王奉先恐秦王不得立深忌余覩將潛圖之適耶律撻葛里之妻會余覩之妻於軍中奉先諷人誣余覩結駙馬蕭昱撻葛里謀立晉王尊天祚為太上皇事覺殺昱及撻葛里妻賜文妃死余覩在軍中聞之懼不能自明被誅即引兵千餘並骨肉軍帳叛歸女直會大霖雨道途留阻天祚遣知奚王府蕭遐買北宰相蕭德恭大常袞耶律諦里姑歸州觀察使蕭和尚奴四軍太師蕭幹追捕甚急至閭山及之諸將議曰蕭奉先恃寵蔑害官兵余覩乃宗室雄才素不肯為其下若擒之則他日吾輩皆余覩矣不如縱之還紿云追襲不及余覩既入女直為其國前鋒引婁室孛堇兵攻陷州郡不測而至天祚聞之大驚知不能敵率衛兵入夾山余覩在女直為監軍久不調意不自安乃假遊獵遁西夏夏人問汝來有兵幾何余覩以二三百對夏人不納卒論曰遼之亡也雖孽降自天亦柄國之臣有以誤之也當天慶而後政歸后族奉先沮天祚防微之計陷晉王非罪之誅夾山之禍已見於此矣處溫逼魏王以僭號結宋將以賣國迹其姦佞如出一軌嗚呼天祚之所倚毗者若此國欲不亡得乎張琳娖娖守位余覩及覆自困則又何足議哉
