body:
  text: 遼史卷一百七列傳第三十七列女邢簡妻陳氏耶律氏常哥耶律奴妻蕭氏耶律朮者妻蕭氏耶律中妻蕭氏男女居室人之大倫與其得烈女不若得賢女天下而有烈女之名非幸也詩讚衞共姜春秋褒宋伯姬蓋不得已所以重人倫之變也遼據北方風化視中土為疎終遼之世得賢女二烈女三以見人心之天理有不與世道存亡者邢簡妻陳氏營州人父陘五代時累官司徒陳氏甫筓涉通經義凡覽詩賦輒能誦尤好吟詠時以女秀才名之年二十歸於簡孝舅姑閨門和睦親黨推重有六子陳氏親教以經後二子抱朴抱質皆以賢位宰相統和十二年卒睿智皇后聞之嗟悼贈魯國夫人刻石以表其行及遷祔遣使以祭論者謂貞靜柔順婦道母儀始終無慊云耶律氏太師適魯之妹小字常哥幼爽秀有成人風及長操行修潔自誓不嫁能詩文不苟作讀通曆見前人得失歷能品藻咸雍間作文以述時政其略曰君以民為體民以君為心人主當任忠賢人臣當去比周則政化平陰陽順欲懷遠則崇恩尚德欲強國則輕徭薄賦四端五典為治教之本六府三事寔生民之命淫侈可以為戒勤儉可以為師錯枉則人不敢詐顯忠則人不敢欺勿泥空門崇飾土木勿事邊鄙妄費金帛滿當思溢安必慮危刑罰當罪則民勸善不寶遠物則賢者至建萬世磐石之業制諸部強橫之心欲率下則先正身欲治遠則始朝廷上稱善時樞密使耶律乙辛愛其才屢求詩常哥遺以回文乙辛知其諷己銜之大康三年皇太子坐事乙辛誣以罪按無跡獲免會兄適魯謫鎮州常哥與俱常布衣疏食人問曰何自苦如此對曰皇儲無罪遭廢我輩豈可美食安寢及太子被害不勝哀痛年七十卒于家耶律奴妻蕭氏小字意辛國舅駙馬都尉陶蘇斡之女母胡獨公主意辛美姿容年二十始適奴事親睦族以孝謹聞嘗與娣姒會爭言厭魅以取夫寵意辛曰厭魅不若禮法衆問其故意辛曰修己以潔奉長以敬事夫以柔撫下以寬毋使君子見其輕易此之為禮法自然取重於夫以厭魅獲寵獨不愧於心乎聞者大慚初奴與樞密使乙辛有隙及皇太子廢被誣奪爵沒入興聖宮流烏古部上以意辛公主之女欲使絕婚意辛辭曰陛下以妾葭莩之親使免流竄實天地之恩然夫婦之義生死以之妾自筓年從奴一旦臨難頓爾乖離背綱常之道於禽獸何異幸陛下哀憐與奴俱行妾即死無恨帝感其言從之意辛久在貶所親執役事雖勞無難色事夫禮敬有加于舊壽隆中上書乞子孫為著帳郎君帝嘉其節召舉家還子國隱乾統間始仕保大中意辛在臨潢謂諸子曰吾度盧彥倫必叛汝輩速避我當死之賊至遇害耶律朮者妻蕭氏小字訛里本國舅孛堇之女性端売心有容色自幼與他女異年十八歸朮者謹裕貞婉娣姒推尊之及居朮者喪極哀毀既葬謂所親曰夫婦之道如陰陽表𩹉無陽則陰不能立無表則𩹉無所附妾今不幸失所天且生必有死理之自然朮者早歲登朝有才不壽天禍妾身罹此酷罰復何依恃儻死者可見則從不可見則當與俱侍婢勉竟慰無回意自刃而卒耶律中妻蕭氏小字挼蘭韓國王惠之四世孫聰慧謹愿年二十歸於中事夫敬順親戚咸譽其德中嘗謂曰汝可粗知書以前貞淑為鑑遂發心誦習多涉古今天慶中為賊所執潛置刃於履誓曰人欲汙我者即死之至夜賊遁而免久之帝召中為五院都監中謂妻曰吾本無宦情今不能免我當以死報國汝能從我乎挼蘭對曰謹奉教及金兵徇地嶺西盡徙其民中守節死挼蘭悲戚不形於外人怪之俄躍馬突出至中死所自殺論曰陳氏以經教二子並為賢相耶律氏自潔不嫁居閨閫之內而不忘忠其君非賢而能之乎三蕭氏之節雖烈丈夫有不能者矣
