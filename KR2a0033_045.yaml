body:
  text: 遼史卷四十五志第十五百官志一官生於職職沿於事而名加之後世沿名不究其實吏部一太宰也為大司徒為尚書為中書為門下兵部一司馬也為大司馬為太尉為樞密使沿古官名分今之職事以配之於是先王統理天下之法如治絲而棼名實淆矣契丹舊俗事簡職專官制朴實不以名亂之其興也勃焉太祖神冊六年詔正班爵至于太宗兼制中國官分南北以國制治契丹以漢制待漢人國制簡朴漢制則沿名之風固存也遼國官制分北南院北面治宮帳部族屬國之政南面治漢人州縣租賦軍馬之事因俗而治得其宜矣初太祖分迭剌夷離堇為北南二大王謂之北南院宰相樞密宣徽林牙下至郎君護衛皆分北南其實所治皆北面之事語遼官制者不可不辨凡遼朝官北樞密視兵部南樞密視吏部北南二王視戶部夷離畢視刑部宣徽視工部敵烈麻都視禮部北南府宰相總之惕隱治宗族林牙修文告于越坐而論議以象公師朝廷之上事簡職專此遼所以興也北面北面朝官契丹北樞密院掌兵機武銓羣牧之政凡契丹軍馬皆屬焉以其牙帳居大內帳殿之北故名北院元好問所謂北衙不理民是也北院樞密使知北院樞密使事知樞密院事北院樞密副使知北院樞密副使事同知北院樞密使事簽書北樞密院事北院都承旨北院副承旨北院林牙知北院貼黃給事北院知聖旨頭子事掌北院頭子北樞密院敞史北院郎君北樞密院通事北院掾史北樞密院中丞司北南樞密院點檢中丞司事總知中丞司事北院左中丞北院右中丞同知中丞司事北院侍御契丹南樞密院掌文銓部族丁賦之政凡契丹人民皆屬焉以其牙帳居大內之南故名南院元好問所謂南衙不主兵是也南院樞密使知南院樞密使事知南院樞密事南院樞密副使知南院樞密副使事同知南院樞密使事簽書南樞密院事南院都承旨南院副承旨南院林牙知南院貼黃給事南院知聖旨頭子事掌南院頭子南樞密院敞史南院郎君南樞密院通事南院掾史南樞密院中丞司北南樞密院點檢中丞司事總知中丞司事南院左中丞南院右中丞同知中丞司事南院侍御北宰相府掌佐理軍國之大政皇族四帳世預其選北府左宰相北府右宰相總知軍國事知國事南宰相府掌佐理軍國之大政國舅五帳世預其選南府左宰相南府右宰相總知軍國事知國事北大王院分掌部族軍民之政北院大王初名迭剌部夷離堇太祖分北南院太宗會同元年改夷離堇為大王知北院大王事北院太師北院太保北院司徒北院司空北院郎君北院都統軍司掌北院從軍之政令北院統軍使北院副統軍使北院統軍都監北院詳穩司掌北院部族軍馬之政令北院詳穩北院都監北院將軍北院小將軍北院都部署司掌北院部族軍民之事北院都部署北院副部署南大王院分掌部族軍民之政南院大王知南院大王事南院太師南院太保天慶八年省南院太保南院司徒南院司空南院郎君南院都統軍司掌南院從軍之政令南院統軍使南院副統軍使南院統軍都監南院詳穩司掌南院部族軍馬之政令南院詳穩南院都監南院將軍南院小將軍南院都部署司掌南院部族軍民之事南院都部署南院副部署宣徽北院太宗會同元年置掌北院御前祗應之事北院宣徽使知北院宣徽事北院宣徽副使同知北院宣徽事宣徽南院會同元年置掌南院御前祗應之事南院宣徽使知南院宣徽事南院宣徽副使同知南院宣徽事大于越府無職掌班百僚之上非有大功德者不授遼國尊官猶南面之有三公太祖以遙輦氏于越受禪終遼之世以于越得重名者三人耶律曷魯屋質仁先謂之三于越大于越大惕隱司太祖置掌皇族之政教興宗重熙二十一年耶律義先拜惕隱戒族人曰國家三父房最為貴族凡天下風化之所自出不孝不義雖小不可為其妻晉國長公主之女每見中表必具禮服義先以身率先國族化之遼國設官之實於此可見太祖有國首設此官其後百官擇人必先宗姓惕隱亦曰梯里已知惕隱司事惕隱都監夷離畢院掌刑獄夷離畢左夷離畢右夷離畢知左夷離畢事知右夷離畢事敞史選底掌獄大林牙院掌文翰之事北面都林牙北面林牙承旨北面林牙左林牙右林牙敵烈麻都司掌禮儀敵烈麻都總知朝廷禮儀總禮儀事文班司所掌未詳文班太保文班林牙文班牙署文班吏阿札割只所掌未詳遙輦故官後併樞密院阿札割只北面御帳官三皇聖人也當淳朴之世重門擊柝猶嚴於待暴客遼之先世未有城郭溝池宮室之固氈車為營硬寨為宮御帳之官不得不謹出於貴戚為侍衛著帳為近侍北南部族為護衛武臣為宿衛親軍為禁衛百官番宿為宿直奉宸以司供御三班以肅會朝硬寨以嚴晨夜法制可謂嚴密矣考其凡如左侍衛司掌御帳親衛之事侍衛太師侍衛太保侍衛司徒侍衛司空侍衛近侍局近侍直長近侍近侍小底近侍詳穩司近侍詳穩近侍都監近侍將軍近侍小將軍北護衛府掌北院護衛之事皇太后宮有左右護衛北護衛太師北護衛太保北護衛司徒總領左右護衛司總領左右護衛左護衛司左護衛太保左護衛右護衛司右護衛太保右護衛南護衛府掌南院護衛之事南護衛太師南護衛太保南護衛司徒總領左右護衛司總領左右護衛左護衛司左護衛太保左護衛右護衛司右護衛太保右護衛奉宸司掌供奉宸御之事官名未詳奉宸三班院掌左右寄班之事左班都知右班都知寄班都知三班院祗候宿衛司專掌宿衛之事總宿衛事亦曰典宿衛事總知宿衛事同掌宿衛事宿衛官禁衛局總禁衛事禁衛長宿直司掌輪直官員宿直之事皇太后宮有宿直官宿直詳穩宿直都監宿直將軍宿直小將軍宿直官宿直護衛硬寨司掌禁圍槍寨下鋪傳鈴之事硬寨太保皇太子惕隱司掌皇太子宮帳之事皇太子惕隱北面著帳官古者刑人不在君側叛逆家屬沒為著帳執事禁衛可為寒心此遼世所以多變起肘掖歟著帳郎君院遙輦痕德堇可汗以蒲古只等三族害于越室魯家屬沒入瓦里應天皇太后知國政析出之以為著帳郎君娘子每加矜恤世宗悉免之其後內族外戚及世官之家犯罪者皆沒入瓦里人戶益衆因復故名皇太后皇太妃帳皆有著帳諸局著帳郎君節度使著帳郎君司徒祗候郎君班詳穩司祗候郎君班詳穩祗候郎君直長祗候郎君閘撒狘祗候郎君祗候郎君拽剌左祗候郎君班詳穩司左祗候郎君班詳穩左祗候郎君直長左祗候郎君閘撒狘左祗候郎君左祗候郎君拽剌右祗候郎君班詳穩司右祗候郎君班詳穩右祗候郎君直長右祗候郎君閘撒狘右祗候郎君右祗候郎君拽剌筆硯局筆硯祗候郎君筆硯吏牌印局牌印郎君裀褥局裀褥郎君燈燭局燈燭郎君牀幔局牀幔郎君殿幄局殿幄郎君車輿局車輿郎君御盞局御盞郎君本班局本班郎君皇太后祗應司領皇太后諸局事知皇太后宮諸司事皇太妃祗應司皇后祗應司近位祗應司皇太子祗應司親王祗應司著帳戶司本諸斡魯𩽆戶析出及諸色人犯罪沒入凡御帳皇太后皇太妃皇后皇太子近位親王祗從伶官皆充其役著帳節度使著帳殿中承應小底局筆硯小底寢殿小底佛殿小底司藏小底習馬小底鷹坊小底湯藥小底尚飲小底盥漱小底尚膳小底尚衣小底裁造小底北面皇族帳官肅祖長子洽之族在五院司叔子葛剌季子洽禮及懿祖仲子帖剌季子裊古直之族皆在六院司此五房者謂之二院皇族玄祖伯子麻魯無後次子巖木之後曰孟父房叔子釋魯曰仲父房季子為德祖德祖之元子是為太祖天皇帝謂之橫帳次曰剌葛曰迭剌曰寅底石曰安端曰蘇皆曰季父房此一帳三房謂之四帳皇族二院治之以北南二王四帳治之以大內惕隱皆統於大惕隱司大內惕隱司掌皇族四帳之政教大內惕隱知大內惕隱事大內惕隱都監大橫帳常袞司掌太祖皇帝後九帳皇族之事橫帳常袞亦曰橫帳敞穩橫帳太師橫帳太保橫帳司空橫帳郎君橫帳知事孟父族帳常袞司掌蜀國王巖木房族之事仲父族帳常袞司掌隋國王釋魯房族之事季父族帳常袞司掌德祖皇帝三房族之事四帳都詳穩司掌四帳軍馬之事都詳穩都監將軍本名敞史小將軍橫帳詳穩司孟父帳詳穩司仲父帳詳穩司季父帳詳穩司舍利司掌皇族之軍政舍利詳穩舍利都監舍利將軍舍利小將軍舍利梅里親王國官制未詳王府近侍王府祗候大東丹國中臺省太祖天顯元年置乾亨四年聖宗省左大相右大相左次相右次相王子院掌王子各帳之事王子太師王子太保王子司徒王子司空王子班郎君駙馬都尉府掌公主帳宅之事駙馬都尉北面諸帳官遼太祖有帝王之度者三代遙輦氏尊九帳於御營之上一也滅渤海國存其族帳亞於遙輦二也併奚王之衆撫其帳部擬於國族三也有英雄之智者三任國舅以耦皇族崇乙室以抗奚王列二院以制遙輦是已觀北面諸帳官可以見之矣遙輦九帳大常袞司掌遙輦窪可汗阻午可汗胡剌可汗蘇可汗鮮質可汗昭古可汗耶瀾可汗巴剌可汗痕德堇可汗九世宮分之事太祖受位于遙輦以九帳居皇族一帳之上設常袞司以奉之有司不與焉凡遼十二宮五京皆太祖以來征討所得非受之於遙輦也其待先世之厚蔑以加矣遼俗東嚮而尚左御帳東嚮遙輦九帳南嚮皇族三父帳北嚮東西為經南北為緯故謂御營為橫帳云大常袞亦曰敞穩遙輦太師遙輦太保遙輦太尉遙輦司徒遙輦司空遙輦侍中一作世燭太宗會同元年置敞史知事遙輦帳節度使司節度使節度副使遙輦糾詳穩司遙輦糾詳穩遙輦糾都監遙輦糾將軍遙輦糾小將軍遙輦剋官名未詳大國舅司掌國舅乙室已拔里二帳之事太宗天顯十年合皇太后二帳為國舅司聖宗開泰三年又併乙室已拔里二司為一帳乙室已國舅大翁帳常袞一作敞穩乙室已國舅小翁帳常袞拔里國舅大父帳常袞拔里國舅少父帳常袞國舅太師國舅太保國舅太尉國舅司徒國舅司空敞史太宗會同元年改郎君為敞史知事國舅乙室已大翁帳詳穩司國舅詳穩國舅都監國舅本族將軍國舅本族小將軍興宗重熙五年樞密院奏國舅乙室已小翁帳敞史准大橫帳及國舅二父帳改為將軍國舅乙室已小翁帳詳穩司國舅拔里大父帳詳穩司國舅拔里少父帳詳穩司國舅夷離畢司國舅夷離畢國舅左夷離畢國舅右夷離畢敞史國舅帳剋國舅別部世宗置官制未詳國舅別部敞史聖宗太平八年見國舅別部敞史蕭塔葛渤海帳司官制未詳渤海宰相渤海太保渤海撻馬渤海近侍詳穩司奚王府乙室王府並見部族官北面宮官遼建諸宮斡魯𩽆部族蕃戶統以北面宮官具如左諸行宮都部署院總契丹漢人諸行宮之事諸行宮都部署知行宮諸部署司事諸行宮副部署諸行宮判官契丹行宮都部署司總行在行軍諸斡魯𩽆之政令契丹行宮都部署知契丹行宮都部署事契丹行宮副部署契丹行宮判官行宮諸部署司掌行在諸宮之政令行宮都部署行宮副部署行宮部署判官十二宮職名總目某宮某宮使某宮副使某宮太師某宮太保某宮侍中太宗會同元年置亦曰世燭某宮都部署司掌本宮契丹軍民之事某宮都部署某宮副部署某宮判官某宮提轄司官制未詳某宮馬羣司侍中敞史某石烈石烈縣也夷離堇本名彌里馬特本改辛袞會同元年升麻普本名達剌干會同元年改牙書會同元年置某瓦里內族外戚世官犯罪沒入瓦里抹鶻某抹里閘撒狘某得里官名未詳太祖弘義宮太宗永興宮世宗積慶宮應天皇太后長寧宮穆宗延昌宮景宗彰愍宮承天皇太后崇德宮聖宗興聖宮興宗延慶宮道宗太和宮天祚永昌宮孝文皇太弟敦睦宮文忠王府已上十二宮一府部署提轄石烈瓦里抹里得里等並見營衛志押行宮輜重夷離畢司掌諸宮巡幸扈從輜重之事夷離畢敞史
