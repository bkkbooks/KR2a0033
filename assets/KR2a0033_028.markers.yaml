  - {type: variant, offset: 2902, length: 0, content: '', WYG: 遼史卷二十八遼史卷二十八考證天慶五年秋七月按是年為宋徽宗政和五年宋史書秋七月戊辰朔日食後天慶八年為徽宗重和元年書五月壬午朔日食九年為徽宗宣和元年書夏四月丙子朔日食十年為宣和二年書冬十月戊辰朔日食遼紀並失載金主復書曰歸我上京中京興中府三路州縣按原文作上中京據金史増寜昌軍節度使劉宏以懿州户三千降金按金史亦書劉宏屬國表作劉完又金持冊使楊立忠屬國表作楊近忠均一人兩異其名今仍之遼史卷二十八考證}
