  - {type: variant, offset: 1915, length: 0, content: '', WYG: 遼史巻八遼史巻八考證景宗小字明扆按契丹志作明計以音近而譌也保寧元年斬殿前都㸃檢耶律伊勒哈按伊勒哈原文夷臘葛此又訛夷臘即係一人今併改保寧六年三月宋遣使請和遣耶律昌珠與宋議和按職官分紀開寳七年契丹涿州刺史耶律琮以書遺雄州孫全興願講好於朝廷八年契丹遣克實克舒蘇來聘自是乃通使矣與紀異又遼書昌珠而宋書琮其名亦互異遼史巻八考證}
