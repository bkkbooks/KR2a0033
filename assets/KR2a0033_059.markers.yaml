  - {type: variant, offset: 1585, length: 0, content: '', WYG: 遼史卷五十九遼史卷五十九考證以烏爾古水草豐美命諤爾琨錫林居之按太宗本紀㑹同二年十月詔北南院三錫林戸居烏爾古部此止載其一聖宗乾亨五年按乾亨無五年蓋在統和未改元以前五京戸丁之數無所於考按地理志具載戸數而鄉丁之數見於兵衛志但未免俱有遺漏耳景宗乾亨間按景宗原本作聖宗乾亨乃景宗年號統和未改元以前僅止數月本紀又不載雲威戸之詔卷内于乾亨五年之上冠以聖宗猶可云聖宗初立未改元以前事至此云乾亨間則實係景宗時事續通考載此事稱景宗今据改遼史卷五十九考證}
