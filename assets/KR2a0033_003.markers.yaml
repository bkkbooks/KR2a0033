  - {type: variant, offset: 4841, length: 1, content: 來, WYG: 来遼史卷三遼史巻三考證母淳欽皇后舒嚕氏按舒嚕氏原本作蕭氏乃述律氏之訛義宗傳及章肅帝傳誤同今併改天賛二年師次幽州符存審拒于州南縦兵邀擊大破之按綱目唐荘宗同光元年閏四月契丹圍幽州考五代歐史符存審傳云荘宗遣存審分兵救之擊走契丹正太祖天賛二年事也此云縦兵邀擊大破之記載互異天顯三年秋七月王都奏唐兵破定州塔拉死之尼嚕古扎拉等數十人被執按尼嚕古之被執適當兵敗之時事在唐明宗天成三年至定州之破塔拉之死事在唐天成四年乃天顯四年事也考塔拉綱目五代史俱作托紐綱目唐天成四年二月唐王晏球克定州王都伏誅獲托紐送大梁斬之王晏球傳云晏球既大破契丹遂攻定州久之城中食盡都與托紐謀决圍以走不果都将馬讓能以城降都自㷊死亦在天成四年二月據此則當作王都奏唐擊敗定州兵尼嚕古札拉等數十人被執至唐兵破定州塔拉死之宜書在四年二月下方為明晰今仍原文而考證之四年五月癸酉謁二儀殿原文訛作二祖殿據永樂大典及南監本改八月癸夘幸人皇王第原文幸字上衍自字據南監本刪五年六月己亥射栁于行在原文脱六月二字考遊幸表射栁部族表達魯特来貢俱係六月紀以五月統之計戊辰至己亥已三十二日則己亥上脱字無疑今增冬十月建太祖聖功碑于舒伊旺尼珠琿温按太祖紀作如迂王集㑹堝此又訛如廷正集會堝今畫一譯改十一年秋七月唐河東節度使石敬瑭遣趙瑩求救上白太后河東復遣桑維翰来告急遂許興師按資治通鑑石敬瑭遣間使求救于契丹令桑維翰草表據此則維翰草表求救未甞親往考晉高祖本紀及桑維翰傳皆無敬瑭遣維翰如契丹告急亊九月會唐将以兵来拒遂勒兵陳於太原按綱目作陳于虎北口考虎北口在今太原城汾水北冬十月甲子封敬瑭為晉王十一月丁酉冊敬瑭為大晉皇帝按資治通鑑及五代歐史皆無先封晉王事又按綱目契丹立石敬瑭為晉皇帝敬瑭割幽薊瀛莫涿檀順新媯儒武雲應寰朔蔚十六州以與契丹五代史晉紀與綱目合此紀扵冊敬瑭為大晉皇帝下不載其事而書于㑹同元年十一月考幽涿檀薊順蔚等州五代史地里志俱屬盧龍時唐尚未亡趙徳鈞方為盧龍軍節度使與敬瑭角立敬瑭即許賂契丹其勢未􅀎盡割按之情事此紀為得其實十二年春正月唐大同軍節度判官吴巒閉城拒命上親征至城下諭之巒降按五代歐史吴巒傳云巒清泰中為大同沙彦珣節度判官契丹還過雲州彦珣出城迎謁為契丹所擄城中推巒主州事巒即閉門拒守契丹以兵圍之高祖入立以雲州入扵契丹而巒猶守城不下契丹圍之凡七月高祖義巒所為乃以書告契丹使解兵去召巒為武寜軍節度副使出帝時大臣以巒前守雲中不下遣巒守貝州契丹攻貝州城破投井死本紀會同七年亦載其事此云巒降紀載失實九月遣珠勒呼使晉及南唐按通鑑綱目五月吴與契丹通使修好契丹主亦遣使報之即是役也葢遼使至江南知誥已僣位故不書吴而直書南唐耳遼史巻三考證}
