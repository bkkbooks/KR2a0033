  - {type: variant, offset: 3305, length: 0, content: '', WYG: 遼史巻二遼史卷二考證神冊五年春正月乙丑始製契丹大字按陶宗儀書史㑹要云遼太祖用漢人教以𨽻書之半増損之製契丹字數千以代刻木之約而永樂大典引紀異錄以為渤海既平乃製契丹大字三千餘言則製字應在天顯元年所紀各異天贊二年三月討叛奚呼遜獲之按呼遜原本作胡損巻三又作胡遜即係一人當屬音轉之訛今畫一改訂閏月晉王李存朂即皇帝位按五代史唐本紀書同光元年夏四月己巳皇帝即位通鑑綱目亦書夏四月晉王存朂稱皇帝扵魏州此書扵閏月之下盖契丹與唐是時尚未通好晉王即位亦未遣使来告乃作史者約畧紀事之辭耳三年春正月遣兵畧地燕南夏五月渤海殺其刺史張秀實而掠其民按通鑑所書是年契丹侵晉無虚月兵征渤海亦有月分可考乃遼史僅扵正月書畧地燕南扵五月書渤海殺刺史掠民以是知修史者遺漏之多也四年夏四月按五代歐史司天考載後唐同光三年四月癸亥朔日有食之通鑑綱目契丹志亦書之後唐同光三年即遼天贊四年也本紀扵神冊六年天贊二年兩書日食此不書者史闕畧也冬十月丁夘唐以滅梁来告即遣使報聘按唐滅梁事在天贊二年冬十月至此已及兩年考冊府元龜載後唐同光三年十月甲子差春州刺史来海金押國信賜契丹王及迴使等賜物有差盖唐與契丹舊無使命往来其通好始扵是年是以滅梁事扵是時始来告也天顯元年秋八月按五代史司天考載後唐天成元年八月乙酉朔日有食之通鑑綱目及紀異錄俱書之本紀失載二年八月丁酉𦵏太祖皇帝扵祖陵置祖州按永樂大典所載即扵本年九月葬太祖扵木葉山置州墳側名曰祖州本紀系之二年八月所記各異遼史巻二考證}
