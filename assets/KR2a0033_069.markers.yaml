  - {type: variant, offset: 223, length: 0, content: '', krp: 於後遼史卷六十九遼史卷六十九考證㑹同四年正月伊實丕勒圖吉三部上党項俘獲按本紀以伊實丕勒圖吉三部鰥寡不能自存者官為之配表與紀互異疑因是月有納喇威二部上党項俘之事而表遂牽連誤書也統和四年正月按原本此月有姪里姑部送輜重行宫之文考聖宗本紀是年六月以伊勒希巴珠勒呼部送輜重行宫珠勒呼原本作姪里姑乃人名也作史者誤解部送部字遂載入部族表中又誤以六月為五月舛謬實甚今刪此條而識其故}
  - {type: variant, offset: 224, length: 1, content: 後, WYG: 此壽隆三年正月原本此月書烏爾固部節度使耶律陳嘉努討有功按道宗本紀此月以陳嘉努有功加尚書右僕射原文所書討有功之語既未明晰况陳嘉努雖為烏爾固部節度使究非烏爾固部之事與部旋無涉仍之則體例殊為不符謹删遼史卷六十九考證}
