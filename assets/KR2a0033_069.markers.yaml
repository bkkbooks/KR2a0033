  - {type: variant, offset: 223, length: 0, content: '', WYG: 於後遼史卷六十九遼史卷六十九考證㑹同四年正月伊實丕勒圖吉三部上党項俘獲按本紀以伊實丕勒圖吉三部鰥寡不能自存者官為之配表與紀互異疑因是月有納喇威二部上党項俘之事而表遂牽連誤書也統和四年正月按原本此月有姪里姑部送輜重行宫之文考聖宗本紀是年六月以伊勒希巴珠勒呼部送輜重行宫珠勒呼原本作姪里姑乃人名也作史者誤解部送部字遂載入部族表中又誤以六月為五月舛謬實甚今刪此條而識其故}
