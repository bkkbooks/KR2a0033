  - {type: variant, offset: 6661, length: 0, content: '', WYG: 遼史巻四遼史卷四考證㑹同元年二月丙午丙午原本作丙申按丙申應在丁酉戊戌之上據下文丁未考之當係丙午今改正夏四月耶律羅卜科奏党項㨗羅卜科原本作魯不古列傳同此與卷三之盧不姑本卷後之魯不姑係一人而音轉岐誤今併改為羅卜科十一月丙寅改元會同按此為天顯十二年十一月事五代歐史載契丹改天顯十一年為會同元年係誤二部特哩衮為司徒特哩衮原本作梯里已按本史百官志惕隠亦曰梯里已今併改為特哩衮四年二月丙午丙午原本作丙子按上正月書丙子則二月不得復有丙子以上甲辰下丁巳計之應係丙午今㩀永樂大典改秋七月尼固察奏晉遣使至朔令降原本晉訛請今㩀永樂大典改五年春正月晉以朔州平遣使来賀原本遣訛請今據永樂大典改三月晉遣齊州防禦使宋暉業来問起居按宋暉業五代薛史作宋光鄴此避太宗諱五月五日戊子戊子原本作戊午以上四月甲寅朔考之則五月五日應係戊子今據永樂大典改秋七月晉遣判四方館事朱崇節来謝朱崇節按五代史作宋崇節十一月己未按本史厯象志是年十一月係辛巳朔計辛巳距己未三十九日十一月内不應有己未日係誤八年三月戊午戊午原本作戊子按三月内不應有戊子以上庚戌下己未計之應係戊午今改正九年五月晉易州戍将孫方簡請内附孫方簡按五代歐史作孫方諌十一月先鋒候騎報晉兵至先鋒原本作先遣據永樂大典改杜重威遣貝州節度使梁漢璋率衆来拒貝州節度使原本作其将節度使據永樂大典改宋彦筠墮水死按資治通鑑載晉兵與契丹夹滹沱而軍晉軍爭橋不勝杜重威遣王清與宋彦筠俱進清戰甚銳契丹以新兵繼之清及士卒皆死彦筠戰敗浮水抵橋得免冊府元龜載王清従杜重威北征至中渡槗清為先鋒開橋奪路重威遣宋彦筠與俱彦筠尋退走清酣戰不息與其下俱没焉五代歐史亦書彦筠退走王清力戰而死又按通鑑是年十二月契丹遥以兵環晉營軍中食盡杜重威與李守貞宋彦筠謀降契丹又按陶岳五代史補云後漢乾祐中宋彦筠為鄭州節度使據此則王清戰死而宋彦筠之未死明矣此書彦筠墮水死盖當時因其墮水遂誤以為死耳監軍富珠哩原本作傅桂兒他巻又作傅住兒今據五代歐史併改大同元年春正月降重貴為崇祿大夫按五代薛史作光祿大夫此避太宗諱太妃安氏原本缺太字安字今據永樂大典增遼史巻四考證}
