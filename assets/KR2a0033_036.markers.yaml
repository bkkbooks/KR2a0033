  - {type: variant, offset: 1876, length: 0, content: '', WYG: 遼史卷三十六遼史卷三十六考證臨潢府宣化縣丁四千按地理志宣化縣戸四千今丁數亦係四千考史文前後無一户一丁者恐誤臨潢府按地志臨潢所属尚有渤海興仁二縣兵衛志不載丁數其他州府属縣未載者尚多葢或係後来析置或丁籍散失史不能詳也慶州𤣥徳縣按原本訛𤣥寧今據地理志改鳯州丁一千按地理志鳯州户四千丁數不應僅止一千疑誤東京遼陽府統縣六轄軍府州城二十六有丁四萬一千四百按地理志遼陽府統縣九轄軍府州城八十七此作統縣六轄軍府州城二十六葢僅據丁籍可見者而二十六之數又復不符其所載丁數與下文總計亦不合興州丁三千按地理志興州户二百丁數不應至三千之多疑誤南京析津府統縣十按地理志析津府統縣十一此云十誤也其丁數亦與下文不合涿州歸義縣丁八萬按地理志歸義縣户四千丁數亦不應至八萬之多疑誤大同府天成縣按原本訛天域今據地理志改邉境戍兵計正兵二萬二千按上文所載正兵數止二萬一千遼史卷三十六考證}
