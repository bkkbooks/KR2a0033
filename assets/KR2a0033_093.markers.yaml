  - {type: variant, offset: 2473, length: 0, content: '', WYG: 遼史卷九十三遼史卷九十三考證蕭惠傳十七年尚帝姊秦晉國長公主拜駙馬都尉按帝字原本誤作弟今據𢎞簡録改蕭托雲傳十九年總領西北路軍事後以本路兵伐甘州降其酋長伊蘭按聖宗本紀統和二十六年蕭托雲奏討甘州回鶻降其王耶剌里撫慰而還此處原本稱降其酋長牙懶即此事也牙懶與耶剌里俱係音近之譌今畫一改總論内都勒斡高情雅韻都沁雖廉不逮蕭惠而無邀功啟釁之罪亦庶乎君子之風矣按都勒斡高情雅韻等句原本作鐸軫高情雅韻鐸盧斡雖廉不逮惠而無邀功啟釁之罪考高情雅韻係都勒斡傳中語都沁傳無此四字蓋都勒斡原本作鐸盧斡都沁原本作鐸軫兩名俱有鐸字遂至互易其名而誤也今據傳改正遼史卷九十三考證}
