  - {type: variant, offset: 4074, length: 0, content: '', WYG: 伊勒希巴敞史遼史卷四十五遼史卷四十五考證百官志一北院臣長𤼵按遼志官有契丹樞密院及行宫都總官司謂之北院以其在牙帳之北以主蕃事大惕隐臣長發按遼志惕隐宗正寺也}
