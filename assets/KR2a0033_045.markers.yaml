  - {type: variant, offset: 4079, length: 0, content: '', WYG: 臣長𤼵按遼志佐吏則有敞史本古思奴古都奴古徒奴古敞史見于百官志其思奴古國語解謂官與敞史相近徒奴古國語解謂邊徼外小國而本古都奴古未詳其義要之皆佐吏之類也大林牙臣長𤼵按遼志林牙翰林學士也遼史卷四十五考證}
