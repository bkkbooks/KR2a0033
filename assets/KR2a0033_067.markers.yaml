  - {type: variant, offset: 243, length: 0, content: '', WYG: 遼史卷六十七遼史卷六十七考證五世祖哈瑪爾北府宰相達魯按哈瑪爾為大父房最逺祖距達魯五世中間不可考原本列入第一世而以達魯為第二世實非父子也見達魯傳北院樞密使惠西北招討使慈氏努按蕭惠傳惠二子一為慈氏努其一為兀古匿終北府宰相表于慈氏努之次並未列入轉於下二格之旁列乙古蒲匿二名疑即兀古匿之訛然紀傳無可旁證今存其舊仍譯改為伊庫布尼二名以符體例使相薩瑪蘭陵郡王徳勒岱茂薩薩瑪原本作撒磨按徳勒岱傳又作撒鉢茂薩原本作磨撒按本傳又作麽撒今畫一改訂宰相塔喇按蕭迪里傳迪里為塔喇四世孫表未列入而轉列和克及巴拉名按和克為迪里族子乃塔喇之五世孫巴拉為迪里弟乃和克之父行又不應與和克平列舛訛叠出今附考以識其訛南院樞密使朴按蕭朴子多喇官國舅部詳衮見朴傳表未列入殊畧遼史卷六十七考證}
