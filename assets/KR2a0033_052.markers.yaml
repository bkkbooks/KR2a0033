  - {type: variant, offset: 3615, length: 0, content: '', WYG: 遼史卷五十二遼史卷五十二考證受冊儀奏衙内無事按禮志載禮儀畢輒報閤門無事此獨書衙内續通考載此儀云奏衙門内事疑俱係閤門之訛謹仍其舊而附證于此納后儀按原本國語解凡納后即族中選尊者一人當奥而坐以主其禮謂之奥姑送后者拜而致敬謂之拜奥禮志所載向當奥者三拜云云即拜奥禮也第考聖宗本紀統和十二年九月行拜奥禮又興宗本紀重熙五年五月幸北院大王帳拜奥二者皆無納后事據此則拜奥禮疑不專為納后也公主下嫁儀按興宗本紀重熙十六年定公主行婦禮于舅姑儀惜志不載遂無可考遼史卷五十二考證}
