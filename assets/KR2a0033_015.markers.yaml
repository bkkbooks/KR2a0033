  - {type: variant, offset: 4794, length: 0, content: '', WYG: 遼史卷十五遼史卷十五考證聖宗紀六開㤗元年八月己未髙麗王詢遣田拱之奉表稱病不能朝詔復取六州地按六州地史未詳其名考通鑑初以鴨緑江北予髙麗甞築六城至是復取之開㤗四年夏四月甲寅蕭迪里等伐髙麗還按通鑑綱目契丹遣迪里討髙麗髙麗與女直設竒邀擊契丹大敗而還此不書敗諱之也五月辛巳命北府宰相劉晟為都統樞密使耶律世良為副殿前都㸃檢蕭屈烈為都監以伐髙麗按遼史髙麗傳劉晟作慎行蕭屈烈作蕭虚烈遼史卷十五考證}
