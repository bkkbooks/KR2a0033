  - {type: variant, offset: 2023, length: 0, content: '', WYG: 遼史卷七遼史巻七考證應厯十四年五月射鹿于白鷹山六月獵于玉山八月如磑子嶺呼鹿射之按遊幸表是年五月獵于玉山射鹿于白嶺山六月射鹿于格徳泉今本紀獵玉山在六月而格徳泉射鹿在五月又以白嶺山為白鷹山又呼鹿射之表在七月不言磑子嶺而附綴赤山射鹿之後與本紀均互異考表與本紀往往不符其是非未可臆斷並兩存之後倣此應厯十五年三月五坊人四十戸叛入烏爾古四月小黄室韋叛六月徳哷勒來降七月烏爾古掠上京按部族表五坊人之叛在二月小黄室韋之叛徳哷勒之降及烏爾古掠上京等事較本紀所載均先一月應厯十九年三月遣韓知範冊漢劉繼元為皇帝按五代史作韓知璠遼史巻七考證}
