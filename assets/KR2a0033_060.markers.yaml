  - {type: variant, offset: 1781, length: 0, content: '', WYG: 遼史卷六十遼史卷六十考證聖宗統和初燕京留守司請弛居庸關稅按聖宗紀備載于元年九月是年六月已改元統和此事自應繫之統和原作乾亨間誤今改禁諸路不得貨銅鐵按道宗紀清寧八年禁南京貨鐵九年禁鬻銅自係兩事原本訛銅鐵為銅錢今改西夏室韋各三百匹案契丹志夏國歲貢細馬二十匹麤馬二百匹駝百匹與此異遼史卷六十考證}
