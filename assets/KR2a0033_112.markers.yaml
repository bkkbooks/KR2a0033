  - {type: variant, offset: 2030, length: 132, content: 滑哥字斯懶隋國王釋魯之子性陰險初烝其父妾懼事彰與剋蕭臺哂等共害其父歸咎臺哂滑哥獲免太祖即位務廣恩施雖知滑哥兇逆姑示含忍授以惕隱六年滑哥預諸弟之亂事平羣臣議其罪皆謂滑哥不可釋於是與其子痕只俱陵遲而死勅軍士恣取其產帝曰滑哥不畏上天反君弒父其惡不可言諸弟作亂皆此人教之也, WYG: 遼史卷一百十二}
