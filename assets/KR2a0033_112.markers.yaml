  - {type: variant, offset: 812, length: 0, content: '', WYG: 華格字薩蘭隋國王實嚕之子性隂險初烝其父妾懼事彰與剋蕭特依順等共害其父歸咎特依順華格獲免太祖即位務廣恩施雖知華格兇逆姑示含忍授以特哩衮六年華格預諸弟之亂事平羣臣議其罪皆謂華格不可釋於是與子罕札俱凌遲而死勅軍士恣取其産帝曰華格不畏上天反君弑父其惡不可言諸弟作亂皆此人敎之也}
