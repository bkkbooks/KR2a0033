  - {type: variant, offset: 3512, length: 0, content: '', WYG: 遼史卷七十一遼史卷七十一考證后妃傳徳祖宣簡皇后蕭氏天顯八年崩按本紀太祖立尊母蕭氏為皇太后太宗立尊皇太后為太皇太后天顯八年十一月辛丑太皇太后崩遣使告哀於唐及人皇王貝原本作十一年崩係誤今據改世宗懐節皇后蕭氏天祿四年立為皇后明年秋察克作亂弑太后及帝按本紀世宗在位五年皇后蕭氏於天祿四年冊立世宗遇弑在天祿五年原本作天祿末下接明年文義未明今據改八年秋帝悔之八年原本作六年據興宗本紀改天祚元妃蕭氏小字貴格皇后之妹皇后之妹原本作燕國妃之妹按天祚元妃乃天祚皇后之妹考天祚皇后傳云大安四年封燕國王妃又天祚徳妃傳云夀隆二年封燕國妃此但書燕國妃之妹殊未明晰今據改遼史卷七十一考證}
