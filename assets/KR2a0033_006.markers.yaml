  - {type: variant, offset: 2282, length: 2, content: 曷主, WYG: 和卓遼史巻六遼史巻六考證穆宗紀一應厯四年周攻漢命政事令耶律達魯援之按資治通鑑稱是年北漢入冦請兵于契丹契丹遣其武定節度使政事令楊衮將萬餘騎如晉陽據此則契丹所遣者楊衮而遼史則為耶律達魯豈達魯本是楊衮而獲賜姓者耶九年夏四月周拔益津瓦橋淤口三關五月乙巳朔䧟瀛莫二州辛未周兵退按資治通鑑周世宗之拔三關得莫州在四月而瀛州之降乃在五月朔其退兵于五月壬子遼史記䧟瀛莫二州于五月朔辛未周兵即退俱有誤遼史巻六考證}
