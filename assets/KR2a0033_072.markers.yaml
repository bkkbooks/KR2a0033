  - {type: variant, offset: 2868, length: 0, content: '', WYG: 遼史卷七十二遼史卷七十二考證宗室傳義宗傳小字托雲原本作圖欲五代歐史作突欲皆係音近之訛今併改善畫本國人物如射獵雪騎千鹿圖原本射字下衍騎字今刪五子長世宗次羅和稍隆先道隱按羅和入逆臣傳見卷一百十二目錄失載稍封吳王見景宗本紀而無傳原本稱各有傳係誤今刪順宗傳伊遜陰遣人殺之後知其寃原本後知其寃句上衍州字今刪遼史卷七十二考證}
