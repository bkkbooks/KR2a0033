  - {type: variant, offset: 3059, length: 0, content: '', WYG: 遼史卷十四遼史卷十四考證聖宗紀五統和十七年秋七月伐宋冬十月癸酉攻遂城不克次瀛州與宋軍戰擒其將康昭裔宋順按康昭裔通鑑内作康保裔㨿通鑑説則保裔乃戰死将真宗優詔贈恤錄其子孫㨿遼史則昭裔已就擒後且以為昭順軍節度使二者未知孰是十八年春正月還次南京按宋通鑑契丹知帝親征縦掠而去然則聖宗之還次南京因宋真宗之親征而遼史諱之也二十二年閏九月丙寅遼師與宋兵戰于唐興按續通鑑唐興作唐河二十三年十二月丙申宋遣周漸等來賀千齡節丁酉復遣張若谷等賀正旦按周漸之使宋史不載而正旦所遣乃韓國華也此云張若谷與宋史異遼史卷十四考證}
