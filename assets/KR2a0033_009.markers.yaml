  - {type: variant, offset: 1949, length: 0, content: '', WYG: 遼史巻九遼史巻九考證保寧九年七月宋遣使來聘按續通鑑綱目契丹遣耶律敞如宋㑹塟宋遣辛仲甫報之考契丹國志敞官鴻臚少卿遼史不書㑹塟之使又續資治通鑑長編宋史起居舍人辛仲甫如契丹右贊善大夫穆波副之又契丹志帝欲留仲甫仲甫不可厚禮遣還此失載宋史姓名乾亨元年十月韓匡嗣與宋兵戰于滿城敗績按契丹志秋九月攻鎮州為宋趙延進所敗考之李燾長編此即滿城之戰亦作九月俱與此異景宗在位十四年按原本訛十三年今改遼史巻九考證}
