  - {type: variant, offset: 5700, length: 1, content: 德, WYG: 徳遼史卷五十三遼史卷五十三考證應聖節宋遣使來賀生辰正旦始制此儀按太宗本紀天顯十二年皇太后永寧節晉及諸國來賀㑹同四年詔以永寧天授二節及正旦重午冬至臘並受賀著為令是賀皇太后儀不始自興宗也至聖宗本紀統和二十三年宋使來賀太后生辰則宋使來賀之儀亦不應自應聖節始制立春儀按韓琦安陽集有使契丹謝春槃戴勝狀據此則遼于立春日亦賜諸國使臣幡勝矣藏􅍐儀按遊幸表開泰八年十二月幸秦晉長公主第作藏􅍐宴據此則志所云太康十年十二月二十二日始行是儀者疑有誤然考道宗本紀太康十年雖無作藏􅍐儀之文而聖宗本紀開泰八年亦不書幸秦晉長公主第事表志互異他書均無可考謹附識之遼史卷五十三考證}
