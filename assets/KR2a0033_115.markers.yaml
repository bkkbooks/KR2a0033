  - {type: variant, offset: 4403, length: 0, content: '', WYG: 遼史卷一百十五遼史卷一百十五考證高麗傳自太祖皇帝神冊間高麗遣使進寶劍按遼太祖本紀高麗進寶劍在九年是時尚未建元九年之明年始稱神冊元年此似紀年之誤聖宗統和十二年入貢原文訛十三年今據聖宗本紀改開泰四年命北府宰相劉慎行為都統劉慎行按聖宗紀作劉晟咸雍七年原文無咸雍二字按道宋本紀清寧間俱不紀高麗入貢至咸雍七年始來貢八年又入貢賜以佛經一藏據此則為咸雍無疑也太康九年八月王徽薨按宋史及通考王徽卒子勲嗣百日卒弟運嗣四年卒子堯嗣未幾卒世叔父熙嗣避遼諱改名顒顒卒子俁嗣是王運非勲子運子昱又名堯顒非昱子顒初名熙也紀内所載多與二書不合西夏傳每家自置一帳團練使以上帳弓各一箭五百馬一原文每家自置一家於義無解據宋史一家號一帳則下家字為帳字之誤又原文張弓矢各一馬五百匹按宋史張作帳箭五百馬一今並據宋史改正統和九年遣知白來謝封冊李知白按聖宗本紀作杜白又高麗紀統和十三年遣李知白來貢二國使臣同名而此處又與夲紀互異定難軍節度使李繼捧來附按繼捧未嘗附契丹蓋繼遷之誤繼遷子徳明按宋史夏國傳繼遷子徳明未嘗改名德昭遼史前稱繼遷子德明後連云德昭應係傳寫之訛重熙十三年六月準布子烏巴執元昊按興宗紀李元昊來援叛黨準布長烏巴執元昊遣使來援斡里噶拉來與傳云執昊互異招討使耶律迪魯固按興宗紀作敵魯古此又作敵古今畫一改遼史卷一百十五考證}
