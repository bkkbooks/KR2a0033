  - {type: variant, offset: 2572, length: 0, content: '', WYG: 遼史卷二十三遼史卷二十三考證十年按通鑑是年為宋神宗熙寧七年二月遼使蕭禧來議疆事遣太常少卿劉忱報之八年三月蕭禧復來遣知制誥沈括報之七月以王安石言詔韓縝如河東割地七百里以畀遼遂為異日興兵之端契丹國志蕭禧作蕭扈書此事時日皆同而紀皆失載謹附識太康三年壬午殺宣徽使托卜嘉等二人乙酉殺耶律托卜嘉及其弟辰瑠按蕭托卜嘉耶律托卜嘉二人同名同死一事考蕭托卜嘉傳未嘗為宣徽使耶律托卜嘉傳則以宣徽使見殺是死於壬午者為耶律托卜嘉乙酉所殺者為蕭托卜嘉不應為耶律托卜嘉也苐二人傳無日可考今仍其舊而訂正之遼史卷二十三考證}
