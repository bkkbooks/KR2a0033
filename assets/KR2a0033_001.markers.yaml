  - {type: variant, offset: 4140, length: 0, content: '', WYG: 遼史巻一遼史巻一考證太祖字安巴堅徳祖皇帝長子按北庭雜紀太祖父諱斡里遼史不載明年秋七月以兵四十萬伐河東代北原文作河北永樂大典作代北考兵衛志太祖授徳哷勒部額爾竒木明年總兵四十萬伐代北克郡縣九俘九萬五千口與大典符今據改二年河東李克用卒子存朂襲遣使弔慰原本克用下脱卒字今據通鑑増三年二月丁酉朔梁遣郎公逺来聘按資治通鑑梁開平元年五月契丹遣其臣袍笏美稜来通好帝遣太府少卿高頎報之二年五月契丹遣使隨高頎入貢且求冊命帝復遣司農卿渾特賜以手書是契丹聘梁二年中連有二使遼史不書此特書梁遣郎公逺来聘是梁之專使非報使也修史者各自尊其本國故凡書聘之例如此五年夏五月皇弟埓克特爾格伊徳實安圗謀反按特爾格原文作迭剌考皇子表係徳祖第三子本卷後又作迭剌哥或作迭烈哥即一人也今畫一譯改七年夏四月命北宰相蕭達魯為先鋒按達魯原文作迪里古考本卷四年以蕭達魯為北府宰相本傳云達魯字達年拜北府宰相埓克作亂達魯率輕騎追之至榆河獲埓克以獻據此則此迪里古與下文迪里古以輕兵薄之及遣北宰相達年率驍騎先渡名字互見皆達魯也今俱従敵魯譯改達魯蕭達魯以輕兵薄之其弟阿古齊臨陣射數十人斃按阿古齊原文作遏古只互考本傳及蕭達魯傳云阿古齊與達魯總腹心部埓克北走與達魯追擒扵榆河神冊初敗周徳威軍三年以功拜北府宰相據此則此遏古只與本卷後之阿骨只皆係一人今俱改為阿古齊神冊元年春二月丙戌朔耶律嚇嚕等率百僚請上尊號按嚇嚕原文作葛魯南監本作曷魯考嚇嚕本傳請建元率百官上尊號正與此合今俱従曷魯譯改赫嚕百僚請上尊號三表乃允按綱目契丹稱帝改元在梁主瑱貞眀二年十二月即神冊元年十二月也此作二月與綱目互異大赦建元神冊按薛居正五代史不記安巴堅建元事自耶律德光方記天顯之名疑當時未得其傳故也八月拔朔州擒節度使李嗣本按資治通鑑契丹主安巴堅自麟勝攻晉蔚州破之虜振武節度使李嗣本注麟勝至蔚州中間懸隔雲朔蔚州恐當作朔州據此則遼史書朔州可正通鑑之誤三年冬十二月戊午以裕悦赫嚕弟裕勒沁為徳哷勒部額爾竒木按裕勒沁原文作汗里軫考耶律迪里傳迪里字裕勒沁原文作兀里軫神冊三年命為徳哷勒部額爾竒木又本紀天賛二年徳哷勒部額爾竒木迪里徇山西地本傳亦載其事據此則汗字汙字之訛汙兀音近今従兀里軫譯改裕勒沁遼史巻一考證}
