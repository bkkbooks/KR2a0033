  - {type: variant, offset: 2010, length: 0, content: '', WYG: 遼史卷七十四遼史卷七十四考證康黙記傳神冊五年為皇都伊勒希巴按太祖紀天顯元年遣額爾奇木康黙記攻長嶺府是黙記以伊勒希巴又為額爾奇木傳失載天祿五年六月河東使請行冊禮按世宗本紀天祿五年六月劉崇為周所攻稱姪乞援且求封冊帝遣使冊為漢帝原本訛作三年今據改韓知古傳遷政事令按百官志政事令太祖所置官興宗重熈十三年始改中書省韓知古之為令在太祖時則政事令也原本訛作中書今據改匡嗣傳旣而遥授晉昌軍節度使乾亨二年改西南面招討使卒按景宗紀乾亨元年匡嗣遥授晉昌軍節度使降封秦王傳失載其改西南面招討使紀作三年與傳亦互異德源傳保寧間官崇義興國二軍節度使保寧原本作統和按德源以乾亨初卒乾亨為景宗年號統和爲聖宗年號卒在先而事反在後矣又考德源父子兄弟俱早侍景宗邸其弟德讓德威德凝遷擢俱始於保寧德崇之子制心統和中亦為刺史德源為長兄不應於聖宗朝始仕其為保寧之訛無疑今據改德凝傳統和中累遷䕶衞太保都宫使崇義軍節度使統和原本作開泰考聖宗紀統和三年德凝由彰武軍節度使為崇義軍節度使又屬國表統和十九年西南面招討奏党項之㨗而佚其名以事考之當卽德凝則開泰當為統和今據改遼史卷七十四考證}
