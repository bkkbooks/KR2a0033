  - {type: variant, offset: 2453, length: 0, content: '', WYG: 遼史卷三十三遼史卷三十三考證營衛志下㑹同二年命居烏爾古之地居原本作以按太宗本紀㑹同二年以烏爾古部水草肥美詔北南院徙三户居之伊實巴勒其一也今據改會同元年更額爾奇木爲大王會同元年原本作二年按太宗本紀升北南院及伊實部額爾奇木爲王係元年事今據改統和中又改節度使𨽻北府屬西北路招討司按兵衛志丕勒部𨽻南府屬西南路招討司此志互異或其未改節度使時本屬南府兵衛志所載則從其初也天贊二年有東巴爾斯呼遜者拒命太祖滅之天贊二年原本作八年按太祖本紀天贊祗四年無八年滅呼遜置托輝部係二年事今據改德哷勒達勒達部原本作迭剌迭達部按兵衛志又作迭達迭剌部今併改揚結部原本作窈介他卷又作窈爪今併改珠展達嚕噶部原本作术哲達魯虢按兵衛志作术者達魯虢今併改南唐古部聖宗置𨽻北府按兵衛志南唐古部附在南府與此互異巴爾斯布古德部布古德原本作鼻骨德兵衛志作鼻古德百官志又作鼻骨無德字今併改遼史卷三十三考證}
