  - {type: variant, offset: 3644, length: 0, content: '', WYG: 遼史卷十遼史巻十考證聖宗即位之十二月戊午按厯象志朔考是年十二月戊午係朔日統和元年二月以特哩衮華格為北院大王按華格傳華格以平宋功遷北院大王事在統和四年統和元年四月幸公主和克丹第按和克丹原文胡骨典公主表作和骨典此處又訛胡克典今併改統和元年六月大赦改元統和按續通鑑改元統和復國號大契丹紀不書復國號事統和二年二月彰德軍節度使蕭達林來朝按達林原文撻凛又作闥覧本紀統和七年以前俱作闥覧十二年以後俱作撻凛實係一人考本傳作撻凛今畫一改統和二年四月宣徽使同平章事蕭布琳獻女直捷按布琳姓蕭氏原文作普領又作蒲寜又作普寜至此處并訛其姓為耶律遂與北院大王耶律普努寜原文普奴寜又作蒲奴寜者相混二人史皆無傳均見于聖宗本紀布琳自統和元年正月初見為宣徽使至七年四月率兵備宋凡十見其官始終以宣徽使稱普努寜自統和元年正月至四年十二月本紀凡八見其官始終以北院大王稱今並分别改正惟二年十月以歸化州刺史耶律普寜為彰德軍節度使又别是一人今仍原文統和二年六月己卯朔按宋史是年六月庚辰朔統和二年十一月壬子按原本壬子上衍冬字上文已於十月標明今刪統和二年十二月耶律瑤昇大内特哩衮按瑤昇即耶律善補之字見本傳統和三年八月駙馬都尉蕭恒德為監軍按蕭恒德統和元年尚越國公主原本訛恒德為懇德今改統和三年閏九月駐蹕東古山按遊幸表作東右山遼史巻十考證}
