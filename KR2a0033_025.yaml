body:
  text: 遼史卷二十五本紀第二十五道宗五三年春正月乙卯如魚兒濼甲戌出錢粟振南京貧民仍復其租賦己卯大雪二月丙戌發粟振中京饑甲辰以民多流散除安泊逃戶徵償法三月乙卯高麗遣使來貢己未免錦州貧民租一年甲戌免上京貧民租如錦州庚辰女直貢良馬夏四月戊子賜中京貧民帛及免諸路貢輸之半丙申賜隈烏古部貧民帛庚子如涼陘甲辰南府宰相王績薨乙巳詔出戶部司粟振諸路流民及義州之饑五月庚申海雲寺進濟民錢千萬秋七月丙辰獵黑嶺丁巳出雜帛賜興聖宮貧民庚午大雨罷獵丁丑秦越國王阿璉薨九月乙亥駐蹕匣魯金冬十月庚辰以參知政事王經為三司使壬辰罷節度使已下官進珍玩癸卯追封秦越國王阿璉為秦魏國王十一月甲寅以惕隱耶律坦同知南京留守事遼興軍節度使耶律王九為南府宰相十二月己卯朔以樞密直學士呂嗣立參知政事四年春正月庚戌如混同江甲寅太白晝見甲子五國部長來貢庚午免上京逋逃及貧戶稅賦甲戌以上京南京饑許良人自鬻丁丑曲赦西京役徒二月己丑如魚兒濼甲午曲赦春州役徒終身者皆五歲免己亥如春州赦泰州役徒三月乙丑免高麗歲貢己巳振上京及平錦來三州饑夏四月己卯振蘇吉復淥鐵五州貧民並免其租稅甲申振慶州貧民乙酉減諸路常貢服御物丁酉立入粟補官法癸卯西幸召樞密直學士耶律儼講尚書洪範五月辛亥命燕國王延禧寫尚書五子之歌乙卯振祖州貧民丁巳詔免役徒終身者五歲免之己未振春州貧民丙寅禁挾私引水犯田六月庚辰駐蹕散水原丁亥命燕國王延禧知中丞司事以同知南院樞密使事耶律聶里知右夷離畢知右夷離畢事耶律那也同知南院樞密使事庚寅北院樞密使耶律頗德致仕秋七月戊申曲赦奉聖州役徒丙辰遣使冊李乾順為夏國王庚申如秋山己巳禁錢出境八月庚辰有司奏宛平永清蝗為飛鳥所食庚寅謁慶陵冬十月丁丑獵遼水之濱己卯駐蹕藕絲淀癸未免百姓所貸官粟己丑知北院樞密使事耶律阿思封漆水郡王癸巳以乙室大王耶律敵烈知西北路招討使事權知西北路招討使事蕭朽哥知乙室大王事壬寅詔諸部長官親鞫獄訟十一月庚申興中府民張化法以父兄犯盜當死請代皆免十二月戊寅南府宰相耶律王九致仕癸未以孟父敞穩耶律慎思為中京留守閏十二月癸卯朔預行正旦禮丙午如混同江五年春正月癸未如魚兒濼甲午高麗遣使來貢三月癸酉詔析津大定二府精選舉人以聞仍詔諭學者當窮經明道夏四月甲辰以知奚六部大王事涅葛為本部大王壬子獵北山甲子霖雨罷獵五月丁亥駐蹕赤勒嶺己丑以阻卜磨古斯為諸部長癸巳回鶻遣使貢良馬己亥以同知南院樞密使事耶律那也知右夷離畢事左祗候郎君班詳穩耶律涅里知北院大王事六月甲寅夏國遣使來謝封冊壬戌以參知政事王言敷為樞密副使前樞密副使賈士勳參知政事兼同知樞密院事秋七月庚午獵沙嶺九月辛卯遣使遺宋鹿脯壬辰駐蹕藕絲淀冬十月乙巳以新定法令太煩復行舊法庚申以遼興軍節度使何葛為乙室大王十一月丁卯朔燕國王延禧生子大赦妃之族屬進爵有差六年春正月如混同江二月辛丑駐蹕雙山三月辛未女直遣使來貢夏四月丁酉東北路統軍司設掌法官庚子以同知南院樞密使事耶律吐𩽆知左夷離畢事五月壬辰駐蹕散水原六月甲寅遣使決五京囚秋七月丙子如黑嶺冬十月丁酉駐蹕藕絲淀十一月壬戌高麗遣使來貢己巳以南府宰相竇景庸為武定軍節度使是年放進士文充等七十二人七年春正月壬戌如混同江二月己亥駐蹕魚兒濼壬寅詔給渭州貧民耕牛布絹三月丙戌駐蹕黑龍江夏四月丙辰以漢人行宮副部署耶律谷欲知乙室大王事五月己未朔日有食之六月甲午駐蹕赤勒嶺己亥倒塌嶺人進古鼎有文曰萬歲永為用辛丑回鶻遣使貢方物癸卯以權知東京留守蕭陶隗為契丹行宮都部署丁未端拱殿門災秋七月戊午朔回鶻遣使來貢異物不納厚賜遣之八月庚寅以霖雨罷獵壬寅幸慶州謁慶陵九月丙申還上京己亥日本國遣鄭元鄭心及僧應範等二十八人來貢冬十月辛巳命燕國王延禧為天下兵馬大元帥總北南院樞密使事十一月庚子如藕絲淀甲子望祀木葉山八年春正月乙酉如山榆淀乙未阻卜諸長來降三月己亥駐蹕撻里捨淀丁未曲赦中京蔚州役徒夏四月乙卯阻卜長來貢丁丑獵西山惕德酋長胡里只來附五月甲辰駐蹕赤勒嶺六月乙丑夏國為宋侵遣使乞援秋七月丁亥獵沙嶺九月乙巳駐蹕藕絲淀丁未日本國遣使來貢冬十月庚戌朔遣使遺宋鹿脯丙辰振西北路饑辛酉阻卜磨古斯殺金吾吐古斯以叛遣奚六部禿里耶律郭三發諸蕃部兵討之壬申南府宰相王經薨戊寅以左夷離畢耶律涅里為彰聖軍節度使十一月戊子以樞密副使王是敦兼知樞密院事權參知政事韓資讓參知政事漢人行宮都部署奚回離保知奚六部大王事丁酉以通州潦水害稼遣使振之戊申北院大王合魯薨是年放進士冠尊文等五十三人九年春正月庚辰如混同江二月磨古斯來侵三月西北路招討使耶律阿魯掃古追磨古斯還都監蕭張九遇賊與戰不利二室韋拽剌北王府特滿羣牧宮分等軍多陷沒夏四月乙卯興中府甘露降遣使祠佛飯僧癸酉獵西山六月丁未朔駐蹕散水原庚申以遼興軍節度使榮哥為南院大王知左夷離畢事耶律吐𩽆為左夷離畢秋七月辛卯如黑嶺壬寅遣使賜高麗羊九月癸卯振西北路貧民冬十月庚戌有司奏磨古斯詣西北路招討使耶律撻不也僞降既而乘虛來襲撻不也死之阻卜烏古札叛達里底拔思母並寇倒塌嶺壬子遣使籍諸路兵癸丑以南院大王特末同知南京留守事命鄭家奴率兵往援倒塌嶺甲寅駐蹕藕絲淀以左夷離畢耶律禿𩽆圍場都管撒八並為西北路行軍都監乙卯詔以馬三千給烏古部丙辰有司奏阻卜長轄底掠西路羣牧丁巳振西北路貧民己未燕國王延禧生子肆赦妃之族屬並進級壬戌以樞密直學士趙廷睦參知政事兼同知南院樞密使事癸亥烏古敵烈統軍使蕭朽哥奏討阻卜等部捷甲子宋遣使告其母后曹氏哀即遣使弔祭己巳詔廣積貯以備水旱十一月辛巳特抹等奏討阻卜捷十二月丙辰宋遣使以母后遺留物來饋十年春正月如春水癸未惕德來貢戊子烏古扎等來降達里底拔思母二部來侵四捷軍都監特抹死之二月甲辰以破阻卜賞有功者丙午西南面招討司奏討拔思母捷癸丑排雅僕里同葛虎骨僕果等來降達里底來侵三月壬申朔日有食之山北路副部署蕭阿魯帶奏討達里底捷夏四月壬寅朔惕德萌得斯老古得等各率所部來附詔復舊地甲辰駐蹕春州北平淀丙午烏古部節度使耶律陳家奴奏討茶扎剌捷庚戌以知北院樞密使事耶律斡特剌為都統夷離畢耶律禿𩽆為副統龍虎衛上將軍耶律胡呂都監討磨古斯遣積慶宮使蕭糾里監戰辛亥朽哥奏頗里八部來侵擊破之己巳除玉田密雲流民租賦一年閏月庚子賜西北路貧民錢達里底拔思母二部來降五月甲辰駐蹕赤勒嶺甲寅括馬戊午西北路招討司奏敵烈等部來侵統軍司出兵與戰不利招討司以兵擊破之敦睦宮太師耶律愛奴及其子死之辛酉以知國舅詳穩事蕭阿烈同領西北路行軍事六月辛未宋遣使來謝弔祭乙酉烏古敵烈統軍使朽哥有罪除名丙戌和烈葛等部來聘癸巳惕德來貢己亥禁邊民與蕃部為婚是夏高麗國王運薨子昱遣使來告即遣使賻贈秋七月庚子朔獵赤山是月阻卜等寇倒塌嶺盡掠西路羣牧馬去東北路統軍使耶律石柳以兵追及盡獲所掠而還九月己未以南院大王特末為南院樞密使甲子敵烈諸酋來降釋其罪是月斡特剌破磨古斯冬十月丙子駐蹕藕絲淀壬午山北路副部署蕭阿魯帶以討達里底功加左金吾衛上將軍癸巳西北路統軍司獲阻卜長拍撒葛蒲魯等來獻十一月乙巳惕德銅刮阻卜的烈等來降達里底及拔思母等復來侵山北副部署阿魯帶擊敗之十二月癸酉三河縣民孫賓及其妻皆百歲復其家甲戌以參知政事趙廷睦兼同知樞密院事樞密副使王師儒參知政事兼同知樞密院事己卯詔録西北路有功將士及戰歿者贈官乙酉詔改明年元減雜犯死罪以下仍除貧民租賦戊子西北路統軍司奏討磨古斯捷
