body:
  text: 遼史卷九本紀第九景宗下九年春正月丙寅女直遣使來貢二月庚子宋遣使致其先帝遺物甲寅以青牛白馬祭天地三月癸亥耶律沙敵烈獻援漢之役所獲宋俘戊辰詔以粟二十萬斛助漢夏五月庚午漢遺使來謝且以宋事來告己丑女直二十一人來請宰相夷離董之職以次授之六月丙辰以宋王喜隱為西南面招討使秋七月庚申朔回鶻遣使來貢甲子宋遣使來聘壬申漢以宋侵來告丙子遣使助漢戰馬八月漢遣使進葡萄酒冬十月甲子耶律沙以党項降酋可醜買友來見賜詔撫諭丁卯以可醜為司徒買友為太保各賜物遣之壬申女直遣使來貢乙酉漢復遣使以宋事來告十一月丁亥朔司天奏日當食不虧戊戌吐谷渾叛入太原者四百餘戶索而還之癸卯祠木葉山乙巳遣太保迭烈割等使宋乙卯漢復遣使以宋事來告十二月戊辰獵于近郊以所獲祭天十年春正月癸丑如長濼二月庚午阿薩蘭回鶻來貢三月庚寅祭顯陵夏四月丁卯西幸己巳女直遣使來貢五月癸卯賜女里死遣人誅高勳等六月己未駐蹕沿柳湖秋七月庚戌享太祖廟九月癸未朔平王隆先子陳哥謀害其父車裂以徇是冬駐蹕金川乾亨元年春正月乙酉遣撻馬長壽使宋問興師伐劉繼元之故丙申長壽還言河東逆命所當問罪若北朝不援和約如舊不然則戰二月丁卯漢以宋兵壓境遣使乞援詔南府宰相耶律沙為都統冀王敵烈為監軍赴之又命南院大王斜軫以所部從樞密副使抹只督之三月辛巳速撒遣人以別部化哥等降納之丙戌漢遣使謝撫諭軍民詔北院大王奚底乙室王撒合等以兵戍燕己丑漢復告宋兵入境詔左千牛衞大將軍韓大同軍節度使耶律善補以本路兵南援辛卯女直遣使來貢丁酉耶律沙等與宋戰於白馬嶺不利冀王敵烈及突呂不部節度使都敏黃皮室詳穩唐筈皆死之士卒死傷甚衆夏四月辛亥漢以行軍事宜來奏盧俊自代州馳狀告急辛酉敵烈來貢五月己卯朔宋兵至河東漢與戰不利劉繼文盧俊來奔六月劉繼元降宋漢亡甲子封劉繼文為彭城郡王盧俊同政事門下平章事宋主來侵丁卯北院大王奚底統軍使蕭討古乙室王撒合擊之戰于沙河失利己巳宋主圍南京丁丑詔諭耶律沙及奚底討古等軍中事宜秋七月癸未沙等及宋兵戰于高梁河少却休哥斜軫橫擊大敗之宋主僅以身免至涿州竊乘驢車遁去甲申擊宋餘軍所殺甚衆獲兵仗器甲符印糧饋貨幣不可勝計辛丑耶律沙遣人上俘獲以權知南京留守事韓德讓權南京馬步軍都指揮使耶律學古知三司事劉弘皆能安人心捍城池並賜詔褒奬八月壬子阻卜惕隱曷魯夷離菫阿里覩等來朝乙丑耶律沙等獻俘丙寅以白馬之役責沙抹只復以走宋主功釋之奚底遇敵而退以劍背擊之撒合雖却部伍不亂宥之冀王敵烈麾下先遁者斬之都監以下杖之壬申宴沙抹只等將校賜物有差九月己卯燕王韓匡嗣為都統南府宰相耶律沙為監軍惕隱休哥南院大王斜軫權奚王抹只等各率所部兵南伐仍命大同軍節度使善補領山西兵分道以進冬十月乙丑韓匡嗣與宋兵戰於滿城敗績辛未太保矧思與宋兵戰於火山敗之乙亥詔數韓匡嗣五罪赦之十一月戊寅宴賞休哥及有功將校乙未南院樞密使兼政事令郭襲上書諫畋獵嘉納之辛丑冬至赦改元乾亨十二月乙卯燕王韓匡嗣遙授晉昌軍節度使降封秦王壬戌蜀王道隱南京留守徙封荊王是冬駐蹕南京二年春正月丙子朔封皇子隆緒為梁王隆慶為王丁亥以惕隱休哥為北院大王前樞密使賢適封西平郡王二月戊辰如清河三月丁亥西南面招討副使耶律王六太尉化哥遣人獻党項俘閏月庚午有鴇飛止御帳獲以祭天夏四月庚辰祈雨戊子清暑燕子城五月雷火乾陵松六月己亥喜隱復謀反囚于祖州秋七月戊午王六等獻党項俘八月戊戌東幸冬十月辛未朔命巫者祠天地及兵神辛巳將南伐祭旗鼓癸未次南京丁亥獲敵人射鬼箭庚寅次固安以青牛白馬祭天地己亥圍瓦橋關十一月庚子朔宋兵夜襲營突呂不部節度使蕭幹及四捷軍詳穩耶律痕德戰却之壬寅休哥敗宋兵於瓦橋東守將張師引兵出戰休哥奮擊敗之戊申宋兵陣於水南休哥涉水擊破之追至莫州殺傷甚衆己酉宋兵復來擊之殆盡丙辰班師乙丑還次南京十二月庚午朔休哥拜于越大饗軍士三年春二月丙子東幸己丑復幸南京三月乙卯皇子韓八卒辛酉葬潢土二河之間置永州以秦王韓匡嗣為西南面招討使夏五月丙午上京漢軍亂劫立喜隱不克偽立其子留禮壽上京留守除室擒之秋七月甲子留禮壽伏誅冬十月如蒲瑰坡十一月辛亥加除室同政事門下平章事是月以南院樞密使郭襲為武定軍節度使十二月以遼興軍節度使韓德讓為南院樞密使四年春正月己亥如華林天柱三月乙未清明與諸王大臣較射宴飲夏四月自將南伐至滿城戰不利守太尉奚瓦里中流矢死統軍使善補為伏兵所圍樞密使斜軫救免詔以失備杖之五月班師清暑燕子城秋七月壬辰遣使賜喜隱死八月如西京九月庚子幸雲州甲辰獵于祥古山帝不豫壬子次焦山崩於行在年三十五在位十三年遺詔梁王隆緒嗣位軍國大事聽皇后命統和元年正月壬戌上尊諡孝成皇帝廟號景宗重熙二十一年加諡孝成康靖皇帝贊曰遼興六十餘年神冊會同之間日不暇給天祿應曆之君不令其終保寧而來人人望治以景宗之資任人不疑信賞必罰若可與有為也而竭國之力以助河東破軍殺將無救滅亡雖一取償於宋得不償失知匡嗣之罪數而不罰善郭襲之諫納而不用沙門昭敏以左道亂德寵以侍中不亦惑乎
