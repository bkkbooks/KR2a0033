body:
  text: 遼史卷二十二本紀第二十二道宗二八年春正月癸丑如鴨子河二月駐蹕納葛濼三月戊申朔楚王蕭革致仕進封鄭國王夏五月吾獨婉惕隱屯禿葛等乞歲貢馬駝許之六月丙子朔駐蹕拖古烈辛丑以右夷離畢奚馬六為奚六部大王是月御清涼殿放進士王鼎等九十三人秋七月甲子射熊于外室剌冬十月甲戌朔駐蹕獨盧金十二月庚辰以知北院樞密使事蕭圖古辭為北院樞密使癸未幸西京戊子以皇太后行再生禮曲赦西京囚九年春正月辛亥幸鴛鴦濼辛未禁民鬻銅三月辛未宋主禎殂以姪曙為子嗣位夏五月丙午以隋王仁先為南院樞密使徙封許王是月清暑曷里狘秋七月丙辰如太子山戊午皇太叔重元與其子楚國王涅魯古及陳國王陳六同知北院樞密使事蕭胡覩衛王貼不林牙涅剌溥古統軍使蕭迭里得駙馬都尉參及弟朮者圖骨旗鼓拽剌詳穩耶律郭九文班太保奚叔內藏提點烏骨護衛左太保敵不古按答副宮使韓家奴寶神奴等凡四百人誘脅弩手軍犯行宮時南院樞密使許王仁先知北樞密院事趙王耶律乙辛南府宰相蕭唐古北院宣徽使蕭韓家奴北院樞密副使蕭惟信敦睦宮使耶律良等率宿衛士卒數千人禦之涅魯古躍馬突出將戰為近侍詳穩渤海阿厮護衛蘇射殺之己未族逆黨家庚申重元亡入大漠自殺辛酉詔諭諸道壬戌以仁先為北院樞密使進封宋王加尚父耶律乙辛南院樞密使蕭韓家奴殿前都點檢封荊王蕭惟信耶律馮家奴並加太子太傅宿衛官蕭乙辛回鶻海鄰裊里耶律撻不也阿厮宮分人急里哥霞抹乙辛只魯並加上將軍諸護衛及士卒庖夫弩手傘子等三百餘人各授官有差耶律良密告重元變命籍橫帳夷離堇房為漢人行宮都部署癸亥貼不訴為重元等所脅詔削爵為民流鎮州戊辰以黑白羊祭天八月庚午朔遣使安撫南京吏民癸酉以永興宮使耶律塔不也有定亂功為同知點檢司事冬十月戊辰朔幸興王寺庚午以六院部太保耶律合朮知南院大王事是月駐蹕藕絲淀十一月辛丑以南院宣徽使蕭九哥為北府宰相己未追封故富春郡王耶律義先為許王是歲封皇子濬為梁王十年春正月己亥北幸二月禁南京民決水種粳稻秋七月壬申詔決諸路囚辛巳禁僧尼私詣行在妄述禍福取財物九月壬寅幸懷州謁太宗穆宗廟冬十月壬辰朔駐蹕中京戊午禁民私刊印文字十一月甲子定吏民衣服之制辛未禁六齊日屠殺丁丑詔求乾文閣所闕經籍命儒臣校讐庚辰以彰國軍節度使韓謝十為惕隱詔南京不得私造御用綵緞私貨鐵及非時飲酒命南京三司每歲春秋以官錢饗將士十二月癸巳以北院大王蕭兀古匿為契丹行宮都部署是歲南京西京大熟咸雍元年春正月辛酉朔文武百僚加上尊號曰聖文神武全功大略廣智總仁睿孝天祐皇帝改元大赦冊梁王濬為皇太子內外官賜級有差甲子如魚兒濼庚寅詔諸遇正旦重午冬至別表賀東宮三月丁亥以知興中府事楊績知樞密院事夏四月辛卯以知樞密院事張嗣復疾改知興中府事庚子清暑拖古烈五月辛巳夏國遣使來貢秋七月丙子以皇太后射獲熊賞賚百官有差八月丙申客星犯天廟詔諸路備盜賊嚴火禁九月乙亥駐蹕藕絲淀丁丑左夷離畢慥古為孟父敞穩冬十月丁亥朔幸醫巫閭山己亥皇太后射獲虎大宴羣臣令各賦詩十一月壬戌有星如斗逆行隱隱有聲十二月甲午以遼王仁先為南京留守徙封晉王辛亥以南京留守蕭惟信為左夷離畢壬子熒惑與月並行自旦至午二年春正月丁巳如鴨子河宋賀正使王嚴卒以禮送還癸未幸山榆淀二月甲午詔武定軍節度使姚景行問以治道拜南院樞密使二月辛巳以東北路詳穩耶律韓福奴為北院大王壬午彗星見於西方夏四月霖雨五月乙亥駐蹕拖古烈辛巳以戶部使劉詵為樞密副使六月丙戌回鶻來貢甲辰阻卜來貢秋七月癸丑朔以西北路招討使蕭朮者為北府宰相左夷離畢蕭惟信南院樞密使同知南院樞密使事耶律白惕隱丙辰南院樞密使姚景行致仕庚申録囚辛酉景行復前職丁卯如藕絲淀以歲旱遣使振山後貧民九月壬子朔日有食之以參知政事韓孚為樞密副使冬十二月壬午以知樞密院事楊績為南院樞密使樞密副使劉詵參知政事戊子僧守志加守司徒丁酉以西京留守合朮為南院大王辛丑以蕭朮者為武定軍節度使是年御永安殿放進士張臻等百一人三年春正月辛亥如鴨子河甲子御安流殿鈎魚三月癸亥宋主曙殂子頊嗣位遣使告哀即遣右護衛太保蕭撻不也翰林學士陳覺等弔祭閏月丁亥扈駕軍營火賜錢粟及馬有差辛卯駐蹕春州北淀乙巳以蕭兀古匿為北府宰相夏五月壬辰駐蹕納葛濼壬寅賜隨駕官諸工人馬六月戊申有司奏新城縣民楊從謀反僞署官吏上曰小人無知此兒戲爾獨流其首惡餘釋之庚戌宋遣使饋其先帝遺物辛亥宋以即位遣陳襄來報即遣知黃龍府事蕭圖古辭中書舍人馬鉉往賀壬戌南府宰相韓王蕭唐古致仕壬申以廣德軍節度使耶律蘂奴為南府宰相度支使趙徽參知政事秋七月辛丑熒惑晝見凡三十五日九月戊戌詔給諸路囚糧癸卯幸南京冬十一月壬辰夏國遣使進回鶻僧金佛梵覺經十二月丁未以參知政事劉詵為樞密副使東北路詳穩高八南院大王樞密直學士張孝傑參知政事己酉以張孝傑同知樞密院事丁巳行再生禮赦死罪以下是月夏國王李諒祚薨是歲南京旱蝗四年春正月甲戌朔日有食之丙子如鴛鴦濼辛巳改易州兵馬使為安撫使丁亥獵炭山辛卯遣使振西京饑民二月甲辰朔詔元帥府募軍壬子夏國王李諒祚子秉常遣使告哀癸丑頒行御製華嚴經贊丁卯北行三月丙子遣使夏國弔祭甲申振應州饑民乙酉詔南京除軍行地餘皆得種稻庚寅振朔州饑民乙未夏國李秉常遣使獻其父諒祚遣物夏四月戊午阿薩蘭回鶻遺使來貢五月丙戌駐蹕拖古烈六月壬子西北路雨穀方三十里丙寅以北院林牙耶律趙三為北院大王右夷離畢蕭素颯中京留守秋七月壬申置烏古敵烈部都統軍司丙子獵黑嶺是月南京霖雨地震九月己亥駐蹕藕絲淀冬十月辛亥曲赦南京徙罪以下囚永清武清安次固安新城歸義容城諸縣水復一歲租戊辰冊李秉常為夏國王十二月辛亥夏國遣使來貢五年春正月阻卜叛以晉王仁先為西北路招討使領禁軍討之夏六月己亥駐蹕拖古烈丙午吐蕃遣使來貢壬戌以南院樞密使蕭惟信知北院樞密使事秋七月乙丑朔日有食之戊辰夏國遣使來謝封冊癸未詔禁皇族恃勢侵漁細民八月謁慶陵九月戊辰仁先遣人奏阻卜捷冬十月己亥駐蹕藕絲淀十一月丁卯詔四方館副使止以契丹人充丁丑五國剖阿里部叛命蕭素颯討之閏月戊申夏國王李秉常遣使乞賜印綬己未僧志福加守司徒十二月甲子行皇太子再生禮減諸路徒以下罪一等乙丑詔百官廷議國政甲戌五國來降仍獻方物六年春正月甲午如千鵝濼二月丙寅阻卜來朝貢方物夏四月癸未西北路招討司以所降阻卜酋長至行在五月甲辰清暑拖古烈甲寅設賢良科詔應是科者先以所業十萬言進六月辛巳阻卜來朝乙酉以惕隱耶律白為中京留守是月御永安殿放進士趙廷睦等百三十八人秋七月辛亥獵于合魯聶特八月丙子耶律白薨追封遼西郡王九月庚戌幸藕絲淀甲寅以馬希白詩才敏妙十吏書不能給召試之冬十月丁卯五國部長來朝壬申西北路招討司擒阻卜酋長來獻十一月乙卯禁鬻生熟鐵于回鶻阻卜等界十二月戊午加圓釋法鈞二僧並守司空己未以坤寧節赦死罪以下辛酉禁漢人捕獵七年春正月戊子如鴨子河二月乙丑女直進馬丙寅以南院樞密使姚景行知興中府事三月己酉以討五國功加知黃龍府事蒲延懷化軍節度使高元紀易州觀察使高正並千牛衛上將軍五國節度使蕭陶蘇斡寧江州防禦使大榮並靜江軍節度使幸黑水夏四月癸酉如納葛濼乙亥禁布帛短狹不中尺度者六月己卯吐蕃來貢癸未南院大王高八致仕秋七月甲申朔以東北路詳穩合里只為南院大王西南面招討使拾得奴為奚六部大王己丑遣使按問五京囚庚子如藕絲淀八月辛巳置佛骨于招仙浮圖罷獵禁屠殺冬十月己卯如醫巫閭山壬戌以南府宰相耶律蘂奴為南京統軍使戊辰謁乾陵庚辰詔百官廷議軍國事十一月戊子免南京流民租己丑振饒州饑民丙午高麗遣使來貢十二月壬子以契丹行宮都部署耶律胡覩知北院樞密使事知北院樞密使事蕭惟信為南府宰相兼契丹行宮都部署丁巳漢人行宮都部署李仲禧北院宣徽使劉霂樞密副使王觀都承旨楊興工各賜國姓戊寅回鶻來貢是歲春州斗粟六錢
