body:
  text: 遼史卷二十八本紀第二十八天祚皇帝二五年春正月下詔親征遣僧家奴持書約和斥阿骨打名阿骨打遣賽剌復書若歸叛人阿疏遷黃龍府於別地然後議之都統耶律斡里𩽆等與女直兵戰于達魯古城敗績二月饒州渤海古欲等反自稱大王三月以蕭謝佛留等討之遣耶律張家奴等六人齎書使女直斥其主名冀以速降夏四月癸丑蕭謝佛留等為渤海古欲所敗以南面副部署蕭陶蘇斡為都統赴之五月陶蘇斡及古欲戰敗績張家奴等以阿骨打書來復遣之往六月己亥朔清暑特禮嶺壬子張家奴等還阿骨打復書亦斥名諭之使降癸丑以親征諭諸道丙辰陶蘇斡招獲古欲等癸亥以惕隱耶律末里為北院大王是月遣蕭辭剌使女直以書辭不屈見留秋七月辛未宋遣使致助軍銀絹丙子獵于嶺東是月都統斡里𩽆等與女直戰于白馬濼敗績八月甲子罷獵趨軍中以斡里𩽆等軍敗免官丙寅以圍場使阿不為中軍都統耶律張家奴為都監率番漢兵十萬蕭奉先充御營都統諸行營都部署耶律章奴為副以精兵二萬為先鋒餘分五部為正軍貴族子弟千人為硬軍扈從百司為護衛軍北出駱駝口以都點檢蕭胡覩姑為都統樞密直學士柴誼為副將漢步騎三萬南出寧江州自長春州分道而進發數月糧期必滅女直九月丁卯朔女直軍陷黃龍府己巳知北院樞密使蕭得里底出為西南面招討使辭剌還女直復遣賽剌以書來報若歸我叛人阿疏等即當班師上親征粘罕兀朮等以書來上陽為卑哀之辭實欲求戰書上上怒下詔有女直作過大軍翦除之語女直主聚衆剺面仰天慟哭曰始與汝等起兵蓋苦契丹殘忍欲自立國今主上親征奈何非人死戰莫能當也不若殺我一族汝等迎降轉禍為福諸軍皆曰事已至此惟命是從乙巳耶律章奴反奔上京謀迎立魏國王淳上遣駙馬蕭昱領兵詣廣平淀護后妃行宮小底乙信持書馳報魏國王時章奴先遣王妃親弟蕭諦里以所謀説魏國王王曰此非細事主上自有諸王當立北南面大臣不來而汝言及此何也密令左右拘之有頃乙信等仭御札至備言章奴等欲廢立事魏國王立斬蕭諦里等首以獻單騎間道詣廣平淀待罪上遇之如初章奴知魏國王不聽率麾下掠慶饒懷祖等州結渤海羣盜衆至數萬趨廣平淀犯行宮順國女直阿鶻産以三百騎一戰而勝擒其貴族二百餘人並斬首以徇其妻子配役繡院或散諸近侍為婢餘得脫者皆奔女直章奴詐為使者欲奔女直為邏者所獲縛送行在腰斬于市剖其心以獻祖廟支解以徇五路冬十一月遣駙馬蕭特末林牙蕭察剌等將騎兵五萬步卒四十萬親軍七十萬至駝門十二月乙巳耶律張家奴叛戊申親戰于護步答岡敗績盡亡其輜重己未錦州刺史耶律朮者叛應張家奴庚申北面林牙耶律馬哥討張家奴癸亥以北院宣徽使蕭韓家奴知北院樞密使事南院宣徽使蕭特末為漢人行宮都部署六年春正月丙寅朔東京夜有惡少年十餘人乘酒執刃踰垣入留守府問留守蕭保先所在今軍變請為備蕭保先出刺殺之戶部使大公鼎聞亂即攝留守事與副留守高清明集奚漢兵千人盡捕其衆斬之撫定其民東京故渤海地太祖力戰二十餘年乃得之而蕭保先嚴酷渤海苦之故有是變其裨將渤海高永昌僭號稱隆基元年遣蕭乙薛高興順招之不從閏月己亥遣蕭韓家奴張琳討之戊午貴德州守將耶律余覩以廣州渤海叛附永昌我師擊敗之二月戊辰侍御司徒撻不也等討張家奴戰于祖州敗績乙酉遣漢人行宮都部署蕭特末率諸將討張家奴戊子張家奴誘饒州渤海及中京賊侯概等萬餘人攻陷高州三月東面行軍副統酬斡等擒侯概于川州夏四月戊辰親征張家奴癸酉敗之甲戌誅叛黨饒州渤海平丙子賞平賊將士有差而蕭韓家奴張琳等復為賊所敗五月清暑散水原女直軍攻下瀋州復陷東京擒高永昌東京州縣族人痕孛鐸剌吳十撻不也道剌酬斡等十三人皆降女直六月乙丑籍諸路兵有雜畜十頭以上者皆從軍庚辰魏國王淳進封秦晉國王為都元帥上京留守蕭撻不也為契丹行宮都部署兼副元帥丁亥知北院樞密使事蕭韓家奴為上京留守秋七月獵秋山春州渤海二千餘戶叛東北路統軍使勒兵追及盡俘以還八月烏古部叛遣中丞耶律撻不也等招之九月丙午謁懷陵冬十月丁卯以張琳軍敗奪官庚辰烏古部來降十一月東面行軍副統馬哥等攻曷蘇館敗績十二月乙亥封庶人蕭氏為太皇太妃辛巳削副統耶律馬哥官七年春正月甲寅減馬粟分給諸局是月女直軍攻春州東北面諸軍不戰自潰女古皮室四部及渤海人皆降復下泰州二月淶水縣賊董龐兒聚衆萬餘西京留守蕭乙薛南京統軍都監查剌與戰于易水破之三月龐兒黨復聚乙薛復擊破之于奉聖州夏五月庚寅東北面行軍諸將涅里合魯涅哥虛古等棄市乙巳諸圍場隙地縱百姓樵採六月辛巳以同知樞密院事余里也為北院大王秋七月癸卯獵秋山八月丙寅獵狘斯那里山命都元帥秦晉王赴沿邊會四路兵馬防秋九月上自燕至陰涼河置怨軍八營募自宜州者曰前宜後宜自錦州者曰前錦後錦自乾自顯者曰乾曰顯又有乾顯大營岩州營凡二萬八千餘人屯衛州蒺藜山丁酉獵輞子山冬十月乙卯朔至中京十二月丙寅都元帥秦晉國王淳遇女直軍戰于蒺藜山敗績女直復拔顯州旁近州郡庚午下詔自責癸酉遣夷離畢查剌與大公鼎諸路募兵丁丑以西京留守蕭乙薛為北府宰相東北路行軍都統奚霞末知奚六部大王事是歲女直阿骨打用鐵州楊朴策即皇帝位建元天輔國號金楊朴又言自古英雄開國或受禪必先求大國封册遂遣使議和以求封册八年春正月幸鴛鴦濼丁亥遣耶律奴哥等使金議和庚寅保安軍節度使張崇以雙州二百戶降金東路諸州盜賊蜂起掠民自隨以充食二月耶律奴哥還自金金主復書曰能以兄事朕歲貢方物歸我上中京興中府三路州縣以親王公主駙馬大臣子孫為質還我行人及元給信符並宋夏高麗往復書詔表牒則可以如約三月甲午復遣奴哥使金夏四月辛酉以西南面招討使蕭得里底為北院樞密使五月壬午朔奴哥以書來約不踰此月見報戊戌復遣奴哥使金要以酌中之議是月至納葛濼賊安生兒張高兒聚衆二十萬耶律馬哥等斬生兒于龍化州高兒亡入懿州與霍六哥相合金主遣胡突袞與奴哥持書報如前約六月丁卯遣奴哥等齎宋夏高麗書詔表牒至金霍六哥陷海北州趣義州軍帥回離保等擊敗之通祺雙遼四州之民八百餘戶降于金秋七月獵秋山金復遣胡突袞來免取質子及上京興中府所屬州郡裁減歲幣之數如能以兄事朕册用漢儀可以如約八月庚午遣奴哥突迭使金議册禮九月突迭見留遣奴哥還謂之曰言如不從勿復遣使閏月丙寅遣奴哥復使金而蕭寶訛里等十五人各率戶降于金冬十月奴哥突迭持金書來龍化州張應古等四人率衆降金十一月副元帥蕭撻不也薨十二月甲申議定册禮遣奴哥使金寧昌軍節度使劉宏以懿州戶三千降金時山前諸路大飢乾顯宜錦興中等路斗粟直數縑民削榆皮食之既而人相食是年放進士王翬等百三人九年春正月金遣烏林答贊謨持書來迎册二月至鴛鴦濼賊張撒八誘中京射糧軍僭號南面軍帥余覩擒撒八三月丁未朔遣知右夷離畢事蕭習泥烈等册金主為東懷國皇帝己酉烏林答贊謨奴哥等先以書報夏五月阻卜補疏只等叛執招討使耶律斡里𩽆都監蕭斜里得死之秋七月獵南山金復遣烏林答贊謨來責册文無兄事之語不言大金而云東懷乃小邦懷其德之義及册文有渠材二字語涉輕侮若遙芬多戩等語皆非善意殊乖體式如依前書所定然後可從楊詢卿羅子韋率衆降金八月以趙王習泥烈為西京留守九月至西京復遣習泥烈楊立忠先持册䤝使金冬十月甲戌朔耶律陳圖奴等二十餘人謀反伏誅是月遣使送烏林答贊謨持書以還十年春二月幸鴛鴦濼金復遣烏林答贊謨持書及册文副本以來仍責乞兵于高麗三月己酉民有羣馬者十取其一給東路軍庚申以金人所定大聖二字與先世稱號同復遣習泥烈往議金主怒遂絶之夏四月獵胡土白山聞金師再舉耶律白斯不等選精兵三千以濟遼師五月金主親攻上京克外郛留守撻不也率衆出降六月乙酉以北府宰相蕭乙薛為上京留守知鹽鐵內省兩司東北統軍司事秋獵沙嶺冬復至西京
