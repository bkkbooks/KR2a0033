body:
  text: 遼史卷九十五列傳第二十五耶律弘古耶律馬六蕭滴冽耶律適祿耶律陳家奴耶律特麼耶律仙童蕭素颯耶律大悲奴耶律弘古字胡篤堇樞密使化哥之弟統和間累遷順義軍節度使入為北面林牙太平元年加同政事門下平章事出為彰國軍節度使兼山北道兵馬都部署徙武定軍節度使六年拜惕隱討阻卜有功聖宗嘗刺臂血與弘古盟為友禮遇尤異拜南府宰相改上京留守重熙六年遷南院大王御製誥辭以寵之十二年加于越帝閔其勞復授武定軍節度使卒訃聞上哭曰惜哉善人喪至親臨奠焉耶律馬六字揚隱孟父楚國王之後性寬和善諧謔親朋會遇一坐盡傾恬于榮利與耶律弘古為刺血友弘古為惕隱薦補宿直官重熙初遷旗鼓拽剌詳穩為人畏慎容物或有面相陵折者恬然若弗聞不臧否世務以故上益親狎三年遷崇德宮使為惕隱御製誥辭以褒之拜北院宣徽使寵遇過宰輔帝常以兄呼之改遼興軍節度使卒年七十子奴古達終南京宣徽使蕭滴冽字圖寧遙輦鮮質可汗宮人重熙初遙攝鎮國軍節度使六年奉詔使宋傷足而跛不告遂行帝怒及還決以大杖降同簽南京留守事遙授靜江軍節度使歷羣牧都林牙累遷右夷離畢以才幹見任使會車駕西征元昊乞降帝以前後反覆遣滴冽往覘誠否因為元昊陳述禍福聽命乃還拜北院樞密副使出為中京留守十九年改西京留守卒耶律適祿字撒懶清寧初為本班郎君稍遷宿直官乾統中從伐阻卜有功加奉宸歷護衞太保改弘義宮副使時上京梟賊趙鍾哥跋扈自肆適祿擒之加泰州觀察使為達魯虢部節度使天慶中知興中府加金吾衞上將軍為盜所殺耶律陳家奴字綿辛懿祖弟葛剌之八世孫重熙中補牌印郎君坐直日不至降本班會帝獵陳家奴逐鹿圍內鞭之二百時耶律仁先薦陳家奴健捷比海東青鶻授御盞郎君歷鷹坊尚四方館副使改徒魯古皮室詳穩會太后生辰進詩獻馴鹿太后嘉奬賜珠二琲雜綵二百段兄撒鉢卒陳家奴聞訃不告而去帝怒鞭之清寧初累遷右夷離畢適帝與燕國王射鹿俱中王時年九歲帝悅陳家奴應制進詩帝喜解衣以賜後皇太子廢帝疑陳家奴黨附罷之時西北諸部寇邊以陳家奴為烏古部節度使行軍都監賜甲一屬馬二疋討諸部擒其酋送于朝偵候者見馬蹤意寇至陳家奴遣報元帥耶律愛奴視之曰此野馬也將出獵賊至愛奴戰歿有司詰按陳家奴不伏詔釋之由是感激每事竭力後諸部復來侵陳家奴率兵三往皆克邊境遂寧以老告歸不從道宗崩為山陵使致仕年八十卒耶律特麼季父房之後重熙間為北剋累遷六部禿里太尉大安四年為倒塌嶺節度使頃之為禁軍都監是冬討磨古斯斬首二千餘級十年復討之既捷授南院宣徽使壽隆元年為北院大王四年知黃龍府事薨耶律仙童仲父房之後重熙初為宿直官累遷惕隱都監以寬厚稱蒲奴里叛仙童為五國節度使率師討之擒其帥陶得里又擊烏隗叛降其衆改彰國軍節度使拜北院大王清寧二年知黃龍府事遷侍衞親軍馬步軍都指揮歷忠順武定二軍節度使致仕封蔣國公咸雍初徙封許國卒蕭素颯字特免五院部人重熙間始仕累遷北院承旨彰愍宮使清寧初歷左皮室詳穩右夷離畢咸雍五年剖阿里部叛素颯討降之率其酋長來朝帝嘉其功徙北院林牙改南院副部署卒子謀魯斡字回璉初補夷離畢郎君遷文班太保大康中改南京統軍使為右夷離畢與樞密使耶律阿思論事不合見忌出為馬羣太保北部來侵謀魯斡破之以功遷同知烏古敵烈統軍仍許便宜行事後以讒毀降領西北路戍軍復為馬羣太保卒耶律大悲奴字休堅王子班聶里古之後大康中歷永興延昌宮使右皮室詳穩會阻卜叛奉詔招降之壽隆二年拜殿前都點檢乾統初歷上京留守惕隱復為都點檢改西南面招討使請老不許天慶中留守上京領北南樞密院點檢中丞諸司等事以彰國軍節度使致仕卒大悲奴舉止馴雅好禮儀為時人所稱論曰遼自神冊而降席富強之勢內修法度外事征伐一時將帥震揚威靈風行電掃討西夏征党項破阻卜平敵烈諸部震懾聞鼙鼓而膽落股弁斯可謂雄武之國矣其戰勝攻取必有奇謀秘計神變莫測者將前史所載未足以發之邪抑天之所授衆莫與爭而能然邪雖然兵者凶器可戢而不可玩爭者末節可遏而不可召此黃石公所謂柔能制剛弱能制強也又況乎仁者之無敵哉遼之君臣智足守此金人果能乘其敝而躡其後乎是以於耶律弘古輩諸將不能無慨然也
