body:
  text: 遼史卷十八本紀第十八興宗一興宗神聖孝章皇帝諱宗真字夷不菫小字只骨聖宗長子母曰欽哀皇后蕭氏上始生齊天皇后取養之幼而聰明長而魁偉龍顏日角豁達大度善騎射好儒術通音律三歲封梁王太平元年冊為皇太子十年六月判北南院樞密院事十一年夏六月己卯聖宗崩即皇帝位於柩前壬午尊母元妃蕭氏為皇太后甲申遣使告哀于宋及夏高麗是年御宣政殿放進士劉貞等五十七人辛卯大赦改元景福乙未奉大行皇帝梓宮殯于永安山太平殿辛丑皇太后賜駙馬蕭鉏不里蕭匹敵死圍場都太師女直著骨里右祗候郎君詳穩蕭延留等七人皆棄市籍其家遷齊天皇后于上京秋七月丙午朔皇太后率皇族大臨于太平殿高麗遣使弔慰上召晉王蕭普古等飲博夜分乃罷丁未擊鞠戊申以耶律韓八為左夷離畢特末里為左祗候郎君詳穩橫帳郎君樂古權右袛候郎君詳穩己酉以耶律鄭留為于厥迪烈都詳穩高八為右皮室詳穩庚戌振薊州饑民癸丑詔寫大行皇帝御容甲寅錄囚以觀察姚居信為上將軍建慶州于慶陵之南徙民實之充奉陵邑乙卯以比歲豐稔罷給東京統軍司糧丁巳上謁大行皇帝御容哀慟久之因詔寫北府宰相蕭孝先南府宰相蕭孝穆像于御容殿以蕭阿姑軫為東京留守丁卯謁太平殿焚先帝所御弓矢幸晉王普古第視疾辛未錄囚壬申上謁神主帳時奧隈蕭氏始入宮亦命拜之八月壬午遷大行皇帝梓宮於菆塗殿九月戊申躬視慶陵庚戌問安于皇太后辛亥宋遣王隨曹儀致祭王贌許懷信梅詢張綸來慰兩宮范諷孫繼業賀即位孔道輔魏昭文賀皇太后冊禮戊午焚弧矢鞍勒于菆塗殿庚申夏國遣使來慰庚午以宋使弔祭喪服臨菆塗殿甲戌遣御史中丞耶律翥司農卿張確詳穩耶律勵四方舘使高維翰謝宋弔慰冬十月戊寅宰臣呂德懋薨癸未殺鉏不里黨彌勒奴觀音奴等丙戌遣工部尚書高德順崇祿卿李可封致先帝遺物于宋以右領軍衞上將軍耶律遜少府監馬憚充皇太后謝宋使右監門衞上將軍耶律元載引進使魏永充皇帝謝宋使丁酉夏國遣使來賻戊戌以蕭革趙為果耶律郁馬保業充來歲賀宋正旦使副閏月辛亥謁菆塗殿閱玄宮閟器有司請以生辰為永壽節皇太后生辰為應聖節從之辛酉閱新造鎧甲丁卯振黃龍府饑民十一月壬辰上率百僚奠于菆塗殿出大行皇帝服御玩好焚之縱五坊鷹鶻甲午葬文武大孝宣皇帝于慶陵乙未祭天地問安皇太后丙申謁慶陵以遺物賜羣臣名其山曰慶雲殿曰望仙十二月癸丑至自慶陵皇太后聽政帝不親庶務羣臣表請不從是歲以興平公主下嫁夏國王李德昭子元昊以元昊為夏國公駙馬都尉重熙元年春正月壬申朔皇太后御正殿受帝與羣臣朝宋遣任布王遵範陳琰王克善來賀乙亥宋遣鄭向郭遵範來賀永壽節丁丑如雪林二月大蒐三月壬申朔尚父漆水郡王敵烈復為惕隱是春皇太后誣齊天皇后以罪遣人即上京行弒后請具浴以就死許之有頃后崩夏四月乙巳清暑別輦斗秋七月獵平地松林以蕭達溥王英秀蕭麓張素羽充來歲賀宋正旦生辰使八月丙午駐蹕剌河源皇子洪基生冬十月己酉幸中京十一月己卯帝率羣臣上皇太后尊號曰法天應運仁德章聖皇太后羣臣上皇帝尊號曰文武仁聖昭孝皇帝大赦改元重熙癸未宋遣劉隨王德本來賀應聖節以楊佶為翰林承旨丙戌夏國遣使來賀辛卯五國酋長來貢夏國王李德昭薨冊其子夏國公元昊為夏國王十二月庚戌宋遣胥偃王從益崔暨張懷志來賀來歲正旦又遣楊日嚴王克纂來賀永壽節以北大王耶律求翰同平章事是年放進士劉師貞等五十七人二年春正月庚辰東幸乙酉夏國遣使來貢壬辰女直詳穩臺押率所部來貢宋遣曹琮來告母后劉氏哀章得象安繼昌來饋母后遺物即遣興聖宮使耶律壽寧給事中知制誥李奎充祭奠使天德軍節度使耶律卿寧大理卿和道亨河西軍節度使耶律嵩引進使馬世卿充兩宮弔慰使秋七月甲子朔以耶律寔高升耶律迪王惟允充兩宮賀宋生辰使副以耶律師古劉五常充賀宋來歲正旦使副八月丁酉幸溫泉宮乙卯遣使閱諸路禾稼冬十一月甲申宋遣劉寶符忠李昭述張茂實等來謝慰奠十二月乙未宋遣丁度王繼凝來賀應聖節己酉禁夏國使沿路私市金鐵甲寅宋遣章頻李懿王冲睦張緯李紘李繼一來賀永壽節及來歲正旦庚申以北府宰相蕭孝先為樞密使三年春正月丁卯宋使章頻卒詔有司賻贈命近侍護喪以歸辛卯如春水二月壬辰朔以北院樞密使蕭普古為東京留守戊申耶律大師奴有侍襁褓恩詔入屬籍夏四月甲寅振耶迷只部五月庚申朔清暑沿柳湖是月皇太后還政于上躬守慶陵六月己亥以蕭普古為南院樞密使秋七月戊子朔上始親政以耶律庶徵劉六符耶律睦薄可久充賀宋來歲正旦使副壬辰如秋山冬十月己未駐蹕中會川十二月宋遣段少連杜仁贊來賀來歲正旦楊偕李守忠來賀永壽節四年春正月庚寅如耶迷只里三月乙酉朔立皇后蕭氏夏四月甲寅朔如涼陘五月庚子清暑散水源六月癸丑朔皇子寶信奴生以耶律信呂士宗蕭袞郭揆充賀宋生辰及來歲正旦使副秋七月壬午朔獵于黑嶺九月己酉駐蹕長寧淀冬十月如王子城十一月壬午改南京總管府為元帥府乙酉行柴冊禮于白嶺大赦加尚父耶律信寧政事令耶律求翰耆宿贊翊功臣十二月癸丑詔諸軍砲弩弓劍手以時閱習庚申宋遣鄭戩柴貽範楊日華張士禹來賀永壽節及正旦五年春正月甲申如魚兒濼樞密使蕭延寧請改國舅乙室小功帳敞史為將軍從之夏四月庚申以潞王查葛為南府宰相崇德宮使耶律馬六為惕隱甲子幸后弟蕭無曲第曲水泛觴賦詩丁卯頒新定條制己巳上與大臣分朋擊鞠五月甲午南幸丁未如胡土白山清暑庚申幸北院大王高十行帳拜奧賜銀絹壬戌詔修南京宮闕府署秋七月辛丑錄囚耶律把八誣其弟韓哥謀殺己有司奏當反坐臨刑其弟泣訴臣惟一兄乞貸其死上憫而從之九月癸巳獵黃花山獲熊三十六賞獵人有差冬十月丁未幸南京辛亥曲赦析津府境內囚壬子御元和殿以日射三十六熊賦幸燕詩試進士于廷賜馮立趙徽四十九人進士第以馮立為右補闕趙徽以下皆為太子中舍賜緋衣銀魚遂大宴御試進士自此始宋遣宋郊王世文來賀永壽節甲子宰臣張儉等請幸禮部貢院歡飲至暮而罷賜物有差以耶律祥張素民耶律甫王澤充賀宋生辰正旦使副六年春正月丁丑西幸三月戊寅以秦王蕭孝穆為北院樞密使徙封吳王晉王蕭孝先為南京留守夏四月獵野狐嶺閏月獵龍門縣西山五月己酉清暑炭山以耶律韓八為北院大王蕭把哥左夷離畢王子郎君詳穩鼻姑得林牙簽北面事耶律涅哥同簽點檢司甲寅錄囚以南大王耶律信寧故匿重囚及侍婢贓污命撻以劍脊而奪其官都監坐阿附及侍婢罪皆論死詔貸之丙辰以耶律信寧為西南路招討使庚申出飛龍竹罒戊馬賜皇太弟重元及北南面侍臣有差癸亥以上京留守耶律胡覩袞為南大王平章事蕭查剌寧上京留守侍中管寧行宮都部署耶律蒲奴寧烏古迪烈得都詳穩甲子以上京留守耶律洪古為北院大王六月壬申朔以善寧為殿前都點檢護衞太保耶律合住兼長寧宮使蕭阿剌里耶律烏魯斡耶律和尚蕭韓家奴蕭特里蕭求翰為各宮都部署上酒酣賦詩吳國王蕭孝穆北宰相蕭撒八等皆屬和夜中乃罷己卯祀天地癸未賜南院大王耶律胡覩袞命上親為製誥詞幷賜詩以寵之丙申以北院大王侯哂為南京統軍使秋七月辛丑朔以北南樞密院獄空賞賚有差壬寅以皇太弟重元生子賜詩及寶玩器物曲赦死罪以下癸卯如秋山八月己卯北樞密院言越棘部民苦其酋帥坤長不法多流亡詔罷越棘等五國酋帥以契丹節度使一員領之冬十月癸酉駐蹕石寶岡十一月己亥朔阻卜酋長來貢辛亥以契丹行宮都部署蕭惠為南院樞密使壬子以管寧為南院樞密使蕭掃古諸行宮都部署耶律褭里知南面行宮副部署蕭阿剌里左祗候郎君詳穩耶律曷主右祗候郎君詳穩庚申幸晉國公主行帳視疾封皇子洪基為梁王十二月以楊佶為忠順軍節度使遣耶律斡秦鑑耶律德崔繼芳賀宋生辰及正旦七年春正月戊戌朔宋遣高若訥夏元正謝絳張茂實來賀正旦及永壽節辛丑如混同江二月庚午如春州乙亥駐蹕東川丁丑高麗遣使來貢壬午幸五坊閱鷹鶻乙酉遣使慶州問安皇太后三月戊戌朔幸皇太弟重元行帳壬寅如蒲河淀辛亥夏國遣使來貢甲寅錄囚夏四月己巳以興平公主薨遣北院承旨耶律庶成持詔問夏國王李元昊公主生與元昊不睦沒詰其故己卯獵白馬堝甲申射兔新淀井乙未獵金山遣楊家進鹿尾茸于大安宮六月乙亥御清涼殿試進士賜邢彭年以下五十五人第秋七月甲辰錄囚乙巳阻卜酋長屯禿古斯來朝戊申如黑嶺九月丁未駐蹕平淀冬十月甲子朔渡遼河丙寅駐蹕白馬淀壬申錄囚十一月癸巳朔以耶律元方張泥韓至德蕭傅充賀宋生辰正旦使副辛丑問安皇太后進珍玩庚申錄囚十二月召善擊鞠者數十人于東京令與近臣角勝上臨觀之己巳以皇太弟重元判北南院樞密使事北府宰相撒八寧再任兼知東京留守事耶律應穩南府宰相查割折大內惕隱乙室已帳蕭翰乾州節度使劉六符參知政事王子帳冠哥王子郎君詳穩鉏窘大王平州節度使宰臣張克恭守司空宰臣韓紹芳加侍中惕隱耶律馬六北院宣徽使傅父耶律喜孫南府宰相癸未宋遣王舉正張士禹來賀永壽節甲申命日進酒于大安宮致薦慶陵丁亥錄囚非故殺者減科南面侍御壯骨里詐取女直貢物罪死上以有吏能黥而流之八年春正月壬辰朔宋遣韓琦王從益來賀丙申如混同江觀漁戊戌振品部庚戌叉魚于率沒里河丁巳禁朔州鬻羊于宋二月丙子駐蹕長春河夏六月乙丑詔括戶口秋七月丁巳謁慶陵致奠于望仙殿迎皇太后至顯州謁園陵還京冬十月駐蹕東京十一月甲午詔有言北院處事失平擊鐘及邀駕告者悉以奏聞戊戌朝皇太后召僧論佛法戊申皇太后行再生禮大赦己酉城長春閏十二月壬辰視吳國王蕭孝穆疾宋遣龐籍杜贊來賀永壽節九年春正月丙辰朔上進酒于皇太后宮御正殿宋遣王拱辰彭再思來賀庚申如鴨子河二月駐蹕魚兒濼三月辛未以應聖節大赦五月乙卯朔清暑永安山六月射柳祈雨秋七月癸酉宋遣郭禎以伐夏來報遣樞密使杜防報聘丁丑如秋山冬十月癸未朔駐蹕中會川十一月甲子女直侵邊發黃龍府鐵驪軍拒之宋遣蘇伸向傳範來賀應聖節十二月庚寅以北大王府布猥帳郎君自言先世與國聯姻許置敞史命本帳蕭胡覩為之辛卯以所得女直戶置肅州以蕭迪劉三嘏耶律元方王惟吉耶律庶忠孫文昭蕭紹筠秦德昌充賀宋生辰及來歲正旦使副詔諸犯法者不得為官吏諸職官非婚祭不得沉酗廢事有治民安邊之略者悉具以聞
