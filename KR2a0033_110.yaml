body:
  text: 遼史卷一百十列傳第四十姦臣上耶律乙辛張孝傑耶律燕哥蕭十三春秋褒貶善惡並書示勸懲也故遷固傳佞幸酷吏歐陽修則並姦臣録之將俾為君者知所鑒為臣者知所戒此天地聖賢之心國家安危之機治亂之原也遼自耶律乙辛而下姦臣十人其敗國皆足以為戒故列于傳耶律乙辛字胡覩袞五院部人父迭剌家貧服用不給部人號窮迭剌初乙辛母方娠夜夢手搏羖羊拔其角尾既寤占之術者曰此吉兆也羊去角尾為王字汝後有子當王及乙辛生適在路無水以浴回車破轍忽見湧泉迭剌自以得子欲酒以慶聞酒香于草棘間得二榼因祭東焉乙辛幼慧黠嘗牧羊至日昃迭剌視之乙辛熟寢迭剌觸之覺乙辛怒曰何遽驚我適夢人手執日月以食我我已食月啖日方半而覺惜不盡食之迭剌自是不令牧羊及長美風儀外和內狡重熙中為文班吏掌太保印陪從入宮皇后見乙辛詳雅如素宦令補筆硯吏帝亦愛之纍遷護衛太保道宗即位以乙辛先朝任使賜漢人戶四十同知點檢司事常召決疑議升北院同知歷樞密副使清寧五年為南院樞密使改知北院封趙王九年耶律仁先為南院樞密使時駙馬都尉蕭胡覩與重元黨惡仁先在朝奏曰仁先可任西北路招討使帝將從之乙辛奏曰臣新參國政未知治體仁先乃先帝舊臣不可遽離朝廷帝然之重元亂平拜北院樞密使進王魏賜匡時翊聖竭忠平亂功臣咸雍五年加守太師詔四方有軍旅許以便宜從事勢震中外門下饋賂不絶凡阿順者蒙薦擢忠直者被斥竄大康元年皇太子始預朝政法度修明乙辛不得逞謀以事誣皇后后既死乙辛不自安又欲害太子乘間入奏曰帝與后如天地並位中宮豈可曠盛稱其黨駙馬都尉蕭霞抹之妹美而賢上信之納于宮尋冊為皇后時護衛蕭忽古知乙辛姦狀伏橋下欲殺之俄暴雨壞橋謀不遂林牙蕭巖壽密奏曰乙辛自皇太子預政內懷疑懼又與宰相張孝傑相附會恐有異圖不可使居要地出為中京留守乙辛泣謂人曰乙辛無過因讒見出其黨蕭霞抹輩以其言聞於上上悔之無何出蕭巖壽為順義軍節度使詔近臣議召乙辛事北面官屬無敢言者耶律撒剌曰初以蕭巖壽奏出乙辛若所言不當宜坐以罪若當則不可復召纍諫不從乃復召為北院樞密使時皇太子以母后之故憂見顏色乙辛黨欣躍相慶讒謗沸騰忠良之士斥逐殆盡乙辛因蕭十三之言夜召蕭得𩹉特謀搆太子令護衛太保耶律查剌誣告耶律撒剌等同謀立皇太子詔按無迹而罷又令牌印郎君蕭訛都斡詣上誣首耶律查剌前告耶律撒剌等事皆實臣亦與其謀本欲殺乙辛等而立太子臣等若不言恐事白連坐詔使鞫劾乙辛迫令具伏上怒命誅撒剌及速撒等乙辛恐帝疑引數人庭詰各令荷重校繩繫其頸不能出氣人人不堪其酷惟求速死反奏曰別無異辭時方暑尸不得瘞以至地臭乃囚皇太子於上京監衛者皆其黨尋遣蕭達魯古撒把害太子乙辛黨大喜聚飲數日上京留守蕭撻得以卒聞上哀悼欲召其妻乙辛陰遣人殺之以滅其口五年正月上將出獵乙辛奏留皇孫上欲從之同知點檢蕭兀納諫曰陛下若從乙辛留皇孫皇孫尚幼左右無人願留臣保護以防不測遂與皇孫俱行由是上始疑乙辛頗知其姦會北幸將次黑山之平淀上適見扈從官屬多隨乙辛後惡之出乙辛知南院大王事及例削一字王爵改王混同意稍自安及赴闕入謝帝即日遣還改知興中府事七年冬坐以禁物鬻入外國下有司議法當死乙辛黨耶律燕哥獨奏當入八議得減死論擊以鐵骨𩽆幽於來州後謀奔宋及私藏兵甲事覺縊殺之乾統二年發冢戮其尸張孝傑建州永霸縣人家貧好學重熙二十四年擢進士第一清寧間纍遷樞密直學士咸雍初坐誤奏事出為惠州刺史俄召復舊職兼知戶部司事三年參知政事同知樞密院事加工部侍郎八年封陳國公上以孝傑勤幹數問以事為北府宰相漢人貴幸無比大康元年賜國姓明年秋獵帝一日射鹿三十燕從官酒酣命賦雲上于天詩詔孝傑坐御榻旁上誦黍離詩知我者謂我心憂不知我者謂我何求孝傑奏曰今天下太平陛下何憂富有四海陛下何求帝大悅三年羣臣侍燕上曰先帝用仁先化葛以賢智也朕有孝傑乙辛不在仁先化葛下誠為得人歡飲至夜乃罷是年夏乙辛譖皇太子孝傑同力相濟及乙辛受詔按皇太子黨人誣害忠良孝傑之謀居多乙辛薦孝傑忠於社稷帝謂孝傑可比狄仁傑賜名仁傑乃許放海東青鶻六年既出乙辛上亦悟孝傑姦佞尋出為武定軍節度使坐私販廣濟湖鹽及擅改詔旨削爵貶安肅州數年乃歸大安中死於鄉乾統初剖棺戮尸以族産分賜臣下孝傑久在相位貪貨無厭時與親戚會飲嘗曰無百萬兩黃金不足為宰相家初孝傑及第詣佛寺忽迅風吹孝傑幞頭與浮圖齊墜地而碎有老僧曰此人必驟貴然亦不得其死竟如其言耶律燕哥字善寧季父房之後四世祖鐸穩太祖異母弟父曰豁里斯官至太師燕哥狡佞而敏清寧間為左護衛太保大康初轉北面林牙初耶律乙辛自中京留守復為樞密使以燕哥為耳目凡聞見必以告乙辛愛而薦之帝亦以為賢拜左夷離畢及皇太子被誣帝遣燕哥往訊之太子謂燕哥曰帝惟我一子今為儲嗣復何求敢為此事公與我為昆弟行當念無辜達意於帝禱之甚懇蕭十三聞之謂燕哥曰宜以太子言易為伏狀燕哥頷之盡如所教以奏及太子被逐乙辛殺害忠良多燕哥之謀為契丹行宮都部署五年夏拜南府宰相遷惕隱大安三年為西京留守致仕壽隆初以疾卒蕭十三蔑古乃部人父鐸魯斡歷官節度使十三辨黠善揣摩人意清寧間以年勞遷護衛太保大康初耶律乙辛復入樞府益橫恣時十三出入乙辛家以朝臣不附者輒使出之十三由宿衛遷殿前副點檢三年夏護衛蕭忽古等謀殺乙辛事覺下獄十三謂乙辛曰今太子猶在臣民屬心大王素無根柢之助復有誣皇后之怨若太子立王置身何地宜熟計之乙辛曰吾憂此久矣是夜召蕭得𩹉特謀所以構太子事十三計既行尋遷殿前都點檢兼同知樞密院事復令蕭訛都斡等誣首耶律查剌前告耶律撒剌等事皆實詔究其事太子不服別遣夷離畢耶律燕哥問太子太子具陳所以見誣之狀十三聞之謂燕哥曰如此奏則大事去矣當易其辭為伏發燕哥入如十三言奏之上大怒廢太子太子將出曰我何罪至是十三叱令登車遣衛卒闔車門是年遷北院樞密副使復陳陰害太子計乙辛從之及乙辛出知南院大王事亦出十三為保州統軍使卒乾統間剖棺戮尸二子的里得念經皆伏誅
