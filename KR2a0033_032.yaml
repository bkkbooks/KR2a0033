body:
  text: 遼史卷三十二志第二營衞志中行營周官土圭之法日東景夕多風日北景長多寒天地之間風氣異宜人生其間各適其便王者因三才而節制之長城以南多雨多暑其人耕稼以食桑麻以衣宮室以居城郭以治大漠之間多寒多風畜牧畋漁以食皮毛以衣轉徙隨時車馬為家此天時地利所以限南北也遼國盡有大漠浸包長城之境因宜為治秋冬違寒春夏避暑隨水草就畋漁歲以為常四時各有行在之所謂之捺鉢春捺鉢曰鴨子河濼皇帝正月上旬起牙帳約六十日方至天鵝未至卓帳冰上鑿冰取魚冰泮乃縱鷹鶻捕鵝雁晨出暮歸從事弋獵鴨子河濼東西二十里南北三十里在長春州東北三十五里四面皆沙堝多榆柳杏林皇帝每至侍御皆服墨綠色衣各備連鎚一柄鷹食一器刺鵝錐一枚於濼周圍相去各五七步排立皇帝冠巾衣時服繫玉束帶於上風望之有鵝之處舉旗探騎馳報遠泊鳴鼓鵝驚騰起左右圍騎皆舉幟麾之五坊擎進海東青鶻拜授皇帝放之鶻擒鵝墜勢力不加排立近者舉錐刺鵝取腦以飼鶻救鶻人例賞銀絹皇帝得頭鵝薦廟羣臣各獻酒果舉樂更相酬酢致賀語皆插鵝毛于首以為樂賜從人酒遍散其毛弋獵網鈎春盡乃還夏捺鉢無常所多在吐兒山道宗每歲先幸黑山拜聖宗興宗陵賞金蓮乃幸子河避暑吐兒山在黑山東北三百里近饅頭山黑山在慶州北十三里上有池池中有金蓮子河在吐兒山東北三百里懷州西山有清涼殿亦為行幸避暑之所四月中旬起牙帳卜吉地為納涼所五月末旬六月上旬至居五旬與北南臣僚議國事暇日遊獵七月中旬乃去秋捺鉢曰伏虎林七月中旬自納涼處起牙帳入山射鹿及虎林在永州西北五十里嘗有虎據林傷害居民畜牧景宗領數騎獵焉虎伏草際戰慄不敢仰視上舍之因號伏虎林每歲車駕至皇族而下分布濼水側伺夜將半鹿飲鹽水令獵人吹角效鹿鳴既集而射之謂之舐鹿又名呼鹿冬捺鉢曰廣平淀在永州東南三十里本名白馬淀東西二十餘里南北十餘里地甚坦夷四望皆沙磧木多榆柳其地饒沙冬月稍暖牙帳多於此坐冬與北南大臣會議國事時出校獵講武兼受南宋及諸國禮貢皇帝牙帳以槍為硬寨用毛繩連繫每槍下黑氈傘一以庇衞士風雪槍外小氈帳一層每帳五人各執兵仗為禁圍南有省方殿殿北約二里曰壽寧殿皆木柱竹榱以氈為蓋彩繪韜柱錦為壁衣加緋繡額又以黃布繡龍為地障牕槅皆以氈為之傅以黃油絹基高尺餘兩廂廊廡亦以氈蓋無門戶省方殿北有鹿皮帳帳次北有八方公用殿壽寧殿北有長春帳衞以硬寨宮用契丹兵四千人每日輪番千人祗直禁圍外卓槍為寨夜則拔槍移卓御寢帳周圍拒馬外設鋪傳鈴宿衞每歲四時周而復始皇帝四時巡守契丹大小內外臣僚幷應役次人及漢人宣徽院所管百司皆從漢人樞密院中書省唯摘宰相一員樞密院都副承旨二員令史十人中書令史一人御史臺大理寺選摘一人扈從每歲正月上旬車駕啟行宰相以下還於中京居守行遣漢人一切公事除拜官僚止行堂帖權差俟會議行在所取旨出給誥敕文官縣令錄事以下更不奏聞聽中書銓選武官須奏聞五月納涼行在所南北臣僚會議十月坐冬行在所亦如之部族上部落曰部氏族曰族契丹故俗分地而居合族而處有族而部者五院六院之類是也有部而族者奚王室韋之類是也有部而不族者特里特勉稍瓦曷朮之類是也有族而不部者遙輦九帳皇族三父房是也奇首八部為高麗蠕蠕所侵僅以萬口附于元魏生聚未幾北齊見侵掠男女十萬餘口繼為突厥所逼寄處高麗不過萬家部落離散非復古八部矣別部有臣附突厥者內附於隋者依紇臣水而居部落漸衆分為十部有地遼西五百餘里唐世大賀氏仍為八部而松漠玄州別出亦十部也遙輦氏承萬榮可突于散敗之餘更為八部然遙輦迭剌別出又十部也阻午可汗析為二十部契丹始大至于遼太祖析九帳三房之族更列二十部聖宗之世分置十有六增置十有八幷舊為五十四部內有拔里乙室已國舅族外有附庸十部盛矣其氏族可知者略具皇族外戚二表餘五院六院乙室部止見益古撒里本涅剌烏古部止見撒里卜涅勒突呂不突舉部止見塔古里航斡皆兄弟也奚王府部時瑟哲里則臣主也品部有拏女楮特部有洼其餘世系名字皆漫無所考矣舊志曰契丹之初草居野次靡有定所至涅里始制部族各有分地太祖之興以迭剌部強熾析為五院六院奚六部以下多因俘降而置勝兵甲者即著軍籍分隸諸路詳穩統軍招討司番居內地者歲時田牧平莽間邊防糺戶生生之資仰給畜牧績毛飲湩以為衣食各安舊風狃習勞事不見紛華異物而遷故家給人足戎備整完卒之虎視四方強朝弱附東踰蟠木西越流沙莫不率服部族實為之爪牙云古八部悉萬丹部何大何部伏弗郁部羽陵部日連部匹絜部黎部吐六于部契丹之先曰奇首可汗生八子其後族屬漸盛分為八部居松漠之間今永州木葉山有契丹始祖廟奇首可汗可敦併八子像在焉潢河之西土河之北奇首可汗故壤也隋契丹十部元魏末莫弗賀勿于畏高麗蠕蠕侵逼率車三千乘衆萬口內附乃去奇首可汗故壤居白狼水東北齊文宣帝自平州三道來侵虜男女十餘萬口分置諸州又為突厥所逼以萬家寄處高麗境內隋開皇四年諸莫弗賀悉衆款塞聽居白狼故地又別部寄處高麗者曰出伏等率衆內附詔置獨奚那頡之北又別部臣附突厥者四千餘戶來降詔給糧遣還固辭不去部落漸衆徙逐水草依紇臣水而居在遼西正北二百里其地東西亙五百里南北三百里分為十部逸其名唐大賀氏八部達稽部峭落州紇便部彈汗州獨活部無逢州芬問部羽陵州突便部日連州芮奚部徒河州墜斤部萬丹州伏部州二匹黎赤山唐太宗置玄州以契丹大帥據曲為刺史又置松漠都督府以窟哥為都督分八部幷玄州為十州則十部在其中矣遙輦氏八部旦利皆部乙室活部實活部納尾部頻沒部納會雞部集解部奚嗢部當唐開元天寶間大賀氏既微遼始祖涅里立迪輦祖里為阻午可汗時契丹因萬榮之敗部落凋散即故有族衆分為八部涅里所統迭剌部自為別部不與其列幷遙輦迭剌亦十部也遙輦阻午可汗二十部耶律七部審密五部八部涅里相阻午可汗分三耶律為七二審密為五并前八部為二十部三耶律一曰大賀二曰遙輦三曰世里即皇族也二審密一曰乙室已二曰拔里即國舅也其分部皆未詳可知者曰迭剌曰乙室曰品曰楮特曰烏隗曰突呂不曰捏剌曰突舉又有右大部左大部凡十逸其二大賀遙輦析為而世里合為一茲所以迭剌部終遙輦之世強不可制云
