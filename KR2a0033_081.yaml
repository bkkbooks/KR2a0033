body:
  text: 遼史卷八十一列傳第十一耶律室魯歐里斯王繼忠蕭孝忠陳昭袞蕭合卓耶律室魯字乙辛隱六院部人魁岸美容儀聖宗同年生帝愛之甫冠補祗候郎君未幾為宿直官及出師伐宋為隊帥從南府宰相耶律奴瓜統軍使蕭撻覽略地趙魏有功加檢校太師為北院大王攻拔通利軍宋和議成特進門下平章事賜推誠竭節保義功臣以本部俸羊多闕部人空乏請以羸老之羊及皮毛歲易南中絹彼此利之拜北院樞密使封韓王自韓德讓知北院職多廢曠室魯拜命之日朝野相慶從上獵松林至沙嶺卒年四十四贈守司徒政事令二子十神奴歐里斯十神奴南院大王歐里思字留隱少有大志未冠補祗候郎君開泰初為本部司徒秩滿間居徵為郎君班詳穩遷右皮室詳穩將本部兵從東平王蕭排押伐高麗至茶陀二河戰不利歐里斯獨全軍還帝嘉賞終西南面招討使王繼忠不知何郡人仕宋為鄆州刺史殿前都虞候統和二十一年宋遣繼忠屯定之望都以輕騎覘我軍遇南府宰相耶律奴瓜等獲之太后知其賢授戶部使以康默記族女女之繼忠亦自激昂事必盡力宋以繼忠先朝舊臣每遣使必有附賜聖宗許受之二十二年宋使來聘遺繼忠孤矢鞭策及求和劄子有曰自臨大位愛養黎元豈欲窮兵惟思息戰每敕邊事嚴諭守臣至于北界人民不令小有侵擾衆所具悉爾亦備知向以知雄州何承矩已布此懇自後杳無所聞汝可密言如許通和即當別使往請詔繼忠與宋使相見仍許講和以繼忠家無奴隸賜宮戶三十加左武衛上將軍攝中京留守開泰五年為漢人行宮都部署封琅邪郡王六年進楚王賜國姓上嘗燕飲議以蕭合卓為北院樞密使繼忠曰合卓雖有刀筆才暗於大體蕭敵烈才行兼備可任上不納竟用合卓及遣合卓伐高麗繼忠為行軍副部署攻興化鎮月餘不下師還上謂明於知人拜樞密使太平三年致仕卒子懷玉仕至防禦使蕭孝忠字撒板小字圖古斯志慷慨開泰中補祗候郎君尚越國公主拜駙馬都尉纍遷殿前都點檢太平中擢北府宰相重熙七年為東京留守時禁渤海人擊毬孝忠言東京最為重鎮無從禽之地若非毬馬何以習武且天子以四海為家何分彼此宜弛其禁從之十二年入朝封楚王拜北院樞密使國制以契丹漢人分北南院樞密治之孝忠奏曰一國二樞密風俗所以不同若併為一天下幸甚事未及行薨追封楚國王帝素服哭臨赦死囚數人為孝忠薦福葬日親臨賜宮戶守冢子阿速終南院樞密使陳昭袞小字王九雲州人工譯鞮勇而善射統和中補祗候郎君為奚拽剌詳穩纍遷敦睦宮太保兼掌圍場事開泰五年秋大獵帝射虎以馬馳太速矢不及發虎怒奮勢將犯蹕左右辟易昭袞捨馬捉虎兩耳騎之虎駭且逸上命衛士追射昭袞大呼止之虎雖軼山昭袞終不墮地伺便拔佩刀殺之輦至上前慰勞良久即日設燕悉以席上金銀器賜之特加節鉞遷圍場都太師賜國姓命張儉呂德懋賦以美之遷歸義軍節度使同知上京留守歷西南面招討都監卒蕭合卓字合魯隱突呂不部人始為本部吏統和初以謹恪補南院侍郎十八年北院樞密使韓德讓舉合卓為中丞以太后遺物使宋還遷北院樞密副使開泰三年為左夷離畢合卓久居近職明習典故善占對以是尤被寵渥升北院樞密使時議以為無完行不可大用南院樞密使王繼忠侍宴又譏其短帝頗不悅六年遣合卓伐高麗還時求進者多附之然其服食僕馬不加于舊帝知其廉以族屬女妻其子詔許親友饋獻豪貴奔趨于門太平五年有疾帝欲臨視合卓辭曰臣無狀猥蒙重任今形容毀瘁恐陛下見而動心帝從之會北府宰相蕭朴問疾合卓執其手曰吾死君必為樞密使慎勿舉勝己者朴出而鄙之是日卒子烏古終本部節度使論曰統和諸臣名昭王室者多矣室魯拜樞密使朝野相慶必有得民心者繼忠既不能死國雖通南北之和有知人之鑑奚足尚哉孝忠昭袞皆有可稱者合卓臨終教蕭朴毋舉勝己者任樞密其誤國之罪大矣
