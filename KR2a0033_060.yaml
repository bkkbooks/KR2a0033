body:
  text: 遼史卷六十志第二十九食貨志下征商之法則自太祖置羊城于炭山北起榷務以通諸道市易太宗得燕置南京城北有市百物山偫命有司治其征餘四京及它州縣貨産懋遷之地置亦如之東平郡城中置看樓分南北市禺中交易市北午漏下交易市南雄州高昌渤海亦立互市以通南宋西北諸部高麗之貨故女直以金帛布蜜蠟諸藥材及鐵離靺鞨于厥等部以蛤珠青鼠貂鼠膠魚之皮牛羊駝馬毳罽等物來易於遼者道路繈屬聖宗統和初燕京留守司言民艱食請弛居庸關稅以通山西糴易又令有司諭諸行宮布帛短狹不中尺度者不鬻於市明年詔以南北府市場人少宜率當部車百乘赴集開奇峰路以通易州貿易二十三年振武軍及保州並置榷埸時北院大王耶律室魯以俸羊多闕部人貧乏請以羸老之羊及皮毛易南中之絹上下為便至天祚之亂賦斂既重交易法壞財日匱而民日困矣鹽策之法則自太祖以所得漢民數多即八部中分古漢城別為一部治之城在炭山南有鹽池之利即後魏滑鹽縣也八部皆取食之及征幽薊還次于鶴剌濼命取鹽給軍自後濼中鹽益多上下足用會同初太宗有大造於晉晉獻十六州地而瀛莫在焉始得河間煮海之利置榷鹽院於香河縣於是燕雲迤北暫食滄鹽一時産鹽之地如渤海鎮城海陽豐州陽洛城廣濟湖等處五京計司各以其地領之其煎取之制歲出之額不可得而詳矣坑冶則自太祖始併室韋其地産銅鐵金銀其人善作銅鐵器又有曷朮部者多鐵曷朮國語鐵也部置三冶曰柳濕河曰三黜古斯曰手山神冊初平渤海得廣州本渤海鐵利府改曰鐵利州地亦多鐵東平縣本漢襄平縣故地産鐵礦置採煉者三百戶隨賦供納以諸坑冶多在國東故東京置戶部司長春州置錢帛司太祖征幽薊師還次山麓得銀鐵礦命置冶聖宗太平間於潢河北陰山及遼河之源各得金銀礦興冶採煉自此以訖天祚國家皆賴其利鼓鑄之法先代撒剌的為夷離堇以土産多銅始造錢幣太祖其子襲而用之遂致富強以開帝業太宗置五冶太師以總四方錢鐵石敬瑭又獻沿邊所積錢以備軍實景宗以舊錢不足於用始鑄乾亨新錢錢用流布聖宗鑿大安山取劉守光所藏錢散諸五計司兼鑄太平錢新舊互用由是國家之錢演迤域中所以統和出內藏錢賜南京諸軍司開泰中詔諸道貧乏百姓有典質男女計傭價日以十文折盡還父母每歲春秋以官錢宴饗將士錢不勝多故東京所鑄至清寧中始用是時詔禁諸路不得貨銅鐵以防私鑄又禁銅鐵賣入回鶻法益嚴矣道宗之世錢有四等曰咸雍曰大康曰大安曰壽隆皆因改元易名其肉好銖數亦無所考第詔楊遵勗徵戶部司逋戶舊錢得四十餘萬繈拜樞密直學士劉伸為戶部使歲入羡餘錢三十萬繈擢南院樞密使其以災沴出錢以振貧乏及諸宮分邊戍人戶是時雖未有貫朽不可較之積亦可謂富矣至其末年經費浩穰鼓鑄仍舊國用不給雖以海雲佛寺千萬之助受而不拒尋禁民錢不得出境天祚之世更鑄乾統天慶二等新錢而上下窮困府庫無餘積始太祖為迭烈府夷離堇也懲遙輦氏單弱於是撫諸部明賞罰不妄征討因民之利而利之羣牧蓄息上下給足及即位伐河東下代北郡縣獲牛羊駝馬十餘萬樞密使耶律斜軫討女直復獲馬二十餘萬分牧水草便地數歲所增不勝算當時括富人馬不加多賜大小鶻軍萬餘匹不加少蓋畜牧有法然也咸雍五年蕭陶隗為馬羣太保上書猶言羣牧名存實亡上下相欺宜括實數以為定籍厥後東丹國歲貢千匹女直萬匹直不古等國萬匹阻卜及吾獨婉惕德各二萬匹西夏室韋各三百匹越里篤剖阿里奧里米蒲奴里鐵驪等諸部三百匹仍禁朔州路羊馬入宋吐渾党項馬鬻于夏以故羣牧滋繁數至百有餘萬諸司牧官以次進階自太祖及興宗垂二百年羣牧之盛如一日天祚初年馬猶有數萬羣每羣不下千匹祖宗舊制常選南征馬數萬匹牧于雄霸清滄間以備燕雲緩急復選數萬給四時遊畋餘則分地以牧法至善也至末年纍與金戰番漢戰馬損十六七雖增價數倍竟無所買乃冒法買官馬從軍諸羣牧私賣日多畋獵亦不足用遂為金所敗棄衆播遷以訖于亡松漠以北舊馬皆為大石林牙所有遼之食貨其可見者如是耳至於鄰國歲幣諸屬國歲貢土宜雖纍朝軍國經費多所仰給然非本國所出況名數已見本紀茲不復載夫冀北宜馬海濱宜鹽無以議為遼地半沙磧三時多寒春秋耕穫及其時黍稌高下因其地蓋不得與中土同矣然而遼自初年農穀充羡振饑恤難用不少靳旁及鄰國沛然有餘果何道而致其利歟此無他勸課得人規措有法故也世之論錢幣者恆患其重滯之難致鼓鑄之弗給也於是楮幣權宜之法興焉西北之通舟楫比之東南十才一二遼之方盛貨泉流衍國用以殷給戍賞征賜與億萬未聞有所謂楮幣也又何道而致其便歟此無他舊儲新鑄並聽民用故也孟子曰周于利者凶年不能殺人力苟至一夫猶足以勝時災況為國乎以是知善謀國者有道以制天時地利之宜無往而不遂其志食莫大於穀貨莫大於錢特志二者以表遼初用事之臣亦善裕其國者矣
