body:
  text: 遼史卷八十六列傳第十六耶律合住劉景劉六符耶律裊履牛溫舒杜防蕭和尚特末耶律合里只耶律頗的耶律合住字粘袞太祖弟迭剌之孫幼不好弄臨事明敏善談論初以近族入侍每從征伐有功保寧初加右龍虎衛上將軍以宋師屢梗南邊拜涿州刺史西南兵馬都監招安巡檢等使賜推忠奉國功臣合住久任邊防雖有克獲功然務鎮靜不妄生事以邀近功鄰壤敬畏屬部乂安宋數遣人結歡冀達和意合住表聞其事帝許議和安邊懷敵多有力焉拜左金吾衛上將軍秩滿遙攝鎮國軍節度使卒合住智而有文曉暢戎政鎮范陽時嘗領數騎徑詣雄州北門與郡將立馬陳兩國利害及周師侵邊本末辭氣慷慨左右壯之自是邊境數年無事識者以謂合住一言賢於數十萬兵劉景字可大河間人四世祖怦即朱滔之甥唐右僕射盧龍軍節度使父守敬南京副留守景資端厚好學能文燕王趙延壽辟為幽都府文學應曆初遷右拾遺知制誥為翰林學士九年周人侵燕留守蕭思溫上急變帝欲俟秋出師景諫曰河北三關已陷于敵今復侵燕安可坐視上不聽會父憂去未幾起復舊職一日召草赦既成留數月不出景奏曰唐制赦書日行五百里今稽期弗發非也上亦不報景宗即位以景忠實擢禮部侍郎遷書宣政殿學士上方欲倚用乃書其笏曰劉景可為宰相頃之為南京副留守時留守韓匡嗣因扈從北上景與其子德讓共理京事俄召為戶部使歷武定開遠二軍節度使統和六年致仕加兼侍中卒年六十七贈太子太師子慎行孫一德二玄三嘏四端五常六符皆具六符傳劉六符父慎行由膳部員外郎纍遷至北府宰相監修國史時上多即宴飲行誅賞慎行諫曰以喜怒加威福恐未當帝悟諭政府自今宴飲有刑賞事翌日稟行為都統伐高麗以失軍期下吏議貴乃免出為彰武軍節度使賜保節功臣子六人一德二玄三嘏四端五常六符德早世玄終上京留守常歷三司使武定軍節度使嘏端符皆第進士嘏端俱尚主為駙馬都尉三嘏獻聖宗一矢斃雙鹿賦上嘉其贍麗與公主不諧奔宋歸殺之四端以衛尉少卿使宋賀生辰方宴大張女樂竟席不顧人憚其嚴還拜樞密直學士六符有志操能文重熙初遷政事舍人擢翰林學士十一年與宣徽使蕭特末使宋索十縣地還為漢人行宮副部署會宋遣使增歲幣以易十縣復與耶律仁先使宋定進貢名宋難之六符曰本朝兵強將勇海內共知人人願從事于宋若恣其俘獲以飽所欲與進貢字孰多況大兵駐燕萬一南進何以禦之顧小節忘大患悔將何及宋乃從之歲幣稱貢六符還加同中書門下平章事及宋幣至命六符為三司使以受之六符與參知政事杜防有隙防以六符嘗受宋賂白其事出為長寧軍節度使俄召為三司使道宗即位將行大册禮北院樞密使蕭革曰行大禮備儀物必擇廣地莫若黃川六符曰不然禮儀國之大體帝王之樂不奏于野今中京四方之極朝覲各得其所宜中京行之上從其議尋以疾卒耶律裊履字海鄰六院夷離堇蒲古只之後風神爽秀工于畫重熙間纍遷同知點檢司事駙馬都尉蕭胡覩為夏人所執奉詔索之三返以歸轉永興宮使右祗候郎君班詳穩裊履將娶秦晉長公主孫其母與公主婢有隙謂裊履曰能去婢乃許爾婚裊履以計殺之婚成事覺有司以大辟論裊履善畫寫聖宗真以獻得減坐長流邊戍復以寫真召拜同知南院宣徽事使宋賀正寫宋主容以歸清寧間復使宋宋主賜宴瓶花隔面未得其真陛辭僅一視及境以像示餞者駭其神妙聞重元亂不即勤王賊平入賀帝責讓之宴酣顧裊履曰重元事成卿必得為上客裊履大慚咸雍中加太子太師卒牛溫舒范陽人剛正尚節義有遠器咸雍中擢進士第滯小官大安初纍遷戶部使轉給事中知三司使事國民兼足上以為能加戶部侍郎改三司使壽隆中拜參知政事兼同知樞密院事攝中京留守部民詣闕請真拜從之召為三司使乾統初復參知政事知南院樞密使事五年夏為宋所攻來請和解溫舒與蕭得里底使宋方大燕優人為道士裝索土泥藥爐優曰土少不能和溫舒遽起以手藉土懷之宋主問其故溫舒對曰臣奉天子威命來和若不從則當卷土收去宋人大驚遂許夏和還加中書令卒杜防涿州歸義縣人開泰五年擢進士甲科纍遷起居郎知制誥人以為有宰相器太平中遷政事舍人拜樞密副使重熙九年夏人侵宋宋遣郭稹來告請與夏和上命防使夏解之如約罷兵各歸侵地拜參知政事韓紹芳劉六符忌之防待以誠十二年紹芳等罷愈見信任十三年拜南府宰相十五年防生子帝幸其第賜名王門奴以進奏有誤出為武定軍節度使十七年復召為南府宰相二十一年秋祭仁德皇后詔儒臣賦詩防為冠賜金帶道宗諒陰為大行皇帝山陵使清寧二年上諭防曰朕以卿年老嗜酒不欲煩以劇務朝廷之事總綱而已頃之拜右丞相加尚父卒上歎悼不已賵贈加等官給葬具贈中書令諡曰元肅子公謂終南府宰相蕭和尚字洪寧國舅大父房之後忠直多智略開泰初補御盞郎君尋為內史太醫等局都林牙使宋賀正將宴典儀者告班節度使下和尚曰班次如此是不以大國之使相禮且以錦服為貺如待蕃部若果如是吾不預宴宋臣不能對易以紫服位視執政使禮始定八年秋為唐古部節度使卒弟特末特末字何寧為人機辨任氣太平中纍遷安東軍節度使有能稱十一年召為左祗候郎君班詳穩未幾遷左夷離畢重熙十年纍遷北院宣徽使明年與劉六符使宋索十縣故地宋請增銀絹十萬兩匹以易之歸稱旨加同政事門下平章事詔城西南渾底甸還復為北院宣徽使卒耶律合里只字特滿六院夷離堇蒲古只之後重熙中纍遷西南面招討都監充宋國生辰使館于白溝驛宋宴勞優者嘲蕭惠河西之敗合里只曰勝負兵家常事我嗣聖皇帝俘石重貴至今興中有石家寨惠之一敗何足較哉宋人慚服帝聞之曰優伶失辭何可傷兩國交好鞭二百免官清寧初起為懷化軍節度使七年入為北院大王封豳國公歷遼興軍節度使東北路詳穩加兼侍中致仕卒合里只明達勤恪懷柔有道置諸賓館及西邊營田皆自合里只發之耶律頗的字撒版季父房奴瓜之孫孤介寡合重熙初補牌印郎君清寧初稍遷知易州去官部民請留許之咸雍八年改彰國軍節度使上獵大牢古山頗的謁于行宮帝問邊事對曰自應州南境至天池皆我耕牧之地清寧間邊將不謹為宋所侵烽堠內移似非所宜道宗然之拜北面林牙後遣人使宋得其侵地命頗的往定疆界還拜南院宣徽使大康四年遷忠順軍節度使尋為南院大王改同知南京留守事召拜南府宰相賜貞良功臣封吳國公為北院樞密使廉謹奉公知無不為大安中致仕卒子霞抹北院樞密副使論曰耶律合住安邊講好養兵息民其慮深遠矣六符啓釁邀功豈國家之利哉牛杜頗的合里只輩銜命出使幸不辱命裊里殺人婢以求婚身負罪釁畫其主容以冀免死亦可醜也
