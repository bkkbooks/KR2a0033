body:
  text: 遼史卷九十二列傳第二十二蕭奪刺蕭普達耶律侯哂耶律古昱耶律獨蕭韓家蕭烏野蕭奪剌字挼懶遙輦窪可汗宮人祖涅魯古北院樞密副使父撒抹字胡獨堇重熙初補祗候郎君纍遷北面林牙十九年從耶律宜新蕭蒲奴伐夏至蕭惠敗績之地獲偵候者知人煙聚落多國人陷沒而不能還者盡俘以歸拜大父敞穩知山北道邊境事清寧初歷西南面西北路招討使加同中書門下平章事卒奪剌體貌豐偉騎射絶人由祗候郎君升漢人行宮副部署後為烏古敵烈統軍使克敵有功加龍虎衛上將軍授西北路招討使因陳北邊利害請以本路諸部與倒塌嶺統軍司連兵屯戍再表不納改東北路統軍使乾統元年以久練邊事復為西北路招討使北阻卜耶覩刮率鄰部來侵奪剌逆擊追奔數十里二年乘耶覩刮無備以輕騎襲之獲馬萬五千匹牛羊稱是先是有詔方面無事招討副統軍都監內一員入覲是時同僚皆闕奪剌以軍事付幕吏而朝坐是免官改西京留守復為東北路統軍使卒于官蕭普達字彈隱統和初為南院承旨開泰六年出為烏古部節度使七年敵烈部叛討平之徙烏古敵烈部都監遣敵烈騎卒取北阻卜名馬以獻賜詔褒奬重熙初改烏古敵烈部都詳穩討諸蕃有功普達深練邊事能以悅使人有所俘獲悉散麾下由是大得衆心歷西南面招討使黨項叛入西夏普達討之中流矢歿于陳帝聞惜之賻贈加厚耶律侯哂字禿寧北院夷離堇蒲古只之後祖查只北院大王父忽古黃皮室詳穩侯哂初為西南巡邊官以廉潔稱纍遷南京統軍使尋為北院大王重熙十一年黨項部人多叛入西夏侯哂受詔巡西邊沿河要地多建城堡以鎮之徙東京留守十三年與知府蕭歐里斯討蒲盧毛𩽆部有功加兼侍中致仕卒耶律古昱字磨魯堇北院林牙突呂不四世孫有膂力工馳射開泰間為烏古敵烈部都監會部人叛從樞密使耶律世良討平之以功詔鎮撫西北部教以種樹畜牧不數年民多富實中京盜起命古昱為巡邏使悉擒之上親征渤海將黃皮室軍有破敵功纍遷御史中丞尋授開遠軍節度使徙鎮歸德重熙二十一年改天成軍節度使卒于官年七十贈同中書門下平章事二子宜新兀沒宜新重熙間從蕭惠討西夏惠敗績宜新一軍獨全拜北院大王兀沒大康三年為漢人行宮副部署乙辛誣害太子詞連兀沒帝釋之是秋乙辛復奏與蕭楊九私議宮壼事被害乾統間贈同中書門下平章事耶律獨字胡獨堇太師古昱之子重熙初為左護衛將禁兵從伐夏有功授十二行糾司徒再舉伐夏獨括山西諸郡馬還遷拽剌詳穩西南未平命獨同知金肅軍事夏人來侵擊敗之進涅剌奧隗部節度使清寧元年召為皇太后左護衛太保四年改寧遠軍節度使東路飢奏振之歷五國烏古部遼興軍三鎮節度使四捷軍詳穩大康元年卒追贈同中書門下平章事子阿思有傳蕭韓家國舅之族性端簡謹願動循禮法清寧中為護衛太保大康二年遷知北院樞密副使三年經畫西南邊天池舊塹立堡寨正疆界刻石而還為漢人行宮都部署是年秋獵墮馬卒蕭烏野字草隱其先出興聖宮分觀察使塔里直之孫也性孝悌尚禮法雅為鄉黨所稱重熙中補護衛興宗見其勤恪遷護衛太保清寧九年佐耶律仁先平重元亂以功加團練使時敵烈部數為鄰部侵擾民多困弊命烏野為敵烈部節度使恤困窮省徭役不數月部人以安尋以母老歸養于家母亡尤極哀毀服闋歷官興聖延慶二宮使卒論曰烏古敵烈大部也奪刺為統軍克敵有功普達居詳穩悅以使人西北重鎮也侯哂巡邊以廉稱古昱鎮撫而民富獨駐金肅而夏人不敢東獵噫部人內附方面以寧雖朝廷處置得宜而諸將之力抑亦何可少哉
