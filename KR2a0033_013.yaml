body:
  text: 遼史卷十三本紀第十三聖宗四八年春正月辛巳如臺湖庚寅詔決滯獄庚子如沈子濼二月丁未朔于闐回鶻各遣使來貢壬申女直遣使來貢三月丁丑李繼遷遣使來貢庚辰太白熒惑鬬凡十有五次乙酉城杏堝以宋俘實之辛丑置宜州夏四月丙午朔嚴州刺史李壽英有惠政民請留從之庚戌女直遣使來貢庚午以歲旱諸部艱食振之五月戊子以宋降卒分隸諸軍庚寅女直宰相阿海來貢封順化王丙申清暑胡土白山詔括民田六月丙午以北面林牙磨魯古為北院大王阿薩蘭回鶻于越達剌干各遣使來貢甲寅月掩天駟第一星丙辰女直遣使來貢秋七月庚辰改南京熊軍為神軍詔東京路諸宮分提轄司分置定霸保和宣化三縣白川州置洪理儀坤州置廣義遼西州置長慶乾州置安德各一縣省遂媯松饒寧海瑞玉鐵里奉德等十州及玉田遼豐松山弘遠懷清雲龍平澤平山等八縣以其民分隸他郡八月乙卯以黑白羊祭天地九月乙亥北女直四部請內附壬辰李繼遷獻宋俘冬十月丙午以大敗宋軍復遣使來告己酉阻卜等遣使來貢是月駐蹕大王川十一月庚寅以吐谷渾民饑振之丁酉太白晝見十二月癸卯李繼遷下宋麟鄜等州遣使來告女直遣使來貢庚戌遣使封李繼遷為夏國王癸丑回鶻來貢是歲放鄭雲從等二人及第九年春正月甲戌女直遣使來貢丙子詔禁私度僧尼庚辰如臺湖乙酉樞密使監修國史室昉等進實録賜物有差戊子選宋降卒五百置為宣力軍辛卯詔免三京諸道租賦仍罷括田二月丙午夏國遣使告伐宋捷丁未以涿州刺史耶律王六為惕隱甲子建威寇振化來遠三城屯戍卒閏月辛未朔日有食之壬申遣翰林承旨邢抱朴三司使李嗣給事中劉京政事舍人張幹南京副留守吳浩分決諸道滯獄三月庚子朔振室韋烏古諸部戊申復遣庫部員外郎馬守琪倉部員外郎祁正虞部員外郎崔祐薊北縣令崔簡等分決諸道滯獄甲子幸南京夏四月甲戌回鶻來貢乙亥夏國王李繼遷遣杜白來謝封冊丙戌清暑炭山五月己未以秦王韓匡嗣私城為全州六月丁亥突厥來貢是月南京霖雨傷稼秋七月癸卯通括戶口乙巳詔諸道舉才行察貪酷撫高年禁奢僭有歿於王事者官其子孫己未夏國以復綏銀二州遣使來告八月癸酉銅州嘉禾生東京甘露降戊寅女直進喚鹿人壬午東京進三足烏九月庚子鼻骨德來貢己酉駐蹕廟城南京地震冬十月丁卯阿薩蘭回鶻來貢壬申夏國王李繼遷遣使來上宋所授敕命丁丑定難軍節度使李繼捧來附授推忠效順啓聖定難功臣開府儀同三司檢校太師兼侍中封西平王十一月己亥以青牛白馬祭天地十二月夏國王李繼遷潛附于宋遣招討使韓德威持詔諭之是歲放進士石用中一人及第十年春正月丁酉禁喪葬禮殺馬及藏甲胄金銀器玩丙午如臺湖二月乙丑朔日有食之韓德威奏李繼遷稱故不出至靈州俘掠以還壬申兀惹來貢壬午免雲州租賦庚寅夏國以韓德威俘掠遣使來奏賜詔安慰辛卯給復雲州流民三月甲辰鐵驪來貢丙辰如炭山夏四月乙丑以臺湖為望幸里庚寅命羣臣較射五月癸巳朔州流民給復三年七月辛酉鐵驪來貢八月癸亥觀稼仍遣使分閲苗稼九月癸卯幸五臺山金河寺飯僧冬十月壬申夏國王遣使來貢戊寅鐵驪來貢十一月壬辰回鶻來貢十二月庚辰獵儒州東川拜天是月以東京留守蕭德等伐高麗十一年春正月壬寅回鶻來貢丙午出內帑錢賜南京統軍司軍高麗王治遣朴良柔奉表請罪詔取女直鴨淥江東數百里地賜之二月癸亥霸州民妻王氏以妖惑衆伏誅夏四月幸炭山清暑六月大雨秋七月己丑桑乾羊河溢居庸關西害禾稼殆盡奉聖南京居民廬舍多墊溺者八月如秋山冬十月甲申朔駐蹕蒲瑰坂是年放進士王熙載等二人及第十二年春正月癸丑朔漷陰鎮水漂溺三十餘村詔疏舊渠甲寅以同政事門下平章事耶律碩老為惕隱詔復行在五十里內租乙卯幸延芳淀戊午蠲宜州賦調庚申郎君耶律鼻舍等謀叛伏誅壬戌以南院大王耶律景為上京留守封漆水郡王霸州民李在宥年百三十有三賜束帛錦袍銀帶月給羊酒仍復其家二月甲申免南京被水戶租賦己丑高麗來貢甲午免諸部歲輸羊及關征庚子回鶻來貢三月丁巳高麗遣使請所俘人畜詔贖還戊午幸南京丙寅遣使撫諭高麗己巳涿州木連理壬申如長春宮觀牡丹是月復置南京統軍都監夏四月辛卯幸南京壬辰樞密直學士劉恕為南院樞密副使戊戌以景宗石像成幸延壽寺飯僧五月甲寅詔北皮室軍老不任事者免役戊午如炭山清暑庚辰武定軍節度使韓德冲秩滿其民請留從之六月辛巳朔詔州縣長吏有才能無過者減一資考任之癸未可汗州刺史賈俊進新曆庚子録囚甲辰詔龍鳳兩軍老疾者代之是月太白歲星相犯秋七月辛亥朔日有食之甲寅遣使視諸道禾稼辛酉南院樞密使室昉為中京留守加尚父丙寅女直遣使來貢戊辰觀穫庚午詔契丹人犯十惡者依漢律己卯以翰林承旨邢抱朴參知政事八月庚辰朔詔皇太妃領西北路烏古等部兵及永興宮分軍撫定西邊以蕭撻凜督其軍事乙酉宋遣使求和不許戊子以國舅帳剋蕭徒骨為夷離畢乙未下詔戒諭中外官吏丁酉録囚雜犯死罪以下釋之九月壬子室韋党項吐谷渾等來貢辛酉宋復遣使求和不許壬戌行拜奧禮癸酉阻卜等來貢冬十月乙酉獵可汗州之西山乙巳詔定均稅法丁未大理寺置少卿及正十一月戊申朔行再生禮鐵驪來貢詔諸部所俘宋人有官吏儒生抱器能者諸道軍有勇健者具以名聞庚戌詔郡邑貢明經茂材異等甲寅詔南京決滯獄己未官宋俘衛德升等六人十二月戊寅朔日有食之詔並奚王府奧理墮隗梅只三部為一其二剋各分為部以足六部之數甲申賜南京統軍司貧戶耕牛戊子高麗進妓樂却之庚寅禁游食民癸巳女直以宋人浮海賂本國及兀惹叛來告丁未幸南京是年放進士呂德懋等二人及第十三年春正月壬子幸延芳淀甲寅置廣靈縣丁巳增泰州遂城等縣賦庚申詔諸道勸農癸亥長寧軍節度使蕭解里秩滿民請留從之庚午如長春宮二月丁丑朔女直遣使來貢甲辰高麗遣李周楨來貢三月癸丑夏國遣使來貢戊辰武清縣百餘人入宋境剽掠命誅之還其所獲人畜財物夏四月己卯參知政事邢抱朴以母憂去官起復丙戌詔諸道民戶應曆以來脅從為部曲者仍籍州縣甲午如炭山清暑五月壬子高麗進鷹乙亥北南乙室三府請括富民馬以備軍需不許給以官馬六月丙子朔啓聖軍節度使劉繼琛秩滿民請留從之丁丑詔減前歲括田租賦甲申以宣徽使阿沒里私城為豐州丙戌詔許昌平懷柔等縣諸人請業荒地秋七月乙巳朔女直遣使來貢丁巳兀惹烏昭度渤海燕頗等侵鐵驪遣奚王和朔奴等討之壬戌詔蔚朔等州龍衛威勝軍更戍八月丙子夏國遣使進馬壬辰詔修山澤祠宇先哲廟貌以時祀之九月戊午以南京太學生員浸多特賜水磑莊一區丁卯奉安景宗及皇太后石像于延芳淀冬十月乙亥置義倉辛巳回鶻來貢甲申高麗遣李知白來貢戊子兀惹歸發詔諭之庚子鼻骨德來貢十一月乙巳阿薩蘭回鶻遣使來貢辛酉遣使冊王治為高麗國王戊辰高麗遣童子十人來學本國語十二月己卯鐵驪遣使來貢鷹馬辛巳夏國以敗宋人遣使來告是年放進士王用極等二人十四年春正月己酉漁于潞河丁巳蠲三京及諸州稅賦丙寅夏國遣使來貢庚午以宣徽使阿沒里家奴閻貴為豐州刺史二月庚寅回鶻遣使來貢三月壬寅高麗王治表乞為婚許以東京留守駙馬蕭德女嫁之庚戌高麗復遣童子十人來學本國語甲寅韓德威奏討党項捷甲子詔安集朔州流民夏四月甲戌東邊諸糾各置都監庚寅如炭山清暑己亥鑿大安山取劉守光所藏錢是月奚王和朔奴東京留守蕭德等五人以討兀惹不克削官改諸部令穩為節度使五月癸卯詔參知政事邢抱朴決南京滯獄庚戌朔州威勝軍一百七人叛入宋六月辛未如炭山清暑鐵驪來貢乙酉回鶻來貢己丑高麗遣使來問起居後至無時秋七月戊午回鶻等來貢閏月丁丑五院部進穴地所得金馬冬十月丙辰命劉遂教南京神武軍士劍法賜袍帶錦幣戊午烏昭度乞內附十一月甲戌詔諸軍官毋非時畋獵妨農乙酉奉安景宗及太后石像于乾州是月回鶻阿薩蘭遣使為子求婚不許十二月甲寅以南京道新定稅法太重減之甲子撻凜誘叛酋阿魯敦等六十人斬之封蘭陵郡王幸南京是年放進士張儉等三人十五年春正月庚午幸延芳淀丙子以河西党項叛詔韓德威討之庚辰詔諸道勸民種樹癸未兀惹長武周來降戊子女直遣使來貢己丑詔南京決滯囚乙未免流民稅二月丙申朔如長春宮戊戌勸品部富民出錢以贍貧民庚子徙梁門遂城泰州北平民於內地丙午夏國遣使來貢甲寅問安皇太后丙辰韓德威奏破党項捷丁巳詔品部曠地令民耕種三月乙丑朔党項來貢戊辰募民耕灤州荒地免其租賦十年己巳夏國破宋兵遣使來告己卯封夏國王李繼遷為西平王壬午通括宮分人戶免南京逋稅及義倉粟甲申河西党項乞內附庚寅兀惹烏昭度以地遠乞歲時免進鷹馬貂皮詔以生辰正旦貢如舊餘免癸巳宋主炅殂子嗣位甲午皇太妃獻西邊捷夏四月乙未朔罷奚五部歲貢麕戊戌録囚壬寅發義倉粟振南京諸縣民丙午廣德軍節度使韓德凝有善政秩滿其民請留從之己酉幸南京丁巳致奠于太宗皇帝廟己未如炭山清暑五月甲子朔日有食之己巳詔平州決滯獄是月敵烈八部殺詳穩以叛蕭撻凜追擊獲部族之半六月丙申鐵驪來貢壬子夏國遣使來謝封冊秋七月戊辰党項來貢辛未禁吐谷渾別部鬻馬於宋丙子高麗遣韓彥敬奉幣弔越國公主之喪辛卯詔南京疾決獄訟八月丁酉獵于平地松林皇太后誡曰前聖有言欲不可縱吾兒為天下主馳騁田獵萬一有銜橛之變適遺豫憂其深戒之九月丙寅罷東邊戍卒庚午幸饒州致奠太祖廟戊子蕭撻凜奏討阻卜捷冬十月壬辰朔駐蹕駝山罷奚王諸部貢物乙未賜宿衛時服丁酉禁諸山寺毋濫度僧尼戊戌弛東京道魚濼之禁戊申以上京獄訟繁冗詰其主者辛酉録囚十一月壬戌朔録囚丙戌幸顯州戊子謁顯陵庚寅謁乾陵是月高麗王治薨姪誦遣王同穎來告十二月乙巳鈎魚土河己酉駐蹕駝山壬子夏國遣使來貢甲寅遣使祭高麗王治詔其姪權知國事丙辰録囚是年放進士陳鼎等二人
