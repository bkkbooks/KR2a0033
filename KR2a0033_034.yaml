body:
  text: 遼史卷三十四志第四兵衛志上軒轅氏合符東海邑于涿鹿之阿遷徙往來無常處以兵為營衛飛狐以北無慮以東西暨流沙四戰之地聖人猶不免於兵衛地勢然耳遼國左都遼海右邑涿鹿兵力莫強焉其在隋世依紇臣水而居分為十部兵多者三千少者千餘順寒暑逐水草畜牧侵伐則十部相與議興兵致役合契而後動獵則部得自行至唐大賀氏勝兵四萬三千人分為八部大賀氏中衰僅存五部有耶律雅里者分五部為八立二府以總之析三耶律氏為七二審密氏為五凡二十部刻木為契政令大行遜不有國乃立遙輦氏代大賀氏兵力益振即太祖六世祖也及太祖會李克用于雲中以兵三十萬盛矣遙輦耶瀾可汗十年歲在辛酉太祖授鉞專征破室韋于厥奚三國俘獲廬帳不可勝紀十月授大迭烈府夷離堇明賞罰繕甲兵休息民庶滋蕃羣牧務在戢兵十一年總兵四十萬伐代北克郡縣九俘九萬五千口十二年德祖討奚俘七千戶十五年遙輦可汗卒遺命遜位于太祖太祖即位五年討西奚東奚悉平之盡有奚霫之衆六年春親征幽州東西旌旗相望亙數百里所經郡縣望風皆下俘獲甚衆振旅而還秋親征背陰國俘獲數萬計神冊元年親征突厥吐渾党項小蕃沙陀諸部俘戶一萬五千六百攻振武乘勝而東攻蔚新武媯儒五州俘獲不可勝紀斬不從命者萬四千七百級盡有代北河曲陰山之衆遂取山北八軍四年親征于骨里國俘獲一萬四千二百口五年征党項俘獲二千六百口攻天德軍拔十有二柵徙其民六年出居庸關分兵掠檀順等州安遠軍三河良鄉望都潞滿城遂城等縣俘其民徙內地皇太子略定州俘獲甚衆天贊元年以戶口滋繁糾轄疏遠分北大濃兀為二部立兩節度以統之三年西征党項等國俘獲不可勝紀四年又親征渤海天顯元年滅渤海國地方五千里兵數十萬五京十五府六十二州盡有其衆契丹益大會同初太宗滅唐立晉晉獻燕代十六州民衆兵強莫之能禦矣兵制遼國兵制凡民年十五以上五十以下隸兵籍每正軍一名馬三匹打草穀守營鋪家丁各一人人鐵甲九事馬韉轡馬甲皮鐵視其力弓四箭四百長短鎗斧鉞小旗鎚錐火刀石馬盂一斗袋搭傘各一縻馬繩二百尺皆自備人馬不給糧草日遣打草穀騎四出抄掠以供之鑄金魚符調發軍馬其捉馬及傳命有銀牌二百軍所舍有遠探攔子馬以夜聽人馬之聲凡舉兵帝率蕃漢文武臣僚以青牛白馬祭告天地日神惟不拜月分命近臣告太祖以下諸陵及木葉山神乃詔諸道徵兵惟南北奚王東京渤海兵馬燕京統軍兵馬雖奉詔未敢發兵必以聞上遣大將持金魚符合然後行始聞詔攢戶丁推戶力核籍齊衆以待自十將以上次第點集軍馬器仗符至兵馬本司自領使者不得與唯再共點軍馬訖又以上聞量兵馬多少再命使充軍主與本司互相監督又請引五方旗鼓然後皇帝親點將校又選勳戚大臣充行營兵馬都統副都統都監各一人又選諸軍兵馬尤精鋭者三萬人為護駕軍又選驍勇三千人為先鋒軍又選剽捍百人之上為遠探攔子軍以上各有將領又於諸軍每部量衆寡抽十人或五人合為一隊別立將領以備勾取兵馬騰遞公事其南伐點兵多在幽州北千里鴛鴦泊及行並取居庸關曹王峪白馬口古北口安達馬口松亭關榆關等路將至平州幽州境又遣使分道催發不得久駐恐踐禾稼出兵不過九月還師不過十二月在路不得見僧尼喪服之人皇帝親征留親王一人在幽州權知軍國大軍既入南界分為三路廣信軍雄州霸州各一駕必由中道兵馬都統護駕等軍皆從各路軍馬遇縣鎮即時攻擊若大州軍必先料其虛實可攻次第而後進兵沿途民居園囿桑柘必夷伐焚蕩至宋北京三路兵皆會以議攻取及退亦然三路軍馬前後左右有先鋒遠探攔子馬各十數人在先鋒前後二十餘里全副衣甲夜中每行十里或五里少駐下馬側聽無有人馬之聲有則擒之力不可敵飛報先鋒齊力攻擊如有大軍走報主帥敵中虛實動必知之軍行當道州城防守堅固不可攻擊引兵過之恐敵人出城邀阻乃圍射鼓譟詐為攻擊敵方閉城固守前路無阻引兵進分兵抄截使隨處州城隔絶不通孤立無援所過大小州城至夜恐城中出兵突擊及與鄰州計會軍馬甲夜每城以騎兵百人去城門左右百餘步被甲執兵立馬以待兵出力不能加馳還勾集衆兵與戰左右官道斜徑山路河津夜中並遣兵巡守其打草穀家丁各衣甲持兵旋團為隊必先斫伐園林然後驅掠老幼運土木填壕塹攻城之際必使先登矢石檑木併下止傷老幼又於本國州縣起漢人鄉兵萬人隨軍專伐園林填道路御寨及諸營壘唯用桑柘梨栗軍退縱火焚之敵軍既陳料其陳勢小大山川形勢往回道路救援捷徑漕運所出各有以制之然後於陳四面烈騎為隊每隊五七百人十隊為一道十道當一面各有主帥最先一隊走馬大譟衝突敵陳得利則諸隊齊進若未利引退第二隊繼之退者息馬飲水諸道皆然更退迭進敵陳不動亦不力戰歷二三日待其困憊又令打草穀家丁馬施雙帚因風疾馳揚塵敵陳更互往來中既飢疲目不相覩可以取勝若陳南獲勝陳北失利主將在中無以知之則以本國四方山川為號聲以相聞得相救應若帝不親征重臣統兵不下十五萬衆三路往還北京會兵進以九月退以十二月行事次第皆如之若春以正月秋以九月不命都統止遣騎兵六萬不許深入不攻城池不伐林木但於界外三百里內耗蕩生聚不令種養而已軍入南界步騎車帳不循阡陌三道將領各一人率攔子馬各萬騎支散游奕百十里外更迭覘邏及暮以吹角為號衆即頓舍環繞御帳自近及遠折木稍屈為弓子鋪不設鎗營塹柵之備每軍行鼓三伐不問晝夜大衆齊發未遇大敵不乘戰馬俟近敵師乘新羈馬蹄有餘力成列不戰退則乘之多伏兵斷糧道冒夜舉火上風曳柴饋餉自仭散而復聚善戰能寒此兵之所以強也
