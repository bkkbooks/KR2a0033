body:
  text: 遼史卷七十四列傳第四耶律敵剌蕭痕篤康默記延壽韓延徽德樞紹勳紹芳資讓韓知古匡嗣德源德凝耶律敵剌字合魯隱遙輦鮮質可汗之子太祖踐阼與敞穩海里同心輔政太祖知其忠實命掌禮儀且諉以軍事後以平內亂功代轄里為奚六部吐里卒敵剌善騎射頗好禮文蕭痕篤字兀里軫迭剌部人其先相遙輦氏痕篤少慷慨以才能自任早隸太祖帳下數從征討既踐阼除北府宰相痕篤事親孝為政尚寬簡康默記本名照少為薊州衙校太祖侵薊州得之愛其材隸麾下一切蕃漢相涉事屬默記折衷之悉合上意時諸部新附文法未備默記推析律意論決重輕不差毫釐罹禁網者人人自以為不寃頃之拜左尚書神册三年始建都默記董役人咸勸趨百日而訖事五年為皇都夷離畢會太祖出師居庸關命默記將漢軍進逼長蘆水寨俘馘甚衆天贊四年親征渤海默記與韓知古從後大諲撰叛命諸將攻之默記分薄東門率驍勇先登既拔與韓延徽下長嶺府軍還已下城邑多叛默記與阿古只平之既破回跋城歸營太祖山陵畢卒佐命功臣其一也孫延壽字胤昌少倜儻謂其所親大丈夫為將當效節邊垂馬革裹尸景宗特授千牛衛大將軍宋人攻南京諸將既成列延壽獨奮擊陳前敵遂大潰以功遙授保大軍節度使乾亨三年卒韓延徽字藏明幽州安次人父夢殷纍官薊儒順三州刺史延徽少英燕帥劉仁恭奇之召為幽都府文學平州録事參軍同馮道祗候院授幽州觀察度支使後守光為帥延徽來聘太祖怒其不屈留之述律后諫曰彼秉節弗撓賢者也奈何困辱之太祖召與語合上意立命參軍事攻黨項室韋服諸部落延徽之籌居多乃請樹城郭分市里以居漢人之降者又為定配偶教墾藝以生養之以故逃亡者少居久之慨然懷其鄉里賦詩見意遂亡歸唐已而與他將王緘有隙懼及難乃省親幽州匿故人王德明舍德明問所適延徽曰吾將復走契丹德明不以為然延徽笑曰彼失我如失左右手其見我必喜既至太祖問故延徽曰忘親非孝棄君非忠臣雖挺身逃臣心在陛下臣是以復來上大悅賜名曰匣列匣列遼言復來也即命為守政事令崇文館大學士中外事悉令參決天贊四年從征渤海大諲撰乞降既而復叛與諸將破其城以功拜左僕射又與康默記攻長嶺府拔之師還太祖崩哀動左右太宗朝封魯國公仍為政事令使晉還改南京三司使世宗朝遷南府宰相建政事省設張理具稱盡力吏天祿五年六月河東使請行册禮帝詔延徽定其制延徽奏一遵太宗册晉帝禮從之應曆中致仕子德樞鎮東平詔許每歲東歸省九年卒年七十八上聞震悼贈尚書令葬幽州之魯郭世為崇文令公初延徽南奔太祖夢白鶴自帳中出比還復入帳中詰旦謂侍臣曰延徽至矣已而果然太祖初元庶事草創凡營都邑建宮殿正君臣定名分法度井井延徽力也為佐命功臣之一子德樞德樞年甫十五太宗見之謂延徽曰是兒卿家之福朕國之寶真英物也未冠守左羽林大將軍遷特進太尉時漢人降與轉徙者多寓東平丁歲災飢饉疾厲德樞請往撫字之授遼興軍節度使下車整紛剔蠹恩煦信孚勸農桑興教化期月民獲蘇息入為南院宣徽使遙授天平軍節度使平灤營三州管內觀察處置等使門下平章事已而加開府儀同三司行侍中封趙國公保寧元年卒孫紹勳紹芳紹勳仕至東京戶部使會大延琳叛被執辭不屈賊以鋸解之憤罵至死紹芳重熙間參知政事加兼侍中時廷議征李元昊力諫不聽出為廣德軍節度使聞敗嘔血卒孫資讓壽隆初拜中書侍郎平章事會宋徽宗嗣位遣使來報有司按籍有登寶位文坐是出為崇義軍節度使改鎮遼興卒韓知古薊州玉田人善謀有識量太祖平薊時知古六歲為淳欽皇后兄欲穩所得后來嬪知古從焉未得省見久之負其有怏怏不得志挺身逃庸保以供資用其子匡嗣得親近太祖因間言太祖召見與語賢之命參謀議神册初遙授彰武軍節度使久之信任益篤總知漢兒司事兼主諸國禮儀時儀法疏闊知古援據故典參酌國俗與漢儀雜就之使國人易知而行頃之拜左僕射與康默記將漢軍征渤海有功遷中書令天顯中卒為佐命功臣之一子匡嗣匡嗣以善醫直長樂宮皇后視之猶子應曆十年為太祖廟詳穩後宋王喜隱謀叛辭引匡嗣上置不問初景宗在藩邸善匡嗣即位拜上京留守頃之王燕改南京留守保寧末以留守攝樞密使時耶律虎古使宋還言宋人必取河東合先事以為備匡嗣詆之曰寧有是已而宋人果取太原乘勝逼燕匡嗣與南府宰相沙惕隱休哥侵宋軍于滿城方陳宋人請降匡嗣欲納之休哥曰彼軍氣甚鋭疑誘我也可整頓士卒以禦匡嗣不聽俄而宋軍鼓譟薄我衆蹙踐塵起漲天匡嗣倉卒諭諸將無當其鋒衆既奔遇伏兵扼要路匡嗣棄旗鼓遁其衆走易州山獨休哥收所棄兵械全軍還帝怒匡嗣數之曰爾違衆謀深入敵境爾罪一也號令不肅行伍不整爾罪二也棄我師旅挺身鼠竄爾罪三也偵候失機守禦弗備爾罪四也捐棄旗鼓損威辱國爾罪五也促令誅之皇后引諸內戚徐為開解上重違其請良久威稍霽乃杖而免之既而遙授晉昌軍節度使乾亨三年改西南面招討使卒睿智皇后聞之遣使臨弔賻贈甚厚後追贈尚書令五子德源德讓後賜名隆運德威德崇德凝德源德凝附傳餘各有傳德源性愚而貪早侍景宗邸及即位列近侍保寧間官崇義興國二軍節度使加檢校太師以賄名德讓貽書諫之終不悛以故論者少之後加同政事門下平章事遙攝保寧軍節度使乾亨初卒德凝謙遜廉謹保寧中遷護軍司徒開泰中纍遷護衛太保都宮使崇義軍節度使移鎮廣德秩滿部民請留從之改西南面招討使黨項隆益答叛平之遷大同軍節度使卒于官子郭三終天德軍節度使孫高家奴終南院宣徽使高十終遼興軍節度使
