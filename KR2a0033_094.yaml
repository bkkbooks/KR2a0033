body:
  text: 遼史卷九十四列傳第二十四耶律化哥耶律斡臘耶律速撒蕭阿魯帶耶律那也耶律何魯掃古耶律世良耶律化哥字弘隱孟父楚國王之後善騎射乾亨初為北院林牙統和四年南侵宋化哥擒諜者知敵由海路來襲即先據平州要地事平拜上京留守遷北院大王十六年復侵宋為先鋒破敵于遂城以功遷南院大王尋改北院樞密使開泰元年伐阻卜阻卜棄輜重遁走俘獲甚多帝嘉之封豳王後邊吏奏自化哥還闕糧乏馬弱勢不可守上復遣化哥經略西境化哥與邊將深入聞蕃部逆命居翼只水化哥徐以兵進敵望風奔潰獲羊馬及輜重路由白拔烈遇阿薩蘭回鶻掠之都監裊里繼至謂化哥曰君誤矣此部實效順者化哥悉還所俘諸蕃由此不附上使按之削王爵以侍中遙領大同軍節度使卒耶律斡臘字斯寧奚迭剌部人趫捷有力善騎射保寧初補護衛車駕獵頡山適豪豬伏叢莽帝射中豬突出御者托滿捨轡而避竹罒戊人鶴骨翼之斡臘復射而斃帝嘉賞及獵赤山適奔鹿奮角突前路隘不容避垂犯蹕斡臘以身當之鹿觸而顛帝謂曰朕因獵兩瀕于危賴卿以免始見爾心遷護衛太保從樞密使耶律斜軫破宋將楊繼業軍于山西統和十三年秋為行軍都監從都部署奚王和朔奴伐兀惹烏昭度數月至其城昭度請降和朔奴利其俘掠令四面急攻昭度率衆死守隨方捍禦依埤堄虛構戰棚誘我軍登陴俄撤枝柱登者盡覆和朔奴知不能下欲退蕭德謂師久無功何以藉口若深入大掠猶勝空返斡臘曰深入恐所得不償所損德不從略地東南循高麗北鄙還道遠糧絶人馬多死詔奪諸將官惟斡臘以前議得免尋加同政事門下平章事為東京留守開泰中卒耶律速撒字阿敏性忠直簡毅練武事應曆初為侍從纍遷突呂不部節度使歷霸濟祥順聖五州都總管俄為敦睦宮太師保寧三年改九部都詳穩四年伐黨項屢立戰功手詔勞之統和初皇太后稱制西邊甫定速撒務安集諸蕃利害輒具以聞太后益信任之凡臨戎與士卒同甘苦所獲均賜將校賞順討逆威信大振在邊二十年卒蕭阿魯帶字乙辛隱烏隗部人父女古仕至糾詳穩阿魯帶少習騎射曉兵法清寧間始仕纍遷本部司徒改烏古敵烈統軍都監大安七年遷山北副部署九年達理得拔思母二部來侵率兵擊却之達理得復劫牛羊去阿魯帶引兵追及盡獲所掠斬渠帥數人是冬達理得等以三百餘人梗邊復戰却之斬首二百餘級加金吾衛上將軍封蘭陵縣公壽隆元年第功加同中書門下平章事進爵郡公改西北路招討使乾統三年坐留宋俘當遣還者為奴免官後被徵以老疾致仕卒耶律那也字移斯輦夷離堇蒲古只之後父斡嘗為北剋從伐夏戰歿季父趙三始為宿直官纍遷至北面林牙咸雍四年拜北院大王改西南面招討使大康中西北諸部擾邊議欲往討帝以為非趙三不可遂拜西北路招討使兼行軍都統平之以功復為北院大王那也敦厚才敏上以其父斡死王事九歲加諸衛小將軍為題里司徒尋召為宿直官大康三年為遙輦剋大安九年為倒塌嶺節度使明年冬以北阻卜長磨古斯叛與招討都監耶律胡呂率精騎二千往討破之那也薦胡呂為漢人行宮副部署壽隆元年復討達理得拔思母等有功賜詔褒美改烏古敵烈部統軍使邊境以寧部民乞留詔許再任乾統六年拜中京留守改北院大王薨那也為人廉介長于理民每有鬬訟親核曲直不尚威嚴常曰凡治人本欲分別是非何事迫脅以立名故所至以惠化稱耶律何魯掃古字烏古鄰孟父房之後重熙末補祗候郎君清寧初加安州團練使大康中歷懷德軍節度使奚六部禿里太尉詔與樞密官措畫東北邊事改左護衛太保侍上言多率易察無他腸以故上優貸之大安八年知西北路招討使事時邊部耶覩刮等來侵何魯掃古誘北阻卜酋豪磨古斯攻之俘獲甚衆以功加左僕射復討耶覩刮等誤擊磨古斯北阻卜由是叛命遣都監張九討之不克二室韋與六院部特滿羣牧宮分等軍俱陷于敵何魯掃古不以實聞坐是削官決以大杖壽隆間纍遷惕隱兼侍中賜保節功臣道宗崩與宰相耶律儼總山陵事乾統中致仕卒耶律世良小字斡六院部人才敏給練達國朝典故及世譜上書與族弟敵烈爭嫡庶帝始識之時北院樞密使韓德讓病帝問孰可代卿德讓曰世良可北院大王耶律室魯復問北院之選德讓曰無出世良統和末為北院大王開泰初因大册禮加檢校太尉同政事門下平章事時邊部拒命詔北院樞密使耶律化哥將兵以世良為都監往禦之明年化哥還將罷兵世良上書曰化哥以為無事而還不思師老糧乏敵人已去焉能久守若益兵可克也帝即命化哥益兵與世良追之至安真河大破而還自是邊境以寧以功王岐拜北院樞密使三年命選馬駝于烏古部會敵烈部人夷剌殺其酋長稍瓦而叛鄰部皆應攻陷巨母古城世良率兵壓境遣人招之降數部各復故地四年伐高麗為副部署都統劉慎行逗留失期執還京師世良獨進兵明年至北都護府破追兵于郭州以暴疾卒論曰大之懷小也以德制之也以威德不足懷威不足制而欲服人也難矣化哥利俘獲而諸蕃不附何魯掃古誤擊磨古斯而阻卜叛命是皆喜於一旦之功而不圖後日之患庸何議焉若斡臘之戒深入速撒之務安集亦鐵中之錚錚者邪
