body:
  text: 遼史卷一百八列傳第三十八方技直魯古王白魏璘耶律敵魯耶律乙不哥孔子稱小道必有可觀醫卜是已醫以濟夭札卜以決猶豫皆有補於國有惠於民前史録而不遺故傳直魯古吐谷渾人初太祖破吐谷渾一騎士棄橐反射不中而去及追兵開橐視之中得一嬰兒即直魯古也因所俘者問其故乃知射橐者嬰之父也世善醫雖馬上視疾亦知標本意不欲子為人所得欲殺之耳由是進於太祖淳欽皇后收養之長亦能醫專事針灸太宗時以太醫給侍嘗撰脈訣針灸書行于世年九十卒王白冀州人明天文善卜筮晉司天少監太宗入汴得之應曆十九年王子只沒以事下獄其母求卜白曰此人當王未能殺也毋過憂景宗即位釋其罪封寧王竟如其言凡決禍褔多此類保寧中歷彰武興國二軍節度使撰百中歌行于世魏璘不知何郡人以卜名世太宗得于汴天祿元年上命馳馬較遲疾以為勝負問王白及璘孰勝白奏曰赤者勝璘曰臣所見驄馬當勝既馳竟如璘言上異而問之白曰今日火王故知赤者勝璘曰不然火雖王而上有煙以煙察之青者必勝上嘉之五年察割謀逆私卜于璘璘始卜謂曰大王之數得一日矣宜慎之及亂果敗應曆中周兵犯燕上以勝敗問璘璘曰周姓柴也燕分火也柴入火必焚其言果驗璘嘗為太平王罨撒葛卜僭立事上聞之免死流烏古部一日節度使召璘適有獻雙鯉者戲曰君卜此魚何時得食璘良久答曰公與僕不出今日有不測禍奚暇食魚亟命烹之未及食寇至俱遇害耶律敵魯字撒不碗其先本五院之族始置宮分隸焉敵魯精于醫察形色即知病原雖不診候有十全功統和初為大丞相韓德讓所薦官至節度使初樞密使耶律斜軫妻有沉痾易數醫不能治敵魯視之曰心有蓄熱非藥石所及當以意療因其聵聒之使狂用泄其毒則可於是令大擊鉦鼓於前翌日果狂叫呼怒罵力極而止遂愈治法多此類人莫能測年八十卒耶律乙不哥字習撚六院郎君裊古直之後幼好學尤長於卜筮不樂仕進嘗為人擇葬地曰後三日有牛乘人逐牛過者即啓土至期果一人負乳犢引牸牛而過其人曰所謂牛乘人者此也遂啓土既葬吉凶盡如其言又為失鷹者占曰鷹在汝家東北三十里濼西榆上往求之果得當時占候無不驗論曰方技術者也苟精其業而不畔于道君子必取焉直魯古王白耶律敵魯無大得失録之宜矣魏璘為察割卜謀逆為罨撒葛卜僭立罪在不貰雖有寸長亦奚足取哉存而弗削為來者戒
