body:
  text: 遼史卷十五本紀第十五聖宗六二十八年春正月辛亥朔不受賀甲寅如乾陵癸酉奉安大行皇太后梓宮于乾州菆塗殿二月丙戌宋遣王隨王儒等來弔祭己亥高麗遣魏守愚等來祭是月遣左龍虎衛上將軍蕭合卓饋大行皇太后遺物于宋仍遣臨海軍節度使蕭虛列左領軍衛上將軍張崇濟謝宋弔祭三月癸卯上大行皇太后諡為聖神宣獻皇后是月宋高麗遣使來會葬夏四月甲子葬太后於乾陵賜大丞相耶律德昌名曰隆運庚午賜宅及陪葬地五月己卯朔如中京辛卯清暑七金山乙巳西北路招討使蕭圖玉奏伐甘州回鶻破肅州盡俘其民詔修土隗口故城以實之丙午高麗西京留守康肇弒其主誦擅立誦從兄詢詔諸道繕甲兵以備東征秋八月戊申振平州飢民辛亥幸中京丙寅謁顯乾二陵丁卯自將伐高麗遣使報宋以皇弟楚國王隆祐留守京師北府宰相駙馬都尉蕭排押為都統北面林牙僧奴為都監九月乙酉遣使册西平王李德昭為夏國王辛卯遣樞密直學士高正引進使韓嵵宣問高麗王詢冬十月丙午朔女直進良馬萬匹乞從征高麗許之王詢遣使奉表乞罷師不許十一月乙酉大軍渡鴨淥江康肇拒戰敗之退保銅州丙戌肇復出右皮室詳穩耶律敵魯擒肇及副將李立追殺數十里獲所棄糧餉鎧仗戊子銅霍貴寧等州皆降排押至奴古達嶺遇敵兵戰敗之辛卯王詢遣使上表請朝許之禁軍士俘掠以政事舍人馬保佑為開京留守安州團練使王八為副留守遣太子太師乙凜將騎兵一千送保佑等赴京壬辰守將卓思正殺遼使者韓喜孫等十人領兵出拒保佑等還遣乙凜領兵擊之思正遂奔西京圍之五日不克駐蹕城西高麗禮部郎中渤海陀失來降庚子遣排押盆奴等攻開京遇高麗兵敗之王詢棄城遁去遂焚開京至清江還二十九年春正月乙亥朔班師所降諸城復叛至貴州南峻嶺谷大雨連日馬駝皆疲甲仗多遺棄霽乃得渡己丑次鴨淥江庚寅皇后及皇弟楚國王隆祐迎于來遠城壬辰詔罷諸軍己亥次東京二月己酉謁乾顯二陵戊午所俘高麗人分置諸陵廟餘賜內戚大臣三月己卯大丞相晉國王耶律隆運薨庚辰皇弟楚國王隆祐權知北院樞密使事樞密直學士高正為北院樞密副使庚寅南京平州水振之己亥以北院大王耶律室魯為北院樞密使封韓王北院郎君耶律世良為北院大王前三司使劉慎行參知政事兼知南院樞密使事夏四月清暑老古堝五月甲戌朔詔已奏之事送所司附日曆又詔帳族有罪黥墨依諸部人例乙未以劉慎行為南院樞密使南府宰相邢抱質知南院樞密使事六月庚戌升蔚州利州為觀察使乙卯韓王耶律室魯薨丙辰以南院大王化哥為北院樞密使丁巳詔西北路招討使駙馬都尉蕭圖玉安撫西鄙置阻卜諸部節度使是秋獵于平地松林冬十月庚子朔駐蹕廣平淀甲寅贈大丞相晉國王耶律隆運尚書令諡文忠十一月庚午朔幸顯州十二月庚子朔復如廣平淀癸丑以知南院樞密使事邢抱質年老詔乘小車入朝是月置歸寧二州是年御試放高承顏等二人及第開泰元年春正月己巳朔宋遣趙湘符成翰來賀癸未長白山三十部女直酋長來貢乞授爵秩甲申駐蹕王子院丙戌望祠木葉山丁亥女直太保蒲撚等來朝戊子獵于買曷魯林庚寅祠木葉山辛卯曷蘇館大王曷里喜來朝二月壬子駐蹕瑞鹿原三月甲戌以蔚州為觀察不隸武定軍乙亥如葦濼丁丑詔封皇女八人為郡主乙酉詔卜日行拜山大射柳之禮命北宰相駙馬蘭陵郡王蕭寧樞密使司空邢抱質督有司具儀物丁亥皇弟楚國王隆祐徙封齊國王留守東京夏四月庚子高麗遣蔡忠順來乞稱臣如舊詔王詢親朝壬寅夏國遣使進良馬己酉祀風伯辛酉以前孟父房敞穩蕭佛奴為左夷離畢五月戊辰朔還上京詔裴玄感邢祥知禮部貢舉放進士史簡等十九人及第以駙馬蕭紹宗為鄭州防禦使乙亥以邢抱質為大同軍節度使六月駐蹕上京秋七月丙子以耶律遂貞為遼興軍節度使遂正北院宣徽使張昭瑩南院宣徽使耶律受益上京副留守寇卿彰德軍節度使命耶律釋身奴李操充賀宋生辰國信使副蕭涅袞齊泰賀宋正旦使副進士康文昭張素臣郎玄達坐論知貢舉裴玄感邢祥私曲祕書省正字李萬上書辭涉怨訕皆杖而徒之萬役陷河冶八月丙申朔鐵驪那沙等送兀惹百餘戶至賓州賜絲絹是日那沙乞賜佛像儒書詔賜護國仁王佛像一易詩書春秋禮記各一部己未高麗王詢遣田拱之奉表稱病不能朝詔復取六州地是月齊國王隆祐薨輟朝五日冬十月辛亥如中京閏月丁卯贈隆祐守太師諡仁孝十一月甲午朔文武百官加上尊號曰弘文宣武尊道至德崇仁廣孝聰睿昭聖神贊天輔皇帝大赦改元開泰改幽都府為析津府薊北縣為析津縣幽都縣為宛平縣覃恩中外己亥賜夏國使東頭供奉官曹文斌呂文貴竇圭祐守榮武元正等爵有差癸卯前遼州録事張庭美六世同居儀坤州劉興胤四世同居各給復三年甲辰西北招討使蕭圖玉奏七部太師阿里底因其部民之怨殺本部節度使霸暗並屠其家以叛阻卜執阿里底以獻而沿邊諸部皆叛十二月丙寅奉遷南京諸帝石像于中京觀德殿景宗及宣獻皇后于上京五鸞殿壬申振奉聖州飢民庚辰賜皇弟秦晉國王隆慶鐵券癸未劉晨言殿中高可垣中京留守推官李可舉治獄明允詔超遷之甲申詔諸道水災飢民質男女者起來年正月日計傭錢十文價折傭盡遣還其家歸州言其居民本新羅所遷未習文字請設學以教之詔允所請貴德龍化儀坤雙遼同祖七州至是有詔始征商己丑詔諸鎮建宣敕樓二年春正月癸巳朔以裴玄感為翰林承旨邢祥給事中石用中翰林學士呂德推樞密直學士張儉政事舍人邢抱質加開府儀同三司守司空兼侍中王繼忠中京留守檢校太師戶部侍郎劉涇加工部尚書駙馬蕭紹宗加檢校太師耶律控溫加政事令封幽王丁未如瑞鹿原北院樞密使耶律化哥封豳王以馬氏為麗儀耿氏淑儀尚寢白氏昭儀尚服李氏順儀尚功艾氏芳儀尚儀孫氏和儀己未録囚烏古敵烈叛右皮室詳穩延壽率兵討之是月達旦國兵圍鎮州州軍堅守尋引去二月丙子詔以麥務川為象雷縣女河川為神水縣羅家軍為閭山縣山子川為富庶縣習家寨為龍山縣阿覽峪為勸農縣松山川為松山縣金甸子為金原縣壬午遣北院樞密副使高正按察諸道獄三月壬辰朔化哥以西北路略平留兵戍鎮州赴行在夏四月甲子拜日詔從上京請以韓斌所括贍國撻魯河奉豪等州戶二萬五千四百有奇置長霸興仁保和等十縣丙子如緬山五月辛卯朔復命化哥等西討六月辛酉朔遣中丞耶律資忠使高麗取六州舊地秋七月壬辰烏古敵烈皆復故疆乙未西南招討使政事令斜軫奏黨項諸部叛者皆遁黃河北模赧山其不叛者曷黨烏迷兩部因據其地今復西遷詰之則曰逐水草不早圖之後恐為患又聞前後叛者多投西夏西夏不納詔遣使再問西遷之意若歸故地則可就加撫諭使不報上怒欲伐之遂詔李德昭今黨項叛我欲西伐爾當東擊毋失掎角之勢仍命諸軍各市肥馬丁酉以惕隱耶律滌洌為南府宰相太尉五哥為惕隱癸卯鈎魚曲溝戊申詔以敦睦宮子錢振貧民己酉化哥等破阻卜酋長烏八之衆丁卯封皇子宗訓大內惕隱八月壬戌遣引進使李延弘賜夏國王李德昭及義成公主車馬己丑耶律資忠使高麗還冬十月己未朔畋麃井之北命耶律阿營等使宋賀生辰辛酉駐蹕長濼丙寅詳穩張馬留獻女直人知高麗事者上問之曰臣三年前為高麗所虜為郎官故知之自開京東馬行七日有大寨廣如開京旁州所貢珍異皆積于此勝羅等州之南亦有二大寨所積如之若大軍行由前路取曷蘇館女直北直渡鴨淥江並大河而上至郭州與大路會高麗可取而有也上納之十一月甲午録囚癸丑樞密使豳王化哥以西征有罪削其官封出為大同軍節度使十二月甲子以北院大王耶律世良為北院樞密使封岐王以宰臣劉晟監修國史牛璘為彰國軍節度使蕭孝穆為西北路招討使放進士鮮于茂昭等六人及第三年春正月己丑録囚阻卜酋長烏八來朝封為王乙未如渾河丁酉女直及鐵驪各遣使來貢是夕彗星見西方丙午畋潢河濱壬子帝及皇后獵瑞鹿原二月戊午詔增樞密使以下月俸甲子遣上京副留守耶律資忠復使高麗取六州舊地三月庚子遣耶律世良城招州戊申南京奉聖平蔚雲應朔等州置轉運使夏四月戊午詔南京管內毋淹刑獄以妨農務癸亥烏古叛乙亥沙州回鶻曹順遣使來貢丙子以西北路招討都監蕭孝穆為北府宰相五月乙酉朔清暑緬山六月乙亥合拔里乙室二國舅為一帳以乙室夷離畢蕭敵烈為詳穩以總之甲申封皇姪胡都古為廣平郡王是夏詔國舅詳穩蕭敵烈東京留守耶律團石等討高麗造浮梁于鴨淥江城保宣義定遠等州秋七月乙酉朔如平地松林壬辰詔政事省樞密院酒間授官釋罪毋即奉行明日覆奏八月甲寅朔幸沙嶺九月丁酉八部敵烈殺其詳穩稍瓦皆叛詔南府宰相耶律吾剌葛招撫之辛亥釋敵烈數人令招諭其衆壬子耶律世良遣使獻敵烈俘冬十月甲寅朔幸中京丙子以旗鼓拽剌詳穩題里姑為奚六部大王放進士張用行等三十一人及第出身四年春正月乙酉如瑞鹿原丙戌詔耶律世良再伐迪烈得戊子命詳穩拔姑瀦水瑞鹿原以備春搜丁酉獵馬蘭淀壬寅東征東京留守善寧平章涅里袞奏已總大軍及女直諸部兵分道進討遂遣使齎密詔軍前二月壬子朔如薩堤濼于闐國來貢夏四月癸丑以林牙建福為北院大王甲寅蕭敵烈等伐高麗還丙辰曷蘇館部請括女直王殊只你戶舊無籍者會其丁入賦役從之樞密使貫寧奏大破八部迪烈得詔侍御撒剌奬諭代行執手之禮丙寅耶律世良等上破阻卜俘獲數戊辰駐蹕沿柳湖己巳女直遣使來貢壬申耶律世良討烏古破之甲戌遣使賞有功將校世良討迪烈得至清泥堝時于厥既平朝廷議內徙其衆于厥安土重遷遂叛世良懲創既破迪烈得輒殲其丁壯勒兵渡曷剌河進擊餘黨斥候不謹其將勃括聚兵稠林中擊遼軍不備遼軍小却結陳河曲勃括是夜來襲翌日遼後軍至勃括誘于厥之衆皆遁世良追之軍至險厄勃括方阻險少休遼軍偵知其所世良不亟掩之勃括輕騎遁去獲其輜重及所誘于厥之衆併遷迪烈得所獲轄麥里部民城臚朐河上以居之是月蕭楊哥尚南平郡主五月辛巳命北府宰相劉晟為都統樞密使耶律世良為副殿前都點檢蕭屈烈為都監以伐高麗晟先家置邊郡致緩師期追還之以世良屈烈總兵進討以耶律德政為遼興軍節度使蕭年骨烈天城軍節度使李仲舉卒詔賻恤其家六月庚戌上拜日如禮以麻都骨世勳易衣馬為好以上京留守耶律八哥為北院樞密副使秋七月上又拜日遂幸秋山自八月射鹿至于九月復自癸丑至于辛酉連獵于有柏碎石太保響應松山諸山丁卯與夷離畢兵部尚書蕭榮寧定為交契以重君臣之好丙子以旗鼓拽剌詳穩題里姑為六部奚王冬十月駐蹕撻剌割濼十一月庚申詔汰東京僧及命上京中京洎諸宮選精兵五萬五千人以備東征十二月南巡海徼還幸顯州五年春正月丁未北幸庚戌耶律世良蕭屈烈與高麗戰于郭州西破之斬首數萬級盡獲其輜重乙卯師次南海軍耶律世良薨于軍癸酉駐蹕雪林二月己卯阻卜長來朝辛巳如薩堤濼庚寅以前東京統軍使耶律韓留為右夷離畢戊戌皇子宗真生三月乙卯鼻骨德長撒保特賽剌等來貢辛酉諸道獄空詔進階賜物丙寅以前北院大王耶律敬溫為阿扎割只辛未黨項魁可來降夏四月乙亥振招州民戊寅以左夷離畢蕭合卓為北院樞密使曷魯寧為副使庚辰清暑孤樹淀五月甲子尚書蕭姬隱坐出使後期削其官丁卯以耿元吉為戶部使六月以政事舍人吳克昌按察霸州刑獄丁丑回鶻獻孔雀秋七月甲辰獵于赤山八月丙子幸懷州有事于諸陵戊寅還上京九月癸卯皇弟南京留守秦晉國王隆慶來朝上親出迎勞至實德山因同獵于松山乙丑駐蹕杏堝冬十月甲午封秦晉國王隆慶長子查割中山郡王次子遂哥樂安郡王十一月辛丑朔以參知政事馬保忠同知樞密院事監修國史丁巳以北面林牙蕭隈窪為國舅詳穩十二月乙酉秦晉國王隆慶還至北安薨訃聞上為哀慟輟朝七日丁酉宋遣張遜王承德來賀千齡節是歲放進士孫傑等四十八人及第六年春正月癸卯如錐子河二月甲戌以公主賽哥殺無罪婢駙馬蕭圖玉不能齊家降公主為縣主削圖玉同平章事丁丑詔國舅帳詳穩蕭隗窪將本部兵東征高麗其國舅司事以都監攝之庚辰以南面林牙涅合為南院大王三月乙巳如顯州葬秦晉國王隆慶有事于顯乾二陵追册隆慶為太弟夏四月辛卯封隆慶少子謝家奴為長沙郡王以樞密使漆水郡王耶律制心權知諸行宮都部署事壬辰禁命婦再醮丙申如涼陘五月戊戌朔命樞密使蕭合卓為都統漢人行宮都部署王繼忠為副殿前都點檢蕭屈烈為都監以伐高麗翌日賜合卓劍俾得專殺丙午録囚己酉設四帳都詳穩甲寅以南京統軍使蕭惠為右夷離畢乙卯祠木葉山潢河乙丑駐蹕九層臺六月戊辰朔德妃蕭氏賜死葬兔兒山西後數日大風起冢上晝暝大雷電而雨不止者踰月是月南京諸縣蝗秋七月辛亥如秋山遣禮部尚書劉京翰林學士吳叔達知制誥仇正己起居舍人程翥吏部員外郎南承顏禮部員外郎王景運分路按察刑獄辛酉以西南路招討請置寧仁縣于勝州九月庚子還上京以皇子屬思生大赦丁未以駙馬蕭璉節度使化哥知制誥仇正己楊佶充賀宋生辰正旦使副乙卯蕭合卓等攻高麗興化軍不克還師冬十月丁卯南京路飢挽雲應朔弘等州粟振之辛未獵鏵子河庚寅駐蹕達離山十一月乙卯建州節度使石匡弼卒十二月丁卯上輕騎還上京戊子宋遣李行簡張信來賀千齡節翌日宋馮元張綸來賀正旦
