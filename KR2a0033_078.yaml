body:
  text: 遼史卷七十八列傳第八耶律夷臘葛蕭海璃蕭護思蕭思溫蕭繼先耶律夷臘葛字蘇散本宮分人檢校太師合魯之子應曆初以父任入侍數歲始為殿前都點檢時上新即位疑諸王有異志引夷臘葛為布衣交一切機密事必與之謀遷寄班都知賜宮戶時上酗酒數以細故殺人有監雉者因傷雉而亡獲之欲誅夷臘葛諫曰是罪不應死帝竟殺之以尸付夷臘葛曰收汝故人夷臘葛終不為止復有監鹿詳穩亡一鹿下獄當死夷臘葛又諫曰人命至重豈可為一獸殺之良久得免遼法麚歧角者惟天子得射會秋獵善為鹿鳴者呼一麚至命夷臘葛射應弦而踣上大悅賜金銀各百兩名馬百匹及黑山東抹真之地後穆宗被弒坐守衛不嚴被誅蕭海璃字寅的哂其先遙輦氏時為本部夷離堇父塔列天顯間為本部令穩海璃貌魁偉膂力過人天祿間娶明王安端女譪因翁主應曆初察割亂譪因連坐繼娶嘲瑰翁主上以近戚嘉其勤篤命預北府宰相選頃之總知軍國事時諸王多坐反逆海璃為人廉謹達政體每被命按獄多得其情人無寃者由是知名漢主劉承鈞每遣使入貢必別致幣物詔許受之年五十卒帝愍悼輟朝二日蕭護思字延寧世為北院吏纍遷御史中丞總典羣牧部籍應曆初遷左客省使未幾拜御史大夫時諸王多坐事繫獄上以護思有才幹詔窮治稱旨改北院樞密使仍命世預宰相選護思辭曰臣子孫賢否未知得一客省使足矣從之上晚歲酗酒用刑多濫護思居要地自保未嘗一言匡救議者以是少之年五十七卒蕭思溫小字寅古宰相敵魯之族弟忽沒里之子通書史太宗時為奚禿里太尉尚燕國公主為羣牧都林牙思溫在軍中握齱修邊幅僚佐皆言非將帥才尋為南京留守初周人攻揚州上遣思溫躡其後憚暑不敢進拔緣邊數城而還後周師來侵圍馮母鎮勢甚張思溫請益兵帝報曰敵來則與統軍司併兵拒之敵去則務農作勿勞士馬會敵入束城我軍退渡滹沱而屯思溫勒兵徐行周軍數日不動思溫與諸將議曰敵衆而鋭戰不利則有後患不如頓兵以老其師躡而擊之可以必勝諸將從之遂與統軍司兵會飾他説請濟師周人引退思溫亦還已而周主復北侵與其將傅元卿李崇進等分道並進圍瀛州陷益津瓦橋淤口三關垂迫固安思溫不知計所出但云車駕旦夕至麾下士奮躍請戰不從已而陷易瀛莫等州京畿人皆震駭往往遁入西山思溫以邊防失利恐朝廷罪己表請親征會周主榮以病歸思溫退至益津偽言不知所在遇步卒二千餘人來拒敗之是年聞周喪燕民始安乃班師時穆宗湎酒嗜殺思溫以密戚預政無所匡輔士論不與十九年春搜上射熊而中思溫與夷離畢牙里斯等進酒上壽帝醉還宮是夜為庖人斯奴古等所弒思溫與南院樞密使高勳飛龍使女里等立景宗保寧初為北院樞密使兼北府宰相仍命世預其選上册思溫女為后加尚書令封魏王從帝獵閭山為賊所害蕭繼先字楊隱小字留只哥幼穎悟叔思溫命為子睿智皇后尤愛之乾亨初尚齊國公主拜駙馬都尉統和四年宋人來侵繼先率邏騎逆境上多所俘獲上嘉之拜北府宰相自是出師繼先必將本府兵先從拔狼山石壘從破宋軍應州上南征取通利軍戰稱捷力及親征高麗以繼先年老留守上京卒年五十八繼先雖處富貴尚儉素所至以善治稱故將兵攻戰未嘗失利名重戚里論曰嗚呼人君之過莫大於殺無辜湯之伐桀也數其罪曰並告無辜於上下神祗武王之伐紂也數其罪曰無辜籲天堯之伐苗民也呂侯追數其罪曰殺戮無辜迹是言之夷臘葛之諫凜凜庶幾古君子之風矣雖然善諫者不諫於已然蓋必先得於心術之微如察脈者先其病而治之則易為功穆宗沈湎失德蓋其資富強之勢以自肆久矣使羣臣於造次動作之際此諫彼諍提而警之以防其甚則亦詎至是哉于以知護思思溫處位優重耽祿取容真鄙夫矣若海璃之折獄繼先之善治可謂任職臣歟
