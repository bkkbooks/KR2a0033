body:
  text: 遼史卷三本紀第三太宗上太宗孝武惠文皇帝諱德光字德謹小字堯骨太祖第二子母淳欽皇后蕭氏唐天復二年生神光異常獵者獲白鹿白鷹人以為瑞及長貌嚴重而性寬仁軍國之務多所取決天贊元年授天下兵馬大元帥尋詔統六軍南徇地明年下平州獲趙思溫張崇回破箭笴山胡遜奚諸部悉降復以兵掠鎮定所至皆堅壁不敢戰師次幽州符存審拒于州南縱兵邀擊大破之擒禆將裴信等數十人及從太祖破于厥里諸部定河壖党項下山西諸鎮取回鶻單于城東平渤海破達盧古部東西萬里所向皆有功天顯元年七月太祖崩皇后攝軍國事明年秋治祖陵畢冬十一月壬戌人皇王倍率羣臣請于后曰皇子大元帥勳望中外攸屬宜承大統后從之是日即皇帝位癸亥謁太祖廟丙寅行柴冊禮戊辰還都壬申御宣政殿羣臣上尊號曰嗣聖皇帝大赦有司請改元不許十二月庚辰尊皇太后為太皇太后皇后為應天皇太后立妃蕭氏為皇后禮畢閱近侍班局辛巳諸道將帥辭歸鎮己丑祀天地庚寅遣使諭諸國辛卯閱羣牧于近郊戊戌女直遣使來貢壬寅謁太祖廟甲辰閱旗鼓客省諸局官屬丁未詔選遙輦氏九帳子弟可任官者三年春正月己酉閱北剋兵籍庚戌閱南剋兵籍丁巳閱皮室拽剌墨離三軍己未黃龍府羅涅河女直達盧古來貢庚午以王郁為興國軍節度使守中書令二月辛長濼己亥惕隱涅里袞進白狼辛丑達盧古來貢三月乙卯東蒐癸亥獵羖山乙丑獵松山唐義武軍節度使王都遣人以定州來歸唐主出師討之使來乞援命奚禿里鐵剌往救之四月戊寅東巡己卯祭麃鹿神丁亥於獵所縱公私取羽毛革木之材甲午取箭材赤山丙申獵三山鐵剌敗唐將王晏球于定州唐兵大集鐵剌請益師辛丑命惕隱涅里袞都統查剌赴之五月丙午建天膳堂獵索剌山戊申至自獵丁卯命林牙突呂不討烏古部己巳女直來貢六月己卯行瑟瑟禮秋七月丁未突呂不獻討烏古捷壬子王都奏唐兵破定州鐵剌死之涅里袞查剌等數十人被執上以出師非時甚悔之厚賜戰歿將校之家庚午有事于太祖廟八月丙子突厥來貢庚辰詔建應天皇太后誕聖碑于儀坤州九月己卯突呂不遣人獻討烏古俘癸未詔分賜羣臣己丑幸人皇王倍第庚寅遣人使唐辛卯再幸人皇王第癸巳有司請以上生日為天授節皇太后生日為永寧節冬十月癸卯朔以永寧節上率羣臣上壽於延和宮己酉謁太祖廟唐遣使遺玉笛甲子天授節上御五鸞殿受羣臣及諸國使賀十一月丙子鼻骨德來貢辛丑自將伐唐十二月癸卯祭天地庚戌聞唐主復遣使來聘上問左右皆曰唐數遣使來實畏威也未可輕舉觀釁而動可也上然之甲寅次杏堝唐使至遂班師時人皇王在皇都詔遣耶律羽之遷東丹民以實東平其民或亡入新羅女直因詔困乏不能遷者許上國富民給贍而隸屬之升東平郡為南京四年春正月壬申朔宴羣臣及諸國使觀俳優角觝戲己卯如瓜堝二月庚戌閱遙輦氏戶籍三月甲午望祀羣神夏四月辛亥至自瓜堝壬子謁太祖廟癸丑謁太祖行宮甲寅幸天城軍謁祖陵辛酉人皇王倍來朝癸亥錄囚五月癸酉謁二儀殿宴羣臣女直來貢戊子射柳于太祖行宮癸巳行瑟瑟禮六月丙午突呂不獻烏古俘戊申分賜將士己酉西巡己未選輕騎數千獵近山癸亥駐蹕涼陘秋七月庚辰觀市曲赦繫囚甲午祠太祖而東八月辛丑至自涼陘謁太祖廟癸卯幸人皇王第己酉謁太祖廟九月庚午如南京戊寅祠木葉山己卯行再生禮癸巳至南京冬十月壬寅幸人皇王第宴羣臣甲辰幸諸營閱軍籍庚戌以雲中郡縣未下大閱六軍甲子詔皇弟李胡帥師趣雲中討郡縣之未附者十一月丙寅朔以出師告天地丁卯餞皇弟李胡于西郊壬申命大內惕隱告出師于太祖行宮甲申觀漁三叉口十二月戊申女直來貢戊午至自南京五年春正月庚午皇弟李胡拔寰州捷至甲午朝皇太后二月己亥詔修南京癸卯李胡還自雲中朝于行在丙午以先所俘渤海戶賜李胡丙辰上與人皇王朝皇太后太后以皆工書命書于前以觀之辛酉召羣臣議軍國事三月丙寅朝皇太后丁卯皇弟李胡請赦宗室舍利郎君以罪繫獄者詔從之己巳幸皇叔安端第辛未人皇王獻白紵乙亥冊皇弟李胡為壽昌皇太弟兼天下兵馬大元帥壬午以龍化州節度使劉居言同中書門下平章事乙酉宴人皇王僚屬便殿庚寅駕發南京夏四月乙未詔人皇王先赴祖陵謁太祖廟丙辰會祖陵人皇王歸國五月戊辰詔修褭潭離宮乙酉謁太祖廟六月己亥射柳于行在乙卯如沿柳湖丁己拜太祖御容于明殿己未敵烈德來貢秋七月壬申烏古來貢戊子薦時果于太祖廟八月丁酉以大聖皇帝皇后宴寢之所號日月宮因建日月碑丙午如九層臺九月己卯詔舍利普寧撫慰人皇王庚辰詔置人皇王儀衞丁亥至自九層臺謁太祖廟冬十月戊戌遣使賜人皇王胙癸卯建太祖聖功碑于如迂正集會堝甲辰人皇王進玉笛十一月戊寅東丹奏人皇王浮海適唐六年春正月甲子西南邊將以慕化轄戛斯國人來乙丑敵烈德來貢丁卯如南京三月辛未召大臣議軍國事丁亥人皇王倍妃蕭氏率其國僚屬來見夏四月己酉唐遣使來聘是月置中臺省于南京五月乙丑祠木葉山乙亥至自南京壬午謁太祖陵閏月庚寅射柳于近郊六月壬申如涼陘壬午烏古來貢秋七月丁亥女直來貢己酉命將校以兵南略壬子薦時果于太祖廟東幸八月庚申皇子述律生告太祖廟辛巳鼻骨德來貢九月甲午詔修京城冬十月丁丑鐵驪來貢十一月乙酉唐遣使來聘十二月甲寅朔祭太祖廟丙辰遣人以詔賜唐盧龍軍節度使趙德鈞七年春正月壬辰征西將軍課里遣拽剌鐸括奏軍事己亥唐遣使來聘癸卯遣人使唐戊申祠木葉山二月壬申拽剌迪德使吳越還吳越王遣使從獻寶器復遣使持幣往報之三月己丑林牙迪離畢指斥乘輿囚之丁未遣使諸國戊申上率羣臣朝于皇太后夏四月甲戌唐遣使來聘致人皇王倍書己卯女直來貢五月壬午朔幸祖州謁太祖陵六月戊辰御製太祖建國碑戊寅烏古敵烈德來貢庚辰觀角觝戲秋七月辛巳朔賜中外官吏物有差癸未賜高年布帛丙戌召羣臣耆老議政壬辰唐遣使遺紅牙笙癸巳使復至懼報定州之役也壬寅唐盧龍軍節度使趙德鈞遣人進時果丁未薦新于太祖廟八月壬戌捕鵝于沿柳湖風雨暴至舟覆溺死者六十餘人命存恤其家識以為戒戊辰林牙迪離畢逸囚復獲而鞫之知其事本誣構釋之九月庚子阻卜來貢冬十月乙卯唐遣使來聘己巳遣使雲中十一月丁亥遣使存問獲里國丁未阻卜貢海東青鶻三十連十二月亥辛以叛人泥離袞家口分賜羣臣丁巳西狩駐蹕平地松林八年春正月戊子女直來貢庚子命皇太弟李胡左威衞上將軍撒割率兵伐党項癸卯上親餞之二月辛亥吐谷渾阻卜來貢乙卯剋實魯使唐還以附獻物分賜羣臣三月辛卯皇太弟討党項勝還宴勞之丙申唐遣使請罷征党項兵上以戰捷及党項巳聽命報之夏四月戊午党項來貢五月己丑獵獨牛山惕隱迪輦所乘內騮馬斃因賜名其山曰騮山戊戌如沿柳湖六月甲寅阻卜來貢甲子回鶻阿薩蘭來貢秋七月戊寅行納后禮癸未皇子提離古生丁亥鐵驪女直阻卜來貢冬十月乙巳阻卜來貢丙午至自沿柳湖辛亥唐遣使來聘己未遣拔剌使唐辛未烏古吐魯沒來貢十一月辛丑太皇太后崩遣使告哀于唐及人皇王倍是月唐主嗣源殂子從厚立十二月丁卯党項來貢九年春正月癸酉漁于土河丙申党項貢駝鹿己亥南京進白麞閏月戊午唐遣使告哀即日遣使弔祭壬戌東幸女直來貢二月壬申祠木葉山戊寅葬太皇太后於德陵前二日發喪于菆塗殿上具衰服以送後追諡宣簡皇后詔建碑于陵三月癸卯女直來貢夏四月唐李從珂弒其主自立人皇王倍自唐上書請討五月甲辰如沿柳湖癸丑女直來貢大星晝隕六月己巳朔鼻骨德來貢辛未唐李從厚謝弔祭所遣使初至闕秋八月壬午自將南伐乙酉拽剌解里手接飛雁上異之因以祭天地九月庚子酉南星隕如雨乙卯次雲州丁巳拔河陰冬十月丁亥略地靈丘父老進牛酒犒師十一月辛丑圍武州之陽城壬寅陽城降癸卯洼只城降括所俘丁壯籍于軍十二月壬辰皇子阿鉢撒葛里生皇后不豫是月駐蹕百湖之西南十年春正月戊申皇后崩于行在二月戊寅百僚請加追諡不許辛巳宰相涅里袞謀南奔事覺執之三月戊午党項來貢夏四月吐谷渾酋長退欲德率衆內附丙戌皇太后父族及母前夫之族二帳並為國舅以蕭緬思為尚父領之己丑錄囚五月甲午朔始製服行后喪丙午葬于奉陵上自製文諡曰彰德皇后癸丑以舍利王庭鶚為龍化州節度使六月乙丑吐渾來貢辛未幸品不里淀秋七月乙卯獵南赤山冬十一月丙午幸弘福寺為皇后飯僧見觀音畫像乃大聖皇帝應天皇后及人皇王所施顧左右曰昔與父母兄弟聚觀于此歲時未幾今我獨來悲嘆不已乃自製文題于壁以極追感之意讀者悲之十二月庚辰如金瓶濼遣拽剌化哥窟魯里阿魯掃姑等捉生敵境十一年春正月鈎魚于土河庚申如潢河三月庚寅朔女直來貢夏四月庚申謁祖陵戊辰還都謁太祖廟辛未燕民之復業者陳汴州事宜癸酉女直諸部來貢癸未賜回鶻使衣有差五月戊戌清暑沿柳湖六月戊午朔鼻骨德來貢乙酉吐谷渾來貢秋七月辛卯烏古來貢壬辰蒲割公主率三河烏古來朝丙申唐河東節度使石敬瑭為其主所討遣趙瑩因西南路招討盧不姑求救上白太后曰李從珂弒君自立神人共怒宜行天討時趙德鈞亦遣使至河東復遣桑維翰來告急遂許興師八月己未遣蕭轄里報河東師期丙寅吐谷渾來貢庚午自將以援敬瑭九月癸巳有飛自墜而死南府夷離菫曷魯恩得之以獻卜之吉上曰此從珂自滅之兆也丁酉入雁門戊戌次忻州祀天地己亥次太原庚子遣使諭敬瑭曰朕興師遠來當即與卿破賊會唐將高行周符彥卿以兵來拒遂勒兵陳于太原及戰佯為之却唐將張敬達楊光遠又陣于西未成列以兵薄之而行周彥卿為伏兵所斷首尾不相救敬達光遠大敗棄仗如山斬首數萬級敬達走保晉安寨夷離菫的魯與戰死之敬瑭率官屬來見上執手撫慰之癸卯圍晉安甲辰以的魯子徒離骨嗣為夷離菫仍以父字為名以旌其忠南宰相鶻離底奚監軍寅你已將軍陪阿臨陣退懦上召切責之冬十月甲子封敬瑭為晉王幸其府敬瑭與妻李率其親屬捧觴上壽初圍晉安分遣精兵守其要害以絕援兵之路而李從珂遣趙延壽以兵二萬屯團栢谷范延廣以兵二萬屯遼州幽州趙德鈞以所部兵萬餘由上黨趨延壽軍合勢進擊知此有備皆逗留不進從珂遂將精騎三萬出次河陽親督諸軍然知其不救但日酣飲悲歌而己丁卯召敬瑭至行在所賜坐上從容語之曰吾三千里舉兵而來一戰而勝殆天意也觀汝雄偉弘大宜受茲南土世為我藩輔遂命有司設壇晉陽備禮冊命十一月丁酉冊敬瑭為大晉皇帝自戊戌至戊申候騎兩奏南有兵至復奏西有兵至命惕隱迪輦洼拒之唐將張敬達在圍八十餘日內外隔絕軍儲殆盡至濯馬糞屑木以飼馬馬饑至自相啖其尾死則以充食光遠等勸敬達出降敬達曰吾有死而已爾欲降寧斬吾首以降閏月甲子楊光遠安審琦殺敬達以降上聞敬達至死不變謂左右曰凡為人臣當如此也命以禮葬所降軍士及馬五千匹以賜晉帝丙寅祀天地以告成功庚午僕射蕭酷古只奏趙德鈞等諸援兵將遁詔夜發兵追擊德鈞等軍皆投戈棄甲自相蹂踐擠于川谷者不可勝紀仍命皇太子馳輕騎據險要追及步兵萬餘悉降之辛未兵度團柏谷以酒肴祀天地俄追及德鈞父子乃率衆降次潞州召諸將議皆請班師從之命南宰相解領鶻離底奚監軍寅你已將軍陪阿先還壬申惕隱洼林牙迪離畢來獻俘晉帝辭歸上與宴飲酒酣執手約為父子以白貂裘一馬二十戰馬千二百餞之命迪離畢將五千騎送入洛臨別謂之曰朕留此候亂定乃還耳辛巳晉帝至河陽李從珂窮蹙召人皇王倍同死不從遣人殺之乃舉族自焚詔收其士卒戰歿者瘞之汾水上以京觀晉命桑維翰為文紀上功德十二月乙酉朔遣近侍撻魯存問晉帝丙戌以晉安所獲分賜將校戊子遣使馳奏皇太后及報諸道師還庚寅發太原辛卯聞晉帝入洛遣郎君解里德撫問壬辰次細河閱降將趙德鈞父子兵馬戊戌次雁門以沙太保所部兵分隸諸將庚戌幸應州癸丑唐大同彰國振武三節度使迎見留之不遣十二年春正月丙辰次堆子口唐大同軍節度判官吳巒閉城拒命遣崔廷勳圍其城庚申上親征至城下諭之巒降辛酉射鬼箭于雲州北壬戌祀天地癸亥遣國舅安端發奚西部民各還本土丙寅皇太后遣侍衞實魯趣行是夕率輕騎先進丁丑皇子述律迎謁于灤河告功太祖行宮戊寅朝于皇太后進珍玩為壽二月丁亥以軍前所獲俘叛入幽州者皆斬之壬寅詔諸部休養士卒癸卯晉遣唐所掠郎君剌哥文班吏蕭木受里還朝三月庚申晉遣使來貢丁卯晉天雄軍節度使范延廣潛遣人請內附不納己巳遣郎君的烈古梅里迭烈使晉壬午晉使及諸國使來見夏四月甲申地震幸平地松林觀潢水源五月甲寅幸頻蹕淀壬申震開皇殿六月甲申晉遣戶部尚書聶延祚等請上尊號及歸雁門以北與幽薊之地仍歲貢帛三十萬疋詔不許庚戌侍中列率言范延廣叛晉引兵南向秋七月辛亥朔詔諸部治兵甲癸丑幸懷州謁奉陵甲子晉遣使來告范延廣反庚午遣耶律褭古里使晉議軍事八月癸未晉遣使復請上尊號不許庚寅晉及太原劉知遠南唐李各遣使來貢庚子晉遣使以都汴及范延廣降來告九月壬子鼻骨德來貢庚申遣直里古使晉及南唐癸亥朮不姑女直來貢辛未遣使高麗鐵驪癸酉回鶻來貢冬十月庚辰朔皇太后永寧節晉及回鶻燉煌諸國皆遣使來賀壬午詔回鶻使胡離只阿剌保問其風俗丁亥諸國使還就遣蒲里骨皮室胡末里使其國十一月己未遣使求醫于晉丁卯鐵驪來貢十二月甲申東幸祀木葉山己丑醫來
