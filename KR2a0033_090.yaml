body:
  text: 遼史卷九十列傳第二十蕭阿剌耶律義先信先蕭陶隗蕭塔剌葛耶耶敵祿蕭阿剌字阿里懶北院樞密使孝穆之子也幼養宮中興宗尤愛之重熙六年為弘義宮使累遷同知北院樞密使加同中書門下平章事出為東京留守二十一年拜西北路招討使封西平郡王尋尚秦晉國王公主拜駙馬都尉清寧元年遺詔拜北府宰相兼南院樞密使進王韓明年改北院樞密使徙王陳與蕭革同掌國政革諂諛不法阿剌爭之不得告歸上由此惡之除東京留守會行瑟瑟禮入朝陳時政得失革以事中傷帝怒縊殺之皇太后營救不及大慟曰阿剌何罪而遽見殺帝乃優加賻贈葬乾陵之赤山阿剌性忠果曉世務有經濟才議者以謂阿剌若在無重元乙辛之亂耶律義先于越仁先之弟也美風姿舉止嚴重重熙初補祗候郎君班詳穩十三年車駕西征為十二行糺都監戰功最改南院宣徽使時蕭革同知樞密院事席寵擅權義先疾之因侍讌言于帝曰革狡佞喜亂一朝大用必誤國家言甚激切不納它日侍宴上命羣臣博負者罰一巨觥義先當與革對憮然曰臣縱不能進賢退不肖安能與國賊博哉帝止之曰卿醉矣義先厲聲詬不已上大怒賴皇后救得解翌日上謂革曰義先無禮當黜之革對曰義先天性忠直今以酒失而出誰敢言人之過上謂革忠直益加信任義先鬱鬱不自得然議事未嘗少沮又於上前博義先祝曰向言人過冒犯天威今日一擲可表愚款俄得堂印上愕然十六年為殿前都點檢討蒲奴里多所招降獲其酋長陶得里以歸手詔褒奬以功改南京統軍使封武昌郡王奏請統軍司錢營息以贍貧民未期軍器完整民得休息二十一年拜惕隱進王富春薨年四十二義先常戒其族人曰國中三父房皆帝之昆弟不孝不義尤不可為其接下無貴賤賢否皆與均禮其妻晉國長公主之女每遇中表親非禮服不見故內外多化之清寧間追贈許王弟信先信先興宗以其父瑰引為刺血友幼養于宮善騎射重熙十四年為左護衞太保同知殿前點檢司事十八年兼右祗候郎君班詳穩上問所欲信先曰先臣瑰引與陛下分如同氣然不及王封儻使蒙恩地下臣願畢矣上曰此朕遺忘之過追封燕王是年從蕭惠伐夏敗於河南例被責清寧初為南面林牙卒蕭陶隗字烏古鄰宰相轄特六世孫剛直有威重咸雍初任馬羣太保素知羣牧名存實亡悉閱舊籍除其羸病錄其實數牧人畏服陶隗上書曰羣牧以少為多以無為有上下相蒙積弊成風不若括見真數著為定籍公私兩濟從之畜產歲以蕃息大康中累遷契丹行宮都部署上嘗謂羣臣曰北樞密院軍國重任久闕其人耶律阿思蕭斡特剌二人孰愈羣臣各譽所長陶隗獨默然上問卿何不言陶隗曰斡特剌懦而敗事阿思有才而貪將為禍基不得已而用敗事猶勝基禍上曰陶隗雖魏徵不能過但恨吾不及太宗爾然竟以阿思為樞密使由是阿思銜之九年西圉不寧阿思奏曰邊隅事大可擇重臣鎮撫上曰陶隗何如阿思曰誠如聖旨遂拜西南面招討使阿思陰與蕭阿忽帶誣奏賊掠漠南牧馬及居民畜產陶隗不急追捕罪當死詔免官久之起為塌母城節度使未行疽發背卒陶隗負氣怒則須髯輒張每有大議必毅然決之雖上有難色未嘗遽已見權貴無少屈竟為阿思所陷時人惜之二子曰圖木轄式阿思死始獲進用蕭塔剌葛字陶哂六院部人素剛直太祖時坐叔祖臺哂謀殺于越釋魯沒入弘義宮世宗即位以舅氏故出其籍補國舅別部敞史或言泰寧王察割有無君心塔剌葛曰彼縱忍行不義人孰肯從他日侍宴酒酣塔剌葛捉察割耳強飲之曰上固知汝傲狠然以國屬曲加矜憫使汝在左右且度汝才何能為若長惡不悛徒自取赤族之禍察割不能答強笑曰何戲之虐也天祿末塔剌葛為北府宰相及察割作亂塔刺葛醉詈曰吾悔不殺此逆賊尋為察割所害耶律敵祿字陽隱孟父楚國王之後性質直多膂力察割作亂敵祿聞之入見壽安王慷慨言曰願得精兵數百破賊黨王嘉其忠穆宗即位為北院宣徽使上以飛狐道狹詔敵祿廣之明年將兵援河東至太原與漢王會于高平擊周軍敗之仍降其衆忻代二州叛將兵討之會耶律撻烈至敗周師於忻口師還卒論曰忠臣惟知有國而不知有身故惡惡不避其患阿剌以諂諛不法折蕭革陶隗以用必基禍言阿思塔剌葛以忍行不義徒自取赤族之罪責察割其心可謂忠矣言一出而禍輒隨之吁邪正既不辨國焉得無亂哉
