body:
  text: 遼史卷七十五列傳第五耶律覿烈羽之耶律鐸臻古突呂不王郁耶律圖魯窘耶律覿烈字兀里軫六院部蒲古只夷離堇之後父偶思亦為夷離堇初太祖為于越時覿烈以謹願寬恕見器使既即位兄曷魯典宿衛以故覿烈入侍帷幄與聞政事神冊三年曷魯薨命覿烈為迭剌部夷離堇屬以南方事會討党項皇太子為先鋒覿烈副之軍至天德雲內分道並進覿烈率遍師渡河力戰斬獲甚衆天贊初析迭剌部為北南院羅夷離堇時大元帥率師由古北口略燕地覿烈徇山西所至城堡皆下太祖嘉其功錫賚甚厚從伐渤海拔扶餘城留覿烈與寅底石守之天顯二年留守南京十年卒年五十六弟羽之羽之小字兀里字寅底哂幼豪爽不羣長嗜學通諸部語太祖經營之初多預軍謀天顯元年渤海平立皇太子為東丹王以羽之為中臺省右次相時人心未安左大相迭剌不踰月薨羽之蒞事勤恪威信並行太宗即位上表曰我大聖天皇始有東土擇賢輔以撫斯民不以臣愚而任之國家利害敢不以聞渤海昔畏南朝阻險自衛居忽汗城今去上京遼邈既不為用又不罷戍果何為哉先帝因彼離心乘釁而動故不戰而克天授人與彼一時也遺種浸以蕃息今居遠境恐為後患梁水之地乃其故鄉地衍土沃有木鐵鹽魚之利乘其微弱徙還其民萬世長策也彼得故鄉又獲木鐵鹽魚之饒必安居樂業然後選徒以翼吾左突厥党項室韋夾輔吾右可以坐制南邦混一天下成聖祖未集之功貽後世無疆之福表奏帝嘉納之是歲詔徙東丹國民於梁水時稱其善人皇王奔唐羽之鎮撫國人一切如故以功加守太傅遷中臺省左相會同初以冊禮赴闕加特進表奏左次相渤海蘇貪墨不法事卒子和里終東京留守耶律鐸臻字敵輦六院部人祖蒲古只遙輦氏時再為本部夷離堇耶律狼德等既害玄祖暴橫益肆蒲古只以計誘其黨悉誅夷之鐸臻幼有志節太祖為于越常居左右後即位梁人遣使求轅軸材太祖難之鐸臻曰梁名求材實覘吾輕重宜答曰材之所生必深山窮谷有神司之須白鼻赤驢禱祠然後可伐如此則其語自塞矣已而果然天贊三年將伐渤海鐸臻諫曰陛下先事渤海則西夏必躡吾後請先西討庶無後顧憂太祖從之及淳欽皇后稱制惡鐸臻囚之誓曰鐵鎖朽當釋汝既而召之使者欲去鎖鐸臻辭曰鐵未朽可釋乎后聞嘉歎趣召釋之天顯二年卒弟古突呂不古字涅剌昆初名霞馬葛太祖為于越嘗從略地山右會李克用於雲州古侍克用異之曰是兒骨相非常不宜使在左右以故太祖頗忌之時方西討諸弟亂作聞變太祖問古與否曰無喜曰吾無患矣趣召古議古陳殄滅之策後皆如言以故錫賚甚厚神冊末南伐以古佐右皮室詳穩老古與唐兵戰于雲碧店老古中流矢傷甚太祖疑古陰害之古知上意跪曰陛下疑臣恥居老古麾下耶及今老古在請遣使問之太祖使問老古對曰臣於古無可疑者上意乃釋老古卒遂以古為右皮室詳穩既卒太祖謂左右曰古死猶長松自倒非吾伐之也突呂不字鐸袞幼聰敏嗜學事太祖見器重及製契丹大字突呂不贊成為多未幾為文班林牙領國子博士知制誥明年受詔撰決獄法太祖略燕詔與皇太子及王郁攻定州師還至順州幽州馬步軍指揮使王千率衆來襲突呂不射其馬躓擒之天贊二年皇子堯骨為大元帥突呂不為副既克平州進軍燕趙攻下曲陽北平至易州易人來拒踰濠而陳李景章出降言城中人無鬬志大元帥將修攻具突呂不諫曰我師遠來人馬疲憊勢不可久留乃止軍還大元帥以其謀聞太祖大悅賜賚優渥車駕西征突呂不與大元帥為先鋒伐党項有功太祖犒師水精山大元帥東歸突呂不留屯西南部復討党項多獲而還太祖東伐大諲撰降而復叛攻之突呂不先登渤海平承詔銘太祖功德于永興殿壁班師已下州郡往往復叛突呂不從大元帥攻破之淳欽皇后稱制有飛語中傷者后怒突呂不懼而亡太宗知其無罪召還天顯三年討烏古部俘獲甚衆伐唐以突呂不為左翼攻唐軍霞沙寨降之十一年送晉主石敬瑭入洛及大冊突呂不總禮儀事加特進檢校太尉會同五年卒王郁京兆萬年人唐義武軍節度使處直之孽子伯父處存鎮義武卒三軍推其子郜襲處直為都知兵馬使光化三年梁王朱全忠攻定州郜遣處直拒于沙河兵敗入城逐郜郜奔太原亂兵推處直為留後遣人請事梁王梁與晉王克用絶好表處直為義武軍節度使初郜之亡也郁從之晉王克用妻以女用為新州防禦使處直料晉必討張文禮鎮亡則定不獨存益自疑陰使郁北導契丹入塞以牽晉兵且許為嗣郁自奔晉常恐失父心得使大喜神冊六年奉表送發舉室來降太祖以為養子未幾郁兄都囚父自為留後帝遣郁從皇太子討之至定州都堅壁不出掠居民而還明年從皇太子攻鎮州遇唐兵于定州破之天贊二年秋郁及阿古只略地燕趙攻下磁窯務從太祖平渤海戰有功加同政事門下平章事改崇義軍節度使太祖崩郁與妻會葬其妻泣訴於淳欽皇后求歸鄉國許之郁奏曰臣本唐主之壻主已被弒此行夫妻豈能相保願常侍太后后喜曰漢人中惟王郎最忠孝以太祖嘗與李克用約為兄弟故也尋加政事令還宜州卒耶律圖魯窘字阿魯隱肅祖子洽之孫勇而有謀略太宗立晉之役其父敵魯古為五院夷離堇歿于兵帝即以其職授圖魯窘會同元年改北院大王嘗屏左右與議大事占對合上意從討石重貴杜重威擁十萬餘衆拒滹沱橋力戰數日不得進帝曰兩軍爭渡人馬疲矣計安出諸將請緩師為後圖帝然之圖魯窘厲色進曰臣愚竊以為陛下樂於安逸則謹守四境可也既欲擴大疆宇出師遠攻詎能無厪聖慮若中路而止適為賊利則必陷南京夷屬邑若此則爭戰未已吾民無奠枕之期矣且彼步我騎何慮不克況漢人足力弱而行緩如選輕鋭騎先絶其餉道則事蔑不濟矣帝喜曰國強則其人賢海巨則其魚大於是塞其餉道數出師以牽撓其勢重威果降如言以功獲賜甚厚明年春卒軍中論曰神冊初元將相大臣拔起風塵之中翼扶王運以任職取名者固一時之材亦由太祖推誠御下不任獨斷用能總攬羣策而為之用歟其投天隙而列功庸至有心腹耳目手足之喻豈偶然哉討党項走敵魯平剌葛定渤海功亦偉矣若默記治獄不寃頗德持論不撓延徽立經陳紀紹勳秉節而死圖魯窘料敵制勝豈器博者無近用道長者其功遠歟稱為佐命固宜
