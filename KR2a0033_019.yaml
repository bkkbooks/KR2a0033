body:
  text: 遼史卷十九本紀第十九興宗二十年春正月辛亥朔宋遣梁適張從一富弼趙日宣來賀甲子復遣吳育馮戴來賀永壽節二月庚辰朔詔蒲盧毛𩽆部歸曷蘇舘戶之沒入者使復業甲申北樞密院言南北二王府及諸部節度侍衞祗候郎君皆出族帳既免與民戍邊其祗候事請亦得以部曲代行詔從其請夏四月詔罷修鴨淥江浮梁及漢兵屯戍之役又以東京留守蕭撒八言弛東京擊鞠之禁六月戊寅朔以蕭寧耶律坦崔禹稱馬世良耶律仁先劉六符充賀宋生辰使副耶律庶成趙成耶律烈張旦充來歲賀宋正旦使副秋七月壬戌詔諸職官私取官物者以正盜論諸敢以先朝已斷事相告言者罪之諸帳郎君等於禁地射鹿決三百不徵償小將軍決二百以下及百姓犯者罪同郎君論八月丙戌以醫者鄧延貞治詳穩蕭留寧疾驗贈其父母官以奬之九月辛亥朝皇太后國舅留寧薨庚申皇太后射獲熊上進酒為壽癸亥上獵馬盂山草木蒙密恐獵者誤射傷人命耶律迪姑各書姓名于矢以志之丙寅夏國獻宋俘以石硬砦太保郭三避虎不射免官冬十月丙戌詔東京留守蕭孝忠察官吏有廉幹清強者具以名聞庚寅以女直太師臺押為曷蘇舘都大王辛卯以皇子胡盧斡里生北宰相駙馬撒八寧迎上至其第宴飲上命衞士與漢人角觝為樂壬辰復飲皇太后殿以皇子生肆赦夕復引公主駙馬及內族大臣入寢殿劇飲甲午幸中京庚子以駙馬都尉蕭忽列為國舅詳穩十一月丙辰回鶻遣使來貢十二月丙子朔宋遣劉沆王整來賀應聖節乙未置撻朮不姑酋長以胡撻剌為平章事上聞宋設關河治壕塹恐為邊患與南北樞密吳國王蕭孝穆趙國王蕭貫寧謀取宋舊割關南十縣地遂遣蕭英劉六符使宋庚寅宋遣張沔侯宗亮薛申侍其濬施昌言潘永照來賀永壽節及來歲正旦以宣政殿學士楊佶為吏部尚書判順義軍節度使事丁酉議伐宋詔諭諸道十一年春正月戊申奉迎皇太后于內殿庚戌遣南院宣徽使蕭特末翰林學士劉六符使宋取晉陽及瓦橋以南十縣地且問興師伐夏及沿邊疏濬水澤增益兵戍之故二月壬寅如鴛鴦濼夏四月甲戌朔頒南征賞罰令六月乙亥宋遣富弼張茂實奉書來聘以書答之壬午御含涼殿放進士王寔等六十四人禁氈銀鬻入宋秋七月壬寅朔詔盜易官馬者減死論外路官勤瘁正直者考滿代不治事者即易之八月丙申宋復遣富弼張茂實奉書來聘乞增歲幣銀絹以書答之九月壬寅遣北院樞密副使耶律仁先漢人行宮副部署劉六符使宋約和是時富弼為上言大意謂遼與宋和坐獲歲幣則利在國家臣下無與與宋交兵則利在臣下害在國家上感其言和好始定閏月癸未耶律仁先遣人報宋歲增銀絹十萬兩匹文書稱貢送至白溝帝喜宴羣臣于昭慶殿是日振恤三父族之貧者辛卯仁先劉六符還進宋國誓書冬十一月丁亥羣臣加上尊號曰聰文聖武英略神功睿哲仁孝皇帝冊皇后蕭氏曰貞懿宣慈崇聖皇后大赦梁王洪基進封燕國王十二月癸卯朝皇太后甲辰封皇太弟重元子涅魯古為安定郡王己酉以宣獻皇后忌日上與皇太后素服飯僧于延壽憫忠三學三寺辛亥詔蠲預備伐宋諸部租稅一年壬子以吐渾党項多鬻馬夏國詔謹邊防己未宋遣賀正旦及永壽節使居邸帝微服往觀丁卯禁喪葬殺牛馬及藏珍寶十二年春正月辛未遣同知析津府事耶律敵烈樞密院都承旨王惟吉諭夏國與宋和壬申以吳國王蕭孝穆為南院樞密使北府宰相蕭孝忠北院樞密使封楚王韓國王蕭惠北府宰相同知元帥府事韓八南院大王耶律侯哂東京留守北院樞密副使耶律仁先同知東京留守事北面林牙蕭革北院樞密副使甲戌如武清寨葦淀二月壬寅禁關南漢民弓矢己酉夏國以加上尊號遣使來賀甲寅耶律敵烈等使夏國還奏元昊罷兵即遣使報宋三月辛卯幸南京壬辰高麗國以加上尊號遣使來賀夏四月己亥置回跋部詳穩都監庚子夏國遣使進馬駝五月辛卯斡魯蒲盧毛𩽆部二使來貢失期宥而遣還乙未詔復定禮制是月幸山西六月丙午詔世選宰相節度使族屬及身為節度使之家許葬用銀器仍禁殺牲以祭庚戌詔漢人宮分戶絕恆產以親族繼之辛亥阻卜大王屯禿古斯弟太尉撒葛里來朝丙辰回鶻遣使來貢甲子以南院樞密使吳國王蕭孝穆為北院樞密使徙封齊國王秋七月丙寅朔北院樞密使蕭孝忠薨特釋繫囚庚寅夏國遣使上表請伐宋不從八月丙申謁慶陵辛丑燕國王洪基加尚書令知北南院樞密使事進封燕趙國王戊午以前西北路招討使蕭塔烈葛為右夷離畢庚申于越耶律洪古薨甲子阻卜來貢九月壬申朝皇太后謁望仙殿壬午謁懷陵冬十月丁酉駐蹕中會川己亥北院樞密使蕭孝穆薨追贈大丞相晉國王庚子詔諸路上重囚遣官詳讞辛亥參知政事韓紹芳為廣德軍節度使三司使劉六符長寧軍節度使壬子以夏人侵党項遣延昌宮使高家奴讓之甲子北府宰相蕭惠為北院樞密使豳王遂哥為惕隱惕隱敵魯古封漆水郡王西北路招討使樞密副使蕭阿剌同知北院宣徽事出飛龍馬分賜羣臣十一月丁丑追封楚王蕭孝忠為楚國王丁亥以上京歲儉復其民租稅癸巳朝皇太后十二月戊申改政事省為中書省十三年春正月甲子朔朝皇太后戊辰如混同江辛未獵兀魯館岡二月庚戌如魚兒濼丙辰以參知政事杜防為南府宰相三月丁亥高麗遣使來貢以宣政殿學士楊佶參知政事是月置契丹警巡院夏四月己酉遣東京留守耶律侯哂知黃龍府事耶律歐里斯將兵攻蒲盧毛𩽆部甲寅南院大王耶律高十奏党項等部叛附夏國丙辰西南面招討都監羅漢奴詳穩斡魯母等奏山西部族節度使屈烈以五部叛入西夏乞南北府兵援送實威塞州戶詔富者遣行餘留屯田天德軍五月壬戌朔羅漢奴奏所發部兵與党項戰不利招討使蕭普達四捷軍詳穩張佛奴歿于陣李元昊來援叛黨戊辰詔徵諸道兵會西南邊以討元昊六月甲午阻卜酋長烏八遣其子執元昊所遣求援使窊邑改來乞以兵助戰從之駐蹕永安山以將伐夏遣延昌宮使耶律高家奴告宋丙申詔前南院大王耶律谷欲翰林都林牙耶律庶成等編集國朝上世以來事蹟丙午高麗遣使來貢丁未錄囚秋七月辛酉香河縣民李宜兒以左道惑衆伏誅庚午行再生禮庚辰夏國遣使來朝八月乙未以夏使對不以情覊之丁巳夏國復遣使來詢以事宜又不以實對笞之九月戊辰宋以親征夏國遣余靖致贐禮壬申會大軍于九十九泉以皇太弟重元北院樞密使韓國王蕭惠將先鋒兵西征冬十月庚寅祭天地丙申獲党項偵人射鬼箭丁酉李元昊上表謝罪己亥元昊遣使來奏欲收叛黨以獻從之辛亥元昊遣使來進方物詔北院樞密副使蕭革迓之壬子軍于河曲革言元昊親率党項三部來詔革詰其納叛背盟元昊伏罪賜酒許以自新遣之召羣臣議皆以大軍既集宜加討伐癸丑督數路兵掩襲殺數千人駙馬都尉蕭胡覩為夏人所執丁巳元昊遣使以先被執者來歸詔所留夏使亦還其國十一月辛酉賜有功將校有差甲子班師丁卯改雲州為西京辛巳朝皇太后十二月己丑幸西京戊戌以北院樞密副使耶律敵烈為右夷離畢己亥高麗遣使來貢戊申蕭胡覩自夏來歸十四年春正月庚申以侍中蕭虛烈為南院統軍使封遼西郡王庚午如鴛鴦濼壬午以金吾衞大將軍敵魯古為乙室大王甲申夏國遣使進鶻以常侍斡古得戰歿命其子習羅為帥二月庚子朝皇太后駐蹕撒剌濼三月己卯宋以伐夏師還遣使來賀四月辛亥高麗遣使來貢閏五月癸丑清暑永安山六月丁卯謁慶陵己卯阻卜大王屯禿古斯率諸酋長來朝庚辰夏國遣使來貢辛巳以西南面招討使蕭普達戰歿贈同中書門下平章事秋七月戊申駐蹕中會川冬十月甲子望祀木葉山十一月壬午朔回鶻阿薩蘭遣使來貢甲辰以同知北院宣徽事蕭阿剌為北府宰相十二月癸丑觀漢軍習砲射擊刺癸亥決滯獄十五年春正月乙酉如混同江禁契丹以奴婢鬻與漢人二月乙卯如長春河丙寅蒲盧毛𩽆界曷懶河戶來附詔撫之三月甲申朝皇太后乙酉以應聖節減死罪釋徒以下辛卯朝皇太后丁酉高麗遣使來貢詔諸道歲具獄訟以聞夏四月辛亥朔禁五京吏民擊鞠戊午罷遙輦帳戍軍壬戌以北女直詳穩蕭高六為奚六部大王甲子清暑永安山甲戌蒲盧毛𩽆曷懶河百八十戶來附六月癸丑以西京留守耶律馬六為漢人行宮都部署參知政事楊佶出為武定軍節度使戊辰御清涼殿放進士王棠等六十八人甲戌西北路招討使耶律敵魯古坐贓免官秋七月乙酉豳王遂哥薨戊子觀穫乙未以北院宣徽使族墳為左夷離畢前南府宰相耶律喜孫東北路詳穩丙申籍諸路軍丁酉如秋山辛丑禁扈從踐民田丁未以女直部長遮母率衆來附加太師八月癸丑高麗王欽薨遣使來告九月甲辰禁以罝網捕狐兔冬十月己酉駐蹕中會川十一月丁亥以南院樞密使蕭孝友為北府宰相契丹行宮都部署耶律仁先南院大王北府宰相蕭革同知北院樞密使事知夷離畢事耶律信先漢人行宮都部署左夷離畢旅墳惕隱漢人行宮都部署耶律敵烈左夷離畢己亥渤海部以契丹戶例通括軍馬乙巳振南京貧民十二月壬申曲赦徒以下罪是日為聖宗在時生辰
