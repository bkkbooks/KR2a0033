body:
  text: 遼史卷二十四本紀第二十四道宗四五年春正月壬申如混同江癸酉賜宰相耶律孝傑名仁傑乙亥如山榆淀三月辛未以宰相仁傑獲頭鵝加侍中壬辰以北院樞密使魏王耶律乙辛知南院大王事加于越知北院樞密使事耶律霂為北院樞密使北院樞密副使耶律特里底知北院樞密使事左夷離畢耶律世遷同知北院樞密使事夏四月己未如納葛濼五月丁亥謁慶陵以契丹行宮都部署耶律燕哥為南府宰相北面林牙耶律永寧為夷離畢同知南院樞密使事蕭撻不也及殿前副點檢駙馬都尉蕭酬斡並封蘭陵郡王六月辛亥阻卜來貢丁巳以北府宰相遼西郡王蕭余里也為西北路招討使己未遣使録囚是月放進士劉瓘等百一十三人秋七月己卯獵夾山八月庚申命有司撰太宗神功碑立于南京九月己卯詔諸路毋禁僧徒開壇壬午禁扈從擾民冬十月戊戌夏國遣使來貢己亥駐蹕獨盧金壬子詔惟皇子仍一字王餘並削降丁巳振平州貧民己未以趙王楊績為遼西郡王魏王耶律乙辛降封混同郡王吳王蕭韓家奴蘭陵郡王致仕十一月丁丑召沙門守道開壇于內殿癸未復南京流民差役三年被火之家免租稅一年十二月丙午彗星犯尾乙卯幸西京戊午行再生禮赦雜犯死罪以下六年春正月癸酉如鴛鴦濼辛卯耶律乙辛出知興中府事三月庚寅封皇孫延禧為梁王忠順軍節度使耶律頗德南院大王耶律仲禧南院樞密使戶部使陳毅參知政事夏四月乙卯獵炭山五月壬申免平州復業民租賦一年庚寅以旱禱雨命左右以水相沃俄而雨降六月戊戌駐蹕納葛濼戊申以度支使王績參知政事庚戌女直遣使來貢秋七月戊辰觀市癸未為皇孫梁王延禧設旗鼓拽剌六人衛護之甲申獵沙嶺閏九月壬寅祠木葉山己酉駐蹕藕絲淀冬十月己未朔省同知廣德軍節度使事命奉先軍節度使兼巡警乾顯二州丁卯耶律仁傑出為武定軍節度使庚午參知政事劉詵致仕癸酉以陳毅為漢人行宮都部署王績同知樞密院事辛巳回鶻遣使來貢十一月己丑朔日有食之癸卯召羣臣議政十二月甲子以耶律特里底為孟父敞穩乙丑以蕭撻不也為北府宰相耶律世遷知北院樞密使事耶律慎思同知北院樞密使事庚午免西京流民租賦一年甲戌減民賦丁亥豫行正旦禮戊子如混同江七年春正月戊申五國部長來貢甲寅女直貢良馬二月甲子如魚兒濼夏五月壬子駐蹕嶺西癸丑有司奏永清武清固安三縣蝗甲寅以蕭撻不也兼殿前都點檢蕭酬斡為漢人行宮都部署兼知樞密院事六月甲子詔月祭觀德殿歲寒食諸帝在時生辰及忌日詣景宗御容殿致奠丙寅阻卜余古赧來貢丁卯以翰林學士王言敷參知政事封北院宣徽使石篤漆水郡王秋七月戊子如秋山丙申謁慶陵八月丁卯射鹿赤山加圍場使涅葛為靜江軍節度使九月戊子次懷州命皇后謁懷陵辛卯次祖州命皇后謁祖陵乙巳駐蹕藕絲淀冬十月戊辰以惕隱王九為南院大王夷離畢奚抄只為彰國軍節度使十一月乙酉詔歲出官錢振諸宮分及邊戍貧戶丁亥幸駙馬都尉蕭酬斡第方飲宰相梁穎諫曰天子不可飲人臣家上即還宮己亥高麗遣使來貢辛亥除絹帛尺度狹短之令十二月丁卯武定軍節度使耶律仁傑以罪削爵為民辛未知興中府事耶律乙辛以罪囚于來州八年春正月甲申如混同江丁酉鐵驪五國諸長各貢方物二月戊午如山榆淀辛酉詔北南院官凡給驛者必先奏聞貢新及奏獄訟方許馳驛餘並禁之己巳夏國獲宋將張天一遣使來獻壬申以耶律頗德為南府宰相兼知北院樞密使燕哥為惕隱蕭撻不也兼知契丹行宮都部署事三月庚戌黃龍府女直部長朮乃率部民內附豫官賜印綬是月詔行秬黍所定升斗夏四月壬戌以耶律世遷為上京留守六月辛亥朔駐蹕納葛濼丙辰夏國遣使來貢丁巳以耶律頗德為北院樞密使耶律巢哥南府宰相劉筠南院樞密使蕭撻不也兼知北院樞密使事王績漢人行宮都部署蕭酬斡國舅詳穩乙丑阻卜長來貢丙子以耶律慎思知右夷離畢事秋七月甲午如秋山南京霖雨沙河溢永清歸義新城安次武清香河六縣傷稼九月庚寅謁慶陵丁未駐蹕藕絲淀大風雪牛馬多死賜扈從官以下衣馬有差冬十月乙卯詔化哥傅導梁王延禧加金吾衛大將軍丙子謁乾陵十一月壬午以乙室大王蕭何葛為南院宣徽使權知奚六部大王事圖趕為本部大王十二月癸丑烏古敵烈統軍使耶律馬五為北院大王庚申降皇后為惠妃出居乾陵九年春正月辛巳如春水夏四月丙午朔大雪平地丈餘馬死者十六七五月如黑嶺六月己未駐蹕散水原甲子以耶律阿思為契丹行宮都部署耶律慎思北院樞密副使庚午詔諸路檢括脫戶罪至死者原之閏月丁丑以漢人行宮副部署可汗奴為南院大王戊寅追諡庶人濬為昭懷太子丁亥阻卜來貢己丑以知興中府事邢熙年為漢人行宮都部署漢人行宮都部署王績為南院樞密副使秋七月乙巳獵馬尾山丁巳謁慶陵癸亥禁外官部內貸錢取息及使者館于民家八月高麗王徽薨九月癸卯朔日有食之己酉射熊于白石山加圍場使涅葛左金吾衛大將軍己巳以高麗王徽子三韓國公勳權知國事辛未五國部長來貢壬申召北南樞密院官議政事冬十月丁丑謁觀德殿己卯南院樞密使劉筠薨壬辰混同郡王耶律乙辛謀亡入宋伏誅十一月丙午進封梁王延禧為燕國王大赦以南院宣徽使蕭何葛為南府宰相三司使王經參知政事兼知樞密事甲寅詔僧善知讎校高麗所進佛經頒行之己未定諸令史譯史遷等級十二月丁亥以邢熙年知南院樞密使事辛卯以王言敷為漢人行宮都部署高麗三韓國公王勳薨是年御前放進士李君裕等五十一人十年春正月辛丑朔如春水丙午復建南京奉福寺浮圖戊辰如山榆淀二月庚午朔萌古國遣使來聘三月戊申遠萌古國遣使來聘丁巳命知制誥王師儒牌印郎君耶律固傅導燕國王延禧夏四月丁丑女直貢良馬五月壬戌駐蹕散水原乙丑阻卜來貢丙寅降國舅詳穩班位在敞穩之下六月壬辰禁毀銅錢為器秋七月甲辰如黑嶺九月癸亥駐蹕藕絲淀冬十二月乙未改慶州大安軍曰興平是月改明年為大安赦雜犯死罪以下大安元年春正月丁酉如混同江癸卯王績知南院樞密使事邢熙年為中京留守戊申以樞密直學士杜公謂參知政事庚戌五國酋長來貢良馬二月辛未如山榆淀夏四月乙酉宋主頊殂子煦嗣位使來告哀辛卯西幸六月戊辰駐蹕拖古烈壬申以王績為南府宰相蕭撻不也兼知南院樞密使事丁丑遣使弔祭于宋戊寅宋遣王真甄祐等饋其先帝遺物秋七月乙巳遣使賀宋主即位戊午獵于赤山八月丁卯幸慶州戊辰謁慶陵冬十月癸亥駐蹕好草淀戊辰夏國王李秉常遣使報其母梁氏哀甲申以蕭撻不也為南院樞密使十一月乙未詔比者外官因譽進秩久而不調民被其害今後皆以資給遷轉丁酉以南女直詳穩蕭袍里為北府宰相辛亥史臣進太祖以下七帝實録丙辰遣使冊三韓國公王勳弟運為高麗國王己未詔僧尼無故不得赴闕十二月甲戌宋遣蔡卞來謝弔祭二年春正月辛卯如混同江己酉五國諸部長來貢癸丑召權翰林學士趙孝嚴知制誥王師儒等講五經大義二月癸酉駐蹕山榆淀是月太白犯歲星三月乙酉女直貢良馬夏四月戊戌北幸癸丑遣使加統軍使蕭訛都斡太子太保裨將老古金吾衛大將軍蕭雅哥靜江軍節度使耶律燕奴右監門衛大將軍仍賜賚諸軍士五月丁巳朔以牧馬蕃息多至百萬賞羣牧官以次進階乙亥駐蹕納葛濼戊寅宰相梁穎出知興中府事是月放進士張轂等二十六人六月丁亥朔以左夷離畢耶律坦為惕隱知樞密院事耶律斡特剌兼知左夷離畢事丙申阻卜來朝癸卯遣使按諸路獄甲辰以同知南京留守事耶律那也知右夷離畢事乙巳阻卜酋長余古赧及愛的來朝詔燕國王延禧相結為友戊申以契丹行宮都部署耶律阿思兼知北院大王事壬子高墩以下縣令録事兄弟及子悉許用秋七月丁巳惠妃母燕國夫人削古以厭魅梁王事覺伏誅子蘭陵郡王蕭酬斡除名置邊郡仍隸興聖宮戊午獵沙嶺甲子賜興聖積慶二宮貧民錢乙酉出粟振遼州貧民八月戊子以雪罷獵九月庚午還上京壬申發粟振上京中京貧民丙子謁二儀五鸞二殿己卯出太祖太宗所御鎧仗示燕國王延禧諭以創業征伐之難辛巳召南府宰相議國政冬十月乙酉朔以樞密副使竇景庸知樞密院事丙戌五國部長來貢丁亥以夏國王李秉常薨遣使詔其子乾順知國事十一月甲戌為燕國王延禧行再生禮曲赦上京囚戊寅高麗遣使謝封冊癸未出粟振乾顯成懿四州貧民十二月辛卯以蘭陵郡王蕭撻不也為南院樞密使己亥夏國王李乾順遣使上其父遺物
