body:
  text: 遼史卷七十表第八屬國表周有天下不期而會者八百餘國遼居松漠最為強盛天命有歸建國改元號令法度皆遵漢制命將出師臣服諸國人民皆入版籍貢賦悉輸內帑東西朔南何啻萬里視古起百里國而致太平之業者亦幾矣故有遼之盛不可不著作屬國表
