body:
  text: 遼史卷六十二志第三十一刑法志下興宗即位欽哀皇后始得志昆弟專權馮家奴等希欽哀意誣蕭浞卜等謀反連及嫡后仁德皇后浞卜等十餘人與仁德姻援坐罪者四十餘輩皆被大辟仍籍其家幽仁德于上京既而遣人弒之迫殞非命中外切憤欽哀後謀廢立遷于慶州及奉迎以歸頗復預事其酷虐不得逞矣然興宗好名喜變更又溺浮屠法務行小惠數降赦宥釋死囚甚衆重熙元年詔職事官公罪聽贖私罪各從本法子弟及家人受賕不知情者止坐犯人先是南京三司銷錢作器皿三斤持錢出南京十貫及盜遺火家物五貫者處死至是銅逾三斤持錢及所盜物二十貫以上處死二年有司奏元年詔曰犯重罪徒終身者加以捶楚而又黥面是犯一罪而具三刑宜免黥其職事官及宰相節度使世選之家子孫犯姦罪至徒者未審黥否止諭曰犯罪而悔過自新者亦有可用之人一黥其面終身為辱朕甚憫焉後犯終身徒者止刺頸奴婢犯逃若盜其主物主無得擅黥其面刺臂及頸者聽犯竊盜者初刺右臂再刺左三刺頸之右四刺左至于五則處死五年新定條制成詔有司凡朝日執之仍頒行諸道蓋纂修太祖以來法令參以古制其刑有死流杖及三等之徒而五凡五百四十七條時有羣牧人竊易官印以馬與人者法當死帝曰一馬殺二人不亦甚乎減死論又有兄弟犯強盜當死以弟從兄且俱無子特原其弟至於枉法受賕詐敕走遞僞學御書盜外國貢物者例皆免死郡王貼不家奴彌里吉告其主言涉怨望鞫之無驗當反坐以欽哀皇后𩹉言竟不加罪亦不斷付其主僅籍沒焉寧遠軍節度使蕭白強掠烏古敵烈都詳穩敵魯之女為妻亦以后言免死杖而奪其官梅里狗丹使酒殺人而逃會永壽節出首特赦其罪皇妹秦國公主生日帝幸其第伶人張隋本宋所遣汋者大臣覺之以聞召詰款伏乃遽釋之後詔諸職官私取官物者以正盜論諸帳郎君等於禁地射鹿決杖三百不徵償小將軍決二百已下至百姓犯者決三百聖宗之風替矣道宗清寧元年詔諸宮都部署曰凡有機密事即可面奏餘所訴事以法施行有投誹訕之書其受及讀者皆棄市二年命諸郡長吏如諸部例與僚屬同決罪囚無致枉死獄中下詔曰先時諸路死刑皆待決于朝故獄訟留滯自今凡強盜得實者聽即決之四年復詔左夷離畢曰比詔外路死刑聽所在官司即決然恐未能悉其情或有枉者自今雖已款伏仍令附近官司覆問無寃然後決之有寃者即具以聞咸雍元年詔獄囚無家者給以糧六年帝以契丹漢人風俗不同國法不可異施於是命惕隱蘇樞密使乙辛等更定條制凡合于律令者具載之其不合者別存之時校定官即重熙舊制更竊盜贓二十五貫處死一條增至五十貫處死又刪其重復者二條為五百四十五條取律一百七十三條又創增七十一條凡七百八十九條增重編者至千餘條皆分類列以大康間所定復以律及條例參校續增三十六條其後因事續校至大安三年止又增六十七條條約既繁典者不能遍習愚民莫知所避犯法者衆吏得因緣為姦故五年詔曰法者所以示民信而致國治簡易如天地不忒如四時使民可避而不可犯比命有司纂修刑法然不能明體朕意多作條目以罔民于罪朕甚不取自今復用舊法餘悉除之然自大康元年北院樞密使耶律乙辛等用事宮婢單登等誣告宣懿皇后乙辛以聞即詔乙辛劾狀因實其事上怒族伶人趙惟一斬高長命皆籍其家仍賜皇后自盡三年乙辛又與其黨謀搆昭懷太子陰令右護衛太保耶律查剌告知樞密院事蕭速撒等八人謀立皇太子詔按無狀出速撒達不也外補流護衛撒撥等六人詔告首謀逆者重加官賞否則悉行誅戮乙辛教牌印郎君蕭訛都斡自首臣嘗預速撒等謀因籍姓名以告帝信之以乙辛等鞫按至杖皇太子囚之宮中別室殺撻不也撒剌等三十五人又殺速撒等諸子其幼稚及婦女奴婢家産皆籍沒之或分賜羣臣燕哥等詐為太子爰書以聞上大怒廢太子徙上京乙辛尋遣人弒于囚所帝猶不寤朝廷上下無復紀律天祚乾統元年凡大康三年預乙辛所害者悉復官爵籍沒者出之流放者還鄉里至二年始發乙辛等墓剖棺戮尸誅其子孫餘黨子孫減死徙邊其家屬奴婢皆分賜被害之家如耶律撻不也蕭達魯古等黨人之尤凶狡者皆以賂免至于覆軍失城者第免官而已行軍將軍耶律涅里三人有禁地射鹿之罪皆棄市其職官諸局人有過者鐫降決斷之外悉從軍賞罰無章怨讟日起劇盜相挻叛亡接踵天祚大恐益務繩以嚴酷由是投崖炮擲釘割臠殺之刑復興焉或有分尸五京甚者至取其心以獻祖廟雖由天祚救患無策流為殘忍亦由祖宗有以啓之也遼之先代用法尚嚴使其子孫皆有君人之量知所自擇猶非祖宗貽謀之道不幸一有昏暴者少引以藉口何所不至然遼之季世與其先代用刑同而興亡異者何歟蓋創業之君施之于法未定之前民猶未敢測也亡國之主施之于法既定之後民復何所賴焉此其所為異也傳曰新國輕典豈獨權事宜而已乎天祚末年遊畋無度頗有倦勤意諸子惟文妃所生敖盧斡最賢蕭奉先乃元妃兄深忌之會文妃之女兄適耶律撻曷里女弟適耶律余覩奉先乃誣告余覩等謀立晉王尊天祚為太上皇遂戮撻曷里及其妻賜文妃自盡敖盧斡以不與謀得免及天祚西狩奉聖州又以耶律撒八等欲劫立敖盧斡遂誅撒八盡其黨與敖盧斡以有人望即日賜死當時從行百官諸局承應人及軍士聞者皆流涕蓋自興宗時遽起大獄仁德皇后戕于幽所遼政始衰道宗殺宣懿皇后遷昭懷太子太子尋被害天祚知其父之寃而己亦幾殆至是又自殺其子敖盧斡傳曰於所厚者薄無所不薄矣遼二百餘年骨肉屢相殘滅天祚荒暴尤甚遂至于亡噫
