body:
  text: 遼史卷九十七列傳第二十七耶律斡特剌孩里竇景庸耶律引吉楊績趙徽王觀耶律喜孫耶律斡特剌字乙辛隱許國王寅底石六世孫少不喜官祿年四十一始補本班郎君時樞密使耶律乙辛擅權讒害忠良斡特剌恐禍及深自抑畏大康中為宿直官歷左右護衛太保大安元年升燕王傅徙左夷離畢四年改北院樞密副使帝賜詩褒之遷知北院樞密使事賜翼聖佐義功臣北阻卜酋長磨古斯叛斡特剌率兵進討會天大雪敗磨古斯四別部斬首千餘級拜西北路招討使封漆水郡王加賜宣力守正功臣尋拜南府宰相復討閘古胡里扒部破之召為契丹行宮都部署先是北南府有訟各州府得就按之比歲非奉樞密檄不得鞫問以故訟者稽留斡特剌奏請如舊從之壽隆五年復為西北路招討使討耶覩刮部俘斬甚衆獲馬駝牛羊各數萬明年擒磨古斯加守太保賜奉國匡化功臣乾統初乞致仕不許止罷招討復兼南院樞密使封混同郡王遷北院樞密使加守太師賜推誠贊治功臣致仕薨諡曰敬肅孩里字胡輦回鶻人其先在太祖時來貢願留因任用之孩里重熙間歷近侍長清寧九年討重元之亂有功加金吾衛上將軍賜平亂功臣纍遷殿前都點檢以宿衛嚴肅稱大康初加守太子太保二年加同中書門下平章事三年改同知南院宣徽使事會耶律乙辛出守中京孩里入賀及議復召陳其不可後乙辛再入樞府出孩里為廣利軍節度使及皇太子被誣孩里當連坐有詔勿問大安初歷品達魯虢部節度使壽隆五年有疾自言吾數已盡却醫藥卒年七十七孩里素信浮圖清寧初從上獵墮馬憒而復蘇言始見二人引至一城宮室宏敞有衣絳袍人坐殿上左右列侍導孩里升階持牘者示之曰本取大腹骨欲誤執汝牘上書官至使相壽七十七須臾還擠之大壑而寤道宗聞之命書其事後皆驗竇景庸中京人中書令振之子聰敏好學清寧中第進士授祕書省校書郎纍遷少府少監咸雍六年授樞密直學士尋知漢人行宮副部署事大安初遷南院樞密副使監修國史知樞密院事賜同德功臣封陳國公有疾表請致仕不從加太子太保授武定軍節度使審決寃滯輕重得宜以獄空聞七年拜中京留守九年薨諡曰肅憲子瑜三司副使耶律引吉字阿括品部人父雙古鎮西邊二十餘年治尚嚴肅不殖貨利時多稱之引吉寅畏好義以廕補官纍遷東京副留守北樞密院侍御時蕭革蕭圖古辭等以佞見任鬻爵納賄引吉以直道處其間無所阿唯改客省使時朝廷遣使括三京隱戶不得以引吉代之得數千餘戶時昭懷太子知北南院事選引吉為輔導樞密使乙辛將傾太子惡引吉在側奏出之為羣牧林牙大康元年乙辛請賜牧地引吉奏曰今牧地褊畜不蕃息豈可分賜臣下帝乃止乙辛由是益嫉之除懷德軍節度使徙漠北猾水馬羣太保卒楊績良鄉人太平十一年進士及第纍遷南院樞密副使與杜防韓知白等擅給進士堂帖降長寧軍節度使徙知涿州清寧初拜參知政事兼同知樞密院事為南府宰相九年聞重元亂與姚景行勤王上嘉之十年知興中府咸雍初入知樞密院事二年乞致仕不許拜南院樞密使帝以績舊臣特詔燕見論古今治亂人臣邪正帝曰方今羣臣忠直耶律玦劉伸而已然伸不及玦之剛介績拜賀曰何代無賢世亂則獨善其身主聖則兼濟天下陛下銖分邪正升黜分明天下幸甚纍表告歸不許封趙王大康中以例改王遼西致仕加守太保薨子貴忠知興中府趙徽南京人重熙五年擢甲科纍遷大理正清寧二年銅州人妄毀三教徽按鞫之以狀聞稱旨歷煩劇有能名纍遷翰林學士承旨咸雍初為度支使三年拜參知政事出為武定軍節度使及代軍民請留後同知樞密院事兼南府宰相門下侍郎平章事致仕卒追贈中書令諡文憲王觀南京人博學有才辨重熙七年中進士乙科興宗崩充夏國報哀使還除給事中咸雍初遷翰林學士五年兼乾文閣學士七年改南院樞密副使賜國姓參知政事兼知南院樞密事坐矯制修私第削爵為民卒耶律喜孫字盈隱永興宮分人興宗在青宮嘗居左右輔導聖宗大漸喜孫與馮家奴告仁德皇后同宰相蕭浞卜等謀逆事及欽哀為皇太后稱制喜孫尤見寵任重熙中其子涅哥為近侍坐事伏誅帝以喜孫有翼戴功且悼其子罪死欲世其官喜孫無所出之部因見馬印文有品部號使隸其部拜南府宰相尋出為東北路詳穩卒論曰孩里引吉之為臣也當乙辛擅權蕭革貪黷之日雖與同官而能以正自處不少阿唯其過人遠矣傳曰歲寒知松柏之後凋二子有焉若斡特剌之戰功竇景庸之讞獄楊績之忠告亦賢矣夫
