body:
  text: 遼史卷二十三本紀第二十三道宗三八年春正月癸未烏古敵烈部詳穩耶律巢等奏克北邊捷以戰多殺人飯僧南京中京甲申如魚兒濼壬寅昏霧連日二月丙辰北南樞密院言無事可陳壬戌以討北部功烏古敵烈部詳穩耶律巢知北院大王事都監蕭阿魯帶烏古敵烈部詳穩加左監門衛上將軍戊辰歲飢免武安州租稅振恩蔚順惠等州民三月癸卯有司奏春泰寧江三州三千餘人願為僧尼受具足戒許之夏四月壬子振義饒二州民丁巳駐蹕塔里捨己卯清暑拖古烈五月壬午晉王仁先薨六月甲寅振易州貧民己未振中京甲子振興中府甲戌封北府宰相楊績為趙王樞密副使耶律觀參知政事兼知南院樞密使事丁丑高麗遣使來貢秋七月己卯慶州靳文高八世同居詔賜爵丙申振饒州飢民丁酉幸黑嶺丁未以御書華嚴經五頌出示羣臣閏月辛未射熊于羖羊山八月庚辰混同郡王侯古薨遣使致祭九月甲子駐蹕藕絲淀冬十月己丑參知政事耶律觀矯制營私第降為庶人癸巳回鶻來貢十一月庚戌免祖州稅丙辰大雪許民樵採禁地丁卯賜延昌宮貧戶錢十二月戊辰漢人行宮都部署耶律仲禧封韓國公樞密副使參知政事趙徽出為武定軍節度使樞密副使柴德滋參知政事漢人行宮副部署耶律大悲奴升都部署同知南院樞密使事蕭韓家奴知左夷離畢事丁丑以坤寧節大赦庚寅賜高麗佛經一藏九年春正月丁未如雙濼夏四月壬辰如旺國崖秋七月甲辰獵大熊山戊申烏古敵烈統軍言八石烈敵烈人殺其節度使以叛己酉詔隗烏古部軍分道擊之丙寅南京奏歸義淶水兩縣蝗飛入宋境餘為蜂所食八月丙申以耶律仲禧為南院樞密使九月癸卯駐蹕獨盧金冬十月幸陰山遂如西京十一月戊午詔行幸之地免租一年甲子南院大王合理只致仕十二月辛未以知北院樞密使事耶律宜新為中京留守南院宣徽使耶律撒剌為南院大王壬辰高麗夏國並遣使來貢十年春正月乙卯如鴛鴦濼二月癸未蠲平州復業民租賦戊子阻卜來貢三月甲子如拖古烈以耶律巢為北院大王夏四月旱辛未以奚人達魯三世同居賜官旌之五月丙寅録囚六月戊辰親出題試進士壬申詔臣庶言得失丙子御永定殿策賢良秋七月丙辰如秋山癸亥謁慶陵九月庚戌幸東京謁二儀五鸞殿癸亥祠木葉山冬十月丁卯駐蹕藕絲淀丁丑詔有司頒行史記漢書十一月戊午高麗遣使來貢十二月辛巳改明年為大康大赦大康元年春正月乙未如混同江壬寅振雲州飢二月丁卯祥州火遣使恤災乙酉駐蹕大魚濼丁亥以獲鵝加鷹坊使耶律楊六為工部尚書三月乙巳命皇太子寫佛書夏四月丙子振平州飢乙酉如犢山閏月丙午振平灤二州飢庚戌皇孫延禧生五月甲子賜妃之親及東宮僚屬爵有差六月癸巳以興聖宮使奚謝家奴知奚六部大王事戊戌知三司使事韓操以錢穀增羡授三司使癸卯遣使按問諸路囚以惕隱大悲奴為始平軍節度使參知政事柴德滋武定軍節度使乙卯吐蕃來貢丙辰詔皇太子總領朝政仍戒諭之以武定軍節度使趙徽為南府宰相樞密副使楊遵勗參知政事秋七月辛酉朔獵平地松林丙寅振南京貧民八月庚寅朔日有食之九月乙亥駐蹕藕絲淀己卯以南京飢免租稅一年仍出錢粟振之冬十月西北路酋長遐搭雛搭雙古等來降十一月辛酉皇后被誣賜死殺伶人趙惟一高長命並籍其家屬十二月己丑朔以南京統軍使耶律蘂奴為惕隱漢人行宮都部署耶律霂樞密副使同知東京留守事蕭鐸剌夷離畢庚寅賜張孝傑國姓壬辰以西京留守蕭燕六為左夷離畢二年春正月己未如春水庚辰駐蹕雙濼二月戊子振黃龍府飢癸丑南京路飢免租稅一年三月辛酉皇太后崩壬戌遣殿前副點檢耶律轄古報哀于宋癸亥遣使報哀于高麗夏國丁卯大赦戊寅以皇太后遺物遣使遺宋夏夏六月乙酉朔上大行皇太后尊諡曰仁懿皇后戊子宋及高麗夏國各遣使弔祭甲午葬仁懿皇后于慶陵己亥駐蹕拖古烈壬寅出北院樞密使魏王耶律乙辛為中京留守丁未册皇后蕭氏封其父祗候郎君鱉里剌為趙王叔西北路招討使余里也遼西郡王兄漢人行宮都部署駙馬都尉霞抹柳城郡王參知政事楊遵勗知南院樞密使事北院樞密副使蕭速撒知北院樞密使事漢人行宮副部署劉詵參知政事己酉南府宰相趙徽致仕秋七月戊辰如秋山癸酉柳城郡王霞抹薨八月庚寅獵遇麛失其母憫之不射九月戊午以南京蝗免明年租稅己卯駐蹕藕絲淀冬十月戊戌召中京留守魏王耶律乙辛復為北院樞密使十一月甲戌上欲觀起居注修注郎不及忽突堇等不進各杖二百罷之流林牙蕭岩壽於烏隗部是月南京地震民舍多壞十二月己丑以左夷離畢蕭撻不也為南京統軍使三年春正月癸丑如混同江乙卯省諸道春貢金帛及停周歲所輸尚方銀二月壬午朔東北路統軍使蕭韓家奴加尚父封吳王甲申詔北院樞密使魏王耶律乙辛同母兄大奴同母弟阿思世預北南院樞密之選其異母諸弟世預夷離堇之選己丑如魚兒濼辛卯中京飢罷巡幸夏四月乙酉泛舟黑龍江五月丙辰玉田安次蝝傷稼癸亥日中有黑子己巳駐蹕犢山乙亥北院樞密使耶律乙辛奏右護衛太保查剌等告知北院樞密使事蕭速撒等八人謀立皇太子上以無狀不治出速撒等三人補外護衛撒撥等六人各百餘徙于邊丙子以西北路招討使遼西郡王蕭余里也為北府宰相兼知契丹行宮都部署事戊寅詔告謀逆事者重加官賞六月己卯朔耶律乙辛令牌印郎君蕭訛都斡誣首嘗預速撒等謀籍其姓名以告即命乙辛及耶律仲禧蕭余里也耶律孝傑楊遵勗燕哥抄只蕭十三等鞫治杖皇太子囚之宮中辛巳殺宿直官敵里剌等三人壬午殺宣徽使撻不也等二人癸未殺始平軍節度使撒剌等十人又遣使殺上京留守速撒及已徙護衛撒撥等六人乙酉殺耶律撻不也及其弟陳留丙戌廢皇太子為庶人囚之上京己丑回鶻來貢殺東京留守同知耶律回里不辛卯殺速撒等諸子籍其家戊申遣使按五京諸道獄秋七月辛亥護衛太保查剌加鎮國大將軍預突呂不部節度使之選室韋查剌及蕭寶神奴謀魯古並加左衛大將軍牌印郎君訛都斡尚皇女趙國公主授駙馬都尉始平軍節度使祗候郎君耶律撻不也及蕭圖古辭並加監門衛上將軍壬子知北院樞密副使蕭韓家奴為漢人行宮都部署乙丑如秋山丁丑謁慶陵八月庚寅漢人行宮都部署蕭韓家奴薨辛丑謁慶陵九月癸亥玉田貢嘉禾壬申修乾陵廟冬十月辛丑駐蹕藕絲淀十一月北院樞密使耶律乙辛遣其私人盜殺庶人濬于上京閏十二月戊午以北府宰相遼西郡王蕭余里也知北院樞密使事左夷離畢耶律燕哥為契丹行宮都部署丙寅預行正旦禮是歲南京大熟四年春正月庚辰如春水甲午振東京飢二月乙丑駐蹕掃獲野戊辰以東路統軍使耶律王九為惕隱夏四月辛亥高麗遣使乞賜鴨淥江以東地不許五月丙戌駐蹕散水原六月甲寅阻卜諸酋長進良馬秋七月甲戌諸路奏飯僧尼三十六萬八月癸卯詔有司決滯獄九月乙未駐蹕藕絲淀庚子五國部長來貢冬十月癸卯以參知政事劉伸為保靜軍節度使十一月丁亥禁士庶服用錦綺日月山龍之文己丑回鶻遣使來貢庚寅南院樞密使耶律仲禧為廣德軍節度使辛卯錦州民張寶四世同居命諸子三班院祗候十二月丁卯以北院樞密副使耶律霂知北院樞密使事
