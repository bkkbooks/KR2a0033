body:
  text: 遼史卷四十志第十地理志四南京道南京析津府本古冀州之地高陽氏謂之幽陵陶唐曰幽都有虞析為幽州商併幽於冀周分並為幽職方東北幽州山鎮醫巫閭澤藪貕養川河泲浸菑時其利魚鹽其畜馬牛豕其穀黍稷稻武王封太保奭于燕秦以其地為漁陽上谷右北平遼西遼東五郡漢為燕國歷封臧荼盧綰劉建劉澤劉旦嘗置涿郡廣陽國後漢為廣平國廣陽郡或合于上谷復置幽州後周置燕及范陽郡隋為幽州總管唐置大都督府改范陽節度使安祿山史思明李懷仙朱滔劉怦劉濟相繼割據劉總歸唐至張仲武張允仲以正得民劉仁恭父子僭爭遂入五代自唐而晉高祖以遼有援立之勞割幽州等十六州以獻太宗升為南京又曰燕京城方三十六里崇三丈衡廣一丈五尺敵樓戰櫓具八門東曰安東迎春南曰開陽丹鳳西曰顯西清晉北曰通天拱辰大內在西南隅皇城內有景宗聖宗御容殿二東曰宣和南曰大內內門曰宣教改元和外三門曰南端左掖右掖左掖改萬春右掖改千秋門有樓閣毬場在其南東為永平館皇城西門曰顯西設而不開北曰子北西城巔有涼殿東北隅有燕角樓坊市廨舍寺觀蓋不勝書其外有居庸松亭榆林之關古北之口桑乾河高梁河石子河大安山燕山中有瑤嶼府曰幽都軍號盧龍開泰元年落軍額統州六縣十一析津縣本晉薊縣改薊北縣開泰元年更今名以燕分野旅寅為析木之津故名戶二萬宛平縣本晉幽都縣開泰元年改今名戶二萬二千昌平縣本漢軍都縣後漢屬廣陽郡晉屬燕國元魏置東燕州平昌郡及昌平縣郡廢縣隸幽州在京北九十里戶七千良鄉縣燕為中都縣漢改良鄉縣舊屬涿郡北齊天保七年省入薊縣武平六年復置唐聖曆元年改固節鎮神龍元年復為良鄉縣劉守光徙治此在京南六十里戶七千潞縣本漢舊縣屬漁陽郡唐武德二年置元州貞觀元年州廢復為縣有潞水在京東六十里戶六千安次縣本漢舊縣屬漁陽郡唐武德四年徙置東南五十里石梁城貞觀八年又徙今縣西五里常道城開元二十三年又徙耿就橋行市南在京南一百二十里戶一萬二千永清縣本漢益昌縣隋置通澤縣唐置武隆縣改會昌天寶初為永清縣在京南一百五十里戶五千武清縣前漢雍奴縣屬漁陽郡水經注雍奴者藪澤之名四面有水曰雍不流曰奴唐天寶初改武清在京東南一百五十里戶一萬香河縣本武清孫村遼於新倉置榷鹽院居民聚集因分武清三河潞三縣戶置在京東南一百二十里戶七千玉河縣本泉山地劉仁恭於大安山創宮觀師煉丹羽化之術于方士王若訥因割薊縣分置以供給之在京西四十里戶一千漷陰縣本漢泉山之霍村鎮遼每季春弋獵於延芳淀居民成邑就城故漷陰鎮後改為縣在京東南九十里延芳淀方數百里春時鵝鶩所聚夏秋多菱芡國主春獵衛士皆衣墨緑各持連鎚鷹食刺鵝錐列水次相去五七步上風擊鼓驚鵝稍離水面國主親放海東青鶻擒之鵝墜恐鶻力不勝在列者以佩錐刺鵝急取其腦飼鶻得頭鵝者例賞銀絹國主皇族羣臣各有分地戶五千宋王曾上契丹事曰自雄州白溝驛渡河四十里至新城縣古督亢亭之地又七十里至涿州北渡范水劉李河六十里至良鄉縣渡盧溝河六十里至幽州號燕京子城就羅郭西南為之正南曰啓夏門內有元和殿東門曰宣和城中坊閈皆有樓有閔忠寺本唐太宗為征遼陳亡將士所造又有開泰寺魏王耶律漢寧造皆遣朝使遊觀南門外有于越王廨為宴集之所門外永平館舊名碣石館請和後易之南即桑乾河順州歸化軍中刺史秦上谷漢范陽北齊歸德郡境隋開皇中粟末靺鞨與高麗戰不勝厥稽部長突地稽率八部勝兵數千人自扶餘城西北舉落內附置順州以處之唐武德初改燕州會昌中改歸順州唐末仍為順州有溫渝河白遂河曹王山曹操嘗駐軍于此黍谷山鄒衍吹律之地南有齊長城城東北有華林天柱二莊遼建涼殿春賞花夏納涼初軍曰歸寧後更名統縣一懷柔縣唐貞觀六年置治五柳城改順義縣開元四年置松漠府彈汗州天寶元年改歸化郡乾元元年復今名戶五千檀州武威軍下刺史本燕漁陽郡地漢為白檀縣魏書曹公歷白檀破烏丸於柳城續漢書白檀在右北平元魏創密雲郡兼置安州後周改為元州隋開皇十八年割燕樂密雲二縣置檀州唐天寶元年改密雲郡乾元元年復為檀州遼加今軍號有桑溪鮑丘山桃花山螺山統縣二密雲縣本漢白檀縣後漢以居厗奚元魏置密雲郡領白檀要陽密雲三縣高齊廢郡及二縣來屬戶五千行唐縣本定州行唐縣太祖掠定州破行唐盡驅其民北至檀州擇曠土居之凡置十寨仍名行唐縣隸彰愍宮戶三千涿州永泰軍上刺史漢高祖六年分燕置涿郡魏文帝改范陽郡晉為范陽國元魏復為郡隋開皇二年罷郡屬幽州大業三年以幽州為涿郡唐武德元年郡廢為涿縣七年改范陽縣大曆四年置涿州石晉以歸太宗有大房山六聘山涿水樓桑河橫溝河禮遜河祁溝河統縣四范陽縣本漢涿縣唐武德中改范陽縣有涿水范水戶一萬固安縣本漢方城縣先屬廣陽國隋開皇九年自易州淶水縣移置屬幽州取漢故安縣名唐武德四年屬北義州徙治章信堡貞觀二年義州廢移今治復屬幽州在州東南九十里戶一萬新城縣本漢新昌縣唐大曆四年析固安縣置後省後唐天成四年復析范陽縣置在州南六十里戶一萬歸義縣本漢易縣地齊併入鄚縣唐武德五年置北義州州廢復置縣來屬民居在巨馬河南僑治新城戶四千易州高陽軍上刺史漢為易故安二縣地隋置易州隋末為上谷郡唐武德四年復易州天寶元年仍上谷郡乾元元年又改易州五代隸定州節度使會同九年孫方簡以其地來附應曆九年為周世宗所取後屬宋統和七年攻克之升高陽軍有易水淶水狼山太寧山白馬山統縣三易縣本漢縣故城在今縣東南六十里齊天保七年省隋開皇十六年於故安城西北隅置縣即今縣治也戶二萬五千淶水縣本漢道縣今縣北一里故道城是也元魏移於故城南即今縣置周大象二年省隋開皇十八年改淶水縣在州東四十里有淶水戶二萬七千容城縣本漢縣先屬涿郡故城在雄州西南唐武德五年屬北義州貞觀元年還本屬聖曆二年改全忠縣天寶元年復名容城縣在州東八十里戶民皆居巨馬河南僑治涿州新城縣戶五千薊州尚武軍上刺史秦漁陽右北平二郡地隋開皇中徙治玄州總管府煬帝改漁陽郡唐武德元年廢入幽州開元十八年分立薊州統縣三漁陽縣本漢縣屬漁陽郡晉省復置元魏省唐屬幽州開元十八年置薊州有鮑丘水戶四千三河縣本漢臨朐縣地唐開元四年析潞州置戶三千玉田縣本春秋無終子國漢置無終縣屬右北平郡元魏屬漁陽郡治省唐武德二年復置貞觀初省乾封中復置萬歲通天元年更名玉田屬營州開元四年還屬幽州八年屬營州十一年又屬幽州十八年來屬搜神記雍伯洛陽人性孝父母沒葬無終山山高八十里上無水雍伯置飲人有就飲者與石一斗種生玉因名玉田戶三千景州清安軍下刺史本薊州遵化縣重熙中置戶三千遵化縣本唐平州買馬監為縣來屬平州遼興軍上節度商為孤竹國春秋山戎國秦為遼西右北平二郡地漢因之漢末公孫度據有傳子康孫淵入魏隋開皇中改平州大業初復為郡唐武德初改州天寶元年仍北平郡後唐復為平州太祖天贊二年取之以定州俘戶錯置其地統州二縣三盧龍縣本肥如國春秋晉滅肥肥子奔燕受封於此漢晉屬遼西郡元魏為郡治兼立平州北齊屬北平郡隋開皇中省肥如入新昌十八年改新昌曰盧龍唐為平州後因之戶七千安喜縣本漢令支縣地久廢太祖以定州安喜縣俘戶置在州東北六十里戶五千望都縣本漢海陽縣久廢太祖以定州望都縣俘戶置有海陽山縣在州南三十里戶三千灤州永安軍中刺史本古黃洛城灤河環繞在盧龍山南齊桓公伐山戎見山神俞鬼即此秦為右北平漢為石城縣後名海陽縣漢末為公孫度所有晉以後屬遼西石晉割地在平州之境太祖以俘戶置灤州負山帶河為朔漢形勝之地有扶蘇泉甚甘美秦太子扶蘇北築長城嘗駐此臨榆山峰巒崛起高千餘仞下臨渝河統縣三義豐縣本黃洛故城黃洛水北出盧龍山南流入於濡水漢屬遼西郡久廢唐季入契丹世宗置縣戶四千馬城縣本盧龍縣地唐開元二十八年析置縣以通水運東北有千金冶東有茂鄉鎮遼割隸灤州在州西南四十里戶三千石城縣漢置屬右北平郡久廢唐貞觀中於此置臨渝縣萬歲通天元年改石城縣在灤州南三十里唐儀鳳石刻在焉今縣又在其南五十里遼徙置以就鹽官戶三千營州鄰海軍下刺史本商孤竹國秦屬遼西郡漢為昌黎郡前燕慕容皓徙都于此元魏立營州領昌黎建德遼東樂浪冀陽營丘六郡後周為高寶寧所據隋開皇置州大業改遼西郡唐武德元年改營州萬歲通天元年始入契丹聖曆二年僑治漁陽開元五年還治柳城天寶元年改曰柳城郡後唐復為營州太祖以居定州俘戶統縣一廣寧縣漢柳城縣屬遼西郡東北與奚契丹接境萬歲通天元年入契丹李萬榮神龍元年移幽州界開元四年復舊地遼改今名戶三千
