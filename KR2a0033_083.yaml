body:
  text: 遼史卷八十三列傳第十三耶律休哥馬哥耶律斜軫耶律奚低耶律學古烏不呂耶律休哥字遜寧祖釋魯隋國王父綰思南院夷離菫休哥少有公輔器初烏古室韋二部叛休哥從北府宰相蕭幹討之應曆末為惕隱乾亨元年宋侵燕北院大王奚底統軍使蕭討古等敗績南京被圍帝命休哥代奚底將五院軍往救遇大敵于高梁河與耶律斜軫分左右翼擊敗之追殺三十餘里斬首萬餘級休哥被三創明旦宋主遁去休哥以創不能騎輕車追至涿州不及而還是年冬上命韓匡嗣耶律沙伐宋以報圍城之役休哥率本部兵從匡嗣等戰于滿城翌日將復戰宋人請降匡嗣信之休哥曰彼衆整而銳必不肯屈乃誘我耳宜嚴兵以待匡嗣不聽休哥引兵憑高而視須臾南兵大至鼓譟疾馳匡嗣倉卒不知所為士卒棄旗鼓而走遂敗績休哥整兵進擊敵乃却詔總南面戍兵為北院大王明年車駕親征圍瓦橋關宋兵來救守將張師突圍出帝親督戰休哥斬師餘衆退走入城宋陣于水南將戰帝以休哥馬介獨黃慮為敵所識乃賜玄甲白馬易之休哥率精騎渡水擊敗之追至莫州橫屍滿道矢俱罄生獲數將以獻帝悅賜御馬金盂勞之曰爾勇過于名若人人如卿何憂不克師還拜于越聖宗即位太后稱制令休哥總南面軍務以便宜從事休哥均戍兵立更休法勸農桑修武備邊境大治統和四年宋復來侵其將范密楊繼業出雲州曹彬米信出雄易取歧溝涿州陷固安置屯時北南院奚部兵未至休哥力寡不敢出戰夜以輕騎出兩軍間殺其單弱以脅餘衆晝則以精銳張其勢使彼勞於防禦以疲其力又設伏林莽絕其糧道曹彬等以糧運不繼退保白溝月餘復至休哥以輕兵薄之伺彼蓐食擊其離伍單出者且戰且却由是南軍自救不暇結方陣塹地兩邊而行軍渴乏井漉淖而飲凡四日始達于涿聞太后軍至彬等冒雨而遁太后益以銳卒追及之彼力窮環糧車自衛休哥圍之至夜彬信以數騎亡去餘衆悉潰追至易州東聞宋師尚有數萬瀕沙河而爨促兵往擊之宋師望塵奔竄墮岸相蹂死者過半沙河為之不流太后旋斾休哥收宋屍為京觀封宋國王又上言可乘宋弱略地至河為界書奏不納及太后南征休哥為先鋒敗宋兵於望都時宋將劉廷讓以數萬騎並海而出約與李敬源合兵聲言取燕休哥聞之先以兵扼其要地會太后軍至接戰殺敬源廷讓走瀛州七年宋遣劉廷讓等乘暑潦來攻易州諸將憚之獨休哥率銳卒逆擊于沙河之北殺傷數萬獲輜重不可計獻于朝太后嘉其功詔免拜不名自是宋不敢北向時宋人欲止兒啼乃曰于越至矣休哥以燕民疲弊省賦役恤孤寡戒戍兵無犯宋境雖馬牛逸于北者悉還之遠近向化邊鄙以安十六年薨是夕雨木冰聖宗詔立祠南京休哥智略宏遠料敵如神每戰勝讓功諸將故士卒樂為之用身更百戰未嘗殺一無辜二子高八官至節度使高十終于越孫馬哥馬哥字訛特懶興宗時以散職入見上問卿奉佛乎對曰臣每旦誦太祖太宗及先臣遺訓未暇奉佛帝悅清寧中遷唐古部節度使咸雍中累遷匡義軍節度使大康初致仕卒耶律斜軫字韓隱于越曷魯之孫性明敏不事生產保寧元年樞密使蕭思溫薦斜軫有經國才上曰朕知之第佚蕩豈可覊屈對曰外雖佚蕩中未可量乃召問以時政占對剴切帝器重之妻以皇后之姪命節制西南面諸軍仍援河東改南院大王乾亨初宋再攻河東從耶律沙至白馬嶺遇敵沙等戰不利斜軫赴之令麾下萬矢齊發敵氣褫而退是年秋宋下河東乘勝襲燕北院大王耶律奚底與蕭討古逆戰敗績退屯清河北斜軫取奚底等青幟軍于得勝口以誘敵敵果爭赴斜軫出其後奮擊敗之及高梁之戰與耶律休哥分左右翼夾擊大敗宋軍統和初皇太后稱制益見委任為北院樞密使會宋將曹彬米信出雄易楊繼業出代州太后親帥師救燕以斜軫為山西路兵馬都統繼業陷山西諸郡各以兵守自屯代州斜軫至定安遇賀令圖軍擊破之追至五臺斬首數萬級明日至蔚州敵不敢出斜軫書帛射城上諭以招慰意陰聞宋軍來救令都監耶律題子夜伏兵險阨俟敵至而發城守者見救至突出斜軫擊其背二軍俱潰追至飛狐斬首二萬餘級遂取蔚州賀令圖潘美復以兵來斜軫逆于飛狐擊敗之宋軍在渾源應州者皆棄城走斜軫聞繼業出兵令蕭撻伏兵于路明旦繼業兵至斜軫擁衆為戰勢繼業麾幟而前斜軫佯退伏兵發斜軫進攻繼業敗走至狼牙村衆軍皆潰繼業為流矢所中被擒斜軫責曰汝與我國角勝三十餘年今日何面目相見繼業但稱死罪而已初繼業在宋以驍勇聞人號楊無敵首建梗邊之策至狼牙村心惡之欲避不可得既擒三日死斜軫歸闕以功加守太保從太后南伐卒于軍太后親為哀臨仍給葬具庶子狗兒官至小將軍耶律奚低孟父楚國王之後便弓馬勇於攻戰景宗時多任以軍事統和四年為右皮室詳穩時宋將楊繼業陷山西郡縣奚低從樞密使斜軫討之凡戰必以身先矢無虛發繼業敗于朔州之南匿深林中奚低望袍影而射繼業墮馬先是軍令須生擒繼業奚低以故不能為功後太后南伐屢有戰績以病卒耶律學古字乙辛隱于越洼之庶孫穎悟好學工譯鞮及詩保寧中補御盞郎君乾亨元年宋既下河東乘勝侵燕學古受詔往援始至京宋敗耶律奚底蕭討古等勢益張圍城三周穴地而進城中民懷二心學古以計安反側隨宜備禦晝夜不少懈適有敵三百餘人夜登城學古戰却之會援軍至圍遂解學古開門列陣四面鳴鼓居民大呼聲震天地旋有高梁之捷以功遙授保靜軍節度使為南京馬步軍都指揮使二年伐宋乞將漢軍從之改彰國軍節度使時南境未靜民思休息學古禁寇掠以安之會宋將潘美率兵分道來侵學古以軍少虛張旗幟雜丁黃為疑兵是夜適獨虎峪舉烽火遣人偵視見敵俘掠村野擊之悉獲所掠物擒其將領自是學古與潘美各守邊約無相侵軼民獲安業以功為惕隱卒弟烏不呂烏不呂字留隱嚴重有膂力善屬文統和中伐宋屢任以軍事嘗與爻直不相能因曰爾奴才何所知爻直訟于北院樞密使韓德讓德讓怒問曰爾安得此奴耶烏不呂對曰三父異籍時亦易得德讓笑而釋之後從蕭德伐蒲盧毛𩽆部以功為東路統軍都監及德讓為大丞相薦其材可任統軍使太后曰烏不呂嘗不遜于卿何善而薦德讓奏曰臣忝相位於臣猶不屈況於其餘以此知可用若任使之必能鎮撫諸蕃太后從之加金紫崇祿大夫檢校太尉而弟國留以罪亡烏不呂及其母俱下吏恐禍及母陰使人召國留紿曰太后知事之誣汝第來勿畏國留至送有司坐誅其後退歸田里以疾卒論曰宋乘下太原之銳以師圍燕繼遣曹彬楊繼業等分道來伐是兩役也遼亦岌岌乎殆哉休哥奮擊于高梁敵兵奔潰斜軫擒繼業于朔州旋復故地宋自是不復深入社稷固而邊境寧雖配古名將無愧矣然非學古之在南京安其反側則二將之功蓋亦難致故曰國以人重信哉
