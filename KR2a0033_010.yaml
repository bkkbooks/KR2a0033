body:
  text: 遼史卷十本紀第十聖宗一聖宗文武大孝宣皇帝諱隆緒小字文殊奴景宗皇帝長子母曰睿智皇后蕭氏帝幼喜書翰十歲能詩既長精射法曉音律好繪畫乾亨二年封梁王四年秋九月壬子景宗崩癸丑即皇帝位於柩前時年十二皇后奉遺詔攝政詔諭諸道冬十月己未朔帝始臨朝辛酉羣臣上尊號曰昭聖皇帝尊皇后為皇太后大赦以南院大王勃古哲總領山西諸州事北院大王于越休哥為南面行軍都統奚王和朔奴副之同政事門下平章事蕭道寧領本部軍駐南京乙丑如顯州十一月甲午置乾州十二月戊午朔耶律速撒討阻卜辛酉南京留守荊王道隱奏宋遣使獻犀帶請和詔以無書却之甲子撻剌干乃万十醉言宮掖事法當死杖而釋之辛未西南面招討使秦王韓匡嗣薨癸酉奉大行皇帝梓宮于菆塗殿庚辰省置中臺省官統和元年春正月戊午朔以大行在殯不受朝乙丑奉遺詔召先帝庶兄質睦于菆塗殿前復封寧王加宰相室昉宣徽使普領等恩丙寅荊王道隱有疾詔遣使存問是日皇太后幸其邸視疾戊辰以烏隈烏骨里部節度使耶律章瓦同政事門下平章事甲戌荊王道隱薨輟朝三日追封晉王遣使撫慰其家丙子以于越休哥為南京留守仍賜南面行營總管印綬總邊事渤海撻馬解里以受先帝厚恩乞殉葬詔不許賜物以旌之戊寅遣使賜于越休哥及奚王籌寧統軍使頗德等湯藥命懇篤持送休哥下車榜以諭燕民辛巳速撒獻阻卜俘壬午涿州刺史安吉奏宋築城河北詔留守于越休哥撓之勿令就功趙妃及公主胡骨典奚王籌寧宰相安寧北大王普奴寧惕隱屈烈吳王稍寧王只沒與潢帳國舅契丹漢官等並進助山陵費癸未齊國公主率內外命婦進物如之甲申西南面招討使韓德威奏党項十五部侵邊以兵擊破之乙酉以速撒破阻卜下詔褒美仍諭與大漢討党項諸部丁亥樞密使兼政事令室昉以年老請解兼職詔不允二月戊子朔禁所在官吏軍民不得無故聚衆私語及冒禁夜行違者坐之己丑南京奏聞宋多聚糧邊境及宋主將如臺山詔休哥嚴為之備甲午葬景宗皇帝於乾陵以近幸朗掌飲伶人撻魯為殉上與皇太后因為書附上大行丙申皇太后詣陵置奠命繪近臣於御容殿賜山陵工人物有差庚子以先帝遺物賜皇族及近臣辛丑南京統軍使耶律善補奏宋邊七十餘村來附詔撫存之乙巳以御容殿為玉殿酒谷為聖谷速撒奏討党項捷遣使慰勞戊申以惕隱化哥為北院大王解領為南府宰相辛亥幸聖山遂謁三陵甲寅以皇女長壽公主下嫁國舅宰相蕭婆項之子吳留三月戊午天德軍節度使頽剌父子戰歿以其弟涅離襲爵己未次獨山遣使賞西南面有功將士辛酉以大父帳太尉耶律曷魯寧為惕隱甲子駐蹕遼河之平淀辛巳以國舅同平章事蕭道寧為遼興軍節度使仍賜號忠亮佐理功臣壬午以青牛白馬祭天地夏四月丙戌朔幸東京以樞密副使耶律末只兼侍中為東京留守庚寅謁太祖廟癸巳詔賜物命婦寡居者丙申南幸辛丑謁三陵以東京所進物分賜陵寢官吏復詔賜西南路招討使大漢劍不用命者得專殺壬寅致享于凝神殿癸卯謁乾陵乙巳遣人以酒脯祭平章耶律河陽墓庚戌幸夫人烏骨里第謁太祖御容禮畢幸公主胡古典第飲賜與甚厚壬子大臣以太后預政宜有尊號請下有司詳定冊禮詔樞密院諭沿邊節將至行禮日止遣子弟奉表稱賀恐失邊備樞密請詔北府司徒頗德譯南京所進律文從之遂如徽州以耶律慶朗為信州節度使五月丙辰朔國舅政事門下平章事蕭道寧以皇太后慶壽請歸父母家行禮而齊國公主及命婦羣臣各進物設宴賜國舅帳耆年物有差壬戌西南路招討請益兵討西突厥諸部詔北王府耶律蒲奴寧以敵畢迭烈二部兵赴之癸亥以于越休哥在南院過用吏人詔南大王毋相循襲庚午耶律善補招亡入宋者得千餘戶歸國詔令撫慰辛未次永州祭王子藥師奴墓乙亥詔近臣議皇太后上尊號冊禮樞密使韓德度以後漢太后臨朝故事草定上之丙子以青牛白馬祭天地戊寅幸木葉山西南路招討使大漢奏近遣拽剌跋剌哥諭党項諸部來者甚衆下詔褒美六月乙酉朔詔有司冊皇太后日給三品以上法服三品以下用大射柳之服西南路招討使奏党項酋長執夷離堇子隈引等乞內附詔撫納之仍察其誠僞謹邊備丙戌還上京己丑有司奏同政事門下平章事駙馬都尉盧俊與公主不協詔離之遂出俊為興國軍節度使辛卯有事于太廟甲午上率羣臣上皇太后尊號曰承天皇太后羣臣上皇帝尊號曰天輔皇帝大赦改元統和丁未覃恩中外文武官各進爵一級以樞密副使耶律斜軫守司徒秋七月甲寅朔皇太后聽政乙卯上親録囚王子司徒婁國坐稱疾不赴山陵笞二十辛酉行再生禮癸酉臨潢尹裊兗進飲饌上與諸王分朋擊鞠丙子韓德威遣詳穩轄馬上破党項俘獲數並送夷離堇之子來獻辛巳賞西南面有功將士八月戊子上西巡己丑謁祖陵辛卯皇太后祭楚國王蕭思溫墓癸巳上與皇太后謁懷陵遂幸懷州甲午上與斜軫於太后前易弓矢鞍馬約以為友己亥獵赤山遣使薦熊肪鹿脯于乾陵之凝神殿以政事令孫楨無子詔國舅小翁帳郎君桃隈為之後乙巳詔于越休哥提點元城壬子韓德威表請伐党項之復叛者詔許之仍發別部兵數千以助之九月癸丑朔以東京平州旱蝗詔振之乙卯謁永興長寧敦睦三宮丙辰南京留守奏秋霖害稼請權停關征以通山西糴易從之庚申謁宣簡皇帝廟辛酉幸祖州謁祖陵壬戌還上京辛未有司請以帝生日為千齡節從之皇太后言故于越屋只有傅導功宜録其子孫遂命其子泮泱為林牙丙子如老翁川冬十月癸未朔司天奏老人星見戊子以公主淑哥下嫁國舅詳穩照姑癸巳速撒奏敵烈部及叛蕃來降悉復故地乙未以燕京留守于越休哥言每歲諸節度使貢獻如契丹官例止進鞍馬從之丁酉以吳王稍為上京留守行臨潢尹事上將征高麗親閲東京留守耶律末只所總兵馬丙午命宣徽使兼侍中蒲領林牙肯德等將兵東討賜旗鼓及銀符十一月壬子朔觀漁撻馬濼癸丑應州奏獲宋諜者言宋除道五臺山將入靈丘界詔諜者及居停人並磔于市庚辰上與皇太后祭乾陵下詔諭三京左右相左右平章事副留守判官諸道節度使判官諸軍事判官録事參軍等當執公方毋得阿順諸縣令佐如遇州官及朝使非理徵求毋或畏徇恆加采聽以為殿最民間有父母在別籍異居者聽鄰里覺察坐之有孝于父母三世同居者旌其門閭十二月壬午朔謁凝神殿遣使分祭諸陵賜守殿官屬酒是日幸顯州丁亥以顯州歲貢綾錦分賜左右甲午東幸己亥皇太后觀漁于玉盆灣辛丑觀漁于濬淵甲辰敕諸刑辟已結正決遣而有冤者聽詣臺訴是夕然萬魚燈于雙溪戊申千齡節祭日月禮畢百僚稱賀二年春正月甲子如長濼二月癸巳國舅帳彰德軍節度使蕭闥覽來朝甲午賜將軍耶律敵不春衣束帶丙申東路行軍宣徽使耶律蒲寧奏討女直捷遣使執手奬諭庚子朝皇太后太后因從觀獵于饒樂川乙巳五國烏隈于厥節度使耶律隗窪以所轄諸部難治乞賜詔給劍便宜行事從之丙午上與諸王大臣較射丁未韓德威以征党項回遂襲河東獻所俘賜詔褒美三月乙卯劃離部請今後詳穩止從本部選授為宜上曰諸部官惟在得人豈得定以所部為限不允贈故同平章事趙延煦兼侍中夏四月丁亥宣徽使同平章事耶律普寧都監蕭勤德獻征女直捷授普寧兼政事令勤德神武衛大將軍各賜金器諸物庚寅皇太后臨決滯獄辛卯祭風伯壬辰以宣徽南院使劉承規為承德軍節度使崇德宮都部署保義軍節度使張德筠為宣徽北院使五月乙卯祠木葉山丁丑駐蹕沿柳湖六月己卯朔皇太后決獄至月終秋七月癸丑皇太后行再生禮八月辛卯東京留守兼侍中耶律末只奏女直朮不直賽里等八族乞舉衆內附詔納之九月戊申朔駐蹕土河辛未以景宗忌日詔諸道京鎮遣官行香飯僧冬十月丁丑朔以歸化州刺史耶律普寧為彰德軍節度使右武衛大將軍韓倬為彰國軍節度使兼侍衛親軍兵馬都指揮使十一月壬子以樞密直學士給事中鄭嘏為儒州刺史是月速撒等討阻卜殺其酋長撻剌干十二月辛丑以翰林學士承旨馬得臣為宣政殿學士耶律頗德南京統軍使耶律瑤升大內惕隱大仁靖東京中臺省右平章事三年春正月丙午朔如長濼丁巳以翰林學士邢抱朴為尚書禮部侍郎知制誥左拾遺知制誥劉景吏部郎中知制誥牛藏用並政事舍人二月丙子朔以牛藏用知樞密直學士三月乙巳朔樞密奏契丹諸役戶多困乏請以富戶代之上因閲諸部籍涅剌烏隈二部戶少而役重並量免之夏四月乙亥朔祠木葉山壬午以鳳州刺史趙匡符為保靜軍節度使癸未以左監門衛大將軍王庭勗為奉先軍節度使彰武軍節度使韓德凝為崇義軍節度使五月壬子還上京癸酉以國舅蕭道寧同平章事知瀋州軍州事六月甲戌朔如柏坡皇太后親決滯獄乙亥以歸義軍節度使王希嚴為興國軍節度使秋七月甲辰朔詔諸道繕甲兵以備東征高麗甲寅東幸甲子遣郎君班裊賜秦王韓匡嗣葬物丙寅駐蹕土河以暴漲命造船橋明日乘步輦出聽政老人星見丁卯遣使閲東京諸軍兵器及東征道路以平章事蕭道寧為昭德軍節度使武定軍節度使守司空兼政事令郭襲為天平軍節度使大同軍節度使守太子太師兼政事令劉延構為義成軍節度使贈尚父秦王韓匡嗣尚書令八月癸酉朔以遼澤沮洳罷征高麗命樞密使耶律斜軫為都統駙馬都尉蕭懇德為監軍以兵討女直丁丑次城庚辰至顯州謁凝神殿辛巳幸乾州觀新宮癸未謁乾陵甲申命南北面臣僚分巡山陵林木及令乾顯二州上所部里社之數丙戌北皮室詳穩進勇敢士七人戊子故南院大王諧領已里婉妻蕭氏奏夫死不能葬詔有司助之庚寅東征都統所奏路尚陷濘未可進討詔俟澤涸深入癸巳皇太后謁顯陵庚子謁乾陵辛丑西幸閏九月癸酉命邢抱朴勾檢顯陵丙子行次海上庚辰重九駱駝山登高賜羣臣菊花酒辛巳詔諭東征將帥乘水涸進討丙申女直宰相朮不里來貢戊戌駐蹕東古山己亥速撒奏朮不姑諸部至近淀夷離堇易魯姑請行俘掠上曰諸部於國無惡何故俘掠徒生事耳不允冬十一月甲戌詔吳王稍領秦王韓匡嗣葬祭事丁丑詔以東北路兵馬監軍妻婆底里存撫邊民戊寅賜公主胡骨典葬夫金帛工匠辛卯以韓德讓兼政事令癸巳禁行在市易布帛不中尺度者丙申東征女直都統蕭闥覽菩薩奴以行軍所經地里物産來上
