body:
  text: 遼史卷十六本紀第十六聖宗七七年春正月甲辰如達離山二月乙丑朔拜日如渾河三月辛丑命東北越里篤剖阿里奧里米蒲奴里鐵驪等五部歲貢貂皮六萬五千馬三百丙午烏古部節度使蕭普達討叛命敵烈滅之夏四月拜日丙寅振川饒二州饑辛未振中京貧乏癸酉禁匿名書壬辰以三司使呂德懋為樞密副使閏月壬子以蕭進忠為彰武軍節度使兼五州制置戊午吐蕃王幷里尊奏凡朝貢乞假道夏國從之五月丙寅皇子宗真封梁王宗元永清軍節度使宗簡右衞大將軍宗愿左驍衞大將軍宗偉右衞大將軍皇姪宗範昭義軍節度使宗熙鎮國軍節度使宗亮絳州節度使宗弼濮州觀察使宗奕曹州防禦使宗顯宗肅皆防禦使以張儉守司徒兼政事令六月丙申品打魯瑰部節度使勃魯里至鼻洒河遇微雨忽天地晦冥大風飄四十三人飛旋空中良久乃墮數里外勃魯里幸獲免一酒壺在地乃不移八月丙午行大射柳之禮庚申以耶律留寧吳守達使宋賀生辰蕭高九馬貽謀使宋賀正旦加平章蕭弘義開府儀同三司尚父兼政事令秋七月甲子詔翰林待詔陳升寫南征得勝圖於上京五鸞殿丁卯蒲奴里部來貢九月庚申朔蒲昵國使奏本國與烏里國封壤相接數侵掠不寧賜詔諭之戊辰詔內外官因事受賕事覺而稱子孫僕從者禁之庚午錄囚括馬給東征軍是月駐蹕土河川冬十月名中京新建二殿曰延慶曰永安壬寅以順義軍節度使石用中為漢人行宮都部署丙辰詔以東平郡王蕭排押為都統殿前都點檢蕭虛列為副統東京留守耶律八哥為都監伐高麗仍諭高麗守吏能率衆自歸者厚賞堅壁相拒者追悔無及十一月壬戌以呂德懋知吏部尚書楊又玄知詳覆院劉晟為霸州節度使北府宰相劉慎行為彰武軍節度使庚辰禁服用明金縷金貼金戊子幸中京十二月丁酉宋遣呂夷簡曹璋來賀千齡節是月蕭排押等與高麗戰于茶陀二河遼軍失利天雲右皮室二軍沒溺者衆遙輦帳詳穩阿果達客省使酌古渤海詳穩高清明天雲軍詳穩海里等皆死之放進士張克恭等三十七人及第八年春正月宋遣陳堯佐張羣來賀壬戌鐵驪來貢建景宗廟于中京封沙州節度使曹順為燉煌郡王二月丁未以前南院樞密使韓制心為中京留守漢人行宮都部署王繼忠南院樞密使丙辰祭風伯三月己未以契丹弘義宮使赫石為興聖宮都部署前遙恩拈部節度使控骨里積慶宮都部署左祗候郎君耶律罕四捷軍都監乙亥東平王蕭韓寧東京留守耶律八哥國舅平章事蕭排押林牙要只等討高麗還坐失律數其罪而釋之己卯詔加征高麗有功渤海將校官壬午閱飛龍院馬癸未回跋部太師踏剌葛來貢丙戌置東京渤海承奉官都知押班夏四月戊子朔如緬山五月壬申以駙馬蕭克忠為長寧軍節度使乙亥遷寧州渤海戶于遼土二河之間己卯曷蘇館惕隱阿不葛宰相賽剌來貢六月戊子錄征高麗戰歿將校子弟己丑以左夷離畢蕭解里為西南面招討使御史大夫蕭要只為夷離畢己亥惕隱耶律合葛為南府宰相南面林牙耶律韓留為惕隱癸卯弛大擺山猿嶺採木之禁乙巳以南皮室軍校等討高麗有功賜金帛有差秋七月己未征高麗戰歿諸將詔益封其妻庚申以東北路詳穩耶律獨迭為北院大王辛酉肴里涅哥二奚軍征高麗有功皆賜金帛癸亥詔阻卜依舊歲貢馬千七百駝四百四十貂鼠皮萬青鼠皮二萬五千戊辰觀稼己巳回跋部太保麻門來貢庚午觀市曲赦市中繫囚命解寧馬翼充賀宋生辰使副八月庚寅遣郎君曷不呂等率諸部兵會大軍討高麗九月己巳以石用中參知政事宋遣崔遵度王應昌來賀千齡節壬申錄囚甲戌復錄囚庚辰曷蘇館惕隱阿不割來貢壬午駐蹕土河川冬十月乙酉詔諸道事無巨細已斷者每三月一次條奏戊子遣耶律繼崇鄭玄瑕賀宋正旦癸巳詔橫帳三房不得與卑小帳族為婚凡嫁娶必奏而後行癸卯以前北院大王建福為阿扎割只甲辰改東路耗里太保城為咸州建節以領之十一月甲寅置雲州宣德縣十二月辛卯駐蹕中京乙巳以廣平郡王宗業為中京留守大定尹韓制心為惕隱辛亥高麗王詢遣使乞貢方物詔納之九年春正月宋遣劉平張元普來賀二月如鴛鴦濼五月庚午耶律資忠使高麗還王詢表請稱藩納貢歸所留王人只剌里只剌里在高麗六年忠節不屈以為林牙辛未遣使釋王詢罪並允其請癸酉以耶律宗教檢校太傅宗誨啟聖軍節度使劉晟太子太傅仍賜保節功臣秋七月庚戌朔日有食之詔以近臣代拜救日甲寅遣使賜沙州回鶻燉煌郡王曹順衣物以查剌耿元吉韓九宋璋為來年賀宋生辰正旦使副九月戊午以駙馬蕭紹宗平章事丁卯文武百僚奉表上尊號不許表三上乃從之乙亥沙州回鶻燉煌郡王曹順遣使來貢括諸道漢民馬賜東征軍以夷離畢延寧為兵馬副都部署總兵東征是月駐蹕金缾濼宋遣宋綬駱繼倫賀千齡節冬十月戊寅朔以涅里為奚王都監突迭里為北王府舍利軍詳穩郎君老使沙州還詔釋宿累國家舊使遠國多用犯徒罪而有才略者使還即除其罪戊子西南招討奏党項部有宋犀族輸貢不時常有他意宜以時遣使督之詔曰邊鄙小族歲有常貢邊臣驕縱徵斂無度彼懷懼不能自達耳第遣清慎官將示以恩信無或侵漁自然效順復奏諦居迭烈德部言節度使韓留有惠政今當代請留上命進其治狀辛丑如中京壬寅大食國遣使進象及方物為子冊割請婚十一月丁巳以漆水郡王韓制心為南京留守析津尹兵馬都總管己未以夷離畢蕭孝順為南面諸行宮都部署加左僕射十二月丁亥禁僧燃身煉指戊子詔中京建太祖廟制度祭器皆從古制乙巳詔來年冬行大冊禮放進士張仲舉等四十五人太平元年春正月丁丑朔宋使魯宗道成吉來賀如渾河二月乙卯幸鈸河壬戌獵高柳林三月戊戌皇子勃已只生庚子駙馬都尉蕭紹業建私城賜名睦州軍曰長慶是月大食國王復遣使請婚封王子班郎君胡思里女可老為公主嫁之夏四月戊申東京留守奏女直三十部酋長請各以其子詣闕祗候詔與其父俱來受約乙卯錄囚丁卯置來州是月清暑緬山秋七月甲戌朔賜從獵女直人秋衣乙亥遣骨里取石晉所上玉璽于中京阻卜來貢辛巳如沙嶺是月獵潢河九月幸中京冬十月丁未敵烈酋長頗白來貢馬駝戊申錄囚壬子宋使李懿王仲賓來賀千齡節及蘇惟甫周鼎賀來歲元正即遣蕭善程翥報聘党項長曷魯來貢己未以薩敏解里為都點檢高六副點檢耶律羅漢奴左皮室詳穩嗓姑右皮室詳穩聊了西北路金吾耶律僧隱御史大夫求哥駙馬都尉蕭舂骨里並大將軍庚申幸通天觀觀魚龍曼衍之戲翌日再幸還升玉輅自內三門入萬壽殿奠酒七廟御容因宴宗室十一月癸未上御昭慶殿文武百僚奉冊上尊號曰睿文英武遵道至德崇仁廣孝功成治定昭聖神贊天輔皇帝大赦改元太平中外官進級有差宋遣使來聘夏高麗遣使來貢甲申冊皇子梁王宗真為皇太子二年春正月如納水鈎魚二月辛丑朔駐蹕魚兒濼三月甲戌如長春州丁丑宋使薛貽廓來告宋主殂子禎嗣位遣都點檢耶律僧隱等充宋祭奠使副林牙蕭日新觀察馮延休充宋后弔慰使副戊寅遣金吾耶律諧領引進姚居信充宋主弔慰使副戊子為宋主飯三京僧是月地震雲應二州屋摧地陷嵬白山裂數百步泉湧成流夏四月如緬山清暑五月乙亥參知政事石用中薨庚辰鐵驪遣使獻兀惹十六戶六月己未宋遣使薛由等來饋其先帝遺物秋七月己卯以耶律信寧為奉陵軍節度使高麗國參知政事王同顯靜海軍節度使耶律遂忠長寧軍節度使耿延毅昭德軍節度使高守貞河西軍節度使九月癸巳遣尚書僧隱韓格賀宋主即位冬十月壬寅遣堂後官張克恭充賀夏國王李德昭生日使耶律掃古韓王充賀宋太后生日使副耶律仙寧史克忠充賀宋正旦使副是月駐蹕胡魯古思淀癸卯賜宰臣呂德懋參知政事吳叔達樞密副使楊又玄右丞相馬保忠錢物有差辛亥至上京曲赦畿內囚十一月丙戌宋遣使來謝十二月辛丑高麗王詢薨其子欽遣使來報即命使冊欽為高麗國王甲寅宋遣劉燁郭志言來賀千齡節是年放進士張漸等四十七人三年春正月丙寅朔如納水鈎魚以僧隱為平章事乙亥以蕭臺德為南王府都監林牙耶律信寧西北路招討都監辛巳賜越國公主私城之名曰懿州軍曰慶懿二月丙申以丁振為武信軍節度使改封蘭陵郡王戊申以東平郡王蕭排押為西南面都招討進封豳王夏四月以耶律守寧為都點檢五月清暑緬山六月戊申以南院宣徽使劉涇參知政事蕭孝惠為副點檢蕭孝恭東京統軍兼沿邊巡檢使戊午以蕭璉為左夷離畢蕭琳為詳穩秋七月戊寅以南府宰相耶律合葛為上京留守封漆水郡王丙戌以皇后生辰為順天節丁亥賜緬山名曰永安是月獵赤山閏九月壬辰朔以蕭伯達韓紹雍充賀宋正旦使副唐骨德程昭文賀宋生辰使副冬十月庚辰宋遣薛奎郭盛來賀順天節王臻慕容惟素賀千齡節東征軍奏統帥諧領常袞課奴率師自毛母國嶺入林牙高九裨將大匡逸等率師鼓山嶺入閏月未至撻離河不遇敵而還以是月會於弘怕只嶺駝馬死者甚衆駐蹕遼河十一月辛卯朔以皇姪宗範為歸德軍節度使北府宰相蕭孝穆南京留守封燕王南京留守韓制心南院大王兵馬都總管仇正燕京轉運使十二月壬戌以宗範為平章事封三韓郡王仇道衡中京副留守馮延休順州刺史郎玄化西山轉運使趙其樞密直學士丁卯以蕭永為太子太師己卯封皇子重元秦國王四年春正月庚寅朔宋遣張傳張士禹程琳丁保衡來賀如鴨子河二月己未朔獵撻魯河詔改鴨子河曰混同江撻魯河曰長春河三月戊子朔千齡節詔賜諸宮分耆老食夏四月癸酉以右丞相馬保忠之子世弘使嶺表至平地松林為盜所殺特贈昭信軍節度使五月清暑永安山六月己未南院大王韓制心薨戊辰以鄭弘節為兵部郎中劉慎行順義軍節度使辛未以燕王蕭孝穆子順為千牛衞將軍甲戌以中山郡王查哥為保靜軍節度使樂安郡王遂哥廣德軍節度使蕭解里彰德軍節度使庚辰以遼興軍節度使周王胡都古為臨海軍節度使漆水郡王敵烈南院大王秋七月如秋山八月丙辰朔以韓紹芳為樞密直學士駙馬蕭匹敵都點檢九月以駙馬蕭紹宗為武定軍節度使耶律宗福安國軍節度使冬十月駐蹕遼河宋遣蔡齊李用和來賀千齡節十一月追封南院大王韓制心為陳王十二月以蕭從政為歸義軍節度使康筠監門衞充賀宋正旦使副是年放進士李烱等四十七人
