body:
  text: 遼史卷百十五列傳第四十五二國外記高麗高麗自有國以來傳次久近人民土田歷代各有其志然高麗與遼相為終始二百餘年自太祖皇帝神冊間高麗遣使進寶劍天贊三年來貢太宗天顯二年來貢會同二年受晉上尊號冊遣使往報聖宗統和三年秋七月詔諸道各完戎器以備東征高麗八月以遼澤沮洳罷師十年以東京留守蕭德伐高麗十一年王治遣朴良柔奉表請罪詔取女直國鴨淥江東數百里地賜之十二年入貢三月王治遣使請所俘生口詔續還之仍遣使撫諭十二月王治進妓樂詔却之十三年治遣李周楨來貢又進鷹十月遣李知白奉貢十一月遣使冊治為王遣童子十人來學本國語十四年王治表乞為婚姻以東京留守駙馬蕭德女下嫁之六月遣使來問起居自是至者無時十五年韓彥敬來納聘幣弔駙馬蕭德妻越國公主薨十一月治薨其姪誦遣王同穎來告十二月遣使致祭詔其姪誦權知國事十六年遣使冊誦為王二十年誦遣使賀伐宋之捷七月來貢本國地里圖二十二年以南伐事詔諭之二十三年高麗聞與宋和遣使來賀二十六年進龍鬚草席及賀中京城二十七年承天皇太后崩遣使報以國哀二十八年誦遣魏守愚等來祭三月使來會葬五月高麗西京留守康肇弒其主誦擅立誦從兄詢八月聖宗自將伐高麗報宋遣引進使韓嵵宣問詢詢奉表乞罷師不許十一月大軍渡鴨淥江康肇拒戰于銅州敗之肇復出右皮室詳穩耶律敵魯擒肇等追奔數十里獲所棄糧餉鎧仗銅霍貴寧等州皆降詢上表請朝許之禁軍士俘掠以政事舍人馬保祐為開京留守安州團練使王八為副留守太子太師乙澟將騎兵一千送保祐等赴京守將卓思正殺我使者韓喜孫等十人領兵出拒保祐等復還乙澟領兵擊之思正遂奔西京圍之五日不克駐蹕于城西佛寺高麗禮部郎中渤海陀失來降遣排押盆奴攻開京遇敵于京西敗之詢棄城遁走遂焚開京至清江而還二十九年正月班師所降諸城復叛至貴州南嶺谷大雨連日霽乃得渡馬駝皆疲乏甲仗多遺棄次鴨淥江以所俘人分置諸陵廟餘賜內戚大臣開泰元年詢遣蔡忠順來乞稱臣如舊詔詢親朝八月遣田拱之奉表稱病不能朝詔復取六州之地二年耶律資忠使高麗取地未幾還三年資忠復使如前索地五月詔國舅詳穩蕭敵烈東京留守耶律團石等造浮梁于鴨淥江城保宣義定遠等州四年命北府宰相劉慎行為都統樞密使耶律世良為副殿前都點檢蕭虛烈為都監慎行挈家邊上致緩師期追還之以世良虛烈總兵伐高麗五年世良等與高麗戰于郭州西破之六年樞密使蕭合卓為都統漢人行宮都部署王繼忠為副殿前都點檢蕭虛烈為都監進討蕭合卓攻興化軍不克師還七年詔東平郡王蕭排押為都統蕭虛烈為副統東京留守耶律八哥為都監復伐高麗十二月蕭排押與戰于茶陀二河之間我軍不利天雲右皮室二軍沒溺者衆天雲軍詳穩海里遙輦帳詳穩阿果達客省使酌古渤海詳穩高清明等皆沒于陣八年詔數排押討高麗罪釋之加有功將校益封戰沒將校之妻錄其子弟以南皮室軍校有功賜衣物銀絹有差出金帛賜肴里涅哥二奚軍八月遣郎君曷不呂等率諸部兵會大軍同討高麗詢遣使來乞貢方物九年資忠還以詢降表進釋詢罪太平元年詢薨遣使來報嗣位即遣使冊王欽為王九年賜欽物十一年聖宗崩遣使告哀七月使來慰奠興宗重熙七年來貢十二年三月以加上尊號來賀十三年遣使來貢十四年三月又來貢十五年入貢八月王欽薨遣使來告十六年來貢明年又來貢十九年復貢六月遣使來賀伐夏之捷二十二年入貢二十三年四月王徽請官其子詔加檢校太尉興宗崩道宗即位清寧元年八月遣使報國哀以先帝遺留物賜之十一月使來會葬二年三年皆來貢四年春遣使報太皇太后哀五月使來會葬咸雍七年八年來貢十二月以佛經一藏賜徽九年十年來貢大康二年三月皇太后崩遣使報哀六月使來弔祭四年王徽乞賜鴨淥江以東地不許九年八月王徽薨以徽子三韓國公勳權知國事十二月勳薨大安元年冊勳子運為國王二年遣使來謝封冊三年來貢四年三月免歲貢五年六年連貢九年賜王運羊十年運薨子昱遣使來告即賻贈壽隆元年來貢十一月王昱病命其子顒權知國事二年來貢三年三月王昱薨五年王顒乞封冊六年封顒為三韓國公七年道宗崩天祚即位改為乾統元年報道宗哀使來慰奠十二月遣使來賀五年三韓國公顒薨子俁遣使來告八年封俁為三韓國公贈其父顒為國王十二月遣使來謝九年來貢天慶二年王俁母薨來告遣使致祭起復三年遣使來謝致祭又來謝起復十年乞兵于高麗以禦金而金人責之至是遼國亡矣西夏西夏本魏拓跋氏後其地則赫連國也遠祖思恭唐季受賜姓曰李涉五代至宋世有其地至李繼遷始大據夏銀綏宥靜五州緣境七鎮其東西二十五驛南北十餘驛子德明曉佛書通法律嘗觀太一金鑑訣野戰歌製番書十二卷又製字若符篆其俗衣白窄衫冠冠後垂紅結綬自號嵬名設官分文武其冠用金縷貼間起雲銀紙帖緋衣金塗銀帶佩蹀躞解錐短刀弓矢穿靴禿髮耳重環紫旋襴六襲出入乘馬張青蓋以二旗前引從者百餘騎民庶衣青綠革樂之五音為一音裁禮之九拜為三拜凡出兵先卜有四一炙勃焦以艾灼羊胛骨二擗筭擗竹于地以求數若揲蓍然三呪羊其夜牽羊焚香禱之又焚穀火于野次晨屠羊腸胃通則吉羊心有血則敗四矢擊絃聽其聲知勝負及敵至之期病者不用醫藥召巫者送鬼西夏語以巫為厮也或遷他室謂之閃病喜報仇有喪則不伐人負甲葉於背識之仇解用雞猪犬血和酒貯於髑髏中飲之乃誓曰若復報仇穀麥不收男女禿癩六畜死蛇入帳有力小不能復仇者集壯婦享以牛羊酒食趨讎家縱火焚其廬舍俗曰敵女兵不祥輒避去訴于官官擇舌辯氣直之人為和斷官聽其屈直殺人者納命價錢百二十千土產大麥蓽豆青稞子古子蔓鹹地蓬實蓉苗小蕪荑席雞草子地黃葉登廂草沙葱野韭拒灰蓧白蒿鹹地松實民年十五為丁有二丁者取一為正軍負擔雜使一人為抄四丁為兩抄餘人得射它丁皆習戰鬬正軍馬駝各一每家自置一帳團練使上帳弓矢各一馬五百疋槖駝一旗鼓五槍劍棍棓袋雨渾脫鍬钁箭牌鐵笊籬各一刺史以下人各一駝箭三百毛幕一餘兵三人共一幕有炮手二百人號潑喜勇健者號撞令郎齎糧不過一旬晝則舉煙揚塵夜則火為候若獲人馬射之號曰殺鬼招魂或射草縳人出軍用單日避晦日多立虛寨設伏兵衣重甲乘善馬以鐵騎為前鋒用鈎索絞聯雖死馬上不落其民俗勇悍衣冠騎乘土產品物子姓傳國亦略知其大概耳初西夏臣宋有年賜姓曰趙迨遼聖宗統和四年繼遷叛宋始來附遼授特進檢校太師都督夏州諸軍事遂復姓李十月遣使來貢六年入貢七年來貢以王子帳耶律襄之女封義成公主下嫁繼遷八年正月來謝三月又來貢九月繼遷遣使獻宋俘十月以敗宋軍來告十二月下宋麟鄜等州來告遣使封繼遷為夏國王九年二月遣使告伐宋之捷四月遣李知白來謝封冊七月復綏銀二州來告十月繼遷以宋所授敕命遣使來上是月定難軍節度使李繼捧來附授開府儀同三司檢校太師兼侍中封西平王仍賜推忠效順啟聖定難功臣十二月繼遷潛附于宋遣韓德威持詔諭之十年二月韓德威還奏繼遷託故不出至靈州俘掠以還西夏遣使來奏德威俘掠賜詔撫諭十月來貢十二年入貢十三年敗宋師遣使來告十四年又來貢十五年三月以破宋兵來告封繼遷為西平王六月遣使來謝封冊十六年來貢十八年授繼遷子德明朔方軍節度使十九年遣李文冀來貢六月奏下宋環慶三州賜詔褒美二十年遣使來進馬駝六月遣劉仁勗來告下靈州二十一年繼遷薨其子德昭遣使來告六月贈繼遷尚書令遣西上閤門使丁振弔慰八月德昭遣使來謝弔贈二十二年三月德昭遣使上繼遷遺留物七月封德昭為西平王十月遣使來謝封冊二十三年下宋青城來告二十五年德昭母薨遣使弔祭起復二十七年承天皇太后崩遣使報哀于夏二十八年遣使冊德昭為夏國王開泰元年德昭遣使進良馬二年遣引進使李延弘賜夏國王李德昭及義成公主車馬太平元年來貢十一年聖宗崩報哀于夏德昭遣使來進賻幣興宗即位以興平公主下嫁李元昊以元昊為駙馬都尉重熙元年夏國遣使來賀李德昭薨冊其子夏國公元昊為王二年來貢十二月禁夏國使沿路私市公鐵七年來貢李元昊與興平公主不諧公主薨遣北院承旨耶律庶成持詔問之九年宋遣郭禎以伐夏來報十年夏國獻所俘宋將及生口十一年遣使問宋興師伐夏之由十二月禁吐渾鬻馬于夏沿邊築障塞以防之十二年正月遣同知析津府事耶律敵烈樞密都承旨王惟吉諭夏國與宋和二月元昊以加上尊號遣使來賀耶律敵烈等使夏國還奏元昊罷兵遣使報宋四月夏國遣使進馬駝七月元昊上表請伐宋不從十月夏人侵党項遣延昌宮使高家奴讓之十三年四月党項及山西部族節度使屈烈以五部叛入西夏詔徵諸道兵討之六月阻卜酋長烏八遣其子執元昊所遣求援使窊邑改來八月夏使對不以情覊之使復來詢事宜不實對笞之十月元昊上表謝罪欲收集叛黨以獻從之進方物命北院樞密副使蕭革迓之元昊親率党項三部來降詰其納叛背盟元昊伏罪初夏人執蕭胡覩至是請以被執者來歸詔所留夏使亦還其國十二月胡覩來歸又遣使來貢十七年元昊薨其子諒祚遣使來告上其父遺留物鐵不得國乞以本部軍助攻夏國不許十八年復議伐夏留其賀正使不遣遣北院樞密副使蕭惟信以伐夏告宋六月夏國遣使來貢留之七月親征八月渡河夏人遁九月蕭惠為夏人所敗十月招討使耶律敵古率阻卜軍至賀蘭山獲元昊妻及其官屬遇其軍三千來拒殪之詳穩蕭慈氏奴南剋耶律斡里歿于陣十九年正月遣使問罪于夏夏將洼普等攻金肅城耶律高家奴等破之洼普被創遁去殺猥貨乙靈紀三月殿前都點檢蕭迭里得與夏軍戰于三角川敗之招討使蕭蒲奴北院大王宜新等帥師伐夏都部署別古得為監戰五月蕭蒲奴等入夏境不遇敵縱軍俘掠而還夏國洼普來降十月李諒祚母遣使乞依舊稱臣十二月諒祚上表如母訓二十年二月遣使索党項叛戶五月蕭爻括使夏回進諒祚母表乞代党項權進馬駝牛羊等物又求唐隆鎮仍乞罷所建城邑以詔答之六月獲元昊妻及俘到夏人置于蘇州二十一年十月諒祚遣使乞弛邊備遣爻括賫詔諭之二十二年七月諒祚進降表遣林牙高家奴賫詔撫諭二十三年正月貢方物五月乞進馬駝詔歲貢之七月諒祚遣使求婚十月進誓表二十四年興宗崩遣使報哀于夏道宗即位清寧元年遣使來賀九月以先帝遺物賜夏四年四月遣使會葬九年正月禁民鬻銅于夏咸雍元年五月來貢三年十一月遣使進回鶻僧金佛梵覺經十二月諒祚薨四年二月諒祚子秉常遣使報哀即遣使弔祭秉常上其父遺物十月冊秉常為夏國王十二月來貢五年七月遣使來謝封冊閏十一月秉常乞賜印綬九年遣使來貢大康二年正月仁懿皇后崩遣使報哀于夏以皇太后遺物賜之遣使來弔祭五年來貢八年二月遣使以所獲宋將張天益來獻大安元年十月秉常遣使報其母哀二年十月秉常薨遣使詔其子乾順知國事十二月李乾順遣使上其父秉常遺物四年七月冊乾順為夏國王五年六月遣使來謝封冊八年六月夏為宋所侵遣使乞援壽隆三年六月以宋人置壁壘于要地遣使來告四年六月求援十一月遣樞密直學士耶律儼使宋諷與夏和夏復遣使來求援五年正月詔乾順伐拔思母等部十一月夏以宋人罷兵遣使來謝六年十一月遣使請尚公主七年道宗崩遣使告哀于夏遣使來慰奠天祚即位乾統元年夏遣使來賀二年復請尚公主又以為宋所侵遣李造福田若水來求援三年復遣使請尚公主十月使復來求援四年五年李造福等至乞援以族女南仙封成安公主下嫁乾順六年正月遣牛溫舒使宋令歸所侵夏地六月遣李造福來謝八年乾順以成安公主生子遣使來告九年以宋不歸地來告十年遣李造福等來貢天慶三年六月來貢保大二年天祚播遷乾順率兵來援為金師所敗乾順請臨其國六月遣使冊乾順為夏國皇帝而天祚被執歸金矣論曰高麗西夏之事遼雖嘗請婚下嫁烏足以得其固志哉三韓接壤反覆易知涼州負遠納叛侵疆乘𨻶輒動貢使方往事釁隨生興師問罪屢煩親征取勝固多敗亦貽悔昔吳趙咨對魏之言曰大國有征伐之兵小國有備禦之固豈其然乎先王柔遠以德而不以力尚矣遼亡求援二國雖能出師豈金敵哉
