body:
  text: 遼史卷十七本紀第十七聖宗八五年春正月乙酉如混同江二月戊午禁天下服用明金及金線綺國親當服者奏而後用是月如魚兒濼三月壬辰以左丞相張儉為武定軍節度使同政事門下平章事鄭弘節臨潢少尹劉慎行遼興軍節度使武定軍節度使蕭匹敵契丹行宮都部署樞密副使楊又玄吏部尚書參知政事兼樞密使是月如長春河魚兒濼其水一夕有聲如雷越沙岡四十里別為一陂夏五月清暑永安山以蕭從順為太子太師吳叔達翰林學士道士馮若谷加太子中允耶律晨武定軍節軍使張儉彰信軍節度使呂士宗禮部員外郎李可舉順義軍節度使秋七月獵平地松林九月駐蹕南京己亥以蕭迪烈李紹琪充賀宋太后生辰使副耶律守寧劉四端充賀宋主生辰使副冬十月辛未宋太后遣馮元宗史方來賀順天節十一月庚子幸內果園宴京民聚觀求進士得七十二人命賦詩第其工拙以張昱等一十四人為太子校書郎韓欒等五十八人為崇文館校書郎辛丑以左祗候郎君詳穩蕭羅羅為右夷離畢十二月丁巳以漢人行宮都部署蕭孝先為上京留守皇姪長沙郡王謝家奴匡義軍節度使耶律仁舉興國軍節度使甲子蕭守寧為點檢侍衞親軍馬步軍乙丑北院樞密使蕭合卓薨戊辰以北府宰相蕭普古為北院樞密使己巳遣蕭諧李琪充賀宋正旦使副庚午以參知政事劉京為順義軍節度使乙亥宋使李維張綸來賀千齡節是歲燕民以年穀豐熟車駕臨幸爭以土物來獻上禮高年惠魚眾寡賜酺飲至夕六街燈火如晝士庶嬉遊上亦微行觀之丁丑禁工匠不得銷毀金銀器六年春正月己卯朔宋遣徐奭裴繼起張若谷崔準來賀庚辰如鴛鴦濼二月己酉以迷離己同知樞密院黃翩為兵馬都部署達骨只副之赫石為都監引軍城混同江疎木河之間黃龍府請建堡障三烽臺十詔以農隙築之東京留守八哥奏黃翩領兵入女直界徇地俘獲人馬牛豕不可勝計得降戶二百七十詔奬諭之戊午以耶律野為副點檢以國舅帳蕭柳氏徒魯骨領西北路十二班軍奚王府舍利軍己巳南京水遣使振之庚午詔党項別部塌西設契丹節度使治之三月戊寅朔以大同軍節度使張儉入為南院樞密使左丞相兼政事令參知政事吳叔達責授將作少監出為東州刺史是月阻卜來侵西北路招討使蕭惠破之夏四月丁未朔以武定軍節度使耶律洪古為惕隱戊申蒲盧毛𩽆部多兀惹戶詔索之丙寅如永安山五月辛卯以東京統軍使蕭慥古為契丹行宮都部署癸卯遣西北路招討使蕭惠將兵伐甘州回鶻六月辛丑詔凡官畜並印其左以識之秋七月戊申獵黑嶺八月蕭惠攻甘州不克師還自是阻卜諸部皆叛遼軍與戰皆為所敗監軍涅里姑國舅帳太保曷不呂死之詔遣惕隱耶律洪古林牙化哥等將兵討之九月駐蹕遼河滸冬十月丙子曷蘇館諸部長來朝庚辰遣使問夏國五月與宋交戰之故辛巳以前南院大王直魯袞為烏古敵烈都詳穩庚寅以蕭孝順蕭紹宗兼侍中駙馬蕭紹業平章政事前南院大王胡覩菫同知上京留守安哥通化州節度使十一月乙丑宋遣韓翼田承說來賀順天節戊辰西北路招討司小校掃姑訴招討蕭惠三罪詔都監奧骨禎按之十二月庚辰曷蘇館部乞建旗鼓許之辛巳詔北南諸部廉察州縣及石烈彌里之官不治者罷之詔大小職官有貪暴殘民者立罷之終身不錄其不廉直雖處重任即代之能清勤自持者在卑位亦當薦拔其內族受賂事發與常人所犯同科戊戌遣杜防蕭蘊充賀宋生辰使副庚子駐蹕遼河七年春正月壬寅朔宋遣張保維孫繼業孔道輔馬崇至來賀如混同江辛亥以女直白縷為惕隱蒲馬為巖母部太師甲寅蒲盧毛𩽆部遣使來貢夏四月乙未獵黑嶺五月清暑永安山西南路招討司奏陰山中產金銀請置冶從之復遣使循遼河源求產金銀之礦六月禁諸屯田不得擅貨官粟癸巳詔蕭惠再討阻卜秋七月己亥朔詔更定法令庚子詔諭駙馬蕭鉏不公主粘米袞爾於后有父母之尊后或臨幸祗謁先祖祗拜空帳失致敬之禮今後可設像拜謁乙巳詔輦路所經旁三十步內不得耕種者不在訴訟之限九月駐蹕遼河冬十月丁卯朔詔諸帳院庶孽並從其母論貴賤十一月宋遣石中立石貽孫來賀千齡節王博文王雙賀順天節辛亥以楊又玄邢祥知貢舉己未匡義軍節度使中山郡王查葛保寧軍節度使長沙郡王謝家奴廣德軍節度使樂安郡王遂哥奏各將之官乞選伴讀書史從之癸亥以三韓王欽為啟聖軍節度使楊佶刑部侍郎甲子以左千牛衞上將軍耶律古昱為北院大王十二月丁卯朔遣耶律遂英王永錫充賀宋太后生辰蕭速撒馬保永充賀正旦使副癸酉以金吾蕭高六為奚舍利軍詳穩八年春正月己亥如混同江庚申党項侵邊破之甲子詔州縣長吏勸農二月戊子燕京留守蕭孝穆乞于拒馬河接宋境上置戍長巡察詔從之三月駐蹕長春河夏五月清暑永安山六月以韓寧劉湘充賀宋太后生辰使副吳克荷充賀夏國王李德昭生辰使癸巳權北院大王耶律鄭留奏今歲十一月皇太子納妃諸族備會親之帳詔以豪盛者三十戶給其費秋七月丁酉以遙輦帳郎君陳哥為西北路巡檢與蕭諧領同管二招討地以南院大王耶律敵烈為上京留守戊戌獵平地松林九月壬辰朔以渤海宰相羅漢權東京統軍使壬子幸中京北敵烈部節度使耶律延壽請視諸部賜旗鼓詔從之癸丑阻卜別部長胡懶來降乙卯阻卜長舂古來降冬十月宋遣唐肅葛懷愍來賀順天節樞密使魏王耶律斜軫孫婦阿聒指斥乘輿其孫骨欲為之隱事覺乃幷坐之仍籍其家詔燕城將士若敵至總管備城之東南統軍守其西北馬步軍備其野戰統軍副使繕壁壘課士卒各練其事十一月丙申皇太子納妃蕭氏以耶律求翰為北院大王十二月辛酉朔以遙輦太尉謝佛留為天雲軍詳穩壬申以前北院大王耶律留寧為雙州節度使康筠崇德宮都部署謝十永興宮都部署旅墳宜州節度使菴遼州節度使耶律野同知中京留守耶律曷魯突媿為大將軍丁丑詔庶孽雖已為良不得預世選丁亥宋遣寇瑊康德求賀千齡節朱諫曹英張逸劉永釗賀來歲兩宮正旦詔兩國舅及南北王府乃國之貴族賤庶不得任本部官是歲放進士張宥等五十七人九年春正月至自中京二月戊辰遣使賜高麗王欽物如斡凜河夏五月清暑永安山六月戊子朔以長沙郡王謝家奴為廣德軍節度使樂安郡王遂哥匡義軍節度使中山郡王查葛保定軍節度使進封潞王豫章王貼不長寧軍節度使以耶律思忠耶律荷耶律暠遙輦謝佛留陳邈韓紹一韓知白張震充賀宋兩宮生辰及來歲正旦使副秋七月戊午朔如黑嶺八月己丑東京舍利軍詳穩大延琳囚留守駙馬都尉蕭孝先及南陽公主殺戶部使韓紹勳副使王嘉四捷軍都指揮使蕭頗得延琳遂僭位號其國為興遼年為天慶初東遼之地自神冊來附未有榷酤鹽麥曲之法關市之征亦甚寬弛馮延休韓紹勳相繼以燕地平山之法繩之民不堪命燕又仍歲大饑戶部副使王嘉復獻計造船使其民諳海事者漕粟以振燕民水路艱險多至覆沒雖言不信鞭楚搒掠民怨思亂故延琳乘之首殺紹勳嘉以快其衆延琳先事與副留守王道平謀道平夜棄其家踰城走與延琳所遣召黃龍府黃翩者俱至行在告變上即徵諸道兵以時進討時國舅詳穩蕭匹敵治近延琳先率本管及家兵據其要害絕其西渡之計渤海太保夏行美亦舊主兵戍保州延琳密馳書使圖統帥耶律蒲古行美乃以實告蒲古得書遂殺渤海兵八百人而斷其東路延琳知黃龍保州皆不附遂分兵西取瀋州其節度使蕭王六初至其副張傑聲言欲降故不急攻及知其詐而已有備攻之不克而還時南北女直皆從延琳高麗亦稽其貢及諸道兵次第皆至延琳嬰城固守冬十月丙戌朔以南京留守燕王蕭孝穆為都統國舅詳穩蕭匹敵為副統奚六部大王蕭蒲奴為都監以討之十一月乙卯朔如顯陵丙寅以瀋州節度副使張傑為節度使其皇城進士張人紀趙睦等二十二人入朝試以詩賦皆賜第超授保州戍將夏行美平章事壬申以駙馬劉四端權知宣徽南院事十二月丁未宋遣仇永韓永錫來賀千齡節命耶律育吳克荷蕭可觀趙利用充賀宋生辰使副耶律元吉崔閏蕭昭古竇振充來歲賀宋正旦使副十年春正月乙卯朔宋遣王夷簡竇處約張易張士宜來賀二月幸龍化州三月甲寅朔詳穩蕭匹敵至自遼東言都統蕭孝穆去城四面各五里許築城堡以圍之駙馬延寧與其妹穴地遁去惟公主崔八在後為守陴者覺而止夏四月如乾陵以耶律行平為廣平軍節度使夏行美為忠順軍節軍使李延弘知易州蕭從順加太子太師五月戊申清暑栢坡秋七月壬午詔來歲行貢舉法八月丙午東京賊將楊詳世密送發夜開南門納遼軍擒延琳渤海平冬十月駐蹕長寧淀十一月辛亥南京留守燕王蕭孝穆以東征將士凱還戎服見上上大加宴勞翌日以孝穆為東平王東京留守國舅詳穩駙馬都尉蕭匹敵封蘭陵郡王奚王蒲奴加侍中以權燕京留守兼侍中蕭惠為燕京統軍使前統軍委窊大將軍節度使宰相兼樞密使馬保忠權知燕京留守奚王府都監蕭阿古軫東京統軍使詔渤海舊族有勳勞材力者用餘分居來隰遷潤等州十二月乙巳宋遣梅詢王令傑來賀千齡節漆水郡王耶律敵烈加尚父烏古部節度使蕭普達為乙室部大王尚書左僕射蕭琳為臨海軍節度使十一年春正月己酉朔如混同江二月如長春河三月上不豫夏五月大雨水諸河橫流皆失故道六月丁丑朔駐蹕大福河之北己卯帝崩于行宮年六十一在位四十九年景福元年閏十月壬申上尊諡曰文武大孝宣皇帝廟號聖宗贊曰聖宗幼冲嗣位政出慈闈及宋人二道來攻親御甲冑一舉而復燕雲破信彬再舉而躪河朔不亦偉歟既而侈心一啟佳兵不祥東有茶陀之敗西有甘州之喪此狃於常勝之過也然其踐阼四十九年理冤滯舉才行察貪殘抑奢僭錄死事之子孫振諸部之貧乏責迎合不忠之罪却高麗女樂之歸遼之諸帝在位長久令名無窮其唯聖宗乎
