body:
  text: 遼史卷四十三志第十三曆象志中閏考月度不足是生朔虛天行有餘是為氣盈盈虛相懸歲月乃牉積牉而差寒暑互易百穀不成庶政不明聖人驗以斗柄準以歲星爰立閏法信治百官是故閏正而月正月正而歲正歲月既正頒令考績無有不時國史正歲年以事莫重於此遼始徵曆梁唐入晉之後奄有帝制乙未大明曆法再變穆宗應曆六年周用顯德欽天曆十年宋用建隆應天曆景宗乾亨四年宋用乾元曆聖宗統和十九年宋用儀天曆太平元年宋用崇天曆道宗清寧十年宋用明天曆大康元年宋用奉元曆大安七年宋用觀天曆天祚皇帝乾統六年宋用紀元曆五代曆三變宋凡八變遼終始再變曆法不齊故定朔置閏時有不同覽者惑焉作閏考年正二三四五六七八九十十一十二首缺五閏閏耶律儼太祖神陳大任冊五年天贊二梁閏年缺一閏閏太宗天儼顯三年六年閏儼唐九年閏儼大任唐十一年閏儼大任唐會同二閏年儼大任晉缺一閏閏七年儼大任大同元閏年儼大任高麗十年七月缺再閏穆宗應曆三年五年閏儼大任八年閏儼大任十一年閏儼大任宋十三年宋閏十六年閏儼大任宋十九年宋閏景宗保閏寧四年儼大任宋六年宋閏九年宋閏乾亨二閏年儼大任宋四年宋閏聖宗統宋閏和三年六年閏儼大任九年閏儼大任宋高麗十一年宋閏高麗十四年閏大任宋十七年宋閏十九年閏宋閏儼異大任二十二閏年大任宋二十五宋閏年二十八宋閏年開泰元宋閏年四年宋閏七年宋閏九年閏宋閏儼異太平三閏年儼宋六年宋閏九年宋閏十一年閏儼大任宋高麗興宗重宋閏熙三年六年閏儼宋八年閏儼宋高麗十一年閏儼宋十四年閏儼宋十七年閏儼宋高麗十九年閏儼宋高麗二十二閏年儼宋道宗清閏寧二年儼宋四年閏儼宋七年宋閏十年宋閏咸雍三宋閏年五年閏大任宋八年閏儼宋大康元閏年儼大任宋三年閏宋閏來儼年正月異六年宋閏九年閏儼大任宋大安四閏年儼大任宋高麗七年宋閏十年閏大任宋壽昌三宋閏年五年閏儼大任宋天祚乾閏統二年儼大任宋五年宋閏七年宋閏十年閏宋閏儼異大任天慶三閏年儼大任宋六年閏儼大任宋八年閏儼大任宋保大元宋閏年四年閏儼大任宋
