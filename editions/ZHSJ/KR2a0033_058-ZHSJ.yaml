body:
  text: 遼史卷五十八志第二十七儀衞志四儀仗帝王處則重門擊柝出則以師兵為營衞勞人動衆豈得已哉天下大患生於大欲不得不遠慮深防耳智英勇傑魁臣雄藩於是乎在𧜛武備於文物之中此儀仗所由設也金吾黃麾六軍之仗遼受之晉晉受之後唐後唐受之梁唐其來也有自耶律儼陳大任舊志有未備者兼考之遼朝雜禮云國仗王通氏言舜歲徧四岳民不告勞營衞省徵求寡耳遼太祖匹馬一麾斥地萬里經營四方未嘗寧居所至樂從用此道也太宗兼制中國秦皇漢武之儀文日至後嗣因之旄頭豹尾馳驅五京之間終歲勤動轍迹相尋民勞財匱此之故歟遼自大賀氏摩會受唐鼓纛之賜是為國仗其制甚簡太宗伐唐晉以前所用皆是物也著于篇首以見艱難創業之主豈必厚衞其身云十二神纛十二旗十二鼓曲柄華蓋直柄華蓋遙輦末主遣制迎十二神纛天子旗鼓置太祖帳前諸弟剌哥等叛勻德實縱火焚行宮皇后命曷古魯救之止得天子旗鼓太宗即位置旗鼓神纛于殿前聖宗以輕車儀衞拜帝山渤海仗天顯四年太宗幸遼陽府人皇王備乘輿羽衞以迎乾亨五年聖宗東巡東京留守具儀衞迎車駕此故渤海儀衞也漢仗大賀失活入朝于唐娑固兄弟繼之尚主封王飫觀上國開元東封邵固扈從又覽太平之盛自是朝貢歲至于唐遼始祖涅里立遙輦氏世為國相目見耳聞歆企帝王之容輝有年矣遙輦致鼓纛於太祖帳前曾何足以副其雄心霸氣之所睥睨哉厥後交梁聘唐不憚勞勩至於太宗立晉以要冊禮入汴而收法物然後累世之所願欲者一舉而得之太原擅命力非不敵席卷法物先致中京蹝棄山河不少顧慮志可知矣於是秦漢以來帝王文物盡入于遼周宋按圖更製乃非故物遼之所重此其大端故特著焉太宗會同元年晉使馮道備車輅法物上皇太后冊禮劉昫盧重備禮上皇帝尊號三年上在薊州觀導駕儀衞圖遂備法駕幸燕御元和殿行入閤禮六年備法駕幸燕迎導御元和殿大同元年正月朔備法駕至汴上御崇元殿受文武百僚朝賀自是日以為常二月朔上御崇元殿備禮受朝賀三月將幸中京鎮陽詔收鹵簿法物委所司押領先往未幾鎮陽入漢鹵簿法物隨世宗歸于上京四月皇太弟李胡遣使問軍事上報曰朝會起居如禮是月太宗崩世宗即位鹵簿法物備而不御穆宗應曆元年詔朝會依嗣聖皇帝故事用漢禮景宗乾亨五年二月神柩升轀輬車具鹵簿儀衞六月聖宗至上京留守具法駕迎導聖宗統和元年車駕還上京迎導儀衞如式三年駕幸上京留守具儀衞奉迎四年燕京留守具儀衞導駕入京上御元和殿百僚朝賀是後儀衞常事史不復書鹵簿儀仗人數馬匹步行擎執二千四百一十二人坐馬擎執二百七十五人坐馬樂人二百七十三人步行教坊人七十一人御馬牽攏官五十二人御馬二十六匹官僚馬牽攏官六十六人坐馬挂甲人五百九十八人步行挂甲人百六十人金甲二人神輿十二人長壽仙一人諸職官等三百五人內侍一人引稍押衙二人赤縣令一人府牧一人府吏二人少尹一人司錄一人功曹一人太常少卿一人太常丞一人太常博士一人司徒一人太僕卿一人鴻臚卿一人大理卿一人御史大夫一人侍御史二人殿中侍御史二人監察御史一人兵部尚書一人兵部侍郎一人兵部郎中一人兵部員外郎一人符寶郎一人左右諸衞將軍三十五人左右諸折衝二十一人左右諸果毅二十八人尚乘奉御二人排仗承直二人左右夾騎二人都頭六人主帥一十四人教坊司差押纛二人左右金吾四人虞候佽飛一十六人鼓吹令二人漏刻生二人押當官一人司天監一人令史一人司辰一人統軍六人千牛備身二人左右親勳二人左右郎將四人左右拾遺二人左右補闕二人起居舍人一人左右諫議大夫二人給事中書舍人二人左右散騎常侍二人門下侍郎二人中書侍郎二人鳴鞭二人內侍內差侍中一人中書令一人監門校尉二人排列官二人武衞隊正一人隨駕諸司供奉官三十人三班供奉官六十人通事舍人四人御史中丞二人乘黃丞二人都尉一人太僕卿一人步行太卜令一人職官乘馬三百四匹進馬四匹駕車馬二十八匹人之數凡四千二百三十有九馬之數凡千五百二十得諸本朝太常卿徐世隆家藏遼朝雜禮者如是至於儀注之詳不敢傅會云
