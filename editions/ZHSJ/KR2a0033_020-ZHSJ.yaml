body:
  text: 遼史卷二十本紀第二十興宗三十六年春正月己卯如混同江二月庚申如魚兒濼辛酉禁羣臣遇宴樂奏請私事詔世選之官從各部耆舊擇材能者用之三月丁亥如黑水濼癸巳遣使審決雙州囚壬寅大雪夏四月乙巳朔皇太后不豫上馳往視疾丙午皇太后愈復如黑水濼丁卯肆赦六月戊申清暑永安山丁巳阻卜大王屯禿古斯來朝獻方物戊午詔士庶言事秋七月辛卯幸慶州自是月至于九月日射獵于楚不溝霞列繫輪石塔諸山冬十月辛亥幸中京謁祖廟丙辰定公主行婦禮於舅姑儀庚午鐵驪仙門來朝以始入貢加右監門衞大將軍十一月戊寅祠木葉山己丑幸中京朝皇太后壬辰禁漏泄宮中事十二月辛丑朔女直遣使來貢辛亥謁太祖廟觀太宗收晉圖癸丑問安皇太后乙卯以太后愈雜犯死罪減一等論徒以下免庚申南府宰相杜防韓紹榮奏事有誤各以大杖決之出防為武定軍節度使壬戌高麗遣使來貢十七年春正月丁亥如春水閏月癸丑射虎于候里吉二月辛巳振瑤穩嘲穩部是月詔士庶言國家利便不得及己事奴婢所見許白其主不得自陳夏國王李元昊薨其子諒祚遣使來告即遣永興宮使耶律褭里右護衞太保耶律興老將作少監王全慰奠三月癸卯以同知南京留守事蕭塔烈葛為左夷離畢知右夷離畢事唐古為右夷離畢丙午夏國李諒祚遣使上其父元昊遺物丁卯鐵不得國使來乞以本部軍助攻夏國不許夏四月辛未武定軍節度使杜防復為南府宰相丙子高麗遣使來貢甲申蒲盧毛𩽆部大王蒲輦以造舟人來獻六月庚辰阻卜獻馬駝二萬辛卯長白山太師柴葛回跋部太師撒剌都來貢方物秋七月丁未于越摩梅欲之子不葛一及婆離八部夷離菫虎等內附甲寅錄囚減雜犯死罪八月丙戌復南京貧戶租稅戊子以殿前都點檢耶律義先為行軍都部署忠順軍節度使夏行美副部署東北面詳穩耶律朮者為監軍伐蒲奴里酋陶得里冬十月甲申南院大王耶律韓八薨甲午駐蹕獨盧金十一月乙未朔遣使括馬丁巳賜皇太弟重元金券封皇子和魯斡為越王阿璉許王忠順軍節度使謝家奴陳王西京留守貼不漢王惕隱旅墳遼西郡王行宮都部署別古得柳城郡王奉陵軍節度使侯古饒樂郡王安定郡王涅魯古進封楚王十八年春正月甲午朔日有食之戊戌留夏國賀正使不遣己亥遣北院樞密副使蕭惟信以伐夏告宋辛丑錄囚丙午如鴛鴦濼丙辰獵霸特山耶律義先奏蒲奴里捷二月庚辰幸燕趙國王洪基帳視疾乙酉耶律義先等執陶得里以獻三月乙巳高昌國遣使來貢壬子以洪基疾愈赦雜犯死罪以下丁巳烏古遣使送款夏四月癸酉以南府宰相耶律高十為南京統軍使五月甲辰五國酋長各率其部來附庚戌回跋部長兀迭臺扎等來朝戊午五國節度使耶律仙童以降烏古叛人授左監門衞上將軍六月壬戌朔以韓國王蕭惠為河南道行軍都統趙王蕭孝友漢王貼不副之乙丑錄囚丙寅行十二神纛禮己巳宋以遼師伐夏遣錢逸致贐禮庚辰阻卜來貢馬駝珍玩辛巳夏國使來貢留之不遣丁亥行再生禮秋七月戊戌親征八月辛酉朔渡河夏人遁乃還九月丁未蕭惠等為夏人所敗冬十月北道行軍都統耶律敵魯古率阻卜諸軍至賀蘭山獲李元昊妻及其官僚家屬遇夏人三千來戰殪之烏古敵烈部都詳穩蕭慈氏奴南剋耶律斡里死焉十二月戊寅慶陵林木火己卯錄囚有弟從兄為強盜者兄弟俱無子特原其弟十九年春正月庚寅僧惠鑑加檢校太尉庚子耶律敵魯古復封漆水郡王諸將校及阻卜等部酋長各進爵有差贈蕭慈氏奴同中書門下平章事辛丑遣使問罪于夏國壬寅如魚兒濼二月丁亥夏將洼普猥貨乙靈紀等來攻金肅城南面林牙耶律高家奴等破之洼普被創遁去殺猥貨乙靈紀三月戊戌殿前都點檢蕭迭里得與夏戰于三角川敗之癸卯命西南招討使蕭蒲奴北院大王宜新林牙蕭撒抹等帥師伐夏以行宮都部署別古得監戰甲辰遣同知北院樞密使蕭革按軍邊城以為聲援己酉駐蹕息雞淀丙辰幸殿前都點檢蕭迭里得駙馬都尉蕭胡覩帳視疾夏四月丙寅如魚兒濼壬申蒲盧毛𩽆部惕隱信篤來貢甲申高麗遣使來貢五月己丑如凉陘癸巳蕭蒲奴等入夏境不與敵遇縱軍俘掠而還丁酉夏國洼普來降己亥遠夷拔思母部遣使來貢六月丙辰朔置倒塌嶺都監丙寅謁慶陵庚午幸慶州謁大安殿壬申詔醫卜屠販奴隸及倍父母或犯事逃亡者不得舉進士回跋曷蘇舘蒲盧毛𩽆部各遣使貢馬甲戌宋遣使來賀伐夏捷高麗使俱至辛巳御金鑾殿試進士秋七月壬辰駐蹕括里蒲盌癸巳以燕趙國王洪基領北南樞密院乙未阻卜長豁得剌弟斡得來朝加太尉遣之戊戌錄囚戊申以左夷離畢蕭唐古為北院樞密副使壬子獵候里吉八月丁卯阻卜酋長喘只葛拔里斯來朝九月壬寅夏人侵邊敵魯古遣六院軍將海里擊敗之冬十月庚午還上京辛未夏國王李諒祚母遣使乞依舊稱藩使還詔諭別遣信臣詣闕當徐思之壬申釋臨潢府役徒甲戌如中會川十一月甲午阻卜酋長豁得剌遣使來貢庚戌錄囚壬子出南府宰相韓知白為武定軍節度使樞密副使楊績長寧軍節度使翰林學士王綱澤州刺史張宥徽州刺史知制誥周白海北州刺史閏月乙卯以漢王貼不為中京留守辛未以同知北院樞密使事蕭革為南院樞密使南院大王耶律仁先知北院樞密使事封宋王十二月丁亥北府宰相趙王蕭孝友出為東京留守東京留守蕭塔列葛為北府宰相南院樞密使潞王查葛為南院大王庚戌韓國王蕭惠徙封魏王致仕壬子夏國李諒祚遣使上表乞依舊臣屬二十年春正月戊戌駐蹕混同江二月甲申遣前北院都監蕭友括等使夏國索党項叛戶己丑如蒼耳濼甲辰吐蕃遣使來貢三月壬子朔幸黑水夏五月癸丑蕭友括等使夏還李諒祚母表乞如党項權進馬駝牛羊等物己巳夏國遣使求唐隆鎮及乞罷所建城邑以詔答之六月丙戌詔以所獲李元昊妻及前後所俘夏人安置蘇州以伐夏所獲物遣使遺宋秋七月如秋山九月詔更定條制駐蹕中會川冬十月己卯朔括諸道軍籍十一月庚申以惕隱都監蕭謨魯為左夷離畢甲子命東京留守司總領戶部內省事丁卯罷中丞記錄職官過犯令承旨總之十二月乙酉以皇太后行再生禮肆赦二十一年春正月辛亥如混同江二月如魚兒濼夏四月癸未以國舅詳穩蕭阿剌為西北路招討使封西平郡王六月丙子駐蹕永安山秋七月甲辰朔召北府宰相蕭塔烈葛南府宰相漢王貼不南院樞密使蕭革知北院樞密使事仁先等賜坐論古今治道戊申祀天地己酉詔北南樞密院日再奏事壬子追尊太祖之祖為簡獻皇帝廟號玄祖祖妣為簡獻皇后太祖之考為宣簡皇帝廟號德祖妣為宣簡皇后追封太祖伯父夷離菫巖木為蜀國王于越釋魯為隋國王以燕趙國王洪基為天下兵馬大元帥知惕隱事賜詔諭之癸亥近侍小底盧寶偽學御畫免死配役終身甲子如秋山戊辰謁慶陵以南院樞密使蕭革為北院樞密使封吳王辛未如慶州壬申追封太祖弟寅底石為許國王八月戊子太尉烏者薨詔配享聖宗廟九月乙卯平州進白兔己未謁懷陵庚申追上嗣聖皇帝天順皇帝尊諡及更諡彰德皇后曰靖安癸亥諡齊天皇后曰仁德皇后甲子謁祖陵增太祖諡大聖大明神烈天皇帝更諡貞烈皇后曰淳欽恭順皇帝曰章肅后蕭氏諡曰和敬冬十月戊寅駐蹕中會川丁亥夏國李諒祚遣使乞弛邊備即遣蕭友括奉詔諭之戊子幸顯懿二州甲午遼興軍節度使蕭虛烈封鄭王南院大王潞王查葛為南院樞密使進封越國王戊戌射虎于南撒葛柏辛丑謁乾陵十一月壬寅朔增諡文獻皇帝為文獻欽義皇帝及諡二后曰端順曰柔貞復更諡世宗孝烈皇后為懷節丁未增孝成皇帝諡曰孝成康靖皇帝更諡聖神宣獻皇后為睿智甲子次中會川回鶻阿薩蘭遣使貢名馬文豹丙寅錄囚十二月戊戌以北府宰相塔烈葛為南京統軍使鄭王虛烈北府宰相契丹行宮都部署耶律義先惕隱釋役徒限年者二十二年春正月乙巳如混同江二月丙子回鶻阿薩蘭為隣國所侵遣使求援庚辰如春水三月癸亥李諒祚以賜詔許降遣使來謝丙寅如黑水濼夏四月戊子獵鶴淀五月壬寅詔內地州縣植果六月壬申駐蹕胡呂山癸未高麗遣使來貢秋七月己酉阻卜大王屯禿古斯率諸部長獻馬駝庚申如黑嶺閏月庚午烏古來貢癸巳長春州置錢帛司九月壬辰夏國李諒祚遣使進降表甲午遣南面林牙高家奴等奉詔撫諭冬十月丙申朔日有食之十一月辛卯詔諸職事官以禮受代及以罪去者置籍歲申樞密院十二月丙申朔詔回鶻部副使以契丹人充庚子應聖節曲赦徒以下罪壬子詔大臣曰朕與宋主約為兄弟歡好歲久欲見其繪像可諭來使二十三年春正月己巳如混同江癸酉獵雙子淀戊子夏國遣使貢方物壬辰如春水甲午獵盤直坡三月丁亥幸皇太弟重元帳夏四月癸卯高麗遣使來貢癸丑獵合只忽里五月己巳李諒祚乞進馬駝詔歲貢之庚寅駐蹕永安山壬辰夏國遣使來貢六月丙申如慶州己亥謁慶陵壬寅高麗王徽請官其子詔加檢校太尉辛亥吐蕃遣使來貢秋七月己巳夏國李諒祚遣使來求婚甲戌如秋山己卯詔八房族巾幘九月庚寅獵遇三虎縱犬獲之冬十月丁酉駐蹕中京戊戌幸新建祕書監辛丑有事于祖廟癸丑以開泰寺鑄銀佛像曲赦在京囚丙辰李諒祚遣使進誓表十一月乙丑阻卜部長來貢壬申帝率羣臣上皇太后尊號曰仁慈聖善欽孝廣德安靜貞純懿和寬厚崇覺儀天皇太后大赦內外官進級有差癸未錄囚甲申羣臣上皇帝尊號曰欽天奉道祐世興曆武定文成聖神仁孝皇帝冊皇后蕭氏曰貞懿慈和文惠孝敬廣愛崇聖皇后十二月丙申如中會川二十四年春正月癸亥如混同江戊辰朝皇太后辛巳宋遣使來賀饋馴象二月己丑朔召宋使釣魚賦詩癸巳如長春河甲寅夏國遣使來賀三月癸亥皇太弟重元生子曲赦行在及長春鎮北二州徒以下罪夏五月駐蹕南崖秋七月壬午如秋山次南崖之北峪不豫八月丁亥疾大漸召燕趙國王洪基諭以治國之要戊子大赦縱五坊鷹鶻焚鈎魚之具己丑帝崩于行宮年四十遺詔燕趙國王洪基嗣位清寧元年十月庚子上尊諡為神聖孝章皇帝廟號興宗贊曰興宗即位年十有六矣不能先尊母后而尊其母以致臨朝專政賊殺不辜又不能以禮幾諫使齊天死於弒逆有虧王者之孝惜哉若夫大行在殯飲酒博鞠疊見簡書及其謁遺像而哀慟受宋弔而衰絰所為若出二人何為其然歟至於感富弼之言而申南宋之好許諒祚之盟而罷西夏之兵邊鄙不聳政治內修親策進士大修條制下至士庶得陳便宜則求治之志切矣于時左右大臣曾不聞一賢之進一事之諫欲庶幾古帝王之風其可得乎雖然聖宗而下可謂賢君矣
