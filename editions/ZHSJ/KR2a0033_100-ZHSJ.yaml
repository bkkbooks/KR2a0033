body:
  text: 遼史卷一百列傳第三十耶律棠古蕭得里底蕭酬斡耶律章奴耶律朮者耶律棠古字蒲速宛六院郎君葛剌之後大康中補本班郎君累遷至大將軍性坦率好別白黑人有不善必盡言無隱時號強棠古在朝數論宰相得失由是久不得調後出為西北戍長乾統三年蕭得里底為西北路招討使以后族慢侮僚吏棠古不屈乃罷之棠古訟之朝不省天慶初烏古敵烈叛召拜烏古部節度使至部諭降之遂出私財及發富民積以振其困乏部民大悅加鎮國上將軍會蕭得里底以都統率兵與金人戰敗績棠古請以軍法論且曰臣雖老願為國破敵不納保大元年乞致仕明年天祚出奔棠古謁於倒塌嶺為上流涕上慰止之復拜烏古部節度使及至部敵烈以五千人來攻棠古率家奴擊破之加太子太傅年七十二卒蕭得里底字糺鄰晉王孝先之孫父撒鉢歷官使相得里底短而僂外謹內倨大康中補祗候郎君稍遷興聖宮副使兼同知中丞司事大安中燕王妃生子得里底以妃叔故歷寧遠軍節度使長寧宮使壽隆二年監討達里得拔思母二部多俘而還改同知南京留守事乾統元年為北面林牙同知北院樞密事受詔與北院樞密使耶律阿思治乙辛餘黨阿思納賄多出其罪得里底不能制亦附會之四年知北院樞密事夏王李乾順為宋所攻遣使請和解詔得里底與南院樞密使牛溫舒使宋平之宋既許得里底受書之日乃曰始奉命取要約歸不見書辭豈敢徒還遂對宋主發函而讀既還朝議為是天慶三年加守司徒封蘭陵郡王女直初起廷臣多欲乘其未備舉兵往討得里底獨沮之以至敗衄天祚以得里底不合人望出為西南面招討使八年召為北院樞密使寵任彌篤是時諸路大亂飛章告急者絡繹而至得里底不即上聞有功者亦無甄別由是將校怨怒人無鬬志保大二年金兵至嶺東會耶律撒八習騎撒跋等謀立晉王敖盧斡事泄上召得里底議曰反者必以此兒為名若不除去何以獲安得里底唯唯竟無一言申理王既死人心益離金兵踰嶺天祚率衞兵西遁元妃蕭氏得里底之姪謂得里底曰爾任國政致君至此何以生為得里底但謝罪不能對明日天祚怒逐得里底與其子麼撒得里底既去為耶律高山奴執送金兵得里底伺守者怠脫身亡歸復為耶律九斤所得送之耶律淳時淳已僭號得里底自知不免詭曰吾不能事僭竊之君不食數日卒子麼撒為金兵所殺蕭酬斡字訛里本國舅少父房之後祖阿剌終採訪使父別里剌以后父封趙王酬斡貌雄偉性和易年十四尚越國公主拜駙馬都尉為祗候郎君班詳穩年十八封蘭陵郡王時帝欲立皇孫為嗣恐無以解天下疑出酬斡為國舅詳穩降皇后為惠妃遷于乾州初酬斡母入朝擅取驛馬至是覺奪其封號復與妹魯姐為巫蠱伏誅詔酬斡與公主離婚籍興聖宮流烏古敵烈部天慶中以妹復尊為太皇太妃召酬斡為南女直詳穩遷征東副統軍時廣州渤海作亂乃與駙馬都尉蕭韓家奴襲其不備平之復敗敵將侯㮣于川州是歲東京叛遇敵來擊師潰獨酬斡率麾下數人力戰歿于陣追贈龍虎衞上將軍耶律章奴字特末衍季父房之後父查剌養高不仕章奴明敏善談論大安中補牌印郎君乾統元年累遷右中丞兼領牌印宿直事六年以直宿不謹降知內客省事天慶四年授東北路統軍副使五年改同知咸州路兵馬事及天祚親征女直蕭胡篤為先鋒都統章奴為都監大軍渡鴨子河章奴與魏國王淳妻兄蕭敵里及其甥蕭延留等謀立淳誘將卒三百餘人亡歸既而天祚為女直所敗章奴乃遣敵里延留以廢立事馳報淳淳猶豫未決會行宮使者乙信持天祚御札至備言章奴叛命淳對使者號哭即斬敵里延留首以獻天祚章奴見淳不從誘草寇數百攻掠上京取府庫財物至祖州率僚屬告太祖廟云我大遼基業由太祖百戰而成今天下土崩竊見興宗皇帝孫魏國王淳道德隆厚能理世安民臣等欲立以主社稷會淳適好草甸大事未遂邇來天祚惟耽樂是從不恤萬機強敵肆侮師徒敗績加以盜賊蜂起邦國危于累卵臣等忝預族屬世蒙恩渥上欲安九廟之靈下欲救萬民之命乃有此舉實出至誠冀累聖垂祐西至慶州復祀諸廟仍述所以舉兵之意移檄州縣諸陵官僚士卒稍稍屬心時饒州渤海及侯㮣等相繼來應衆至數萬趨廣平淀其黨耶律女古等暴橫不法劫掠婦女財畜章奴度不能制內懷悔恨又攻上京不克北走降虜順國女直阿鶻產率兵追敗之殺其將耶律彌里直擒貴族二百餘人其妻子配役繡院或散諸近侍為婢餘得脫者皆遁去章奴詐為使者欲奔女直為邏者所獲縛送行在伏誅耶律朮者字能典于越蒲古只之後魁偉雄辨乾統初補祗候郎君六年因柴冊加觀察使天慶五年受詔監都統耶律斡里𩽆戰及敗左遷銀州刺史徙咸州糺將嘗與耶律章奴謀立魏國王淳及聞章奴自鴨子河亡去即引麾下數人往會之道為游兵所執送行在所上問曰予何負卿而反朮者對曰臣誠無憾但以天下大亂已非遼有小人滿朝賢臣竄斥誠不忍見天皇帝艱難之業一旦土崩臣所以痛入骨髓而有此舉非為身計後數日復問朮者厲聲數上過惡陳社稷危亡之本遂殺之論曰遼末同事之臣其善惡何相遠也棠古骨鯁不屈權要兩鎮烏古恩威並著酬斡平亂渤海又以討叛力戰而死忠可尚矣得里底縱女直而不討寢變告而不聞其蔽主聰明為國階亂莫斯之甚也章奴朮者乘時多艱潛謀廢立將求寵幸以犯大逆其得免於天下之戮哉
