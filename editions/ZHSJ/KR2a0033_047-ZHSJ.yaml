body:
  text: 遼史卷四十七志第十七上百官志三南面契丹國自唐太宗置都督刺史武后加以王封玄宗置經略使始有唐官爵矣其後習聞河北藩鎮受唐官名於是太師太保司徒司空施于部族太祖因之大同元年世宗始置北院樞密使明年世宗以高勳為南院樞密則樞密之設蓋自太宗入汴始矣天祿四年建政事省於是南面官僚可得而書其始漢人樞密院兼尚書省吏兵刑有承旨戶工有主事中書省兼禮部別有戶部使司以營州之地加幽冀之半用是適足矣中葉彌文耶律楊六為太傅知有三師矣忽古質為太尉知有三公矣於斡古得為常侍劉涇為禮部尚書知有門下尚書省矣庫部虞部倉部員外出使則知備郎官列宿之員室昉監修則知國史有院程翥舍人則知起居有注邢抱朴承旨王言敷學士則知有翰林內制張幹政事舍人則知有中書外制大理司農有卿國子少府有監九卿列監見矣金吾千牛有大將十六列衞見矣太子上有師保下有府率東宮備官也節度觀察防禦團練刺史咸在方州如唐制也凡唐官可考見者列具于篇無徵者不書南面朝官遼有北面朝官矣既得燕代十有六州乃用唐制復設南面三省六部臺院寺監諸衞東宮之官誠有志帝王之盛制亦以招徠中國之人也三師府本名三公漢以丞相太尉御史大夫為三公故稱三師太師穆宗應曆三年見太師唐骨德太傅太宗會同元年命馮道守太傅太保會同元年劉昫守太保少師耶律資忠傳見少師蕭把哥少傅少保掌印耶律乙辛重熙中掌太保印三公府先漢丞相太尉御史大夫後漢更名大司徒大司馬大司空唐太尉司徒司空又名三司太尉太宗天顯十一年見太尉趙思溫司徒世宗天祿元年見司徒劃設司空聖宗統和三十年見司空邢抱質漢人樞密院本兵部之職在周為大司馬漢為太尉唐季宦官用事內置樞密院後改用士人晉天福中廢開運元年復置太祖初有漢兒司韓知古總知漢兒司事太宗入汴因晉置樞密院掌漢人兵馬之政初兼尚書省樞密使太宗大同元年見樞密使李崧知樞密使事知樞密院事樞密副使楊遵勗咸雍中為樞密副使同知樞密院事聖宗太平六年見同知樞密院事耶律迷離已知樞密院副使事楊興宗重熙十二年知樞密院副使事樞密直學士聖宗統和二年見樞密直學士郭嘏樞密都承旨聖宗開泰九年見樞密都承旨韓紹芳樞密副承旨楊遵勗重熙中為樞密副承旨吏房承旨兵刑房承旨戶房主事廳房即工部主事中書省初名政事省太祖置官世宗天祿四年建政事省興宗重熙十三年改中書省中書令韓延徽太祖時為政事令韓知古天顯初為中書令會同五年又見政事令趙延壽大丞相太宗大同元年見大丞相趙延壽左丞相聖宗太平四年見左丞相張儉右丞相聖宗開泰元年見右丞相馬保忠知中書省事蕭孝友興宗重熙十年知中書省事中書侍郎韓資讓壽隆初為中書侍郎同中書門下平章事太祖加王郁同政事門下平章事太宗大同元年見平章事張礪參知政事聖宗統和十二年見參知政事邢抱朴堂後官太平二年見堂後官張克恭主事守當官並見耶律儼建官制度令史耶律儼道宗咸雍三年為中書省令史中書舍人院中書舍人室昉景宗保寧間為政事舍人道宗咸雍三年見中書舍人馬鉉右諫院右諫議大夫聖宗統和七年見諫議大夫馬得臣右補闕右拾遺劉景穆宗應曆初為右拾遺門下省侍中趙思忠太宗會同中為侍中常侍興宗重熙十四年見常侍斡古得散騎常侍馬人望天祚乾統中為左散騎常侍給事中聖宗統和二年見給事中郭嘏門下侍郎楊清寧初為門下侍郎起居舍人院起居舍人聖宗開泰五年見起居舍人程翥知起居注耶律敵烈重熙末知起居注起居郎杜防開泰中為起居郎左諫院左諫議大夫左補闕左拾遺統和三年見左拾遺劉景通事舍人院通事舍人統和七年見通事舍人李琬符寶司符寶郎耶律玦重熙初為符寶郎東上閤門司太宗會同元年置東上閤門使韓延徽傳見東上閤門使鄭延豐東上閤門副使西上閤門司西上閤門使統和二十一年見西上閤門使丁振西上閤門副使東頭承奉班東頭承奉官韓德讓景宗時為東頭承奉官西頭承奉班西頭承奉官通進司左通進右通進耶律瑤質景宗時為右通進登聞鼓院登聞鼓使匭院知匭院使太平三年見知匭院事杜防誥院誥院給事耶律鐸斡重熙末為誥院給事尚書省太祖嘗置左右尚書尚書令蕭思溫景宗保寧初為尚書令左僕射太祖初康默記為左尚書三年見左僕射韓知古右僕射太宗會同元年見右僕射烈束左丞武白為尚書左丞右丞左司郎中右司郎中左司員外郎右司員外郎六部職名總目某部某部尚書聖宗開泰元年見吏部尚書劉績某部侍郎王觀興宗重熙中為兵部侍郎李澣穆宗朝累遷工部侍郎某部郎中劉輝道宗大安末為禮部郎中某部員外郎開泰五年見禮部員外郎王景運某部郎中聖宗統和九年見虞部郎中崔祐諸曹郎官未詳御史臺太宗會同元年置御史大夫會同九年見御史大夫耶律解里御史中丞侍御重熙七年見南面侍御壯骨里殿中司殿中聖宗開泰元年見殿中高可殿中丞尚舍局見遼朝雜禮奉御尚乘局奉御尚輦局奉御尚食局奉御尚衣局奉御翰林院掌天子文翰之事翰林都林牙興宗重熙十三年見翰林都林牙耶律庶成南面林牙耶律磨魯古聖宗統和初為南面林牙翰林學士承旨趙延壽傳見翰林學士承旨張礪翰林學士太宗大同元年見和凝為翰林學士翰林祭酒韓德崇景宗保寧初為翰林祭酒知制誥室昉太宗入汴詔知制誥翰林畫院翰林畫待詔聖宗開泰七年見翰林畫待詔陳升翰林醫官天祚保大二年見提舉翰林醫官李奭國史院監修國史聖宗統和九年見監修國史室昉史館學士景宗保寧八年見史館學士史館修撰劉輝大安末為史館修撰修國史耶律玦重熙初修國史宣政殿宣政殿學士穆宗應曆元年見宣政殿學士李澣觀書殿觀書殿學士王鼎壽隆初為觀書殿學士昭文館昭文館直學士楊遵勗子晦為昭文館直學士崇文館崇文館大學士韓延徽太祖時為崇文館大學士乾文閣乾文閣學士王觀道宗咸雍五年為乾文閣學士宣徽院太宗會同元年置宣徽使知宣徽院事馬得臣統和初知宣徽院事宣徽副使同知宣徽使事同知宣徽院事內省內省使聖宗太平九年初見內省使內省副使內藏庫內藏庫提點道宗清寧元年見內藏庫提點耶律烏骨內侍省黃門令內謁者內侍省押班內侍左廂押班內侍右廂押班契丹漢兒渤海內侍都知左承宣使右承宣使內庫都提點內庫尚衣庫尚衣庫使湯藥局都提點勾當湯藥內侍省官並見王繼恩趙安仁傳客省太宗會同元年置都客省興宗重熙十年見都客省回鶻重哥客省使會同五年見客省使耶律化哥左客省使蕭護思應曆初為左客省使右客省使客省副使四方館四方館使高勳太宗入汴為四方館使四方館副使道宗咸雍五年詔四方館副使止以契丹人充引進司引進使聖宗統和二十八年見引進使韓嵵點簽司同簽點簽司事興宗重熙六年見同簽點簽司事耶律圓寧禮信司勾當禮信司興宗重熙七年見勾當禮信司骨欲禮賓使司禮賓使大公鼎曾祖忠為禮賓使寺官職名總目某卿興宗景福元年見崇祿卿李可封某少卿耶律儼子處貞為太常少卿某丞某主簿太常寺有博士贊引太祝奉禮郎協律郎諸署職名總目某署令某署丞太樂署鼓吹署法物庫遼朝雜禮有法物庫所掌圖籍法物庫使法物庫副使崇祿寺本光祿寺避太宗諱改衞尉寺宗正寺職在大惕隱司太僕寺有乘黃署大理寺有提點大理寺有大理正聖宗統和十二年置鴻臚寺司農寺諸監職名總目某太監興宗景福元年見少府監馬憚某少監興宗重熙十七年見將作少監王企某監丞某監主簿祕書監有祕書郎祕書郎正字著作局著作郎著作佐郎楊晢聖宗太平十一年為著作佐郎校書郎楊佶統和中為校書郎正字開泰元年見正字李萬司天監有太史令有司曆靈臺郎挈壺正五官正丞主簿五官靈臺郎保章正司曆監候挈壺正司辰刻漏博士典鐘典鼓國子監上京國子監太祖置祭酒司業監丞主簿國子學博士武白為上京國子博士助教太府監少府監將作監都水監已上文官諸衞職名總目各衞大將軍聖宗開泰七年見皇子宗簡右衞大將軍上將軍王繼忠統和二十二年加左武衞上將軍將軍聖宗太平四年見千牛衞將軍蕭順折衝都尉果毅都尉親衞勳衞翊衞左右衞左右驍衞左右武衞左右威衞左右領軍衞左右金吾衞左右監門衞左右千牛衞左右羽林軍左右龍虎軍左右神武軍左右神策軍左右神威軍已上武官東宮三師府凡東宮官多見遼朝雜禮太子太師太宗大同元年見太子太師李崧太子太傅世宗天祿五年見太子太傅趙瑩太子太保大同元年見太子太保趙瑩太子少師聖宗太平十一年見太子少師蕭從順太子少傅耶律合里重熙中為太子少傅太子少保大同元年見太子少保馮玉太子賓客院太子賓客太子詹事院太子詹事少詹事詹事丞詹事主簿太子司直司太子司直左春坊太子左庶子太子中允聖宗太平五年見太子中允馮若谷太子司議郎太子左諭德太子左贊善大夫文學館崇文館學士崇文館直學士太子校書郎聖宗太平五年見太子校書郎韓灤司經局太子洗馬劉輝大安末為太子洗馬太子文學太子校書郎聖宗太平五年見太子校書郎張昱太子正字典設局典設郎宮門局宮門郎右春坊太子右庶子太子中舍人太子舍人太子右諭德右贊善大夫太子通事舍人太子家令寺太子家令丞主簿太子率更寺太子率更令丞主簿太子僕寺太子僕丞主簿太子率府職名總目某率興宗重熙十四年見率府率習羅太子左右衞率府太子左右司禦率府太子左右清道率府太子左右監門率府太子左右內率府已上東宮官王傅府王傅蕭惟信重熙十五年為燕趙王傅親王內史府內史道宗大康三年見內史吳家奴長史參軍諸王文學館諸王教授姚景行重熙中為燕趙國王教授諸王伴讀聖宗太平八年長沙郡王宗允等奏選諸王伴讀已上諸王府官南面宮官漢兒行宮都部署院亦曰南面行宮都部署司聖宗開泰九年改左僕射漢兒行宮都部署開泰七年見漢兒行宮都部署石用中漢兒行宮副部署興宗重熙十五年見漢兒行宮副部署耶律敵烈知南面諸行宮副部署重熙十年見知南面諸行宮副部署耶律褭里同知漢兒行宮都部署事道宗大康三年見同知漢兒行宮都部署事蕭撻不也同簽部署司事耶律儼大康中為同簽部署司事都部署判官耶律儼咸雍中為都部署判官十二宮南面行宮都部署司職名總目某宮漢人行宮都部署某宮南面副都部署某宮同知漢人都部署弘義宮永興宮積慶宮長寧宮延昌宮彰愍宮崇德宮興聖宮延慶宮太和宮永昌宮敦睦宮
