body:
  text: 遼史卷七十七列傳第七耶律屋質耶律吼何魯不耶律安摶耶律洼耶律頹昱耶律撻烈耶律屋質字敵輦系出孟父房姿簡靜有器識重然諾遇事造次處之從容人莫能測博學知天文會同間為惕隱太宗崩諸大臣立世宗太后聞之怒甚遣皇子李胡以兵逆擊遇安端劉哥等于泰德泉敗歸李胡盡執世宗臣僚家屬謂守者曰我戰不克先殪此曹人皆恟恟相謂曰若果戰則是父子兄弟相夷矣軍次潢河橫渡隔岸相拒時屋質從太后世宗以屋質善籌欲行間乃設事奉書以試太后太后得書以示屋質屋質讀竟言曰太后佐太祖定天下故臣願竭死力若太后見疑臣雖欲盡忠得乎為今之計莫若以言和解事必有成否即宜速戰以決勝負然人心一搖國禍不淺惟太后裁察太后曰我若疑卿安肯以書示汝屋質對曰李胡永康王皆太祖子孫神器非移他族何不可之有太后宜思長策與永康王和議太后曰誰可遣者對曰太后不疑臣臣請往萬一永康王見聽廟社之福太后乃遣屋質授書於帝帝遣宣徽使耶律海思復書辭多不遜屋質諫曰書意如此國家之憂未艾也能釋怨以安社稷則臣以為莫若和好帝曰彼衆烏合安能敵我屋質曰即不敵奈骨肉何況未知孰勝借曰幸勝諸臣之族執於李胡者無噍類矣以此計之惟和為善左右聞者失色帝良久問曰若何而和屋質對曰與太后相見各紓忿恚和之不難不然決戰非晚帝然之遂遣海思詣太后約和往返數日議乃定始相見怨言交讓殊無和意太后謂屋質曰汝當為我畫之屋質進曰太后與大大若能釋怨臣乃敢進說太后曰汝第言之屋質借謁者籌執之謂太后曰昔人皇王在何故立嗣聖太后曰立嗣聖者太祖遺旨又曰大王何故擅立不禀尊親帝曰人皇王當立而不立所以去之屋質正色曰人皇王捨父母之國而奔唐子道當如是耶大王見太后不少遜謝惟怨是尋太后牽于偏愛託先帝遺命妄授神器如此何敢望和當速交戰擲籌而退太后泣曰向太祖遭諸弟亂天下荼毒瘡痍未復庸可再乎乃索籌一帝曰父不為而子為又誰咎也亦取籌而執左右感激大慟太后復謂屋質曰議既定神器竟誰歸屋質曰太后若授永康王順天合人復何疑李胡厲聲曰我在兀欲安得立屋質曰禮有世嫡不傳諸弟昔嗣聖之立尚以為非況公暴戾殘忍人多怨讟萬口一辭願立永康王不可奪也太后顧李胡曰汝亦聞此言乎汝實自為之乃許立永康帝謂屋質曰汝與朕屬尤近何反助太后屋質對曰臣以社稷至重不可輕付故如是耳上喜其忠天祿二年耶律天德蕭翰謀反下獄惕隱劉哥及其弟盆都結天德等為亂耶律石剌潛告屋質屋質遽引入見白其事劉哥等不服事遂寢未幾劉哥邀駕觀樗蒲捧觴上壽袖刃而進帝覺命執之親詰其事劉哥自誓帝復不問屋質奏曰當使劉哥與石剌對狀不可輙恕帝曰卿為朕鞫之屋質率劍士往訊之天德等伏罪誅天德杖翰遷劉哥以盆都使轄戞斯國三年表列泰寧王察割陰謀事上不聽五年為右皮室詳穩秋上祭讓國皇帝于行宮與羣臣皆醉察割弒帝屋質聞有言衣紫者不可失乃易衣而出亟遣人召諸王及喻禁衞長皮室等同力討賊時壽安王歸帳屋質遣弟冲迎之王至尚猶豫屋質曰大王嗣聖子賊若得之必不容羣臣將誰事社稷將誰賴萬一落賊手悔將何及王始悟諸將聞屋質出相繼而至遲明整兵出賊不意圍之遂誅察割亂既平穆宗即位謂屋質曰朕之性命實出卿手命知國事以逆黨財產盡賜之屋質固辭應曆五年為北院大王總山西事保寧初宋圍太原以屋質率兵往援至白馬嶺遣勁卒夜出間道疾馳駐太原西鳴鼓舉火宋兵以為大軍至懼而宵遁以功加于越四年漢劉繼元遣使來貢致幣於屋質屋質以聞帝命受之五年五月薨年五十七帝痛悼輟朝三日後道宗詔上京立祠祭享樹碑以紀其功云耶律吼字曷魯六院部夷離菫蒲古只之後端売心好施不事生產太宗特加倚任會同六年為南院大王莅事清簡人不敢以年少易之時晉主石重貴表不稱臣辭多踞慢吼言晉罪不可不伐及帝親征以所部兵從既入汴諸將皆取內帑珍異吼獨取馬鎧帝嘉之及帝崩于欒城無遺詔軍中憂懼不知所為吼詣北院大王耶律洼議曰天位不可一日曠若請于太后則必屬李胡李胡暴戾殘忍詎能子民必欲厭人望則當立永康王洼然之會耶律安摶來意與吼合遂定議立永康王是為世宗頃之以功加採訪使賜以寶貨吼辭曰臣位已高敢復求富臣從弟的琭諸子坐事籍沒陛下哀而出之則臣受賜多矣上曰吼舍重賞以族人為請其賢遠甚許之仍賜宮戶五十時有取當世名流作七賢傳者吼與其一天祿三年卒年三十九子何魯不何魯不字斜寧嘗與耶律屋質平察割亂穆宗以其父吼首議立世宗故不顯用晚年為本族敞史及景宗即位以平察割功授昭德軍節度使為北院大王時黃龍府軍將燕頗殺守臣以叛何魯不討之破於鴨淥江坐不親追擊以至失賊杖之乾亨間卒耶律安摶曾祖巖木玄祖之長子祖楚不魯為本部夷離菫父迭里幼多疾時太祖為撻馬狘沙里常加撫育神冊六年為惕隱從太祖將龍軍討阻卜党項有功天贊三年為南院夷離菫征渤海攻忽汗城俘斬甚衆太祖崩淳欽皇后稱制欲以大元帥嗣位迭里建言帝位宜先嫡長今東丹王赴朝當立由是忤旨以黨附東丹王詔下獄訊鞫加以炮烙不伏殺之籍其家安摶自幼若成人居父喪哀毀過禮見者傷之太宗屢加慰諭嘗曰此兒必為令器既長寡言笑重然諾動遵繩矩事母至孝以父死非罪未葬不預宴樂世宗在藩邸尤加憐恤安摶密自結納太宗伐晉還至欒城崩諸將欲立世宗以李胡及壽安王在朝猶豫未決時安摶直宿衞世宗密召問計安摶曰大王聰安寬恕人皇王之嫡長先帝雖有壽安天下屬意多在大王今若不斷後悔無及會有自京師來者安摶詐以李胡死傳報軍中皆以為信於是安摶詣北南二大王計之北院大王洼聞而遽起曰吾二人方議此事先帝嘗欲以永康王為儲貳今日之事有我輩在孰敢不從但恐不白太后而立為國家啟釁安摶對曰大王既知先帝欲以永康王為儲副況永康王賢明人心樂附今天下甫定稍緩則大事去矣若白太后必立李胡且李胡殘暴行路共知果嗣位如社稷何南院大王吼曰此言是也吾計決矣乃整軍召諸將奉世宗即位于太宗柩前帝立以安摶為腹心總知宿衞是歲約和于潢河橫渡太后問安摶曰吾與汝有何隙安摶以父死為對太后默然及置北院樞密使上命安摶為之賜奴婢百口寵任無比事皆取決焉然性太寬事循苟簡豪猾縱恣不能制天祿末察割兵犯御幄又不能討由是中外短之穆宗即位以立世宗之故不復委用應曆三年或誣安摶與齊王罨撒葛謀亂繫獄死姪撒給左皮室詳穩耶律洼字敵輦隋國王釋魯孫南院夷離菫綰思子少有器識人以公輔期之太祖時雖未官常任以事太宗即位為惕隱天顯末帝援河東洼為先鋒敗張敬達軍於太原北會同中遷北院大王及伐晉復為先鋒與梁漢璋戰於瀛州敗之太宗崩于欒城南方州郡多叛士馬困乏軍中不知所為洼與耶律吼定策立世宗乃令諸將曰大行上賓神器無主永康王人皇王之嫡長天人所屬當立有不從者以軍法從事諸將皆曰諾世宗即位賜宮戶五十拜于越卒年五十四耶律頹昱字團寧孟父楚國王之後父末掇嘗為夷離菫頹昱性端直會同中領九石烈部政濟寬猛世宗即位為惕隱天祿三年兼政事令封漆水郡王及穆宗立以匡贊功嘗許以本部大王後將葬世宗頹昱懇言於帝曰臣蒙先帝厚恩未能報幸及大葬臣請陪位帝由是不悅寢其議薨耶律撻烈字涅魯袞六院部郎君褭古直之後沉厚多智有任重才年四十未仕會同間為邊部令穩應曆初陞南院大王均賦役勸耕稼部人化之戶口豐殖時周人侵漢以撻烈都統西南道軍援之周已下太原數城漢人不敢戰及聞撻烈兵至周主遣郭從義尚鈞等率精騎拒於忻口撻烈擊敗之獲其將史彥超周軍遁歸復所陷城邑漢主詣撻烈謝及漢主殂宋師來伐上命撻烈為行軍都統發諸道兵救之既出雁門宋諜知而退保寧元年加兼政事令致政乾亨初召之上見鬚髮皓然精力猶健問以政事厚禮之以疾薨年七十九撻烈凡用兵賞罰信明得士卒心河東單弱不為周宋所併者撻烈有力焉在治所不修邊幅百姓無稱年穀屢稔時耶律屋質居北院撻烈居南院俱有政迹朝議以為富民大王云贊曰立嗣以嫡禮也太宗崩非安摶吼洼謀而克斷策立世宗非屋質直而能諫杜太后之私折李胡之暴以成橫渡之約則亂將誰定四臣者庶幾春秋首止之功哉
