body:
  text: 遼史卷五十三志第二十二禮志六嘉儀下皇太后生辰朝賀儀至日臣僚入朝國使至幕班齊如常儀皇太后昇殿坐皇帝東面側坐契丹舍人殿上通名契丹漢人臣僚宋使副綴翰林學士班東西兩洞門入合班稱賀班首上殿祝壽分班引出皆如正旦之儀教坊起居七拜契丹漢人臣僚入進酒皆如正旦之儀唯宣答稱聖旨皇帝降御座進奉皇太后生辰禮物過畢皇帝殿上再拜殿下臣僚皆再拜皇帝昇御座引臣僚分班出引中書令北大王西階上殿奏契丹臣僚進奉次漢人臣僚幷諸道進奉控鶴官置擔牀起居四拜畢引進使鞠躬通文武百僚某官某以下高麗夏國諸道進奉宣徽使殿上贊進奉各付所司控鶴官聲喏擔牀過畢契丹漢人臣僚以次謝五拜贊各祗候引出教坊諸道進奉使謝如之契丹臣僚謝宣宴引上殿就位立漢人臣僚幷宋使副東洞門入面西謝宣宴如正旦儀贊各上殿祗候臣僚使副上殿就位立亦如之監琖教坊上殿從人入東廊立皆如之御牀入皇帝初進酒臣僚就位陪拜皇太后飲酒殿上應坐侍立臣僚皆拜稱萬歲贊各祗候立皇太后卒飲手賜皇帝酒皇帝跪卒飲退就褥位再拜臣僚皆陪拜若皇帝親賜使相臣僚宋使副酒皆立飲皇帝昇坐贊應坐臣僚幷使副皆拜稱萬歲贊各就坐行方裀𩽆殿臣僚酒如正旦儀一進酒兩廊從人拜稱萬歲各就坐親王進酒如正旦儀若皇太后手賜親王酒跪飲訖退露臺上五拜贊祗候殿上三進酒行餅茶訖教坊跪致語揖臣僚使副廊下從人皆立口號絕贊拜亦如之行茶行殽膳皆如之大饌入行粥盌殿上七進酒使相臣僚樂曲終揖廊下從人起拜稱萬歲各好去承受官引兩門出曲破揖臣僚使副起鞠躬贊拜皆拜稱萬歲贊各祗候引臣僚使副下殿契丹臣僚謝宴畢出漢人臣僚使副舞蹈五拜畢贊各好去出洞門畢報閤門無事皇太后皇帝起應聖節宋遣使來賀生辰正旦始制此儀故詳見賓儀凡五拜拜興再拜興跪搢笏三舞蹈三叩頭出笏就拜興拜興再拜興其就拜亦曰俛伏興賓儀臣僚皆曰坐於此儀曰高裀與方裀別皇帝生辰朝賀儀臣僚國使班齊皇帝昇殿坐臣僚使副入合班稱賀合班出皆如皇太后生辰儀中書令北大王奏諸道進奉表目教坊起居七拜臣僚東西門入合班再拜贊進酒班首上殿進酒宣徽使宣答羣臣謝宣諭分班奏樂皇帝卒飲合班班首下殿分班出皆如正旦之儀進奉皆如皇太后生辰儀皇帝詣皇太后殿近上皇族外戚大臣並從奉迎太后即皇帝殿坐皇太后御小輦皇帝輦側步從臣僚分行序引宣徽使諸司閤門攢隊前引教坊動樂控鶴起居四拜引駕臣僚並於山樓南方立候皇太后入閤揖使副幷臣僚入幕次皇太后昇殿坐皇帝東方側坐引契丹漢人臣僚使副兩洞門入合班起居舞蹈五拜贊各祗候面殿立皇帝降御坐殿上立進皇太后生辰物過畢皇帝殿上再拜殿上下臣僚皆拜皇帝昇御座引臣僚分班出契丹臣僚入謝宣宴漢人臣僚使副入通名謝宣宴上殿就位不應坐臣僚出從人入皆如儀御牀入皇帝初進皇太后酒皇太后賜皇帝酒皆如皇太后生辰儀贊各就坐行酒宣飲盡就位謝如儀殿上一進酒畢從人入就位如儀親王進酒行餅茶教坊致語如儀行茶行肴饍如儀七進酒使相樂曲終從人起曲破臣僚使副起餘皆如正旦之儀皇后生辰儀臣僚昧爽朝皇帝皇后大帳前拜日契丹漢人臣僚陪拜皇帝昇殿坐皇后再拜臣僚殿下合班陪拜皇帝賜皇后生辰禮物皇后殿上謝再拜臣僚皆拜契丹舍人通名契丹漢人臣僚以次入賀琖入舍人贊舞蹈五拜起居不表聖躬萬福贊再拜班首上殿拜跪自通全銜祝壽訖引下殿復位鞠躬贊舞蹈五拜贊各祗候引宰臣一員上殿奏百僚諸道進表目教坊起居七拜不賀控鶴官起居四拜諸道押衙附奏起居賜宴共八拜契丹漢人合班進壽酒舞蹈五拜引大臣一員上殿欄外褥位搢笏執臺琖進酒皇帝皇后受琖退復褥位授臺出笏欄內拜跪自通全銜祝壽臣等謹進千萬歲壽酒訖引下殿復位舞蹈五拜鞠躬宣徽使奏宣答如儀引上殿搢笏執臺皇帝皇后飲殿下臣僚分班教坊奏樂皆拜稱萬歲卒飲皇帝皇后授琖引下殿舞蹈五拜贊各祗候引出臣僚進奉如儀宣宴如儀教坊監琖臣僚上殿祗候如儀皇后進皇帝酒殿上贊拜侍臣僚皆拜皇帝受琖皆拜皇后坐契丹舍人漢人閤使殿上贊拜皆拜稱萬歲贊各就坐大臣進皇帝皇后酒行酒如儀酒三行行殽行饍又進皇帝皇后酒酒再行大饌入行粥教坊致語臣僚皆起立口號絕贊拜稱萬歲引下殿謝宴引出皆如常儀進士接見儀其日舉人從時相至御帳側通名牓子與時相牓子同奏訖時相朝見如常儀畢揖進士第一名以下丹墀內面殿鞠躬通名四拜贊各祗候皆退若有進文字者不退奉卷平立閤門奏受跪左膝授訖直起退禮畢進士賜等甲敕儀臣僚起居畢讀卷官奏訖於左方依等甲唱姓名序立閤門交收敕牒閤使奏引至丹墀依等甲序立閤使稱有敕再拜鞠躬舍人宣敕各依等甲賜卿敕牒一道想宜知悉揖拜各跪左膝受敕訖鞠躬皆再拜各祗候分引左右相向侍立候奏事畢引兩階上殿就位齊聲喏賜坐酒三行起聲喏如初退揖出禮畢牌印郎君行酒閤使勸飲進士賜章服儀皇帝御殿臣僚公服引進士入東方面西再拜揖就丹墀位面殿鞠躬閤使稱有敕再拜鞠躬舍人宣敕各依等甲賜卿敕牒一道兼賜章服想宜知悉揖再拜跪受敕訖再拜退引至章服所更衣訖揖復丹墀位鞠躬贊謝恩舞蹈五拜各祗候殿東亭內序立聲喏坐賜宴簪花宣閤使一員閤門三人或二人勸飲終日禮畢宰相中謝儀皇帝常服昇殿坐諸班起居如常儀應坐臣僚上殿其餘臣僚殿下東西侍立皆如宋使初見之儀引中謝官左入至丹墀面西立舍人當殿鞠躬通新受具官姓名祗候中謝宣徽殿上索通班舍人就贊禮位贊某官至宣徽贊通班舍人二人對立揖中謝官鞠躬贊就拜位舍人二人引面殿鞠躬贊拜中謝官舞蹈五拜不出班奏聖躬萬福贊再拜揖出班跪官致詞訖俛伏興復位贊拜舞蹈五拜又出班中謝致詞如初儀共十有七拜贊祗候引右階上殿就位揖應坐臣僚聲喏坐供奉官行酒傳宣飲盡臣僚搢笏執琖起位後立飲置琖出笏贊拜臣僚皆再拜贊各坐搢笏執琖授供奉官琖酒三行揖應坐臣僚聲喏立引中謝官右階下殿至丹墀面殿鞠躬贊拜舞蹈五拜引右出臣僚皆出丞相樞密使同餘官不升殿賜酒不帶節度使不通班止通名七拜衆謝班首一人出班中謝拜表儀其日先於東上閤門陳設氈位分引南北臣僚諸國使副於氈位合班通事舍人二人舁表案置班首前揖鞠躬再拜平身中書舍人立案側班首跪搢笏興捧表跪左膝以表授中書舍人出笏就拜興再拜中書舍人復置表案上通事舍人舁表案於東上閤門入捲班分引出禮畢元日皇帝不御坐行此儀餘應上表有故皆倣此賀生皇子儀其日奉先帝御容設正殿皇帝御八角殿昇坐聲警畢北南宣徽使殿階上左右立北南臣僚金冠盛服合班入班首二人捧表立讀表官先於左階上側立二宣徽使東西階下殿受表捧表者跪左膝授訖就拜興再拜各祗候二宣徽使俱左階上授讀表官讀訖揖臣僚鞠躬引北面班首左階上殿欄內稱賀訖引左階下殿復位舞蹈五拜禮畢賀祥瑞儀聲警北南臣僚金冠盛服合班立班首二人各奉表賀北南宣徽使左階下殿受表上殿授讀表大臣讀訖揖殿下臣僚鞠躬五拜畢鞠躬引班首二人左階上殿欄內拜跪稱賀致詞訖引左階下殿復位五拜畢鞠躬宣答聽制訖再拜鞠躬謝宣諭五拜畢各祗候分班侍立禮畢兩府奏事如常乾統六年木葉山瑞雲見始行此儀天慶元年天雨穀謝宣諭後趙王進酒教坊動樂臣僚酒一行禮畢奏事賀平難儀皇帝皇后昇殿坐北南臣僚幷命婦合班五拜揖班首二人出班俛跪搢笏執表舁案近前閤使受表置案上皆再拜通事舍人二人舁案左階上殿置露臺上讀表官受入讀表對御讀訖臣僚殿下五拜鞠躬引班首二人左右階上殿欄內並立先引北面班首少前跪致詞訖退復褥位次引南面班首亦如之畢分引左右階下殿復位五拜鞠躬宣徽稱有敕再拜宣答內難已平與公等內外同慶謝宣諭五拜捲班臣僚從皇帝命婦從皇后詣皇太后殿見先帝御容陪位皆再拜皇太后正坐稱賀共十拜並引上殿賜宴如儀平難之儀道宗清寧九年太叔重元謀逆仁懿太后親率衞士與逆黨戰事平因制此儀正旦朝賀儀臣僚幷諸國使昧爽入朝奏班齊皇帝昇殿坐契丹舍人殿上通訖引契丹臣僚東洞門入引漢人臣僚幷諸國使西洞門入合班舞蹈五拜鞠躬平身引親王東階上殿欄內褥位俛伏跪自通全銜臣某等祝壽訖伏興退引東階下殿復位舞蹈五拜畢鞠躬宣徽使殿上鞠躬奏臣宣答稱有敕班首以下聽制訖再拜鞠躬宣徽傳宣云履新之慶與公等同之舍人贊謝宣諭拜舞蹈五拜贊各祗候分班引出引班首西階上殿奏表目訖教坊起居賀十二拜畢贊各祗候引契丹漢人臣僚幷諸國使東西洞門入合班再拜贊進酒引親王東階上殿就欄內褥位搢笏執臺琖進酒訖退復褥位置臺出笏少前俛跪自通全銜臣某等謹進千萬歲壽酒俛伏興退復褥位與殿下臣僚皆再拜鞠躬俟宣徽使殿上鞠躬奏臣宣答稱有敕親王以下再拜如初儀傳宣云飲公等壽酒與公等內外同慶舍人贊謝宣諭如初贊各祗候親王搢笏執臺殿下臣僚分班皇帝飲酒教坊奏樂殿上下臣僚皆拜稱萬歲贊各祗候樂止教坊再拜皇帝卒飲親王進受琖復褥位置臺琖出笏揖臣僚合班引親王東階下殿復位鞠躬再拜贊各祗候分班引出皇帝起詣皇太后殿臣僚幷諸國使皆從皇太后昇殿皇帝東方側坐引契丹漢人臣僚幷諸國使兩洞門入合班稱賀進酒皆如皇帝之儀畢引出教坊入起居進酒亦如之皇太后宣答稱聖旨契丹班謝宣宴上殿就位立漢人臣僚幷諸國使東洞門入丹墀東方面西鞠躬舍人鞠躬通文武百僚宰臣某已下謝宣宴再拜出班致詞訖退復位舞蹈五拜贊各上殿祗候引宰臣以下幷諸國使副方裀𩽆殿臣僚西階上殿就位立不應坐臣僚並於西洞門出二人監琖教坊再拜贊各上階下殿謝宴如皇太后生辰儀冬至朝賀儀臣僚班齊如正旦儀皇帝皇后拜日臣僚陪位再拜皇帝皇后昇殿坐契丹舍人通臣僚入合班親王祝壽宣答皆如正旦之儀謝訖舞蹈五拜鞠躬出班奏聖躬萬福復位再拜鞠躬班首出班俛伏跪祝壽訖伏興舞蹈五拜鞠躬贊各祗候分班不出合班御牀入再拜鞠躬贊進酒臣僚平身引親王左階上殿就欄內褥位搢笏執臺琖進酒皇帝皇后受琖訖退就褥位置臺出笏俛伏跪少前自通全銜臣某等謹進千萬歲壽酒俛伏興退復褥位再拜鞠躬殿下臣僚皆再拜鞠躬宣答如正旦儀親王搢笏執臺分班皇帝皇后飲酒奏樂殿上下臣僚皆拜稱萬歲壽樂止教坊再拜臣僚合班親王進受琖至褥位置臺琖出笏引左階下殿御牀出親王復丹墀位再拜鞠躬贊祗候分班引出班首右階上殿奏表目進奉諸道進奉教坊進奉過訖贊進奉收班首舞蹈五拜鞠躬贊各祗候班首出臣僚復入合班謝舞蹈五拜鞠躬贊各祗候分班引出聲警皇帝皇后起赴北殿皇太后於御容殿與皇帝皇后率臣僚再拜皇太后上香皆再拜贊各祗候可矮墩以上上殿皇太后三進御容酒陪位皆拜皇太后昇殿坐皇帝就露臺上褥位親王押北南臣僚班丹墀內立皇帝再拜臣僚皆拜鞠躬皇帝欄內跪祝皇太后壽訖復位再拜凡拜皆稱萬歲贊各祗候臣僚不出皇帝皇后側座親王進酒臣僚陪拜皇太后宣答皆如正旦之儀臣僚分班不出班首右階上殿奏表目合班謝宣宴上殿就位如儀御牀入皇帝進皇太后酒如初各就座行酒宣飲盡如皇太后生辰之儀皇后進酒如皇帝之儀三進酒行茶教坊致語行殽饍大饌七進酒曲破臣僚起御牀出謝宴皆如皇太后生辰儀立春儀皇帝出就內殿拜先帝御容北南臣僚丹墀內合班再拜可矮墩以上入殿賜坐帝進御容酒陪位幷侍立皆再拜一進酒臣僚下殿左右相向立皇帝戴幡勝等第賜幡勝臣僚簪畢皇帝於土牛前上香三奠酒不拜教坊動樂侍儀使跪進綵杖皇帝鞭土牛可矮墩以上北南臣僚丹墀內合班跪左膝受綵杖直起再拜贊各祗候司辰報春至鞭土牛三匝矮墩鞭止引節度使以上上殿撒穀豆擊土牛撒穀豆許衆奪之臣僚依位坐酒兩行春盤入酒三行畢行茶皆起禮畢重午儀至日臣僚昧爽赴御帳皇帝繫長壽綵縷昇車坐引北南臣僚合班如丹墀之儀所司各賜壽縷揖臣僚跪受再拜引退從駕至饍所酒三行若賜宴臨時聽敕重九儀北南臣僚旦赴御帳從駕至圍場賜茶皇帝就坐引臣僚御前班立所司各賜菊花酒跪受再拜酒三行揖起藏鬮儀至日北南臣僚常服入朝皇帝御天祥殿臣僚依位賜坐契丹南面漢人北面分朋行鬮或五或七籌賜饍入食畢皆起頃之復坐行鬮如初晚賜茶三籌或五籌罷教坊承應若帝得鬮臣僚進酒訖以次賜酒大康十年十二月二十二日始行是儀是日不御朝歲時雜儀正旦國俗以糯飯和白羊髓為餅丸之若拳每帳賜四十九枚戊夜各於帳內窗中擲丸於外數偶動樂飲宴數奇令巫十有二人鳴鈴執箭繞帳歌呼帳內爆鹽壚中燒地拍鼠謂之驚鬼居七日乃出國語謂正旦為廼捏咿唲廼正也捏咿唲旦也立春婦人進春書刻青繒為幟像龍御之或為蟾蜍書幟曰宜春人日凡正月之日一雞二狗三豕四羊五馬六牛七日為人其占晴為祥陰為災俗煎餅食於庭中謂之薰天二月一日為中和節國舅族蕭氏設宴以延國族耶律氏歲以為常國語是日為里尀里請也尀時也讀若狎尀讀若頗二月八日為悉達太子生辰京府及諸州雕木為像儀仗百戲導從循城為樂悉達太子者西域淨梵王子姓瞿曇氏名釋迦牟尼以其覺性稱之曰佛三月三日為上巳國俗刻木為兔分朋走馬射之先中者勝負朋下馬列跪進酒勝朋馬上飲之國語謂是日為陶里樺陶里兔也樺射也五月重五日午時採艾葉和綿著衣七事以奉天子北南臣僚各賜三事君臣宴樂渤海膳夫進艾餻以五綵絲為索纏臂謂之合歡結又以綵絲宛轉為人形簪之謂之長命縷國語謂是日為討賽咿唲討五賽咿唲月也夏至之日俗謂之朝節婦人進綵扇以粉脂囊相贈遺六月十有八日國俗耶律氏設宴以延國舅族蕭氏亦謂之里尀七月十三日夜天子於宮西三十里卓帳宿焉前期備酒饌翼日諸軍部落從者皆動蕃樂飲宴至暮乃歸行宮謂之迎節十五日中元動漢樂大宴十六日昧爽復往西方隨行諸軍部落大譟三謂之送節國語謂之賽咿唲奢奢好也八月八日國俗屠白犬於寢帳前七步瘞之露其喙後七日中秋移寢帳於其上國語謂之捏褐耐捏褐犬也耐首也九月重九日天子率羣臣部族射虎少者為負罰重九宴射畢擇高地卓帳賜蕃漢臣僚飲菊花酒兔肝為臡鹿舌為醬又研茱萸酒洒門戶以禬禳國語謂是日為必里遲離九月九日也歲十月五京進紙造小衣甲槍刀器械萬副十五日天子與羣臣望祭木葉山用國字書狀並焚之國語謂之戴辣戴燒也辣甲也冬至日國俗屠白羊白馬白雁各取血和酒天子望拜黑山黑山在境北俗謂國人魂魄其神司之猶中國之岱宗云每歲是日五京進紙造人馬萬餘事祭山而焚之俗甚嚴畏非祭不敢近山臘辰日天子率北南臣僚並戎服戊夜坐朝作樂飲酒等第賜甲仗羊馬國語謂是日為炒伍侕尀炒伍侕戰也再生儀凡十有二歲皇帝本命前一年季冬之月擇吉日前期禁門北除地置再生室母后室先帝神主輿在再生室東南倒植三岐木其日以童子及產醫嫗置室中一婦人執酒一叟持矢立於室外有司請神主降輿致奠奠訖皇帝出寢殿詣再生室羣臣奉迎再拜皇帝入室釋服跣以童子從三過岐木之下每過產醫嫗致詞拂拭帝躬童子過岐木七皇帝臥木側叟擊箙曰生男矣太巫幪皇帝首興羣臣稱賀再拜產醫嫗受酒于執酒婦以進太巫奉襁褓綵結等物贊祝之預選七叟各立御名繫于綵皆跪進皇帝選嘉名受之賜物再拜退羣臣皆進襁褓綵結等物皇帝拜先帝諸御容遂宴羣臣善哉阻午可汗之垂訓後嗣也孺子無不慕其親者嗜欲深而愛淺妻子具而孝衰人人皆然而況天子乎再生之儀歲一周星使天子一行是禮以起其孝心夫體之也真則其思之也切孺子之慕將有油然發于中心者感發之妙非言語文字之所能及善哉阻午可汗之垂訓後嗣也始之以三過岐木母氏劬勞能無念乎終之以拜先帝御容敬承宗廟宜何如哉詩曰無念爾祖聿修厥德
