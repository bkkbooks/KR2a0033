body:
  text: 遼史卷八本紀第八景宗上景宗孝成康靖皇帝諱賢字賢寧小字明扆世宗皇帝第二子母曰懷節皇后蕭氏察割之亂帝甫四歲穆宗即位養永興宮既長穆宗酗酒怠政帝一日與韓匡嗣語及時事耶律賢適止之帝悟不復言應曆十九年春二月戊辰入見穆宗曰吾兒已成人可付以政己巳穆宗遇弒帝率飛龍使女里侍中蕭思溫南院樞密使高勳率甲騎千人馳赴黎明至行在哭之慟羣臣勸進遂即皇帝位於柩前百官上尊號曰天贊皇帝大赦改元保寧以殿前都點檢耶律夷臘右皮室詳穩蕭烏里只宿衞不嚴斬之三月丙戌入上京以蕭思溫為北院樞密使太平王罨撒葛亡入沙沱己丑夷離畢粘木袞以陰附罨撒葛伏誅癸巳罨撒葛入朝甲午以北院樞密使蕭思溫兼北府宰相己亥南院樞密使高勳封秦王夏四月戊申朔進封太平王罨撒葛為齊王改封趙王喜隱為宋王封隆先為平王稍為吳王道隱為蜀王必攝為越王敵烈為冀王宛為衞王五月戊寅立貴妃蕭氏為皇后丙申朔射柳祈雨有司請以帝生日為天清節從之壬寅漢遣李匡弼劉繼文李元素等來賀冬十月東幸褭潭十一月甲辰朔行柴冊禮祠木葉山駐蹕鶴谷乙巳蕭思溫封魏王北院大王屋質加于越二年春正月丁未如潢河夏四月幸東京致奠于讓國皇帝及世宗廟五月癸丑西幸乙卯次盤道嶺盜殺北院樞密使蕭思溫六月還上京秋七月以右皮室詳穩賢適為北院樞密使九月辛丑得國舅蕭海只及海里殺蕭思溫狀皆伏誅流其弟神覩于黃龍府冬十二月庚午漢遣使來貢三年春正月甲寅右夷離畢奚底遣人獻敵烈俘詔賜有功將士庚申置登聞鼓院辛酉南京統軍使魏國公韓匡美封鄴王二月癸酉東幸壬午遣鐸遏使阿薩蘭回鶻己丑以青牛白馬祭天地三月丁未以飛龍使女里為契丹行宮都部署夏四月丁卯世宗妃啜里及蒲哥厭魅賜死己卯祠木葉山行再生禮丙戌至自東幸戊子蕭神覩伏誅六月丙子漢遣使問起居自是繼月而至丁丑回鶻遣使來貢秋七月辛丑以北院樞密使賢適為西北路招討使八月甲戌如秋山辛卯祭皇兄吼墓追冊為皇太子諡莊聖九月乙巳賜傅父侍中達里迭太保楚補太保婆兒保母回室押雅等戶口牛羊有差又以潛邸給使者為撻馬部置官掌之壬子幸歸化州甲寅如南京冬十月己巳以黑白羊祀神癸未漢遣使來貢丙戌鼻骨德吐谷渾來貢十一月庚子臚朐河于越延尼里等率戶四百五十來附乞隸宮籍詔留其戶分隸敦睦積慶永興三宮優賜遣之十二月癸酉以青牛白馬祭天地己丑皇子隆緒生是冬駐蹕金川四年春二月癸亥漢以皇子生遣使來賀閏月戊申齊王罨撒葛薨三月庚申朔追冊為皇太叔夏四月庚寅朔追封蕭思溫為楚國王是夏駐蹕冰井秋七月如雲州丁丑鼻骨德來貢冬十月丁亥朔如南京十二月甲午詔內外官上封事五年春正月甲子惕隱休哥伐党項破之以俘獲之數來上漢遣使來貢庚午御五鳳樓觀燈二月丁亥近侍實魯里誤觸神纛法論死杖釋之壬辰越王必攝獻党項俘獲之數戊申以青牛白馬祭天地辛亥幸新城三月乙卯朔復幸新城追封皇后祖胡母里為韓王贈伯胡魯古兼政事令尼古只兼侍中夏四月丙申白氣晝見五月癸亥于越屋質薨輟朝三日辛未女直侵邊殺都監達里迭拽剌斡里魯驅掠邊民牛馬己卯阿薩蘭回鶻來貢六月庚寅女直宰相及夷離菫來朝丙申漢遣人以宋事來告秋七月庚辰以保大軍節度使耶律斜里底為中臺省左相是月駐蹕燕子城九月壬子鼻骨德部長曷魯撻覽來貢冬十月丁酉如南京十一月辛亥朔始獲應曆逆黨近侍小哥花哥辛古等誅之十二月戊戌漢將改元遣使禀命是月如歸化州六年春正月癸未幸南京三月宋遣使請和以涿州刺史耶律昌朮加侍中與宋議和夏四月宋王喜隱坐謀反廢秋七月丁未朔閤門使酌古加檢校太尉兼御史大夫男海里以告喜隱事遙授隴州防禦使庚申獵于平地松林冬十月乙亥朔還上京十二月戊子以沙門昭敏為三京諸道僧尼都總管加兼侍中七年春正月甲戌朔宋遣使來賀壬寅望祠木葉山二月癸亥漢雁門節度使劉繼文來朝貢方物丙寅以青牛白馬祭天地三月壬午耶律速撒等獻党項俘分賜羣臣夏四月遣郎君矧思使宋己酉祠木葉山辛亥射柳祈雨如頻蹕淀清暑五月丙戌祭神姑秋七月黃龍府衞將燕頗殺都監張琚以叛遣敞史耶律曷里必討之九月敗燕頗於治河遣其弟安摶追之燕頗走保兀惹城安摶乃還以餘黨千餘戶城通州是秋至自頻蹕淀冬十月鈎魚土河八年春正月癸酉宋遣使來聘二月壬寅諭史舘學士書皇后言亦稱朕暨予著為定式三月辛未遣五使廉問四方魚眾寡孤獨及貧乏失職者振之夏六月以西南面招討使耶律斜軫為北院大王秋七月丙寅朔寧王只沒妻安只伏誅只沒高勳等除名辛未宋遣使來賀天清節八月癸卯漢遣使言天清節設無遮會飯僧祝釐丁未如秋山己酉漢以宋事來告是月女直侵貴德州東境九月己巳謁懷陵辛未東京統軍使察鄰詳穩涸奏女直襲歸州五寨剽掠而去乙亥鼻骨德來貢壬午漢為宋人所侵遣使求援命南府宰相耶律沙冀王敵烈赴之戊子漢以宋師壓境遣駙馬都尉盧俊來告冬十月辛丑漢以遼師退宋軍來謝十一月丙子宋主匡胤殂其弟炅自立遣使來告辛卯遣郎君王六撻馬涅木古等使宋弔慰十二月壬寅遣蕭只古馬哲賀宋即位丁未漢以宋軍復至掠其軍儲來告且乞賜糧為助戊午詔南京復禮部貢院是月轄戞斯國遣使來貢
