body:
  text: 遼史卷三十九志第九地理志三中京道中京大定府虞為營州夏屬冀州周在幽州之分秦郡天下是為遼西漢為新安平縣漢末步奚居之幅員千里多大山深谷阻險足以自固魏武北征縱兵大戰降者二十餘萬去之松漠其後拓拔氏乘遼建牙於此當饒樂河水之南溫渝河水之北唐太宗伐高麗駐蹕於此部帥蘇支從征有功奚長可度率衆內附為置饒樂都督府咸通以後契丹始大奚族不敢復抗太祖建國舉族臣屬聖宗嘗過七金山土河之濱南望雲氣有郛郭樓闕之狀因議建都擇良工於燕薊董役二歲郛郭宮掖樓閣府庫市肆廊廡擬神都之制統和二十四年五帳院進故奚王牙帳地二十五年城之實以漢戶號曰中京府曰大定皇城中有祖廟景宗承天皇后御容殿城池湫濕多鑿井泄之人以為便大同驛以待宋使朝天舘待新羅使來賓舘待夏使有七金山馬盂山雙山松山土河統州十縣九大定縣白霫故地以諸國俘戶居之長興縣本漢賓從縣以諸部人居之富庶縣本漢新安平地開泰二年析京民置勸農縣本漢賓從縣地開泰二年析京民置文定縣開泰二年析京民置升平縣開泰二年析京民置歸化縣本漢柳城縣地神水縣本漢徒河縣地開泰二年置金源縣本唐青山縣境開泰二年析京民置恩州懷德軍下刺史本漢新安平縣地太宗建州開泰中以渤海戶實之初隸永興宮後屬中京統縣一恩化縣開泰中渤海人戶置惠州惠和軍中刺史本唐歸義州地太祖俘漢民數百戶兔麛山下創城居之置州屬中京統縣一惠和縣聖宗遷上京惠州民括諸宮院落帳戶置高州觀察唐信州之地萬歲通天元年以契丹室活部置開泰中聖宗伐高麗以俘戶置高州有平頂山灤河屬中京統縣一三韓縣辰韓為扶餘弁韓為新羅馬韓為高麗開泰中聖宗伐高麗俘三國之遺人置縣戶五千武安州觀察唐沃州地太祖俘漢民居木葉山下因建城以遷之號杏堝新城復以遼西戶益之更曰新州統和八年改今名初刺史後升有黃柏嶺裊羅水箇沒里水屬中京統縣一沃野縣利州中觀察本中京阜俗縣統和二十六年置刺史州開泰元年升屬中京統縣一阜俗縣唐末契丹漸熾役使奚人遷居琵琶川統和四年置縣初隸彰愍宮更隸中京後置州仍屬中京榆州高平軍下刺史本漢臨渝縣地後隸右北平驪城縣唐載初二年析慎州置黎州處靺鞨部落後為奚人所據太宗南征橫帳解里以所俘鎮州民置州開泰中沒入屬中京統縣二和衆縣本新黎縣地永和縣本漢昌城縣地統和二十二年置澤州廣濟軍下刺史本漢土垠縣地太祖俘蔚州民立寨居之採煉陷河銀冶隸中京留守司開泰中置澤州有松亭關神山九宮嶺石子嶺灤河撒河屬中京統縣二神山縣神山在西南灤河縣本漢徐無縣地屬永興宮北安州興化軍上刺史本漢女祁縣地屬上谷郡晉為馮跋所據唐為奚王府西省地聖宗以漢戶置北安州屬中京統縣一興化縣本漢且居縣地潭州廣潤軍下刺史本中京之龍山縣開泰中置州仍屬中京統縣一龍山縣本漢交黎縣地開泰二年以習家寨置松山州勝安軍下刺史開泰中置統和八年省復置屬中京統縣一松山縣本漢文成縣地邊松漠商賈會衝開泰二年置縣有松山川宋王曾上契丹事曰出燕京北門至望京舘五十里至順州七十里至檀州漸入山五十里至金溝舘將至舘川原平曠謂之金溝淀自此入山詰曲登陟無復里堠但以馬行記日約其里數九十里至古北口兩傍峻崖僅容車軌又度德勝嶺盤道數層俗名思鄉嶺八十里至新舘過雕窠嶺偏槍嶺四十里至臥如來舘過烏灤河東有灤州又過摸斗嶺一名渡雲嶺芹菜嶺七十里至柳河舘松亭嶺甚險峻七十里至打造部落舘東南行五十里至牛山舘八十里至鹿兒峽舘過蝦蟆嶺九十里至鐵漿舘過石子嶺自此漸出山七十里至富谷舘八十里至通天舘二十里至中京大定府城垣卑小方圓纔四里許門但重屋無築闍之制南門曰朱夏門內通步廊多坊門又有市樓四曰天方大衢通闤望闕次至大同舘其門正北曰陽德閶闔城內西南隅岡上有寺城南有園圃宴射之所自過古北口居人草庵板屋耕種但無桑柘所種皆從壠上虞吹沙所壅山中長松鬱然深谷中時見畜牧牛馬橐駝多青羊黃豕成州興府軍節度晉國長公主以媵戶置軍曰長慶隸上京復改軍名統縣一同昌縣興中府本霸州彰武軍節度古孤竹國漢柳城縣地慕容皝以柳城之北龍山之南福德之地乃築龍城構宮廟改柳城為龍城縣遂遷都號曰和龍宮慕容垂復居焉後為馮跋所滅元魏取為遼西郡隋平高保寧置營州煬帝廢州置柳城郡唐武德初改營州總管府尋為都督府萬歲通天中陷李萬榮神龍初移府幽州開元四年復治柳城八年西徙漁陽十年還柳城後為奚所據太祖平奚及俘燕民將建城命韓知方擇其處乃完葺柳城號霸州彰武軍節度統和中制置建霸宜錦白川等五州尋落制置隸積慶宮後屬興聖宮重熙十年升興中府有大華山小華山香高山麝香崖天授皇帝刻石在焉駐龍峪神射泉小靈河統州二縣四興中縣本漢柳城縣地太祖掠漢民居此建霸城縣重熙中置府更名營丘縣析霸城置象雷縣開泰二年以麥務川置初隸中京後屬閭山縣本漢且慮縣開泰二年以羅家軍置隸中京後屬安德州化平軍下刺史以霸州安德縣置來屬統縣一安德縣統和八年析霸城東南龍山徒河境戶置初隸乾州更屬霸州置州來屬黔州阜昌軍下刺史本漢遼西郡地太祖平渤海以所俘戶居之隸黑水河提轄司安帝置州析宜霸二州漢戶益之初隸永興宮更隸中京後置府來屬統縣一盛吉縣太祖平渤海俘興州盛吉縣民來居因置縣宜州崇義軍上節度本遼西纍縣地東丹王每秋畋于此興宗以定州俘戶建州有墳山松柏連亙百餘里禁樵採淩河累石為堤隸積慶宮統縣二弘政縣世宗以定州俘戶置民工織多技巧聞義縣世宗置初隸海北州後來屬錦州臨海軍中節度本漢遼東無慮縣慕容皝置西樂縣太祖以漢俘建州有大胡僧山小胡僧山大查牙山小查牙山淘河島隸弘義宮統州一縣二永樂縣安昌縣巖州保肅軍下刺史本漢海陽縣地太祖平渤海遷漢戶雜居興州境聖宗於此建城焉隸弘義宮來屬統縣一興城縣川州長寧軍中節度本唐青山州地太祖弟明王安端置會同三年詔為白川州安端子察割以大逆誅沒入省曰川州初隸崇德宮統和中屬文忠王府統縣三弘理縣統和八年以諸宮提轄司戶置咸康縣宜民縣統和中置建州保靜軍上節度唐武德中置昌樂縣太祖完葺故壘置州漢乾祐元年故石晉太后詣世宗求於漢城側耕墾自贍許於建州南四十里給地五十頃營構房室創立宗廟州在靈河之南屢遭水害聖宗遷於河北唐崇州故城初名武寧軍隸永興宮後屬敦睦宮統縣二永霸縣永康縣本唐昌黎縣地來州歸德軍下節度聖宗以女直五部歲饑來歸置州居之初刺史後升隸永興宮有三州山六州山五脂山統州二縣一來賓縣本唐來遠縣地隰州平海軍下刺史慕容皝置集寧縣聖宗括帳戶遷信州大雪不能進建城於此置焉隸興聖宮來屬統縣一海濱縣本漢縣瀕海地多鹵置鹽場於此遷州興善軍下刺史本漢陽樂縣地聖宗平大延琳遷歸州民置來屬有箭笴山統縣一遷民縣潤州海陽軍下刺史聖宗平大延琳遷寧州之民居此置州統縣一海陽縣本漢陽樂縣地遷潤州本東京城內渤海民戶因叛移於此
