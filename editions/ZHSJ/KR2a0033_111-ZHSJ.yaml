body:
  text: 遼史卷百十一列傳第四十一姦臣下蕭余里也耶律合魯蕭得𩹉特蕭訛都斡蕭達魯古耶律塔不也蕭圖古辭蕭余里也字訛都椀國舅阿剌次子便佞滑稽善女工重熙間以外戚進清寧初補祗候郎君尚鄭國公主拜駙馬都尉累遷南面林牙以父阿剌為蕭革所譖出余里也為奉先軍節度使十年冬召為北面林牙咸雍中會有告余里也與族人朮哲謀害耶律乙辛按無狀出為寧遠軍節度使自後余里也揣乙辛意傾心事之薦為國舅詳穩大康初封遼西郡王時乙辛擅恣凡不附己者出之乃引余里也為北府宰相兼知契丹行宮都部署事及乙辛謀構皇太子余里也多助成之遂知北院樞密事賜推誠崙頁贊功臣以女姪妻乙辛子綏也恃勢橫肆至有無君之語朝野側目帝出乙辛知南院大王事坐與乙辛黨以天平軍節度使歸第尋拜西北路招討使以母憂去官卒耶律合魯字胡都菫六院舍利褭古直之後柔佞喜苟合仕清寧初時乙辛引用羣小合魯附之遂見委任俄擢南面林牙乙辛譖皇太子殺忠直合魯多預其謀弟吾也亦黨乙辛時號二賊乙辛薦為北院大王卒吾也亦至南大王蕭得𩹉特遙輦洼可汗宮分人善阿意順色清寧初乙辛用事甚見引用累遷北面林牙同知北院宣徽使事及皇太子廢遣得𩹉特監送上京得𩹉特促其行不令下車起居飲食數加陵侮至則築圜堵囚之大康中遷西南招討使歷順義軍節度使轉國舅詳穩壽隆五年坐怨望以老免死闔門籍興聖宮貶西北統軍司卒二子得末訛里乾統間以父與乙辛謀伏誅蕭訛都斡國舅少父房之後咸雍中補牌印郎君大康三年樞密使乙辛陰懷逆謀乃令護衞太保耶律查剌誣告耶律撒剌等廢立事詔按無狀皆補外頃之訛都斡希乙辛意欲實其事與耶律塔不也等入闕誣首耶律撒剌等謀害乙辛欲立皇太子事臣亦預謀今不自言恐事泄連坐帝果怒徙皇太子于上京訛都斡尚皇女趙國公主為駙馬都尉後與乙辛議不合銜之復以車服僭擬人主被誅訛都斡臨刑語人曰前告耶律撒剌事皆乙辛教我恐事彰殺我以滅口耳蕭達魯古遙輦嘲古可汗宮分人性姦險清寧間乙辛為樞密使竊權用事陰懷逆謀達魯古比附之遂見奬拔稍遷至旗鼓拽剌詳穩乙辛欲害太子以達魯古兇果可使遣與近侍直長撒把詣上京同留守蕭撻得夜引力士至囚室紿以有赦召太子出殺之函其首以歸詐云疾薨以達魯古為國舅詳穩達魯古恐殺太子事白出入常佩刀有急召即欲自殺乾統間詔樞密使耶律阿思大索乙辛黨人達魯古以賂獲免後以疾卒耶律塔不也仲父房之後以善擊鞠幸於上凡馳騁鞠不離杖咸雍初補祗候郎君與耶律乙辛善故內外畏之及太子被譖按無迹塔不也附乙辛欲實其誣與訛都斡等密奏太子謀亂事本實臣不首恐事覺連坐帝信之廢太子改延慶宮副使壽隆元年為行宮都部署天祚嗣位以塔不也黨乙辛出為特免部節度使及樞密使耶律阿思大索乙辛舊黨塔不也以賂獲免徙敵烈部節度使復為敦睦宮使天慶元年出為西北路招討使以疾卒蕭圖古辭字何寧楮特部人仕重熙中以能稱累遷左中丞清寧初歷北面林牙改北院樞密副使辨敏善伺顏色應對合上意皇太后嘗曰有大事非耶律化哥蕭圖古辭不能決眷遇日隆知北院樞密使事六年出知黃龍府八年拜南府宰相頃之為北院樞密使詔許便宜從事為人姦佞有餘好聚歛專愎變更法度為樞密數月所薦引多為重元黨與由是免為庶人後沒入興聖宮卒論曰舜流共工孔子誅少正卯治姦之法嚴矣後世不是之察反以為忠而信任之不至於流毒宗社而未已道宗之於乙辛是也當其留仁先討重元若真為國計者不知包藏禍心待時而發耳一旦專權又得孝傑燕哥十三為之腹心故肆惡而無忌憚始誣皇后又殺太子及其妃其禍之酷良可悲哉嗚呼君之所親莫皇后太子若也姦臣殺之而不知羣臣言之而不悟一時忠讜廢戮幾盡雖黑山親見官屬之盛僅削一字王號至私藏甲兵然後誅之吁乙辛之罪固非一死可謝天下抑亦道宗不明無斷有以養成之也如蕭余里也輩忘君黨惡以饕富貴雖幸而死諸下其得免於遺臭之辱哉
