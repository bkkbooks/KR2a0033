body:
  text: 遼史卷七十二列傳第二宗室義宗倍子平王隆先晉王道隱章肅皇帝李胡子宋王喜隱順宗濬晉王敖盧斡義宗名倍小字圖欲太祖長子母淳欽皇后蕭氏幼聰敏好學外寬內摯神冊元年春立為皇太子時太祖問侍臣曰受命之君當事天敬神有大功德者朕欲祀之何先皆以佛對太祖曰佛非中國教倍曰孔子大聖萬世所尊宜先太祖大悅即建孔子廟詔皇太子春秋釋奠嘗從征烏古党項為先鋒都統及經略燕地太祖西征留倍守京師因陳取渤海計天顯元年從征渤海拔扶餘城上欲括戶口倍諫曰今始得地而料民民必不安若乘破竹之勢徑造忽汗城克之必矣太祖從之倍與大元帥德光為前鋒夜圍忽汗城大諲譔窮蹙請降尋復叛太祖破之改其國曰東丹名其城曰天福以倍為人皇王主之仍賜天子冠服建元甘露稱制置左右大次四相及百官一用漢法歲貢布十五萬端馬千匹上諭曰此地瀕海非可久居留汝撫治以見朕愛民之心駕將還倍作歌以獻陛辭太祖曰得汝治東土吾復何憂倍號泣而出遂如儀坤州未幾諸部多叛大元帥討平之太祖訃至倍即日奔赴山陵倍知皇太后意欲立德光乃謂公卿曰大元帥功德及人神中外攸屬宜主社稷乃與羣臣請於太后而讓位焉於是大元帥即皇帝位是為太宗太宗既立見疑以東平為南京徙倍居之盡遷其民又置衞士陰伺動靜倍既歸國命王繼遠撰建南京碑起書樓于西宮作樂田園詩唐明宗聞之遣人跨海持書密召倍倍因畋海上使再至倍謂左右曰我以天下讓主上今反見疑不如適他國以成吳太伯之名立木海上刻詩曰小山壓大山大山全無力羞見故鄉人從此投外國高美人載書浮海而去唐以天子儀衞迎倍倍坐船殿衆官陪列上壽至汴見明宗明宗以莊宗后夏氏妻之賜姓東丹名之曰慕華改瑞州為懷化軍拜懷化軍節度使瑞慎等州觀察使復賜姓李名贊華移鎮滑州遙領虔州節度使倍雖在異國常思其親問安之使不絕後明宗養子從珂弒其君自立倍密報太宗曰從珂弒君盍討之及太宗立石敬瑭為晉主加兵于洛從珂欲自焚召倍與俱倍不從遣壯士李彥紳害之時年三十八有一僧為收瘞之敬瑭入洛喪服臨哭以王禮權厝後太宗改葬于醫巫閭山諡曰文武元皇王世宗即位諡讓國皇帝陵曰顯陵統和中更諡文獻重熙二十年增諡文獻欽義皇帝廟號義宗及諡二后曰端順曰柔貞倍初市書至萬卷藏于醫巫閭絕頂之望海堂通陰陽知音律精醫藥砭焫之術工遼漢文章嘗譯陰符經善畫本國人物如射騎獵雪騎千鹿圖皆入宋秘府然性刻急好殺婢妾微過常加刲灼夏氏懼而求削髮為尼五子長世宗次婁國稍隆先道隱各有傳平王隆先字團隱母大氏景宗即位始封平王未幾兼政事令留守東京薄賦稅省刑獄恤魚眾寡數薦賢能之士後與統軍耶律室魯同討高麗有功還薨葬醫巫閭山之道隱谷平王為人聰明博學能詩有閬苑集行于世保寧之季其子陳哥與渤海官屬謀殺其父舉兵作亂上命轘裂于市晉王道隱字留隱母高氏道隱生于唐人皇王遭李從珂之害時年尚幼洛陽僧匿而養之因名道隱太宗滅唐還京詔賜外羅山地居焉性沉靜有文武才時人稱之景宗即位封蜀王為上京留守乾亨元年遷守南京號令嚴肅民獲安業居數年徙封荊王統和初病薨追封晉王論曰自古新造之國一傳而太子讓豈易得哉遼之義宗可謂盛矣然讓而見疑豈不兆於建元稱制之際乎斯則一時君臣昧於禮制之過也束書浮海寄跡他國思親不忘問安不絕其心甚有足諒者焉觀其始慕泰伯之賢而為遠適之謀終疾陳之惡而有請討之舉志趣之卓蓋已見於早歲先祀孔子之言歟善不令終天道難詰得非性卞嗜殺之所致也雖然終遼之代賢聖繼統皆其子孫至德之報昭然在茲矣章肅皇帝小字李胡一名洪古字奚隱太祖第三子母淳欽皇后蕭氏少勇悍多力而性殘酷小怒輒黥人面或投水火中太祖嘗觀諸子寢李胡縮項臥內曰是必在諸子下又嘗大寒命三子採薪太宗不擇而取最先至人皇王取其乾者束而歸後至李胡取少而棄多既至袖手而立太祖曰長巧而次成少不及矣而母篤愛李胡天顯五年遣徇地代北攻寰州多俘而還遂立為皇太弟兼天下兵馬大元帥太宗親征常留守京師世宗即位鎮陽太后怒遣李胡將兵擊之至泰德泉為安端留哥所敗太后與世宗隔潢河而陣各言舉兵意耶律屋質入諫太后曰主上已立宜許之時李胡在側作色曰我在兀欲安得立屋質曰奈公酷暴失人心何太后顧李胡曰昔我與太祖愛汝異於諸子諺云偏憐之子不保業難得之婦不主家我非不欲立汝汝自不能矣及會議世宗使解劍而言和約既定趨上京會有告李胡與太后謀廢立者徙李胡祖州禁其出入穆宗時其子喜隱謀反辭逮李胡囚之死獄中年五十葬玉峯山西谷統和中追諡欽順皇帝重熙二十一年更諡章肅后曰和敬二子宋王喜隱衞王宛喜隱字完德雄偉善騎射封趙王應曆中謀反事覺上臨問有狀以親釋之未幾復反下獄景宗即位聞有赦自去其械而朝上怒曰汝罪人何得擅離禁所詔誅守者復置于獄及改元保寧乃宥之妻以皇后之姊復爵王宋喜隱輕僄無恆小得志即驕上嘗召不時至怒而鞭之由是憤怨謀亂貶而復召適見上與劉繼元書辭意卑遜諫曰本朝於漢為祖書旨如此恐虧國體帝尋改之授西南面招討使命之河東索吐蕃戶稍見進用復誘羣小謀叛上命械其手足築圜土囚祖州宋降卒二百餘人欲劫立喜隱以城堅不得入立其子留禮壽上京留守除室擒之留禮壽伏誅賜喜隱死論曰李胡殘酷驕盈太祖知其不才而不能教太后不知其惡而溺愛之初以屋質之言定立世宗而復謀廢立子孫繼以逆誅幷及其身可哀也已夫自太祖之世剌葛安端首倡禍亂太祖既不之誅又復用之固為有君人之量然惟太祖之才足以駕馭庶乎其可也李胡而下宗王反側無代無之遼之內難與國始終厥後嗣君雖嚴法以繩之卒不可止烏虖創業垂統之主所以貽厥孫謀者可不審歟順宗名濬小字耶魯斡道宗長子母宣懿皇后蕭氏幼而能言好學知書道宗嘗曰此子聰慧殆天授歟六歲封梁王明年從上獵矢連發三中上顧左右曰朕祖宗以來騎射絕人戊灭震天下是兒雖幼不墜其風後遇十鹿射獲其九帝喜設宴八歲立為皇太子大康元年兼領北南樞密院事及母后被害太子有憂色耶律乙辛為北院樞密使常不自安會護衞蕭忽古謀害乙辛事覺下獄副點檢蕭十三謂乙辛曰臣民心屬太子公非閥閱一日若立吾輩措身何地乃與同知北院宣徽事蕭特𩹉特謀搆陷太子陰令右護衞太保耶律查剌誣告都宮使耶律撒剌知院蕭速撒護衞蕭忽古謀廢立詔按無迹不治乙辛復令牌印郎君蕭訛都斡等言查剌前告非妄臣實與謀欲殺耶律乙辛等然後立太子臣若不言恐事發連坐帝信之幽太子于別室以耶律燕哥鞫按太子具陳枉狀曰吾為儲副尚何所求公當為我辨之燕哥乃乙辛之黨易其言為發伏上大怒廢太子為庶人將出曰我何罪至是十三叱登車遣衞士闔其扉徙于上京囚圜堵中乙辛尋遣達魯古撒八往害之太子年方二十上京留守蕭撻得紿以疾薨聞上哀之命有司葬龍門山欲召其妃乙辛陰遣人殺之帝後知其寃悔恨無及諡曰昭懷太子以天子禮改葬玉峯山乾統初追尊大孝順聖皇帝廟號順宗妃蕭氏貞順皇后一子延禧即天祚皇帝論曰道宗知太子之賢而不能辨乙辛之詐竟絕父子之親為萬世惜乙辛知為一身之計不知有君臣之義豈復知有太子乎姦邪之臣亂人家國如此可不戒哉可不戒哉晉王小字敖盧斡天祚皇帝長子母曰文妃蕭氏甫髫齔馳馬善射出為大丞相耶律隆運後封晉王性樂道人善而矜人不能時宮中見讀書者輒斥敖盧斡嘗入寢殿見小底茶剌閱書因取觀會諸王至陰袖而歸之曰勿令他人見也一時號稱長者及長積有人望內外歸心保大元年南軍都統耶律余覩與其母文妃密謀立之事覺余覩降金文妃伏誅敖盧斡實不與謀免二年耶律撒八等復謀立不克上知敖盧斡得人心不忍加誅令縊殺之或勸之亡敖盧斡曰安忍為蕞爾之軀而失臣子之大節遂就死聞者傷之論曰天祚不君臣下謀立其子適以殺之敖盧斡重君父之命不亡而死申生其恭矣乎
