body:
  text: 遼史卷九十六列傳第二十六耶律仁先撻不也耶律良蕭韓家奴蕭德蕭惟信蕭樂音奴耶律敵烈姚景行耶律阿思耶律仁先字糺鄰小字查剌孟父房之後父瑰引南府宰相封燕王仁先魁偉爽秀有智略重熙三年補護衞帝與論政才之仁先以不世遇言無所隱授宿直將軍累遷殿前副點檢改鶴剌唐古部節度使俄召為北面林牙十一年陞北院樞密副使時宋請增歲幣銀絹以償十縣地產仁先與劉六符使宋仍議書貢宋難之仁先曰曩者石晉報德本朝割地以獻周人攘而取之是非利害灼然可見宋無辭以對乃定議增銀絹十萬兩匹仍稱貢既還同知南京留守事十三年伐夏留仁先鎮邊未幾召為契丹行宮都部署奏復王子班郎君及諸宮雜役十六年遷北院大王奏今兩院戶口殷庶乞免他部助役從之十八年再舉伐夏仁先與皇太弟重元為前鋒蕭惠失利于河南帝猶欲進兵仁先力諫乃止後知北院樞密使遷東京留守女直恃險侵掠不止仁先乞開山通道以控制之邊民安業封吳王清寧初為南院樞密使以耶律化哥譖出為南京兵馬副元帥守太尉更王隋六年復為北院大王民歡迎數百里如見父兄時北南院樞密官涅魯古蕭胡覩等忌之請以仁先為西北路招討使耶律乙辛奏曰仁先舊臣德冠一時不宜補外復拜南院樞密使更王許九年七月上獵太子山耶律良奏重元謀逆帝召仁先語之仁先曰此曹兇狠臣固疑之久矣帝趣仁先捕之仁先出且曰陛下宜謹為之備未及介馬重元犯帷宮帝欲幸北南院仁先曰陛下若舍扈從而行賊必躡其後且南北大王心未可知仁先子撻不也曰聖意豈可違乎仁先怒擊其首帝悟悉委仁先以討賊事乃環車為營拆行馬作兵仗率官屬近侍三十餘騎陣柢枑外及交戰賊衆多降涅魯古中矢墮馬擒之重元被傷而退仁先以五院部蕭塔剌所居最近亟召之分遣人集諸軍黎明重元率奚人二千犯行宮蕭塔剌兵適至仁先料賊勢不能久俟其氣沮攻之乃背營而陣乘便奮擊賊衆奔潰追殺二十餘里重元與數騎遁去帝執仁先手曰平亂皆卿之功也加尚父進封宋王為北院樞密使親製文以褒之詔畫灤河戰圖以旌其功咸雍元年加于越改封遼王與耶律乙辛共知北院樞密事乙辛恃寵不法仁先抑之由是見忌出為南京留守改王晉恤孤惸禁姦慝宋聞風震服議者以為自于越休哥之後惟仁先一人而已阻卜塔里干叛命仁先為西北路招討使賜鷹紐印及劍上諭曰卿去朝廷遠每俟奏行恐失機會可便宜從事仁先嚴斥候扼敵衝懷柔服從庶事整飭塔里干復來寇仁先逆擊追殺八十餘里大軍繼至又敗之別部把里斯禿沒等來救見其屢挫不敢戰而降北邊遂安八年卒年六十遺命家人薄葬弟義先信先俱有傳子撻不也撻不也字胡獨菫清寧二年補祗候郎君累遷永興宮使以平重元之亂遙授忠正軍節度使賜定亂功臣同知殿前點檢司事歷高陽臨海二軍節度使左皮室詳穩大康六年授西北路招討使率諸部酋長入朝加兼侍中自蕭敵祿為招討之後朝廷務姑息多擇柔愿者用之諸部漸至跋扈撻不也含容尤甚邊防益廢尋改西南面招討使阻卜酋長磨古斯來侵西北路招討使何魯掃古戰不利詔撻不也代之磨古斯之為酋長由撻不也所薦至是遣人誘致之磨古斯紿降撻不也逆于鎮州西南沙磧間禁士卒無得妄動敵至裨將耶律綰斯徐烈見其勢銳不及戰而走遂被害年五十八贈兼侍中諡曰貞憫撻不也少謹愿後為族嫠婦所惑出其妻終以無子人以此譏之耶律良字習撚小字蘇著帳郎君之後生於乾州讀書醫巫閭山學既博將入南山肄業友人止之曰爾無僕御驅馳千里縱聞見過人年亦垂暮今若即仕已有餘地良曰窮通命也非爾所知不聽留數年而歸重熙中補寢殿小底尋為燕趙國王近侍以家貧詔乘馬遷修起居注會獵秋山良進秋游賦上嘉之清寧中上幸鴨子河作捕魚賦由是寵遇稍隆遷知制誥兼知部署司事奏請編御製詩文目曰清寧集上命良詩為慶會集親製其序頃之為敦睦宮使兼權知皇太后宮諸局事良聞重元與子涅魯古謀亂以帝篤於親愛不敢遽奏密言於皇太后太后託疾召帝白其事帝謂良曰汝欲間我骨肉耶良奏曰臣若妄言甘伏斧鑕陛下不早備恐墮賊計如召涅魯古不來可卜其事帝從其言使者及門涅魯古意欲害之覊於帳下使者以佩刀斷帟而出馳至行宮以狀聞帝始信亂平以功遷漢人行宮都部署咸雍初同知南院樞密使事為惕隱出知中京留守事未幾卒帝嗟悼遣重臣賻祭給葬具追封遼西郡王諡曰忠成蕭韓家奴字括寧奚長渤魯恩之後性孝友太平中補祗候郎君累遷敦睦宮使伐夏為左翼都監遷北面林牙俄為南院副部署賜玉帶改奚六部大王治有聲清寧初封韓國公歷南京統軍使北院宣徽使封蘭陵郡王九年上獵太子山聞重元亂馳詣行在帝倉卒欲避于北南大王院與耶律仁先執轡固諫乃止明旦重元復誘奚獵夫來韓家奴獨出諭之曰汝曹去順効逆徒取族滅何若悔過轉禍為福獵夫投仗首服以功遷殿前都點檢封荊王賜資忠保義奉國竭貞平亂功臣咸雍二年遷西南面招討使大康初徙王吳賜白海東青鶻皇太子為乙辛誣構幽于上京韓家奴上書力言其寃不報四年復為西南面招討使例削一字王爵改王蘭陵薨子楊九終右祗候郎君班詳穩贈同中書門下平章事蕭德字特末隱楮特部人性和易篤學好禮法太平中領牌印直宿累遷北院樞密副使敷奏詳明多稱上旨詔與林牙耶律庶成修律令改契丹行宮都部署賜宮戶十有五清寧元年遷同知北院樞密使封魯國公上以德為先朝眷遇拜南府宰相五年轉南京統軍使九年復為南府宰相重元之亂推鋒力戰斬涅魯古首以獻論功封漢王咸雍初以告老歸優詔不許久之加尚父致仕卒年七十二蕭惟信字耶寧楮特部人五世祖霞賴南府宰相曾祖烏古中書令祖阿古只知平州父高八多智數博覽古今開泰初為北院承旨稍遷右夷離畢以幹敏稱拜南府宰相累遷倒塌嶺節度使知興中府復為右夷離畢陵青誘衆作亂事覺高八按之止誅首惡餘並釋之歸奏稱旨惟信資沉毅篤志于學能辨論重熙初始仕累遷左中丞十五年徙燕趙國王傅帝諭之曰燕趙左右多面諛不聞忠言浸以成性汝當以道規誨使知君父之義有不可處王邸者以名聞惟信輔導以禮十七年遷北院樞密副使坐事免官尋復職兼北面林牙清寧九年重元作亂犯灤河行宮惟信從耶律仁先破之賜竭忠定亂功臣歷南京留守左右夷離畢復為北院樞密副使大康中以老乞骸骨不聽樞密使耶律乙辛譖廢太子中外知其寃無敢言者惟信數廷爭不得復告老加守司徒卒蕭樂音奴字婆丹奚六部敞穩突呂不六世孫父拔剌三歲居父母喪毀瘠過甚養于家奴奚列阿不重熙初興宗獵奚山過拔剌所居奚列阿不言于近臣拔剌得見上年甫十歲氣象如成人帝悅之錫賚甚厚既長有遠志不樂仕進隱于奚王嶺之插合谷上以其名家又有時譽就拜舍利軍詳穩樂音奴貌偉言辨通遼漢文字善騎射擊鞠所交皆一時名士年四十始為護衞平重元之亂以功遷護衞太保改本部南剋俄為旗鼓拽剌詳穩監障海東青鶻獲白花者十三賜榾柮犀幷玉吐鶻拜五蕃部節度使卒子陽阿有傳耶律敵烈字撒懶採訪使吼五世孫寬厚好學工文詞重熙末補牌印郎君兼知起居注清寧元年稍遷同知永州事禁盜有功改北面林牙承旨九年重元作亂敵烈赴援力戰平之遙授臨海軍節度使十年徙武安州觀察使咸雍五年累遷長寧宮使撿括戶部司乾州錢帛逋負立出納經畫法公私便之大康四年為南院大王秩滿部民請留同知南京留守事有疾上命乘傳赴闕遣太醫視之遷上京留守大安中改塌母城節度使以疾致仕加兼侍中賜一品俸八年卒姚景行始名景禧祖漢英本周將應曆初來聘用敵國禮帝怒留之隸漢人宮分及景行既貴始出籍貫興中縣景行博學重熙五年擢進士乙科為將作監改燕趙國王教授不數年至翰林學士樞密副使參知政事性敦厚廉直人望歸之道宗即位多被顧問為北府宰相九年秋告歸道聞重元亂收集行旅得三百餘騎勤王比至賊已平帝嘉其忠賜以逆人財產咸雍元年出為武定軍節度使明年驛召拜南院樞密使上從容問治道引入內殿出御書及太子書示之賜什器車仗帝有意伐宋召景行問曰宋人好生邊事如何對曰自聖宗皇帝以威德懷遠宋修職貢迨今幾六十年若以細故用兵恐違先帝成約上然其言而止致仕不踰月復舊職丁家艱起復兼中書令上問古今儒士優劣占對稱旨知興中府改朔方軍節度使大康初徙鎮遼興以上京多滯獄命為留守不數月以獄空聞累乞致政不從復請許之加守太師卒遣使弔祭追封柳城郡王諡文憲壽隆五年詔為立祠耶律阿思字撒班清寧初補祗候郎君以善射掌獵事進渤海近侍詳穩重元之亂與護衞蘇射殺涅魯古賜號靖亂功臣徙契丹行宮都部署大安初為北院大王封漆水郡王壽隆元年為北院樞密使監修國史道宗崩受顧命加于越錄乙辛黨人罪重者當籍其家阿思受賂多所寬貰蕭合魯嘗言當修邊備阿思力沮其事或譏其以金賣國後以風疾失音致仕加尚父封趙王薨年八十追封齊國王論曰灤河之變重元擁兵行幄微仁先等道宗其危乎當其止幸北南院召塔剌兵以靖大難功宜居首良以反謀白太后韓家奴以逆順降奚人德與阿思殺涅魯古皆有討賊之力焉仁先齊名休哥勳德兼備此其一節歟
