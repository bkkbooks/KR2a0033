body:
  text: 遼史卷八十五列傳第十五蕭撻蕭觀音奴耶律題子耶律諧理耶律奴瓜蕭柳高勳奚和朔奴蕭塔列葛耶律撒合蕭撻凜字駝寧思溫之再從姪父朮魯列善相馬應曆間為馬羣侍中撻凜幼敦厚有才略通天文保寧初為宿直官累任劇統和四年宋楊繼業率兵由代州來侵攻陷城邑撻凜以諸軍副部署從樞密使耶律斜軫敗之擒繼業于朔州六年秋改南院都監從駕南征攻沙堆力戰被創太后嘗親臨視明年加右監門衞上將軍檢校太師遙授彰德軍節度使十一年與東京留守蕭德伐高麗破之高麗稱臣奉貢十二年夏人梗邊皇太妃受命總烏古及永興宮分軍討之撻凜為阻卜都詳穩凡軍中號令太妃並委撻凜師還以功加兼侍中封蘭陵郡王十五年敵烈部人殺詳穩而叛遁于西北荒撻凜將輕騎逐之因討阻卜之未服者諸蕃歲貢方物充于國自後往來若一家焉上賜詩嘉獎仍命林牙耶律昭作賦以述其功撻凜以諸部叛服不常上表乞建三城以絕邊患從之俄召為南京統軍使二十年復伐宋擒其將王先知破其軍于遂城下祁州上手詔獎諭進至澶淵宋主軍于城隍間未接戰撻凜按視地形取宋之羊觀鹽堆鳧雁中伏弩卒明日轊車至太后哭之慟輟朝五日子慥古南京統軍使蕭觀音奴字耶寧奚王搭紇之孫統和十二年為右祗候郎君班詳穩遷奚六部大王先是俸秩外給獐鹿百數皆取於民觀音奴奏罷之及伐宋與蕭撻凜為先鋒降祈州下德清軍上加優賞同知南院事卒耶律題子字勝隱北府宰相兀里之孫善射工畫保寧間為御盞郎君九年奉使于漢具言兩國通好長久之計其主繼元深加禮重統和二年將兵與西邊詳穩耶律速撒討陀羅斤大破之四年宋將楊繼業陷山西城邑題子從北院樞密使耶律斜軫擊之敗賀令圖於定安授西南面招討都監宋兵守蔚州急召外援題子聞之夜伏兵道傍黎明宋兵果來過未半而擊之城中軍出斜軫復邀之兩軍俱潰奔飛狐地隘不得進殺傷甚衆賀令圖復集敗卒來襲蔚州題子逆戰破之應州守將自遁進圍寰州冒矢石登城宋軍大潰當斜軫擒繼業于朔州題子功居多是年冬復與蕭撻凜由東路擊宋俘獲甚衆後聞宋兵屯易州率兵逆之至易境而卒初題子破令圖宋將有因傷而仆題子繪其狀以示宋人咸嗟神妙耶律諧理字烏古鄰突舉部人統和四年宋將楊繼業來攻山西諧理從耶律斜軫擊之常居先鋒偵候有功是歲伐宋宋人拒於滹沱河諧理率精騎便道先濟獲其將康保威以功詔世預節度使選太平元年稍遷本部節度使六年從蕭惠攻甘州不克會阻卜攻圍三剋軍諧理與都監耶律涅魯古往救至可敦城西南遇敵不能陣中流矢卒耶律奴瓜字延寧太祖異母弟南府宰相蘇之孫有膂力善調鷹隼統和四年宋楊繼業來侵奴瓜為黃皮室糺都監擊敗之盡復所陷城邑軍還加諸衞小將軍及伐宋有功遷黃皮室詳穩六年再舉將先鋒軍敗宋游兵于定州為東京統軍使加金紫崇祿大夫從奚王和朔奴伐兀惹以戰失利削金紫崇祿階十九年拜南府宰相二十一年復伐宋擒其將王繼忠于望都俘殺甚衆以功加同政事門下平章事二十六年為遼興軍節度使尋復為南府宰相開泰初加尚父卒蕭柳字徒門淳欽皇后弟阿古只五世孫幼養于伯父排押之家多知能文膂力絕人統和中叔父德臨終薦其才詔入侍衞十七年南伐宋將范庭召列方陣而待時皇弟隆慶為先鋒問諸將佐誰敢當者柳曰若得駿馬則願為之先隆慶授以甲騎柳攬轡謂諸將曰陣若動諸君急攻遂馳而前敵少却隆慶席勢攻之南軍遂亂柳中流矢裹創而戰衆皆披靡時排押留守東京奏柳為四軍兵馬都指揮使明年為北女直詳穩政濟寬猛部民畏愛遷東路統軍使秩滿百姓願留復任許之從伐高麗遇大蛇當路前驅者請避柳曰壯士安懼此拔劍斷蛇師還致仕柳好滑稽雖君臣燕飲詼諧無所忌時人比之俳優臨終謂人曰吾少有致君志不能直遂故以諧進冀萬有一補俳優名何避頃之被寢衣而坐呼曰吾去矣言訖而逝耶律觀音奴集柳所著詩千篇目曰歲寒集高勳字鼎臣晉北平王信韜之子性通敏仕晉為閤門使會同九年與杜重威來降太宗入汴授四方舘使好結權貴能服勤大臣多推譽之天祿間為樞密使總漢軍事五年劉崇遣使來求封冊詔勳冊崇為大漢神武皇帝應曆初封趙王出為上京留守尋移南京會宋欲城益津勳上書請假巡徼以擾之帝然其奏宋遂不果城十七年宋略地益津關勳擊敗之知南院樞密事景宗即位以定策功進王秦保寧中以南京郊內多𨻶地請疏畦種稻帝欲從之林牙耶律昆宣言於朝曰高勳此奏必有異志果令種稻引水為畦設以京叛官軍何自而入帝疑之不納尋遷南院樞密使以毒藥餽駙馬都尉蕭啜里事覺流銅州尋又謀害尚書令蕭思溫詔獄誅之沒其產皆賜思溫家奚和朔奴字籌寧奚可汗之裔保寧中為奚六部長統和初皇太后稱制以耶律休哥領南邊事和朔奴為南面行軍副部署四年宋曹彬米信等來侵和朔奴與休哥破宋兵于燕南手詔褒美軍還怙權撾無罪人李浩至死上以其功釋之六年冬南征將本部軍由別道進擊敵軍於狼山俘獲甚衆八年上表曰臣竊見太宗之時奚六部二宰相二常袞誥命大常袞班在酋長左右副常袞總知酋長五房族屬二宰相匡輔酋長建明善事今宰相職如故二常袞別無所掌乞依舊制從之十三年秋遷都部署伐兀惹駐于鐵驪馬數月進至兀惹城利其俘掠請降不許令急攻之城中大恐皆殊死戰和朔奴知不能克從副部署蕭德議掠地東南循高麗北界而還以地遠糧絕士馬死傷詔降封爵卒子烏也郎君班詳穩蕭塔列葛字雄隱五院部人八世祖只魯遙輦氏時嘗為虞人唐安祿山來攻只魯戰于黑山之陽敗之以功為北府宰相世預其選塔列葛仕開泰間累遷西南面招討使重熙十一年使西夏諭伐宋事約元昊出別道以會十二年改右夷離畢同知南京留守轉左夷離畢俄授東京留守以世選為北府宰相卒耶律撒合字率懶乙室部人南府宰相歐禮斯子天祿間始仕應曆中拜乙室大王兼知兵馬事乾亨初宋來侵詔以本部兵守南京與北院大王奚底統軍蕭討古等逆戰奚底等敗走獨撒合全軍還上諭之曰拒敵當如此卿勉之無憂不富貴加守太保統和間卒論曰遼在統和間數舉兵伐宋諸將如耶律諧理奴瓜蕭柳等俱有降城擒將之功最後以蕭撻為統軍直抵澶淵將與宋戰撻凜中弩我兵失倚和議始定或者天厭其亂使南北之民休息者耶
