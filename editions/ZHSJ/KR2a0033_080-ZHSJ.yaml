body:
  text: 遼史卷八十列傳第十張儉邢抱朴馬得臣蕭朴耶律八哥張儉宛平人性端売心不事外飾統和十四年舉進士第一調雲州幕官故事車駕經行長吏當有所獻聖宗獵雲中節度使進曰臣境無他產惟幕僚張儉一代之寶願以為獻先是上夢四人侍側賜食人二口至聞儉名始悟召見容止朴野訪及世務占奏三十餘事由此顧遇特異踐歷清華號稱明幹開泰中累遷同知樞密院事太平五年出為武定軍節度使移鎮大同六年入為南院樞密使帝方眷倚參知政事吳叔達與儉不相能帝怒出叔達為康州刺史拜儉左丞相封韓王帝不豫受遺詔輔立太子是為興宗賜貞亮弘靖保義守節耆德功臣拜太師中書令加尚父徙王陳重熙五年帝幸禮部貢院及親試進士皆儉發之進見不名賜詩褒美儉衣唯紬帛食不重味月俸有餘賙給親舊方冬奏事便殿帝見衣袍弊惡密令近侍以火夾穿孔記之屢見不易帝問其故儉對曰臣服此袍已三十年時尚奢靡故以此微諷喻之上憐其清貧令恣取內府物儉奉詔持布三端而出益見奬重儉弟五人上欲俱賜進士第固辭有司獲盜八人既戮之乃獲正賊家人訴寃儉三乞申理上勃然曰卿欲朕償命耶儉曰八家老稚無告少加存恤使得收葬足慰存沒矣乃從之儉在相位二十餘年裨益為多致政歸第會宋書辭不如禮上將親征幸儉第尚食先往具饌却之進葵羹乾飯帝食之美徐問以策儉極陳利害且曰第遣一使問之何必遠勞車駕上悅而止復即其第賜宴器玩悉與之二十二年薨年九十一敕葬宛平縣邢抱朴應州人刑部郎中簡之子也抱朴性穎悟好學博古保寧初為政事舍人知制誥累遷翰林學士加禮部侍郎統和四年山西州縣被兵命抱朴鎮撫之民始安加戶部尚書遷翰林學士承旨與室昉同修實錄決南京滯獄還優詔褒美十年拜參知政事以樞密使韓德讓薦按察諸道守令能否而黜陟之大協人望尋以母憂去官詔起視事表乞終制不從宰相密諭上意乃視事人以孝稱及耶律休哥留守南京又多滯獄復詔抱朴平決之人無寃者改南院樞密使卒贈侍中初抱朴與弟抱質受經于母陳氏皆以儒術顯抱質亦官至侍中時人榮之馬得臣南京人好學博古善屬文尤長於詩保寧間累遷政事舍人翰林學士常預朝議以正直稱乾亨初宋師屢犯邊命為南京副留守復拜翰林學士承旨聖宗即位皇太后稱制兼侍讀學士上閱唐高祖太宗玄宗三紀得臣乃錄其行事可法者進之及扈從伐宋進言降不可殺亡不可追二三其德者別議詔從之俄兼諫議大夫知宣徽院事時上擊鞠無度上書諫曰臣竊觀房玄齡杜如晦隋季書生向不遇太宗安能為一代名相臣雖不才陛下在東宮幸列侍從今又得侍聖讀未有裨補聖明陛下嘗問臣以貞觀開元之事臣請略陳之臣聞唐太宗侍太上皇宴罷則挽輦至內殿玄宗與兄弟歡飲盡家人禮陛下嗣祖考之祚躬侍太后可謂至孝臣更望定省之餘睦六親加愛敬則陛下親親之道比隆二帝矣臣又聞二帝耽玩經史數引公卿講學至于日昃故當時天下翕然嚮風以隆文治今陛下游心典籍分解章句臣願研究經理深造而篤行之二帝之治不難致矣臣又聞太宗射豕唐儉諫之玄宗臂鷹韓休言之二帝莫不樂從今陛下以毬馬為樂愚臣思之有不宜者三故不避斧鉞言之竊以君臣同戲不免分爭君得臣愧彼負此喜一不宜躍馬揮杖縱橫馳騖不顧上下之分爭先取勝失人臣禮二不宜輕萬乘之尊圖一時之樂萬一有銜勒之失其如社稷太后何三不宜儻陛下不以臣言為迂少賜省覽天下之福羣臣之願也書奏帝嘉歎良久未幾卒贈太子太保詔有司給葬蕭朴字延寧國舅少父房之族父勞古以善屬文為聖宗詩友朴幼如老成人及長博學多智開泰初補牌印郎君為南院承旨權知轉運事尋改南面林牙帝問以政朴具陳百姓疾苦國用豐耗帝悅曰吾得人矣擢左夷離畢時蕭合卓為樞密使朴知部署院事以酒廢事出為興國軍節度使俄召為南面林牙太平三年守太子太傅明年拜北府宰相遷北院樞密使時太平日久帝留心翰墨始畫譜牒以別嫡庶由是爭訟紛起朴有吏才能知人主意敷奏稱旨朝議多取決之封蘭陵郡王進王加中書令及大延琳叛詔安撫東京以便宜從事興宗即位皇太后稱制國事一委弟孝先方仁德皇后以馮家奴所誣被害朴屢言其寃不報每念至此為之嘔血重熙初改王韓拜東京留守及遷太后于慶州朴徙王楚升南院樞密使四年王魏薨年五十贈齊王子鐸剌國舅詳穩耶律八哥字烏古鄰五院部人幼聰慧書一覽輙成誦統和中以世業為本部吏未幾陞閘撒狘尋轉樞密院侍御會宋將曹彬米信侵燕八哥以扈從有功擢上京留守開泰四年召為北院樞密副使頃之留守東京七年上命東平王蕭排押帥師伐高麗八哥為都監至開京大掠而還濟茶陀二河高麗追兵至諸將皆欲使敵渡兩河擊之獨八哥以為不可曰敵若渡兩河必殊死戰乃危道也不若擊於兩河之間排押從之戰敗績明年還東京奏渤海承奉官宜有以統領之上從其言置都知押班後以茶陀之敗削使相降西北路都監卒論曰張儉名符帝夢遂結主知服弊袍不易志敦薄俗功著兩朝世稱賢相非過也邢抱朴甄別守令大愜人望兩決滯獄民無寃濫馬得臣引盛唐之治以諫其君蕭朴痛皇后之誣至於嘔血四人者皆以明經致位忠藎若此宜矣聖宗得人於斯為盛
