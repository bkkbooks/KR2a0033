body:
  text: 遼史卷三十一志第一營衞志上上古之世草衣木食巢居穴處熙熙于于不求不爭爰自炎帝政衰蚩尤作亂始制干戈以毒天下軒轅氏戮之涿鹿之阿處則象吻于宮行則懸旄于纛以為天下萬世戒於是師兵營衞不得不設矣冀州以南歷洪水之變夏后始制城郭其人土著而居綏服之中外奮武衞內揆文教守在四邊營衞之設以備非常而已幷營以北勁風多寒隨陽遷徙歲無寧居曠土萬里寇賊姦宄乘隙而作營衞之設以為常然其勢然也有遼始大設制尤密居有宮衞謂之斡魯出有行營謂之捺鉢分鎮邊圉謂之部族有事則以攻戰為務閑暇則以畋漁為生無日不營無在不衞立國規模莫重於此作營衞志宮衞遼國之法天子踐位置宮衞分州縣析部族設官府籍戶口備兵馬崩則扈從后妃宮帳以奉陵寢有調發則丁壯從戎事老弱居守太祖曰弘義宮應天皇后曰長寧宮太宗曰永興宮世宗曰積慶宮穆宗曰延昌宮景宗曰彰愍宮承天太后曰崇德宮聖宗曰興聖宮興宗曰延慶宮道宗曰太和宮天祚曰永昌宮又孝文皇太弟有敦睦宮丞相耶律隆運有文忠王府凡州三十八縣十提轄司四十一石烈二十三瓦里七十四抹里九十八得里二閘撒十九為正戶八萬蕃漢轉戶十二萬三千共二十萬三千戶算斡魯𩽆太祖置國語心腹曰算宮曰斡魯𩽆是為弘義宮以心腹之衞置益以渤海俘錦州戶其斡魯𩽆在臨潢府陵寢在祖州東南二十里正戶八千蕃漢轉戶七千出騎軍六千州五錦祖嚴祺銀縣一富義提轄司四南京西京奉聖州平州石烈二曰須曰速魯瓦里四曰合不曰撻撒曰慢押曰虎池抹里四曰膻曰預墩曰鶻突曰糾里闡得里二曰述壘北曰述壘南國阿輦斡魯𩽆太宗置收國曰國阿輦是為永興宮初名孤穩斡魯𩽆以太祖平渤海俘戶東京懷州提轄司及雲州懷仁縣澤州灤河縣等戶置其斡魯𩽆在游古河側陵寢在懷州南三十里正戶三千蕃漢轉戶七千出騎軍五千州四懷黔開來縣二保和灤河提轄司四南京西京奉聖州平州石烈一北女古瓦里四曰抹曰母曰合李只曰述壘抹里十三曰述壘軫曰大隔蔑曰小隔蔑曰母曰歸化不朮曰唐括曰吐谷曰百爾瓜忒曰合魯不只曰移馬不只曰膻曰清帶曰速穩閘撒七曰伯德部曰守狘曰穴骨只曰合不頻尼曰虎里狘曰耶里只挾室曰僧隱令公耶魯盌斡魯𩽆世宗置興盛曰耶魯盌是為積慶宮以文獻皇帝衞從及太祖俘戶及雲州提轄司幷高宜等州戶置其斡魯𩽆在土河東陵寢在長寧宮北正戶五千蕃漢轉戶八千出騎軍八千州三康顯宜縣一山東提轄司四石烈一兮臘瓦里八曰達撒曰合不曰吸烈曰逼里曰潭馬曰槊不曰耶里直曰耶魯兀也抹里十曰紇斯直曰蠻葛曰厥里曰潭馬忒曰出懶曰速忽魯椀曰牒里得曰閻馬曰迭里特曰女古蒲速盌斡魯𩽆應天皇太后置興隆曰蒲速盌是為長寧宮以遼州及海濱縣等戶置其斡魯𩽆在高州陵寢在龍化州東一百里世宗分屬讓國皇帝宮院正戶七千蕃漢轉戶六千出騎軍五千州四遼儀坤遼西顯縣三奉先歸義定霸提轄司四石烈一北女古瓦里六曰潭馬曰合不曰達撒曰慢押曰耶里只曰渾只抹里十三曰渾得移鄰稍瓦只曰合四卑臘因鐵里卑稍只曰奪羅果只曰拏葛只曰合里只曰婆渾昆母溫曰阿魯埃得本曰東厮里門曰西厮里門曰東钁里曰西钁里曰牒得只曰滅母鄰母奪里本斡魯𩽆穆宗置是為延昌宮討平曰奪里本以國阿輦斡魯𩽆戶及阻卜俘戶中京提轄司南京制置司咸信韓等州戶置其斡魯𩽆在糺雅里山南陵寢在京南正戶一千蕃漢轉戶三千出騎軍二千州二遂韓提轄司三中京南京平州石烈一曰須瓦里四曰抹骨古等曰兀沒曰潭馬曰合里直抹里四曰抹骨登兀沒滅曰土木直移鄰曰息州決里曰莫瑰奪石監母斡魯𩽆景宗置是為彰愍宮遺留曰監母以章肅皇帝侍衞及武安州戶置其斡魯𩽆在合魯河陵寢在祖州南正戶八千蕃漢轉戶一萬出騎軍一萬州四永龍化降聖同縣二行唐阜俗提轄司四石烈二曰監母曰南女古瓦里七曰潭馬曰奚烈曰埃合里直曰蠻雅葛曰特末曰烏也曰滅合里直抹里十一曰尼母曷烈因稍瓦直曰察改因麻得不曰移失鄰斡直曰辛古不直曰撒改真曰牙葛直曰虎狘阿里鄰曰潑昆曰潭馬曰閘臘曰楚兀真果鄰孤穩斡魯𩽆承天太后置是為崇德宮玉曰孤穩以乾顯雙三州戶置其斡魯𩽆在土河東陵祔景宗皇帝正戶六千蕃漢轉戶一萬出騎軍一萬州四乾川雙貴德縣一潞上京提轄司三南京西京奉聖州石烈三曰钁里曰滂曰迭里特女古瓦里七曰達撒曰耶里曰合不曰歇不曰合里直曰慢押曰耶里直抹里十一曰阿里厮直述壘曰預篤溫稍瓦直曰潭馬曰賃預篤溫一臘曰牙葛直曰牒得直曰虎溫曰孤溫曰撒里僧曰阿里葛斯過鄰曰鐵里乖穩钁里閘撒五曰合不直迷里幾頻你曰牒耳葛太保果直曰爪里阿本果直曰僧隱令公果直曰老昆令公果直女古斡魯𩽆聖宗置是為興聖宮金曰女古以國阿輦耶魯盌蒲速盌三斡魯𩽆戶置其斡魯𩽆在女混活直陵寢在慶州南安正戶一萬蕃漢轉戶二萬出騎軍五千州五慶隰烏上京烏東京霸提轄司四石烈四曰毫兀真女姑曰拏兀真女室曰女特里特曰女古滂瓦里六曰女古曰蒲速盌曰鶻篤曰乙抵曰蓊曰埃也抹里九曰乙辛不只曰鐵乖溫曰埃合里只曰嘲瑰曰合魯山血古只曰奪忒排登血古只曰勞骨曰虛沙曰土鄰閘撒五曰達鄰頻你曰和里懶你曰爪阿不厥真曰粘獨里僧曰袍達夫人厥只窩篤盌斡魯𩽆興宗置是為延慶宮孳息曰窩篤盌以諸斡魯𩽆及饒州戶置其斡魯𩽆在高州西陵寢在上京慶州正戶七千蕃漢轉戶一萬出騎軍一萬州三饒長春泰提轄司四石烈二曰窩篤盌曰鶻篤骨瓦里六曰窩篤盌曰厮把曰厮阿曰糺里曰得里曰歐烈抹里六曰歐里本曰燕厮曰緬四曰乙僧曰北得里曰南得里阿思斡魯𩽆道宗置是為太和宮寬大曰阿思以諸斡魯𩽆御前承應人及興中府戶置其斡魯𩽆在好水濼陵寢在上京慶州正戶一萬蕃漢轉戶二萬出騎軍一萬五千石烈二曰阿厮曰耶魯瓦里八曰阿厮曰耶魯曰得里曰糺里曰撒不曰鶻篤曰蒲速斡曰曷烈抹里七曰恩州得里曰斡奢得里曰歐里本曰特滿曰查剌土鄰曰糺里曰阿里厮迷里阿魯盌斡魯𩽆天祚皇帝置是為永昌宮輔祐曰阿魯盌以諸斡魯𩽆御前承應人春宣州戶置正戶八千蕃漢轉戶一萬出騎軍一萬石烈二曰阿魯盌曰榆魯盌瓦里八曰阿魯斡曰合里也曰鶻突曰敵剌曰謀魯斡曰糺里曰奪里剌曰特末也抹里八曰蒲速盌曰移輦曰斡篤盌曰特滿曰謀魯盌曰移典曰悅曰勃得本孝文皇太弟敦睦宮謂之赤寔得本斡魯𩽆孝曰赤寔得本文獻皇帝承應人及渤海俘建瀋巖三州戶置陵寢在祖州西南三十里正戶三千蕃漢轉戶五千出騎軍五千州三建瀋巖提轄司一南京石烈二曰嘲曰與敦瓦里六曰乙辛曰得里曰奚烈直曰大潭馬曰小潭馬曰與墩抹里二曰潭馬抹乖曰柳實閘撒二曰聶里頻你曰打里頻你大丞相晉國王耶律隆運本韓氏名德讓以功賜國姓出宮籍隸橫帳季父房賜尚書令諡文忠無子以皇族魏王貼不子耶魯為嗣早卒天祚皇帝又以皇子敖魯斡繼之官給葬具建廟乾陵側擬諸宮例建文忠王府正戶五千蕃漢轉戶八千出騎軍一萬州一提轄司六上京中京南京西京奉聖州平州著帳郎君著帳郎君初遙輦痕德堇可汗以蒲古只等三族害于越釋魯籍沒家屬入瓦里淳欽皇后宥之以為著帳郎君世宗悉免後族戚世官犯罪者沒入著帳戶著帳戶本諸斡魯𩽆析出及諸罪沒入者凡承應小底司藏鷹坊湯藥尚飲盥尚饍尚衣裁造等役及宮中親王祗從伶官之屬皆充之凡諸宮衞人丁四十萬八千騎軍十萬一千著帳釋宥沒入隨時增損無常額
