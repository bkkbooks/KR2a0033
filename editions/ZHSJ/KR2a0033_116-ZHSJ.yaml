body:
  text: 遼史卷百十六國語解史自遷固以迄晉唐其為書雄深浩博讀者未能盡曉於是裴駰顏師古李賢何超董衝諸儒訓詁音釋然後制度名物方言奇字可以一覽而周知其有助於後學多矣遼之初興與奚室韋密邇土俗言語大概近俚至太祖太宗奄有朔方其治雖參用漢法而先世奇首遙輦之制尚多存者子孫相繼亦遵守而不易故史之所載官制宮衞部族地理率以國語為之稱號不有註釋以辨之則世何從而知後何從而考哉今即本史參互研究撰次遼國語解以附其後庶幾讀者無齟齬之患云帝紀太祖紀耶律氏蕭氏本紀首書太祖姓耶律氏繼書皇后蕭氏則有國之初已分二姓矣有謂始興之地曰世里譯者以世里為耶律故國族皆以耶律為姓有謂述律皇后兄子名蕭翰者為宣武軍節度使其妹復為皇后故后族皆以蕭為姓其說與紀不合故陳大任不取又有言以漢字書者曰耶律蕭以契丹字書者曰移剌石抹則亦無可考矣霞瀨益石烈鄉名諸宮下皆有石烈設官治之彌里鄉之小者撻馬狘沙里撻馬人從也沙里郎君也管率衆人之官後有止稱撻馬者大迭烈府即迭剌部之府也初阻午可汗與其弟撒里本領之及太祖以部夷離菫即位因強大難制析為二院烈剌音相近夷離菫統軍馬大官會同初改為大王集會堝下窩陀二音地名阿主沙里阿主父祖稱惕隱典族屬官即宗正職也奚霫下音習國名中京地也黑車子國也以善製車帳得名契丹之先嘗遣人往學之于越貴官無所職其位居北南大王上非有大功德者不授鷹軍鷹鷙鳥以之名軍取捷速之義後記龍軍虎軍鐵鷂軍者倣此嗢娘改上音丸地名西樓遼有四樓在上京者曰西樓木葉山曰南樓龍化州曰東樓唐州曰北樓歲時遊獵常在四樓間阿點夷離的阿點貴稱夷離的大臣夫人之稱糺轄糺軍名轄者管束之義夷離畢即參知政事後置夷離畢院以掌刑政宋刁約使遼有詩云押宴夷離畢知其為執政官也射鬼箭凡帝親征服介冑祭諸先帝出則取死囚一人置所向之方亂矢射之名射鬼箭以祓不祥及班師則射所俘後因為刑法之用暴里惡人名也大小鵠軍二室韋軍號也神纛從者所執以旄牛尾為之纓槍屬也龍眉宮太祖取天梯蒙國別魯三山之勢于葦淀射金齪箭以識之名龍眉宮神冊三年築都城于其地臨潢府是也齪測角切箭名崤里室韋部名君基太一神福神名其神所臨之國君能建極孚于上下則治化升平民享多福撻林官名後二室韋部改為僕射又名司空舍利契丹豪民耍裹頭巾者納牛駝十頭馬百疋乃給官名曰舍利後遂為諸帳官以郎君繫之阿廬𩽆里一名阿魯敦貴顯名遼于越官兼此者惟曷魯耳選底主獄官常袞官名掌遙輦部族戶籍等事奚六部常袞掌奚之族屬諲譔渤海國主名剋釋魯剋官名釋魯人名後剋朗剋臺哂倣此烏魯古阿里只太祖及述律后受諲譔降時所乘二馬名也因賜諲譔夫婦以為名太宗紀箭笴山笴音簳胡損奚所居柴冊禮名積薪為壇受羣臣玉冊禮畢燔柴祀天阻午可汗制也遙輦氏九帳遙輦九可汗宮分北剋南剋掌軍官名猶漢南北軍之職祭麃鹿神遼俗好射麃鹿每出獵必祭其神以祈多獲林牙掌文翰官時稱為學士其羣牧所設止管簿書瑟瑟禮祈雨射柳之儀遙輦蘇可汗制再生禮國俗每十二年一次行始生之禮名曰再生惟帝與太后太子及夷離菫得行之又名覆誕神速姑宗室人名能知蛇語蒲割下乃頂切公主名也三剋統軍官猶云三帥也詳穩諸官府監治長官梯里已諸部下官也後陞司徒達剌干縣官也後陞副使麻都不縣官之佐也後陞為令馬步未詳何官以達剌干陞為之牙署官名疑即牙書石烈官也世燭遙輦帳侍中之官敞史官府之佐吏也思奴古官與敞史相近徒覩古邊徼外小國世宗穆宗紀蹛林上音帶地名即松林故地閘撒狘抹里司官亦掌宮衞之禁者撻馬扈從之官濃兀部分名葉格戲宋錢僖公家有葉子揭格之戲景宗聖宗紀飛龍使掌馬官亦為導騎橫帳德祖族屬號三父房稱橫帳宗室之尤貴者著帳凡世官之家及諸色人因事籍沒者為著帳戶官有著帳郎君杓窊印杓窊鷙鳥總稱以為印紐取疾速之義凡調發軍馬則用之與金魚符銀牌略同國舅帳剋官制有大國舅帳此則本帳下掌兵之官拜奧禮凡納后即族中選尊者一人當奧而坐以主其禮謂之奧姑送后者拜而致敬故云拜奧禮拜山禮祀木葉山之儀敞穩諸帳下官亦作常袞蓋字音相近也萬役陷河冶地名本漢土垠縣有銀礦太祖募民立寨以專採煉故名陷河冶合蘇袞女直別部名又作曷蘇館執手禮將帥有克敵功上親執手慰勞若將在軍則遣人代行執手禮優遇之意阿札割只官名位在樞密使下蓋墩官也四捷軍遼以宋降者分立二部一曰四捷軍一曰歸聖軍山金司以陰山產金置冶採煉故以名司後改統軍司興宗紀別輦斗地名虎下北潘切婆離八部人名解洗禮解裝前祓飲至之義獨盧金地名六院官屬秋冬居之行十二神纛禮神纛解見前凡大祭祀大朝會以十二纛列諸御前南撒葛栢地名合只忽里地名拖古烈地名曷里狘地名道宗紀塔里捨地名撒里乃地名三班院祗候左右班幷寄班為三班祗候官名高墩遼排班圖有高墩矮墩方墩之列自大丞相至阿札割只皆墩官也天祚紀候里吉地名頭魚宴上歲時鈎魚得頭魚輒置酒張宴與頭鵝宴同訛莎烈地名漚里謹地名懽撻新查剌地名射粮軍射請也女古底地名落昆髓地名阿里軫斗地名忽兒珊西域大軍將名起兒漫地名虎思斡魯𩽆思亦作斯有力稱斡魯𩽆宮帳名葛兒罕漠北君王稱志禮志祭東國俗凡祭皆東向故曰祭東敵烈麻都掌禮官旗鼓拽剌拽剌官名軍制有拽剌司此則掌旗鼓者也爇節歲時雜禮名九奚首奚首營帳名食羖之次大行殯出羣臣以羖羊祭于路名曰食羖之次祭上於琰切凡出征以牝牡麃各一祭之曰詛敵也勘箭車駕遠歸閤門使持雄箭勘箭官持雌箭比較相合而後入宮檐牀一人肩任曰檐兩人以手共舁曰牀攢隊士卒攢簇各為隊伍方裀𩽆殿凡御宴官卑地坐殿中方墩之上其不應升殿則賜坐左右𩽆殿地拍田鼠名正旦日上於牕間擲米團得隻數為不利則燒地拍鼠以禳之廼捏咿唲正月朔旦也里尀讀作狎尀讀作頗二月一日也六月十八日宴國舅族亦曰里尀陶里樺上巳日射兔之節名討賽咿唲重午日也賽伊唲奢日辰之好也捏褐耐犬首也必里遲離重九日也戴辣燒甲也炒伍侕尀戰名也卓帳卓立也帳氈廬也百官志石烈辛袞石烈官之長令穩官名彌里馬特本官名後陞辛袞麻普即麻都不縣官之副也初名達剌干知聖旨頭子事掌誥命奏事官提轄司諸宮典兵官皮室軍制有南北左右皮室及黃皮室皆掌精兵廳房即工部梅里貴戚官名述律皇后族有慎思梅里婆姑梅里未詳何職抹鶻瓦里司之官先離撻覽奚渤海等國官名疑即撻林字訛營衞志象吻黃帝治宮室陶蚩尤象置棟上名曰蚩吻瓦里官府名宮帳部族皆設之凡宗室外戚大臣犯罪者家屬沒入於此抹里官府名閘撒狘亦抹里官之一算斡魯𩽆算腹心拽剌也斡魯𩽆宮也已下國阿輦至監母皆斡魯𩽆名其注語則始置之義也國阿輦收國也奪里本討平也耶魯盌興旺也蒲速盌義與耶魯盌同女古金也孤穩玉也窩篤盌孳息也阿斯寬大也阿魯盌輔佑也得失得本孝也監母遺留也地理志屬珊應天皇后從太祖征討所俘人戶有技藝者置之帳下名屬珊蓋比珊瑚之寶永州其地居潢河土河二水之間故名永州蓋以字從二從水也鄚頡上慕各切下胡結切渤海郡府名且慮皆平聲興中府縣名貕養上音奚幽州澤藪名見周職方菑時幽州浸名出同上墮瑰門名遼有墮瑰部野旅寅野謂星野旅謂躔次寅者辰舍東北之位燕分析津之所也儀衞志金下祖叢切馬首飾也果下馬馬名謂果樹下可乘行者言其小也實里薛袞祭服之冠行拜山禮則服之鞢帶上他協切下徒協切武官束帶也扞腰即拄腰以鵝項鴨頭為之胡木鍪冑名馬上音誕馬不施鞍轡曰白毦音餌以白鷺羽為網又罽也兵衞志捉馬抅刷馬也欄子軍居先鋒前二十餘里偵候敵人動靜弓子鋪遼軍馬頓舍不設營塹折木稍為弓以為團集之所又諸國使來道旁簽置木稍弓以充欄楯食貨志云為戶義即營運字之訛刑法志鐘院有寃者擊鐘以達于上猶怨鼓云楚古官名掌北面訊囚者表皇子表五石烈即五院非是分院為五以五石烈為一院也六爪爪百數也遼有六百家奚後為六院義與五院同二院即迭剌部析之為二者是也裂皮牡鹿力能分牡鹿皮世表莫弗紇諸部酋長稱又云莫弗賀蠕蠕而宣切國名俟斤突厥官名遊幸表舔鹹鹿鹿性嗜鹹灑於地以誘鹿射之女瓌虞人名列傳可敦突厥皇后之稱忒里蹇遼皇后之稱耨斡麼麼亦作改耨斡后土稱麼母稱乙室拔里國舅帳二族名諸功臣傳龍錫金佩太祖從兄鐸骨札以本帳下蛇鳴命知蛇語者神速姑解之知蛇謂穴傍樹中有金往取之果得金以為帶名龍錫金撒剌酒樽名遙輦糺遙輦帳下軍也其書永興宮分糺十二行糺黃皮室糺者倣此吐里官名與奚六部禿里同吐禿字訛寢殿小底官名遼制多小底官餘不注雜丁黃禮男幼為黃四歲為小十六為中二十一為丁軍中雜幼弱以疑敵也遙輦剋遙輦帳下掌兵官柢枑宮衞門外行馬也榾柮犀千歲蛇角又為篤訥犀珠二琲下蒲味切珠五百枚為琲題里司徒題里官府名庢中上陟栗切地名堂印博之采名臨庫以帛為通曆具一庫之物盡數籍之曰臨庫堂帖遼制宰相凡除拜行頭子堂帖權差俟再取旨出給告敕故官有知頭子事見陰山雜錄夷離菫畫者畫者人名為夷離菫官虎斯有力稱紀言虎思義同修三史詔聖旨至正三年三月十四日篤憐帖木兒怯薛第三日咸寧殿𩹉有時分速古兒赤江家奴云都赤蠻子殿中俺都剌哈蠻給事中孛羅帖木兒等有來脫脫右丞相也先帖木兒平章鐵睦爾達世平章太平右丞長仙參議孛里不花郎中老老員外郎孛里不花都事等奏遼金宋三國史書不曾纂修來歷代行來的事跡合纂修成書有俺商量來如今選人將這三國行來的事迹交纂修成史不交遲滯但凡合舉行事理俺定擬了呵怎生奏呵奉聖旨那般者三月二十八日別兒怯不花怯薛第二日咸寧殿𩹉有時分速古兒赤不顏帖木兒云都赤蠻子殿中俺都剌哈蠻給事中孛羅帖木兒等有來脫脫右丞相也先帖木兒平章鐵睦爾達世平章太平右丞吳參政買朮丁參議長仙參議韓參議別里不花郎中王郎中老老員外郎孔員外郎觀音奴都事孛里不花都事杜都事直省舍人倉赤也先蒙古必闍赤鎖住都馬等奏昨前遼金宋三國行來的事跡選人交纂修成史書者麼道奏了來這三國為聖朝所取制度典章治亂興亡之由恐因歲久散失合遴選文臣分史置局纂修成書以見祖宗盛德得天下遼金宋三國之由垂鑑後世做一代盛典交翰林國史院分局纂修職專其事集賢祕書崇文幷內外諸衙門𩹉著文學博雅才德修潔堪充的人每斟酌區用纂修其間予奪議論不無公私偏正必須交總裁官質正是非裁決可否遴選位望老成長於史才為衆所推服的人交做總裁官這三國實錄野史傳記碑文行實多散在四方交行省及各處正官提調多方購求許諸人呈獻量給價直咨達省部送付史館以備采擇合用紙札筆墨一切供需物色於江西湖廣江浙河南省所轄各學院幷貢士莊錢糧除祭祀廩膳科舉修理存留外都交起解將來以備史館用度如今省𩹉脫脫右丞相監修國史做都總裁交鐵睦爾達世平章太平右丞張中丞歐陽學士呂侍御揭學士做總裁官提調官省𩹉交也先帖木兒平章吳參政樞密院𩹉塔失帖木兒同知姚副樞臺𩹉狗兒侍御張治書買朮丁參議長仙參議韓參議右司王郎中左司王郎中老老員外郎孔員外郎觀音奴都事杜都事六部各委正官幷首領官提調其餘修史的凡例合行事理交總裁官修史官集議舉行呵怎生奏呵奉聖旨那般者進遼史表開府儀同三司上柱國錄軍國重事中書右丞相監修國史領經筵事臣脫脫言竊惟天文莫驗於璣衡人文莫證於簡策人主監天象之休咎則必察乎璣衡之精監人事之得失則必考乎簡策之信是以二者所掌俱有太史之稱然天道幽而難知人情顯而易見動靜者吉凶之兆敬怠者興亡之機史臣雖述前代之設施大意有助人君之鑑戒遼自唐季基于朔方造邦本席於干戈致治能資於黼黻敬天尊祖而出入必祭親仁善鄰而和戰以宜南府治民北府治兵春狩省耕秋狩省歛吏課每嚴於芻牧歲饑屢賜乎田租至若觀市赦罪則脗合六典之規臨軒策士則恪遵三歲之制享國二百一十九載政刑日舉品式備具蓋有足尚者焉迨夫子孫失御上下離心驕盈盛而釁隙生讒賊興而根本蹙變強為弱易於反掌吁可畏哉天祚自絕大石苟延國既丘墟史亦蕪茀耶律儼語多避忌陳大任辭乏精詳五代史繫之終篇宋舊史埒諸載記予奪各徇其主傳聞況失其真我世祖皇帝一視同仁深加愍惻嘗敕詞臣撰次三史首及於遼六十餘年歲月因循造物有待臣脫脫誠惶誠恐頓首欽惟皇帝陛下如堯稽古而簡寬容衆若舜好問而濬哲冠倫講經兼誦乎祖謨訪治旁求乎往牒茲修史事斷自宸衷睿旨下而徵聘行朝士賀而遺逸起於是命臣脫脫以中書右丞相領都總裁中書平章政事臣鐵睦爾達世中書右丞今平章政事臣賀惟一御史中丞今翰林學士承旨臣張起巖翰林學士臣歐陽玄侍御史今集賢侍講學士兼國子祭酒臣呂思誠翰林侍講學士臣揭傒斯奉命為總裁官中書遴選儒臣宗文太監今兵部尚書臣廉惠山海牙翰林直學士臣王沂祕書著作佐郎臣徐昺國史院編修官臣陳繹曾分撰遼史起至正三年四月迄四年三月發故府之櫝藏集遐方之匭獻蒐羅剔抉刪潤研劘紀志表傳備成一代之書臧否是非不迷千載之實臣脫脫叨承隆寄幸覩成功載宣日月之光華願效涓埃之補報我朝之論議歸正氣之直則辭之昌遼國之君臣有知善者喜而惡者懼所撰本紀三十卷志三十二卷表八卷列傳四十六卷各著論贊具存體裁隨表以聞上塵天覽下情無任慚懼戰汗屏營之至臣脫脫誠惶誠懼頓首頓首謹言至正四年三月日開府儀同三司上柱國錄軍國重事中書右丞相監修國史領經筵事臣脫脫上表三史凡例一帝紀三國各史書法準史記西漢書新唐書各國稱號等事準南北史一志各史所載取其重者作志一表表與志同一列傳后妃宗室外戚羣臣雜傳人臣有大功者雖父子各傳餘以類相從或數人共一傳三國所書事有與本朝相關涉者當禀金宋死節之臣皆合立傳不須避忌其餘該載不盡從總裁官與修史官臨文詳議一疑事傳疑信事傳信準春秋修史官員都總裁開府儀同三司上柱國錄軍國重事中書右丞相監修國史領經筵事臣脫脫總裁官光祿大夫中書平章政事知經筵事提調都水監臣鐵睦爾達世榮祿大夫中書平章政事知經筵事臣賀惟一翰林學士承旨榮祿大夫知制誥兼修國史臣張起巖翰林學士資善大夫知制誥同修國史臣歐陽玄集賢侍講學士通奉大夫兼國子祭酒臣呂思誠翰林侍講學士中奉大夫知制誥同修國史同知經筵事臣揭傒斯纂修官正議大夫兵部尚書臣廉惠山海牙翰林直學士朝請大夫知制誥同修國史兼經筵官臣王沂文林郎秘書監著作佐郎臣徐昺將仕佐郎翰林國史院編修官臣陳繹曾提調官資德大夫中書右丞臣伯彥榮祿大夫中書左丞臣姚庸奉議大夫參議中書省事臣長仙通議大夫參議中書省事臣呂彬朝散大夫中書右司郎中臣悟良哈台嘉議大夫中書左司郎中臣趙守禮亞中大夫中書左司員外郎臣偰哲篤亞中大夫中書省左司員外郎臣何執禮儒林郎右司都事臣觀音奴奉議大夫左司都事臣烏古孫良楨嘉議大夫禮部尚書臣王守誠中憲大夫工部尚書臣丁元奉議大夫禮部侍郎臣老老嘉議大夫禮部侍郎臣杜秉彝
