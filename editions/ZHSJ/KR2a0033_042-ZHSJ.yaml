body:
  text: 遼史卷四十二志第十二曆象志上遼以幽營立國禮樂制度規模日完授曆頒朔二百餘年今奉詔修遼史體與宋金儗其大明曆不可少也曆書法禁不可得求大明曆元得祖冲之法于外史冲之之法遼曆之所從出也歟國朝亦嘗因之以冲之法算而至於遼更曆之年以起元數是蓋遼大明曆遼曆因是固可補然弗之補史貴闕文也外史紀其法司天存其職遼史志是足矣作曆象志曆大同元年太宗皇帝自晉汴京收百司僚屬伎術曆象遷于中京遼始有曆先是梁唐仍用唐景福崇玄曆晉天福四年司天監馬重績奏上乙未元曆號調元曆太宗所收于汴是也穆宗應曆十一年司天王白李正等進曆蓋乙未元曆也聖宗統和十二年可汗州刺史賈俊進新曆則大明曆是也高麗所志大遼古今錄稱統和十二年始頒正朔改曆驗矣大明曆本宋祖冲之法具見沈約宋書具如左宋武帝大明六年祖冲之上甲子元曆法未及施用因名大明曆上元甲子至宋大明七年癸卯五萬一千九百三十九年算外元法五十九萬二千三百六十五紀法三萬九千四百九十一章歲三百九十一章月四千八百三十六章閏一百四十四閏法十二月法十一萬六千三百二十一日法三千九百三十九餘數二十萬七千四十四歲餘九千五百八十九沒分三百六十萬五千九百五十一沒法五萬一千七百六十一周天一千四百四十二萬四千六百六十四虛分萬四百四十九行分法二十三小分法一千七百一十七通周七十二萬六千八百一十會周七十一萬七千七百七十七通法二萬六千三百七十七差率三十九推朔術置入上元年數算外以章月乘之滿章歲為積月不盡為閏餘閏餘二百四十七以上其年有閏以月法乘積月滿日法為積日不盡為小餘六旬去積日不盡為大餘大餘命以甲子算外所求年天正十一月朔也小餘千八百四十九以上其月大求次月加大餘二十九小餘二千九十小餘滿日法從大餘大餘滿六旬去之命如前次月朔也求弦望加朔大餘七小餘千五百七小分一小分滿四從小餘小餘滿日法從大餘命如前上弦日也又加得望又加得下弦又加得後月朔也推閏術以閏餘減章歲餘滿閏法得一月命以天正算外閏所在也閏有進退以無中氣為正推二十四氣置入上元年數算外以餘數乘之滿紀法為積日不盡為小餘六旬去積日不盡為大餘大餘命以甲子算外天正十一月冬至日也求次氣加大餘十五小餘八千六百二十六小分五小分滿六從小餘小餘滿紀法從大餘命如前次氣日也求土王用事加冬至大餘二十七小餘萬五千五百二十八季冬土用事日也又加大餘九十一小餘萬二千二百七十次土用事日也推沒術以九十乘冬至小餘以減沒分滿沒法為日不盡為日餘命日以冬至算外沒日也求次沒加日六十九日餘三萬四千四百四十二餘滿沒法從日次沒日也日餘盡為滅推日所在度術以紀法乘朔積日為度實周天去之餘滿紀法為積度不盡為度餘命以虛一次宿除之算外天正十一月朔夜半日所在度也求次月大月加度三十小月加度二十九入虛去度分求行分以小分法除度餘所得為行分不盡為小分小分滿法從行分行分滿法從度求次日加一度入虛去行分六小分百四十七推月所在度術以朔小餘乘百二十四為度餘又以朔小餘乘八百六十為微分微分滿月法從度餘度餘滿紀法為度以減朔夜半日所在則月所在度求次月大月加度三十五度餘三萬一千八百三十四微分七萬七千九百六十七小月加度二十二度餘萬七千二百六十一微分六萬三千七百三十六入虛去度也遲疾曆月行度損益率盈縮積分差法一日十四行分十三益七十盈初五千三百四二日十四十一益六十五盈百八十四萬二千三百一十六五千二百七十三日十四八益五十七盈三百五十五萬七百六五千二百一十九四日十四四益四十七盈五百五萬八千三百八五千一百五十一五日十三二十一益三十四盈六百二十九萬七千八百五十七五千六十六六日十三十七益二十二盈七百二十萬二千六百九十一四千九百八十一七日十三十一益六盈七百七十七萬二千七百一十一四千八百七十九八日十三五損九盈七百九十四萬九百五十二四千七百七十七九日十二二十二損二十四盈七百七十萬七千四百一十五四千六百七十五十日十二十六損三十九盈七百七萬二千一百四千五百七十三十一日十二十一損五十二盈六百三萬五千七四千四百八十八十二日十二八損六十盈四百六十六萬三千一百四千四百三十七十三日十二六損六十五盈三百九萬三百三四千四百三十四日十二四損七十盈百三十八萬三千五百八十四千三百六十九十五日十二五益六十七縮四十五萬七千六十九四千三百八十六十六日十二七益六十二縮二百二十三萬七百五十五四千四百二十十七日十二十益五十五縮三百八十七萬五十四四千四百七十一十八日十二十四益四十四縮五百三十一萬九千三百八十五四千五百二十九十九日十二十九益三十二縮六百四十八萬四百四四千六百二十四二十日十三益十九縮七百三十一萬六千六百八二十一日十三七益四縮七百八十一萬七千九百九十六四千八百一十一二十二日十二十二損十一縮七百九十一萬七千六百七四千九百一十三二十三日十三十九損三十七縮七百六十一萬五千四百四十五千一十五二十四日十四一損三十九縮六百九十萬一千四百九十五五千一百二十五日十四十六損五十二縮五百八十七萬一千七百三十五五千一百八十五二十六日十四十損六十二縮四百四十九萬九千一百五十九五千二百五十三二十七日十四十二損六十七縮二百八十五萬七千七百三十二五千二百八十七二十八日十四十損七十四縮百八萬二千三百七十九五千三百三十一推入遲疾曆術以通法乘朔積日為通實通周去之餘滿通法為日不盡為日餘命日算外天正十一月朔夜半入曆日也求次月大月加二日小月加一日日餘皆萬一千七百四十六曆滿二十七日日餘萬四千六百三十一則去之求次日加一日求日所在定度以夜半入曆日餘乘損益率以損益盈縮積分如差率而一所得滿紀法為度不盡為度餘以盈加縮減平行度及餘為定度益之或滿法損之或不足以紀法進退求度行分如上法求次日如所入遲疾加之虛去分如上法陰陽曆損益率兼數一日益十六初二日益十五十六三日益十四三十一四日益十二四十五五日益九五十七六日益五六十六七日益一七十一八日損二七十二九日損六七十十日損十六十四十一日損十三五十四十二日損十五四十一十三日損十六二十六十四日損十六十推入陰陽曆術置通實以會周去之不滿交數三十五萬八千八百八十八半為朔入陽曆分各去之為朔入陰曆分各滿通法得一日不盡為日餘命日算外天正十一月朔夜半入曆日也求次月大月加二日小月加一日日餘皆二萬七百七十九曆滿十三日日餘萬五千九百八十七半則去之陽竟入陰陰竟入陽求次日加一日求朔望差以二千二十九乘朔小餘滿三百三為日餘不盡倍之為小分則朔差數也加一十四日日餘二萬一百八十六小分百二十五小分滿六百六從日餘日餘滿通法為日即望差數也又加之後月朔也求合朔月食置朔望夜半入陰陽曆及餘有半者去之置小分三百三以差數加之小分滿六百六從日餘日餘滿通法從日日滿一曆去之命日算外則朔望加時入曆也朔望加時入曆一日日餘四千一百九十八小分四百二十八以下十二日日餘萬一千七百八十八小分四百八十一以上朔則交會望則月食求合朔月食定大小餘令差數日餘加夜半入遲疾曆餘日餘滿通法從日則朔望加時入曆也以入曆餘乘損益率以損益盈縮積分如差法而一以盈減縮加本朔望小餘為定小餘益之或滿法損之或不足以日法進退日求合朔月食加時以十二乘定小餘滿日法得一辰命以子算外加時所在辰也有餘者四之滿日法得一為少二為半三為太又有餘者三之滿日法得一為強以強幷少為少強幷半為半強幷太為太強得二者為少弱以幷少為半弱幷半為太弱幷太為一辰弱以前辰名之求月去日道度置入陰陽曆餘乘損益率如通法而一以損益兼數為定定數十二而一為度不盡四而一為少半太又不盡者三而一一為強二為少弱則月去日道數也陽曆在表陰曆在𩹉測景漏刻中星數二十四氣日中景晝漏刻夜漏刻昏中星度明中星度冬至一丈三尺四十五五十五八十二行分二十一二百八十三行分八小寒一丈二尺四寸三分四十五六五十四四八十四二百八十二六大寒一丈一尺二寸四十六七五十三二八十六一二百八十六立春九尺八寸四十八四五十一六八十九三二百七十七三雨水八尺一寸七分五十五四十九五九十三二百七十三七驚蟄六尺六寸七分五十二九四十七一九十一二百六十八二十春分五尺三寸七分五十五五四十四五百二三二百六十四三清明四尺二寸五分五十八一四十一九百六二十一二百五十九八穀雨二尺二寸六分六十四三十九六百一十一三二百五十四四立夏二尺五寸三分六十二四三十七六百一十四十八二百五十一七小滿一尺九寸九分六十三九二十六一百一十七十二二百四十八十七芒種一尺六寸九分六十四八二十五二百一十九四二百四十七二夏至一尺五寸六十五三十五百一十九十二二百四十六十七小暑一尺六寸九分六十四八分三十五一百一十九四二百四十七一大暑一尺九寸九分六十三九三十六一百一十七十二二百四十八十七立秋二尺五寸三分六十二四三十七六百一十四十八二百五十一十一處暑三尺二寸六分六十四三十九六百一十一二二百五十四四白露四尺二寸五分五十八一四十一九百六二十一二百五十九八秋分五尺三寸七分五十五五四十四五百二三二百六十四三寒露六尺六寸七分五十二九四十七一九十七九二百六十八二十霜降八尺一寸七分五十五四十九五九十三二百七十三七立冬九尺八寸四十八四五十一六八十九三二百七十七三小雪一丈一尺二寸四十六七五十三三八十六一二百八十六大雪一丈二尺四寸三分四十五六五十四四八十四二百八十二六求昏明中星各以度數如夜半日所在則中星度推五星術木率千五百七十五萬三千八十二火率三千八十萬四千一百九十六土率千四百九十三萬三百五十四金率二千三百六萬一十四水率四百五十七萬六千二百四推五星術置度實各以率去之餘以減率其餘如紀法而一為入歲日不盡為日餘命以天正朔算外星合日求星合度以入歲日及餘從天正朔日積度及餘滿紀法從度滿三百六十餘度分則去之命以虛一算外星合所在度也求星見日以術伏日及餘加星合日及餘餘滿紀法從日命如前見日也求星見度以術伏度及餘加星合度及餘餘滿紀法從度入虛去度分命如前星見度也行五星法以小分法除度餘所得為行分不盡為小分及日加所行分滿法從度留者因前逆則減之伏不盡度從行入虛去行分六小分百四十七逆行出虛則加之木星初與日合伏十六日日餘萬七千八百三十二行二度度餘三萬七千五百四晨見東方從日行四分百一十二日行十九度十一分留二十八日逆日行三分八十六日退十一度五分又留二十八日從日行四分百一十二日夕伏西方日度餘如初一終三百九十八日日餘三萬五千六百六十四行三十三度度餘二萬五千二百一十五火星初與日合伏七十二日日餘六百八行五十五度度餘二萬八千八百六十五晨見東方從疾日行十七分九十二日行六十八度小遲日行十四分九十二日行五十六度大遲日行九分九十二日行三十六度留十日逆日行六分六十四日退十六度十六分又留十日從遲日行九分九十二日小疾日行十四分九十二日大疾日行十七分九十二日夕伏西方日度餘如初一終七百八十日日餘千二百一十六行四百一十四度度餘三萬二百五十八除一周定行四十九度度餘萬九千八百九土星初與日合伏十七日日餘千三百七十八行一度度餘萬九千三百三十三晨見東方行順日行二分八十四日行七度七分留三十三日行逆日行一分百一十日退四度十八分又留三十三日從日行二分八十四日夕伏西方日度餘如初一終三百七十八日日餘二千七百五十六行十二度度餘三萬一千七百九十八金星初與日合伏三十九日日餘三萬八千一百二十六行四十九度度餘三萬八千一百二十六夕見西方從疾日行一度五分九十二日行百十二度小遲日行一度四分九十二日行百八度大遲日行十七分四十五日行三十三度六分留九日遲日行十六分九日退六度六分夕伏西方伏五日退五度而與日合又五日退五度而晨見東方逆日行十六分九日留九日從遲日行十七分四十五日小疾日行一度四分九十二日大疾日行一度五分九十二日晨伏東方日度餘如初一終五百八十三日日餘三萬六千七百六十一行星如之除一周定行二百十八度度餘二萬六千三百一十三合二百九十一日日餘三萬八千一百二十六行星亦如之水星初與日合伏十四日日餘三萬七千一百一十五行三十度度餘三萬七千一百一十五夕見西方從疾日行一度六分二十三日行二十九度遲日行二十分八日行六度二十二分留二日遲日行十一分二日退二十二分夕伏西方伏八日退八度而與日合又八日退八度晨見東方逆日行十一分二日留二日從遲日行二十分八日疾日行一度六分二十三日晨伏東方日度餘如初一終百一十五日日餘三萬四千七百三十九行星如之一合五十七日日餘三萬七千一百一十五行星亦如之上元之歲歲在甲子天正甲子朔夜半冬至日月五星聚于虛度之初陰陽遲疾並自此始梁武帝天監三年冲之子耳幾上疏論何承天曆乖謬不可用九年正月詔用祖冲之所造甲子元曆頒朔陳氏因梁亦用祖冲之曆至遼聖宗以賈俊所進新曆因宋大明舊號行之金曰重修大明曆傳至皇元亦曰重修大明曆及改授時曆別立司天監存肄之每歲甲子冬至重修其法書在太史院禁莫得聞
