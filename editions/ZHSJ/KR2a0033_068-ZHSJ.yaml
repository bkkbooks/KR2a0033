body:
  text: 遼史卷六十八表第六遊幸表朔漠以畜牧射獵為業猶漢人之劭農生生之資於是乎出自遼有國建立五京置南北院控制諸夏而遊田之習尚因其舊太祖經營四方有所不暇穆宗天祚之世史不勝書今援司馬遷別書封禪例列于表觀者固足以鑒云作遊幸表
