body:
  text: 遼史卷三十五志第五兵衞志中御帳親軍漢武帝多行幸之事置期門佽飛羽林之目天子始有親軍唐太宗加親勳翊千牛之衞布腹心之地防衞密矣遼太祖宗室盛強分迭刺部為二宮衞內虛經營四方未遑鳩集皇后述律氏居守之際摘蕃漢精銳為屬珊軍太宗益選天下精甲置諸爪牙為皮室軍合騎五十萬國威壯矣大帳皮室軍太宗置凡三十萬騎屬珊軍地皇后置二十萬騎宮衞騎軍太祖以迭刺部受禪分本部為五院六院統以皇族而親衞缺然乃立斡魯𩽆法裂州縣割戶丁以強幹弱支詒謀嗣續世建宮衞入則居守出則扈從葬則因以守陵有兵事則五京二州各提轄司傳檄而集不待調發州縣部族十萬騎軍已立具矣恩意親洽兵甲犀利教練完習簡天下精銳聚之腹心之中懷舊者歲深增新者世盛此軍制之良者也弘義宮正丁一萬六千蕃漢轉丁一萬四千騎軍六千長寧宮正丁一萬四千蕃漢轉丁一萬二千騎軍五千永興宮正丁六千蕃漢轉丁一萬四千騎軍五千積慶宮正丁一萬蕃漢轉丁一萬六千騎軍八千延昌宮正丁二千藩漢轉丁六千騎軍二千彰愍宮正丁一萬六千蕃漢轉丁二萬騎軍一萬崇德宮正丁一萬二千蕃漢轉丁二萬騎軍一萬興聖宮正丁二萬蕃漢轉丁四萬騎軍五千延慶宮正丁一萬四千蕃漢轉丁二萬騎軍一萬太和宮正丁二萬蕃漢轉丁四萬騎軍一萬五千永昌宮正丁一萬四千蕃漢轉丁二萬騎軍一萬敦睦宮正丁六千蕃漢轉丁一萬騎軍五千文忠王府正丁一萬蕃漢轉丁一萬六千騎兵一萬十二宮一府自上京至南京總要之地各置提轄司重地每宮皆置內地一二而已太和永昌二宮宜與興聖延慶同舊史不見提轄司蓋闕文也南京弘義宮提轄司長寧宮提轄司永興宮提轄司積慶宮提轄司延昌宮提轄司彰愍宮提轄司崇德宮提轄司興聖宮提轄司延慶宮提轄司敦睦宮提轄司文忠王府提轄司西京弘義宮提轄司長寧宮提轄司永興宮提轄司積慶宮提轄司彰愍宮提轄司崇德宮提轄司延慶宮提轄司文忠王府提轄司奉聖州弘義宮提轄司長寧宮提轄司永興宮提轄司積慶宮提轄司彰愍宮提轄司崇德宮提轄司興聖宮提轄司延慶宮提轄司文忠王府提轄司平州弘義宮提轄司長寧宮提轄司永興宮提轄司積慶宮提轄司延昌宮提轄司彰愍宮提轄司興聖宮提轄司延慶宮提轄司文忠王府提轄司中京延昌宮提轄司文忠王府提轄司上京文忠王府提轄司凡諸宮衞丁四十萬八千出騎軍十萬一千大首領部族軍遼親王大臣體國如家征伐之際往往置私甲以從王事大者千餘騎小者數百人著籍皇府國有戎政量借三五千騎常留餘兵為部族根本太子軍偉王軍永康王軍于越王軍麻答軍五押軍衆部族軍衆部族分隸南北府守衞四邊各有司存具如左北府凡二十八部侍從宮帳奚王府部鎮南境五院部六院部東北路招討司烏隗部東北路統軍司遙里部伯德部奧里部南剋部北剋部圖盧部朮者達魯虢部河西部西北路招討司突呂不部奧衍女直部室韋部西南路招討司涅剌部烏古涅剌部涅剌越兀部梅古悉部頡的部匿訖唐古部鶴剌唐古部黃龍府都部署司隗衍突厥部奧衍突厥部北唐古部五國部烏古敵烈統軍司迭魯敵烈部戌隗烏古部北敵烈部南府凡一十六部鎮駐西南境乙室部西南路招討司品部迭達迭剌部品達魯虢部乙典女直部西北路招討司楮特部東北路統軍司達馬鼻古德部東北路女直兵馬司乙室奧隗部東京都部署司楮特奧隗部窈爪部稍瓦部曷朮部戍倒塌嶺訛僕括部屯駐本境撒里葛部南唐古部薛特部
