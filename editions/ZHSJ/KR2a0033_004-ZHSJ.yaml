body:
  text: 遼史卷四本紀第四太宗下會同元年春正月戊申朔晉及諸國遣使來賀晉使且言已命和凝撰聖德神功碑戊辰遣人使晉二月壬午室韋進白麃戊子鐵驪來貢丁酉獵松山戊戌幸遼河東丙申上思人皇王遣惕隱率宗室以下祭其行宮丁未詔增晉使所經供億戶三月壬戌將東幸三剋言農務方興請減輜重促還朝從之丙寅女直來貢癸酉東幸夏四月戊寅朔如南京甲申女直來貢乙酉幸溫泉己丑還宮朝于皇太后丁酉女直貢弓矢己亥西南邊大詳穩耶律魯不古奏党項捷五月甲寅晉復遣使請上尊號從之六月丙子朔吐谷渾及女直來貢辛卯南唐來貢癸巳詔建日月四時堂圖寫古帝王事于兩廡秋七月癸亥遣使賜晉馬丁卯遣鶻離底使晉梅里了古使南唐戊辰遣中臺省右相耶律述蘭迭烈哥使晉臨海軍節度使趙思溫副之冊晉帝為英武明義皇帝八月戊子女直來貢庚子吐谷渾烏孫靺鞨皆來貢九月庚戌黑車子室韋貢名馬邊臣奏晉遣守司空馮道左散騎常侍韋勳來上皇太后尊號左僕射劉昫右諫議大夫盧重上皇帝尊號遂遣監軍寅你已充接伴壬子詔羣臣及高年凡授大臣爵秩皆賜錦袍金帶白馬金飾鞍勒著于令冬十月甲戌朔遣郎君迪里姑等撫問晉使壬寅晉遣使來謝冊禮是日復有使進獨峯駝及名馬十一月甲辰朔命南北宰相及夷離菫就館賜晉使馮道以下宴丙午上御開皇殿召見晉使壬子皇太后御開皇殿馮道韋勳冊上尊號曰廣德至仁昭烈崇簡應天皇太后甲子行再生柴冊禮丙寅皇帝御宣政殿劉昫盧重冊上尊號曰睿文神武法天啟運明德章信至道廣敬昭孝嗣聖皇帝大赦改元會同是月晉復遣趙瑩奉表來賀以幽薊瀛莫涿檀順媯儒新武雲應朔寰蔚十六州幷圖籍來獻於是詔以皇都為上京府曰臨潢升幽州為南京南京為東京改新州為奉聖州武州為歸化州升北南二院及乙室夷離菫為王以主簿為令令為刺史刺史為節度使二部梯里已為司徒達剌干為副使麻都不為縣令縣達剌干為馬步置宣徽閤門使控鶴客省御史大夫中丞侍御判官文班牙署諸宮院世燭馬羣遙輦世燭南北府國舅帳郎君官為敞史諸部宰相節度使帳為司空二室韋闥林為僕射鷹坊監冶等局官長為詳穩十二月戊戌遣同括阿鉢等使晉制加晉馮道守太傅劉昫守太保餘官各有差二年春正月乙巳以受晉冊遣使報南唐高麗丁未御開皇殿宴晉使馮道以下賜物有差戊申晉遣金吾衞大將軍馬從斌考功郎中劉知新來貢珍幣命分賜羣臣丙辰晉遣使謝免沿邊四州錢幣二月戊寅宴諸王及節度使來賀受冊禮者仍命皇太子惕隱迪輦餞之癸巳謁太祖廟賜在京吏民物及內外羣臣官賞有差丁酉加兼侍中左金吾衞上將軍王鄑檢校太尉三月畋于褭潭之側戊申女直來貢丁巳封皇子述律為壽安王罨撒葛為太平王己巳大賚百姓夏四月乙亥幸木葉山癸巳東京路奏狼食人五月乙巳禁南京鬻牝羊出境思奴古多里等坐盜官物籍其家南唐遣使來貢丁未以所貢物賜羣臣戊申回鶻單于使人乞授官詔第加刺史縣令六月丁丑雨雪是夏駐蹕頻蹕淀秋七月戊申晉遣使進犀帶庚戌吐谷渾來貢乙卯敞史阿鉢坐奉使失職命笞之閏月癸未乙室大王坐賦調不均以木劍背撻而釋之幷罷南北府民上供及宰相節度諸賦役非舊制者乙酉遣的烈賜晉烏古良馬己丑以南王府二刺史貪蠹各杖一百仍繫虞候帳備射鬼箭選羣臣為民所愛者代之八月乙丑晉遣使貢歲幣奏輸戌亥二歲金幣于燕京九月甲戌阻卜阿離底來貢己卯遣使使晉冬十月丁未上以烏古部水草肥美詔北南院徙三石烈戶居之十一月丁亥鐵驪燉煌並遣使來貢十二月庚子鈎魚于土河甲子回鶻使者傔人有以刃相擊者詔付其使處之三年春正月戊子吳越王遣使來貢庚寅人皇王妃來朝回鶻使乞觀諸國使朝見禮從之壬辰遣陪謁阿鉢使晉致生辰禮晉以幷鎮忻代之吐谷渾來歸二月己亥奚王勞骨寧率六節度使朝貢庚子烏古遣使獻伏鹿國俘賜其部夷離菫旗鼓以旌其功壬寅女直來貢辛亥墨離鶻末里使回鶻阿薩蘭還賜對衣勞之乙卯鴨淥江女直遣使來覲三月戊辰遣使使晉報幸南京己巳如南京辛未命惕隱耶律涅離骨德率萬騎先驅壬申次石嶺以奚王勞骨寧監軍寅你已朝謁不時切責之丙子魯不姑上党項俘獲數癸未獵水門獲白鹿庚寅詔扈從擾民者從軍律甲午幸薊州乙未晉及南唐各遣使來覲夏四月庚子至燕備法駕入自拱辰門御元和殿行入閤禮壬寅遣人使晉乙巳幸留守趙延壽別墅丙午晉遣宣徽使楊端王眺等來問起居壬子御便殿宴晉及諸國使丙辰晉遣使進茶藥壬戌御昭慶殿宴南京羣臣癸亥晉遣使賀端午以所進節物賜羣臣乙丑南唐進白龜五月庚午以端午宴羣臣及諸國使命回鶻燉煌二使作本俗舞俾諸使觀之庚辰晉遣使進弓矢甲申遣皇子天德及檢校司徒邸用和使晉戊子閱騎兵于南郊六月乙未朔東京宰相耶律羽之言渤海相大素賢不法詔僚佐部民舉有才德者代之丙申閱步卒于南郊庚子晉及轄剌骨只遣使來見壬寅駕發燕京命中書令蕭僧隱部諸道軍于長坐營癸丑次奉聖州甲寅勞軍士秋七月己巳獵猾底烈山癸酉朝于皇太后丙子從皇太后視人皇王妃疾戊寅人皇王妃蕭氏薨己卯以安重榮據鎮州叛晉詔征南將軍柳嚴邊備丙戌徙人皇王行宮于其妃薨所辛卯晉遣使請行南郊禮許之八月己亥詔東丹吏民為其王倍妃蕭氏服庚子阻卜來貢壬寅遣使南唐乙巳阻卜黑車子室韋賃烈等國來貢南唐遣使求青帳賜之戊申以安端私城為白川州辛亥鼻骨德使乞賜爵以其國相授之甲寅阻卜來貢乙卯置白川州官屬丙辰詔以于諧里河臚朐河之近地給賜南院歐菫突呂乙斯勃北院溫納何剌三石烈人為農田九月庚午侍中崔窮古言晉主聞陛下數游獵意請節之上曰朕之畋獵非徒從樂所以練習武事也乃詔諭之壬午邊將奏破吐谷渾擒其長詔止誅其首惡及其丁壯餘並釋之丙戌晉遣使貢名馬戊子女直及吳越王遣使來貢冬十月辛丑遣剋郎使吳越略姑使南唐庚申晉遣使貢布及請親祠南嶽從之十一月己巳南唐遣使奉蠟丸書言晉密事丁丑詔有司教民播種紡績除姊亡妹續之法十二月壬辰朔率百僚謁太祖行宮甲午燔柴禮畢祠于神帳丙申遣使使晉丙辰詔契丹人授漢官者從漢儀聽與漢人婚姻丁巳詔燕京皇城西南堞建涼殿是冬駐蹕于傘淀四年春正月壬戌以乙室品卑突軌三部魚眾寡不能自存者官為之配丙子南唐遣使來貢庚辰涅剌烏隗部獻党項俘獲數己丑詔定征党項功二月丙申皇太子獲白麞甲辰晉遣使進香藥丙子鐵驪來貢丁巳詔有司編始祖奇首可汗事迹己未晉遣楊彥詢來貢且言鎮州安重榮跋扈狀遂留不遣是月晉鎮州安重榮執遼使者拽剌三月特授回鶻使闊里于越幷賜旌旗弓劍衣馬餘賜有差癸酉晉以許祀南郊遣使來謝進黃金十鎰夏四月己卯晉遣使進櫻桃五月庚辰吐谷渾夷離菫蘇等叛入晉遣牒蠟往諭晉及太原守臣六月辛卯振武軍節度副使趙崇逐其節度使耶律畫里以朔州叛附晉丙午命宣徽使褭古只赴朔州以兵圍其城有晉使至請開壁即勿聽驛送闕下秋七月癸亥南唐遣使奉蠟丸書丙寅褭古只奏請遣使至朔令降守者猶堅壁弗納且言晉有貢物命即以所貢物賜攻城將校己巳有司奏神纛車有蜂巢成蜜史占之吉壬申晉遣使進水晶硯八月癸巳南唐奉蠟丸書庚子晉遣使進犀弓竹矢吳越王遣使奉蠟丸書九月壬申有星孛于晉分丁丑幸歸化州冬十月辛丑有司奏燕薊大熟癸卯吳越王遣使來貢十一月丙寅晉以討安重榮來告庚午吐谷渾請降遣使撫諭阻卜來貢以其物賜左右丙子鴨淥江女直來貢壬午以永寧天授二節及正旦重午冬至臘並受賀著令十二月戊子晉遣使來告山南節度使安從進反詔以便宜討之庚寅南唐遣使奉蠟丸書戊戌晉遣王升鸞來貢戊申晉以敗安重榮來告遂遣楊彥詢歸辛亥晉遣使乞罷戍兵詔惕隱朔古班師甲寅攻拔朔州遣控鶴指揮使諧里勞軍時褭古只戰歿城下上怒命誅城中丁壯仍以叛民上戶三十為褭古只部曲五年春正月丙辰朔上在歸化州御行殿受羣臣朝以諸道貢物進太后及賜宗室百僚戊午詔求直言北王府郎君耶律海思應詔召對稱旨特授宣徽使詔政事令僧隱等以契丹戶分屯南邊戊辰晉函安重榮首來獻上數欲親討重榮至是乃止癸酉遣使使晉是月晉以朔州平遣使來賀遂遣客省使耶律化哥使晉幷致生辰禮二月壬辰上將南幸以諸路有未平者召太子及羣臣議皆曰今襄鎮朔三州雖已平然吐谷渾為安重榮所誘猶未歸命宜發兵討之以警諸部上曰正與朕合遂詔以明王隈恩代于越信恩為西南路招討使以討之且諭明王宜先練習邊事而後之官甲午如南京遣使使晉索吐谷渾叛者乙未鼻骨德來貢三月乙卯朔晉遣齊州防禦使宋暉業翰林茶酒使張言來問起居閏月駐蹕陽門夏四月甲寅朔鐵驪來貢以其物分賜羣臣丙子晉遣使進射柳鞍馬五月五日戊子禁屠宰六月癸丑朔晉齊王重貴遣使來貢丁巳徒覩古素撒來貢乙丑晉主敬瑭殂子重貴立戊辰晉遣使告哀輟朝七日庚午遣使往晉弔祭丁丑聞皇太后不豫上馳入侍湯藥必親嘗仍告太祖廟幸菩薩堂飯僧五萬人七月乃愈秋七月庚寅晉遣金吾衞大將軍梁言判四方館事朱崇節來謝書稱孫不稱臣遣客省使喬榮讓之景延廣答曰先帝則聖朝所立今主則我國自冊為鄰為孫則可奉表稱臣則不可榮還具奏之上始有南伐之意辛卯阻卜鼻骨德烏古來貢將軍闥德里蒲骨等率降將轄德至闕并獻所獲丁未晉遣使以祖母哀來告八月辛酉女直阻卜烏古各貢方物甲子晉復襄州戊辰詔河東節度使劉知遠送叛臣烏古指揮使由燕京赴闕癸酉遣天城軍節度使蕭拜石弔祭于晉九月壬辰遣使賀晉帝嗣位冬十月己巳徵諸道兵遣將軍密骨德伐党項十一月乙未武定軍奏松生棗十二月癸亥晉遣使來謝是冬駐蹕赤城六年春二月乙卯晉遣使進先帝遺物辛酉晉遣使請居汴從之三月己卯朔吳越王遣使來貢甲申梅里喘引來歸戊子南唐遣使奉蠟丸書丁未晉至汴遣使來謝夏四月戊申朔日有食之五月己亥遣使如晉致生辰禮六月丁未朔鐵驪來貢己未奚鋤骨里部進白麝辛酉莫州進白鵲晉遣使貢金秋八月丁未朔晉復貢金己未如奉聖州晉遣其子延煦來朝冬十一月辛卯上京留守耶律迪輦得晉諜知有二心甲辰鐵驪來貢十二月丁未如南京議伐晉命趙延壽趙延昭安端解里等由滄易定分道而進大軍繼之是歲楊彥昭請移鎮奈濼及新鎮從之七年春正月甲戌朔趙延壽延昭率前鋒五萬騎次任丘丙子安端入雁門圍忻代己卯趙延壽圍貝州其軍校邵珂開南門納遼兵太守吳巒投井死己丑次元城授延壽魏博等州節度使封魏王率所部屯南樂丙申遣兵攻黎陽晉張彥澤來拒辛丑晉遣使來修舊好詔割河北諸州及遣桑維翰景延廣來議二月甲辰朔攻博州刺史周儒以城降晉平盧軍節度使楊光遠密道遼師自馬家口濟河晉將景延廣命石斌守麻家口白再榮守馬家口未幾周儒引遼軍麻答營于河東攻鄆州北津以應光遠晉遣李守貞皇甫遇梁漢璋薛懷讓將兵萬人緣河水陸俱進遼軍圍晉別將于戚城晉主自將救之遼師解去守貞等至馬家口麻答遣步卒萬人築營壘騎兵萬人守於外餘兵屯河西渡未已晉兵薄之遼軍不利三月癸酉朔趙延壽言晉諸軍沿河置柵皆畏怯不敢戰若率大兵直抵澶淵據其橋梁晉必可取是日晉兵駐澶淵其前軍高行周在戚城乃命延壽延昭以數萬騎出行周右上以精兵出其左戰至暮上復以勁騎突其中軍晉軍不能戰會有諜者言晉軍東面數少沿河城柵不固乃急擊其東偏衆皆奔潰縱兵追及遂大敗之壬午留趙延昭守貝州徙所俘戶于內地夏四月癸丑還次南京辛未如涼陘五月癸酉耶律拔里得奏破德州擒刺史尹居璠及將吏二十七人六月甲辰黑車子室韋來貢乙巳沒里要里等國來貢秋七月己卯晉楊光遠遣人奉蠟丸書辛卯晉遣張暉奉表乞和留暉不遣八月辛酉回鶻遣使請婚不許是月晉鎮州兵來襲飛狐大同軍節度使耶律孔阿戰敗之九月庚午朔北幸冬十月丁未鼻骨德來貢壬戌天授節諸國進賀惟晉不至十一月壬申詔徵諸道兵以閏月朔會溫榆河北十二月癸卯南伐甲子次古北口閏月己巳朔閱諸道兵於溫榆河己卯圍州下其九縣八年春正月庚子分兵攻邢洺磁三州殺掠殆盡入鄴都境張從恩馬全節安審琦兵悉陳于相州安陽水之南皇甫遇與濮州刺史慕容彥超將兵千騎來覘遼軍至鄴都遇遼軍數萬且戰且却至榆林店遼軍繼至遇與彥超力戰百餘合遇馬斃步戰審琦引騎兵踰水以救遼軍乃還二月圍魏晉將杜重威率兵來救戊子晉將折從阮陷勝州三月戊戌師拔祁州殺其刺史沈斌庚戌杜重威李守貞攻泰州戊子趙延壽率前鋒薄泰城己未重威守貞引兵南遁追至陽城大敗之復以步卒為方陣來拒與戰二十餘合壬戌復搏戰十餘里癸亥圍晉兵于白團衞村晉兵下鹿角為營是夕大風至曙命鐵鷂軍下馬拔其鹿角奮短兵入擊順風縱火揚塵以助其勢晉軍大呼曰都招討何不用兵令士卒徒死諸將皆奮出戰張彥澤藥元福皇甫遇出兵大戰諸將繼至遼軍却數百步風益甚晝晦如夜符彥卿以萬騎橫擊遼軍率步卒並進遼軍不利上乘奚車退十餘里晉追兵急獲一橐駝乘之乃歸晉兵退保定州夏四月甲申還次南京杖戰不力者各數百庚寅宴將士於元和殿癸巳如涼陘六月戊辰回鶻來貢辛未吐谷渾鼻骨德皆來貢辛巳黑車子室韋來貢丁亥趙延壽奏晉兵襲高陽戍將擊走之秋七月乙卯獵平地松林晉遣孟守中奉表請和仍以前事答之八月己巳詔侍衞蕭素撒閱羣牧于北陘九月壬寅次赤山宴從臣問軍國要務對曰軍國之務愛民為本民富則兵足兵足則國強上以為然辛酉還上京冬十月辛未祠木葉山十一月戊戌女直鐵驪來貢十二月癸亥朔朝謁太祖行宮乙丑雲州節度使耶律孔阿獲晉諜者戊辰臘賜諸國貢使衣馬九年春正月庚子回鶻來貢丁未女直來貢二月戊辰鼻骨德奏軍籍三月己亥吐谷渾遣軍校恤烈獻生口千戶授恤烈檢校司空夏四月辛酉朔吐谷渾白可久來附是月如涼陘五月庚戌晉易州戍將孫方簡請內附六月戊子謁祖陵更閟神殿為長思秋七月辛亥詔徵諸道兵敢傷禾稼者以軍法論癸丑女直來貢乙卯以阻卜酋長曷剌為本部夷離菫八月丙寅烏古來貢是月自將南伐九月壬辰閱諸道兵于漁陽西棗林淀是月趙延壽與晉張彥澤戰于定州敗之冬十一月戊子朔進圍鎮州丙申先遣候騎報晉兵至遣精兵斷河橋晉兵退保武強南院大王迪輦將軍高模翰分兵由瀛州間道以進杜重威遣貝州節度使梁漢璋率衆來拒與戰大敗之殺梁漢璋杜重威張彥澤引兵據中渡橋趙延壽以步卒前擊高彥溫以騎兵乘之追奔逐北殭屍數萬斬其將王清宋彥筠墮水死重威等退保中渡寨義武軍節度使李殷以城降遂進兵夾滹沱而營去中渡寨三里分兵圍之夜則列騎環守晝則出兵抄掠復命大內惕隱耶律朔骨里及趙延壽分兵圍守自將騎卒夜渡河出其後攻下欒城降騎卒數千分遣將士據其要害下令軍中預備軍食三日不得舉煙火但獲晉人即黥而縱之諸饋運見者皆棄而走於是晉兵內外隔絕食盡勢窮十二月丙寅杜重威李守貞張彥澤等率所部二十萬衆來降上擁數萬騎臨大阜立馬以受之授重威守太傅鄴都留守守貞天平軍節度使餘各領舊職分降卒之半付重威半以隸趙延壽命御史大夫解里監軍傅桂兒張彥澤持詔入汴諭晉帝母李氏以安其意且召桑維翰景延廣先來留騎兵千人守魏自率大軍而南壬申解里等至汴晉帝重貴素服拜命輿母李氏奉表請罪初重貴絕和好維翰數諫止之不從至是彥澤殺維翰紿言自經死詔收葬之復其田園第宅仍厚恤其家甲戌彥澤遷重貴及其母若妻於開封府署以控鶴指揮使李榮督兵衞之壬午次赤岡重貴舉族出封丘門索牽羊以待上不忍臨視命改舘封禪寺晉百官縞衣紗帽俯伏待罪上曰其主負恩其臣何罪命領職如故即授安叔千金吾衞上將軍叔千出班獨立上曰汝邢州之請朕所不忘乃加鎮國軍節度使蓋在邢嘗密請內附也將軍康祥執景延廣來獻詔以牙籌數其罪凡八縶送都道自殺大同元年春正月丁亥朔備法駕入汴御崇元殿受百官賀戊子以樞密副使劉敏權知開封府殺秦繼旻李彥紳及鄭州防禦使楊承勳以其弟承信為平盧軍節度使襲父爵初楊光遠在青州求內附其子承勳不聽殺其判官丘濤及弟承祚等自歸于晉故誅之己丑以張彥澤擅徙重貴開封殺桑維翰縱兵大掠不道斬於市晉人臠食之辛卯降重貴為崇祿大夫檢校太尉封負義侯癸巳以張礪為平章事晉李崧為樞密使馮道為太傅和凝為翰林學士趙瑩為太子太保劉昫守太保馮玉為太子少保癸卯遣趙瑩馮玉李彥韜將三百騎送負義侯及其母李氏太妃安氏妻馮氏弟重睿子延煦延寶等于黃龍府安置仍以其宮女五十人內宦三人東西班五十人醫官一人控鶴四人庖丁七人茶酒司三人儀鸞三人健卒十人從之二月丁巳朔建國號大遼大赦改元大同升鎮州為中京以趙延壽為大丞相兼政事令樞密使中京留守中外官僚將士爵賞有差辛未河東節度使北平王劉知遠自立為帝國號漢詔以耿崇美為昭義軍節度使高唐英為昭德軍節度使崔廷勳為河陽軍節度使分據要地三月丙戌朔以蕭翰為宣武軍節度使賜將吏爵賞有差壬寅晉諸司僚吏嬪御宦寺方技百工圖籍曆象石經銅人明堂刻漏太常樂譜諸宮縣鹵簿法物及鎧仗悉送上京磁州帥梁暉以相州降漢己酉命高唐英討之夏四月丙辰朔發自汴州以馮道李崧和凝李澣徐台符張礪等從行次赤岡夜有聲如雷起於御幄大星復隕於旗鼓前乙丑濟黎陽渡顧謂侍臣曰朕此行有三失縱兵掠芻粟一也括民私財二也不遽遣諸節度還鎮三也皇太弟遣使問軍前事上報曰初以兵二十萬降杜重威張彥澤下鎮州及入汴視其官屬具員者省之當其才者任之司屬雖存官吏廢墮猶雛飛之後徒有空巢久經離亂一至於此所在盜賊屯結土功不息餽餉非時民不堪命河東尚未歸命西路酋帥亦相黨附夙夜以思制之之術惟推心庶僚和協軍情撫綏百姓三者而已今所歸順凡七十六處得戶一百九萬百一十八非汴州炎熱水土難居止得一年太平可指掌而致且改鎮州為中京以備巡幸欲伐河東姑俟別圖其概如此戊辰次高邑不豫丁丑崩于欒城年四十六是歲九月壬子朔葬于鳳山陵曰懷陵廟號太宗統和二十六年七月上尊諡孝武皇帝重熙二十一年九月增諡孝武惠文皇帝贊曰太宗甫定多方遠近向化建國號備典章至於釐庶政閱名實錄囚徒教耕織配魚眾寡求直言之士得郎君海思即擢宣徽嘉唐張敬達忠於其君卒以禮葬輟遊豫而納三剋之請憫士卒而下休養之令親征晉國重貴面縛斯可謂威德兼弘英略間見者矣入汴之後無幾微之驕有三失之訓傳稱鄭伯之善處勝書進秦誓之能悔過太宗蓋兼有之其卓矣乎
