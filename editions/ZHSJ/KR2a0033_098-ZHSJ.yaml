body:
  text: 遼史卷九十八列傳第二十八蕭兀納耶律儼劉伸耶律胡呂蕭兀納一名撻不也字特免六院部人其先嘗為西南面拽剌兀納魁偉簡重善騎射清寧初兄圖獨以事入見帝問族人可用者圖獨以兀納對補祗候郎君遷近侍敞史護衞太保大康初為北院宣徽使時乙辛已害太子因言宋魏國王和魯斡之子淳可為儲嗣羣臣莫敢言唯兀納及夷離畢蕭陶隗諫曰舍嫡不立是以國與人也帝猶豫不決五年帝出獵乙辛請留皇孫帝欲從之兀納奏曰竊聞車駕出遊將留皇孫苟保護非人恐有他變果留臣請侍左右帝乃悟命皇孫從行由此始疑乙辛頃之同知南院樞密使事出乙辛淳等帝嘉其忠封蘭陵郡王人謂近於古社稷臣授殿前都點檢上謂王師儒耶律固等曰兀納忠純雖狄仁傑輔唐屋質立穆宗無以過也卿等宜達燕王知之自是令兀納輔導燕王益見優寵大安初詔尚越國公主兀納固辭改南院樞密使奏請掾史宜以歲月遷從之壽隆元年拜北府宰相初天祚在潛邸兀納數以直言忤旨及嗣位出為遼興軍節度使守太傅以佛殿小底王華誣兀納借內府犀角詔鞫之兀納奏曰臣在先朝詔許日取帑錢十萬為私費臣未嘗妄取一錢肯借犀角乎天祚愈怒奪太傅官降寧邊州刺史尋改臨海軍節度使兀納上書曰自蕭海里亡入女直彼有輕朝廷心宜益兵以備不虞不報天慶元年知黃龍府事改東北路統軍使復上書曰臣治與女直接境觀其所為其志非小宜先其未發舉兵圖之章數上皆不聽及金兵來侵戰于寧江州其孫移敵蹇死之兀納退走入城留官屬守禦自以三百騎渡混同江而西城遂陷後與蕭敵里拒金兵于長濼以軍敗免官五年天祚親征兀納殿復敗績後數日乃與百官入見授上京留守六年耶律章奴叛來攻京城兀納發府庫以賚士卒諭以逆順完城池以死拒戰章奴無所得而去以功授副元帥尋為契丹都宮使天祚以兀納先朝重臣有定策勳每延問以政兀納對甚切上雖優容終不能用以疾卒年七十耶律儼字若思析津人本姓李氏父仲禧重熙中始仕清寧初同知南院宣徽使事四年城鴨子混同二水間拜北院宣徽使咸雍初坐誤奏事出為榆州刺史俄詔復舊職遷漢人行宮都部署六年賜國姓封韓國公改南院樞密使時樞臣乙辛等誣陷皇太子詔仲禧偕乙辛鞫之蔓引無辜未嘗雪正乙辛薦仲禧可任拜廣德軍節度使復為南院樞密使卒諡欽惠儼儀觀秀整好學有詩名登咸雍進士第守著作佐郎補中書省令史以勤敏稱大康初歷都部署判官將作少監後兩府奏事論羣臣優劣唯稱儼才俊改少府少監知大理正賜紫六年遷大理少卿奏讞詳平明年陞大理卿丁父憂奪服同簽部署司事大安初為景州刺史繩胥徒禁豪猾撫老恤貧未數月善政流播郡人刻石頌德二年改御史中丞詔按上京滯獄多所平反同知宣徽院事提點大理寺六年冬改山西路都轉運使刮剔垢弊奏定課額益州縣俸給事皆施行壽隆初授樞密直學士以母憂去官尋召復舊職宋攻夏李乾順遣使求和解帝命儼如宋平之拜參知政事六年駕幸鴛鴦濼召至內殿訪以政事帝晚年倦勤用人不能自擇令各擲骰子以采勝者官之儼嘗得勝采上曰上相之徵也遷知樞密院事賜經邦佐運功臣封越國公修皇朝實錄七十卷帝大漸儼與北院樞密使阿思同受顧命乾統三年徙封秦國六年封漆水郡王天慶中以疾命乘小車入朝疾甚遣太醫視之薨贈尚父諡曰忠懿儼素廉潔一芥不取於人經籍一覽成誦又善伺人主意妻邢氏有美色常出入禁中儼教之曰慎勿失上意由是權寵益固三子處貞太常少卿處廉同知中京留守事處能少府少監劉伸字濟時宛平人少穎悟長以辭翰聞重熙五年登進士第歷彰武軍節度使掌書記大理正因奏獄上適與近臣語不顧伸進曰臣聞自古帝王必重民命願陛下省臣之奏上大驚異擢樞密都承旨權中京副留守詔徙富民以實春泰二州伸以為不可奏罷之遷大理少卿人以不寃陞大理卿改西京副留守以父憂終制為三司副使加諫議大夫提點大理寺以伸明法而恕案寃獄全活者衆徙南京副留守俄改崇義軍節度使政務簡靜民用不擾致烏鵲同巢之異優詔褒之改戶部使歲入羨餘錢三十萬緡拜南院樞密副使道宗嘗謂大臣曰今之忠直耶律玦劉伸而已宰相楊績賀其得人拜參知政事上諭之曰卿勿憚宰相時北院樞密使乙辛勢焰方熾伸奏曰臣於乙辛尚不畏何宰相之畏乙辛銜之相與排詆出為保靜軍節度使上終欲大用加守太子太保遷上京留守乙辛以事徙鎮雄武復以崇義軍節度使致仕適燕薊民飢伸與致政趙徽韓造日濟以糜粥所活不勝算大安二年卒上震悼賻贈加等耶律胡呂字蘇撒弘義宮分人其先欲穩佐太祖有功為迭烈部夷離菫父楊五左監門衞大將軍胡呂性謙謹於人無適莫重熙末補寢殿小底以善職屢更華要遷千牛衞大將軍大安中北阻卜酋磨魯斯叛為招討都監與耶律那也率精騎二千討平之以功為漢人行宮副部署兼知太和宮事致仕加同中書門下平章事卒論曰兀納當道宗昏惑之會擁佑皇孫使乙辛姦計不獲復逞而遼祚以續比之屋質立穆宗非溢美也儼以俊才莅政所至有能譽纂述遼史具一代治亂亦云勤矣但其固寵不能以禮正家惜哉劉伸三為大理民無寃抑一登戶部上下兼裕至與耶律玦並稱忠直不亦宜乎
