body:
  text: 遼史卷二十七本紀第二十七天祚皇帝一天祚皇帝諱延禧字延寧小字阿果道宗之孫父順宗大孝順聖皇帝母貞順皇后蕭氏大康元年生六歲封梁王加守太尉兼中書令後三年進封燕國王大安七年總北南院樞密使事加尚書令為天下兵馬大元帥壽隆七年正月甲戌道宗崩奉遺詔即皇帝位于柩前羣臣上尊號曰天祚皇帝二月壬辰朔改元乾統大赦詔為耶律乙辛所誣陷者復其官爵籍沒者出之流放者還之乙未遣使告哀于宋及西夏高麗乙巳以北府宰相蕭兀納為遼興軍節度使加守太傅三月丁卯詔有司以張孝傑家屬分賜羣臣甲戌召僧法頤放戒于內庭夏四月旱六月庚寅朔如慶州甲午宋遣王潛等來弔祭丙申高麗夏國各遣使慰奠戊戌以南府宰相斡特剌兼南院樞密使庚子追諡懿德皇后為宣懿皇后壬寅以宋魏國王和魯斡為天下兵馬大元帥乙巳以北平郡王淳進封鄭王丁未北院樞密使耶律阿思加于越辛亥葬仁聖大孝文皇帝宣懿皇后于慶陵秋七月癸亥阻卜鐵驪來貢八月甲寅謁慶陵九月壬申謁懷陵乙亥駐蹕藕絲淀冬十月壬辰謁乾陵甲辰上皇考昭懷太子諡曰大孝順聖皇帝廟號順宗皇妣曰貞順皇后十二月戊子以樞密副使張琳知樞密院事翰林學士張奉珪參知政事兼同知樞密院事癸巳宋遣黃實來賀即位丁酉高麗夏國並遣使來賀乙巳詔先朝已行事不得陳告初以楊割為生女直部節度使其俗呼為太師是歲楊割死傳于兄之子烏雅束束死其弟阿骨打襲二年春正月如鴨子河二月辛卯如春州三月大寒冰復合夏四月辛亥詔誅乙辛黨徙其子孫于邊發乙辛得里特之墓剖棺戮屍以其家屬分賜被殺之家五月乙丑斡特剌獻耶覩刮等部捷六月壬辰以雨罷獵駐蹕散水原丙午夏國王李乾順復遣使請尚公主丁未南院大王陳家奴致仕壬子李乾順為宋所攻遣李造福田若水求援閏月庚申策賢良壬申降惠妃為庶人秋七月獵黑嶺以霖雨給獵人馬阻卜來侵斡特剌等戰敗之冬十月乙卯蕭海里叛劫乾州武庫器甲命北面林牙郝家奴捕之蕭海里亡入陪朮水阿典部丙寅以南府宰相耶律斡特剌為北院樞密使參知政事牛溫舒知南院樞密使事十一月乙未郝家奴以不獲蕭海里免官壬寅以上京留守耶律慎思為北院樞密副使有司請以帝生日為天興節三年春正月辛巳朔如混同江女直函蕭海里首遣使來獻戊申如春州二月庚午以武清縣大水弛其陂澤之禁夏五月戊子以獵人多亡嚴立科禁乙巳清暑赤勒嶺丙午謁慶陵六月辛酉夏國王李乾順復遣使請尚公主秋七月中京雨雹傷稼冬十月甲辰如中京己未吐蕃遣使來貢庚申夏國復遣使求援己巳有事于觀德殿十一月丙申文武百官加上尊號曰惠文智武聖孝天祚皇帝大赦以宋魏國王和魯斡為皇太叔梁王撻魯進封燕國王鄭王淳為東京留守進封越國王百官各進一階丁酉以惕隱耶律何魯掃古為南院大王戊戌以受尊號告廟乙巳謁太祖廟追尊太祖之高祖曰昭烈皇帝廟號肅祖妣曰昭烈皇后曾祖曰莊敬皇帝廟號懿祖妣曰莊敬皇后召監修國史耶律儼纂太祖諸帝實錄十二月戊申如藕絲淀是年放進士馬恭回等百三人四年春正月戊子幸魚兒濼壬寅獵木嶺癸卯燕國王撻魯薨二月丁丑鼻骨德遣使來貢夏六月甲辰駐蹕旺國崖甲寅夏國遣李造福田若水求援癸亥吐蕃遣使來貢秋七月南京蝗庚辰獵南山癸未以西北路招討使蕭得里底北院樞密副使耶律慎思並知北院樞密使事辛卯以同知南院樞密使事蕭敵里為西北路招討使冬十月己酉鳳凰見于漷陰己未幸南京十一月乙亥御迎月樓賜貧民錢十二月辛丑以張琳為南府宰相五年春正月乙亥夏國遣李造福等來求援且乞伐宋庚寅以遼興軍節度使蕭常哥為北府宰相丁酉遣樞密直學士高端禮等諷宋罷伐夏兵二月癸卯微行視民疾苦丙午幸鴛鴦濼三月壬申以族女南仙封成安公主下嫁夏國王李乾順夏四月甲申射虎炭山五月癸卯清暑南崖壬子宋遣曾孝廣王戩報聘六月甲戌夏國遣使來謝及貢方物己丑幸候里吉秋七月謁慶陵九月辛亥駐蹕藕絲淀乙卯謁乾陵冬十一月戊戌禁商賈之家應進士舉丙辰高麗三韓國公王顒薨子俁遣使來告十二月己巳夏國復遣李造福田若水求援癸酉宋遣林洙來議與夏約和六年春正月辛丑遣知北院樞密使事蕭得里底知南院樞密使事牛溫舒使宋諷歸所侵夏地夏五月清暑散水原六月辛巳夏國遣李造福等來謝秋七月癸巳阻卜來貢甲午如黑嶺庚子獵鹿角山冬十月乙亥宋與夏通好遣劉正符曹穆來告庚辰以皇太叔南京留守和魯斡兼惕隱東京留守越國王淳為南府宰相十一月乙未以謝家奴為南院大王馬奴為奚六部大王丙申行柴冊禮戊戌大赦以和魯斡為義和仁聖皇太叔越國王淳進封魏國王封皇子敖盧斡為晉王習泥烈為饒樂郡王己亥謁太祖廟甲辰祠木葉山十二月己巳封耶律儼為漆水郡王餘官進爵有差七年春正月鈎魚于鴨子河二月駐蹕大魚濼夏六月次散水原秋七月如黑嶺冬十月謁乾陵獵醫巫閭山是年放進士李石等百人八年春正月如春州夏四月丙申封高麗王俁為三韓國公贈其父顒為高麗國王五月清暑散水原六月壬辰西北路招討使蕭敵里率諸蕃來朝丙申射柳祈雨壬寅夏國王李乾順以成安公主生子遣使來告丁未如黑嶺秋七月戊辰以雨罷獵冬十二月己卯高麗遣使來謝九年春正月丙午朔如鴨子河二月如春州三月戊午夏國以宋不歸地遣使來告夏四月壬午五國部來貢六月乙亥清暑特禮嶺秋七月隕霜傷稼甲寅獵于候里吉八月丁酉雪罷獵冬十月癸酉望祠木葉山丁丑詔免今年租稅十二月甲申高麗遣使來貢是年放進士劉楨等九十人十年春正月辛丑預行立春禮如鴨子河二月庚午朔駐蹕大魚濼夏四月丙子五國部長來貢丙戌預行再生禮癸巳獵于北山六月甲戌清暑玉丘癸未夏國遣李造福等來貢甲午阻卜來貢秋七月辛丑謁慶陵閏月辛亥謁懷陵己未謁祖陵壬戌皇太叔和魯斡薨九月甲戌免重九節禮冬十月駐蹕藕絲淀十二月己酉改明年元是歲大饑天慶元年春正月鈎魚于鴨子河二月如春州三月乙亥五國部長來貢夏五月清暑散水原秋七月獵冬十月駐蹕藕絲淀二年春正月己未朔如鴨子河丁丑五國部長來貢二月丁酉如春州幸混同江鈎魚界外生女直酋長在千里內者以故事皆來朝適遇頭魚宴酒半酣上臨軒命諸酋次第起舞獨阿骨打辭以不能諭之再三終不從他日上密謂樞密使蕭奉先曰前日之燕阿骨打意氣雄豪顧視不常可託以邊事誅之否則必貽後患奉先曰竹𢢧人不知禮義無大過而殺之恐傷向化之心假有異志又何能為其弟吳乞買粘罕胡舍等嘗從獵能呼鹿刺虎搏熊上喜輒加官爵夏六月庚寅清暑南崖甲午和州回鶻來貢戊戌成安公主來朝甲辰阻卜來貢秋七月乙丑獵南山九月己未射獲熊燕羣臣上親御琵琶初阿骨打混同江宴歸疑上知其異志遂稱兵先併旁近部族女直趙三阿鶻產拒之阿骨打虜其家屬二人走訴咸州詳穩司送北樞密院樞密使蕭奉先作常事以聞上仍送咸州詰責欲使自新後數召阿骨打竟稱疾不至冬十月辛亥高麗三韓國公王俁之母死來告即遣使致祭起復是月駐蹕奉聖州十一月乙卯幸南京丁卯謁太祖廟是年放進士韓昉等七十七人三年春正月丙寅賜南京貧民錢丁卯如大魚濼甲戌禁僧尼破戒丙子獵狗牙山大寒獵人多死三月籍諸道戶徙大牢古山圍場地居民于別土阿骨打一日率五百騎突至咸州吏民大驚翌日赴詳穩司與趙三等面折庭下阿骨打不屈送所司問狀一夕遁去遣人訴于上謂詳穩司欲見殺故不敢留自是召不復至夏閏四月李弘以左道聚衆為亂支解分示五京六月乙卯斡朗改國遣使來貢良犬丙辰夏國遣使來貢秋七月幸秋山九月駐蹕藕絲淀十一月甲午以三司使虞融知南院樞密使事西南面招討使蕭樂古為南府宰相十二月庚戌高麗遣使來謝致祭癸丑回鶻遣使來貢甲寅以樞密直學士馬人望參知政事丙辰知樞密院事耶律儼薨癸亥高麗遣使來謝起復四年春正月如春州初女直起兵以紇石烈部人阿疎不從遣其部撒改討之阿疎弟狄故保來告詔諭使勿討不聽阿疎來奔至是女直遣使來索不發夏五月清暑散水原秋七月女直復遣使取阿疎不發乃遣侍御阿息保問境上多建城堡之故女直以慢語答曰若還阿疎朝貢如故不然城未能已遂發渾河北諸軍益東北路統軍司阿骨打乃與弟粘罕胡舍等謀以銀朮割移烈婁室闍母等為帥集女直諸部兵擒遼障鷹官及攻寧江州東北路統軍司以聞時上在慶州射鹿聞之略不介意遣海州刺史高仙壽統渤海軍應援蕭撻不也遇女直戰于寧江東敗績冬十月壬寅朔以守司空蕭嗣先為東北路都統靜江軍節度使蕭撻不也為副發契丹奚軍三千人中京禁兵及土豪二千人別選諸路武勇二千餘人以虞候崔公義為都押官控鶴指揮邢穎為副引軍屯出河店兩軍對壘女直軍潛渡混同江掩擊遼衆蕭嗣先軍潰崔公義邢穎耶律佛留蕭葛十等死之其獲免者十有七人蕭奉先懼其弟嗣先獲罪輒奏東征潰軍所至劫掠若不肆赦恐聚為患上從之嗣先但免官而已諸軍相謂曰戰則有死而無功退則有生而無罪故士無鬬志望風奔潰十一月壬辰都統蕭敵里等營于斡鄰濼東又為女直所襲士卒死者甚衆甲午蕭敵里亦坐免官辛丑以西北路招討使耶律斡里𩽆為行軍都統副點檢蕭乙薛同知南院樞密使事耶律章奴副之十二月咸賓祥三州及鐵驪兀惹皆叛入女直乙薛往援賓州南軍諸將實婁特烈等往援咸州並為女直所敗
