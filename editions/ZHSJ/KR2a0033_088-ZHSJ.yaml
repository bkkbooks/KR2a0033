body:
  text: 遼史卷八十八列傳第十八蕭敵烈拔剌耶律盆奴蕭排押德匹敵耶律資忠耶律瑤質耶律弘古高正耶律的琭大康乂蕭敵烈字涅魯袞宰相撻烈四世孫識度弘遠為鄉里推重始為牛羣敞史帝聞其賢召入侍遷國舅詳穩統和二十八年帝謂羣臣曰高麗康肇弒其君誦立誦族兄詢而相之大逆也宜發兵問其罪羣臣皆曰可敵烈諫曰國家連年征討士卒抏敝況陛下在諒陰年穀不登創痍未復島夷小國城壘完固勝不為武萬一失利恐貽後悔不如遣一介之使往問其故彼若伏罪則已不然俟服除歲豐舉兵未晚時令已下言雖不行識者韙之明年同知左夷離畢事改右夷離畢開泰初率兵巡西邊時夷離菫部下閘撒狘撲里失室勃葛率部民遁敵烈追擒之令復業遷國舅詳穩從樞密使耶律世良伐高麗還加同政事門下平章事拜上京留守敵烈為人寬厚達政體廷臣皆謂有王佐才漢人行宮都部署王繼忠薦其材可為樞密使帝疑其黨而止為中京留守卒族子忽古有傳弟拔剌拔剌字別勒隱多智善騎射開泰間以兄為右夷離畢始補郎君累遷奚六部禿里太尉太平末大延琳叛拔剌將北南院兵往討遇于蒲水南院兵少却至手山復與賊遇拔剌乃易兩院旗幟鼓勇力戰破之上聞以手詔褒獎賜內馬重熙中遷四捷軍詳穩謝事歸鄉里數歲起為昭德軍節度使尋改國舅詳穩卒耶律盆奴字胡獨菫惕隱涅魯古之孫景宗時為烏古部詳穩政尚嚴急民苦之有司以聞詔曰盆奴任方面寄以細故究問恐損威望尋遷馬羣太保統和十六年隱實燕軍之不任事者汰之二十八年駕征高麗盆奴為先鋒至銅州高麗將康肇分兵為三以抗我軍一營于州西據三水之會肇居其中一營近州之山一附城而營盆奴率耶律弘古擊破三水營擒肇李玄蘊等軍望風潰會大軍至斬三萬餘級追至開京破敵於西嶺高麗王詢聞邊城不守遁去盆奴入開京焚其王宮乃撫慰其民人上嘉其功遷北院大王薨蕭排押字韓隱國舅少父房之後多智略能騎射統和初為左皮室詳穩討阻卜有功四年破宋將曹彬米信兵于望都凡軍事有疑每預參決尋總永興宮分糺及舍利拽剌二皮室等軍與樞密使耶律斜軫收復山西所陷城邑是冬攻宋隸先鋒圍滿城率所部先登拔之改南京統軍使尚衞國公主拜駙馬都尉加同政事門下平章事十三年歷北南院宣徽使條上時政得失及賦役法上嘉納焉十五年加政事令遷東京留守二十二年復攻宋將渤海軍下德清軍後蕭撻凜卒專任南面事宋和議成為北府宰相聖宗征高麗將兵由北道進至開京西嶺破敵兵斬數千級高麗王詢懼奔平州排押入開京大掠而還帝嘉之封蘭陵郡王開泰二年以宰相知西南面招討使五年進王東平排押為政寬裕而善斷諸部畏愛民以殷富時議多之七年再伐高麗至開京敵奔潰縱兵俘掠而還渡茶陀二河敵夾射排押委甲仗走坐是免官太平三年復王豳薨弟德德字遜寧有膽略而善謀統和元年尚越國公主拜駙馬都尉遷南面林牙從宣徽使耶律阿沒里征高麗還改北面林牙會宋將曹彬米信侵燕耶律休哥與德議軍事多見信用為東京留守六年上攻宋圍沙堆德獨當一面城上矢石如雨德意氣自若督將士奪其陴城陷中流矢太后親臨視賜藥攻長城口復先登太后益多其功時高麗未附德受詔率兵拔其邊城王治懼上表請降十二年八月賜啟聖竭力功臣從都部署和朔奴討兀惹未戰兀惹請降德利其俘獲不許兀惹死戰城不能拔和朔奴議欲引退德曰以彼倔強吾奉詔來討無功而還諸部謂我何若深入多獲猶勝徒返和朔奴不得已進擊東南諸部至高麗北鄙比還道遠糧絕士馬死傷者衆坐是削功臣號十四年為行軍都部署伐蒲盧毛𩽆部還公主疾太后遣宮人賢釋侍之德私焉公主恚而薨太后怒賜死後追封蘭陵郡王子匹敵匹敵字蘇隱一名昌裔生未月父母俱死育于禁掖既長尚秦晉王公主拜駙馬都尉為殿前副點檢統和八年改北面林牙太平四年遷殿前都點檢出為國舅詳穩九年渤海大延琳叛勢掠鄰部與南京留守蕭孝穆往討孝穆欲全城降乃築重城圍之數月城中人陰來納款遂擒延琳東京平以功封蘭陵郡王十一年聖宗不豫先是欽哀與仁德皇后有隙以匹敵嘗為后所愛忌之時護衞馮家奴上變誣后弟浞卜與匹敵謀逆以皇后攝政徐議當立者公主竊聞其謀謂匹敵曰爾將無罪被戮與其死何若奔女直國以全其生匹敵曰朝廷詎肯以飛語害忠良寧死弗適他國及欽哀攝政殺之耶律資忠字沃衍小字札剌系出仲父房兄國留善屬文聖宗重之時妻弟之妻阿古與奴通將奔女直國國留追及奴殺之阿古自經阿古母有寵于太后事聞太后怒將殺之帝度不能救遣人訣別問以後事國留謝曰陛下憫臣無辜恩漏九泉死且不朽既死人多寃之在獄著兔賦寤寐歌為世所稱資忠博學工辭章年四十未仕聖宗知其賢召補宿衞數問以古今治亂資忠對無隱開泰中授中丞眷遇日隆初高麗內屬取女直六部地以賜至是貢獻不時至詔資忠往問故高麗無歸地意由是權貴數短於上出為上京副留守三年再使高麗留弗遣資忠每懷君親輒有著述號西亭集帝與羣臣宴時一記憶曰資忠亦有此樂乎九年高麗上表謝罪始送資忠還帝郊迎同載以歸命大臣宴勞留禁中數日謂曰朕將屈卿為樞密何如資忠對曰臣不才不敢奉詔乃以為林牙知惕隱事初資忠在高麗也弟昭為著帳郎君坐罪沒家產至是乃復橫帳且還舊產詔以外戚女妻之是時樞密使蕭合卓少師蕭把哥寵資忠不肯俛附詆之帝怒奪官數歲出知來遠城事歷保安昭德二軍節度使聖宗崩表請會葬既至伏梓宮大慟曰臣幸遇聖明橫被構譖不獲盡犬馬報氣絕而蘇興宗命醫治疾久之言國舅侍中無憂國心陛下不當復用唐景福舊號於是用事者惡之遣歸鎮卒弟昭有傳耶律瑤質字拔里堇積慶宮人父侯古室韋部節度使瑤質篤學廉介有經世志統和十年累遷至積慶宮使聖宗嘗諭瑤質曰聞卿正直是以進用國有利害爾言宜無所隱由是所陳多見嘉納上征高麗破康肇軍于銅州瑤質之力為多王詢乞降羣臣議皆謂宜納瑤質曰王詢始一戰而敗遽求納款此詐耳納之恐墮其姦計待其勢窮力屈納之未晚已而詢果遁清野無所獲其衆阻險而壘攻之不下瑤質以計降之擢拜四蕃部詳穩時招討使耶律頗的為總管瑤質恥居其下上表曰臣先朝舊臣今既垂老乞還新命覬得常侍左右帝曰朕不使汝久處是任且命無隸招討得專奏事到部戢暴懷善政績顯著卒于官耶律弘古字盆訥隱遙輦鮮質可汗之後統和初嘗以軍事任為拽剌詳穩尋徙南京統軍使十三年徇地南鄙克敵於四岳橋斬首百餘級攻宋以戰功遷東京留守封楚國公後伐高麗副先鋒耶律盆奴擒康肇于銅州三十年西北部叛從南府宰相耶律奴瓜討之及典禁軍號令整肅諸部多降尋遷侍中卒高正不知何郡人統和初舉進士第累遷樞密直學士上將伐高麗遣正先往諭意及還遷右僕射時高麗王詢表請入覲上許之遣正率騎兵千人迓之館于路為高麗將卓思正所圍正以勢不可敵與麾下壯士突圍出士卒死傷者衆上悔輕發釋其罪明年遷工部侍郎為北院樞密副使開泰五年卒耶律的琭字耶寧仲父房之後習兵事為左皮室詳穩統和二十八年伐高麗的琭率本部軍與盆奴等擒康肇李玄蘊于銅州帝壯之曰以卿英才為國戮力真吾家千里駒也乃賜御馬及細鎧明年為北院大王出為烏古敵烈部都詳穩年七十二卒大康乂渤海人開泰間累官南府宰相出知黃龍府善綏撫東部懷服榆里底乃部長伯陰與榆烈比來附送于朝且言蒲盧毛𩽆界多渤海人乞取之詔從其請康乂領兵至大石河駝準城掠數百戶以歸未幾卒論曰高句驪弒其君誦而立詢遼興問罪之師宜其簞食壼漿以迎除舍以待而乃乘險旅拒俾智者竭其謀勇者窮其力雖得其要領而顓顓獨居一海之中自若也豈服人者以德而不以力歟況乎殘毀其宮室係累其民人所謂以燕伐燕也歟嗚呼朱崖之棄捐之之力也敵烈之諫有焉
