body:
  text: 遼史卷十四元中書右丞相總裁托克托等修本紀第十四聖宗五十六年春正月乙丑如長濼二月庚子夏國遣使來貢丙午以監門衛上將軍耶律錫哷為中臺省左相三月甲子女直遣使來貢乙亥布古徳酋長來貢夏四月癸卯振崇徳宫所隸州縣民之被水者丁未罷民輸官俸給自内帑己酉祈雨乙卯如木葉山五月甲子祭白馬神丁卯祠木葉山告來歲南伐庚辰鐵驪來貢乙酉還上京婦人年踰九十者賜物六月戊子朔致奠於祖懐二陵是月清暑炭山秋七月丁巳朔録囚聽政八月丁亥朔東幸九月丁巳朔駐蹕得勝口冬十一月遣使冊髙麗國王誦十二月丙戌宋國王休格薨輟朝五日進封皇弟恒王隆慶為梁國王南京留守鄭王隆祐為吳國王是年放進士楊文立等二人十七年春正月乙卯朔如長春宮夏四月如炭山清暑六月烏舍烏哲圖來秋七月以伐宋詔諭諸道九月庚辰朔幸南京己亥南伐癸卯射鬼箭北院樞密使魏王耶律色珍薨以韓徳讓兼知北院樞密使事冬十月癸酉攻遂城不克遣蕭繼遠攻狼山鎮石砦破之次瀛州與宋軍戰擒其將康昭裔宋順獲兵仗器甲無算進攻樂壽縣拔之次遂城敵衆臨水以拒縱騎兵突之殺戮殆盡是年放進士初錫等四人及第十八年春正月還次南京賞有功將士罰不用命者詔諸軍各還本道二月幸延芳淀夏四月己未駐蹕于清泉淀五月丁酉清暑炭山六月準布叛酋呼紐之弟特徹布率部衆來附呼紐無所歸遂降詔誅之秋七月駐蹕于湯泉九月乙亥朔駐蹕黒河冬十一月甲戌朔授西平王李繼遷子徳昭朔方軍節度使十二月回鶻來貢是年放進士南承保等三人及第十九年春正月辛巳以祗候郎君班詳衮觀音為奚六部大王甲申回鶻進梵僧名醫三月乙亥夏國遣李文貴來貢乙酉西南面招討司奏党項捷壬辰皇后蕭氏以罪降為貴妃賜大丞相韓徳讓名徳昌夏四月乙巳幸吳國王隆祐第視疾丙午問安皇太后五月癸酉清暑炭山丙戌冊蕭氏為齊天皇后庚寅以十伊喇詳衮耶律仁努為伊實大王辛卯以青牛白馬祭天地六月乙巳以所俘宋將康昭裔為昭順軍節度使戊午夏國奏下宋恒懐慶等三州賜詔褒之秋七月丙戌以東京統軍使耶律諾衮為南府宰相八月庚戌達囉克部來貢九月己巳朔問安皇太后戊子駐蹕昌平庚寅西南面招討司奏討吐谷渾捷辛卯幸南京冬十月己亥南伐壬寅次鹽溝徙封吳國王隆祐為楚國王留守京師丁未梁國王隆慶統先鋒軍以進辛亥射鬼箭壬子以青牛白馬祭天地甲寅遼軍與宋兵戰于遂城敗之庚申以黒白羊祭天地丙寅次滿城以泥淖班師十一月庚午射鬼箭丙子宋兵出淤口益津關來侵偵候瑪與虞人珠克擊敗之己卯觀漁儒門濼閏月己酉布古徳來貢己未減關市税十二月庚辰免南京平州租税二十年春正月庚子如延芳淀癸丑東方五色虹見詔安撫西南面向化諸部甲寅夏國遣使貢馬駞辛酉女直宰相伊爾岱來貢二月丁丑女直遣其子來朝髙麗遣使賀伐宋捷三月甲寅遣北府宰相蕭繼逺等南伐壬戌駐蹕鴛鴦濼夏四月丙寅朔文班太保達里塔敗宋兵于梁門甲戌南京統軍使蕭達林破宋軍於泰州乙酉南征將校獻俘賜爵賞有差戊子鐵驪遣使來貢五月乙卯幸炭山清暑六月夏國遣劉仁朂來告下靈州秋七月甲午朔日有食之丁酉以邢抱朴為南院樞密使辛丑髙麗遣使來貢本國地里圗九月癸巳朔謁顯陵告南伐捷冬十月癸亥朔至自顯陵十二月奚王府五帳六節度獻七金山土河川地賜金幣是歳南京平州麥秀兩岐放進士邢祥等六人及第二十一年春正月如鴛鴦濼三月壬辰詔修日厯官毋書細事甲午朝皇太后戊午鐵驪來貢夏四月乙丑女直遣使來貢戊辰烏舍渤海鄂羅木伊埒圗伊哷呼等五部遣使來貢是月耶律諾衮蕭達林獲宋將王繼忠于望都五月庚寅朔清暑炭山丁巳西平王李繼遷薨其子徳昭遣使來告六月己卯贈繼遷尚書令遣西上閤門使丁振弔慰辛巳党項來貢乙酉準布徳埒哩率諸部來降修哈屯城秋七月庚戌準布烏爾古來貢甲寅以奚王府監軍耶律舒嚕為南院大王八月乙酉準布徳埒哩來朝丙戌朝皇太后九月己亥夏國李徳昭復遣使來謝弔贈癸丑幸女河湯泉改其名曰松林冬十月丁巳駐蹕七渡河戊辰以楚國王隆祐為西南面招討使十一月壬辰故裕悦耶律休格之子道士努髙九等謀叛伏誅丙申通括南院部民十二月癸未罷三京諸道貢二十二年春正月丁亥如鴛鴦濼二月乙卯朔女直遣使來貢丙寅南院樞密使邢抱朴薨輟朝三日三月己丑罷番部賀千齡節及冬至重五貢乙未西夏李徳昭遣使上繼遷遺物夏四月丁卯朝皇太后五月清暑炭山六月戊子以哈屯城為鎮州軍曰建安秋七月甲申遣使封夏國李徳昭為西平王丁亥烏舍富珠哩博和哩伊埒圖鄂羅木部來貢八月丙辰党項來貢庚申準布徳埒哩来朝戊辰徳埒哩求婚不許丙子駐蹕於犬牙山九月己丑以南伐故諭髙麗丙午幸南京女直遣使獻所獲烏哲圖妻子丁未致祭于太宗皇帝廟以北院大王穆爾古太尉老君努監北南王府兵庚戌命楚國王隆祐留守京師閏月己未南伐癸亥次固安以所獲諜者射鬼箭甲子以青牛白馬祭天地丙寅遼師與宋兵戰于唐興大破之丁卯蕭達林與宋軍戰于遂城敗之庚午軍于望都冬十月乙酉以黒白羊祭天地丙戌攻瀛州不克甲午下祁州賚降兵以酒脯祭天地己酉西平王李徳昭遣使謝封冊十一月癸亥軍馬都指揮使耶律科里遇宋兵于洺州擊退之甲子東京留守蕭巴雅爾獲宋魏府官田逢吉郭守榮常顯劉綽等以獻丁卯南院大王善補奏宋遣人遺王繼忠弓矢密請求和詔繼忠與使㑹許和庚午攻破徳清軍壬申次澶淵蕭達林中伏弩死乙亥攻破通利軍丁丑宋遣崇儀副使曹利用請和即遣飛龍使韓杞持書報聘十二月庚辰朔日有食之既癸未宋復遣曹利用來以無還地之意遣監門衛大將軍姚東之持書徃報戊子宋遣李繼昌請和以太后為叔母願歳輸銀十萬兩絹二十萬匹許之即遣閤門使丁振持書報聘己丑詔諸軍解嚴是月班師皇太后賜大丞相齊王韓徳昌姓耶律徙王晉是年放進士李可封等三人二十三年春正月戊午還次南京庚申大饗將卒爵賞有差二月丙戌復置𣙜場於振武軍丁巳夏國遣使告下宋青城辛酉朝皇太后以特哩衮華格為南院大王行軍都監老君努為特哩衮振党項部丁夘回鶻來貢丁丑改易州飛狐招安使為安撫使夏四月丙戌女直及阿爾斯蘭回鶻遣使來貢乙未鐵驪來貢己亥党項來侵五月戊申朔宋遣孫僅等來賀皇太后生辰乙卯以金帛賜陣亾將士家丙寅髙麗以與宋和遣使來賀六月壬辰清暑炭山甲午準布徳埒哩遣使来賀與宋和己亥達旦國九部遣使來聘秋七月癸丑問安皇太后戊午党項來貢辛酉以青牛白馬祭天地壬戌烏爾古來貢丁卯女直遣使來貢阿爾斯蘭回鶻遣使來請先留使遣之九月甲戌遣太尉阿里太傅揚魯賀宋主生辰冬十月丙子朔布古徳來貢戊子朝皇太后甲午駐蹕七渡河癸卯宋歲幣始至後為常十一月戊申上遣太保和卓頒給使韓簡太后遣太師博諾政事舎人髙正使宋賀正旦辛亥觀漁桑乾河丁巳詔大丞相耶律徳昌出宮籍屬于横帳十二月丙申宋遣周漸等來賀千齡節丁酉復遣張若谷等來賀正旦二十四年春正月如鴛鴦濼夏五月壬寅朔幸炭山清暑幽皇太妃呼紐子懐州囚夫人伊蘭于南京餘黨皆生瘞之秋七月辛丑朔南幸八月丙戌改南京宮宣教門為元和外三門為南端左掖門為萬春右掖門為千秋是月沙州燉煌王曹夀遣使進大食國馬及羙玉以對衣銀器等物賜之九月幸南京冬十月庚午朔帝率羣臣上皇太后尊號曰睿徳神畧應運啓化承天皇太后羣臣上皇帝尊號曰至徳廣孝昭聖天輔皇帝大赦是年放進士楊佶等二十二人及第二十五年春正月建中京二月如鴛鴦濼夏四月清暑炭山六月賜皇太妃呼紐死于幽所秋七月壬申西平王李徳昭母薨遣使弔祭甲戌遣使起復九月西北路招討使蕭托雲討準布破之冬十月丙申駐蹕中京十二月己酉振饒州饑民二十六年春二月如長濼夏四月辛卯朔祠木葉山五月庚申朔還上京丙寅髙麗進龍鬚草席己巳遣使賀中京成庚午致祭祖懐二陵辛未駐蹕懐州秋七月増太祖太宗讓國皇帝世宗諡仍諡皇太弟魯呼曰欽順皇帝冬十月戊子朔幸中京十二月蕭托雲奏討甘州回鶻降其王伊嚕勒撫慰而還是年放進士史克忠等一十三人二十七年春正月釣魚土河獵于瑞鹿原夏四月丙戌朔駐蹕中京營建宮室庚戌廢霸州處置司秋七月甲寅朔霖雨潢土斡拉陰涼四河皆溢漂没民舎八月甲申北幸冬十一月壬子朔行柴冊禮十二月乙酉南幸皇太后不豫戊子肆赦辛卯皇太后崩于行宮壬辰遣使報哀于宋夏髙麗戊申如中京己酉詔免賀千齡節是歲御前引試劉二宜等三人遼史卷十四遼史卷十四考證聖宗紀五統和十七年秋七月伐宋冬十月癸酉攻遂城不克次瀛州與宋軍戰擒其將康昭裔宋順按康昭裔通鑑内作康保裔㨿通鑑説則保裔乃戰死将真宗優詔贈恤錄其子孫㨿遼史則昭裔已就擒後且以為昭順軍節度使二者未知孰是十八年春正月還次南京按宋通鑑契丹知帝親征縦掠而去然則聖宗之還次南京因宋真宗之親征而遼史諱之也二十二年閏九月丙寅遼師與宋兵戰于唐興按續通鑑唐興作唐河二十三年十二月丙申宋遣周漸等來賀千齡節丁酉復遣張若谷等賀正旦按周漸之使宋史不載而正旦所遣乃韓國華也此云張若谷與宋史異遼史卷十四考證
