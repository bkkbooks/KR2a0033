body:
  text: 遼史卷四十四元中書右丞相總裁托克托等修志第十四厯象志下朔考古者太史掌年歳年以叙事國史以事繫日以日月時繫年時月不正則叙事不一故二史合為一官頒厯授時必大一統遼漢周宋俱行夏時各自為厯國史閏朔頗有異同遼初用乙未元厯本何承天元嘉厯法後用大明厯本祖冲之甲子元厯法承天日食晦朏一章必七閏冲之日必食朔或四年一閏用乙未厯漢周多同用大明厯則間與宋異國史叙事甲子不殊閏朔多異以此故也耶律儼紀以大明法追正乙未月朔又與陳大任紀時或牴牾稽古君子往往惑之用五代職方考志契丹州軍例作朔考法殊曰異傳訛曰誤遼史不書國儼大任偏見竝見各名地史以國冠朔竝見注于后宋元豐元年十二月詔司天監考遼及高麗日本國歴與奉元厯同異遼己未嵗氣朔與宣明厯合日本戊午嵗與遼厯相近高麗戊午年朔與奉元厯合氣有不同戊午遼太康四年己未五年也當遼宋之世二國司天固相參考矣高麗所進大遼事蹟載諸王冊文頗見月朔因附入象孟子有言天之高也星辰之逺也苟求其故千嵗之日至可坐而致甚哉聖人之用心可謂廣大精㣲至矣盡矣日有晷景月有明魄斗有建除星有昬旦觀天之變而制器以候之八尺之表六尺之筒百刻之漏日月星辰示諸掌上運行既察度分既審於是象天圜以顯運行置地櫃以驗出入渾象是作天道之常尋尺之中可以俯窺陶唐之象是矣設三儀以明度分管一衡以正辰極渾儀是作天文之變六合之表可以仰觀有虞之璣是矣體莫固於金用莫利於水範金走水不出户而知天道此聖人之所以為聖也厯代儀象表漏各具于志太宗大同元年得晉厯象刻漏渾象後唐清泰二年已稱損折不可施用其至中京者槩可知矣古之鍊銅黑黄白青之氣盡然後用之故可施扵乆逺唐沙門一行鑄渾天儀時稱精妙未幾銅鐵漸澁不能自轉置不復用金質不精水性不行况移之沍寒之地乎刻漏晉天福三年造周官挈壺氏懸壺必㸑之以火地雖沍寒葢可施也官星古者官星萬餘名遭秦焚滅圖籍世秘不傳漢收散亡得甘徳石申巫咸三家圖經經緯合千餘官僅存什一分為三垣四宫二十八宿樞以二極建以北斗緯以五星日月代明貴而太一賤逮屎糠占决之用亦云備矣司馬遷天官書既以具錄後世保章守候無出三家官星之外者天象昭垂厯代不易而漢晉隋唐之書累志天文近於衍矣且天象禨祥律格有禁書于勝國之史詿誤學者不宜書其日食星變風雲震雪之祥具載帝紀不復書遼史卷四十四
