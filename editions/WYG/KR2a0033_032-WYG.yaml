body:
  text: 遼史卷三十二元中書右丞相總裁托克托等修志第二營衛志中行營周官土圭之法日東景朝多風日北景長多寒天地之間風氣異宜人生其間各適其便王者因三才而節制之長城以南多雨多暑其人耕稼以食桑麻以衣宫室以居城郭以治大漠之間多寒多風畜牧畋漁以食皮毛以衣轉徙隨時車馬爲家此天時地利所以限南北也遼國盡有大漠浸包長城之境因宜爲治秋冬違寒春夏避暑隨水草就畋漁歲以爲常四時各有行在之所謂之巴納春巴納曰鴨子河濼皇帝正月上旬起牙帳約六十日方至天鵝未至卓帳氷上鑿氷取魚氷泮乃縱鷹鶻捕鵝鴈晨出暮歸從事弋獵鴨子河濼東西二十里南北三十里在長春州東北三十五里四面皆沙堝多榆栁杏林皇帝毎至侍御皆服墨緑色衣各備連鎚一柄鷹食一器刺鵝錐一枚於濼周圍相去各五七步排立皇帝冠巾衣時服繋玉束帶於上風望之有鵝之處舉旗探騎馳報遠泊鳴鼓鵝驚騰起左右圍騎皆舉幟麾之五坊擎進海東青鶻拜授皇帝放之鶻擒鵝墜勢力不加排立近者舉錐刺鵝取腦以飼鶻救鶻人例賞銀絹皇帝得頭鵝薦廟羣臣各獻酒果舉樂更相酬酢致賀語皆挿鵝毛于首以爲樂賜從人酒遍散其毛弋獵網釣春盡乃還夏巴納無常所多在圖爾山道宗毎歲先幸黒山拜聖宗興宗陵賞金蓮乃幸子河避暑圖爾山在黒山東北三百里近饅頭山黒山在慶州北十三里上有池池中有金蓮子河在圖爾山東北三百里懷州西山有清涼殿亦爲行幸避暑之所四月中旬起牙帳卜吉地爲納涼所五月末旬六月上旬至居五旬與北南臣僚議國事暇日遊獵七月中旬乃去秋巴納曰伏虎林七月中旬自納涼處起牙帳入山射鹿及虎林在永州西北五十里嘗有虎據林傷害居民畜牧景宗領數騎獵焉虎伏草際戰慄不敢仰視上舎之因號伏虎林毎歲車駕至皇族而下分布濼水側伺夜將半鹿飲鹽水令獵人吹角效鹿鳴既集而射之謂之䑛鹻鹿又名呼鹿冬巴納曰廣平淀在永州東南三十里本名白馬淀東西二十餘里南北十餘里地甚坦夷四望皆沙磧木多榆栁其地饒沙冬月稍暖牙帳多於此坐冬與北南大臣㑹議國事時出校獵講武兼受南宋及諸國禮貢皇帝牙帳以槍爲硬寨用毛繩連繋毎槍下黒氈傘一以芘衛士風雪槍外小氈帳一層毎帳五人各執兵仗爲禁圍南有省方殿殿北約二里曰壽寧殿皆木柱竹榱以氈爲蓋彩繪韜柱錦爲壁衣加緋繡額又以黃布繡龍爲地障牕槅皆以氈爲之傅以黃油絹基高尺餘兩廂廊廡亦以氈蓋無門户省方殿北有鹿皮帳帳次北有八方公用殿壽寧殿北有長春帳衛以硬寨宫用契丹兵四千人毎日輪番千人祗直禁圍外卓槍爲寨夜則㧞槍移卓御寢帳周圍拒馬外設舖傳鈴宿衛毎歲四時周而復始皇帝四時巡守契丹大小内外臣僚并應役次人及漢人宣徽院所管百司皆從漢人樞密院中書省唯摘宰相一員樞密院都副承旨二員令史十人中書令史一人御史臺大理寺選摘一人扈從毎歲正月上旬車駕啟行宰相以下還於中京居守行遣漢人一切公事除拜官僚止行堂帖權差俟㑹議行在所取㫖出給誥勅文官縣令録事以下更不奏聞聽中書銓選武官須奏聞五月納涼行在所南北臣僚㑹議十月坐冬行在所亦如之部族上部落曰部氏族曰族契丹故俗分地而居合族而處有族而部者五院六院之類是也有部而族者奚王室韋之類是也有部而不族者特哩特黙實保哈凖之類是也有族而不部者約尼九帳皇族三父房是也竒善八部爲高麗蠕蠕所侵僅以萬口附于元魏生聚未幾北齊見侵掠男女十餘萬口繼爲突厥所逼寄處高麗不過萬家部落離散非復古八部矣别部有臣附突厥者内附于隋者依赫辰水而居部落漸衆分爲十部有地遼西五百餘里唐世達呼哩氏仍爲八部而松漠𤣥州别出亦十部也約尼氏承萬榮格圖肯散敗之餘更爲八部然約尼徳哷勒别出又十部也蘓爾威汗析爲二十部契丹始大至遼太祖析九帳三房之族更列二十部聖宗之世分置十有六増置十有八并舊爲五十四部内有巴哩伊蘓濟勒國舅族外有附庸十部氏族可知者略具皇族外戚二表餘五院六院伊實部止見裕爾庫薩里布聶哷威部止見薩里布聶哷圖魯卜圖吉部止見唐古爾杭愛皆兄弟也奚王府部希沙哲哩則臣主也丕勒部有紐紐卓特部有斡其餘世系名字皆漫無所考矣舊志曰契丹之初草居野次靡有定所至聶哷始制部族各有分地太祖之興以德哷勒部強熾析爲五院六院奚六部以下多因俘降而置勝兵甲者即著軍籍分𨽻諸路詳袞統軍招討司番居内地者歲時田牧平莽間邉防糺戸生生之資仰給畜牧績毛飲湩以爲衣食各安舊風狃習勞事不見紛華異物而遷故家給人足戎備整完卒之虎視四方強朝弱附東踰蟠木西越流沙莫不率服部族寔爲之爪牙云古八部錫萬丹部赫特赫部佛佛頁部裕嚕部錫琳部博恰部理部圖嚕部契丹之先曰奇善汗生八子其後族屬漸盛分爲八部居于松漠之間今永州木葉山有契丹始祖廟竒善汗克敦併八子像皆在焉潢河之西土河之北竒善汗故壤也隋契丹十部元魏末美佛赫烏雲畏高麗蠕蠕侵逼率車三千乘衆萬口内附乃去奇善汗故壤居于白狼水東北齊文宣帝自平州三道來侵虜男女十餘萬口分置諸州又爲突厥所逼以萬家寄處高麗境内隋開皇四年諸美佛赫悉衆款塞聽居白狼故地又别部寄處高麗者曰楚布等内附詔置克實克囊嘉特之北又别部臣附突厥者四千餘户來降詔給糧遣還固辭不去部落漸衆徙逐水草依赫辰水而居在遼西正北二百里其地東西亘五百里南北三百里分爲十部逸其名唐達呼哩氏八部德濟部峭落州赫伯部彈汗州都呼部無逄州芳阿部羽陵州圖勒彬部日連州芮奚部徒河州卓津部萬丹州富部州二匹黎赤山唐太宗置𤣥州以契丹大帥珠奇爲刺史又置松漠都督府以庫克爲都督分八部并𤣥州爲十州則十部在其中矣約尼氏八部達爾扎部伊斯琿部舍琿部諾爾威部頗摩部訥古濟部濟勒勤部實袞部唐開元天寳間達呼哩氏既微遼始祖聶哷立達年扎里為蘇爾威汗時契丹因萬榮之敗部落凋散即故有族衆分爲八部聶哷所統德哷勒部自爲别部不與其列并約尼德哷勒亦十部也約尼蘓爾威汗二十部耶律七部舒敏五部八部聶哷相蘓爾威汗分三耶律爲七二舒敏爲五并前八部爲二十部三耶律一曰達呼哩二曰約尼三曰錫里皇族也二舒敏一曰伊蘓濟勒二曰巴哩國舅也其分部不詳可知者曰德哷勒曰伊實曰丕勒曰卓特曰威曰圖魯卜曰納喇曰圖吉又有右大部左大部凡十逸其二達呼哩約尼析爲六而錫里合爲一兹所以德哷勒部終約尼之世强不可制云遼史卷三十二遼史卷三十二考證有部而不族者特哩特黙實保哈準是也按哈準本志下卷及兵衛百官志俱作遏术此復作葛术今併改納喇威部按納喇威原本作湼剌烏古本志下卷威部之先曰薩里布納喇部之先曰聶哷威舊作烏隗原本烏隗作烏古與下卷不合係訛舛若烏爾古納喇部舊作烏古湼剌部者别爲一部與此迥異未可牽合今據改遼史卷三十二考證
