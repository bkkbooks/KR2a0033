body:
  text: 遼史卷八十二元中書右丞相總裁托克托等修列傳第十二耶律隆運徳威逹魯制心耶律巴古濟蕭揚阿克武白蕭常格耶律和克穆爾古耶律隆運本姓韓名徳讓西南面招討使匡嗣之子也統和十九年賜名徳昌二十二年賜姓耶律二十八年復賜名隆運重厚有智畧明治體喜建功立事侍景宗以謹飭聞加東頭承奉官補樞密院通事轉上京皇城使遙授彰徳軍節度使代其父匡嗣為上京留守權知京事甚有聲尋復代父守南京時人榮之宋兵取河東侵燕五院糺詳衮希逹統軍蕭托果等敗歸宋兵圍城招脅甚急人懐二心隆運登城日夜守禦援軍至圍解及戰高梁河宋兵敗走隆運邀擊又破之以功拜遼興軍節度使徵為南院樞密使景宗疾大漸與耶律色珍俱受顧命立梁王為帝皇后為皇太后稱制隆運總宿衛事太后益寵任之統和元年加開府儀同三司兼政事令四年宋遣曹彬米信將十萬衆來侵隆運從太后出師敗之加守司空封楚國公師還與北府宰相室昉共執國政上言西州數被兵加以嵗饑宜輕税賦以來流民從之六年太后觀撃鞠呼魯蘇突隆運墜馬命立斬之詔率師伐宋圍沙堆敵乘夜來襲隆運嚴軍以待敗走之封楚王九年復言燕人挾姦苟免賦役貴族因為囊橐可遣北院宣徽使趙智戒諭從之十一年丁母憂詔强起之明年室昉致政以隆運代為北府宰相仍領樞密使監修國史賜興化功臣十二年六月奏三京諸鞫獄官吏多因請託曲加寛貸或妄行榜掠乞行禁止上可其奏又表請任賢去邪太后喜曰進賢輔政真大臣之職優加賜賚服闋加守太保兼政事令㑹北院樞密使耶律色珍薨詔隆運兼之久之拜大丞相進王齊總二樞府事以南京平州嵗不登奏免百姓農器錢及請平諸郡商賈價並從之二十二年從太后南征及河許宋成而還徙王晉賜姓出宮籍𨽻横帳季父房後乃改賜今名位親王上賜田宅及陪葬地從伐高麗還得久疾帝與后臨視醫藥薨年七十一贈尚書令諡文忠官給葬具建廟乾陵側無子清寜三年以魏王特布子雅嚕為嗣天祚立以皇子額嚕温繼之弟徳威姪制心徳威性剛介善馳射保寕初歴上京皇城使儒州防禦使改北院宣徽使乾亨初丁父喪彊起復職權西南招討使統和初党項寇邉一戰却之賜劔許便宜行事領圖魯卜徳哷勒二糺軍以平霜庫赫功真授招討使夏州李繼遷叛宋内附徳威請納之既得繼遷諸夷皆從璽書褒奬與特哩衮耶律善補敗宋楊繼業加開府儀同三司政事門下平章事未幾以山西城邑多䧟奪兵柄李繼遷受賂潜懐二心奉詔率兵徃諭繼遷託以西征不出徳威至靈州俘掠而還年五十五卒贈兼侍中子帕克戩彰國軍節度使孫色實達魯色實終特哩衮達魯字遵寜幼養宮中授小將軍重熈初歴北院宣徽使右林牙副㸃檢特哩衮改西北路招討使封漆水郡王請減軍籍三千二百八十人後以私取回鶻使者獺毛裘及私取準布貢物決大杖削爵免官俄起為北院宣徽使十九年改烏爾古徳哷勒部都詳衮尋為東北路詳衮封混同郡王清寜初徙王鄧擢拜南府宰相以年老乞骸骨更王漢太康中薨年八十達魯神情秀徹聖宗子視之興宗待以兄禮雖貴愈謙初為都㸃檢扈從獵黒嶺獲熊上因樂飲謂達魯曰汝有求乎對曰臣富貴踰分不敢他望惟臣叔先朝優遇身殁之後不肖子坐罪籍没四時之薦享諸孫中得赦一人以主祭臣願畢矣詔免籍復其産子燕五官至南京歩軍都指揮使制心小字汗努父徳崇善醫視人形色輒能決其病累官至武定軍節度使制心善馴鷹隼統和中為歸化州刺史開泰中拜上京留守進漢人行宮都部署封漆水郡王以皇后外弟恩遇日隆樞密副使蕭和卓用事制心奏和卓寡識度無行檢上黙然每内宴歡洽輒避之皇后不悦曰汝不樂耶制心對曰寵貴鮮能長保是以憂耳太平中歴中京留守特哩衮南京留守徙王燕遷南院大王或勸制心奉佛對曰吾不知佛法惟心無私則近之矣一日沐浴更衣而臥家人聞絲竹之聲怪而入視則已逝矣年五十三贈政事令追封陳王守上京時酒禁方嚴有捕獲私醞者一飲而盡笑而不詰卒之日部民若哀父母耶律巴古濟字保諾延六院額爾竒木博果濟之後勇悍善治生保寧中為天徳軍節度歴南京侍衛馬歩軍都指揮使以討平党項羌阿里沙宻丕勒布宻遷南院大王聖宗即位太后稱制㑹羣臣議軍國事巴古濟上疏陳便宜數事稱㫖即日兼領山西路諸州事統和四年宋將曹彬等侵燕巴古濟擊之甚力賜輸忠保節致主功臣總知山西五州㑹有告巴古濟曲法虐民者按之有狀以大杖決之八年為南京統軍使卒子雅里官至詳衮蕭揚阿克字稍隱端毅簡嚴通遼漢字天文相法父卒自五畨部親挽喪車至奚王嶺人稱其孝年十九為本班郎君歴鐡林鐡鷂大鷹三軍詳衮乾統元年由烏爾古徳哷勒部屯田太保刺易州幸臣劉彦良以事至州怙寵恣横為揚阿克所沮彦良歸妄加毁訾尋遣人代揚阿克州民詣闕請留即日授武安州觀察使歴烏爾古納喇順義彰信等軍節度使權知東北路統軍使事聞耶律朗布都勒斡等叛獨引麾下三十餘人追捕之身被二創生擒十餘人送之行在坐不獲首惡免官未幾權南京留守卒武白不知何郡人為宋國子博士差知相州至通利軍為我軍所俘詔授上京國子博士改臨潢縣令遷廣徳軍節度副使先是有訟宰相劉慎行與子婦姚氏私者有司出其罪聖宗詔曰鞫之白正其事使新羅還權中京留守時慎行諸子皆處權要以白斷百姓分籍事不直坐左遷未㡬遷尚書左丞相樞密事拜遼興軍節度使致仕卒蕭常格字和爾沁國舅之族祖揚珠同政事門下平章事父實埒累官節度使常格魁偉寡言年三十餘始為祗候郎君歴本族將軍松山州刺史壽隆二年以女為燕王妃拜永興宮使及妃生子為南院宣徽使尋改漢人行宮都部署統和初加太子太師為國舅詳衮二年改遼興軍節度使召為北府宰相以柴册禮加兼侍中天慶元年致仕卒諡曰欽肅耶律和克字海蘭六院額爾竒木迪里孫少頴悟重然諾保寧初補御琖郎君十年使宋還以宋取河東之意聞于上燕王韓匡嗣曰何以知之和克曰諸僣號之國宋皆併收惟河東未下今宋講武習戰意必在漢匡嗣力沮乃止明年宋果伐漢帝以和克能料事器之乃曰吾與匡嗣慮不及此授涿州刺史統和初皇太后稱制召赴京師與韓徳讓以事相忤徳讓怒取䕶衛所執戎仗擊其腦卒子穆爾古穆爾古字遙隱有智識善射統和初拜南靣林牙四年宋侵燕太后親征穆爾古為前鋒手中流矢㧞而復進太后既至穆爾古以創不能戰與北府宰相蕭繼先巡邏境上累遷北院大王七年伐宋為先鋒與耶律諾衮破其將李忠吉于定州以疾卒于軍論曰徳讓在統和間位兼將相其克敵制勝進賢輔國功業茂矣至賜姓名王齊晉抑有寵於太后而致然歟宗族如徳威平党項達魯完宗祀制心不苟合家聲益振豈無所自哉若巴古濟之忠揚阿克之孝武白之直亦彬彬乎一代之良臣矣遼史卷八十二遼史卷八十二考證蕭揚阿克傳按蕭揚阿克父約音努終五番部節度使有傳見後列傳第二十六而揚阿克反居父前史殊疎舛傳論若巴古濟之忠按巴古濟原文勃古哲此處止稱勃古二字今併改遼史卷八十二考證
