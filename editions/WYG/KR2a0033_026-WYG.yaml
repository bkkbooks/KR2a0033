body:
  text: 遼史卷二十六元中書右丞相總裁托克托等修本紀第二十六道宗六壽隆元年春正月己亥如混同江庚戌西南靣招討司奏博索摩來侵蕭阿嚕岱等擊破之乙卯振奉聖州貧民二月戊辰賜左右二皮室貧民錢癸酉高麗遣使來貢乙亥駐蹕魚兒濼三月丙午賜東北路貧民絹夏四月丁卯額特埒奏討額圗格爾㨗乙亥女直遣使來貢庚寅錄西北路有功將士五月乙未朔以左伊勒希巴耶律托多為特哩衮南京宣徽使耶律特黙為北院大王癸卯贈陣亡者官丁巳駐囉特哩嶺六月己巳以知奚六部大王事和勒博為本部大王權參知政事趙孝嚴為漢人行宮都部署圍場都管薩巴以討準布功加鎭國大將軍癸巳準布長約羅岱及塔瑪噶來貢秋七月庚子準布長敏逹蘇等來貢癸卯獵沙嶺癸丑伯哩八部來附進方物甲寅額特埒奏討磨古斯㨗九月甲寅祠木葉山丙辰詔西京礟人弩人敎西北路漢軍冬十月甲子駐蹕藕絲淀甲戌以北靣林牙耶律大悲努為右伊勒希巴癸未以參知政事王師儒為樞密副使漢人行宮都部署趙孝嚴參知政事壬辰錄討準布有功將士十一月丙申女直遣使進馬己亥以都統額特埒為西北路招討使封漆水郡王甲辰夏國進貝多葉佛經庚申高麗王昱疾命其子顒權知國事十二月癸亥朔以知北院樞密使事耶律阿蘇為北院樞密使是年放進士陳衡甫等百三十人二年春正月甲午如春水癸卯西南靣招討司討博索摩破之乙卯駐蹕錫訥蘇辛酉市牛給烏爾古德哷勒威烏爾古部貧民二月癸亥振逹木琳巴古部夏四月己卯振西北邊軍六月辛酉駐蹕薩拉納秋七月甲午準布來貢丙午臘赤山八月乙丑伯哩八部進馬九月丙午徙烏爾古徳哷勒部于烏納水以扼北邊之衝冬十月戊辰駐蹕藕絲淀庚辰高麗遣使來貢十二月己未額特埒討黙爾吉破之壬戌南府宰相耶律都勒斡致仕癸亥以蕭托卜嘉為北府宰相耶律大悲努殿前都㸃檢乙亥夏國獻宋俘三年春正月丁亥如春水壬寅烏爾古部節度使耶律辰嘉努以功加尚書右僕射癸卯駐蹕雙山二月丙辰南京水遣使振之閏月丙午準布長穆色克年布爾古長托果斯黙爾吉長呼喇巴等請復舊地貢方物從之三月辛酉燕國王延禧生子賜名塔魯妃父長格遷左監門衛上將軍仍賜官屬錢是春高麗王昱薨夏四月南府宰相趙廷睦出知興中府事參知政事牛溫舒兼同知樞密院事五月癸亥額特埒討準布破之己巳駐蹕薩拉納六月甲申詔罷諸路馳驛貢新丙戌詔每冬駐蹕之所宰相以下構宅毋役其民辛丑夏人來告宋城要地遣使之宋諭與夏和庚戌以契丹行宮都部署耶律烏頁為南院大王秋七月壬子朔獵黑嶺八月己亥博羅滿逹勒部長率其民歸乙巳彗星見西方九月壬申駐蹕藕絲淀丁丑以武定軍節度使梁援為漢人行宫都部署戊寅額特埒奏討黙爾吉㨗己卯五國部長來貢冬十月庚戌以西北路招討使額特埓為南府宰相十一月乙卯博囉滿逹勒來貢戊午以安車召醫巫閭山僧志逹己未以中京留守韓資讓知樞密院事同知南院樞密使事蕭藥師努知右伊勒希巴事丁丑西北路統軍司奏討黙爾吉㨗四年春正月壬子如魚兒濼己已徒準布等貧民于山前辛未宋遣使來饋錦綺三月庚午幸春州丙子有司奏黄河清夏四月辛丑以雨罷獵五月癸酉納延奏北邊㨗甲戌駐蹕薩拉納六月戊寅朔夏國為宋所攻求援丁亥以遼興軍節度使聶哷為特哩衮前知特哩衮事耶律果桑為南京統軍使甲午以參知政事牛溫舒兼知中京留守事秋七月戊午如黑嶺冬十月乙亥朔駐蹕藕絲淀己卯以南府宰相額特埒兼契丹行宮都部署以傅燕國王延禧十一月乙巳朔知右伊勒希巴事蕭藥師努樞密直學士耶律儼使宋諷與夏和辛酉夏復遣使求援十二月壬辰為燕國王延禧行再生禮曲赦三百里内囚五年春正月乙巳如魚兒濼乙丑詔夏國王李乾順伐博索摩等部夏五月壬戌藥師努等使宋迴奏宋罷兵癸亥謁乾陵戊辰以南府宰相額特埒兼西北路招討使禁軍都統己巳駐蹕㳂栁湖六月甲申以奚六部大王和勒博為契丹行宮都部署知右伊勒希巴事蕭藥師努南靣林牙兼知契丹行宮都部署事乙未五國部長來朝戊戌準布來貢己亥以興聖宮使赫嘉努為右伊勒希巴秋七月壬寅提克德長托廸來貢辛亥如逹里庫山閏九月丙子駐蹕都爾嘉冬十月己亥朔高麗王顒遣使乞封冊丁巳額特埒奏討額圗格爾㨗丙寅以同知南京留守事蕭塔喇台知北院樞密使事丁卯宋遣郭知章曹平來聘戊辰振遼州饑仍免租賦一年十一月甲戌振南北二糺乙酉夏國以宋罷兵遣使來謝十二月甲子以參知政事趙孝嚴為漢人行宮都部署漢人行宮都部署梁援為遼興軍節度使六年春正月癸酉南院大王耶律烏頁薨壬午以太師致仕托海起為奚六部大王丁亥如春水辛卯額特埒執磨古斯來獻丙申詔問民瘼二月丁未以烏爾古部節度使辰嘉努為南院大王己酉磔磨古斯于市癸丑出絹賜五院貧民辛酉宋遣使告宋主煦殂弟佶嗣位即遣使弔祭三月甲申弛朔州山林之禁夏四月丁酉朔日有食之癸卯如炭山五月壬午烏爾古部討察察哩破之乙酉漢人行宮都部署趙孝嚴薨丙戌駐蹕納克濼辛卯宋饋先帝遺物乙未以東京留守和囉木薩噶為特哩衮南院宣徽使蕭常格為漢人行宮都部署六月庚子遣使賀宋主辛丑以有司案牘書宋主嗣位為登寳位詔奪宰相鄭顓以下官出顓知興中府事韓資讓為崇義軍節度使御史中丞韓君義為廣順軍節度使癸丑準布長來貢戊午遣使決五京滯獄己未以遼興軍節度使梁援為樞密副使秋七月庚午如沙嶺壬申額圗格爾諸部宼西北路八月額特埒以兵敗之使來獻㨗九月癸未望祠木葉山戊子駐蹕藕絲淀冬十月壬寅以樞密副使王師儒監修國史癸卯五國諸部長來貢甲寅以平州饑復其租賦一年十一月壬申以天德軍民田世榮三世同居詔官之令一子三班院祇候丙子召醫巫閭山僧志逹設壇内殿戊子夏國王李乾順遣使請尚公主十二月乙未女直遣使來貢己亥以知右伊勒希巴事赫嘉努為北靣林牙辛亥詔燕國王延禧擬注大將軍以下官庚申鐵驪來貢宋遣使來謝帝不豫是歲封高麗王顒為三韓國公放進士康秉儉等八十七人七年春正月壬戌朔力疾御清風殿受百官及諸國使賀是夜白氣如練自天而降黑雲起于西北疾飛有聲北有青赤黑白氣相雜而落癸亥如混同江甲戌上崩于行宮年七十遺詔燕國王延禧嗣位六月庚子上尊諡曰仁聖大孝文皇帝廟號道宗贊曰道宗初即位求直言訪治道勸農興學救葘恤患粲然可觀及夫謗訕之令既行告訐之賞日重羣邪竝興讒巧競進賊及骨肉皇基寖危衆正淪胥諸部反側甲兵之用無寧歲矣一歲而飯僧三十六萬一日而祝髪三千徒勤小惠蔑計大本尚足與論治哉遼史卷二十六遼史卷二十六考證壽隆元年夏四月乙亥三年二月丙辰朔閏月丙午五年春正月乙丑六年十一月壬申按厯象志朔考壽隆元年四月丙寅朔三年二月丙辰朔閏月丙戌朔五年正月甲辰朔六年十一月癸亥朔原文乙亥訛己亥丙辰訛甲辰乙丑訛乙巳壬訛壬壬寅並以干支推算改正至丙午為閏二月之二十一日史未書閏并増以知奚六部大王事和勒博為本部大王按和勒博舊作回離保此又作回里不係一人今畫一改遼史卷二十六考證
