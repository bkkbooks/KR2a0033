body:
  text: 遼史卷三十八元中書右丞相總裁托克托等修志第八地理志二東京道東京遼陽府本朝鮮之地周武王釋箕子囚去之朝鮮因以封之作八條之教尚禮義富農桑外户不閉人不為盜傳四十餘世燕屬真番朝鮮始置吏築障秦屬遼東外徼漢初燕人滿王故空地武帝元封三年定朝鮮為真番臨屯樂浪𤣥莵四郡後漢出入青幽二州遼東𤣥莵二郡沿革不常漢末為公孫度所據傳子康孫淵自稱燕王建元紹漢魏滅之晉陷髙麗後歸慕容垂子寳以勾麗王安為平州牧居之元魏太武遣使至其所居平壤城遼東京本此唐髙宗平髙麗於此置安東都䕶府後為渤海大氏所有大氏始保挹婁之東牟山武后萬歳通天中為契丹盡忠所逼有乞乞仲象者度遼水自固武后封為震國公傳子祚榮建都邑自稱震王併吞海北地方五千里兵數十萬中宗賜所都曰輝罕州封渤海郡王十有二世至彛震僭號改元擬建宫闕有五京十五府六十二州為遼東盛國輝罕州即故平壤城也號中京顯徳府太祖建國攻渤海㧞輝罕城俘其王大諲譔以為東丹王國立太子托雲為人皇王以主之神册四年葺遼陽故城以渤海漢户建東平郡為防禦州天顯三年遷東丹國民居之升為南京城名天福髙三丈有樓櫓幅員三十里八門東曰迎陽東南曰韶陽南曰龍原西南曰顯徳西曰大順西北曰大遼北曰懐逺東北曰安逺宫城在東北隅髙三丈具敵樓南為三門壯以樓觀四隅有角樓相去各二里宫墻北有讓國皇帝御容殿大内建二殿不置宫嬪唯以内省使副判官守之大東丹國新建南京碑銘在宫門之南外城謂之漢城分南北市中為看樓晨集南市夕集北市街西有金徳寺大悲寺駙馬寺鐡幡竿在焉趙頭陀寺留守衙户部司軍巡院歸化營軍千餘人河朔亾命皆籍於此東至北烏爾呼赫四百里南至海邉鐡山八百六十里西至望平縣海口三百六十里北至挹婁縣范河二百七十里東西南三面抱海遼河出東北山口為范河西南流為大口入於海東梁河自東山西流與渾河合為小口㑹遼河入於海又名太子河亦曰大梁水渾河在東梁范河之間沙河出東南山西北流徑蓋州入于海有蒲河清河浿水亦曰泥河又曰蓒芋濼水多蓒芋之草駐蹕山唐太宗征髙麗駐蹕其巔數日勒石紀功焉俗稱手山山巔平石之上有掌指之状泉出其中取之不竭又有明王山白石山亦曰横山天顯十三年改南京為東京府曰遼陽户四萬六百四轄州府軍城八十七統縣九遼陽縣本渤海國金徳縣地漢浿水縣髙麗改為勾麗縣渤海為常樂縣户一千五百仙鄉縣本漢遼隊縣渤海為永豐縣神仙傳云仙人白仲理能煉神丹㸃黄金以救百姓户一千五百鶴野縣本漢居就縣地渤海為雞山縣昔丁令威家此去家千年化鶴來歸集於蕐表柱以咮畫表云有鳥有鳥丁令威去家千年今來歸城郭雖是人民非何不學仙塜纍纍户一千二百析木縣本漢望平縣地渤海為花山縣户一千紫蒙縣本漢鏤方縣地後佛寧國置東平府領紫蒙縣後徙遼城并入黄嶺縣渤海復為紫䝉縣户一千興遼縣本漢平郭縣地渤海改為長寧縣唐元和中渤海王大仁秀南定新羅北略諸部開置郡邑遂定今名户一千肅慎縣以渤海户置歸仁縣順化縣開州鎮國軍節度本濊貊地髙麗為慶州渤海為東京龍原府有宫殿都督慶鹽穆賀四州事故縣六曰龍原永安烏山壁谷熊山白楊皆廢疊石為城周圍二十里唐薛仁貴征髙麗與其大將温沙門戰熊山擒善射者於石城即此太祖平渤海徙其民于大部落城遂廢聖宗伐新羅還周覽城基復加完葺開泰三年遷雙韓二州千餘户實之號開封府開逺軍節度更名鎮國軍隸東京留守兵事屬東京統軍司統州三縣一開逺縣本栅城地髙麗為龍原縣渤海因之遼初廢聖宗東討復置以軍額民户一千鹽州本渤海龍河郡故縣四海陽接海格川龍河皆廢户三百隸開州相去一百四十里穆州保和軍刺史本渤海㑹農郡故縣四㑹農水岐順化美縣皆廢户三百隸開州東北至開州一百二十里統縣一㑹農縣賀州刺史本渤海吉理郡故縣四洪賀送誠吉理石山皆廢户三百隸開州定州保寧軍髙麗置州故縣一曰定東聖宗統和十三年升軍遷遼西民實之隸東京留守司統縣一定東縣髙麗所置遼徙遼西民居之户八百保州宣義軍節度髙麗置州故縣一曰來逺聖宗以髙麗王詢擅立問罪不服開泰三年取其保定二州統和末髙麗降於此置㩁場隸東京統軍司統州軍二縣一來逺縣初徙遼西諸縣民實之又徙奚漢兵七百防戍焉户一千宣州定逺軍刺史開泰三年徙漢户置隸保州懐化軍下刺史開泰三年置隸保州辰州奉國軍節度本髙麗蓋牟城唐太宗㑹李世勣攻破蓋牟城即此渤海改為蓋州又改辰州以辰韓得名井邑駢列最為衝㑹遼徙其民於祖州初曰長平軍户二千隸東京留守司統縣一建安縣盧州𤣥徳軍刺史本渤海杉盧郡故縣五山陽杉盧漢陽白巖霜巖皆廢户三百在京東一百三十里兵事屬南女直湯河司統縣一熊岳縣西至海一十五里傍海有熊岳山來逺城本熟女直地統和中伐髙麗以燕軍驍猛置兩指揮建城防戍兵事屬東京統軍司鐡州建武軍刺史本漢安市縣髙麗為安市城唐太宗攻之不下薛仁貴白衣登城即此渤海置州故縣四位城河瑞蒼山龍珍皆廢户一千在京西南六十里統縣一湯池縣興州興中軍節度本漢海宜縣地渤海置州故縣三盛吉蒜山鐡山皆廢户二百在京西南三百里湯州本漢襄平縣地渤海置州故縣五靈峰常豐白石均谷嘉利皆廢户五百在京西北一百里崇州隆安軍刺史本漢長岑縣地渤海置州故縣三崇山溈木縁城皆廢户五百在京東北一百五十里統縣崇信縣海州南海軍節度本沃沮國地髙麗為沙卑城唐李世勣嘗攻焉渤海號南京南海府疊石為城幅員九里都督沃晴椒三州故縣六沃沮鷲巖龍山濵海昇平靈泉皆廢太平中大延琳叛南海城堅守經歳不下别部酋長皆被擒乃降因盡徙其民於上京置遷遼縣移澤州民來實之户一千五百統州二縣一臨溟縣耀州刺史本渤海椒州故縣五椒山貂嶺澌泉尖山巖淵皆廢户七百隸海州東北至海州二百里統縣一巖淵縣東界新羅故平壤城在縣西南東北至海州一百二十里濵州柔逺軍刺史本渤海晴州故縣五天晴神陽蓮池狼山仙巖皆廢户五百隸海州東南至海州一百二十里渌州鴨渌軍節度本髙麗故國渤海號西京鴨渌府城髙三丈廣輪二十里都督神桓豐正四州事故縣三神鹿神化劔門皆廢大延琳叛遷餘黨於上京置易俗縣居之在者户二千隸東京留守司統州四縣二𢎞聞縣神鄉縣桓州髙麗中都城故縣三桓都神鄉浿水皆廢髙麗王於此剏立宫闕國人謂之新國五世孫釗晉康帝建元初為慕容皝所敗宫室焚蕩户七百隸渌州在西南二百里豐州渤海置盤安郡故縣四安豐渤恪隰壤硤石皆廢户三百隸渌州在東北二百一十里正州本沸流王故地國為公孫康所併渤海置沸流郡有沸流水户五百隸渌州在西北三百八十里統縣一東那縣本漢東暆不而縣地在州西七十里慕州本渤海安逺府地故縣二慕化崇平乆廢户二百隸渌州在西北二百里顯州奉先軍上節度本渤海顯徳府地世宗置以奉顯陵顯陵者東丹人皇王墓也人皇王姓好讀書不喜射獵購書數萬卷置醫巫閭山絶頂築堂曰望海山南去海一百三十里大同元年世宗親䕶人皇王靈駕歸自汴京以人皇王愛醫巫閭山水竒秀因葬焉山形掩抱六重於其中作影殿制度宏麗州在山東南遷東京三百餘户以實之應厯元年穆宗葬世宗於顯陵西山仍禁樵採有十三山有沙河隸長寧積慶二宫兵事屬東京都部署司統州三縣三奉先縣本漢無慮縣即醫巫閭幽州鎮山世宗析遼東長樂縣民以為陵户隸長寧宫山東縣本漢望平縣穆宗割渤海永豐縣民為陵户隸積慶宫歸義縣初置顯州渤海民自來助役世宗嘉憫因籍其人户置縣隸長寧宫嘉州嘉平軍下刺史隸顯州遼西州阜成軍中刺史本漢遼西郡地世宗置州隸長寧宫屬顯州統縣一長慶縣統和八年以諸宫提轄司人户置康州下刺史世宗遷渤海率賔府人户置屬顯州初建長寧宫後屬積慶宫統縣一率賔縣本渤海率賔府地宗州下刺史在遼東石熊山耶律隆運以所俘漢民置聖宗立為州隸文忠王府王薨屬提轄司統縣一熊山縣本渤海縣地乾州廣徳軍上節度本漢無慮縣地聖宗統和三年置以奉景宗乾陵有凝神殿隸崇徳宫兵事屬東京都部署司統州一縣四奉陵縣本漢無慮縣地括諸落帳户助營山陵延昌縣析延昌宫户置靈山縣本渤海靈峰縣地司農縣本渤海麓郡縣併麓波雲川二縣入焉海北州廣化軍中刺史世宗以所俘漢户置地在閭山之西南海之北初隸宣州後屬乾州統縣一開義縣貴徳州寧逺軍下節度本漢襄平縣地漢公孫度所據太宗時察克以所俘漢民置後以弑逆誅没入焉聖宗建貴徳軍後更名有沱河大寳山隸崇徳宫兵事屬東京都部署司統縣二貴徳縣本漢襄平縣渤海為崇山縣奉徳縣本渤海緑城縣地嘗置奉徳州瀋州昭徳軍中節度本挹婁國地渤海建瀋州故縣九皆廢太宗置興遼軍後更名初隸永興後屬敦睦宫兵事隸東京都部署司統州一縣二樂郊縣太祖俘薊州三河民建三河縣後更名靈源縣太祖俘薊州吏民建漁陽縣後更名巖州白巖軍下刺史本渤海白巖城太宗撥屬瀋州初隸長寧宫後屬敦睦宫統縣一白巖縣渤海置集州懐衆軍下刺史古陴離郡地漢屬險瀆縣髙麗為霜巖縣渤海置州統縣一奉集縣渤海置廣州防禦漢屬襄平縣髙麗為當山縣渤海為鐡利郡太祖遷渤海人居之建鐵利州統和八年省開泰七年以漢户置統縣一昌義縣遼州始平軍下節度本佛寧國城渤海為東平府唐太宗親征髙麗李世勣㧞遼城髙宗詔程振蘇定方討髙麗至新城大破之皆此地也太祖伐渤海先破東平府遷民實之故東平府都督伊䝉陀黒比五州共領縣十八皆廢太祖改為州軍曰東平太宗更為始平軍有遼河羊腸河錐子河蛇山狼山黒山巾子山隸長寧宫兵事屬北女直兵馬司統州一縣二遼濱縣安定縣祺州祐聖軍下刺史本渤海䝉州地太祖以檀州俘於此建檀州後更名隸𢎞義宫兵事屬北女直兵馬司統縣一慶雲縣太祖俘密雲民於此建密雲縣後更名遂州刺史本渤海美州地採訪使耶律佛徳以部下漢民置穆宗時佛徳嗣絶没入焉隸延昌宫統縣一山河縣本渤海縣併黒川麓川二縣置通州安逺軍節度本扶餘國王城渤海號扶餘城太祖改龍州聖宗更今名保寧七年以黄龍府叛人燕頗餘黨千餘户置升節度統縣四通逺縣本渤海扶餘縣併布多縣置安逺縣本渤海顯義縣併鵲川縣置歸仁縣本渤海强師縣併新安縣置漁谷縣本渤海縣韓州東平軍下刺史本果囉國舊治柳河縣髙麗置鄚頡府都督鄚髙二州渤海因之今廢太宗置三河榆河二州聖宗併二州置隸延昌宫兵事屬北女直兵馬司統縣一柳河縣本渤海粤喜縣地併萬安縣置雙州保安軍下節度本挹婁故地渤海置安定郡乆廢額哩森王從太宗南征以俘鎮定二州之民建城置州察克弑逆誅没入焉初隸延昌宫後屬崇徳宫兵事隸北女直兵馬司統縣一雙城縣本渤海安夷縣地銀州富國軍下刺史本渤海富州太祖以銀冶更名隸𢎞義宫兵事屬北女直兵馬司統縣三延津縣本渤海富壽縣境有延津故城更名新興縣本故越喜國地渤海置銀冶嘗置銀州永平縣本渤海優富縣地太祖以俘户置舊有永平寨同州鎮逺軍下節度本漢襄平縣地渤海為東平寨太祖置州軍曰鎮