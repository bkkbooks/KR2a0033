front:
  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_025-1a, image: WYG0289/WYG0289-0168a.png}
body:
  text: 遼史卷二十五元中書右丞相總裁托克托等修本紀第二十五道宗五三年春正月乙卯如魚兒濼甲戌出錢粟振南京貧民仍復其租賦己卯大雪二月丙戌發粟振中京饑甲辰以民多流散除安泊逃戸徴償法三月乙卯高麗遣使來貢己未免錦州貧民租一年甲戌免上京貧民租如錦州庚辰女直貢良馬夏四月戊子賜中京貧民帛免諸路貢輸之半丙申賜威烏爾古部貧民帛庚子如涼陘甲辰南府宰相王績薨乙巳詔出戸部司粟振諸路流民及義州之饑五月庚申海雲寺進濟民錢千萬秋七月丙辰獵黑嶺丁巳出雜帛賜興聖宮貧民庚午大雨罷獵丁丑秦越國王阿林薨九月乙丑駐蹕錫里濟冬十月庚辰以參知政事王經為三司使壬辰罷節度使已下官進珍玩癸卯追封秦越國王阿林為秦魏國王十一月甲寅特哩衮耶律坦同知南京留守事遼興軍節度使耶律旺玖為南府宰相十二月己卯朔以樞密直學士呂嗣立參知政事四年春正月庚戌如混同江甲寅太白晝見甲子五國部長來貢庚午免上京逋逃及貧戸稅賦甲戌以上京南京饑許良人自鬻丁丑曲赦西京役徒二月己丑如魚兒濼甲午曲赦春州役徒終身者皆五歲免己亥如春州赦泰州役徒三月乙丑免高麗歲貢己巳振上京及平錦來三州饑夏四月己卯振蘇吉復淥鐵五州貧民并免其租稅甲申振慶州貧民乙酉減諸路常貢服御物丁酉立入粟補官法癸卯西幸召樞密直學士耶律儼講尚書洪範五月辛亥命燕國王延禧寫尚書五子之歌乙卯振祖州貧民丁巳詔免役徒終身者五歲免之己未振春州貧民丙寅禁挾私引水犯田六月庚辰駐蹕散水原丁亥命燕國王延禧知中丞司事以同知南院樞密使事耶律聶哷知右伊勒希巴知右伊勒希巴事耶律納延同知南院樞密使事北院樞密使耶律佛德致仕秋七月戊申曲赦奉聖州役徒丙辰遣使冊李乾順為夏國王庚申如秋山己巳禁錢出境八月庚辰有司奏宛平永清蝗為飛鳥所食庚寅謁慶陵冬十月丁丑獵遼水之濵己卯駐蹕藕絲淀癸未免百姓所貸官粟己丑知北院樞密使事耶律阿蘇封漆水郡王癸巳以伊實大王耶律廸里知西北路招討使事權知西北路招討使事蕭休格知伊實大王事壬寅詔諸部長官親鞫獄訟十一月庚申興中府民張化法以父兄犯盜當死請代皆免十二月戊寅南府宰相耶律旺玖致仕癸未以孟父詳衮耶律愼思為中京留守閏十二月癸卯朔預行正旦禮丙午如混同江五年春正月癸未如魚兒濼甲午高麗遣使來貢三月癸酉詔析津大定二府精選舉人以聞詔諭學者當窮經明道夏四月甲辰以知奚六部大王事尼格為本部大王壬子獵北山甲子霖雨罷獵五月丁亥駐蹕齊老嶺己丑以準布磨古斯為諸部長癸巳回鶻遣使貢良馬己亥以同知南院樞密使事耶律納延知右伊勒希巴事左祗候郎君班詳衮耶律聶哷知北院大王事六月甲寅夏國遣使來謝封冊壬戌以參知政事王言敷為樞密副使前樞密副使賈士勲參知政事兼同知樞密院事秋七月庚午獵沙嶺九月辛卯遣使遺宋鹿脯壬辰駐蹕藕絲淀冬十月乙巳以新定法令太煩復行舊法庚申以遼興軍節度使哈噶為伊實大王十一月丁卯朔燕國王延禧生子大赦妃之族屬進爵有差六年春正月如混同江二月辛丑駐蹕雙山三月辛未女直國來貢夏四月丁酉東北路統軍司設掌法官庚子以同知南院樞密使事耶律托多知左伊勒希巴事五月壬辰駐蹕散水原六月甲寅遣使決五京囚秋七月丙子如黑嶺冬十月丁酉駐蹕藕絲淀十一月壬戌高麗遣使來貢己巳以南府宰相竇景庸為武定軍節度使是年放進士文充等七十二人七年春正月壬戌如混同江二月己亥駐蹕魚兒濼壬寅詔給渭州貧民耕牛布絹三月丙戌駐蹕黑龍江夏四月丙辰以漢人行宮副部署耶律古雲知伊實大王事五月己未朔日有食之六月甲午駐蹕齊老嶺己亥倒塌嶺人進古鼎有文曰萬歲永為寳用辛丑回鶻遣使貢方物癸卯以權知東京留守蕭托輝為契丹行宮都部署丁未端拱殿門災秋七月戊午朔回鶻遣使來貢異物不納厚賜遣之八月庚寅以霖雨罷獵壬寅幸慶州謁慶陵九月丙申還上京己亥日本國遣鄭元鄭心及僧應範等二十八人來貢冬十月辛巳命燕國王延禧為天下兵馬大元帥總北南院樞密使事十一月庚子如藕絲淀甲子望祀木葉山八年春正月乙酉如山榆淀乙未準布諸長來降三月己亥駐蹕圖埓實淀丁未曲赦中京蔚州役徒夏四月乙卯準布來貢丁丑獵西山提克徳酋長呼喇濟來附五月甲辰駐蹕齊老嶺六月乙丑夏國為宋侵遣使乞援秋七月丁亥獵沙嶺九月乙巳駐蹕藕絲淀丁未日本國遣使來貢冬十月庚戌朔遣使遺宋鹿脯丙辰振西北路饑辛酉準布磨古斯殺金吾特古斯以叛遣奚六部圖哩耶律果桑發諸部兵討之壬申南府宰相王荆薨戊寅以左伊勒希巴耶律聶哷為彰聖軍節度使十一月戊子以樞密副使王是敦兼知樞密院事權參知政事韓資譲參知政事漢人行宮都部署奚和勒博知奚六部大王事丁酉以通州潦水害稼遣使振之戊申北院大王赫嚕薨是年放進士冠尊文等五十三人九年春正月庚辰如混同江二月磨古斯來侵三月西北路招討使耶律和囉木薩噶追磨古斯還都監蕭章吉特遇賊與戰不利二室韋伊喇北王府特們羣牧宮分等軍多陷没夏四月興中府甘露降遣使祠佛飯僧癸酉獵西山六月丁未朔駐蹕散水原庚申以遼興軍節度使榮格為南院大王知左伊勒希巴事耶律托多為左伊勒希巴秋七月如黑嶺壬寅遣使賜高麗羊九月癸卯振西北路貧民冬十月庚戌有司奏磨古斯詣西北路招討使耶律托卜嘉偽降既而乗虗來襲托卜嘉死之準卜烏庫哩叛逹勒逹博索摩竝宼倒塌嶺壬子遣使籍諸路兵癸丑以南院大王特黙同知南京留守事命鄭嘉努率兵往援倒塌嶺甲寅駐蹕藕絲淀以左伊勒希巴耶律托多圍場都管薩巴竝為西北路行軍都監乙卯詔以馬三千給烏爾古部丙辰準布長希逹掠西路羣牧丁巳振西北路貧民己未燕國王延禧生子肆赦妃之族屬竝進級壬戌以樞密直學士趙廷睦參知政事同知南院樞密使事癸亥烏爾古德哷勒統軍使蕭休格奏討準布等部㨗甲子宋遣使告其母后曹氏哀即遣使弔祭己巳詔廣積貯以備水旱十一月辛巳特黙等奏討準布㨗十二月丙辰宋遣使以母后遺留物來饋十年春正月如春水癸未提克德來貢戊子烏爾等來降逹勒逹博索摩等來侵四㨗軍都監特黙死之二月甲辰以破準布賞有功者丙午西南靣招討司奏討博索摩㨗癸丑巴雅爾布琳通古和克布格等來降逹勒逹來侵三月壬申朔日有食之山北路副部署蕭阿嚕岱奏討逹勒逹㨗夏四月壬寅朔提克德敏逹蘇魯克都等來附詔復舊地甲辰駐蹕春州北平淀丙午烏爾古部節度使耶律辰嘉努奏討察察哩捷庚戌以知北院樞密使事耶律額特埓為都統伊勒希巴耶律托多為副統龍虎衛上將軍耶律呼哩都監討磨古斯遣積慶宮使蕭扎里監戰辛亥休格奏伯哩八部來侵擊破之己巳除玉田蜜雲流民租賦一年閏月庚子賜西北路貧民錢逹勒逹博索摩二部來降五月甲辰駐蹕齊老嶺甲寅括馬戊午西北路招討司奏德哷勒等部來侵統軍司兵與戰不利招討司兵擊破之敦睦宮太師耶律愛努及其子死之辛酉以知國舅詳衮事蕭阿里同領西北路行軍事六月辛未宋遣使來謝弔祭乙酉烏爾古德哷勒統軍使休格有罪除名丙戌和囉噶等部來聘提克德來貢己亥禁邊民與畨部為婚是夏高麗國王運薨子昱遣使來告即遣使賻贈秋七月庚子朔獵赤山是月準布等宼倒塌嶺盡掠西路羣牧馬去東北路統軍使耶律實岱以兵追及盡獲所掠而還九月己未南院大王特黙為南院樞密使甲子德哷勒諸酋來降釋其罪是月額特埓破磨古斯冬十月丙子駐蹕藕絲淀壬午山北路副部署蕭阿嚕岱以討逹勒逹功加左金吾衛上將軍癸巳西北路統軍司獲準布長碩博和富魯等來獻十一月乙巳提克徳通古凖布廸里等來降逹勒逹博索摩等復來侵山北副部署阿嚕岱擊敗之十二月癸酉三河縣民孫賔及其妻皆百歲復其家甲戌以參知政事趙廷睦兼同知樞密院事樞密副使王師儒參知政事兼同知樞密院事己卯詔錄西北路有功將士及戰没者贈官乙酉詔改明年元減雜犯死罪以下仍除貧民租賦戊子西北路統軍司奏討磨古斯㨗遼史卷二十五
