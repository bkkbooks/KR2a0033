body:
  text: 遼史卷一百元中書右丞相總裁托克托等修列傳第三十耶律唐古蕭塔喇台蕭綽哈耶律章努耶律珠展耶律唐古字富僧額六院郎君噶拉之後太康中補本班郎君累遷至大將軍性坦率好别白黒人有不善必盡言無隱時號强唐古在朝數論宰相得失由是久不得調後出為西北戍長乾統三年蕭塔喇台為西北路招討使以后族慢悔僚吏唐古不屈乃罷之唐古訟之朝不省天慶初烏爾古徳哷勒叛召拜烏爾古部節度使至部諭降之遂出私財發富民積振其困乏部民大悦加鎮國上將軍㑹蕭塔喇台以都統率兵與金人戰敗績唐古請論軍法且曰臣雖老願為國破敵不納保大元年乞致仕明年天祚出奔唐古謁於倒塌嶺為上流涕上慰止之復拜烏爾古部節度使至部徳哷勒五千人來攻唐古率家奴擊破之加太子太傅年七十二卒蕭塔喇台字扎林晉王孝先之孫父薩巴歴官使相塔喇台短而僂外謹内倨太康中補祇候郎君稍遷興聖宫副使兼同知中丞司事大安中燕王妃生子塔喇台以妃叔故歴寧逺軍節度使長寧宫使壽隆二年監討達勒達博索摩二部多俘而還改同知南京留守事乾統元年為北靣林牙同知北院樞密事受詔與北院樞密使耶律阿蘇治伊遜餘黨阿蘇納賄多出其罪塔喇台不能制亦附㑹之四年知北院樞密事夏王李乾順為宋所攻遣使請和解詔塔喇台與南院樞密使牛温舒使宋平之宋既許塔喇台受書之日乃曰始奉命取要約歸不見書辭豈敢徒還遂對宋主發函而讀既還朝議為是天慶三年加守司徒封蘭陵郡王女直初起廷臣多欲乗其未備舉兵往討塔喇台獨阻之以至敗衂天祚以塔喇台不合人望出為西南靣招討使八年召為北院樞密使寵任彌篤是時諸路大亂飛章告急者絡繹而至塔喇台不即上聞有功者亦無甄别由是將校怨怒人無鬬志保大二年金兵至嶺東㑹耶律薩巴習騎薩巴等謀立晉王額嚕温事泄上召塔喇台議曰反者必以此兒為名若不除去何以獲安塔喇台唯唯竟無一言申理王既死人心益離金兵踰嶺天祚率衛兵西遁元妃蕭氏塔喇台之姪謂塔喇台曰爾任國政致君至此何以生為塔喇台但謝罪不能對明日天祚怒逐塔喇台與其子穆爾薩塔喇台既去為耶律高善努執送金兵塔喇台伺守者怠脱身亡歸復為耶律糾堅執送奏晉國王淳時淳已僭號塔喇台自知不免詭曰吾不能事僣竊之君不食數日卒子穆爾薩為金兵所殺蕭綽哈字額埓本國舅少父房之後祖阿拉終採訪使父必埒哩以后父封趙王綽哈貌雄偉性和易年十四尚越國公主拜駙馬都尉為祇候郎君班詳衮年十八封蘭陵郡王時帝欲立皇孫為嗣恐無以解天下疑出綽哈為國舅詳衮降皇后為惠妃遷于乾州初綽哈母入朝擅取驛馬至是覺奪其封號復與妹魯姐為巫蠱伏誅詔綽哈與公主離婚籍興聖宫流烏爾古徳哷勒部天慶中以妹復尊為太皇太妃召綽哈為南女直詳衮遷征東副統軍時饒州渤海作亂乃與附馬都尉蕭罕嘉努襲其不備平之復敗敵將侯槩于川州是嵗東京叛遇敵來擊師潰獨綽哈率麾下數人力戰殁于陣追贈龍虎衛上將軍耶律章努字塔瑪雅季父房之後父扎拉養高不仕章努明敏善談論大安中補牌印郎君乾統元年累遷右中丞兼領牌印宿直事六年以直宿不謹降知内客省事天慶四年授東北路統軍副使五年改同知咸州路兵馬事天祚親征女直蕭呼都克為先鋒都統章努為都監大軍渡鴨子河章努與魏國王淳妻兄蕭迪里及其甥蕭雅里等謀立淳誘將卒三百餘人亡歸既而天祚為女直所敗章努乃遣迪里雅里以廢立事馳報淳淳猶豫未决㑹行宫使者伊遜持天祚御札至備言章努叛命淳對使者號哭即斬迪里雅里首以獻天祚章努見淳不從誘草冦數百攻掠上京取府庫財物至祖州率僚屬告太祖廟云我大遼基業由太祖百戰而成今天下土崩竊見興宗皇帝孫魏國王淳道徳隆厚能理世安民臣等欲立以主社稷㑹淳適好草淀大事未遂邇來天祚惟眈樂是從不恤萬幾強敵肆侮師徒敗績加以盜賊蜂起邦國危于累卵臣等沗預族屬世家恩渥上欲安九廟之靈下欲救萬民之命乃有此舉實出至誠冀累聖垂祐西至慶州復祀諸廟仍述所以舉兵之意移檄州縣諸陵官僚士卒稍稍屬心時饒州渤海及侯槩等相繼來應衆至數萬趨廣平淀其黨耶律寧古等暴横不法刼掠婦女財畜章努度不能制内懐悔恨又攻上京不克北走降虜上順國女直阿古齊率兵追敗之殺其將耶律穆嚕直擒貴族二百餘人其妻子配役繡院或散諸近侍為婢餘得脱者皆遁去章努詐為使者欲奔女直為邏者所獲縛送行在伏誅耶律珠展字能登裕悦博果濟之後魁偉雄辨乾統初補祇候即君六年因柴册加觀察使天慶五年受詔監都統耶律鄂爾多戰及敗左遷銀州刺史徙咸州糺將嘗與耶律章努謀立魏國王淳及聞章努自鴨子河亡去即引麾下數人往㑹之道為遊兵所執送行在所上問曰予何負卿而反珠展對曰臣誠無憾但以天下大亂己非遼有小人滿朝賢臣竄斥誠不忍見天皇帝艱難之業一旦土崩臣所以痛入骨髓而有此舉非為身計後數日復問珠展厲聲數上過惡陳社稷危亡之本遂殺之論曰遼末同事之臣其善惡何相逺也唐古骨鯁不屈權要兩鎮烏爾古思威並著綽哈平亂渤海又以討叛力戰而死忠可尚矣塔喇台縱女直而不討寢變告而不聞蔽主聰明為國階亂莫斯之甚也章努珠展乗時多艱潜謀廢立將求寵幸以犯大逆其得免於天下之戮哉遼史卷一百
