body:
  text: 遼史卷四十一元中書右丞相總裁托克托等修志第十一地理志五西京道西京大同府陶唐冀州之域虞分并州夏復屬冀州周職方正北曰并州戰國屬趙武靈王始置雲中郡秦屬代王國後為平城縣魏屬新興郡晉仍屬鴈門劉琨表封猗盧為代王都平城元魏道武於此遂建都邑孝文帝改為司州牧置代尹遷都洛邑改萬年又置恒州高齊文宣帝廢州為恒安鎮今謂之東城尋復恒州周復恒安鎮改朔州隋仍為鎮唐武徳四年置北恒州七年廢貞觀十四年移雲中定襄縣於此永淳元年黙啜為民患移民朔州開元十八年置雲中州天寶元年改雲中郡乾元元年曰雲州乾符三年大同軍節度使李國昌子克用為雲中守捉使殺防禦使據州以聞僖宗赦克用以國昌為大同軍防禦使不受命廣明元年李琢攻國昌國昌兵敗與克用奔北地黄巢入京師詔發代北軍尋赦國昌使討賊克用率三萬五千騎而南收京師功第一國昌封隴西郡王國昌卒克用取雲南既而所向失利乃卑詞厚禮與太祖會於雲州之東城謀大舉兵攻梁不果克用子存朂滅梁是為唐莊宗同光三年復以雲州為大同軍節度使晉高祖代唐以契丹有援立功割山前代北地為賂大同來屬因建西京敵樓棚櫓具廣袤二十里門東曰迎春南曰朝陽西曰定西北曰拱極元魏宫垣占城之北面雙闕尚在遼既建都用為重地非親王不得主之清寧八年建華嚴寺奉安諸帝石像銅像又有天王寺留守司衙南曰西省北門之東曰大同府北門之西曰大同驛初為大同軍節度重熙十三年升為西京府曰大同統州二縣七大同縣本大同川地重熈十七年西夏犯邊析雲中縣置户一萬雲中縣趙置㳂革與京府同户一萬天成縣本極塞之地魏道武帝置廣牧縣唐武徳五年置定襄縣遼析雲中置在京北一百八十里户五千長青縣本白登臺地冒頓單于縱精騎三十餘萬圍漢高帝於白登七日即此遼始置縣有青陂梁元帝横吹曲云朝跋青陂暮上白登在京東北一百一十里四千奉義縣本漢陶林縣地後唐武皇與太祖會此遼析雲中置户三千懐仁縣本漢沙南縣元魏葛榮亂縣廢隋開皇二年移雲内于此大業二年置大利縣屬雲州改屬定襄郡隋末陷突厥李克用敗赫連鐸駐兵于此遼改懐仁在京南六十里户三千懐安縣本漢夷輿縣地歴魏至隋為哭厥所據唐克頡利縣遂廢為懐荒鎮高勲鎮燕奏分歸化州文徳縣置初隸奉聖州後來屬在州西北二百八十里户三千𢎞州博寧軍下刺史東魏靜帝置北靈丘縣唐初地陷突厥開元中置横野軍安邊縣天寶亂廢後為襄陰村統和中以寰州近邊為宋將潘美所破廢之乃於此置𢎞州初軍曰永寧有桑乾河白道泉白登山亦曰火燒山有火井統縣二永寧縣户一萬順聖縣本魏安塞軍五代兵廢高勲鎮幽州奏景宗分永興縣置初隸奉聖州在州西北二百八十里户三千徳州下刺史唐會昌中以西徳店置徳州開泰八年以漢户復置有歩落泉金河山野狐嶺白道坂縣一宣徳縣本漢桐過縣地屬雲中郡後隸定襄郡漢末廢高齊置紫阿鎮唐㑹昌中置縣户三千豐州天徳軍節度使秦為上郡北境漢屬五原郡地磧鹵少田疇自晉永嘉之亂屬赫連勃勃後周置永豐鎮隋開皇中升永豐縣改豐州大業七年為五原郡義寧元年太守張遜奏改歸順郡唐武徳元年為豐州總管府六年省遷民於白馬縣遂廢貞觀四年分靈州境置豐州都督府領畨户天寶初改九原郡乾元元年復豐州後入囬鶻會昌中克之後唐改天徳軍太祖神冊五年攻下更名應天軍復為州有大鹽濼九十九泉沒越濼古磧口青塜即王昭君墓兵事屬西南面招討司統縣二富民縣本漢臨戎縣遼改今名户一千三百振武縣本漢定襄郡盛樂縣背負陰山前帶黄河元魏嘗都盛樂即此唐武徳四年克突厥建雲中都督府麟徳三年改單于大都督府聖厯元年又改安北都督開元七年割隸東受降城八年置振武軍節度使會昌五年為安北都䕶府後唐莊宗以兄嗣本為振武節度使太祖神冊元年伐吐渾還攻之盡俘其民以東唯存鄉兵三百人防戍後更為縣雲内州開逺軍下節度本中受降城地遼初置代北雲朔招討司改雲内州清寧初升有威塞軍古哈屯城大同州天安軍永濟柵安樂戍拂雲堆兵事屬西南面招討司縣二柔服縣寧人縣天徳軍本中受降城唐開元中廢横塞軍置天安軍於大同川乾元中改天徳軍移永濟柵今治是也太祖平党項遂破天徳盡掠吏民以東後置招討司漸成井邑乃以國族為天徳軍節度使有黄河黑山峪廬城威塞軍秦長城唐長城又有牟那山鉗耳觜城在其北寧邊州鎮西軍下刺史本唐隆鎮遼置兵事屬西南面招討司奉聖州武定軍上節度本唐新州後唐置團練使總山後八軍莊宗以弟存矩為之軍亂殺存矩于祁州擁大將盧文進亡歸太祖克新州莊宗遣李嗣源復取之同光二年升威塞軍右晉高祖割獻太宗改升有兩河會温泉龍門山涿鹿山東南至南京三百里西北至西京四百四十里兵事屬西京都部署司統州三縣四永興縣本漢涿鹿縣地黄帝與蚩尤戰于此户八千礬山縣本漢軍都縣山出白綠礬故名有礬山桑乾河在州南六十里户三千龍門縣有龍門山石壁對峙高數百尺望之若門徼外諸河及沙漠潦水皆於此趣海雨則俄頃水踰千仞晴則清淺可渉實塞北控扼之衝要也在州東北二百八十里户四千望雲縣本望雲川地景宗於此建潛邸因而成井肆穆宗崩景宗入紹國統號御莊後置望雲縣直隸章愍宫附庸於此在州東北二百六十里户一千歸化州雄武軍上刺史本漢下洛縣元魏改文徳縣唐升武州僖宗改毅州後唐太祖復武州明宗又為毅州潞王仍為武州晉高祖割獻于遼改今名有桑乾河㑹河川愛陽川炭山又謂之陘頭有涼殿承天皇后納涼於此山東北三十里有新涼殿景宗納涼於此唯松棚數陘而已斷雲嶺極高峻故名州西北至西京四百五十里統縣一文徳縣本漢女祁縣地元魏置户一萬汗州清平軍下刺史本漢潘縣元魏置北齊置北燕郡改懐戎縣隋廢郡屬涿郡唐武徳中復置北燕州縣仍舊貞觀八年改嬀州五代時奚王去諸以數千帳欲嬀州自别為西奚號汗州太祖因之有嬀泉在城中相傳舜嬪二女於此又有温泉版泉磨笄山鷄鳴山喬山歴山統縣一懐來縣本懐戎縣太祖改戸三千儒州縉陽軍中刺史唐置後唐同光二年隸新州太宗改奉聖州仍屬有南溪河沽河宋王峪桃峪口統縣一縉山縣本漢廣寗縣地唐天寶中割嬀州縣置户五千蔚州忠順軍上節度周職方并州川曰漚夷在州境飛狐縣趙襄子滅代武靈王置代郡項羽徙趙歇為代王歇還趙立陳餘王代漢韓信斬餘復置代郡文帝初封代皆此地周宣帝始置蔚州隋開皇中廢唐武徳四年復置至徳二年改興唐縣乾元元年仍舊大中後朱邪執宜為刺史有功賜姓名李國昌子克用乞為留後僖宗不許廣明初攻敗國昌代北無備太祖來攻克之俘掠居民而去石晉獻地升忠順軍後更武安軍統和四年入宋尋復之降刺史隸奉聖州升觀察復忠順軍節度兵事屬西京都部署司統縣五靈仙縣唐置興唐縣梁改隆化縣後唐同光初復置晉改今名户二萬定安縣本漢東安陽縣地久廢後唐太祖伐劉仁恭次蔚州晨霧晦瞑占不利深入會雷電大作燕軍解去即此遼置定安縣西北至州六十里户一萬飛狐縣後周大象二年置廣昌縣于五龍城即此隋仁夀元年改名飛狐相傳有狐於紫荆嶺食五粒松子成飛仙故云西北至州一百四十里户五千靈丘縣漢置後漢省東魏復置屬靈丘郡隋開皇中罷郡來屬大業初改隸代州唐武徳六年仍舊東北至州一百八十里户三千廣陵縣本漢延陵縣隋唐為鎮州後唐同光初分興唐縣置石晉割屬遼東南至州四十里户三千應州彰國軍上節度唐武徳中置金城縣後改應州後唐明宗州人也天成元年升彰國軍節度興唐軍寰州隸焉遼因之北龍首山南鴈門兵事屬西京都部署司統縣三金城縣本漢陰館縣地漢末廢為陰館城大業末陷突厥唐始置金城縣遼因之户八千渾源縣唐置有渾源川在州東南一百五十里户五千河陰縣本漢陰館縣地初隸朔州清寧中來屬户三千朔州順義軍下節度本漢馬邑縣地元魏孝文帝始置朔州在今州北三百八十里定襄故城葛榮亂廢高齊天保六年復置在今州南四十七里新城八年徙馬邑即今城武成帝置北道行臺周武帝置朔州總管府隋大業三年改馬邑郡唐武徳四年復朔州遼升順義軍節度兵事屬西京都部署司統州一縣三鄯陽縣本漢定襄縣地建安中置新興郡元魏置桑乾郡高齊置招逺縣郡仍舊隋開皇三年罷郡隸朔州大業元年初名鄯陽縣遼因之户四千寧逺縣齊天保六年於朔州西置招逺縣唐乾元元年改今名遼因之有寧逺鎮東至朔州八十里户二千馬邑縣漢置屬鴈門郡唐開元五年析鄯陽縣東三十里置大同軍倚郭置馬邑縣南至朔州四十里户三千武州宣威軍下刺史趙恵王置武川塞魏置神武縣唐末置武州後唐改毅州重熙九年復武州號宣威軍統縣一神武縣魏置晉改新城後唐太祖生神武川之新城即此初隸朔州後置州併寧逺為一縣來屬户五千東勝州武興軍下刺史隋開皇七年置勝州大業五年改榆林郡唐貞觀五年於南河地置決勝州故謂此為東勝州天寶七年又為榆林郡乾元元年復為勝州太祖神冊元年破振武軍勝州之民皆趨河東州廢晉割代北來獻復置兵事屬西南面招討司統縣二榆林縣河濱縣金肅州重熙十二年伐西夏置割燕民三百户防秋軍一千實之屬西南面招討司河清軍西夏歸遼開直路以趍上京重熙十二年建城號河清軍徙民五百户防秋兵一千人實之屬西南面招討司遼史卷四十一遼史卷四十一考證地理志五唐武徳四年置北恒州按唐書地理志武徳元年置北恒州此云四年互異寧人縣按金史雲内州鎮一寧仁舊縣也此作寧人互異鄯陽縣本漢定襄縣地按唐書通考俱作善陽武州後唐改毅州按刻本舊作唐改毅州無後字考武州唐末置屬河東道後唐改為毅州石晉時入于契丹見通考謹据改遼史卷四十一考證
