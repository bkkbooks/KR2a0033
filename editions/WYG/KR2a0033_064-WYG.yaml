body:
  text: 遼史卷六十四元中書右丞相總裁托克托等修表第二皇子表帝官天下王者家焉至於親九族敬五宗其揆一也三代以上封建久長故吳魯燕蔡衞晉鄭太史遷既著世家又列年表不厭其詳自漢以降封建實亡猶有其名長世者登世家自絶者置列傳然王子侯猶可以年表也班固以為文無實併諸侯削年而表世君子韙之自魏以降不帝不世王侯身徙數封朝不謀夕於是列而傳之功不足以垂法罪不足以著戒碌碌然抑又甚焉今摘其功罪傑然者列諸傳叙親親之恩敬長之義而無他可書者略表見之為皇子表遼史卷六十四遼史卷六十四考證元祖子楊珠第二子按耶律安圖傳曽祖揚珠元祖之長子表作第二又安圖祖春博里為本部額爾竒木皇族表亦以春博里與和郭齊摩綽並列為揚珠之子此言二子不及春博里均與傳異又摩綽原文作末掇此處又訛求掇今併改實魯字蘇蘭第三按太祖紀贊蘇蘭為徳祖之弟此言徳祖第四蘇蘭第三與紀異埓克即三父房之季父按原本三訛二今据皇族表改安圖賜號明王按契丹志稱安圖為偉王兵衞志亦有偉王軍之名表失載貝之子隆科隆先道隠按宗室傳貝室五子長世宗次隆科次舒次隆先道隠表不載世宗及舒雅斯哈㑹同元年封太平王按太宗紀作二年扎穆第三舊史皇族傳書在第一按聖宗紀扎穆為景宗庶兄故舊史書為第一也又扎穆原文作長沒景宗紀作只沒聖宗紀作質睦係一人今併改景宗子隆祐按契丹國志通考俱作隆裕重元子尼嚕古按契丹國志重元作宗元尼嚕古作洪孝聖宗六子興宗第一武格第四按聖宗紀開泰二年皇子宗訓為大内特哩衮據事跡武格即宗訓表謂第四者也而五年興宗方生則武格為興宗庶兄明甚通考以興宗為聖宗第八子固未盡得實興宗特為嫡子之長非必第一也聖宗子布古徳武格海古勒按布古徳武格海古勒各有漢字名見聖宗本紀開泰七年宗簡右衛大將軍宗愿左驍衛大將軍宗偉右衛大將軍宏簡録以宗簡為布古徳宗愿為武格宗偉為海古勒未知所據又武格之為大内特哩衮紀稱宗訓是武格又名宗訓也興宗三子按興宗紀重熙十年皇子寶信努生以年次考之當為道宗之弟和囉噶之兄和囉噶乾統三年為特哩衮按道宗紀作六年額嚕温保大元年耶律伊都與文妃密謀立之不果耶律薩巴復謀立之按耶律伊都傳蕭奉先恐秦王不得立誣伊都謀立晉王事賜文妃死又天祚紀保大二年奉先又稱伊都引金人來欲立晉王遂賜晉王死耶律薩巴伏誅据傳則文妃固未嘗謀立其子遼史卷六十四考證
