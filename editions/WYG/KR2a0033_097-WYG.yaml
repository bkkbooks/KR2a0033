front:
  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_097-1a, image: WYG0289/WYG0289-0667c.png}
body:
  text: 遼史卷九十七元中書右丞相總裁托克托等修列傳第二十七耶律額特埒哈里竇景庸耶律音濟楊績趙徽王觀耶律吉遜耶律額特埒字伊實音許國王伊徳實六世孫少不喜官禄年四十一始補本班郎君時樞密使耶律伊遜擅權讒害忠良額特埒恐禍及深自抑畏太康中為宿直官歴左右䕶衛太保大安初升燕王傅徙左伊勒希巴四年改北院樞密副使帝賜詩褒之遷知北院樞密使事賜翼聖佐義功臣北凖布酋長磨古斯叛額特埒率兵進討㑹天大雪敗磨古斯四别部斬首千餘級拜西北路招討使封漆水郡王加賜宣力守正功臣尋拜南府宰相復討𤓰爾佳呼喇巴部破之召為契丹行宮都部署先是北南府有訟各州府得就按之比嵗非奉樞密檄不得鞫問以故訟者稽留額特埒奏請如舊從之五年復為西北路招討使討額圗格爾俘斬甚衆獲馬駞牛羊各數萬明年擒磨古斯加守太保賜奉國匡化功臣乾統初乞致仕不許止罷招討南院樞密使封混同郡王遷北院樞密使加守太師賜推誠贊治功臣致仕薨諡曰敬肅哈里字呼紐回鶻人其先在太祖時來貢願留因任用之哈里重熈間歴近侍長清寧九年討重元之亂有功加金吾衞上將軍賜平亂功臣累遷殿前都檢㸃以宿衛嚴肅稱太康初加守太子太保二年加同中書門下平章事三年改同知南院宣徽使事㑹耶律伊遜出守中京哈里入賀及議復召陳其不可後伊遜再入樞府出哈里為廣利軍節度使及皇太子被誣哈里當連坐詔勿問大安初歴丕勒達嚕噶部節度使壽隆五年有疾自言吾數已盡却醫藥卒年七十七哈里素信浮圖清寧初從上獵墮馬憒而復蘇言始見二人引至一城宮室宏敞有衣綘袍人坐殿上左右列侍導哈里升階持牘者示之曰本取大腹古雲誤執汝牘上書官至使相壽七十七須㬰還擠之大壑而寤道宗聞之命書其事後皆驗竇景庸中京人中書令振之子聰明好學清寧中第進士授秘書省校書郎累遷少府少監咸雍六年授樞密直學士尋知漢人行宮副都署事大安初遷南院樞密副使監修國史知樞密院事賜同徳功臣封陳國公有疾表請致仕不從加太子太保授武定軍節度使審決寃滯輕重得宜以獄空聞七年拜中京留守九年薨諡曰肅憲子瑜三司副使耶律音濟字阿古丕勒部人父雙寛鎮西邉二十餘年治嚴肅不殖貨利時多稱之音濟寅畏好義以廕補官累遷東京副留守北樞密院侍御時蕭格蕭特古斯等以佞見任鬻爵納賄音濟以直道處其間無所阿唯改客省使時朝廷遣使括三京隱户不得以音濟代之得數千餘户時昭懐太子知北南院事選音濟為輔導樞密使伊遜將傾太子惡音濟在側奏出之為羣牧林牙太康元年伊遜請賜牧地音濟奏曰今牧地褊陿畜不蕃息豈可分賜臣下帝乃止伊遜由是益嫉之除懐徳軍節度使徙漠北猾水馬羣太保卒楊績良鄉人太平十一年進士及第累遷南院樞密副使與杜防韓知白等擅給進士堂帖降長寧軍節度使徙知涿州清寧初拜叅知政事兼同知樞密院事為南府宰相九年聞重元亂與姚景行勤王上嘉之十年知興中府咸雍初入知樞密院事二年乞致仕不許拜南院樞密使帝以績舊臣特詔燕見論古今治亂人臣邪正帝曰方今羣臣忠直耶律玦劉伸而已然伸不及玦之剛介績拜賀曰何代無賢世亂則獨善其身主聖則兼濟天下陛下銖分邪正升黜分明天下幸甚累表告歸不許封趙王太康中以例改王遼西致仕加守太保薨子貴忠知興中府趙徽南京人重熙五年擢甲科累遷大理正清寧二年銅州人妄毁三教徽按鞫之以狀聞稱㫖厯煩劇有能名累遷翰林學士承㫖咸雍初為度支使三年拜㕘知政事出為武定軍節度使及代軍民請留後同知樞宻院事兼南府宰相門下侍郎平章事致仕卒追贈中書令諡文憲王觀南京人博學有才辯重熙七年中進士乙科興宗崩充夏國報哀使還除給事中咸雍初遷翰林學士五年兼乾文閣學士七年改南院樞宻副使賜國姓叅知政事兼知南院樞宻事坐矯制修私第削爵為民卒耶律吉遜字盈隱永興宫分人興宗在青宫嘗居左右輔導聖宗大漸吉遜與馮嘉努告仁徳皇后同宰相蕭楚布等謀逆事及欽哀為皇太后稱制吉遜尤見寵任重熙中其子尼格為近侍坐事伏誅帝以吉遜有翼戴功且悼其子罪死欲世其官吉遜無所出之部因見馬印文有丕勒部號使𨽻其部拜南府宰相出為東北路詳衮卒論曰哈里音濟之為臣也當伊遜擅權蕭格貪黷之日雖與同官而能以正自處不少阿唯其過人逺矣傳曰嵗寒知松栢之後凋二子有焉若額特埒之戰功竇景庸之讞獄楊績之忠言亦賢矣夫遼史卷九十七遼史卷九十七考證耶律額特埓傳五年復為西北路招討使討尼都格爾部俘斬甚衆按部族表額特埓之奏尼都格爾之捷在壽隆元年其出師則在大安十年與本紀合此繫於大安五年之後不别書年月殊未明晰姑仍其舊而訂正之遼史卷九十七考證
