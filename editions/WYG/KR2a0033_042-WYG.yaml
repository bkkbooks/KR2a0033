body:
  text: 遼史卷四十二元中書右丞相總裁托克托等修志第十二厯象志上遼以幽營立國禮樂制度規模日完授厯頒朔二百餘年今奉詔修遼史體與宋金儗其大明厯不可少也厯書法禁不可得求大明厯元得祖冲之法于外史冲之之法遼厯之所從出也歟國朝亦甞因之以冲之法算而至於遼更厯之年以起元數是蓋遼大明厯遼厯因是固可補然弗之補史貴闕文也外史記其法司天存其職遼史志是足矣作厯象志厯大同元年太宗皇帝自晉汴京収百司僚屬伎術厯象遷于中京遼始有厯先是梁唐仍用唐景福崇𤣥厯晉天福四年司天監馬績奏上乙未元厯號調元厯太宗所収于汴是也穆宗應厯十一年司天王白李正等進厯蓋乙未元厯也聖宗統和十二年汗州刺史賈俊進新厯則大明厯是也髙麗所志大遼古今録稱統和十二年始頒正朔改厯驗矣大明厯本宗祖冲之法具見沈約宋書具如左宋武帝大明六年祖冲之上甲子元厯法未及施用因名大明厯上元甲子至宋大明七年癸卯五萬一千九百三十九年算外元法五十九萬二千三百六十五紀法三萬九千四百九十一章嵗三百九十一章月四千八百三十六章閏一百四十四閏法十二月法十一萬六千三百二十一日法三千九百三十九餘數二十萬七千四十四嵗餘九千五百八十九没分三百六十萬五千九百五十一没法五萬一千七百六十一周天一千四百四十二萬四千六百六十四虚分萬四百四十九行分法二十三小分法一千七百一十七通周七十二萬六千八百一十㑹周七十一萬七千七百七十七通法二萬六千三百七十七差率三十九推朔術置入上元年數算外以章月乘之滿章嵗為積月不盡為閏餘閏餘二百四十七以上其年有閏以月法乘積月滿日法為積日不盡為小餘六旬去積日不盡為大餘大餘命以甲子算外所求年天正十一月朔也小餘千八百四十九以上其月大求次月加大餘二十九小餘二千九十餘滿日法從大餘大餘滿六旬去之命如前次月朔也求弦望加朔大餘七小餘千五百七小分一小分滿四從小餘小餘滿日法從大餘命如前上弦日也又加得望又加得下弦又加得後月朔也推閏術以閏餘減章嵗餘滿閏法得一月命以天正算外閏所在也閏有進退以無中氣為正推二十四氣置入上元年數算外以餘數乘之滿紀法為積日不盡為小餘六旬去積日不盡為大餘大餘命以甲子算外天正十一月冬至日也求次氣加大餘十五小餘八千六百二十六小分五小分滿六從小餘小餘滿紀法從大餘命如前次氣日也求土王用事加冬至大餘二十七小餘萬五千五百二十八季月土用事日也又加大餘九十一小餘萬二千二百七十次土用事日也推没術以九十乘冬至小餘以減没分滿没法為日不盡為日餘命日以冬至算外没日也求次没加日六十九日餘三萬四千四百四十二餘滿没法從日次没日也日餘盡為滅推日所在度術以紀法乘朔積日為度實滿周天去之餘滿紀法為積度不盡為度餘命以虚一次宿除之算外天正十一月朔夜半日所在度也求次月大月加度三十小月加度二十九入虚去度分求行分以小分法除度餘所得為行分不盡為小分小分滿法從行分行分滿法從度求次日加一度入虛去行分六小分百四十七推月所在度術以朔小餘乘百二十四為度餘又以朔小餘乘八百六十為微分微分滿月法從度度餘滿紀法為度以減朔夜半日所在則月所在度求次月大月加度三十五度餘三萬一千八百三十四微分七萬七千九百六十七小月加度二十二度餘萬七千二百六十一微分六萬三千七百三十六入虚去度也遲疾厯月行度損益率盈縮積分差法一日十四行分十三益七十盈初五千三百四二日十四十一益六十五盈百八十四萬二十三百一十六五千二百七十三日十四十益五十七盈三百五十五萬七百六五千二百一十九四日十四八益四十七盈五百五萬八千三百八五千一百五十一五日十三二十一益三十四盈六百二十九萬七千八百五十七五千六十六六日十三十七益二十二盈七百二十萬二千六百九十一四千九百八十一七日十三十一益六盈七百七十七萬二千七百一十九四千八百七十九八日十三五損九盈七百九十四萬九百五十二四千七百七十七九日十二二十二損二十四盈七百七十萬七千四百一十五四千六百七十五十日十二十六損三十九盈七百七萬二千一百四千五百七十三十一日十二十一損五十二盈六百三萬五千七四千四百八十八十二日十二八損六十盈四百六十六萬三千一百四千四百三十七十三日十二六損六十五盈三百九萬三百三四千四百三十四日十二四損七十盈百三十八萬三千五百八十四千三百六十九十五日十二五益六十七縮四十五萬七千六十九四千三百八十六十六日十二七益六十二縮二百二十三萬七百五十五四千四百二十十七日十二十益五十五縮三百八十七萬五千四四千四百七十一十八日十二十四益四十五縮五百三十一萬九千三百八十五四千五百二十九十九日十二十九益三十二縮六百四十八萬四百四四千六百二十四二十日十三一益十九縮七百三十一萬六千六百八二十一日十三七益四縮七百八十一萬七千九百九十六四千八百一十一二十二日十二十二損十一縮七百九十一萬七千六百七四千九百一十三二十三日十三十九損三十七縮七百六十一萬五千四百四十五千一十五二十四日十四一損三十九縮六百九十萬一千四百九十五五千一百二十五日十四十六損五十二縮五百八十七萬一千七百二十五五千一百八十五二十六日十四十損六十二縮四百四十九萬九千一百五十九五千二百五十三二十七日十四十二損六十七縮二百八十五萬七千七百三十二五千二百八十七二十八日十四十損七十四縮百八萬二千三百七十九五千三百三十一推入遲疾厯術以通法乘朔積日為通實滿通周去之餘滿通法為日不盡為日餘命日算外天正十一月朔夜半入厯日也求次月大月加二日小月加一日日餘皆萬一千七百四十六厯滿二十七日日餘萬四千六百三十一則去之求次日加一日求日所在定度以夜半入厯日餘乘損益率以損益盈縮積分如差率而一所得滿紀法為度不盡為度餘以盈加縮減平行度及餘為定度益之或滿法損之或不足以紀法進退求度行分如上法求次日如所入遲疾加之虚去分如上法隂陽厯損益率兼數一日益十六初二日益十五十六三日益十四三十一四日益十二四十五五日益九五十七六日益五六十六七日益一七十一八日損二七十二九日損六七十十日損十六十四十一日損十三五十四十二日損十五四十一十三日損十六二十六十四日損十六十推入隂陽厯術置通實以㑹周去之不滿交數二十五萬八千八百八十八半為朔入陽厯分各去之為朔入隂厯分各滿通法得一日不盡為日餘命日算外天正十一月朔夜半入厯日也求次月大月加二日小月加一日日餘皆二萬七百七十九厯滿十三日日餘萬五千九百八十七半則去之陽竟入隂隂竟入陽求次日加一日求朔望差以二千二十九乘朔小餘滿三百三為日餘不盡倍之為小分則朔差數也加一十四日日餘二萬一百八十六小分百二十五小分滿六百六從日餘日餘滿通法為日即望差數也又加之後月朔也求合朔月食置朔望夜半入隂陽厯及餘有半者去之置小分三百三以差數加之小分滿六百六從日餘日餘滿通法從日日滿一厯去之命日算外則朔望加時入厯也朔望加時入厯一日日餘四千一百九十八小分四百二十八以下十二日日餘萬一千七百八十八小分四百八十一以上朔則交㑹望則月食求合朔月食定大小餘合差數日餘加夜半入遲疾厯餘日餘滿通法從日則朔望加時入厯也以入厯餘乘損益率以損益盈縮積分如差法而一以盈減縮加本朔望小餘為定小餘益之或滿法損之或不足以日法進退日求合朔月食加時以十二乘定小餘滿日法得一辰命以子算外加時所在辰也有餘者四之滿日法得一為少二為半三為太又有餘者三之滿日法得一為强以强并少為少强并半為半强并太為太强得二者為少弱以并太為一辰弱以前辰名之求月去日道度置入隂陽厯餘乘損益率如通法而一以損益兼數為定定數十二而一為度不盡三而一為少半太又不盡者一為强二為少弱則月去日道數也陽厯在表隂厯在裏測景漏刻中星數二十四氣日中景晝漏刻夜漏刻昬中星度明中星度冬至一丈三尺四十五五十五八十二行分二十一二百八十三行分八小寒一丈二尺四寸三分四十五六五十四四八十四二百八十二六大寒一丈一尺二寸四十六七五十三二八十六三二百八十六立春九尺八寸四十八四五十一六八十九三二百七十七三雨水八尺一寸七分五十五四十九五九十三二百七十二七驚蟄六尺六寸七分五十二九四十七一九十七二百六十八二十春分五尺三寸七分五十五五四十四五百二三二百六十四三清明四尺二寸五分五十八一四十一九百六二十一二百五十九八榖雨三尺二寸六分六十四三十九六百一十一三二百五十四四立夏二尺五寸三分六十二四三十七六百一十四十八二百五十一七小滿一尺九寸九分六十三九三十六一百一十七十二二百四十八十七芒種一尺六寸九分六十四八三十五二百一十九四二百四十七二夏至尺五寸六十五三十五百一十九十二二百四十六十七小暑一尺六寸九分六十四八分三十五百一十九四二百四十七大暑一尺九寸九分六十三九三十六一百一十七十二二百四十八十七立秋二尺五寸三分六十二四三十七六百一十四十八二百五十一十一處暑三尺二寸六分六十四三十九六百一十一二二百五十四四白露四尺二寸五分五十八一四十一九百六二十一二百五十九八一秋分五尺三寸七分五十五五四十四五百二三二百六十四二寒露六尺六寸七分五十二九四十七一九十七九二百六十八二十霜降八尺一寸七分五十五四十九五九十三二百七十三七立冬九尺八寸四十八四五十一六八十九三二百七十七三小雪一丈一尺一寸四十六七五十三三八十六一二百八十六大雪一丈二尺四寸三分四十五六五十四四八十四二百八十二六求昬明中星各以度數如夜半日所在則中星度推五星術木率千五百七十五萬三千八十二火率三千八十萬四千一百九十六土率千四百九十三萬三百五十四金率二千三百六萬一十四水率四百五十七萬六千二百四推五星術置度實各以率去之餘以減率其餘如紀法而一為入嵗日不盡為日餘命以天正朔算外星合日求星合度以入嵗日及餘從天正朔日積度及餘滿紀法從度滿三百六十餘度分則去之命以虛一算外星合所在度也求星見日以術伏日及餘加星合日及餘餘滿紀法從日命如前見日也求星見度以術伏度及餘加星合度及餘餘滿紀法從度入虚去度分命如前星見度也行五星法以小分法除度餘所得為行分不盡為小分及日加所行分滿法從度留者因前逆則減之伏不盡度從行入虛去行分六小分百四十七逆行出虚則加之木星初與日合伏十六日日餘萬七千八百三十二行二度度餘三萬七千五百四晨見東方從日行四分百一十二日行十九度十一分留二十八日逆日行三分八十六日退十一度五分又留一十八日從日行