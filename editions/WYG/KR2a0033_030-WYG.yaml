body:
  text: 遼史卷三十元中書右丞相總裁托克托等修本紀第三十天祚皇帝四五年春正月辛巳黨項小呼嚕遣人請臨其地戊子趨天徳過沙漠金兵忽至上徒步出走近侍進珠帽却之乗張仁貴馬得脱至天徳己丑遇雪無禦寒具珠展以貂裘帽進途次絶糧珠展進麨與棗欲憇珠展即跪坐倚之假寐珠展輩惟齧氷雪以濟饑過天徳至夜將宿民家紿曰偵騎其家知之乃叩馬首跪而大慟潛宿其家居數日嘉其忠遥授以節度使遂趨党項以小呼嚕為西南面招討使總知軍事仍賜其子及諸校爵賞有差二月至應州新城東六十里為金人完顔羅索等所獲八月癸卯至金丙午降封海濵王以疾終年五十有四在位二十四年金皇統元年二月改封豫王五年葬于廣寧府閭陽縣乾陵傍耶律淳者世號為北遼淳小字聶哷興宗第四孫南京留守宋魏王和囉噶之子清寧初太后鞠育之既長篤好文學昭懷太子得罪上欲以淳為嗣上怒耶律拜薩巴知與淳善出淳為彰聖等軍節度使天祚即位進王鄭乾統二年加越王六年拜南府宰相首議制兩府禮儀上喜徙王魏其父和囉噶薨即以淳襲父守南京冬夏入朝寵冠諸王天慶五年東征都監章努濟鴨子河與淳子阿薩爾等三百餘人亡歸先遣迪里以廢立之謀報淳淳斬迪里首以獻進封秦晉國王拜都元帥賜金劵免漢拜禮不名許自擇將士乃募燕雲精兵東至錦州隊長武朝彦作亂劫淳淳匿而免收朝彦誅之㑹金兵至聚兵戰于阿爾展圖敗績收亡卒數千人拒之淳入朝釋其罪詔南京刻石紀功保大二年天祚入夾山奚王和勒博林牙耶律達實等引唐靈武故事議欲立淳淳不從官屬勸進曰主上䝉塵中原擾攘若不立王百姓何歸宜熟計之遂即位百官進號天錫皇帝改保大二年為建福元年大赦放進士李寶信等一十九人遥降天祚為湘隂王以燕雲平上京中京遼西六路淳主之沙漠以北南北路兩都招討府諸畨部族等仍𨽻天祚自此遼國分矣封其妻普賢女為徳妃以和勒博知北院樞密使事軍族之事悉委達實又遣使報宋免歳幣結好宋人發兵問罪擊敗之尋遣使奉表于金乞為附庸事未決淳病死年六十百官偽諡曰孝章皇帝廟號宣宗葬燕西香山永安陵遺命遥立秦王定以存社稷徳妃為皇太后稱制改建福為徳興元年放進士李球等百八人時宋兵來攻戰敗之由是人心大悦兵勢日振宰相李純等潛納宋兵居民内應抱關者被殺甚衆翌日攻内東門衞兵力戰宋軍大潰踰城而走死者相籍五表于金求立秦王不從而金兵大至徳妃奔天徳軍見天祚天祚怒誅徳妃降淳庶人除其屬籍耶律雅里者天祚皇帝第二子也字薩蘭七歳欲立為皇太子别置禁衞封梁王保大三年金師圍青塜寨雅里在軍中太保特黙格挾之出走間道行至隂山聞天祚失利趨雲内雅里馳赴時扈從者千餘人多於天祚天祚慮特黙格生變欲誅之責以不能全救諸王將訊之仗劍召雅里問曰特黙格教汝何為雅里對曰無他言迺釋之天祚渡河奔夏隊帥耶律迪里等劫雅里北走至沙嶺見蛇横道而過識者以為不祥後三日羣僚共立雅里為主雅里遂即位改元神厯命士庶上便宜雅里性寬大惡誅殺獲亡者笞之而已有自歸者即官之因謂左右曰欲附來歸不附則去何須威逼耶每取唐貞觀政要及林牙資忠所作治國詩令侍從讀之烏爾古部節度使扎扎徳哷勒部統軍托卜嘉都監圖魯卜等率衆來附自是諸部繼至而雅里日漸荒怠好擊鞠特黙格切諫乃不復出以耶律迪里為樞宻使特黙格副之迪里劾西北路招討使蕭扎里熒惑衆心志有不臣與其子瑪尼竝誅之以約蘇為招討使與諸番戰數敗杖免官從行有疲困者輙振給之直長保徳諫曰今國家空虚賜賚若此將何以相給耶雅里怒曰昔畋於福山卿誣獵官今復有此言若無諸部我將何取不納初令羣牧運鹽濼倉粟而民盜之議籍以償雅里乃自為直每粟一車償一羊三車一牛五車一馬八車一駝左右曰今一羊易粟二斗且不可得乃償一車雅里曰民有則我有若令盡償民何堪後獵扎拉山一日而射黄羊四十狼二十一因致疾卒年三十耶律達實者世號為西遼逹實字重徳太祖八代孫也通遼漢字善騎射登天慶五年進士第擢翰林應奉尋陞承㫖遼以翰林為林牙故稱逹實林牙厯秦祥二州刺史遼興軍節度使保大二年金兵日逼天祚播越與諸大臣立秦晉王淳為帝淳死立其妻蕭徳妃為太后以守燕及金兵至蕭徳妃歸天祚天祚怒誅徳妃而責逹實曰我在汝何敢立淳對曰陛下以全國之勢不能一拒敵棄國逺遁使黎民塗炭耶立十淳皆太祖子孫豈不勝乞命於他人耶上無以答賜酒食赦其罪達實不自安遂殺蕭伊實博勒和自立為王率鐵騎二百宵遁北行三日過黑水見白達勒達詳衮崇古嚕崇古嚕獻馬四百駝二十羊若干西至哈屯城駐北庭都䕶府㑹威武崇徳㑹蕃新大林紫河駞等七州及大黄室韋徳哷勒昻吉爾察察哩約喜布古徳尼勒搭喇庫徳摩哩黙爾吉和卓烏庫哩準布博克碩寛唐古呼穆蘇希達濟勒貝十八部王衆諭曰我祖宗艱難創業厯世九主厯年二百金以臣屬殘毒我黎庶屠翦我州邑使我天祚皇帝䝉塵于外日夜痛心疾首我今仗義而西欲借力諸畨翦我仇敵復我疆宇惟爾衆亦有軫我國家憂我社稷思共救君父濟生民於難者乎遂得精兵萬餘置官吏立排甲具器仗明年二月甲午以青牛白馬祭天地祖宗整旅而西先遺書於回鶻王必里克曰昔我太祖皇帝北征過巴噶罕城遣使至甘州詔爾祖烏穆珠曰汝思故國耶朕即為汝復之汝不能返耶朕則有之在朕猶在爾也爾祖即表謝以為遷國于此十有餘世軍民皆安土重遷不能復返矣是與爾國非一日之好也今我將西至大食假道爾國其勿致疑必里克得書即迎至邸大宴三日臨行獻馬六百駞百羊三千願質子孫為附庸送至境外所過敵者勝之降者安之兵行萬里歸者數國獲駝馬牛羊財物不可勝計軍勢日盛鋭氣日倍至塔什干西域諸國舉兵十萬號呼喇繖來拒戰兩軍相望二里許諭將士曰彼軍雖多而無謀攻之則首尾不救我師必勝遣六院司大王蕭額哩埒招討副使耶律松山等將兵二千五百攻其右樞密副使蕭扎倫布招討使耶律穆蘇等將兵二千五百攻其左自以衆攻其中三軍俱進呼喇繖大敗僵屍數十里駐軍塔什干凡九旬回回國王來降貢方物又西至奇爾瑪勒文武百官冊立達實為帝以甲辰歳二月五日即位年三十八號格爾干復上漢尊號曰天祐皇帝改元延慶追諡祖父為嗣元皇帝祖母為宣義皇后冊元妃蕭氏為昭徳皇后因謂百官曰朕與卿等行三萬里跋涉沙漠夙夜艱勤賴祖宗之福卿等之力冒登天位爾祖爾父宜加䘏典共享尊榮自蕭額哩埒等四十九人祖父封爵有差延慶三年班師東歸馬行二十日得善地遂建都城號呼遜卾爾多改延慶為康國元年三月以六院司大王蕭額哩埒為兵馬都元帥徳哷勒部前同知樞密院事蕭札倫布副之察察哩部圖嚕耶律燕山為都部署䕶衞耶律特爾格為都監率七萬騎東征以青牛白馬祭天樹旗以誓衆曰我大遼自太祖太宗艱難而成帝業其後嗣君躭樂無厭不恤國政盜賊蠭起天下土崩朕率爾衆逺至朔漠期復大業以光中興此非朕與爾世居之地申命元帥額哩埒曰今汝其往信賞必罰與士卒同甘苦擇善水草以立營量敵而進毋自取禍敗也行萬餘里無所得牛馬多死勒兵而還達實曰皇天弗順數也康國十年殁在位二十年廟號徳宗子伊立㓜遺命皇后權國后名塔布布延號感天皇后稱制改元咸清在位七年子伊立即位改元紹興籍民十八歳以上得八萬四千五百戶在位十三年殁廟號仁宗子幼遺詔以妹博克碩寬權國稱制改元崇福號承天太后後與駙馬蕭國魯卜弟巴噶濟蘇爾通出駙馬為東平王羅織殺之駙馬父額哩埒以兵圍其宫射殺博克碩寛及巴噶濟蘇爾博克碩寛在位十四年仁宗次子珠勒呼即位改元天禧在位三十四年時秋獵柰曼王庫楚埒伏兵八千擒之據其位遂襲遼衣冠尊珠勒呼為太上皇皇后為皇太后朝夕問起居以侍終焉珠勒呼死遼絶耶律淳在天祚之世厯王大國受賜金劵贊拜不名一時㤙遇無與為比當天祚播越以都元帥留守南京獨不可奮大義以激燕民及諸大臣興勤王之師東拒金而迎天祚乎乃自取之是簒也況忍王天祚哉達實既帝淳而王天祚矣復歸天祚天祚責以大義乃自立為王而去之幸藉祖宗餘威遺智建號萬里之外雖寡母弱子更繼迭承幾九十年亦可謂難矣然淳與雅里達實之立皆在天祚之世有君而復君之其可乎哉諸葛武侯為獻帝發喪而後立先主為帝者不可同年語矣故著以為戒云贊曰遼起朔野兵甲之盛鼓行外席卷河朔樹晉楨漢何其壯歟太祖太宗乗百戰之勢輯新造之邦英謀叡畧可謂逺矣雖以世宗中才穆宗殘暴連遘弑逆而神器不揺蓋由祖宗威令猶足以震疊其國人也聖宗以來内修政治外拓疆宇既而申固鄰好四境乂安維持二百餘年之基有自來矣降臻天祚既丁未運又觖人望崇信姦回自㭬國本羣下離心金兵一集内難先作廢立之謀叛亡之迹相繼蠭起馴致土崩瓦解不可復支良可哀也耶律與蕭世為甥舅義同休戚奉先挾私滅公首旤搆難一至於斯天祚窮蹙始悟奉先誤已不既晚乎淳雅里所謂名不正言不順事不成者也達實苟延彼善於此亦幾何哉遼史卷三十遼史卷三十考證耶律淳者世號為北遼按紀叙淳由節度進鄭王宏簡録載淳初封北平郡王即北遼所由稱以耶律廸里為樞宻使迪里舊作敵列此作敵烈續通鑑作特列又濟勒貝舊作乣而畢部族表作紀而畢皆係一人而書名互異今畫一改遼史卷三十考證
