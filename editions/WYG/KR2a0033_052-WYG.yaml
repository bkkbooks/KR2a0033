body:
  text: 遼史卷五十二元中書右丞相總裁托克托等修志第二十一禮志五嘉儀上皇帝受冊儀前期一日尚舍奉御設幄於正殿北牖下南面設御坐奉禮郎設官僚客使幕次於東西朝堂太樂令設宫懸於殿庭舉麾位在殿第二重西階上東向乘黄令陳車輅尚輦奉御陳輿輦尚舍奉御設解劍席于東西階設文官六品已上位横街南東方西向武官五品已上位横街南西方東向皆北上重行每等異位將士各勒所部六軍仗屯諸門金吾仗黄麾仗陳于殿庭至日押冊官引冊自西便門入置冊案西階上通事舍人引侍從班入就位侍中東階下解劍履上殿欄外俛俯跪奏中嚴下殿劍履復位立閣使西階上殿欄外跪請木契面殿鞠躬奏奉敕喚仗殿中監少監殿中丞等押金吾四色仗入位臣僚後協律郎入就舉麾位符寳郎詣閤奉迎通事舍人引文官四品至六品武官三品至五品就門外位皇帝御輦至宣徳門宣徽使押内諸司班起居引皇帝至閤服衮冕侍中東階下解劍履上殿版奏外辦太常博士引太常卿太常卿引帝内諸司出協律郎舉麾太樂令令撞黄鍾之鐘左右鐘皆應工人皷柷樂作皇帝即御坐宣徽使贊扇合樂止贊簾捲扇開符寳郎奉寳進左右金吾報平安通事舍人引文官三品武官二品已上入門樂作就相向位畢樂止通事舍人引侍從班南班文官三品武官二品已上合班北向東班西上西班東上起居七拜分班各復位通事舍人引押冊官押冊自西階下至丹墀當殿置香案冊案置冊訖樂作就位樂止捧冊官近後東西相對立舍人引侍從班并南班合班北向如初贊再拜在位者皆再拜舞蹈五拜分班各復位如初捧冊官就西階下解劍席解劍履捧冊西階上殿樂作置冊御坐前東西立北向捧冊官西牖下立北上樂止讀冊官出班當殿立贊再拜三呼萬嵗就西階下解劍席解劍履西階上殿欄内立當御坐前侍中取冊捧冊官捧冊匣至讀冊官前跪相對捧冊讀冊官俛伏跪讀訖俛伏興捧冊官跪左膝以冊授侍中侍中受冊以冊授執事者降自西階劍履訖復當殿位贊再拜三呼萬嵗復分班位舍人引侍從班南班合班北向如初贊拜在位者皆拜舞蹈鞠躬如初通事舍人引班首西階下解劍履上殿樂作就欄内位樂止俛伏跪通全銜臣某等致詞稱賀訖伏興興降西階下帶劍納舄樂作復位樂止贊拜在位者皆再拜舞蹈五拜鞠躬侍中臨軒西向稱有制皆再拜侍中宣答訖贊皆再拜舞蹈五拜分班各復位三品已上出樂作出門畢樂止侍中當御坐俛伏跪通全銜奏禮畢俛伏興退東階下殿帶劍納履復位宣徽使贊扇合下簾太常博士太常卿引皇帝起樂作至閤樂止舍人引文官四品武官三品以下出門外分班立次引侍從班出次兵部吏部出次金吾出次起居郎舍人出次殿中監少監押金吾細仗出仍位臣僚後次東西上閤門使於丹墀内鞠躬奏衙内無事捲班出閤門使丹墀内鞠躬揖奉敕放仗出門外文武班中間立喚承受官承受官聲諾至閤使後鞠躬揖閤使鞠躬稱奉敕放仗承受聲諾鞠躬揖平身立引聲奉敕放仗聲絶趨退文武合班再拜舍人一員攝詞令官殿前鞠躬揖稱奉敕放黄麾仗出放金吾仗亦如之翼日文武臣僚入問聖躬太平元年行此儀大畧遵唐晉舊儀又有上契丹冊儀以蘇爾威汗柴冊禮合唐禮雜就之又有上漢冊儀與此儀大同小異加以上寳儀冊皇太后儀前期陳設於元和殿如皇帝受冊之儀至日皇帝御𢎞政殿冊入侍從班入門外金吾列仗文武分班侍中解劍奏中嚴宣徽使請木契喚仗皆如之樂工入閤使門外文武班中間立喚承受官聲諾趨至閤使後立閤使鞠躬揖稱奉敕喚仗承受官鞠躬聲諾揖引聲奉敕喚仗文武合班再拜殿中監押仗入文武官入亦如之宣徽使押内諸司供奉官天橋班候皇太后御紫宸殿乘平頭輦童子女童隊樂引至金鑾門閤使奏内諸司起居訖贊引駕自下先行至元和殿皇太后入西北隅閤内更衣侍中解劍上殿奏外辦宣徽受版入奏侍中降復位協律郎舉麾樂作太樂令太常卿導引皇太后升坐宣徽使贊扇合簾捲扇開樂止符寳郎奉寳置皇太后坐右左右金吾大將軍對揖鞠躬奏軍國内外平安東上閤門副使引丞相東門入西上閤門副使引親王西門入通事舍人引文武班入如儀樂作至位樂止文武班趨進相向再拜退復位東西上閤門使宣徽使自𢎞政殿引皇帝御肩輿至西便門下引入門樂作至殿前位樂止宣徽使贊皇帝拜問皇太后聖躬萬福拜皇帝御西閤坐合班起居如儀北府宰相押冊中書樞密令史八人舁冊東西上閤門使引冊宣徽使引皇帝送冊樂作至殿前置冊位樂止宣徽使贊皇帝再拜稱萬嵗羣臣陪位揖翰林學士四人大將軍四人舁冊皇帝捧冊行三舉武授冊舁之西階上殿樂作置太后坐前樂止皇帝冊西面東立舍人引丞相當殿再拜三呼萬嵗解劍西階上殿樂作至讀冊位樂止俛伏跪讀冊訖俛伏三呼萬嵗復班位宣徽使引皇帝下殿樂作至殿前位樂止皇帝拜舞蹈拜訖引皇帝西階上殿至皇太后坐前位俛跪致詞訖俛伏興引西階下至殿前位拜舞蹈拜鞠躬侍中臨軒宣太后答稱有制皇帝再拜宣訖引皇帝上殿樂作至西閤樂止丞相親王侍從文武合班贊拜舞蹈三呼萬嵗如儀丞相上賀侍中宣答如儀丞相以下出舉樂出門樂止侍中奏禮畢宣徽索扇扇合下簾皇太后起舉樂入閤樂止文武官出門外分班侍從兵部吏部起居金吾仗出如儀閤使奏放仗皆如皇帝受冊之儀冊皇后儀至日北南臣僚内外命婦詣端拱殿幕次皇后至閤侍中奏中嚴引命婦班入就東西相向位立皇帝臨軒命使發冊使副押冊至端拱殿門外幕次侍中奏外辦所司承㫖索扇扇上舉麾樂作皇后出閤升坐扇開簾捲偃麾樂止引命婦合班面殿起居八拜皇后降坐樂作至殿下褥位樂止引冊入置皇后褥位前侍中傳宣皇后四拜命婦陪位皆拜引讀冊官至皇后褥位前俛伏跪讀訖皇后四拜陪位者皆拜引皇后升殿使臣引冊置皇后坐前冊案退西向侍立命婦當殿稱賀四拜引班首東階上殿致詞訖東階下殿復位四拜侍中奏宣答稱有教旨四拜宣答訖四拜班首上殿進酒皇后賜押冊使副等酒訖侍中奏禮畢承旨索扇樂作皇后起入閤樂止分引命婦等東西門出冊皇太子儀前期一日設幄坐于宣慶殿設文武官幕次于朝堂并殿庭板位太樂令陳宫縣皆如皇帝受冊儀守宫設皇太子次于朝堂北西向乘黄令陳金輅朝堂門外西向皇太子儀仗笳簫鼓吹等陳宣慶門外典儀設皇太子版位于殿横街南近東北向設文武官五品以上位于樂縣東西餘官如常儀至日門下侍郎奉冊中書侍郎奉寳綬各置于案令史二人絳服對舉案立寳案在横街北西向冊案在北門下侍郎中書侍郎竝立案後侍中版奏中嚴皇太子逺遊冠絳紗袍秉珪出太子舍人引入就版位北面殿立東宫官三師以下皆從立皇太子東南西向太子入門樂作至位樂止典儀贊皇太子再拜在位者皆再拜中書令立太子東北西向門下侍郎引冊案中書侍郎取冊進授中書令退復位傳宣官稱有制皇太子再拜傳宣訖再拜中書令跪讀冊訖俛伏興皇太子再拜受冊退授左庶子中書侍郎取寳進授中書令皇太子進受寳退授左庶子中書令以下退復位舁案者以案退典儀贊再拜皇太子拜在位者皆再拜太子舍人引皇太子退樂作出門樂止侍中奏禮畢皇太子升金輅左庶子以下夾侍儀仗鼓吹等竝列宣慶門外三師三少諸宫臣於金輅前後導從鳴鐃而行還東宫宫庭先設仗衛如式至宫門鐃止皇太子降金輅舍人引入就位坐文武宫臣序班稱賀禮畢冊王妃公主儀至日押冊使副并讀冊等官押冊東便門入持節前導至殿冊案置横街北少東引使副等面殿立而鞠躬侍中臨軒稱有制皆再拜鞠躬宣制訖舞蹈五拜引冊於宣慶門出使副等押領儀仗冊案赴各私第㕔前向闕陳列設傳宣受冊拜褥冊案置褥左去幕蓋使副案右序立受冊者就位立傳宣稱有制再拜宣制畢舁冊人舉冊匣於褥前跪捧引讀冊者與受冊者皆俛伏跪讀訖皆俛伏興受冊者謝恩國王五拜王妃公主四拜若冊禮同日先上皇太后冊寳次臨軒同制遣使冊皇后諸王妃主次冊皇太子皇帝納后之儀擇吉日至日后族畢集詰旦后出私舍坐于堂皇帝遣使及媒者以牲酒饔餼至門執事者以告使及媒者入謁再拜平身立少頃拜進酒于皇后次及后之父母宗族兄弟酒徧再拜納幣致詞再拜訖后族皆坐特哩衮夫人四拜請就車后辭父母伯叔父母兄各四拜宗族長者皆再拜升車父母飲后酒致戒詞徧及使者媒者送者發軔伯叔父母兄飲后酒如初教坊遮道贊祝后命賜以物后族追拜進酒遂行將至宫門宰相傳敕賜后酒徧及送者既至特哩衮率皇族奉迎再拜皇后車至便殿東南七十步止特哩衮夫人請降車負銀罌捧縢履黄道行後一人張羔裘若襲之前一婦人捧鏡却行置鞍于道后過其上乃詣神主室三拜南北向各一拜酹酒向謁者一拜起居訖再拜次詣舅姑御容拜奠酒選皇族諸婦宜子孫者再拜之授以罌縢又詣諸帝御容拜奠酒神賜襲衣珠玉珮飾拜受服之后姊若妹陪拜者各賜物皇族迎者后族送者徧賜酒皆相偶飲訖后坐别殿送后者退食于次媒者傳旨命送后者列于殿北竢皇帝即御坐選皇族尊者一人當奥坐主婚禮命執事者往來致辭于后族引后族之長率送后者升當御坐皆再拜又一人少進附奏送后之詞退復位再拜后族之長及送后者向當奥者三拜南北向各一拜向謁者一拜后族之長跪問聖躬萬福再拜復奏送后之詞又再拜當奥者與媒者行酒三周命送后者再拜皆坐終宴翼日皇帝晨興詣先帝御容拜奠酒訖復御殿宴后族及羣臣皇族后族偶飲如初百戲角觝戲馬較勝以為樂又翼日皇帝御殿賜后族及贐送后者各有差受賜者再拜進酒再拜皇帝御别殿有司進皇后服飾之籍酒五行送后者辭訖皇族獻后族禮物后族以禮物謝當奥者禮畢公主下嫁儀選公主諸父一人為婚主凡當奥者媒者致詞之儀自納幣至禮成大畧如納后儀擇吉日詰旦媒者趣向主之家詣宫竢皇帝皇后御便殿率其族入見進酒訖命皇族與尚主之族相偶飲翼日尚主之家以公主及婿率其族入見致宴于皇帝皇后獻贐送者禮物訖朝辭賜公主青幰車二螭頭蓋部皆飾以銀駕駞送終車一車樓純錦銀螭懸鐸後垂大氊駕牛載羊一謂之祭羊擬送終之具至覆尸儀物咸在賜其婿朝服四時襲衣鞍馬凡所需無不備選皇族一人送至其家親王女封公主者婚儀倣此以親疏為差降遼史卷五十二遼史卷五十二考證受冊儀奏衙内無事按禮志載禮儀畢輒報閤門無事此獨書衙内續通考載此儀云奏衙門内事疑俱係閤門之訛謹仍其舊而附證于此納后儀按原本國語解凡納后即族中選尊者一人當奥而坐以主其禮謂之奥姑送后者拜而致敬謂之拜奥禮志所載向當奥者三拜云云即拜奥禮也第考聖宗本紀統和十二年九月行拜奥禮又興宗本紀重熙五年五月幸北院大王帳拜奥二者皆無納后事據此則拜奥禮疑不專為納后也公主下嫁儀按興宗本紀重熙十六年定公主行婦禮于舅姑儀惜志不載遂無可考遼史卷五十二考證
