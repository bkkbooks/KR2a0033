  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_076-1a, image: WYG0289/WYG0289-0582a.png}
body:
  text: 遼史卷七十六元中書右丞相總裁托克托等修列傳第六耶律嘉哩耶律巴哩岱耶律碩格耶律羅卜科趙延壽高模翰趙思温耶律烏魯斯張礪耶律嘉哩字布當圖魯卜部人世為小吏嘉哩早隸太宗麾下擢為軍校天顯間唐攻定州既陷嘉哩為唐兵所獲晉高祖立始歸國太宗貰其罪拜御史大夫㑹同九年伐晉師次滹沱河奪中渡橋降其將杜重威上命嘉哩與降將張彦澤率騎兵三千疾趨河南所至無敢當其鋒既入汴嘉哩等遷晉王重貴於開封府彥澤恣殺掠亂宮掖嘉哩不能禁百姓騷然莫不怨憤車駕至京數彥澤罪斬於市汴人大悦嘉哩亦被詰責尋釋之天禄間加守太子太傅應厯初置本部令公嘉哩世其職卒耶律巴哩岱字海蘭太祖弟埒克之子太宗即位以親愛見任㑹同七年討石重貴巴哩岱進圍徳州下之擒刺史師居璠等二十七人九年再舉兵次滹沱河降杜重威戰功居多太宗入汴以功授安國軍節度使總領河北道事師還州郡往往叛以應劉知逺巴哩岱不能守而歸世宗即位遷中京留守卒耶律碩格字穆克徳横帳孟父之後幼為太祖所養既冠為右皮室詳衮從征渤海有功天顯七年授三河烏爾古部都詳衮平易近民民安之以故久其任㑹同間為特哩衮時晉主重貴渝盟帝親征晉將杜重威擁衆拒滹沱月餘帝由他渡濟碩格與趙延壽據中渡橋重威兵却遂降是嵗入汴世宗即位碩格奉太宗喪歸上京佐皇太后出師坐是免官卒耶律羅卜科字信寧太祖從姪也初太祖制契丹國字羅卜科以贊成功授林牙監修國史後率偏師為西南邊大詳衮從伐党項有功㑹河東節度使石敬瑭為其主所討遣人求援羅卜科導送於朝如其請帝親率師往援羅卜科從擊唐將張敬達於太原北敗之㑹同初從討党項俘獲最諸將師還天冊中拜裕悦六年為北院大王終年五十五趙延壽本姓劉恒山人父邟令蓨梁開平初滄州節度使劉守文陷蓨其裨將趙得鈞獲延壽養以為子少美容貌好書史唐明宗先以女妻之及即位封其女為興平公主拜延壽駙馬都尉樞密使明宗子從榮恃權跋扈内外莫不震懾延壽求補外避之出為宣武軍節度使清泰初加魯國公復為樞密使鎮許州石敬瑭發兵太原唐遣張敬達往討㑹敬達敗保晉安寨延壽與徳鈞往救聞晉安已破走團栢峪太宗追及延壽與其父俱降明年徳鈞卒以延壽為幽州節度使封燕王及改幽州為南京遷留守總山南事天顯末以延壽妻在晉詔取之以歸自是益自激昻圖報㑹同初帝幸其第加政事令冬晉人背盟帝親征延壽為先鋒下貝州授魏博等州節度使封魏王敗晉軍于南樂獲其將賽項羽軍元城晉將李守貞高行周率兵來逆破之至頓丘㑹大霖雨帝欲班師延壽諌曰晉軍屯河濱不敢出戰若徑入澶州奪其橋則晉不足平上然之適晉軍先歸澶州高行周至析城延壽將輕兵逆戰上親督騎士突其陣敵遂潰師還留延壽徇貝冀深三州八年再伐晉晉主遣延壽族人趙行實以書來招時晉人堅壁不出延壽紿曰我陷遼久寜忘父母之邦若以軍逆我即歸晉人以為然遣杜重威率兵迎之延壽至滹沱河據中渡橋與晉軍力戰手殺其將王靖兩軍相拒太宗潛由他渡濟留延壽與耶律碩格據橋敵不能奪屢敗之杜重威埽厥衆降上喜賜延壽龍鳯赭袍且曰漢兵皆爾所有爾宜親往撫慰延壽至管杜重威李守貞迎謁馬首後太宗克汴延壽因李崧求為皇太子上曰吾於魏王雖割肌肉亦不惜但皇太子須天子之子得為魏王豈得為也蓋上嘗許滅晉後以中原帝延壽以故摧堅破敵延壽常以身先至是以崧達意上命遷延壽秩翰林學士承旨張礪進擬中京留守大丞相録尚書事都督中外諸軍事上塗録尚書事都督中外諸軍事世宗即位以翌戴功授樞密使天禄二年薨高模翰一名松渤海人有膂力善騎射好談兵初太祖平渤海模翰避地高麗王妻以女因罪亡歸坐使酒殺人下獄太祖知其才貰之天顯十一年七月唐遣張敬達楊光逺帥師五十萬攻太原勢鋭甚石敬瑭遣人求救太宗許之九月徴兵出太原模翰與敬達軍接戰敗之太原圍解敬瑭夜出謁帝約為父子帝召模翰等賜以酒饌親饗士卒士氣益振翌日復戰又敗之敬達䑕竄晉安寨模翰獻俘於帝㑹敬瑭自立為晉帝光逺斬敬達以降諸州悉下上諭模翰曰朕自起兵百餘戰卿功第一雖古名將無以加乃授上將軍㑹同元年冊禮告成宴百官及諸國使于二儀殿帝指模翰曰此國之勇將朕統一天下斯人之力也羣臣皆稱萬嵗及晉叛盟出師南伐模翰為統軍副使與僧額前驅拔赤城破徳貝諸寨是冬兼總左右鐵鷂子軍下關南城邑數十三月勑虎官楊覃赴乾寧軍為滄州節度使田武名所圍模翰與趙延壽聚議往救俄有光自模翰目中出縈繞旗矛燄燄如流星久之模翰喜曰此天贊之祥遂進兵殺獲甚衆以功加侍中畧地鹽山破饒安晉人震怖不敢接戰加太傅晉以魏府節度使杜重威領兵三十萬來拒模翰謂左右曰軍法在正不在多以多陵少不義必敗其晉之謂乎詰旦以麾下三百人逆戰殺其先鋒梁漢璋餘兵敗走手詔褒美比漢之李陵項之杜重威等復至滹沱河帝召模翰問計上善其言曰諸將莫及此乃令模翰守中渡橋及戰復敗之上曰朕憑高觀兩軍之勢顧卿英銳無敵如鷹逐雉兎當圖形麟閣爵貤後裔已而杜重威等降車駕入汴加特進檢校太師封悊郡開國公賜璽書劒器為汴州巡檢使平氾水諸山土賊遷鎮中京天禄二年加開府儀同三司賜對衣鞍勒名馬應厯初召為中臺省右相至東京父老歡迎曰公起戎行致身富貴為鄉里榮相如買臣輩不足過也九年正月遷左相卒趙思温字文美盧龍人少果鋭膂力兼人隸燕帥劉仁恭幕李存朂問罪于燕思温統偏師拒之流矢中目裂裳漬血戰猶不己為存朂將周徳威所擒存朂壯而釋其縛久之日見信用與梁戰於莘縣以驍勇聞授平州刺史兼平營薊三州都指揮使神冊二年太祖遣大將經畧燕地思温來降及伐渤海以思温為漢軍都團練使力戰拔扶餘城身被數創太祖親為調藥太宗即位以功擢檢校太保保静軍節度使天顯十一年唐兵攻太原石敬瑭遣使求救上命思温自嵐憲間出兵援之既罷兵改南京留守盧龍軍節度使管内觀察處置等使開府儀同三司兼侍中賜協謀静亂翊聖功臣尋改臨海軍節度使㑹同初從耶律徳哷使晉行冊禮還加檢校太師二年有星隕于庭卒上遣使賻祭贈太師魏國公子延昭延靖官至使相耶律烏魯斯六院額爾竒木博果濟之後負勇畧每戰被重鎧揮鐵槊所向披靡㑹同間伐晉上至河獵適海東青鶻搏雉晉人隔水以鴿引去上顧左右曰誰為我得此人烏魯斯請内廐馬濟河擒之并殺救者數人還上大悦優加賞賚既而晉將杜重威逆於望都據水勒戰烏魯斯介馬突陣餘軍􅁇之被圍衆言陣薄處可出烏魯斯曰恐彼有他備竟引兵衝堅而出迴視衆所指皆大塹也其料敵多此類是年總領迪里皮室軍坐私免部曲奪官卒張礪磁州人初仕唐為掌書紀遷翰林學士㑹石敬瑭起兵唐主以礪為招討判官從趙徳鈞援張敬達于河東及敬達敗礪入契丹後太宗見礪剛直有文彩擢翰林學士礪臨事必盡言無所避上益重之未幾謀亡歸為追騎所獲上責曰汝何故亡礪對曰臣不習北方土俗飲食居處意常鬱鬱以是亡耳上顧通事高彦英曰朕嘗戒汝善遇此人何乃使失所而亡礪去可再得耶遂杖彦英而謝礪㑹同初陞翰林承旨兼吏部尚書從太宗伐晉入汴諸將蕭翰耶律郎伍滿達輩肆殺掠礪奏曰今大遼始得中國宜以中國人治之不可專用國人及左右近習苟政令乖失則人心不服雖得之亦將失之上不聽改右僕射兼門下侍郎平章事項之車駕北還至欒城崩時礪在恒州蕭翰與滿達以兵圍其第礪方卧病出見之翰數之曰汝何故於先帝言國人不可為節度使我以國舅之親有征伐功先帝留我守汴以為宣武軍節度使汝獨以為不可又譖我與嘉哩好掠人財物子女今必殺汝趣令鎖之礪抗聲曰此國家大體安危所繫吾實言之欲殺即殺奚以鎖為滿達以礪大臣不可專殺乃救止之是夕礪恚憤卒論曰初晉因遼之兵而得天下故兼臣禮而父事之割地以為壽輸帛以為貢未久也而㑹同之師次滹沱矣豈羣帥貪功黷武而致然歟抑所謂信不由衷也哉模翰以功名自終可謂良將若延壽之勲雖著至于覬覦儲位謬矣利令智昏固無足議若乃成末釁以虧儁功如嘉哩者何譏焉遼史卷七十六遼史卷七十六考證趙延壽傳世宗即位以翊戴功授樞密使天禄二年薨按延壽之圖自立世宗之執延壽資治通鑑紀載甚詳遼史皆不載趙思温傳子延昭按延昭資治通鑑作延照在石晋為祁州刺史遼史卷七十六考證
