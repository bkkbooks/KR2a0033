body:
  text: 遼史卷八十三元中書右丞相總裁托克托等修列傳第十三耶律休格瑪格耶律色珍耶律希達耶律學古額布勒耶律休格字遜寧祖實嚕隋國王父烏蘇南院額爾竒木休格少有公輔器烏爾古室韋叛休格從北府宰相蕭斡討之應厯末為特哩衮乾亨元年宋侵燕北院大王希達統軍使蕭托果等敗績南京被圍帝命休格代希達將五院軍徃救遇大敵於高梁河與耶律色珍分左右翼擊敗之追殺三十餘里斬首萬餘級休格被三創明旦宋主遁去休格以創不能騎輕車追至涿州不及而還是年冬上命韓匡嗣耶律沙伐宋以報圍城之役休格率本部兵從匡嗣等戰于滿城翌日將復戰宋人請降匡嗣信之休格曰彼衆整而鋭必不肯屈乃誘我耳宜嚴兵以待匡嗣不聽休格引兵憑高而視須㬰南兵大至皷譟疾馳匡嗣倉卒不知所為士卒棄旗皷而走遂敗績休格整兵進擊敵乃却詔總南靣戍兵為北院大王車駕親征圍瓦橋關宋兵來救守將張師突圍出帝親督戰休格斬師餘衆退走入城宋陣于水南將戰帝以休格馬介獨黄慮為敵所識乃賜𤣥甲白馬易之休格率精騎渡水撃敗之追至莫州横屍滿道靫矢俱罄生獲數將以獻帝悦賜御馬金盂勞之曰爾勇過于名若人人如卿何憂不克師還拜裕悦聖宗即位太后稱制令休格總南靣軍務以便宜從事休格均戍兵立更休法勸農桑修武備邉境大治統和四年宋復來侵其將范密楊繼業出雲州曹彬米信出雄易取岐溝涿州陥固安置屯時北南院奚部兵未知休格力寡不敢出戰夜以輕騎出兩軍間殺其單弱以脅餘衆晝則以精鋭張其勢使彼勞於防禦以疲其力又設伏林莽絶其糧道曹彬等以糧運不繼退保白溝月餘復至休格以輕兵薄之伺彼蓐食擊其離伍單出者且戰且却由是南軍自救不暇結方陣塹地兩邉而行軍渴乏井漉淖而飲凡四日始達于涿聞太后軍至彬等冒雨而遁太后益以鋭卒追及之彼力窮環粮車自衛休格圍之至夜彬信以數騎亡去餘衆悉潰追至易州東聞宋師尚有數萬瀕沙河而㸑促兵徃擊之宋師望塵奔竄墮岸相蹂死者過半沙河為之不流太后旋斾休格收宋屍為京觀封宋國王又上言可乘宋弱畧地至河為界書奏不納及太后南征休格為先鋒敗宋兵於望都時宋將劉廷譲以數萬騎並海而出約與李敬源合兵聲言取燕休格聞之先以兵扼其要地㑹太后軍至接戰殺敬源廷讓走瀛州七年宋遣劉廷讓等乗暑潦來攻易州諸將憚之獨休格率鋭卒逆擊于沙河之北殺傷數萬獲輜重不可計獻于朝太后嘉其功詔免拜不名自是宋不敢北向時宋人欲止兒啼乃曰裕悦至矣休格以燕民疲弊省賦役恤孤寡戒戍兵無犯宋境雖馬牛逸于北者悉還之逺近向化邉鄙以安十六年薨是夕雨木冰聖宗詔立祠南京休格智畧宏逺料敵如神毎戰勝讓功諸將故士卒樂為之用身更百戰未嘗殺一無辜二子果巴官至節度使果實終裕悦孫瑪格瑪格字額特埒興宗時以散職入見上問卿奉佛乎對曰臣毎旦誦太祖太宗及先臣遺訓未暇奉佛帝悦清寧中遷唐古部節度使咸雍中累遷匡義軍節度使太康初致仕卒耶律色珍字韓隱裕悦赫嚕之孫性明敏不事生産保寧元年樞密使蕭思溫薦色珍有經國才上曰朕知之第佚蕩豈可羈屈對曰外雖佚蕩中未可量乃召問以時政占對剴切帝器重之妻以皇后之姪命節制西南靣諸軍仍援河東改南院大王乾亨初宋再攻河東從耶律沙至白馬嶺遇敵沙等戰不利色珍赴之令麾下萬矢齊發敵氣褫而退是年秋宋下河東乗勝襲燕北院大王耶律希達與蕭托果逆戰敗績退屯清河北色珍取希達等青幟軍于得勝口以誘敵敵果爭赴色珍出其後奮擊敗之及高梁之戰與耶律休格分左右翼夾擊大敗宋軍統和初皇太后稱制益見委任為北院樞密使㑹宋將曹彬米信出雄易楊繼業出代州太后親帥師救燕以色珍為山西路兵馬都統繼業䧟山西諸郡各以兵守自屯代州色珍至定安遇賀令圖軍擊破之追至五䑓斬首數萬級明日至蔚州敵不敢出色珍書帛射城上諭以招慰意隂聞宋軍來救令都監耶律托色夜伏兵險阨俟敵至而發城守者見救至突出色珍擊其背二軍俱潰追至飛狐斬首一萬餘級遂取蔚州賀令圖潘美復以兵來色珍逆于飛狐擊敗之宋軍在渾源應州者皆棄城走色珍聞繼業出兵令蕭達林伏兵于路明旦繼業兵至色珍擁衆為戰勢繼業麾幟而前色珍佯退伏兵發色珍進攻繼業敗走至狼牙村衆軍皆潰繼業為流矢所中被擒色珍責曰汝與我國角勝三十餘年今日何靣目相見繼業但稱死罪而已初繼業在宋以驍勇聞人號楊無敵首建梗邉之策至狼牙村心惡之欲避不可得既擒三日死色珍歸闕以功加守太保從太后南伐卒于軍太后親為哀臨仍給葬具庶子果勒官至小將軍耶律希達孟父楚國王之後便弓馬勇於攻戰景宗時多任以軍事統和四年為右皮室詳衮時宋將楊繼業䧟山西郡縣希達從樞密使色珍討之凡戰必以身先矢無虚發繼業敗于朔州之南匿深林中希達望袍影而射繼業墮馬先是軍令須生擒繼業希達以故不能為功後太后南伐屢有戰績以病卒耶律學古字伊實揚裕悦斡之庶孫頴悟好學工譯鞮及詩保寧中補御盞郎君乾亨元年宋既下河東乗勝侵燕學古受詔往援始至京宋敗耶律希達蕭托果等勢益張圍城三周穴地而進城中民懐二心學古以計安反側隨宜備禦晝夜不少懈適有敵三百餘人夜登城學古戰却之㑹援軍至圍遂解學古開門列陣四靣鳴皷居民大呼聲震天地旋有高梁之捷以功遥授保静軍節度使為南京馬歩軍都指揮使二年伐宋乞將漢軍從之改彰國軍節度使時南境未静民思休息學古禁寇掠以安之㑹宋將潘美率兵分道來侵學古以軍少虚張旗幟雜丁黄為疑兵是夜適獨虎峪舉烽火遣人偵視見敵俘掠村野擊之悉獲所掠物擒其將領自是學古與潘美各守邉約無相侵軼民獲安業以功為特哩衮卒弟額布勒額布勒字留隱嚴重有膂力善屬文統和中伐宋屢任以軍事嘗與揚珠不相能因曰爾奴才何所知揚珠訟于北院樞密使韓徳讓徳讓怒問曰爾安得此奴耶額布勒對曰三父異籍時亦易得徳讓笑而釋之後從蕭恒徳伐博囉滿達勒以功為東路統軍都監及徳讓為大丞相薦其材可任統軍使太后曰額布勒嘗不遜於卿何善而薦徳讓奏曰臣黍相位於臣猶不屈况於其餘以此知可用若任使之必能鎮撫諸番太后從之加金紫崇禄大夫檢校太尉而弟果囉以罪亡額布勒及其母俱下吏恐祸及母隂使人召果囉紿曰太后知事之誣汝第來勿畏果囉至送有司坐誅其後退歸田里以疾卒論曰宋乗下太原之鋭以師圍燕繼遣曹彬楊繼業等分道來伐是兩役也遼亦岌岌乎殆哉休格奮撃于高梁敵兵奔潰色珍擒繼業于朔州旋復故地宋自是不復深入社稷固而邉境寧雖配古名將無愧矣然非學古之在南京安其反側則二将之功盖亦難致故曰國以人重信哉遼史卷八十三遼史卷八十三考證耶律休格傳休格二子按聖宗本紀統和二十一年休格子道士努以謀反誅是休格不止二子也耶律色珍傳楊繼業被擒太息死罪而已按契丹國志稱繼業被擒太息曰主上遇我厚何靣目求活於此不食三日死麾下百餘人皆感泣不肯去遂俱死無生還者聖宗紀所載畧同則此傳但稱死罪之語似未足信至業之稱繼業以業在北漢時原賜姓劉名繼業也遼史卷八十三考證
