  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_095-1a, image: WYG0289/WYG0289-0658a.png}
body:
  text: 遼史卷九十五元中書右丞相總裁托克托等修列傳第二十五耶律鴻觀耶律瑪魯蕭迪里耶律達魯耶律辰嘉努耶律特黙耶律仙童蕭素颯耶律大悲努耶律鴻觀字和爾沁樞密使華格之弟統和間累遷順義軍節度使入為北面林牙太平元年加同政事門下平章事為彰國軍節度使兼山北道兵馬都部署徙武定軍節度使拜特哩衮六年討準布有功聖宗嘗刺臂血與鴻觀盟為友禮遇尤異拜南府宰相改上京留守重熙六年遷南院大王御製誥辭以寵之十三年加裕悦帝憫其勞復授武定軍節度使卒訃聞上哭曰惜哉善人喪至親臨奠焉耶律瑪魯字揚隐孟父楚國王之後性寛和善諧謔親朋㑹遇一坐盡傾恬于榮利與耶律鴻觀為刺血友鴻觀為特哩衮補宿直官重熙初遷旗鼔伊喇詳衮為人畏慎容物或有面相陵折者恬然若弗聞不臧否世務以故上益親狎三年遷崇徳宫使為特哩衮御製誥辭褒之拜北院宣徽使寵遇過宰輔帝常以兄呼之改遼興軍節度使卒年七十子努克特終南京宣徽使蕭迪里字國寜約尼森濟汗宫人重熙初遙攝鎮國軍節度使六年奉詔使宋傷足而跛不告遂行帝怒及還決以大杖降同簽南京留守事遙授静江軍節度使歴羣牧都林牙累遷右伊勒希巴以才幹見任使㑹車駕西征元昊乞降帝以前後反覆遣迪里徃覘誠否因為元昊陳述禍福聽命乃還拜北院樞密副使出為中京留守十九年改西京留守卒耶律逹魯字薩蘭清寜初為本班郎中稍遷宿直官乾統中從伐準布有功加奉宸歴䕶衛太保改𢎞義宫副使時上京梟賊趙鍾格跋扈自肆逹魯擒之加泰州觀察使為逹嚕噶部節度使天慶中知興中府加金吾衛上將軍為盜所殺耶律辰嘉努字綿辛懿祖弟噶拉之八世孫重熙中補牌印郎君坐直日不至降本班㑹帝獵辰嘉努逐鹿圍内鞭之二百時耶律仁先薦辰嘉努徤捷比海東青鶻授御盞郎君歴鷹坊尚廐四方館副使改圖嚕庫皮室詳衮㑹太后生辰進詩獻馴鹿太后嘉奬賜珠二琲雜綵二百叚兄薩巴卒辰嘉努聞訃不告而去帝怒鞭之清寜初累遷右伊勒希巴適帝與燕國王射鹿俱中王時九歲帝悦辰嘉努應制進詩帝喜解衣以賜後皇太子廢帝疑辰嘉努黨附罷之時西北諸部宼邊以辰嘉努為烏爾古節度使行軍都監賜甲一屬馬二匹討諸部擒其酋送于朝偵候者見馬蹤意宼至辰嘉努遣報元帥耶律愛努視之曰此野馬也將出獵賊至愛努戰歿有司詰案辰嘉努不伏詔釋之由是感激每事竭力後諸部復來侵辰嘉努率兵三徃皆克邉境遂寜以老告歸不從道宗崩為山陵使致仕年八十卒耶律特黙季父房之後重熙間為北尅累遷六部圖哩太尉大安四年為倒塌嶺節度使頃之為禁軍都監是冬討磨古斯斬首二千餘級十年復討之既捷授南院宣徽使壽隆元年為北院大王四年知黄龍府事薨耶律仙童仲父房之後重熙初為宿直官累遷特哩衮都監以寛厚稱富珠哩叛仙童為五國節度使率師討之擒其帥托多羅又擊威叛降其衆改彰國軍節度使拜北院大王清寜二年知黄龍府事遷侍衛親軍馬步軍都指揮歴忠順武定二軍節度使致仕封蔣國公咸雍初徙封許國卒蕭素颯字特黙五院部人重熈間始仕累遷北院承㫖彰愍宫使清寜初歴左皮室詳衮右伊勒希巴咸雍五年博和哩叛素颯降之率其酋長來朝帝嘉其功徙北院林牙改南院副部署卒子穆喇斡字和琳補伊勒希巴郎君遷文班太保太康中改南京統軍使為右伊勒希巴與樞密使耶律阿蘇論事不合見忌出為馬羣太保北部來侵穆喇斡破之遷同知烏爾古徳哷勒統軍仍許便宜行事後以䜛毁降領西北路戍軍復為馬羣太保卒耶律大悲努字糾堅王子班尼魯古之後太康中歴永興建昌宫使右皮室詳衮㑹準布叛奉詔招降之壽隆初拜殿前都㸃檢乾統初歴上京留守特哩衮復為都㸃檢改西南面招討使請老不許天慶中留守上京領北南樞密院㸃檢中丞諸司等事以彰國軍節度使致仕卒大悲努舉止馴雅好禮儀為時人所稱論曰遼自神冊而降席富彊之勢内修法度外事征伐一時將帥震揚威靈風行電埽討西夏征党項破準布平徳哷勒諸部震懾聞鼙鼓而膽落股弁可謂雄武之國矣其戰勝攻取必有竒謀秘計神變莫測者將前史所載不足以發之邪抑天之所授衆莫與争而能然耶雖然兵者凶器可戢而不可玩争者末節可遏而不可召此黄石公所謂柔能制剛弱能制彊也又況乎仁者之無敵哉遼之君臣智足守此金人果能乘其敝而躡其後乎是以於耶律鴻觀軰諸將不能無慨然也遼史卷九十五遼史卷九十五考證耶律鴻觀傳十三年加裕悦按興宗本紀重熙十二年八月庚申裕悦耶律鴻觀薨是鴻觀之加裕悦尚在重熙十二年之前也傳作十三年加裕悦與紀互異遼史卷九十五考證
