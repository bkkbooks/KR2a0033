  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_063-1a, image: WYG0289/WYG0289-0472a.png}
body:
  text: 遼史卷六十三元中書右丞相總裁托克托等修表第一世表天開於子地闢於丑人生於寅天地人之初一焉耳矣天動也有恒度地静也有恒形人動静無方居止靡常天主流行地主蓄泄二氣無往而弗達亦惟人之所在而畀付焉庖犧氏䧏炎帝氏黄帝氏子孫衆多王畿之封建有限王政之布􅇴無窮故君四方者多二帝子孫而自服土中者本同出也考之宇又周之書遼本炎帝之後而耶律儼稱遼為軒轅後儼志晩出盍從周書葢炎之裔有曰葛烏莬者世雄朔陲後為冒頓汗所襲保鮮卑山以居號鮮卑氏既而慕容燕破之析其部曰宇文曰庫莫奚曰契丹契丹之名昉見于此隋唐間契丹主號逹呼哩氏武后遣將擊潰其衆達呼哩氏㣲别部長果珍代之果珍㝷滅徳哷勒部長聶哷立達年扎里為蘇爾威汗更號約尼氏唐賜國姓曰李懐秀及懐秀叛唐更封且羅為王而聶哷之後曰努爾蘇者左右懐秀且羅至于齊蘇幾百年國勢復振至努爾蘇之孫曰安巴堅功業勃興號錫里氏是為遼太祖於是錫里氏與達呼哩約尼號為三耶律自後國日益大起唐季涉五代宋二百餘年名隨代遷字傳音轉此其言語文字之相通可考而知者也其所不可知者有若竒善汗和拉汗蘇汗兆古汗皆遼之先而世次不可考矣摭其可知者作遼世表帝統契丹先世漢冒頓汗以兵襲東胡而滅之餘衆保鮮卑山因號鮮卑魏青龍中部長比能稍桀驁為幽州刺史王雄所害散徙横水之南黄龍之北晉鮮卑葛烏菟之後曰普囬普囬有子莫那自陰山南徙始居遼西九世為慕容晃所滅鮮卑衆散為宇文氏或為庫莫奚或為契丹元契丹國在庫莫奚東異族同類東部鮮卑之别支魏也至是始自號契丹為慕容氏所破俱竄松漠之間道武帝登國間大破之遂與庫莫奚分背經數十年稍滋蔓有部落於和龍之北數百里太武帝太平真君以來嵗致名馬獻文時使美佛赫赫辰來獻始班諸國之末錫萬丹部赫特赫部佛佛頁部裕嚕部錫琳部博恰部理部圖嚕部各以名馬文皮來貢得交市于和龍密雲之間太和三年髙句麗與蠕蠕謀取地豆于以分之契丹懼美佛赫烏雲率其部落車三千乘衆萬餘口内附止於白狼水東北天保四年九月契丹犯塞文宣帝親討之至平州齊乃趨長塹司徒潘相樂率精騎五千自東道趨青山安徳王韓軌帥騎四千東斷走路帝親踰山嶺奮擊虜男女十餘萬雜畜數十萬相樂又於青山大破别部所虜生口分置諸州復為突厥所逼又以萬家寄處髙麗境内隋開皇四年率諸美佛赫來謁五年悉衆欵塞髙祖納之聴居故地六年諸部相攻不止又與突厥相侵高祖使使諭解之别部楚布等違髙麗來附置於克實克囊嘉特之北開皇末别部四千餘户違突厥來降髙祖給糧遣還固辭不去部落漸衆遂北徙逐水草當遼西正北二百里依赫辰水而居東西亘五百里南北三百里分為十部兵多者三千少者千餘有征伐酋帥相與議之興兵則調合符契突厥沙布爾汗遣特屯潘垤統之契丹殺特屯大業七年貢方物唐契丹地直京師東北五千里而贏東距髙麗西奚南營州北靺鞨室韋阻冷陘山以自固射獵居處無常其君達呼哩氏有勝兵四萬析八部臣于突厥以為俟斤調發攻戰則諸部畢㑹獵則部得自行與奚不平每鬬不利輒遁保鮮卑山武徳初大帥孫敖曹與靺鞨長都塔濟俱來朝二年入犯平州境六年君長多囉獻名馬豐貂貞觀二年摩歡來降突厥請以梁師都易契丹太宗曰契丹突厥不同類師都唐編户我將擒之不可易降者三年摩歡入朝賜鼓纛由是有常貢帝伐髙麗悉發契丹奚首領從軍還過營州以庫克為左武衛將軍大帥和卓珠奇率衆來歸即其部爲𤣥州以珠奇為刺史隸營州都督府庫克舉部内屬乃置松漠都督府以庫克為都督封無極男賜姓李以徳濟部為峭落州赫伯部為彈汗州都呼部為無逄州芳阿部為羽陵州圖勒彬部為日連州芮奚部為徒河州卓津部為萬丹州富部為匹黎赤山二州俱隸松漠府以舒和卓為刺史庫克死與奚叛行軍總管阿實達樞賓執松漠都督鄂博庫獻于東都庫克二孫曰奎瑪里彈汗州刺史歸順郡王曰盡忠松漠都督敖曹曽孫曰萬榮歸誠州刺史時營州都督趙文翽數侵侮其下盡忠等怨望與萬榮共舉兵殺文翽㨿營州自號為無上汗推萬榮為帥不二旬衆數萬攻崇州執擊討副使許欽寂武后怒詔將軍曹仁師等二十八將擊之更號萬榮曰萬斬盡忠曰盡滅戰西硤石黄獐谷王師敗績進攻平州不克武后益發兵擊契丹萬榮夜襲檀州清邊道副總管張九節拒戰萬榮敗走俄盡忠死突厥摩多襲破其部萬榮收散兵復振别將駱務整何阿小入兾州殺刺史陸寶積掠數千人武后聞盡忠死詔夏官尚書王孝傑等率兵十七萬討萬榮戰東硤石敗績孝傑死之萬榮進屠幽州又詔御史大夫婁師徳等率兵二十萬擊之萬榮乗鋭鼓行而南殘瀛州屬縣神兵總管楊立基率奚兵掩擊大破萬榮執何阿小别將李楷固駱務整降萬榮委軍走立基與奚四面合擊萬榮衆潰東走張九節設三伏待之萬榮窮蹙與家奴輕騎走潞河東憊甚卧林下奴斬其首以獻九節傳東都契丹餘衆不能立遂附突厥開元二年盡忠從父弟舍琿率部落歸唐舍琿𤣥宗賜丹書鐵劵開元四年與奚長李大酺偕來詔復置松漠府以舍琿為都督封松漠郡王仍置静析軍以舍琿為經略大使八部長皆為刺史五年以楊氏為永樂公主下嫁舍琿六年卒繅固舍琿之弟帝以繅古襲爵開元七年十一月繅古與公主來朝衙官格圖肯勇悍得衆心繅古欲除之事泄格圖肯攻之繅固奔營州都督許欽澹及奚君李大酺攻格圖肯不勝繅古大酺皆死裕允繅古從父弟也格圖肯推以為主遣使謝罪𤣥宗册立襲繅古位開元十年裕允入朝以慕容氏為燕郡公主下嫁裕允卒托允裕允之弟襲官爵開元十三年托允復與格圖肯猜阻與公主來奔封遼陽王實古托允之弟國人共立之開元十三年冬朝于行在從封禪泰山改封廣化郡王以陳氏為東光公主下嫁實古十八年為格圖肯所弑以其衆降突厥東光公主走平盧庫哩不知其世系格圖肯立之開元二十二年六月幽州節度使張守珪大破格圖肯十二月又破之斬庫哩及格圖肯等傳首東都餘衆散走山谷果珍本契丹部長為松漠府衙官斬格圖肯及庫哩歸唐幽州節度使張守珪立之封北平郡王是年格圖肯餘黨聶哷弑果珍屠其家一子琳沁走安東拜左驍衛將軍自此契丹中衰達呼哩氏附庸于奚王以通于唐朝貢嵗至至徳寶應間再至大厯十二年貞元九年十年十一年三至元和中七至太和開成間四至聶哷耶律儼盖遼太袓之始祖也李懐秀唐賜姓名契丹名達年札里本八部大帥天寶四年降唐拜松漠都督安禄山表請討契丹懐秀發兵十萬與禄山戰潢水南禄山大敗自是與禄山兵連不解耶律儼紀云太祖四代祖努爾蘇為徳哷勒部額爾竒木遣將珠勒格科里大敗安禄山于潢水適當懐秀之世則懐秀固約尼氏之首君為蘇爾威汗明矣且羅以唐封恭仁王代松漠都督遂稱契丹王其後寖大貞元四年犯北邊幽州以聞自禄山反河北割㨿道隔不通世次不可悉考契丹王齊蘇武宗㑹昌二年授雲麾將軍幽州節度使是為伊蘭汗張仲武奏云契丹書用囬鶻印乞賜聖造詔以奉國契丹為文契丹王實哷是為巴拉汗咸通中再遣使來貢獻部落寖強契丹王欽徳實埒之族也是為哈陶津汗光啟中鈔掠奚室韋諸部落皆役服之數與劉仁恭相攻晩年政衰八部大人法常三嵗代徳哷勒部耶律安巴堅建鼓旗自為一部不受代自號為王盡有契丹國約尼氏遂亡蕭罕嘉努言先世約尼汗温之後國祚中絶自額爾奇木聶哷立蘇爾威汗大位始定今以唐史遼史參考達呼哩氏絶于實古聶哷所立則懐秀也其間唯庫哩果珍二世庫哩乃格圖肯所立果珍以别部長為聶哷所殺唐史稱聶哷為格圖肯餘黨則温汗者始為庫哩耶遼史卷六十三
