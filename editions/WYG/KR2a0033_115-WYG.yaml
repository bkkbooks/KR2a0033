body:
  text: 遼史卷一百十五元中書右丞相總裁托克托等修二國外紀第四十五高麗高麗自有國以來傳次久近人民土田歴代各有其志然高麗與遼相為始終二百餘年自太祖皇帝神冊間高麗遣使進寶劍天贊三年來貢太宗天顯二年來貢㑹同二年受晉上尊號冊遣使徃報聖宗統和三年秋七月詔諸道各完戎器以備東征高麗八月以遼澤沮洳罷師十年以東京留守蕭恒德伐高麗十一年王治遣朴良柔奉表請罪詔取女直國鴨緑江東數百里地賜之十二年入貢三月王治遣使請所俘生口詔贖還之仍遣使撫諭十二月王治進妓樂詔却之十三年治遣李周楨來貢又進鷹十月遣李知白來貢十一月遣使冊治為王遣童子十人來學本國語十四年王治表乞為婚姻許以東京留守駙馬蕭恒德女下嫁之六月遣使來問起居自是至者無時十五年韓彦敬來納聘幣駙馬蕭恒徳妻越國公主薨十一月治薨其姪誦遣王同頴來告十二月遣使致祭詔其姪記權知國事十六年遣使冊誦為王二十年誦遣使賀伐宋之㨗七月來貢本國地里圖二十二年以南伐事詔諭之二十三年高麗聞與宋和遣使來貢二十六年進龍鬚草席及賀中京城二十七年承天皇太后崩遣使報以國哀二十八年誦遣魏守愚等來祭三月使來㑹葬五月高麗西京留守康肇弑其主誦擅立誦從兄詢八月聖宗自將伐高麗報宋遣引進使韓杞宣問詢詢奉表乞罷師不許十二月大軍渡鴨緑江康肇拒戰于銅州敗之肇復出右皮室詳衮耶律達魯擒肇等追奔數十里獲所棄糧餉鎧仗銅霍貴寧等州皆降詢上表請朝許之禁軍士俘掠以政事舍人馬保祐為開京留守安州團練使旺布為副留守太子太師伊林將騎兵一千送保祐等赴京守將卓思正殺我使者韓喜孫等十人領兵出拒保祐等復還伊林領兵擊之思正遂奔西京圍之五日不克駐蹕于城西佛寺高麗禮部郎中勃海托實來降遣巴雅爾博諾攻開京遇敵于京西敗之詢棄城走遂焚開京至清江而還二十九年正月班師所降諸城復叛至貴徳州南峻嶺谷大雨連日霽乃得渡馬駞疲乏甲㐲多遺棄次鴨緑江以所俘人分置諸陵廟分賜内戚大臣開泰元年詢遣蔡忠順來乞稱臣如舊詔詢親朝八月遣田拱之奉表稱病不能朝詔復取六州之地二年耶律資忠使高麗取地未幾還三年資忠復使如前索地五月詔國舅詳衮蕭迪里東京留守耶律托實等造浮梁于鴨緑江城保宣義定逺等州四年命北府宰相劉慎行為都統樞宻使耶律世良為副殿前都㸃檢蕭實喇為都監慎行挈家邊上致緩師期追還之以世良實喇總兵伐高麗五年世良等與高麗戰于郭州西破之六年樞宻使蕭和卓為都統漢人行宫都部署王繼忠為副殿前都㸃檢蕭實喇為都監進爵蕭和卓攻興化軍不克師還七年詔東平郡王蕭巴雅爾為都統蕭實喇為副統東京留守耶律巴格為都監復伐高麗十二月蕭巴雅爾與戰于茶陁二河之間我軍不利天雲右皮室二軍沒溺者衆天雲軍詳衮哈里約尼帳詳衮阿克達客省使卓庫渤海詳衮高清明等皆陣亡八年詔數巴雅爾討高麗罪釋之賞將校功益封戰沒將校妻録其子弟以南皮室有功賜衣服銀絹有差出金帛賜約囉尼格二奚軍八月遣郎君赫伯舍等率諸部軍㑹大軍同討高麗詢遣使來乞貢方物九年資忠還以詢降表進釋詢罪太平元年詢薨遣使來報嗣位即遣使冊王欽為王九年賜欽物十一年聖宗崩遣使告哀七月使來慰奠興宗重熙七年來貢十二年三月以加上尊號來賀十三年遣使來貢三十四年三月又來貢十五年入貢八月王欽薨遣使來貢十六年來貢明年又來貢十九年復貢六月遣使來賀伐夏之㨗二十二年入貢二十三年四月王徽請官其子詔加檢校太尉興宗崩道宗即位清寧元年八月遣使報國哀以先帝遺物賜之十一月使來㑹葬二年三年來貢四年春遣使報太皇太后哀五月使來㑹葬咸雍七年八年來貢十二月以佛經一藏賜徽九年十年來貢太康二年三月皇太后崩遣使告哀六月使來弔祭四年王徽乞賜鴨緑江以東地不許九年八月王徽薨以徽子三韓國公勲權知國事十二月勲薨大安元年冊勲子運為國王二年遣使來謝封冊三年來貢四年三月免嵗貢五年六年連貢九年賜王運羊十月運薨子昱遣使來告即賻贈壽隆元年來貢十一月王昱病命其子顒權知國事二月來貢三年三月王昱薨五年王顒乞封冊六年封顒為三韓國公七年道宗崩天祚即位改為乾統元年報道宗哀使來慰奠十二月遣使來賀五年三韓國公顒薨子俁遣使來告八年封俁為三韓國公贈其父顒為國王十二月遣使來謝九年來貢天慶二年王俁母薨來告遣使致祭起復三年遣使來謝致祭又來謝起復十年乞兵于高麗以禦金而金人責之至是遼國亡矣西夏西夏本魏拓䟦氏後其地則赫連國也逺祖思恭唐季受賜姓曰李涉五代至宋世有其地至李繼遷始大據夏銀綏宥靜五州縁境七鎮其東西二十五驛南北十餘驛子徳明曉佛書通法律嘗觀太一金鑑訣野戰歌製畨書十二卷又製字若符篆其俗衣白窄衫氊冠冠後埀紅結綬自號威明設官分文武其冠用金縷貼間起雲銀紙帖緋衣金塗銀帶佩蹀躞解錐短刀弓矢穿靴秃髪耳重環紫旋襴六襲出入乘馬張青蓋以二旗前引從者百餘騎民庶衣青緑革樂之五音為一音裁禮之九拜為三拜凡出兵先卜有四一灸博焦以芆灼羊髀骨二擗算擗竹于地以求數若揲蓍然三呪羊其夜牽羊焚香禱之又焚榖火于野次晨屠羊腸胃通則吉羊心有血則敗四矢擊絃聴其聲知勝負及敵至之期病者不用醫藥召巫者送鬼西夏語以巫為斯也或遷他室謂之閃病喜報仇有喪則不伐人負甲葉於背識之仇解用鷄猪犬血和酒貯於髑髏中飲之乃誓曰若復報仇榖麥不收男女秃癩六畜死蛇入帳有力小不能復仇者集壯婦享以牛羊酒食趨讎家縱火焚其廬舍俗曰敵女兵不祥輒避去訴于官官擇舌辨氣直之人為和斷官聴其屈直殺人者納命價錢百二十千土産大麥蓽豆青稞􅔋子古子蔓鹹地蓬實蓯蓉苖小蕪荑席雞草子地黄葉登廂草沙葱野韭拒灰蓧白蒿鹹地松實民年十五為丁有二丁者取一為正軍負擔雜使一人為抄四丁為兩抄餘人得射它丁皆習戰正軍馬駞各一每家自置一帳團練使以上帳弓各一箭五百馬一槖駞一旗鼓五槍劍棍梧粆袋雨氊渾脱鍬钁箭牌鐵笟篱各一刺史以下人各一駞箭三百毛幕一餘兵三人共一幕有礟手二百人號伯竒勇健者號撞令郎齎糧不過一旬晝則舉煙揚塵夜則煹火為候若獲人馬射之號曰殺鬼招魂或射草縛人出軍用單日避晦日多立虛寨設伏兵衣重甲乘善馬以鐵騎為前鋒用鈎索絞聯雖死馬上不落其民俗勇悍衣冠騎乘土産品物子姓傳國亦畧知其大概耳初西夏臣宋有年賜姓曰趙迨遼聖宗統和四年繼遷叛宋始來附遼授特進檢校太師都督夏州諸軍事遂復姓李十月遣使來貢六年入貢七年來貢以王子帳耶律襄之女封義成公主下嫁繼遷八年正月來謝三月又來貢九月繼遷遣使獻宋俘十月以敗宋軍來告十二月下宋麟鄜等州來告遣使封繼遷為夏國王九年二月遣使告伐宋之捷四月遣李知白來謝封册七月復銀綏二州來告十月繼遷以宋所授敇命遣使來上是月定難軍節度使李繼捧來附授開府儀同三司檢校太師兼侍中封西平王仍賜推忠效順啟聖定難功臣十二月繼遷潛附于宋遣韓徳威持詔諭之十年二月韓徳威還奏繼遷託故不出至靈州俘掠以還西夏遣使來奏徳威俘掠賜詔撫諭十月來貢十二年入貢十三年敗宋師遣使來告十四年又來貢十五年三月以破宋兵來告封繼遷為西平王六月遣使來謝封冊十六年來貢十八年授繼遷子德明朔方軍節度使十九年遣李文冀來貢六月奏下宋恒環慶三州賜詔褒美二十年遣使來進馬駝六月遣劉仁朂來告下靈州二十一年繼遷薨其子徳昭遣使來告六月贈繼遷尚書令遣西上閤門使丁振弔慰八月德昭遣使來謝弔贈二十二年三月德昭遣使上繼遷遺留物七月封德昭為西平王十月遣使來謝封冊二十三年下宋青城來告二十五年德昭母薨遣使弔祭起復二十七年承天皇太后崩遣使報哀于夏二十八年遣使冊徳昭為夏國王開泰元年德昭遣使進良馬二年遣引進使李延𢎞賜夏國王李德昭及義成公主車馬太平元年來貢十一年聖宗崩報哀于夏德昭遣使來進賻幣興宗即位以興平公主下嫁李元昊以元昊為駙馬都尉重熙元年夏國遣使來賀李德昭薨冊其子夏國公元昊為王二年來貢十二月禁夏國使㳂路私市金鐵七年來貢李元昊與興平公主不諧公主薨遣北院承㫖耶律庶成持詔問之九年宋遣郭禎以伐夏來報十年夏國獻所俘宋將及生口十一年遣使問宋興師伐夏之由十二月禁托歡鬻馬于夏㳂邊築障塞以防之十二年正月遣樞宻都承旨王惟吉諭夏國與宋和二月元昊以加上尊號遣使來賀耶律迪里等使夏國還奏元昊罷兵遣使報宋四月夏國遣使進馬駞七月元昊上表請伐宋不從十月夏人侵党項遣延昌宫使高嘉努譲之十三年四月党項及山西部節度使庫哩以五部叛入西夏詔徴諸道兵討之六月準布子烏巴執元昊八月夏使對不以情覊之使復來詢事宜不實對笞之十月元昊上表請罪欲收集叛黨以獻從之進方物命北院樞宻副使蕭格迓之元昊率党項三部來降詰其納叛背盟元昊伏罪初夏人執蕭呼都克至是請以被執者來歸詔所留夏使亦還國十二月呼都克來歸又遣使來貢十七年元昊薨其子諒祚遣使來告上其父遺留物圖伯特國乞以本部軍助攻夏國不許十八年復議伐夏留其賀正使不遣遣北院樞宻副使蕭惟信以伐夏告宋六月夏國遣使來貢留之七月親征八月渡河夏人遁九月蕭惠為夏人所敗十月招討使耶律特里衮率準布軍至賀蘭山獲元昊妻及官屬遇其軍三千來拒殪之詳衮蕭慈實努南剋耶律斡里歿于陣十九年正月遣使問罪于夏夏將旺布等攻金肅城耶律高嘉努等破之旺布被創遁殺威赫伊特凌結三月殿前都㸃檢蕭塔喇台與夏軍戰于三角川敗之招討使蕭博諾北院大王宜新等帥師伐夏都部署布古徳為監戰五月蕭博諾等入夏境不遇敵縱軍俘掠而還夏國旺布來降十月李諒祚母遣使乞依舊稱臣十二月諒祚上表如母訓二十年二月遣使索党項叛戸五月蕭約噶使夏回進諒祚母表乞代党項權進馬駝牛羊等物又求唐隆鎮仍乞罷所建城邑以詔答之六月獲元昊妻及俘到夏人置于蘓州二十一年十月諒祚遣使乞弛邊備遣約噶賫詔諭之二十二年七月諒祚進降表遣林牙高嘉努賫詔撫諭二十三年正月貢方物五月乞進馬駝詔嵗貢之七月諒祚遣使求婚十月進誓表興宗崩遣使報哀于夏二十四年道宗即位清寧元年遣使來貢九月以先帝遺物賜夏四年四月遣使㑹葬九年正月禁民鬻銅于夏咸雍元年五月來貢三年十一月遣使進回鶻僧金佛梵覺經十二月諒祚薨四年二月諒祚子秉常遣報哀即遣使弔祭秉常上其父遺物十月冊秉常為夏國王十二月來貢五年七月遣使來謝封冊十一月秉常乞賜印綬九年遣使來貢太康二年正月仁懿皇后崩遣使報哀于夏以皇太后遺物賜之遣使來弔祭五年來貢八年二月遣使以所獲宋將張天益來獻大安元年十月秉常遣使報其母哀二年十月秉常薨遣使詔其子乾順知國事十二月李乾順遣使上其父秉常遺物四年七月冊乾順為夏國王五年六月遣使來謝封冊八年六月夏為宋所侵遣使乞援壽隆三年六月以宋人置壁壘于要地遣使來告四年六月求援十一月遣樞宻直學士耶律儼使宋諷與夏和夏復遣使求援五年正月乾順伐布木喇實等部十一月夏以宋人罷兵遣使來謝六年十一月遣使請尚公主七年道宗崩遣使告哀于夏遣使來慰奠天祚即位乾統元年夏遣使來賀二年復請尚公主又以為宋所侵遣李造福田若水來求援三年復遣使請尚公主十月使復來求援四年五年李造福等至乞援以族女南仙封成安公主下嫁乾順六年正月遣牛温舒使宋令歸所侵夏地六月遣李造福來謝八年乾順以成安公主生子遣使來告九年以宋不歸地來告十年遣李造福等來貢天慶三年六月來貢保大二年天祚播遷乾順率兵來援為金師所敗三年乾順請臨其國六月遣使冊乾順為夏國皇帝而天祚被執歸金矣論曰高麗西夏之事遼雖嘗請昬下嫁烏足以得其固志哉三韓接壤反復易知凉州負逺納叛侵疆乗隟輒動貢使方往事釁随生興師問罪屢煩親征取勝固多敗亦貽悔昔吴趙咨對魏之言也大國有征伐之兵小國有備禦之固豈其然乎先王柔逺以徳而不以力尚矣遼王求援二國雖能出師豈金敵哉遼史卷一百十五遼史卷一百十五考證高麗傳自太祖皇帝神冊間高麗遣使進寶劍按遼太祖本紀高麗進寶劍在九年是時尚未建元九年之明年始稱神冊元年此似紀年之誤聖宗統和十二年入貢原文訛十三年今據聖宗本紀改開泰四年命北府宰相劉慎行為都統劉慎行按聖宗紀作劉晟咸雍七年原文無咸雍二字按道宋本紀清寧間俱不紀高麗入貢至咸雍七年始來貢八年又入貢賜以佛經一藏據此則為咸雍無疑也太康九年八月王徽薨按宋史及通考王徽卒子勲嗣百日卒弟運嗣四年卒子堯嗣未幾卒世叔父熙嗣避遼諱改名顒顒卒子俁嗣是王運非勲子運子昱又名堯顒非昱子顒初名熙也紀内所載多與二書不合西夏傳每家自置一帳團練使以上帳弓各一箭五百馬一原文每家自置一家於義無解據宋史一家號一帳則下家字為帳字之誤又原文張弓矢各一馬五百匹按宋史張作帳箭五百馬一今並據宋史改正統和九年遣知白來謝封冊李知白按聖宗本紀作杜白又高麗紀統和十三年遣李知白來貢二國使臣同名而此處又與夲紀互異定難軍節度使李繼捧來附按繼捧未嘗附契丹蓋繼遷之誤繼遷子徳明按宋史夏國傳繼遷子徳明未嘗改名德昭遼史前稱繼遷子德明後連云德昭應係傳寫之訛重熙十三年六月準布子烏巴執元昊按興宗紀李元昊來援叛黨準布長烏巴執元昊遣使來援斡里噶拉來與傳云執昊互異招討使耶律迪魯固按興宗紀作敵魯古此又作敵古今畫一改遼史卷一百十五考證
