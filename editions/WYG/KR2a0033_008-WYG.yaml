body:
  text: 遼史巻八元中書右丞相總裁托克托等修本紀第八景宗一景宗孝成康靖皇帝諱賢字賢寧小字明扆世宗皇帝第二子母曰懷節皇后蕭氏察克之亂帝甫四歳穆宗即位養永興宫既長穆宗酗酒怠政帝一日與韓匡嗣語及時事耶律賢適止之帝悟不復言應厯十九年二月戊辰入見穆宗曰吾兒已成人可付以政己巳穆宗遇弑帝率飛龍使尼哩侍中蕭思温南院樞密使髙勲率甲騎千人馳赴黎明至行在哭之慟羣臣勸進遂即皇帝位於柩前百官上尊號曰天贊皇帝大赦改元保寧以殿前都㸃檢伊勒哈右皮室詳衮蕭烏埒濟宿衛不嚴斬之三月丙戌入上京以蕭思温為北院樞密使太平王雅斯哈亡入沙陀己丑伊勒希巴諾木歡以隂附雅斯哈伏誅癸巳雅斯哈入朝甲午以北院樞密使蕭思温兼北府宰相己亥南院樞密使髙勲封秦王夏四月戊申朔進封太平王雅斯哈為齊王改封趙王喜隠為宋王封隆先為平王舒為呉王道隠為蜀王必舒為越王迪里為冀王完為衛王五月戊寅立貴妃蕭氏為皇后丙申朔射栁祈雨有司請以帝生日為天清節從之壬寅漢遣李匡弼劉繼文李元素來賀冬十月東幸褭潭十一月甲辰朔行柴冊禮祠木葉山駐蹕鶴谷乙巳蕭思温封魏王北院大王烏哲加裕悦二年春正月丁未如潢河夏四月幸東京致奠于讓國皇帝及世宗廟五月癸丑西幸乙夘次盤道嶺盗殺北院樞密使蕭思温六月還上京秋七月以右皮室詳衮賢適為北院樞密使九月辛丑得國舅蕭哈濟及哈里殺蕭思温狀皆伏誅流其弟紳圖于黄龍府十二月庚午漢遣使來貢三年春正月甲寅右伊勒希巴希逹遣人獻徳哷勒俘詔賜有功將士庚申置登聞鼓院辛酉南京統軍使韓匡美封鄴王二月癸酉東幸壬午遣多和使爾斯蘭回鶻己丑以青牛白馬祭天地三月丁未以飛龍使尼哩為契丹行宫都部署夏四月丁夘世宗妃卓琳及普格厭魅賜死己夘祠木葉山行再生禮丙戌至自東幸戊子蕭紳圖伏誅六月丙子漢遣使問起居自是繼月而至丁丑回鶻遣使來貢秋七月辛丑以北院樞密使賢適為西北路招討使八月甲戌如秋山辛夘祭皇兄吼墓追冊為皇太子諡莊聖九月乙巳賜傳父侍中達里塔太保楚補太保丕勒保母霍實頁頁等户口牛羊有差又以濳邸給使者為塔瑪部置官主之壬子幸歸化州甲寅如南京冬十月己巳以黒白羊祀神癸未漢遣使來貢丙戌布古徳吐谷渾來貢十一月庚子臚朐河裕悦雅克尼爾率户四百五十來附乞𨽻宫籍詔留其户分𨽻敦睦積慶永興三宫優賜遣之十二月癸酉以青牛白馬祭天地己丑皇子隆緒生是冬駐蹕金川四年春二月癸亥漢以皇子生遣使來賀閏月戊申齊王雅斯哈薨三月庚申朔追冊為皇太叔夏四月庚寅朔追封蕭思温為楚國王是夏駐蹕冰井秋七月如雲州丁丑布古徳來貢冬十月丁亥朔如南京十二月甲午詔内外官上封事五年春正月甲子特哩衮休格伐党項破之以俘獲數來上漢遣使來貢庚午御五鳯樓觀燈二月丁亥近侍薩喇勒誤觸神纛法論死杖釋之壬辰越王必舒獻党項俘獲之數戊申以青牛白馬祭天地辛亥幸新城三月乙夘朔復幸新城追封皇后祖瑚穆哩為韓王贈伯瑚嚕古兼政事令寧古齊兼侍中夏四月丙申白氣晝見五月癸亥裕悦烏哲薨輟朝三日辛未女直侵邊殺都監達里塔伊喇鄂囉羅掠邊民牛馬己夘阿爾斯蘭回鶻來貢六月庚寅女直宰相額爾奇木來朝丙申漢遣人以宋事來告秋七月庚辰以保大軍節度使耶律錫爾丹為中臺省左相是月駐蹕燕子城九月壬子布古徳部長阿嚕達蘭來貢冬十月丁酉如南京十一月辛亥朔始獲應厯逆黨近侍霄格華格鍚衮等誅之十二月戊戌漢將改元遣使禀命是月如歸化州六年春正月癸未幸南京三月宋遣使請和以涿州刺史耶律昌珠加侍中與宋議和夏四月宋王喜隠坐謀反廢秋七月丁未朔閤門使卓庫加檢校太尉兼御史大夫男哈里以告喜隠事遥授隴州防禦使庚申獵于平地松林冬十月乙亥朔還上京十二月戊子以沙門昭敏為三京諸道僧尼都總管加兼侍中七年春正月甲戌朔宋遣使來賀壬寅望祠木葉山二月癸亥漢鴈門節度使劉繼文來朝貢方物丙寅以青牛白馬祭天地三月壬午耶律蘇色等獻党項俘分賜羣臣夏四月遣郎君舒蘇使宋己酉祠木葉山辛亥射栁祈雨如頻蹕淀清暑五月丙戌祭神姑秋七月黄龍府衛將雅木丕勒殺都監張琚以叛遣敞史耶律噶勒畢討之九月敗雅木丕勒於治河遣其弟安圗追之雅木丕勒走保烏舍城安圖乃還以餘黨千餘户城通州是秋至自頻蹕淀冬十月釣魚土河八年春正月癸酉宋遣使來聘二月壬寅諭史館學士書皇后言亦稱朕暨予著為定式三月辛未遣五史亷問四方鰥寡孤獨及貧乏失職者賑之夏六月以西南面招討使耶律色珍為北院大王秋七月丙寅朔寧王扎穆妻安扎伏誅扎穆髙勲等除名辛未宋遣使來賀天清節八月癸夘漢遣使言天清節設無遮㑹飯僧祝釐丁未如秋山己酉漢以宋事來告是月女直侵貴徳州東境九月己巳謁懷陵辛未東京統軍使察喇詳衮古奏女直襲歸州五寨剽掠而去乙亥布古徳來貢壬午漢為宋人所侵遣使求援命南府宰相耶律沙冀王迪里赴之戊子漢以宋師壓境遣駙馬都尉盧俊來告冬十月辛丑漢以遼師退宋軍來謝十一月丙子宋主匡𦙍殂其弟炅自立遣使來告辛夘遣郎君旺祿塔瑪訥黙庫等使宋弔慰十二月壬寅遣蕭哲庫馬哲賀宋即位丁未漢以宋軍復至掠其軍儲來告且乞賜糧為助戊午詔南京復禮部貢院是月哈噶斯國遣使來貢遼史巻八遼史巻八考證景宗小字明扆按契丹志作明計以音近而譌也保寧元年斬殿前都㸃檢耶律伊勒哈按伊勒哈原文夷臘葛此又訛夷臘即係一人今併改保寧六年三月宋遣使請和遣耶律昌珠與宋議和按職官分紀開寳七年契丹涿州刺史耶律琮以書遺雄州孫全興願講好於朝廷八年契丹遣克實克舒蘇來聘自是乃通使矣與紀異又遼書昌珠而宋書琮其名亦互異遼史巻八考證
