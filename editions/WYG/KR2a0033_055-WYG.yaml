body:
  text: 遼史卷五十五元中書右丞相總裁托克托等修志第二十四儀衛志一遼太祖奮自朔方太宗繼志述事以成其業於是舉渤海立敬瑭破重貴盡致周秦兩漢隋唐文物之遺餘而居有之路車法物以隆等威金符玉璽以布號令是以傳至九主二百餘年豈獨以兵革之利士馬之强哉文謂之儀武謂之衛足以成一代之規模矣考遼所有輿服符璽儀仗作儀衛志輿服自皇帝而降與服之制其來逺矣禹乘四載作小車商人得桑根之瑞為大輅周人加金玉象飾益備秦取六國儀物而分别其用先王之制置而弗御至漢中葉銳意稽古然禮文之事名存實亡蓋得十一於千百焉唐之車輅因周隋遺法損益可知而祭服皆青朝服皆絳常服用宇文制以紫緋緑碧分品秩五代頗以常服代朝服遼國自太宗入晉之後皇帝與南班漢官用漢服太后與北班契丹臣僚用國服其漢服即五代晉之遺制也考之載籍之可徴者著輿服篇冠諸儀衛之首國輿契丹故俗便於鞍馬隨水草遷徙則有氈車任載有大車婦人乘馬亦有小車貴富者加之華飾禁制疎闊貴適用而已帝后加隆勢固然也輯其可知著于篇大輿柴冊再生儀載神主見之輿臘儀見皇帝皇后升輿降輿總纛車駕以御駞祭山儀見皇太后升總纛車車納后儀見皇后就車青幰車二螭頭蓋部皆飾以銀駕用駞公主下嫁以賜之古者王姬下嫁車服不繫其夫下王后一等此其遺意歟送終車車樓純飾以錦螭頭以銀下縣鐸後垂大氈駕以牛上載羊一謂之祭羊以擬送終之用亦賜公主椅冊皇太后儀皇帝乘椅自便殿轝至西便門鞍馬祭山儀皇帝乘馬侍皇太后行臘儀皇帝降輿祭東畢乘馬入獵圍色克色哩儀俱乘馬東行羣臣在南命婦在北漢輿太宗皇帝㑹同元年晉使馮道劉昫等備車輅法物上皇帝皇太后尊號册禮自此天子車服昉見於遼太平中行漢册禮乘黄令陳車輅尚輦奉御陳輿輦盛唐輦輅盡在遼廷矣五輅周官典輅有五輅秦亡之後漢創製玉輅祀天祭地享宗廟朝賀納后用之青質玉飾黄屋左纛十二鑾在衡二鈴在軾龍輈左建旂十二斿皆畫升龍長曳地駕蒼龍金㚇鏤錫鞶纓十二就遼國勘箭儀皇帝乘玉輅至内門聖宗開泰十年上升玉輅自内三門入萬夀殿進七廟御容酒金輅饗射祀還飲至用之赤質金飾餘如玉輅色從其質駕赤騮象輅行道用之黄質象飾餘如金輅駕黄騮革輅巡狩武事用之白質革鞔駕白翰木輅田獵用之黒質漆飾駕黒駱車制小於輅小事乘之耕根車耕籍用之青質蓋三重餘如玉輅安車一名進賢車臨幸用之金飾重輿曲壁八鑾在衡紫油纁朱裏幰朱絲絡網駕赤騮朱鞶纓四望車一名明逺車拜陵臨弔則用之金飾青油纁朱裏通幰駕牛餘同安車凉車省方及罷獵並用之赤質金塗銀裝五綵龍鳯織藤油壁緋絛蓮座以槖駞輦用人挽本宫中所乘唐髙宗始制七輦周官巾車有輦以人組挽之太平册禮皇帝御輦大鳯輦赤質頂有金鳯壁畫雲氣金翅前有軾下有构欄絡帶皆繡雲鳯銀梯主輦八十人大芳輦仙游輦小輦永壽節儀皇太后乘小輦芳亭輦黒質幕屋緋欄皆繡雲鳯朱緑夾窻花板紅網兩簾四竿銀飾梯主輦百二十人大玉輦小玉輦逍遙輦常用之㯶屋赤質金塗銀裝紅絛輦官十二人春夏緋衫秋冬素錦服平頭輦常行用之制如逍遙無屋册承天皇太后儀皇太后乘平頭輦歩輦聖宗統和三年駐蹕土河乘歩輦聴政羊車古輦車赤質兩壁龜文鳯翅緋幰絡帶門簾皆繡瑞羊畫輪駕以牛隋易果下馬童子十八人服繡瑞羊挽之輿以人肩之天子用韝絡臂綰腰輿前後長竿各二金銀螭頭緋繡鳯襴上施錦褥别設小牀奉輿十六人小輿赤質青頂曲柄緋繡絡帶制如鳯輦而小上有御座奉輿二十四人皇太子車輅金輅從祀享正冬大朝納妃用之册皇太子儀乘黄令陳金輅皇太子升降金輅軺車五日常朝享宫臣出入行道用之金飾紫幰朱裏駕一馬四望車弔臨用之金飾紫油纁通幰駕一馬遼史卷五十五遼史卷五十五考證涼車省方罷獵用之涼車下原文衍赤質二字今刪鞶纓十二就按經文作繁馬腹帶也若左氏傳鞶厲游纓訓解與禮經異後人沿訛用之姑仍舊遼史卷五十五考證
