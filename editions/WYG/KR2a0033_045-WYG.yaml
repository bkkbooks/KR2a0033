body:
  text: 遼史卷四十五元中書右丞相總裁托克托等修志第十五百官志一官生於職職㳂於事而名加之後世㳂名不究其實吏部一太宰也為大司徒為尚書為中書為門下兵部一司馬也為大司馬為太尉為樞密使㳂古官名分今之職事以配之于是先王統理天下之法如治絲而棼名實淆矣契丹舊俗事簡職専官制朴實不以名亂之其興也勃焉太祖神册六年詔正班爵至于太宗兼制中國官分南北以國制治契丹以漢制待漢人國制簡朴漢制則㳂名之風固存也遼官制分北南院北面治宫帳部族屬國之政南面治漢人州縣租賦軍馬之事因俗而治得其宜矣初太祖分徳哷勒額爾奇木為北南二大王謂北南院宰相樞密宣徽林牙下至郎君䕶衛皆分北南其寔所治皆北面之事語遼官制者不可不辨凡遼官北樞密視兵部南樞密視吏部北南二王視户部伊勒希巴視刑部宣徽視工部多囉倫穆騰視禮部北南府宰相總之特哩衮治宗族林牙修文告裕悦坐而論議以象公師朝廷之上事簡職專遼所以興也契丹北樞密院掌兵機武銓羣牧之政凡契丹軍馬皆屬焉以其牙帳居大内帳殿之北故名北院元好問所謂北衙不理民是也北院樞密使知北院樞密使事知樞密院事北院樞密副使知北院樞密副使事同知北院樞密使事簽書北樞密院事北院都承㫖北院副承㫖北院林牙知北院貼黄給事北院知聖㫖頭子事掌北院頭子北樞密院敞史北院郎君北樞密院通事北院椽史北樞密院中丞司北南樞密院點檢中丞司事總知中丞司事北院左中丞北院右中丞同知中丞司事北院侍御契丹南樞密院掌文銓部族丁賦之政凡契丹人民皆屬焉以其牙帳居大内之南故名南院元好問所謂南衙不主兵是也南院樞密使知南院樞密使事知南院樞密事南院樞密副使知南院樞密副使事同知南院樞密事簽書南樞密院事南院都承㫖南院副承㫖南院林牙知南院貼黄給事南院知聖㫖頭子事掌南院頭子南樞密院敞史南院郎君南樞密院通事南院椽史南樞密院中丞司北南樞密院㸃檢中丞司事總知中丞司事南院左中丞南院右中丞同知中丞司事南院侍御北宰相府掌佐理軍國之大政皇族四帳世預其選北府左宰相北府右宰相總知軍國事知國事南宰相府掌佐理軍國之大政國舅五帳世預其選南府左宰相南府右宰相總知軍國事知國事北大王院分掌部族軍民之政北院大王初名徳哷勒部額爾竒木太祖分北南院㑹同元年改額爾奇木為大王知北院大王事北院太師北院太保北院司徒北院司空北院郎君北院都統軍司掌北院從軍之政令北院統軍使北院副統軍使北院統軍都監北院詳衮司掌北院部族軍馬之政令北院詳衮北院都監北院將軍北院小將軍北院都部署司掌北院部族軍民之事北院都部署北院副部署南大王院分掌部族軍民之政南面大王知南院大王事南院太師南院太保天慶八年省南院太保南院司徒南院司空南院郎君南院都統軍司掌南院從軍之政令南院統軍使南院副統軍使南院統軍都監南院詳衮司掌南院部族軍馬之政令南院詳衮南院都監南院將軍南院小將軍南院都部署司掌南院部族軍民之事南院都部署南院副部署宣徽北院太宗㑹同元年置掌北院御前祗應之事北院宣徽使知北院宣徽事北院宣徽副使同知北院宣徽事宣徽南院㑹同元年置掌南院御前祗應之事南院宣徽使知南院宣徽事南院宣徽副使同知南院宣徽事大裕悦府無職掌班百僚之上非有大功徳者不授遼國尊官猶南面之有三公太祖以約尼氏裕悦受禪終遼之世以裕悦得重名者三人耶律赫嚕烏哲仁先謂之三裕悦大裕悦大特哩衮司太祖置掌皇族之政教重熈二十二年耶律義先拜特哩衮戒族人曰國家三父房最為貴族凡天下風化之所自出不孝不義雖小不可為其妻晉國長公主之女每見中表必具禮服義先以身率先國族化之遼國設官之寔于此可見太祖有國首設此官其後百官擇人必先宗姓特哩衮亦曰徳爾吉知特哩衮司事特哩衮司事伊勒希巴院掌刑獄伊勒希巴左伊勒希巴右伊勒希巴知左伊勒希巴事知右伊勒希巴事敞史宗徳掌獄大林牙院掌文翰之事北面都林牙北面林牙承㫖北面林牙左林牙右林牙多囉倫穆騰司掌禮儀多囉倫穆騰總知朝廷禮儀總禮儀事文班司所掌未詳文班太保文班林牙文班牙署文班吏額珍尼郭齊喀所掌未詳約尼故官後併樞密院額珍尼郭齊喀北面御帳官三皇聖人也當淳朴之世重門擊柝猶嚴於待暴客遼之先世未有城郭溝池宫室之固氈車為營硬寨為宫御帳之官不得不謹出於貴戚為侍衛著帳為近侍北南部族為䕶衛武臣為宿衛親軍為禁衛百官番宿為宿直奉宸以司供御三班以肅會朝硬寨以嚴晨夜法制可謂嚴密矣考其凡如左侍衛司掌御帳親衛之事侍衛太師侍衛太保侍衛司徒侍衛司空侍衛近侍局近侍直長近侍近侍實逹爾近侍詳衮司近侍詳衮近侍都監近侍將軍近侍小將軍北䕶衛府掌北院䕶衛之事皇太后宫有左右䕶衛北䕶衛太師北䕶衛太保北䕶衛司徒總領左右䕶衛司總領左右䕶衛左䕶衛司左䕶衛太保左䕶衛右䕶衛司右䕶衛太保右䕶衛南䕶衛府掌南院䕶衛之事南䕶衛太師南䕶衛太保南䕶衛司徒總理左右䕶衛司總理左右䕶衛左䕶衛司左䕶衛太保左䕶衛右䕶衛司右䕶衛太保右䕶衛奉宸司掌供奉宸御之事官名未詳奉宸二班院掌左右寄班之事左班都知右班都知寄班都知三班院祗候宿衛司專掌宿衛之事總宿衛事亦曰典宿衛事總知宿衛事同掌宿衛事宿衛官禁衛局總禁衛事禁衛長宿直司掌輪直官員宿直之事皇太后宫有宿直官宿直詳衮宿直都監宿直將軍宿直小將軍宿直官宿直䕶衛硬寨司掌禁圍槍寨下舖傳鈴之事硬寨太保皇太子特哩衮司掌皇太子宫帳之事皇太子特哩衮北面著帳官古者刑人不在君側叛逆家屬没為著帳執事禁衛可為寒心此遼世所以多變起肘掖與著帳郎君院約尼哈陶津汗以博果濟等三族害裕悦實嚕家屬沒入斡里應天皇太后知國政始析出之以為著帳郎君娘子每加矜恤世宗悉免之其後内族外戚及世官之家罪犯者皆沒入斡里人户益衆因復故名皇太后皇太妃帳皆有著帳諸局著帳郎君節度使著帳郎君司徒祗候郎君班詳衮司祗候郎君班詳衮祗候郎君直長祗候郎君札薩克轄祗候郎君祗候郎君伊喇左祗候郎君班詳衮司左祗候郎君班詳衮左祗候郎君直長左祗候郎君札薩克轄左祗候郎君左祗候郎君伊喇右祗候郎君班詳衮司右祗候郎君班詳衮右祗候郎君直長右祗候郎君札薩克轄右祗候郎君右祗候郎君伊喇筆硯局筆硯祗候郎君筆硯吏牌印局牌印郎君裀褥局裀褥郎君燈燭局燈燭郎君牀幔局牀幔郎君殿幄局殿幄郎君車輿局車輿郎君御盞局御盞郎君本班局本班郎君皇太后祗應司領皇太后諸局事知皇太后宫諸司事皇太妃祗應司皇后祗應司近位祗應司皇太子祗應司親王祗應司著帳户司本諸鄂爾多户析出及諸色人犯罪沒入凡御帳皇太后皇太妃皇后皇太子近位親王祗從伶官皆充其役著帳節度使著帳殿中承應實逹爾局筆硯實逹爾寢殿實逹爾佛殿實逹爾司蔵實逹爾習馬實逹爾鷹坊實逹爾湯藥實逹爾尚飲實逹爾盥潄實逹爾尚膳實逹爾尚衣實逹爾裁造實逹爾北面皇族帳肅祖長子學順之族在五院司叔子噶拉季子洽禮及懿祖仲子塔拉季子尼古察之族皆在六院司此五房者謂之二院皇族𤣥祖伯子瑪魯無後次子葉穆之後曰孟父房叔子寔嚕曰仲父房季子為徳祖徳祖之元子是為太祖天皇帝謂之横帳次曰埒克曰特爾格曰伊徳寔曰安圖曰蘇皆曰季父房此一帳三房謂之四帳皇族二院治之以北南二王四帳治之以大内特哩衮皆統于大特哩衮司大内特哩衮司掌皇族四帳之政教大内特哩衮知大内特哩衮事大内特哩衮都監大横帳詳衮司掌太祖皇帝後九帳皇族之事横帳詳衮横帳太師横帳太保横帳司空横帳郎君横帳知事孟父族帳詳衮司掌蜀國王葉穆房族之事仲父族帳詳衮司掌隋國王實嚕房族之事季父族帳詳衮司掌徳祖皇帝三房族之事四帳都詳衮司掌四帳軍馬之事都詳衮都監將軍本名敞史小將軍横帳詳衮司孟父帳詳衮司仲父帳詳衮司季父帳詳衮司錫里司掌皇族之軍政錫里詳衮錫里都監錫里將軍錫里小將軍錫里美楞親玉國官制未詳王府近侍王府祗候大東丹國中臺省太祖天顯元年置乾亨元年聖宗省左大相右大相左次相右次相王子院掌王子各帳之事王子太師王子太保王子司徒王子司空王子班郎君駙馬都尉府掌公主帳宅之事駙馬都尉北面諸帳官遼太祖有帝王之度者三代約尼氏尊九帳於御營之上一也滅渤海國存其族帳亞於約尼二也併奚王之衆撫其帳部擬於國族三也有英雄之智者三任國舅以耦皇族崇伊實以抗奚王列二院以制約尼是以觀北面諸帳官可以見之矣約尼九帳大詳衮司掌約尼温汗蘇爾威汗和拉汗蘇汗森濟汗兆古汗伊蘭汗巴拉汗哈陶津汗九世宫分之事太祖受位于約尼以九帳居皇族一帳之上設詳衮司以奉之有司不與焉凡遼十二宫五京皆太祖以來征討所得非受之于約尼也其待先世之厚蔑以加矣遼俗東嚮而尚左御帳東嚮約尼九帳南嚮皇族三父帳北嚮東西為經南北為緯故謂御營為横帳云大詳衮約尼太師約尼太保約尼太尉約尼司徒約尼司空約尼侍中一作實珠太宗㑹同元年置敞史知事約尼帳節度使司節度使節度副使約尼糺詳衮司約尼糺詳衮約尼糺都監約尼糺將軍約尼糺小將軍約尼剋官未詳大國舅司掌國舅伊蘇濟勒巴哩二帳之事太祖天顯十年合皇太后二帳為國舅司聖宗開泰三年又併伊蘇濟勒巴哩二司為一帳伊蘇濟勒國舅太翁帳詳衮伊蘇濟勒國舅小翁帳詳衮巴哩國舅大父帳詳衮巴哩國舅少父帳詳衮國舅太師國舅太保國舅太尉國舅司徒國舅司空敞史太宗會同元年改郎君為敞史知事國舅伊蘇濟勒大翁帳詳衮司國舅詳衮國舅都監國舅本族將軍國舅本族小將軍興宗重熙五年樞密院奏國舅伊蘇濟勒小翁帳敞史准大横帳洎國舅二父帳改為將軍國舅伊蘇濟勒小翁帳詳衮司國舅巴哩大父帳詳衮司國舅巴哩少父帳詳衮司國舅伊勒希巴司國舅伊勒希巴國舅左伊勒希巴國舅右伊勒希巴敞史國舅帳剋國舅别部世宗置官制未詳國舅别部敞史聖宗太平八年見國敞史蕭特爾格渤海帳司官制未詳渤海宰相渤海太保渤海塔瑪渤海近侍詳衮司奚王府伊實王府並見部族官北面宫官遼建諸宫鄂爾多部族畨户統以北面宫官具如左諸行宫都部署院總契丹漢人諸行宫之事諸行宫都部署知行宫諸部署司事諸行宫副部署諸行宫判官契丹行宫諸部署司總行在行軍諸鄂爾多之政令契丹行宫都部署知契丹行宫都部署事契丹行宫副部署契丹行宫判官行宫諸部署司掌行在諸宫之政令行宫都部署行宫副部署行宫部署判官十二宫職名總目某宫某宫使某宫副使某宫太師某宫太保某宫侍中太宗㑹同元年置亦曰實珠某宫都部署司掌本宫契丹軍民之事某宫都部署某宫副部署某宫判官某宫提轄司官制未詳某宫馬羣司侍中敞史某錫林額爾奇木本名穆嚕穆特布改詳衮㑹同元年升瑪爾布本名達爾罕㑹同元年改牙書㑹同元年置某斡里内族外戚世官犯罪沒入斡里瑪古某摩哩札薩克轄某徳里官名未詳太祖𢎞義宫太宗永興宫世宗積慶宫應天皇太后長寧宫穆宗延昌宫景宗彰愍宫承天皇太后崇徳宫聖宗興聖宫興宗延慶宫道宗太和宫天祚永昌宫孝文皇太弟敦睦宫文忠王府以上十二宫一府部署提轄錫林斡里摩哩徳里等並見營衛志押行宫輜重伊勒希巴司掌諸宫巡幸扈從輜重之事伊勒希巴敞史遼史卷四十五遼史卷四十五考證百官志一北院臣長𤼵按遼志官有契丹樞密院及行宫都總官司謂之北院以其在牙帳之北以主蕃事大惕隐臣長發按遼志惕隐宗正寺也夷離畢臣長𤼵按遼志夷離畢參知政事也敞史臣長𤼵按遼志佐吏則有敞史本古思奴古都奴古徒奴古敞史見于百官志其思奴古國語解謂官與敞史相近徒奴古國語解謂邊徼外小國而本古都奴古未詳其義要之皆佐吏之類也大林牙臣長𤼵按遼志林牙翰林學士也遼史卷四十五考證
