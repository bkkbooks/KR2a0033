body:
  text: 遼史卷二元中書右丞相總裁托克托等修本紀第二太祖下四年春正月丙申射虎東山二月丙寅修遼陽故城以漢民渤海户實之改為東平郡置防禦使夏五月庚辰至自東平郡秋八月丁酉謁孔子廟命皇后皇太子分謁寺觀九月征烏爾古部道聞皇太后不豫一日馳六百里還侍病閒復還軍中冬十月丙午次烏爾古部天大風雪兵不能進上禱扵天俄項而霽命皇太子将先鋒軍進擊破之俘獲生口萬四千二百牛馬車乘廬帳器物二十餘萬自是舉部来附五年春正月乙丑始製契丹大字夏五月丙寅吴越王復遣滕彦休貢犀角珊瑚授官以遣庚辰龍見于伊喇山陽水上上射獲之蔵其骨内府閏六月丁夘以皇弟蘇為特哩衮康黙記為伊勒希巴秋八月己未党項諸部叛辛未上親征九月己丑朔梁遣郎公逺来聘壬寅詔頒行大字皇太子率徳哷勒部額爾竒木裕勒沁等畧地雲内天徳冬十月辛未攻天徳癸酉莭度使宋瑶降賜弓矢鞍馬旗鼓更其軍曰應天甲戌班師宋瑶復叛丙子拔其城擒宋瑶俘其家屬徙其民扵陰山南十二月己未師還六年春正月丙午以皇弟蘇為南府宰相迪里為特哩衮南府宰相自諸弟搆亂府之名族多罹其禍故位久虚以卓特部轄塔哩珠勒呼攝之府中數請擇任宗室上以舊制不可輙變請不已乃告扵宗廟而後授之宗室為南府宰相自此始夏五月丙戌朔詔定法律正班爵丙申詔畫前代直臣像為招諌圗及詔長吏四孟月詢民利病六月乙夘朔日有食之冬十月癸丑朔晉新州防禦使王郁以所部山北兵馬内附丙子上率大軍入居庸闗十一月癸夘下古北口丁未分兵畧檀順安逺三河良鄉望都潞滿城遂城等十餘城俘其民徙内地十二月癸丑王郁率其衆来朝上呼郁為子賞賚甚厚而徙其衆于潢水之南庚甲皇太子率王郁畧地定州康黙記攻長蘆晉義武軍莭度使王䖏直養子都囚其父自稱留後癸亥圍涿州有白兎緣壘而上是日破其郛癸酉刺史李嗣弼以城降乙亥存朂至定州王都迎謁馬前存朂引兵趍望都遇我軍托諾五千騎圍之存朂力戰數四不解李嗣昭領三百騎来救我軍少却存朂乃得出大戰我軍不利引歸存朂至幽州遣二百騎躡我軍後我軍反擊悉擒之己夘還次檀州幽人来襲擊走之擒其禆将詔徙檀順民于東平瀋州天贊元年春二月庚申復徇幽薊地癸酉詔改元赦軍前殊死以下夏四月甲寅攻薊州戊午拔之擒刺史胡瓊以盧國用尼嚕古典軍民事壬戌大饗軍士癸亥李存朂圍鎮州張文禮求援命郎君迪里将軍康末怛往擊敗之殺其将李嗣昭辛未攻石城縣拔之五月丁未張文禮卒其子䖏瑾遣人奉表来謝六月遣鷹軍擊西南諸部以所獲賜貧民冬十月甲子以蕭希達為北府宰相分徳哷勒部為二院實訥齊為北院額爾竒木烏蘇為南院額爾竒木詔分北達寜額為二部立兩節度使以統之十一月壬寅命皇子耀庫濟為天下兵馬大元帥畧地薊北二年春正月丙申元帥耀庫濟克平州獲刺史趙思温禆将張崇二月如平州甲子以平州為盧龍軍置莭度使三月戊寅軍扵箭笴山獲叛奚呼遜射以鬼箭誅其黨三百人沉之狗河置奚托輝部以布倫權總其事夏四月己酉梁遣使来聘吴越王遣使来貢癸丑命耀庫濟攻幽州徳哷勒部額爾竒木迪里徇山西地庚申耀庫濟軍幽州東莭度使符存審遣其将出戰敗之擒裴信父子閏月庚辰耀庫濟抵鎮州壬午拔曲陽丙戌下北平晉王李存朂即皇帝位國號唐五月戊午耀庫濟師還癸亥犬饗軍士賞賚有差六月辛丑波斯國来貢秋七月前北府宰相蕭阿古齊及王郁徇地燕趙冬十月辛未朔日有食之己夘唐兵滅梁三年春正月遣兵畧地燕南夏五月丙午以特哩衮迪里為南院額爾竒木徙薊州民實遼州地渤海殺其刺史張秀實而掠其民六月乙酉召皇后皇太子大元帥及二宰相諸部頭等詔曰上天降監恵及烝民聖主明王萬載一遇朕既上承天命下統羣生每有征行皆奉天意是以機謀在己取舍如神國令既行人情大附舛訛歸正遐邇無愆可謂大含溟海安納泰山矣自我國之經營為羣方之父母憲章斯在𦙍嗣何憂升降有期去来在我良籌聖會自有契扵天人衆國羣王豈可化其凡骨三年之後嵗在丙戌時值初秋必有歸䖏然未終兩事豈負親誠日月非遥戒嚴是速聞詔者皆驚懼莫識其意是日大舉征托歡党項準布等部詔皇太子監國大元帥耀庫濟従秋七月辛亥哈喇等擊破索歡納山東部族八月乙酉至烏爾古山以鵝祭天甲午次古單于國登阿勒坦音徳爾山以麃鹿祭九月丙申朔次古回鶻城勒石紀功庚子拜日扵蹛林丙午遣騎攻準布南府宰相蘇南院額爾竒木迪里畧地西南乙夘蘇等獻俘丁巳鑿金河水取烏山石輦致潢河木葉山以示山海朝宗之意癸亥大食國遣使来貢甲子詔礲丕勒汗故碑以契丹突厥漢字紀其功是月破呼穆蘇山諸蕃部次伊徳實山以赤牛青馬祭天地回鶻巴哩遣使来貢冬十月丙寅朔獵約囉山獲野獸數千以充軍食丁夘軍扵巴爾斯山遣兵踰流沙拔浮圖城盡取西鄙諸部十一月乙末朔獲甘州回鶻都督必里克因遣使諭其主烏穆珠汗射虎于烏蘭實哷山抵巴克實山六百餘里且行且獵日有鮮食軍士皆給四年春正月壬寅以㨗報皇后皇太子二月丙寅大元帥耀庫濟畧党項丁夘皇后遣康末怛問起居進御服酒膳乙亥阿古齊畧燕趙還進牙旗兵仗辛夘耀庫濟獻党項俘三月丙申饗軍水精山夏四月甲子南攻小蕃下之皇后皇太子迎謁扵札里河癸酉回鶻烏穆珠汗遣使来貢謝五月甲寅清暑室韋北陘秋九月癸巳至自西征冬十月丁夘唐以滅梁来告即遣使報聘庚辰日本國来貢辛巳髙麗國来貢十一月丁酉幸安國寺飯僧赦京師囚縦五坊鷹鶻己酉新羅國来貢十二月乙亥詔曰所謂兩事一事已畢惟渤海世讐未雪豈宜安駐乃舉兵親征渤海大諲譔皇后皇太子大元帥耀庫濟従閏月壬辰祠木葉山壬寅以青牛白馬祭天地扵烏山己酉次色克山射鬼箭丁巳次啇嶺夜圍扶餘府天顯元年春正月己未白氣貫日庚申拔扶餘城誅其守将丙寅命特哩衮安圗前北府宰相阿古齊等将萬騎為先鋒遇諲譔老相兵破之皇太子大元帥耀庫濟南府宰相蘇北院額爾竒木實訥齊南院額爾竒木迪里圍輝罕城己巳諲譔請降庚午駐軍輝罕城南辛未諲譔素服槀索牽羊率僚屬三百餘人出降上優禮而釋之甲戌詔諭渤海郡縣丙子遣近侍康末怛等十三人入城索兵器為邏卒所害丁丑諲譔復叛攻其城破之駕幸城中諲譔請罪馬前詔以兵衛諲譔及族屬以出祭告天地復還軍中二月庚寅安邉鄚頡南海定理等府洎諸道莭度刺史来朝慰勞遣之以所獲器幣諸物賜将士壬辰以青牛白馬祭天地大赦改元天顯以平渤海遣使報唐甲午復幸輝罕城閱府庫物賜従臣有差以奚部長布倫王郁自囘鶻新羅吐蕃党項室韋沙陀烏爾古等従征有功優加賞賚丙午改渤海國為東丹輝罕城為天福冊皇太子貝為人皇王以主之以皇弟特爾格為左大相渤海老相為右大相渤海司徒大素賢為左次相伊濟為右次相赦其國内殊死以下丁未髙麗濊貊鐡驪靺鞨来貢三月戊午遣額爾竒木康黙記左僕射韓延徽攻長嶺府甲子祭天丁夘幸人皇王宫己巳安邉鄚頡定理三府叛遣安圗討之丁丑三府平壬午安圗獻俘誅安邉府叛帥二人癸未宴東丹國僚佐頒賜有差甲申幸天福城乙酉班師以大諲譔舉族行夏四月丁亥朔次繖子山辛夘人皇王率東丹國僚屬辭是月唐養子李嗣源反郭存謙弑其主存朂嗣源遂立五月辛酉南海定理二府復叛大元帥耀庫濟討之六月丁酉二府平丙午次慎州唐遣姚坤以國哀来告秋七月丙辰鐡州刺史衞鈞反乙丑耀庫濟攻拔鐵州庚午東丹國左大相特爾格卒辛未衛送大諲譔扵皇都西築城居之賜其名曰烏勒呼妻曰阿勒札盧龍行軍司馬張崇叛奔唐甲戌次扶餘府上不豫是夕大星隕于幄前辛巳平旦子城上見黄龍繚繞可長一里光耀奪目入扵行宫有紫黒氣蔽天踰日乃散是日上崩年五十五天贊三年上所謂丙戌秋初必有歸䖏至是乃驗壬午皇后稱制權決軍國事八月辛夘康黙記等拔長嶺府甲午皇后奉梓宫西遷壬寅耀庫濟討平諸州奔赴行在乙巳人皇王貝繼至九月壬戌南府宰相蘇薨丁夘梓宫至皇都權殯于子城西北己巳上諡昇天皇帝廟號太祖冬十月盧龍莭度使盧國用叛奔于唐十一月丙寅殺南院額爾竒木耶律迪里郎君耶律畢老等二年八月丁酉𦵏太祖皇帝于祖陵置祖州天城軍莭度使以奉陵寝統和二十六年七月進諡大聖大明天皇帝重熙二十一年九月加諡大聖大眀神烈天皇帝太祖所崩行宫在扶餘城西南兩河之間後建昇天殿扵此而以扶餘為黄龍府云贊曰遼之先出自炎帝世為森濟國其可知者盖自竒善云竒善生都菴山徙潢河之濵傳至聶哷始立制度置官屬刻木為契穴地為牢讓蘇爾威不肯自立聶哷生必塔必塔生海蘭海蘭生努爾蘇大度寡欲令不嚴而人化是為肅祖肅祖生薩喇達甞與黃室韋挑戰矢貫數札是為懿祖懿祖生伊徳實始教民稼穡善畜牧國以殷富是為𤣥祖𤣥祖生色勒迪仁民愛物始置鐵冶教民鼓鑄是為徳祖即太祖之父也世為契丹約尼氏額爾竒木執其政柄徳祖之弟蘇哷北征伊濟室韋南畧易定奚霫始興板築置城邑教民種桑麻習織組已有廣土衆民之志而太祖受汗之禪遂以建國東征西討如折枯拉朽東自海西至扵流沙北絶大漠信威萬里厯年二百豈一日之故哉周公誅管蔡人未有能非之者埒克安圗之亂太祖既貸其死而復用之非人君之度乎舊史扶餘之變亦異矣夫遼史巻二遼史卷二考證神冊五年春正月乙丑始製契丹大字按陶宗儀書史㑹要云遼太祖用漢人教以𨽻書之半増損之製契丹字數千以代刻木之約而永樂大典引紀異錄以為渤海既平乃製契丹大字三千餘言則製字應在天顯元年所紀各異天贊二年三月討叛奚呼遜獲之按呼遜原本作胡損巻三又作胡遜即係一人當屬音轉之訛今畫一改訂閏月晉王李存朂即皇帝位按五代史唐本紀書同光元年夏四月己巳皇帝即位通鑑綱目亦書夏四月晉王存朂稱皇帝扵魏州此書扵閏月之下盖契丹與唐是時尚未通好晉王即位亦未遣使来告乃作史者約畧紀事之辭耳三年春正月遣兵畧地燕南夏五月渤海殺其刺史張秀實而掠其民按通鑑所書是年契丹侵晉無虚月兵征渤海亦有月分可考乃遼史僅扵正月書畧地燕南扵五月書渤海殺刺史掠民以是知修史者遺漏之多也四年夏四月按五代歐史司天考載後唐同光三年四月癸亥朔日有食之通鑑綱目契丹志亦書之後唐同光三年即遼天贊四年也本紀扵神冊六年天贊二年兩書日食此不書者史闕畧也冬十月丁夘唐以滅梁来告即遣使報聘按唐滅梁事在天贊二年冬十月至此已及兩年考冊府元龜載後唐同光三年十月甲子差春州刺史来海金押國信賜契丹王及迴使等賜物有差盖唐與契丹舊無使命往来其通好始扵是年是以滅梁事扵是時始来告也天顯元年秋八月按五代史司天考載後唐天成元年八月乙酉朔日有食之通鑑綱目及紀異錄俱書之本紀失載二年八月丁酉𦵏太祖皇帝扵祖陵置祖州按永樂大典所載即扵本年九月葬太祖扵木葉山置州墳側名曰祖州本紀系之二年八月所記各異遼史巻二考證
