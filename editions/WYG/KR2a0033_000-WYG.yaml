front:
  text: 御製改譯遼金元三史序
  hash: sha256:899f40dd3083f8f04a4991530cb780f67e5159180190584175897df13f155692
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_000-1a, image: WYG0289/WYG0289-0001a.png}
body:
  text: 改譯遼金元三史成司事者以序請史無序例也齊梁陳書及後五代乃有序葢出於宋臣修史者剏為之飾例也亦足以觀其政之不綱而事之紛紊也若今三史之請序將比於孰乎曰彼之序皆序其事而此之序乃序其言則不可以齊梁等比之矣序其言亦非為之修辭飾説乃改譯漢文譯其國語之訛誤者至於其國制度之理亂君臣之得失未嘗一字易葢史者信也所以傳萬世垂法戒彼其時之史或已不能保其必信數百年之後無庸為之修飾且改譯者不過正其訛誤之語而其舊史之布天下者自在也讀史者執舊簡而証以新書則可知語之異而事之同則此序之不可不作乃所以明吾志也夫春秋一字之褒貶示聖人大公至正之心若遼金元三國之譯漢文則出于秦越人視肥瘠者之手性情各别語言不通而又有謬寓嗤斥之意存焉此豈春秋一字褒貶之為哉向于改譯三史之㫖及同文韻綂熱河志諸序已屢言之兹不復綴夫遼金雖稱帝究屬偏安元雖一綂而主中華者纔八十年其時漢人之為臣僕者心意終未浹洽我國家承天庥命逮極垂綂至於今百四十年矣漢人為臣僕者自其髙曽逮將五世性情無所不通語言無所不曉且令之纂修諸臣即有善通清書兼習諸國字之人則兹三史必當及此時而改譯其訛誤者是則吾于遼金元三代寔厚有造而慰焉雖然是造非吾造乃天造我國家重熙累洽而後得此則所以祈天永命日慎一日之忱惟益兢兢懼乃勝于慰焉云耳進遼史表開府儀同三司上柱國錄軍國重事中書右丞相監修國史領經筵事臣托克托言竊惟天文莫驗於璣衡人事莫證於簡䇿人主監天時之休咎則必察乎璣衡之精監人事之得失則必考乎簡䇿之信是以二者所掌俱有太史之稱然天道幽而難知人情顯而易見動靜者吉㐫之兆敬怠者興亡之機史臣雖述前代之設施大意有助人君之鑑戒遼自唐季基于朔方造物本席於干戈致治能資於黼黻敬天尊祖而出入必祭親仁善鄰而和戰以宜南府治民北府治兵春狩省耕秋狩省歛吏課毎嚴於芻牧嵗饑屢賜乎田租至若觀市赦罪則脗合六典之規臨軒䇿士則恪遵三嵗之制享國二百一十九載政刑日舉品式備具盖有足尚者焉迨夫子孫失御上下離心驕盈盛而釁隙生讒賊興而根本蹙變強為弱易於反掌吁可畏哉天祚自絶逹實苟延國既邱墟史亦蕪茀耶律儼語多避忌陳大任辭乏精詳五代史繫之終篇宋舊史埒諸載記予奪各徇其主傳聞况失其真我世祖皇帝一視同仁深加愍惻嘗勅詞臣撰次三史首及於遼六十餘年嵗月因循造物有待臣托克托誠惶誠恐頓首頓首欽惟皇帝陛下如堯稽古而簡寛容衆若舜好問而濬哲冠倫講經兼誦乎祖謨訪治旁求乎往牒兹修史事斷自宸𠂻睿㫖下而徴聘行朝士賀而遺逸起於是命臣托克托以中書右丞相領都總裁中書平章政事臣特穆爾達實中書右丞今平章政事臣賀惟一御史中丞今翰林學士承㫖臣張起巖翰林學士臣毆陽𤣥侍御史今集賢侍講學士兼國子祭酒臣吕思誠翰林侍講學士臣揭傒斯奉命為總裁官中書遴選儒臣宗文太監今兵部尚書臣亷和斯哈雅翰林直學士臣王沂秘書著作佐郎臣徐昺國史院編修官臣陳繹曽分撰遼史起至正三年四月迄四年三月發故府之櫝藏集遐方之匭獻蒐羅剔抉刪潤研劘紀志表傳勒成一代之書臧否是非不迷千載之實臣托克托叨承隆寄幸覩成功載宣日月之光華願效涓埃之補報我朝之論議歸正氣之直則辭之昌遼國之君臣有知善者勸而惡者懼所撰本紀三十卷志三十一卷表八卷列傳四十五卷各著論贊具存體裁隨表以聞上塵天覽下情無任慚懼戰汗屏營之至臣托克托誠惶誠懼頓首頓首謹言欽定四庫全書史部一遼史目録正史類本紀三十卷志三十一巻表八卷列傳四十五卷凡一百一十五卷本紀卷一本紀第一太祖上卷二本紀第二太祖下卷三本紀第三太宗上巻四本紀第四太宗下巻五本紀第五世宗巻六本紀第六穆宗上巻七本紀第七穆宗下巻八本紀第八景宗上巻九本紀第九景宗下卷十本紀第十聖宗一卷十一本紀第十一聖宗二巻十二本紀第十二聖宗三卷十三本紀第十三聖宗四卷十四本紀第十四聖宗五巻十五本紀第十五聖宗六巻十六本紀第十六聖宗七巻十七本紀第十七聖宗八巻十八本紀第十八興宗一巻十九本紀第十九興宗二卷二十本紀第二十興宗三卷二十一本紀第二十一道宗一卷二十二本紀第二十二道宗二卷二十三本紀第二十三道宗三卷二十四本紀第二十四道宗四卷二十五本紀第二十五道宗五卷二十六本紀第二十六道宗六卷二十七本紀第二十七天祚一卷二十八本紀第二十八天祚二卷二十九本紀第二十九天祚三卷三十本紀第三十天祚四志卷三十一志第一營衛上宫衛巻三十二志第二營衛中巴納部族上卷三十三志第三營衛下部族下卷三十四志第四兵衛上兵制卷三十五志第五兵衛中御帳親軍宫衛騎軍大首領軍衆部族軍卷二十六志第六兵衛下五京都郷丁屬國軍邊境戍兵卷三十七志第七地理一上京道邊防城巻三十八志第八地理二東京道巻三十九志第九地理三中京道巻四十志第十地理四南京道巻四十一志第十一地理五西京道巻四十二志第十二厯象上大明厯元巻四十三志第十三厯象中閏考朔考上巻四十四志第十四厯象下朔考下象刻漏官星巻四十五志第十五百官一北面上卷四十六志第十六百官二北面下卷四十七志第十七上百官三南面上卷四十八志第十七下百官四南面下卷四十九志第十八禮一吉儀卷五十志第十九禮二㐫儀卷五十一志第二十禮三軍儀禮四賔儀卷五十二志第二十一禮五嘉儀上卷