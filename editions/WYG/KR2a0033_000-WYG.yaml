略其間左支右絀痕跡灼然如每年遊幸既具書於本紀矣復為遊幸表一巻部族之分合既詳述於營衛志矣復為部族表一巻屬國之貢使亦具見於本紀矣復為屬國表一巻義宗之奔唐章肅之争國既屢見於紀志表矣復累書於列傳文學僅六人而分為兩巻伶官宦官本無可紀載而强綴三人此其重複瑣碎在史臣非不自知特以無米之炊足窮巧婦故不得已而縷割分𨽻以求巻帙之盈勢使之然不足怪也然遼典雖不足徴宋籍非無可考東都事略載遼太宗建國號大遼聖宗即位改大遼為大契丹國道宗咸雍二年復改國號大遼考重熈十六年釋迦佛舎利鐡塔記石刻今尚在古爾板蘇巴爾漢其文稱維大契丹國興中府重熈十五年丙戌嵗十一月丁丑朔云云與王偁所記合而此書不載是其於國號之更改尚未詳也文獻通考稱遼道宗改元夀昌洪遵泉志引李季興東北諸蕃樞要云契丹主天祐年號夀昌又引北遼通書云天祚即位夀昌七年改為乾統而此書作夀隆殊不思聖宗諱隆緒道宗為聖宗之孫何至紀元而犯祖諱考今興中故城即古爾板蘇巴爾漢譯言三塔也故土人亦稱三座塔云東南七十里柏山有安徳州靈巖寺碑稱夀昌初元嵗次乙亥又有玉石觀音像唱和詩碑稱夀昌五年九月又易州有興國寺太子誕聖邑碑稱夀昌四年七月均與洪遵所引合又老學菴筆記載聖宗改號重熈後避天祚嫌名追稱重熈曰重和考興中故城鐡塔記旁有天慶二年釋迦定光二佛舎利塔記稱重和十五年鑄鐡塔與陸游所記亦合而此書均不載是其於改元之典章多舛漏也潛研堂金石文䟦尾又稱據太子誕聖邑碑諸人結銜知遼制有知軍州事通判軍事知縣事之名而百官志亦不載是其於制度有遺闕也至厲鶚遼史拾遺所摭尤不可更僕數此則考證未詳不得委之文獻無徴矣然其書以實錄為憑無所粉飾如宋史載太平興國七年戰於豐州據此書則云保裔被擒而降後為昭順軍節度使審其事勢遼史較可徴信此三史所由並行而不可偏廢歟乾隆四十九年十一月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
