body:
  text: 遼史卷一百一元中書右丞相總裁托克托等修列傳第三十一蕭托斯和耶律阿息保蕭伊實蕭呼都克蕭托斯和字伊實音圖魯卜部人四世祖音濟髪長五尺時呼為長髪音濟祖哩巴阿爾威部節度使托斯和謹愿不妄交伯父留格坐事免官聞重元亂挈家赴行在托斯和雖幼已如成人補筆硯實達爾遷祇候郎君轉樞密院侍御咸雍五年遷崇德宫使㑹有訴北南院聽訟不直者事下托斯和悉改正之為耶律阿蘇所忌帝欲召用輒為所沮八年歴漠北滑水馬羣太保數年不調嘗曰用才未盡不若閑乾統中遷漠南馬羣太保以大風傷草馬多死鞭之三百免官九年徙天齊殿宿衛明年穀價翔踊宿衞士多不給托斯和出私廪賙之召同知南院樞密使事天慶四年為漢人行宫副部署時金兵初起攻陷寧江州天祚召羣臣議托斯和曰女直國雖小其人勇而善射自執我叛人蕭哈里勢益張我兵久不練若遇强敵稍有不利諸部離心不可制矣為今之計莫若大𤼵諸道兵以威壓之庶可服也北院樞宻使蕭塔喇台曰如托斯和之謀徒示弱耳但𤼵滑水以北兵足以拒之遂不用其計數月間邊兵屢北人益不安饒州渤海結構頭下城以叛有步騎三萬餘招之不下托斯和帥兵徃討擒其渠魁斬首數千級得所掠物悉還其主及耶律章努叛托斯和與留守耶律大悲努為守禦章努既平托斯和請曰今邊兵懈弛若清暑嶺西則漢人嘯聚民心益揺臣愚以為宜罷此行不納乃命托斯和控扼東路招集散卒後以太子太傅致仕卒耶律阿息保字達爾丹五院部人祖呼哩太祖時徙居西北部世為招討司吏阿息保慷慨有大志年十六以才幹補内史天慶初轉樞密院侍御金人起兵城境上遣阿息保問之金人曰若歸阿蘇敢不聽命阿息保具以聞金兵陷寧江州邊兵屢敗遣阿息保與耶律章努等齎書而東冀以脅降阿息保曰臣前使依詔開諭畧無所屈将還謂臣曰若所請不遂無相見今臣請獨往不聽將行别蕭塔喇台曰不肖適異國必無生還願公善輔國家既至阿息保見執久乃遁歸及天祚敗績遷都巡捕使六年從阿蘇討耶律章努加領軍衛大將軍阿蘇將兵而東阿息保送至軍乃還天祚怒其專鞭之三百尋為奚六部圗哩太尉後阿蘇反阿息保以偏師進擊臨陣墜馬被擒因阿蘇有舊得免時阿蘇頗好殺阿息保謂曰欲舉大事何以殺為由是全活者衆㑹阿蘇敗乃還以戰失利囚中京數嵗保大二年金兵至中京始出獄尋為德哷勒皮室詳衮時魏王淳僭號屢遣人以書來招阿息保封書以獻因諌曰東兵甚鋭未可輕敵及石輦驛之敗天祚奔竄召阿息保不時至疑有貳心并怒為淳所招殺之初阿息保知國將亡前後諌甚切及死以非罪人尤惜之蕭伊實字特黙國舅少父房之後性謹愿夀隆間累任劇官天慶初知國舅詳衮事遷殿前副㸃檢金兵起為行軍副都統以戰失利罷職六年出為武定軍節度使遷西京留守明年討劇賊董龎兒戰易水西大破之以功為北府宰相加左僕射兼東北路都統十年金兵陷上京詔兼上京留守東北路統軍使為政寛猛得宜民之窮困者輒加振恤衆咸愛之保大二年金兵大至伊實軍潰左遷西南面招討使以部民流散不赴及天祚播遷給侍從不闕拜殿前都㸃檢凡金兵所過諸營敗卒復聚上京遣伊實為上京留守以安撫之明年盧彦倫以城叛伊實被執數日以居官無過得釋後為耶律達實所殺蕭呼都克字哈準隱其先薩哈勒齊太祖時願𨽻宫分遂為太和宫分人曽祖達魯明醫觀人形色即知其病所在綂和中宰相韓德譲貴寵達魯希㫖言德讓宜賜國姓籍横帳由是世預太醫選子孫因之入官者衆呼都克性便侫與物無忤清寜初補近侍大安元年為彰愍宫太師夀隆二年轉永興宫太師天慶初累遷至殿前副㸃檢五年從天祚東征為先鋒都統臨事猶豫凡隊伍皆以圍塲名號之進至拉林水與金兵戰敗大軍亦却及討耶律章努以籍私奴為軍遷知北院樞密使事卒呼都克長于騎射見天祚好游畋每言從禽之樂以逢其意天祚悦而從之國政隳廢自此始云論曰甚矣承平日久上下狃於故常之可畏也天慶之間女直方熾惟托斯和明於料敵善於忠諌惜乎天祚痼蔽不見信用阿息保不死阿蘇之難伊實甘忍盧彦倫之執大節已失他有所長亦奚足取呼都克以游畋逢迎天祚而隳國政可勝罪哉遼史卷一百一
