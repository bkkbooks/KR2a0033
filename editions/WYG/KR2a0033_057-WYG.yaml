body:
  text: 遼史卷五十七元中書右丞相總裁托克托等修志第二十六儀衞志三符印約尼氏之世受印于回鶻至伊蘭汗乃請印于唐武宗始賜奉國契丹印太祖神冊元年梁幽州刺史來歸詔賜印綬是時太祖受位約尼十年矣㑹同九年太宗伐晉末帝表上傳國寶一金印三天子符瑞於是歸遼傳國寳秦始皇作用藍玉螭紐六面其正面文受命於天既壽永昌魚鳥篆子嬰以上漢高祖王莽簒漢平皇后投璽殿階螭角微玷獻帝失之孫堅得于井中傳至孫權以歸于魏魏文帝隸刻肩際曰大魏受漢傳國之寳唐更名受命寳晉亡歸遼自三國以來僭偽諸國往往模擬私製歴代府庫所藏不一莫辨真偽聖宗開泰十年馳驛取石晉所上玉璽于中京興宗重熙七年以有傳國寶者為正統賦試進士天祚保大二年遺傳國璽于桑乾河玉印太宗破晉北歸得于汴宮藏隨駕庫穆宗應厯二年詔用太宗舊寳御前寶金鑄文曰御前之寶以印臣僚宣命詔書寶文曰書詔之寶凡書詔批答用之契丹寶受契丹冊儀符寳郎捧寶置御坐東金印三晉帝所上其文未詳皇太后寶制未詳天顯二年應天皇后稱制羣臣上璽綬冊承天皇太后儀符寶郎奉寶置皇太后坐右皇后印文曰皇后教印皇太子寶未詳其制重熙九年冊皇太子儀中書令授皇太子寶印吏部印文曰吏部之印銀鑄以印文官制誥兵部印文曰兵部之印銀鑄以印軍職制誥契丹樞密院契丹諸行軍部署漢人樞密院中書省漢人諸行宫都部署印並銀鑄文不過六字以上以銀硃為色南北王以下内外百司印並銅鑄以黄丹為色諸税務以赤石為色雙寛印雙寛鷙鳥之總名以為印紐取疾速之義行軍詔賜將帥用之道宗賜耶律仁先鷹紐印即此符契自達呼哩氏八部用兵則合契而動僅刻木為牉合太祖受命易以金魚金魚符七枚黄金鑄長六寸各有字號毎魚左右判合之有事以左半先授守將使者執右半大小長短字號合同然後發兵事訖歸於内府銀牌二百面長尺刻以國字文曰宜速又曰勑走馬牌國有重事皇帝以牌親授使者手劄給驛馬若干驛馬闕取它馬代法晝夜馳七百里其次五百里所至如天子親臨須索更易無敢違者使囘皇帝親受之手封牌印郎君收掌木契正面為陽背面為陰閤門喚仗則用之朝賀之禮宣徽使請陽面木契下殿至於殿門以契授西上閤門使云授契行勘勘契官聲喏跪受契舉手勘契同俛興鞠躬奏内外勘契同閤門使云准勑勘契行勘勘契官執陰面木契聲喏平身立少退近後引聲云軍將門仗官齊聲喏勘契官云内出喚仗木契一隻准勑付左右金吾仗行勘勘契官云合不合門仗官云合凡再勘契官云同不同門仗官云同亦再勘契官近前鞠躬奏勘官左金吾引駕仗勾畫都知某官某對御勘同平身少退近後右手舉契云其契謹付閤門使進入閤門使引聲喏門仗官下聲喏勘契官跪以契授閤門使上殿納契宣徽使受契閤門使下殿奉勑喚仗木箭内箭為雄外箭為雌皇帝行幸則用之還宫勘箭官執雌箭東上閤門使執雄箭如勘契之儀詳具禮儀志遼史卷五十七遼史卷五十七考證聖宗開泰十年馳驛取石晉所上玉璽于中京按本紀開泰至九年而止次年改元太平此云開泰十年者蓋是年改元在十一月取玉璽事尚在未改元之前耳遼史卷五十七考證
