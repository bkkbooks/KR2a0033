body:
  text: 遼史卷七十九元中書右丞相總裁托克托等修列傳第九室昉耶律賢適紐哩郭襲耶律阿穆爾室昉字夢竒南京人㓜謹厚篤學不出外户者二十年雖里人莫識其精如此㑹同初登進士第為盧龍巡捕官太宗入汴受册禮詔昉知制誥總禮儀事天禄中為南京留守判官應厯間累遷翰林學士出入禁闥十餘年保寧間兼政事舍人數延問古今治亂得失奏對稱㫖上多昉有理劇才改南京副留守決訟平允人皆便之遷工部尚書尋改樞宻副使參知政事頃之拜樞宻使兼北府宰相加同政事門下平章事乾亨初監修國史統和元年告老不許進尚書無逸篇以諌太后聞而嘉奬二年秋詔修諸嶺路昉發民夫二十萬一日畢功是時昉與韓徳讓耶律色珍相友善同心輔政整析蠧弊知無不言務在息民薄賦以故法度修明朝無異議八年復請致政詔入朝免拜賜几杖太后遣閤門使李從訓持詔勞問令常居南京封鄭國公初晉國公主建佛寺于南京上許賜額昉奏曰詔書悉罪無名寺院今以主請賜額不惟違前詔恐此風愈熾上從之表進所撰實録二十卷手詔褒之加政事令賜帛六百匹九年薦韓徳讓自代不從上以昉年老苦寒賜貂皮衾褥許乘輦入朝病劇遣翰林學士張幹就第授中京留守加尚父卒年七十五上嗟悼輟朝二日贈尚書令遺言戒厚葬恐人譽過情自志其墓耶律賢適字阿克展裕悅羅卜科之子嗜學有大志滑稽玩世人莫之知惟裕悅烏哲器之嘗謂人曰是人當國天下幸甚應厯中朝臣多以言獲譴賢適樂於靜退游獵自娯與親朋言不及時事討烏爾古還擢右皮室詳衮景宗在藩邸常與韓匡嗣紐哩等游言或刺譏賢適勸以宜早疎絶由是穆宗終不見疑賢適之力也景宗立以功加檢校太保尋遙授寧江軍節度使賜推忠恊力功臣時帝初踐阼多疑諸王或萌非望隂以賢適為腹心加特進同中書門下平章事保寧二年秋拜北院樞宻使兼侍中賜保節功臣三年為西北路兵馬都部署賢適忠介膚敏推誠待人雖燕息不忘政務以故百司首職㒺敢媮惰累年滯獄悉決之大丞相髙勲契丹行宫都部署紐哩席寵放恣及帝姨母保母勢薫灼一時納賂請謁門若賈區賢適患之言于帝不報以病解職又不允令鑄手印行事乾亨初疾篤得請明年封西平郡王薨年五十三子觀音大同軍節度使紐哩字鼐爾琨逸其氏族補積慶宫人應厯初為習馬實達爾以母憂去一日至雅伯山見一巨人懼走巨人止之曰勿懼我地祇也葬爾母於斯當速詣闕必貴紐哩從之累遷馬羣侍中時景宗在藩邸以紐哩出自本宫待遇殊厚紐哩亦傾心結納及穆宗遇弑紐哩奔赴景宗是夜集禁兵五百以衛既即位以翼戴功加政事令契丹行宫都部署賞賚甚渥尋加守太尉北漢主劉繼元聞紐哩為上信任遇其生日必致禮紐哩素貪同列蕭安巴達亦好賄二人相善人有氈裘為枲耳子所著者或戲曰若遇紐哩安巴達必盡取之傳以為笑其貪猥如此保寧末坐私藏甲五百屬有司方案詰紐哩袖中又得殺樞宻使蕭思温賊書賜死紐哩善識馬嘗行郊野見數馬跡指其一日此竒駿也以已馬易之果然郭襲不知何郡人性端介識治體乆淹外調景宗即位召見對稱㫖知可任以事拜南院樞宻使尋加兼政事令以帝數游獵襲上書諌曰昔唐髙祖好獵蘇世長言不滿十旬未足為樂髙祖即日罷史稱其美伏念聖祖創業艱難修徳布政宵旰不懈穆宗逞無厭之欲不恤國事天下愁怨陛下繼統海内翕然望中興之治十餘年間征伐未己而冦賊未弭年糓雖登而瘡痍未復正宜戒懼修省以懐永圖側聞恣意逰獵甚於往日萬一有銜橜之變搏噬之虞悔將何及況南有强敵伺隙而動聞之得無生心乎伏望陛下節從禽酣飲之樂為生靈社稷計則有無疆之休上覽而稱善賜恊贊功臣拜武定軍節度使卒耶律阿穆爾字布琳約尼兆古汗之四世孫也㓜總敏保寧中為南院宣徽使統和初皇太后稱制與耶律色珍參預國論為都統以征髙麗功遷北院宣徽使加政事令四年春宋將曹彬米信等侵燕上親征阿穆爾為都監屢破敵軍十二年行在多盜阿穆爾立禁捕法盜始息先是叛逆之家兄弟不知情者亦連坐阿穆爾諌曰夫兄弟雖曰同胞賦性各異一行逆謀雖不與知輒坐以法是刑及無罪也自今雖同居兄弟不知情者免連坐太后嘉納著為令致仕卒阿穆爾性好聚斂每從征所掠人口聚而建城請為豐州就以家奴閻貴為刺史時議鄙之子賢格左伊勒希巴論曰景宗之世人望中興豈其勤心庶績而然蓋承穆宗醟虐之餘為善易見亦由羣臣多賢左右弼諧之力也室昉進無逸之篇郭襲陳諌獵之疏阿穆爾請免同氣之坐所謂仁人之言其利博哉賢適忠介亦近世之名臣紐哩貪猥後人所當取鑑者也遼史卷七十九遼史卷七十九考證耶律賢適傳保寧三年為西北路兵馬都部署按景宗紀作西北路招討使耶律賢適傳大丞相髙勲按髙勲傳祗為南面樞宻使未嘗為丞相紐哩傳為習馬小底原本訛不底据百官志承應小底局凡十二職葢倣宋制今改遼史卷七十九考證
