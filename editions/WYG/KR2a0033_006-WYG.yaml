body:
  text: 遼史卷六元中書右丞相總裁托克托等修本紀第六穆宗穆宗孝安敬正皇帝諱璟小字舒嚕太宗皇帝長子母曰靖安皇后蕭氏㑹同二年封夀安王天禄五年九月癸亥世宗遇害逆臣察克等伏誅丁夘即皇帝位羣臣上尊號曰天順皇帝改元應厯戊辰如南京是月遣劉承訓告哀于漢冬十一月漢周南唐各遣使來弔乙亥詔朝會依嗣聖皇帝故事用漢禮十二月甲辰漢遣使獻弓矢鞍馬壬子鐡驪布古徳皆來貢二年春正月戊午朔南唐遣使奉蠟丸書進犀兕甲萬屬壬戌太尉和爾郭勒濟謀逆誅二月癸卯女直來貢三月癸亥南唐遣使奉蠟丸書丁夘復遣使來貢甲申以耶律塔拉為南院大王夏四月丙戌朔日有食之己亥鐡驪進鷹鶻五月丙辰朔視朝壬午南唐遣使來貢六月壬辰國舅政事令蕭默赫特宣政殿學士李澣等謀南奔事覺詔暴其罪乙未祭天地壬寅漢為周所侵遣使求援命中臺省右相高模翰赴之丁未命乳媪之兄赫嚕世為阿克蘇錫林額爾竒木秋七月乙亥政事令隆科林牙迪里侍中紳圖郎君哈里等謀亂誅八月己丑默赫特隆科等伏誅杖李澣而釋之九月甲寅朔雲州進嘉禾四莖二穗戊午詔以先平察克日用白黒羊𤣥酒祭天歳以為常壬戌獵炭山祭天庚辰徳哷部來貢冬十月甲申朔漢遣使進葡萄酒甲午司徒隆科等獻白雉戊申回鶻及哈噶斯皆遣使來貢十一月癸丑朔視朝己巳地震己夘日南至始用舊制行拜日禮朔州民進黒兎十二月癸未朔髙模翰及漢兵圍晉州辛夘以生日飯僧釋繫囚甲辰獵于近郊祀天地辛亥明王安端薨三年春閏正月壬午朔漢以髙模翰却周軍遣使来謝二月辛亥朔詔用嗣聖皇帝舊璽甲子太保迪里修易州城鎮州以兵來挑戰却之三月庚辰朔南唐遣使來貢因附書于漢詔達之庚寅如應州擊鞠丁酉漢遣使進毬衣及馬庚子觀魚于神徳湖夏四月庚申鐵驪來貢五月壬寅漢遣使言石晉樹先帝聖徳神功碑為周人所毁請再刻許之六月丁夘應天皇太后崩秋七月不視朝八月壬子以生日釋囚己未漢遣使求援三河烏爾古吐蕃吐谷渾布古徳遣使來貢九月庚子漢遣使貢藥冬十月己酉命太師唐古特治大行皇太后園陵魯呼子完郎君扎幹迪里謀反事覺辭逮太平王雅斯哈林牙華格郎君錫倫等皆執之十一月辛丑諡皇太后曰貞烈葬祖陵漢遣使來㑹冬駐驆奉聖州以南京水詔免今歳租四年春正月戊寅回鶻來貢己丑華格扎幹等伏誅完及雅斯哈皆釋之是月周主威殂養子晉王柴榮嗣立二月丙午朔周攻漢命政事令耶律達魯援之丙辰漢遣使進茶藥幸南京夏五月乙丑忻代二州叛漢遣南院大王塔拉助達魯討之丁酉塔拉敗周將符彦卿扵忻口六月癸亥塔拉獻所獲秋七月乙酉漢民有為遼軍誤掠者遣使來請詔悉歸之九月丙申漢為周人所侵遣使來告冬十一月彰國軍節度使蕭迪里太保許從贇奏忻代二州㨗十二月辛酉朔謁祖陵庚午漢遣使來貢是冬駐蹕杏􅢩五年春正月辛未朔布古徳來貢二月庚子朔日有食之庚申漢遣使請上尊號不許壬戌如褭潭夏四月己酉周侵漢漢遣使求援癸丑命郎君蕭哈里世為北府宰相秋九月庚辰漢主有疾遣使來告冬十月壬申女直來貢丁亥謁太宗廟庚寅南唐遣使來貢十一月乙未朔漢主崇殂子承鈞遣使來告且求嗣立遣使弔祭遂封冊之十二月乙丑朔謁太祖廟辛巳漢遣使來議軍事六年夏五月丁酉謁懐陵六月甲子漢遣使來議軍事秋七月不視朝九月戊午謁祖陵冬十一月壬寅布古徳来貢十二月己未朔謁太祖廟七年春正月庚子布古徳来貢二月辛酉南唐遣使奉蠟九書辛未駐驆潢河夏四月戊午朔還上京初女巫肖古上延年藥方當用男子膽和之不數年殺人甚多至是覺其妄辛巳射殺之五月辛夘漢遣使来貢六月丙辰周遣使来聘南唐遣使來貢八月己未周遣使来聘是秋不聴政冬十月庚申獵于七鷹山十二月丁巳詔大臣曰有罪者法當刑朕或肆怒濫及無辜卿等切諫無或面従辛巳還上京八年春二月乙丑駐蹕潢河夏四月甲寅南京留守蕭思温攻下㳂邊州縣遣人勞之五月周陷束城縣六月辛未蕭思温請益兵乞駕幸燕秋七月獵于伊喇山迄于九月射鹿諸山不視朝冬十一月辛酉漢遣使来告周復来侵乙丑使再至十二月庚辰又至九年春正月戊辰駐蹕潢河夏四月丙戌周来侵戊戌以南京留守蕭思温為兵馬都總管擊之是月周㧞益津瓦橋淤口三闗五月乙巳朔陷瀛莫二州癸夘如南京辛未周兵退六月乙亥朔視朝戊寅復容城縣庚申西幸如懐州是月周主榮殂子宗訓立秋七月發南京軍戍范陽冬十二月戊寅還上京庚辰王子迪里前宣徽使哈斯蕭達爾罕等謀反事覺鞫之辛巳祀天地祖考告逆黨事敗丙申召羣臣議時政十年春正月周殿前都㸃檢趙匡𦙍廢周自立建國號宋夏五月乙巳謁懐陵壬子漢以潞州歸附来告丙寅至自懐陵六月庚申漢以宋兵圍石州来告遣大同軍節度使阿拉率四部往援詔蕭思温以三部兵助之秋七月己亥朔宋兵陷石州潞州復叛漢使来告辛酉政事令耶律夀逺太保綽卜鄂博等謀反伏誅以酒脯祀天地于黑山八月如秋山幸懐州庚午以鎮茵石狻猊擊殺近侍古哥冬十月丙子魯呼子喜隐謀反辭連魯呼下獄死十一月哈斯獄中上書陳便宜十一年春二月丙寅釋喜隠辛亥司徒烏埒濟子特爾格誣告其父謀反復詐乗傳及殺行人以其父請杖而釋之丙辰蕭思温奏老人星見乞行赦宥閏月甲子如潢河夏四月癸巳朔日有食之是月射鹿不視朝五月乙亥司天王白李正等進厯六月甲午赦冬十一月嵗星犯月十二年春正月甲戌夜觀燈二月己丑朔以御史大夫蕭和斯為北院樞宻使賜對衣鞍馬夏五月庚午以旱命左右以水相沃頃之果雨六月甲午祠木葉山及潢河秋如黒山赤山射鹿十三年春正月自丁巳晝夜酣飲者九日丙寅宋欲城益津闗命南京留守髙勲統軍使崔延勲以兵擾之癸酉殺獸人哈里二月庚寅漢遣使來告欲巡邉徼乞張聲援壬辰如潢河癸巳觀羣臣射賜物有差乙巳老人星見三月癸丑朔殺鹿人黙爾吉梟其首以示掌鹿者夏四月壬寅獵于潢河五月壬戌烏梁海所進花鹿生麛六月癸未近侍傷獐杖殺之甲申殺獐人哈瑪爾壬辰詔諸路錄囚秋七月辛亥朔漢以宋侵來告乙丑薦時羞於廟八月甲申以生日縱五坊鷹鶻戊戌幸近山呼鹿射之旬有七日而後返九月庚戌朔以青牛白馬祭天地飲于野次終夕乃罷辛亥以酒脯祭天地復終夜酣飲冬十月丙申漢以宋侵來告十一月庚午獵飲于虞人之家凡四日十二月戊子射野鹿賜虞人物有差庚寅殺􅇾人和卓遼史巻六遼史巻六考證穆宗紀一應厯四年周攻漢命政事令耶律達魯援之按資治通鑑稱是年北漢入冦請兵于契丹契丹遣其武定節度使政事令楊衮將萬餘騎如晉陽據此則契丹所遣者楊衮而遼史則為耶律達魯豈達魯本是楊衮而獲賜姓者耶九年夏四月周拔益津瓦橋淤口三關五月乙巳朔䧟瀛莫二州辛未周兵退按資治通鑑周世宗之拔三關得莫州在四月而瀛州之降乃在五月朔其退兵于五月壬子遼史記䧟瀛莫二州于五月朔辛未周兵即退俱有誤遼史巻六考證
