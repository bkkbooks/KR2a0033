body:
  text: 遼史卷三十七元中書右丞相總裁托克托等修志第七地理志一帝堯畫天下為九州舜以冀青地大分幽并營為州十有二幽州在渤碣之間并州北有代朔營州東暨遼海其地負山帯海其民執干戈奮武衛風氣剛勁自古為用武之地太祖以徳哷勒部衆代約尼氏起臨潢建皇都東併渤海得城邑之居百有三太宗立晉有幽涿檀薊順營平蔚朔雲應新媯儒武寰十六州於是割古幽并營之境而跨有之東朝髙麗西臣夏國南子石晉而兄弟趙宋吳越南唐航海輸貢嘻其盛矣遼國其先曰契丹本鮮卑之地居遼澤中去榆關一千一百三十里去幽州又七百一十四里南控黄龍北帯潢水冷陘屏右遼河塹左髙原多榆柳下濕饒蒲葦在元魏時有地數百里至唐達呼哩氏蠶食扶餘室韋奚靺鞨地方二千餘里當貞觀三年以其地置𤣥州尋置松漠都督府建八部為州置刺史徳濟部曰峭落州赫伯部曰彈汗州都呼部曰無逢州芳阿部曰羽陵州圖勒彬部曰日連州芮奚部曰徒河州卓津部曰萬丹州富部曰匹黎赤山二州以逹呼哩氏庫克為使持節十州軍事分州建官昉此迨五代闢地東西三千里約尼氏更八部曰達爾扎部伊斯琿部舍琿部諾爾威部婆摩部訥古濟部濟勒錦部實衮部屬縣四十有一毎部設刺史縣置令太宗以皇都為上京升幽州為南京改南京為東京聖宗城中京興宗升雲州為西京於是五京備焉又以征伐俘户建州襟要之地多因舊居名之加以私奴置投下州總京五府六州軍城百五十有六縣二百有九部族五十有二屬國六十東至于海西至金山暨于流沙北至臚朐河南至白溝幅員萬里上京道上京臨潢府本漢遼東郡西安平之地新莽曰北安平太祖取天梯博囉等三山之勢于葦甸射金齪箭以識之謂之龍眉宫神冊三年城之名曰皇都天顯十三年更名上京府曰臨潢淶流河自西北南流遶京三面東入于曲江其北東流為按春河又有御河沙河黒河潢河鴨子河塔魯河狼河蒼耳河輞子河臚胊河隂涼河瀦河鴛鴦湖興國惠民湖廣濟湖鹽濼百狗濼火神淀馬盂山皃兒山野鵲山鹽山鑿山松山平地松林大斧山列山庫哩山魯塔山唐所封達呼哩氏勒特王墓存焉户三萬六千五百轄軍府州城二十五統縣十臨潢縣太祖天贊初南攻燕薊以所俘人户散居潢水之北縣臨潢水故以名地宜種植户三千五百長泰縣本渤海國長平縣民太祖伐大諲譔先得是邑遷其人於京西北與漢民雜居户四千定霸縣本扶餘府强師縣民太祖下扶餘遷其人於京西與漢人雜處分地耕種統和八年以諸宫提轄司人户置隸長寧宫户三千保和縣本渤海國富利縣民太祖破龍州盡徙富利縣人散居京南統和八年以諸宫提轄司人户置隸彰愍宫户四千潞縣本幽州潞縣民天贊元年太祖破薊州掠潞縣民布於京東與渤海人雜處隸崇徳宫户三千易俗縣本遼東渤海之民太平九年大延琳結構遼東人叛圍守經年乃降盡遷於京北置縣居之是年又徙渤海叛人家屬置焉户一千遷遼縣本遼東諸縣渤海人大延琳叛擇其謀勇者置之左右後以城降戮之徙其家屬於京東北故名户一千渤海縣本東京人因叛徙置興仁縣開泰二年置宣化縣本遼東神化縣民太祖破鴨渌府盡徙其民居京之南統和八年以諸宫提轄司人户置隸彰愍宫户四千上京太祖創業之地負山抱海天險足以為固地沃宜耕植水草便畜牧金齪一箭二百年之基壯矣天顯元年平渤海歸乃展郛郭建宫室名以天贊起三大殿曰開皇安徳五鑾中有歴代帝王御容每月朔望節辰忌日在京文武百官並赴致祭又於内城東南隅建天雄寺奉安烈考宣簡皇帝遺像是歳太祖崩應天皇后於義節寺斷腕寘太祖陵即寺建斷腕樓樹碑焉太宗援立晉遣宰相馮道劉煦等持節具鹵簿法服至此册上太宗及應天皇后尊號太宗詔畨部並依漢制御開皇殿闢承天門受禮因改皇都為上京城髙二丈不設敵樓幅員二十七里門東曰迎春曰鴈兒南曰順陽西曰金鳯曰西鴈兒曰南福其北謂之皇城髙三丈有樓櫓門東曰安東南曰大順西曰乾徳北曰拱辰中有大内内南門曰承天有樓閣東門曰東華西曰西華此通内出入之所正南街東留守司衙次鹽鐡司次南門龍寺街南曰臨潢府其側臨潢縣縣西南崇孝寺承天皇后建寺西長泰縣又西天長觀西南國子監監北孔子廟廟東節義寺又西北安國寺太宗所建寺東齊天皇后故宅宅東有元妃宅即法天皇后所建也其南有聖尼寺綾錦院内省司麴院贍國省司二倉皆在大内西南八作司與天雄寺對南城謂之漢城南當横街各有樓對峙下列井肆東門之北潞縣又東南興仁縣南門之東囬鶻營回鶻商販留居上京置營居之西南同文驛諸國信使居之驛西南臨潢驛以待夏國使驛西福先寺寺西宣化縣西南定霸縣縣西保和縣西門之北易俗縣縣東遷遼縣周廣順中胡嶠記曰上京西樓有邑屋市肆交易無錢而用布有綾錦諸工作宦者翰林伎術教坊角觝儒僧尼道士中國人并汾幽薊為多宋大中祥符九年薛映記曰上京者中京正北八十里至松山舘七十里至崇信舘九十里至廣寧舘五十里至姚家寨舘五十里至咸寧館三十里度潢水石橋旁有饒州唐於契丹嘗置饒樂令渤海人居之五十里保和館度黒水河七十里宣化舘五十里長泰舘舘西二十里有佛舍民居即祖州又四十里至臨潢府自過崇信館乃契丹舊境其南奚地也入西門門曰金徳内有臨潢舘子城東門曰順陽北行至景福門又至承天門内有昭徳宣政二殿與氊廬皆東向臨潢西北二百餘里號涼淀在饅頭山南避暑之處多豐草掘地丈餘即有堅氷祖州天成軍上節度本遼右八部紳穆里地太祖秋獵多於此始置西樓後因建城號祖州以髙祖昭烈皇帝曽祖莊敬皇帝祖考簡獻皇帝皇考宣簡皇帝所生之地故名城髙二丈無敵棚幅員九里門東曰望京南曰大夏西曰液山北曰興國西北隅有内城殿曰兩明奉安祖考御容曰二儀以白金鑄太祖像曰黒龍曰清秘各有太祖㣲時兵仗器物及服御皮毳之類存之以示後嗣使勿忘本内南門曰興聖凡三門上有樓閣東西有角樓東為州廨及諸官廨舍綾錦院班院祗候畨漢渤海三百人供給内府取索東南横街四隅有樓對峙下連市肆東長霸縣西咸寧縣有祖山山有太祖天皇帝廟御靴尚存又有龍門黎谷液山液泉白馬獨石天梯之山水則南沙河西液泉太祖陵鑿山為殿曰明殿殿南嶺有膳堂以備時祭門曰黒龍東偏有聖蹤殿立碑述太祖遊獵之事殿東有樓立碑以紀太祖創業之功皆在州西五里天顯中太宗建隸𢎞義宫統縣二城一長霸縣本龍州長平縣民遷于此户二千咸寧縣本長寧縣破遼陽遷其民置户一千越王城太祖伯父裕悦王實嚕西伐党項吐渾俘其民放牧於此因建城在州東南二十里户一千懐州奉陵軍上節度本唐歸誠州太宗行帳放牧於此天贊中從太祖破扶餘城下龍泉府俘其人築寨居之㑹同中掠燕薊所俘亦置此太宗崩葬西山曰懐陵大同元年世宗置州以奉焉是年有騎十餘獵于祖州西五十里大山中見太宗乗白馬獨追白狐射之一發而斃忽不見但獲狐與矢是日太宗崩于灤城後於其地建廟又於州之鳯凰門繪太宗馳騎貫狐之像穆宗被害葬懐陵側建鳯凰殿以奉焉有清涼殿為行幸避暑之所皆在州西二十里隸永興宫統縣二扶餘縣本龍泉府太宗遷渤海扶餘縣降户於此世宗置縣户一千五百顯理縣本顯理府人太祖伐渤海俘其王大諲譔遷民於此世宗置縣户一千慶州𤣥寧軍上節度本太保山黒河之地巖谷險峻穆宗建城號黒河州毎歳來幸射虎障鷹軍國之事多委大臣後遇弑於此以地苦寒統和八年州廢聖宗秋畋愛其竒秀建號慶州遼國五代祖巴圖貌異常有武略力敵百人衆推為王生于巴圖山因以名没葬山下在州二百里慶雲山本黒嶺也聖宗駐蹕愛羡曰吾萬歳後當葬此興宗遵遺命建永慶陵有望仙殿御容殿置番漢守陵三千户並隸大内都總管司在州西二十里有黒山赤山太保山老翁嶺饅頭山興國湖錫沙濼黒河景福元年復置更隸興聖宫統縣二𤣥徳縣本黒山黒河之地景福元年括落帳人户從便居之户六千孝安縣富義縣本義州太宗遷渤海義州民於此重熙元年降義豐縣後更名隸𢎞義宫泰州徳昌軍節度本契丹二十部族放牧之地因黒䑕族累犯通化州民不能禦遂移東南六百里來建城居之以近本族黒䑕穴居膚黒吻鋭類䑕故以名州隸延慶宫兵事屬東北統軍司統縣二樂康縣倚郭興國縣本山前之民因罪配遞至此興宗置縣户七百長春州韶陽軍下節度本鴨子河春獵之地興宗重熙八年置隸延慶宫兵事屬東北統軍司統縣一長春縣本混同江地燕薊犯罪者流配於此户二千烏州靜安軍刺史本烏丸之地東胡之種也遼北大王布拉占為牧建城後官收隸興聖宫有遼河夜河烏丸川烏丸山統縣一愛民縣布拉王從軍南征俘漢民置于此户一千永州永昌軍觀察承天皇太后所建太祖於此置南樓乾亨三年置州于皇子罕巴墓側東潢河南土河二水合流故號永州冬月牙帳多駐此謂之冬巴納有木葉山上建契丹始祖之廟竒善汗在南廟哈屯在北廟繪塑二聖并八子神像相傳有神人乗白馬自馬盂山浮土河而東有天女駕青牛車由平地松林泛潢河而下至木葉山二水合流相遇為配偶生八子其後族屬漸盛分為八部毎行軍及春秋時祭必用白馬青牛示不忘本云興王寺有白衣觀音像太祖援石晉主中國自潞州迴入幽州幸大悲閣指此像曰我夢神人令送石郎為中國帝即此也因移木葉山建廟春秋告賽尊為家神興軍必告之乃合符傳箭於諸部又有髙淀山栁林淀亦曰馬淀隸彰愍宫統縣三長寧縣本顯徳府縣名太祖平渤海遷其民於此户四千五百義豐縣本鐡利府義州遼兵破之遷其民於南樓之西北仍名義州重煕元年廢州改今縣在州西北一百里又嘗改富義縣屬慶州始末不可具考今兩存之户一千五百慈仁縣太宗以皇子濟色古勒亡置慈州墳西重熙元年州廢改今縣户四百儀坤州啟聖軍節度本契丹右大部地應天皇后建州回鶻諾蘇居之至四世孫庸安穆嚕生應天皇后舒嚕氏適太祖太祖開拓四方平渤海后有力焉俘掠有伎藝者多歸帳下謂之舒新以所生之地置州州建啟聖院中為儀寧殿太祖天皇帝應天地皇后銀像在焉隸長寧宫統縣一廣義縣本回鶻部牧地應天皇后以四征所俘居之因建州縣統和八年以諸宫提轄司户置來逺縣十三年併入户二千五百龍化州興國軍下節度本漢北安平縣地契丹始祖竒善汗居於此稱龍庭太祖建東樓唐天復二年太祖為徳哷勒部額爾竒木破代北遷其民建城居之明年伐女直俘數百戸實焉天祜元年増修東城制度頗壯麗十三年太祖於城東金鈴岡受尊號曰大聖大明天皇帝建元神册天顯元年崩于東樓太宗升節度隷彰愍宫兵事屬北路女直兵馬司刺史州一未詳統縣一龍化縣太祖東伐女直南掠燕薊所俘建城置邑戸一千降聖州開國軍下刺史本大部落東樓之地太祖春月行帳多駐此應天皇后夢神人金冠素服執兵仗貌甚丰美異獸十二隨之中有黒兎躍入后懐因而有娠遂生太宗時黒雲覆帳火光照室有聲如雷諸部異之穆宗建州四面各三十里禁樵採放牧先屬延昌宫後隸彰愍宫統縣一永安縣本龍原府慶州縣名太祖平渤海破懐州之永安遷其人置寨於此建縣户八百饒州匡義軍中節度本唐饒樂府地貞觀中置松漠府太祖完葺故壘有潢河長水濼穆丹河青山大福山松山隸延慶宫統縣三長樂縣木遼城縣名太祖伐渤海遷其民建縣居之户四千内一千户納鐡臨河縣本永豐縣人太宗分兵伐渤海遷於潢水之曲户一千安民縣太宗以渤海諸邑所俘雜置户一千頭下軍州皆諸王外戚大臣及諸部從征俘掠或置生口各團集建州縣以居之横帳諸王國舅公主許創立州城自餘不得建城郭朝廷賜州縣額其節度使朝廷命之刺史以下皆以本主部曲充焉官位九品之下及井邑商賈之家征税各歸頭下唯酒税課納上京鹽鐡司徽州宣徳軍節度景宗女秦晉大長公主所建媵臣萬户在宜州之北二百里因建州城北至上京七百里節度使以下皆公主府署户一萬成州長慶軍節度聖宗女晉國長公主以上賜媵臣户置在宜州北一百六十里因建州城北至上京七百四十里户四千懿州廣順軍節度聖宗女燕國長公主以上賜媵臣户置在顯州東北三百里因建州城西北至上京八百里户四千渭州髙陽軍節度駙馬都尉蕭昌裔建尚秦國王隆慶女韓國長公主以所賜媵臣建州城顯州東北二百五十里遼制皇子嫡生者其女與帝女同户一千壕州國舅宰相南征俘掠漢民居遼東西安平縣故地在顯州東北二百二十里西北至上京七百二十里户六千原州本遼東北安平縣地顯州東北三百里國舅金徳俘掠漢民建城西北至上京八百里户五百福州國舅蕭寧建南征俘掠漢民居北安平縣故地在原州北二十里西北至上京七百八十里户三百横州國舅蕭克忠建部下牧人居漢故遼陽縣地因置州城在遼州西北九十里西北至上京七百二十里有横山户二百鳯州果囉國故地渤海之安寧郡境南王府五帳分地在韓州北二百里西北至上京九百里户四千遂州本髙州地南王府五帳放牧於此在檀州西二百里西北至上京一千里户五百豐州本遼澤大部落約尼氏僧隱牧地北至上京三百五十里户五百順州本遼隊縣地横帳南王府俘掠燕薊順州之民建城居之在顯州東北一百二十里西北至上京九百里户一千閭州羅古王牧地近醫巫閭山在遼州西一百三十里西北至上京九百五十里户一千松山州本遼澤大部落横帳布庫王牧地有松山北至上京一百七十里户五百豫州横帳陳王牧地南至上京三百里户五百寧州本達呼哩氏勒特山横帳固寧王牧地在豫州東八十里西南至上京三百五十里户三百邉防城遼國西北界防邉城因屯戍而立務據形勝不資丁賦具列如左靜州觀察本泰州之金山天慶六年升鎮州建安軍節度本古哈屯城統和二十二年皇太妃奏置選諸部族二萬餘騎充屯軍專捍禦室韋伊濟等國凡有征討不得抽移渤海女直漢人配流之家七百餘户分居鎮防維二州東南至上京三千餘里維州刺史防州刺史河董城本回鶻哈屯城語訛為河董城乆廢遼人完之以防邉患髙州界女直常為盜刼掠行旅遷其族於此東南至上京一千七百里靜邉城本契丹二十部族水草地北隣伊濟每入為盜建城置兵千餘騎防之東南至上京一千五百里皮被河城地控北邉置兵五百於此防托皮被河出回紇北東南經伊濟入臚朐河沿河董城北東流合沱漉河入于海南至上京一千五百里招州綏逺軍刺史開泰三年以女直户置隸西北路招討司塔哩珠城太康九年置在臚朐河遼史卷三十七
