  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_056-1a, image: WYG0289/WYG0289-0445c.png}
body:
  text: 遼史卷五十六元中書右丞相總裁托克托等修志第二十五儀衞志二國服上古之人網罟禽獸食肉衣皮以儷鹿韋掩前後謂之鞸然後夏葛冬裘之製興焉周公陳王業七月之詩至於一日于貉三月條桑八月載績公私之用由是出矣契丹轉居薦草之間去邃古之風猶未逺也太祖仲父蘇哷以約尼氏裕悦之官占居潢河決壤始置城邑為樹藝桑麻組織之教有遼王業之隆亦其肇迹於此乎太祖帝北方太宗制中國紫銀之䑕羅綺之篚載而至纎麗耎毳被土綢木於是定衣冠之制北班國制南班漢制各從其便焉詳國服以著厥始云祭服遼國以祭山為大禮服飾尤盛大祀皇帝服金文金冠白綾袍紅帶縣魚三山紅垂飾犀玉刀錯絡縫烏鞾小祀皇帝硬㡌紅緙絲龜文袍皇后戴紅帕服絡縫紅袍縣玉佩雙同心帕絡縫烏鞾臣僚命婦服飾各從本部旗幟之色朝服太祖丙寅嵗即皇帝位朝服衷甲以備非常其後行色克色哩禮大射栁即此服統和元年冊承天皇太后給三品以上用漢法服三品以下用大射栁之服皇帝服實魯衮冠絡縫紅袍垂飾犀玉帶錯絡縫鞾謂之國服衮冕太宗更以錦袍金帶臣僚戴氈冠金花為飾或加珠玉翠毛額後垂金花織成夾帶中貯髮一總或紗冠制如烏紗㡌無簷不擫雙耳額前綴金花上結紫帶末綴珠服紫窄袍繫䩞鞢帶以黄紅色絛裹革為之用金玉水晶靛石綴飾謂之盤紫太宗更以錦袍金帶㑹同元年羣臣高年有爵秩者皆賜之公服謂之展裹著紫興宗重熙二十二年詔八房族巾幘道宗清寧元年詔非勲戚之後及額爾竒木副使并承應有職事人不帶巾皇帝紫皂幅巾紫窄袍玉束帶或衣紅襖臣僚亦幅巾紫衣常服宰相中謝儀帝常服高麗使者入見儀臣僚便衣謂之盤裹緑花窄袍中單多紅緑色貴者披貂裘以紫黒色為貴青次之又有銀䑕尤潔白賤者貂毛羊䑕沙狐裘田獵服皇帝幅金擐甲戎裝以貂䑕或鵝項鴨頭為扞腰番漢諸司使以上並戎裝衣皆左袵黒緑色弔服太祖叛弟埓克等降素服受之素服乗赭白馬漢服黄帝始制冕冠章服後王以祀以祭以享唐收殷哻周弁以朝冠端以居所以别尊卑辨儀物也厥後唐以冕冠青衣為祭服通天絳袍為朝服平巾幘袍襴為常服大同元年正月朔太宗皇帝入晉備法駕受文武百官賀于汴京崇元殿自是日以為常是年北歸唐晉文物遼則用之左右采訂摭其常用者存諸篇祭服終遼之世郊丘不建大裘冕服不書衮冕祭祀宗廟遣上將出征飲至踐阼加元服納后若元日受朝則服之金飾垂白珠十二旒以組為纓色如其綬黈纊充耳玉簪𨗳𤣥衣纁裳十二章八章在衣日月星龍華蟲火山宗彛四章在裳藻粉米黼黻衣褾領為升龍織成文各為六等龍山以下毎章一行行十二白紗中單黻領青褾襈裾韍革帶大帶劍佩綬舄加金飾元日朝㑹儀皇帝服衮冕朝服乾亨五年聖宗冊承天太后給三品以上法服雜禮冊承天太后儀侍中就席解劍脱履重熙五年尊號冊禮皇帝服龍衮北南臣僚並朝服蓋遼制㑹同中太后北面臣僚國服皇帝南面臣僚漢服乾亨以後大禮雖北面三品以上亦用漢服重熙以後大禮並漢服矣常朝仍遵㑹同之制皇帝通天冠諸祭還及冬至朔日受朝臨軒拜王公元㑹冬㑹服之冠加金博山附蟬十二首施珠翠黒介幘髪纓翠緌玉若犀簪𨗳絳紗袍白紗中單褾領朱襈裾白裙襦絳蔽膝白假帶方心曲領其革帶佩劒綬韈舄若未加元服則雙童髻空頂黒介幘雙玉導加寶飾元日上壽儀皇帝服通天冠絳紗袍皇太子逺遊冠謁廟還宫元日冬至朔日入朝服之三梁冠加金附蟬九首施珠翠黒介幘髮纓翠緌犀簪導絳紗袍白紗中單皂領褾襈裾白裙襦白假帶方心曲領絳紗蔽膝其革帶劒佩綬韈舄與上同後改用白韈黒舄未冠則雙童髻空頂黑介幘雙玉導加寳飾冊皇太子儀皇太子冠逺遊服絳紗袍親王逺逰冠陪祭朝饗拜表大事服之冠三梁加金附蟬黑介幘青緌簪𨗳絳紗單衣白紗中單皂領襈裾白裙襦革帶鈎䚢假帶曲領方心絳紗蔽膝韈舄劒佩綬二品以上同諸王逺遊冠三梁黑介幘青緌三品以上進賢冠三梁寶飾五品以上進賢冠二梁金飾九品以上進賢冠一梁無飾七品以上去劔佩綬八品以下同公服公服勘箭儀閤使公服繫履遼國常用公服矣皇帝翼善冠朔視朝用之柘黄袍九環帶白練裙襦六合鞾皇太子逺遊冠五日常朝元日冬至受朝服絳紗單衣白裙襦革帶金鈎䚢假帶方心紛鞶囊白韈烏皮履一品以下五品以上冠幘纓簪𨗳謁見東宫及餘公事服之絳紗單衣白裙襦帶鈎䚢假帶方心韈履紛鞶囊六品以下冠幘纓簪𨗳去紛鞶囊餘並同常服遼國謂之穿執起居禮臣僚穿執言穿鞾執笏也皇帝柘黄袍衫折上頭巾九環帶六合鞾起自宇文氏唐太宗貞觀已後非元日冬至受朝及大祭祀皆常服而已皇太子進徳冠九琪金飾絳紗單衣白裙襦白韈烏皮履五品以上幞頭亦曰折上巾紫袍牙笏金玉帶文官佩手巾算袋刀子礪石金魚袋武官䩞鞢七事佩刀刀子礪石契苾真噦厥針筒火石袋烏皮六合鞾六品以下幞頭緋衣木笏銀帶魚袋佩鞾同八品九品幞頭緑袍鍮石帶鞾同遼史卷五十六遼史卷五十六考證太祖叛弟埓克等埓克舊作剌葛此又作剌哥今畫一改遼史卷五十六考證
