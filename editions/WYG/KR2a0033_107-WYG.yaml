body:
  text: 遼史卷一百七元中書右丞相總裁托克托等修列傳第三十七列女男女居室人之大倫與其得烈女不若得賢女天下而有烈女之名非幸也詩讚衛共姜春秋褒宋伯姬葢不得已所以重人倫之變也遼據北方風化視中土為疎終遼之世得賢女二烈女三以見人心之天理有不與世道存亡者邢簡妻陳氏營州人父陘五代時累官司徒陳氏甫笄涉通經義凡覽詩賦輒能誦尤好吟咏時以女秀才名之年二十歸於簡孝舅姑閨門和睦親黨推重有六子陳氏親教以經後二子抱朴抱質皆以賢位宰相統和十二年卒睿智皇后聞之嗟悼贈魯國夫人刻石以表其行及遷祔遣使以祭論者謂貞静柔順婦道母儀始終無歉云耶律氏太師達魯之妹小字常格㓜爽秀有成人風及長操行修潔自誓不嫁能詩文不苟作讀通厯見前人得失厯能品藻咸雍間作文以述時政其略曰君以民為體民以君為心人主當任忠賢人臣當去比周則政化平隂陽順欲懷逺則崇恩尚徳欲强國則輕徭薄賦四端五典為治教之本六府三事實生民之命淫侈可以為戒勤儉可以為師錯枉則人不敢詐顯忠則人不敢欺勿泥空門崇飾土木勿事邊鄙妄費金帛滿當思溢安必慮危刑罰當罪則民勸善不寳逺物則賢者至建萬世盤石之業制諸部强横之心欲率下則先正身欲治逺則始朝廷上稱善時樞密使耶律伊遜愛其才屢求詩常格遺以回文伊遜知其諷己銜之太康三年皇太子坐事伊遜誣以罪按無跡獲免㑹兄達魯謫鎮州常格與俱甞布衣蔬食人問曰何自苦如此對曰皇儲無罪遭廢我輩豈可美食安寢及太子被害不勝哀痛年七十卒于家耶律努妻蕭氏小字意辛國舅駙馬都尉托斯和之女母呼敦公主意辛美姿容年二十適努事親睦族以孝謹聞甞與娣姒㑹爭言厭魅以取夫寵意辛曰厭魅不若禮法衆問其故意辛曰修己以潔奉長以敬事夫以柔撫下以寛毋使君子見其輕易此之謂禮法自然取重於夫以厭魅獲寵獨不愧于心乎聞者大慙初努與樞密使伊遜有隙及皇太子廢被誣奪爵没入興聖宫流烏爾古部上以章辛公主女欲使絶婚意辛辭曰陛下以妾葭莩之親使免流竄實天地之恩然夫婦之義生死以之妾自笄年從努一旦臨難頓爾乖離背綱常之道於禽獸何異幸陛下哀憐與努俱行妾即死無恨帝感其言從之意辛久在貶所親執役事雖勞無難色事夫禮敬有加于舊夀隆中上書乞子孫為著帳郎君帝嘉其節召舉家還子國隠乾統間始仕保大中意辛在臨漢謂諸子曰吾度盧彦倫必叛汝輩速避我當死之賊至遇害耶律珠展妻蕭氏小字額勒本國舅貝勒之女性端慤有容色自㓜與他女異年十八歸珠展謹裕貞婉娣姒推尊之及居珠展喪極哀毁既𦵏謂所親曰夫婦之道如隂陽表裏無陽則隂不能立無表則裏無所附妾今不幸失所天且生必有死理之自然珠展早歳登朝有才不夀天禍妾身罹此酷罰復何依恃儻死者可見則從不可見則當與俱侍婢慰勉竟無回意自刅而卒耶律中妻蕭氏小字綏蘭韓國王惠之四世孫聰慧謹愿年二十歸於中事夫敬順親戚咸譽其徳中甞謂曰汝可粗知書以前貞淑為鑑遂發心誦習多涉古今天慶中為賊所執潛置刅於履誓曰人欲汙我者即死之至夜賊遁而免久之帝召中為五院都監中謂妻曰吾本無宦情今不能免我當以死報國汝能從我乎綏蘭對曰謹奉教及金兵徇地嶺西盡徙其民中守節死綏蘭悲戚不形於外人怪之俄躍馬突出至中死所自殺論曰陳氏以經教二子並為賢相耶律氏自潔不嫁居閨閫之内而不忘忠其君非賢而能之乎三蕭氏之節雖烈丈夫有不能者矣遼史卷一百七
