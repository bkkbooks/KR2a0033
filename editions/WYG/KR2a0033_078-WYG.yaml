body:
  text: 遼史卷七十八元中書右丞相總裁托克托等修列傳第八耶律伊勒哈蕭哈里蕭和斯蕭思温蕭繼先耶律伊勒哈字蘇色本宫分人檢校太師赫嚕之子應厯初以父任入侍數歲始為殿前都㸃檢時上新即位疑諸王有異志引伊勒哈為布衣交一切機密事必與之謀遷寄班都知賜宫戸時上酗酒數以細故殺人有監雉者因傷雉而亡獲之欲誅伊勒哈諫曰是罪不應死帝竟殺之以屍付伊勒哈曰收汝故人伊勒哈終不為止復有監鹿詳衮亡一鹿下獄當死伊勒哈又諌曰人命至重豈可為一獸殺之良久得免遼法麚岐角者惟天子得射㑹秋獵善為鹿鳴者呼一麚至命伊勒哈射應弦而踣上大悦賜金銀各百兩名馬百匹及黒山東穆辰之地後穆宗被弑坐守衞不嚴被誅蕭哈里字伊徳森其先約尼氏時本部額爾竒木父塔喇天顯間為本部令公哈里貎魁偉膂力過人天禄間娶明王安圖女阿雅翁主應厯初察克亂阿雅連坐繼娶綽哈公主上以近戚嘉其勤篤命預北府宰相選頃之總知軍國事時諸王多坐反逆哈里為人亷謹逹政體每被命案獄多得其情人無寃者繇是知名漢主劉承鈞每遣使入貢必别致幣物詔許受之年五十卒帝愍悼輟朝二日蕭和斯字延寜世為北院吏累遷御史中丞總典羣牧部籍應厯初遷左客省使未幾拜御史大夫時諸王多坐事繫獄上以和斯有才幹詔窮治稱㫖改北院樞密使仍命世預宰相選和斯辭曰臣子孫賢否未知得一客省使足矣從之上晩歲酗酒用刑多濫和斯居要地􅐅􅐅自保未嘗一言匡救議者以是少之年五十七卒蕭思温小字伊庫宰相達魯之族弟哈瑪爾之子通書史太宗時為奚圖哩太尉尚燕國公主為羣牧都林牙思温在軍中握齱修邉幅僚佐皆言非將師才尋為南京留守初周人攻揚州上遣思温躡其後憚暑不敢進㧞緣邊數城而還後周師來侵圍馮母鎮勢甚張思温請益兵帝報曰敵來則與統軍司併兵拒之敵去則務農作勿勞士馬會敵入東城我軍退渡滹沱而屯思温勒兵徐行周軍數日不動思温與諸將議曰敵衆而鋭戰不利則有後患不如頓兵以老其師躡而擊之可以必勝諸將從之遂與統軍司兵會飾他説請濟師周人引退思温亦還已而周主復北侵與其將傅元卿李崇進等分道竝進圍瀛州䧟益津瓦橋淤口三闗垂迫固安思温不知計所出但云車駕旦夕至麾下士奮躍請戰不從已而䧟易瀛莫等州京齊人皆震駭往往遁入西山思温以邊防失利恐朝廷罪已表請親征會周主榮以病歸思温退至益津偽言不知所在遇歩卒二千餘人來拒敗之是年聞周喪燕民始安乃班師時穆宗湎酒嗜殺思温以密戚預政無所匡輔士論不與十九年春蒐上射熊而中思温與伊勒希巴伊勒希等進酒上壽帝醉還宫是夜為庖人錫衮等所弑思温與南院樞密使髙勲飛龍使紐哩等立景宗保寜初為北院樞密使兼北府宰相仍命世預其選上冊思温女為后加尚書令封魏王從帝獵閭山為賊所害蕭繼先字楊隱小字瑠智格㓜頴悟叔思温命為子睿智皇后尤愛之乾亨初尚齊國公主拜駙馬都尉統和四年宋人來侵繼先率邏騎逆境上多所俘獲上嘉之拜北府宰相自是出師繼先必將本府兵先從拔狼山石壘從破宋軍應州上南征取通利軍戰稱㨗力及親征髙麗以繼先年老留守上京卒年五十八繼先雖處富貴尚儉素所至以善治稱故將兵攻戰未嘗失利名重戚里論曰嗚呼人君之過莫大於殺無辜湯之伐桀也數其罪曰竝告無辜於上下神祗武王之伐紂也數其罪曰無辜籲天堯之伐苗民也吕侯追數其罪曰殺戮無辜迹是言之伊勒哈之諫廩廩庶幾古君子之風矣雖然善諫者不諫於己然蓋必先得於心術之微而察脉者先其病而治之則易為功穆宗沈湎失徳蓋其資富彊之勢以自肆久矣使羣臣於造次動作之際此諫彼諍提而警之以防其甚則亦詎至是哉于以知和斯思温處位優重耽禄取容真鄙夫矣若哈里之折獄繼先之善治可謂任職臣歟遼史卷七十八遼史卷七十八考證蕭哈里傳繼尚綽哈公主按公主表綽果係太宗女原本訛翁主今改蕭思温傳會敵入東城按穆宗紀應厯八年周䧟束城縣宋史束城縣𨽻河間府傳謂東城疑即束城之訛本史地理志不載姑仍其舊蕭思温傳周將李崇進等分道並進按李崇進通鑑作重進蕭思温傳庖人錫衮按錫衮原文辛古此又作斯奴古今併改蕭思温傳為賊所害按髙勲及紐哩傳盜殺思温實係二人之謀景宗時追封思温楚國王傳俱不載蕭繼先傳按蕭繼先聖宗本紀俱作蕭繼逺事跡與本傳俱同外戚傳公主表及本傳俱作繼先葢繼先實嗣思温為後或曽更名故紀載互異遼史卷七十八考證
