body:
  text: 遼史卷十五元中書右丞相總裁托克托等修本紀第十五聖宗六二十八年春正月辛亥朔不受賀甲寅如乾陵癸酉奉安大行皇太后梓宮于乾州菆塗殿二月丙戌宋遣王隨王儒等來弔祭己亥髙麗遣魏守愚等來祭是月遣左龍虎衛上將軍蕭和卓饋大行皇太后遺物于宋仍遣臨海軍節度使蕭虚列左領軍衛上將軍張崇濟謝宋弔祭三月癸卯上大行皇太后諡為聖神宣獻皇后是月宋髙麗遣使來㑹葬夏四月甲子葬太后於乾陵賜大丞相耶律徳昌名曰隆運庚午賜宅及陪葬地五月己卯朔如中京辛卯清暑七金山乙巳西北路招討使蕭托雲奏伐甘州回鶻破肅州盡俘其民詔修土隗口故城以實之丙午髙麗西京留守康肇弑其王誦擅立誦從兄詢詔諸道繕甲兵以備東征秋八月戊申振平州饑民辛亥幸中京丙寅謁顯乾二陵丁夘自將伐髙麗遣使報宋以皇弟楚國王隆祐留守京師北府宰相駙馬都尉蕭巴雅爾為都統林牙索諾木為都監九月乙酉遣使冊西平王李徳昭為夏國王辛卯遣樞密直學士髙正引進使韓杞宣問髙麗王詢冬十月丙午朔女直進良馬萬匹乞從征髙麗許之王詢遣使奉表乞罷師不許十一月乙酉大軍渡鴨渌江康肇拒戰敗之退保銅州丙戌肇復出右皮室詳衮耶律達魯擒肇及副將李立追殺數十里獲所棄糧餉鎧仗戊子銅霍貴寧等州降巴雅爾至努克特嶺遇敵兵戰敗之辛卯王詢遣使上表請朝許之禁軍士俘掠以政事舎人馬保佑為開京留守安州圑練使旺布為副留守遣太子太師伊林將騎兵一千送保佑等赴京壬辰守將卓思正殺遼使者韓喜孫等十人領兵出拒保佑等還遣伊林領兵擊之思正遂奔西京圍之五日不克駐蹕城西髙麗禮部郎中渤海托實來降庚子遣巴雅爾博諾攻開京遇髙麗兵敗之王詢棄城遁去遂焚開京至清江還二十九年春正月乙亥朔班師所降諸城復叛至貴徳州南嶺谷大雨連日馬駞皆疲甲仗多遺棄霽乃得渡己丑次鴨渌江庚寅皇后及皇弟楚國王隆祐迎于來逺城壬辰詔罷諸軍己亥次東京二月己酉謁乾顯二陵戊午所俘髙麗人分置諸陵廟餘賜内戚大臣三月己卯大丞相晉國王耶律隆運薨庚辰皇弟楚國王隆祐權知北院樞密使事樞密直學士髙正為北院樞密副使庚寅南京平州水振之己亥以北院大王耶律舒嚕為北院樞密使封韓王北院郎君耶律世良為北院大王前三司使劉慎行參知政事兼知南院樞密使事夏四月清暑老古堝五月甲戌朔詔已奏之事送所司附日厯又詔帳族有罪黥墨依諸部人例乙未以劉慎行為南院樞密使南府宰相邢抱質知南院樞密使事六月庚戌升蔚州知州為觀察使乙卯韓王耶律舒嚕薨丙辰以南院大王華格為北院樞密使丁巳詔西北路招討使駙馬都尉蕭托雲安撫西鄙置準布諸部節度使是秋獵于平地松林冬十月庚子駐蹕廣平淀甲寅贈大丞相晉國王耶律隆運尚書令諡文忠十一月庚午朔幸顯州十二月庚子復如廣平淀癸丑以知南院樞密使事邢抱質年老詔乗小車入朝是月置歸寧二州是年御試放髙承顔等二人及第開㤗元年春正月己巳朔宋遣趙湘符成翰來賀癸未長白山三十部女直酋長來貢乞授爵秩甲申駐蹕王子院丙戌望祠木葉山丁亥女直太保佛寧等來朝戊子獵于瑪哈拉林庚寅祠木葉山辛卯哈斯罕大王呼勒希來朝二月壬子駐蹕瑞鹿原三月甲戌以蔚州為觀察不隸武定軍乙亥如葦濼丁丑詔封皇女八人為郡主乙酉詔卜日行拜山大射栁之禮命北宰相駙馬蘭陵郡王蕭寧樞密使司空邢抱質督有司具儀物丁亥皇弟楚國王隆祐徙封齊國王留守東京夏四月庚子髙麗遣蔡忠順來乞稱臣如舊詔王詢親朝壬寅夏國遣使進良馬己酉祀風伯辛酉以前孟父房詳衮蕭佛努為左伊勒希巴五月戊辰還上京詔裴𤣥感邢祥知禮部貢舉放進士史簡等十九人及第以駙馬蕭紹宗為鄭州防禦使乙亥以邢抱質為大同軍節度使六月駐蹕上京七月丙子以耶律遂貞為遼興軍節度使遂正北院宣徽使張昭瑩南院宣徽使耶律受益上京副留守宼卿彰徳軍節度使命耶律釋紳努李操充賀宋國生辰信使副蕭尼古齊泰賀宋正旦使副進士康文昭張素臣郎𤣥達坐論知貢舉裴𤣥感邢祥私曲秘書省正字李萬上書辭涉怨訕皆杖而徙之萬役陷河冶八月丙申鐵驪納蘇等送烏舍百餘戸至賔州賜絲絹是日納蘇乞賜佛像儒書詔賜䕶國仁王佛像一易詩書春秋禮記各一部已未髙麗王詢遣田拱之奉表稱病不能朝詔復取六州地是月齊國王隆祐薨輟朝五日冬十月辛亥如中京閏月丁卯贈隆祐守太師諡仁孝十月甲午朔文武百官加上尊號曰𢎞文宣武尊道至徳崇仁廣孝聰睿昭聖神贊天輔皇帝大赦改元開㤗改幽都府為析津府薊北縣為析津縣幽都縣為宛平縣覃恩中外己亥賜夏國使東頭供奉官曹文斌呂文貴竇珪祐守榮武元正等爵有差癸卯前遼州録事張庭羙六世同居儀坤州劉興𦙍四世同居各給復三年甲辰西北招討使蕭托雲奏七部太師阿勒達因其部民之怨殺本部節度使巴罕并屠其家以叛準布執阿勒達以獻而㳂邊諸部皆叛十二月丙寅奉遷南京諸帝石像于中京觀徳殿景宗及宣獻皇后于上京五鸞殿壬申振奉聖州饑民庚辰賜皇弟秦晉國王隆慶鐵劵癸未劉晨言殿中髙可垣中京留守推官李可舉治獄明允詔超遷之甲申詔諸道水菑饑民質男女者起來年正月日計傭錢十文價折傭盡遣還其家歸州言其居民本新羅所遷未習文字請設學以教之詔允所請貴徳龍化儀坤雙遼同祖七州至是有詔始征商己丑詔諸鎮建宣敇樓二年春正月癸巳朔以裴𤣥感為翰林承㫖邢祥給事中石用中翰林學士呂徳推樞密直學士張儉政事舎人邢抱質加開府儀同三司守司空兼侍中王繼忠中京留守加檢校太師户部侍郎劉涇加工部尚書駙馬蕭紹宗加檢校太師耶律琨加政事令封幽王丁未如瑞鹿原北院樞密使耶律華格封豳王以馬氏為麗儀耿氏淑儀尚寢白氏昭儀尚服李氏順儀尚功艾氏芳儀尚儀孫氏和儀己未録囚烏爾古徳哷勒叛右皮室詳衮延夀率兵討之達旦國兵圍鎮州州軍堅守尋引去二月丙子詔以麥務川為象雷縣女河川為神水縣羅家軍為閭山縣山子川為富庻縣習家砦為龍山縣阿蘭峪為勸農縣松山川為松山縣金甸子爲金原縣壬午遣北院樞密副使髙正按察諸道獄三月壬辰朔華格以西北路畧平留兵戌鎮州赴行在夏四月甲子拜日詔從上京請以韓斌所括贍國塔魯河奉豪等州户二萬五千四百有奇置長霸興仁保和等十縣丙子如緬山五月辛卯朔復命華格等西討六月辛酉朔遣中丞耶律資忠使髙麗取六州舊地七月壬辰烏爾古徳哷勒復故疆乙未西南招討使政事令色珍奏党項諸部叛者皆遁黄河北模赧山不叛者哈坦額勒敏兩部因據其地今復西遷詰之則曰逐水草不早圗之後恐為患又聞前後叛者多投西夏西夏不納詔遣使再問西遷之意若歸故地則可就加撫諭使不報上怒欲伐之遂詔李徳昭今党項叛我欲西伐爾當東擊母失掎角之勢仍命諸軍各市肥馬丁酉特哩衮耶律迪里為南府宰相太尉武格為特哩衮癸卯釣魚曲溝戊申以敦睦宫子錢振貧民己酉華格等破準布酋烏巴之衆丁卯封皇子宗訓大内特哩衮八月壬戌遣引進使李延𢎞賜夏國王李徳昭及義成公主車馬己丑耶律資忠使髙麗還冬十月己未朔畋麃井之北命耶律阿營等使宋賀生辰辛酉駐蹕長濼丙寅詳衮張馬留獻女直人知髙麗事者上問之曰臣三年前為髙麗所虜為郎官故知之自開京東馬行七日有大砦廣如開京旁州所貢珍異皆積于此勝羅等州之南亦有二大砦所積如之若大軍行由前路取哈斯罕女直北直渡鴨渌江並大河而上至郭州與大路㑹髙麗可取而有也上納之十一月甲午録囚癸丑樞密使豳王華格以西征有罪削其官封出為大同軍節度使十二月甲子以北院大王耶律世良為北院樞密使封岐王以宰臣劉晟監修國史牛璘為彰國軍節度使蕭孝穆為西北路招討使放進士鮮于茂昭等六人及第三年春正月己丑録囚準布酋長烏巴來朝封為王乙未如渾河丁酉女直及鐵驪各遣使來貢是夕彗星見西方丙午畋潢河濵壬子帝及皇后獵瑞鹿原二月戊午詔增樞密使以下月俸甲子遣上京副留守耶律資忠復使髙麗取六州舊地三月庚子遣耶律世良城招州戊申南京奉聖平蔚雲應朔等州置轉運使夏四月戊午詔南京管内毋淹刑獄以妨農務癸亥烏爾古叛乙亥沙州回鶻曹順遣使来貢丙子以西北路招討都監蕭孝穆為北府宰相五月乙酉朔清暑緬山六月乙亥合巴哩伊實二國舅為一帳伊實伊勒希巴蕭迪里為詳衮以總之甲申封皇姪呼圖克為廣平郡王是夏詔國舅詳衮蕭迪里東京留守耶律托實等討髙麗造浮梁于鴨渌江城保宣義定逺等州秋七月乙酉朔如平地松林壬辰詔政事省樞密院酒間授官釋罪母即奉行明日覆奏八月甲寅朔幸沙嶺九月丁酉八部徳埒勒殺其詳衮刷皆叛詔南府宰相耶律烏拉噶招撫之辛亥釋徳埒勒數人令招諭其衆壬子耶律世良獻徳哷勒俘冬十月甲寅朔幸中京丙子以旗鼔伊喇詳衮特哩衮為奚六部大王放進士張用行等三十一人及第出身四年春正月乙酉如瑞鹿原丙戌詔耶律世良再伐達魯特戊子命詳衮巴古溺水瑞鹿原以備春蒐丁酉獵馬蘭淀壬寅東征東京留守善寧平章尼嚕古奏已總大軍及女直諸部兵分道進討遂遣使齎密詔軍前二月壬子朔如薩堤濼于闐國來貢夏四月癸丑以林牙建福為北院大王甲寅蕭迪里等伐髙麗還丙寅哈斯罕部請括女直王蘇扎納戸舊無籍者㑹其丁入賦役從之樞密使固寧奏大破八部達魯特詔侍御薩喇奬諭代行執手之禮丙寅耶律世良等上破準布俘獲數戊辰駐蹕㳂柳湖己巳女直遣使來貢壬申耶律世良討烏爾古破之甲戌使賞有功將校世良討達魯特至清泥堝時伊濟既平朝廷議内徙其衆伊濟安土重遷遂叛世良懲創既破達魯特輒殲其丁壯勒兵渡哈喇河進擊餘黨斥候不謹其將綳果聚兵稠林中擊遼軍不備遼軍小却結陣河曲綳果是夜來襲翌日遼後軍主綳果誘伊濟之衆皆遁世良追之軍至險阨綳果方阻險少休遼軍偵知其所世良不亟掩之綳果輕騎遁去獲其輜重及所誘伊濟之衆併遷達魯特所獲薩瑪爾部民城臚朐河上以居之是月蕭楊格尚南平郡主五月辛巳命北府宰相劉晟為都統樞密使耶律世良為副殿前都㸃檢蕭庫哩為都監以伐髙麗晟先携家置邊郡致緩師期追還之以世良庫哩總兵進討以耶律徳政為遼興軍節度使蕭尼古爾天城軍節度使李仲舉卒詔恤其家六月庚戌上拜日如禮與滿圖古爾世勲易衣馬為好以上京留守耶律巴格為北院樞密副使秋七月上又拜日遂幸秋山自八月射鹿至于九月復自癸丑至于辛酉連獵于有栢碎石太保響應松山諸山丁卯與伊勒希巴兵部尚書蕭榮寧定交契以重君臣之好丙子以旗鼓伊喇詳衮特哩衮為六部奚王冬十月駐蹕塔喇噶濼十一月庚申詔汰東京僧及命上京中京洎諸宮選精兵五萬五千人以備東征十二月南巡海徼還幸顯州五年春正月丁未北幸庚戌耶律世良蕭庫哩與髙麗戰于郭州西破之斬首數萬級盡獲其輜重乙卯師次南海軍耶律世良薨于軍癸酉駐蹕雪林二月己卯準布長來朝辛巳如薩堤濼庚寅前東京統軍使耶律韓留為右伊勒希巴戊戌皇子宗真生三月乙卯布古徳長蘇布特薩喇等來貢辛酉諸道獄空詔進階賜物丙寅以前北院大王耶律敬温為額珍尼郭齊哈党項魁可來降夏四月乙亥振招州民戊寅左伊勒希巴蕭和卓為北院樞密使赫勒訥為副使庚辰清暑孤樹淀五月甲子尚書蕭姬隠坐出使後期削其官丁卯以耿元吉為戸部使六月以政事舎人吳克昌按察霸州刑獄丁丑回鶻獻孔雀秋七月甲辰獵于赤山八月丙子幸懐州有事于諸陵戊寅還上京九月癸卯皇弟南京留守秦晉國王隆慶來朝上親出迎勞至實徳山因同獵于松山乙丑駐蹕杏堝冬十月甲午封秦晉國王隆慶長子察克中山郡王次子蘇克樂安郡王十一月辛丑以參知政事馬保忠同知樞密院事監修國史丁巳北面林牙蕭威烏克為國舅詳衮十二月乙酉秦晉國王隆慶還至北安薨訃聞上為哀慟輟朝七日丁酉宋遣張遜王承徳來賀千齡節是嵗放進士孫傑等四十八人及第六年春正月癸卯如錐子河二月甲戌以公主賽格殺無罪婢駙馬蕭托雲不能齊家降公主為縣主削托雲同平章事丁丑詔國舅帳詳衮蕭威烏克將本部兵征髙麗其國舅司事以都監攝之庚辰以南面林牙聶赫為南院大王三月乙巳如顯州葬秦晉國王隆慶有事於顯乾二陵追冊隆慶為太弟夏四月辛夘封隆慶少子謝嘉努為長沙郡王以樞密使漆水郡王耶律制心權知諸行宮都部署事壬辰禁命婦再醮丙申如涼陘五月戊戌朔樞密使蕭和卓為都統漢人行宮都部署王繼忠為副殿前都㸃檢蕭庫哩為都監以伐髙麗翌日賜和卓劎俾得專殺丙午録囚己酉設四帳都詳衮甲寅南京統軍使蕭惠為右伊勒希巴乙卯祠木葉山潢河乙丑駐蹕九層臺六月戊辰朔徳妃蕭氏賜死葬兎兒山西後數日大風起塜上畫暝大雷電而雨不止者踰月是月南京諸縣蝗秋七月辛亥如秋山遣禮部尚書劉京翰林學士吳叔達知制誥仇正已起居舎人程翥吏部員外郎南承顔禮部員外郎王景運分路按察刑獄辛酉以西南路招討請置寧仁縣于勝州九月庚子還上京以皇子舒蘇生大赦丁未以駙馬蕭璉節度使華格知制誥仇正已楊佶充賀宋生辰正旦使副乙卯蕭和卓等攻髙麗興化軍不克還師冬十月丁卯南京路饑輓雲應朔𢎞等州粟振之辛未獵鏵子河庚寅駐蹕達哩山十一月乙卯建州節度使石匡弼卒十二月丁卯上輕騎還上京戊子宋遣李行簡張信來賀千齡節翌日宋馮元張綸來賀正旦遼史卷十五遼史卷十五考證聖宗紀六開㤗元年八月己未髙麗王詢遣田拱之奉表稱病不能朝詔復取六州地按六州地史未詳其名考通鑑初以鴨緑江北予髙麗甞築六城至是復取之開㤗四年夏四月甲寅蕭迪里等伐髙麗還按通鑑綱目契丹遣迪里討髙麗髙麗與女直設竒邀擊契丹大敗而還此不書敗諱之也五月辛巳命北府宰相劉晟為都統樞密使耶律世良為副殿前都㸃檢蕭屈烈為都監以伐髙麗按遼史髙麗傳劉晟作慎行蕭屈烈作蕭虚烈遼史卷十五考證
