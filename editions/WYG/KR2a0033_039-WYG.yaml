  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_039-1a, image: WYG0289/WYG0289-0263a.png}
body:
  text: 遼史卷三十九元中書右丞相總裁托克托等修志第九地理志三中京道中京大定府虞為營州夏屬冀州周在幽州之分秦郡天下是為遼西漢為新安平縣漢末歩奚居之幅員千里多大山深谷阻險足以自固魏武北征縱兵大戰降者一十餘萬去之松漠其後拓抜氏乗遼建牙於此當饒樂河水之南温渝河水之北唐太宗伐髙麗駐蹕於此部帥蘇支從征有功奚長可度率衆内附為置饒樂都督府咸通以後契丹始大奚族不敢復抗太祖建國舉族臣屬聖宗常過七金山土河之濵南望雲氣有郛郭樓闕之狀因議建都擇良工於燕薊董役二歳郛郭宫掖樓閣府庫市肆廊廡擬神都之制統和二十四年五帳院進故奚王牙帳地二十五年城之實以漢户號曰中京府曰大定皇城中有祖廟景宗承天皇后御容殿城池湫濕多鑿井泄之人以為便大同驛以待宋使朝天館待新羅使來賔館待夏使有七金山馬盂山雙山松山土河統州十縣九大定縣白霫故地以諸國俘户居之長安縣本漢賔從縣以諸部人居之富庻縣本漢新安平地開泰二年析京民置勸農縣本漢賔從縣地開泰二年析京民置文定縣開泰二年析京民置升平縣開泰二年析京民置歸化縣本漢柳城縣地神水縣本漢徒河縣地開泰二年置金源縣本唐青山縣境開泰二年析京民置恩州懐徳軍下刺史本漢新安平縣地太宗建州開泰中以渤海户實之初隸永興宫後屬中京統縣一恩化縣開泰中渤海人户置惠州惠和軍中刺史本唐歸義州地太祖俘漢民數百户兎麛山下創城居之置州屬中京統縣一惠和縣聖宗遷上京惠州民括諸宫院落帳户置髙州觀察唐信州地萬歳通天元年以契丹伊斯琿部置開泰中聖宗伐髙麗以俘户置髙州有半頂山樂河屬中京統縣一三韓縣辰韓為扶餘弁韓為新羅馬韓為髙麗開泰中聖宗伐髙麗俘三國之遺人置縣户五千武安州觀察唐沃州地太祖俘漢民居木葉山下因建城以遷之號杏堝新城復以遼西户益之更曰新州統和八年改今名初刺史後升有黄栢嶺約囉水格黙勒水屬中京統縣一沃野縣利州中觀察本中京阜俗縣統和二十六年置刺史州開泰元年升屬中京統縣一阜俗縣唐末契丹漸熾役使奚人遷居琵琶川統和四年置縣初隸彰愍宫更隸中京後置州仍屬中京榆州髙平軍下刺史本漢臨渝縣地後隸右北平驪城縣唐載初二年析慎州置黎州處靺鞨部落後為奚人所據太宗南征横帳嘉哩以所俘慎州民置州開泰中没入屬中京統縣二和衆縣本新黎縣地永和縣本漢昌城縣地統和二十二年置澤州廣濟軍下刺史本漢土垠縣地太祖俘蔚州民立寨居之採煉陷河銀冶隸中京留守司開泰中置澤州有松亭關神山九宫嶺石子嶺灤河撒河屬中京統縣二神山縣神山在西南灤河縣本漢徐無縣地屬永興宫北安州興化軍上刺史本漢女祁縣地屬上谷郡晉為馮跋所據唐為奚王府西省地聖宗以漢户置北安州屬中京統縣一利民縣本漢且居縣地潭州廣潤軍下刺史本中京之龍山縣開泰中置州仍屬中京統縣一龍山縣本漢交黎縣地開泰二年以習家寨置松江州勝安軍下刺史開泰中置統和八年省復置屬中京統縣一松江縣本漢文成縣地邉松漠啇賈㑹衝開泰二年置縣有松山川宋王曽上契丹事曰出燕京北門至望京館五十里至順州七十里至檀州漸入山五十里至金溝館將至館川原平曠謂之金溝淀自此入山詰曲登陟無復里堠但以馬行記日約其里數九十里至古北口兩傍峻崖僅容車軌又度徳勝嶺盤道數層俗名思鄉嶺八十里至新館過雕窠嶺偏槍嶺四十里至如來館過烏灤河東有灤州又過黒斗嶺度雲嶺芹菜嶺七十里至柳河館松亭嶺甚險峻七十里打造部落東南行五十里至牛山館八十里至鹿兒峽館過蝦蟆嶺九十里至鐵漿館過石子嶺自此漸出山七十里至富谷館八十里至通天館二十里至中京大定府城垣卑小方圓纔四里許門但重屋無築闍之制南門曰朱夏門内通歩廊多坊門又有市樓四曰天方大衢通闤望闕次至大同館其門正北曰陽徳閶闔城内西南隅岡上有寺城南有園圃宴射之所自過古北口居人草庵板屋耕種但無桑柘所種皆從壠上虞吹沙所壅山上長松鬱然深谷中時見畜牧牛馬槖馳多青羊黄豕成州興府軍節度晉國長公主以媵户置軍曰長慶隸上京復改軍名統縣一同昌縣興中府本覇州彰武軍節度古孤竹國漢柳城縣地慕容皝以柳城之北龍山之南福徳之地乃築龍城構宫廟改柳城為龍城縣遂遷都號曰和龍宫慕容垂復居焉後為馮跋所滅元魏取為遼西郡隋平髙保寧置營州煬帝廢州置柳城郡唐武徳初改營州總管府尋為都督府萬歳通天中陷李萬榮神龍初移府幽州開元四年復治柳城八年西徙漁陽十年還柳城後為奚所據太祖平奚及俘燕民將建城命韓知方擇其處乃完葺柳城號霸州彰武軍節度統和中制置建霸宜錦白川等五州尋落制置隸積慶宫後屬興聖宫重熙十年升興中府有大華山小華山香髙山麝香崖天授皇帝刻石在焉駐龍峪神射泉小靈河統州二縣四興中縣本漢柳城縣地太祖掠漢民居此建霸城縣重熙中置府更名營丘縣析霸城置象雷縣開泰二年以麥務川置初隸中京後屬閭山縣本漢且慮縣開泰二年以羅家軍置隸中京後屬安徳州化平軍下刺史以霸州安徳縣置來屬統縣一安徳縣統和八年析霸城東南龍山徙河境户置隸乾州更屬霸州置州來屬黔州阜昌軍下刺史本漢遼西郡地太祖平渤海以所俘户居之隸黒水河提轄司世宗置州析宜霸二州漢户益之初隸永興宫更隸中京後置府來屬統縣一盛吉縣太祖平渤海俘興州盛吉縣民來居因置縣宜州崇義軍上節度本遼西絫縣地東丹王毎秋畋于此興宗以定州俘户建州有墳山松栢連亘百餘里禁樵採浚河累石為堤隸積慶宫統縣二𢎞政縣世宗以定州俘户置民工織絍多技巧聞義縣世宗置初隸海北州後來屬錦州臨海軍中節度本漢遼東無慮縣慕容皝置西樂縣太祖以漢俘建州有大胡僧山小胡僧山大查牙山小查牙山淘河島隸𢎞義宫統州一縣二永樂縣安昌縣嚴州保肅軍下刺史本漢海陽縣地太祖平渤海遷漢户雜居興州境聖宗於此建城焉隸𢎞義宫來屬統縣一興城縣川州長寧軍中節度本唐青山州地太祖弟明王安圖置㑹同三年詔為白川州安圖子察克以大逆誅沒入省白川州初隸崇徳宫統和中屬文忠王府統縣三𢎞理縣統和八年以諸宫提轄司户置咸康縣宜民縣統和中置建州保靜軍上節度唐武徳中置昌黎縣太祖完葺故壘置州漢乾祐元年故石晉太后詣世宗求於漢城側耕墾自贍許於建州南四十里給地五十頃營構房室創立宗廟州在靈河之南屢遭水害聖宗遷於河北唐崇州故城初屬武寧軍隸永興宫後屬敦睦宫統縣二永霸縣永康縣本唐昌黎縣地來州歸徳軍下節度聖宗以女直五部歳饑來歸置州居之初刺史後升隸永興宫有三州山六州山五脂山統州二縣一來賔縣本唐來逺縣地隰州平海軍下刺史慕容皝置集寧縣聖宗括帳户遷信州大雪不能進建城於此置焉隸興聖宫來屬統縣一海陽縣本漢縣瀕海地多鹻鹵置鹽場於此遷州興善軍下刺史本漢陽樂縣地聖宗平大延琳遷歸州民置來屬有箭笴山統縣一遷民縣潤州海陽軍下刺史聖宗平大延琳遷寧州之民居此置州統縣一海濵縣本漢陽樂縣地遷潤州本東京城内渤海民户因叛移於此遼史卷三十九
