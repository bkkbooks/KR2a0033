  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_093-1a, image: WYG0289/WYG0289-0650a.png}
body:
  text: 遼史卷九十三元中書右丞相總裁托克托等修列傳第二十三蕭惠慈實努蕭雅魯都勒斡蕭托雲耶律都沁蕭惠字伯仁小字托果斯淳欽皇后弟阿古齊五世孫初以中宫親為國舅詳衮從伯父巴雅爾征高麗至努克特北嶺高麗阻險以拒力戰破之及攻開京以軍律整肅聞授契丹行宫都部署開泰二年改南京統軍使尋為右伊勒希巴加同中書門下平章事朝議以遼東重地非勲戚不能鎮撫乃命惠知東京留守事改西北路招討使封魏國公太平六年討回鶻阿爾斯蘭徴兵諸路獨準布酋長濟喇後期立斬以狥進至甘州攻圍三日不克而還時濟喇之子聚兵來襲準布酋長烏巴密以告惠未之信㑹西準布叛襲三克軍都監尼嚕古圖吉部節度使嘉哩額布勒等將兵三千來救遇敵于哈屯城西南嘉哩額布勒戰歿士卒潰散惠倉卒列陣敵出不意攻我營衆請乘時奮擊惠以我軍疲敝未可用弗聽烏巴請以夜斫營惠又不許準布歸惠乃設伏兵擊之前鋒始交敵敗走惠為招討累年屢遭侵掠士馬疲困七年左遷南京侍衛親軍馬步軍都指揮使尋遷南京統軍使興宗即位知興中府歴順義軍節度使東京留守西南面招討使加開府儀同三司檢校太師兼侍中封鄭王賜推誠協謀竭節功臣重熙六年復為契丹行宫都部署加守太師徙王趙拜南院樞密使更王齊是時帝欲一天下謀取三關集羣臣議惠曰兩國彊弱聖慮所悉宋人西征有年師老民疲陛下親率六軍臨之其勝必矣蕭孝穆曰我先朝與宋和好無罪伐之其曲在我況勝敗未可逆料願陛下熟察帝從惠言廼遣使索宋十城㑹諸軍于燕惠與太弟帥師壓宋境宋人重失十城增歲幣請和惠以首事功進王韓十二年兼北府宰相同知元帥府事又爲北樞密使十三年夏國李元昊誘山南党項諸部帝親征元昊懼請降惠曰元昊忘奕世恩萌姦計車駕親臨不盡歸所掠天誘其衷使彼來迎天與不圖後悔何及帝從之詰旦進軍夏人列拒馬于河西蔽盾以立惠擊敗之元昊走惠麾先鋒及右翼邀之夏人千餘潰圍出我師逆擊大風忽起飛沙眯目軍亂夏人乘之蹂踐而死者不可勝計詔班師十七年尚帝姊秦晉國長公主拜駙馬都尉明年帝復征夏國惠自河南進戰艦糧船綿亘數百里既入敵境偵候不還鎧甲載于車軍士不得乘馬諸將咸請備不虞惠曰諒祚必自迎車駕何暇及我無故設備徒自弊耳數日我軍未營候者報夏師至惠方詰妄言罪諒祚軍從阪而下惠與麾下不及甲而走追者射惠幾不免軍士死傷尤衆師還以惠子慈實努歿于陣詔釋其罪十九年請老詔賜肩輿入朝䇿杖上殿辭章再上乃許之封魏國王詔冬夏赴行在參决疑議既歸遣賜湯藥及他賜賚不絶每生日輒賜詩以示尊寵清寜二年薨年七十四遺命家人薄葬訃聞輒朝三日惠性寛厚自奉儉薄興宗使惠恣取珍物惠曰臣以戚屬據要地禄足養廉奴婢千餘不為闕乏陛下猶有所賜貧於臣者何以待之帝以為然故為將雖數敗衂不之罪也弟實喇武定軍節度使二子慈實努烏爾古納烏爾古納終北府宰相慈實努字寜隐太平初補祇候郎君上愛其勤慎陞扎薩克轄加右監門衛上將軍西邊有警授西北路招討都監領保大軍節度使政濟恩威諸部悦附為殿前副㸃檢歴烏爾古徳哷勒詳袞征李諒祚為統軍都監與西北路招討使達嚕噶率畨部諸軍由北路趨凉州獲諒祚親屬夏人扼險以拒慈實努中流矢卒年五十一贈中書門下平章事蕭雅魯字和爾沁五院部人父揚珠歴宫節度使雅魯重熙間為牌印郎君清寜九年國家既平重元之亂其黨郭九等亡詔雅魯追捕獲之遷䕶衛太保咸雍元年使宋議邊事稱㫖知殿前副㸃檢事五年準布叛為行軍都監擊敗之俘獲甚衆初軍出止給五月粮過期粮乏士卒徃徃叛歸雅魯坐失計免官降戌西北部未行㑹北部兵起雅魯將烏爾古徳哷勒兵敗之毎戰以身先繇是釋前罪命總知烏爾古徳哷勒部九年徳哷勒叛都監耶律都木達以兵少不戰屯臚朐河徳哷勒合邉人掠居民雅魯力戰敗之獲其輜重繼聞酋長和卓三千餘騎掠附近部落縱兵躡其後連戰二日斬數千級盡得被掠人畜而還值徳哷勒黨五百餘騎刼捕鷹户逆擊走之俘斬甚衆自是徳哷勒勢沮時徳哷勒方為邊患準布相繼宼掠邊人疲弊朝廷以地逺不能時益援軍而使疆圉帖然者皆雅魯力也帝嘉其功拜左皮室詳衮㑹宋求天池之地詔雅魯兼統兩皮室軍屯達里庫山以備之太康初準布叛遷西北招討都監從都統耶律卓克算征討有功改南京統軍都監黄皮室詳衮尋遷東北路統軍都監卒弟都勒斡都勒斡字薩巴㓜警悟異常兒三歲失母哭盡哀見者傷之及長魁偉沉毅好學善屬文有才幹年三十始仕為朝野推重給事北院知聖㫖事太康二年伊遜再入樞府都勒斡素與蕭巖夀善誣以罪謫戍西北部坐皇太子事特恩減死仍錮終身在戍十餘年太子事稍直始得歸鄕里屏居謝人事一日臨流聞雉鳴三復孔子時哉語作古詩三章見志當時名士稱其高情雅韻不減古人壽隆六年卒年六十一乾統初贈彰義軍節度使蕭托雲字烏延北府宰相哈里之子統和初皇太后稱制以戚屬入侍尋為烏爾古都監討舒穆嚕等部有功遷烏爾古節度使十九年總領西北路軍事後以本路兵伐甘州降其酋長伊蘭既而伊蘭復叛命討之克肅州盡遷其民于托輝口故城師還詔尚金鄉公主拜駙馬都尉加同政事令門下平章事上言曰準布今已服化宜各分部治以節度使上從之自後節度使徃徃非材部民怨而思叛開泰元年七月錫林太師阿勒達殺其節度使西奔鄂爾多城蓋古所謂龍庭單于城也已而準布復叛圍托雲于哈屯城勢甚張托雲使諸軍齊射却之屯于鄂爾多城明年北院樞密使耶律華格引兵來救托雲遣人誘諸部皆降帝以托雲始雖失計後得人心釋之仍領諸部請益軍詔讓之曰叛者既服兵安用益且前日之役死傷甚衆若從汝謀邉事何時而息遂止㑹公主坐殺家婢降封郡主托雲罷使相尋為烏爾古徳哷勒詳衮以老代還卒子雙寛南京統軍使孫額圗琿尚三韓郡王赫嚕之女固頁公主終烏爾古徳哷勒部統軍使以善戰名于世耶律都沁字逹年積慶宫人仕統和間性疎簡不顧小節人初以是短之後侵宋分總羸師以從及戰取緋帛被介胄以自標顯馳突出入敵陣格殺甚衆太后望見喜召謂之曰卿戮力如此何患不濟厚賞之由是多以軍亊屬任俄授東北詳衮開泰二年進討準布克之重熙間歴東路統軍使天徳軍節度使十七年城西邊命都沁相地及造戰艦因成樓船百三十艘上置兵下立馬規制堅壯稱㫖及西征詔都沁率兵由别道進㑹于河濵敵兵阻河而陣帝御戰艦絶河擊之大捷而歸親賜巵酒仍問所欲都沁對曰臣幸被聖恩得効駑力萬死不能報國又將何求帝愈重之手書都沁衣􅅂曰勤國忠君舉世無雙卒于官年七十子迪里歴觀察節度使論曰初遼之謀復三闗也蕭惠賛伐宋之舉而宋人增幣請和狃於一勝移師西夏而勇智俱廢敗潰隨之豈非貪小利迷逺圖而然況所得不償所亡利果安在哉同時諸將撫綏邊圉若頁嚕忠勤不伐都勒斡高情雅韻都沁雖廉不逮蕭惠而無邀功啟釁之罪亦庶乎君子之風矣遼史卷九十三遼史卷九十三考證蕭惠傳十七年尚帝姊秦晉國長公主拜駙馬都尉按帝字原本誤作弟今據𢎞簡録改蕭托雲傳十九年總領西北路軍事後以本路兵伐甘州降其酋長伊蘭按聖宗本紀統和二十六年蕭托雲奏討甘州回鶻降其王耶剌里撫慰而還此處原本稱降其酋長牙懶即此事也牙懶與耶剌里俱係音近之譌今畫一改總論内都勒斡高情雅韻都沁雖廉不逮蕭惠而無邀功啟釁之罪亦庶乎君子之風矣按都勒斡高情雅韻等句原本作鐸軫高情雅韻鐸盧斡雖廉不逮惠而無邀功啟釁之罪考高情雅韻係都勒斡傳中語都沁傳無此四字蓋都勒斡原本作鐸盧斡都沁原本作鐸軫兩名俱有鐸字遂至互易其名而誤也今據傳改正遼史卷九十三考證
