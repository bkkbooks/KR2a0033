body:
  text: 遼史卷二十一元中書右丞相總裁托克托等修本紀第二十一道宗一道宗孝文皇帝諱洪基字納琳小字察喇興宗皇帝長子母曰仁懿皇后蕭氏六嵗封梁王重熙千一年進封燕國總領中丞司事眀年總北南院樞宻使事加尚書令進封燕趙國王二十一年為天下兵馬大元帥知特里衮事預朝政帝沈靜嚴毅每朝興宗為之歛容二十四年八月己丑興宗崩即皇帝位於柩前哀慟不聴政辛邜百僚上表固請許之詔曰朕以菲徳託居士民之上苐恐智識有不及羣下有未信賦歛妄興賞罰不中上恩不能及下下情不能逹上凡爾士庻直言無諱可則擇用否則不以為愆卿䓁其軆朕意壬辰以皇太弟重元為皇太叔免漢拜不名癸巳遣使報哀於宋及夏髙麗甲午遣重元安撫南京軍民戊戌以遺詔命西北路招討使西平郡王蕭阿拉為北府宰相仍權知南院樞宻使事北府宰相蕭實喇為武定軍節度使辛丑改元清寕大赦九月戊午詔常所幸圍場外無禁庚申詔䕶衞士外不得佩刃入宫非勲戚後及額爾竒木副使承應職事人不得冠巾壬戌詔額爾竒木及副使之族并民奴賤不得服塔納水獺䘮刀柄兔鶻鞍勒珮子不許用犀玉果勒圖犀惟大将軍不禁乙丑賜内外臣僚爵賞庚午尊皇太后為太皇太后辛未遣左伊勒希巴蕭穆嚕翰林學士韓運以先帝遺物遺宋癸酉遣使以即位報宋丙子尊皇后為皇太后宴菆塗殿以上京留守宿國主辰賫為南京留守壬午遣使賜髙麗夏國先帝遺物冬十月丁亥有司請以帝生日為天安節從之以吴王仁先同知南京留守事陳王圖伯特為南府宰相進封吴王壬寅以順義軍節度使實紳努為南院大王十一月甲子𦵏興宗皇帝於慶陵宋及髙麗遣使來㑹名其山曰永興丙寅以南院大王海古勒為中京留守北府宰相西平郡王蕭阿拉進封韓王壬申次懐州有事於太宗穆宗廟甲戌謁祖陵戊寅冬至有事於太祖景宗興宗廟不受賀十二月丙戌詔左伊勒希巴曰朕以眇冲獲嗣大位夙夜憂懼恐弗克任欲聞直言以匡其失今已數月未見所以副朕委任股肱耳目之意其令内外百官比秩滿各言一事仍轉諭所部無貴賤老幼皆得直言無諱戊子應聖莭上太皇太后夀宴羣臣命婦冊妃蕭氏為皇后進封皇弟越王和囉噶為魯國王許王阿林為陳國王楚王尼嚕古徙封吴王辛邜詔部署院事有機宻即奏其投謗訕書輒受及讀者並棄市癸巳皇族實公悖毋伏誅甲午以樞宻副使姚景行為參知政事翰林學士吴湛為樞宻副使參知政事同知樞宻院事韓紹文為上京留守丙申宋遣歐陽修䓁來賀即位戊戌詔設學飬士頒五經傳䟽置博士助教各一貟癸邜以知涿州楊續參知政事兼同知樞宻院事庚戌以聖宗在時生辰赦上京囚是年御清凉殿放進士張孝傑䓁四十四人二年春正月丙辰詔諸州郡官及僚屬决囚諸部族例己巳詔二孟古部與世預宰相節度使選者免皮室軍是月幸魚児濼二月乙酉以左伊勒希巴蕭穆嚕知西南面招討都監事乙巳以興宗在時生辰宴羣臣命各賦詩三月丁巳應聖節曲赦百里内囚己邜御製放鷹賦賜羣臣諭任臣之意閏月己亥始行東京所鑄錢乙巳南京獄空進留守以下官夏四月甲子詔曰方夏長飬鳥獸孶育之時不得縱火於郊五月戊戌謁慶陵甲辰有事於興宗廟六月丁巳詔宰相舉才能之士戊午命有司籍軍補邊戍辛酉凖布酋長來朝貢方物丁邜髙麗遣使來貢辛未罷史官預聞朝議俾問宰相而後書乙亥中京蝗災丙子詔强盗得實者聴諸路决之丁丑南院樞宻使趙國王察克為上京留守同知南京留守事吳王仁先為南院樞宻使乙酉遣使分道平賦稅繕戎噐勸農桑禁盗賊八月辛未如秋山九月庚子幸中京祭聖宗興宗於㑹安殿冬十月丙子如中㑹川十一月戊戌知左伊勒希巴事耶律華喇為伊勒希巴北院大王耶律仙童知黄龍府事甲辰文武百僚上尊號曰天祐皇帝后曰懿徳皇后大赦乙巳以皇太叔重元為天下兵馬大元帥徙封趙國王察克為魏國王魯國王和囉噶為宋國王陳國王阿林為秦國王吳王尼嚕古進封楚國王百官進遷有差十二月戊申朔以韓王蕭阿拉為北院樞宻使東京留守宿國王辰賫北府宰相宋國王和囉噶上京留守秦國王阿林知中丞司事甲寅上皇太后尊號曰慈懿仁和文惠孝敬廣愛宗天皇太后三年春正月庚辰如鴨子河丙戌置倒塌嶺節度使乙未五國部長來貢方物二月己未如大魚濼三月辛巳以楚國王尼嚕古為武定軍節度使夏四月丙辰清暑永安山五月己亥如慶陵獻酎於金殿同天殿六月辛未魏國王察克為特哩衮同知樞宻院事蕭唐古南府宰相魏國王特布東京留守秋七月甲申南京地震赦其境内乙酉如秋山八月辛亥帝以君臣同志華夷同風詩進皇太后九月庚子幸中㑹川冬十月己酉謁祖陵庚申謁譲國皇帝及世宗廟辛酉奠酎於玉殿十一月丙子左伊勒希巴蕭穆嚕為契丹行宫都部署庚子髙麗遣使來貢十二月庚戌禁職官於部内假貸貿易戊辰太皇太后不豫曲赦行在五百里内囚己巳太皇太后崩四年春正月壬申朔遣使報哀於宋夏如鴨子河釣魚癸酉宋遣使奉宋主繪像來丁亥知易州事耶律佛徳秩滿部民乞留許之二月丙午詔伊勒希巴諸路鞫死罪獄具仍令别州縣覆案無寃然後决之稱寃者即具奏庚戌如魚児濼三月戊寅募天徳鎮武東勝䓁處勇㨗者籍為軍甲午肆赦夏四月甲辰謁慶陵丁夘宋遣使弔癸五月庚午朔上大行太皇太后尊諡曰欽哀皇后癸酉𦵏慶陵夏國髙麗遣使來㑹乙酉如永安山清暑六月乙丑以北院樞宻使鄭王蕭格為南院樞宻使徙封楚王南院樞宻使吳王仁先為北院樞宻使秋七月辛巳制諸掌内藏庫官盗兩貫以上者許奴婢告壬午獵于黒嶺冬十月戊戌朔同知東京留守事海古勒為南院大王保安軍節度使希逹為奚六部大王十一月癸酉行再生及柴冊禮宴羣臣於八方陂庚寅御清風殿受大冊禮大赦以吳王仁先為南京兵馬副元帥徙封隋王壬午謁太祖及諸帝宫丙戌祠木葉山禁造玉噐十二月辛丑弛塔納水獺裘之禁乙巳許士庻畜鷹辛亥南院樞宻使楚王蕭格復為北院樞宻使閏月己巳賜皇太叔重元金劵是嵗皇子濬生五年春如春州夏六月甲子朔駐蹕納克濼己丑南院樞宻使蕭阿蘇為北府宰相樞宻副使耶律伊遜南院樞宻使特哩衮察克遼興軍節度使魯王謝嘉努武定軍節度使東京留守吳王特布西京留守秋七月丁酉以烏爾古徳哷勒詳衮蕭穆嚕為左伊勒希巴冬十月壬子朔幸南京祭興宗於嘉寧殿十一月禁獵十二月壬戌以北院林牙奚瑪魯為右伊勒希巴叅知政事吳湛以弟洵冒入仕籍削爵為民是年上御百福殿放進士梁援等百一十五人六年春如鴛鴦濼夏五月戊子朔監修國史耶律伯請編次御製詩賦即命為序己酉駐蹕納克濼六月戊午朔以東北路女直詳衮髙嘉努為特哩衮壬戌遣使録囚丙寅中京置國子監命以時祭先聖先師癸未以隋王仁先為北院大王賜御製誥冬十月甲子駐蹕藕絲淀七年春三月庚戌如春州以耶律伊遜知北院樞宻使事夏四月辛未禁吏民畜海東青鶻五月丙戌清暑永安山丙午謁慶陵辛未殺東京留守陳王蕭阿拉六月壬子朔日有食之甲子以蕭穆嚕為順義軍節度使丁卯幸𢎞義永興崇徳三宫致祭射栁賜宴賞賚有差戊辰行再生禮復命羣臣分朋射桞丁丑以楚國王尼嚕古知南院樞宻使事秋九月丁丑駐蹕藕絲淀冬十一月壬午以知黄龍府事耶律阿勒扎為南院大王遼史卷二十一
