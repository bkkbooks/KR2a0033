  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_022-1a, image: WYG0289/WYG0289-0152a.png}
body:
  text: 遼史卷二十二元中書右丞相總裁托克托等修本紀第二十二道宗二八年春正月癸丑如鴨子河二月駐蹕納克濼三月戊申朔楚王蕭格致仕進封鄭國王夏五月武都温特哩衮圖圖爾噶䓁乞嵗貢馬駞許之六月駐蹕圖古勒辛丑以右伊勒希巴奚瑪魯為奚六部大王是月御清凉殿放進士王鼎等九十三人秋七月甲子射熊於愛實拉冬十月甲戌朔駐蹕都爾嘉十二月庚辰以知北院樞宻使事蕭特古斯為北院樞宻使癸未幸西京戊子以皇太后行再生禮曲赦西京囚九年春正月幸鴛鴦濼辛未禁民鬻銅三月辛未宋主禎殂以姪曙為子嗣位夏五月丙午隋王仁先為南院樞宻使徙封許王清暑赫哷蘇秋七月丙辰如太子山戌午皇太叔重元與其子楚國王尼嚕古及陳國王辰禄同知北院樞宻使事蕭呼都克衞王特布林牙聶羅布爾古統軍使蕭逹勒逹駙馬都尉參及弟珠展圖古勒旗皷伊喇詳衮耶律果玖文班太保希卜蘇内藏提㸃烏爾古䕶衞左太保特卜庫諳逹副官使䍐嘉努寳神努䓁凡四百人誘脅弩手軍犯行宫時南院樞宻使許王仁先知北樞宻院事趙王耶律伊遜南府宰相蕭唐古北院宣徽使蕭罕嘉努北院樞宻副使蕭惟信敦睦宫使耶律良䓁率宿衞士卒數千人禦之尼嚕古躍馬突出将戰為近侍詳衮渤海阿蘇䕶衞蘇射殺之己未族逆黨家庚申重元亡入大漠自殺辛酉詔諭諸道壬戌以仁先為北院樞宻使進封宋王加尚父耶律伊遜南院樞宻使罕嘉努殿前都㸃檢封荆王蕭惟信耶律馮嘉努並加太子太傅宿衞官蕭伊遜回鶻海蘭紐斡哩耶律托卜嘉阿蘇宫分人濟嚕克錫黙伊遜珠嚕並加上将軍諸䕶衞及士卒庖夫弩手傘子䓁三百餘人各授官有差耶律良宻告重元變命籍横帳額爾竒木房為漢人行宫都部署癸亥特布訴為重元䓁所脅詔削爵流鎮州戊辰以黒白羊祭天八月庚午朔遣使安撫南京吏民癸酉以永興宫使耶律托卜嘉有定亂功為同知㸃檢司事冬十月戊辰朔幸興王寺庚午以六部院太保耶律和卓知南院大王事是月駐蹕藕絲淀十一月辛丑以南院宣徽使蕭玖格為北府宰相己未追封故富春郡王耶律義先為許王是嵗封皇子濬為梁王十年春正月己亥北幸二月禁南京民决水種粳稲秋七月壬申詔决諸路囚辛巳禁僧尼私詣行在妄述禍福取財物九月壬寅幸懐州謁太宗穆宗廟冬十月壬辰朔駐蹕中京戊午禁民私刋印文字十一月甲子定吏民衣服之制辛未禁六齋日屠殺丁丑詔求乾文閣所闕經籍命儒臣校讐庚辰彰國軍節度使韓色實為特哩衮詔南京不得私造御用綵段私貨鐡及非時飲酒命南京三司毎嵗春秋以官錢饗将士十二月癸巳北院大王蕭烏爾古納為契丹行宫都部署是嵗南京西京大熟咸雍元年春正月辛酉朔文武百僚加上尊號曰聖文神武全功大略廣智聰仁睿孝天祐皇帝改元大赦冊梁王濬為皇太子内外官賜級有差甲子如魚児濼庚寅詔諸遇正旦重午冬至别表賀東宫三月丁亥以知興中府事楊績知樞宻院事夏四月辛邜以知樞宻院事張嗣復疾改知興中府事庚子清暑圖古勒五月辛巳夏國遣使來貢秋七月丙子皇太后射獲熊賞賚百官有差八月丙申客星犯天廟詔諸路備盗賊嚴火禁九月乙亥駐蹕藕絲淀丁丑左伊勒希巴繅古為孟父詳衮冬十月丁亥朔幸醫巫閭山己亥皇太后射獲虎大宴羣臣令各賦詩十一月壬戌有星如斗逆行隠隠有聲十二月甲午以遼王仁先為南京留守徙封晉王辛亥以南京留守蕭惟信為左伊勒希巴壬子熒惑與月並行自旦至午二年春正月丁巳如鴨子河宋賀正使王嚴卒以禮送還癸未幸山榆淀二月甲午召武定軍節度使姚景行問以治道拜南院樞密使三月辛巳以南北路詳衮耶律韓福努為北院大王壬午彗星見於西方夏四月霖雨五月乙亥駐蹕圖古勒辛巳以戸部使劉詵為樞宻副使六月丙戌回鶻來貢甲辰凖布來貢秋七月癸丑朔以西北路招討使蕭珠展為北府宰相左伊勒希巴蕭惟信南院樞宻使同知南院樞宻使事耶律伯特哩衮南院樞宻使事姚景行致仕庚申録囚辛酉景行復前職丁邜如藕絲淀以嵗旱遣使賑山後貧民九月壬子朔日有食之以參知政事韓孚為樞宻副使冬十二月壬午以知樞宻院事楊績為南院樞宻使樞宻副使劉詵叅知政事戊子僧守志加守司徒丁酉以西京留守和卓為南院大王辛丑以蕭珠展為武定軍節度使是年御永安殿放進士張臻䓁百一人三年春正月辛亥如鴨子河甲子御安流殿釣魚三月癸亥宋主曙殂子頊嗣位遣使告哀即遣右䕶衞太保蕭托卜嘉翰林學士陳覺䓁弔祭閠月丁亥扈駕軍營火賜錢粟及馬有差辛邜駐蹕春州北淀乙巳以蕭烏爾古納為北府宰相夏五月壬辰駐蹕納克濼壬寅賜随駕諸官工人馬六月戊申有司奏新城縣民楊從謀反偽署官吏上曰小人無知此兒戲耳流其首惡餘釋之庚戌宋遣使饋其先帝遺物辛未宋以即位遣陳襄來報即遣知黄龍府事蕭特古斯中書舍人馬絃往賀壬戌南府宰相韓王蕭唐古致仕壬申以廣徳軍節度使耶律瑞努為南府宰相度支使趙徽叅知政事秋七月辛丑熒惑晝見凡三十五日九月戊戌詔給諸路囚糧癸邜幸南京冬十一月壬辰夏國遣使進回鶻僧金佛梵覺經十二月丁未以叅知政事劉詵為樞宻副使東北路詳衮果巴南院大王樞宻直學士張孝傑叅知政事己酉以張孝傑同知樞宻院事丁巳行再生禮赦死罪以下是月夏國王李諒􅍈薨是嵗南京旱蝗四年春正月甲戌朔日有食之丙子如鴛鴦濼辛巳改易州兵馬使為安撫使丁亥獵炭山辛邜遣使振西京饑民二月甲辰朔詔元帥府募軍壬子夏國王李諒祚子秉常遣使告哀癸丑頒行御製華嚴經贊丁邜北行三月丙子遣使夏國弔祭甲申振應州饑民乙酉詔南京除軍行地餘皆得種稻庚寅振朔州饑民乙未夏國李秉常遣使獻其父諒祚遺物夏四月戊午阿爾斯蘭回鶻來貢五月丙戌駐蹕圖古勒六月壬子西北路雨穀方三十里丙寅以北院林牙耶律卓克算為北院大王右伊勒希巴蕭素颯中京留守秋七月壬申置烏爾古徳哷勒都統軍司丙子獵黒嶺南京霖雨地震九月己亥駐蹕藕絲淀冬十月辛亥曲赦南京徒罪以下囚永清武清安次固安新城歸義容城諸縣水復一嵗租戊辰冊李秉常為夏國王十二月辛亥夏國遣使來貢五年春正月凖布叛以晉王仁先為西北路招討使領禁軍討之夏六月己亥駐蹕圖古勒丙午吐蕃遣使來貢壬戌以南院樞宻使蕭惟信知北院樞宻使事秋七月乙丑朔日有食之戊辰夏國遣使來謝封冊癸未詔禁皇族恃勢侵漁細民八月謁慶陵九月戊辰仁先遣人奏準布㨗冬十月己亥駐蹕藕絲淀十一月丁卯詔四方館副使止以契丹人充丁丑五國博和哩部叛命蕭素颯討之閏月戊申夏國王李秉常遣使乞賜印綬己未僧志福加守司徒十二月甲子行皇太子再生禮减諸路徒以下罪一等乙丑詔百官廷議國政甲戌五國來降仍獻方物六年春正月甲午如千鵝濼二月丙寅凖布來朝貢方物夏四月癸未西北路招討司以所降凖布酋長至行在五月甲辰清暑圖古勒甲寅設賢良科詔應是科者先以所業十萬言進六月辛巳凖布來朝乙酉特哩衮耶律伯為中京留守是月御永安殿放進士趙廷睦䓁百三十八人秋七月辛亥獵和羅努克特八月丙子耶律伯薨追封遼西郡王九月庚戌幸藕絲淀甲寅以馬希白詩才敏妙十吏書不能給召試之冬十月丁邜五國部長來朝壬申西北路招討司擒凖布酋長來獻十一月乙邜禁鬻生熟鐡於回鶻凖布等界十二月戊午加圓釋法鈞二僧並守司空己未以坤寧節赦徒罪以下辛酉禁漢人捕獵七年春正月戊子如鴨子河二月乙丑女直進馬丙寅以南院樞宻使姚景行知興中府事三月己酉以討五國功加知黄龍府事蒲延懐化軍節度使髙元紀易州觀察使髙正並千牛衞上将軍五國節度使蕭托斯和寧江州防禦使大榮並静江軍節度使幸黒水夏四月癸酉如納克濼乙亥禁布帛短狹不中尺度者六月己邜吐蕃來貢癸未南院大王果巴致仕秋七月甲申朔以東北路詳衮哈爾吉為南院大王西南面招討使實徳努為奚六部大王己丑遣使按問五京囚庚子如藕絲淀八月辛巳置佛骨於招仙浮圖罷獵禁屠殺冬十月己夘如醫巫閭山壬戌以南府宰相耶律瑞努為南京統軍使戊辰謁乾陵庚辰詔百官廷議國事十一月戊子免南京流民租己丑振饒州饑民丙午髙麗遣使來貢十二月壬子以契丹行宫都部署耶律呼圖克知北院樞宻使事知北院樞宻使事蕭惟信為南府宰相兼契丹行宫都部署丁巳漢人行宫都部署李仲禧北院宣徽使劉霖樞宻副使王觀都承旨楊興功各賜國姓戊寅回鶻來貢是嵗春州斗粟六錢遼史卷二十二
