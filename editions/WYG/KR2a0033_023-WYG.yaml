front:
  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_023-1a, image: WYG0289/WYG0289-0157a.png}
body:
  text: 遼史卷二十三元中書右丞相總裁托克托等修本紀第二十三道宗三八年春正月癸未烏爾古徳哷勒詳衮耶律超等奏北邊㨗以戰多殺人飯僧南京中京甲申如魚兒濼壬寅昏霧連日二月丙辰北南樞宻院言無事可陳壬戌以討北部功烏爾古徳哷勒詳衮耶律超知北院大王事都監蕭阿嚕岱烏爾古徳哷勒詳衮加左監門衛上將軍嵗饑免武安州租税振恩蔚順惠等州民三月癸夘有司奏春泰寧江三州三十餘人願為僧尼受具足戒許之夏四月壬子振義饒二州民丁巳駐蹕圖埓實己邜清暑圖古勒五月壬午晉王仁先薨六月甲寅振易州貧民己未振中京甲子振中興府甲戌封北府宰相楊績為趙王樞宻副使耶律觀參知政事兼知南院樞宻使事丁丑髙麗遣使來貢秋七月己邜慶州靳文髙八世同居詔賜爵丙申振饒州饑民丁酉幸黒嶺丁未以御書華嚴經五頌示羣臣閏月辛未射熊於羖羊山八月庚辰混同郡王海古勒薨遣使致祭九月甲子駐蹕藕絲淀冬十月己丑參知政事耶律觀矯制營私第降為庶人癸巳回鶻來貢十一月庚戌免祖州税丙辰大雪許民樵採禁地丁邜賜延昌宮貧户錢十二月戊辰漢人行宮都部署耶律仲禧封韓國公樞宻副使參知政事趙徽出為武定軍節度使樞宻副使柴徳滋參知政事漢人行宮副部署耶律大悲努陞都部署同知南院樞宻使事蕭罕嘉努知左伊勒希巴事丁丑以坤寧節大赦庚寅賜髙麗佛經一藏九年春正月丁未如雙濼夏四月壬辰如旺國崖秋七月甲辰獵大熊山戊申烏爾古徳哷勒統軍言八鍚林徳哷勒人殺節度使以叛詔威烏爾古部軍分擊之丙寅南京奏歸義淶水兩縣蝗飛入宋境餘為蜂所食八月丙申以耶律仲禧為南院樞宻使九月癸邜駐蹕都爾嘉冬十月幸隂山遂如西京十一月戊午詔行幸之地免租一年甲子南院大王哈爾吉致仕十二月辛未以知北院樞宻使事耶律伊遜為中京留守南院宣徽使耶律薩喇為南院大王壬辰髙麗夏國竝遣使來貢十年春正月乙邜如鴛鴦濼二月癸未蠲平州復業民租賦戊子凖布來貢三月甲子如圖古勒以耶律超為北院大王夏四月旱辛未以奚人逹魯三世同居賜官旌之五月丙寅錄囚六月戊辰親出題試進士壬申詔臣庶言得失丙子御永安殿䇿賢良秋七月丙辰如秋山癸邜謁慶陵九月庚戌幸東京謁二儀五鸞殿癸亥祠木葉山冬十月丁邜駐蹕藕絲淀丁丑詔有司頒行史記漢書十一月戊午髙麗遣使來貢十二月辛巳改明年為太康大赦太康元年春正月乙未如混同江壬寅振雲州饑二月丁邜祥州火遣使恤災乙酉駐蹕大魚濼丁亥以獲鵝加鷹坊使耶律揚魯為工部尚書三月乙巳命皇太子寫佛書夏四月丙子振平州饑乙酉如犢山閏月丙午振平濼二州饑庚戌皇孫延禧生五月甲子賜妃之親及東宮僚屬爵有差六月癸巳以興聖宮使奚謝嘉努知奚六部大王事戊戌知三司使事韓操以錢榖増羡授三司使癸邜遣使按諸路囚以特哩衮大悲努為始平軍節度使參知政事柴徳滋武定軍節度使乙邜吐蕃來貢丙辰詔皇太子總領朝政仍戒諭之以武定軍節度使趙徽為南府宰相樞宻副使楊遵朂參知政事秋七月辛酉朔獵平地松林丙寅振南京貧民八月庚寅朔日有食之九月乙亥駐蹕藕絲淀己邜以南京饑免租税一年仍出錢粟振之冬十月西北路酋長希斯吹丹雙寛等來降十一月辛酉皇后被誣賜死殺伶人趙惟一髙長命竝藉其家屬十二月己丑以南京統軍使耶律瑞努為特哩衮漢人行宮都部署耶律霂樞宻副使同知東京留守事蕭道拉伊勒希巴庚寅賜張孝傑國姓壬辰以西京留守事蕭雅嚕為左伊勒希巴二年春正月己未如春水庚辰駐蹕雙濼二月戊子振黄龍府饑癸丑南京路饑免租税一年三月辛酉皇太后崩壬戌遣殿前副㸃檢耶律轄呼報哀於宋癸亥遣使報哀於髙麗夏國丁邜大赦戊寅以皇太后遺物遣使遺宋夏六月乙酉朔上大行皇太后尊諡曰仁懿皇后戊子宋及髙麗夏國各遣使弔祭甲午葬仁懿皇后於慶陵己亥駐蹕圖古勒壬寅出北院樞宻使魏王耶律伊遜為中京留守丁未冊皇后蕭氏封其父祗候郎君必埓哩為趙王叔西北路招討使額哩頁遼西郡王漢人行宮都部署駙馬都尉鍚黙桞城郡王參知政事楊遵朂知南院樞宻使事北院樞宻副使蕭蘇色知北院樞宻使事漢人行宮副部署劉詵參知政事己酉南府宰相趙徽致仕秋七月戊辰如秋山癸酉桞城郡王錫黙薨八月庚寅獵遇麛失其毋憫之不射九月戊午以南京蝗免明年租税己邜駐蹕藕絲淀冬十月戊戌召中京留守魏王耶律伊遜復為北院樞宻使十一月甲戌上欲觀起居注修注郎布當及和爾沁等不進各杖二百罷之流林牙蕭岩夀於威部是月南京地震民舎多壊十二月己丑以左伊勒希巴蕭托卜嘉為南院統軍使三年春正月癸丑如混同江乙邜省諸道春貢金帛及停周嵗所輸尚方銀二月壬午朔東北路統軍使蕭罕嘉努加尚父封吳王甲申詔北院樞宻使魏王耶律伊遜同母兄逹納同母弟阿蘇世預北南院樞宻之選異母諸弟世預額爾竒木之選己丑如魚兒濼辛邜中京饑罷巡幸夏四月乙酉泛舟黒龍江五月丙辰玉田安次蝝傷稼癸亥日中有黒子己巳駐蹕犢山乙亥北院樞宻使耶律伊遜奏右䕶衛太保察喇等告北院樞宻使蕭蘇色等八人謀立皇太子上以無狀不治出蘇色等三人補外䕶衛薩巴等六人各鞭百餘徙於邊丙子以西北路招討使遼西郡王蕭額哩頁為北府宰相兼知契丹行宮都部署事戊寅詔告謀逆事者重加官賞六月己邜朔耶律伊遜令牌印郎君蕭額圖琿誣首甞預蘇色等謀籍其姓名以告即命伊遜及耶律仲禧蕭額哩頁耶律孝傑楊遵朂雅克綽竒蕭錫沙等鞫治杖皇太子囚之宮中辛巳殺宿直官徳埓哩等三人壬午殺宣徽使托卜嘉等二人癸未殺始平軍節度使薩喇等十人又遣使殺上京留守蘇色及已徙䕶衛薩巴等六人乙酉殺耶律托卜嘉及其弟辰賚丙戌廢皇太子為庶人囚之上京己丑回鶻來貢殺東京留守同知耶律和勒博辛邜殺蘇色等諸子籍其家戊申遣使按五京諸道獄秋七月辛亥䕶衛太保察喇加鎮國大將軍預圖魯卜部節度使之選室韋察喇及蕭保神努穆爾古並加左衛大將軍牌印郎君額圖琿尚皇女趙國公主授駙馬都尉始平軍節度使祗候郎君耶律托卜嘉及蕭特古斯並加監門衛上將軍壬子知北院樞宻副使蕭罕嘉努為漢人行宫都部署乙丑如秋山丁丑謁慶陵八月庚寅漢人行宫都部署蕭罕嘉努薨辛丑謁慶陵九月癸亥玉田貢嘉禾壬申修乾陵廟冬十月辛丑駐蹕藕絲淀十一月北院樞宻使耶律伊遜遣其私人盗殺庶人濬於上京閏十二月戊午以北府宰相遼西郡王蕭額哩頁知北院樞宻使事左伊勒希巴耶律雅克為契丹行宫都部署丙寅預行正旦禮是嵗南京大熟四年春正月庚辰如春水甲午振東京饑二月乙丑駐蹕薩古雅戊辰東路統軍使耶律旺玖為特哩衮夏四月辛亥髙麗遣使乞賜鴨淥江以東地不許五月丙戌駐蹕㪚水原六月甲寅凖布諸酋長進良馬秋七月甲戌諸路奏飯僧尼三十六萬八月癸邜詔有司決滯獄九月乙未駐蹕藕絲淀庚子五國部長來貢冬十月癸邜以參知政事劉伸為保静軍節度使十一月丁亥禁士庶服用錦綺日月山龍之文己丑回鶻遣使來貢庚寅南院樞宻使耶律仲禧為廣徳軍節度使辛邜錦州民張寳四世同居命諸子三班院祗候十二月丁邜以北院樞宻副使耶律霂知北院樞宻使事遼史卷二十三遼史卷二十三考證十年按通鑑是年為宋神宗熙寧七年二月遼使蕭禧來議疆事遣太常少卿劉忱報之八年三月蕭禧復來遣知制誥沈括報之七月以王安石言詔韓縝如河東割地七百里以畀遼遂為異日興兵之端契丹國志蕭禧作蕭扈書此事時日皆同而紀皆失載謹附識太康三年壬午殺宣徽使托卜嘉等二人乙酉殺耶律托卜嘉及其弟辰瑠按蕭托卜嘉耶律托卜嘉二人同名同死一事考蕭托卜嘉傳未嘗為宣徽使耶律托卜嘉傳則以宣徽使見殺是死於壬午者為耶律托卜嘉乙酉所殺者為蕭托卜嘉不應為耶律托卜嘉也苐二人傳無日可考今仍其舊而訂正之遼史卷二十三考證
