body:
  text: 遼史巻五元中書右丞相總裁托克托等修本紀第五世宗世宗孝和莊憲皇帝諱阮小字烏雲讓國皇帝長子母柔貞皇后蕭氏帝儀觀豐偉内寛外嚴善騎射樂施予人望歸之太宗愛之如子㑹同九年從伐晉大同元年二月封永康王四月丁丑太宗崩於欒城戊寅梓宫次鎮陽即皇帝位於柩前甲申次定州命天徳碩格嘉哩等䕶梓宫先赴上京太后聞帝即位遣太弟魯呼率兵拒之六月甲寅次南京五院額爾竒木安圖詳衮瑠格遣人馳報請為前鋒至泰徳泉遇魯呼軍戰敗之上遣郎君勤徳等詣兩軍諭解秋閏七月次潢河太后魯呼整兵拒於横渡相持數日用烏哲之謀各罷兵趍上京既而聞太后魯呼復有異謀遷于祖州誅司徒華沙及春博里八月壬午朔尊母蕭氏為皇太后以太后族拉珠薩哈廉為國舅帳立詳衮以總焉以崇徳宫戸分賜翼戴功臣及北院大王斡南院大王吼各五十安圗楚補各百徳哷塔拉子孫先以非罪籍没者歸之癸未始置北院樞宻使以安圖為之九月壬子朔葬嗣聖皇帝於懐陵丁卯行柴冊禮羣臣上尊號曰天授皇帝大赦改大同元年為天禄元年追諡皇考曰讓國皇帝以安圖主東丹國封明王察克為泰寧王瑠格為特哩衮高勲為南院樞宻使二年春正月天徳蕭翰瑠格璸都等謀反誅天徳杖蕭翰遷瑠格於邉罸璸都使哈噶斯國漢主劉知逺殂子承祐立夏四月庚辰朔南唐遣李朗王祚来慰且賀兼奉蠟丸書議攻漢秋七月壬申皇子賢生冬十月壬午南京留守魏王趙延夀薨以中臺省右相徳哷為南京留守封燕王十一月駐蹕彰武南三年春正月蕭翰及公主額伯哩謀反翰伏誅額伯哩瘐死獄中庚申肆赦内外官各進一階夏六月戊寅以敞史耶律古爾錦為北院大王己夘特哩衮托雲封漆水郡王秋九月辛丑召羣臣議南伐冬十月遣諸將率兵攻下貝州高老鎮徇地鄴都南宫堂陽殺深州刺史史萬山俘獲甚衆四年春二月辛未泰寧王察克來朝留侍是月建政事省三月戊戌朔南唐遣趙延嗣張福等來賀南征捷秋九月乙丑朔如山西冬十月自將南伐攻下安平内丘束鹿等城大獲而還是歳冊皇后蕭氏五年春正月癸亥朔如百泉湖漢郭威弑其主自立國號周遣朱憲來告即遣使致良馬漢劉崇自立於太原二月周遣姚漢英華昭𦙍來以書辭抗禮留漢英等夏五月壬戌朔太子太傅趙􅉷薨輟朝一日命歸葬于汴詔州縣録事叅軍主簿委政事省銓注六月辛夘朔劉崇為周所攻遣使稱姪乞援且求封冊即遣燕王徳哷樞宻使髙勲冊為大漢神武皇帝南唐遣蔣洪來乞舉兵應援是夏清暑百泉嶺九月庚申朔自將南伐壬戌次歸化州尚和山癸亥祭讓國皇帝於行宫羣臣皆醉察克反帝遇弑年三十四應厯元年葬於顯州西山陵曰顯陵二年諡孝和皇帝廟號世宗統和二十六年七月加諡孝和莊憲皇帝贊曰世宗中才之主也入繼大統曽未三年納唐丸書即議南伐既乏持重宜乖周防葢有致禍之道矣然而孝友寛慈亦有君人之度焉未及師還變起沉湎豈不可哀也哉遼史巻五遼史巻五考證天禄五年遣燕王徳哷樞宻使高勲冊為大漢神武皇帝徳哷原本作牒䗶按資治通鑑十國春秋皆作述軋今從牒䗶譯改遼史巻五考證
