body:
  text: 遼史卷一百八元中書右丞相總裁托克托等修列傳第三十八方技孔子稱小道必有可觀醫卜是已醫以濟天札卜以决猶豫皆有補於國有惠於民前史錄而不遺故傳珠勒呼吐谷渾人初太祖破吐谷渾一騎士棄槖反射不中而去及追兵開槖視之中得一嬰兒即珠勒呼也因所俘者問其故乃知射槖者嬰之父也世善醫雖馬上視疾亦知標本意不欲子為人所得欲殺之耳由是進於太祖淳欽皇后收養之長亦能醫専事鍼灸太宗時以太醫給侍甞撰脉經諸鍼灸書行世年九十卒王白冀州人明天文善卜筮晉司天少監太宗入汴得之應厯十九年王子扎穆以事下獄其母求卜白曰此人當王未能殺也毋過憂景宗即位釋其罪封寧王竟如其言凡决禍福多此類保寧中厯彰武興國二軍節度使撰百中歌行于世魏璘不知何郡人以卜名世太宗得于汴天祿元年上命馳馬較遲疾以為勝負問王白及璘孰勝白奏曰赤者勝璘曰臣所見驄馬當勝既馳竟如璘言上異而問之白曰今日火王故知赤者勝璘曰不然火雖王而上有烟以烟察之青者必勝上嘉之五年察克謀逆私卜于璘璘始卜謂曰大王之數得一日矣宜慎之及亂果敗應厯中周兵犯燕上以勝敗問璘璘曰周姓柴也燕分火也柴入火必焚其言果驗璘甞為太平王雅斯哈卜僣立事上聞之免死流烏爾古部一日節度使召璘有獻雙鯉者戲曰君卜此魚何時得食璘良久答曰公與僕不出今日有不測禍奚暇食魚急命烹之未及食㓂至俱遇害耶律達魯字繖布斡其先本五院之族始置宫分𨽻焉達魯精于醫察形色即知病源雖不診候有十全功統和初為大丞相韓徳讓所薦官至節度使初樞密使耶律色珍妻有沈痾易數醫不能治達魯視之曰心有畜熱非藥石所及當以意療因其瞶聒之使狂用泄其毒則可於是令大撃鉦皷於前翌日果狂呌呼怒罵力極而止遂愈治法多此類人莫能測年八十卒耶律伊伯格勒字錫訥六院郎君尼古察之後幼好學尤長卜筮不樂仕進甞為人擇𦵏地曰後三日有牛乗人逐牛過者即啟土至期果一人負乳犢引牸牛而過其人曰所謂牛乗人者此也遂啟土既𦵏吉凶盡如其言又為失鷹者占曰鷹在汝家東北三十里濼西榆上往求之果得當時占候無不驗論曰方技術者也苟精其業而不畔于道君子必取焉珠勒呼王白耶律達魯無大得失錄之宜矣魏璘為察克卜謀逆為雅斯哈卜僣立罪在不貰雖有寸長亦奚足取哉存而弗削為來者戒遼史卷一百八
