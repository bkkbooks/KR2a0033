body:
  text: 遼史卷八十七元中書右丞相總裁托克托等修列傳第十七蕭孝穆薩巴孝友孝先蕭博諾耶律布庫夏行羙蕭孝穆小字和爾沁淳欽皇后弟阿古齊五世孫父托輝為國舅詳衮孝穆廉謹有禮法統和二十八年累遷西北路招討都監開泰元年遙授建雄軍節度使加檢校太保是年珠拉等變孝穆擊走之冬進軍哈屯城準布部結五羣牧長扎拉圖等謀中外相應孝穆悉誅之迺嚴備禦以待餘黨遂潰以功遷九水諸部安撫使尋拜北府宰相賜忠穆熙霸功臣檢校太師同政事門下平章事八年還京師太平二年知樞密院事充漢人行宮都部署三年封燕王南京留守兵馬都總管九年大延琳以東京叛孝穆為都統討之戰于蒲水中軍稍却副部署蕭必塔都監蕭博諾以兩翼夾擊賊潰追敗之于手山北延琳走入城深溝自衛孝穆圍之築重城起樓櫓使内外不相通城中撤屋以㸑其將楊詳世等擒延琳以降遼東悉平改東京留守賜佐國功臣為政務寛簡撫納流徙其民安之興宗即位徙王秦尋復為南京留守重熙六年進封吳國王拜北院樞密使八年表請籍天下户口以均徭役又陳諸部及錫里軍利害從之由是政賦稍平衆悦九年徙王楚時天下無事户口蕃息上富於春秋每言及周取十縣慨然有南伐之志群臣多順㫖孝穆諫曰昔太祖南伐終以無功嗣聖皇帝仆唐立晉後以重貴叛長驅入汴鑾馭始旋反來侵軼自後連兵二十餘年僅得和好蒸民樂業南北相通今國家比之曩日雖曰富彊然勲臣宿將往往物故且宋人無罪陛下不冝棄先帝盟約時上意已决書奏不報以年老乞骸骨不許十一年復為北院樞密使更王齊薨追贈大丞相晉國王諡曰貞孝穆雖椒房親位高益畏太后有賜輒辭不受妻子無驕色與人交始終如一所薦拔皆忠直士嘗語人曰樞密選賢而用何事不濟若自親煩碎則大事凝滯矣自蕭和卓以吏才進其後轉効不知大體歎曰不能移風易俗偷安爵位臣子之道若是乎時稱為國寶臣目所著文曰寶老集二子阿拉薩巴弟孝先孝忠孝友各有傳薩巴字周隱七歳以戚屬加左右千牛衛大將軍重熙初補祗候郎君性廉介風姿爽朗善毬馬馳射帝每燕飲喜諧謔薩巴雖承寵顧常以禮自持時人稱之以柴冊禮恩加檢校太傅永興宫使總領左右䕶衛同知㸃檢司事尚魏國公主拜駙馬都尉為北院宣徽使仍總知朝廷禮儀重熙末出為西北路招討使武寧郡王居官以治稱清寧初薨年三十九追封齊王孝先字延寧小字哈里統和十八年補祗候郎君尚南陽公主拜駙馬都尉開泰五年為國舅詳衮將兵城東鄙還為南京統軍使太平三年為漢人行宫都部署尋加太子太傅五年遷上京留守以母老求侍復為國舅詳衮改東京留守會大延琳反被圍數月穴地而出延琳平留守上京十一年帝不豫欽哀召孝先總禁衛事興宗諒隂欽哀弑仁徳皇后孝先與蕭楚布蕭必塔等謀居多及欽哀攝政遙授天平軍節度使加守司徒兼政事令重熙初封楚王為北院樞密使孝先以椒房親為太后所重在樞府好惡自恣權傾人主朝多側目二年太后與孝先謀廢立事帝知之勒衛兵出宫召孝先至諭以廢太后意孝先震懾不能對遷太后于慶州孝先恒鬱鬱不樂四年徙王晉後為南京留守卒諡忠肅孝友字塔布延小字辰瑠開泰初以戚屬為小將軍太平初以大冊加左武衛大將軍檢校太保賜名孝友重熙元年累遷西北路招討使封蘭陵郡王八年進王陳先是蕭恵為招討使専以威制西羌諸夷多叛孝友下車厚加綏撫每入貢輒增其賜物羌人以安久之寖成姑息諸夷桀驁之風遂熾議者譏其過中十年加政事令賜効節宣庸定逺功臣更王吳後以葬兄孝穆孝忠還京師拜南院樞密使加賜翊聖協穆保義功臣進王趙拜中書令丁母憂起復北府宰相出知東京留守會伐夏孝友與樞密使蕭惠失利河南帝欲誅之太后救免復為東京留守徙王燕改上京留守更王秦清寧初加尚父頃之復留守東京明年復為北府宰相帝親製誥詞以褒寵之以柴冊恩遙授洛京留守益賜純徳功臣致仕進封豐國王坐子呼圖克首與重元亂伏誅年七十三呼圖克在逆臣傳蕭博諾字留隱奚王楚布寧之後幼孤貧傭于醫家牧牛傷人稼數遭笞辱醫者嘗見博諾熟寐有蛇遶身異之教以讀書聰敏嗜學不數年渉獵經史習騎射既冠意氣豪邁開泰間選充䕶衛稍進用俄坐罪黥流烏爾古久之召還累任劇遷奚六部大王治有聲太平九年大延琳據東京叛博諾為都監將右翼軍遇賊戰蒲水中軍少却博諾與左翼軍夾攻之先據高麗女直要衝使不得求援又敗賊于手山延琳走入城博諾不介馬而馳追殺餘賊已而大軍圍東京博諾討諸叛邑平吼山賊延琳堅守不敢出既被擒博諾以功加兼侍中重熙六年改北準布副部署再授奚六部大王十八年為西南面招討使西征夏國博諾以兵二千據河橋聚巨艦數十艘仍作大鉤人莫測戰之日布舟于河綿亘三十餘里遣人伺上流有浮物輒取之大軍既失利博諾未知適有大木順流而下勢將壞浮梁斷歸路操舟者爭鉤致之橋得不壞明年復西征懸兵深入大掠而還復奚六部大王致仕卒耶律布庫字提隱太祖弟蘇之四世孫以武勇稱統和初為涿州刺史從伐高麗有功開泰末為上京内客省副使太平二年城鴨綠江布庫守之在鎮有治績五年改廣徳軍節度使尋遷東京統軍使涖政嚴肅諸部懾服九年大延琳叛以書結保州夏行美執其人送布庫布庫入據保州延琳氣沮以功拜特哩衮十一年為子鐵驪所弑夏行美渤海人太平九年大延琳叛時行美總渤海軍于保州延琳使人説欲與俱叛行美執送統軍耶律布庫又誘賊黨百人殺之延琳謀沮迺嬰城自守數月而破以功加同政事門下平章事錫賚甚厚明年擢忠順軍節度使重熙十七年遷副部署從㸃檢耶律義先討富珠哩獲其酋托多羅以歸致仕卒上思其功遣使祭于家論曰不有君子其能國乎方其擒延琳定遼東一時諸將之功偉矣宜其撫劒抵掌賈餘勇以威天下也蕭孝穆之諫南侵其意防何其𢎞逺歟是豈瞋句語難者所能知哉至論移風俗為治之本親煩碎為失大臣體又何其深切著明也為國寶臣宜矣孝先預弑仁徳之謀猶依城社以逃熏灌為國巨蠧雖功何議焉遼史卷八十七遼史卷八十七考證蕭孝穆傳孝穆二子阿拉薩巴按聖宗本紀太平四年以孝穆子蕭順為千牛衛將軍百官志同考孝穆子無有名順者此處薩巴傳有加千牛衛大將軍正與紀合疑蕭順即薩巴之賜名紀載互異也蕭博諾傳十八年為西南招討使西征夏國按興宗本紀及西夏外紀俱係重熙十八年伐夏刻本舊作十五年係誤謹據改遼史卷八十七考證
