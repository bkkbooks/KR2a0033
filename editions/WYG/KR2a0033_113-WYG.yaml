body:
  text: 遼史卷一百十三元中書右丞相總裁托克托等修列傳第四十三逆臣中蕭翰一名迪里字哈準宰相達魯之子天贊初唐兵圍鎮州節度使張文禮遣使告急翰受詔與康末怛徃救克之殺其將李嗣昭拔石城㑹同初領漢軍侍衛八年伐晉敗晉將杜重威追至望都翰奏曰可令軍下馬而射帝從其言軍士歩進敵人持短兵猝至我軍失利帝悔之曰此吾用言之過至此及從駕入汴為宣武軍節度使㑹帝崩欒城世宗即位翰聞之委事於李從敏徑趍行在是年秋世宗與皇太后相拒於潢河横渡和議未定太后問翰曰汝何怨而叛對曰臣母無罪太后殺之以此不能無憾初耶律烏哲以附太后被囚翰聞而快之即囚所謂曰汝嘗言我輩不及今在狴犴何也對曰第願公不至如此翰黙然天祿二年尚帝妹額伯哩後與天徳謀反下獄復結特哩衮瑠格及其弟璸都亂耶律實喇告烏哲烏哲遽入奏翰等不伏帝不欲發其事烏哲固諍以為不可乃詔烏哲鞫案翰伏辜帝竟釋之復與公主以書􅀈明王安圖反烏哲得其書以奏翰伏誅徳哷字蘇蘭六院額爾竒木博果濟之後天顯中為中臺省右相會同二年與趙思溫持節冊晉帝及我師伐晉至滹沱河降晉將杜重威徳哷功居多大同元年平相州之叛斬首數萬世宗即位遣使馳報仍命徳哷執偏將珠展以來其使誤入珠展營珠展得詔反誘徳哷執送太后徳哷亡歸世宗和約既成封燕王為南京留守天祿五年察克弑逆徳哷方醉其妻扶入察克之幕因從之明旦壽安王討亂凡脅從者皆棄兵降徳哷不降陵遲而死妻子皆誅朗字烏紳季父房阿古齋之孫性輕佻多力人呼為呼遜天顯間以材勇進每戰輒克由是得名㑹同九年太宗入汴命知澶淵控扼河渡天祿元年燕趙以南皆應劉知逺朗與汴守蕭翰棄城歸闕初朗祖阿古齊為其弟希達詐取額爾竒木自是族中無任六院職事者世宗不悉其事以朗為六院大王及察克作亂遣人報朗曰事成矣朗遣詳衮蕭呼哩以所部軍徃命曰當持兩端助其勝者穆宗即位伏誅籍其家屬瑠格字明隠太祖兄伊徳實之子㓜驕狠好陵侮人長益兇狡太宗惡之使守邊徼累遷西南邊大詳衮㑹同十年叔父安圖從帝伐晉以病先歸與瑠格鄰居世宗立於軍中安圖議所徃瑠格首建附世宗之䇿以本部兵助之時太后命皇太弟魯呼率兵而南瑠格安圖遇于泰徳泉既接戰安圖墜馬王子天徳馳至欲以槍刺之瑠格以身衛安圖射天徳貫甲不及膚安圖得馬復戰太弟兵敗瑠格與安圖朝於行在及和議成太后問瑠格曰汝何怨而叛對曰臣父無罪太后殺之以此怨耳事平以功為特哩衮天祿中與弟璸都王子天徳侍衛蕭翰謀反耶律實喇發其事瑠格以飾辭免後請帝博欲因進酒弑逆帝覺之不果被囚一日召瑠格鎖項以博帝問汝實反耶瑠格誓曰臣若有反心必生千頂疽死遂貰之耶律烏哲固諍以為罪在不赦上命烏哲按之具服詔免死流烏爾古部果以千頂疽死弟璸都璸都殘忍多力膚若蛇皮天祿初以族屬為皮室詳衮二年與兄瑠格謀反免死使於哈噶斯國既還復預察克之亂陵遲而死異母弟二人和科里希斯應厯初無職任以族子甚見優禮三年或告和科里希斯與衛王完謀逆下獄飾辭獲免四年春復反伏誅哈斯字鐸衮隋國王實嚕之庶子機警口辯㑹同五年詔求直言時哈斯年十八衣羊裘乗牛詣闕有司問曰汝何故來對曰應詔言事苟不以貧稚見遺亦可備直言之選有司以聞㑹帝將出臘使謂曰俟吾還則見之哈斯曰臣以陛下急於求賢是以來耳今反緩於獵請從此歸帝聞即召見賜坐問以治道命明王安圖與耶律佛徳試之數日安圖等奏曰哈斯之材臣等所不及帝召哈斯問曰與汝言者何如人也對曰安圖言無収檢若空車走峻坂佛徳如著靴行曠野射鴇帝大笑擢宣嶽使屢任以事帝知其貧以金器賜之哈斯即散於親友後從帝伐晉有功世宗即位於軍中皇太后以兵逆於潢河横渡太后遣耶律烏哲責世宗自立烏哲至帝前諭㫖不屈世宗遣哈斯對亦不遜且命之曰汝見烏哲勿懼哈斯見太后還不稱㫖既和領太后諸局事穆宗即位與冀王迪里謀反死獄中迪里字烏納六院額爾竒木卓巴勒之子少多詐世宗即位為羣牧都林牙察克謀亂官僚多被繋及壽安王與耶律烏哲率兵來討諸黨以次引去察克度事不成即詣囚所持弓矢脅曰悉殺此曹迪里進曰殺何益於事竊料烏哲將立夀安王故為此舉且夀安未必知若遣人籍此為辭度可免察克曰如公言誰可使者迪里曰大王若不疑迪里請與雅斯哈同徃説之察克遣之壽安王用迪里計誘殺察克凡被脅之人無一被害者皆迪里之力亂既平帝嘉賞然未顯用迪里失望居常怏怏結羣不逞隂懐不軌應厯二年與其黨謀立隆科事覺陵遲死蕭格小字華格字和爾沁國舅房林牙華善之子警悟多智數太平初累遷官職游近習間以諛悦相比昵為流輩所稱由是名達於上重熙初拜北面林牙十二年為北院樞密副使帝嘗與近臣宴謂格曰朕知卿才故自拔擢卿宜勉力格曰臣不才誤䝉聖知無以報萬一惟竭愚衷安敢怠明年拜北府宰相十五年改同知北院樞密事格恃權寵同僚具位而已時伊勒希巴耶律義先知格姦佞因侍燕言格所短用之將敗事帝不聽一日上令義先對格巡擲義先酒酣曰臣備位大臣縱不能進忠去佞安能與賊博乎格銜之佯言曰公相謔不既甚乎義先詬詈不已帝怒皇后解之曰義先酒狂醒可治也翌日上詔格謂曰義先無禮可痛䋲之格曰義先之才豈逃聖鍳然天下皆知忠直今以酒過為罪恐咈人望帝以格犯而不校眷遇益厚其矯情媚上多此類拜南院樞密使詔班諸王上封吳王改知北院進王鄭兼中書令帝大漸詔格曰大位不可一日曠朕若弗寤宜即令燕趙國王嗣位清寜元年復為南院樞密使更王楚復徙北院與國舅蕭阿拉同掌朝政格多私撓阿拉每裁正之由是有隙出阿拉為東京留守㑹南郊阿拉以例赴闕帝訪羣臣以時務阿拉陳利病言甚激切格伺帝意不悦因譛曰阿拉恃寵有慢上心非臣子禮帝大怒縊阿拉于殿下後上知格姦計寵遇漸衰八年致仕封鄭國王九年秋格以其子為重元壻格預其謀陵遲殺之遼史卷一百十三遼史卷一百十三考證復與公主以書結明主王安圖反明王安圖原文訛安圖今改正又朗傳朗祖阿古齊原文前作罨古只後又作罨谷只並畫一改榴格傳㑹同十年叔父安圖從帝伐晉以病先歸按遼太宗伐晉始於㑹同六年冬十二月是月即有命安圖等由滄恒易定分道進繼以大軍之詔越明年春安圖入雁門圍忻代是年遼晉相持冬復徴兵南伐明年春與晉數戰遼軍不利至㑹同九年冬十一月遼大敗晉軍晉將杜重威等率部衆降乃晉帝素服拜命是太宗親征由六年至九年而罷無九年以後事也又㑹同九年之明年改年大同元年傳稱㑹同十年尤非今仍原文而識其誤遼史卷一百十三考證
