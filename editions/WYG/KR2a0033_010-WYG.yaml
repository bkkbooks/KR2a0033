body:
  text: 遼史卷十元中書右丞相總裁托克托等修本紀第十聖宗一聖宗文武大孝宣皇帝諱隆緒小字文殊努景宗皇帝長子母曰睿智皇后蕭氏帝幼喜書翰十嵗能詩既長精射法曉音律好繪畵乾亨二年封梁王四年九月壬子景宗崩癸丑即皇帝位於柩前時年十二皇后奉遺詔攝政詔諭諸道冬十月己未朔帝始臨朝辛酉羣臣上尊號曰昭聖皇帝尊皇后為皇太后大赦以南院大王巴古濟總領山西諸州事北院大王裕悦休格為南面行軍都統奚王和碩鼐副之同政事門下平章事蕭道寜領本部軍駐南京乙丑如顯州十一月甲午置乾州十二月戊午耶律蘇色討凖布辛酉南京留守荆王道隱奏宋遣使獻犀帶請和詔以無書却之甲子達爾罕納旺舒克醉言宫掖事法當杖釋之辛未南面招討使秦王韓匡嗣薨癸酉奉大行皇帝梓宫于菆塗殿庚辰省置中臺省官統和元年春正月戊午朔以大行在殯不受朝乙丑奉遺詔召先帝庶兄扎穆于菆塗殿前復封寜王加宰相室昉宣徽使布琳等恩丙寅荆王道隱有疾詔遣使存問是日皇太后幸其邸視疾戊辰以威烏庫哩部節度使耶律章烏克同政事門下平章事甲戌荆王道隱薨輟朝三日追封晉王遣使撫慰其家丙子以裕悦休格為南京留守仍賜南面行營總管印綬總邊事渤海塔瑪嘉哩以受先帝厚思乞殉𦵏詔不許賜物以旌之戊寅遣使賜裕悦休格及奚王籌寜統軍使佛德等湯藥命根敦持送休格下車牓以諭燕民辛巳蘇色獻準布俘壬午涿荆刺史安吉奏宋築城河北詔留守裕悦休格撓之勿令就功趙妃及公主和克丹奚王籌寜宰相安寜北大王普努寜特哩衮庫哩吳王舒寜王扎穆撗帳國舅契丹漢官等並進助山陵費癸未齊國公主率内外命婦進物如之甲申西南面招討使韓德威奏党項十五部侵邊以兵擊破之乙酉以蘇色破準布下詔褒美仍諭與達罕討党項諸部丁亥樞密使兼政事令室昉以年老請解兼職詔不允二月戊子朔禁所在官吏軍民不得無故聚衆私語及冒禁夜行違者坐之己丑南京奏聞宋多聚糧邊境及宋主將如臺山詔休格嚴為之備甲午𦵏景宗皇帝於乾陵以近幸朗掌飲伶人塔魯為殉上與皇太后因為書附上大行丙申皇太后詣陵置奠命繪近臣於御容殿賜山陵工人物有差庚子以先帝遺物賜皇族及近臣辛丑南京統軍使耶律善補奏宋邊七十餘村來附詔撫存之乙巳以御容殿為玉殿酒谷為聖谷蘇色奏討党項捷遣使慰勞戊申以特哩衮華格為北院大王解領為南府宰相辛亥幸聖山遂謁三陵甲寅以皇女長壽公主下嫁國舅宰相蕭婆項之子吳留三月戊午天徳軍節度使推勒父子戰殁以其弟聶哷襲爵己未次獨山遣使賞西南面有功將士辛酉以大父帳太尉耶律赫勒訥為特哩衮甲子駐蹕遼河之平淀辛巳以國舅同平章事蕭道寜為遼興軍節度使仍賜號忠亮佐理功臣壬午以青牛白馬祭天地夏四月丙戌朔幸東京以樞宻副使耶律穆濟兼侍中為東京留守庚寅謁太祖廟癸巳詔賜物命婦寡居者丙申南幸辛丑謁三陵以東京所進物分賜陵寢官吏復詔賜西南路招討使達罕劒不用命者得專殺壬寅致享于凝神殿癸卯謁乾陵乙巳遣人以酒脯祭平章耶律哈雅墓庚戌幸夫人烏庫哩第謁太祖御容禮畢幸公主和克丹第飲賜與甚厚壬子大臣以太后預政宜有尊號請下有司詳定册禮詔樞密院諭沿邊節將至行禮日止遣子弟奉表稱賀恐失邊備樞密請詔北府司徒佛德譯南京所進律文從之遂如徽州以耶律慶朗為信州節度使五月丙辰朔國舅政事門下平章事蕭道寜以皇太后慶壽請歸父母家行禮而齊國公主及命婦羣臣各進物設宴賜國舅帳耆年物有差壬戌西南路招討請益兵討西突厥諸部詔北王府耶律普努寜以達巴德哷二部兵赴之癸亥以裕悦休格在南院過用吏人詔南大王毋相循襲庚午耶律善補招亡入宋者得千餘户歸國詔令撫慰辛未次永州祭王子藥師努墓乙亥詔近臣議皇太后上尊號册禮樞密使韓德度以後漢太后臨朝故事草定上之丙子以青牛白馬祭天地戊寅幸木葉山西南路招討使達罕奏近遣伊喇伯勒格諭党項諸部來者甚衆下詔褒美六月乙酉朔詔有司册皇太后日給三品以土法服三品以下用大射柳之服西南路招討使奏党項酋長執額爾竒木子烏延等内附詔撫納之仍察其誠偽謹邊備丙戌還上京己丑有司奏同政事門下平章事駙馬都尉盧俊與公主不恊詔離之遂出俊為興國軍節度使辛卯有事于太廟甲午上率羣臣上皇太后尊號曰承天皇太后羣臣上皇帝尊號曰天輔皇帝大赦改元統和丁未覃恩中外文武官各進爵一級以樞密副使耶律色珍守司徒秋七月甲寅朔皇太后聴政乙卯上親錄囚王子司徒隆科坐稱疾不赴山陵笞二十辛酉行再生禮癸酉臨潢尹諾觀進飲饌上與諸王分朋擊鞠丙子韓徳威遣詳衮哈爾瑪上破党項俘獲以額爾竒木之子來獻辛巳賞西南面有功將士八月戊子上西巡己丑謁祖陵辛卯皇太后祭楚國王蕭思温墓癸巳上與皇太后謁懐陵遂幸懷州甲午上與色珍於太后前易弓矢鞍馬約以為友己亥獵赤山遣使薦熊肪鹿脯于乾陵之凝神殿以政事令孫楨無子詔國舅小翁帳郎君托卜威為後乙巳詔裕悦休格提㸃元城壬子韓德威表請伐党項之復叛者詔許之仍發别部兵數千以助之九月癸丑朔以東京平州旱蝗詔賑之乙卯謁永興長寜敦睦三宫丙辰南京留守奏秋霖害稼請權停闗征以通山西糴易從之庚申謁宣簡皇帝廟辛酉幸祖州謁祖陵壬戌還上京辛未有司請以帝生日為千齡節從之皇太后言故裕悦烏哲有傅𨗳功宜錄其子孫遂命其子巴延為林牙丙子如老翁川冬十月癸未朔司天奏老人星見戊子以公主淑格下嫁國舅詳衮珠克癸巳蘇色奏德哷部及叛畨來降悉復故地乙未以燕京留守裕悦休格言毎嵗諸節度使貢獻如契丹官例止進鞍馬從之丁酉以吳王舒為上京留守行臨潢尹事上將征高麗親閲東京留守耶律穆濟所總兵馬丙午命宣徽使兼侍中布琳林牙克特等將兵東討賜旗鼓及銀符十一月壬子朔觀漁塔瑪濼癸丑應州奏獲宋諜者言宋除道五臺山將入靈丘界詔諜者及居停人並磔于市庚辰上與皇太后祭乾陵下詔諭三京左右相左右平章事副留守判官諸道節度使判官諸軍事判官錄事參軍等當執公方毋得阿順諸縣令佐如遇州官及朝使非理徵求毋或畏徇恒加采聴以為殿最民間有父母在别籍異居者聴鄰里覺察坐之有孝于父母三世同居者旌其門閭十二月壬午朔謁凝神殿遣使分祭諸陵賜守殿官屬酒是日幸顯州丁亥以顯州嵗貢綾錦分賜左右甲午東幸己亥皇太后觀漁于玉盆灣辛丑觀漁于濬淵甲辰勅諸刑辟己結正决遣而有寃者聴詣臺訴是夕然萬魚燈于雙溪戊申千齡節祭日月禮畢百僚稱賀二年春正月甲子如長濼二月癸巳國舅帳彰德軍節度使蕭達林來朝甲午賜將軍耶律德布春衣束帶丙申東路行軍宣徽使蕭布琳奏討女直捷遣使執手奬諭庚子朝皇太后太后因從觀獵于饒樂川乙巳五國威伊濟節度使耶律威烏克以所轄諸部難治乞賜詔給劔便宜行事從之丙午上與諸王大臣較射丁未韓德威以征党項囬遂襲河東獻所俘賜詔褒美三月乙卯華喇部請今後詳衮止從本部選授為宜上曰諸部官惟在得人豈得定以所部為限不允贈故同平章事趙延煦兼侍中夏四月丁亥以宣徽使同平章事蕭布琳都監蕭勤德獻征女直捷授布琳兼政事令勤德神武衛大將軍各賜金器諸物庚寅皇太后臨決滯獄辛卯祭風伯壬辰以宣徽南院使劉承規為承徳軍節度使崇德宫都部署保義軍節度使張德筠為宣徽北院使五月乙卯祠木葉山丁丑駐蹕沿柳湖六月己卯朔皇太后决獄至月終秋七月癸丑皇太后行再生禮八月辛卯東京留守兼侍中耶律穆濟奉女直珠卜竒薩里等八族乞舉衆内附詔納之九月戊申朔駐蹕土河辛未以景宗忌日詔諸道京鎮遣官行香飯僧冬十月丁丑朔以歸化州刺史耶律布琳為彰德軍節度使右武衛大將軍韓倬為彰德軍節度使兼侍衛親軍兵馬都指揮使十一月壬子以樞密直學士兼給事中鄭嘏為儒州刺史是月蘇色等討準布殺其酋長達爾罕十二月辛丑以翰林學士承㫖馬得臣為宣政殿學士耶律佛德南京統軍使耶律瑤昇大内特哩衮大仁靖東京中臺省右平章事三年春正月丙午朔如長濼丁巳以翰林學士邢抱朴為尚書禮部侍郎知制誥左拾遺知制誥劉景吏部郎中知制誥牛藏用並政事舍人二月丙子朔以牛藏用知樞密直學士三月乙巳朔樞密奏契丹諸役户多困乏請以富戸代之上因閲諸部籍以納喇威二部戸少而役重并量免之夏四月乙亥朔祠木葉山壬午以鳳州刺史趙匡符為保靜軍節度使癸未以左監門衛大將軍王庭朂為奉先軍節度使彰武軍節度使韓德凝為崇義軍節度使五月壬子還上京癸酉以國舅蕭道寜同平章事知瀋州軍州事六月甲戌如栢坡皇太后親決滯獄乙亥以歸義軍節度使王希嚴為興國軍節度使秋七月甲辰朔詔諸道繕甲兵以備東征高麗甲寅東幸甲子遣郎君巴寜賜秦王韓匡嗣𦵏物丙寅駐蹕土河以暴漲命造船橋明日乘步輦出聴政老人星見丁卯遣使閲東京諸軍兵器及東征道路以平章事蕭道寜為昭德軍節度使武定軍節度使守司空兼政事令郭襲為天平軍節度使大同軍節度使守太子太師兼政事令劉延構為義成軍節度使贈尚父秦王韓匡嗣尚書令八月癸酉朔以遼澤沮洳罷征高麗命樞密使耶律色珍為都統駙馬都尉蕭懇德為監軍以兵討女直丁丑次稾城庚辰至顯州謁凝神殿辛巳幸乾州觀新宫癸未謁乾陵甲申命南北面臣僚分巡山陵林木及令乾顯二州上所部里社之數丙戌北皮室詳衮進勇敢士七人戊子故南院大王錫喇伊囉斡妻蕭氏奏夫死不能𦵏詔有司助之庚寅東征都統所奏路尚陷濘未可進討詔候澤涸深入癸巳皇太后謁顯陵庚子謁乾陵辛丑西幸閏九月癸酉命邢抱朴勾檢顯陵丙子行次海上庚辰重九駱駞山登高賜羣臣菊花酒辛巳詔諭東征將帥乘水涸進討丙申女直宰相哲伯埒來貢戊戌駐蹕東古山己亥蘇色奏珠巴克諸部至近淀額爾竒木伊楞古請俘掠上曰諸部於國無惡何故俘掠徒生事耳不允冬十一月甲戌詔吳王舒領秦王韓匡嗣𦵏祭事丁丑詔以東北路兵馬監軍妻布達拉存撫邊民戊寅賜公主和克丹𦵏夫金帛工匠辛卯以韓德讓兼政事令癸巳禁行在市易布帛不中尺度者丙申東征女直都統蕭達林菩薩努以行軍所經地里物産來上遼史卷十遼史巻十考證聖宗即位之十二月戊午按厯象志朔考是年十二月戊午係朔日統和元年二月以特哩衮華格為北院大王按華格傳華格以平宋功遷北院大王事在統和四年統和元年四月幸公主和克丹第按和克丹原文胡骨典公主表作和骨典此處又訛胡克典今併改統和元年六月大赦改元統和按續通鑑改元統和復國號大契丹紀不書復國號事統和二年二月彰德軍節度使蕭達林來朝按達林原文撻凛又作闥覧本紀統和七年以前俱作闥覧十二年以後俱作撻凛實係一人考本傳作撻凛今畫一改統和二年四月宣徽使同平章事蕭布琳獻女直捷按布琳姓蕭氏原文作普領又作蒲寜又作普寜至此處并訛其姓為耶律遂與北院大王耶律普努寜原文普奴寜又作蒲奴寜者相混二人史皆無傳均見于聖宗本紀布琳自統和元年正月初見為宣徽使至七年四月率兵備宋凡十見其官始終以宣徽使稱普努寜自統和元年正月至四年十二月本紀凡八見其官始終以北院大王稱今並分别改正惟二年十月以歸化州刺史耶律普寜為彰德軍節度使又别是一人今仍原文統和二年六月己卯朔按宋史是年六月庚辰朔統和二年十一月壬子按原本壬子上衍冬字上文已於十月標明今刪統和二年十二月耶律瑤昇大内特哩衮按瑤昇即耶律善補之字見本傳統和三年八月駙馬都尉蕭恒德為監軍按蕭恒德統和元年尚越國公主原本訛恒德為懇德今改統和三年閏九月駐蹕東古山按遊幸表作東右山遼史巻十考證
