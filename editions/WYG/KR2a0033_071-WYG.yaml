body:
  text: 遼史卷七十一元中書右丞相總裁托克托等修列傳第一后妃肅祖昭烈皇后蕭氏懿祖莊敬皇后蕭氏𤣥祖簡獻皇后蕭氏徳祖宣簡皇后蕭氏太祖淳欽皇后舒嚕氏太宗靖安皇后蕭氏世宗懐節皇后蕭氏世宗妃甄氏穆宗皇后蕭氏景宗睿知皇后蕭氏聖宗仁徳皇后蕭氏聖宗欽哀皇后蕭氏興宗仁懿皇后蕭氏興宗貴妃蕭氏道宗宣懿皇后蕭氏道宗恵妃蕭氏天祚皇后蕭氏天祚徳妃蕭氏天祚文妃蕭氏天祚元妃蕭氏書始嬪虞詩興闗雎國史記載往往自家而國以立天下之本然尊卑之分不可易也司馬遷列吕后于紀班固因之而傳元后於外戚之後范煜登后妃于帝紀天子紀年以叙事謂之紀后曷為而紀之自晉史列諸后以首傳隋唐以來莫之能易也遼因突厥稱皇后曰哈屯國語謂之多爾吉尊稱曰納額黙蓋以配后土而母之云太祖稱帝尊祖母曰太皇太后母曰皇太后嬪曰皇后等以徽稱加以美號質於隋唐文於故俗后族唯伊蘇巴哩氏而世任其國事太祖慕漢高皇帝故耶律儼稱劉氏以伊蘇巴哩比蕭相國遂為蕭氏耶律儼陳大任遼史后妃傳大同小異酌取其當著于篇肅祖昭烈皇后蕭氏小字卓沁歸肅祖生四子見皇子表乾統三年追尊昭烈皇后懿祖莊敬皇后蕭氏小字伊勒希肅祖嘗過其家曰同姓可結交異姓可結婚知為蕭氏為懿祖聘焉生男女七人乾統三年追尊莊敬皇后𤣥祖簡獻皇后蕭氏小字鄂爾多𤣥祖為朗徳所害后嫠居恐不免命四子依鄰家耶律塔雅克乃獲安太祖生后以骨相異常懼有隂圖害者鞠之别帳重熙二十一年追尊簡獻皇后徳祖宣簡皇后蕭氏小字伊木沁約尼氏宰相塔拉之女男女六人太祖長子也天顯八年十一月崩祔徳陵重熙二十一年追尊宣簡皇后太祖淳欽皇后舒嚕氏諱平小字鄂爾多其先回鶻人諾蘇生諤尼沙哩勒諤尼沙哩勒生舒舒梅楞舒舒梅楞生巴噶穆爾巴噶穆爾娶伊勒都齊王女生后于契丹右大部巴噶穆爾名淵仕約尼氏為額珍尼郭齊喀后凝斷有雄畧嘗至遼土二河之㑹有女子乗青牛車倉卒避路忽不見未幾童謠曰青牛嫗曽避路葢諺謂地祇為青牛嫗云太祖即位羣臣上尊號曰地皇后神冊元年大冊加號應天大明地皇后行兵御衆后嘗與謀太祖渡磧襲党項黄頭臭泊二室韋后勒兵以待奮擊大破之時晉王李存朂欲結援以叔母事后幽州劉守光遣韓延徽求援不拜太祖怒留之使牧馬后曰守節不屈賢者也宜禮用之太祖乃召延徽與語大悦以為謀主吳主李昪獻猛火油以水沃之愈熾太祖選三萬騎以攻幽州后曰豈有試讐而攻人國者指帳前樹曰無皮可以生乎太祖曰不可后曰幽州之有土有民亦由是耳吾以三千騎掠其四野不過數年困而歸我矣何必為此萬一不勝為中國笑吾部落不亦解體乎其平渤海后與有謀太祖崩后稱制攝軍國事及葬欲以身殉親戚百官力諫因㫁右腕納于柩太宗即位尊為皇太后㑹同初上尊號曰廣徳至仁昭烈崇簡應天太后初太祖嘗謂太宗必興我家后欲令皇太子貝避之太祖冊貝為東丹王太祖崩太宗立東丹王避之唐太后嘗屬意於少子魯呼太宗崩世宗即位于鎮陽太后怒遣魯呼以兵逆擊魯呼敗太后親率師遇于潢河之横渡頼耶律烏哲諫罷兵遷太后于祖州應厯三年崩年七十五祔祖陵諡曰貞烈重熙二年一年更今諡太宗靖安皇后蕭氏小字温淳欽皇后弟舒嚕之女帝為大元帥納為妃生穆宗及即位立為皇后性聰慧潔素尤被寵顧雖軍旅田獵必與天顯十年崩諡彰徳葬奉陵重熙二十一年更今諡世宗懐節皇后蕭氏小字蘇克濟淳欽皇后弟阿古齊女帝為永康王納之生景宗天祿四年立為皇后明年秋生孟古公主在蓐察克作亂殺太后及帝后乗步輦直詣察克請畢收殮明日遇害諡曰孝烈皇后重熙二十一年更今諡世宗妃甄氏後唐宫人有姿色帝從太宗南征得之寵遇甚厚生寧王扎穆及即位立為皇后嚴明端重風神閑雅内治有法莫干以私劉知逺郭威稱帝世宗承强盛之資奄奄嵗時后與參帷幄密贊大謀不果用察克作亂遇害景宗立葬二后于醫巫閭山建廟陵寢側穆宗皇后蕭氏父知璠内供奉翰林承㫖后生有雲氣馥郁久之幼有儀則帝居藩納為妃及正位中宫性柔婉不能規正無子景宗睿知皇后蕭氏諱綽小字燕燕北府宰相思温女早慧思温嘗觀諸女掃地惟后潔除喜曰此女必能成家帝即位選為貴妃尋冊為皇后生聖宗景宗崩尊為皇太后攝國政后泣曰母寡子弱族屬雄强邊防未靖奈何耶律色珍韓徳讓進曰信任臣等何慮之有於是后與色珍徳讓參決大政委裕悦休格以南邊事統和元年上尊號曰承天皇太后二十四年加上尊號曰睿徳神畧應運啓化承天皇太后二十七年崩諡曰聖神宣獻皇后重熙二十一年更今諡后明達治道聞善必從故羣臣咸竭其忠習知軍政澶淵之役親御戎車指麾三軍賞罰信明將士用命聖宗稱遼盛主后教訓為多聖宗仁徳皇后蕭氏小字菩薩格睿智皇后弟烏延之女年十二美而才選入掖庭統和十九年冊為齊天皇后嘗以草莛為殿式密付有司令造清風天祥八方三殿既成益寵異所乗車置龍首鴟尾飾以黄金又造九龍輅諸子車以白金為浮圖各有巧思夏秋從行山谷間花木如繡車服相錯望若神仙生皇子二皆早卒開泰五年宫人訥木錦生興宗后養為子帝大漸訥木錦詈后曰老物寵亦有既耶左右扶后出帝崩訥木錦自立為皇太后是為欽哀皇后䕶衛馮嘉努吉遜等希㫖誣告北府宰相蕭珠卜國舅蕭必塔謀逆詔命鞫治連及后興宗聞之曰皇后侍先帝四十年撫育𦕈躬當為太后今不果反罪之可乎欽哀曰此人若在恐為後患帝曰皇后無子而老雖在無能為也欽哀不從遷后于上京車駕春蒐欽哀慮帝懐鞠育恩馳遣人加害使至后曰我實無辜天下共知卿待我浴而後就死可乎使者退比反后已崩年五十是日若有見后于木葉山隂者乗青葢車衛從甚嚴追尊仁徳皇后與欽哀竝祔慶陵聖宗欽哀皇后蕭氏小字訥木錦淳欽皇后弟阿古齊五世孫黝面狠視母嘗夢金柱擎天諸子不能上后後至與僕從皆陞異之久之入宫嘗拂承天太后榻獲金雞吞之膚色光澤勝常太后驚異曰是必有竒子已而生興宗仁徳皇后無子取而養之如已出后以興宗侍仁徳皇后謹不悦聖宗崩令馮嘉努等誣仁徳皇后與蕭珠卜蕭必塔等謀亂從上京害之自立為皇太后攝政以生辰為應聖節重熙元年尊為仁慈聖善欽孝廣徳安靜貞純寛厚崇覺儀天皇太后三年后隂召諸弟議欲立少子重元重元以所謀白帝帝收太后符璽遷于慶州七括宫八年秋帝悔之親馭奉迎侍養益孝謹后常不懌帝崩殊無戚容見崇聖皇后悲泣如禮謂曰汝年尚幼何哀痛如是清寧初尊為太皇太后崩諡曰欽哀皇后后初攝政追封曽祖為蘭陵郡王父為齊國王諸弟皆王之雖漢五侯無以過興宗仁懿皇后蕭氏小字托哩欽哀皇后弟孝穆之長女性寛容姿貎端麗帝即位入宫生道宗重熙四年立為皇后二十三年號貞懿慈和文恵孝敬廣愛崇聖皇后道宗即位尊為皇太后清寧二年上尊號曰慈懿仁和文恵孝敬廣愛宗天皇太后九年秋敦睦宫使耶律良以重元與其子尼嚕古反狀密告太后乃言于帝帝疑之太后曰此社稷大事宜早為計帝始戒嚴及戰太后親督衛士破逆黨太康二年崩諡仁懿皇后仁慈淑謹中外感徳凡正旦生辰諸國貢幣悉賜貧瘠嘗夢重元曰臣骨在太子山北不勝寒栗寤即命屋之慈憫類此興宗貴妃蕭氏小字繖察駙馬都尉匹勒之女選入東宫帝即位立為皇后重熙初以罪降貴妃道宗宣懿皇后蕭氏小字觀音欽哀皇后弟樞密使恵之女姿容冠絶工詩善談論自制歌詞尤善琵琶重熙中帝王燕趙納為妃清寧初立為懿徳皇后皇太叔重元妻以艶冶自矜后見之戒曰為貴家婦何必如此后生太子濬有專房寵好音樂伶官趙惟一得侍左右太康初宫婢單登教坊朱頂鶴誣后與惟一私樞密使耶律伊遜以聞詔伊遜與張孝傑劾狀因而實之族誅惟一賜后自盡歸其屍於家乾統初追諡宣懿皇后合葬慶陵道宗恵妃蕭氏小字塔斯駙馬都尉錫黙之妹太康二年伊遜譽之選入掖庭立為皇后居數嵗未見皇嗣后姝額特埒先嫁伊遜子蘇頁后以宜子言于帝離婚納之宫中及皇孫延禧封梁王降為恵妃徙乾陵額特埒還其家頃之其母燕國夫人厭魅梁王伏誅貶妃為庶人幽于宜州諸弟没入興聖宫天慶六年召還封太皇太妃後二年奔黒頂山卒葬太子山天祚皇后蕭氏小字多囉羅宰相繼先五世孫大安三年入宫明年封燕國王妃乾統初冊為皇后性閑淑有儀則兄弟奉先保先等縁后寵柄任女直兵至從天祚西狩以疾崩天祚徳妃蕭氏小字實古北府宰相常格之女夀隆二年入宫封燕國妃生子達魯乾統三年改徳妃以柴冊禮封達魯為燕國王加妃號贊翼王薨以哀戚卒天祚文妃蕭氏小字色色國舅大父房之女乾統初帝幸耶律塔喀第見而悦之匿宫中數月皇太叔和囉噶勸帝以禮選納三年冬立為文妃生蜀國公主晉王額嚕温尤被寵幸以柴冊加號承翼善歌詩女直既强日見侵廹帝畋遊不恤忠臣多被疎斥妃作歌諷諫其詞曰勿嗟塞上兮暗紅塵勿傷多難兮畏强隣不如塞姦邪之路兮選取賢臣直須卧薪嘗膽兮激壯士之捐身可以朝清漠北兮夕枕燕雲又歌曰丞相來朝兮劍佩鳴千官側目兮寂無聲養成外患兮嗟何及禍盡忠臣兮罰不明親戚竝居兮藩屏位私門潛畜兮爪牙兵可憐往代兮秦天子猶向宫中兮望太平天祚見而銜之播遷以來郡縣所失幾半上頗有倦勤之意諸皇子額嚕温最賢素有人望元妃兄蕭奉先深忌之誣南軍都統伊都謀立晉王以妃與聞賜死天祚元妃蕭氏小字貴格皇后之妹年十七冊為元妃性沉靜嘗書寢近侍盜貂裀妃覺而不言宫掖稱其寛厚從天祚西狩以疾薨論曰遼以鞍馬為家后妃往往長於射御軍旅田獵未嘗不從如應天之奮擊室韋承天之御戎澶淵仁懿之親破重元古所未有亦其俗也靖安無毁無譽齊天巧思乃奢侈之漸宣懿度曲知音豈致誣衊之階乎文妃能歌詩諷諫而謂謀私其子非矣若簡憲之艱危保孤懐節之從容就義雖烈丈夫何以過之欽哀狠桀賊殺嫡后而興宗不能防閑其母惜哉遼史卷七十一遼史卷七十一考證后妃傳徳祖宣簡皇后蕭氏天顯八年崩按本紀太祖立尊母蕭氏為皇太后太宗立尊皇太后為太皇太后天顯八年十一月辛丑太皇太后崩遣使告哀於唐及人皇王貝原本作十一年崩係誤今據改世宗懐節皇后蕭氏天祿四年立為皇后明年秋察克作亂弑太后及帝按本紀世宗在位五年皇后蕭氏於天祿四年冊立世宗遇弑在天祿五年原本作天祿末下接明年文義未明今據改八年秋帝悔之八年原本作六年據興宗本紀改天祚元妃蕭氏小字貴格皇后之妹皇后之妹原本作燕國妃之妹按天祚元妃乃天祚皇后之妹考天祚皇后傳云大安四年封燕國王妃又天祚徳妃傳云夀隆二年封燕國妃此但書燕國妃之妹殊未明晰今據改遼史卷七十一考證
