body:
  text: 遼史卷一百十元中聿曰右丞相總裁托克托等修列傳第四十姦臣上春秋褒貶善惡並書示勸懲也故遷固傳佞幸酷吏歐陽修則并姦臣錄之將俾為君者知所鑒為臣者知所戒此天地聖賢之心國家安危之機治亂之原也遼自耶律伊遜而下姦臣十人其敗國皆足以為戒故列於傳耶律伊遜字呼都克琨五院部人父達喇家貧服用不給人號窮達喇初伊遜母方娠夜夢手摶羖羊抜其角尾既寤占之術者曰此吉兆也羊去角尾為王字汝後有子當王及伊遜生適在路無水以浴迴車破轍忽見湧泉達喇自以得子欲酒以慶聞酒香于草棘間得二榼因祭東焉伊遜㓜慧黠甞牧羊至日昃達喇視之伊遜熟寢達喇觸之覺伊遜怒曰何遽驚我適夢人手執日月以食我我已食月㗖日方半而覺惜不盡食之達喇自是不令牧羊及長美風儀外和内狡重熙中為文班吏掌太保印陪從入宫皇后見伊遜詳雅如素宦命補筆硯吏帝亦愛之累遷䕶衛太保道宗即位以伊遜先朝任使賜漢人户四十同知㸃檢司事常召决疑議陞北院同知厯樞密副使清寧五年為南院樞密使改知北院封趙王九年耶律仁先為南院樞密使時駙馬都尉蕭呼都尭與重元黨惡仁先在朝白仁先可任西北路招討使帝將從之伊遜奏曰臣新參國政未知治體仁先乃先帝舊臣不可遽離朝廷帝然之重元亂平拜北院樞密使進王魏賜匡時翊聖竭忠平亂功臣咸雍五年加守太師詔四方有軍旅許以便宜從事勢震中外門下饋賂不絶凡阿順者䝉薦擢忠直者被斥竄太康元年皇太子始預朝政法度修明伊遜不得逞謀以事誣皇后既死伊遜不自安又欲害太子因乗間入奏曰帝與后如天地並位中宫豈可曠盛稱其黨駙馬都尉蕭錫黙之妹美而賢上信之納于宫尋冊為皇后時䕶衛蕭和克知伊遜姦狀伏橋下欲殺之俄暴雨壞橋謀不遂林牙蕭巖夀密奏曰伊遜自皇太子預政内懷疑懼又與宰相張孝傑相附㑹恐有異圖不可使居要地出為中京留守伊遜泣謂人曰伊遜無過因讒見出其黨蕭錫黙輩以其言聞於上上悔之無何出蕭巖夀為順義軍節度使詔近臣議召伊遜事北面官屬無敢言者耶律薩喇曰初以蕭巖夀奏出伊遜若所言不當宜坐以罪若當則不可復召累諌不從乃復召為北院樞密使時皇太子以母后之故憂見顔色伊遜黨欣躍相慶讒謗沸騰忠良之士斥逐殆盡伊遜因蕭錫沙之言夜召蕭塔喇台謀搆太子令䕶衛太保耶律扎拉誣告耶律薩喇等同謀立皇太子詔按無迹而罷又令牌印郎君蕭額都温詣上誣首耶律察喇前告耶律扎拉等事皆實臣亦與其謀本欲殺伊遜等而立太子臣等若不言恐亊白連坐詔使鞫劾伊遜迫令具伏上怒命誅薩喇及蘇色等伊遜恐帝疑引數人庭詰各令荷重校繩繫其頸不能出氣人人不堪其酷惟求速死反奏曰别無異辭時方暑尸不得瘞以至地臭乃囚皇太子於上京監衛者皆其黨尋遣蕭達嚕噶薩巴害太子伊遜黨大喜聚飲數日上京留守蕭塔坦以卒聞上哀悼欲召其妻伊遜隂遣人殺之以滅其口五年正月上將出獵伊遜奏留皇孫上欲從之同知㸃檢蕭烏納諫曰陛下若從伊遜留皇孫皇孫尚㓜左右無人願留臣保䕶以防不測遂與皇孫俱行由是上始疑伊遜頗知其姦㑹北幸將次黒山之平定上適見扈從官屬多随伊遜後惡之出伊遜知南院大王事及例削一字王爵改王混同意稍自安及赴闕入謝帝即日遣還改知興中府事七年冬坐以禁物鬻入外國下有司議法當死伊遜黨耶律雅克獨奏當入八議得減死論擊以鐵骨朶幽於來州後謀奔宋及私藏兵甲事覺縊殺之乾統二年發塚戮其屍張孝傑建州永霸縣人家貧好學重熙二十四年擢進士第一清寧間累遷樞密直學士咸雍初坐誤奏事出為惠州刺史俄召復舊職兼知户部司事三年參知政事同知樞密院事加工部侍郎八年封陳國公上以孝傑勤幹數問以事為北府宰相漢人貴幸無比太康元年賜國姓明年秋獵帝一日射鹿三十燕從官酒酣命賦雲上于天詩詔孝傑坐御榻傍上誦黍離詩知我者謂我心憂不知我者謂我何求孝傑奏曰今天下太平陛下何憂富有四海陛下何求帝大悦三年羣臣侍燕上曰先帝用仁先華格以賢智也朕有孝傑伊遜不在仁先華格下誠為得人歡飲至夜乃罷是年夏伊遜譛皇太子孝傑同惡相濟及伊遜受詔按皇太子黨人誣害忠良孝傑之謀居多伊遜薦孝傑忠於社稷帝謂孝傑可比狄仁傑賜名仁傑乃許放海東青鶻六年既出伊遜上亦悟孝傑姦佞尋出為武定軍節度使坐私販廣濟湖鹽及擅改詔㫖削爵貶安肅州數年乃歸大安中死於鄉乾統初剖棺戮屍以族産分賜臣下孝傑久在相位貪貨無厭時與親戚㑹飲甞曰無百萬兩黄金不足為宰相家初孝傑及第詣佛寺忽迅風吹孝傑幞頭與浮圖齊墜地而碎有老僧曰此人必驟貴然亦不得其死竟如其言耶律雅克字善寧季父房之後四世祖托音太祖異母弟父曰呼魯蘇官至太師雅克狡佞而敏清寧間為左䕶衛太保太康初轉北面林牙初耶律伊遜自中京留守復為樞密使以雅克為耳目凡聞見必以告伊遜愛而薦之帝亦以為賢拜左伊勒希巴及太子被誣帝遣雅克往訊之太子謂雅克曰帝惟我一子今為儲嗣復何求敢為此事公與我為昆弟行當念無辜達意於帝禱之甚懇蕭錫沙聞之謂雅克曰宜以太子言易為伏狀雅克頷之盡如所教以奏及大子被逐伊遜殺害忠良多雅克之謀為契丹行宫都部署五年夏拜南府宰相遷特哩衮大安三年為西京留守致仕夀隆初卒蕭錫沙摩和納部人父都勒斡厯官節度使錫沙辨黠善揣摩人意清寧間以年勞遷䕶衛太保太康初耶律伊遜復入樞府益横恣時錫沙出入伊遜家以朝臣不附者輒使出之錫沙由宿衛遷殿前副㸃檢三年夏䕶衛蕭和克等謀殺伊遜事覺下獄錫沙謂伊遜曰今太子猶在臣民屬心大王素無根祗之助復有誣皇后之怨若太子立王置身何地宜熟計之伊遜曰吾憂此久矣是夜召蕭塔喇台謀所以搆太子事錫沙計既行尋遷殿前都㸃檢兼同知樞密院事復令蕭額圗琿等誣首耶律扎拉前告耶律薩喇等事皆實詔究其事太子不服遣伊勒希巴耶律雅克問太子太子具陳所以見誣之狀錫沙聞之謂雅克曰如此奏則大事去矣當易其辭為伏欵雅克入如錫沙言奏之上大怒廢太子太子將出曰我何罪至是錫沙叱令登車遣衛卒闔車門是年遷北院樞密副使復陳隂害太子計伊遜從之及伊遜出知南院大王事亦出錫沙為保州統軍使卒乾統間剖棺戮屍二子達勒達年結皆伏誅遼史卷一百十
