  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_098-1a, image: WYG0289/WYG0289-0671a.png}
body:
  text: 遼史卷九十八元中書右丞相總裁托克托等修列傳第二十八蕭烏納耶律儼劉伸耶律呼哩蕭烏納一名托卜嘉字特黙六院部人其先嘗為西南靣伊喇烏納魁偉簡重善騎射清寧初兄托多以事入見帝問族人可用者托多以烏納對補祇候郎君遷近侍敞史䕶衛太保太康初為北院宣徽使時伊遜已害太子因言宋魏國王和囉噶之子淳可為儲嗣羣臣莫敢言烏納及伊勒希巴蕭托輝諌曰舍嫡不立是以國與人也帝猶豫不決五年帝出獵伊遜請留皇孫帝欲從之烏納奏曰竊聞車駕出遊將留皇孫苟保䕶非人恐有他變果留臣請侍左右帝乃悟命皇孫從行由此始疑伊遜頃之同知南院樞密使事出伊遜淳等帝嘉其忠封蘭陵郡王人謂近於古社稷臣授殿前都㸃檢上謂王師儒耶律固等曰烏納忠純雖狄仁傑輔唐烏哲立穆宗無以過也卿等宜達燕王知之自是令烏納輔導燕王益見優寵大安初詔尚越國公主烏納固辭改南院樞密使奏請掾史宜以嵗月遷叙從之壽隆元年拜北府宰相初天祚在潜邸烏納數以直言忤㫖及嗣位出為遼興軍節度使守太傅佛殿實逹爾王華誣烏納借内府犀角詔鞫之烏納奏曰臣在先朝詔許日取帑錢十萬為私費臣未嘗妄取一錢肯借犀角乎天祚愈怒奪太傅官降寧邉州刺史尋改臨海軍節度使烏納上書曰自蕭哈里亡入女直彼有輕朝廷心宜益兵以備不虞不報天慶元年知黄龍府事改東北路統軍使復上書曰臣治與女直接境觀其所為其志非小宜先其未發舉兵圖之章數上皆不聴及金兵來侵戰于寧江州其孫伊徳濟死之烏納退走入城留官屬守禦自以三百騎渡混同江而西城遂䧟後與蕭迪里拒金兵于長濼以軍敗免官五年天祚親征烏納殿復敗績後數日乃與百官入見授上京留守六年耶律章努叛來攻京城烏納發府庫以賚士卒諭以逆順完城池以死拒戰章努無所得而去授副元帥尋為契丹行宮都部署事天祚以烏納先朝重臣有定策勲每問以政烏納對甚切上雖優容終不能用以疾卒年七十耶律儼字若思析津人本姓李氏父仲禧重熈中始仕清寧初同知南院宣徽使事四年城鴨子混同二水間拜北院宣徽使咸雍初坐誤奏事出為榆州刺史俄詔復舊職遷漢人行宮都部署六年賜國姓封韓國公改南院樞密使時樞臣伊遜等誣䧟皇太子詔仲禧偕伊遜鞫之蔓引無辜未嘗雪正伊遜薦仲禧可任拜廣徳軍節度使復為南院樞密使卒諡欽惠儼儀觀秀整好學有詩名登咸雍進士第守著作佐郎補中書省令史以勤敏稱太康初歴都部署判官將作少監後兩府奏事論羣臣優劣唯稱儼才俊改少府少監知大理正賜紫六年遷大理少卿奏讞詳平明年陞大理卿丁父憂奪服同僉都署司事大安初為景州刺史繩胥徒禁豪猾撫老恤貧未數月善政流播郡人刻石頌徳二年改御史中丞詔案上京滯獄多所平反同知宣徽院事提㸃大理寺六年冬改山西路都轉運使刮剔垢弊奏定課額益州縣俸給事皆施行壽隆初授樞密直學士以母憂去官尋召復舊職宋攻夏李乾順遣使求和解帝命儼如宋平之拜叅知政事六年駕幸鴛鴦濼召至内殿訪以政事帝晩年倦勤用人不能自擇令各擲骰子以采勝者官之儼嘗得勝采上曰上相之徴也遷知樞密院事賜經邦佐運功臣封越國公修皇朝實録七十卷帝大漸儼與北院樞密使阿蘇同授顧命乾統三年徙封秦國六年封漆水郡王天慶中以疾命乘小車入朝疾甚遣太醫視之薨贈尚父諡曰忠懿儼素亷潔一介不取於人經籍一覽成誦然專務逢迎善伺人主意固結上心他勿恤也由是權寵益固而人亦以是薄之有子三處貞太常少卿處亷同知中京留守事處能少府少監劉伸字濟時宛平人少頴悟長以辭翰聞重熈五年登進士第歴彰武軍節度使掌書記大理正因奏獄上適與近臣語不顧伸進曰臣聞自古帝王必重民命願陛下省臣之奏上驚異擢樞密都承㫖權中京副留守詔徙富民以實春泰二州伸以為不可奏罷之遷大理少卿人以不寃稱陞大理卿改西京副留守以父憂終制為三司副使加諫議大夫提㸃大理寺以伸明法而恕案寃獄全活者衆徙南京副留守俄改崇義軍節度使政務簡静民用不擾致烏鵲同巢之異優詔褒之改户部使嵗入羡餘錢三十萬緡拜南院樞密副使道宗嘗謂大臣曰今之忠直耶律玦劉伸而已宰相楊績賀其得人拜叅知政事上諭之曰卿勿憚宰相時北院樞密使伊遜勢㷔方熾伸奏曰臣於伊遜尚不畏何宰相之畏伊遜銜之相與排詆出為保静軍節度使上終欲大用加守太子太保遷上京留守伊遜以事徙鎮雄武復以崇義軍節度使致仕適燕薊民饑伸與致仕趙徽韓造日濟以糜粥所活不勝算大安二年卒上震悼賻贈加等耶律呼哩字蘇色𢎞義宫分人其先欲穏佐太祖有功為徳哷勒額爾竒木父掦鄂特左監門衛大將軍呼哩謙謹無適莫重熈末補寢殿實達爾以善職屢更華要遷千牛衛大將軍大安中北準布酋磨魯斯叛為招討都監與耶律納延率精騎二千討平之以功為漢人行宫副都署兼知太和宫事致仕加同中書門下平章事卒論曰烏納當道宗昏惑之㑹擁佑皇孫使伊遜姦計不獲復逞而遼祚以續比之烏哲立穆宗非溢美也儼以俊才蒞政所至有能譽纂述遼史具一代治亂亦云勤矣但其固寵不能以禮正家惜哉劉伸三為大理民無寃抑一登户部上下兼裕至與耶律玦並稱忠直不亦宜乎遼史卷九十八遼史卷九十八考證蕭烏納傳尋為契丹行宫都部署按原本作尋為契丹都宫使考百官志無都宫使之名而本紀亦苐載烏納為契丹行宫都部署今據改耶律儼傳有子三處貞處亷處能按處亷之亷原本訛兼今㨿𢎞簡録改遼史卷九十八考證
