  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_012-1a, image: WYG0289/WYG0289-0093c.png}
body:
  text: 遼史巻十二元中書右丞相總裁托克托等修夲紀第十二聖宗三五年春正月乙丑破束城縣縱兵大掠丁夘次文安遣人諭降不聽遂擊破之盡殺其丁壯俘其老㓜戊寅上還南京己夘御元和殿大賚將士壬辰如華林天柱二月甲午朔至自天柱三月癸亥朔幸長春宫賞花釣魚以牡丹徧賜近臣歡宴累日丁丑以迪錦部下伊喇嘉哩偵候有功命入御盞郎君班祇候夏四月癸巳朔幸南京丁酉上率百僚册上皇太后尊號曰睿徳神畧應運啟化承天皇太后禮畢羣臣上皇帝尊號曰至徳廣孝昭聖天輔皇帝戊戌詔有司條上勲舊等第加恩癸丑清暑冰井六月壬辰召大臣決庶政丙申以耶律蘇為遙郡刺史秋七月戊辰納喇部節度使薩哈勒有惠政民請留從之是月獵平地松林九月丙戌幸南京是冬止焉六年春正月庚申如華林天柱二月丁未奚王籌寧殺無罪人李浩所司議貴請貸其罪令出錢贍浩家從之甲寅大同軍節度使同平章政事劉京致仕己未休格奏宋事宜上親覽之丙寅以司天趙宗徳齊泰王守平邵祺閻梅從征四載言天象數有徴賜物有差三月癸未李繼遷遣使來貢夏四月乙未幸南京丁酉呼勒希横突韓徳讓墮馬皇太后怒殺之戊戌幸宋國王休格第五月癸亥南府宰相耶律沙薨閏月丙戌朔奉聖州言太祖所建金鈴閣壊乞加修繕詔以南征恐重勞百姓待軍還治之壬寅阿爾斯蘭回鶻來貢甲寅威伊濟部以嵗貢貂鼠青鼠皮非土産皆於他處貿易以獻乞改貢詔自今止進牛馬六月癸亥党項太保鄂勒歡來朝貢方物乙丑諭諸道兵馬備南征攻城器具癸酉額爾竒木鄂勒博送沙州節度使曹恭順還授裕悅秋七月丙戌觀市己亥遣南面招討使韓徳威討河湟畨違命者賜休格巴雅爾部諸軍戰馬己酉駐蹕洛河壬子加韓徳威開府儀同三司兼政事令門下平章事東京留守兼侍中漆水郡王耶律穆濟為大同軍節度使癸丑巴雅爾請置涿州驛傳八月丙辰以青牛白馬祭天地戊午休格巴雅爾紐勒琿捉生將至易州遇宋兵殺其指揮使而還庚申幸黎園温湯癸亥以將伐宋遣使祭木葉山丁丑瀕海女直遣使薩喇勒來朝西北路管押詳衮舒僧格以伐哲琳珠嚕二部上所俘獲東路林牙蕭勤徳及統軍實埒以擊敗女直兵獻俘大同軍節度使耶律穆濟奏今嵗霜旱乏食乞増價折粟以利貧民詔從之濱海女直遣薩喇勒來修土貢丙申華格與珠巴克崇古嚕來貢休格遣詳衮音徳爾獻所獲宋諜者丁酉皇太后幸韓徳譲帳厚加賞賚命從臣分朋雙陸以盡歡九月戊戌幸南京己亥有事于太宗皇帝廟以唐元徳為奉陵軍節度使癸夘祭旗鼔南伐庚戌次涿州射帛書諭城中降不聽乙夘縱兵四面攻之城破乃降因撫諭其衆駙馬蕭勤徳太師達林皆中流矢勤徳載帝車中以歸聞宋軍退遣色珍巴雅爾追擊大敗之冬十月戊午攻沙堆驛破之己巳以黑白羊祭天地庚午以宋降軍分置七指揮號歸聖軍壬申行軍參謀宣政殿學士馬得臣言諭降宋軍恐終不為用請竝放還詔不允丙子籌寧奏破狼山捷辛巳復奏敗宋兵于益津闗癸未進軍長城口宋定州守將李興以兵來拒休格擊敗之追奔五六里十一月甲申上以將攻長城口詔諸軍備攻具庚寅駐長城口督大軍四面進攻士潰圍委城遁色珍招之不降上與韓徳讓邀擊之殺獲殆盡獲者分隸燕軍辛夘攻滿城圍之甲午抜其城軍士開北門遁上使諭其將領乃率衆降戊戌攻下祁州縱兵大掠己亥抜新樂庚子破小狼山砦丁未宋軍千人出益津闗國舅郎君托卜威詳衮實格擊走之殺一副將己酉休格獻黄皮室詳衮徇地莫州所獲馬二十匹士卒二十人命賜降者衣帶使隸燕京幸亥西路又送降卒二百餘人給寒者裘衣以馬得臣權宣徽院事十二月甲寅朔賜皮室詳衮持迪圖古勒戰馬横帳郎君達達哩刼掠命杖之丙辰畋于沙河休格獻奚詳衮葉嚕所獲宋諜丁巳遣北宰相蕭繼逺等徃覘安平侍衞馬軍司奏攻祁州新樂都頭劉贊等三十人有功乞加恩賞是月大軍駐宋境是歳詔開貢舉一人及第七年春正月癸未朔班師戊子宋雞壁砦守將郭榮率衆來降詔屯南京庚寅次長城口三卒出營刼掠笞以徇衆以所獲物分賜左右壬辰李繼遷與兄繼捧有怨乞與通好上知其非誠不許癸巳諭諸軍趣易州己亥禁部從伐民桑梓癸夘攻易州宋兵出遂城來援遣鐵林軍擊之擒其指揮使五人甲辰大軍齊進破易州降刺史劉墀守陴士卒南遁上帥師邀之無敢出者即以馬質為刺史趙質為兵馬都監遷易州軍民于燕京以東京騎將夏貞顯之子仙夀先登授髙州刺史乙巳幸易州御五花樓撫諭士庶丙午以青牛白馬祭天地詔諭三京諸道戊申次漆水謁景宗皇帝廟詔遣涿州刺史耶律守雄䕶送易州降人八百還隸本貫己酉次岐溝射鬼箭辛亥還次南京六軍解嚴二月壬子朔上御元和殿受百官賀詔雞壁砦民二百户徙居檀順薊三州甲寅回鶻于闐師子等國來貢乙夘大饗軍士爵賞有差樞宻使韓徳譲封楚國王駙馬都尉蕭寧逺同政事門下平章事是日幸長春宫甲子詔南征所俘有親屬分隸諸帳者給官錢贖之使相從乙丑賞南征女直軍使東還丙寅禁舉人匿名飛書謗訕朝廷癸酉吐蕃党項來貢甲戌雲州租賦請止輸本道從之丙子以女直和克岱為本部相分遣巫覡祭名山大川丁丑皇子佛寳努生戊寅阿爾斯蘭于闐轄哩遣使來貢三月壬午朔遣使祭木葉山禁芻牧傷禾稼宋進士十七人挈家來歸命有司考其中第者補國學官餘授縣主簿尉李繼遷遣使來貢丁亥詔知易州趙質收戰亡士卒骸骨築京觀戊子賜裕悦宋國王紅珠筋線命入内神帳行再生禮皇太后賜物甚厚以雞壁砦民成廷朗等八户𨽻飛狐己丑詔免雲州逋賦伊實王固寧擊鞠為所部郎君髙四縱馬突死詔訊髙四罪丙申詔開竒峰路通易州市戊戌以王子帳耶律襄女封義成公主下嫁李繼遷是春駐蹕延芳淀夏四月甲寅還京乙夘國舅太師蕭達林為子巴雅爾請尚皇女延夀公主許之丙辰謁太宗皇帝廟御史大夫烏爾古領伊實大王己未幸延夀寺飯僧甲子諫議大夫馬得臣以上好擊毬上疏切諫云臣伏見陛下聽朝之暇以擊毬為樂臣思此事有三不宜上下分朋君臣爭勝君得臣奪君輸臣喜一不宜也往來交錯前後遮約爭心競起禮容全廢若貪月杖誤拂天衣臣既失儀君又難責二不宜也輕萬乘之貴逐廣塲之娛地雖平至為堅确馬雖良亦有驚蹶或因奔擊失其控御聖體寧無虧損太后豈不驚懼三不宜也臣望陛下念繼承之重止危險之戲疏奏大嘉納之丁夘托歡和珍回鶻安進吐蕃都圖等自宋來歸皆賜衣帶皇太后謁于奇善汗廟丙子以錫里軍耶律杳為詳衮己夘駐蹕儒州龍泉庚辰遣宣徽使布琳等率兵分道備宋以約尼副使崆郭囉為錫里伊喇詳衮五月辛巳祭風伯于儒州白馬村休格引軍至滿城招降卒七百餘人遣使來獻詔隸東京辛夘獵桑乾河壬辰燕京奏宋兵至邉時暑未敢與戰且駐易州俟彼動則進擊退則班師從之六月庚戌朔以太師札穆迎合撾之二十辛酉詔燕樂宻雲二縣荒地許民耕種免賦役十年甲戌宣政殿學士馬得臣卒詔贈太子少保賜錢十萬粟百石乙亥出諸畜賜邉部貧民是月休格巴雅爾破宋兵于泰州秋七月乙酉御含涼殿視朝丙戌以中丞耶律哈宻喀權伊勒希巴横帳郎君耶律延夀為御史大夫癸巳遣兵南征甲午以徳勒賓納喇威三部各四人益東北路來人布爾徳仍給印綬丁酉勞南征將士是日帝與皇太后謁景宗皇帝廟八月庚午放進士髙進等二人及第冬十月禁置網捕兎十一月甲申于闐張文寳進内丹書十二月甲寅釣魚于沈子濼癸亥獵于好草嶺遼史巻十二遼史巻十二考證聖宗紀三統和五年八月丙辰以青牛白馬祭天地按朔考是年八月係乙夘朔丙辰乃八月初二日也本紀原文誤八七月謹據朔考改六年是嵗詔開貢舉一人及第按永樂大典本書放髙舉一人及第攷本紀是年以後俱書放某等幾人及第則此處當係脱文謹附考七年十二月甲寅釣魚于沈子濼按十二月原本作沈子臺遼史巻十二考證
