body:
  text: 遼史卷十六元中書右丞相總裁托克托等修本紀第十六聖宗七七年春正月甲辰如達哩山二月乙丑朔拜日如渾河三月辛丑命東北伊埒圖博和哩鄂羅木富珠哩鐵驪等五部嵗貢貂皮六萬五千馬三百丙午烏爾古節度使蕭普達討叛命迪里滅之夏四月拜日丙寅振川饒二州饑辛未振中京貧乏癸酉禁匿名書壬辰以三司使吕徳懋為樞密副使閏月壬子以蕭進忠為彰武軍節度使兼五州制置戊午吐蕃王巴爾遜奏凡朝貢乞假道夏國從之五月丙寅皇子宗真封梁王宗元永清軍節度使宗簡右衛大將軍宗愿左驍衛大將軍宗偉右衛大將軍皇姪宗範昭義軍節度使宗熙鎮國軍節度使宗亮絳州節度使宗弼濮州觀察使宗奕曹州防禦使宗顯宗蕭皆防禦使以張儉守司徒兼政事令六月丙申丕勒達囉克部節度使博羅哩至必繖河遇微雨忽天地晦㝠大風飄四十三人飛旋空中良久乃墮數里外博羅哩幸獲免一酒壺在地反不移丙午行大射栁之禮庚申以耶律留寧呉守達使宋賀生辰蕭噶濟馬貽謀使宋賀正旦加平章蕭𢎞義開府儀同三司尚父兼政事令秋七月甲子詔翰林待詔陳升寫南征得勝圖于上京五鸞殿丁卯富珠哩部來貢九月庚申佛寧國使奏本國與烏里國封壤相接數侵掠不寧賜詔諭之戊辰詔内外官因事受賕事覺而稱子孫僕從者禁之庚午録囚括馬給東征軍是月駐蹕土河川冬十月名中京新建二殿曰延慶曰永安壬寅以順義軍節度使石用中為漢人行宫都部署丙辰詔東平郡王蕭巴雅爾為都統殿前都㸃檢蕭實喇為副統東京留守耶律巴格為都監伐高麗仍諭高麗守吏能率衆自歸者厚賞堅壁相拒者追悔無及十一月壬戌以吕徳懋知吏部尚書楊又𤣥知詳覆院劉晟為霸州節度使北府宰相劉慎行為彰武軍節度使庚辰禁服用明金縷金貼金戊子幸中京十二月丁酉宋遣吕夷簡曹璋賀千齡節是月蕭巴雅爾等與高麗戰于茶陀二河遼軍失利天雲右皮室二軍没溺者衆約尼帳詳衮阿克達客省使卓庫渤海詳衮高清明天雲軍詳衮哈里等皆死之放進士張克恭等三十七人及第八年春正月宋遣陳堯佐張羣來賀壬戌鐵驪來貢建景宗廟于中京封沙州節度使曹順為燉煌郡王二月丁未以前南院樞密使韓􅜢為中京留守漢人行宫都部署王繼忠南院樞密使丙辰祭風伯三月己未以契丹𢎞義宫使霍實為興聖宫都部署前永安納部節度使崆郭囉積慶宫都部署左祗候郎君耶律哈斯㨗軍都監乙亥東平王蕭哈納東京留守耶律巴格國舅平章事蕭巴雅爾林牙伊濟等討高麗還坐失律數其罪而釋之己卯詔加征高麗有功渤海將校官壬午閲飛龍院馬癸未輝發太師塔喇噶來貢丙戌置東京渤海承奉官都知押班夏四月戊子朔如􅃡山五月壬申以駙馬蕭克忠為長寧軍節度使乙亥遷寧州渤海户于遼土二河己卯哈斯罕特哩衮阿巴該宰相薩喇來貢六月戊子録征高麗戰殁將校子弟己丑以左伊勒希巴蕭嘉哩為西南靣招討使御史大夫蕭伊濟為伊勒希巴己亥特哩衮耶律哈噶為南府宰相南靣林牙耶律韓留為特哩衮癸卯弛達巴山猿嶺採木禁乙巳以南皮室軍校等討高麗有功賜金帛秋七月己未征高麗戰殁諸將詔益封其妻庚申以東北路詳衮耶律都木達為北院大王辛酉約囉尼格二奚軍征高麗有功賜金帛癸亥詔準布依舊嵗貢馬千七百駞四百四十貂䑕皮萬青䑕皮二萬五千戊辰觀稼己巳輝發部太保莽密來貢庚午觀市曲赦市中繫囚命解寜馬翼充賀宋生辰使副八月庚寅遣郎君赫伯舎等率諸部兵㑹大軍討高麗九月己巳以石用中參知政事宋遣崔遵度王應昌賀千齡節壬申録囚甲戌復録囚庚辰哈斯罕特哩衮阿巴該來貢壬午駐蹕土河川冬十月乙酉詔諸道凡事已斷者每三月一次條奏戊子遣耶律繼崇鄭𤣥瑕賀宋正旦癸巳詔横帳三房不得與卑小帳族為婚凡嫁娶必奏而後行癸卯以前北院大王建福為額珍尼郭齊哈甲辰改東路和掄台布城為咸州建節以領之十一月甲寅置雲州宣徳縣十二月辛卯駐蹕中京乙巳以廣平郡王宗業為中京留守大定尹韓􅜢為特哩衮辛亥高麗王詢遣使乞貢方物詔納之九年春正月宋遣劉平張元普來賀二月如鴛鴦濼五月庚午耶律資忠使高麗還王詢表請稱藩納貢歸所留王人珠埓哩珠埒哩在高麗六年忠節不屈以為林牙辛未遣使釋王詢罪並允其請癸酉以耶律宗教檢校太傅宗誨啓聖軍節度使劉晟太子太傅仍賜保節功臣秋七月庚戌朔日有食之詔以近臣代拜救日甲寅遣使賜沙州回鶻燉煌郡王曹順衣物以察喇耿元吉哈濟宋璋為來年賀宋生辰正旦使副九月戊午以駙馬蕭紹宗平章事丁卯文武百僚奉表上尊號不許三上廼從之乙亥沙州囘鶻燉煌郡王曹順遣使來貢括諸道漢民馬賜東征軍以伊勒希巴延寧為兵馬副都部署總兵東征是月駐蹕金鉼濼宋遣宋綬駱繼倫賀千齡節冬十月戊寅以聶哷為奚王都監托多羅為北王府錫里軍詳衮郎君婁使沙州還詔釋宿累國家舊使逺國多用犯徒罪而有才略者使還即除其罪戊子西南招討奏党項部有宋犀族輸貢不時常有他意宜以時遣使督之詔曰邊鄙小族嵗有常貢邊臣驕縱徴歛無度彼懐懼不能自達耳第遣清慎官將示以恩信無或侵漁自然效順復奏迪錦達魯特部言節度使韓留有恵政今當代請留上命進其治狀辛丑如中京壬寅大食國遣使進象及方物為子察克請婚十一月丁巳以漆水郡王韓􅜢為南京留守析津尹兵馬都總管己未以伊勒希巴蕭孝順為南靣諸行宫都部署加左僕射十二月丁亥禁僧然身煉指戊子詔中京建太祖廟制度祭器皆從古制乙巳詔來年冬行大冊禮放進士張仲舉等四十五人太平元年春正月丁丑朔宋使魯宗道成吉來賀如渾河二月乙卯幸鈸河壬戌獵高祁林三月戊戌皇子博齊希生庚子駙馬都尉蕭紹業建私城賜名睦州軍曰長慶是月大食國王復遣使請婚封王子班郎君和索哩女噶老為公主嫁之夏四月戊申東京留守奏女直三十部酋長請各以其子詣闕祗候詔與其父俱來受約乙卯錄囚丁卯置萊州是月清暑􅃡山秋七月甲戌朔賜從獵女直人秋衣乙亥遣古哩取石晉所上玉璽于中京準布來貢辛巳如沙嶺是月獵潢河九月幸中京冬十月丁未徳哷勒酋長普爾布來貢馬駞戊申録囚甲寅宋使李懿王仲賓賀千齡節蘇惟甫周鼎賀來嵗元正即遣蕭善程翥報聘党項長赫嚕來貢己未以薩滿嘉哩為都㸃檢郭囉副㸃檢耶律羅漢努左皮室詳衮桑古右皮室詳衮拉拉西北路金吾耶律僧隱御史大夫球格駙馬都尉蕭崇古嚕並大將軍庚申幸通天觀觀魚龍曼衍之戲翌日再幸還升玉輅自内三門入萬壽殿奠酒七廟御容因宴宗室十一月癸未上御昭慶殿文武百僚奉冊上尊號曰睿文英武遵道至徳崇仁廣孝功成治定昭聖神贊天輔皇帝大赦改元太平中外官進級有差宋遣使來聘夏高麗遣使來貢甲申冊皇子梁王宗真為皇太子二年春正月如納水釣魚二月辛丑朔駐蹕魚兒濼三月甲戌如長春州丁丑宋使薛貽廓來告宋主恒殂子禎嗣位遣都㸃檢耶律僧隱等充宋祭奠使副林牙蕭日新觀察馮延休充宋后弔慰使副戊寅遣金吾耶律錫林引進姚居信充宋主弔慰使副戊子為宋主飯三京僧是月地震雲應二州屋摧地陷鄂博山裂數百歩泉湧成流夏四月如緬山清暑五月乙亥朔參知政事石用中薨庚辰鐵驪遣使獻烏舍十六户六月己未宋遣使薛由等來饋其先帝遺物秋七月己卯以耶律信寧為奉陵軍節度使高麗國參知政事王同顯静海軍節度使耶律遂忠長寧軍節度使耿延毅昭徳軍節度使高守貞河西軍節度使九月癸巳遣尚書僧隱韓格賀宋主即位冬十月壬寅遣堂後官張克恭充賀夏國王李徳昭生日使耶律繅古韓玉充賀宋太后生日使副耶律仙寧史克忠充賀宋正旦使副是月駐蹕和爾郭斯淀癸卯朔賜宰臣吕徳懋參知政事呉叔達樞密副使楊又𤣥右丞相馬保忠錢物有差辛亥至上京曲赦畿内囚十一月丙戌宋遣使來謝十二月辛丑高麗王詢薨其子欽遣使來報即命使冊欽為高麗國王甲寅宋遣劉煜郭志言來賀千齡節是年放進士張漸等四十七人三年春正月丙寅朔如納水釣魚以僧隱為平章事乙亥以蕭臺徳為南王府都監林牙耶律信寧西北路招討都監辛巳賜越國公主私城之名曰懿州軍曰慶懿二月丙申以丁振為武信軍節度使改封蘭陵郡王戊申以東平郡王蕭巴雅爾為西南靣都招討進封豳王夏四月以耶律守寧為都㸃檢五月清暑緬山六月戊申以南院宣徽使劉涇參知政事蕭孝惠為副㸃檢蕭孝恭東京統軍兼㳂邊廵檢使戊午以蕭璉為左伊勒希巴蕭琳為詳衮秋七月戊寅以南府宰相耶律哈噶為上京留守封漆水郡王丙戌以皇后生辰為順天節丁亥賜􅃡山名曰永安是月獵赤山閏月壬辰以蕭伯達韓紹雍充賀宋正旦使副唐古特程昭文賀宋生辰使副冬十月庚辰宋遣薛奎郭盛賀順天節王臻慕容惟素賀千齡節東征軍奏統帥錫林詳衮課努率師自茂穆克嶺入林牙噶濟禆將大匡逸等率師鼓山嶺入閏月未至達掄河不遇敵而還是月㑹於哈卜齊勒嶺駞馬死者甚衆駐蹕遼河十一月辛卯朔以皇姪宗範為歸徳軍節度使北府宰相蕭孝穆南京留守封燕王南京留守韓􅜢南院大王兵馬都總管仇正燕京轉運使十二月壬戌以宗範為平章事封三韓郡王仇道衡中京副留守馮延休順州刺史郎𤣥化西山轉運使趙其樞密直學士丁卯以蕭永為太子太師己卯封皇子重元秦國王四年春正月庚寅朔宋遣張傳張士禹程琳丁保衡來賀如鴨子河二月己未朔獵塔魯河詔改鴨子河曰混同江塔魯河曰長春河三月戊子朔千齡節詔賜諸宫分耆老食夏四月癸酉以丞相馬保忠子世𢎞使嶺表至平地松林為盗所殺特贈昭信軍節度使五月清暑永安山己未南院大王韓􅜢薨戊辰以鄭𢎞節為兵部郎中劉慎行順義軍節度使辛未以燕王蕭孝穆子順為千牛衛將軍甲戌以中山郡王察克為保靜軍節度使樂安郡王蘇克廣徳軍節度使蕭嘉哩彰徳軍節度使庚辰以遼興軍節度使周王呼圖克為臨海軍節度使漆水郡王迪里南院大王秋七月如秋山八月丙辰以韓紹芳為樞密直學士駙馬蕭必塔都㸃檢九月以駙馬蕭紹宗為武定軍節度使耶律宗福安國軍節度使冬十月駐蹕遼河宋遣蔡齊李用和來賀千齡節十一月追封南院大王韓􅜢為陳王十二月以蕭從政為歸義軍節度使康筠監門衛充賀宋正旦使副是年放進士李炯等四十七人遼史卷十六
