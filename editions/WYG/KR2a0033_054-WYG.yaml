  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_054-1a, image: WYG0289/WYG0289-0432a.png}
body:
  text: 遼史卷五十四元中書右丞相總裁托克托等修志第二十三樂志遼有國樂有雅樂有大樂有散樂有鐃歌横吹樂舊史稱聖宗興宗咸通音律聲氣歌辭舞節徵諸太常儀鳯教坊不可得按紀志遼朝雜禮參考史籍定其可知者以補一代之闕文嗚呼咸韶夏武之樂聲亡書逸河間作記史遷因以為書寥乎希哉遼之樂觀此足矣國樂遼有國樂猶先王之風其諸國樂猶諸侯之風故志其畧正月朔日朝賀用宫懸雅樂元㑹用大樂曲破後用散樂角觝終之是夜皇帝燕飲用國樂七月十三日皇帝出行宫三十里卓帳十四日設宴應從諸軍隨各部落動樂十五日中元大宴用漢樂春飛放杏堝皇帝射獲頭鵝薦廟燕飲樂工數十人執小樂器侑酒諸國樂太宗㑹同三年晉宣徽使楊端王朓等及諸國使朝見皇帝御便殿賜宴端朓起進酒作歌舞上為舉觴極歡㑹同三年端午日百僚洎諸國使稱賀如式燕飲命囘鶻燉煌二使作本國舞天祚天慶二年駕幸混同江頭魚酒筵半酣上命諸部長次第歌舞為樂女直阿固達端立直視辭以不能上謂蕭奉先曰阿固達意氣雄豪顧視不常可托以邊亊殺之不然恐貽後患奉先奏阿固達無大過殺之傷向化之意蕞爾小國又何能為雅樂自漢以後相承雅樂有古頌焉有古大雅焉遼闕郊廟禮無頌樂大同元年太宗自汴將還得晉太常樂譜宫懸樂架委所司先赴中京聖宗太平元年尊號冊禮設宫懸於殿庭舉麾位在殿第三重西階之上協律郎各入就舉麾位太常博士引太常卿太常卿引皇帝將仗動協律郎舉麾太樂令令撞黄鍾之鍾左右鍾皆應工人舉柷樂作皇帝即御坐扇合樂正王公入門樂作至位樂止通事舍人引押冊大臣初動樂作置冊殿前香案訖就位樂止舁冊官奉冊初動樂作升殿置冊御坐前就西墉北上位樂止大臣上殿樂作至殿欄内位樂止大臣降殿階樂作復位樂止王公三品以上出樂作太常博士引太常卿太常卿引皇帝降御坐入閤樂止興宗重熙九年上契丹冊皇帝出奏隆安之樂聖宗統和元年冊承天皇太后設宫懸簨簴太樂工協律郎入太后儀衛動舉麾太和樂作太樂令太常卿導引升御坐簾捲樂止文武三品以上入舒和樂作至位樂止皇帝入門雍和樂作至殿前位樂正宰相押冊皇帝隨冊樂作至殿前置冊於案樂止翰林學士大將軍舁冊樂作置御坐前樂止丞相上殿樂作至讀冊位樂止皇帝下殿樂作至位樂止太后宣答訖樂作皇帝至西閤樂止親王丞相上殿樂作退班出樂止下簾樂作皇太后入内樂止冊皇太子儀太子初入門貞安之樂作冊禮樂工次第四隅各置建鼓一虡樂工各一人宫懸每面九虡每虡樂工一人樂虡近北置柷敔各一樂工各一人樂虡内坐部樂工左右各一百二人樂虡西南武舞六十四人執小旗二人樂虡東南文舞六十四人執小旗二人協律郎二人太樂令一人唐十二和樂遼初用之豫和祀天神順和祭地祇永和享宗廟肅和登歌奠玉帛雍和入俎接神夀和酌獻飲神太和節升降舒和節出入昭和舉酒休和以飯正和皇后受冊以行承和太子以行遼十二安樂初梁改唐十二和樂為九慶樂後唐建唐宗廟仍用十二和樂晉改為十二同樂遼雜禮天子出入奏隆安太子行奏貞安則是遼嘗改樂名矣餘十安樂名缺遼雅樂歌辭文闕不具八音器數大抵因唐之舊八音金鎛鐘石球磬絲琴瑟竹籥簫竾匏笙竽土壎革鼓鼗木柷敔十二律用周黍尺九寸管空徑三分為本道宗太康中詔行秬黍所定升斗嘗定律矣其法大抵用古律焉大樂自漢以來因秦楚之聲置樂府至隋髙祖詔求知音者鄭譯得西域蘇祗婆七旦之聲求合七音八十四調之説由是雅俗之樂皆此聲矣用之朝廷别於雅樂者謂之大樂晉髙祖使馮道劉昫冊應天太后太宗皇帝其聲器工官與法駕同歸於遼聖宗太平元年冊承天皇太后童子弟子隊樂引太后輦至金鑾門天祚皇帝天慶元年上夀儀皇帝出東閤鳴鞭樂作簾捲扇開樂止太尉執臺分班太樂令舉麾樂作皇帝飲酒訖樂止應坐臣僚東西外殿太樂令引堂上樂升大臣執臺太樂令奏舉觴登歌樂作飲訖樂止行臣僚酒徧太樂令奏巡周舉麾樂作飲訖樂止太常卿進御食太官令奏食徧樂作文舞入三變引出樂止次進酒行臣僚酒舉觴巡周樂作飲訖樂止次進食食徧樂作武舞入三變引出樂止扇合簾下鳴鞭樂作皇帝入西閤樂止大樂器本唐太宗七徳九功之樂武后毁唐宗廟七徳九功樂舞遂亡自後宗廟用隋文武二舞朝廷用髙宗景雲樂代之元㑹第一奏景雲樂舞杜佑通典已稱諸樂竝亾唯景雲樂舞僅存唐末五代板蕩之餘在者希矣遼國大樂晉代所傳雜禮雖見坐部樂工左右各一百二人葢亦以景雲遺工充坐部其坐立部樂自唐已亾可考者唯景雲四部樂舞而已玉磬方響搊筝筑卧箜篌大箜篌小箜篌大琵琶小琵琶大五絃小五絃吹葉大笙小笙觱篥簫銅鈸長笛尺八笛短笛以上皆一人毛員鼓連鼗鼓具以上皆二人餘毎器工一人歌二人舞二十人分四部景雲舞八人慶雲樂舞四人破陣樂舞四人承天樂舞四人大樂調雅樂有七音大樂亦有七聲謂之七旦一曰婆陁力平聲二曰雞識長聲三曰沙識質直聲四曰沙侯加濫聲五曰沙臘皆應聲六曰般贍五聲七曰俟利箑斛先聲自隋以來樂府取其聲四旦二十八調為大樂婆陁力旦正宫髙宫中吕宫道調宫南吕宫仙吕宫黄鍾宫雞識旦越調大食調髙大食調雙調小食調歇指調林鍾商調沙識且大食角髙大食角雙角小食角歇指角林鍾角越角沙侯加濫旦中吕調正平調髙平調仙吕調黄鍾調般涉調髙般涉調右四旦二十八調不用黍律以琵琶絃叶之皆從濁至清迭更其聲下益濁上益清七七四十九調餘二十一調失其傳葢出九部樂之龜茲部云大樂聲各調之中度曲協音其聲凡十曰五凡工尺上一四六勾合近十二雅律於律吕各闕其一猶雅音之不及商也散樂殷人作靡靡之樂其聲往而不反流為鄭衞之聲秦漢之間秦楚聲作鄭衞寖亾漢武帝以李延年典樂府稍用西涼之聲今之散樂俳優歌舞雜進往往漢樂府之遺聲晉天福三年遣劉昫以伶官來歸遼有散樂葢由此矣遼冊皇后儀呈百戲角觝戲馬以為樂皇帝生辰樂次酒一行觱篥起歌酒二行歌手伎入酒三行琵琶獨彈餅茶致語食入雜劇進酒四行闕酒五行笙獨吹鼓笛進酒六行箏獨彈築毬酒七行歌曲破角觝曲宴宋國使樂次酒一行觱篥起歌酒二行歌酒三行歌手伎入酒四行琵琶獨彈餅茶致語食入雜劇進酒五行闕酒六行笙獨吹合法曲酒七行箏獨彈酒八行歌擊架樂酒九行歌角觝散樂以三音該三才之義四聲調四時之氣應十二管之數截竹為四竅之笛以叶音聲而被之絃歌三音天音揚地音抑人音中皆有聲無文四時春聲曰平夏聲曰上秋聲曰去冬聲曰入散樂器觱篥簫笛笙琵琶五絃箜篌筝方響杖鼓第二鼓第三鼓腰鼓大鼓鞚拍板雜戲目齊景公用倡優侏儒至漢武帝設魚龍曼延之戲後漢有繩舞自刳之伎杜佑以為多幻術皆出西域哇俚不經故不具述鼓吹樂鼓吹樂一曰短簫鐃歌樂自漢有之謂之軍樂遼雜禮朝㑹設熊羆十二案法駕有前後部鼓吹百官鹵簿皆有鼓吹樂前部鼓吹令二人掆鼓十二金鉦十二大鼓百二十長鳴百二十鐃十二鼓十二歌二十四管二十四簫二十四笳二十四後部大角百二十鼓吹丞二人羽葆十二鼓十二管二十四笛二十四鐃十二鼔十二簫二十四笳二十四右前後鼔吹行則導駕奏之朝㑹則列仗設而不奏横吹樂横吹亦軍樂與鼓吹分部而同焉皆屬鼓吹令前部大横吹百二十節鼓二笛二十四觱篥二十四笳二十四桃皮觱篥二十四掆鼔十二金鉦十二小鼓百二十中鳴百二十羽葆十二鼓十二管二十四簫二十四笳二十四後部小横吹百二十四笛二十四簫二十四觱篥二十四桃皮觱篥二十四百官鼓吹横吹樂自四品以上名有增損見儀衞志自周衰先王之樂寖以亾缺周南變為秦風始皇有天下鄭衞秦燕趙楚之聲迭進而雅聲亾矣漢唐之盛文事多西音是為大樂散樂武事皆北音是為鼓吹横吹樂雅樂在者其器雅其音亦西云遼史卷五十四遼史卷五十四考證舉麾位在殿三重西階之上三重禮志作二重聖宗太平元年冊承天皇太后按聖宗統和登極冊皇太后越三十有九年為太平元年葢又為改元而冊也本紀遺是年冊太后事遼史卷五十四考證
