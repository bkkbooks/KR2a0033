  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_088-1a, image: WYG0289/WYG0289-0632a.png}
body:
  text: 遼史卷八十八元中書右丞相總裁托克托等修列傳第十八蕭迪里巴拉耶律博諾蕭巴雅爾恒徳必塔耶律資忠耶律揚珠耶律鴻觀髙正耶律達魯大康乂蕭迪里字尼嚕古宰相塔喇四世孫識度𢎞逺為鄉里推重始為牛羣敞史帝聞其賢召入侍遷國舅詳衮統和二十八年帝謂群臣曰髙麗康肇弑其君誦立誦族兄詢而相之大逆也宜發兵問其罪羣臣皆曰可迪里諫曰國家連年征討士卒抏敝况陛下在諒陰年穀不登創痍未復島夷小國城壘完固勝不為武萬一失利恐貽後悔不如遣一介之使往問其故彼若伏罪則已不然俟服除嵗豐舉兵未晚時令已下言雖不行識者韙之明年同知左伊勒希巴事尋改右開泰初率兵巡西邊額爾竒木部下扎薩克轄布喇竒實卜克率部民遁迪里追擒之令復業遷國舅詳衮從樞密使耶律世良伐髙麗還加同政事門下平章事拜上京留守迪里為人寛厚達政體廷臣皆謂有王佐才漢人行宫都部署王繼忠薦其材可為樞密使帝疑其黨而止為中京留守卒族子和克有傳弟巴拉把拉字布哩音多智善騎射開泰間以兄為右伊勒希巴補郎君累遷奚六部圖哩太尉太平末大延琳叛巴拉将北南院兵往討遇于蒲水南院兵少却至手山復與賊遇把拉乃易兩院旗幟鼔勇力戰破之上聞以手詔褒奨賜内廏馬重熙中遷四捷軍詳衮謝事歸鄉里數嵗起為昭徳軍節度使尋改國舅詳衮卒耶律博諾字和爾沁特哩衮尼嚕古之孫景宗時為烏爾古部詳衮嚴急民苦之有司以聞詔曰博諾任方面寄以細故䆒問恐損威望尋遷馬羣太保統和十六年隠實燕軍之不任事者汰之二十八年駕征髙麗博諾為先鋒至銅州髙麗將康肇分兵為三以抗我軍一營于州西㨿三水之㑹肇居其中一營近州之山一附城而營博諾率耶律鴻觀擊破三水營擒肇李𤣥藴等軍望風潰㑹大軍至斬三萬餘級追至開京破敵於西嶺髙麗王詢聞邊城不守遁去博諾入開京焚其王宫迺撫慰其民人上嘉其功遷北院大王薨蕭巴雅爾字韓隠國舅少父房後多智略能騎射統和初為左皮室詳衮討凖布有功四年破宋將曹彬米信兵於望都凡軍事有疑每預㕘決尋總永興宫分糺及錫里伊喇二皮室等軍與樞密使耶律色珍収復山西所陷城邑是冬攻宋𨽻先鋒圍蒲城率所部先登㧞之改南京統軍使尚衛國公主拜駙馬都尉加同政事門下平章事十三年歴北南院宣徽使條上時政得失及賦役法上嘉納焉十五年加政事令遷東京留守二十二年復攻宋將渤海軍下徳清軍後蕭達林卒専任南面事宋和議成為北府宰相聖宗征髙麗將兵由北道進至開京西嶺破敵軍斬數千級髙麗王詢懼奔平州巴雅爾入開京大掠還帝嘉之封蘭陵郡王開泰二年以宰相知西南面招討使五年進王東平巴雅爾為政寛裕善㫁諸部畏愛民以殷富時議多之七年再伐髙麗至開京敵奔潰縱兵俘掠而還渡茶陀二河敵夾射巴雅爾委甲仗走坐免官太平三年復王􅃎薨弟恒徳恒徳字遜寧有膽畧而善謀統和元年尚越國公主拜駙馬都尉遷南面林牙従宣徽使耶律阿穆爾征髙麗還改北面林牙㑹宋將曹彬米信侵燕耶律休格與恒徳議軍事多見信用為東京留守六年上攻宋圍沙堆恒徳獨當一面城上矢石如雨恒徳意氣自若督將士奪其陴城陷中流矢太后親臨視賜藥攻長城口復先登太后益多其功時髙麗未附恒徳受詔率兵㧞其邊城王始懼上表請降十二年八月賜啟聖竭力功臣従都部署和碩鼐討烏舍未戰烏舍請降恒徳利其俘獲不許烏舍死戰城不能㧞和碩鼐議欲引退恒徳曰以彼倔强吾奉詔來討無功而還諸部謂我何若深入多獲猶勝徒返和碩鼐不得已進擊東南諸部至髙麗北鄙比還道逺糧絶士馬死傷甚衆坐是削功臣號十四年為行軍都部署伐博囉滿達勒還公主疾太后遣宫人賢釋侍之恒徳私焉公主恚而薨太后怒賜死後追封蘭陵郡王子必塔必塔字蘇隠一名昌裔生未月父母俱死育于禁掖既長尚秦晉王公主拜駙馬都尉為殿前副㸃檢統和八年改北面林牙太平四年遷殿前都㸃檢出為國舅詳衮九年渤海大延琳叛刼掠隣部與南京留守蕭孝穆往討孝穆欲全城降乃築重城圍之數月城中人陰來納款遂擒延琳東京平以功封蘭陵郡王十一年聖宗不豫先是欽哀與仁徳皇后有隙以必塔嘗為后所愛忌之時䕶衛馮嘉努上變誣弟楚布與必塔謀逆以皇后攝政徐議當立者公主竊聞其謀謂必塔曰爾將無罪被戮與其死何若奔女直國以全其生必塔曰朝廷詎肯以飛語害忠良寜死弗適他國及欽哀攝政殺之耶律資忠字烏延小字札拉系出仲父房兄果囉善屬文聖宗重之時妻弟之妻阿古與奴通將奔女直國果囉追及奴殺之阿古自經阿古母有寵于太后事聞大后怒將殺之帝度不能救遣人訣别問以後事果囉謝曰陛下憫臣無辜恩漏九泉死且不朽既死人多寃之在獄著兔賦寤寐歌為世所稱資忠博學工辭章年四十未仕聖宗知其賢召補宿衛數問以古今治亂資忠對無隠開泰中受中丞眷遇日隆初髙麗内屬取女直六部地以賜至是貢獻不時至詔資忠往問故髙麗無歸地意由是權貴數短於上出為上京副留守四年再使髙麗留弗遣資忠毎懐君親輒有著述號西亭集帝與羣臣宴時一記憶曰資忠亦有此樂乎九年髙麗上表謝罪始送資忠還帝郊迎同載以歸命大臣宴勞留禁中數日謂曰朕將屈卿為樞密何如資忠對曰臣不才不敢奉詔乃以為林牙知特哩衮事初資忠在髙麗弟昭為著帳郎君坐罪没家産至是乃復横帳且還舊産詔以外戚女妻之是時樞密使蕭和卓少師蕭巴格有寵資忠不肯俛附詆之帝怒奪官數嵗出知來逺城事歴保定昭徳二軍節度使聖宗崩表請㑹葬既至伏梓宫大慟曰臣幸遇聖明横被搆譛不獲盡犬馬報氣絶而蘇興宗命醫治疾乆之言國舅侍中無憂國心陛下不當復用唐景福舊號于是用事者惡之遣歸鎮卒弟昭有傳耶律楊珠字布爾錦積慶宫人父海古勒室韋部節度使楊珠篤學亷介有經世志統和十年累遷積慶宫使聖宗嘗諭楊珠曰聞卿正直是以進用國有利害爾言宜無所隠由是所陳多見嘉納上征髙麗破康肇軍于銅州揚珠之力為多王詢乞降羣臣議皆謂宜納揚珠曰王詢始一戰而敗遽求納款此詐耳納之恐墮其姦計待其勢窮力屈納之未晩已而詢果遁清野無所獲其衆阻險而壘攻之不下揚珠以計降之擢拜四畨部詳衮時招討使耶律博廸為總管揚珠恥居其下上表曰臣先朝舊臣今既垂老乞還新命覬得常侍左右帝曰朕不使汝乆處是任且命無𨽻招討得専奏事到部戢暴懐善政績顯著卒于官耶律鴻觀字巴爾諾延約尼森濟汗之後統和初嘗以軍事任為伊喇詳衮尋徙南京統軍使十三年徇地南鄙克敵於四岳橋斬首百餘級攻宋以戰功遷東京留守封楚國公後伐髙麗副先鋒耶律博諾擒康肇于銅州三十年西北部叛従南府宰相耶律諾衮討之及典禁軍號令整肅諸部多降尋遷侍中卒髙正不知何郡人統和初舉進士第累遷樞密直學士上將伐髙麗遣正先往諭意及還遷右僕射時髙麗王詢表請入覲上許之遣正率騎兵千人迓之館于路為髙麗將卓思正所圍正以勢不可敵與麾下壯士突圍出士卒死傷者衆上悔輕發釋其罪明年遷工部侍郎為北院樞密副使開泰五年卒耶律達魯字伊聶仲父房之後習兵事為左皮室詳衮統和二十八年伐髙麗達魯率本部軍與博諾等擒康肇李𤣥藴于銅州帝壯之曰以卿英才為國戮力真吾家千里駒也乃賜御馬及細鎧明年為北院大王出為烏爾古徳哷勒部都詳衮年七十二卒大康乂渤海人開泰間累官南府宰相出知黄龍府善綏撫東部懐服額爾徳尼部長布延與伊勒必來附送于朝言博囉滿達勒界多渤海人乞取之詔従其請康乂領兵至大石河圖卜凖城掠數百户以歸未㡬卒論曰髙句驪弑其君誦而立詢遼興問罪之師宜其簞食壺漿以迎除舍以待而迺乘險旅拒俾智者竭其謀勇者窮其力雖得其要領而顓顓獨居一海之中自若也豈服人者以徳而不以力歟况乎殘毁其宫室係累其民人所謂以燕伐燕也歟嗚呼朱崖之棄捐之之力也迪里之諌有焉遼史卷八十八
