front:
  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_028-1a, image: WYG0289/WYG0289-0184a.png}
body:
  text: 遼史卷二十八元中書右丞相總裁托克托等修本紀第二十八天祚皇帝二五年春正月下詔親征遣僧嘉努持書約和斥阿固達名阿固達遣薩喇復書若歸叛人阿蘇遷黄龍府於别地然後議之都統耶律鄂爾多等與女直兵戰于達里庫城敗績二月饒州渤海古雲等反自稱大王三月以蕭色佛哷等討之遣耶律章嘉努等六人齎書使女直斥其主名冀以速降夏四月癸丑蕭色佛哷等為渤海古雲所敗以南面副部署蕭托斯和為都統赴之五月托斯和及古雲戰敗績章嘉努等以阿固達書來復遣之往六月己亥朔清暑特哩嶺壬子章嘉努等還阿固達復書亦斥名諭之使降癸丑諭諸道親征丙辰托斯和招獲古雲等癸亥以特哩衮耶律摩哩為北院大王是月遣蕭色埓使女直以書辭不屈見留秋七月辛未宋遣使致助軍銀絹丙子獵于嶺東是月都統鄂爾多等與女直戰于白馬濼敗績八月甲子罷獵趨軍中以鄂爾多等軍敗免官丙寅以圍場使鄂博為中軍都統耶律章嘉努為都監率番漢兵十萬蕭奉先充御營都統諸行營都部署耶律章努為副以精兵二萬為先鋒餘分五部為正軍貴族子弟千人為硬軍扈從百司為䕶衛軍北出駱駞口以都㸃檢蕭呼塔噶為都統樞密直學士柴誼為副將漢步騎三萬南出寧江州自長春州分道而進發數月糧期必滅女直九月丁卯朔女直軍䧟黄龍府己巳知北院樞密使蕭塔喇台出為西南面招討使色埒還女直復遣薩喇以書來報若歸我叛人阿蘇等即當班師上親征尼雅滿烏珠等以書來陽為卑哀之辭實欲求戰書上上怒下詔有女直作過大軍翦除之語女直主聚衆􅋇面仰天慟哭曰始與汝等起兵蓋若契丹殘忍欲自立國今主上親征奈何非人死戰莫能當也不若殺我一族汝等迎降轉禍為福諸軍皆曰事已至此惟命是從乙巳耶律章努反奔上京謀迎立魏國王淳上遣駙馬蕭昱領兵詣廣平淀䕶后妃行宮實達爾伊遜馳書報魏國王時章努先遣王妃親弟蕭迪里以所謀説魏國王王曰此非細事主上自有諸王當立北南面大臣不來而汝言及此何也密令左右拘之有頃伊遜等齎御札至備言章努等欲廢立事魏國王立斬蕭迪里等首以獻單騎間道詣廣平淀待罪上遇之如初章努知魏國王不聴率麾下掠慶曉懷祖等州結渤海羣盜衆至數萬趨廣平淀犯行宫順國女直阿古齊以三百騎一戰而勝擒其貴族二百餘人竝斬首以徇其妻子配役繡院或散諸近侍為婢餘得脱者皆奔女直章努詐為使者欲奔女直為邏者所獲縛送行在腰斬于市剖其心以獻祖廟支解以徇五路冬十一月遣駙馬蕭特黙林牙蕭察喇等将騎兵五萬步卒四十萬親軍七十萬至駞門十二月乙巳耶律章嘉努叛戊申親戰于科卜多岡敗績盡亡其輜重己未錦州刺史耶律珠展叛應章嘉努庚申北面林牙耶律瑪古討章嘉努癸亥以北院宣徽使蕭罕嘉努知北院樞密使事南院宣徽使蕭特黙為漢人行宫都部署六年春正月丙寅朔東京夜有惡少年十餘人乘酒執刃踰垣入留守府問留守蕭保先所在今軍變請為備蕭保先出刺殺之户部使大公鼎聞亂即攝留守事與副留守髙清明集奚漢兵千人盡捕其衆斬之撫定其民東京故渤海地太祖力戰二十餘年乃得之而蕭保先嚴酷北海苦之故有是變其裨將渤海髙永昌僣號稱隆基元年遣蕭伊實髙興順招之不從閏月己亥遣蕭罕嘉努張琳討之戊午貴徳州守将耶律伊都以廣州渤海叛附永昌我師擊敗之二月戊辰侍御司徒托卜嘉等討章嘉努戰于祖州敗績乙酉遣漢人行宫都部署蕭特黙率諸将討章嘉努戊子章嘉努誘饒州渤海及中京賊侯槩等萬餘人攻䧟高州三月東面行軍副統綽哈等擒侯槩于川州夏四月戊辰親征章嘉努癸酉敗之甲戌誅叛黨饒州渤海平丙子賞平賊將士有差而蕭罕嘉努張琳等復為賊所敗五月清暑散水原女直軍攻下瀋州復陥東京擒髙永昌東京州縣族人赫伯道拉烏舍托卜嘉道拉綽哈等十三人皆降女直六月乙丑籍諸路兵有雜畜十頭以上者皆從軍庚辰魏國王淳進封秦晉國王為都元帥上京留守蕭托卜嘉為契丹行宫都部署兼副元帥丁亥知北院樞密使事蕭罕嘉努為上京留守秋七月獵秋山春州渤海二千餘户叛東北路統軍使勒兵追及盡俘以還八月烏爾古部叛遣中丞耶律托卜嘉招之九月丙午謁懷陵冬十月丁卯以張琳軍敗奪官庚辰烏爾古部降十一月東面行軍副統瑪古等攻哈斯罕敗績十二月乙亥封庶人蕭氏為太皇太妃辛巳削副統耶律瑪古官七年春正月甲寅減廐馬粟分給諸局是月女直軍攻春州東北面諸軍不戰自潰孟古皮室四部及渤海人皆降復下泰州二月淶水縣賊董龎兒聚衆萬餘西京留守蕭伊實南京統軍都監札拉與戰于易水破之三月龎兒黨復聚伊實復擊破之于奉聖州夏五月庚寅東北面行軍諸将聶哷赫嚕尼格錫庫等棄市乙巳諸圍場隙地縱百姓樵採六月辛巳以同知樞密院事額哩頁為北院大王秋七月癸卯獵秋山八月丙寅獵錫錫納琳山命都元帥秦晉王赴㳂邊㑹四路兵馬防秋九月上自燕至隂涼河置怨軍八營募自宜州者曰前宜後宜自錦州者曰前錦後錦自乾自顯者曰乾曰顯又有乾顯大營巖州營凡二萬八千餘人屯衛州蒺藜山丁酉獵輞子山冬十月乙卯朔至中京十二月丙寅都元帥秦晉國王淳遇女直軍戰于蒺藜山敗績女直復拔顯州旁近州郡庚午下詔自責癸酉遣伊勒希巴扎拉與大公鼎諸路募兵丁丑西京留守蕭伊實為北府宰相東北路行軍都統奚錫黙知奚六部大王事是嵗女直阿固達用鐡州楊朴策即皇帝位建元天輔國號金楊朴又言自古英雄開國或受禪必先求大國封冊遂遣議和以求封冊八年春正月幸鴛鴦濼丁亥遣耶律努克等使金議和庚寅保安軍節度使張崇以雙州二百户降金東路諸州盜賊蜂起掠民自隨以充食二月耶律努克還自金金主復書曰能兄事朕嵗貢方物歸我上京中京興中府三路州縣以親王公主駙馬大臣子孫為質還我行人及元給信符并宋夏髙麗往復書詔表牒則可以如約三月甲午復遣努克使金夏四月辛酉以西南面招討使簫塔喇台為北院樞密使五月壬午朔努克琨以書來約不踰此月見報戊戌復遣努克使金要以酌中之議是月至納克濼賊安生兒張髙兒聚衆二十萬耶律瑪古等斬生兒于龍化州髙兒亡入懿州與霍六格相合金主遣呼圖克琨與努克持書報如前約六月丁卯遣努克等齎宋夏髙麗書詔表牒至金霍六格䧟海北州趣義州軍帥和勒博等擊敗之通祺雙遼四州之民八百餘户降于金秋七月獵秋山金遣呼圖克琨來免取質子及上京興中府所屬州郡裁減嵗幣之數如能以兄事朕册用漢儀可以如約八月庚午遣努克托迪使金議册禮九月托迪見留遣努克還謂之曰言如不從勿復遣使閏月丙寅遣努克復使金而蕭博和哩等十五人各率户降于金冬十月努克托迪持金書來龍化州張應古等四人率衆降金十一月副元帥蕭托卜嘉薨十二月甲申議定冊禮遣努克使金寧昌軍節度使劉宏以懿州户三千降金時山前諸路大饑乾顯宜錦興中等路斗粟直數縑民削榆皮食之既而人相食是年放進士王翬等百三人九年春正月金遣烏林達贊謨持書來迎冊二月至鴛鴦濼賊張薩巴誘中京射糧軍僭號南面軍帥伊都擒薩巴三月丁未朔遣知右伊勒希巴事蕭實訥埓册金主為東懷國皇帝己酉烏林達贊謨努克等先以書報夏五月準布博斯齊等叛執招討使耶律鄂爾多都監蕭錫里岱死之秋七月獵南山金復遣烏林達贊謨來責册文無兄事之語不言大金而云東懷乃小邦懷其徳之義及册文有渠材二字語涉輕侮若遙芬多戩等語皆非善意殊乖體式如依前書所定然後可從楊詢卿羅子韋率衆降金八月以趙王實訥埓為西京留守九月至西京復遣實訥埓楊立忠先持册藁使金冬十月甲戌朔耶律辰圖努等二十餘人謀反伏誅是月遣使送烏林達贊謨持書以還十年春二月幸鴛鴦濼金復遣烏林達贊謨持書及册文副本以來仍責乞兵于髙麗三月己酉民有羣馬者令取其一給東路軍庚申以金人所定大聖二字與先世稱號同復遣實訥埓往議金主怒遂絶之夏四月獵呼圖哩巴山聞金師再舉耶律拜薩巴等以精兵三千濟遼師五月金主親攻上京克外郛留守托卜嘉率衆出降六月乙酉以北府宰相蕭伊實為上京留守知鹽鐡内省兩司東北統軍司事秋獵沙嶺冬復至西京遼史卷二十八遼史卷二十八考證天慶五年秋七月按是年為宋徽宗政和五年宋史書秋七月戊辰朔日食後天慶八年為徽宗重和元年書五月壬午朔日食九年為徽宗宣和元年書夏四月丙子朔日食十年為宣和二年書冬十月戊辰朔日食遼紀並失載金主復書曰歸我上京中京興中府三路州縣按原文作上中京據金史増寜昌軍節度使劉宏以懿州户三千降金按金史亦書劉宏屬國表作劉完又金持冊使楊立忠屬國表作楊近忠均一人兩異其名今仍之遼史卷二十八考證
