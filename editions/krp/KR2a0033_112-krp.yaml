body:
  text: 遼史卷一百十二元中書右丞相總裁托克托等修列傳第四十二逆臣上易曰天尊地卑乾坤定矣卑髙以陳貴賤位矣貴賤位而後君臣之分定君臣之分定而後天地和天地和而後萬化成五帝三王之治用此道也三代而降臣弑其君者有之子弑其父者有之孔子作春秋以寓王法誅死者於前懼生者於後其慮深逺矣歐陽修作唐書創逆臣傳蓋亦春秋之意也遼叛逆之臣二十有二迹其事則又有甚焉者然豈一朝一夕之故哉列于傳所以公天下之貶以示夫戒云希逹字納爾琿肅祖孫額爾竒木塔拉之子㓜黠而辯險佞者多附之約尼哈陶津汗時異母兄阿古齊為徳哷勒部額爾竒木故事為額爾竒木者得行再生禮阿古齊方就帳易服希逹遂取紅袍貂蟬冠乘白馬出令黨人大呼曰額爾竒木出矣衆羅拜因行柴冊禮自立為額爾竒木與裕悦耶律實嚕同知國政及實嚕遇害希逹懼人圖已挈其二子塔喇台碩格奔渤海僞為失明後因毬馬之㑹與二子奪良馬奔歸國益為姦惡常以巧辭獲免太祖將即位譲希逹希逹曰皇帝聖人由天所命臣豈敢當太祖命為裕悦及自將伐西南諸部希逹誘埒克等亂不從者殺之車駕還至赤水城希逹懼與埒克俱北走至榆河為追兵所獲太祖問曰朕初即位嘗以國譲叔父辭之今反欲立吾弟何也希達對曰始臣不知天子之貴及陛下即位衛從甚嚴與凡庶不同臣嘗奏事心動始有窺覦之意度陛下英武必不可取諸弟懦弱得則易圖也事若成豈容諸弟乎太祖謂諸弟曰汝輩乃從斯人言耶曰謀大事者須用如此人事成亦必去之希逹不復對囚數月縊殺之將刑太祖謂曰叔父罪當死朕不敢赦事有便國者宜悉言之希逹曰徳哷勒人衆勢强故多為亂宜分為二以弱其勢子塔喇台塔喇台字海蘭有膂力善馳射馬躓不仆尤神于醫視人疾若隔紗覩物莫不悉見太祖在潛已加眷遇及即位拜徳哷勒額爾竒木太祖思鹿醢解酲以山林所有問能取者塔喇台曰臣能得之乗内廐馬逐鹿射其一欲復射馬跌而斃塔喇台躍而前弓猶不弛復獲其一帝歡甚曰吾弟萬人敵㑹帝患心痛召塔喇台視之塔喇台曰膏肓有瘀血如彈丸然藥不能及必鍼而後愈帝從之嘔出瘀血痛止帝以其親每加賜賚然知其為人未嘗任以職後従埓克亂與其父希達俱縊殺之華格字薩蘭隋國王實嚕之子性隂險初烝其父妾懼事彰與剋蕭特依順等共害其父歸咎特依順華格獲免太祖即位務廣恩施雖知華格兇逆姑示含忍授以特哩衮六年華格預諸弟之亂事平羣臣議其罪皆謂華格不可釋於是與子罕札俱凌遲而死勅軍士恣取其産帝曰華格不畏上天反君弑父其惡不可言諸弟作亂皆此人敎之也察克字烏紳明王安圖之子善騎射貎恭而心狡人以為懦太祖曰此兇頑非懦也其父安圖嘗使奏事太祖謂近侍曰此子目若風駝面有反相朕若獨居無令入門世宗即位于鎮陽安圖聞之欲持兩端察克曰太弟忌刻若果立豈容我輩永康王寛厚且與瑠格相善宜往與計安圖即與瑠格謀歸世宗及和議成以功封㤗寜王㑹安圖為西南面大詳衮察克佯為父惡隂遣人白於帝即召之既至上前泣訴不勝哀帝憫之使領鈕祜禄軍出入禁中數被恩遇帝每出獵察克託手疾不操弓矢伹執錬鎚馳走屢以家之細事聞於上上以為誠察克以諸族屬雜處不克以逞漸徙廬帳迫於行宫右皮室詳衮耶律烏哲察其姦邪表列其狀帝不信以表示察克察克稱烏哲疾已哽咽流涕帝曰朕固知無此何至泣耶察克時出怨言烏哲曰汝雖無是心因我過疑汝勿為非義可也他日烏哲又請於帝帝曰察克捨父事我可保無他烏哲曰察克於父既不孝於君安能忠帝不納天禄五年七月帝幸太液谷留飲三日察克謀亂不果帝伐周至和尚山太后與帝祭文獻皇帝于行宫羣臣皆醉察克歸見夀安王邀與語王弗從察克以謀告耶律璸都璸都從之是夕同率兵入弑太后及帝因僭位號百官不從者執其家屬至夜閲内府物見碼碯盌曰此希世寳今為我有詫于其妻妻曰壽安王烏哲在吾屬無噍類此物何益察克曰夀安年㓜烏哲不過引數奴詰旦來朝固不足憂其黨舒蘇報夀安烏哲以兵圍於外察克尋遣人弑皇后于柩前倉惶出陣夀安遣人諭曰汝等既行弑逆復將若何有額爾奇木和卓委兵歸夀安王餘衆望之徐徐而往察克知其不濟乃繫羣官家屬執弓矢脅曰無過殺此曹爾叱令速出時林牙耶律廸里亦在繫中進曰不有所廢夀安王何以興藉此為辭猶可以免察克曰誠如公言誰當使者廸里請與雅斯哈同往說之察克從其計夀安王復令廸里誘察克臠殺之諸子皆伏誅隆科字密遜文獻皇帝之子天禄五年遙授武定軍節度使及察克作亂穆宗與烏哲從林牙廸里計誘而出之隆科手刅察克改南京留守穆宗沉湎不恤政事隆科有覬覦之心誘廸里及羣不逞謀逆事覺按問不服帝曰朕為壽安王時卿數以此事説我今日豈有虚乎隆科不能對及餘黨盡服遂縊於汗州西谷詔有司擇絶後之地以葬重元小字博齊希聖宗次子也材勇絶人眉目秀朗寡言笑人望而畏太平三年封秦國王聖宗崩欽哀皇后稱制密謀立重元重元以所謀白於上上益重之封為皇太弟歴北院樞密使南京留守知元帥府事重元處戎職未嘗離輦下先是契丹人犯法例須漢人禁勘受枉者多重元奏請五京各置契丹警廵使詔從之賜以金劵誓書道宗即位冊為皇太叔免拜不名為天下兵馬大元帥復賜金劵四頂帽二色袍尊寵所未有清寜九年車駕獵灤水以其子尼嚕古素謀與同黨陳國王辰類知北院樞密事蕭呼都克等凡四百餘人誘脅努手軍陣于帷宫外將戰其黨多悔過効順各自奔潰重元既知失計北走大漠歎曰尼嚕古使我至此遂自殺先是重元將起兵帳前雨赤如血識者謂敗亡之兆子尼嚕古尼嚕古小字伊囉斡性隂很興宗一見謂曰此子目有反相重熙十一年封安定郡王十七年進王楚為特哩衮清寧二年出為武定軍節度使七年知南院樞密使亊説其父重元詐病俟車駕臨問因行弑逆九年秋獵帝用耶律良之計遣人急召尼嚕古尼嚕古以事泄遽擁兵犯行宫南院樞密使許王仁先等率宿衛士討之尼嚕古躍馬突出為近侍詳衮渤海阿蘇護衛蘇射殺之遼史卷一百十二
