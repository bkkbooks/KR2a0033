body:
  text: 遼史卷六十八元中書右丞相總裁托克托等修表第六遊幸表朔漠以畜牧射獵為業猶漢人之劭農生生之資於是乎出自遼有國建立五京置南北院控制諸夏而遊田之習尚因其舊太祖經營四方有所不睱穆宗天祚之世史不勝書今援司馬遷别書封禪例列于表觀者固足以鑒云作遊幸表遼史卷六十八遼史卷六十八考證開泰八年幸秦晉長公主第作藏鬮宴按禮志載藏鬮儀明書太康十年始制此儀是創於道宗時也此又似聖宗時已有此儀矣考之二宗本紀中均無明文未知表與志所載孰是遼史卷六十八考證
