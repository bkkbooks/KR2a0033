body:
  text: 遼史卷一百九元中書右丞相總裁托克托等修列傳第三十九伶官伶官之㣲者也五代史列鏡新磨於傳是必有所取矣遼之伶官當時固多然能因詼諧示諌以消未形之亂惟羅衣輕耳孔子曰君子不以人廢言是宜傳羅衣輕不知其鄉里滑稽通變一時諧謔多所規諷興宗敗於李元昊也單騎突出幾不得脱先是元昊獲遼人輒劓其鼻有奔北者惟恐追及故羅衣輕止之曰且觀鼻在否上怒以毳索繫帳後將殺之太子笑曰打諢底不是黄幡綽羅衣輕應聲曰行兵底亦不是唐太宗上聞而釋之上嘗與太弟重元狎昵宴酣許以千秋萬歳後傳位重元喜甚驕縱不法又因雙陸賭以居民城邑帝屢不競前後已償數城重元既恃梁孝王之寵又多鄭叔叚之過朝臣無敢言者道路以目一日復博羅衣輕指其局曰雙陸休癡和你都輸去也帝始悟不復戲清寧間以疾卒宦官周禮寺人掌中門之禁至巷伯詩列于雅勃貂功著于晉雖忠於所事而非其職矣漢唐中世竊權蠧政有不忍言者是皆寵遇之過遼宦者二人其賢不肖皆可為鑑故傳焉王繼恩棣州人睿知皇后南征繼恩被俘初皇后以公私所獲十歳以下兒容貎可觀者近百人載赴凉陘並使閹為竪繼恩在焉聰慧通書及遼語擢内謁者内侍左廂押班聖宗親政累遷尚衣庫使左承宣監門衛大將軍靈州觀察使内庫都提㸃繼恩好清談不喜權利每得賜賚市書至萬卷載以自随誦讀不倦每宋使來聘繼恩多充宣賜使後不知所終趙安仁字小喜深州樂夀人自㓜被俘統和巾為黄門令秦晉國王府祇候王薨授内侍省押班御院通進開泰八年與李勝格謀奔南土為游兵所擒初仁徳皇后與欽哀有隙欽哀密令安仁伺皇后動静無不知者仁徳皇后威權既重安仁懼禍復謀亡歸仁徳欲誅之欽哀以言營救聖宗曰小喜言父母兄弟俱在南朝每念及神魂隕越今為思親冒死而亡亦孝子用心實可憐憫赦之重熙初欽哀攝政欲廢帝立少子重元帝與安仁謀遷太后慶州守陵授安仁左承宣監門衛大將軍充契丹漢人渤海内侍都知兼都提㸃㑹上思太后親馭奉迎太后責曰汝負萬死我甞營救不望汝報何為離間我母子邪安仁無答後不知所終論曰名噐所以勵天下非賢而有功則不可授况宦者乎繼恩為内謁者安仁為黄門令似矣何至溺於私愛而授以親察使大將軍耶易曰負且乗致㓂至此安仁所以不克有終繼恩幸而免歟遼史卷一百九
