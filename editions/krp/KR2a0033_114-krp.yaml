body:
  text: 遼史卷一百十四元中書右丞相總裁托克托等修列傳第四十四逆臣下蕭呼都克字伊遜口吃視斜髪鬈伯父孝穆謂曰是兒狀貎族中未嘗有及壯魁梧桀傲多揚人惡重熙中為祗候郎君俄遷興聖宫使尚秦國長宫主授駙馬都尉以不諧離婚復尚齊國公主為北面林牙清寧中歴北南院樞宻副使代族兄珠展為西北路招討使時蕭格與蕭阿拉俱為樞宻使不恊格以珠展為阿拉所愛嫉之珠展受代赴闕嘗借官粟留直而去呼都克希格意發其事珠展因得罪呼都克又欲要權嵗時遺珍玩畜産于格二人相愛逾兄弟呼都尅族弟迪里為北克薦國舅詳衮蕭呼敦于呼都克呼都克見其辨給壯勇傾交每休休言論終日人皆怪之㑹呼都克同知北院樞宻事奏呼敦及迪里可用帝以迪里為旗鼓伊喇詳衮呼敦為宿直官及格搆陷其兄阿拉呼敦陰為之助時人醜之耶律伊遜知北院樞宻事呼都克位在伊遜下怏怏不平初呼都克與重元子尼嚕古謀逆欲其速發㑹車駕獵太子山遂與尼嚕古脅弩手軍犯行宫既戰尼嚕古中流矢而斃衆皆逃散時同黨耶律薩喇蘓在圍場聞亂率獵夫來援其黨謂呼都克等曰我軍甚衆乘其無備中夜决戰事冀有成若待旦其誰從我呼都克曰倉卒中黒白不辨若内外軍相應則吾事去矣黎明而發何遲之有重元聴呼都克之計令四面巡警待旦是夜同黨立重元僭位號呼都克自為樞宻使明日戰敗呼都克被創單騎遁至十七濼投水死五子同日誅蕭塔喇台字和爾沁國舅少父房之後父雙寛尚塔納公主仕至國舅詳衮塔喇台㓜警敏不羈好射獵太平中以外戚補祗候郎君歴延昌宫使殿前副㸃檢重熙十三年伐夏塔喇台將偏師首入敵境多所俘掠遷都㸃檢改烏爾古德哷勒部都詳衮十八年再舉西伐塔喇台奏軍馬器械之事在選將夏人豈難制但嚴設斥堠不用掩襲計何慮不勝帝曰卿其速行無後師期既而塔喇台失利還復為都㸃檢十九年夏人來侵金肅軍上遣塔喇台率輕兵督戰至河南三角川斬候者八人擒觀察使以功命知漢人行宫都部署事出為西南面招討使族弟黄巴家奴告其主私議宫掖事塔喇台寢之事覺决大杖削爵為民清寧中上以所坐事非塔喇台所犯起為南京統軍使至是從重元子尼嚕古等亂敗走被擒伏誅庫德本宫分人不知姓氏好戲狎不喜繩檢膂力過人善擊鞠重熙初為䕶衛歴宿直官十三年西征以庫德為先鋒夏人伏兵掩之庫德力戰麾下士多殁乃單騎突出遇夏王李元昊來圍勢甚急庫德馳射應弦輒仆躍馬直擊中堅夏兵不能當晡乃還營改興聖宫太保清寧九年從重元尼嚕古亂與扈從兵戰敗而遁追擒之凌遲而死薩爾珠孟父房迪里之孫性兇暴清寧中累遷宣徽使改殿前都㸃襝首與重元謀亂㑹帝獵灤河重元恐事泄與扈從軍倉卒而戰其子尼嚕古既死同黨潰散薩爾珠適在畋所聞亂刼獵夫以援既至知尼嚕古已死大悔恨之謂曰我輩惟有死戰胡為若兒戯自取殞滅今行宫無備乘夜刼之大事可濟若俟明旦彼將有備安知我衆不携貳一失機㑹悔何及重元蕭呼都克等曰今夕但可四面圍之勿令外軍得入彼何能備不從遲明投杖而走薩爾珠戰死奚和勒博一名翰字綏蘭奚王特哩之後善騎射趫㨗而勇與其兄必埓哩齊名大安中車駕幸中京補䕶衛稍遷鐵鷂軍詳衮天慶間徙北女直詳衮兼知咸州路兵馬事改東京統軍既而諸畨入寇悉破之遷奚六部大王兼總知東路兵馬事保大二年金兵至天祚播遷和勒博率吏民立秦晉國王淳為帝淳偽署和哩布知北院樞宻事兼諸軍都統屢敗宋兵淳死其妻普賢女攝事明年金兵由居庸闗入和勒博知北院即箭笴山自立號奚國皇帝改元天復設奚漢渤海三樞宻院改東西節度使為二王分司建官時奚人巴扎罕嘉努等引兵擊附近契丹部落刼掠人畜羣情大駭㑹和勒博為郭藥師所敗一軍離心其黨耶律阿古齊與其甥伊實巴沁等殺之偽立凡八月蕭特烈字額圗琿約尼温汗宫分人乾統中入直宿衛出為順義軍節度使天慶四年同知咸州路兵馬事五年以行軍敗奪節度使保大元年遷威部節度使及天祚在山西集羣牧兵特烈為副統軍聞金兵將至特烈諭士卒以君臣之義死戰于石輦驛金兵不戰特烈伺間欲攻之天祚喜甚召嬪御諸子登高同觀將詫之金兵望日月旗知天祚在其下以勁兵直趨奮擊無敢當者天祚遁走特烈所至招集散亡尋為中軍都統復敗于梯已山天祚决意渡河奔夏從臣切諫不聴人情惶懼不知所為特烈陰謂耶律烏哲曰事勢如此億兆離心正我輩效節之秋不早為計奈社稷何遂共刼梁王雅里奔西北諸部偽立為帝特烈自為樞宻使雅里卒欲擇可立者㑹耶律烏哲言珠拉才德純備兼興宗之孫衆皆曰可遂僭立焉特烈偽職如故末三旬與珠拉俱為亂兵所殺論曰遼之秉國鈞握兵柄節制諸部帳非宗室外戚不使豈不以為帝王久長萬世之計哉及夫肆叛逆致亂亡皆是人也有國家者可不深戒矣乎遼史卷一百十四遼史卷一百十四考證奚和勒博傳明年金兵由居庸闗入和勒博自立按本紀及續通鑑金兵至居庸及和勒博僭立並保大三年事傳上文云保大二年此處原文是年二字應作明年今改正遼史卷一百十四考證
