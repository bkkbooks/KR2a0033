body:
  text: 遼史卷十九元中書右丞相總裁托克托等修本紀十九興宗二十年春正月辛亥朔宋遣梁適張從一富弼趙日定來賀甲子復遣吳育馮戴來賀永夀節二月庚辰朔詔博囉滿逹勒歸哈斯罕戸之没入者使復業甲申北樞宻院言南北二王府洎諸部節度侍衞衹侯郎君皆出族帳既免與民戍邉其祗候事請亦得以部曲代行詔從其請夏四月詔罷修鴨淥江浮梁及漢兵屯戍之役又以東京留守蕭薩巴言弛東京擊鞠之禁六月戊寅以蕭寧耶律坦崔禹稱馬世良耶律仁先劉六符充賀宋生辰使副耶律庻成趙成耶律烈張旦充來嵗賀宋正旦使副秋七月壬戌詔諸職官私取官物者以正盗論諸取以先朝已斷事相告言者罪之諸帳郎君䓁於禁地射鹿决三百不徴償小将軍决二百以下及百姓犯者罪同郎君論八月丙戌以醫者鄧延貞治詳衮蕭留寧疾驗贈其父母官以奨之九月辛亥朝皇太后國舅留寧薨庚申皇太后射獲熊上進酒為夀癸亥上獵馬盂山草木䝉宻恐獵者誤射傷人命耶律徳古各書姓名于矢以志之丙寅夏國獻宋俘以石硬砦太保郭三避虎不射免官冬十月丙戌詔東京留守蕭孝忠察官吏有廉幹清彊者具以名聞庚寅以女直太師塔雅克為哈斯罕都大王辛邜以皇子庫魯噶里生北宰相駙馬賽音巴寧迎上至其第飲宴上命衞士與漢人角觝為樂壬辰飲皇太后殿以皇子生肆赦夕復引公主駙馬及内族大臣入寝殿劇飲甲午幸中京庚子以駙馬都尉蕭呼哩為國舅詳衮十一月丙辰回鶻遣使來貢十二月丙子朔宋遣劉沆王整來賀應聖節乙未置塔卓卜酋長以和塔拉為平章事上聞宋設闗河治壕塹恐為邊患與南北樞宻吴國王蕭孝穆趙國王蕭固寧謀取宋舊割闗南十縣地遂遣蕭英劉六符使宋庚寅宋遣張沔侯宗亮薛申侍其濬施昌言潘永照來賀永夀節及來嵗正旦以宣政殿學士楊佶為吏部尚書判順度軍節度使事丁酉議伐宋詔諭諸道十一年春正月戊申奉迎皇太后于内殿庚戌遣南院宣徽使蕭特黙翰林學士劉六符使宋取晉陽及瓦橋以南十縣地且問興師伐夏及㳂邉疏濬水澤增益兵戍之故二月壬寅如鴛鴦濼四月甲戌朔頒南征賞罰令六月乙亥宋遣富弼張荗實奉書來聘以書答之壬午御含凉殿放進士王實䓁六十四人禁氊銀鬻入宋秋七月壬寅朔詔盗易官馬者减死論外路官勤瘁正直者考滿代不治事者即易之八月丙申宋復遣富弼張茂實奉書來聘乞增嵗幣銀絹以書答之九月壬寅遣北院樞宻副使耶律仁先漢人行宫副部署劉六符使宋約和是時富弼為上言大意謂遼與宋和坐獲嵗幣則利在國家臣下無與與宋交兵則利在臣下害在國家上感其言和好始定閏月癸未耶律仁先遣人報宋嵗增銀絹十萬兩匹文書稱貢送至白溝帝喜宴羣臣于昭慶殿是日振恤三父族之貧者辛邜仁先劉六符還進宋國誓書冬十一月丁亥羣臣加上尊號曰聰文聖武英略神功睿哲仁孝皇帝冊皇后蕭氏曰貞懿宣慈崇聖皇后大赦梁王洪基進封燕國王十二月癸邜朝皇太后甲辰封皇太弟重元子尼嚕古為安定郡王己酉以宣獻皇后忌日上與皇太后素服飯僧于延夀憫忠三學三寺辛亥詔蠲預偹伐宋諸部租税一年壬子以吐渾党項多鬻馬夏國詔謹邊防己未宋遣賀正旦及永夀節使居邸帝微服往觀丁邜禁䘮𦵏殺牛馬及藏珍寳十二年春正月辛夘遣同知析津府事耶律廸里樞宻院都承㫖王惟吉諭夏國與宋和壬申以吴國王蕭孝穆為南院樞宻使北府宰相蕭孝忠北院樞宻使封楚王韓國王蕭惠北府宰相同知元帥府事罕巴南院大王耶律喇實東京留守北院樞宻副使耶律仁先同知東京留守事北面林牙蕭格北院樞宻副使甲戌如武清寨葦淀二月壬寅禁闗南漢民弓矢己酉夏國以加上尊號遣使來賀甲寅耶律廸里䓁使夏國還奏元昊罷兵即遣使報宋三月辛邜幸南京壬辰髙麗國以加上尊號遣使來賀夏四月己亥置輝發部詳衮都監庚子夏國遣使進馬駞五月辛邜斡魯博囉滿逹勒二使來貢失期宥而遣還乙未詔復定禮制是月幸山西六月丙午詔世選宰相節度使族屬及身為節度使之家許𦵏用銀噐仍禁殺牲以祭庚戌詔漢人宫分户絶恒産以親族繼之辛亥凖布大王通特古斯弟太尉薩哈勒來朝丙辰回鶻遣使來貢甲子以南院樞密使吳國王蕭孝穆為北院樞宻使徙封齊國王秋七月丙寅朔北院樞宻使蕭孝忠薨特釋繫囚庚寅夏國遣使上表請伐宋不從八月丙申謁慶陵辛丑燕國王洪基加尚書令知北南院樞宻使事封燕趙國王戊午以前西北路招討使蕭塔喇噶為右伊勒希巴庚申裕悦耶律鴻觀薨甲子凖布來貢九月壬申朝皇太后謁望仙殿壬午謁懐陵冬十月丁酉駐蹕中㑹川己亥北院樞宻使蕭孝穆薨追贈大丞相晉國王庚子詔諸路上重囚遣官詳讞辛亥叅知政事韓紹芳為廣徳軍節度使三司使劉六符長寧軍節度使壬子夏侵党項遣延昌宫使髙嘉努譲之甲子北府宰相蕭惠為北院樞宻使豳王蘇克為特哩衮特哩衮逹嚕噶封漆水郡王西北路招討使樞宻副使蕭阿拉同知北院宣徽事出飛龍厩馬分賜羣臣十一月丁丑追封楚王蕭孝忠為楚國王丁亥以上京嵗儉復其民租稅癸巳朝皇太后十二月戊申改政事省為中書省十三年春正月甲子朔朝皇太后戊辰如混同江辛未獵烏爾衮岡二月庚戌如魚兒濼丙辰以叅知政事杜防為南府宰相三月丁亥髙麗遣使來貢以宣正殿學士楊佶叅知政事是月置契丹警巡院夏四月己酉遣東京留守耶律浩善知黄龍府事耶律烏魯斯将兵攻博囉滿逹勒甲寅南院大王耶律果實奏党項䓁部叛附夏國丙辰西南靣招討都監羅漢努詳衮鄂羅木等奏山西郡族節度使庫哩以五部叛入西夏乞南北府兵援送實威塞州户詔富者遣行餘留屯田天徳軍五月壬戌朔羅漢努奏所發部兵與党項戰不利招討使蕭普逹四㨗軍詳衮張佛奴殁於陣李元昊來援叛黨戊辰䛇徴諸道兵㑹西南邉以討元昊六月甲午凖布酋長烏巴遣其子執元昊所遣來援使阿雅噶來乞以兵助戰從之駐蹕永安山以将伐夏遣延昌宫使耶律髙嘉努告宋丙申詔前南院大王耶律古雲翰林都林牙耶律庻成䓁編集國朝上世以來事蹟丙午高麗遣使來貢丁未録囚秋七月辛酉香河縣民李宜兒以左道惑衆伏誅庚午行再生禮庚辰夏國遣使來朝八月乙未以夏使對不以情覊之丁巳夏國復遣使來詢以事冝又不以實對笞之九月戊辰宋以親征夏國遣余靖致贐禮壬申㑹大軍於九十九泉以皇太弟重元北院樞宻使韓國王蕭惠将先鋒兵西征冬十月庚寅祭天地丙申獲党項偵人射鬼箭丁酉李元昊上表謝罪己亥元昊遣使來奏欲収叛黨以獻從之辛亥元昊遣使來進方物詔北院樞宻副使蕭格迓之壬子軍於河曲格言元昊親率党項三部來詔格詰其納叛背盟元昊伏罪賜酒許以自新遣之召羣臣議皆以大軍既集宜加討伐癸丑督數路兵掩襲殺數千人駙馬都尉蕭呼都克為夏所執丁巳元昊遣使以先被執者來歸詔所留夏使亦還其國十一月辛酉賜有功将校有差甲子班師丁邜改雲州為西京辛巳朝皇太后十二月己丑幸西京戊戌以北院樞宻副使耶律廸里為右伊勒希巴己亥髙麗遣使來貢戊申蕭呼都克自夏來歸十四年春正月庚申以侍中蕭實喇為南院統軍使封遼西郡王庚午如鴛鴦濼壬午以金吾衞大将軍逹嚕噶為伊實大王甲申夏國遣使進鶻以常侍額古徳戰歿命其子錫埒為帥二月庚子朝皇太后駐蹕薩喇濼三月己邜宋以伐夏師還遣使來賀四月辛亥髙麗來貢閏五月癸丑清暑永安山六月丁邜謁慶陵己邜凖布大王通特古斯率諸酋長來朝庚辰夏國來貢辛巳以西南面招討使蕭普逹戰歿贈同中書門下平章事秋七月戊申駐蹕中㑹川冬十月甲子望祀木葉山十一月壬午朔回鶻阿爾斯蘭遣使來貢甲辰以同知北院宣徽事蕭阿拉為北府宰相十二月癸丑觀漢軍習礟射擊刺癸亥决滯獄十五年春正月乙酉如混同江禁契丹以奴婢鬻與漢人二月乙邜如長春河丙寅博囉滿逹勒界海蘭河户歸詔撫之三月甲申朝皇太后乙酉以應聖節减死罪釋徒以下辛邜朝皇太后丁酉髙麗遣使來貢詔諸道嵗具獄訟以聞夏四月辛亥禁五京吏民撃鞠戊午罷約尼帳戍軍壬戌以北女直詳衮蕭噶嚕為奚六部大王甲子清暑永安山甲戌博囉滿逹勒海蘭河百八十户歸六月癸丑以西京留守耶律瑪魯為漢人行宫都部署叅知政事楊佶出為武定軍節度使戊辰御清涼殿放進士王棠䓁六十八人甲戌西北路招討使耶律逹嚕噶坐贓免官秋七月乙酉豳王蘇克薨戊子觀穫乙未以北院宣徽使埒富為左伊勒希巴前南府宰相耶律吉遜東北路詳衮丙申籍諸路軍丁酉如秋山辛丑禁扈從踐民田丁未女直部長扎穆率衆來附加太師八月癸丑髙麗王欽薨遣使來告九月甲辰禁以罝網捕狐兎冬十月己酉駐蹕中㑹川十一月丁亥以南院樞宻使蕭孝友為北府宰相契丹行宫都部署耶律仁先南院大王北府宰相蕭格同知北院樞宻使事知伊勒希巴事耶律信先漢人行宫都部署左伊勒希巴埒富特哩衮漢人行宫都部署耶律迪里左伊勒希巴己亥渤海部以契丹户例通括軍馬乙巳賑南京貧民十二月壬申曲赦徒以下罪是日為聖宗在時生辰遼史卷十九
