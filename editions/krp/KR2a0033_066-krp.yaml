body:
  text: 遼史卷六十六元中書右丞相總裁托克托等修表第四皇族表遼太祖建國諸弟窺覦含容誘掖弗忍致辟古聖人猶難之雖其度量恢廓然經國之慮逺矣終遼之世其出於横帳五院六院之間者大憝固有元勲寔多不表見之莫知源委作皇族表不知世次太子太傅唐古右系出興宗神聖孝章皇帝遼史卷六十六遼史卷六十六考證皇族表第八世混同郡王額特埓按續通考額特埓乃阿里之元孫列第七世與此互異遼史卷六十六考證
