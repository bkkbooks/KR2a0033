body:
  text: 遼史卷三十三元中書右丞相總裁托克托等修志第三營衛志下部族下遼起松漠經營撫納竟有唐晉帝王之器典章文物施及潢海之區作史者尚可以故俗語耶舊史有部族志厯代之所無也古者巡守于方岳五服之君各述其職遼之部族實似之故以部族置宫衛行營之後云遼内四部族約尼九帳族橫帳三父房族國舅帳巴哩伊蘓濟勒族國舅部族太祖二十部二國舅升帳分止十八部五院部其先曰裕爾庫凡六營蘓爾威汗時與弟薩里布領之曰德哷勒部傳至太祖以額爾竒木即位天贊元年以彊大難制析五錫林爲五院六昭爲六院各置額爾奇木㑹同元年更額爾奇木爲大王部𨽻北府以鎭南境大王及都監春夏居五院部之側秋居羊門甸錫林四大密古錫林小密古錫林諤爾琨錫林會同二年以烏爾古之地水草豐美命居之三年益以哈里水之地爲農田伊實巴勒錫林會同二年命居烏爾古之地六院部𨽻北府以鎭南境其大王及都監春夏居泰德泉之北秋冬居都爾嘉錫林四薩蘭錫林阿克蘇錫林烏納巴錫林烏訥爾錫林會同二年命居烏爾古三年益以哈里水地伊實部其先曰薩里布蘓爾威汗時與其兄裕爾庫分營領之曰伊實部會同元年更額爾奇木爲大王𨽻南府其大王及都監鎭駐西南之境司徒居鴛鴦泊扎薩克轄居車軸山錫林二阿勒坦錫林裕珠錫林丕勒部其先曰紐紐蘓爾威汗以其營爲部太祖更諸部額爾奇木爲令公統和中改節度使𨽻北府屬西北路招討司司徒居太子墳凡戍軍𨽻節度使留後戸𨽻司徒錫林二北哲爾吉錫林南薩蘭錫林卓特部其先曰斡蘓爾威汗以其營爲部𨽻南府節度使屬西北路招討司司徒居柏坡山及􅀈山之側錫林二北錫林南錫林威部其先曰薩里布與其兄聶哷同營蘓爾威汗之世析爲二薩里布爲威部聶哷爲納喇部俱𨽻北府其威部節度使屬東北路招討司司徒居蘓黙山浩里河之側錫林二北錫林南錫林納喇部其先曰聶哷蘓嚕威汗分其營爲部節度使屬西南路招討司居黒山北司徒居浩里河側錫林二北塔喇錫林南察喇錫林圖魯卜部其先曰唐古爾領三營蘓爾威汗命分其一與弟杭愛爲圖吉部唐古爾得其二更爲圖魯卜部𨽻北府節度使屬西北路招討司司徒居長春州西錫林二北托卜錫林南舒錫林圖吉部其先曰杭愛蘓爾威汗分營置部𨽻南府戍於威烏爾古部司徒居冗泉側錫林二北錫林南錫林奚王府六部五帳分其先曰希沙事東約囉十帳部主哲哩後逐哲哩自立爲奚王卒弟圖嚕森立約尼森濟汗討之俘其拒敵者凡七百戸摭其降者以希沙鄰睦之故止俘部曲之半餘悉留焉奚勢由是衰矣初爲五部曰約囉曰伯特曰敖拉曰美嘉曰綽囉太祖盡降之號五部奚天贊二年有東巴爾斯呼遜者恃險堅壁於箭笴山以拒命揶揄曰大軍何能爲我當飲托輝門下矣太祖滅之以奚府給役戸併括諸部穩丁收合流散置托輝部因托輝門之語爲名遂號六部奚命布倫主之仍號爲奚王太宗即位置宰相詳衮各二員聖宗合敖拉美嘉托輝三部爲一特置二尅部以足六部之數奚王和碩鼐討烏舎敗績籍六部𨽻北府圖魯卜室韋部本名大小二黃室韋戸太祖爲塔瑪噶賽特以計降之乃置爲二部𨽻北府節度使屬東北路統軍司戍泰州東北納喇諾觀部與圖魯卜室韋部同節度使戍泰州東德哷勒達勒達部本森濟汗所俘奚七百户太祖立以爲十四錫林置爲部𨽻南府節度使屬西南路招討司戍黒山北部民居慶州南伊實阿爾威部神冊六年太祖以所俘奚戸置𨽻南府節度使屬東路兵馬司卓特阿爾威部太祖以奚戸置𨽻南府節度使屬東京都部署司丕勒達嚕噶部太祖以所俘達嚕噶部置𨽻南府節度使屬西南路招討司戍黒山北烏爾古納喇部亦曰納哩部太祖取裕庫哷戸六千神冊六年析爲烏爾古納喇及圖嚕二部俱𨽻北府節度使屬西南路招討司圖嚕部節度使屬東北路統軍司已上太祖以約尼氏舊部族分置者凡十部增置者八聖宗三十四部薩拉噶部奚有三營曰薩拉噶曰揚結曰諾延昭太祖伐奚乞降爲著帳子弟籍于宫分皆設額爾奇木聖宗各置爲部改設節度使皆𨽻南府以備畋獵之役居澤州東揚結部與薩拉噶部同居潭州南諾延昭部節度使屬東京都部署司卾博庫部與薩拉噶三部同居望雲縣東特哩特黙部初於八部各析二十户以戍奚偵候落馬河及蘓嚕克河側置二十詳衮聖宗以戸口蕃息置部設節度使𨽻南府戍倒塌嶺居槖駞岡實保部初取諸宫及橫帳大族奴𨽻置實保錫林實保鷹坊也居遼水東掌羅捕飛鳥聖宗以戸口蕃息置部節度使屬東京都部署司哈準部初取諸宫及橫帳大族奴𨽻置哈準錫林哈準鐵也以冶于海濵栁濕河賽音楚古爾蘓手山聖宗以户口蕃息置部屬東京都部署司約囉部居潭利二州間錫林三色勒必錫林北錫林塔魯錫林伯特部松山平州之間太師太保居中京西錫林六卓羅錫林蘓庫錫林塔納錫林德哷勒錫林實爾圖錫林約囉錫林綽囉部居潭州北敖拉部統和十二年以與美嘉托輝三部民籍數寡合爲一部并上三部本屬奚王府聖宗分置南尅部北尅部統和二年以奚府二尅分置二部烏延突厥部聖宗析四布沙四巴拜户置以鎭東北女直之境開泰九年節度使奏請置錫林𨽻北府屬黃龍府都部署司阿雅突厥部與烏延突厥同納喇裕爾庫部以納喇室韋户置𨽻北府節度使屬西南面招討司戍黒山北阿雅女直部聖宗以女直户置𨽻北府節度使屬西北招討司戍鎭州境自北至河西部皆俘獲諸國之民初𨽻諸宫户口蕃息置部訖於五國皆有節度使伊德女直部聖宗以女直户置𨽻南府居高州北額圖琿烏爾古部聖宗以烏爾古户置𨽻南府節度使屬西南面招討司戍黒山北達魯德哷勒部聖宗以德哷勒户置𨽻北府節度使屬烏爾古德哷勒統軍司室韋部聖宗以室韋户置節度使屬西北路招討司珠展達嚕噶部聖宗以達嚕噶户置𨽻北府節度使屬東北路統軍司戍境内居境外黙古斯部聖宗以唐古户置𨽻北府節度使屬西南面招討司吉達部聖宗以唐古户置𨽻北府節度使屬西南面招討司北德哷勒部聖宗以德哷勒户置戍威烏爾古部鼐奇特唐古部聖宗置𨽻北府節度使屬西南面招討司北唐古部聖宗以唐古户置𨽻北府節度使屬黃龍府都部署司戍府南南唐古部聖宗置𨽻北府和拉唐古部與南唐古同節度使屬西南面招討司河西部聖宗置𨽻北府節度使屬東北路統軍司色克圖部開泰四年以囘鶻户置𨽻北府居慈仁縣北巴爾斯布古德部本布古德户初𨽻諸宫聖宗以户口蕃息置部𨽻北府節度使屬東北路統軍司戍境内居境外塔瑪布古德部聖宗以布古德户置𨽻南府節度使屬東北路統軍司五國部博和哩國彭諾爾國卾羅木國伊埓圖國伊哷濟國聖宗時來附命居本土以鎭東北境屬黃龍府都部署司重熙六年以伊哷濟國人星哈等訴酋帥琿春貪汚罷五國酋帥設節度使以領之已上聖宗以舊部族置者十六増置十八遼國外十部烏爾古部德哷勒八部威古特部輝發部葉穆部温圖琿部特爾格部囘鶻部長白山部博羅滿達勒部右十部不能成國附庸於遼時叛時服各有職貢猶唐人之有羈縻州也遼史卷三十三遼史卷三十三考證營衛志下㑹同二年命居烏爾古之地居原本作以按太宗本紀㑹同二年以烏爾古部水草肥美詔北南院徙三户居之伊實巴勒其一也今據改會同元年更額爾奇木爲大王會同元年原本作二年按太宗本紀升北南院及伊實部額爾奇木爲王係元年事今據改統和中又改節度使𨽻北府屬西北路招討司按兵衛志丕勒部𨽻南府屬西南路招討司此志互異或其未改節度使時本屬南府兵衛志所載則從其初也天贊二年有東巴爾斯呼遜者拒命太祖滅之天贊二年原本作八年按太祖本紀天贊祗四年無八年滅呼遜置托輝部係二年事今據改德哷勒達勒達部原本作迭剌迭達部按兵衛志又作迭達迭剌部今併改揚結部原本作窈介他卷又作窈爪今併改珠展達嚕噶部原本作术哲達魯虢按兵衛志作术者達魯虢今併改南唐古部聖宗置𨽻北府按兵衛志南唐古部附在南府與此互異巴爾斯布古德部布古德原本作鼻骨德兵衛志作鼻古德百官志又作鼻骨無德字今併改遼史卷三十三考證
