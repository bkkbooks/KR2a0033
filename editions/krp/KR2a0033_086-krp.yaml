body:
  text: 遼史卷八十六元中書右丞相總裁托克托等修列傳第十六耶律和卓劉景劉六符耶律紐斡哩牛温舒杜防蕭華善特黙耶律哈爾吉耶律博迪耶律和卓字諾木衮太祖弟特爾格之孫㓜不好弄臨事明敏善談論以近族入侍每從征有功保寧初加右龍虎衛上將軍以宋師屢梗南邊拜涿州刺史西南兵馬都監招安巡檢等使賜推忠奉國功臣和卓久任邊防雖有克獲功然務鎮静不妄生事以邀近功鄰壤敬畏屬部乂安宋數遣人結歡冀達和意和卓表聞其事帝許議和安邊懐敵多有力焉拜左金吾衛上將軍秩滿遙攝鎮國軍節度使卒和卓智而有文曉暢戎政鎮范陽時嘗領數騎徑詣雄州北門與郡將立馬陳兩國利害及周師侵邊本末辭氣慷慨左右壯之自是邊境數年無事識者以謂和卓一言賢於數十萬兵劉景字可大河間人四世祖怦即朱滔之甥唐右僕射盧龍軍節度使父守敬南京副留守景資端厚好學能文燕王趙延夀辟為幽都府文學應厯初遷右拾遺知制誥為翰林學士九年周人侵燕留守蕭思温上急變帝欲俟秋出師景諫曰河北三闗已陷於敵今復侵燕安可坐視上不聽㑹父憂去未幾起復舊職一日召草赦既成留數月不出景奏曰唐制赦書日行五百里今稽期弗發非也上亦不報景宗即位以景忠實擢禮部侍郎遷尚書宣政殿學士上方欲倚用乃書其笏曰劉景可為宰相頃之為南京副留守時留守韓匡嗣因扈從北上景與其子徳讓共理京事俄召為户部使厯武定開逺二軍節度使統和六年致仕加兼侍中卒年六十七贈太子太師子慎行孫一徳二𤣥三嘏四端五常六符皆具六符傳劉六符父慎行由膳部員外郎累遷至北府宰相監修國史時上多即宴飲行誅賞慎行諫曰以喜怒加威福恐未當帝悟諭政府自今宴飲有刑賞事翌日禀行為都統伐髙麗以失軍期下吏議貴乃免出為彰武軍節度使賜保節功臣子六人一徳二𤣥三嘏四端五常六符徳早世𤣥終上京留守常厯三司使武定軍節度使嘏端符皆第進士嘏端俱尚主為駙馬都尉三嘏獻聖宗一矢斃雙鹿賦上嘉其贍麗與公主不諧奔宋歸殺之四端以衛尉少卿使宋賀生辰方宴大張女樂竟席不顧人憚其嚴還拜樞密直學士六符有志操能文重熙初遷政事舍人擢翰林學士十一年與宣徽使蕭特黙使宋索十縣地還為漢人行宫副部署㑹宋遣使増嵗幣以易十縣復與耶律仁先使宋定進貢名宋難之六符曰本朝兵彊將勇海内共知人人願從事於宋若恣其俘獲以飽所欲與進貢字孰多况大兵駐燕萬一南進何以禦之顧小節忘大患悔將何及宋乃從之嵗幣稱貢六符還加同中書門下平章事及宋幣至命六符為三司使以受之六符與參知政事杜防有隙防以六符嘗受宋賂白其事出為長寧軍節度使俄召為三司使道宗即位將行大册禮北院樞密使蕭格曰行大禮備儀物必擇廣地莫若黄川六符曰不然禮儀國之大體帝王之樂不奏於野今中京四方之極朝覲各得其所宜中京行之上從其議尋以疾卒耶律紐斡哩字海蘭六院額爾竒木博果濟後風神爽秀工畫重熙間累遷同知㸃檢司事駙馬都尉蕭呼都克為夏所執奉詔索之三返以歸轉永興宫使右祇候郎君班詳衮紐斡哩將娶秦晉長公主孫母與公主婢有隙謂紐斡哩曰能去婢乃許婚紐斡哩計殺之婚成事覺有司以大辟論紐斡哩善畫寫聖宗真以獻得減坐長流邊戍復以寫真拜同知南院宣徽事使宋賀正寫宋主容以歸清寧間復使宋宋主賜宴瓶花隔面未得其真陛辭僅一視及境以像示餞者駭其神妙聞重元亂不即勤王賊平入賀帝責之宴酣顧紐斡哩曰重元事成卿必為上客紐斡哩大慙咸雍中加太子太師卒牛温舒范陽人剛正尚節義有逺器咸雍中擢進士第滯小官大安初累遷户部使轉給事中知三司使事國民兼足上以為能加户部侍郎改三司使夀隆中拜參知政事兼同知樞密院事攝中京留守部民詣闕請真拜從之召為三司使乾統初復參知政事知南院樞密使事五年夏為宋所攻來請和解温舒與蕭塔喇台使宋方大燕優人為道士裝索土泥藥爐優曰土少不能和温舒遽起以手籍土懐之宋主問其故温舒對曰臣奉天子威命來和若不從則當卷土收去宋人大驚遂許夏和還加中書令卒杜防涿州歸義縣人開泰五年擢進士甲科累遷起居郎知制誥人以為有宰相器太平中遷政事舍人拜樞密副使重熙九年夏人侵宋宋遣郭禎來告請與夏和上命防使夏解之如約罷兵各歸侵地拜參知政事韓紹芳劉六符忌之防待以誠十二年紹芳等罷愈見信任十三年拜南府宰相防生子帝幸其第賜名王門努以進奏有誤出為武定軍節度使十四年復召為南府宰相二十一年秋祭仁徳皇后詔儒臣賦詩防為冠賜金帶道宗諒陰為大行皇帝山陵使清寧二年上諭防曰朕以卿年老嗜酒不欲煩以劇務朝廷之事總綱而已頃之拜右丞相加尚父卒上歎悼不已賵贈加等官給葬具贈中書令諡曰元肅子公謂終南府宰相蕭華善字洪寧國舅大父房之後忠直多志畧開泰初補御盞郎君尋為内史太醫等局都林牙使宋賀正將宴典儀者告班節度使下華善曰班次如此是不以大國之使相禮且以錦服為貺如待番部若果如是吾不預宴宋臣不能對易以紫服位視執政使禮始定八年秋為唐古特部節度使卒弟特黙特黙字和寧為人機辨任氣太平中累遷安東軍節度使有能稱十一年召為左祇候郎君班詳衮遷左伊勒希巴重熙十年累遷北院宣徽使與劉六符使宋索十縣故地宋請増銀絹十萬兩疋以易之歸稱㫖加同政事門下平章事詔城西南渾底甸還復為北院宣徽使卒耶律哈爾吉字特們六院額爾竒木博果濟後重熙中累遷西南面招討都監充宋國生辰使館於白溝驛宋宴勞優者嘲蕭惠河西之敗哈爾吉曰勝負兵家常事我嗣聖皇帝俘石重貴至今興中有石家寨惠之一敗何足較哉宋人慚服帝聞之曰優伶失辭何可傷兩國交好鞭二百免官清寧初起為懐化軍節度使七年入為北院大王封豳國公厯遼興軍節度使東北路詳衮加兼侍中致仕卒哈爾吉明達勤恪懐柔有道置諸賔館及西邊營田皆自哈爾吉發之耶律博迪字薩巴季父房諾衮之孫孤介寡合重熙初補牌印郎君清寧初稍遷知易州去官部民請留許之咸雍八年改彰國軍節度使上獵達里庫山博迪謁於行宫帝問邊事對曰自應州南境至天池皆我耕牧之地清寧間邊將不謹為宋所侵烽堠内移似非所宜道宗然之拜北面林牙後遣人使宋得其侵地命博迪往定疆界還拜南院宣徽使太康四年遷忠順軍節度使尋為南院大王改同知南京留守事召拜南府宰相賜貞良功臣封吳國公為北院樞密使亷謹奉公知無不為大安中致仕卒子錫黙北院樞密副使論曰耶律和卓安邊講好養兵息民其慮深逺矣六符啟釁邀功豈國家之利哉牛杜博迪哈爾吉輩衘命出使幸不辱命紐斡哩殺婢以求婚身負罪釁畫其主容以冀免死亦可醜也遼史卷八十六
