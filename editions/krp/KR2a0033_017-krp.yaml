body:
  text: 遼史卷十七元中書右丞相總裁托克托等修本紀第十七聖宗八五年春正月乙酉如混同江二月戊午禁天下服用明金及金線綺國親當服者奏而後用是月如魚兒濼三月壬辰以左丞相張儉為武定軍節度使同政事門下平章事鄭𢎞節臨潢少尹劉慎行遼興軍節度使武定軍節度使蕭必塔契丹行宫都部署樞密副使楊又𤣥吏部尚書叅知政事兼樞密使是月如長春河魚兒濼其水一夕有聲如雷越沙岡四十里别為一陂夏五月清暑永安山以蕭從順為太子太師呉叔達翰林學士道士馮若谷加太子中允耶律晨武定軍節度使張儉彰信軍節度使吕士宗禮部員外郎李可舉順義軍節度使秋七月獵平地松林九月駐蹕南京己亥以蕭迪里李紹琪充賀宋太后生辰使副耶律守寧劉四端充賀宋主生辰使副冬十月辛未宋太后遣馮元宗史方來賀順天節十一月庚子幸内果園宴京民聚觀求進士得七十二人命賦詩第其工拙以張昱等一十四人為太子校書郎韓欒等五十八人為崇文館校書郎辛丑以左祗候郎君詳衮蕭羅羅為右伊勒希巴十二月丁巳以漢人行宫都部署蕭孝先為上京留守皇姪長沙郡王謝嘉努匡義軍節度使耶律仁舉興國軍節度使甲子蕭守寧為㸃檢侍衛親軍馬歩軍乙丑北院樞密使蕭和卓薨戊辰以北府宰相蕭布庫為北院樞密使己巳遣蕭諧李琪充賀宋正旦使副庚午以參知政事劉京為順義軍節度使乙亥宋使李維張綸來賀千齡節是嵗燕民以年榖豐熟車駕臨幸争以土物抒誠貢獻上禮高年惠鰥寡賜酺飲至夕六街燈火如晝士庶嬉遊上亦微行觀之丁丑禁工匠不得銷毁金銀器六年春正月己卯朔宋遣徐奭裴繼起張若谷崔準來賀庚辰如鴛鴦濼二月己酉以黙爾吉同知樞密院黄翩為兵馬都部署達噶濟副之霍實為都監引軍城混同江蘇黙河之間黄龍府請建堡障三烽臺十詔以農隙築之東京留守巴格奏黄翩領兵入女直界徇地俘獲人馬牛豕不可勝計得降户二百七十詔奬諭之戊午以耶律頁為副㸃檢以國舅帳蕭瑠實圖嚕庫領西北路十二班軍奚王府錫里軍己巳南京水遣使振之庚午詔党項别部塔斯設契丹節度使治之三月戊寅以大同軍節度使張儉入為南院樞密使左丞相兼政事令㕘知政事呉叔達責授將作少監出為東州刺史準布來侵西北路招討使蕭惠破之夏四月丁未朔以武定軍節度使耶律海古勒為特哩衮戊申博囉滿達勒部多烏舎户詔索之丙寅如永安山五月辛卯以東京統軍使蕭繅古為契丹行宫都部署癸卯遣西北路招討使蕭惠將兵伐甘州回鶻六月辛丑詔凡官畜竝印其左以識之秋七月戊申獵黒嶺八月蕭惠攻甘州不克師還自是準布諸部叛遼軍與戰皆為所敗監軍尼嚕古國舅帳太保額布勒死之詔遣特哩衮耶律鴻觀林牙華格等將兵討之九月駐蹕遼河滸冬十月丙子哈斯罕諸部長來朝庚辰遣使問夏國與宋交戰之故辛巳以前南院大王濟魯古為烏爾古徳哷勒都詳衮庚寅以蕭孝順蕭紹宗兼侍中駙馬蕭紹業平章政事前南院大王和爾沁同知上京留守安格通化州節度使乙丑宋遣韓翼田承説來賀順天節十一月戊辰西北路招討司小校繅古訴招討蕭惠三罪詔都監鄂克沁按之十二月庚辰哈斯罕部乞建旗皷許之辛巳詔北靣諸部廉察州縣及鍚林穆嚕之官不治者罷之詔大小職官有貪暴殘民者立罷之終身不録其不廉直雖處重任即代之能清勤自持者在卑位亦當薦㧞其内族受賂事發與常人所犯同科戊戌遣杜防蕭藴充賀宋生辰使副庚子駐蹕遼河七年春正月壬寅朔宋遣張保維孫繼業孔道輔馬崇至來賀如混同江辛亥以女直伯埓為特哩衮佛門為葉穆部太師甲寅博囉滿達勒遣使來貢夏四月乙未獵黒嶺五月清暑永安山西南路招討司奏隂山中産金銀請置冶從之復遣使循遼河源求産金銀之所六月禁諸屯田不得擅貨官粟癸巳詔蕭惠再討準布秋七月己亥朔詔更定法令庚子詔諭駙馬蕭楚布公主諾木歡於后有父母之尊后或臨幸祇謁先祖乃祇拜空帳失致敬之禮今後可設像拜謁乙巳詔輦路所經旁三十歩内不得耕種者不在訴訟之限九月駐蹕遼河冬十月丁卯朔詔諸帳院庶孽竝從其母論貴賤十一月宋遣石中立石貽孫來賀千齡節王博文王雙賀順天節辛亥以楊义𤣥邢祥知貢舉乙未匡義軍節度使中山郡王察克保寧軍節度使長沙郡王謝嘉努廣徳軍節度使樂安郡王蘇克奏各將之官乞選伴讀書史從之癸亥以三韓王欽為啓聖軍節度使楊佶刑部侍郎甲子以左千牛衛上將軍耶律古雲為北院大王十二月丁卯遣耶律蘇頁王永錫充賀宋太后生辰蕭蘇色馬保永充賀正旦使副癸酉以金吾蕭噶嚕為奚錫里軍詳衮八年春正月己亥如混同江庚申党項侵邊破之甲子詔州縣長吏勸農二月戊子燕京留守蕭孝穆乞于拒馬河接宋境上置戍長巡察詔從之三月駐蹕長春河夏五月清暑永安山六月以韓寧劉湘充賀宋太后生辰使副呉克荷充賀夏國王李徳昭生辰使癸巳權北院大王耶律哲魯奏今嵗十一月皇太子納妃諸族備㑹親之帳詔以豪盛者三十户給其費秋七月丁酉以約尼帳郎君辰格為西北路巡檢與蕭錫林同管二招討地以南院大王耶律迪里為上京留守戊戌獵平地松林九月壬辰朔以渤海宰相羅漢權東京統軍使壬子幸中京北徳哷勒節度使耶律延壽請視諸部賜旗皷詔從之癸丑準布别部長呼蘭來降乙卯準布長吹古來䧏冬十月宋遣唐肅葛懐愍來賀順天節樞密使魏王耶律色珍孫婦阿古指斥乘輿其孫古雲為之隠事覺乃竝坐之仍籍其家詔燕城將士若敵至總管備城之東南統軍守其西北馬歩軍備其野戰統軍副使繕壁壘課士卒各練其事十一月丙申皇太子納妃蕭氏以耶律求翰為北院大王冬十二月辛酉朔以約尼太尉色佛哷為天雲軍詳衮壬申以前北院大王耶律留寧為雙州節度使康筠崇徳宫都部署色實永興宫都部署埓富宜州節度使闕菴遼州節度使耶律頁同知中京留守耶律哈喇托輝為大將軍丁丑詔庶孽雖已為良不得預世選丁亥宋遣寇瑊康徳來賀千齡節朱諫曹英張逸劉永釗賀來嵗兩宫正旦詔兩國舅及南北王府乃國之貴族賤庶不得任本部官是嵗放進士張宥等五十七人九年春正月至自中京二月戊辰遣使賜高麗王欽物如烏林河夏五月清暑永安山六月戊子以長沙郡王謝嘉努為廣徳軍節度使樂安郡王蘇克匡義軍節度使中山郡王察克保定軍節度使進封潞王豫章王特布長寧軍節度使以耶律思忠耶律荷耶律暠約尼色佛哷陳邈韓紹一韓知白張震充賀宋兩宫生辰及來嵗正旦秋七月戊午朔如黑嶺八月己丑東京錫里軍詳衮大延琳囚留守駙馬都尉蕭孝先及南陽公主殺户部使韓紹勲副使王嘉四捷軍都指揮使蕭佛徳延琳遂僣位號其國為興遼年為天慶初東遼之地自神冊來附未有𣙜酤鹽麴之法闗市之征亦甚寛弛馮延休韓紹勲相繼以燕地平山之法繩之民不堪命燕又仍嵗大饑户部副使王嘉復獻計造船使其民諳海事者漕粟以賑燕民水路艱險多至覆没雖言不信鞭楚搒掠民怨思亂故延琳乘之首殺紹勲嘉以快其衆延琳先事與副留守王道平謀道平夜棄其家踰城走與延琳所遣召黄龍府黄翩者俱至行在告變上即徴諸道兵以時進討時國舅詳衮蕭必塔治近延琳先率本管及家兵據其要害絶其西渡之計渤海太保夏行美亦舊主兵戍保州延琳密馳書使圖統帥耶律布庫行美乃以實告布庫得書遂殺渤海兵八百人而斷其東路延琳知黄龍保州皆不附遂分兵西取瀋州其節度使蕭旺禄初至其副張傑聲言欲降故不急攻及知其詐而已有備攻之不克而還時南北女直皆從延琳高麗亦稽其貢及諸道兵次第皆至延琳嬰城固守冬十月丙戌朔以南京留守燕王蕭孝穆為都統國舅詳衮蕭必塔為副綂奚六部大王蕭博諾為都監以討之十一月乙卯朔如顯陵丙寅以瀋州節度副使張傑為節度使其防城進士張人紀趙陸等二十二人入朝試以詩賦皆賜第超授保州戌將夏行美平章事壬申以駙馬劉四端權知宣徽南院事十二月丁未宋遣仇永韓永錫來賀千齡節命耶律育呉克荷蕭可觀趙利用充賀宋生辰使副耶律元吉崔閏蕭昭古竇振充來嵗賀宋正旦使十年春正月乙卯朔宋遣王夷簡竇處約張易張士宜來賀二月幸龍化州三月甲寅朔詳衮蕭必塔至自遼東言都統蕭孝穆去城四靣各五里許築城堡以圍之駙馬延寧與其妺穴地遁去公主吹巴勒在後為守陴者覺而止夏四月如乾陵以耶律行平為廣平軍節度使夏行美為中順軍節度使李延𢎞知易州蕭從順加太子太師五月戊申清暑栢坡秋七月壬午詔來嵗行貢舉法八月丙午東京賊將楊詳世密送欵夜開南門納遼軍擒延琳渤海平冬十月駐蹕長寧淀十一月辛亥南京留守燕王蕭孝穆以東征將士凱還戎服見上上大加宴勞翌日以孝穆為東平王東京留守國舅詳衮駙馬都尉蕭必塔封蘭陵郡王奚王博諾加侍中以權燕京留守兼侍中蕭惠為燕京綂軍使前統軍威烏克大將軍節度使宰相兼樞密使馬保忠權知燕京留守奚王府都監蕭阿克展東京綂軍使詔渤海舊族有勲勞材力者敘用餘分居來隰遷閏等州十二月乙巳宋遣梅詢王令傑來賀千齡節漆水郡王耶律迪里加尚父烏爾古節度使蕭普達為伊實部大王尚書左僕射蕭琳為臨海軍節度使十一年春正月己酉朔如混同江二月如長春河三月上不豫夏五月大雨水諸河横流皆失故道六月丁丑朔駐蹕大福河之北己卯帝崩于行宫年六十一在位四十九年景福元年閏十月壬申上尊諡曰文武大孝宣皇帝廟號聖宗贊曰聖宗㓜冲嗣位政出慈闈及宋人二道來攻親御甲胄一舉而復燕雲破信彬再舉而躪河朔不亦偉歟既而侈心一啓佳兵不祥東有茶陀之敗西有甘州之喪此狃於常勝之過也然踐阼四十九年理寃滯舉才行察貪殘抑奢僣録死事之子孫振諸部之貧乏責迎合不忠之罪却高麗女樂之歸遼之諸帝在位長久令名無窮其唯聖宗乎遼史卷十七
