body:
  text: 遼史卷七十四元中書右丞相總裁托克托等修列傳第四耶律迪里蕭罕都康黙記延壽韓延徽德樞紹芳紹勲資讓韓知古匡嗣德原德凝耶律迪里字和掄約尼森濟汗之子太祖旣踐阼與詳衮哈里同心輔政太祖深知其忠實命掌禮儀且委以軍事後以平内亂功代轄哩為奚六部圖哩卒迪里善騎射頗好禮文蕭罕都字裕勒沁德哷勒部人其先相約尼氏罕都少慷慨以才自任早隸太祖帳下數從征討旣踐阼除北府宰相罕都事親孝為政尚寛簡康黙記本名照少為薊州衙校太祖侵薊州得之愛其材隸麾下一切畨漢相渉事屬黙記折衷之悉合上意時諸部新附文法未備黙記推析律意論决重輕不差毫釐罹禁網者人人自以為不寃頃之拜左尚書神冊三年始建都黙記董役人咸趨事百日而訖五年為皇都伊勒希巴㑹太祖出師居庸關命黙記將漢軍進逼長蘆水寨俘馘甚衆天贊四年親征渤海黙記與韓知古從後大諲譔叛命諸將攻之黙記分薄東門率驍勇先登旣拔與韓延徽下長嶺府軍還已下城邑多叛黙記與阿古齊平之旣破輝發城歸營太祖山陵畢卒佐命功臣其一也孫延壽字𦙍昌少倜儻謂其所親大丈夫為將當效節邊垂馬革裹屍景宗特授千牛衞大將軍宋人攻南京諸將旣成列延壽獨奮擊陣前敵遂大潰以功遥授保大軍節度使乾寧三年卒韓延徽字藏明幽州安次人父夢殷官薊儒順三州刺史延徽少英敏燕帥劉仁恭奇之召為幽都府文學平州錄事參軍同馮道祗候院授幽州觀察度支使後守光為帥延徽來聘太祖怒其不屈留之舒嚕后諫曰彼秉節弗撓賢者也奈何困辱之太祖召與語合上意立命參軍事攻党項室韋服諸部落延徽之籌居多乃請樹城郭分市里以居漢人之降者又為定配偶教墾藝以生養之以故逃亡者少居久之慨然懷其鄉里賦詩見意遂亡歸唐已而與他將王緘有隙懼及難乃省親幽州匿故人王德明舎德明問所適延徽曰吾將復走契丹德明不以為然延徽笑曰彼失我如失左右手其見我至必大喜旣至太祖問故延徽對曰忘親非孝棄君非忠臣雖挺身逃臣心常在陛下臣是以復來上大悅賜其名曰實喇卽命為守政事合崇文館大學士凡中外事悉令參决焉天贊四年從征渤海大諲譔乞降旣而復叛與諸將破其城以功拜左僕射又與康黙記攻長嶺府拔之師還太祖崩哀動左右太宗朝封魯國公仍為政事令使晉還改南京三司使世宗朝遷南府宰相建政事省設張理具稱盡力吏天祿五年六月河東使請行冊禮帝召延徽定其制延徽奏一遵太宗冊晉帝禮從之應厯中致仕子德樞鎭東平詔許每歲東歸省九年卒年七十八上聞震悼贈尚書令葬幽州之魯郭世為崇文令公初延徽南奔太祖夢白鶴自帳中出比還復入帳中詰旦謂侍臣曰延徽至矣已而果然太祖初元庶事草創凡營都邑建宫殿正君臣定名分法度井井延徽力也為佐命功臣之一子德樞德樞年甫十五太宗見之謂延徽曰是兒卿家之福朕國之寳眞英物也未冠守左羽林大將軍遷特進太尉時漢人降與轉徙者多寓東平丁歲菑饑饉疾癘德樞請往撫字之授遼興軍節度使下車整紛剔蠧恩煦信孚勸農桑興教化期月民獲蘇息入為南院宣徽使遥授天平軍節度使平灤營三州管内觀察處置等使門下平章事已而加開府儀同三司行侍中封趙國公保寧元年卒孫紹勲紹芳紹勲仕至東京戸部使會大延琳叛被執辭不屈賊以鋸解之憤罵至死紹芳重熈間參知政事加兼侍中時廷議征李元昊力諫不聽出為廣德軍節度使聞敗嘔血卒孫資讓壽隆初拜中書侍郎平章事會宋徽宗嗣位遣使來報有司按籍有登寶位文坐是出為崇義軍節度使改鎭遼興卒韓知古薊州玉田人善謀有識量太祖平薊時知古六歲為淳欽皇后兄欲穩所得后來嬪知古從焉未得省見久之負其有怏怏不得志挺身逃庸保以供資用其子匡嗣得親近太祖因間言太祖召見與語賢之命參謀議神冊初遥授彰武軍節度使久之信任益篤總知漢兒司事兼主諸國禮儀時儀法疏闊知古援據故典參酌國俗與漢儀雜就之使國人易知而行頃之拜左僕射與康黙記將漢軍征渤海有功遷政事令天顯中卒為佐命功臣之一子匡嗣匡嗣以善醫直長樂官皇后視之猶子應厯十年為太祖廟詳衮後宋王喜隱謀叛辭引匡嗣上置不問初景宗在藩邸善匡嗣卽位拜上京留守頃之王燕改南京留守保寧末以留守攝樞密使時耶律和克使宋還言宋人必取河東合先事以為備匡嗣詆之曰寧有是已而宋人果取太原乘勝逼燕匡嗣與南府宰相沙特哩衮休格侵宋軍滿城方陣宋人請降匡嗣欲納之休格曰彼軍氣甚銳疑誘我也可整頓士卒以禦匡嗣不聽俄而宋軍鼓譟薄我衆蹙踐塵起漲天匡嗣倉卒諭諸將無當其鋒衆旣奔遇伏兵扼要路匡嗣棄旗鼓遁其衆走易州山獨休格收所棄兵械全軍還帝怒匡嗣數之曰違爾衆謀深入敵境爾罪一也號令不肅行伍不整爾罪二也棄我師旅挺身鼠竄爾罪三也偵候失機守禦弗備爾罪四也捐棄旗鼓損威辱國爾罪五也促令誅之皇后引諸内戚徐為開解上重違其請良久威稍霽乃杖而免之旣而遥授晉昌軍節度使乾亨二年改西南面招討使卒睿智皇后聞之遣使臨弔賻贈甚厚後追贈尚書令五子德源德讓後賜名隆運德威德崇德凝德源德凝附傳餘各有傳德源性愚而貪早侍景宗邸及卽位列近侍保寧間官崇義興國二軍節度使加檢校太師以賄名德讓貽書諫之終不悛以故論者少之後加同政事門下平章事遥攝保寧軍節度使乾亨初卒德凝謙遜廉謹保寧中遷護軍司徒統和中累遷護衞太保都宫使崇義軍節度使移鎭廣德秩滿部民請留從之改西南面招討使党項隆伊特叛平之遷大同軍節度使卒于官子果桑終天德軍節度使孫髙嘉努終南院宣徽使果實終遼興軍節度使遼史卷七十四遼史卷七十四考證康黙記傳神冊五年為皇都伊勒希巴按太祖紀天顯元年遣額爾奇木康黙記攻長嶺府是黙記以伊勒希巴又為額爾奇木傳失載天祿五年六月河東使請行冊禮按世宗本紀天祿五年六月劉崇為周所攻稱姪乞援且求封冊帝遣使冊為漢帝原本訛作三年今據改韓知古傳遷政事令按百官志政事令太祖所置官興宗重熈十三年始改中書省韓知古之為令在太祖時則政事令也原本訛作中書今據改匡嗣傳旣而遥授晉昌軍節度使乾亨二年改西南面招討使卒按景宗紀乾亨元年匡嗣遥授晉昌軍節度使降封秦王傳失載其改西南面招討使紀作三年與傳亦互異德源傳保寧間官崇義興國二軍節度使保寧原本作統和按德源以乾亨初卒乾亨為景宗年號統和爲聖宗年號卒在先而事反在後矣又考德源父子兄弟俱早侍景宗邸其弟德讓德威德凝遷擢俱始於保寧德崇之子制心統和中亦為刺史德源為長兄不應於聖宗朝始仕其為保寧之訛無疑今據改德凝傳統和中累遷䕶衞太保都宫使崇義軍節度使統和原本作開泰考聖宗紀統和三年德凝由彰武軍節度使為崇義軍節度使又屬國表統和十九年西南面招討奏党項之㨗而佚其名以事考之當卽德凝則開泰當為統和今據改遼史卷七十四考證
