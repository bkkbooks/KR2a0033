body:
  text: 遼史卷九十一元中書右丞相總裁托克托等修列傳第二十一耶律罕巴耶律唐古蕭珠展藥師努耶律玦耶律布勒圖耶律罕巴字嘲隱北院詳衮古之五世孫倜儻有大志太平中游京師寓行宮側惟囊衣匹馬而已帝微服出獵見而問之曰汝為何人罕巴初不識漫應曰我北院部人罕巴來覔官耳帝與語知有長才隂識之㑹北院奏南京疑獄久不決帝召罕巴馳驛審録舉朝皆驚罕巴量情處理人無寃者上嘉之籍羣牧馬闕其二同事者考尋不已罕巴略不加詰即先馳奏帝益信任景福元年為左伊勒希巴徙北靣林牙眷遇優異重熈中改北院大王務寛仁復為左伊勒希巴十二年再為北院大王入朝帝從容謂曰卿守邉任重當實府庫振貧乏以報朕既受詔愈竭忠謹知無不言便益為多卒年五十五上聞悼惜死之日篋無舊蓄椸無新衣遣使弔祭給葬具罕巴平居不屑細務喜愠不形嘗失所乗馬家僮以同色者代之數月不覺耶律唐古字敵隱裕悦烏哲之庶子亷謹善屬文統和二十四年述烏哲安民治盜之法以進補小將軍遷西南靣巡檢歴壕州刺史唐古特部詳衮嚴科條禁姦民鬻馬於宋夏界因陳弭私販安邉境之要太后嘉之詔邉境遵行著為令朝議欲廣西南封域黒山之西綿亘數千里唐古言戍壘太逺卒有警急赴援不及非良䇿也從之西番來侵詔議守禦計命唐古勸督耕稼以給西軍田于臚朐河側是嵗大熟明年移屯鎮州凡十四稔積粟數十萬斛斗米數錢重熈間改烏延党項部節度使先是築哈屯城以鎮西域諸郡縱民畜牧反招寇掠重熈四年上疏曰自建哈屯城已來西番數為邉患毎煩逺戍嵗月既久國力耗竭不若復守故疆省罷戍役不報是年致仕乞勒其父烏哲功于石帝命耶律庶成製文勒石上京崇孝寺卒年七十八蕭珠展字實倫孝穆弟果濟之子也以戚屬加監門衛上將軍重熈十三年將衛兵討李元昊有功遷興聖宮使富珠哩部長托多羅叛珠展為統軍都監從都統耶律義先擊之擒托多羅珠展與義先不協誣義先罪免官稍遷西南靣招討都監坐事下獄以太后言杖而釋之清寧初為國舅詳衮西北路招討使私取官粟三百斛及代留畜産令主者鬻以償後族弟呼都克到部發其事帝怒決以大杖免官尋起為昭徳軍節度使徴為北院宣徽使九年上以珠展先為招討威行諸部復為西北路招討使訓士卒增器械省追呼嚴號令人不敢犯邉境晏然十年入朝封栁城郡王咸雍二年拜北府宰相為北院樞密使耶律伊遜所忌誣珠展與䕶衛蕭和克等謀害伊遜詔獄無狀罷相出鎮順義軍卒追王晉宋梁三國姪藥師努藥師努幼頴悟謹禮法補祇候郎君太康中為興聖宮使遷同知殿前㸃檢司事上嘉其宿衛嚴肅遷右伊勒希巴夏王李乾順為宋所攻求解帝命藥師努持節使宋請罷兵通好宋從之拜南靣林牙改漢人行宮副部署乾統初出為安宋軍節度使卒耶律玦字烏展約尼森濟汗之後也重熈初召修國史補符寳郎累遷知北院副部署事入見太后后顧左右曰先皇謂玦必為偉人果然除樞密副使出為西南靣招討都監歴同簽南京留守事南靣林牙皇弟秦國王為遼興軍節度使以玦同知使事多所匡正十年復為樞密副使咸雍初兼北院副部署及秦國王為西京留守請玦為佐從之嵗中獄空者三召為孟父房詳衮玦不喜貨殖帝知其貧賜宫户十嘗謂宰相曰契丹忠正無如玦者漢人則劉伸而已然熟察之玦優於伸先是西北諸部久不能平上遣玦問狀執弛慢者痛繩之以酒疾卒耶律布勒圖字燕隱六院林牙圖魯卜四世孫也開泰間為本班郎君有捕盜功樞密使蕭朴薦之遷率府率太平中同知南院宣徽事累遷彰聖軍節度使十六年知興中府以獄空聞十八年伐夏攝西南靣招討使十九年夏人侵金肅軍敗之斬首萬餘級加右武衛上將軍時近邊羣牧數被冦掠遷到塌嶺都監以治之桴皷不鳴二十年知金肅軍事宰相趙惟節總領邉城橋道芻粟請貳帝命布勒圖副之以稱職聞清寧初歴長寧匡義二軍節度使致仕咸雍間卒子阿古齊終倒塌嶺都監論曰罕巴因帝微行才始見售及任以事落落知大體不負上之知矣唐古珠展經略西北邉勸農積粟訓練士卒敵人不敢犯玦以忠直見稱於上布勒圖以幹敏為宰相佐在鎮俱以獄空聞之數人者豈特甲胄之士亦李牧程不識之亞歟遼史卷九十一遼史卷九十一考證耶律唐古傳歴壕州刺史按壕州刻本舊作豪州考地理志壕州在顯州東北二十里又按營衛志亦有壕州之名謹据改重熈四年上疏不報是年致仕按𢎞簡録重熈十四年唐大為右伊勒希巴興宗本紀則係十七年事是唐古致仕當在十七年之後且嘗為伊勒希巴也傳有脱訛遼史卷九十一考證
