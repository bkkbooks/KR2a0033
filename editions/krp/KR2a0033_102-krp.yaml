body:
  text: 遼史卷一百二元中書右丞相總裁托克托等修列傳第三十二蕭奉先李處温張琳耶律伊都蕭奉先天祚元妃之兄也外寛内忌因元妃為上眷倚累官樞密使封蘭陵郡王天慶二年上幸混同江釣魚故事生女直帥長在千里内者皆朝行在適頭魚宴上使諸帥次第歌舞為樂至阿固達但端立直視辭以不能再三㫖諭不從上密謂奉先曰阿固達跋扈若此可託以邊事誅之奉先曰彼麤人不知禮義且無大過殺之傷向化心設有異志蕞爾小國亦何能為上乃止四年阿固達起兵侵寧江州東北路統軍使蕭托卜嘉戰失利上命奉先弟嗣先為都統將漢番兵往討屯出河店女直乃潛渡混同江乘我師未備來龍嗣先敗績軍將徃往遁去奉先懼弟被誅乃奏東征潰軍逃罪所至刼掠若不肆赦將嘯聚為患從之嗣先詣闕待罪止免官而已由是士無鬬志遇敵輒潰郡縣所失日多初奉先誣耶律伊都結駙馬蕭昱謀立其甥晉王事覺殺昱伊都在軍中聞之懼奔女直保大二年伊都為女直監軍引兵奄至上憂甚奉先曰伊都乃王子班之苖裔此來實無亡遼心欲立晉王耳若以社稷計不惜一子誅之可不戰而退遂賜晉王死中外莫不流涕人心益解體當女直之兵未至也奉先逢迎天祚言女直雖䏻攻我上京終不能逺離巢穴而一旦越三千里直擣雲中計無所出惟請播遷夾山天祚方悟顧謂奉先曰汝父子誤我至此殺之何益汝去毋從我行恐軍心忿怒禍必及我奉先父子慟哭而去為左右執送女直兵女直兵斬其長子昂送奉先及次子昱於其國主道遇我兵奪歸天祚竝賜死李處温析津人伯父儼太康初為將作少監累官㕘知政事封漆水郡王雅與北樞密使蕭奉先友舊執政十餘年善逢迎取媚天祚又寵任之儼卒奉先薦處温為相處温因奉先有援已力傾心阿附以固權位而貪汚尤甚凡所接引類多小人保大初金人陷中京諸將莫能支天祚懼奔夾山兵勢日廹處温與族弟處能子奭外假淵軍聲援結都統蕭斡謀立魏國王淳召番漢官屬詣魏王府勸進魏國王將出奭乃持赭袍衣之令百官拜舞稱賀魏王固辭不得遂稱天錫皇帝以處温守太尉處能直樞密院奭為少府少監左企弓以下及親舊與其事者賜官有差㑹魏國王病自知不起宻授處温番漢馬步軍都元帥意將屬以後事及病亟蕭斡等矯詔南面宰執入議獨處温稱疾不至陰聚勇士為備紿云奉密㫖防他變魏國王卒蕭斡擁契丹兵宣言當立王妃蕭氏為太后權主軍國事衆無敢異者斡以后命召處温至時方多難未欲即誅但追毁元帥劄子處能懼及禍落髪為僧尋有永清人傅遵説隨郭藥師入燕被擒具言處温嘗遺易州富民趙履仁書達宋將童貫欲挾蕭后納土歸宋后執處温問之處温曰臣父子於宣宗有定䇿功宜世䝉宥容可使因䜛獲罪后曰向使魏國王如周公則終享親賢之名於後世誤王者皆汝父子何功之有并數其前罪惡處温無以對乃賜死奭亦伏誅張琳瀋州人幼有大志壽隆末為秘書中允天祚即位累遷户部使頃之擢南府宰相初天祚之敗於女直也意謂蕭奉先不知兵乃召琳付以東征事琳以舊制凡軍國大計漢人不與辭之上不允琳奏曰前日之敗失於輕舉若用漢兵二十萬分道進討無不克者上許其半仍詔中京上京長春遼西四路計户産出軍時有起至二百軍者生業蕩散民甚苦之四路軍甫集尋復遁去及中京䧟天祚幸雲中留琳與李處温佐魏國王淳守南京處温父子召琳欲立淳為帝琳曰王雖帝胄初無上命攝政則可即真則不可處温曰今日之事天人所與豈可易也琳雖有難色亦勉從之淳既稱帝諸將咸居權要琳獨守太師十日一朝平章軍國大事陽以元老尊之實則不使與政琳由是欝悒而卒耶律伊都一名伊都古國族之近者也慷慨尚氣義保太初厯官副都統其妻天祚文妃之妹文妃生晉王最賢國人皆屬望時蕭奉先之妺亦為天祚元妃生秦王奉先恐秦王不得立深忌伊都將潛圖之適耶律達哈拉之妻㑹伊都之妻於軍中奉先諷人誣伊都結駙馬蕭昱達哈拉謀立晉王尊天祚為太上皇事覺殺昱及達哈拉妻賜文妃死伊都在軍中聞之懼不能自明被誅即引兵千餘并骨肉軍帳叛歸女直㑹大霖雨道途留阻天祚遣知奚王府蕭錫黙北宰相蕭德恭大詳衮耶律特哩衮歸州觀察使蕭和尚努四軍太師蕭斡追捕甚急至閭山及之諸將議曰蕭奉先恃寵蔑害官兵伊都乃宗室雄才素不肯為其下若擒之則他日吾輩皆伊都矣不如縱之還紿云追襲不及伊都既入女直為其國前鋒引羅索貝勒兵攻陷州郡不測而至天祚聞之大驚知不能敵率衛兵入夾山伊都在女直為監軍久不調意不自安乃假遊獵遁西夏夏人問汝來有兵幾何伊都以二三百對夏人不納卒論曰遼之亡也雖孽降自天亦柄國之臣有以誤之也當天慶而後政歸后族奉先阻天祚防微之計陷晉王非罪之誅夾山之禍已見於此矣處温逼魏王以僭號結宋將以賣國迹其姦佞如出一軌鳴呼天祚之所倚毗者若此國欲不亡得乎張琳娖娖守位伊都反覆自困則又何足議哉遼史卷一百二遼史卷一百二考證蕭奉先傳女直乃濳渡混同江乘我師未備來襲按來襲原文作擊之文義未明今據𢎞簡錄改張琳傅按傳所載唯云從李處温立魏國王淳爲帝考𢎞簡録琳心懐鬱悒時年已高令子弟上降表于金詔燕京應琳田宅財物並給還之俄卒則琳又實降金矣謹附識遼史卷一百二考證
