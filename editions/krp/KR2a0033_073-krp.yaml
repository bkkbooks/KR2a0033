body:
  text: 遼史卷七十三元中書右丞相總裁托克托等修列傳第三耶律赫嚕蕭達魯阿古齊耶律實訥齊隆科佛徳耶律托雲耶律哈里耶律赫嚕字琨一字洪隱徳哷勒部人祖實黙克簡憲皇帝兄父烏蘇約尼時為本部額爾竒木赫嚕其長子也性質厚髫鬌與太祖遊從父實嚕竒之曰興我家者必二兒也太祖既長相與易裘馬為好然赫嚕事太祖彌謹㑹華格弑其父實嚕太祖顧赫嚕曰華格弑父料我不能容將反噬我今彼歸罪特依順為解我姑與之是賊吾不忘也自是赫嚕常佩刀從太祖以備不虞居乆之赫嚕父烏蘇病召赫嚕曰安巴堅神畧天授汝率諸弟赤心事之已而太祖來問疾烏蘇執其手曰爾命世奇才吾兒赫嚕者他日可委以事吾已諭之矣旣而以諸子屬之太祖為塔瑪轄實哷參預部族事赫嚕領數騎召小黄室韋來附太祖素有大志而知赫嚕賢軍國事非赫嚕議不行㑹討裕爾庫與烏爾古部赫嚕為前鋒戰有功及太祖為徳哷勒部額爾竒木討奚部其長珠爾偪險而壘攻莫能下命赫嚕持一笴往諭之既入為奚所執廼說奚曰契丹與奚實一國也我額爾竒木豈有輘轢之心哉漢人殺我祖奚首額爾竒木怨刺骨日夜思報顧力單弱使我求援於奚傳矢以示信耳額爾竒木受命於天撫下以徳故能有此衆也今奚殺我違天背徳不祥莫大焉且兵連禍結當自此始豈爾國之利乎珠爾感其言乃降太祖為裕恱秉國政欲命赫嚕為徳哷勒部額爾竒木辭曰賊在君側未敢逺去太祖討黒車子室韋幽州劉仁恭遣趙覇率衆來救赫嚕伏兵桃山俟覇衆過半而要之與太祖合擊斬獲甚衆遂降室韋太祖㑹李克用于雲州時赫嚕侍克用顧而壯之曰偉男子為誰太祖曰吾族赫嚕也㑹約尼哈陶津汗歿羣臣奉遺命請立太祖太祖辭曰昔吾祖額爾竒木聶哷嘗以不當立而辭今若等復為是言何歟赫嚕進曰曩吾祖之辭遺命弗及符瑞未見第為國人所推戴耳今先君言猶在耳天人所與若合符契天不可逆人不可拂而君命不可違也太祖曰遺命固然汝焉知天道赫嚕曰聞裕恱之生也神光屬天異香盈幄夢受神誨龍錫金佩天道無私必應有徳我國削弱齮齕於隣部日乆以故天生聖人以興起之汗知天意故有是命且約尼九營棊布非無可立者小大臣民屬心裕恱天也昔者裕恱伯父實嚕嘗曰吾猶蛇兒猶龍也天時人事㡬不可失太祖猶未許是夜獨召赫嚕責曰衆以遺命廹我汝不明吾心而亦俛隨耶赫嚕曰昔額爾竒木聶哷雖推戴者衆辭之而立蘇爾威為汗相傳十餘世君臣之分亂紀綱之統隳委質他國若綴斿然羽檄蠭午民疲奔命興王之運實在今日應天順人以答顧命不可失也太祖乃許明日即皇帝位命赫嚕總軍國事時制度未講國用未充扈從未備而諸弟埒克等往往覬非望太祖宫行營始置腹心部選諸部豪徤二千餘充之以赫嚕及蕭達嚕總焉已而諸弟亂作太祖命赫嚕總軍事討平之以功為徳哷勒部額爾竒木時民更兵焚剽日以抏敝赫嚕撫輯有方畜牧盛滋民用冨庶乃討烏爾古部破之自是震懾不復叛廼請制朝儀建元率百官上尊號太祖既備禮受冊拜赫嚕為阿勒坦裕恱阿勒坦言貴重如金也後太祖伐西南諸夷數為前鋒神冊二年從逼幽州與唐節度使周徳威拒戰汗州西敗徳威軍遂圍幽州未下太祖以時暑班師留赫嚕與盧國用守之俄而救兵繼至赫嚕等以軍少無援退三年七月皇都既成燕羣臣以落之赫嚕是月得疾薨年四十七旣葬賜名其阡諳達山曰裕恱峪詔立石紀功清寧間命立祠上京初赫嚕病革太祖臨視問所欲言赫嚕曰陛下聖徳寛仁羣生咸遂帝業隆興臣䝉寵遇雖瞑目無憾惟析徳哷勒部議未决願亟行之及薨太祖流涕曰斯人若登三五載吾謀蔑不濟矣後太祖二十一功臣各有所儗以赫嚕為心云子塔喇薩喇俱不仕論曰赫嚕以肺腑之親任帷幄之寄言如蓍龜謀成戰勝可謂算無遺䇿矣其君臣相得之誠庶呉漢之於光武歟夫信其所可信智也太祖有焉故曰惟聖知聖惟賢知賢斯近之矣蕭達魯字達年其母為徳祖女弟而淳欽皇后又其女兄也五世祖曰瑚穆哩約尼氏時嘗使唐唐留之幽州一夕折關遁歸國由是世為决獄官達魯性寛厚膂力絶人習軍旅事太祖潛藩日待左右凡征討必與行陣既即位達魯與弟阿古齊耶律實嚕耶律赫嚕皆總宿衛拜達魯北府宰相世其官太祖征奚及討劉守光達魯畧地海濱殺獲甚衆頃之埒克等作亂潰而北走達魯率輕騎追之兼晝夜行至榆河敗其黨獲埒克以獻太祖嘉之錫賚甚渥後討西南夷功居諸將先神冊三年十二月卒達魯有膽畧聞敵所在即馳赴親冒矢石前後戰未嘗少衂必勝乃止以故在太祖功臣列喻以手云弟阿古齊阿古齊字薩巴少卓越自放不羈長驍勇善射臨敵敢前每射甲楯輒洞貫太祖為裕恱時以材勇充任使既即位與達魯總腹心部埒克之亂也淳欽皇后軍黒山阻險自固太祖方經畧奚地命阿古齊統百騎往衛之逆黨特爾特耶律華格素憚其勇畧相戒曰是不可犯也埒克既北走與達魯追擒于榆河神冊初元討西南夷有功狥山西諸郡縣又下之敗周徳威軍三年以功拜北府宰相世其職天贊初與王郁畧地燕趙破磁窯鎮太祖西征悉委以南面邊事攻渤海破扶餘城獨將騎兵五百敗老相軍三萬渤海既平改東丹國頃之已降郡縣復叛盜賊蜂起阿古齊與康黙記討之所向披靡㑹賊游騎七千自鴨淥府來援勢張甚阿古齊帥麾下精銳直犯其鋒一戰克之斬馘二千餘遂進軍破輝發城以病卒功臣中喻阿古齊為耳云子安圖官至右皮室詳衮耶律實訥齊字薩喇六院部錫里尼古察之族始字堆音早𨽻太祖幕下嘗有疾賜罇酒飲而愈承詔易字遂易之曰薩喇焉及太祖即位掌腹心部天贊初分徳哷勒部為北南院實訥齊為北院額爾竒木帝西征至流沙諸夷聞威聲潰散命實訥齊撫集之及討渤海破扶餘城實訥齊從太子大元帥率衆夜圍輝罕城大諲譔降已而復叛命諸將分地攻之詰旦實訥齊感勵士伍鼓譟登陴敵震懾莫敢禦遂破之天顯中卒年七十居佐命功臣之一姪隆科佛徳隆科字薩蘭其母淳欽皇后姊也隆科㓜養宫掖既長沉毅有勇畧𨽻太祖帳下既即位屢有戰功埒克之亂也欲乘我不備為掩襲計紿降太祖將納之命隆科耶律托雲嚴號令勒士卒控轡以防其變逆黨知有備懼而遁以功授右皮室詳衮典宿衛太祖侵燕趙遇唐兵雲碧店隆科恃勇輕敵直犯其鋒戰乆之被數創歸營而卒太祖深悼惜之佐命功臣其一也佛徳字烏庫哩弱冠事太祖天顯初為左皮室詳衮典宿衛遷南院額爾竒木治有聲石敬瑭破張敬達軍於太原北佛徳勒兵為援敬達遁敬瑭追至晉安寨圍之佛徳領輕騎襲潞州塞其餉道唐將殺敬達以降㑹同初改徳哷勒部額爾竒木為大王即拜佛徳既而加採訪使舊制肅祖以下宗室稱院徳祖宗室號三父房稱横帳百官子弟及籍沒人稱著帳耶律實迪言横帳班列不可與北南院竝太宗詔在廷議皆曰然乃詔横帳班列居上佛徳奏曰伏見官制北南院大王品在特哩衮上今横帳始圖爵位之髙願與北南院參任兹又恥與同列夫横帳與諸族皆臣也班列奚以異帝乃諭百官曰朕所不知卿等不宜面從詔仍舊制其强直不撓如此佛徳狀貌秀偉初太祖見之曰是子風骨異常兒必為國器後果然卒年四十九耶律欲穩字錫里雅圖魯卜部人祖塔雅克約尼時為北邊伊喇簡獻皇后與諸子之罹難也嘗倚之以免太祖思其功不忘又多其嚴重有濟世志乃命典司近部以遏諸族窺覬之想欲穩既見器重益感奮思報太祖始置宫分以自衛欲穩率門客首附宫籍帝益嘉其忠詔以塔雅克配享廟廷及平埓克等亂以功遷奚徳哷勒部額爾竒木從征渤海有功天顯初卒後諸帝以太袓與之有故往往取其子孫為友宫分中稱八房皆其後也弟轄哩終奚六部圖哩耶律哈里字鼐爾琨約尼兆古汗之裔孫太祖傳位哈里與有力焉初受命屬籍比局萌覬覦而約尼故族尤觖望哈里多先帝知人之明而素服太祖威徳獨歸心焉以故太祖託為耳目數從征討既靖内亂始置約尼詳衮令哈里領之天顯初征渤海哈里將約尼糺破輝罕城師班卒遼史卷七十三遼史卷七十三考證耶律赫嚕傳拜赫嚕為阿勒坦裕悦阿勒坦原本作阿魯敦按太祖本紀又作阿廬朶係音譯之訛今併改遼史卷七十三考證
