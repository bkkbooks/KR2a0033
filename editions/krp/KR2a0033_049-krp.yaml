body:
  text: 遼史卷四十九元中書右丞相總裁托克托等修志第十八禮志一理自天設情繇人生以理制情而禮樂之用行焉林豺梁獺是生郊禘窪尊燔黍是生燕饗虆梩瓦棺是生喪葬儷皮緇布是生婚冠皇造帝秩三王彌文一文一質葢本于忠變通革弊與時宜之惟聖人為能通其意執理者膠瑟聚訟不適人情徇情者稊稗綿蕝不中天理秦漢而降君子無取焉遼本朝鮮故壤箕子八條之教流風遺俗葢有存者自其上世縁情制宜隠然有尚質之風約尼和拉汗制祭山儀蘇汗制色克色哩儀蘇爾威汗制柴冊再生儀其情朴其用儉敬天恤災施恵本孝出於悃忱殆有得於膠瑟聚訟之表者太古之上推輪五禮何以異茲太宗克晉稍用漢禮今國史院有金陳大任遼禮儀志皆其國俗之故又有遼朝雜禮漢儀為多别得宣文閣所藏耶律儼志視大任為加詳存其畧著于篇吉儀祭山儀設天神地祗位于木葉山東鄉中立君樹前植羣樹以像朝班偶植二樹為神門皇帝皇后至伊勒希巴具禮儀牲用赭白馬𤣥牛赤白羊皆牡僕臣曰旗皷伊喇殺牲體割懸之君樹太巫以酒酹牲禮官曰多囉倫穆騰奏儀辦皇帝服金文金冠白綾袍絳帶懸魚三山絳垂飾犀玉刀錯絡縫烏靴皇后御絳帓絡縫紅袍懸玉佩雙結帕絡縫烏靴皇帝皇后御鞍馬羣臣在南命婦在北服從各部旗幟之色以從皇帝皇后至君樹前下馬升南壇御榻坐羣臣命婦分班以次入就位合班拜訖復位皇帝皇后詣天神地祗位致奠閤門使讀祝訖復位坐北府宰相特哩衮以次致奠于君樹徧及羣樹樂作羣臣命婦退皇帝率孟父仲父季父之族三匝神門樹餘族七匝皇帝皇后再拜在位者皆再拜上香再拜如初皇帝皇后升壇坐龍文茵再聲警詣祭東所羣臣命婦從班列如初巫衣白衣特哩衮以素巾拜而冠之巫三致辭每致辭皇帝皇后一拜在位者皆一拜皇帝皇后各舉酒二爵肉二器再奠大臣命婦右持酒左持肉各一器少後立一奠命特哩衮東向擲之皇帝皇后六拜在位者皆六拜皇帝皇后復位坐命中丞奉茶果餅餌各二器奠于天神地祗位執事郎君二十人持福酒胙肉詣皇帝皇后前太巫奠酹訖皇帝皇后再拜在位者皆再拜皇帝皇后一拜飲福受胙復位坐在位者以次飲皇帝皇后率羣臣復班位再拜聲蹕一拜退太祖幸幽州大悲閣遷白衣觀音像建廟木葉山尊為家神於拜山儀過樹之後増詣菩薩堂儀一節然後拜神非復和拉汗之故也興宗先有事于菩薩堂及木葉山遼河神然後行拜山儀冠服節文多所變更後因以為常神主樹木懸牲告辦班位奠祝致嘏飲福往往暗合于禮天理人情放諸四海而準信矣夫興宗更制不能正以經術無以大過於昔故不載色克色哩儀若旱擇日行色克色哩儀祈雨前期置百柱天棚及期皇帝致奠于先帝御容乃射栁皇帝再射親王宰執各一射中栁者質誌栁者冠服不中者以冠服質之不勝者進飲於勝者然後各歸其冠服又翼日植栁天棚之東南巫以酒醴黍稷薦植栁祝之皇帝皇后祭東方畢子弟射栁皇族國舅羣臣與禮者賜物有差既三日雨賜多囉倫穆騰馬四匹衣四襲否則以水沃之道宗清寜元年皇帝射栁訖詣風師壇再拜柴冊儀擇吉日前期置柴冊殿及壇壇之制厚積薪以木為三級壇置其上席百尺氊龍文方茵又置再生母后捜索之室皇帝入再生室行再生儀畢八部之叟前導後扈左右扶翼皇帝冊殿之東北隅拜日畢乘馬選外戚之老者御皇帝疾馳仆御者從者以氊覆之皇帝詣髙阜地大臣諸部帥列儀仗遥望以拜皇帝遣使勅曰先帝升遐有伯叔父兄在當選賢者冲人不徳何以為謀羣臣對曰臣等以先帝厚恩陛下明徳咸願盡心敢有他圖皇帝令曰必從汝等所願我將信明賞罰爾有功陟而任之爾有罪黜而棄之若聴朕命則當謨之僉曰惟皇帝是從皇帝于所識之地封土石以誌之遂行拜先帝御容宴饗羣臣翼日皇帝出冊殿䕶衞太保扶翼升壇奉七廟神主置龍文方茵北南府宰相率羣臣圜立各舉氊邊贊祝訖樞密使奉玉寳玉冊入有司讀冊訖樞密使稱尊號以進羣臣三稱萬嵗皆拜宰相北南院大王諸部帥進赭白羊各一羣皇帝更衣拜諸帝御容遂晏羣臣賜賚各有差拜日儀皇帝升露臺設褥向日再拜上香門使通閣使或副應拜臣僚殿左右階陪位再拜皇帝升座奏牓訖北班起居畢時相已下通名再拜不出班奏聖躬萬福又再拜各祗候宣徽已下横班同諸司閤門北面先奏事餘同教坊與臣僚等告廟儀至日臣僚昧爽朝服詣太祖廟次引臣僚合班先見御容再拜畢引班首左上至褥位再拜贊上香揖欄内上香畢復褥位再拜各祇侯立定左右舉告廟祝版於御容前跪捧中書舍人俛跪讀訖俛興退引班首左下復位又再拜分引上殿次第進酒三分班引出謁廟儀至日昧爽南北臣僚各具朝服赴廟車駕至臣僚於門外依位序立望駕鞠躬班首不出班奏聖躬萬福舍人贊各祇候畢皇帝降車分引南北臣僚左右入至丹墀褥位合班定皇帝升露臺褥位宣徽贊皇帝再拜殿上下臣僚陪位皆再拜上香畢退復位再拜分引臣僚左右上殿位立進御容酒依常禮若即退再拜舍人贊好去引退禮畢告廟謁廟皆曰拜容以先帝先后生辰及忌辰行禮自太宗始也其後正旦皇帝生辰諸節辰皆行之若忌辰及車駕行幸亦嘗遣使行禮凡色克色哩柴冊再生納后則親行之凡柴冊親征則告幸諸京則謁四時有薦新孟冬朔拜陵儀有司設酒饌于山陵皇帝皇后駕至多囉倫穆騰奏儀辦閤門使贊皇帝皇后詣位四拜訖巫贊祝燔胙及時服酹酒薦牲大臣命婦以次燔胙四拜皇帝皇后率羣臣命婦循諸陵各三匝還宫翼日羣臣入謝爇節儀皇帝即位凡征伐叛國俘掠人民或臣下進獻人口或犯罪没官戸皇帝親覽閒田建州縣以居之設官治其事及帝崩所置人户府庫錢粟穹廬中置小氊殿帝及后妃皆鑄金像納焉節辰忌日朔望皆致祭于穹廬之前又築土為臺髙丈餘置大盤于上祭酒食撒於其中焚之國俗謂之爇節嵗除儀初夕敕使及伊勒希巴率執事郎君至殿前以鹽及羊膏置爐中燎之巫及大巫以次贊祝火神訖閤門使贊皇帝面火再拜初皇帝皆親拜至道宗始命伊勒希巴拜之遼史卷四十九遼史卷四十九考證柴冊儀按王易燕北録所載柴冊儀有拜日拜七廟殿拜木葉山神拜金神拜冊太后拜赤娘子拜七祖眷屬畢次上柴籠受冊次入黑龍殿受賀行禮罷又有宴飲等儀與此逈異謹附識以備考拜日儀按聖宗本紀統和元年十二月千齡節祭日月四年十二月祭日月又按兵衞志凡舉兵以青牛白馬祭告天地日神惟不拜月據此則拜日之儀有獨拜日者有兼拜月者拜月之儀志雖不載要當與拜日等謹附識遼史卷四十九考證
