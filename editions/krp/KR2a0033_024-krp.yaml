body:
  text: 遼史卷二十四元中書右丞相總裁托克托等修本紀第二十四道宗四五年春正月壬申如混同江癸酉賜宰相耶律孝傑名仁傑乙亥如山榆淀三月辛未以宰相仁傑獲頭鵝加侍中壬辰北院樞宻使魏王耶律伊遜知南院大王事加裕悦知北院樞宻使事耶律霂為北院樞宻使北院樞宻副使耶律塔喇台知北院樞宻使事左伊勒希巴耶律世遷同知北院樞宻使事夏四月己未如納克濼五月丁亥謁慶陵以契丹行宫都部署耶律雅克為南府宰相北面林牙耶律永寧伊勒希巴同知南院樞宻使事蕭托卜嘉及殿前副㸃檢駙馬都尉蕭綽哈並封蘭陵郡王六月辛亥凖布來貢丁巳以北府宰相遼西郡王蕭額哩頁為西北路招討使己未遣使錄囚是月放進士劉瓘等百一十三人秋七月己邜獵夹山八月庚申命有司撰太宗神功碑立於南京九月己邜詔諸路毋禁僧徒開壇壬午禁扈從擾民冬十月戊戌夏國遣使來貢己亥駐蹕都爾嘉壬子詔惟皇子仍一字王餘並削降丁巳振平州貧民己未以趙王楊績為遼西郡王魏王耶律伊遜降封混同郡王吳王蕭罕嘉努蘭陵郡王致仕十一月丁丑召沙門守道開壇於内殿癸未復南京流民差役三年被火之家免租税一年十二月丙午彗星犯尾乙邜幸西京戊午行再生禮赦雜犯死罪以下六年春正月癸酉如鴛鴦濼辛邜耶律伊遜出知興中府事三月庚寅封皇孫延禧為梁王忠順軍節度使耶律佛徳南院大王耶律仲禧南院樞宻使戸部使陳毅參知政事夏四月乙邜獵炭山五月壬申免平州復業民租賦一年庚寅以旱禱雨命左右以水相沃俄而雨降六月戊戌駐蹕納克濼戊申以度支使王績參知政事庚戌女直遣使來貢秋七月戊辰觀市癸未為皇孫梁王延禧設旗鼓伊喇六人衛之甲申獵沙嶺閏九月壬寅祠木葉山己酉駐蹕藕絲淀冬十月己未朔省同知廣徳軍節度使事命奉先軍節度使兼巡警乾顯二州丁邜耶律仁傑出為武定軍節度使庚午參知政事劉詵致仕癸酉以陳毅為漢人行宫都部署王績同知樞宻院事辛巳回鶻遣使來貢十一月己丑朔日有食之癸邜召羣臣議政十二月甲子以耶律塔喇台為孟父詳衮乙丑以蕭托卜嘉為北府宰相耶律世遷知北院樞宻使事耶律慎思同知北院樞宻使事庚午免西京流民租賦一年甲戌減民賦丁亥豫行正旦禮戊子如混同江七年春正月戊申五國部長來貢甲寅女直貢良馬二月甲子如魚兒濼夏五月壬子駐蹕嶺西癸丑有司奏永清武清固安三縣蝗甲寅以蕭托卜嘉兼殿前都㸃檢蕭綽哈為漢人行宫都部署兼知樞宻院事六月甲子詔月祭觀徳殿嵗寒食諸帝在時生辰及忌日詣景宗御容殿致奠丙寅凖布余果南來貢丁邜以翰林學士王言敷參知政事封北院宣徽使石篤漆水郡王秋七月戊子如秋山丙申謁慶陵八月丁邜射鹿赤山加圍塲使尼格為静江軍節度使九月戊子次懐州命皇后謁懐陵辛邜次祖州命皇后謁祖陵乙巳駐蹕藕絲淀冬十月戊辰以特哩衮旺玖為南院大王伊勒希巴奚綽竒為彰國軍節度使十一月乙酉詔嵗出官錢振諸宫分及邊戍貧戸丁亥幸駙馬都尉蕭綽哈第方飲宰相梁頴諫曰天子不可飲人臣家上即還宫己亥髙麗來貢辛巳除帛絹尺度狹短之令十二月丁邜武定軍節度使耶律仁傑以罪削爵為民辛未知興中府事耶律伊遜以罪囚於來州八年春正月甲申如混同江丁酉鐡驪五國諸長各貢方物二月戊午如山榆淀辛酉詔北南院官凡給驛者必先奏聞貢新及奏獄訟方許馳驛餘並禁之己巳夏國獲宋將張天一遣使來獻壬申以耶律佛徳為南府宰相兼知北院樞宻使雅克為特哩衮蕭托卜嘉兼知契丹行宫都部署事三月庚戌黄龍府女直部長鐘鼐率民内附予官賜印綬是月詔行秬黍所定升斗夏四月壬戌以耶律世遷為上京留守六月辛亥朔駐蹕納克濼丙辰夏國遣使來貢丁巳以耶律佛徳為北院樞宻使耶律超格南府宰相劉筠南院樞宻使蕭托卜嘉兼知北院樞宻使事王績漢人行宫都部署蕭綽哈國舅詳衮乙丑凖布來貢丙子以耶律慎思知右伊勒希巴事秋七月甲午如秋山南京霖雨沙河溢永清歸義新城安次武清香河六縣傷稼九月庚寅謁慶陵丁未駐蹕藕絲淀大風雪牛馬多死賜扈從官以下衣馬有差冬十月乙邜詔華格傅導梁王延禧加金吾衛大將軍丙子謁乾陵十一月壬午以伊實大王蕭哈噶為南院宣徽使權知奚六部大王事圖罕為本部大王十二月癸丑烏爾古徳哷勒統軍使耶律瑪古為北院大王庚申降皇后為惠妃出居乾陵九年春正月辛巳如春水夏四月丙午朔大雪平地丈餘馬死者十六七五月如黒嶺六月己未駐蹕散水原甲子以耶律阿蘇為契丹行宫都部署耶律慎思北院樞宻副使庚午詔諸路檢括脱户罪至死者原之閏月丁丑以漢人行宫副部署罕努為南院大王戊寅詔追諡庶人濬為昭懐太子丁亥凖布來貢己丑以知興中府事邢熙年為漢人行宫都部署漢人行宫都部署王績為南院樞宻副使秋七月乙巳獵馬尾山丁巳謁慶陵癸丑禁外官部内貸錢取息及使者館於民家八月髙麗王徽薨九月癸邜朔日有食之己酉射熊於白石山加圍場使尼格左金吾衛大將軍己巳以髙麗王徽子三韓國公勲權知國事辛未五國部長來貢壬申召北南樞宻使官議政事冬十月丁丑謁觀徳殿己邜南院樞宻使劉筠薨壬辰混同郡王耶律伊遜謀亡入宋伏誅十一月丙午進封梁王延禧為燕國王大赦以南院宣徽使蕭哈噶為南府宰相三司使王經參知政事兼知樞宻事甲寅詔僧善知讐校髙麗所進佛經頒行之己未定諸令史譯史遷叙等級十二月丁亥以邢熙年知南院樞宻使事辛邜以王言敷為漢人行宫都部署髙麗三韓國公王勲薨是年御前放進士李君裕等五十一人十年春正月辛丑朔如春水丙午復建南京奉福寺浮圖戊辰如山榆淀二月庚午朔䝉古國遣使來聘三月戊申逺䝉古國遣使來聘丁巳命知制誥王師儒牌印郎君耶律固傅導燕國王延禧夏四月丁丑女直貢良馬五月壬戌駐蹕㪚水原乙丑凖布來貢丙寅降國舅詳衮班位在詳衮之下六月壬辰禁毁銅錢為器秋七七甲辰如黒嶺九月癸亥駐蹕藕絲淀冬十二月乙未改慶州大安軍曰興平是月改明年為大安赦雜犯死罪以下大安元年春正月丁酉如混同江癸邜王績知南院樞宻使事邢熙年為中京留守戊申以樞宻直學士杜公謂參知政事庚戌五國酋長來貢良馬二月辛未如山榆淀夏四月乙酉宋主頊殂子煦嗣位使來告哀辛邜西幸六月戊辰駐蹕圖古勒壬申以王績為南府宰相蕭托卜嘉兼知南院樞宻使事丁丑遣使弔祭於宋戊寅宋遣王真甄祐等饋其先帝遺物秋七月乙巳遣使賀宋主即位戊午獵於赤山八月丁邜幸慶州戊辰謁慶陵冬十月癸亥駐蹕好草淀戊辰夏國王李秉常遣使報其母梁氏哀甲申以蕭托卜嘉為南院樞宻使十一月乙未詔比者外官因譽進秩久而不調民被其害今後皆以資給遷轉丁酉以南女直詳衮蕭伯哩為北府宰相辛亥史臣進太祖以下七帝實録丙辰遣使冊三韓國公王勲子運為髙麗國王己未詔僧尼無故不得赴闕十二月甲午宋遣蔡卞來謝弔祭二年春正月辛邜如混同江己酉五國諸部長來貢癸丑召權翰林學士趙孝嚴知制誥王師儒等講五經大義二月癸酉駐蹕山榆淀是月太白犯嵗星三月乙酉女直貢良馬夏四月戊戌北幸癸丑遣使加統軍使蕭額圖琿太子太保禆將隆科金吾衛大將軍蕭雅克静江軍節度使耶律約尼右監門衛大將軍仍賜賚諸軍士五月丁巳朔以牧馬蕃息多至百萬賞羣牧官以次進階乙亥駐蹕納克濼戊寅宰相梁頴出知興中府事是月放進士張轂等二十六人六月丁亥朔左伊勒希巴耶律坦為特哩衮知樞宻院事耶律額特哷兼知左伊勒希巴事丙申凖布來朝癸邜遣使按諸路獄甲辰同知南京留守事耶律納延知右伊勒希巴事乙巳凖布余果南及阿逹來朝詔燕國王延禧相結為友戊申以契丹行宫都部署耶律阿蘇兼知北院大王事壬子髙墩以下縣令録事兄弟及子悉許叙用秋七月丁巳惠妃母燕國夫人鍚庫以厭魅梁王事覺伏誅子蘭陵郡王蕭綽哈除名置邊郡仍𨽻興聖宫戊午獵沙嶺甲子賜興聖積慶二宫貧民錢乙酉出粟振遼州貧民八月戊子以雪罷獵九月庚午還上京壬申發粟振上京中京貧民丙子謁二儀五鸞二殿己邜出太祖太宗所御鎧伏示燕國王延禧諭以創業征伐之難辛巳召南府宰相議國政冬十月乙酉朔以樞宻副使竇景庸知樞宻院事丙戌五國部長來貢丁亥以夏國王李秉常薨遣使詔其子乾順知國事十一月甲戌為燕國王延禧行再生禮曲赦上京囚戊寅髙麗遣使謝封冊癸未出粟振乾顯成懿四州貧民十二月辛邜以蘭陵郡王蕭托卜嘉為南院樞宻使己亥夏國王李乾順遣使上其父遺物遼史卷二十四遼史卷二十四考證六年閏九月按原本作九月無閏字考厯象志朔考是年九月庚申朔閏九月庚寅朔以支干推之壬寅己酉皆閏九月非九月也今據増冬十月己未朔按原本作癸未下接書丁邜庚午等日距癸未且四十餘日矣今據朔考改正七年耶律伊遜以罪囚於來州按原本作萊州考地理志來州統來賔縣地與萊州迥異伊遜傳亦作來州今據改正遼史卷二十四考證
