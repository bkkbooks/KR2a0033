body:
  text: 遼史卷八十九元中書右丞相總裁托克托等修列傳第十九耶律庶成庶箴冨魯楊晳耶律韓留楊佶耶律華善耶律庶成字喜隱小字辰賚季父房之後父烏津檢校太師庶成㓜好學書過目不忘善遼漢文字於詩尤工重熙初補牌印郎君累遷樞宻直學士與蕭罕嘉努各進四時逸樂賦帝嗟賞初契丹醫人鮮知切脉審藥上命庶成譯方脈書行之自是人皆通習雖諸部族亦知醫事時入禁中叅決疑議偕林牙蕭罕嘉努等撰實録及禮書與樞宻副使耶律徳修定法令上詔庶成曰方今法令輕重不倫法令者為政所先人命所繫不可不慎卿其審度輕重從宜修定庶成參酌古今刋正訛謬成書以進帝覽而善之庶成方嚮用時為妻呼敦所誣以罪奪官絀為庶耶律使吐蕃凡十二年清寧間始歸帝知其誣詔復本族仍遷所奪官卒庶成嘗謂林牙夢善卜者呼嚕古卜曰官止林牙因妻得罪及置於理法當離婚呼敦適有娠至期不産而死剖視之其子以手抱心識者謂誣夫之報有詩文行于世弟庶箴庶箴字辰冨善屬文重熙中為本族將軍咸雍元年同知東京留守事俄徙烏延突厥部節度使九年知薊州事明年遷都林牙上表乞廣本國姓氏曰我朝創業以來法制修明惟姓氏止分為二耶律與蕭而已始太祖制契丹大字取諸部鄉里之名續作一篇著于卷末臣請推廣之使諸部各立姓氏庶男女婚媾有合典禮帝以舊制不可遽釐不聽太康二年出耶律伊遜為中京留守庶箴與耶律孟簡表賀頃之伊遜復為樞宻使專權恣虐庶箴私見伊遜泣曰前抗表非庶箴之願也伊遜信其言乃得自安聞者鄙之八年致仕卒子冨魯冨魯字努展㓜聰悟好學甫七歳能誦契丹大字習漢文未十年博通經籍重熙中舉進士第主文以國制無契丹試進士之條聞于上以庶箴擅令子就科目鞭之二百尋命冨魯為牌印郎君應詔賦詩立成以進帝嘉賞顧左右曰文才如此必不能武事冨魯奏曰臣自蒙義方兼習騎射在流輩中亦可周旋帝未之信㑹從獵三矢中三兎帝竒之轉通進是時父庶箴嘗寄戒諭詩冨魯答以賦衆稱其典雅寵遇漸隆清寧初卒楊晳字昌時安次人㓜通五經大義聖宗聞其頴悟詔試詩授秘書省校書郎太平十一年擢進士乙科為著作佐郎重熙十二年累遷樞宻都承㫖權度支使登對稱㫖進樞宻副使歴長寧軍節度使山西路轉運使知興中府清寧初入知南院樞宻使與姚景行同總朝政請行柴册禮封趙國公以足疾復知興中府咸雍初徙封齊召賜同徳功臣尚書左僕射兼中書令拜樞宻使改封晉給宰相樞宻使兩㕔傔從封趙王屢請歸政益賜保節功臣致仕太康五年例改遼西郡王薨耶律韓留字索紐仲父隋國王之後有明識篤行義舉止嚴重工為詩統和間召攝御院通進開泰三年稍遷烏爾古徳哷勒部都監知詳衮事徳哷勒叛將宫分軍從樞宻使耶律世良平之加千牛衛大將軍重熙元年累遷至同知上京留守改奚六部圖哩太尉性不苟合為樞宻使蕭嘉哩所忌上欲召用韓留嘉哩言目病不能視議遂寢四年召為北面林牙帝曰朕早欲用卿聞有疾故待之至今韓留對曰臣昔有目疾才數月耳然亦不至于昬第臣駑拙不能事權貴是以不獲早覩天顔非陛下聖察則愚臣豈有今日耶詔進述懐詩上嘉歎方將大用卒楊佶字正叔南京人㓜頴悟異常讀書自能成句識者竒之弱冠聲名籍甚統和二十四年舉進士第一歴校書郎大理正開泰六年轉儀曹郎典掌書命加諌議大夫出知易州治尚清簡徵發期㑹必信入為大理少卿累遷翰林學士文章號得體八年燕地饑疫民多流殍以佶同知南京留守事發倉廩振乏絶貧民鬻子者計傭而出之宋遣梅詢賀千齡節詔佶迎送多唱酬詢每見稱賞復為翰林學士重熙元年陞翰林學士承㫖丁毋憂起復工部尚書歴忠順軍節度使朔武等州觀察處置使天徳軍節度使加特進檢校太師同中書門下平章事復拜參知政事兼知南院樞宻使十五年出為武定軍節度使境内亢旱苖稼將槁視事之夕雨澤霑足百姓歌曰何以蘇我上天降雨誰其撫我楊公為主㶟陽水失故道歲為民害乃以已俸創長橋人不病涉及被召群民攀轅泣送上御清涼殿宴勞之即日除吏部尚書兼門下侍郎同中書門下平章事上曰卿今日何減吕望之遇文王佶對曰吕望比臣遭際有十年之晩上恱其居相位以進賢為已任事總大綱責成百司人人樂為之用三請致政許之月給錢粟傔𨽻四時遣使存問卒有登瀛集行于世律耶華善字特黙系出季父房善滑稽重熙初補祗候郎君時帝篤于親親凡三父之後皆序父兄行第於華善尤狎愛然每侍宴飲雖詼諧未嘗有一言之過由是上益重之厯積慶永興宫使累遷至同知南院宣徽使事南面林牙十六年出為懐化軍節度使俄召為御史大夫二十三年因大册加天平軍節度使檢校太師徙中京路案問使卒華善雅有美行數以財恤親友人皆愛重然嗜酒不事事以故不獲柄用或以為言答曰吾非不知顧人生如風燈石火不飲將何為晩年沈湎尤甚人稱為酒仙云論曰庶成定法令治民者不容髙下其手庶箴雖嘗表請廣姓氏以秩典禮其隨勢俯仰則有愧於其子冨魯矣楊晳為上寵遇迭封王爵而功業不少槩見然得愛民治國之要其楊佶哉遼史卷八十九遼史卷八十九考證耶律庶成傳補牌印郎君按百官志耶律庶成嘗為翰林都林牙在重熙十三年與興宗本紀合傳未載遼史卷八十九考證
