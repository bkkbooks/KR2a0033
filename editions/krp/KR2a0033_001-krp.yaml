body:
  text: 遼史巻一元中書右丞相總裁托克托等修本紀第一太祖上太祖大聖大明神烈天皇帝姓耶律氏諱億字安巴堅小字多爾濟契丹徳哷勒部轄塔哩錫林耶律穆嚕人徳祖皇帝長子母宣簡皇后蕭氏唐咸通十三年生初母夢日堕懐中有娠及生室有神光異香體如三嵗兒即能匍匐祖母簡獻皇后異之鞠為己子常匿扵别幕塗其靣不令他人見三月能行晬而能言知未然事自謂左右若有神人翼衛雖齠齓言必及世務時伯父當國疑輙咨焉既長身長九尺豐上鋭下目光射人闗弓三百斤為塔瑪噶賽特小黃室韋不附太祖以計降之伐裕爾庫烏爾古六奚畢沙叙諸部克之國人號額珍錫哩唐天復元年嵗辛酉哈陶津汗立以太祖為本部額爾竒木專征討連破室韋伊濟及奚帥錫爾格俘獲甚衆冬十月授大徳哷勒府額爾竒木明年秋七月以兵四十萬伐河東代北攻下九郡獲生口九萬五千駞馬牛羊無算九月城龍化州于潢河之南始建開敎寺明年春伐女直下之獲其户三百九月復攻下河東懐逺等軍冬十月引軍畧至薊北俘獲以還先是徳祖俘奚七千户徙饒樂之清河至是創奚徳哷勒部分十三縣遂拜太祖裕悦總知軍國事明年嵗甲子三月廣龍化州之東城九月討黑車子室韋唐盧龍軍節度使劉仁恭發兵數萬遣養子趙霸来拒霸至武州太祖諜知之伏勁兵桃山下遣室韋人摩哩詐稱其酋長所遣約霸兵會平原既至四靣伏發擒霸殱其衆乘勝大破室韋明年七月復討黑車子室韋唐河東節度使李克用遣通事康令徳乞盟冬十月太祖以騎兵七萬會克用于雲州宴酣克用借兵以報劉仁恭木𤓰澗之役太祖許之易袍馬約為兄弟及進兵擊仁恭㧞數州盡徙其民以歸明年二月復擊劉仁恭還襲山北奚破之汴州朱全忠遣人浮海奉書幣衣帶珍玩来聘十一月遣偏師討奚霫諸部及東北女直之未附者悉破降之十二月哈陶津汗殂羣臣奉遺命共請立太祖赫嚕等勸進太祖三讓従之元年春正月庚寅命有司設壇舒伊旺尼珠琿温燔柴告天即皇帝位尊母蕭氏為皇太后立皇后蕭氏北宰相蕭實喇南宰相耶律烏魯斯率羣臣上尊號曰天皇帝后曰地皇后庚子詔皇族承約尼氏九帳為第十帳二月戊午以従弟達勒達為徳哷勒部額爾竒水征黑車子室韋降其八部夏四月丁未朔唐梁王朱全忠廢其主尋弑之自立為帝國號梁遣使来告劉仁恭子守光囚其父自稱幽州盧龍軍節度使秋七月乙酉其兄平州刺史守竒率其衆數千人来降命置之平盧城冬十月乙巳討黑車子室韋破之二年春正月癸酉朔御正殿受百官及諸國使朝辛巳置特哩衮典族屬以皇弟薩喇為之河東李克用卒子存朂襲遣使弔慰夏五月癸酉詔薩喇討烏丸黑車子室韋秋八月壬子幽州進合歡𤓰冬十月己亥建明王樓築長城于鎮東海口遣輕兵取托歡叛入室韋者三年春正月幸遼東二月丁酉朔梁遣郎公逺来聘三月滄州節度使劉守文為弟守光所攻遣人乞兵討之命皇弟錫里素額爾竒木蕭達魯以兵會守文于北淖口進至橫海軍近淀一鼓破之守光潰去因名北淖口為會盟口夏四月乙夘詔左僕射韓知古建碑龍化州大廣寺以紀功徳五月甲申置羊城于炭山之北以通市易冬十月己巳遣鷹軍討黑車子室韋破之西北烏梁海部族進輓車人四年秋七月戊子朔以后兄蕭達魯為北府宰相后族為相自此始冬十月烏滿山奚庫濟及扎嚕特超黙特等叛討平之五年春正月丙戌朔日有食之丙申上親征西部奚奚阻險叛服不常數招諭弗聴是役所向輙下遂分兵討東部奚亦平之扵是盡有奚霫之地東際海南暨白檀西踰松漠北抵潢水凡五部咸入版籍三月次灤河刻石紀功復畧地薊州夏四月壬申遣人使梁五月皇弟埓克特爾格伊徳實安圖謀反安圗妻訥黙庫知之以告得實上不忍誅乃與諸弟登山刑牲告誓天地赦其罪出埒克為徳哷勒部額爾竒木封訥黙庫為晉國夫人秋七月壬午朔錫爾丹洎諸蕃使来貢八月甲子劉守光僭號幽州稱燕冬十月戊午置鐡冶十一月壬午遣人使梁六年春正月以華格為特哩衮二月戊午親征劉守光三月至自幽州夏四月梁朱友珪弑父自立秋七月丙午親征珠巴克降之俘獲以數萬計命弟埓克分兵攻平州八月壬辰上次恩徳山皇子魯呼生冬十月戊寅埓克破平州還復與特爾格伊徳實安圗等反甲申使致祭于梁壬辰還次北阿嚕山聞諸弟以兵阻道引軍南趍十七濼是日燔柴翼日次七渡河諸弟各遣人謝罪上猶矜憐許以自新是嵗以兵討兩冶以所獲僧崇文等五十人歸西樓建天雄寺以居之以示天助雄武七年春正月甲辰朔以用兵免朝晉王李存朂拔幽州擒劉守光甲寅王師次赤水城弟埒克等乞降上素服乘赭白馬以将軍耶律魯庫實喇堅安巴為御解兵器肅侍衛以受之因加慰諭埓克等引退上復數遣使撫慰二月甲戌朔梁均王友貞討殺其兄友珪嗣立三月癸丑次蘆水弟特爾格圖為奚王與安圗擁千餘騎而至紿稱入覲上怒曰爾曺始謀逆亂朕特恕之使改過自新尚爾反覆将不利扵朕遂拘之以所部分隸諸軍埓克引其衆至伊蘇濟勒淀具天子旗鼓将自立皇太后陰遣人諭令避去會瑪古納古爾陽言車駕且至其衆驚潰掠居民北走上以兵追之埓克遣其黨伊徳實引兵徑趍行宫㷊其輜重廬帳縦兵大殺皇后急遣舒古魯救之僅得天子旗鼓而已其黨珊蘇庫復刼西樓焚明王樓上至土河秣馬休兵若不為意諸将請急追之上曰俟其逺遁人各懐土懷土既切其心必離我軍乘之破之必矣盡以所獲資畜分賜将士留伊勒希巴珠勒呼總政務夏四月戊寅北追埓克己夘次穆嚕聞諸弟靣木葉山射鬼箭厭禳乃執叛人嘉哩向彼亦以其法厭之至達掄淀選輕騎追及布扎爾河盡獲其黨輜重生口遣室韋及托歡酋長巴爾特哩衮等五人分兵伏其前路命北宰相蕭達魯為先鋒進擊之埒克率兵逆戰蕭達魯以輕兵薄之其弟阿古齊臨陣射數十人斃衆莫敢前相拒至晡衆乃潰追至柴河遂自焚其車乘廬帳而去前遇巴爾特哩衮等伏發合擊遂大敗之埓克奔潰遺其所奪神帳扵路上見而拜奠之所獲生口盡縦歸本土其黨庫果濟摩多皆靣縛請罪師次昭圗河大雨暴漲五月癸丑遣北宰相達年率驍騎先渡甲寅奏擒埓克尼嚕古阿巴扵榆河前北宰相蕭舒嚕伊德實自剄不殊遂以黑白羊祭天地壬戌埒克尼嚕古阿巴詣行在以槀索自縛牽羊望拜上還至大嶺時大軍久出輜重不相屬士卒煮馬駒採野菜以為食孶畜道斃者十七八物價十倍器服資貨委棄綽里特河狼籍數百里因更埒克名巴爾丙寅至庫哩以青牛白馬祭天地以生口六百馬二千三百分賜大小鶻軍六月辛巳至榆嶺以實喇縣人繅古非法殘民磔之甲申上登都庵山撫其先世竒善汗遺跡徘徊顧瞻而興歎焉聞獄官聶哷擅造大校人不堪其苦有至死者命誅之壬辰次狼河獲逆黨伊勒穆爾生薶之銅河南軌下放所俘還多為裕庫哷所掠上怒引輕騎馳擊復遣驍将分道追襲盡獲其衆并掠者庚子次阿敦濼以養子納喇蘇附諸弟叛以鬼箭射殺之其餘黨六千各以輕重論刑伊濟掠生口者三十餘人亦俾贖其罪放歸本部至石嶺西詔收囘軍乏食所棄兵仗召北府兵驗而還之以額爾竒木尼嚕古附諸弟叛不忍顯戮命自投崖而死秋八月己夘幸龍眉宫轘逆黨二十九人以其妻女賜有功将校所掠珍寳孳畜還主亡其本物者命責償其家不能償者賜以其部曲九月壬戌上發自西樓冬十月庚午駐赤崖戊寅和州囘鶻来貢癸未伊實府人特哩衮穆呼爾部人托里以従逆誅詔羣臣分决滯訟以韓知古録其事珠勒呼掌捕亡十一月祠木葉山還次扎固山省風俗見高年議朝政定吉凶儀十二月戊子燔柴于蓮花濼八年春正月甲辰以赫嚕為徳哷勒部額爾竒木呼哩為特哩衮裕庫哷部人塔勒滿執逆黨布呼伊拉齊等十七人獻上親鞫之辭連宗室及有脅従者乃杖殺首惡布呼餘竝原釋裕悦蘇呼之子華格屢蓄姦謀上優容之而反覆不悛召父老羣臣正其罪并其子戮之分其財以給衛士有司所鞫逆黨三百餘人獄既具上以人命至重死不復生賜宴一日隨其平生之好使為之酒酣或歌或舞或戲射角觝各極其意明日乃以輕重論刑首惡埒克其次特爾格上猶弟之不忍寘法杖而釋之以伊徳實安圖性本庸弱為埓克所使皆釋其罪前裕悦哈達拉子嘉哩埒克妻實喇勒濟實皆預逆謀乃命絞殺之伊徳實妻聶哷脅従安圗妻訥黙庫甞有忠告竝免因謂左右曰諸弟性雖敏黠而蓄姦稔惡甞自矜有出人之智安忍兇狠谿壑可塞而貪黷無厭求人之失雖小而可恕謂重如泰山身行不義雖八大惡謂輕扵鴻毛眤比羣小謀及婦人同惡相濟以危國祚雖欲不敗其可得乎北宰相舒嚕妻伊埒達衮扵國至親一旦負朕従扵叛逆未寘之法而病死此天誅也嘉哩自幼與朕甞同寝食眷遇之厚冠扵宗屬亦與其父背大恩而従不軌兹可恕乎秋七月丙申朔有司上諸帳族與謀逆者三百餘人罪状皆棄市上嘆曰致人扵死豈朕所欲若止負朕躬尚可容貸此曺恣行不道殘害忠良塗炭生民剽掠財産民間昔有萬馬今皆徒步有國以来所未甞有實不得已而誅之冬十月甲子朔建開皇殿扵眀王樓基九年春正月烏爾古部叛討平之夏六月幽州軍校齊行本舉其族及其部男女三千人請降詔授檢校尚書左僕射賜名烏雲給其廩食數日亡去幽帥周徳威納之及詔索之徳威語不遜乃議南征冬十月戊申釣魚于鴨淥江新羅遣使貢方物高麗遣使進寳劍吴越王錢鏐遣滕彦休来貢是嵗君基太一神數見詔圖其像神冊元年春二月丙戌朔上在龍化州徳哷勒部額爾竒木赫嚕等率百僚請上尊號三表乃允丙申羣臣及諸屬國築壇州東上尊號曰大聖大眀天皇帝后曰應天大眀地皇后大赦建元神冊初闕地為壇得金鈴因名其地曰金鈴岡壇側滿林曰冊聖林三月丙辰以徳哷勒部額爾竒木赫嚕為阿勒達爾裕悅百僚遷賚有差賜酺三日立子貝為皇太子夏四月乙酉朔晉幽州節度使盧國用来降以為幽州兵馬留後甲辰梁遣郎公逺来賀六月庚寅吴越王遣滕彦休来貢秋七月壬申親征突厥托歡党項小畨沙陀諸部皆平之俘其酋長及其户萬五千六百鎧甲兵仗器服九十餘萬寳貨駞馬牛羊不可勝算八月㧞朔州擒節度使李嗣本勒石紀功扵竒塜南冬十月癸未朔乘勝而東十一月攻蔚新武媯儒五州斬首萬四千七百餘級自代北至河曲踰陰山盡有其地遂改武州為歸化州媯州為汗州因置西南靣招討司選有功者領之其圍蔚州敵樓無故自壞衆軍大譟乘之不踰時而破時梁及吴越二使皆在焉詔引環城觀之因賜滕彦休名曰舒嚕十二月收山北八軍二年春二月晉新州禆将盧文進殺節度使李存矩来降進攻其城刺史安金全遁以文進部将劉殷為刺史三月辛亥攻幽州節度使周徳威以幽并鎮定魏五州兵拒于居庸闗之西合戰扵新州東大破之斬首三萬餘級殺李嗣本之子武入以后弟阿古齊為統軍舒嚕為先鋒東出關畧燕趙不遇敵而還己未裕庫哷叛命舒嚕以兵討之夏四月壬午圍幽州不克六月乙巳望城中有氣如烟火状上曰未可攻也以暑潦班師留赫嚕盧國用守之埓克與其子賽音伯哩叛入幽州秋八月李存朂遣李嗣源等救幽州赫嚕等以兵少而還三年春正月丙申以皇弟安圗為大内特哩衮命攻雲州及西南諸部二月達旦来聘癸亥城皇都以禮部尚書康黙記充版築使梁遣使来聘晉吴越渤海高麗回鶻準布党項及幽鎭定魏潞等州各遣使来貢夏四月乙巳皇弟特爾格謀叛事覺知有罪當誅預為營壙而諸戚請免上素惡其弟伊徳實妻尼嚕古曰尼嚕古能代其死則従尼嚕古自縊壙中并以奴農古叛人額爾古濟生瘞其中遂赦特爾格五月乙亥詔建孔子廟佛寺道觀秋七月乙酉裕悦赫嚕薨上震悼久之輟朝三日贈賻有加冬十二月庚子朔幸遼陽故城辛丑北府宰相蕭達魯薨戊午以裕悦赫嚕弟裕勒沁為徳哷勒部額爾竒木蕭阿古齊為北府宰相甲子皇孫鄂約生遼史巻一遼史巻一考證太祖字安巴堅徳祖皇帝長子按北庭雜紀太祖父諱斡里遼史不載明年秋七月以兵四十萬伐河東代北原文作河北永樂大典作代北考兵衛志太祖授徳哷勒部額爾竒木明年總兵四十萬伐代北克郡縣九俘九萬五千口與大典符今據改二年河東李克用卒子存朂襲遣使弔慰原本克用下脱卒字今據通鑑増三年二月丁酉朔梁遣郎公逺来聘按資治通鑑梁開平元年五月契丹遣其臣袍笏美稜来通好帝遣太府少卿高頎報之二年五月契丹遣使隨高頎入貢且求冊命帝復遣司農卿渾特賜以手書是契丹聘梁二年中連有二使遼史不書此特書梁遣郎公逺来聘是梁之專使非報使也修史者各自尊其本國故凡書聘之例如此五年夏五月皇弟埓克特爾格伊徳實安圗謀反按特爾格原文作迭剌考皇子表係徳祖第三子本卷後又作迭剌哥或作迭烈哥即一人也今畫一譯改七年夏四月命北宰相蕭達魯為先鋒按達魯原文作迪里古考本卷四年以蕭達魯為北府宰相本傳云達魯字達年拜北府宰相埓克作亂達魯率輕騎追之至榆河獲埓克以獻據此則此迪里古與下文迪里古以輕兵薄之及遣北宰相達年率驍騎先渡名字互見皆達魯也今俱従敵魯譯改達魯蕭達魯以輕兵薄之其弟阿古齊臨陣射數十人斃按阿古齊原文作遏古只互考本傳及蕭達魯傳云阿古齊與達魯總腹心部埓克北走與達魯追擒扵榆河神冊初敗周徳威軍三年以功拜北府宰相據此則此遏古只與本卷後之阿骨只皆係一人今俱改為阿古齊神冊元年春二月丙戌朔耶律嚇嚕等率百僚請上尊號按嚇嚕原文作葛魯南監本作曷魯考嚇嚕本傳請建元率百官上尊號正與此合今俱従曷魯譯改赫嚕百僚請上尊號三表乃允按綱目契丹稱帝改元在梁主瑱貞眀二年十二月即神冊元年十二月也此作二月與綱目互異大赦建元神冊按薛居正五代史不記安巴堅建元事自耶律德光方記天顯之名疑當時未得其傳故也八月拔朔州擒節度使李嗣本按資治通鑑契丹主安巴堅自麟勝攻晉蔚州破之虜振武節度使李嗣本注麟勝至蔚州中間懸隔雲朔蔚州恐當作朔州據此則遼史書朔州可正通鑑之誤三年冬十二月戊午以裕悦赫嚕弟裕勒沁為徳哷勒部額爾竒木按裕勒沁原文作汗里軫考耶律迪里傳迪里字裕勒沁原文作兀里軫神冊三年命為徳哷勒部額爾竒木又本紀天賛二年徳哷勒部額爾竒木迪里徇山西地本傳亦載其事據此則汗字汙字之訛汙兀音近今従兀里軫譯改裕勒沁遼史巻一考證
