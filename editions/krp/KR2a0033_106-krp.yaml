body:
  text: 遼史卷一百六元中書右丞相總裁托克托等修列傳第三十六卓行遼之共國任事耶律蕭二族而已二族之中有退然自足不淫於富貴不詘於聲利可以振頺風激薄俗亦足嘉尚者得三人焉作卓行傳蕭扎拉字實訥北府宰相巴雅爾之弟性介特不亊生業保寧間以戚屬進至寧逺軍節度使秩滿里居淡泊自適統和末召為南京馬歩軍都指揮使以疾求退不聴遷伊勒希巴又辭疾許之遂入頡山杜門不出上嘉其志不復徵扎拉自是家於頡山親友或過之終日言不及世務凡宴游相邀亦不拒一歳山居過半與世俗不偶耶律資忠重之目曰頡山老人卒耶律官努字奚隠林牙斡魯之孫沉厚多學詳於本朝世系嗜酒好佚初徵為宿直將軍重熙九年以疾去官上以官努屬尊欲成其志乃許自擇一路節度使官努辭曰臣愚鈍不任官使加歸義軍節度使輙請致政官努與烏哩特人蕭斡友善斡謂官努曰仕不能致主澤民成大功烈何屑屑為也吾與若居林下以枕簟自随觴詠自樂雖不官無慊焉官努然之時稱二逸乾統間卒蕭普爾布字綏蘭魏國王惠之四世孫父母蚤喪鞠于祖烏爾古納性孝悌年十三烏爾古納卒以早失怙恃復遭祖喪哀毁踰禮族里嘉歎甞謂人言我于親不得終養令誰為訓者苟不自勉何以報鞠育恩自是力學於文藝無不精乾統間以烏爾古納之故召之不應與親識游獵山水奉養無長物僕𨽻欣欣如也或曰公胡不念以嗣先世功名答曰自度不足以繼先業年踰强仕安能益主庇民累徵皆以疾辭晩年謝絶人事卜居瑪古山屛逺葷茹潛心佛書延有道者談論彌日人問所得何如但曰有深樂惟覺六鑿不相攘餘無知者一日易服無疾而逝論曰隠固未易為也而亦未可輕以與人若扎拉謝職不談時務官努兩辭節鎮普爾布召而不赴雖未足謂之隠然在當時能知内外之分甘於肥遯不猶愈於求富貴利達而為妻妾羞者哉故稱卓行可也遼史卷一百六遼史卷一百六考證耶律官努傳乾統間卒按原本書官努卒官努二字係衍今據列傳體例刪遼史卷一百六考證
