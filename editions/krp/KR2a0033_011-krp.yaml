body:
  text: 遼史巻十一元中書右丞相總裁托克托等修本紀第十一聖宗二四年春正月甲戌觀漁土河林牙耶律穆爾古彰徳軍節度使蕭達林上東征俘獲賜詔奬諭丙子樞密使耶律色珍林牙勤徳等上討女直所獲生口十餘萬馬二十餘萬及諸物己夘朝皇太后決滯訟壬午樞密使色珍林牙勤徳穆爾古節度使達林統軍使碩羅侍中穆濟奚王府監軍迪里與安吉等克女直還軍遣近侍尼勒堅詔旌其功仍執手撫諭賜酒果勞之甲午幸長濼二月壬寅以四番都統軍李繼忠為檢校司徒上柱國癸夘西夏李繼遷叛宋來降以為定難軍節度使銀夏綏宥等州觀察處置等使特進檢校太師都督夏州諸軍事西番酋帥斡尼竒伊為保大軍節度使鄜坊等州觀察處置等使甲寅耶律色珍蕭達林穆爾古等族帥來朝行飲至禮賞有差丙寅行次組斡哩井三月甲戌裕悦休格奏宋遣曹彬崔彦進米信由雄州道田重進飛狐道潘美楊繼業鴈門道來侵岐溝涿州固安新城皆䧟詔宣徽使布琳馳赴燕南與休格議軍事分遣使者徴諸部兵益休格以擊之復遣東京留守耶律穆濟以大軍繼進賜劒專殺乙亥以親征告陵廟山川丙子統軍使耶律佛徳敗宋軍于固安休格絶其糧餉擒將吏獲馬牛器仗甚衆庚辰寰州刺史趙彦章以城叛附于宋辛巳宋兵入涿州義順軍節度副使趙希贊以朔州叛附于宋時上與皇太后駐兵駞羅口詔趣東征兵馬以為應援壬午詔林牙勤徳以兵守平州之海㟁以備宋仍報平州節度使特哩衮若勤徳未至遣人趣行馬乏則括民馬鎧甲闕則取於顯州之甲坊癸未遼軍與宋田重進戰于飛狐不利冀州防禦使大鵬翼康州刺史馬贇馬軍指揮使何萬通陷焉丁亥以北院樞宻使耶律色珍為山西兵馬都統以北院宣徽使布琳為南征都統以副裕悦休格彰國軍節度使艾正觀察判官宋雄以應州叛附于宋庚寅遣飛龍使雅嚕文班吏雅圖噶閲馬以給先發諸軍詔駙馬都尉蕭繼逺領之辛夘武定軍馬步軍都指揮使郢州防禦使吕行徳副都指揮使張繼從馬軍都指揮使劉知進等以飛狐叛附于宋癸巳賜林牙穆爾古旗鼓四劔一率禁軍之驍鋭者南助休格丙申步軍都指揮使穆超以靈丘叛附于宋詔遣使賜樞宻使色珍宻㫖及彰國軍節度使雙寛印趣征討夏四月己亥朔次南京北郊庚子特哩衮瑤昇西南面招討使韓徳威以捷報辛丑宋潘美陷雲州壬寅遣穆濟穆爾古勤徳等領偏師以助休格仍賜旗鼔雙寛印撫諭將校癸夘休格復以捷報上以酒脯祭天地率羣臣賀于皇太后詔勤徳還軍丙午佛徳上所獲鎧仗數戊申監軍宣徽使布琳奏敵軍引退而奚王籌寧北大王普努寧統軍使佛徳等以兵追躡皆勝之遣敞史勤徳持詔褒美及詔侍中穆濟統諸軍赴行在所本布部節度使和勒敦黄皮室詳衮嘉哩等各上所獲兵甲又詔兩部突騎赴蔚州以助達林横帳郎君老君努率諸郎君巡徼居庸之北將軍華格統平州兵馬横帳郎君努克為黄皮室都監郎君伊里為北府都監各以步兵赴蔚州以助色珍庚戌以色珍為諸路兵馬都統達林兵馬副部署托色都監以代善補韓徳威癸丑以艾正趙希贊及應州朔州節度副使奚軍小校阿爾嘉渤海小校果哈等叛入于宋籍其家屬分賜有功將校宋將曹彬米信北渡拒馬河與裕悦休格對壘挑戰南北列營長六七里時上次涿州東五十里甲寅詔裕悦休格奚王籌寧宣徽使布琳南北二王等嚴備水道無使敵兵得潛至涿州乙夘休格等敗宋軍獻所獲器甲貨財賜詔褒美蔚州左右都押衙李存璋許彦欽等殺節度使蕭卓琳執監城使銅州節度使耿紹忠以城叛附于宋丙辰復涿州告天地戊午上次沙沽河之北淀召林牙勤徳議軍事諸將校各以所俘獲來上奚王籌寧南北二王率所部將校來朝以近侍納穆爾所進自落鴇祭天地己未休格布琳來朝詔三司給軍前夏衣布庚申上朝皇太后辛酉大軍次固安壬戌圍固安城統軍使佛徳先登城遂破大縱俘獲居民先被俘者命以官物贖之甲子賞攻城將士有差五月庚午遼師與曹彬米信戰于岐溝關大敗之追至拒馬河溺死者不可勝紀餘衆奔髙陽又為遼師衝擊死者數萬棄戈甲若丘陵輓漕數萬人匿岐溝空城中圍之壬申以皇太后生辰縱還癸酉班師還次新城休格布琳奏宋兵奔逃者皆殺之甲戌以軍捷遣使分諭諸路京鎮丁丑詔諸將校論功行賞無有不實己夘次固安南以青牛白馬祭天地庚申以所俘宋人射鬼箭詔遣詳衮巴雅爾率𢎞義官兵南北皮室郎君伊喇四軍赴應朔二州界與特哩衮瑤昇招討韓徳威同禦宋兵在山西之未退者辛巳以瑤昇軍赴山西壬午還次南京癸未休格籌寧普努寧進俘獲色珍遣判官博諾奏復蔚州斬首二萬餘級乘勝攻下靈丘飛狐賜博諾酒及銀器丙戌御元和殿大宴從軍將校封休格為宋國王加布琳籌寧普努寧及諸有功將校爵賞有差丁亥發南京詔休格備器甲儲粟待秋大舉南征戊子色珍奏宋軍復圍蔚州擊破之詔以兵授瑤昇韓徳威等壬辰以宋兵至平州瑤昇韓徳威不盡追殺降詔詰責仍諭據城未降者必盡掩殺無使遁逃癸巳以軍前降卒分賜扈從乙未賞佛徳諸將校士卒六月戊戌朔詔韓徳威赴闕加統軍使佛徳檢校太師甲辰詔南京留守休格遣礮手西助色珍乙巳伊勒希巴珠勒呼部送輜重行宫暑行日五十里人馬疲乏遣使譲之丁未度居庸闗壬子南京留守奏百姓嵗輸三司鹽鐵錢折絹不如直詔增之甲寅色珍奏復寰州乙夘皇太妃諸王公主迎上嶺表設御幄道傍置景宗御容率從臣進酒陳俘獲于前遂大宴戊午幸涼陘以所俘分賜皇族及乳母已未聞所遣宣諭回鶻克哷克國都掄雅里等為珠巴克邀留詔蘇色賜珠巴克貨幣諭以朝廷來逺之意使者由是乃得行癸亥以節度使韓布格翰林學士邢抱扑等充雲州宣諭招撫使丙寅以太尉旺布所俘生口分賜趙妃及裕悦約尼伊囉斡秋七月丙子樞宻使色珍遣侍御訥哷岱噶楚噶奏復朔州擒宋將楊繼業及上所獲將校印綬誥勅賜訥哷岱等酒器銀器辛巳以捷告天地以宋歸命者二百四十人分賜從臣又以殺敵多詔上京開龍寺建佛事一月飯僧萬人辛夘色珍奏大軍至蔚州營于州左得諜報敵兵且至乃設伏以待敵至縱兵逆擊追奔逐北至飛狐口遂乘勝鼓行而西入寰州殺守城吏卒千餘人宋將楊繼業初以驍勇自負號楊無敵北據雲朔數州至是引兵南出朔州三十里至狼牙村惡其名不進左右固請乃行遇色珍伏四起中流矢墮馬被擒瘡發不食三日死遂函其首以獻詔詳衮薩木實傳其首裕悦休格以示諸軍仍以朔州之捷宣諭南京平州將吏自是宋守雲應諸州者聞繼業死皆棄城遁八月丁酉置錫林塔拉官六員領裕庫哷女直徳里元等諸部人之隸宫籍者以北大王普努寧為山後五州都管乙巳韓徳譲奏宋兵所掠州郡其逃民禾稼宜募人收穫以其半給收者從之乙夘色珍還自軍獻俘己未用室昉韓徳譲言復山西今年租賦詔第山西諸將校功過而賞罸之伊實帳宰相安寧功過相當追告身一通迪錦部節度使佛努笞五十特哩衮瑤昇伊喇呼哩朔州節度使慎思應州節度使庫濟雲州節度使華格軍校李元迪蔚州節度使佛哩都監崔其劉繼琛皆以聞敵逃遁奪官伯埒仍配隸本貫領國舅軍旺禄笞五十壬戌以色珍所部將校前破女直後有宋捷第功加賞癸亥加色珍守太保九月丙寅朔皇太妃以上納后進衣物駞馬以助㑹親頒賜甲戌次黑河以重九登髙于髙水南阜祭天賜從臣命婦菊花酒丁丑次河陽北戊寅内外命婦進㑹親禮物辛巳納皇后蕭氏丙戌次儒州以大軍將南征詔遣皮室詳衮持迪郎君伊喇先赴本軍繕甲兵己丑召北大王普努寧赴行在所甲午皇太后行再生禮冬十月丙申朔党項準布遣使來貴丁酉皇太后復行再生禮為帝祭神祈福己亥以伊實王帳郎君烏里為御史大夫政事令室昉奏山西四川自宋兵後人民轉徙盜賊充斥乞有司禁止命新州節度使布克達哩選人分道巡檢北大王帳郎君哈喇噶扎爾言本府王普努寧十七罪詔横帳太保和克台鞫之普努寧伏罪十一笞二十釋之哈喇噶扎爾伏誣告六事命詳酌罪之知事勤徳連坐杖一百免官甲辰出居庸闗乙巳詔諸京鎮相次軍行諸細務權停理問庚戌分遣伊喇沿邊偵候辛亥命皇族廬帳駐東京延芳淀壬子詔以勅牓付裕悦休格以南征諭拒馬河南六州乙夘幸南京戊午以南院大王留寧言復南院部民今年租賦壬戌以銀鼠青鼠及諸物賜京官僧道耆老甲子上與大臣分朋擊鞠十二月丙寅朔党項來貢庚午以政事令韓徳譲守司徒壬申以古北松亭榆闗征税不法致阻商旅遣使鞫之女直請以兵從征許之癸酉御正殿大勞南征將校丙子南伐次狹底堝皇太后親閲輜重兵甲丁丑以休格為先鋒都統戊寅日南至上率從臣祭酒景宗御容辛巳詔以北大王普努寧居奉聖州山西五州公事竝聽與節度使布克達哩共決之癸未祭日月為駙馬都尉勤徳祈福乙酉置諸部監勒所部各守營伍毋相錯雜丙戌遣穆爾古蕭繼逺沿邉巡徼以所獲宋卒射鬼箭丁亥以青牛白馬祭天地辛夘次白佛塔川獲自落馴狐以為吉徴祭天地詔駙馬都尉蕭繼逺林牙穆爾古太尉琳巴等固守封疆毋漏間諜軍中無故不得馳馬及縱諸軍殘南境桑果壬辰至唐興縣時宋軍屯滹沱橋北選將亂射之橋不能守進焚其橋癸巳涉沙河休格來議事北皮室詳衮巴雅爾獻獲宋諜二人上賜衣物令還招諭泰州卓特部節度使羅卜科都監律盻與宋戰于泰州不利甲午祭麃鹿神以羅卜科臨陣遁逃奪告身一通其判官都監各杖之郎君伊喇僧庫埒遇宋先鋒於望都擒其士卒九人獲甲馬十一賜酒及銀器乙未以羅卜科等罪詔諭諸軍以御盞郎君華格權卓特部節度使横帳郎君佛哩為都監代羅卜科權領國舅軍托卜威請置二校領散卒詔以郎君舍音佛徳充命彰徳軍節度使蕭達林將軍托色畧地東路詔休格巴雅爾議軍事十二月己亥休格敗宋軍於望都遣人獻俘壬寅營于滹沱北詔休格以騎兵絶宋兵毋令入邢州命太師旺禄謹偵候癸夘小校克酬遇宋輜重引兵殺獲甚衆并焚其芻粟甲辰詔南大王與休格合勢進討宰相安寧領迪里部及三剋軍殿上率大軍與宋將劉廷讓李敬源戰于莫州敗之乙巳擒宋將賀令圖楊重進等國舅詳衮塔喇噶宫使蕭達哩死之丙午詔休格以下入内殿賜酒勞之丁未築京觀復以南京禁軍擊楊團城守將以城降詔禁侵掠己酉營神榆村詔上楊團城粟麥兵甲之數辛亥以黑白二牲祭天地癸丑抜馮母鎮大縱俘掠丙辰邢州降丁巳抜深州以不即降誅守將以下縱兵大掠李繼遷引五百騎欵塞願㛰大國永作藩輔詔以王子帳節度使耶律襄之女題本封義成公主下嫁賜馬三千匹遼史巻十一遼史巻十一考證聖宗紀二統和四年四月遣敞史勤徳持詔褒美按敞史刻本舊作敞吏今據永樂大典本改正十二月乙巳擒宋將賀令圖楊重進等國舅詳衮特爾格宫使蕭達哩死之按特爾格蕭達哩之死宋通鑑作壬子日事與此異遼史巻十一考證
