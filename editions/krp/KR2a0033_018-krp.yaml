body:
  text: 遼史卷十八元中書右丞相總裁托克托等修本紀第十八興宗一興宗神聖孝章皇帝諱宗真字雅布濟小字濟古爾聖宗長子母曰欽哀皇后蕭氏上始生齊天皇后養之㓜而聰明長而魁偉龍顔日角豁逹大度善騎射好儒術通音律三嵗封梁王太平元年冊為皇太子十年六月判北南院樞密使事十一年六月己卯聖宗崩即皇帝位於柩前壬午尊母元妃蕭氏為皇太后甲申遣使告哀于宋及夏高麗是年御宣政殿放進士劉貞等五十七人辛卯大赦改元景福乙未奉大行皇帝梓宫殯于永安山太平殿辛丑皇太后賜駙馬蕭哲伯埒蕭必塔死圍場都太師女直珠格爾右祗候郎君詳衮蕭雅嚕等七人棄市籍其家遷齊天皇后于上京秋七月丙午朔皇太后率皇族大臨于太平殿高麗遣使弔慰上召晉王蕭布庫等飲博夜分乃罷丁未擊鞠戊申以耶律罕巴為左伊勒希巴特穆爾為左祗候郎君詳衮横帳郎君樂古權右祗候郎君詳衮己酉以耶律哲魯為伊濟徳哷勒都詳衮果巴為右皮室詳衮庚戌賑薊州饑癸丑詔寫大行皇帝御容甲寅録囚以觀察姚居信為上將軍建慶州于慶陵之南徙民實之充奉陵邑乙卯以比嵗豐稔罷給東京綂軍司糧丁巳上謁大行皇帝御容哀慟久之因詔寫北府宰相蕭孝先南府宰相蕭孝穆象于御容殿以蕭阿克展為東京留守丁卯謁太平殿焚先帝所御弓矢幸晉王蕭布庫第視疾辛未録囚壬申上謁神主帳時威蕭氏始入宫亦命拜之八月壬午遷大行皇帝梓宫於菆塗殿九月戊申躬視慶陵庚戌問安于皇太后辛亥宋遣王隨曹儀致祭王􅎦許懐信梅詢張綸來慰兩宫范諷孫繼業賀即位孔道輔魏昭文賀皇太后冊禮戊午焚弧矢鞍勒于菆塗殿庚申夏國遣使來慰庚午以宋使弔祭喪服臨菆塗殿甲戌遣御史中丞耶律翥司農卿張確詳衮耶律勵四方館使高維翰謝宋弔慰冬十月戊寅宰臣吕徳懋薨癸未殺哲伯埓黨彌勒努觀音努等丙戌遣工部尚書高徳順崇禄卿李可封致先帝遺物于宋以右領軍衛上將軍耶律遜少府監馬憚充皇太后謝宋使右監門衛上將軍耶律元載引進使魏永充皇帝謝宋使丁酉夏國遣使來賻戊戌以蕭革趙為果耶律郁馬保業充來嵗賀宋正旦使閏月辛亥謁菆塗殿閲𤣥宫閟器有司請以生辰為永壽節皇太后生辰為應聖節從之辛酉閲新造鎧甲丁卯賑黄龍府饑民十一月壬辰上率百僚奠于菆塗殿出大行皇帝服御玩好焚之縱五坊鷹鶻甲午葬文武大孝宣皇帝于慶陵乙未祭天地問安皇太后丙申謁慶陵以遺物賜羣臣名其山曰慶雲殿曰望仙十二月癸丑至自慶陵皇太后聽政帝不親庶務羣臣表請不從是嵗以興平公主下嫁夏國王李徳昭子元昊以元昊為夏國公駙馬都尉重熙元年春正月壬申朔皇太后御正殿受帝與羣臣朝宋遣任布王遵範陳琰王克善來賀乙亥宋遣鄭向郭遵範來賀永壽節丁丑如雪林二月大蒐三月壬申朔尚父漆水郡王迪里復為特哩衮是春皇太后誣齊天皇后以罪遣人即上京行弑后請具浴就死許之有頃后崩夏四月乙巳清暑巴納登秋七月獵平地松林以蕭逹溥王英秀蕭麓張素羽充來嵗賀宋正旦生辰使八月丙午駐蹕喇河源皇子洪基生冬十月己酉幸中京十一月己卯帝率羣臣上皇太后尊號曰法天應運仁徳章聖皇太后羣臣上皇帝尊號曰文武仁聖昭孝皇帝大赦改元重熙癸未宋遣劉隨王徳本來賀應聖節以楊佶為翰林承㫖丙戌夏國遣使來賀辛卯五國酋長來貢夏國王李徳昭薨冊其子夏國公元昊為夏國王十二月庚戌宋遣胥偃王從益崔暨張懐志來賀來嵗正旦又遣楊日嚴王克纂來賀永壽節以北大王耶律求翰同平章事是年放進士劉師貞等五十七人二年春正月庚辰東幸乙酉夏遣使來貢壬辰女直詳衮塔雅克率所部來貢宋遣曹琮來告母后劉氏哀章得象安繼昌來饋母后遺物即遣延昌宫使耶律壽寧給事中知制誥李奎充祭奠使天徳軍節度使耶律卿寧大理卿和道亨河西軍節度使耶律嵩引進使馬世卿充兩宫弔慰使秋七月甲子朔以耶律楚高升耶律迪王惟允充兩宫賀宋生辰使副以耶律師古劉五常充賀宋來嵗正旦使副八月丁酉幸温泉宫乙卯遣使閲諸路禾稼冬十一月甲申宋遣劉寳符忠李昭述張茂實等來謝慰奠十二月乙未宋遣丁度王繼凝來賀應聖節己酉禁夏國使沿路私市金鐵甲寅宋遣章頻李懿王冲睦張緯李絃李繼一來賀永壽節及來嵗正旦庚申以北府宰相蕭孝先為樞密使三年春正月丁卯宋使章頻卒詔有司賻贈命近侍護喪以歸辛卯如春水二月壬辰以北院樞密使蕭布庫為東京留守戊申耶律大師努有侍襁褓恩詔入屬籍夏四月甲寅振尼瑪齊部五月庚申朔清暑沿栁湖是月皇太后還政于上躬守慶陵六月己亥以蕭布庫為南院樞密使秋七月戊子朔上始親政以耶律庶徴劉六符耶律睦薄可久充賀宋來嵗正旦使副壬辰如秋山冬十月己未駐蹕中㑹川十二月宋遣叚少連杜仁贊來賀來嵗正旦楊偕李守忠來賀永夀節四年春正月庚寅如尼瑪齊里三月乙酉朔立皇后蕭氏夏四月甲寅朔如凉陘五月庚子清暑散水源六月癸丑朔皇子寳信努生以耶律信吕士宗蕭衮郭揆充賀宋生辰及來嵗正旦使副秋七月壬午朔獵于黒嶺九月己酉駐蹕長寧淀冬十月如王子城十一月壬午改南京總管府為元帥府乙酉行柴冊禮于白嶺大赦加尚父耶律信寧政事令耶律求翰耆宿贊翊功臣十二月癸丑詔諸軍砲弩弓劔手以時閲習庚申宋遣鄭戩柴貽範楊日華張士禹來賀永壽節及正旦五年春正月甲申如魚兒濼樞密使蕭延寧請改國舅伊實小功帳敞史為將軍從之四月庚申以潞王察克為南府宰相崇徳宫使耶律瑪魯為特哩衮甲子幸后弟蕭無曲第曲水泛觴賦詩丁卯頒新定條制己巳上與大臣擊鞠五月甲午南幸丁未如呼圖哩巴山清暑庚申幸北院大王高十行帳拜奥賜銀絹壬戌詔修南京宫闕府署秋七月辛丑録囚耶律巴拜誣其弟韓格謀殺已有司奏當反坐臨刑其弟泣訴臣惟一兄乞貸其死上憫而從之九月癸巳獵黄花山獲熊三十六賞獵人有差冬十月丁未幸南京辛亥曲赦析津府境内囚壬子御元和殿以日射三十六熊賦幸燕詩試進士于廷賜馮立趙徽四十九人進士第以馮立為右補闕趙徽以下皆為太子中舎賜緋衣銀魚遂大宴御試進士自此始宋遣宋郊王世文來賀永壽節甲子宰臣張儉等請幸禮部貢院歡飲至暮而罷賜物有差以耶律祥張素民耶律甫王澤充賀宋生辰正旦使副六年春正月丁丑西幸三月戊寅以秦王蕭孝穆為北院樞密使徙封呉王晉王蕭孝先為南京留守夏四月獵野狐嶺閏月獵龍門縣西山五月己酉清暑炭山以耶律罕巴為北院大王蕭巴噶左伊勒希巴王子郎君詳衮布古徳林牙簽北靣事耶律尼格同簽㸃檢司甲寅録囚以南大王耶律信寧故匿重囚及侍婢贓汚命撻以劍脊奪其官都監坐阿附及侍婢罪皆論死詔貸之丙辰以耶律信寧為西南路招討使庚申出飛龍廐馬賜皇太弟重元及北南靣侍臣癸亥以上京留守耶律呼圖克琨為南大王平章事蕭扎拉納上京留守侍中管寧行宫都部署耶律普努寧烏爾古達魯特都詳衮甲子以上京留守耶律鴻觀為北院大王六月壬申朔以善寧為殿前都㸃檢護衛太保耶律和卓兼長寧宫使蕭額魯哩耶律烏拉噶耶律和尚蕭罕嘉努蕭托里蕭求翰為各宫都部署上酒酣賦詩呉國王蕭孝穆北宰相蕭巴薩等皆屬和夜中乃罷己卯祀天地癸未賜南院大王耶律呼圖克琨命上親製誥詞並賜詩以寵之丙申以北院大王浩善為南京綂軍使秋七月辛丑朔以北南樞密院獄空賞賚有差壬寅以皇太弟重元生子賜詩及寶玩器物曲赦死罪以下癸卯如秋山八月己卯北樞密院言伊濟部民苦其酋帥庫春不法多流亡詔罷伊濟等五國酋帥以契丹節度使一員領之冬十月癸酉駐蹕石寶岡十一月己亥朔準布酋長來貢辛亥以契丹行宫都部署蕭惠為南院樞密使壬子以管寧為南院樞密使蕭繅古諸行宫都部署耶律紐斡哩知南靣行宫副部署蕭額魯哩左祗候郎君詳衮耶律和卓右祗候郎君詳衮庚申幸晉國公主行帳視疾封皇子洪基為梁王十二月以楊佶為忠順軍節度使遣耶律斡秦鑑耶律徳崔繼芳賀宋生辰及正旦七年春正月戊戌朔宋遣高若訥夏元正謝絳張茂實來賀正旦及永夀節辛丑如混同江二月庚午如春州乙亥駐蹕東川丁丑高麗遣使來貢壬午幸五坊閲鷹鶻乙酉遣使慶州問安皇太后三月戊戌朔幸皇太弟重元行帳壬寅如蒲河淀辛亥夏國遣使來貢甲寅録囚夏四月己巳以興平公主薨遣北院承㫖耶律庶成持詔問夏國王李元昊公主生與元昊不睦没詰其故己卯獵白馬堝甲申射兎新淀井乙未獵金山遣楊家進鹿尾茸于大安宫六月乙亥御清凉殿試進士賜邢彭年以下五十五人第秋七月甲辰録囚乙巳準布酋長通特古斯來朝戊申如黑嶺九月丁未駐蹕平淀冬十月甲子朔渡遼河丙寅駐蹕白馬淀壬申録囚十一月癸巳朔以耶律元方張泥韓至徳蕭傅充賀宋生辰正旦使副辛丑問安皇太后進珍玩庚申録囚十二月召善擊鞠者數十人于東京令與近臣角勝上觀之己巳以皇太弟重元判北南院樞密使事北府宰相賽音巴寧再任兼知東京留守事耶律詳衮南府宰相察噶扎大内特哩衮伊實已帳蕭翰乾州節度使劉六符參知政事王子帳冠格王子郎君詳衮吹絅大王平州節度使宰臣張克㳟守司空宰臣韓紹芳加侍中特哩衮耶律瑪魯北院宣徽使傅父耶律喜孫南府宰相癸未宋遣王舉正張士禹賀永壽節甲申命日進酒于大安宫致薦慶陵丁亥録囚非故殺者減科南靣侍御準格爾詐取女直貢物罪死上以有吏能黥而流之八年春正月壬辰朔宋遣韓琦王從益來賀丙申如混同江觀魚戊戌振丕勒部庚戌义魚實黙里河丁巳禁朔州鬻羊于宋二月丙子駐蹕長春河夏六月乙丑詔括户口秋七月丁巳謁慶陵致奠于望仙殿迎皇太后至顯州謁園陵還京冬十月駐蹕東京十一月甲午詔有言北院處事失平擊鍾及邀駕告者悉以奏聞戊戌朝皇太后召僧論佛法戊申皇太后行再生禮大赦己酉城長春閏十二月壬辰視呉國王蕭孝穆疾宋遣龎籍杜贊來賀永壽節九年春正月丙辰朔上進酒于皇太后宫御正殿宋遣王拱辰彭再思來賀庚申如鴨子河二月駐蹕魚兒濼三月辛未以應聖節大赦五月乙卯朔清暑永安山六月射栁祈雨秋七月癸酉宋遣郭禎以伐夏來報遣樞密使杜防報聘丁丑如秋山冬十月癸未朔駐蹕中㑹川十一月甲子女直侵邊發黄龍府鐵驪軍拒之宋遣蘇伸向傳範賀應聖節十二月庚寅以北大王府布魁帳郎君自言先世與國聯姻許置敞史命本帳蕭呼圖克為之辛卯以所得女直户置肅州以蕭迪劉三嘏耶律元方王惟吉耶律庶忠孫文昭蕭紹筠秦徳昌充賀宋生辰及來嵗正旦使副詔諸犯法者不得為官吏諸職官非婚祭不得沉酗廢事有治民安邊之略者悉具以聞遼史卷十八
