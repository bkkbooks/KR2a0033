按耶律都勒斡興宗本紀作耶律鐸魯斡此處原本作鐸斡無魯字係脫文今畫一改開泰六年見禮部員外郎王景運按六年原本作五年考聖宗本紀五年不見王景運名係六年事今據改天祚保大二年見提舉翰林醫官李爽按李爽原本作李奭考天祚本紀保大二年見翰林醫官李爽别有李奭官少府少監非一人原本殊誤今據改穆宗應厯二年見宣政殿學士李澣按二年原本作元年考穆宗本紀元年不見李澣官宣政殿學士事二年始見今據改道宗清寜九年見内藏庫提㸃耶律烏爾古按九年原本作元年考道宗本紀元年不見内藏庫提㸃官至九年始見今改都部署判官耶律儼咸雍中為都部署判官按耶律儼傳為都部署判官實在太康初年非咸雍中也咸雍中儼甫登進士第耳志當有誤遼史卷四十七考證
