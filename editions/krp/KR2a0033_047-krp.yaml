body:
  text: 遼史卷四十七元中書右丞相總裁托克托等修志第十七上百官志三南面契丹國自唐太宗置都督刺史武后加以王封𤣥宗置經畧使始有唐官爵矣其後習聞河北藩鎮受唐官名於是太師太保司徒司空施于部族太祖因之大同元年世宗始置北院樞宻使明年世宗以髙勲為南院樞密則樞密之設蓋自太宗入汴始矣天禄四年建政事省於是南面官僚可得而書其始漢人樞密院兼尚書省吏兵刑有承㫖户工有主事中書省兼禮部别有户部使司以營州之地加幽冀之半適足矣中葉彌文耶律楊魯為太傅知有三師矣和爾郭勒濟為太尉知有三公矣於韓庫徳為常侍劉涇為禮部尚書知有門下尚書省矣庫部虞部倉部員外出使則知備郎官列宿之員室昉監修則知國史有院程翥舍人則知起居有注邢枹朴承㫖王言敷學士則知有翰林内制張幹政事舍人則知有中書外制大理司農有卿國子少府有監九卿列監見矣金吾千牛有大將十六列衞見矣太子上有師保下有府率東宫備官也節度觀察防禦團練刺史咸在方州如唐制也凡唐官可考見者列具于篇無徵者不書南面朝官遼有北面朝官矣既得燕代十有六州乃用唐制復設南面三省六部臺院寺監諸衞東宫之官誠有志帝王之盛制亦以招徠中國之人也三師府本名三公漢以丞相太尉御史大夫為三公故稱三師太師穆宗應厯三年見太師唐古特太傅太宗㑹同元年命馮道守太傅太保㑹同元年劉昫守太保少師耶律資忠傳見少師蕭巴格少傅少保掌印耶律伊遜重熙中掌太保印三公府先漢丞相太尉御史大夫後漢更名大司徒大司馬大司空唐太尉司徒司空又名三司太尉太宗天顯十一年見太尉趙思温司徒世宗天禄元年見司徒華沙司空聖宗統和三十年見司空邢抱質漢人樞密院本兵部之職在周為大司馬漢為太尉唐季宦官用事内置樞密院後改用士人晉天福中廢開運元年復置太祖初有漢兒司韓知古總知漢兒司事太宗入汴因晉置樞密院掌漢人兵馬之政初兼尚書省樞密使太宗大同元年見樞密使李崧知樞密使事知樞密院事樞密副使楊遵勗咸雍中為樞密同知樞密院事聖宗太平六年見同知樞密院事耶律黙爾吉知樞密院副使事楊晳興宗重熙十二年知樞密院副使事樞密直學士聖宗統和二年見樞密直學士郭嘏樞密都承㫖聖宗開泰九年見樞密都承㫖韓紹芳樞密副承㫖楊遵勗重熙中為樞密副承㫖吏房承㫖兵刑房承㫖户房主事㕔房主事即工部中書省初名政事省太祖置官世宗天禄四年建政事省興宗重熙十三年改中書省中書令韓延徽太祖時為政事令韓知古天顯初為中書令㑹同五年又見政事令趙延夀大丞相太宗大同元年見大丞相趙延夀左丞相聖宗太平六年見左丞相張儉右丞相聖宗開泰元年見右丞相馬保忠知中書省事蕭孝友興宗重熙十年知中書省事中書侍郎韓資讓夀隆初為中書侍郎同中書門下平章事太祖加王郁同政事門下平章事太宗大同元年見平章事張礪參知政事聖宗統和十二年見參知政事邢抱朴堂後官太平二年見堂後官張克恭主事守當官並見耶律儼建官制度令史耶律儼道宗咸雍三年為中書省令史中書舍人院中書舍人室昉景宗保寜間為政事舍人道宗咸雍二年見中書舍人馬鉉右諫院右諫議大夫聖宗統和七年見諫議大夫馬得臣右補闕右拾遺劉景穆宗應厯初為右拾遺門下省侍中趙思忠太宗㑹同中為侍中常侍興宗重熙十四年見常侍額古徳散騎常侍馬人望天祚乾統中為左散騎常侍給事中聖宗統和二年見給事中郭嘏門下侍郎楊晳清寜初為門下侍郎起居舍人院起居舍人聖宗開泰六年見起居舍人程翥知起居注耶律迪里重熙末知起居注起居郎杜防開泰中為起居郎左諫院左諫議大夫左補闕左拾遺統和三年見左拾遺劉景通事舍人院通事舍人統和七年見通事舍人李琬符寶司符寶郎耶律玦重熙中為符寶郎東上閤門司太宗㑹同元年置東上閤門使韓延徽傳見東上閤門使鄭延豊東上閤門副使西上閤門司西上閤門使統和二十一年見西上閤門使丁振西上閤門副使東頭承奉班東頭承奉官韓徳讓景宗時為東頭承奉官西頭承奉班西頭承奉官通進司左通進右通進耶律揚珠景宗時為右通進登聞鼓院登聞鼓使匭院知匭院使太平三年見知匭院事社防誥院誥院給事耶律都勒斡重熙末為誥院給事尚書省太祖嘗置左右尚書尚書令蕭思温景宗保寜初為尚書令左僕射太祖初康黙記為左尚書三年見左僕射韓知古右僕射太宗㑹同元年見右僕射羅索左丞武白為尚書左丞右丞左司郎中右司郎中左司員外郎右司員外郎六部職名總目某部某部尚書聖宗開泰元年見吏部尚書劉績某部侍郎王觀興宗重熙中為兵部侍郎李澣穆宗朝累遷工部侍郎某部郎中劉輝道宗大安末為禮部郎中某部員外郎開泰六年見禮部員外郎王景運某部郎中聖宗統和九年見虞部郎中崔祐諸曹郎官未詳御史臺太宗㑹同元年置御史大夫㑹同九年見御史大夫耶律嘉哩御史中丞侍御重熙七年見南面侍御準格爾殿中司殿中聖宗開泰元年見殿中髙可恒殿中丞尚舍局見遼朝雜禮奉御尚乘局奉御尚輦局奉御尚食局奉御尚衣局奉御翰林院掌天子文翰之事翰林都林牙興宗重熙十三年見翰林都林牙耶律庶成南面林牙耶律穆爾古聖宗統和初為南面林牙翰林學士承㫖趙延夀傳見翰林學士承㫖張礪翰林學士太宗大同元年見和凝為翰林學士翰林祭酒韓徳崇景宗保寜初為翰林祭酒知制誥室昉太宗入汴詔知制誥翰林畫院翰林畫待詔聖宗開泰七年見翰林畫待詔陳升翰林醫官天祚保大二年見提舉翰林醫官