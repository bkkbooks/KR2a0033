body:
  text: 遼史卷七元中書右丞相總裁托克托等修本紀第七穆宗二十四年春正月戊寅朔奉安神纛戊戌漢以宋將來襲馳告二月壬子詔西南面招討使塔拉進兵援漢癸亥如潢河戊辰支解鹿人摩多哈喇等七人于野封土識其地己巳如老林東濼壬申漢以敗宋兵石州來告夏四月丁巳漢以擊退宋軍遣使來謝是月黄龍府甘露降五月射䑛鹻鹿于白鷹山至于浹旬六月丙午朔獵于玉山竟月忘返秋七月壬辰以酒脯祀黒山八月乙巳如磑子嶺呼鹿射之獲鹿四賜虞人紐歡等物有差丁未還宫戊申以生日値天赦不受賀曲赦京師囚乙卯錄囚九月黄室韋叛冬十月丙午近侍烏爾古綽進石錯賜白金二百五十兩丙辰以掌鹿舒蘇代斡里為扎薩克轄賜金帶金盞銀二百兩所𨽻死罪以下専之十一月壬午日南至宴飲達旦自是晝寢夜飲殺近侍轄魯於禁中十二月丙午以黑兎祭神烏爾古叛掠民財詳衮僧隱與戰敗績僧隱及伊實等死之十五年春正月己卯以樞密使伊勒希為行軍都統虎軍詳衮齊蘇為行軍都監益以圖魯卜部軍三百合兵討之烏爾古額爾竒木子博勒岱獨不叛詔褒之是月老人星見二月壬寅朔日有食之上東幸甲寅以獲鴨除鷹坊刺靣腰斬之刑復其徭役是月烏爾古殺其長蘇爾台以降復叛三月癸酉近侍棟爾進匕筯不時手刃刺之丁丑大黄室韋酋長伊聶濟叛癸未五坊四十戶叛入烏爾古癸巳虞人色勒廸偵鵝失期加炮烙鐵梳之刑而死夏四月乙巳小黄室韋叛伊勒希齊蘇等擊之為室韋所敗遣使詰之乙卯以托里代伊勒希為都統以農衮為監軍率輕騎進討仍令塔瑪錫濟爾持詔招諭五月壬申錫濟爾奏諭之不從伊勒希以達林蘇二羣牧兵追至柴河與戰不利甲申庫果濟奏室韋長伊聶濟亡入於徳哷六月辛亥伊楞古獻良馬賜銀二千兩以近侍呼喇先以聞賜銀千兩是月徳哷來降秋七月甲戌伊勒希奏烏爾古至河徳濼遣額爾竒木華喇伊勒希巴察實擊之丁丑烏爾古掠上京北榆林峪遣林牙蕭斡討之庚辰伊勒希等與烏爾古戰不利十月丁未察實與烏爾古戰敗之十二月甲辰以近侍喜格私歸殺其妻丁未殺近侍蘇嚕克駐蹕黑山平淀十六年春正月丁卯朔被酒不受賀甲申微行市中賜酒家銀絹乙酉殺近侍白海及家僕衫福雅爾噶樞密使門吏隆科塔瑪舒嚕三月己巳東幸庚午獲鴨甲申獲鵝皆飲達旦五月甲申以嵗旱泛舟于池禱雨不雨捨舟立水中而禱俄頃乃雨六月丙申以白海死非其罪賜其家銀絹秋七月壬午諭有司凡行幸之所必高立標識令民勿犯違以死論八月丁酉漢遣使貢金器鎧甲閠月乙丑觀野鹿入馴鹿羣立馬飲至晡九月庚子重九宴飲夜以繼日至壬子乃罷己未殺狼人紐斡哩十月庚辰漢主有母䘮遣使賻弔十二月甲子幸酒人伯勒格家復幸殿前都㸃檢耶律伊勒哈第宴飲連日賜金盂細錦及孕馬百匹左右授官者甚衆戊辰漢遣使來貢是冬駐蹕黑山平淀十七年春正月庚寅朔林牙蕭斡郎君耶律賢適討烏爾古還帝執其手賜酒授賢適右皮室詳衮伊勒希齊蘇轄哩賜醨酒以辱之乙卯伊勒希巴古雲獻烏爾古俘二月甲子高勲奏宋將城益津闗請以偏師擾之上從之夏四月戊辰殺鷹人達魯丙子射柳祈雨復以水沃羣臣五月辛卯殺鹿人扎喀壬辰北府宰相蕭哈里薨輟朝罷重五宴六月己未支解雉人壽格寜古殺鹿人四十四人是夏駐蹕褭潭秋八月辛酉生日以政事令安巴達病亟不受賀九月自丙戌朔獵于黒山赤山至于月終冬十月乙丑殺酒人索紐十一月辛卯殺近侍廷壽壬辰殺豕人額伯哩赫嚕珠嚕準訥哷庫庚子司天臺奏月當食不虧上以為祥歡飲達旦壬寅殺鹿人唐古直格薩喇十二月辛未手殺饔人哈里復臠之是冬駐蹕黑河平淀十八年春正月乙酉朔宴于宫中不受賀己亥觀燈于市以銀百兩市酒命羣臣亦市酒縱飲三夕二月乙卯幸五坊使錫沙哩家宴飲達旦三月甲申如潢河乙酉獲鴐鵝祭天地造大酒器刻為鹿文名曰鹿甒貯酒以祭天庚戌殺鶻人呼圖哩近侍華格及監囚哈里仍剉哈里之尸夏四月癸丑殺彘人察爾吉己巳詔左右從班有材器斡局者不次擢用老耄者增俸以休于家五月丁亥重五以被酒不受賀壬辰獲鵝于碩格水野飲終夜丁酉與政事令蕭巴雅爾南京留守高勲太師珠克劉承訓等酣飲連日己亥殺鹿人佛徳埒克陶罕扎卜庫舒古寜察布黙克特達勒逹六月丙辰殺彘人托諾己未為殿前都㸃檢伊勒哈置神帳曲赦京畿囚甲戌特烈於鵰窠中得牝犬來進是夏清暑褭潭秋七月辛丑漢主承鈞殂子繼元立來告遣使弔祭九月戊子殺詳衮巴蘭伊喇罕都等四人己丑登小山祭天地戊戌知宋欲襲河東諭西南面都統南院大王特烈豫為之備己亥獵熊以喚鹿人鋪姑并掖庭户賜伊勒哈甲辰以伊勒哈兼政事令仍以黒山東穆辰地數十里賜之以紐歡為近侍女直詳衮嘉們為本部額爾竒木是秋獵于西京諸山冬十一月辛亥朔宋圍太原詔特烈為兵馬總管發諸道兵救之十一月癸卯冬至被酒不受賀十二月丁丑殺酒人塔喇噶是冬駐蹕黑山東川十九年春正月己卯朔宴宫中不受賀己丑立春被酒命殿前都㸃檢伊勒哈代行擊土牛禮甲午與羣臣為葉格戲戊戌醉中驟加左右官乙巳詔太尉華格曰朕醉中處事有乖無得曲從酒解可覆奏自立春飲至月終不聽政三月甲寅漢劉繼元嗣立遣使乞封冊辛酉遣韓知範冊為皇帝癸亥殺前𨗳穆濟伊喇剉其屍棄之甲子漢遣使進白麃己巳如懷州獵獲熊歡飲方醉馳還行宫是夜近侍霄格盥人華格庖人錫衮等六人反帝遇弑年三十九廟號穆宗後附葬懷陵重熙二十一年諡曰孝安敬正皇帝贊曰穆宗在位十八年知女巫妖妄見誅諭臣下濫刑切諌非不明也而荒耽于酒畋獵無厭偵鵝失期加炮烙鐵梳之刑獲鴨甚歡除鷹坊刺面之令賞罰無章朝政不視而嗜殺不已變起肘腋宜哉遼史卷七遼史巻七考證應厯十四年五月射鹿于白鷹山六月獵于玉山八月如磑子嶺呼鹿射之按遊幸表是年五月獵于玉山射鹿于白嶺山六月射鹿于格徳泉今本紀獵玉山在六月而格徳泉射鹿在五月又以白嶺山為白鷹山又呼鹿射之表在七月不言磑子嶺而附綴赤山射鹿之後與本紀均互異考表與本紀往往不符其是非未可臆斷並兩存之後倣此應厯十五年三月五坊人四十戸叛入烏爾古四月小黄室韋叛六月徳哷勒來降七月烏爾古掠上京按部族表五坊人之叛在二月小黄室韋之叛徳哷勒之降及烏爾古掠上京等事較本紀所載均先一月應厯十九年三月遣韓知範冊漢劉繼元為皇帝按五代史作韓知璠遼史巻七考證
