body:
  text: 遼史卷九十二元中書右丞相總裁托克托等修列傳第二十二蕭道拉蕭布逹耶律浩善耶律古雲耶律圖丹蕭罕扎蕭烏頁蕭道拉字綏蘭約尼温汗宫人祖尼嚕古北院樞密副使父薩滿字和爾沁重熙初補授祗候郎君累遷北面林牙十九年從耶律伊遜蕭博諾伐夏至蕭惠敗績之地獲偵候者知人煙聚落多國人陷沒而不能還者盡俘以歸拜大父詳衮知山北道邊境事清寜初歴西南面西北路招討使加同中書門下平章事卒道拉體貌豐偉善騎射由祇候郎君陞漢人行宫副部署後為烏爾古徳哷勒統軍使克敵有功加龍虎衛上將軍授西北路招討使因陳北邊利害請以本路諸部與倒塌嶺統軍使連兵屯戍再表不納改東北路統軍使乾統初以乆練邊事復為西北路招討使北準布額圗格爾率鄰部來侵道拉逆擊追奔數十里乘額圖格爾無備以輕騎襲之獲馬萬五千匹牛羊稱是先是有詔方面無事招討副統軍都監内一員入覲是時同僚皆闕道拉以軍事付幕吏而朝坐是免官改西京留守復為東北路統軍卒于官蕭布逹字彈隐統和初為南院承㫖開泰六年為烏爾古節度使七年徳哷勒叛平之徙烏爾古徳哷勒都監遣徳哷勒騎卒取北準布名馬以獻詔褒奬重熙初改烏爾古徳哷勒都詳衮討諸畨有功布逹深練邊事能以悦使人有所俘獲悉散麾下由是大得衆心歴西南面招討使党項叛入西夏布逹討之中流矢歿于陣帝聞惜之賻贈加厚耶律浩善字托紐北院額爾竒木博果濟後祖徹珍北院大王父和克黄皮室詳衮浩善初為西南巡邊官以廉潔稱累遷南京統軍使尋為北院大王重熙十一年党項部人多叛入西夏浩善受詔巡西邊㳂河要地多建城堡以鎮之徙東京留守十三年與知府蕭烏魯斯討博囉滿逹勒有功加兼侍中致仕卒耶律古雲字穆喇齊北院林牙圖魯卜之後有膂力工馳射開泰間為烏爾古徳哷勒都監會部人叛從樞密使耶律世良討平之以功詔鎮撫西北部教以種樹畜牧不數年民多富實中京盜起命古雲為巡邏使悉擒之上親征渤海將黄皮室軍有破敵功累遷御史中丞尋授開逺軍節度使徙鎮歸徳二十一年改天成軍節度使卒于官年七十贈同中書門下平章事二子伊遜鄂摩伊遜重熙間從蕭恵討西夏惠敗績伊遜一軍獨全拜北院大王鄂摩太康三年為漢人行宫副部署伊遜誣害太子詞連鄂摩帝釋之是秋伊遜復奏與蕭楊結私議宫壼事被害乾統間贈同中書門下平章事耶律圖丹字和爾沁太師古雲之子重熙初為左䕶衛將禁兵從伐夏有功授十二行糺司徒再舉伐夏圖丹括山西諸郡馬還遷伊喇詳衮西南未平命圖丹同知金肅軍事夏人來侵擊敗之進納喇阿爾威節度使清寜元年召為皇太后左䕶衛太保四年改寜遠軍節度使東路饑奏振之歴五國烏爾古遼興軍三鎮節度使四捷軍詳衮太康元年卒追贈同中書門下平章事子阿蘇有傳蕭罕扎國舅之族姓端簡謹愿動循禮法清寜中為䕶衛太保太康二年遷知北院樞密副使三年經畫西南邊天池舊塹立堡砦正疆界刻石而還為漢人行宫都部署是年秋獵墮馬卒蕭烏頁字草隐其先出興聖宫分觀察使塔哩濟之孫也性孝悌尚禮法雅為鄉黨所稱重熙中補䕶衛興宗見其勤恪遷䕶衛太保佐耶律仁先平重元亂以功加團練使時徳哷勒數為鄰部侵擾民多困弊命烏頁為徳哷勒節度使恤困窮省徭役不數月部人以安尋以母老歸養于家母亡尤極哀毁服闋歴官興聖延慶二宫使卒論曰烏爾古徳哷勒大部也道拉統軍克敵有功布達居邊悦以使人西北重鎮也浩善巡邊以廉稱古雲鎮撫而民富圖丹駐金肅而夏人不敢東獵噫部人内附方面以寜雖朝廷處置得宜而諸將之力抑亦何可少哉遼史卷九十二遼史卷九十二考證耶律古雲傳二十一年古雲改天成軍節度使按聖宗本紀統和二十九年之次年改元開泰閲八年又改元太平閲十一年興宗即位改元景福止一年即改元重熙凡二十四年此所書二十一年應係指重熙二十一年然考興宗本紀二十一年内無耶律古雲改天成軍節度使之文未敢遽指為重熙間事姑仍其舊遼史卷九十二考證
