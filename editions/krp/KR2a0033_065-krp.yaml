body:
  text: 遼史卷六十五元中書右丞相總裁托克托等修表第三公主表春秋之法王姬下嫁書于䇿以魯公同姓之國為之婚主故爾古者婦諱不出門内言不出梱公主悉列于傳非禮也然遼國專任外戚公主多見記傳間不得不表見之禮男女異長不當與皇子同列别為公主附表遼史卷六十五遼史卷六十五考證公主表睿智皇后生三女按刻本舊作睿聖皇后考景宗后諡睿智謹據改景宗四女長夀女下嫁宰相蕭巴雅爾延夀女下嫁蕭恒徳淑格下嫁盧俊改適蕭實訥按聖宗統和元年二月以皇女長夀公主下嫁國舅宰相蕭巴桑子烏里十月以公主淑格下嫁國舅詳衮兆古七年四月國舅太師蕭達為子巴雅爾請尚皇女延夀公主許之今考之表三人所適之名各不同當有舛誤遼史卷六十五考證
