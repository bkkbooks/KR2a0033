body:
  text: 遼史卷六十一元中書右丞相總裁托克托等修志第三十刑法志上刑也者始於兵而終於禮者也鴻荒之代生民有兵如蠭有螫自衛而已蚩尤惟始作亂斯民鴟義姦宄竝作刑之用豈能已乎帝堯清問下民乃命三后恤功于民伯夷降典折民惟刑故曰刑也者始於兵而終於禮者也先王順天地四時以建六卿秋刑官也象時之成物焉秋傳氣於夏變色於春推可知也遼以用武立國禁暴戢姦莫先於刑國初制法有出於五服三就之外者兵之勢方張禮之用未遑也及蘇爾威汗知宗室聶埒賢命為額爾竒木以掌刑辟豈非士師之官非賢者不可為乎太祖太宗經理疆土擐甲之士歲無寧居威克厥愛理勢然也子孫相繼其法互有輕重中間能審權宜終之以禮者惟景聖二宗為優耳然其制刑之凡有四曰死曰流曰徒曰杖死刑有絞斬凌遲之屬又有籍沒之法流刑量罪輕重寘之邊城部族之地逺則投諸境外又逺則罰使絶域徒刑一曰終身二曰五年三曰一年半終身者决五百其次遞减百又有黥刺之法杖刑自五十至三百凡杖五十以上者以沙袋决之又有木劒大棒鐵骨朶之法木劒大棒之數三自十五至三十鐵骨朶之數或五或七有重罪者將决以沙袋先于脽骨之上及四周擊之拷訊之具有麄細杖及鞭烙法麄杖之數二十細杖之數三自三十至於六十鞭烙之數凡烙三十者鞭三百烙五十者鞭五百被告諸事應伏而不服者以此訊之品官公事誤犯民年七十以上十五以下犯罪者聽以贖論贖銅之數杖一百者輸錢千亦有八議八縱之法籍沒之法始自太祖為塔瑪噶賽特時奉哈陶津汗之命案裕悅實嚕遇害事以其首惡家屬沒入斡里及淳欽皇后時析出以為著帳郎君至世宗詔免之其後内外戚屬及世官之家犯反逆等罪復沒入焉餘人則沒為著帳戸其沒入宫分分賜臣下者亦有之木劒大棒者太宗時制木劒面平背隆大臣犯罪重欲寛宥則擊之沙袋者穆宗時制其制用熟皮合縫之長六寸廣二寸柄一尺許徒刑之數詳于重熙制杖刑以下之數詳于咸雍制其餘非常用而無定式者不可殫紀太祖初年庶事草創犯罪者量輕重决之其後治諸弟逆黨權宜立法親王從逆不磬諸甸人或投髙崖殺之淫亂不軌者五車轘殺之逆父母者視此訕詈犯上者以熟鐵錐摏其口殺之從坐者量罪輕重杖决杖有二大者重錢五百小者三百又為梟磔生瘞射鬼箭砲擲支解之刑歸於重法閑民使不為變耳歳癸酉下詔曰朕自北征以來四方獄訟積滯頗多今休戰息民羣臣其副朕意詳决之無或寃枉乃命北府宰相蕭達魯等分道疏决有遼欽恤之意昉見于此神册六年克定諸夷上謂侍臣曰凡國家庶務鉅細各殊若憲度不明則何以為治羣下亦何由知禁乃詔大臣定治契丹及諸夷之法漢人則斷以律令仍置鍾院以達民寃至太宗時治渤海人一依漢法餘無改焉㑹同四年皇族錫利郎君謀毒通事嘉里等已中者二人命重杖之及其妻流于矩巴哩木河族造藥者世宗天禄二年天徳蕭翰劉格及其弟璸都等謀反天徳伏誅杖翰流劉格遣璸都使哈噶斯國夫四人之罪均而刑異遼之世同罪異論者蓋多穆宗應厯十二年國舅帳郎君蕭延之奴哈里彊陵伊喇圖哩年未及之女以法無文加之宫刑仍付圖哩以為奴因著為令十六年諭有司自先朝行幸頓次必髙立標識以禁行者比聞綽呼輩故低置其標深草中利人誤入因之取財自今有復然者以死論然帝嗜酒及獵不恤政事五坊掌獸近侍奉膳掌酒人等以獐鹿野豕鶻雉之屬亡失傷斃及私歸逃亡在告踰期召不時至或以奏對少不如意或以飲食細故或因犯者遷怒無辜輙加炮烙鐵梳之刑甚者至于無算或以手刃刺之斬繫射燎斷手足爛肩股折腰脛劃口碎齒棄屍于野且命築封于其地死者至百有餘人京師置百尺牢以處繫囚蓋其即位未乆惑女巫錫庫之言取人膽合延年藥故殺人頗衆後悟其詐以鳴鏑叢射騎踐殺之及哈里之死為長夜之飲五坊掌獸人等及左右給事誅戮者相繼不絶雖嘗悔其因怒濫刑諭大臣切諌在廷畏懦鮮能匡捄雖諌又不能聽當其將殺壽格寧古殿前都㸃檢耶律伊勒哈諌曰壽格等斃所掌雉畏罪而亡法不應死帝怒斬壽格等支解之命有司盡取鹿人之所繫者凡六十五人斬所犯重者四十四人餘悉痛杖之中有欲寘死者賴王子必舒等諌得免已而怒佛徳飼鹿不時致傷而斃遂殺之季年暴虐益甚嘗謂太尉華格曰朕醉中有處决不當者醒當覆奏徒能言之竟無悛意故及於難雖云虐止􅉏御上不及大臣下不及百姓然刑法之制豈人主快情縱意之具邪景宗在潛已監其失及即位以宿衛失職斬殿前都㸃檢耶律伊勒哈趙王喜隱自囚所擅去械鏁求見自辯語之曰枉直未分焉有出獄自辯之理命復縶之既而躬録囚徒盡召而釋之保寧三年以穆宗廢鍾院窮民有寃者無所訴故詔復之仍命鑄鍾紀詔其上道所以廢置之意呉王舒為奴所告有司請鞫帝曰朕知其誣若案問恐餘人效之命斬以狥五年近侍薩喇勒誤觸神纛法應死杖而釋之庶幾寛猛相濟然緩于討賦應厯逆黨至是始獲而誅焉議者以此少之聖宗冲年嗣位睿智皇后稱制留心聽斷嘗勸帝宜寛法律帝壯益習國事銳意於治當時更定法令凡十數事多合人心其用刑又能詳慎先是契丹及漢人相毆致死其法輕重不均至是一等科之統和十二年詔契丹人犯十惡亦斷以律舊法死囚屍市三日至是一宿即聽收瘞二十四年詔主非犯謀反大逆及流死罪者其奴婢無得告首若奴婢犯罪至死聽送有司其主無得擅殺二十九年以舊法宰相節度使世選之家子孫犯罪徒杖如齊民惟免黥面詔自今但犯罪當黥即准法同科開泰八年以竊盜贓滿十貫為首者處死其法太重故増至二十五貫其首處死從者决流嘗敕諸處刑獄有寃不能申雪者聽詣御史臺陳訢委官覆問往時大理寺獄訟凡闗覆奏者以翰林學士給事中政事舍人詳决至是始置少卿及正主之猶慮其未盡而親為録囚數遣使詣諸道審决寃滯如邢抱朴之屬所至人自以為無寃五院部民有自壊鎧甲者其長佛努杖殺之上怒其用法大峻詔奪官吏以故不敢酷達爾罕納旺舒克因醉言宫掖事法當死特貰其罪五院部民偶遺火延及木葉山兆域亦當死杖而釋之因著為法至於達巴噶始竊薊州王令謙家財及覺以刃刺令謙幸不死有司擬以盜論止加杖罪又訥黙庫犯竊盜者十有三次皆以情不可恕論棄市因詔自今以犯竊盜者黥額徒三年四則黥面徒五年至於五則處死若是者重輕適宜足以示訓近侍劉格烏古斯嘗從齊王妻而逃以赦後㑹千齡節出首乃詔諸近侍䕶衛集視而腰斬之於是國無倖民綱紀修舉吏多奉職人重犯法故統和中南京及易平二州以獄空聞至開泰五年諸道皆獄空有刑措之風焉故事樞宻使非國家重務未嘗親决獄訟惟額爾竒木主之及蕭和卓蕭朴相繼為樞宻使專尚吏才始自聽訟時人轉相效習以狡智相髙風俗自此衰矣故太平六年下詔曰朕以國家有契丹漢人故以南北二院分治之蓋欲去貪枉除煩擾也若貴賤異法則怨必生夫小民犯罪必不能動有司以達於朝惟内族外戚多恃恩行賄以圖苟免如是則法廢矣自今貴戚以事被告不以事之大小竝令所在官司案問具申北南院覆問得實以聞其不案輒申及受請託為奏言者以本犯人罪罪之七年詔中外大臣曰制條中有遺闕及輕重失中者其條上之議増改焉遼史卷六十一遼史卷六十一考證刑法志上有遼欽恤之意昉見于此按太祖紀七年六月以實喇縣人繅古非法殘民磔之聞獄官聶哷造大校人不堪苦誅之九月遂有疏决滯獄之詔以韓知古領其事則遼初欽恤之政固多可紀也遼史卷六十一考證
