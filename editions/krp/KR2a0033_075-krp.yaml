body:
  text: 遼史卷七十五元中書右丞相總裁托克托等修列傳第五耶律迪里伊濟耶律都沁古圖魯卜王郁耶律圖勒錦耶律迪里字裕勒沁六院部博果濟額爾竒木之後父烏蘓亦為額爾竒木初太祖為裕悦時迪里以謹厚見器使既即位兄赫嚕典宿衛迪里入侍帷幄與聞政事神冊三年赫嚕薨命迪里為徳哷勒部額爾竒木屬以南方事㑹討党項皇太子為先鋒迪里副之軍至天徳雲内分道並進迪里率偏師渡河力戰斬獲甚衆天贊初析徳哷勒部為北南院置額爾竒木時大元師率師由古北口畧燕地迪里徇山西所至克㨗太祖嘉其功錫賚甚厚從伐渤海㧞扶餘城留迪里與伊徳實守之天顯二年留守南京十年卒年五十六弟伊濟伊濟小字烏里字伊徳森幼豪爽不羣長嗜學通諸部語太祖經營之初多預軍謀天顯元年渤海平立皇太子為東丹王以伊濟為中臺省右次相時人心未安左大相迪里不踰月薨伊濟莅事勤恪威信並行太宗即位上表曰我大聖天皇始有東土擇賢輔以撫斯民不以臣愚而任之國家利害敢不以聞渤海昔畏南朝阻險自衛居輝罕城今去上京遼邈既不為用又不罷戍果何為哉先帝因彼離心乘釁而動故不戰而克天授人與彼一時也遺種寖以蕃息今居逺境恐為後患梁水之地乃其故鄉地衍土沃有木鐡鹽魚之利乘其㣲弱徙還其民萬世長䇿也彼得故鄉又獲木鐡鹽魚之饒必安居樂業然後選徒以翼吾左突厥党項室韋夾輔吾右可以坐制南邦混一天下成聖祖未集之功貽後世無疆之福表奏帝嘉納之是歳詔徙東丹國民於梁水時稱其善人皇王奔唐伊濟鎮撫國人一切如故以功加守太傅遷中臺省左相會同初以冊禮赴闕加特進表奏左次相渤海蘓貪墨不法事卒子和哩終東京留守耶律都沁字達年六院部人祖博果濟約尼氏時再為本部額爾竒木耶律朗徳等既害𤣥祖暴横益肆博果濟以計誘其黨悉誅之都沁幼有志節太祖為裕悦常居左右後即位梁人遣使求轅軸材太祖難之都沁曰梁名求材實覘吾輕重宜答曰材之所生必深山窮谷有神司之須白鼻赤驢禱祠然後可伐如此則其語自塞矣已而果然天贊三年將伐渤海都沁諫曰陛下先事渤海則西夏必躡吾後請先西討庶無後顧憂太祖從之及淳欽皇后稱制惡都沁囚之誓曰鐡鎻朽當釋汝既而召之使者欲去鎻都沁辭曰鐡未朽可釋乎后聞嘉歎趣召釋之天顯二年卒弟古圖魯卜古字鼐爾琨初名實黙克太祖為裕悦嘗從畧地山右會李克用於雲州古侍克用異之曰是兒骨相非常不宜使在左右以故太祖頗忌之時方西討諸弟亂作聞變太祖問古與否曰無喜曰吾無患矣趣召古議古陳珍滅之䇿後皆如言以故賜賚甚厚神冊末南伐以古佐右皮室詳衮隆科與唐兵戰于雲碧店隆科中流矢傷甚太祖疑古隂害之古知上意跪曰陛下疑臣恥居隆科麾下耶及今隆科在請遣使問之太祖使問隆科對曰臣於古無可疑者上意乃釋隆科卒遂以古為右皮室詳衮既卒太祖謂左右曰古死猶長松自倒非吾伐之也圖魯卜字鐸衮幼聰敏嗜學事太祖見器重及製契丹大字圖魯卜贊成為多未幾為文班林牙領國子博士知制誥明年受詔撰決獄法太祖畧燕詔與皇太子及王郁攻定州師還至順州幽州馬歩軍指揮使王千率衆來襲圖魯卜射其馬躓擒之天贊二年皇子耀庫濟為大元帥圖魯卜為副既克平州進軍燕趙下曲陽北平至易州易人來拒踰濠而陣李景章出降言城中人無鬬志大元帥將修攻具圖魯卜諫曰我師逺來人馬疲憊勢不可乆留乃止軍還大元帥以其謀聞太祖大悦賜賚優渥車駕西征圖魯卜與大元帥為先鋒伐党項有功太祖犒師水精山大元帥東歸圖魯卜留屯西南部復討党項多獲而還大祖東伐大諲譔降而復叛攻之圖魯卜先登渤海平承詔銘太祖功徳于永興殿壁班師已下州郡往往復叛圖魯卜從大元帥攻破之淳欽皇后稱制有飛語中傷者后怒圖魯卜懼而亡太宗知其無罪召還天顯三年討烏爾古部俘獲甚衆伐唐以圖魯卜為左翼攻唐軍霞沙寨降之十一年送晉主石敬瑭入洛及大冊圖魯卜總禮儀事加特進檢校太尉會同五年卒王郁京兆萬年人唐義武軍節度使處直之孽子伯父處存鎮義武卒三軍推其子郜襲處直為都知兵馬使光化三年梁王朱全忠攻定州郜遣處直拒于沙河兵敗入城逐郜部奔太原亂兵推處直為留後遣人請事梁王梁與晉王克用絶好表處直為義武軍節度使初郜之亡也郁從之晉王克用妻以女用為新州防禦使處直料晉必討張文禮鎮亡則定不獨存益自疑隂使郁北導契丹入塞以牽晉兵且許爲嗣郁自奔晉常恐失父心得使大喜神冊六年奉表送欵舉室來降太祖以為養子未幾郁兄都囚父自爲留後帝遣郁從皇太子討之至定州都堅壁不出掠居民而還明年從皇太子攻鎮州遇唐兵于定州破之天贊二年秋郁及阿古齊畧地燕趙攻下磁窯務從太祖平渤海戰有功加同政事門下平章事改崇義軍節度使太祖崩郁與妻㑹葬其妻泣訴於淳欽皇后求歸鄉國許之郁奏曰臣本唐主之壻王已被弑此行夫妻豈能相保願常侍太后后喜曰漢人中惟王郎最忠孝以太祖常與李克用約爲兄弟故也尋加政事令還宜州卒耶律圖勒錦字額哩音肅祖子學順之孫勇而有謀太宗立晉之役其父逹嚕噶爲五院額爾竒木殁于兵帝即以其職授圖勒錦㑹同元年改北院大王嘗屏左右與議大事占對合上意從討石重貴杜重威擁十萬餘衆拒滹沱橋力戰數日不得進帝曰兩軍爭渡人馬疲矣計安出諸將請緩師爲後圖帝然之圖勒錦厲色進曰臣愚竊以爲陛下樂於安逸則謹守四境可也旣欲擴大疆宇出師逺攻詎能無厪聖慮若中路而止適爲賊利則必陷南京夷属邑若此則爭戰未已吾民無奠枕之期矣且彼歩我騎何慮不克况漢人足力弱而行緩如選輕鋭騎先絶其餉道則事蔑不濟矣帝喜曰國强則其人賢海巨則其魚大於是塞其餉道數出師以牽撓其勢重威果降如言以功獲賜甚厚明年春卒軍中論曰神册初元將相大臣㧞起風塵之中翼扶王運以任職取名者固一時之材亦由太祖推誠御下不任獨斷用能總攬羣䇿而爲之用歟其投天隙而列功庸至有心腹耳目手足之諭豈偶然哉討党項走逹魯平埒克定渤海功亦偉矣若黙記治獄不寃佛徳持論不撓延徽立經陳紀紹勲秉節而死圖勒錦料敵制勝豈器博者無近用道長者其功逺歟稱爲佐命固宜遼史卷七十五遼史卷七十五考證王郁傳郁兄都囚父自爲留後帝遣郁討之至定州都堅壁不出掠居民而還按資治通鑑望都之敗契丹主切責王郁縶之以歸自是以後不聴其謀遼史不載其事遼史卷七十五考證
