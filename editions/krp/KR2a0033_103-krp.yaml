body:
  text: 遼史卷一百三元中書右丞相總裁托克托等修列傳第三十二文學上遼起松漠太祖以兵經略方内禮文之事固所未遑及太宗入汴取晉圖書禮器而北然後制度漸以修舉至景聖間則科目聿興士有由下僚擢陞侍從駸駸崇儒之美但其風氣剛勁三面鄰敵嵗時以蒐獮為務而典章文物視古猶闕然二百年之業非數君子為之綜理則後世惡所考述哉作文學傳蕭罕嘉努字糾堅納喇部人中書令安圖之孫少好學弱冠入南山讀書博覽經史通遼漢文字統和十四年始仕家有一牛不任驅䇿其奴得善價鬻之罕嘉努曰利己誤人非吾所欲乃歸直取牛二十八年為右通進典南京梨園重熙初同知三司使事四年遷天成軍節度使徙彰愍宫使帝與語才之命為詩友嘗從容問曰卿居外有異聞乎罕嘉努對曰臣惟知炒栗小者熟則大者必生大者熟則小者必焦使大小均熟始為盡美不知其他葢嘗掌栗園故托栗以諷諌帝大笑詔作四時逸樂賦帝稱善時詔天下言治道之要制問徭役不加于舊征伐亦不常有年榖既登帑廪既實而民重困豈為吏者慢為民者惰歟今之徭役何者最重何者尤苦何所蠲省則為便益補役之法何可以復盜賊之害何可以止罕嘉努對曰臣伏見比年以來髙麗未賔準布猶强戰守之備誠不容己乃者選富民防邊自備糧糗道路修阻動淹嵗月比至屯所費已過半隻牛單轂鮮有還者其無丁之家倍直傭僦人憚其勞半途亡竄故戍卒之食多不能給求假于人則十倍其息至有鬻子割田不能償者或逋役不歸在軍物故則復補以少壯其鴨淥江之東戍役大率如此况渤海女直髙麗合從連衡不時征討富者從軍貧者偵候加之水旱菽粟不登民以日困葢勢使之然也方今最重之役無過西戍如無西戍雖遇凶年困弊不至於此若能徙西戍稍徙則徃來不勞民無深患議者謂近之非便一則損威名二則召侵侮三則棄耕牧之地臣謂不然準布諸部自來有之曩時北至臚朐河南至邊境人多散居無所統壹惟往來抄掠及太祖西征至於流沙準布望風悉降西域諸國皆願入貢因遷種落内置三部以益吾國不營城邑不置戍兵準布累世不敢為宼統和間皇太妃出師西域拓土既逺降附亦衆自後一部或叛鄰部討之使同力相制正得馭逺人之道及城哈屯開境數千里西北之民徭役日増生業日殫警急既不能救叛服亦復不恒空有廣地之名而無得地之實若貪土不已漸至虚耗其患有不勝言者况邊情不可深信亦不可頓絶得不為益捨不為損國家大敵惟在南方今雖連和難保他日若南方有變屯戍遼邈卒難赴援我進則敵退我還則敵來不可不慮也方今太平已久正可恩結諸部釋罪而歸地内徙戍兵以増堡障外明約束以正疆界每部各置酋長歳修職貢叛則討之服則撫之諸部既安必不生釁如是則臣雖不能保其久而無變知其必不深入侵掠也或云棄地則損威殊不知殫費竭財以貪無用之地使彼小部抗衡大國萬一有敗損威豈淺或又云沃壤不可遽棄臣以為土雖沃民不能久居一旦敵來則不免内徙豈可指為吾土而惜之夫帑廪雖隨部而有此特周急部民一偏之恵不能均濟天下如欲均濟天下則當知民困之由而窒其隙節盤遊簡驛傳薄賦斂戒奢侈期以數年則困者可蘇貧者可富矣葢民者國之本兵者國之衛兵不調則曠軍役調之則損國本且諸部皆有補役之法昔補役始行居者行者類皆富實故累世從戍易為更代近嵗邊虞數起民多匱乏既不任役事隨補隨缺苟無上户則中户當之曠日彌年其窮益甚所以取代為難也非惟補役如此在邊戍兵亦然譬如一抔之土豈能塡尋丈之壑欲為長久之便莫若使逺戍疲兵還於故鄉薄其徭役使人人給足則補役之道可以復故也臣又聞自昔有國家者不能無盜比年以來羣黎凋弊利於剽竊良民往往化為凶暴甚者殺人無忌至有亡命山澤基亂首禍所謂民以困窮皆為盜賊者誠如聖慮今欲芟夷本根願陛下輕徭省役使民務農衣食既足安習教化而重犯法則民趨禮義刑罰罕用矣臣聞唐太宗問羣臣治盜之方皆曰嚴刑峻法太宗笑曰㓂盜所以滋者由賦斂無度民不聊生今朕内省嗜欲外罷游幸使海内安靜則㓂盜自止由此觀之寇盜多寡皆由衣食豐儉徭役重輕耳今宜徙哈屯城於近城與西南副都部署烏爾古德哷勒威烏爾古等部聲援相接罷黒嶺二軍并開保州皆𨽻東京益東北戍軍及南京總管兵増修壁壘候尉相望繕完樓櫓浚治城隍以為邊防此方今之急務也願陛下裁之擢翰林都林牙兼修國史詔曰文章之職國之光華非才不用以卿文學為時大儒是用授卿以翰林之職朕之起居悉以實錄自是日見親信每入侍賜坐遇勝日帝與飲酒賦詩以相醻酢君臣相得無比罕嘉努知無不言雖諧謔不忘規諷十三年春上疏曰臣聞先世約尼温汗之後國祚中絶自額爾奇木聶哷立蘇爾威大位始定然上世俗朴未有尊稱臣以為三皇禮文未備正與約尼同後世之君以禮樂治天下而崇本追逺之義興焉近者唐高祖創立先廟尊四世為帝昔我太祖代約尼即位乃製文字修禮法建天皇帝名號制宮室以示威服興利除害混一海内厥後累聖相承自額爾竒木呼哩以下大號未加太祖之考額爾竒木逹魯猶以名呼臣謂宜依唐典追崇四祖為皇帝則陛下𢎞業有光墜典復舉矣疏奏帝納之始行追冊𤣥徳二祖之禮罕嘉努每見帝獵未嘗不諌㑹有司奏獵秋山熊虎傷死數十人罕嘉努書于冊帝見命去之罕嘉努既出復書他日帝見之曰史筆當如是帝問罕嘉努我國家創業以來孰為賢主罕嘉努以穆宗對帝怪之曰穆宗嗜酒喜怒不常視人猶草芥卿何謂賢罕嘉努對曰穆宗雖暴虐省徭輕賦人樂其生終穆之世無罪被誅未有過今日秋山傷死者臣故以穆宗為賢帝黙然詔與耶律庶成録約泥汗至重熙以來事迹集為二十卷進之十五年復詔之曰古之治天下者明禮義正法度我朝之興世有明德雖中外嚮化然禮書未作無以示後世卿可與庶成酌古準今制為禮典事或有疑與北南院同議罕嘉努既被詔愽考經籍自天子達于庶人情文制度可行於世不繆於古者譔成三卷進之又詔譯諸書罕嘉努欲帝知古今成敗譯通厯貞觀政要五代史時帝以其老不任朝謁拜歸德軍節度使以善治聞帝遣使問勞罕嘉努表謝召修國史卒年七十二有六義集十二卷行于世李澣初仕晉為中書舍人晉亡歸遼當太宗崩世宗立恟恟不定澣與髙勲等十餘人羈留南京久之從歸上京授翰林學士穆宗即位累遷工部侍郎時澣兄濤在汴為翰林學士密遣人召澣澣得書託求醫南京易服夜出欲遁歸汴至涿為徼巡者所得送之南京下吏澣伺獄吏熟寢以衣帶自經不死防之愈嚴械赴上京自投黄河中流為鐡索牽掣又不死及抵上京帝欲殺之時髙勲已為樞密使救止之屢言於上曰澣本非負㤙以母年八十急於省覲致罪且澣富於文學方今少有倫比若留掌詞命可以増光國體帝怒稍解仍令禁錮于奉國寺凡六年艱苦萬状㑹上欲建太宗功德碑髙勲奏曰非李澣無可秉筆者詔從之文成以進上悦釋囚尋加禮部尚書宣政殿學士卒論曰統和重熙之間務修文治而罕嘉努對䇿落落累數百言槩可見諸行事亦遼之晁賈哉李澣雖以詞章見稱而其進退不足論矣遼史卷一百三遼史卷一百三考證蕭罕嘉努傳天皇帝之考額爾竒木達魯按太祖本紀贊徳祖名薩喇達為太祖之父世為約尼氏之額爾奇木即此所云天皇帝之考也然此云名達魯與本紀異爾契丹國志又作太祖父名斡里諸書所載不同謹識以備考遼史卷一百三考證
