body:
  text: 遼史卷六十九元中書右丞相總裁托克托等修表第七部族表司馬遷作史記叙四裔於篇末秦漢以降各有其國彼疆此界道里云邈不能混一寰宇周知種落鄰國聘貢往來焉能歴覽或口傳意記模冩梗槩耳遼接五代漢地逺近載諸簡冊可考西北沙漠之地樹藝五穀衣服車馬禮文制度以及土產品物得其粗而失其精部落之名姓氏之號得其音而未得其字歴代踵訛艱於考索遼氏與諸部相通往來朝貢及西遼所至之地見於紀傳亦豈少也哉其事則書於紀部族則列於表云天祚播越耶律達實立燕晉國王淳淳死與蕭妃奔天徳軍上誅妃責達實達實率衆西去自立為帝所歴諸部附見於後遼史卷六十九遼史卷六十九考證㑹同四年正月伊實丕勒圖吉三部上党項俘獲按本紀以伊實丕勒圖吉三部鰥寡不能自存者官為之配表與紀互異疑因是月有納喇威二部上党項俘之事而表遂牽連誤書也統和四年正月按原本此月有姪里姑部送輜重行宫之文考聖宗本紀是年六月以伊勒希巴珠勒呼部送輜重行宫珠勒呼原本作姪里姑乃人名也作史者誤解部送部字遂載入部族表中又誤以六月為五月舛謬實甚今刪此條而識其故于此壽隆三年正月原本此月書烏爾固部節度使耶律陳嘉努討有功按道宗本紀此月以陳嘉努有功加尚書右僕射原文所書討有功之語既未明晰况陳嘉努雖為烏爾固部節度使究非烏爾固部之事與部旋無涉仍之則體例殊為不符謹删遼史卷六十九考證
