  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0033_WYG_077-1a, image: WYG0289/WYG0289-0587c.png}
body:
  text: 遼史卷七十七元中書右丞相總裁托克托等修列傳第七耶律烏哲耶律吼和勒博耶律安圖耶律斡耶律托雲耶律塔喇耶律烏哲字達年系出孟父房姿簡靜有器識重然諾遇事造次處之從容人莫能測博學知天文㑹同間為特哩衮太宗崩諸大臣立世宗太后聞之怒遣皇子魯呼以兵逆擊遇安圖瑠格等于泰徳泉敗歸魯呼盡執世宗臣僚家屬謂守者曰我戰不克先殪此曹人皆恟恟相謂曰若果戰則是父子兄弟相夷矣軍次潢河横渡隔岸相拒時烏哲從太后世宗以烏哲善籌欲行間乃設事奉書以試太后太后得書以示烏哲烏哲讀竟言曰太后佐太祖定天下故臣願竭死力若太后見疑臣雖欲盡忠得乎為今之計莫若以言和解事必有成否即宜速戰以決勝負然人心一揺國禍不淺惟太后裁察太后曰我若疑卿安肯以書示汝烏哲對曰魯呼永康王皆太祖子孫神器非移他族何不可之有太后宜思長䇿與永康王和議太后曰誰可遣者對曰太后不疑臣臣請往萬一永康王見聴廟社之福太后乃遣烏哲授書於帝帝遣宣徽使耶律哈斯復書辭多不遜烏哲諌曰書意如此國家之憂未艾也能釋怨以安社稷則臣以為莫若和好帝曰彼衆烏合安能敵我烏哲曰即不敵奈骨肉何況未知孰勝借曰幸勝諸臣之族執於魯呼者無噍類矣以此計之惟和為善左右聞者失色帝良久問曰若何而和烏哲對曰與太后相見各紓忿恚和之不難不然決戰非晩帝然之遂遣哈斯詣太后約和往返數日議乃定始相見怨言交讓殊無和意太后謂烏哲曰汝當為我畫之烏哲進曰太后與大王若能釋怨臣乃敢進説太后曰汝第言之烏哲借謁者籌執之謂太后曰昔人皇王在何故立嗣聖太后曰立嗣聖者太祖遺㫖又曰大王何故擅立不禀尊親帝曰人皇王當立而不立所以去之烏哲正色曰人皇王捨父母之國而奔唐子道當如是耶大王見太后不少遜謝惟怨是尋太后牽于偏愛託先帝遺命妄授神器如此何敢望和當速交戰擲籌而退太后泣曰向太祖遭諸弟亂天下荼毒瘡痍未復庸可再乎乃索籌一帝曰父不為而子為又誰咎也亦取籌而執左右感激大慟太后謂烏哲曰議既未定神器竟誰歸烏哲曰太后若授永康王順天合人復何疑魯呼厲聲曰我在烏雲安得立烏哲曰禮有世嫡不傳諸弟昔嗣聖之立尚以為非況公暴戾殘忍人多怨讟萬口一辭願立永康王不可奪也太后顧魯呼曰汝亦聞此言乎汝實自為之乃許立永康帝謂烏哲曰汝與朕屬尤近何反助太后烏哲對曰臣以社稷至重不可輕付故如是耳上喜其忠天祿二年耶律天徳蕭翰謀反下獄特哩衮瑠格及弟璸都結天徳等為亂耶律實喇潛告烏哲烏哲遽引入見白其事瑠格等不服事遂寢未幾瑠格邀駕觀樗蒲捧觴上夀袖刃而進帝覺命執之親詰其事瑠格自誓帝復不問烏哲奏曰當使瑠格與實喇對狀不可輒恕帝曰卿為朕鞫之烏哲率劍士往訊之天徳等伏罪誅天徳杖翰遷瑠格以璸都使哈噶斯國三年表列泰寧王察克隂謀事上不聴五年為右皮室詳衮秋上祭讓國皇帝于行宫與羣臣皆醉察克弑帝烏哲聞有言衣紫者不可失乃易衣而出亟遣人召諸王及喻禁衞長皮室等同力討賊時夀安王歸帳烏哲遣弟冲迎之王意尚猶豫烏哲曰大王嗣聖子賊若得之必不容羣臣將誰事社稷將誰頼萬一落賊手悔將何及王始悟諸將聞烏哲出相繼而至遲明整兵出賊不意圍之遂誅察克亂既平穆宗即位謂烏哲曰朕之性命實出卿手命知國事以逆黨財産盡賜之烏哲固辭應厯五年為北院大王總山西事保寧初宋圍太原以烏哲率兵往援至白馬嶺遣勁卒夜出間道疾馳駐太原西鳴鼓舉火宋兵以為大軍至懼而宵遁以功加裕悦四年漢劉繼元遣使來貢致幣於烏哲烏哲以聞帝命受之五年五月薨年五十七帝痛悼輟朝三日後道宗詔上京立祠祭享樹碑以紀其功云耶律吼字赫嚕六院部額爾奇木博果濟之後端慤好施不事生産太宗頗倚任㑹同六年為南院大王涖事精簡人不敢以年少易之時晉主石重貴表不稱臣辭多倨慢吼言晉罪不可不伐及帝親征以所部兵從既入汴諸將皆取内帑珍異吼獨取馬鎧帝嘉之及帝崩于欒城無遺詔軍中憂懼不知所為吼詣北院大王耶律斡議曰天位不可一日曠若請于太后則必屬魯呼魯呼暴戾殘忍詎能子民必欲厭人望則當立永康王斡然之㑹耶律安圖來意與吼合遂定議立永康王是為世宗頃之以功加採訪使賜以寶貨吼辭曰臣位已高敢復求富臣從弟達魯諸子坐事籍没陛下哀而出之則臣受賜多矣上曰吼舍重賞以族人為請其賢逺甚許之仍賜宫户五十時有取當世名流作七賢傳者吼與其一天祿三年卒年三十九子和勒博和勒博字實訥嘗與耶律烏哲平察克亂穆宗以其父吼首議立世宗故不顯用晚年為本族敞史及景宗即位以平察克功授昭徳軍節度使為北院大王時黄龍府軍將燕頗殺守臣以叛和勒博討之破於鴨綠江坐不親追擊以至失賊杖之乾亨間卒耶律安圖曽祖揚珠𤣥祖之長子祖春博里為本部額爾奇木父迪里幼多疾時太祖為塔瑪噶賽特常加撫育神冊六年為特哩衮從太祖將龍軍討準布党項有功天贊三年為南院額爾奇木征渤海攻輝罕城俘斬甚衆太祖崩淳欽皇后稱制欲以大元帥嗣位迪里建言帝位宜先嫡長東丹王當立由是忤㫖以黨附東丹王詔下獄訊鞫加以炮烙不伏殺之籍其家安圖自幼若成人居父喪哀毁過禮見者傷之太宗屢加慰諭嘗曰此兒必為令器既長寡言笑重然諾動遵繩矩事母至孝以父死非罪未葬不預宴樂世宗在藩邸尤加憐恤安圖密自結納太宗伐晉還至欒城崩諸將欲立世宗以魯呼及夀安王在朝猶豫未決時安圖直宿衞世宗密召問計安圖曰大王聰安寛恕人皇王之嫡長先帝雖有夀安天下屬意多在大王今若不斷後悔無及㑹有自京師來者安圖詐以魯呼死傳報軍中皆以為信於是安圖詣北南二大王計之北院大王斡聞而遽起曰吾二人方議此事先帝嘗欲以永康王為儲貳今日之事有我輩在孰敢不從但恐不白太后而立為國家啟釁安圖對曰大王既知先帝欲以永康王為儲副況永康王賢明人心樂附今天下甫定稍緩則大事去矣若白太后必立魯呼且魯呼殘暴行路共知果嗣位如社稷何南院大王吼曰此言是也吾計決矣乃整軍召諸將奉世宗即位于太宗柩前帝立以安圖為腹心總知宿衞是嵗約和于潢河横渡太后問安圖曰吾與汝有何隙安圖以父死為對太后黙然及置北院樞密使上命安圖為之賜奴婢百口寵任無比事皆取決焉然性太寛事循苟簡豪猾縱恣不能制天祿末察克兵犯御幄又不能討由是中外短之穆宗即位以立世宗之故不復委用應厯三年或誣安圖與齊王雅斯哈謀亂繫獄死姪索吉左皮室詳衮耶律斡字逹年隋國王實嚕孫南院額爾奇木烏蘇子少簡重有器識太祖時雖未官而常任以事太宗即位乃為特哩衮天顯末帝援河東斡為先鋒敗張敬達軍於太原北會同中遷北院大王及伐晉復為先鋒與梁漢璋戰於瀛州敗之太宗崩于欒城南方州郡多叛士馬困乏軍中不知所為斡與耶律吼定䇿立世宗乃令諸將曰大行上賔神器無主永康王人皇王之嫡長天人所屬當立有不從者以軍法從事諸將皆曰諾世宗即位賜官户五十拜裕悦卒年五十四耶律托雲字托紐孟父楚國王之後父摩綽為額爾奇木托雲性端直㑹同中領九錫林部政濟寛猛世宗即位為特哩衮天祿三年兼政事令封漆水郡王穆宗立以匡贊功嘗許以本部大王後將葬世宗托雲懇言於帝曰臣蒙先帝厚恩未能報幸及大葬臣請陪位帝由是不悦寢其議薨耶律塔拉字尼嚕古六院部郎君尼古察之後沉厚多智有任重才年四十未仕㑹同間為邊部令公應厯初陞南院大王均賦役勸耕稼部人化之户口豐殖時周人侵漢以塔拉都統西南道軍援之周已下太原數城漢人不敢戰及聞塔拉兵至周主遣郭從義尚鈞等率精騎拒於忻口塔拉擊敗之獲其將史彦超周軍遁歸復所䧟城邑漢主詣塔拉謝及漢主殂宋師來伐上命塔拉為行軍都統發諸道兵救之既出鴈門宋諜知而退保寧元年加兼政事令致政乾亨初召之上見鬚髪皓然精力猶健問以政事厚禮之以疾薨年七十九塔拉凡用兵賞罰信明得士卒心河東單弱不為周宋所併者塔拉有力焉在治所不修邊幅百姓無稱年榖屢稔時耶律烏哲居北院塔拉居南院俱有政迹朝議以為富民大王云贊曰立嗣以嫡禮也太宗崩非安圖吼斡謀而克斷䇿立世宗非烏哲直而能諌杜太后之私折魯呼之暴以成横渡之約則亂將誰定四臣者庶幾春秋首止之功哉遼史卷七十七遼史卷七十七考證耶律烏哲傳五年五月薨五年原本作是年考景宗紀保寧五年五月裕悦烏哲薨今據改耶律吼傳臣從弟達魯諸子坐事籍没達魯原本作的琭世宗紀又作的魯今併改耶律安圖傳曽祖揚珠元祖之長子揚珠原本作巖本皇族表作巖术皇子表作巖本皆傳寫之訛今併改又皇子表元祖長子曰瑪嚕揚珠其第二子也與傳亦互異父迪里神冊六年為特哩衮從太祖將龍軍討準布党項有功天贊三年為南院額爾奇木征渤海按太祖紀神册六年迪里為特哩衮天贊三年五月為南院額爾奇木九月從太祖討準布略地西南天顯元年正月從征渤海是年太祖崩十一月迪里被殺前後序次秩然今傳以迪里從討準布屬之神冊六年而從征渤海又不繫以天顯元年殊屬疎畧耶律塔喇傳周主遣郭從義尚鈞等率精騎拒於忻口按五代歐史周木紀漢世家俱作符彦卿穆宗紀及契丹國志正同通鑑又作李筠張永徳亦無郭從義尚鈞之名皆傳聞異詞也遼史卷七十七考證
