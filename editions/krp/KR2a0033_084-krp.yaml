body:
  text: 遼史卷八十四元中書右丞相總裁托克托等修列傳第十四耶律沙耶律穆濟蕭斡托果耶律善補耶律哈里耶律沙字安隱其先嘗相約尼氏應厯間累官南府宰相景宗即位總領南靣邉事保寧間宋攻河東沙將兵救之有功加守太保乾亨初宋復北侵沙將兵由間道至白馬嶺阻大澗遇敵沙與諸將欲待後軍至而戰冀王迪里監軍耶律穆濟等以為急擊之便沙不能奪迪里等以先鋒渡澗未半為宋人所擊兵潰迪里及其子斡格沙之子徳里令公圖敏詳衮唐古等五將俱没㑹北院大王耶律色珍兵至萬矢俱發敵軍始退沙將趨太原㑹漢駙馬都尉盧俊來奔言太原已䧟遂勒兵還宋乗鋭侵燕沙與戰于高梁河稍却遇耶律休格及色珍等邀擊敗宋軍宋主宵遁至涿州微服乗驢車間道而走上以功釋前過是年復從韓匡嗣伐宋敗績帝欲誅之以皇后營救得免睿智皇后稱制召賜几杖以優其老復從伐宋敗劉廷讓李敬源之軍賜賚優渥統和六年卒耶律穆濟字留隱仲父隋國王之後初以皇族入侍景宗即位為林牙以幹給稱保寧間遷樞密副使宋攻河東南府宰相耶律沙為都統將兵往援穆濟監其軍及白馬嶺之敗僅以身免宋乗鋭攻燕將奚兵翌休格擊敗之上以功釋前過十一年從都統韓匡嗣伐宋戰于滿城為宋將所紿諸軍奔潰獨穆濟部伍不亂徐整旗皷而歸璽書褒諭改南海軍節度使乾亨二年拜樞密副使統和初為南京留守宋將曹彬米信等侵邉穆濟引兵至南京先繕守禦備及車駕臨幸穆濟與耶律休格逆戰于涿之東克之遷開逺軍節度使故事州民嵗輸税斗粟折錢五穆濟表請折錢六部民便之統和末卒蕭斡小字轄哩字博迪北府宰相達魯之子性質直初察克之亂其黨和克齊與斡善使人召之斡曰吾豈能從逆臣縛其人送壽安王賊平上嘉其忠拜羣牧都林牙以伐烏爾古功遷北府宰相改圖魯卜部節度使乾亨初宋伐河東乗勝侵燕詔斡拒之戰于高梁河耶律沙退走斡與耶律休格等併力戰敗之上手勅慰勞自是毎征伐必參決軍事加政事令二年宋兵圍瓦橋夜襲我營斡及耶律允古戰却之時皇后以父呼斡及后為皇太后稱制斡數條奏便宜多見聽用統和四年卒姪托果托果字括寧性忠簡應厯初始入待㑹冀王迪里宣徽使哈斯謀反托果與耶律阿里密告於上上嘉其忠詔尚朴謹公主保寧末為南京統軍使乾亨初宋侵燕托果與北院大王希達拒之不克軍潰托果等不敢復戰退屯清河帝聞其敗遣使責之曰卿等不嚴偵候用兵無法遇敵即敗奚以將為托果懼頃之援兵至托果奮力以敗宋軍上釋其罪降為南京侍衛親軍都指揮使四年卒耶律善補字瑤昇孟父楚國王之後純謹有才智景宗即位授千牛衛大將軍遷大同軍節度使及伐宋韓匡嗣與耶律沙將兵由東路進善補以南京統軍使由西路進善補聞匡嗣失利斂兵還乾亨末與宋軍戰于滿城為伏兵所圍色珍救之獲免以失備决大杖統和初為特哩衮㑹宋來侵善補為都元帥逆之不敢戰嶺西州郡多䧟罷特哩衮以其叔安圖有匡輔世宗功上愍之徴善補為南府宰相遷南院大王㑹再舉伐宋欲攻魏府召衆集議將士以魏城無備皆言可攻善補曰攻固易然城大叵量若克其城士卒貪俘掠勢必不可遏且傍多巨鎮各出援兵内有重敵何以當之上乃止善補性懦守静凡征討憚攻戰急還以故戰多不利年七十四卒耶律哈里字留隱令公巴爾達木長子察克之亂其母達魯與焉遣人召哈里哈里拒之亂平達魯以子故獲免哈里儉素不喜聲利以射獵自娯雖居閒人敬之若貴官然保寧初拜彰國軍節度遷特哩衮秩滿稱疾不仕久之復為南院大王及曹彬米信等來侵哈里有却敵功賜資忠保義匡國功臣帝屢親征哈里在南院十餘年鎮以寛静户口增給時議重之封漆水郡王遷上京留守薨詔以家貧給葬具論曰當高梁朔州之捷偏裨之將如沙與穆濟既因休格色珍類見其功所謂失之東隅收之桑榆若蕭斡哈里拒察克之招托果告哈斯之變則不止有戰功而已其視善補畏懦豈不優哉遼史卷八十四遼史卷八十四考證蕭斡傳時皇后以父呼斡按本傳載后為皇太后稱制葢睿智皇后也考外戚表睿智皇后父思温係蕭氏第二世斡係第三世固后兄弟行也而以父呼斡殊不可解蕭托果傳尚朴謹公主按公主表並無朴謹公主外戚表亦止稱托果為平章政事不稱駙馬都尉疑朴謹公主非皇女也遼史卷八十四考證
