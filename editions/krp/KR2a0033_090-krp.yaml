body:
  text: 遼史卷九十元中書右丞相總裁托克托等修列傳第二十蕭阿拉耶律義先耶律信先蕭托輝蕭塔喇噶耶律達魯蕭阿拉字額哩埒北院樞宻使孝穆之子也幼養宫中興宗尤愛之重熙六年為𢎞義宫使累遷同知北院樞密使加同中書門下平章事出為東宫留守二十一年拜西北路招討使封西北郡王尋尚秦晉國王公主拜駙馬都尉清寜元年遺詔拜北府宰相兼南院樞密使進王韓明年改北院樞密使徙王陳與蕭格同掌國政格謟䛕不法阿拉爭之不得告歸上由此惡之除東京留守㑹行色克色哩禮入朝陳時政得失格以事中傷帝怒縊殺之皇太后營救不及大慟曰阿拉何罪遽見殺帝優加賻贈葬乾陵之赤山阿拉忠果曉世務有經濟才議者以謂阿拉若在無重元伊遜之亂耶律義先裕悦仁先之弟也美風姿舉止嚴重重熙初補祇候郎君班詳衮十三年車駕西征為十二行糺都監戰功最改南院宣徽使時蕭格同知樞密院事席寵擅權義先疾之因侍讌言于帝曰格狡佞喜亂一朝大用必誤國家言甚激切不納它日侍宴上命羣臣博負者罰一巨觥義先當與格對憮然曰臣縦不能進賢退不肖安能與國賊博哉帝止之曰卿醉矣義先厲聲詬不已上大怒賴皇后救得解翌日上謂格曰義先無禮當黜之格對曰義先天性忠直今以酒失而出誰敢言人之過上謂格忠直益加信任義先欝欝不自得然議事未嘗少沮又於上前博義先祝曰向言人過冐犯天威今日一擲可表愚款俄得堂印上愕然十六年為殿前都㸃檢討富珠哩多所招降獲其酋長托多羅以歸手詔褒奬以功改南京統軍使封武昌郡王奏請統軍司錢營息以贍貧民未朞軍器完整民得休息二十一年拜特哩衮進王富春薨年四十二義先嘗戒族人曰國中三父房皆帝之昆弟不孝不義尤不可為其接下無貴賤賢否皆與均禮其妻晉國長公主之女每遇中表親非禮服不見故内外多化之清寜間追贈許王弟信先信先興宗以其父貴音為刺血友幼養于宫善騎射重熙十四年為左䕶衛太保同知殿前㸃檢司事十八年兼右祇候郎君班詳衮上問所欲信先曰先臣貴音與陛下分如同氣然不及王封儻使䝉恩地下臣願畢矣上曰此朕遺忘之過追封燕王是年從蕭恵伐夏敗於河南例被責清寜初為南面林牙卒蕭托輝字烏庫哩宰相轄達六世孫剛直有威重咸雍初任馬羣太保素知羣牧名存實亡悉閲舊籍除其羸病錄其實數牧人畏服托輝上書曰羣牧以少為多以無為有上下相䝉積弊成風不若括見真數著為定籍公私兩濟従之畜産嵗以蕃息太康中累遷契丹行宫都部署上嘗謂羣臣曰北樞密院軍國重任久闕其人耶律阿蘇蕭額特埒二人孰愈羣臣各譽所長托輝獨黙然上問卿何不言托輝曰額特埓懦而敗事阿蘇有才而貪将為禍基不得已而用敗事猶勝基禍上曰托輝雖魏徴不能過但恨吾不及太宗爾然竟以阿蘇為樞密使由是阿蘇銜之九年西圉不寜阿蘇奏曰邉隅事大可擇重臣鎮撫上曰托輝何如阿蘇曰誠如聖㫖遂拜西南面招討使阿蘇隂與蕭阿古岱誣奏賊掠漠南牧馬及居民畜産托輝不急追捕罪當死詔免官久之起為塔布城節度使未行疽發背卒托輝負氣怒則須髯輒張每有大議必毅然決之雖上有難色未嘗遽已見權貴無少屈竟為阿蘇所䧟時人惜之二子曰圖們錫實阿蘇死始獲進用蕭塔喇噶字托實六院部人素剛直太祖時坐叔祖特依順謀殺裕悦實嚕没入𢎞義宫世宗即位以舅氏故出籍補國舅别部敞史或言泰寜王察克有無君心塔喇噶曰彼縦忍行不義人孰肯從他日侍宴酒酣塔喇噶捉察克耳强飲之曰上固知汝傲狠然以國屬曲加矜憫使汝在左右且度汝才何能為若長惡不悛徒取赤族之禍察克不能答强笑曰何戯之虐也天禄末塔喇噶為北府宰相及察克作亂塔喇噶醉詈曰吾悔不殺此逆賊尋為察克所害耶律達魯字陽隠孟父楚國王之後性質直多膂力察克作亂達魯聞之入見夀安王慷慨言曰願得精兵數百破賊黨王嘉其忠穆宗即位為北院宣徽使上以飛狐道狭詔達魯廣之明年将兵援河東至太原與漢王㑹于髙平撃周軍敗之仍降其衆忻代二州叛将兵討之㑹耶律塔喇至敗周師於忻口師還卒論曰忠臣惟知有國而不知有身故惡惡不避其患阿拉以諂諛不法折蕭格托輝以用必基禍言阿蘇塔喇噶以忍行不義徒自取赤族之罪責察克其心可謂忠矣言一出而禍輒隨之吁邪正既不辨國焉得無亂哉遼史卷九十
