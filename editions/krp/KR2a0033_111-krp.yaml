body:
  text: 遼史卷一百十一元中書右丞相總裁托克托等修列傳第四十一姦臣下蕭額哩頁字額圗琿國舅阿拉次子便佞滑稽善女工重熙間以外戚進清寧初補祗候郎君尚鄭國公主拜駙馬都尉累遷南面林牙以父阿拉為蕭格所譛出額哩頁為奉先軍節度使十年冬召為北面林牙咸雍中㑹有告額哩頁與族人珠展謀害耶律伊遜按無狀出為寧逺軍節度使自後額哩頁揣伊遜意傾心事之薦為國舅詳衮太康初封遼西郡王時伊遜擅恣凡不附已者出之乃引額哩頁為北府宰相兼知契丹行宫都部署事及伊遜謀搆皇太子額哩頁多助成之遂知北院樞密事賜推誠協贊功臣以女姪妻伊遜子蘇頁恃勢横肆至有無君之語朝野側目帝出伊遜知南院大王事坐與伊遜黨以天平軍節度使歸第尋拜西北路招討使以母憂去官卒耶律赫嚕字和爾沁六院錫里尼古察之後柔佞喜苟合仕清寧初時伊遜引用羣小赫嚕附之遂見委任俄擢南面林牙伊遜譛皇太子殺忠直赫嚕多預其謀弟烏頁亦黨伊遜時號二賊伊遜薦為北院大王卒烏頁亦至南院大王蕭塔喇台約尼温汗宫分人善阿意順辭色清寧初伊遜用事甚見引用累遷北面林牙同知北院宣徽使事及皇太子廢遣塔喇台監送上京塔喇台促其行不令下車起居飲食數加陵侮至則築圜堵囚之太康中遷西南招討使歴順義軍節度使轉國舅詳衮壽隆五年坐怨望以老免死闔門籍興聖宫貶西北統軍司卒二子特黙額埒乾統間以父與伊遜謀伏誅蕭額圗琿國舅少父房之後咸雍中補牌印郎君太康三年樞密使伊遜陰懐逆謀乃令䕶衛太保耶律扎拉誣告耶律薩喇等廢立事詔按無狀皆補外頃之額圗琿希伊遜意欲實其事與耶律托卜嘉等入闗誣奏耶律薩喇等謀害伊遜欲立皇太子事臣亦預謀今不自言恐事泄連坐帝果怒徙皇太子于上京額圗琿尚皇女趙國公主為駙馬都尉後與伊遜議不合銜之復以車服僭擬人主被誅額圗琿臨刑語人曰前告耶律薩喇事皆伊遜敎我恐事彰殺我以滅口耳蕭達嚕噶約尼繅古汗宫分人心術姦險清寧間伊遜為樞宻使竊權用事陰懐逆謀達嚕噶比附之遂見奬拔稍遷至旗鼓伊喇詳衮伊遜欲害太子以達嚕噶兇果可使遣與近侍直長薩巴詣上京同留守蕭塔坦夜引力士至囚室紿以有赦召太子出殺之函其首以歸詐云疾薨以達嚕噶為國舅詳衮達嚕噶恐殺太子事白出入常佩刀有急召即欲自殺乾統間詔樞密使耶律阿蘇大索伊遜黨人達嚕噶以賂獲免後以疾卒耶律托卜嘉仲父房之後以善擊鞠幸於上凡馳騁鞠不離杖咸雍初補祗候郎君與耶律伊遜善故内外畏之及太子被譛按無迹托卜嘉附伊遜欲實其誣與額圖琿等密奏太子謀亂事本實臣不首恐事覺連坐帝信之廢太子改追慶宫副使壽隆元年為行宫都部署天祚嗣位以托卜嘉黨伊遜出為特們部節度使及樞密使耶律阿蘇大索伊遜舊黨托卜嘉以賂免徙德哷勒部節度使復為敦睦宫使天慶元年出為西北路招討使以疾卒蕭特古斯字和寧卓特部人仕重熙中以能稱累遷左中丞清寧初厯北面林牙改北院樞密副使辨敏善伺顔色應對合上意皇太后嘗曰有大事非耶律華格蕭特古斯不能决眷遇日隆知北院樞密使亊六年出知黄龍府八年拜南府宰相頃之為北院樞密使詔許便宜從事為人姦佞有餘好聚歛專愎變更法度為樞密數月所薦引多為重元黨與由是免為庶人後没入興聖宫卒論曰舜流共工孔子誅少正卯治姦之法嚴矣後世不是之察反以為忠而信任之不至於流毒宗社而未已道宗之於伊遜是也當其留仁先討重元若真為國計者不知包藏禍心待時而發耳一旦專權又得孝傑雅克錫沙為腹心故肆惡而無忌憚始誣皇后又殺太子及其妃其禍之酷良可悲哉嗚呼君之所親莫皇后太子若也姦臣殺之而不知羣臣言之而不悟一時忠讜廢戮幾盡雖黒山親見官屬之盛僅削一字王號至私藏甲兵然後誅之吁伊遜之罪固非一死可謝天下抑亦道宗不明無斷有以養成之也如蕭額哩頁輩忘君黨惡以饕富貴雖幸而死諸牖下其得免於遺臭之辱哉遼史卷一百十一
