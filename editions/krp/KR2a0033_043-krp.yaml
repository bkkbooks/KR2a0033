body:
  text: 遼史卷四十三元中書右丞相總裁托克托等修志第十三厯象志中閏考月度不足是生朔虚天行有餘是為氣盈盈虚相懸嵗月乃牉積牉而差寒暑互易百穀不成庶政不明聖人驗以斗柄準以歲星爰立閏法信治百官是故閏正而月正月正而歲正歲月既正頒令考績無有不時國史正歲年以敘事莫重於此遼始徵厯梁唐入晉之後奄有帝制乙未大明厯法再變穆宗應厯六年周用顯徳欽天厯十年宋用建隆應天厯景宗乾亨四年宋用乾元厯聖宗統和十九年宋用儀天厯太平元年宋用崇天厯道宗清寧十年宋用明天厯大康元年宋用奉元厯大安七年宋用觀天厯天祚皇帝乾統六年宋用紀遼史卷四十三遼史卷四十三考證㑹同七年按原本於㑹同七年旁書缺酉二字不可解當係缺一閏三字之訛耳查本紀及朔考並載㑹同五年閏三月此志遺漏今刪缺酉二字並識補遺大同元年按本紀及朔考改大同元年為天祿元年原刻誤書大同九年今據改開泰九年按聖宗紀開泰九年不載閏月惟考七月係庚戌朔若閏在正月不應庚戌為七月朔又十二月為丁亥月明年正月為丁丑朔丁亥至丁丑五十日中間自有閏月當與宋閏十二月同此云閏正月與宋閏異者當誤而朔考又云閏二月當亦誤也太康九年大安四年按太康九年至大安四年中間六年應有一閏考宋哲宗紀元祐元年閏二月元祐元年當遼道宗大安二年也又考道宗紀大安二年雖不載閏月但二月載有癸酉日三月載有乙酉日以朔考云二月庚申朔推之癸酉係二月十四日乙酉係二月二十六日若三月又有乙酉日則中間必閏二月矣此既失載朔考又第云缺一閏殊略遼史卷四十三考證
