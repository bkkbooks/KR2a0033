body:
  text: 遼史卷六十七元中書右丞相總裁托克托等修表第五外戚表漢外戚有新室之患晉宗室有八王之難遼史耶律蕭氏十居八九宗室外戚勢分力敵相為唇齒以翰邦家是或一道然以是而興亦以是而亡又其法之弊也契丹外戚其先曰二舒敏氏曰巴哩曰伊蘇濟勒至遼太祖娶舒嚕氏舒嚕本囘鶻諾蘇後大同元年太宗自汴將還留外戚小漢為汴州節度使賜姓名曰蕭翰以從華俗由是巴哩伊蘇濟勒舒嚕三族皆為蕭姓巴哩二房曰大父少父伊蘇濟勒亦二房曰大翁小翁世宗以舅氏塔喇噶為國舅别部三族世預北宰相之選自太祖神冊二年命阿古齊始聖宗合巴哩伊蘇濟勒二國舅帳為一與别部為二此遼外戚之始末也作外戚表遼史卷六十七遼史卷六十七考證五世祖哈瑪爾北府宰相達魯按哈瑪爾為大父房最逺祖距達魯五世中間不可考原本列入第一世而以達魯為第二世實非父子也見達魯傳北院樞密使惠西北招討使慈氏努按蕭惠傳惠二子一為慈氏努其一為兀古匿終北府宰相表于慈氏努之次並未列入轉於下二格之旁列乙古蒲匿二名疑即兀古匿之訛然紀傳無可旁證今存其舊仍譯改為伊庫布尼二名以符體例使相薩瑪蘭陵郡王徳勒岱茂薩薩瑪原本作撒磨按徳勒岱傳又作撒鉢茂薩原本作磨撒按本傳又作麽撒今畫一改訂宰相塔喇按蕭迪里傳迪里為塔喇四世孫表未列入而轉列和克及巴拉名按和克為迪里族子乃塔喇之五世孫巴拉為迪里弟乃和克之父行又不應與和克平列舛訛叠出今附考以識其訛南院樞密使朴按蕭朴子多喇官國舅部詳衮見朴傳表未列入殊畧遼史卷六十七考證
