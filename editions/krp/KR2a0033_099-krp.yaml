body:
  text: 遼史卷九十九元中書右丞相總裁托克托等修列傳第二十九蕭巖壽耶律薩喇蕭蘇色耶律托卜嘉蕭托卜嘉蕭和克耶律實嚕蕭巖壽伊實部人性剛直尚氣仕重熈末道宗即位皇太后屢稱其賢由是進用上出獵較巖壽典其事未嘗高下于心帝益重之歴文班太保同知樞密院事咸雍四年從耶律仁先伐準布破之有詔留屯亡歸者衆由是鐫兩官十年討徳哷勒有功為其部節度使太康元年同知南院宣徽使事遷北面林牙密奏伊遜以皇太子知國政心不自安與張孝傑數相過從恐有隂謀動揺太子上悟出伊遜為中京留守㑹伊遜生日上遣近臣耶律拜薩巴賜物為壽伊遜因私屬白上臣見姦人在朝陛下孤危身雖在外竊用寒心拜薩巴還以聞上遣人賜伊遜車諭曰無慮弗用行將召矣由是反疑巖壽出為順義軍節度使伊遜復入為樞密使流巖夀于威路終身拘作巖壽雖竄逐恒以社稷為已憂時人為之語曰以狼牧羊何能久長三年伊遜誣巖壽與謀廢立事執還殺之年四十九乾統間贈同中書門下平章事繪像宜福殿巖壽亷直靣折廷諍多與伊遜忤故及於難耶律薩喇字董隱南院大王穆爾古之孫性忠直沉厚清寧初累遷西南靣招討使以治稱咸雍九年改北院大王未幾為契丹行宫都部署太康二年耶律伊遜為中京留守詔百官廷議欲復召之羣臣無敢正言薩喇獨奏曰蕭巖壽言伊遜有罪不可為樞臣故陛下出之今復召恐天下生疑進諫者三不納左右為之震悚伊遜復為樞密使見薩喇讓曰與君無憾何獨異議薩喇曰此社稷計何憾之有伊遜誣薩喇與蘇色同謀廢立詔按無迹出為始平軍節度使及蕭額圗琿誣首竟遣使殺之乾統間追封漆水郡王繪像宜福殿仍追贈三子官爵蕭蘇色字圖勒錦圖魯卜部人性沉毅重熈間累遷右䕶衛太保富珠哩叛從耶律義先往討執首亂托多羅以歸清寧中歴北靣林牙彰國軍節度使入為北院樞密副使咸雍十年經畧西南邉撤宋堡障戍以皮室軍上嘉之太康二年知北院樞密使耶律伊遜權寵方盛附麗者多至通顯蘇色未嘗造門伊遜䘖之誣構蘇色首謀廢立按之無驗出為上京留守伊遜復令蕭額圗琿以前事誣告上怒不復加訊遣使殺之時方盛暑尸諸原野容色不變烏鵲不敢近乾統間追封蘭陵郡王繪像宜福殿耶律托卜嘉字薩巴系出季父房父果嘉仕至林牙重熈間破夏人于金肅軍有功優加賞賚托卜嘉清寧中補牌印郎君累遷永興宫使九年平重元之亂以功知㸃檢司事賜平亂功臣為懐徳軍節度使咸雍五年遷約尼剋太康三年授北院宣徽使耶律伊遜謀害太子托卜嘉知其姦欲殺伊遜及蕭塔喇台蕭錫沙等伊遜知之令其黨誣構托卜嘉與廢立事殺之乾統間追封漆水郡王繪像宜福殿蕭托卜嘉字烏拉丹國舅郡王果濟之孫性剛直咸雍中補祇候即君太康元年為彰愍宫使尚趙國公主拜駙馬都尉三年改同知漢人行宫都部署與北院宣徽使耶律托卜嘉善伊遜嫉之令人誣告謀廢立事不勝搒掠誣伏上引問昏瞶不能自陳遂見殺乾統間追封蘭陵郡王繪像宜福殿蕭和克字阿爾斯蘭性忠直趫捷有力補禁軍咸雍初從招討使耶律卓克算討番部之違命者及請降來介有能躍駞峯而上者以儇捷相詫卓克算問誰能此和克被重鎧而出手不及峯一躍而上使者大駭卓克算以女妻之帝聞召為䕶衛時北院樞密使耶律伊遜以狡侫得幸肆行兇暴和克伏于橋下伺其過欲殺之俄以暴雨壊橋不果後又欲殺于獵所為親友所阻太康三年復欲殺伊遜及蕭塔喇台等伊遜知而械繫之考劾不服流于邉及太子廢徙于上京召和克至殺之乾統初追贈龍虎衛上將軍耶律實嚕字楚旺六院部人祖圖丹南院大王父愛實統軍副使實嚕性剛直有經世志始為牌印郎君太康初為伊勒希巴郎君時樞密使耶律伊遜誣殺皇后謀廢太子斥忠賢進姦黨實嚕惡所為伊遜覺之太子既廢以實嚕附太子流鎮州天祚即位召為御史中丞時方治伊遜黨有司不以為意實嚕上書曰臣前為姦臣所䧟斥竄邉郡幸䝉召用不敢隱黙恩賞明則賢者勸刑罰當則姦人消二者既舉天下不勞而治臣見耶律伊遜身出寒微位居樞要竊權肆惡不勝名狀蔽先帝之明誣䧟順聖構害忠讜敗國罔上自古所無頼廟社之休陛下獲纂成業積年之寃一旦洗雪政陛下英㫁克成孝道之秋如蕭塔喇台實伊遜之黨耶律赫嚕亦不為早辨頼陛下之明遂正其事臣見陛下多疑故有司顧望不切推問伊遜在先帝朝權寵無比先帝若以順考為實則伊遜為功臣陛下豈得立耶先帝黜逐嬖后詔陛下在左右是亦悔前非也陛下詎可忘父讐不報寛逆黨不誅今靈骨未獲而求之不切傳曰聖人之徳無加于孝昔唐徳宗因亂失母思慕悲傷孝道益著周公誅飛亷惡來天下大悦今逆黨未除大寃不報上無以慰順考之靈下無以釋天下之憤怨氣上結水旱為沴臣願陛下下明詔求順考之瘞所盡收逆黨以正邦憲快四方忠義之心昭國家賞罰之用然後致治之道可得而舉矣謹别録順聖升遐及伊遜等事昧死以聞書奏不報聞者莫不歎惋乾統中遥授静江軍節度使卒子瑪格同中書門下平章事論曰易言履霜堅氷至謹始也使道宗能從巖壽薩喇之諫后何得而誣太子何得而廢哉蘇色托卜嘉以忠言見殺國欲無亂得乎實嚕之書亦幸出於伊遜既敗之後獲行其説有國家者可不知人哉遼史卷九十九遼史卷九十九考證蕭巖壽傳出伊遜為中京留守按中京原本作上京考道宗本紀及伊遜傳俱作中京今據改耶律薩喇傳咸雍九年改北院大王按道宗本紀咸雍九年十二月以南院宣徽使耶律薩喇為南院大王傳稱北院大王既與紀異且不載其官宣徽使殊畧耶律托卜嘉傳欲伊遜及葉徳勒岱等殺按徳勒岱舊作得里特此處原本復作特里得今畫一改遼史卷九十九考證
