body:
  text: 遼史卷五十九元中書右丞相總裁托克托等修志第二十八食貨志上契丹舊俗其富以馬其彊以兵縱馬於野弛兵於民有事而戰彍騎介夫卯命辰集馬逐水草人仰湩酪挽强射生以給日用糗糧芻茭道在是矣以是制勝所向無前及其有國内建宗廟朝廷外置郡縣牧守制度日增經費日廣上下相師服御浸盛而食貨之用斯為急矣於是五京及長春遼西平州置鹽鐵轉運度支錢帛諸司以掌出納其制數差等雖不可悉而大要散見舊史若農榖租賦鹽鐵貿易坑冶泉幣羣牧逐類採摭緝而為篇以存一代食貨之畧皇祖伊徳實為大徳哷勒府額爾竒木喜稼穡善畜牧相地利教民耕仲父蘇哷為裕悦飭國人樹桑麻習組織太祖平諸弟之亂弭兵輕賦專意於農嘗以户口滋繁糺轄疎逺分北達寜額為二部程以樹藝諸部效之太宗㑹同初將東獵三尅奏減輜重疾趨北山取物以備國用無害農務尋詔有司勸農桑教紡績以烏爾古之地水草豐美命諤爾琨錫林居之益以哈里水之善地為農田三年以嘉哩河臚朐河地賜南院鄂津特埓哩伊遜巴勒北院烏納哈喇三錫林人耕種八年駐蹕赤山宴從臣問軍國要務左右對曰軍國之務愛民為本民富則兵足兵足則國彊上深然之是年詔徴諸道兵仍戒敢有傷禾稼者以軍法論應厯間雲州進嘉禾時謂重農所召保寜七年漢有宋兵使來乞糧詔賜粟二十萬斛助之非經費有餘其能若是聖宗乾亨五年詔曰五稼不登開帑藏而代民税螟蝗為災罷徭役以恤饑貧帝嘗過藁城見伊實阿爾威部婦人達年等黍過熟未穫遣人助刈太師韓徳讓言兵後逋民棄業禾稼棲畆募人穫之以半給穫者政事令室昉亦言山西諸州給軍興民力凋敝田榖多躪於邊兵請復今年租六年霜旱災民饑詔三司舊以稅錢折粟估價不實其增以利民又徙濟必寨居民三百户於檀順薊三州擇沃壤給牛種榖十三年詔諸道置義倉嵗秋社民隨所獲户出粟庤倉社司籍其目嵗儉發以振民統和十五年詔免南京舊欠義倉粟仍禁諸軍官非時畋牧妨農開泰元年詔曰朕惟百姓徭役煩重則多給工價年榖不登發倉以貸田園蕪廢者則給牛種以助之太平初幸燕燕民以年豐進土産珍異上禮高年惠鰥寡賜酺連日九年燕地饑户部副使王嘉請造船募習海漕者移遼東粟餉燕議者稱道險不便而寢興宗即位遣使閲諸道禾稼是年通括户口詔曰朕於早嵗習知稼穡力辦者廣務耕耘罕聞輸納家食者全虧種植多至流亡宜通檢括普為均平禁諸職官不得擅造酒糜榖有婚祭者有司給文字始聽道宗初年西北雨榖三十里春州斗粟六錢時西番多叛上欲為守禦計命耶律唐古督耕稼以給西軍唐古率衆田臚朐河側嵗登上熟移屯鎮州凡十四稔積粟數十萬斛毎斗不過數錢以馬人望前為南京度支判官公私兼裕檢括户口用法平恕乃遷中京度支使視事半嵗積粟十五萬斛擢左散騎常侍遼之農榖至是為盛而東京如咸信蘇復辰海同銀烏遂春泰等五十餘城内㳂邊諸州各有和糴倉依祖宗法出陳易新許民自願假貸收息二分所在無慮二三十萬石雖累兵興未嘗用乏迨天慶間金兵大入盡為所有㑹天祚播遷耶律迪里等逼立梁王雅里令羣牧人户運鹽濼倉粟人户侵耗議籍其産以償雅里自定其直粟一車一羊三車一牛五車一馬八車一駞從者曰今一羊易粟二斗尚不可得此直太輕雅里曰民有則我有若今盡償衆何以堪事雖無及然使天未絶遼斯言亦足以收人心矣夫賦稅之制自太祖任韓廷徽始制國用太宗籍五京户丁以定賦稅户丁之數無所於考景宗乾亨間以上京雲威户貲具實饒善避繇役遺害貧民遂勒各户凡子錢到本悉送歸官與民均差統和中耶律昭言西北之衆每嵗農時一夫偵候一夫治公田二夫給糺官之役當時㳂邊各置屯田戍兵易田積榖以給軍饟故太平七年詔諸屯田在官斛粟不得擅貸在屯者力耕公田不輸稅賦此公田制也餘民應募或治閒田或治私田則計畆出粟以賦公上十五年募民耕灤河曠地十年始租此在官閒田制也又詔山前後未納稅户竝於密雲燕樂兩縣占田置業入稅此私田制也各部大臣從上征伐俘掠人户自置郛郭為頭下軍州凡市井之賦各歸頭下惟酒税赴納上京此分頭下軍州賦為二等也先是遼東新附地不𣙜酤而鹽麯之禁亦弛馮延休韓紹勲相繼商利欲與燕地平山例加繩約其民病之遂起大延琳之亂連年詔復其租民始安靖南京嵗納三司鹽鐵錢折絹大同嵗納三司税錢折粟開逺軍故事民嵗輸稅斗粟折五錢耶律穆濟守郡表請折六錢亦皆利民善政也遼史卷五十九遼史卷五十九考證以烏爾古水草豐美命諤爾琨錫林居之按太宗本紀㑹同二年十月詔北南院三錫林戸居烏爾古部此止載其一聖宗乾亨五年按乾亨無五年蓋在統和未改元以前五京戸丁之數無所於考按地理志具載戸數而鄉丁之數見於兵衛志但未免俱有遺漏耳景宗乾亨間按景宗原本作聖宗乾亨乃景宗年號統和未改元以前僅止數月本紀又不載雲威戸之詔卷内于乾亨五年之上冠以聖宗猶可云聖宗初立未改元以前事至此云乾亨間則實係景宗時事續通考載此事稱景宗今据改遼史卷五十九考證
