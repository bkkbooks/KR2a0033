body:
  text: 遼史卷九十六元中書右丞相總裁托克托等修列傳第二十六耶律仁先托卜嘉耶律良蕭罕嘉努蕭徳蕭惟信蕭約音努耶律迪里姚景行耶律阿蘇耶律仁先字扎林小字扎拉孟父房之後父貴音南府宰相封燕王仁先魁偉爽秀有智畧重熙三年補䕶衛帝與論政才之仁先以不世遇言無所隐授宿直將軍累遷殿前副㸃檢改和拉唐古部節度使俄召為北面林牙十一年陞北院樞密副使時宋請增歲幣銀絹以償十縣地産仁先與劉六符使宋仍議書貢宋難之仁先曰曩者石晉報徳本朝割地以獻周人攘而取之是非利害灼然可見宋無辭以對乃定議增銀絹十萬兩匹仍稱貢既還同知南京留守事十三年伐夏留仁先鎮邉未幾召為契丹行宫都部署奏復王子班郎君及諸宫雜役十六年遷北院大王奏今兩院戸口殷庶乞免他部助役從之十八年再舉伐夏仁先與皇太弟重元為前鋒蕭惠失利于河南帝猶欲進兵仁先力諌乃止後知北院樞密使遷東京留守女直恃險侵掠不止仁先乞開山通道以控制之邉民安業封吳王清寜初為南院樞密使以耶律華格譖出為南京兵馬副元帥守太尉更王隋六年復為北院大王民歡迎數百里如見父兄時北南院樞密尼嚕古蕭呼都克等忌之請以仁先為西北路招討使耶律伊遜奏曰仁先舊臣徳冠一時不宜補外復拜南院樞密使更王許七月上獵太子山耶律良奏重元謀逆帝召仁先語之仁先曰此曹兇狠臣固疑之久矣帝趣仁先捕之仁先出且曰陛下宜謹為之備未及介馬重元犯帷宫帝欲幸北南院仁先曰陛下若舍扈從而行賊必躡其後且南北大王心未可知仁先子托卜嘉曰聖意豈可違乎仁先怒擊其首帝悟悉委仁先以討賊事乃環車為營拆行馬作兵仗率官屬近侍三十餘騎陣抵枑外及交戰賊衆多降尼嚕古中矢墮馬擒之重元被傷而退仁先以五院部蕭塔喇所居最近亟召之分遣人集諸軍黎明重元率奚人二千犯行宫蕭塔喇兵適至仁先料賊勢不能乆竢其氣沮攻之乃背營而陣乘便奮擊賊衆奔潰追殺二十餘里重元與數騎遁去帝執仁先手曰平亂皆卿之功也加尚父進封宋王為北院樞密使親製文以褒之詔畫灤河戰圖以旌其功咸雍元年加裕悦改封遼王與耶律伊遜共知北院樞密事伊遜恃寵不法仁先抑之由是見忌出為南京留守改王晉恤孤惸禁姦慝宋聞風震服議者以為自裕悦休格之後惟仁先一人而已準布逹爾罕叛命仁先為西北路招討使錫鷹紐印及劒上諭曰卿去朝廷逺每俟奏行恐失機㑹可便宜從事仁先嚴斥堠扼敵衝懐柔服從庶事整飭達爾罕復來宼仁先逆擊追殺八十餘里大軍繼至又敗之巴爾斯土黙特等部來救見其屢挫不敢戰而降北邊遂安八年卒年六十遺命家人薄葬弟義先信先俱有傳子托卜嘉托卜嘉字和爾沁清寜二年補祗候郎君累遷永興宫使以平重元之亂遙授忠正軍節度使賜定亂功臣同知殿前㸃檢司事歴高陽臨海二軍節度使左皮室詳衮太康六年授西北路招討使率諸部酋長入朝加兼侍中自蕭逹魯為招討之後朝廷務姑息多擇柔愿者用之諸部漸至跋扈托卜嘉含容尤甚邊防益廢尋改西南面招討使準布酋長磨古斯來侵西北路招討使和囉木薩噶戰不利詔托卜嘉代之磨古斯為酋長由托卜嘉所薦至是遣人誘致之磨古斯紿降托卜嘉逆于鎮州西南沙磧間禁士卒無得妄動敵至禆將耶律鳥蘇徐烈見其勢鋭不及戰而走遂被害年五十八贈侍中諡曰貞憫托卜嘉少謹愿後為旌嫠婦所惑出其妻終以無子人以此譏之耶律良字錫納小字蘇著帳郎君之後生於乾州讀書醫巫閭山學既博將入南山肄業友人止之曰爾無僕御驅馳千里縱聞見古人年亦垂暮今若即仕已有餘地良曰窮通命也非爾所知不聴留數年歸重熙中補寢殿實達爾尋為燕趙國王近侍以家貧詔乘廐馬遷修起居注㑹獵秋山良進秋游賦上嘉之清寜中上幸鴨子河作捕魚賦由是寵遇稍隆遷知制誥兼知部署司事奏請編御製詩文目曰清寜集上命良詩為慶㑹集親製其序頃之為敦睦宫使兼權知皇太后宫諸局事良聞重元與子尼嚕古謀亂以帝篤於親愛不敢遽奏密言於皇太后太后託疾召帝白其事帝謂良曰汝欲間我骨肉耶良奏曰臣若妄言甘伏斧鑕陛下不早備恐墮賊計如召尼嚕古不來可卜其事帝從其言使者及門尼嚕古意欲害之羈於帳下使者以佩刀斷帟而出馳至行宫以狀聞帝始信亂平以功遷漢人行宫都部署咸雍初同知南院樞密使事為特哩衮出知中京留守事㝷卒帝嗟悼遣重臣賻祭給葬具追封遼西郡王諡曰忠成蕭罕嘉努字固寧奚長布倫之後以孝友稱太平中補祗候郎君累遷敦睦宫使伐夏為左翼都監遷北面林牙俄為南院副部署賜玉帶改奚六部大王治有聲清寧初封韓國公厯南京統軍使北院宣徽使封蘭陵郡王九年上獵太子山聞重元亂馳詣行在帝倉卒欲避于北南大王院與耶律仁先執轡固諫乃止明旦重元復誘奚獵夫来罕嘉努獨出諭之曰汝曺去順效逆徒取族滅何若悔過轉禍為福獵夫投仗首服以功遷殿前都㸃檢封荆王賜資忠保義奉國竭貞平亂功臣咸雍二年遷西南面招討使太康初徙王吳賜白海東青鶻皇太子為伊遜所搆幽于上京罕嘉努上書力言其寃不報四年復為西南面招討使例削一字王爵改王蘭陵薨子楊結終右祗候郎君班詳衮贈同中書門下平章事蕭徳字特們卓特部人性情和易篤學好禮法太平中領牌印直宿累遷北院樞宻副使敷奏詳明多稱上㫖詔與林牙耶律庶成修律令改契丹行宫都部署賜宫户十有五清寧元年遷同知北院樞宻使封魯國公上以徳為先朝眷遇拜南府宰相五年轉南京統軍使九年復為南府宰相重元之亂摧鋒力戰斬尼嚕古首以獻論功封漢王咸雍初以告老歸優詔不許久之加尚父致仕卒年七十二蕭惟信字伊聶卓特部人五世祖錫蘭南府宰相曽祖烏爾古中書令祖阿古齊知平州父果巴多智數博覽古今開泰初為北院承㫖遷右伊勒希巴以幹敏稱拜南府宰相累遷倒塌嶺節度使知興中府復為右伊勒希巴琳沁作亂事覺果巴按之止誅首惡餘並釋之歸奏稱㫖惟信資沈毅篤志于學能辨論重熙初始仕累遷左中丞十五年徙燕趙國王傅帝諭之曰燕趙左右多面䛕不聞忠言浸以成性汝當以道規誨使知君父之義有不可處王邸者以名聞惟信輔導以禮十七年遷北院樞宻副使坐事免官㝷復職兼北面林牙清寧九年重元作亂犯灤河行宫惟信從耶律仁先破之賜竭忠定亂功臣歴南京留守左右伊勒希巴復為北院樞宻副使太康中以老乞歸不聽樞宻使耶律伊遜譛廢太子中外知其寃無敢言者惟信數廷爭不得復告老加守司徒卒蕭約音努字布當奚六部詳衮圗魯卜六世孫父巴爾三歳居父母䘮毁瘠過甚養于家奴錫喇布重熙初興宗獵奚山過巴爾所居錫喇布言于近臣巴爾得見上時年甫十嵗氣象已如成人帝悦之錫賚甚厚既長有逺志不樂仕進隱于奚王嶺之察克谷上以其名家又有時譽就拜錫里軍詳衮約音努貌偉言辨通遼漢文字善騎射擊鞠所交皆一時名士年四十始為䕶衛平重元之亂以功遷䕶衛太保改本部南尅俄為旗鼓伊喇詳衮監障海東青鶻獲白花者十三賜榾柮犀并玉吐鶻拜五畨部節度使卒子陽阿有傳耶律迪里字薩蘭採訪使吼五世孫寛厚好學工文詞重熙末補牌印郎君兼知起居注清寧元年稍遷同知永州事禁盜有功改北面林牙承㫖九年重元作亂迪里赴援力戰平之遥授臨海軍節度使十年徙武安州觀察使咸雍五年累遷長寧宫使檢括户部司乾州錢帛逋負立出納經畫法公私便之太康四年為南院大王秩滿部民請留同知南京留守事有疾上命乗傳赴闕遣太醫視之遷上京大安中改塔布城節度使以疾致仕加兼侍中賜一品俸八年卒姚景行始名景禧祖漢英本周將應厯初来聘用敵國禮帝怒留之𨽻漢人宫分及景行既貴始出籍貫興中縣景行博學重熙五年擢進士乙科為将作監改燕趙國王教授不數年至翰林學士樞宻副使㕘知政事性敦厚廉直人望歸之道宗即位多被顧問為北府宰相九年秋告歸道聞重元亂收集行旅得三百餘騎勤王比至賊已平帝嘉其忠賜以逆人財産咸雍元年出為武定軍節度使明年驛召拜南院樞宻使上從容問治道引入内殿出御書及太子書示之賜什器車仗帝有意伐宋召景行問曰宋人好生邉事如何對曰自聖宗皇帝以威徳懐逺宋修職貢迨今㡬六十年若以細故用兵恐違先帝成約上然其言而止致仕不踰月復舊職丁家艱起復兼中書令上問古今儒士優劣占對稱㫖知興中府改朔方軍節度使太康初徙鎮遼興以上京多滯獄命為留守不數月以獄空聞累乞致政不從復請許之加守太師卒遣使弔祭追封桞城郡王諡文憲夀隆五年詔為立祠耶律阿蘇字薩巴清寧初補祗候郎君以善射掌獵事進渤海近侍詳衮重元之亂與䕶衞蘇射殺尼魯古賜號靖亂功臣徙契丹行宫都部署大安初為北院大王封漆水郡王夀隆初為北院樞密使監修國史道宗崩受顧命加裕悦錄伊遜黨人罪重者當籍其家阿蘇受賂多所寛貰蕭赫嚕嘗言當修邊備阿蘇力沮其事或譏其以金賣國後以風疾失音致仕加尚父封趙王薨年八十追封齊國王論曰灤河之變重元擁兵行幄微仁先等道宗其危乎當其止幸北南院召塔喇兵以靖大難功宜居首良以反謀白太后罕嘉努以逆順降奚人徳與阿蘇殺尼嚕古皆有討賊之力焉仁先齊名休格勲徳兼備此其一節歟遼史卷九十六遼史卷九十六考證耶律仁先傳同知東京留守事十六年遷北院大王按興宗本紀重熙十二年仁先以北院樞密副使同知東京留守事傳作南京互異又十五年自契丹行宫都部署為南院大王十九年自南院大王知北院樞密使事是仁先未嘗為北院大王此以南院為北院又以十五年為十六年也耶律仁先傳清寜初為南院樞密使以耶律華格譖出為南京兵馬副元帥按道宗本紀清寜二年仁先為南院樞密使四年六月為北院樞密使十一月出為南京兵馬副元帥是仁先之出為南京兵馬副元帥係為北院樞密使時非為南院樞密使時也遼史卷九十六考證
