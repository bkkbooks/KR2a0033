body:
  text: 遼史卷七十二元中書右丞相總裁托克托等修列傳第二宗室義宗貝子平王隆先晉王道隱章肅皇帝魯呼子宋王喜隱順宗濬晉王額嚕温義宗名貝小字托雲太祖長子母淳欽皇后舒嚕氏㓜聰敏好學外寛内摯神冊元年春立為皇太子時太祖問侍臣曰受命之君當事天敬神有大功德者朕祀之何先皆以佛對太祖曰佛非中國教貝曰孔子大聖萬世所尊宜先太祖大悅卽建孔子廟詔皇太子春秋釋奠從征烏爾古党項為先鋒都統及經畧燕地太祖西征留貝守京師因陳取渤海計天顯元年從征渤海拔扶餘城上欲括戸口貝諫曰今始得地而料民民必不安若乘破竹之勢徑造輝罕城克之必矣太祖從之貝與大元帥德光為前鋒夜圍輝罕城大諲譔窮蹙請降尋復叛太祖破之改其國曰東丹名其城曰天福以貝為人皇王主之仍賜天子冠服建元甘露稱制置左右大次四相及百官一用漢法歲貢布十五萬端馬千匹上諭曰此地瀕海非可久居留汝撫治以見朕愛民之心駕將還貝作歌以獻陛辭太祖曰得汝治東土吾復何憂貝號泣而出遂如儀坤州未幾諸部多叛大元帥討平之太祖訃至貝卽日奔赴山陵貝知皇太后意欲立德光乃謂公卿曰大元帥功德及人神中外攸屬宜主社稷乃與羣臣請於太后而讓位焉於是大元帥卽皇帝位是為太宗太宗旣立見疑以東平為南京徙貝居之盡遷其民又置衞士陰伺動靜貝旣歸國命王繼遠撰建南京碑起書樓于西宫作樂田園詩唐明宗聞之遣人跨海持書密召貝貝因畋海上使再至貝謂左右曰我以天下讓主上今反見疑不如適他國以成吳太伯之名立木海上刻詩曰小山壓大山大山全無力羞見故鄉人從此投外國攜髙美人載書浮海而去唐以天子儀衞迎貝貝坐船殿衆官陪列上壽至汴見明宗明宗以莊宗后夏氏妻之賜姓東丹名之曰慕華改瑞州為懷化軍拜懷化軍節度使瑞愼等州觀察使復賜姓李名贊華移鎭滑州遥領䖍州節度使貝雖在異國常思其親問安之使不絶後明宗養子從珂弑其君自立貝密報太宗曰從珂弑君盍討之及太宗立石敬瑭為晉主加兵于洛從珂欲自焚召貝與俱貝不從遣壯士李彦紳害之時年三十八有一僧為收瘞之敬瑭入洛喪服臨哭以王禮權厝後太宗改葬于醫巫閭山諡曰文武元皇王世宗卽位諡讓國皇帝陵曰顯陵統和中更諡文獻重熈二十年增諡文獻欽義皇帝廟號義宗及諡二后曰端順曰柔貞貝初市書至萬卷藏于醫巫閭絶頂之望海堂通陰陽知音律精醫藥砭焫之術工遼漢文章嘗譯陰符經善畫本國人物如射獵雪騎千鹿圖皆入宋秘府然性頗刻急好殺婢妾微過常加刲灼夏氏懼而求削髮為尼五子長世宗次隆科稍隆先道隱平王隆先字團隱母大氏景宗卽位始封平王未幾兼政事令留守東京薄賦稅省刑獄恤鰥寡數薦賢能之士後與統軍耶律舒嚕同討髙麗有功還薨葬醫巫閭山之道隱谷平王為人聰明博學能詩有閬苑集行于世保寧之季其子辰格與渤海官屬謀殺其父舉兵作亂上命轘裂子市晉王道隱字留隱母髙氏道隱生于唐人皇王遭李從珂之害時年尚㓜洛陽僧匿而養之因名道隱太宗滅唐還京詔賜外羅山地居焉性沉靜有文武才時人稱之景宗卽位封蜀王為上京留守乾亨元年遷守南京號令嚴肅民獲安業居數年徙封荆王統和初病薨追封晉王論曰自古新造之國一傳而太子讓豈易得哉遼之義宗可謂盛矣然讓而見疑豈不兆於建元稱制之際乎斯則一時君臣昧於禮制之過也束書浮海寄跡他國思親不忘問安不絶其心甚有足諒者焉觀其始慕泰伯之賢而為遠適之謀終疾陳恒之惡而有請討之舉志趣之卓蓋已見於早歲先祀孔子之言歟善不令終天道難詰得非性刻嗜殺之所致也雖然終遼之代賢聖繼統皆其子孫至德之報昭然在兹矣章肅皇帝小字魯呼一名鴻觀字奚隱太祖第三子母淳欽皇后舒嚕氏勇悍多力而性殘酷小怒輒黥人面或投水火中太祖嘗觀諸子寢魯呼縮項臥内曰是必在諸子下又嘗大寒命三子採薪太宗不擇而取最先至人皇王取其乾者束而歸後至魯呼取少而棄多旣至袖手而立太祖曰長巧而次成少不及矣而母篤愛魯呼天顯五年遣狥地代北攻寰州多俘而還遂立為皇太弟兼天下兵馬大元帥太宗親征常留守京師世宗卽位鎭陽太后怒遣魯呼將兵擊之至泰德泉爲安圖瑠格所敗太后與世宗隔潢河而陣各言舉兵意耶律烏哲入諫太后曰主上已立宜許之時魯呼在側作色曰我在烏雲安得立烏哲曰奈公酷暴失人心何太后顧魯呼曰昔我與太祖愛汝異於諸子諺云偏憐之子不保業難得之婦不主家我非不欲立汝汝自不能矣及會議世宗使解劒而言和約旣定趨上京會有告魯呼與太后謀廢立者徙魯呼祖州禁其出入穆宗時其子喜隱謀反辭逮魯呼囚之死獄中年五十葬玉峯山西谷統和中追諡欽順皇帝重熈二十一年更諡章肅后曰和敬二子宋王喜隱衞王完喜隱字完德雄偉善騎射封趙王應厯中謀反事覺上臨問有狀以親釋之未幾復反下獄景宗卽位聞有赦自去其械而朝上怒曰汝罪人何得擅離禁所詔誅守者復寘于獄及改元保寧乃宥之妻以皇后之姊復爵王宋喜隱輕僄無恒小得志卽驕上嘗召不時至怒而鞭之由是憤怨謀亂貶而復召適見上與劉繼元書辭意卑遜諫曰本朝於漢為祖書㫖如此恐虧國體帝尋改之授西南面招討使命之河東索吐蕃戸稍見進用復誘羣小謀叛上命械其手足築圜土囚祖州宋降卒二百餘人欲刼立喜隱以城堅不得入立其子留禮壽上京留守楚實勒擒之留禮壽伏誅賜喜隱死論曰魯呼殘酷驕盈太祖知其不才而不能教太后不知其惡而溺愛之初以烏哲之言定立世宗而復謀廢立子孫繼以逆誅并及其身可哀也已夫自太祖之世埒克安圖首倡禍亂太祖旣不之誅又復用之固為有君人之量然惟太祖之才足以駕馭庶乎其可也魯呼而下宗王反側無代無之遼之内難與國始終厥後嗣君雖嚴法以繩之卒不可止烏虖創業垂統之主所以貽厥孫謀者可不審歟順宗名濬小字伊囉斡道宗長子母宣懿皇后蕭氏㓜而能言好學知書道宗嘗曰此子聰慧殆天授歟六歲封梁王明年從上獵矢連發三中上顧左右曰朕祖宗以來騎射絶人威震天下是兒雖㓜不墜其風後遇十鹿射獲其九帝喜設宴八歲立為皇太子太康元年兼領北南樞密院事及母后被害太子有憂色耶律伊遜為北院樞密使常不自安會護衞蕭和克謀害伊遜事覺下獄副㸃檢蕭錫沙謂伊遜曰臣民心屬太子公非閥閱一日若立吾輩措身何地廼與同知北院宣徽事蕭嗒喇台謀搆陷太子陰令護尉太保耶律扎拉誣告都宫使耶律薩喇知院耶律蘇色䕶衞蕭和克謀廢立詔案無迹不治伊遜復令牌印郎君蕭額圖琿等言扎拉前告非妄臣實與謀欲殺耶律伊遜等然後立太子臣若不言恐事發連坐帝信之幽太子于别室以耶律雅克鞫案太子具陳枉狀曰吾為儲副尚何所求公當為我辨之雅克乃伊遜之黨易其言為欵伏上大怒廢太子為庶人將出曰我何罪至是錫沙叱登車遣衞士闔其扉徙于上京囚圜堵中伊遜尋遣達嚕噶薩巴往害之太子年方二十上京留守蕭塔坦紿以疾薨聞上哀之命有司葬龍門山欲召其妃伊遜陰遣人并殺之後知其寃悔恨無及諡曰昭懷太子以天子禮改葬玉峯山乾統初追尊大孝順聖皇帝廟號順宗妃蕭氏貞順皇后一子延禧卽天祚皇帝論曰道宗知太子之賢而不能辨伊遜之詐竟絶父子之親為萬世惜伊遜知為一身之計不知有君臣之義豈復知有太子乎姦邪之臣亂人家國如此可不戒哉可不戒哉晉王小字額嚕温天祚皇帝長子母曰文妃蕭氏甫髫齓馳馬善射出為大丞相耶律隆運後封晉王性樂道人善而矜人不能時宫中見讀書者輒斥額嚕温嘗入寢殿見實達爾察喇閲書因取觀㑹諸王至陰袖而歸之曰勿令他人見也時號稱長者及長積有人望内外歸心保大元年南軍都統耶律伊都與其母文妃密謀立之事覺伊都降金文妃伏誅額嚕温實不與謀免二年耶律薩巴等復謀立不克上知額嚕温得人心不忍加誅令縊殺之或勸之亡額嚕温曰安忍為蕞爾之軀而失臣子之大節就死聞者傷之論曰天祚不君臣下謀立其子適以殺之額嚕温重君父之命不亡而死申生其恭矣乎遼史卷七十二遼史卷七十二考證宗室傳義宗傳小字托雲原本作圖欲五代歐史作突欲皆係音近之訛今併改善畫本國人物如射獵雪騎千鹿圖原本射字下衍騎字今刪五子長世宗次羅和稍隆先道隱按羅和入逆臣傳見卷一百十二目錄失載稍封吳王見景宗本紀而無傳原本稱各有傳係誤今刪順宗傳伊遜陰遣人殺之後知其寃原本後知其寃句上衍州字今刪遼史卷七十二考證
