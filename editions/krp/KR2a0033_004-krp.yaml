body:
  text: 遼史卷四元中書右丞相總裁托克托等修本紀第四太宗下㑹同元年春正月戊申朔晉及諸國遣使来賀晉使且言已命和凝撰聖徳神功碑戊辰遣人使晉二月壬午室韋進白麃戊子鐡驪来貢丁酉獵松山戊戌幸遼河東丙午上思人皇王遣特哩衮率宗室以下祭其行宫丁未増晉使所經供億户三月壬戌将東幸三剋言農務方興請減輜重促還期従之丙寅女直来貢癸酉東幸夏四月戊寅朔如南京甲申女直来貢乙酉幸温泉己丑還宮朝于皇太后丁酉女直貢弓矢己亥西南邉大詳衮耶律羅卜科奏党項㨗五月甲寅晉復遣使請上尊號従之六月丙子朔吐谷渾及女直来貢辛夘南唐来貢癸巳詔建日月四時堂圗寫古帝王事于兩廡秋七月癸亥遣使賜晉馬丁夘遣呼喇台使晉美楞拉呼使南唐戊辰遣中臺省右相耶律蘇哷特爾格使晉臨海軍節度使趙思温副之冊晉帝為英武明義皇帝八月戊子女直来貢庚子吐谷渾烏孫靺鞨皆来貢九月庚戌黑車子室韋貢名馬邉臣奏晉遣守司空馮道左散騎常侍韋勲来上皇太后尊號左僕射劉煦右諌議大夫盧重上皇帝尊號遂遣監軍伊聶濟充接伴壬子詔羣臣及高年凡授大臣爵秩皆賜錦袍金帶白馬金飾鞍勒著扵令冬十月甲戌朔遣郎君特哩衮等撫問晉使壬寅晉遣使来謝冊禮復有使来進獨峯駞及名馬十一月甲辰朔命南北宰相及額爾竒木就館賜晉使馮道以下宴丙午上御開皇殿召見晉使壬子皇太后御開皇殿馮道韋勲冊上尊號曰廣徳至仁昭烈崇簡應天皇太后甲子行再生柴冊禮丙寅皇帝御宣政殿劉煦盧重冊上尊號曰睿文神武法天唘運眀徳章信至道廣敬昭孝嗣聖皇帝大赦改元會同是月晉復遣趙瑩奉表来賀以幽薊瀛莫涿檀順媯儒新武雲應朔寰蔚十六州并圗籍来獻扵是詔以皇都為上京府曰臨潢升幽州為南京南京為東京改新州為奉聖州武州為歸化州升北南院及伊實額爾竒木為王以主簿為令令為刺史刺史為節度使二部特哩衮為司徒達爾罕為副使瑪爾布為縣令縣達爾罕為馬步置宣徽閤門使控鶴客省御史大夫中丞侍御判官文班牙署諸宫院實珠馬羣約尼實珠南北府國舅帳郎君官為敞史諸部宰相節度使帳為司空二室韋逹林為僕射鷹坊監冶等局官長為詳衮十二月戊戌遣通果阿巴等使晉制加晉馮道守太傅劉煦守太保餘官各有差二年春正月乙巳以受晉冊遣使報南唐高麗丁未御開皇殿宴晉使馮道以下賜物有差戊申晉遣金吾衛大将軍馬従斌考功即中劉知新来貢􅎇幣命分賜羣臣丙辰晉遣使謝免沿邊四州錢幣二月戊寅宴諸王及節度使賀受冊禮者仍命皇太子特哩衮達年餞之癸巳謁太祖廟賜在京吏民物及内外羣臣官賞有差丁酉加兼侍中左金吾衛上将軍王鄑檢校太尉三月畋于褭潭之側戊申女直来貢丁巳封皇子舒嚕為夀安王雅斯哈為太平王己巳大賚百姓夏四月乙亥幸木葉山癸巳東京路奏狼食人五月乙巳禁南京鬻牝羊出境薩納噶多囉等坐盜官物籍其家南唐遣使来貢丁未以所貢物賜羣臣戊申回鶻單于使人乞授官詔第加刺史縣令六月丁丑雨雪是夏駐蹕頻蹕淀秋七月戊申晉遣使進犀帶庚戌吐谷渾来貢乙夘敞史阿巴坐奉使失職命笞之閏月癸未伊實大王坐賦調不均以木劔背撻而釋之并罷南北府民上供及宰相節度賦役非舊制者乙酉遣迪里賜晉烏爾古良馬己丑以南王府二刺史貪蠧各杖一百仍繫虞候帳備射鬼箭選羣臣為民所愛者代之八月乙丑晉遣使貢嵗幣奏輸戌亥二嵗金幣扵燕京九月甲戌準布阿勒達来貢己夘遣使使晉冬十月丁未上以烏爾古部水草肥美詔北南院徙三錫林户居之十一月丁亥鐡驪燉煌遣使来貢十二月庚子釣魚于土河甲子回鶻使者傔人有以刃相擊者詔付其使處之三年春正月戊子吴越王遣使来貢庚寅人皇王妃来朝回鶻使乞觀諸國使朝見禮従之壬辰遣陪謁阿巴使晉致生辰禮晉以并鎮忻代之吐谷渾来歸二月己亥奚王喇呼鼐率六節度使朝貢庚子烏爾古獻伏鹿國俘賜其部額爾竒木旗鼓以旌其功壬寅女直来貢辛亥摩哩拉呼摩哩使回鶻阿爾斯蘭還賜對衣勞之乙夘鴨綠江女直遣使来覲三月戊辰遣使使晉報幸南京己巳如南京辛未命特哩衮努哷克特率萬騎先驅壬申次石嶺以奚王喇呼鼐監軍伊聶濟朝謁不時責之丙子羅卜科上党項俘獲數癸未獵水門獲白鹿庚寅詔扈従擾民者従軍律甲午幸薊州乙未晉及南唐各遣使来覲夏四月庚子至燕俻法駕入自拱辰門御元和殿行入閤禮壬寅遣人使晉乙巳幸留守趙延夀别墅丙午晉遣宣徽使楊端王眺等来問起居壬子御便殿宴晉及諸國使丙辰晉遣使進茶藥壬戌御昭慶殿宴南京羣臣癸亥晉遣使賀端午以所進節物賜羣臣乙丑南唐進白龜五月庚午以端午宴羣臣及諸國使命回鶻燉煌二使作本俗舞俾諸使觀之庚辰晉遣使進弓矢甲申遣皇子天徳及檢校司徒邸用和使晉戊子閲騎兵扵南郊六月乙未朔東京宰相耶律伊濟言渤海相大素賢不法詔僚佐部民舉有才徳者代之丙申閲步卒扵南郊庚子晉及錫爾固勒濟遣使来見壬寅發燕京命中書令蕭僧隱部諸道軍于長坐營癸丑次奉聖州甲寅勞軍士秋七月己巳獵哈達拉山癸酉朝扵皇太后丙子従皇太后視人皇王妃疾戊寅人皇王妃蕭氏薨己夘以安重榮據鎮州叛晉詔征南将軍栁嚴邊備丙戌徙人皇王行宫于其妃薨所辛夘晉遣使請行南郊禮許之八月己亥詔東丹吏民為其王貝妃蕭氏服庚子準布来貢壬寅遣使南唐乙巳準布黑車子室韋埒里等國来貢南唐遣使求青氊帳賜之戊申以安圗私城為白川州辛亥布古徳使乞賜爵以其國相授之甲寅準布来貢乙夘置白川州官屬丙辰詔以伊竒哩河臚朐河之地給賜南院鄂津圗嚕伊遜巴勒北院烏納哈喇三錫林人為農田九月庚午侍中崔窮古言晉主聞陛下數游獵意請節之上曰朕之畋獵非徒従樂所以練習武事也乃詔諭之壬午邊将奏破吐谷渾擒其長詔止誅其首惡及其丁壮餘並釋之丙戌晉遣使貢名馬戊子女直及吴越王遣使来貢冬十月辛丑遣剋朗使吴越魯庫使南唐庚申晉遣使貢布及請親祠南嶽従之十一月己巳南唐遣使奉蠟丸書言晉密事丁丑詔有司敎民播種紡繢除姊亡妹續之法十二月壬辰朔率百僚謁太祖行宫甲午燔柴禮畢祠于神帳丙申遣使使晉丙辰詔契丹人授漢官者従漢儀聴與漢人婚姻丁巳詔燕京皇城西南堞建涼殿是冬駐蹕于繖淀四年春正月壬戌以伊實彭布托果三部鰥寡不能自存者官為之配丙子南唐遣使来貢庚辰納拉威部来獻党項俘獲數己丑詔定征党項功二月丙申皇太子獲白麞甲辰晉遣使進香藥丙午鐡驪来貢丁巳詔有司編述始祖竒善汗事迹己未晉遣楊彦詢来貢且言鎮州安重榮跋扈状遂留不遣是月晉鎮州安重榮執遼使者伊喇三月特授回鶻使科里裕悦并賜旌旗弓劔衣馬餘賜有差癸酉晉以許祀南郊遣使来謝進黃金十鎰夏四月己夘晉遣使進櫻桃五月庚辰吐谷渾額爾竒木蘇等叛入晉遣徳哷諭晉及太原守臣六月辛夘振武軍節度副使趙崇逐其節度使耶律華喇以朔州叛附晉丙午命宣徽使尼古察赴朔州以兵圍其城有晉使至請開壁即勿聴驛送闕下秋七月癸亥南唐遣使奉蠟丸書丙寅尼古察奏晉遣使至朔令降守者猶堅壁弗納且言晉有貢物命即以所貢物賜攻城将校己巳有司奏神纛車有蜂巢成蜜史占之吉壬申晉遣使進水晶硯八月癸巳南唐奉蠟丸書庚子晉遣使進犀弓竹矢吴越王遣使奉蠟丸書九月壬申有星孛扵晉分丁丑幸歸化州冬十月辛丑有司奏燕薊大熟癸夘吴越王遣使来貢十一月丙寅晉以討安重榮来告庚午吐谷渾請降遣使撫諭準布来貢以其物賜左右丙子鴨淥江女直来貢壬午以永寜天授二節及正旦重午冬至臘並受賀著令十二月戊子晉遣使来告山南節度使安従進反詔以便宜討之庚寅南唐遣使奉蠟丸書戊戌晉遣王升鸞来貢戊申晉以敗安重榮来告遂遣楊彦詢歸辛亥晉遣使乞罷戍兵詔特哩衮碩格班師甲寅拔朔州遣控鶴指揮使轄哩勞軍時尼古察戰殁城下上怒命誅城中丁壮仍以叛民上户三十為尼古察部曲五年春正月丙辰朔上在歸化州御行殿受羣臣朝以諸道貢物進太后及賜宗室百僚戊午詔求直言北王府郎君耶律哈斯應詔召對稱旨特授宣徽使詔政事令僧隱等以契丹户分屯南邉戊辰晉函安重榮首来獻上數欲親討重榮至是乃止癸酉遣使使晉是月晉以朔州平遣使来賀遂遣客省使耶律華格使晉并致生辰禮二月壬辰上將南幸以諸路有未平者召太子及羣臣議皆曰今襄鎮朔三州雖已平然吐谷渾為安重榮所誘猶未歸命宜發兵討之以警諸部上曰正與朕意合遂下詔以明王温代裕悦新為西南路招討使以討之且諭明王宜先練習邉事而後之官甲午如南京遣使使晉索吐谷渾叛者乙未布古徳来貢三月乙夘朔晉遣齊州防禦使宋暉業翰林茶酒使張言来問起居閏月駐蹕陽門夏四月甲寅朔鐡驪来貢以其物分賜羣臣丙子晉遣使進射栁鞍馬五月五日戊子禁屠宰六月癸丑晉齊王重貴遣使来責丁巳托克托呼蘇色来貢乙丑晉主敬瑭殂子重貴立戊辰晉遣使告哀輟朝七日庚午遣使往晉弔祭丁丑聞皇太后不豫上馳入侍湯藥必親甞仍告太祖廟幸菩薩堂飯僧五萬人七月乃愈秋七月庚寅晉遣金吾衛大将軍梁言判四方館事朱崇節来謝書稱孫不稱臣遣客省使喬榮讓之景延廣答曰先帝則聖朝所立今主則我國自冊為鄰為孫則可奉表稱臣則不可榮還奏上始有南伐之意辛夘準布布古徳烏爾古来貢将軍當達里布爾古等率降将希達至闕并獻所獲丁未晉遣使以祖母哀来告八月辛酉女直準布烏爾古貢方物甲子晉復襄州戊辰詔河東節度劉知逺送叛臣烏爾古指揮使由燕京赴闕癸酉遣天城軍節度使蕭拜甡弔祭扵晉九月壬辰遣使賀晉帝嗣位冬十月己巳徴諸道兵遣将軍黙赫特伐党項十一月己未武定軍奏松生棗十二月癸亥晉遣使来謝是冬駐蹕赤城六年春二月乙夘晉遣使進先帝遺物辛酉晉遣使請居汴従之三月己夘朔吴越王遣使来貢甲申美楞托津来歸戊子南唐遣使奉蠟丸書丁未晉至汴遣使来謝夏四月戊申朔日有食之五月己亥遣使如晉致生辰禮六月丁未朔鐡驪来貢己未奚楚庫勒部進白麝辛酉莫州進白鵲晉遣使貢金秋八月丁未朔晉復貢金己未如奉聖州晉遣其子延煦來朝冬十一月辛夘上京留守耶律達年得晉諜知有二心甲辰鐡驪来貢十二月丁未如南京議伐晉命趙延夀趙延昭安圗嘉哩等由滄恒易定分道而進大軍繼之是嵗楊彦昭請移鎮柰濼及新鎮従之七年春正月甲戌朔趙延夀延昭率前鋒五萬騎次任邱丙子安圗入鴈門圍忻代己夘趙延夀圍貝州其軍校邵珂開南門納遼兵太守吴巒投井死己丑次元城授延夀魏博等州節度使封魏王率所部屯南樂丙申遣兵攻黎陽晉張彦澤来拒辛丑晉遣使来修舊好詔割河北諸州及遣桑維翰景延廣来議二月甲辰攻博州刺史周儒以城降晉平盧軍節度使楊光逺密道遼師自馬家口濟河晉将景延廣命石斌守麻家口白再榮守馬家口未㡬周儒引遼軍滿達營扵河東攻鄆州北津以應光逺晉遣李守貞皇甫遇梁漢璋薛懐讓将兵萬人緣河水陸俱進遼軍圍晉别将于戚城晉主自将救之遼師解去守貞等至馬家口滿達遣步卒萬人築營壘騎兵萬人守扵外餘兵屯河西渡未已晉兵薄之遼軍不利三月癸酉朔趙延夀言晉諸軍沿河置柵皆畏却不敢戰若率大兵直抵澶淵據其橋梁晉必可取是日晉兵駐澶淵其前軍高行周在戚城乃命延夀延昭以數萬騎出行周右上以精兵出其左戰至暮上復以勁騎突其中軍晉軍不能戰㑹有諜者言晉軍東靣數少沿河城柵不固乃急擊其東偏衆皆奔潰縦兵追及遂大敗之壬午留趙延昭守貝州徙所俘户扵内地夏四月癸丑還次南京辛未如涼陘五月癸酉耶律巴哩岱奏破徳州擒刺史尹居藩及将吏二十七人六月甲辰黑車子室韋来貢乙巳紳穆哩約囉等國来貢秋七月己夘晉楊光逺遣人奉蠟丸書辛夘晉遣張暉奉表乞和留暉不遣八月辛酉回鶻遣使請婚不許是月晉鎮州兵来襲飛狐大同軍節度使耶律恭噶戰敗之九月庚午朔北幸十月丁未布古徳来貢壬戌天授節諸國進賀惟晉不至十一月壬申詔徴諸道兵以閏月朔㑹温榆河北十二月癸夘南伐甲子次古北口閏月己巳朔閲諸道兵扵温榆河己夘圍恒州下其九縣八年春正月庚子分兵攻邢洺磁三州殺掠殆盡入鄴都境張従恩馬全節安審琦兵悉陳于相州安陽水之南皇甫遇與濮州刺史慕容彦超将兵千騎来覘遼軍至鄴都遇遼軍數萬且戰且却至榆林店遼軍繼至遇與彦超力戰百餘合遇馬斃步戰審琦引騎兵踰水以救遼軍乃還二月圍魏晉将杜重威率兵来救戊子晉将折従阮䧟滕州三月戊戌師拔祁州殺其刺史沈斌庚戌杜重威李守貞攻泰州戊午趙延夀率前鋒薄泰城己未重威守貞引兵南遁追至陽城大敗之復以步卒為方陣来拒與戰二十餘合壬戌復搏戰十餘里癸亥圍晉兵扵白團衛村晉兵下鹿角為營是夕大風至曙命鐵鷂軍下馬㧞其鹿角奮短兵入擊順風縦火揚塵以助其勢晉軍大呼曰都招討何不用兵令士卒徒死諸将皆奮出戰張彦澤藥元福皇甫遇出兵大戰諸将繼至遼軍却數百步風益甚晝晦如夜符彦卿以萬騎横擊遼軍率步卒竝進遼軍不利上乘奚車退十餘里晉追兵急獲一橐駞乘之乃歸晉兵退保定州夏四月甲申還次南京杖戰不力者各數百庚寅宴将士扵元和殿癸巳如涼陘六月戊辰回鶻来貢辛未吐谷渾布古徳皆来貢辛巳黑車子室韋来貢丁亥趙延夀奏晉兵襲高陽戍将擊走之秋七月乙夘獵平地松林晉遣孟守中奉表請和仍以前事答之八月己巳詔侍衛蕭蘇色閲羣牧于北陘九月壬寅次赤山宴従臣問軍國要務對曰軍國之務愛民為本民富則兵足兵足則國强上以為然辛酉還上京冬十月辛未祠木葉山十一月戊戌女直鐡驪来貢十二月癸亥朔朝謁太祖行宫乙丑雲州節度使耶律恭噶獲晉諜者戊辰臘賜諸國貢使衣馬九年春正月庚子回鶻来貢丁未女直来貢二月戊辰布古徳奏軍籍三月己亥吐谷渾遣軍校蘇哷獻生口千户授蘇哷檢校司空夏四月辛酉朔吐谷渾白可乆来附是月如涼陘五月庚戌晉易州戍将孫方簡請内附六月戊子謁祖陵更閟神殿為長思秋七月辛亥詔徴諸道兵故傷禾稼者以軍法論癸丑女直来貢乙夘以準布酋長哈喇為本部額爾竒木八月丙寅烏爾古来貢是月自将南伐九月壬辰閲諸道兵于漁陽西棗林淀趙延夀與晉張彦澤戰于定州敗之十一月戊子朔進圍鎮州丙申先遣候騎報晉兵至遣精兵㫁河橋晉兵退保武强南院大王達年将軍高模翰分兵由瀛州間道以進杜重威遣貝州節度使梁漢璋率衆来拒與戰大敗之殺梁漢璋杜重威張彦澤引兵據中渡槗趙延夀以步卒前擊高彦温以騎兵乘之追奔逐北殭屍數萬斬其将王清宋彦筠墮水死重威等退保中渡寨義武軍節度使李殷以城降遂進兵夾滹沱而營去中渡寨三里分兵圍之夜則列騎環守晝則出兵抄掠命大内特哩衮耶律舒庫爾及趙延夀分兵圍守自将騎卒夜渡河出其後攻下欒城降騎卒數千分遣将士據其要害下令軍中預備軍食三日不得舉煙火如獲晉人即黥而縦之諸饋運見者皆棄而走于是晉兵内外隔絶食盡勢窮十二月丙寅杜重威李守貞張彦澤等率所部二十萬衆来降上擁數萬騎臨大阜立馬以受之授重威守太傅鄴都留守守貞天平軍節度使餘各領舊職分降卒之半付重威半以隸趙延夀命御史大夫嘉哩監軍富珠哩張彦澤持詔入汴諭晉帝母李氏以安其意且召桑維翰景延廣先来留騎兵千人守魏自率大軍而南壬申嘉哩等至汴晉帝重貴素服拜命輿母李氏奉表請罪初重貴絶和好維翰數諫止之不従至是彦澤殺維翰紿言自經死詔收𦵏之復其田園地宅仍厚恤其家甲戌彦澤遷重貴及其母若妻扵開封府署以控鶴指揮使李榮督兵衛之壬午次赤岡重貴舉族出封邱門槀索牽羊以待上不忍臨視命改館封禪寺晉百官縞衣紗㡌俯伏待罪上曰其主負恩其臣何罪命領職如故即授安叔千金吾衛上将軍叔千出班獨立上曰汝邢州之請朕所不忘乃加鎮國軍節度使盖在邢嘗密請内附也将軍康祥執景延廣来獻詔以牙籌數其罪凡八縶送都道自殺大同元年春正月丁亥朔􅊀法駕入汴御崇元殿受百官賀戊子以樞密副使劉敏權知開封府殺秦繼旻李彦紳及鄭州防禦使楊承勲以其弟承信為平盧軍節度使襲父爵初楊光逺在青州求内附其子承勲不聴殺其判官邱濤及弟承祚等自歸于晉故誅之己丑以張彦澤擅徙重貴開封殺桑維翰縦兵大掠不道斬扵市晉人臠食之辛夘降重貴為崇禄大夫檢校太尉封負義侯癸巳以張礪為平章事晉李崧為樞密使馮道為太傅和凝為翰林學士趙瑩為太子太保劉煦守太保馮玉為太子少保癸夘遣趙瑩馮玉李彦韜将三百騎送負義侯及其母李氏太妃安氏妻馮氏弟重睿子延煦延寳等扵黃龍府安置仍以其宫女五十人内宦三人東西班五十人醫官一人控鶴四人庖丁七人茶酒司三人儀鸞三人健卒十人従之二月丁巳朔建國號大遼大赦改元大同升鎮州為中京以趙延夀為大丞相兼政事令樞密使中京留守中外官僚将士爵賞有差辛未河東節度使北平王劉知逺自立為帝國號漢詔以耿崇美為昭義軍節度使高唐英為昭徳軍節度使崔廷勲為河陽軍節度使分據要地三月丙戌朔以蕭翰為宣武軍節度使賜将吏爵賞有差壬寅晉諸司僚吏嬪御宦寺方技百工圖籍厯象石經銅人明堂刻漏太常樂譜諸宫縣鹵簿法物及鎧仗悉送上京磁州帥梁暉以相州降漢己酉命高唐英討之夏四月丙辰朔發自汴州以馮道李崧和凝李澣徐台符張礪等従行次赤岡夜有聲如雷起于御幄大星復隕扵旗鼓前乙丑濟黎陽渡顧謂侍臣曰朕此行有三失縦兵掠芻粟一也括民私財二也不遽遣諸節度還鎮三也皇太弟遣使問軍前事上報曰初以兵二十萬降杜重威張彦澤下鎮州及入汴視其官屬具員者省之當其才者任之司屬雖存官吏廢墮猶雛飛之後徒有空巢久經離亂一至于此所在盜賊屯結土功不息餽餉非時民不堪命河東尚未歸命西路酋帥亦相黨附夙夜以思制之之術惟推心庶僚和協軍情撫綏百姓三者而已今所歸順凡七十六處得户一百九萬百一十八非汴州炎熱水土難居止得一年太平可指掌而致且改鎮州為中京以備巡幸欲伐河東姑俟别圖其概如此戊辰次高邑不豫丁丑崩于欒城年四十六是嵗九月壬子朔葬于鳳山陵曰懐陵廟號太宗統和二十六年七月上尊謚孝武皇帝重熙三十一年九月増諡孝武恵文皇帝贊曰太宗甫定多方逺近向化建國號備典章至于釐庶政閲名實錄囚徒教耕織配鰥寡求直言之士得郎君哈斯即擢宣徽嘉唐張敬達忠扵其君卒以禮葬輟遊豫而納三剋之請憫士卒而下休養之令親征晉國重貴靣縛斯可謂威徳兼𢎞英畧間見者矣入汴之後無㡬㣲之驕有三失之訓傳稱鄭伯之善處勝書進秦誓之能悔過太宗盖兼有之其卓矣乎遼史巻四遼史卷四考證㑹同元年二月丙午丙午原本作丙申按丙申應在丁酉戊戌之上據下文丁未考之當係丙午今改正夏四月耶律羅卜科奏党項㨗羅卜科原本作魯不古列傳同此與卷三之盧不姑本卷後之魯不姑係一人而音轉岐誤今併改為羅卜科十一月丙寅改元會同按此為天顯十二年十一月事五代歐史載契丹改天顯十一年為會同元年係誤二部特哩衮為司徒特哩衮原本作梯里已按本史百官志惕隠亦曰梯里已今併改為特哩衮四年二月丙午丙午原本作丙子按上正月書丙子則二月不得復有丙子以上甲辰下丁巳計之應係丙午今㩀永樂大典改秋七月尼固察奏晉遣使至朔令降原本晉訛請今㩀永樂大典改五年春正月晉以朔州平遣使来賀原本遣訛請今據永樂大典改三月晉遣齊州防禦使宋暉業来問起居按宋暉業五代薛史作宋光鄴此避太宗諱五月五日戊子戊子原本作戊午以上四月甲寅朔考之則五月五日應係戊子今據永樂大典改秋七月晉遣判四方館事朱崇節来謝朱崇節按五代史作宋崇節十一月己未按本史厯象志是年十一月係辛巳朔計辛巳距己未三十九日十一月内不應有己未日係誤八年三月戊午戊午原本作戊子按三月内不應有戊子以上庚戌下己未計之應係戊午今改正九年五月晉易州戍将孫方簡請内附孫方簡按五代歐史作孫方諌十一月先鋒候騎報晉兵至先鋒原本作先遣據永樂大典改杜重威遣貝州節度使梁漢璋率衆来拒貝州節度使原本作其将節度使據永樂大典改宋彦筠墮水死按資治通鑑載晉兵與契丹夹滹沱而軍晉軍爭橋不勝杜重威遣王清與宋彦筠俱進清戰甚銳契丹以新兵繼之清及士卒皆死彦筠戰敗浮水抵橋得免冊府元龜載王清従杜重威北征至中渡槗清為先鋒開橋奪路重威遣宋彦筠與俱彦筠尋退走清酣戰不息與其下俱没焉五代歐史亦書彦筠退走王清力戰而死又按通鑑是年十二月契丹遥以兵環晉營軍中食盡杜重威與李守貞宋彦筠謀降契丹又按陶岳五代史補云後漢乾祐中宋彦筠為鄭州節度使據此則王清戰死而宋彦筠之未死明矣此書彦筠墮水死盖當時因其墮水遂誤以為死耳監軍富珠哩原本作傅桂兒他巻又作傅住兒今據五代歐史併改大同元年春正月降重貴為崇祿大夫按五代薛史作光祿大夫此避太宗諱太妃安氏原本缺太字安字今據永樂大典增遼史巻四考證
