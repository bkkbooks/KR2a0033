body:
  text: 遼史卷十三元中書右丞相總裁托克托等修本紀第十三聖宗四八年春正月辛巳如臺湖庚寅詔决滯獄庚子如沈子樂二月丁未朔于闐回鶻各遣使來貢壬申女直遣使來貢三月丁丑李繼遷遣使來貢庚辰太白熒惑闘凡十有五次乙酉城杏堝以宋俘實之辛丑置宜州夏四月丙午朔嚴州刺史李夀英有惠政民請留從之庚戌女直遣使來貢庚午以歳旱諸部艱食振之五月戊子以宋降卒分隸諸軍庚寅女直宰相阿海來貢封順化王丙申清暑呼圖哩巴山詔括民田六月丙午以北面林牙穆爾古為北院大王阿爾斯蘭回鶻裕悦達爾罕遣使來貢甲寅月掩天駟第一星丙辰女直遣使來貢秋七月庚辰改南京熊軍為神軍詔東京路諸宫分提轄司分置定霸保和宣化三縣白川州置洪理儀坤州置廣義遼西州置長慶乾州置安徳各一縣省遂媯松饒寧海瑞玉特哩奉徳等十州及玉田遼豐松山𢎞逺懐清雲龍平澤平山等八縣以其民分𨽻他郡八月乙卯以黑白羊祭天地九月乙亥北女直四部請内附壬辰李繼遷獻宋俘冬十月丙午以敗宋軍復遣使来告己酉準布等遣使来貢是月駐蹕大王州十一月庚寅以吐谷渾民饑振之丁酉太白畫見十二月癸夘李繼遷下宋麟鄜等州遣使来告女直遣使来貢庚戌遣使封李繼遷為夏國王癸丑回鶻來貢是歲放鄭雲從等二人及第九年春正月甲戌女直遣使來貢丙子詔禁私度僧尼庚辰如臺湖乙酉樞宻使監修國史室昉等進實録賜物有差戊子選宋降卒五百置為宣力軍辛夘詔免三京諸道租賦仍罷括田二月丙午夏國遣使告伐宋捷丁未涿州刺史耶律旺禄為特哩衮甲子建威寇振化来逺三城屯戍卒閏月辛未朔日有食之壬申遣翰林承㫖邢抱朴三司使李嗣給事中劉京政事舍人張幹南宫副留守吴浩分决諸道滯獄三月庚子振室韋烏爾古諸部戊申復遣庫部員外郎馬守琪倉部員外郎祁正虞部員外郎崔祐薊北縣令崔簡等分决諸道滯獄甲子幸南京夏四月甲戌回鶻来貢乙亥夏國王李繼遷遣杜白来謝封冊丙戌清暑炭山五月己未以秦王韓匡嗣私城為全州六月丁亥突厥来貢是月南京霖雨傷稼秋七月癸夘通括户口乙巳詔諸道舉才行察貪酷撫髙年禁奢僭有殁於王事者官其子孫己未夏國以復綏銀二州遣使来告八月癸酉銅州嘉禾生東京甘露降戊寅女直進唤鹿人壬午東京進三足烏九月庚子布古徳來貢己酉駐蹕廟城南京地震冬十月丁夘阿爾斯蘭回鶻来貢壬申夏國王李繼遷遣使上宋所授𠡠命丁丑定難軍節度使李繼捧来附授推忠効順啟聖定難功臣開府儀同三司檢校太師兼侍中封西平王十一月己亥以青牛白馬祭天地十二月夏國王李繼遷潛附于宋遣招討使韓徳威持詔諭之是歳放進士石用中一人及第十年春正月丁酉禁䘮葬禮殺馬及藏甲胄金銀器玩丙午如臺湖二月乙丑朔日有食之韓徳威奏李繼遷稱故不出至靈州俘掠以還壬申烏舎來貢壬午免雲州租賦庚寅夏國以韓徳威俘掠遣使來奏賜詔安慰辛夘給復雲州流民三月甲辰鐵驪來貢丙辰如炭山夏四月乙丑以臺湖為望幸里庚寅㑹羣臣較射五月癸巳朔州流民給復三年七月辛酉鐵驪來貢八月癸亥觀稼仍遣使分閲苗稼九月癸夘幸五臺山金河寺飯僧冬十月壬申夏國王遣使來貢戊寅鐵驪來貢十一月壬辰回鶻來貢十二月庚辰獵儒州東川拜天是月以東京留守蕭恒徳等伐高麗十一年春三月壬寅回鶻來貢丙午出内帑錢賜南京統軍司軍髙麗王治遣朴良柔奉表請罪詔取女直鴨渌江東數百里地賜之二月癸亥霸州民妻王氏以妖惑衆伏誅夏四月幸炭山清暑六月大雨秋七月己丑桑乾羊河溢居庸關西害禾稼殆盡奉聖南京居民廬舍多熱溺者八月如秋山冬十月甲申朔駐蹕富瑚坂是歳放進士王熈載等二人及第十二年春正月癸丑朔漷隂鎮水漂溺三十餘村詔疏舊渠甲寅同政事門下平章事耶律實埒為特哩衮詔復行在五十里内租乙夘幸延芳淀戊午蠲宜州賦調庚申郎君耶律必舒等謀叛伏誅壬戌以南院大王耶律景為上京留守封漆水郡王霸州民李在宥年百三十有三賜束帛錦袍銀帯月給羊酒仍復其家二月甲申免南京被水户租賦己丑髙麗來貢甲午免諸部歳輸羊及關征庚子回鶻來貢三月丁巳髙麗遣使請所俘人畜詔贖還戊午幸南京丙寅遣使撫諭髙麗己巳涿州木連理壬申如長春宫觀牡丹是月復置南京統軍都監夏四月辛夘幸南京壬辰樞密直學士劉恕為南院樞密副使戊戌以景宗石像成幸延夀寺飯僧五月甲寅詔北皮室軍老不任事者免役戊午如炭山清暑庚辰武定軍節度使韓徳冲秩滿其民請留從之六月辛巳朔詔州縣長吏有才能無過者减一資考任之癸未汗州刺史賈俊進呈新厯庚子録囚甲辰詔龍鳯兩軍老疾者代之是月太白歳星相犯秋七月辛亥朔日有食之甲寅遣使視諸道禾稼辛酉南院樞密使室昉為中京留守加尚父丙寅女直遣使來貢戊辰觀穫庚午詔契丹人犯十惡者依漢律己夘以翰林承㫖邢抱朴參知政事八月庚辰朔詔皇太妃領西北路烏爾古等部兵及永興宫分軍撫定西邊以蕭達林督其軍事乙酉宋遣使求和不許戊子國舅帳尅蕭圖格為伊勒希巴乙未下詔戒諭中外官吏丁酉録囚雜犯死罪以下釋之九月壬子室韋党項吐谷渾等來貢辛酉宋復遣使求和不許壬戌行拜奥禮癸酉凖布等來貢冬十月乙酉獵于汗州之西山乙巳詔定均税法丁未大理寺置少卿及正十一月戊申朔行再生禮鐵驪來貢詔諸部所俘宋人有官吏儒生抱器能者諸道軍有勇徤者具以名聞庚戌詔郡邑貢明經茂材異等甲寅詔南京决滯獄己未官宋俘衛徳升等六人十二月戊寅朔日有食之詔并奚王府敖拉托輝瑪展三部為一其二尅各分為部以足六部之數甲甲賜南京綂軍司貧户耕牛戊子高麗進妓樂却之庚寅禁游食民癸巳女直以宋人浮海賂本國及烏舍叛來告丁未幸南京是年放進士吕徳懋等二人及第十三年春正月壬子幸延芳淀甲寅置廣靈縣丁巳増泰州遂城等縣賦庚申詔諸道勸農癸亥長寧軍節度使蕭嘉哩秩滿民請留從之庚午如長春宫二月丁丑女直遣使來貢甲辰高麗遣李周禎來貢三月癸丑夏國遣使來貢戊辰武清縣百餘人入宋境剽掠命誅之還其所獲人畜財物夏四月己卯參知政事邢抱朴以母憂去官起復丙戌詔諸道民户應厯以來脅從為部曲者仍籍州縣甲午如炭山清暑五月壬子高麗進鷹乙亥北南伊實三府請括富民馬以備軍需不許給以官馬六月丙子朔啟聖軍節度使劉繼琛秩滿民請留從之丁丑詔減前嵗括田租賦甲申以宣徽使阿穆爾私城為豐州丙戌詔許昌平懐柔等縣諸人請業荒地秋七月乙巳朔女直遣使來貢丁巳烏舎烏哲圖渤海雅木丕勒等侵鐵驪遣奚王和碩鼐等討之壬戌詔蔚朔等州龍衛威勝軍更戌八月丙子夏國遣使進馬壬辰詔修山澤祠宇先哲廟貎以時祀之九月戊午以南京太學生員浸多特賜水磑莊一區丁卯奉安景宗及皇太后石像于延芳淀冬十月乙亥置義倉辛巳回鶻來貢甲申高麗遣李知白來貢戊子烏舍歸欵詔諭之庚子布古徳來貢十一月乙巳阿爾斯蘭囘鶻使來貢辛酉遣使冊王治為高麗國王戊辰高麗遣童子十人來學本國語十二月己夘鐵驪遣使來貢鷹馬辛巳夏國以敗宋人遣使來告是年放進士王用極等二人十四年春正月己酉漁于潞河丁巳蠲三京及諸州税賦丙寅夏國遣使來貢庚午以宣徽使阿穆爾家奴閻貴為豐州刺史二月庚寅囘鶻遣使來貢三月壬寅高麗王治表乞為婚許以東京留守駙馬蕭恒徳女嫁之庚戌高麗復遣童子十人來學本國語甲寅韓徳威奏討党項捷甲子詔安集朔州流民夏四月甲戌東邊諸糺各置都監庚寅如炭山清暑己亥鑿大安山取劉守光所藏錢是月奚王和碩鼐東京留守蕭恒徳等五人以討烏舍不克削官改諸部令公為節度使五月癸夘詔參知政事邢抱朴决南京滯獄庚戌朔州威勝軍一百七人叛入宋六月辛未如炭山清暑鐵驪來貢乙酉囘鶻來貢己丑高麗遣使來問起居後至無時秋七月戊午囘鶻等來貢閏月丁丑五院部進穴地所得金馬冬十月丙辰命劉遂教南京神武軍士劒法賜袍帶錦幣戊午烏哲圖乞内附十一月甲戌詔諸軍官毋非時畋獵妨農乙酉奉安景宗及太后石像于乾州是月回鶻阿爾斯蘭請為子求婚不許十二月甲寅以南京道新定税法太重減之甲子達林誘叛酋阿勒坦等六十人斬之封蘭陵郡王幸南京是年放進士張儉等三人十五年春正月庚午幸延芳淀丙子以河西党項叛詔韓徳威討之庚辰詔諸道勸民種樹癸未烏舍長武周來降戊子女直遣使來貢己丑詔南京决滯囚乙未免流民税二月丙申朔如長春宫戊戌勸品部富民出錢以贍貧民庚子徙梁門遂城泰州北平民於内地丙午夏國遣使來貢甲寅問安皇太后丙辰韓徳威奏破党項捷丁巳詔品部曠地令民耕種三月乙丑朔党項來貢戊辰募民耕濼州荒地免其租賦十年己巳夏國破宋兵遣使來告己夘封夏國王李繼遷為西平王壬午通括宫分人户免南京逋税及義倉粟甲申河西党項乞内附庚寅烏舎烏哲圖以地逺乞嵗時免進鷹馬貂皮詔以生辰正旦貢如舊餘免癸巳宋主炅殂子恒嗣位甲午皇太妃獻西邊捷夏四月乙未朔罷奚王部嵗貢麕戊戌録囚壬寅發義倉粟賑南京諸縣民丙午廣徳軍節度使韓徳凝有善政秩滿其民請留從之己酉幸南京丁巳致奠于太宗皇帝廟己未如炭山清暑五月甲子日有食之己巳詔平州決滯獄是月徳哷勒八部殺詳衮以叛蕭達林追擊獲部族之半六月丙申鐵驪來貢壬子夏國遣使來謝封冊秋七月戊辰党項來貢辛未禁吐谷渾别部鬻馬於宋丙子高麗遣韓彦敬奉幣弔越國公主之喪辛卯詔南京疾決獄訟八月丁酉獵于平地松林皇太后誡曰前聖有言欲不可縱吾兒為天下主馳騁田獵萬一有銜橛之變適遺予憂其深戒之九月丙寅罷東邊戍卒庚午幸饒州致奠太祖廟戊子蕭達林奏討準布㨗冬十月壬辰朔駐蹕駞山罷奚王諸部貢物乙未賜宿衛時服丁酉禁諸山寺毋濫度僧尼戊戌弛東京道魚濼之禁戍申以上京獄訟繁冗詰其主者辛酉錄囚十一月壬戌朔録囚丙戌幸顯州戊子謁顯陵庚寅謁乾陵是月高麗王治薨姪誦遣王同潁來告十二月乙巳釣魚土河己酉駐蹕駞山壬子夏國遣使來貢甲寅遣使祭髙麗王治詔其姪權知國事丙辰録囚是年放進士陳鼎等二人遼史卷十三
