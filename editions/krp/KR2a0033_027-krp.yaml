body:
  text: 遼史卷二十七元中書右丞相總裁托克托等修本紀第二十七天祚皇帝一天祚皇帝諱延禧字延寧小字阿果道宗之孫父順宗大孝順聖皇帝母貞順皇后蕭氏太康元年生六嵗封梁王加守太尉兼中書令後三年進封燕國王大安七年總北南院樞宻使事加尚書令為天下兵馬大元帥壽隆七年正月甲戌道宗崩奉遺詔即皇帝位于柩前羣臣上尊號曰天祚皇帝二月壬辰朔改元乾統大赦詔為耶律伊遜所誣陷者復其官爵籍没者出之流放者還之乙未遣使告哀于宋及西夏高麗乙巳以北府宰相蕭烏納為遼興軍節度使加守太傅三月丁夘詔有司以張孝傑家属分賜羣臣甲戌召僧法頤放戒于内庭夏四月旱六月庚寅朔如慶州甲午宋遣王潛等来弔祭丙申高麗夏國各遣使慰奠戊戌以南府宰相額特埒兼南院樞宻使庚子追諡懿徳皇后為宣懿皇后壬寅以宋魏國王和囉噶為天下兵馬大元帥乙巳以北平郡王淳進封鄭王丁未北院樞宻使耶律阿蘇加裕悦辛亥塟仁聖大孝文皇帝宣徳皇后于慶陵秋七月癸亥凖布鐡驪来貢八月甲寅謁慶陵九月壬申謁懷陵乙亥駐蹕藕絲淀冬十月壬辰謁乾陵甲辰上皇考昭懷太子諡曰大孝順聖皇帝廟號順宗皇妣曰貞順皇后十二月戊子以樞宻副使張琳知樞宻院事翰林學士張奉珪參知政事兼同知樞宻院事癸巳宋遣黄實来賀即位丁酉高麗夏國並遣使来賀己巳詔先朝己行事不得陳告初以英格為生女直部節度使其俗呼為太師是嵗英格死傳于兄之子武雅淑武雅淑死其弟阿固達襲二年春正月如鴨子河二月辛夘如春州三月大寒氷復合夏四月丁亥詔誅伊遜黨徙其子孫于邊發伊遜塔喇台之墓剖棺戮屍以其家屬賜被殺之家五月乙丑額特埒獻額圗格爾等部㨗六月壬辰以雨罷獵駐蹕散水原丙午夏國王李乾順復遣使請尚公主丁未南院大王辰嘉努致仕壬子李乾順為宋所攻遣李造福田若水求援閏月庚申䇿賢良壬申降惠妃為庶人秋七月獵黒嶺以霖雨給獵人馬凖布来侵額特埓等戰敗之冬十月乙夘蕭哈里叛刼乾州武庫器甲命北面林牙赫嘉努捕之蕭哈里奔彭楚水阿克展部丙寅以南府宰相耶律額特埒為北院樞宻院參知政事牛温舒知南院樞宻使事十一月乙未赫嘉努以不獲蕭哈里免官壬寅以上京留守耶律慎思為北院樞宻副使有司請以帝生日為天興節三年春正月辛巳朔如混同江女直函蕭哈里首遣使来獻戊申如春州二月庚午以武清縣大水弛其陂澤之禁夏五月戊子以獵人多亡嚴立科禁乙巳清暑齊老嶺丙午謁慶陵六月辛酉夏國王李乾順復遣使請尚公主秋七月中京雨雹傷稼冬十月甲辰如中京己未吐蕃遣使来貢庚申夏國復遣使求援己巳有事于觀徳殿十一月丙申文武百官加上尊號曰惠文智武聖孝天祚皇帝大赦以宋魏國王和囉噶為皇太叔梁王塔魯封燕國王鄭王淳為東京留守封越國王百官各進一階丁酉以特哩袞耶律和囉木薩噶為南院大王戊戌以受尊號告廟乙巳謁太祖廟追尊太祖之高祖曰昭烈皇帝廟號肅祖妣曰昭烈皇后曽祖曰莊敬皇帝廟號懿祖妣曰莊敬皇后召監修國史耶律儼纂太祖諸帝實録十二月戊申如藕絲淀是年放進士馬恭囘等百三人四年春正月戊子幸魚兒濼壬寅獵木嶺癸夘燕國王塔魯薨二月丁丑布古徳遣使来貢夏六月甲辰駐蹕旺國崖甲寅夏國遣李造福田若水求援癸亥吐蕃遣使来貢秋七月南京蝗庚辰獵南山癸未以西北路招討使蕭塔喇台北院樞宻副使耶律慎思並知北院樞宻使事辛夘以同知南院樞宻使事蕭廸里為西北路招討使冬十月己酉鳯凰見于漷陰己未幸南京十一月乙亥御迎月樓賜貧民錢十二月辛丑以張琳為南府宰相五年春正月乙亥夏國遣李造福等来求援且乞伐宋庚寅以遼興軍節度使蕭常格為北府宰相丁酉遣樞宻直學士高端禮等諷宋罷伐夏兵二月癸夘微行視民疾苦丙午幸鴛鴦濼三月壬申以族女南仙封成安公主下嫁夏國王李乾順夏四月甲申射虎炭山五月癸夘清暑南崖壬子宋遣曽孝廣王戩報聘六月甲戌夏國遣使来謝及貢方物己丑幸哈爾吉秋七月謁慶陵九月辛亥駐蹕藕絲淀乙夘謁乾陵冬十一月戊戌禁商賈之家應進士舉丙辰高麗三韓國公王顒薨子俁遣使来告十二月己巳夏國復遣李造福田若水求援癸酉宋遣林洙来議與夏約和六年春正月辛丑遣知北院樞宻使蕭塔喇台知南院樞宻使事牛温舒使宋諷歸所侵夏地夏五月清暑散水原六月辛巳夏國遣李造福等來謝秋七月癸巳凖布來貢甲午如黒嶺庚子獵鹿角山冬十月己亥宋與夏通好遣劉正符曹穆來告庚辰以皇太叔南京留守和囉噶兼特哩衮東京留守越王淳為南府宰相十一月乙未以謝家努為南院大王瑪諾勒為奚六部大王丙申行柴册禮戊戌大赦以和囉噶為義和仁聖皇太叔越王淳進封魏國王封皇子額嚕温為晉王實納埒為饒樂郡王己亥謁太祖廟甲辰祠木葉山十二月己巳封耶律儼為漆水郡王餘官進爵有差七年春正月釣魚于鴨子河二月駐蹕大魚濼夏六月次散水原秋七月如黒嶺冬十月謁乾陵獵醫巫閭山是年放進士李石等百人八年春正月如春州夏四月丙申封髙麗王俁為三韓國公贈其父顒為髙麗國王五月清暑散水原六月壬辰西北路招討使蕭迪里率諸番來朝丙申射栁祈雨壬寅夏國王李乾順以成安公主生子遣使来告丁未如黒嶺秋七月戊辰以雨罷獵冬十二月己夘髙麗遣使來謝九年春正月丙午朔如鴨子河二月如春州三月戊午夏國以宋不歸地遣使來告夏四月壬午五國部來貢六月乙亥清暑特哩嶺秋七月隕霜傷稼甲寅獵于哈爾吉八月丁酉雪罷獵冬十月癸酉望祀木葉山丁丑詔免今年租税十二月甲申高麗遣使来貢是年放進士劉楨等九十人十年春正月辛丑預行立春禮如鴨子河六月庚午朔駐蹕大魚濼夏四月丙子五國部長来貢丙戌預行再生禮癸巳獵于北山六月甲戌清暑玉丘癸未夏國遣李造福等来貢甲午凖布来貢秋七月辛丑謁慶陵閏月辛亥謁懷陵己未謁祖陵壬戌皇太叔和囉噶薨九月甲戌免重九節禮冬十月駐蹕藕絲淀十二月己酉改明年元是嵗大饑天慶元年春正月釣魚于鴨子河二月如春州三月乙亥五國部長来貢夏五月清暑散水原秋七月獵冬十月駐蹕藕絲淀二年春正月己未朔如鴨子河丁丑五國部長来貢二月丁酉如春州幸混同江釣魚界外生女直酋長在千里内者以故事皆来朝適遇頭魚宴酒半酣上臨軒命諸酋次第起舞獨阿固達辭以不能諭之再三終不從他日上宻謂樞宻使蕭奉先曰前日之燕阿固達意氣䧺豪顧視不常可託以邊事誅之否則必貽後患奉先曰粗人不知禮義無大過而殺之恐傷向化之心假有異志又何患其弟武奇邁尼雅滿瑚實等嘗從獵能呼鹿刺虎摶熊上喜輒加官爵夏六月庚寅清暑南崖甲午和州囘鶻来貢戊戌成安公主来朝甲辰凖布来貢秋七月乙丑獵南山九月己未射獲熊燕羣臣上親御琵琶初阿固達混同江燕歸疑上知其異志遂稱兵併旁近部族女直卓克算阿古齊拒之阿固達虜其家屬二人走訴咸州詳衮司送北樞宻院樞宻使蕭奉先作常事以聞上仍送咸州詰責欲使自新後數召阿固達竟稱疾不至冬十月辛亥高麗三韓國公王俁之母死来告即遣使致祭起復是月駐蹕奉聖州十一月乙夘幸南京丁夘謁太祖廟是年放進士韓昉等七十七人二年春正月丙寅賜南京貧民錢丁夘如大魚濼甲戌禁僧尼破戒丙子獵狗牙山大寒獵人多死三月籍諸道户徙達里庫山圍場地居民于别土阿古達一日率五百騎突至咸州衆大驚翌日赴詳衮司與卓克算等面折庭下阿固達不屈送所司問狀一夕遁去遣人訴于上謂詳衮司欲見殺故不敢留自是召不復至夏閏四月李洪以左道聚衆為亂支解分示五京六月乙夘烏梁海國遣使来貢良犬丙辰夏國遣使来貢秋七月幸秋山九月駐蹕藕絲淀十一月甲午以三司使虞融知南院樞宻使事西南面招討使蕭樂古為南府宰相十二月庚戌高麗遣使来謝致祭癸丑囘鶻遣使来貢甲寅以樞宻直學士馬人望參知政事丙辰知樞宻院事耶律儼薨癸亥高麗遣使来謝起復四年春正月如春州初女直起兵以赫舍哩部人阿蘇不從遣其部薩該討之阿蘇弟達呼布来告詔諭使勿討不聽阿蘇來奔至是女直遣使来索不發夏五月清暑散水原秋七月女直復遣使取阿蘇不發乃遣侍御阿息保問境上多建城堡之故女直以慢語答曰若還阿蘇朝貢如故不然城未能已遂發渾河北諸軍益東北路統軍司阿固達與弟尼雅滿瑚實等謀以尼楚赫伊哷羅索棟摩等為帥集女直諸部兵擒遼障鷹官及攻寧江州東北路統軍司以聞時上在慶州射鹿聞之畧不介意遣海州刺史高仙壽統渤海軍應援蕭托卜嘉遇女直戰敗于寧江東冬十月壬寅以守司空蕭嗣先為東北路都統靜江軍節度使蕭托卜嘉為副發契丹奚軍三千人中京禁兵及土豪二千人别選諸路武勇二千餘人以虞候崔公義為都押官控鶴指揮邢穎為副引軍屯出河店兩軍對壘女直軍潛渡混同江掩擊遼衆蕭嗣先軍潰崔公義邢穎耶律佛哩蕭噶克實等死之其獲免者十七人蕭奉先懼其弟嗣先獲罪輒奏東征潰軍所至刼掠若不肆赦恐聚為患上從之嗣先但免官而已諸軍相謂曰戰則有死而無功退則有生而無罪故士無闘志望風奔潰十一月壬辰都統蕭廸里等營于沃稜濼東又為女直所襲士卒死者甚衆甲午蕭廸里亦坐免官辛丑以西北路招討使耶律鄂爾多為行軍都統副㸃檢蕭伊實同知南院樞宻使事耶律章努副之十二月咸賓祥三州及鐡驪烏舍皆叛入女直伊實往援賔州南軍諸將實喇塔喇等往援咸州並為女直所敗遼史卷二十七遼史卷二十七考證天祚紀一五年十二月己巳夏國復遣李造福田若水求援癸酉宋遣林洙來議與夏約和林洙宋史作林攄遼史卷二十七考證
