body:
  text: 遼史卷六十元中書右丞相總裁托克托等修志第二十九食貨志下征商之法則自太祖置羊城於炭山北起𣙜務以通諸道市易太宗得燕置南京城北有市百物山㣥命有司治其征餘四京及它州縣貨產懋遷之地置亦如之東平郡城中置看樓分南北市禺中交易市北午漏下交易市南雄州髙昌渤海亦立互市以通南宋西北諸部髙麗之貨故女直以金帛布蜜蠟諸藥材及鐵驪靺鞨伊濟等部以蛤珠青鼠貂鼠膠魚之皮牛羊駞馬毳罽等物來易於遼者道路繦屬聖宗統和初燕京留守司言民艱食請弛居庸關稅以通山西糴易又令有司諭諸行宫布帛短狹不中為度者不粥於市明年詔以南北府市場人少宜率當部車百乘赴集開奇峯路以通易州貿易二十三年振武軍及保州竝置𣙜場時北院大王耶律實魯以俸羊多闕部人貧乏請以羸老之羊及皮毛易南中之絹上下為便至天祚之亂賦歛旣重交易法壞財日匱而民日困矣鹽筴之法則自太祖以所得漢民數多卽八部中分古漢城别為一部治之城在炭山南有鹽池之利卽後魏滑鹽縣也八部皆取食之及征幽薊還次于和拉濼命取鹽給軍自後濼中鹽益多上下足用會同初太宗有大造於晉晉獻十六州地而瀛莫在焉始得河間煮海之利置𣙜鹽院於香河縣於是燕雲迤北暫食滄鹽一時產鹽之地如渤海鎭城海陽豐州陽洛城廣濟湖等處五京計司各以其地領之其煎取之制歲出之額不可得而詳矣坑治則自太祖始併室韋其地產銅鐵金銀其人善作銅鐵器又有哈準部者多鐵哈準國語鐵也部置三冶曰柳濕河曰賽音楚古爾蘇曰手山及平渤海得廣州本渤海鐵利府改曰鐵利州地亦多鐵東平縣本漢襄平縣故地產鐵丱置採煉者三百戸隨賦供納以諸坑冶多在國東故東京置戸部司長春州置錢帛司太祖征幽薊師還次山麓得銀鐵丱命置冶聖宗太平間於潢河北陰山及遼河之源各得金銀丱興冶採煉自此以訖天祚國家皆頼其利鼓鑄之法先代色勒迪為額爾奇木以土產多銅始造錢幣太祖因襲而用之遂致富彊以開帝業太宗置五冶太師以總四方錢鐵石敬瑭又獻沿邊所積錢以備軍實景宗以舊錢不足於用始鑄乾亨新錢錢用流布聖宗鑿大安山取劉守光所藏錢散諸五計司兼鑄太平錢新舊互用由是國家之錢演迆域中所以統和出内藏錢賜南京諸軍司開泰中詔諸道貧乏百姓有典質男女計傭價日以十文折盡還父母每歲春秋以官錢宴饗將士錢不勝多故東京所鑄至清寧中始用是時詔禁諸路不得貨銅鐵以防私鑄又禁銅鐵賣入回鶻法益嚴矣道宗之世錢有四等曰咸雍曰太康曰大安曰壽隆皆因改元易名其肉好銖數亦無所考第詔楊遵朂徴戸部司逋戸舊錢得四十餘萬繦拜樞密直學士劉伸為戸部使歲入羡餘錢三十萬繦擢南院樞密使其以災沴出錢以振貧乏及諸宫分邊戍人戸是時雖未有貫朽不可較之積亦可謂富矣至其末年經費浩穰鼓鑄仍舊國用不給雖以海雲佛寺千萬之助受而不拒尋禁民錢不得出境天祚之世更鑄乾統天慶二等新錢而上下窮困府庫無餘積始太祖為德埓勒府額爾奇木也懲約尼氏單弱撫諸部明賞罰不妄征討因民之利而利之羣牧蓄息上下給足及卽位伐河東下代北郡縣獲牛羊駞馬十餘萬樞密使耶律色珍討女直復獲馬二十餘萬分牧水草便地數歲所增不勝算當時括富人馬不加多賜大小鶻軍萬餘匹不加少蓋蓄牧有法然也咸雍五年蕭托輝為馬羣太保上書猶言羣牧名存實亡上下相欺宜括實數以為定籍厥後東丹國歲貢千匹女直萬匹珠巴克等國萬匹準布武都温特哩衮各二萬匹西夏室韋各三百匹伊勒圖博和哩鄂羅木富珠哩鐵驪等諸部三百匹仍禁朔州路羊馬入宋托歡党項馬鬻于夏以故羣牧滋繁數至百有餘萬諸司牧官以次進階自太祖及興宗埀二百年羣牧之盛如一日天祚初年馬猶有數萬羣每羣不下千疋祖宗舊制常選南征馬數萬疋牧于雄霸清滄間以備燕雲緩急復選數萬給四時遊畋餘則分地以牧法至善也至末年累與金戰番漢戰馬損十六七雖增價數倍竟無所買乃冒法買官馬從軍諸羣牧私賣日多畋獵亦不足用遂為金所敗棄衆播遷以訖于亡松漠以北舊馬皆為達實林牙所有遼之食貨其可見者如是耳至於鄰國歲幣諸屬國歲貢土宜雖累朝軍國經費多所仰給然非本國所出况名數已見本紀兹不復載夫冀北宜馬海濱宜鹽無以議為遼地半沙磧三時多寒春秋耕穫及其時黍稌髙下因其地蓋不得與中土同矣然而遼自初年農榖充羡振饑恤難用不少靳旁及鄰國沛然有餘果何道而致其利歟此無他勸課得人規措有法故也世之論錢幣者恒患其重滯之難致鼓鑄之弗給也於是楮幣權宜之法興焉西北之通舟楫比之東南十纔一二遼之方盛貨泉流衍國用以殷給戍賞征賜與億萬未聞有所謂楮幣也又何道而致其便歟此無他舊儲新鑄竝聽民用故也孟子曰周于利者凶年不能殺人力苟至一夫猶足以勝時災况為國乎以是知善謀國者有道以制天時地利之宜無往而不遂其志食莫大於穀貨莫大於錢特志二者以表遼初用事之臣亦善裕其國者矣遼史卷六十遼史卷六十考證聖宗統和初燕京留守司請弛居庸關稅按聖宗紀備載于元年九月是年六月已改元統和此事自應繫之統和原作乾亨間誤今改禁諸路不得貨銅鐵按道宗紀清寧八年禁南京貨鐵九年禁鬻銅自係兩事原本訛銅鐵為銅錢今改西夏室韋各三百匹案契丹志夏國歲貢細馬二十匹麤馬二百匹駝百匹與此異遼史卷六十考證
