body:
  text: 遼史卷三元中書右丞相總裁托克托等修本紀第三太宗上太宗孝武恵文皇帝諱徳光字徳謹小字耀庫濟太祖次子母淳欽皇后舒嚕氏唐天復二年生神光異常獵者獲白鹿白鷹人以為瑞及長貎嚴重而性寛仁軍國事多所取决天贊元年授天下兵馬大元帥尋詔統六軍南徇地明年下平州獲趙思温張崇回破箭笴山呼遜奚諸部悉降復以兵掠鎮定所至皆堅壁不敢戰師次幽州符存審拒扵州南縱兵邀擊大破之擒禆将裴信等數十人及従太祖破伊竒哩諸部定河壖党項下山西諸鎮取回鶻單于城東平渤海破達囉克部東西萬里所向皆有功天顯元年七月太祖崩皇后攝軍國亊明年秋治祖陵畢冬十一月壬戌人皇王貝率羣臣請于后曰皇子大元帥勲望中外攸屬宜承大統后従之是日即皇帝位癸亥謁太祖廟丙寅行柴冊禮戊辰還都壬申御宣政殿羣臣上尊號曰嗣聖皇帝大赦有司請改元不許十二月庚辰尊皇太后為太皇太后皇后為應天皇太后立妃蕭氏為皇后禮畢閲近侍班局辛巳諸道将帥辭歸鎮己丑祀天地庚寅遣使諭諸國辛卯閲羣牧于近郊戊戌女直遣使来貢壬寅謁太祖廟甲辰閲旗鼓客省諸局官屬丁未詔選約尼氏九帳子弟可任官者三年春正月己酉閲北剋兵籍庚戌閲南剋兵籍丁巳閲皮室伊喇摩哩三軍己未黄龍府羅寜河女直達囉克来貢庚午以王郁為興國莭度使守中書令二月幸長濼己亥特哩衮尼嚕古進白狼辛丑達囉克来貢三月乙卯東蒐癸亥獵羖䍽山乙丑獵松山唐義武軍節度使王都遣人以定州来歸唐主出師討之使来乞援命奚圗哩塔拉徃救之四月戊寅東巡己卯祭麃鹿神丁亥扵獵所縦公私取羽毛革木之材甲午取箭材赤山丙申獵三山塔拉敗王宴球于定州唐兵大集塔拉亟請益師辛丑命特哩衮尼嚕古都統扎拉赴之五月丙午建天膳堂獵索囉山戊申至自獵丁夘命林牙圗魯卜討烏爾古部己巳女直来貢六月己夘行色克色哩禮秋七月丁未圗魯卜獻㨗壬子王都奏唐兵破定州塔拉死之尼嚕古扎拉等數十人被執上以出師非時甚悔之厚賜戰殁将校之家庚午有亊于太祖廟八月丙子突厥来貢庚辰詔建應天皇太后誕聖碑于儀坤州九月己卯圖魯卜遣人獻烏爾古俘癸未詔分賜羣臣己丑幸人皇王貝第庚寅遣人使唐辛夘再幸人皇王第癸巳有司請以上生日為天授節皇太后生日為永寜節冬十月癸卯朔以永寜節上率羣臣上夀于延和宫己酉謁太祖廟唐遣使遺玉笛甲子天授節上御五鸞殿受羣臣及諸國使賀十一月丙子布古徳来貢辛丑自将伐唐十二月癸卯祭天地庚戌聞唐主復遣使来聘上問左右皆曰唐數遣使来實畏威也未可輕舉觀釁而動可也上然之甲寅次杏堝唐使至遂班師時人皇王在皇都詔遣耶律伊濟遷東丹民以實東平其民或亡入新羅女直因詔困乏不能遷者許上國富民給贍而隸屬之升東平郡為南京四年春正月壬申朔宴羣臣及諸國使觀俳優角觝戯己卯如𤓰堝二月庚戌閲約尼氏戸籍三月甲午望祀羣神夏四月辛亥至自𤓰堝壬子謁太祖廟癸丑謁太祖行宫甲寅幸天城軍謁祖陵辛酉人皇王貝来朝癸亥録囚五月癸酉謁二儀殿宴羣臣女直来貢戊子射栁于太祖行宫癸巳行色克色哩禮六月丙午圗魯卜獻烏爾古俘分賜将士己酉西巡己未選輕騎數千獵近山癸亥駐蹕凉陘秋七月庚辰觀市曲赦繫囚甲午祠太祖而東八月辛丑至凉陘謁太祖廟癸卯幸人皇王第己酉謁太祖廟九月庚午如南京戊寅祠木葉山己卯行再生禮癸巳至南京冬十月壬寅幸人皇王第宴羣臣甲辰幸諸營閲軍籍庚戌以雲中郡縣未下大閲六軍甲子詔皇弟魯呼帥師趣雲中討郡縣之未附者十一月丙寅朔以出師告天地丁卯餞皇弟魯呼于西郊壬申命大内特哩衮告出師于太祖行宫甲申觀漁三义口十二月戊申女直来貢戊午至自南京五年春正月庚午皇弟魯呼㧞寰州捷至甲午朝皇太后二月己亥詔修南京癸卯魯呼還自雲中朝于行在丙午以先所俘渤海户賜魯呼丙辰工與人皇王朝皇太后太后以皆工書命書于前以觀之辛酉召羣臣議軍國亊三月丙寅朝皇太后丁卯皇弟魯呼請赦宗室鍚里郎君以罪繫獄者詔従之己巳幸皇叔安圗第辛未人皇王獻白紵乙亥冊皇弟魯呼為夀昌皇太子兼天下兵馬大元帥壬午以龍化州節度使劉居言同中書門下平章亊乙酉宴人皇王僚屬便殿庚寅駕發南京夏四月乙未詔人皇王先赴祖陵謁太祖廟丙辰會祖陵人皇王歸國五月戊辰詔修褭潭離宫乙酉謁太祖廟六月己亥射栁于行在遂如㳂栁湖丁巳拜太祖御容于明殿己未達魯特来貢秋七月壬申烏爾古来貢戊子薦時果于太祖廟八月丁酉以大聖帝后宴寝之所號日月宫因建日月碑丙午如九層臺九月己夘詔鍚里普寜撫慰人皇王庚辰詔置人皇王儀衛丁亥至自九層臺謁太祖廟冬十月戊戌遣使賜人皇王胙癸夘建太祖聖功碑于舒伊旺尼珠琿温甲辰人皇王進玉笛十一月戊寅東丹奏人皇王浮海適唐六年春正月甲子西南邉將以慕化哈噶斯國人来乙丑達魯特来貢丁夘如南京三月辛未召大臣議軍國事丁亥人皇王貝妃蕭氏率其國僚屬来見夏四月己酉唐遣使来聘是月置中臺省于南京五月乙丑祠木葉山乙亥至自南京壬午謁太祖陵閏月庚寅射栁近郊六月壬申如凉陘壬午烏爾古来貢秋七月丁亥女直来貢己酉命将校以兵南畧壬子薦時果于太祖廟東幸八月庚申皇子舒嚕生告太祖廟辛巳布古徳来貢九月甲午詔修京城冬十月丁丑鐡驪来貢十一月乙酉唐遣使来聘十二月甲寅朔祭太祖廟丙辰遣人以詔賜唐盧龍軍節度使趙徳鈞七年春正月壬辰征西将軍科里遣伊喇多科奏軍亊己亥唐遣使来聘癸夘遣人使唐戊申祠木葉山二月壬申伊刺迪里使吴越還吴越王遣使従獻寳器復遣使持幣往報之三月己丑林牙徳勒賓指斥乘輿囚之丁未遣使諸國戊申上率羣臣朝于皇太后夏四月甲戌唐遣使来聘致人皇王貝書己卯女直来貢五月壬午幸祖州謁太祖陵六月戊辰御製太祖建國碑戊寅烏爾古逹魯特来貢庚辰觀角觝戲秋七月辛巳朔賜中外官吏物有差癸未賜高年布帛丙戌召羣臣耆老議政壬辰唐遣使遺紅牙笙癸巳使復至懼報定州之役也壬寅唐盧龍軍節度使趙徳鈞遣人進時果丁未薦新于太祖廟八月壬戌捕扵㳂栁湖風雨暴至舟覆溺死者六十餘人命存恤其家識以為戒戊辰林牙徳勒賔逸囚復獲而鞫之知其事本誣構釋之九月庚子凖布来貢冬十月乙夘唐遣使来聘己巳遣使雲中十一月丁亥遣使存問呼哩國丁未凖布貢海東青鶻三十連十二月辛亥以叛人尼嚕古家口分賜羣臣丁巳西狩駐蹕平地松林八年春正月戊子女直来貢庚子命皇太弟魯呼左威衛上将軍色克率兵伐党項癸夘上親餞之二月辛亥吐谷渾凖布来貢乙夘剋舒嚕使唐還以附獻物分賜羣臣三月辛夘皇太弟討党項勝還宴勞之丙申唐遣使請罷征党項兵上以戰捷及党項已聴命報之夏四月戊午党項来貢五月己丑獵獨牛山特哩衮達年所乘内廐騮馬斃因名其山曰騮山戊戌如㳂栁湖六月甲寅準布来貢甲子回鶻阿爾斯蘭来貢秋七月戊寅行納后禮癸未皇子特哩衮生丁亥鐡驪女直準布来貢冬十月乙巳準布来貢丙午至自㳂栁湖辛亥唐遣使来聘己未遣巴拉使唐辛未烏爾古圗魯木来貢十一月辛丑太皇太后崩遣使告哀于唐及人皇王貝唐主嗣源殂子従厚立十二月丁夘党項来貢九年春正月癸酉漁于土河丙申党項貢駞鹿己亥南京進白麞閏月戊午唐遣使告哀即日遣弟弔祭壬戌東幸女直来貢二月壬申祠木葉山戊寅葬太皇太后于德陵前二日發喪于菆塗殿上具衰服以送後追諡宣簡皇后詔建碑于陵三月癸卯女直来貢夏四月唐李従珂弑其主自立人皇王貝自唐上書請討五月甲辰如㳂栁湖癸丑女直来貢大星晝隕六月己巳朔布古徳来貢辛未唐李従厚謝弔祭所遣使初至闕秋八月壬午自将南伐乙酉伊喇嘉哩手接飛鴈上異之因以祭天地九月庚子西南星隕如雨乙夘次雲州丁巳㧞河陰冬十月丁亥畧地靈立父老進牛酒犒師十一月辛丑圍武州之陽城壬寅陽城降癸夘斡齊爾城降括所俘丁壮籍于軍十二月壬辰皇子安巴薩哈勒生皇后不豫是月駐蹕百湖之西南十年春正月戊申皇后崩于行在二月戊寅百僚請加追諡不許辛巳宰相尼嚕古謀南奔事覺執之三月戊午党項来貢夏四月吐谷渾酋推勒伊徳率衆内附丙戌皇太后父族及母前夫之族二帳竝為國舅以蕭黙色為尚父領之己丑錄囚五月甲午朔始製服行后喪丙午葬于奉陵上自製文諡曰彰德皇后癸丑以鍚里王庭鶚為龍化州節度使六月乙丑托歡来貢辛未幸頻布里淀秋七月乙夘獵納卜齊山冬十一月丙午幸𢎞福寺為后飯僧見觀音畫像乃大聖皇帝應天皇后及人皇王所施顧左右曰昔與父母兄弟聚觀扵此嵗時未㡬今我獨来悲嘆不已乃自製文題于壁以極追感之意讀者悲之十二月庚辰如金瓶濼遣伊喇華格科爾羅和囉木薩噶等捉生敵境十一年春正月釣魚于土河庚申如潢河三月庚寅朔女直来貢夏四月庚申謁祖陵戊辰還都謁太祖廟辛未燕民之復業者陳汴州事冝癸酉女直諸部来貢癸未賜回鶻使衣有差五月戊戌清暑㳂栁湖六月戊午布古徳来貢乙酉吐谷渾来貢秋七月辛夘烏爾古来貢壬辰佛古寜公主率三河烏爾古来朝丙申唐河東即度石敬瑭為其主所討遣趙瑩因西南路招討羅卜科求救上白太后曰李従珂弑君自立神人共怒宜行天討時趙德鈞亦遣使至河東復遣桑維翰来告急遂許興師八月己未遣蕭轄哩報河東師期丙寅吐谷渾来貢庚午自将以援敬瑭九月癸巳有飛鴜自墜而死南府額爾竒木和掄得之以獻卜之吉上曰此從珂自滅之兆也丁酉入鴈門戊戌次忻州祀天地己亥次太原庚子遣使諭敬瑭曰朕興師逺来當即與卿破賊㑹唐将高行周符彥卿以兵来拒遂勒兵陳于太原及戰佯為之却唐将張敬達楊光逺又陳于西未成列以兵薄之而行周彥卿為伏兵所㫁首尾不相救敬達光逺大敗棄仗如山斬首數萬級敬達走保晉安寨額爾竒木達魯與戰死之敬瑭率官屬来見上執手勞之癸夘圍晉安甲辰以達魯子圖勒琿嗣為額爾竒木仍以父字為名以旌其忠南宰相呼喇台奚監軍伊聶濟将軍布哈臨陳退懦上切責之冬十月甲子封敬瑭為晉王幸其府敬瑭與妻李率其親屬捧觴上夀初圍晉安分遣精兵守其要害以絶援兵之路而李従珂遣趙延夀以兵二萬屯團栢谷范延廣以兵二萬屯遼州幽州趙徳鈞以所部兵萬餘由上黨趍延夀軍合勢進擊知此有備皆逗遛不進従珂遂将精騎三萬出次河陽親督諸軍然知其不救但日酣飲悲歌而已丁夘召敬瑭至行在所賜坐上従容語之曰吾三千里舉兵而来一戰而勝殆天意也觀汝雄偉𢎞大宜受兹南土世為我藩輔遂命有司設壇晉陽備禮冊命十一月丁酉冊敬瑭為大晉皇帝自戊戌至戊申候騎兩奏南有兵至復奏西有兵至命特哩衮達年斡拒之敬達在圍八十餘日内外隔絶軍儲殆盡至濯馬糞屑木以飼馬馬飢自相啖其騣尾死則以充食光逺等勸敬達出降敬達曰吾有死而已爾欲降寜斬吾首以降閏月甲子楊光逺安審𤦺殺敬達以降上聞敬達至死不變謂左右曰凡為人臣當如是也命以禮葬所降軍士及馬五千匹以賜晉帝丙寅祀天地以告成功庚午僕射蕭庫克克齊奏趙徳鈞等諸援兵将遁詔夜發兵追擊徳鈞等軍皆投戈棄甲自相蹂踐擠于川谷者不可勝紀仍命皇太子馳輕騎據險要追及步兵萬餘悉降之辛未兵度圍栢谷以酒肴祀天地俄追及徳鈞父子乃率衆降次潞州召諸将議皆請班師従之命南宰相吉琳呼喇台奚監軍伊聶濟将軍布哈先還壬申特哩衮斡林牙徳勒賔来獻俘晉帝辭歸上與宴酒酣執手約為父子以白貂裘一廐馬二十戰馬千二百餞之命徳勒賔将五千騎送入洛臨别謂之曰朕留此候亂定乃還耳辛巳晉帝至河陽李従珂窮蹙召人皇王貝同死不従遣人殺之乃舉族自焚詔收其士卒戰殁者瘞之汾水上以為京觀晉命桑維翰為文紀上功徳十二月乙酉朔遣近侍塔魯存問晉帝丙戌以晉安所獲分賜将校戊子遣使馳奏皇太后及報諸道師還庚寅發太原辛夘聞晉帝入洛遣郎君濟勒台撫問壬辰次細河閱降将趙徳釣父子兵馬戊戌次鴈門以沙太保所部兵分𨽻諸将庚戌幸應州癸丑唐大同彰國振武三節度使迎見留之不遣十二月春正月丙辰次堆子口唐大同軍節度判官吴巒閉城拒命遣崔廷勲圍其城庚申上親征至城下諭之巒降辛酉射鬼箭于雲州北壬戌祀天地癸亥遣國舅安圗發奚西部民各還本土丙寅皇太后遣侍衞舒嚕趣行是夕率輕騎先進丁丑皇子舒嚕迎謁于灤河告功太祖行宫戊寅朝于皇太后進珍玩為夀二月丁亥以軍前所擭俘叛入幽州者皆斬之壬寅詔諸部休養士卒癸夘晉遣唐所掠郎君埒克文班吏蕭岱爾還朝三月庚申晉遣使来貢丁夘晉天雄軍節度使范延廣潜遣人請内附不納己巳遣即君達里庫美楞徳哷使晉壬午晉使及諸國使来見夏四月甲申地震幸平地松林觀潢水源五月甲寅幸頻蹕淀壬申震開皇殿六月甲申晉遣户部尚書聶延祚等請上尊號及歸鴈門以北與幽薊之地仍嵗貢帛三十萬疋詔不許庚戌侍中羅索言范延賔叛晉引兵南向秋七月辛亥朔詔諸部治兵甲癸丑幸懷州謁奉陵甲子晉遣使来告范延廣反庚午遣耶律尼古呼使晉議軍事八月癸未晉遣使復請上尊號不許庚寅晉及太原劉知逺南唐李昪各遣使来貢庚子晉遣使以都汴及范延廣降来告九月壬子布古徳来貢庚申遣珠勒呼使晉及南唐癸亥珠巴克女直来貢辛未遣使高麗鐡驪癸酉回鶻来貢冬十月庚辰朔皇太后永寜節晉及囘鶻燉煌諸國皆遣使来賀壬午詔囘鶻使呼爾察阿勒巴問其風俗丁亥諸國使還就遣富勒呼皮室哈瑪爾使其國十一月己未遣使求醫于晉丁夘鐡驪来貢十二月甲申東幸祠木葉山癸丑醫来遼史卷三遼史巻三考證母淳欽皇后舒嚕氏按舒嚕氏原本作蕭氏乃述律氏之訛義宗傳及章肅帝傳誤同今併改天賛二年師次幽州符存審拒于州南縦兵邀擊大破之按綱目唐荘宗同光元年閏四月契丹圍幽州考五代歐史符存審傳云荘宗遣存審分兵救之擊走契丹正太祖天賛二年事也此云縦兵邀擊大破之記載互異天顯三年秋七月王都奏唐兵破定州塔拉死之尼嚕古扎拉等數十人被執按尼嚕古之被執適當兵敗之時事在唐明宗天成三年至定州之破塔拉之死事在唐天成四年乃天顯四年事也考塔拉綱目五代史俱作托紐綱目唐天成四年二月唐王晏球克定州王都伏誅獲托紐送大梁斬之王晏球傳云晏球既大破契丹遂攻定州久之城中食盡都與托紐謀决圍以走不果都将馬讓能以城降都自㷊死亦在天成四年二月據此則當作王都奏唐擊敗定州兵尼嚕古札拉等數十人被執至唐兵破定州塔拉死之宜書在四年二月下方為明晰今仍原文而考證之四年五月癸酉謁二儀殿原文訛作二祖殿據永樂大典及南監本改八月癸夘幸人皇王第原文幸字上衍自字據南監本刪五年六月己亥射栁于行在原文脱六月二字考遊幸表射栁部族表達魯特来貢俱係六月紀以五月統之計戊辰至己亥已三十二日則己亥上脱字無疑今增冬十月建太祖聖功碑于舒伊旺尼珠琿温按太祖紀作如迂王集㑹堝此又訛如廷正集會堝今畫一譯改十一年秋七月唐河東節度使石敬瑭遣趙瑩求救上白太后河東復遣桑維翰来告急遂許興師按資治通鑑石敬瑭遣間使求救于契丹令桑維翰草表據此則維翰草表求救未甞親往考晉高祖本紀及桑維翰傳皆無敬瑭遣維翰如契丹告急亊九月會唐将以兵来拒遂勒兵陳於太原按綱目作陳于虎北口考虎北口在今太原城汾水北冬十月甲子封敬瑭為晉王十一月丁酉冊敬瑭為大晉皇帝按資治通鑑及五代歐史皆無先封晉王事又按綱目契丹立石敬瑭為晉皇帝敬瑭割幽薊瀛莫涿檀順新媯儒武雲應寰朔蔚十六州以與契丹五代史晉紀與綱目合此紀扵冊敬瑭為大晉皇帝下不載其事而書于㑹同元年十一月考幽涿檀薊順蔚等州五代史地里志俱屬盧龍時唐尚未亡趙徳鈞方為盧龍軍節度使與敬瑭角立敬瑭即許賂契丹其勢未能盡割按之情事此紀為得其實十二年春正月唐大同軍節度判官吴巒閉城拒命上親征至城下諭之巒降按五代歐史吴巒傳云巒清泰中為大同沙彦珣節度判官契丹還過雲州彦珣出城迎謁為契丹所擄城中推巒主州事巒即閉門拒守契丹以兵圍之高祖入立以雲州入扵契丹而巒猶守城不下契丹圍之凡七月高祖義巒所為乃以書告契丹使解兵去召巒為武寜軍節度副使出帝時大臣以巒前守雲中不下遣巒守貝州契丹攻貝州城破投井死本紀會同七年亦載其事此云巒降紀載失實九月遣珠勒呼使晉及南唐按通鑑綱目五月吴與契丹通使修好契丹主亦遣使報之即是役也葢遼使至江南知誥已僣位故不書吴而直書南唐耳遼史巻三考證
