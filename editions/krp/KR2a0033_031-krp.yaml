body:
  text: 遼史卷三十一元中書右丞相總裁托克托等修志第一營衛志上上古之世草衣木食巢居穴處熙熙于于不求不爭爰自炎帝攻衰蚩尤作亂始制干戈以毒天下軒轅氏作戮之涿鹿之阿處則象吻于宫行則懸旌于纛以為天下萬世戒於是師兵營衛不得不設矣冀州以南厯洪水之變夏后始制城郭其人土著而居綏服之中外奮武衛内揆文教守在四邊營衛之設以備非常而已并營以北勁風多寒隨陽遷徙嵗無寧居曠士萬里寇盜乘隙而作營衛之設以為常然其勢然也有遼始大設制尤密居有宫衛謂之鄂爾多出有行營謂之巴納分鎮邊圉謂之部族有事則以攻戰為務閒暇則以畋漁為生無日不營無在不衛立國規模莫重於此作營衛志宫衛遼國之法天子踐位置宫衛分州縣析部族設官府籍户口備兵馬崩則扈從后妃宫帳以奉陵寢有調發則丁壯從戎事老弱居守太祖曰𢎞義宫應天皇后曰長寧宫太宗曰永興宫世宗曰積慶宫穆宗曰延昌宫景宗曰彰愍宫承天太后曰崇徳宫聖宗曰興聖宫興宗曰延慶宫道宗曰太和宫天祚曰永昌宫又孝文皇太弟有敦睦宫丞相耶律隆運有文忠王府凡州三十八縣十提轄司四十一錫林二十三斡里七十四摩哩九十八徳里二扎薩克十九為正户八萬畨漢轉户十二萬三千共二十萬三千户蘓斡延鄂爾多太祖置國語心腹曰蘓斡延宫曰鄂爾多是為𢎞義宫以心腹之衛置益以渤海俘錦州户其鄂爾多在臨潢府陵寢在祖州東南二十里正户八千畨漢轉户七千出騎軍六千史文訛外詳後考證下文伊囉斡各條倣此州五錦祖嚴祺銀縣一富義提轄司四南京西京奉聖州平州錫林二曰舒曰蘓嚕克斡里四曰赫伯曰逹薩曰黙音曰呼心摩哩四曰珊曰伊都曰呼圖克曰吉勒展徳里二曰實壘北曰實壘南彀烏寜鄂爾多太宗置牧圉曰彀烏寧是為永興宫初名沽依鄂爾多以太祖平渤海俘户東京懐州提轄司及雲州懐仁縣澤州灤河縣等户置其鄂爾多在伊庫河側陵寢在懐州南三十里正户三千畨漢轉户七千出騎軍五千州四懐黔開來縣二保和灤河提轄司四南京西京奉聖州平州錫林一北孟古斡里四曰茂曰烏曰哈喇齊曰實壘摩哩十三曰蘓爾展曰大格密曰小格密曰烏曰歸化布木曰唐古曰圖格曰伯爾克圖曰和掄布展曰伊綿布展曰珊曰青逹曰索雲扎薩克七曰伯特部曰舒蘓曰錫庫爾濟曰赫貝巴納曰呼魯蘓曰耶律濟沙實克曰賽音令公伊囉斡鄂爾多世宗置興盛曰伊囉斡是為積慶宫以文獻皇帝衛從及太祖俘戸及雲州提轄司并髙宜等州戸置其鄂爾多在土河東陵寢在長寧宫北正户五千畨漢轉户八千出騎軍八千州三康顯宜縣一山東提轄司四錫林一實喇斡里八曰逹薩曰赫伯曰錫哷曰必老曰塔瑪曰綽卜曰伊哷濟曰伊哷烏頁摩哩十曰格斯齊曰莾阿曰濟里曰塔瑪圖曰楚勒罕曰薩哈亷温曰逹勒逹曰伊瑪曰塔喇台曰孟古富僧額鄂爾多應天皇太后置興隆曰富僧額是為長寧宫以遼州及海濵縣等户置其鄂爾多在高州陵寢在龍化州東一百里世宗分屬讓國皇帝宫院正户七千畨漢轉戸六千出騎軍五千州四遼儀珅遼西顯縣三奉先歸義定霸提轄司四錫林一北孟古斡里六曰塔瑪曰赫伯曰逹薩曰黙音曰伊哷濟曰罕札摩哩十三曰哈逹阿林刷沃濟曰哈克繖必賚逹勒拜刷沃濟曰圖嚕勒竒曰納噶特齊曰哈喇齊曰博勒和庫們曰阿嚕音逹巴曰東錫勒們曰西錫勒們曰東齊哩克曰西齊哩克曰達爾札曰瑪朗古岱拉哈鄂爾多穆宗置是為延昌宫討平曰岱拉哈以彀烏寧鄂爾多户及準布俘户中京提轄司南京制置司咸信韓等州户置其鄂爾多在嘉哩山南陵寢在京南正户一千畨漢轉户三千出騎軍二千州二遂韓提轄司三中京南京平州錫林一曰舒斡里四曰茂古庫徳曰鄂摩曰塔瑪曰哈喇齊摩哩四曰穆克徳珂鄂摩曰特黙齊鄂蘭曰息州濟里曰摩該都爾蘓嘉們鄂爾多景宗置是為彰愍宫遺留曰嘉們以章肅皇帝侍衛及武安州戸置其鄂爾多在赫嚕河陵寢在祖州南正户八千畨漢轉户一萬出騎軍一萬州四永龍化降聖同縣二行唐阜俗提轄司四錫林二曰嘉們曰南孟古斡里七曰塔瑪曰實喇曰威哈喇齊曰瑪雅喀曰特黙曰烏頁曰穆爾哈喇齊摩哩十一曰額穆吉林刷沃濟曰察罕穆爾逹巴曰伊竒哩沃濟曰色克布展曰薩哈勒齊曰伊克扎木曰呼遜阿林曰布琨曰塔瑪曰扎蘭曰徹辰郭勒沽依鄂爾多承天太后置是為崇徳宫玉名曰沽以乾顯雙三州户置其鄂爾多在土河東陵祔景宗皇帝正户六千畨漢轉户一萬出騎軍一萬州四乾川雙貴徳縣一潞上京提轄司三南京西京奉聖州錫林三曰齊哩克曰帕克曰特哩台孟古斡里七曰達薩曰伊里曰赫伯曰錫伯曰哈喇齊曰黙音曰伊哷濟摩哩十一曰敖拉森濟實壘曰伊勒敦刷沃濟曰塔瑪曰伊蘭伊勒都堪阿拉曰伊克札木曰達爾札曰瑚琨曰衮曰色哷森曰阿掄哈斯郭勒曰特哩衮齊哩克札薩克五曰古卜齊黙爾根巴納曰達爾罕太保果齊喀曰卦安巴果齊喀曰賽音令公果齊喀曰羅和令公果齊喀孟古鄂爾多聖宗置是為興聖宫金曰孟古以彀烏寧伊囉斡富僧額三鄂爾多户置其鄂爾多在紐歡賀珍陵寢在慶州南安正户一萬畨漢轉户二萬出騎軍五千州五慶隰烏上京烏東京霸提轄司四錫林四曰浩沁孟古曰約沁諾色爾曰努爾特哩台曰尼格巴爾斡里六曰孟古富僧額曰呼都克曰伊徳曰旺曰阿雅摩哩九曰伊錫布展曰特古斯琨曰威哈喇齊曰綽哈曰哈拉繖錫庫爾齊曰多托喇班錫庫爾齊曰魯庫曰希斯曰都林扎薩克五曰達林巴納曰和掄巴納曰卦安巴覺禪曰鼐爾都爾蘇曰保達古魯克齊阿敦鄂爾多興宗置是為延慶宫孶息曰阿敦以諸鄂爾多及饒州户置其鄂爾多在高州西陵寝在上京慶州正户七千番漢轉戸一萬出騎軍一萬州三饒長春泰提轄司四錫林二曰阿敦曰呼都克斡里六曰阿敦曰薩巴曰薩曰扎里曰徳里曰敖拉摩哩六曰額勒本曰雅蘓曰黙色曰伊繖曰北徳里曰南徳里阿果鄂爾多道宗置是為太和宫寛大曰阿果以諸鄂爾多御前承應人及興中府戸置其鄂爾多在好水濼陵寢在上京慶州正户一萬番漢轉户二萬出騎軍一萬五千錫林二曰阿蘓曰雅嚕斡里八曰阿蘓曰雅嚕曰徳里曰扎里曰薩布曰呼都克曰富僧額曰哈里摩哩七曰恩州徳里曰額森徳勒曰額勒本曰特們曰庫爾都哩曰扎里曰額哷蘓穆爾阿掄鄂爾多天祚皇帝置是為永昌宫輔祐曰阿掄以諸鄂爾多御前承應人春宣州戸置正户八千番漢轉户一萬出騎軍一萬錫林二曰阿掄曰伊囉斡斡里八曰阿嚕威曰克哩頁曰呼圖克曰逹喇曰穆喇斡曰扎里曰圖嚕拉曰特黙摩哩八曰富僧額曰伊納克曰武都温曰特們曰穆喇斡曰伊特丹曰雲曰布圖巴孝文皇太弟敦睦宫謂之學順徳哩本鄂爾多孝曰學順徳哩本文獻皇帝承應人及渤海俘建瀋巖三州戸置陵寢在祖州西南三十里正戸三千畨漢轉戸五千出騎軍五千州三建瀋巖提轄司一南京錫林二曰超曰伊都斡里六曰伊遜曰徳里曰錫里濟曰大塔瑪曰小塔瑪曰伊都摩哩二曰特黙茂海曰婁實克扎薩克二曰聶哷巴納曰逹蘭巴納大丞相晉國王耶律隆運本韓氏名徳讓以功賜國姓出宫籍𨽻横帳季父房贈尚書令謚文忠無子以皇族魏王特布子雅魯為嗣早卒天祚皇帝又以皇子額嚕温繼之官給葬具建廟乾陵側擬諸宫例建文忠王府正户五千畨漢轉户八千出騎軍一萬州一提轄司六上京中京南京西京奉聖州平州著帳郎君著帳郎君初約尼哈陶津汗以博果濟等三族害裕悦實嚕籍沒家屬入斡里淳欽皇后宥之以為著帳郎君世宗悉免後族戚世官犯罪者沒入著帳戸著帳戸本諸鄂爾多析出及諸罪沒入者凡承應實逹爾司藏鷹坊湯藥尚飲盥潄尚饍尚衣裁造等役及宫中親王祗從伶官之屬皆充之凡諸宫衛人丁四十萬八千騎軍十萬一千著帳釋宥沒入隨時増損無常額遼史卷三十一
