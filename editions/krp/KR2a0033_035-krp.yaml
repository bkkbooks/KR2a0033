body:
  text: 遼史卷三十五元中書右丞相總裁托克托等修志第五兵衛志中御帳親軍漢武帝多行幸之事置期門佽飛羽林之目天子始有親軍唐太宗加親勲翊千牛之衛布腹心之地防衛密矣太祖宗室盛彊分德哷勒部爲二宫衛内虚經營四方未遑鳩集皇后舒嚕氏居守之際摘畨漢精鋭爲舒新軍太宗益選天下精甲置諸爪牙爲皮室軍合騎五十萬國威壯矣大帳皮室軍太宗置凡三十萬騎舒新軍地皇后置二十萬騎宫衞騎軍大祖以德哷勒部受禪分本部爲五院六院統以皇族而親衛缺然乃立卾爾多法裂州縣割户丁彊幹弱枝詒謀嗣續世建宫衛入則居守出則扈從葬則因以守陵有兵事則五京二州各提轄司傳檄而集不待調發州縣部族十萬騎軍已立具矣恩意親洽兵甲犀利教練完習簡天下精鋭聚之腹心之中懷舊者歲深増新者世盛此軍制之良者也𢎞義宫正丁一萬六千番漢轉丁一萬四千騎軍六千長寜宫正丁一萬四千番漢轉丁一萬二千騎軍五千永興宫正丁六千番漢轉丁一萬四千騎軍五千積慶宫正丁一萬番漢轉丁一萬六千騎軍八千延昌宫正丁二千番漢轉丁六千騎軍二千彰愍宫正丁一萬六千番漢轉丁二萬騎軍一萬崇徳宫正丁一萬二千番漢轉丁二萬騎軍一萬正丁二萬番漢轉丁四萬騎軍五千延慶宫正丁一萬四千番漢轉丁二萬騎軍一萬太和宫正丁二萬番漢轉丁四萬騎軍一萬五千永昌宫正丁一萬四千番漢轉丁二萬騎軍一萬敦睦宫正丁六千番漢轉丁一萬騎軍五千文忠王府正丁一萬番漢轉丁一萬六千騎軍一萬十二宫一府自上京至南京總要之地各置提轄司重地毎宫皆置内地一二而已太和永曷二宫宜與興聖延慶同舊史不見提轄司葢闕文也南京𢎞義宫提轄司長寧宫提轄司永興宫提轄司積慶宫提轄司延昌宫提轄司彰愍宫提轄司崇徳宫提轄司興聖宫提轄司延慶宫提轄司敦睦宫提轄司文忠王府提轄司西京𢎞義宫提轄司長寧宫提轄司永興宫提轄司積慶宫提轄司彰愍宫提轄司崇徳宫提轄司延慶宫提轄司文忠王府提轄司奉聖州𢎞義宫提轄司長寧宫提轄司永興宫提轄司積慶宫提轄司彰愍宫提轄司崇德宫提轄司興聖宫提轄司延慶宫提轄司文忠王府提轄司平州𢎞義宫提轄司長寧宫提轄司永興宫提轄司積慶宫提轄司延昌宫提轄司彰愍宫提轄司興聖宫提轄司延慶宫提轄司文忠王府提轄司中京延昌宫提轄司文忠王府提轄司上京文忠王府提轄司凡諸宫衞丁四十萬八千出騎軍十萬一千大首領部族軍遼親王大臣體國如家征伐之際徃徃置私甲以從王亊大者千餘騎小者數百人著籍皇府國有戎政量借三五千騎常留餘兵爲部族根本太子軍偉王軍永康王軍裕悦王軍瑪達軍烏雅軍衆部族軍衆部族分𨽻南北府守衞四邉各有司存具如左北府凡二十八部侍從宫帳奚王府部鎭南境五院部六院部東北路招討司威部東北路統軍司約囉部伯特部敖拉部南尅部北尅部圖嚕部珠展達嚕噶部河西部西北路招討司圖魯卜部阿雅女直部室韋部西南路招討司納喇部烏庫哩部納喇裕尔庫部黙古斯部吉達部鼐奇特唐古部和拉唐古部黃龍府都部烏延突厥部阿雅突厥部北唐古部五國部烏爾古德哷勒統軍司達魯徳哷勒部威烏爾古部北德哷勒部南府凡一十六部鎭駐西南境伊實部西南路招討司丕勒部達勒達德哷勒部丕勒達嚕噶部伊德女直部西北路招討司卓特部東北路統軍司塔瑪布古德部東北路女直兵馬司伊實阿爾威部東京都部署司卓特阿爾威部揚結部實保部哈準部戍倒塌嶺卾博庫部屯駐本境薩拉噶部南唐古部色克圖部遼史卷三十五遼史卷三十五考證大帳皮室軍三十萬騎舒新軍二十萬騎按遼志皮室兵約三萬騎舒新軍衆二萬與此異彰愍宫按通考作章敏宫西京提轄司按營衞志興聖宫提轄司四今見於南京奉聖州平州而西京獨缺疑有脱文東北路統軍司圖嚕部按圖嚕營衞志作圖魯此處原文作圖盧今畫一改西南路招討司烏庫哩部按烏庫哩營衞志作烏古湼剌此又作烏古剌今併改東京都部署司按原本于東京都部署司以下重出卓特部等六行考前文南府凡十六部芟除衍文數正符合今刪遼史卷三十五考證
