body:
  text: 遼史卷一百四元中書右丞相總裁托克托等修列傳第三十四文學下王鼎字虚中涿州人幼好學居太寧山數年博通經史時馬唐俊有文名燕薊間適上已與同志祓禊水濵酌酒賦詩鼎偶造席唐俊見鼎樸野置下坐欲以詩困之先出所作索賦鼎援筆立成唐俊驚其敏妙因與定交清寧五年擢進士第調易州觀察判官改漆水縣令累遷翰林學士當代典章多出其手上書言治道十事帝以鼎達政體事多咨訪鼎正直不阿人有過必面詆之壽隆初陞觀書殿學士一日宴主第醉與客忤怨上不知已坐是下吏状聞上大怒杖黥奪官流鎮州居數嵗有赦鼎獨不免㑹守臣召鼎為賀表因以詩貽使者有誰知天雨露獨不到孤寒之句上聞而憐之即召還復職乾統六年卒鼎宰縣時憩于庭俄有暴風舉卧榻空中鼎無懼色但覺枕榻俱髙乃曰吾中朝端士邪無干正可徐置之須臾榻復故處風遂止耶律昭字述寧博學善屬文統和中坐兄果囉事流西北部㑹蕭達林為西北路招討使愛之奏免其役禮致門下欲召用以疾辭達林問曰今軍旅甫罷三邉晏然惟準布伺隙而動討之則路逺難至縱之則邊民被掠增戍兵則餽餉不給欲苟一時之安不能終保無變計将安出昭以書答曰竊聞治得其要則仇敵為一家失其術則部曲為行路夫西北諸部每當農時一夫為偵候一夫治公田二夫給糺官之役大率四丁無一室處芻牧之事仰給妻孥一遭㓂掠貧窮立至春夏賑恤吏多雜以糠粃重以掊克不過數月又復告困且畜牧者富國之本有司防其隠没聚之一所不得各就水草便地兼以逋亡戍卒隨時補調不習風土故日瘠月損馴至耗竭為今之計莫若振窮薄賦給以牛種使遂耕穫置游兵以防盜掠頒俘獲以助伏臘散畜牧以就便地期以數年富彊可望然後練簡精兵以備行伍何守之不固何動而不克哉然必去其難制者則餘種自畏若捨大而謀小避强而攻弱非徒虚費財力亦不足以威服其心此二者利害之機不可不察昭聞古之名將安邉立功在德不在衆故謝𤣥以八千破苻堅百萬休格以五隊敗曹彬十萬良由恩結士心得其死力也閤下膺非常之遇専方面之寄宜逺師古人以就勲業上觀乾象下盡人謀察地形之險易料敵勢之虚實慮無遺䇿利施後世矣達林然之開泰中獵于巴爾圖山為羯羊所觸卒劉輝好學善屬文疏簡有逺略太康五年第進士大安末為太子洗馬上書言西邊諸畨為患士卒逺戍中國之民疲于飛輓非長久之䇿為今之務莫若城于鹽濼實以漢户使耕田聚糧以為西北之費言雖不行識者韙之壽隆二年復上書曰宋歐陽修編五代史附我朝於四夷妄加貶訾且宋人頼我朝寛大許通和好得盡兄弟之禮今反令臣下妄意作史恬不經意臣請以趙氏初起事蹟詳附國史上嘉其言遷禮部郎中詔以賢良對䇿輝言多中時病擢史館修撰卒耶律孟簡字復易裕悦鳥哲之五世孫父劉嘉努官至節度使孟簡性頴悟六嵗父晨出獵俾賦曉天星月詩孟簡應聲而成父大竒之既長善属文太康初樞宻使耶律伊遜以姦險竊柄出為中京留守孟簡與耶律庶箴表賀未幾伊遜復舊職銜之謫巡磁窯關時雖以䜛見逐不形辭色遇林泉勝地終日忘歸明年流保州及聞皇太子被害不勝哀痛以詩傷之作放懷詩二十首自序云禽獸有哀樂之聲螻蟻有動靜之形在物猶然况於人乎然賢達哀樂不在窮通禍福之間易曰樂天知命故不憂是以顔淵簞瓢自得此知命而樂者也予雖流放以道自安又何疑耶太康中始得歸鄉里詣闕上表曰本朝之興幾二百年宜有國史以埀後世乃編耶律嚇嚕烏哲休格三人行事以進上命置局編修孟簡謂餘官曰史筆天下之大信一言當否百世從之苟無明識好惡徇情則禍不測故左氏司馬遷班固范煜俱罹殃禍可不慎歟乾統中遷六院部太保處事不拘文法時多笑其迂孟簡聞之曰上古之時無簿書法令而天下治葢簿書法令適足以滋姦倖非聖人致治之本改髙州觀察使修學校招生徒遷昭德軍節度使以中京饑詔與學士劉嗣昌減價糶粟事未畢卒耶律古雲字糾堅六院部人父阿古齊官至節度使古雲冲澹有禮法工文章統和中為本部太保開泰中稍遷塔布成節度使鞫霸州疑獄稱㫖授啓聖軍節度使太平中復為本部太保謝病歸俄擢南院大王歎風俗日頽請老不許興宗命為詩友數問治要多所匡建奉詔與林牙耶律庶成蕭罕嘉努編遼國上世事迹及諸帝實録未成而卒年九十論曰孔子言誦詩三百授之以政不達雖多亦奚以為王鼎忠直達政劉輝侍青宫建言國計昭陳邊防利害皆洞達闓敏孟簡疾伊遜姦邪黜而不怨孰謂文學之士無益於治哉遼史卷一百四
