body:
  text: 遼史巻九元中書右丞相總裁托克托等修本紀第九景宗二九年春正月丙寅女直遣使來貢二月庚子宋遣使致其先帝遺物甲寅以青牛白馬祭天地三月癸亥耶律沙迪里獻援漢之役所獲宋俘戊辰詔以粟二十萬斛助漢五月庚午漢遣使來謝且以宋事來告己丑女直二十一人請宰相額爾奇木之職以次授之六月丙辰以宋王喜隠為西南面招討使秋七月庚申朔回鶻遣使來貢甲子宋遣使來聘壬申漢以宋侵來告丙子遣使助漢戰馬八月漢遣使進葡萄酒冬十月甲子耶律沙以党項降酋克酬摩約來見賜詔撫諭丁夘以克酬為司徒摩約為太保各賜物遣之壬申女直遣使來貢乙酉漢復遣使以宋事來告十一月丁亥朔司天奏日當食不虧戊戌吐谷渾叛入太原者四百餘户索而還之癸夘祠木葉山乙巳遣太保塔喇噶等使宋乙夘漢復遣使以宋事來告十二月戊辰獵于近郊以所獲祭天十年春正月癸丑如長濼二月庚午阿爾斯蘭回鶻來貢三月庚寅祭顯陵夏四月丁夘西幸己巳女直部來貢五月癸夘賜女哩死遣人誅髙勲等六月己未駐蹕㳂栁湖秋七月庚戌享太祖廟九月癸未平王隆先子辰格謀害其父車裂以徇是冬駐蹕金川乾亨元年春正月乙酉遣塔瑪長夀使宋問興師伐劉繼元之故丙申長夀還言河東逆命所當問罪若北朝不援和約如舊不然則戰二月丁夘漢以宋兵壓境遣使乞援詔南府宰相耶律沙為都統冀王迪里為監軍赴之又命南院大王色珍以所部從樞密副使穆濟督之三月辛巳蘇色遣人以别部華格等降納之丙戌漢遣使謝撫諭軍民詔北院大王希達伊實王薩哈勒以兵戍燕己丑漢復告宋兵入境詔左千牛衛大將軍韓侼大同軍節度使耶律善補以本路兵南援辛夘女直遣使來貢丁酉耶律沙等與宋戰於白馬嶺不利冀王迪里及圖魯卜部節度使都敏黄皮室詳衮唐古皆死之士卒死傷甚衆夏四月辛亥漢以行軍事宜來奏盧俊自代州告急辛酉徳哷來貢五月己夘宋兵至河東漢與戰不利劉繼文盧俊來奔六月劉繼元降宋漢亡甲子封劉繼文為彭城郡王盧俊同政事門下平章事宋主來侵丁夘北院大王希達統軍使蕭托果伊實王薩哈勒迎戰于沙河失利己巳宋主圍南京丁丑詔諭耶律沙及希達托果等軍中事宜秋七月癸未沙等及宋兵戰于髙梁河少却休格色珍横擊大敗之宋主僅以身免至涿州竊乗驢車遁去甲申擊宋餘軍所殺甚衆獲兵仗噐甲符印糧饋貨幣不可勝計辛丑耶律沙遣人上俘獲以權知南京留守事韓徳讓權南京馬步軍都指揮使耶律學古知三司事劉𢎞皆能安人心捍城池賜詔褒奬八月壬子準布特哩衮嚇嚕額爾奇木阿爾圖來朝乙丑耶律沙等獻俘丙寅以白馬之役責沙穆濟復以走宋主功釋之希達遇敵而退以劍背擊之薩哈勒雖却部伍不亂宥之冀王迪里麾下先遁者斬之杖都監以下壬申宴沙穆濟等將校賜物有差九月己夘燕王韓匡嗣為都統南府宰相耶律沙為監軍特哩衮休格南院大王色珍權奚王穆濟各率所部兵南伐仍命大同軍節度使善補領山西兵分道以進冬十月乙丑韓匡嗣與宋兵戰於滿城敗績辛未太保舒蘇與宋兵戰於火山敗之乙亥詔數韓匡嗣五罪赦之十一月戊寅宴賞休格及有功將校乙未南院樞密使兼政事令郭襲上書諌畋獵嘉納之辛丑冬至赦改元乾亨十二月乙夘燕王韓匡嗣遥授晉昌軍節度使降封秦王壬戌蜀王道隠南京留守徙王荆是冬駐蹕南京二年春正月丙子朔封皇子隆緒為梁王隆慶為恒王丁亥特哩衮休格為北院大王前樞密使賢適封西平郡王二月戊辰如清河三月丁亥西南面招討副使耶律旺祿太尉華格遣人獻党項俘閏月庚午有鴇飛止御帳獲以祭天夏四月庚辰祈雨戊子清暑燕子城五月雷火乾陵松六月己亥喜隠復謀反囚于祖州秋七月戊午旺祿等獻党項俘八月戊戌東幸冬十月辛未朔命巫者祠天地及兵神辛巳將南伐祭旗鼓癸未次南京丁亥獲敵人射鬼箭庚寅次固安以青牛白馬祭天地己亥圍瓦橋闗十一月庚子朔宋兵夜襲營圖魯卜部節度使蕭幹及四捷軍詳衮耶律赫徳戰却之壬寅休格敗宋兵於瓦橋東守將張師引兵出戰休格奮擊敗之戊申宋兵陣於水南休格涉水擊破之追至莫州殺傷甚衆己酉宋兵復來擊之殆盡丙辰班師乙丑還次南京十二月庚午朔休格拜裕悦大饗軍士三年春二月丙子東幸己丑復幸南京三月乙夘皇子罕巴卒辛酉塟潢土二河之間置永州以秦王韓匡嗣為西南面招討使五月丙午上京漢軍亂刼立喜隠不克立其子留禮夀上京留守楚實勒擒之秋七月甲子誅留禮夀冬十月如富瑚坡十一月辛亥加楚實勒同政事門下平章事是月以南院樞密使郭襲為武定軍節度使十二月以遼興軍節度使韓徳讓為南院樞密使四年春正月己亥如華林天柱三月乙未清明與諸王大臣較射宴飲夏四月自將南伐至滿城戰不利守太尉奚斡里中流矢死統軍使善補為伏兵所圍樞密使色珍救免詔以失備杖之五月班師清暑燕子城秋七月壬辰遣使賜喜隠死八月如西京九月庚子幸雲州甲辰獵于尚和山帝不豫壬子次焦山崩於行在年三十五在位十四年遺詔梁王隆緒嗣位軍國大事聽皇后命統和元年正月壬戌上尊諡孝成皇帝廟號景宗重熙二十一年加諡孝成康靖皇帝贊曰遼興六十餘年神冊㑹同之間日不暇給天祿應厯之君不令其終保寧而來人人望治以景宗之資任人不疑信賞必罰若可與有為也而竭國之力以助河東破軍殺將無救滅亡雖一取償於宋得不償失知匡嗣之罪數而不罰善郭襲之諌納而不用沙門昭敏以左道亂徳寵以侍中不亦惑乎遼史巻九遼史巻九考證保寧九年七月宋遣使來聘按續通鑑綱目契丹遣耶律敞如宋㑹塟宋遣辛仲甫報之考契丹國志敞官鴻臚少卿遼史不書㑹塟之使又續資治通鑑長編宋史起居舍人辛仲甫如契丹右贊善大夫穆波副之又契丹志帝欲留仲甫仲甫不可厚禮遣還此失載宋史姓名乾亨元年十月韓匡嗣與宋兵戰于滿城敗績按契丹志秋九月攻鎮州為宋趙延進所敗考之李燾長編此即滿城之戰亦作九月俱與此異景宗在位十四年按原本訛十三年今改遼史巻九考證
