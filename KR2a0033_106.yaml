body:
  text: 遼史卷一百六列傳第三十六卓行蕭札剌耶律官奴蕭蒲離不遼之共國任事耶律蕭二族而已二族之中有退然自足不淫於富貴不詘於聲利可以振頽風激薄俗亦足嘉尚者得三人焉作卓行傳蕭札剌字虛輦北府宰相排押之弟性介特不事生業保寧間以戚屬進纍遷寧遠軍節度使秩滿里居淡泊自適統和末召為南京馬步軍都指揮使以疾求退不聽遷夷離畢又以疾辭許之遂入頡山杜門不出上嘉其志不復徵札剌自是家于頡山親友或過之終日言不及世務凡宴游相邀亦不拒一歲山居過半與世俗不偶耶律資忠重之目曰頡山老人卒耶律官奴字奚隱林牙斡魯之孫沉厚多學詳於本朝世系嗜酒好佚初徵為宿直將軍重熙九年以疾去官上以官奴屬尊欲成其志乃許自擇一路節度使官奴辭曰臣愚鈍不任官使加歸義軍節度使輒請致政官奴與歐里部人蕭哇友善哇謂官奴曰仕不能致主澤民成大功烈何屑屑為也吾與若居林下以枕簟自隨觴詠自樂雖不官無慊焉官奴然之時稱二逸乾統間官奴卒蕭蒲離不字桵懶魏國王惠之四世孫父母蚤喪鞠于祖父兀古匿性孝悌年十三兀古匿卒自以早失怙恃復遭祖喪哀毀踰禮族里嘉歎嘗謂人曰我於親不得終養今誰為訓者苟不自勉何以報鞠育恩自是力學於文藝無不精乾統間以兀古匿之故召之不應常與親識游獵山水奉養無長物僕隸欣欣如也或曰公胡不念以嗣先世功名答曰自度不足以繼先業年踰強仕安能益主庇民纍徵皆以疾辭晚年謝絶人事卜居抹古山屏遠葷茹潛心佛書延有道者談論彌日人問所得何如但曰有深樂惟覺六鑿不相攘餘無知者一日易服無疾而逝論曰隱固未易為也而亦未可輕以與人若札剌謝職不談時務官奴兩辭節鎮蒲離不召而不赴雖未足謂之隱然在當時能知內外之分甘於肥遁不猶愈於求富貴利達而為妻妾羞者哉故稱卓行可也
