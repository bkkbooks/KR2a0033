body:
  text: 遼史卷九十三列傳第二十三蕭惠慈氏奴蕭迂魯鐸盧斡蕭圖玉耶律鐸軫蕭惠字伯仁小字脫古思淳欽皇后弟阿古只五世孫初以中宮親為國舅詳穩從伯父排押征高麗至奴古達北嶺高麗阻險以拒惠力戰破之及攻開京以軍律整肅聞授契丹行宮都部署開泰二年改南京統軍使未幾為右夷離畢加同中書門下平章事朝議以遼東重地非勳戚不能鎮撫乃命惠知東京留守事改西北路招討使封魏國公太平六年討回鶻阿薩蘭部徵兵諸路獨阻卜酋長直剌後期立斬以徇進至甘州攻圍三日不克而還時直剌之子聚兵來襲阻卜酋長烏八密以告惠未之信會西阻卜叛襲三剋軍都監涅魯古突舉部節度使諧理阿不呂等將兵三千來救遇敵于可敦城西南諧理阿不呂戰歿士卒潰散惠倉卒列陣敵出不意攻我營衆請乘時奮擊惠以我軍疲敝未可用弗聽烏八請以夜斫營惠又不許阻卜歸惠乃設伏兵擊之前鋒始交敵敗走惠為招討累年屢遭侵掠士馬疲困七年左遷南京侍衞親軍馬步軍都指揮使尋遷南京統軍使興宗即位知興中府歷順義軍節度使東京留守西南面招討使加開府儀同三司檢校太師兼侍中封鄭王賜推誠協謀竭節功臣重熙六年復為契丹行宮都部署加守太師徙王趙拜南院樞密使更王齊是時帝欲一天下謀取三關集羣臣議惠曰兩國強弱聖慮所悉宋人西征有年師老民疲陛下親率六軍臨之其勝必矣蕭孝穆曰我先朝與宋和好無罪伐之其曲在我況勝敗未可逆料願陛下熟察帝從惠言乃遣使索宋十城會諸軍于燕惠與太弟帥師壓宋境宋人重失十城增歲幣請和惠以首事功進王韓十二年兼北府宰相同知元帥府事又為北樞密使十三年夏國李元昊誘山南党項諸部帝親征元昊懼請降惠曰元昊忘奕世恩萌姦計車駕親臨不盡歸所掠天誘其衷使彼來迎天與不圖後悔何及帝從之詰旦進軍夏人列拒馬于河西蔽盾以立惠擊敗之元昊走惠麾先鋒及右翼邀之夏人千餘潰圍出我師逆擊大風忽起飛沙眯目軍亂夏人乘之蹂踐而死者不可勝計詔班師十七年尚帝姊秦晉國長公主拜駙馬都尉明年帝復征夏國惠自河南進戰艦粮船綿亙數百里既入敵境偵候不遠鎧甲載于車軍士不得乘馬諸將咸請備不虞惠曰諒祚必自迎車駕何暇及我無故設備徒自弊耳數日我軍未營候者報夏師至惠方詰妄言罪諒祚軍從阪而下惠與麾下不及甲而走追者射惠幾不免軍士死傷尤衆師還以惠子慈氏奴歿于陣詔釋其罪十九年請老詔賜肩輿入朝策杖上殿辭章再上乃許之封魏國王詔冬夏赴行在參決疑議既歸遣賜湯藥及他錫賚不絕每生日輒賜詩以示尊寵清寧二年薨年七十四遺命家人薄葬訃聞輟朝三日惠性寬厚自奉儉薄興宗使惠恣取珍物惠曰臣以戚屬據要地祿足養廉奴婢千餘不為闕乏陛下猶有所賜貧於臣者何以待之帝以為然故為將雖數敗衄不之罪也弟虛列武定軍節度使二子慈氏奴兀古匿兀古匿終北府宰相慈氏奴字寧隱太平初以戚屬補祗候郎君上愛其勤慎陞閘撒狘加右監門衞上將軍西邊有警授西北路招討都監領保大軍節度使政濟恩威諸部悅附入為殿前副點檢歷烏古敵烈部詳穩征李諒祚為統軍都監與西北路招討使敵魯古率蕃部諸軍由北路趨涼州獲諒祚親屬夏人扼險以拒慈氏奴中流矢卒年五十一贈中書門下平章事蕭迂魯字胡突堇五院部人父約質歷官節度使迂魯重熙間為牌印郎君清寧九年國家既平重元之亂其黨郭九等亡詔迂魯追捕獲之遷護衞太保咸雍元年使宋議邊事稱旨知殿前副點檢事五年阻卜叛為行軍都監擊敗之俘獲甚衆初軍出止給五月粮過期粮乏士卒往往叛歸迂魯坐失計免官降戍西北部未行會北部兵起迂魯將烏古敵烈兵擊敗之每戰以身先由是釋前罪命總知烏古敵烈部九年敵烈叛都監耶律獨迭以兵少不戰屯臚朐河敵烈合邊人掠居民迂魯率精騎四百力戰敗之盡獲其輜重繼聞酋長合朮三千餘騎掠附近部落縱兵躡其後連戰二日斬數千級盡得被掠人畜而還值敵烈黨五百餘騎劫捕鷹戶逆擊走之俘斬甚衆自是敵烈勢沮時敵烈方為邊患而阻卜相繼寇掠邊人以故疲弊朝廷以地遠不能時益援軍而使疆圉帖然者皆迂魯力也帝嘉其功拜左皮室詳穩會宋求天池之地詔迂魯兼統兩皮室軍屯太牢古山以備之大康初阻卜叛遷西北招討都監從都統耶律趙三征討有功改南京統軍都監黃皮室詳穩未幾遷東北路統軍都監卒弟鐸盧斡鐸盧斡字撒板幼警悟異常兒三歲失母哭盡哀見者傷之及長魁偉沉毅好學善屬文有才幹年三十始仕為朝野推重給事北院知聖旨事大康二年乙辛再入樞府鐸盧斡素與蕭巖壽善誣以罪謫戍西北部坐皇太子事特恩減死仍錮終身在戍十餘年太子事稍直始得歸鄉里屏居謝人事一日臨流聞雉鳴三復孔子時哉語作古詩三章見志當時名士稱其高情雅韻不減古人壽隆六年卒年六十一乾統初贈彰義軍節度使蕭圖玉字兀衍北府宰相海瓈之子統和初皇太后稱制以戚屬入侍尋為烏古部都監討速母縷等部有功遷烏古部節度使十九年總領西北路軍事後以本路兵伐甘州降其酋長牙懶既而牙懶復叛命討之克肅州盡遷其民于土隗口故城師還詔尚金鄉公主拜駙馬都尉加同政事令門下平章事上言曰阻卜今已服化宜各分部治以節度使上從之自後節度使往往非材部民怨而思叛開泰元年十一月石烈太師阿里底殺其節度使西奔窩魯𩽆城蓋古所謂龍庭單于城也已而阻卜復叛圍圖玉于可敦城勢甚張圖玉使諸軍齊射却之屯于窩魯𩽆城明年北院樞密使耶律化哥引兵來救圖玉遣人誘諸部皆降帝以圖玉始雖失計後得人心釋之仍領諸部請益軍詔讓之曰叛者既服兵安用益且前日之役死傷甚衆若從汝謀邊事何時而息遂止會公主坐殺家婢降封郡主圖玉罷使相尋起為烏古敵烈部詳穩以老代還卒子雙古南京統軍使孫訛篤斡尚三韓郡王合魯之女骨浴公主終烏古敵烈部統軍使以善戰名于世耶律鐸軫字敵輦積慶宮人仕統和間性疏簡不顧小節人初以是短之後侵宋分總羸師以從及戰取緋帛被介冑以自標顯馳突出入敵陣格殺甚衆太后望見喜召謂之曰卿勠力如此何患不濟厚賞之由是多以軍事屬任俄授東北詳穩開泰二年進討阻卜克之重熙間歷東北路統軍使天德軍節度使十七年城西邊命鐸軫相地及造戰艦因成樓船百三十艘上置兵下立馬規制堅壯稱旨及西征詔鐸軫率兵由別道進會于河濱敵兵阻河而陣帝御戰艦絕河擊之大捷而歸親賜巵酒仍問所欲鐸軫對曰臣幸被聖恩得効駑力萬死不能報國又將何求帝愈重之手書鐸軫衣裙曰勤國忠君舉世無雙卒于官年七十子低烈歷觀察節度使論曰初遼之謀復三關也蕭惠贊伐宋之舉而宋人增幣請和狃於一勝移師西夏而勇智俱廢敗潰隨之豈非貪小利迷遠圖而然況所得不償所亡利果安在哉同時諸將撫綏邊圉若迂魯忠勤不伐鐸魯斡高情雅韻鐸軫雖廉不逮蕭惠而無邀功啟釁之罪亦庶乎君子之風矣
