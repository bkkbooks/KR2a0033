body:
  text: 遼史卷四十八志第十七下百官志四南面京官遼有五京上京為皇都凡朝官京官皆有之餘四京隨宜設官為制不一大抵西京多邊防官南京中京多財賦官五京並置者列陳之特置者分列于後三京宰相府職名總目左相右相左平章政事右平章政事東京宰相府聖宗統和元年詔三京左右相左右平章事中京宰相府南京宰相府諸京內省客省職名總目某京某省使某京某省副使耶律蒲奴開泰末為上京內客省副使上京內省司東京內省司地理志東京大內不置宮嬪唯以內省使副判官守之五京諸使職名總目某京某使王棠重熙中為上京鹽鐵使知某京某使事張孝傑清寧間知戶部使事某京某副使劉伸重熙中為三司副使同知某京某使事道宗大康三年見撻不也同知度支使事某京某判官聖宗太平九年見戶部使判官上京鹽鐵使司東京戶部使司中京度支使司南京三司使司南京轉運使司亦曰燕京轉運使司西京計司五京留守司兼府尹職名總目某京留守行某府尹事聖宗統和元年見上京留守行臨潢尹事吳王稍某京副留守天祚天慶六年見東京副留守高清臣知某京留守事蕭惠開泰二年知東京留守事某府少尹聖宗太平四年見臨潢少尹鄭弘節同知某京留守事太平八年見中京同知耶律野同簽某京留守事蕭滴冽太平六年同簽南京留守事某京留守判官室昉天祿中為南京留守判官某京留守推官聖宗開泰元年見中京留守推官李可舉上京留守司東京留守司中京留守司太宗大同元年命趙延壽為中京留守治鎮州聖宗統和十二年命室昉為中京留守治大定府南京留守司太宗天顯三年升東平郡為南京治遼陽十三年以幽州為南京治析津聖宗開泰元年改幽都府為析津府西京留守司五京都總管府職名總目某京都總管知某府事同知某府事聖宗太平五年見同知中京事蕭堯袞上京都總管府東京都總管府中京都總管府南京都總管府西京都總管府五京都虞候司職名總目都虞候上京都虞候司東京都虞候司南京都虞候司西京都虞候司中京都虞候司五京警巡院職名總目某京警巡使某京警巡副使上京警巡院東京警巡院中京警巡院南京警巡院西京警巡院五京處置使司職名總目某京處置使上京處置司東京處置司中京處置司西京處置司南京處置司五京學職名總目道宗清寧五年詔設學養士頒經及傳疏置傅士助教各一員博士助教上京學上京別有國子監見朝官東京學中京學中京別有國子監與朝官同南京學亦曰南京太學太宗置聖宗統和十三年賜水磑莊一區西京學已上五京官上京城隍使司亦曰上京皇城使上京城隍使韓德讓景宗時為上京皇城使東京渤海承奉官聖宗開泰八年耶律八哥奏渤海承奉班宜設官以統之因置渤海承奉都知押班遼陽大都督府太宗會同二年置遼陽大都督會同二年都督曷魯泊等關防遼陽東都東京安撫使司東京安撫使東京軍巡院地理志東京有歸化營軍千餘人籍河朔亡命於此置軍巡院東京軍巡使中京文思院中京文思使馬人望父佺為中京文思使中京路按問使司中京路按問使耶律和尚重熙二十四年為中京路按問使中京巡邏使司中京巡邏使耶律古昱開泰間為中京巡邏使中京大內都部署司中京大內都部署聖宗開泰元年見中京大內都部署中京大內副部署南京宣徽院南京宣徽使道宗壽隆元年見宣徽使耶律特末知南京宣徽院使事知南京宣徽院事南京宣徽副使同知南京宣徽院事南京處置使司聖宗開泰元年見秦王隆慶為燕京管內處置使燕京管內處置使南京侍衞親軍馬步軍都指揮使司南京侍衞親軍馬步軍都指揮使蕭討古乾亨初為南京侍衞親軍都指揮使南京馬步副指揮使南京侍衞親軍馬軍都指揮使司南京馬軍都指揮使南京馬軍副指揮使南京侍衞親軍步軍都指揮使司南京步軍都指揮使南京步軍副指揮使南京栗園司典南京栗園雲州宣諭招撫使司雲州管內宣諭招撫使二員統和四年見韓毗哥邢抱朴為雲州管內宣諭招撫使南面大蕃府官黃龍府知黃龍府事興宗重熙十三年見知黃龍府事耶律甌里斯同知黃龍府事黃龍府判官黃龍府侍衞親軍馬步軍都指揮使黃龍府侍衞親軍都指揮使黃龍府侍衞親軍副指揮使黃龍府侍衞馬軍都指揮使黃龍府侍衞步軍都指揮使黃龍府侍衞馬軍副指揮使黃龍府侍衞步軍副指揮使黃龍府學博士助教興中府知興中府事咸雍元年見知興中府事楊績同知興中府事興中府判官興中府學博士助教南面方州官遼東西燕秦漢唐已置郡縣設官職矣高麗渤海因之至遼五京列峙包括燕代悉為畿甸二百餘年城郭相望田野益闢冠以節度承以觀察防禦團練等使分以刺史縣令大略採用唐制其間宗室外戚大臣之家築城賜額謂之頭下州軍唯節度使朝廷命之後往往皆歸王府不能州者謂之軍不能縣者謂之城不能城者謂之堡其設官則未詳云節度使職名總目某州某軍節度使某州某軍節度副使同知節度使事耶律玦重熙中同知遼興軍節度使事行軍司馬軍事判官掌書記劉伸重熙五年為彰武軍節度使掌書記衙官某馬步軍都指揮使司都指揮使副指揮使某馬軍指揮使司指揮使副指揮使某步軍指揮使司指揮使副指揮使上京道懷州奉陵軍節度使司慶州玄寧軍節度使司泰州德昌軍節度使司長春州韶陽軍節度使司儀坤州啟聖軍節度使司龍化州興國軍節度使司饒州匡義軍節度使司徽州宣德軍節度使司成州長慶軍節度使司懿州廣順軍節度使司渭州高陽軍節度使司鎮州建安軍節度使司東京道開州鎮國軍節度使司保州宣義軍節度使司辰州奉國軍節度使司興州中興