body:
  text: 遼史卷一百五列傳第三十五能吏大公鼎蕭文馬人望耶律鐸魯斡楊遵勗王棠漢以璽書賜二千石唐疏刺史縣令于屏以示奬率故二史有循吏良吏之傳遼自太祖創業太宗撫有燕薊任賢使能之道亦略備矣然惟朝廷參置國官吏州縣者多遵唐制歷世既久選舉益嚴時又分遣重臣巡行境內察賢否而進退之是以治民理財決獄弭盜各有其人考其德政雖未足以與諸循良之列抑亦可謂能吏矣作能吏傳大公鼎渤海人先世籍遼陽率賓縣統和間徙遼東豪右以實中京因家于大定曾祖忠禮賓使父信興中主簿公鼎幼莊願長而好學咸雍十年登進士第調瀋州觀察判官時遼東雨水傷稼北樞密院大發瀕河丁壯以完隄防有司承令峻急公鼎獨曰邊障甫寧大興役事非利國便農之道乃疏奏其事朝廷從之罷役水亦不為災瀕河千里人莫不悅改良鄉令省徭役務農桑建孔子廟學部民服化纍遷興國軍節度副使時有隸鷹坊者以羅畢為名擾害田里歲久民不堪公鼎言于上即命禁戢會公鼎造朝大臣諭上嘉納之意公鼎曰一郡獲安誠為大幸他郡如此者衆願均其賜于天下從之徙長春州錢帛都提點車駕如春水貴主例為假貸公鼎曰豈可輟官用徇人情拒之頗聞怨詈語曰此吾職不敢廢也俄拜大理卿多所平反天祚即位歷長寧軍節度使南京副留守改東京戶部使時盜殺留守蕭保先始利其財因而倡亂民亦互生猜忌家自為鬬公鼎單騎行郡陳以禍褔衆皆投兵而拜曰是不欺我敢弗聽命安輯如故拜中京留守賜貞亮功臣乘傳赴官時盜賊充斥有遇公鼎于路者即叩馬乞自新公鼎給以符約俾還業聞者接踵而至不旬日境內清肅天祚聞之加賜保節功臣時人心反側公鼎慮生變請布恩惠以安之為之肆赦公鼎纍表乞歸不許會奴賊張撒八率無賴嘯聚公鼎欲擊而勢有不能嘆曰吾欲謝事久矣為世故所牽不幸至此豈命也夫因憂憤成疾保大元年卒年七十九子昌齡左承制昌嗣洺州刺史昌朝鎮寧軍節度蕭文字國華外戚之賢者也父直善安州防禦使文篤志力學喜慍不形大康初掌秦越國王中丞司事以才幹稱尋知北面貼黃王邦彥子爭廕數歲不能定有司以聞上命文詰之立決車駕將還宮承詔閲習儀衛雖執事林林指顧如一遷同知奉國軍節度使歷國舅都監壽隆末知易州兼西南面安撫使高陽土沃民富吏其邑者每黷于貨民甚苦之文始至悉去舊弊務農桑崇禮教民皆化之時大旱百姓憂甚文禱之輒雨屬縣又蝗議捕除之文曰蝗天災捕之何益但反躬自責蝗盡飛去遺者亦不食苗散在草莽為烏鵲所食會霪雨不止文復隨禱而霽是歲大熟朝廷以文可大用遷唐古部節度使高陽勒石頌之後不知所終馬人望字儼叔高祖胤卿為石晉青州刺史太宗兵至堅守不降城破被執太宗義而釋之徙其族于醫巫閭山因家焉曾祖廷煦南京留守祖淵中京副留守父詮中京文思使人望穎悟幼孤長以才學稱咸雍中第進士為松山縣令歲運澤州官炭獨役松山人望請于中京留守蕭吐渾均役他邑吐渾怒下吏繫幾百日復引詰之人望不屈蕭喜曰君為民如此後必大用以事聞于朝悉從所請徙知涿州新城縣縣與宋接境驛道所從出人望治不擾吏民畏愛近臣有聘宋還者帝問以外事多薦之擢中京度支司鹽鐵判官轉南京三司度支判官公私兼裕遷警巡使京城獄訟填委人望處決無一寃者會檢括戶口未兩旬而畢同知留守蕭保先怪而問之人望曰民産若括之無遺他日必長厚斂之弊大率十得六七足矣保先謝曰公慮遠吾不及也先是樞密使乙辛竊弄威柄卒害太子及天祚嗣位將報父仇選人望與蕭報恩究其事人望平心以處所活甚衆改上京副留守會劇賊趙鐘哥犯闕劫宮女御物人望率衆捕之右臂中矢炷以艾力疾馳逐賊棄所掠而遁人望令關津譏察行旅悉獲其盜尋擢樞密都承旨宰相耶律儼惡人望與己異遷南京諸宮提轄制置歲中為保靜軍節度使有二吏凶暴民畏如虎人望假以辭色陰令發其事黥配之是歲諸處飢乏惟人望所治粒食不闕路不鳴桴遙授彰義軍節度使遷中京度支使始至府廩皆空視事半歲積粟十五萬斛錢二十萬繈徙左散騎常侍纍遷樞密直學士未幾拜參知政事判南京三司使事時錢粟出納之弊惟燕為甚人望以縑帛為通曆凡庫物出入皆使別籍名曰臨庫姦人黠吏莫得軒輊乃以年老揚言道路朝論不察改南院宣徽使以示優老踰年天祚手書宣馬宣徽四字詔之既至諭曰以卿為老誤聽也遂拜南院樞密使人不敢干以私用人必公議所當與者如曹勇義虞仲文嘗為姦人所擠人望推薦皆為名臣當時民所甚患者驛遞馬牛旗鼓鄉正廳隸倉司之役至破産不能給人望使民出錢官自募役時以為便久之請老以守司徒兼侍中致仕卒諡曰文獻人望有操守喜怒不形未嘗附麗求進初除執政家人賀之人望愀然曰得勿喜失勿憂抗之甚高擠之必酷其畏慎如此耶律鐸魯斡字乙辛隱季父房之後廉約重義重熙末給事誥院咸雍中纍遷同知南京留守事被召以部民懇留乃賜詔褒奬大康初改西南面招討使為北面林牙遷左夷離畢大安五年拜南府宰相壽隆初致仕卒鐸魯斡所至有聲吏民畏愛及退居鄉里子普古為烏古部節度使遣人來迎既至見積委甚富謂普古曰辭親入仕當以裕國安民為事枉道欺君以苟貨利非吾志也命駕而歸普古後為盜所殺楊遵勗字益誡涿州范陽人重熙十九年登進士第調儒州軍事判官纍遷樞密院副承旨咸雍三年為宋國賀正使還遷都承旨天下之事叢于樞府簿書填委遵勗一目五行俱下剖決如流敷奏詳敏上嘉之奉詔徵戶部逋錢得四十餘萬緍拜樞密直學士改樞密副使大康初參知政事徙知樞密院事兼門下侍郎平章事拜南府宰相耶律乙辛誣皇太子詔遵勗與燕哥按其事遵勗不敢正言時議短之尋拜北府宰相大安中暴卒年五十六贈守司空諡康懿子晦終昭文館直學士王棠涿州新城人博古善屬文重熙十五年擢進士鄉貢禮部廷試對皆第一纍遷上京鹽鐵使或誣以賄無狀釋之遷東京戶部使大康二年遼東飢民多死請賑恤從之三年入為樞密副使拜南府宰相大安末卒棠練達朝政臨事不怠在政府修明法度有聲論曰孟子謂民為貴社稷次之司牧者當如何以盡心公鼎奏罷完隄役以息民拒公主假貸以守法單騎行郡化盜為良庶幾召杜之美文知易州雨暘應禱蝗不為災人望為民不避囚繫判度支公私兼裕亦卓乎未易及已鐸魯斡吏畏民愛楊遵勗決事如流真能吏哉
