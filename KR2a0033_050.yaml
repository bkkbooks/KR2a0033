body:
  text: 遼史卷五十志第十九禮志二凶儀喪葬儀聖宗崩興宗哭臨于菆塗殿大行之夕四鼓終皇帝率羣臣入柩前三致奠奉柩出殿之西北門就轀輬車藉以素裀巫者袚除之詰旦發引至祭所凡五致奠太巫祈禳皇族外戚大臣諸京官以次致祭乃以衣弓矢鞍勒圖畫馬駝儀衛等物皆燔之至山陵葬畢上哀冊皇帝御幄命改火面火致奠三拜又東向再拜天地訖乘馬率送葬者過神門之木乃下東向又再拜翼日詰旦率羣臣命婦詣山陵行初奠之禮升御容殿受遺賜又翼日再奠如初興宗崩道宗親擇地以葬道宗崩菆塗于遊仙殿有司奉喪服天祚皇帝問禮于總知翰林院事耶律固始服斬衰皇族外戚使相矮墩官及郎君服如之餘官及承應人皆白枲衣巾以入哭臨惕隱三父房南府宰相遙輦常袞九奚首郎君夷離畢國舅詳穩十閘撒郎君南院大王郎君各以次薦奠進鞍馬衣襲犀玉帶等物表列其數讀訖焚表諸國所賻器服親王諸京留守奠祭進賻物亦如之先帝小斂前一日皇帝喪服上香奠酒哭臨其夜北院樞密使契丹行宮都部署入小斂翼日遣北院樞密副使林牙以所賵器服置之幽宮靈柩升車親王推之至食羖之次蓋遼國舊俗於此刑羖羊以祭皇族外戚諸京州官以次致祭至葬所靈柩降車就輿皇帝免喪服步引至長福岡是夕皇帝入陵寢授遺物于皇族外戚及諸大臣乃出命以先帝寢幄過於陵前神門之木帝不親往遣近侍冠服赴之初奠皇帝皇后率皇族外戚使相節度使夫人以上命婦皆拜祭循陵三匝而降再奠如初辭陵而還上諡冊儀先一日於菆塗殿西廊設御幄並臣僚幕次太樂令展宮懸於殿庭協律郎設舉麾位至日北南面臣僚朝服昧爽赴菆塗殿先置冊寶案于西廊下閣使引皇帝至御幄服寬衣皂帶臣僚班齊分班引入嚮殿合班立定引冊案上殿至褥位寶案次之設於西階閣使引皇帝自西階升殿初行樂作至位立樂止宣徽使揖皇帝鞠躬再拜陪位者皆再拜翰林使執臺盞以進皇帝再拜引至神座前跪奠三樂作進奠訖復位樂止又再拜陪位者皆再拜引皇帝于神座前北面立捧冊函者去蓋進前跪冊案退置殿西壁下引讀冊者進前俯伏跪自通全銜臣讀諡冊讀訖俯伏興復位捧冊函者置于案上捧寶函者進前跪讀寶官通銜跪讀訖引皇帝至褥位再拜陪位者皆再拜禮畢引皇帝歸御幄初行樂作至御幄樂止引臣僚分班出若皇太后奠酒依常儀忌辰儀先一日奏忌辰榜子預寫名紙大紙一幅用陰面後第三行書文武百僚宰臣某以下謹詣西上閣門進名奉慰至日應拜大小臣僚並皂衣皂帶四鼓至時於幕次前在京於僧寺班齊依位望闕立直日舍人跪右執名紙在前班首以下皆再拜引退名紙於宣徽使面付內侍奏聞宋使祭奠弔慰儀太皇太后至菆塗殿服喪服太后於北間南面垂簾坐皇帝於南間北面坐宋使至幕次宣賜素服皂帶更衣訖引南北臣僚入班立定可矮墩以下並上殿依位立先引祭奠使副捧祭文南洞門入殿上下臣僚並舉哀至丹墀立定西上閣門使自南階下受祭文上殿啓封置於香案哭止祭奠禮物列殿前引使副南階上殿至褥位立揖再拜引大使近前上香退再拜大使近前跪捧臺盞進奠酒三教坊奏樂退再拜揖中書二舍人跪捧祭文引大使近前俯伏跪讀訖舉哀引使副下殿立定哭止禮物擔牀出畢引使副近南面北立勾弔慰使副南洞門入四使同見大行皇帝靈再拜引出歸幕次皇太后別殿坐服喪服先引北南面臣僚並於殿上下依位立弔慰使副捧書匣右入當殿立閣門使右下殿受書匣上殿奏封全開讀訖引使副南階上殿傳達弔慰訖退下殿立引禮物擔牀過畢引使副近南北面立勾祭奠使副入四使同見鞠躬再拜不出班奏聖躬萬福再拜出班謝面天顏又再拜立定宣徽傳聖旨撫問就位謝再拜引出歸幕次皇帝御南殿服喪服使副入見如見皇太后儀加謝遠接撫問湯藥再拜次宣賜使副并從人祭奠使副別賜讀祭文例物即日就館賜宴高麗夏國奉弔進賻等使禮略如之道宗崩天祚皇帝問禮于耶律固宋國遣使弔及致祭歸賵皇帝喪服御遊仙之北別殿使入門皇帝哭使者詣柩前上香讀祭文訖又哭有司讀遺詔慟哭使者出少頃復入陳賻賵于柩前皇帝入臨哭退更衣御遊仙殿南之幄殿使者入見且辭敕有司賜宴於館宋使告哀儀皇帝素冠服臣僚皂袍皂帶宋使奉書右入丹墀內立西上閣門使右階下殿受書匣上殿欄內鞠躬奏封全開封於殿西案授宰相讀訖皇帝舉哀舍人引使者右階上欄內俯跪附奏起居訖俯興立皇帝宣問南朝皇帝聖躬萬福使者跪奏來時皇帝聖躬萬福起退舍人引使者右階下殿於丹墀西面東鞠躬通事舍人通使者名某祇候見再拜不出班奏聖躬萬福再拜出班謝面天顏再拜又出班謝遠接撫問湯藥再拜贊祗候引出就幕次宣賜衣物引從人入通名拜奏聖躬萬福出就幕賜衣如使者之儀又引使者入面殿鞠躬贊謝恩再贊有敕賜宴再拜贊祗候出就幕次宴引從人謝恩拜敕賜宴皆如初宴畢歸館宋使進遺留禮物儀百官昧爽朝服殿前班立宋遺留使告登位使副入內門館伴副使引謝登位使就幕次坐館伴大使與遺留使副奉書入至西上閣門外氈位立閣使受書匣置殿西階下案引進使引遺留物於西上閣門入即於廊下橫門出皇帝升殿坐宣徽使押殿前班起居畢引宰臣押文武班起居引中書令西階上殿奏宋使見榜子契丹臣僚起居控鶴官起居遺留使副西上閣門入面殿立舍人引使副西階上殿附奏起居訖引西階下殿於丹墀東西面鞠躬通名奏聖躬萬福如告哀使之儀謝面天顏謝遠接撫問湯藥引遺留使從人見亦如之次引告登位使副奉書匣於東上閣門入面殿立閣使東階下殿受書匣中書令讀訖舍人引使副東階上殿附奏起居引下殿南面立告登位禮物入即於廊下橫門出退西面鞠躬附奏起居謝面天顏遠接等皆如遺留使之儀宣賜遺留登位兩使副并從人衣物如告哀使應坐臣僚皆上殿就位立分引兩使副等於兩廊立皇帝問使副衝涉不易丹墀內五拜各引上殿祗候位立大臣進酒皇帝飲酒契丹通漢人贊殿上臣僚皆拜稱萬歲贊各就坐行酒殽茶膳饅頭畢從人出水飯畢臣僚皆起契丹通漢人贊皆再拜稱萬歲各祗候獨引宋使副下殿謝五拜引出控鶴官門外祗候報閣門無事供奉官捲班出高麗夏國告終儀先期於行宮左右下御帳設使客幕次於東南至日北面臣僚各常服其餘臣僚並朝服入朝使者至幕次有司以嗣子表狀先呈樞密院准備奏呈先引北面臣僚並矮墩已上近御帳相對立其餘臣僚依班位序立引告終人使右入至丹墀面殿立引右上立揖少前拜跪奏訖宣問若嗣子已立恭身受聖旨奏訖復位嗣子未立不宣問引右下丹墀面北鞠躬通班畢引面殿再拜不出班奏聖躬萬福再拜出班謝面天顏復位再拜出班謝遠接復位再拜贊祗候退就幕次再入依前面北鞠躬通辭再拜戀闕再拜贊好去禮畢
