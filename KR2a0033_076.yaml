body:
  text: 遼史卷七十六列傳第六耶律解里耶律拔里得耶律朔古耶律魯不古趙延壽高模翰趙思溫耶律漚里思張礪耶律解里字潑單突呂不部人世為小吏解里早隸太宗麾下擢為軍校天顯間唐攻定州既陷解里為唐兵所獲晉高祖立始歸國太宗貰其罪拜御史大夫會同九年伐晉師次滹沱河奪中渡橋降其將杜重威上命解里與降將張彥澤率騎兵三千疾趨河南所至無敢當其鋒既入汴解里等遷晉主重貴于開封府彥澤恣殺掠亂宮掖解里不能禁百姓騷然莫不怨憤車駕至京數彥澤罪斬于市汴人大悅解里亦被詰責尋釋之天祿間加守太子太傅應曆初置本部令穩解里世其職卒耶律拔里得字孩鄰太祖弟剌葛之子太宗即位以親愛見任會同七年討石重貴拔里得進圍德州下之擒刺史師居璠等二十七人九年再舉兵次滹沱河降杜重威戰功居多太宗入汴以功授安國軍節度使總領河北道事師還州郡往往叛以應劉知遠拔里得不能守而歸世宗即位遷中京留守卒耶律朔古字彌骨頂橫帳孟父之後幼為太祖所養既冠為右皮室詳穩從伐渤海戰有功天顯七年授三河烏古部都詳穩平易近民民安之以故久其任會同間為惕隱時晉主石重貴渝盟帝親征晉將杜重威擁衆拒滹沱月餘帝由他渡濟朔古與趙延壽據中渡橋重威兵却遂降是歲入汴世宗即位朔古奉太宗喪歸上京佐皇太后出師坐是免官卒耶律魯不古字信寧太祖從姪也初太祖制契丹國字魯不古以贊成功授林牙監修國史後率偏師為西南邊大詳穩從伐黨項有功會河東節度使石敬瑭為其主所討遣人求援魯不古導送于朝如其請帝親率師往援魯不古從擊唐將張敬達于太原北敗之會同初從討黨項俘獲最諸將師還天祿中拜于越六年為北院大王終年五十五趙延壽本姓劉山人父邟令蓨梁開平初滄州節度使劉守文陷蓨其稗將趙德鈞獲延壽養以為子少美容貌好書史唐明宗先以女妻之及即位封其女為興平公主拜延壽駙馬都尉樞密使明宗子從榮恃權跋扈內外莫不震懾延壽求補外避之出為宣武軍節度使清泰初加魯國公復為樞密使鎮許州石敬瑭發兵太原唐遣張敬達往討會敬達敗保晉安寨延壽與德鈞往救聞晉安已破走團柏峪太宗追及延壽與其父俱降明年德鈞卒以延壽為幽州節度使封燕王及改幽州為南京遷留守總山南事天顯末以延壽妻在晉詔取之以歸自是益自激昂圖報會同初帝幸其第加政事令六年冬晉人背盟帝親征延壽為先鋒下貝州授魏博等州節度使封魏王敗晉軍于南樂獲其將賽項羽軍元城晉將李守貞高行周率兵來逆破之至頓丘會大霖雨帝欲班師延壽諫曰晉軍屯河濱不敢出戰若徑入澶州奪其橋則晉不足平上然之適晉軍先歸澶州高行周至析城延壽將輕兵逆戰上親督騎士突其陳敵遂潰師還留延壽徇貝冀深三州八年再伐晉晉主遣延壽族人趙行實以書來招時晉人堅壁不出延壽紿曰我陷虜久寧忘父母之邦若以軍逆我即歸晉人以為然遣杜重威率兵迎之延壽至滹沱河據中渡橋與晉軍力戰手殺其將王清兩軍相拒太宗潛由他渡濟留延壽與耶律朔古據橋敵不能奪屢敗之杜重威掃厥衆降上喜賜延壽龍鳳赭袍且曰漢兵皆爾所有爾宜親往撫慰延壽至營杜重威李守貞迎謁馬首後太宗克汴延壽因李嵩求為皇太子上曰吾於魏王雖割肌肉亦不惜但皇太子須天子之子得為魏王豈得為也蓋上嘗許滅晉後以中原帝延壽以故摧堅破敵延壽常以身先至是以嵩達意上命遷延壽秩翰林學士承旨張礪進擬中京留守大丞相録尚書事都督中外諸軍事上塗録尚書事都督中外諸軍事世宗即位以翊戴功授樞密使天祿二年薨高模翰一名松渤海人有膂力善騎射好談兵初太祖平渤海模翰避地高麗王妻以女因罪亡歸坐使酒殺人下獄太祖知其才貰之天顯十一年七月唐遣張敬達楊光遠帥師五十萬攻太原勢鋭甚石敬瑭遣人求救太宗許之九月徵兵出雁門模翰與敬達軍接戰敗之太原圍解敬瑭夜出謁帝約為父子帝召模翰等賜以酒饌親饗士卒士氣益振翌日復戰又敗之敬達鼠竄晉安寨模翰獻俘于帝會敬瑭自立為晉帝光遠斬敬達以降諸州悉下上諭模翰曰朕自起兵百餘戰卿功第一雖古名將無以加乃授上將軍會同元年册禮告成宴百官及諸國使于二儀殿帝指模翰曰此國之勇將朕統一天下斯人之力也羣臣皆稱萬歲及晉叛盟出師南伐模翰為統軍副使與僧遏前驅拔赤城破德貝諸寨是冬兼總左右鐵鷂子軍下關南城邑數十三月勑虎官楊覃赴乾寧軍為滄州節度使田武名所圍模翰與趙延壽聚議往救俄有光自模翰目中出縈繞旗矛焰焰如流星久之模翰喜曰此天贊之祥遂進兵殺獲甚衆以功加侍中略地鹽山破饒安晉人震怖不敢接戰加太傅晉以魏府節度使杜重威領兵三十萬來拒模翰謂左右曰軍法在正不在多以多陵少不義必敗其晉之謂乎詰旦以麾下三百人逆戰殺其先鋒梁漢璋餘兵敗走手詔褒美比漢之李陵頃之杜重威等復至滹沱河帝召模翰問計上善其言曰諸將莫及此乃令模翰守中渡橋及戰復敗之上曰朕憑高觀兩軍之勢顧卿英鋭無敵如鷹逐雉兔當圖形麟閣爵貤後裔已而杜重威等降車駕入汴加特進檢校太師封哲郡開國公賜璽書劍器為汴州巡檢使平汜水諸山土賊遷鎮中京天祿二年加開府儀同三司賜對衣鞍勒名馬應曆初召為中臺省右相至東京父老歡迎曰公起戎行致身富貴為鄉里榮相如買臣輩不足過也九年正月遷左相卒趙思溫字文美盧龍人少果鋭膂力兼人隸燕帥劉仁恭幕李存勗問罪于燕思溫統偏師拒之流矢中目裂裳漬血戰猶不已為存勗將周德威所擒存勗壯而釋其縛久之日見信用與梁戰於莘縣以驍勇聞授平州刺史兼平營薊三州都指揮使神册二年太祖遣大將經略燕地思溫來降及伐渤海以思溫為漢軍都團練使力戰拔扶餘城身被數創太祖親為調藥太宗即位以功擢檢校太保保靜軍節度使天顯十一年唐兵攻太原石敬瑭遣使求救上命思溫自嵐憲間出兵援之既罷兵改南京留守盧龍軍節度使管內觀察處置等使開府儀同三司兼侍中賜協謀靜亂翊聖功臣尋改臨海軍節度使會同初從耶律牒使晉行册禮還加檢校太師二年有星隕于庭卒上遣使賻祭贈太師魏國公子延照延靖官至使相耶律漚里思六院夷離堇蒲古只之後負勇略每戰被重鎧揮鐵槊所向披靡會同間伐晉上至河而獵適海東青鶻搏雉晉人隔水以鴿引去上顧左右曰誰為我得此人漚里思請內竹罒戊馬濟河擒之並殺救者數人還上大悅優加賞賚既而晉將杜重威逆于望都據水勒戰漚里思介馬突陳餘軍繼之被圍衆言陳薄處可出漚里思曰恐彼有他備竟引兵衝堅而出回視衆所指皆大塹也其料敵多此類是年總領敵烈皮室軍坐私免部曲奪官卒張礪磁州人初仕唐為掌書記遷翰林學士會石敬瑭起兵唐主以礪為招討判官從趙德鈞援張敬達于河東及敬達敗礪入契丹後太宗見礪剛直有文彩擢翰林學士礪臨事必盡言無所避上益重之未幾謀亡歸為追騎所獲上責曰汝何故亡礪對曰臣不習北方土俗飲食居處意常鬱鬱以是亡耳上顧通事高彥英曰朕嘗戒汝善遇此人何乃使失所而亡礪去可再得耶遂杖彥英而謝礪會同初升翰林承旨兼吏部尚書從太宗伐晉入汴諸將蕭翰耶律郎五麻答輩肆殺掠礪奏曰今大遼始得中國宜以中國人治之不可專用國人及左右近習苟政令乖失則人心不服雖得之亦將失之上不聽改右僕射兼門下侍郎平章事頃之車駕北還至欒城崩時礪在州蕭翰與麻答以兵圍其第礪方臥病出見之翰數之曰汝何故於先帝言國人不可為節度使我以國舅之親有征伐功先帝留我守汴以為宣武軍節度使汝獨以為不可又譖我與解里好掠人財物子女今必殺汝趣令鎖之礪抗聲曰此國家大體安危所繫吾實言之欲殺即殺奚以鎖為麻答以礪大臣不可專殺乃救止之是夕礪恚憤卒論曰初晉因遼之兵而得天下故兼臣禮而父事之割地以為壽輸帛以為貢未久也而會同之師次滹沱矣豈羣帥貪功黷武而致然歟抑所謂信不由衷也哉模翰以功名自終可謂良將若延壽之勳雖著至於覬覦儲位謬矣利令智昏固無足議若乃成末釁以虧俊功如解里者何譏焉
