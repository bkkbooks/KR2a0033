body:
  text: 遼史卷五本紀第五世宗世宗孝和莊憲皇帝諱阮小字兀欲讓國皇帝長子母柔貞皇后蕭氏帝儀觀豐偉內寬外嚴善騎射樂施豫人望歸之太宗愛之如子會同九年從伐晉大同元年春二月封永康王夏四月丁丑太宗崩於欒城戊寅梓宮次鎮陽即皇帝位於柩前甲申次定州命天德朔古解里等護梓宮先赴上京太后聞帝即位遣太弟李胡率兵拒之六月甲寅朔次南京五院夷離堇安端詳穩劉哥遣人馳報請為前鋒至泰德泉遇李胡軍戰敗之上遣郎君勤德等詣兩軍諭解秋閏七月次潢河太后李胡整兵拒於橫渡相持數日用屋質之謀各罷兵趨上京既而聞太后李胡復有異謀遷于祖州誅司徒劃設及楚補里八月壬午朔尊母蕭氏為皇太后以太后族剌只撒古魯為國舅帳立詳穩以總焉以崇德宮戶分賜翼戴功臣及北院大王窪南院大王吼各五十安摶楚補各百的魯鐵剌子孫先以非罪籍沒者歸之癸未始置北院樞密使以安摶為之九月壬子朔葬嗣聖皇帝於懷陵丁卯行柴册禮羣臣上尊號曰天授皇帝大赦改大同元年為天祿元年追諡皇考曰讓國皇帝以安端主東丹國封明王察割為泰寧王劉哥為惕隱高勳為南院樞密使二年春正月天德蕭翰劉哥盆都等謀反誅天德杖蕭翰遷劉哥於邊罰盆都使轄戞斯國漢主劉知遠殂子承祐立夏四月庚辰朔南唐遣李朗王祚來慰且賀兼奉蠟丸書議攻漢秋七月壬申皇子賢生冬十月壬午南京留守魏王趙延壽薨以中臺省右相牒為南京留守封燕王十一月駐蹕彰武南三年春正月蕭翰及公主阿不里謀反翰伏誅阿不里瘐死獄中庚申肆赦內外官各進一階夏六月戊寅以敞史耶律胡離軫為北院大王己卯惕隱頽昱封漆水郡王秋九月辛丑朔召羣臣議南伐冬十月遣諸將率兵攻下貝州高老鎮徇地鄴都南宮堂陽殺深州刺史史萬山俘獲甚衆四年春二月辛未泰寧王察割來朝留侍是月建政事省三月戊戌朔南唐遣趙延嗣張福等來賀南征捷秋九月乙丑朔如山西冬十月自將南伐攻下安平內丘束鹿等城大獲而還是歲册皇后蕭氏五年春正月癸亥朔如百泉湖漢郭威弒其主自立國號周遣朱憲來告即遣使致良馬漢劉崇自立於太原二月周遣姚漢英華昭胤來以書辭抗禮留漢英等夏五月壬戌朔太子太傅趙瑩薨輟朝一日命歸葬于汴詔州縣録事參軍主簿委政事省銓注六月辛卯朔劉崇為周所攻遣使稱姪乞援且求封册即遣燕王牒樞密使高勳册為大漢神武皇帝南唐遣蔣洪來乞舉兵應援是夏清暑百泉嶺九月庚申朔自將南伐壬戌次歸化州祥古山癸亥祭讓國皇帝于行宮羣臣皆醉察割反帝遇弒年三十四應曆元年葬於顯州西山陵曰顯陵二年諡孝和皇帝廟號世宗統和二十六年七月加諡孝和莊憲皇帝贊曰世宗中才之主也入繼大統曾未三年納唐丸書即議南伐既乏持重宜乖周防蓋有致禍之道矣然而孝友寬慈亦有君人之度焉未及師還變起沉湎豈不可哀也哉
