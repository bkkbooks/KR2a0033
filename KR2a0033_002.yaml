body:
  text: 遼史卷二本紀第二太祖下四年春正月丙申射虎東山二月丙寅修遼陽故城以漢民渤海戶實之改為東平郡置防禦使夏五月庚辰至自東平郡秋八月丁酉謁孔子廟命皇后皇太子分謁寺觀九月征烏古部道聞皇太后不豫一日馳六百里還侍太后病間復還軍中冬十月丙午次烏古部天大風雪兵不能進上禱于天俄頃而霽命皇太子將先鋒軍進擊破之俘獲生口萬四千二百牛馬車乘廬帳器物二十餘萬自是舉部來附五年春正月乙丑始製契丹大字夏五月丙寅吳越王復遣滕彥休貢犀角珊瑚授官以遣庚辰有龍見于拽剌山陽水上上射獲之藏其骨內府閏六月丁卯以皇弟蘇為惕隱康默記為夷離畢秋八月己未朔党項諸部叛辛未上親征九月己丑朔梁遣郎公遠來聘壬寅大字成詔頒行之皇太子率迭剌部夷離菫汙里軫等略地雲內天德冬十月辛未攻天德癸酉節度使宋瑤降賜弓矢鞍馬旗鼓更其軍曰應天甲戌班師宋瑤復叛丙子拔其城擒宋瑤俘其家屬徙其民於陰山南十二月己未師還六年春正月丙午以皇弟蘇為南府宰相迭里為惕隱南府宰相自諸弟搆亂府之名族多罹其禍故其位久虛以鋤得部轄得里只里古攝之府中數請擇任宗室上以舊制不可輒變請不已乃告于宗廟而後授之宗室為南府宰相自此始夏五月丙戌朔詔定法律正班爵丙申詔畫前代直臣像為招諫圖及詔長吏四孟月詢民利病六月乙卯朔日有食之冬十月癸丑朔晉新州防禦使王郁以所部山北兵馬內附丙子上率大軍入居庸關十一月癸卯下古北口丁未分兵略檀順安遠三河良鄉望都潞滿城遂城等十餘城俘其民徙內地十二月癸丑王郁率其衆來朝上呼郁為子賞賚甚厚而徙其衆于潢水之南庚申皇太子率王郁略地定州康默記攻長蘆唐義武軍節度使王處直養子都囚其父自稱留後癸亥圍涿州有白兔緣壘而上是日破其郛癸酉刺史李嗣弼以城降乙亥存勗至定州王都迎謁馬前存勗引兵趨望都遇我軍禿餒五千騎圍之存勗力戰數四不解李嗣昭領三百騎來救我軍少却存勗乃得出大戰我軍不利引歸存勗至幽州遣二百騎躡我軍後我軍反擊悉擒之己卯還次檀州幽人來襲擊走之擒其裨將詔徙檀順民于東平瀋州天贊元年春二月庚申復徇幽薊地癸酉詔改元赦軍前殊死以下夏四月甲寅攻薊州戊午拔之擒刺史胡瓊以盧國用涅魯古典軍民事壬戌大饗軍士癸亥李存勗圍鎮州張文禮求援命郎君迭烈將軍康末怛往擊敗之殺其將李嗣昭辛未攻石城縣拔之五月丁未張文禮卒其子處瑾遣人奉表來謝六月遣鷹軍擊西南諸部以所獲賜貧民冬十月甲子以蕭霞的為北府宰相分迭剌部為二院斜涅赤為北院夷離菫綰思為南院夷離菫詔分北大濃兀為二部立兩節度使以統之十一月壬寅命皇子堯骨為天下兵馬大元帥略地薊北二年春正月丙申大元帥堯骨克平州獲刺史趙思溫裨將張崇二月如平州甲子以平州為盧龍軍置節度使三月戊寅軍于箭笴山討叛奚胡損獲之射以鬼箭誅其黨三百人沉之狗河置奚墮瑰部以勃魯恩權總其事夏四月己酉梁遣使來聘吳越王遣使來貢癸丑命堯骨攻幽州迭剌部夷離菫覿烈徇山西地庚申堯骨軍幽州東節度使符存審遣人出戰敗之擒其將裴信父子閏月庚辰堯骨抵鎮州壬午拔曲陽丙戌下北平是月晉王李存勗即皇帝位國號唐五月戊午堯骨師還癸亥大饗軍士賞賚有差六月辛丑波斯國來貢秋七月前北府宰相蕭阿古只及王郁徇地燕趙冬十月辛未朔日有食之己卯唐兵滅梁三年春正月遣兵略地燕南夏五月丙午以惕隱迭里為南院夷離菫是月徙薊州民實遼州地渤海殺其刺史張秀實而掠其民六月乙酉召皇后皇太子大元帥及二宰相諸部頭等詔曰上天降監惠及烝民聖主明王萬載一遇朕既上承天命下統羣生每有征行皆奉天意是以機謀在己取舍如神國令既行人情大附舛訛歸正遐邇無愆可謂大含溟海安納泰山矣自我國之經營為羣方之父母憲章斯在胤嗣何憂升降有期去來在我良籌聖會自有契於天人衆國羣王豈可化其凡骨三年之後歲在丙戌時值初秋必有歸處然未終兩事豈負親誠日月非遙戒嚴是速聞詔者皆驚懼莫識其意是日大舉征吐渾党項阻卜等部詔皇太子監國大元帥堯骨從行秋七月辛亥曷剌等擊素昆那山東部族破之八月乙酉至烏孤山以鵝祭天甲午次古單于國登阿里典壓得斯山以麃鹿祭九月丙申朔次古回鶻城勒石紀功庚子拜日于蹛林丙午遣騎攻阻卜南府宰相蘇南院夷離菫迭里略地西南乙卯蘇等獻俘丁巳鑿金河水取烏山石輦致潢河木葉山以示山川朝海宗嶽之意癸亥大食國來貢甲子詔礱闢遏可汗故碑以契丹突厥漢字紀其功是月破胡母思山諸蕃部次業得思山以赤牛青馬祭天地回鶻霸里遣使來貢冬十月丙寅朔獵寓樂山獲野獸數千以充軍食丁卯軍于霸離思山遣兵踰流沙拔浮圖城盡取西鄙諸部十一月乙未朔獲甘州回鶻都督畢離遏因遣使諭其主烏母主可汗射虎于烏剌邪里山抵霸室山六百餘里且行且獵日有鮮食軍士皆給四年春正月壬寅以捷報皇后皇太子二月丙寅大元帥堯骨略党項丁卯皇后遣康末怛問起居進御服酒膳乙亥蕭阿古只略燕趙還進牙旗兵仗辛卯堯骨獻党項俘三月丙申饗軍于水精山夏四月甲子南攻小蕃下之皇后皇太子迎謁於札里河癸酉回鶻烏母主可汗遣使貢謝五月甲寅清暑室韋北陘秋九月癸巳至自西征冬十月丁卯唐以滅梁來告即遣使報聘庚辰日本國來貢辛巳高麗國來貢十一月丁酉幸安國寺飯僧赦京師囚縱五坊鷹鶻己酉新羅國來貢十二月乙亥詔曰所謂兩事一事已畢惟渤海世讎未雪豈宜安駐乃舉兵親征渤海大諲譔皇后皇太子大元帥堯骨皆從閏月壬辰祠木葉山壬寅以青牛白馬祭天地于烏山己酉次撒葛山射鬼箭丁巳次商嶺夜圍扶餘府天顯元年春正月己未白氣貫日庚申拔扶餘城誅其守將丙寅命惕隱安端前北府宰相蕭阿古只等將萬騎為先鋒遇諲譔老相兵破之皇太子大元帥堯骨南府宰相蘇北院夷離菫斜涅赤南院夷離菫迭里是夜圍忽汗城己巳諲譔請降庚午駐軍于忽汗城南辛未諲譔素服索牽羊率僚屬三百餘人出降上優禮而釋之甲戌詔諭渤海郡縣丙子遣近侍康末怛等十三人入城索兵器為邏卒所害丁丑諲譔復叛攻其城破之駕幸城中諲譔請罪馬前詔以兵衞諲譔及族屬以出祭告天地復還軍中二月庚寅安邊鄚頡南海定理等府及諸道節度刺史來朝慰勞遣之以所獲器幣諸物賜將士壬辰以青牛白馬祭天地大赦改元天顯以平渤海遣使報唐甲午復幸忽汗城閱府庫物賜從臣有差以奚部長勃魯恩王郁自回鶻新羅吐蕃党項室韋沙陀烏古等從征有功優加賞賚丙午改渤海國為東丹忽汗城為天福冊皇太子倍為人皇王以主之以皇弟迭剌為左大相渤海老相為右大相渤海司徒大素賢為左次相耶律羽之為右次相赦其國內殊死以下丁未高麗濊貊鐵驪靺鞨來貢三月戊午遣夷離畢康默記左僕射韓延徽攻長嶺府甲子祭天丁卯幸人皇王宮己巳安邊鄚頡定理三府叛遣安端討之丁丑三府平壬午安端獻俘誅安邊府叛帥二人癸未宴東丹國僚佐頒賜有差甲申幸天福城乙酉班師以大諲譔舉族行夏四月丁亥朔次傘子山辛卯人皇王率東丹國僚屬辭是月唐養子李嗣源反郭存謙弒其主存勗嗣源遂即位五月辛酉南海定理二府復叛大元帥堯骨討之六月丁酉二府平丙午次慎州唐遣姚坤以國哀來告秋七月丙辰鐵州刺史衞鈞反乙丑堯骨攻拔鐵州庚午東丹國左大相迭剌卒辛未衞送大諲譔于皇都西築城以居之賜諲譔名曰烏魯古妻曰阿里只盧龍行軍司馬張崇叛奔唐甲戌次扶餘府上不豫是夕大星隕于幄前辛巳平旦子城上見黃龍繚繞可長一里光耀奪目入于行宮有紫黑氣蔽天踰日乃散是日上崩年五十五天贊三年上所謂丙戌秋初必有歸處至是乃驗壬午皇后稱制權決軍國事八月辛卯康默記等攻下長嶺府甲午皇后奉梓宮西還壬寅堯骨討平諸州奔赴行在乙巳人皇王倍繼至九月壬戌南府宰相蘇薨丁卯梓宮至皇都權殯于子城西北己巳上諡昇天皇帝廟號太祖冬十月盧龍軍節度使盧國用叛奔于唐十一月丙寅殺南院夷離菫耶律迭里郎君耶律匹魯等二年八月丁酉葬太祖皇帝于祖陵置祖州天城軍節度使以奉陵寢統和二十六年七月進諡大聖大明天皇帝重熙二十一年九月加諡大聖大明神烈天皇帝太祖所崩行宮在扶餘城西南兩河之間後建昇天殿于此而以扶餘為黃龍府云贊曰遼之先出自炎帝世為審吉國其可知者蓋自奇首云奇首生都菴山徙潢河之濱傳至雅里始立制度置官屬刻木為契穴地為牢讓阻午而不肯自立雅里生毗牒毗牒生頦領頦領生耨里思大度寡欲令不嚴而人化是為肅祖肅祖生薩剌德嘗與黃室韋挑戰矢貫數札是為懿祖懿祖生勻德實始教民稼穡善畜牧國以殷富是為玄祖玄祖生撒剌的仁民愛物始置鐵冶教民鼓鑄是為德祖即太祖之父也世為契丹遙輦氏之夷離菫執其政柄德祖之弟述瀾北征于厥室韋南略易定奚霫始興板築置城邑教民種桑麻習織組己有廣土衆民之志而太祖受可汗之禪遂建國東征西討如折枯拉朽東自海西至于流沙北絕大漠信威萬里歷年二百豈一日之故哉周公誅管蔡人未有能非之者剌葛安端之亂太祖既貸其死而復用之非人君之度乎舊史扶餘之變亦異矣夫
