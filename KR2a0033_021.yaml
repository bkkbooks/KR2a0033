body:
  text: 遼史卷二十一本紀第二十一道宗一道宗孝文皇帝諱洪基字涅鄰小字查剌興宗皇帝長子母曰仁懿皇后蕭氏六歲封梁王重熙十一年進封燕國總領中丞司事明年總北南院樞密使事加尚書令進封燕趙國王二十一年為天下兵馬大元帥知惕隱事預朝政帝性沉靜嚴毅每朝興宗為之斂容二十四年秋八月己丑興宗崩即皇帝位於柩前哀慟不聽政辛卯百僚上表固請許之詔曰朕以菲德託居士民之上第恐智識有不及羣下有未信賦斂妄興賞罰不中上恩不能及下下情不能達上凡爾士庶直言無諱可則擇用否則不以為愆卿等其體朕意壬辰以皇太弟重元為皇太叔免漢拜不名癸巳遣使報哀于宋及夏高麗甲午遣重元安撫南京軍民戊戌以遺詔命西北路招討使西平郡王蕭阿剌為北府宰相仍權知南院樞密使事北府宰相蕭虛烈為武定軍節度使辛丑改元清寧大赦九月戊午詔常所幸圍場外毋禁庚申詔除護衛士餘不得佩刃入宮非勳戚後及夷離堇副使承應諸職事人不得冠巾壬戌詔夷離堇及副使之族並民如賤不得服駝尼水獺裘刀柄兔鶻鞍勒珮子不許用犀玉骨突犀惟大將軍不禁乙丑賜內外臣僚爵賞有差庚午尊皇太后為太皇太后辛未遣左夷離畢蕭謨魯翰林學士韓運以先帝遺物遺宋癸酉遣使以即位報宋丙子尊皇后為皇太后宴菆塗殿以上京留守宿國王陳留為南京留守壬午遣使賜高麗夏國先帝遺物冬十月丁亥有司請以帝生日為天安節從之以吳王仁先同知南京留守事陳王塗孛特為南府宰相進封吳王壬寅以順義軍節度使十神奴為南院大王十一月甲子葬興宗皇帝於慶陵宋及高麗遣使來會名其山曰永興丙寅以南院大王侯古為中京留守北府宰相西平郡王蕭阿剌進封韓王壬申次懷州有事於太宗穆宗廟甲戌謁祖陵戊寅冬至有事於太祖景宗興宗廟不受羣臣賀十二月丙戌詔左夷離畢曰朕以眇冲獲嗣大位夙夜憂懼恐弗克任欲聞直言以匡其失今已數月未見所以副朕委任股肱耳目之意其令內外百官比秩滿各言一事仍轉諭所部無貴賤老幼皆得直言無諱戊子應聖節上太皇太后壽宴羣臣命婦冊妃蕭氏為皇后進封皇弟越王和魯斡為魯國王許王阿璉為陳國王楚王涅魯古徙封吳王辛卯詔部署院事有機密即奏其投謗訕書輒受及讀者並棄市癸巳皇族十公悖母伏誅甲午以樞密副使姚景行為參知政事翰林學士吳湛為樞密副使參知政事同知樞密院事韓紹文為上京留守丙申宋遣歐陽修等來賀即位戊戌詔設學養士頒五經傳疏置博士助教各一員癸卯以知涿州楊績參知政事兼同知樞密院事庚戌以聖宗在時生辰赦上京囚是年御清涼殿放進士張孝傑等四十四人二年春正月丙辰詔州郡官及僚屬決囚如諸部族例己巳詔二女古部與世預宰相節度使之選者免皮室軍是月幸魚兒濼二月乙酉以左夷離畢蕭謨魯知西南面招討都監事乙巳以興宗在時生辰宴羣臣命各賦詩三月丁巳應聖節曲赦百里內囚己卯御製放鷹賦賜羣臣諭任臣之意閏月己亥始行東京所鑄錢乙巳南京獄空進留守以下官夏四月甲子詔曰方夏長養鳥獸孳育之時不得縱火於郊五月戊戌謁慶陵甲辰有事于興宗廟六月丁巳詔宰相舉才能之士戊午命有司籍軍補邊戍辛酉阻卜酋長來朝貢方物丁卯高麗遣使來貢辛未罷史官預聞朝議俾問宰相而後書乙亥中京蝗蝻為災丙子詔強盜得實者聽諸路決之丁丑南院樞密使趙國王查葛為上京留守同知南京留守事吳王仁先為南院樞密使乙酉遣使分道平賦稅繕戎器勸農桑禁盜賊八月辛未如秋山九月庚子幸中京祭聖宗興宗於會安殿冬十月丙子如中會川十一月戊戌知左夷離畢事耶律劃里為夷離畢北院大王耶律仙童知黃龍府事甲辰文武百僚上尊號曰天祐皇帝后曰懿德皇后大赦乙巳以皇太叔重元為天下兵馬大元帥徙封趙國王查葛為魏國王魯國王和魯斡為宋國王陳國王阿璉為秦國王吳王涅魯古進封楚國王百官進遷有差十二月戊申朔以韓王蕭阿剌為北院樞密使東京留守宿國王陳留北府宰相宋國王和魯斡上京留守秦國王阿璉知中丞司事甲寅上皇太后尊號曰慈懿仁和文惠孝敬廣愛宗天皇太后三年春正月庚辰如鴨子河丙戌置倒塌嶺節度使乙未五國部長來貢方物二月己未如大魚濼三月辛巳以楚國王涅魯古為武定軍節度使夏四月丙辰清暑永安山五月己亥如慶陵獻酎於金殿同天殿六月辛未以魏國王查葛為惕隱同知樞密院事蕭唐古南府宰相魏國王貼不東京留守秋七月甲申南京地震赦其境內乙酉如秋山八月辛亥帝以君臣同志華夷同風詩進皇太后九月庚子幸中會川冬十月己酉謁祖陵庚申謁讓國皇帝及世宗廟辛酉奠酎于玉殿十一月丙子以左夷離畢蕭謨魯為契丹行宮都部署庚子高麗遣使來貢十二月庚戌禁職官於部內假貸貿易戊辰太皇太后不豫曲赦行在五百里內囚己巳太皇太后崩四年春正月壬申朔遣使報哀于宋夏如鴨子河鈎魚癸酉宋遣使奉宋主繪像來丁亥知易州事耶律頗得秩滿部民乞留許之二月丙午詔夷離畢諸路鞫死罪獄雖具仍令別州縣覆按無寃然後決之稱寃者即具奏庚戌如魚兒濼三月戊寅募天德鎮武東勝等處勇捷者籍為軍甲午肆赦夏四月甲辰謁慶陵丁卯宋遣使弔祭五月庚午朔上大行太皇太后尊諡曰欽哀皇后癸酉葬慶陵夏國高麗遣使來會乙酉如永安山清暑六月乙丑以北院樞密使鄭王蕭革為南院樞密使徙封楚王南院樞密使吳王仁先為北院樞密使秋七月辛巳制諸掌內藏庫官盜兩貫以上者許奴婢告壬午獵于黑嶺冬十月戊戌朔以同知東京留守事侯古為南院大王保安軍節度使奚底為奚六部大王十一月癸酉行再生及柴冊禮宴羣臣於八方陂庚辰御清風殿受大冊禮大赦以吳王仁先為南京兵馬副元帥徙封隋王壬午謁太祖及諸帝宮丙戌祠木葉山禁造玉器十二月辛丑弛駝尼水獺裘之禁乙巳許士庶畜鷹辛亥南院樞密使楚王蕭革復為北院樞密使閏月己巳賜皇太叔重元金券是歲皇子濬生五年春如春州夏六月甲子朔駐蹕納葛濼己丑以南院樞密使蕭阿速為北府宰相樞密副使耶律乙辛南院樞密使惕隱查葛遼興軍節度使魯王謝家奴武定軍節度使東京留守吳王貼不西京留守秋七月丁酉以烏古敵烈詳穩蕭謨魯為左夷離畢冬十月壬子朔幸南京祭興宗於嘉寧殿十一月禁獵十二月壬戌以北院林牙奚馬六為右夷離畢參知政事吳湛以弟洵冒入仕籍削爵為民是年上御百福殿放進士梁援等百一十五人六年春如鴛鴦濼夏五月戊子朔監修國史耶律白請編次御製詩賦仍命白為序己酉駐蹕納葛濼六月戊午朔以東北路女直詳穩高家奴為惕隱壬戌遣使録囚丙寅中京置國子監命以時祭先聖先師癸未以隋王仁先為北院大王賜御製誥冬十月甲子駐蹕藕絲淀七年春三月庚戌如春州以耶律乙辛知北院樞密使事夏四月辛未禁吏民畜海東青鶻五月丙戌清暑永安山丙午謁慶陵辛亥殺東京留守陳王蕭阿剌六月壬子朔日有食之甲子以蕭謨魯為順義軍節度使丁卯幸弘義永興崇德三宮致祭射柳賜宴賞賚有差戊辰行再生禮復命羣臣分朋射柳丁丑以楚國王涅魯古知南院樞密使事秋九月丁丑駐蹕藕絲淀冬十二月壬午以知黃龍府事耶律阿里只為南院大王
