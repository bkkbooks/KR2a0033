body:
  text: 遼史卷八十四列傳第十四耶律沙耶律抹只蕭幹討古耶律善補耶律海里耶律沙字安隱其先嘗相遙輦氏應曆間纍官南府宰相景宗即位總領南面邊事保寧間宋攻河東沙將兵救之有功加守太保乾亨初宋復北侵沙將兵由間道至白馬嶺阻大澗遇敵沙與諸將欲待後軍至而戰冀王敵烈監軍耶林抹只等以為急擊之便沙不能奪敵烈等以先鋒渡澗未半為宋人所擊兵潰敵烈及其子蛙哥沙之子德里令穩都敏詳穩唐筈等五將俱沒會北院大王耶律斜軫兵至萬矢俱發敵軍始退沙將趨太原會漢駙馬都尉盧俊來奔言太原已陷遂勒兵還宋乘鋭侵燕沙與戰于高梁河稍却遇耶律休哥及斜軫等邀擊敗宋軍宋主宵遁至涿州微服乘驢車間道而走上以功釋前過是年復從韓匡嗣伐宋敗績帝欲誅之以皇后營救得免睿智皇后稱制召賜几杖以優其老復從伐宋敗劉廷讓李敬源之軍賜賚優渥統和六年卒耶律抹只字留隱仲父隋國王之後初以皇族入侍景宗即位為林牙以幹給稱保寧間遷樞密副使乾亨元年春宋攻河東南府宰相耶律沙為都統將兵往援抹只監其軍及白馬嶺之敗僅以身免宋乘鋭攻燕將奚兵翊休哥擊敗之上以功釋前過是年冬從都統韓匡嗣伐宋戰于滿城為宋將所紿諸軍奔潰獨抹只部伍不亂徐整旗鼓而歸璽書褒諭改南海軍節度使乾亨二年拜樞密副使統和初為東京留守宋將曹彬米信等侵邊抹只引兵至南京先繕守禦備及車駕臨幸抹只與耶律休哥逆戰于涿之東克之遷開遠軍節度使故事州民歲輸稅斗粟折錢五抹只表請折錢六部民便之統和末卒蕭幹小字項烈字婆典北府宰相敵魯之子性質直初察割之亂其黨胡古只與幹善使人召之幹曰吾豈能從逆臣縛其人送壽安王賊平上嘉其忠拜羣牧都林牙復以伐烏古功遷北府宰相改突呂不部節度使乾亨初宋伐河東乘勝侵燕詔幹拒之戰于高梁河耶律沙退走幹與耶律休哥等併力戰敗之上手敕慰勞自是每征伐必參決軍事加政事令二年宋兵圍瓦橋夜襲我營幹及耶律勻骨戰却之時皇后以父呼幹及后為皇太后稱制幹數條奏便宜多見聽用統和四年卒姪討古討古字括寧性忠簡應曆初始入侍會冀王敵烈宣徽使海思謀反討古與耶律阿列密告於上上嘉其忠詔尚朴謹公主保寧末為南京統軍使乾亨初宋侵燕討古與北院大王奚底拒之不克軍潰討古等不敢復戰退屯清河帝聞其敗遣使責之曰卿等不嚴偵候用兵無法遇敵即敗奚以將為討古懼頃之援兵至討古奮力以敗宋軍上釋其罪降為南京侍衛親軍都指揮使四年卒耶律善補字瑤升孟父楚國王之後純謹有才智景宗即位授千牛衛大將軍遷大同軍節度使及伐宋韓匡嗣與耶律沙將兵由東路進善補以南京統軍使由西路進善補聞匡嗣失利斂兵還乾亨末與宋軍戰于滿城為伐兵所圍斜軫救之獲免以失備大杖決之統和初為惕隱會宋來侵善補為都元帥逆之不敢戰故嶺西州郡多陷罷惕隱以其叔安端有匡輔世宗功上愍之徵善補為南府宰相遷南院大王會再舉伐宋欲攻魏府召衆集議將士以魏城無備皆言可攻善補曰攻固易然城大叵量若克其城士卒貪俘掠勢必不可遏且傍多巨鎮各出援兵內有重敵何以當之上乃止善補性懦守靜凡征討憚攻戰急還以故戰多不利年七十四卒耶律海里字留隱令穩拔里得之長子察割之亂其母的魯與焉遣人召海里海里拒之亂平的魯以子故獲免海里儉素不喜聲利以射獵自娛雖居間人敬之若貴官然保寧初拜彰國軍節度使遷惕隱秩滿稱疾不仕久之復為南院大王及曹彬米信等來侵海里有却敵功賜資忠保義匡國功臣帝屢親征海里在南院十餘年鎮以寬靜戶口增給時議重之封漆水郡王遷上京留守薨詔以家貧給葬具論曰當高梁朔州之捷偏裨之將如沙與抹只既因休哥斜軫類見其功所謂失之東隅收之桑榆若蕭幹海里拒察割之招討古告海思之變則不止有戰功而已其視善補畏懦豈不優哉
