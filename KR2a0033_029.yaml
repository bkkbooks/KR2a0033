body:
  text: 遼史卷二十九本紀第二十九天祚皇帝三保大元年春正月丁酉朔改元肆赦初金人興兵郡縣所失幾半上有四子長趙王母趙昭容次晉王母文妃次秦王許王皆元妃生國人知晉王之賢深所屬望元妃之兄樞密使蕭奉先恐秦王不得立潛圖之文妃姊妹三人長適耶律撻曷里次文妃次適余覩一日其姊若妹俱會軍前奉先諷人誣駙馬蕭昱及余覩等謀立晉王事覺昱撻曷里等伏誅文妃亦賜死獨晉王未忍加罪余覩在軍中聞之大懼即率千餘騎叛入金上遣知奚王府事蕭遐買北府宰相蕭德恭太常袞耶律諦里姑歸州觀察使蕭和尚奴四軍太師蕭幹將所部兵追之及諸閭山縣諸將議曰主上信蕭奉先言奉先視吾輩蔑如也余覩乃宗室豪俊不肯為奉先下若擒余覩他日吾黨皆余覩也不若縱之還即紿曰追襲不及奉先既見余覩之亡恐後日諸校亦叛遂勸驟加爵賞以結衆心以蕭遐買為奚王蕭德恭試中書門下平章事兼判上京留守事耶律諦里姑為龍虎衛上將軍蕭和尚奴金吾衛上將軍蕭幹鎮國大將軍二月幸鴛鴦濼夏五月至曷里狘秋七月獵炭山九月至南京冬十一月癸亥以西京留守趙王習泥烈為惕隱二年春正月乙亥金克中京進下澤州上出居庸關至鴛鴦濼聞余覩引金人婁室孛堇奄至蕭奉先曰余覩乃王子班之苗裔此來欲立甥晉王耳若為社稷計不惜一子明其罪誅之可不戰而余覩自回矣上遂賜晉王死素服三日耶律撒八等皆伏誅王素有人望諸軍聞其死無不流涕由是人心解體余覩引金人逼行宮上率衛兵五千餘騎幸雲中遺傳國璽于桑乾河二月庚寅朔日有食之既甲午知北院大王事耶律馬哥漢人行宮都部署蕭特末並為都統太和宮使耶律補得副之將兵屯鴛鴦濼己亥金師敗奚王霞末于北安州遂降其城三月辛酉上聞金師將出嶺西遂趨白水濼乙丑羣牧使謨魯斡降金丙寅上至女古底倉聞金兵將近計不知所出乘輕騎入夾山方悟奉先之不忠怒曰汝父子誤我至此今欲誅汝何益于事恐軍心忿怨爾曹避敵苟安禍必及我其勿從行奉先下馬哭拜而去行未數里左右執其父子縛送金兵金人斬其長子昂以奉先及其次子昱械送金主道遇遼軍奪以歸國遂並賜死逐樞密使蕭得里底召撻不也典禁衛丁卯以北院樞密副使蕭僧孝奴知北院樞密使事同知北院樞密使事蕭查剌為左夷離畢戊辰同知殿前點檢事耶律高八率衛士降金己巳偵人蕭和尚牌印郎君耶律哂斯為金師所獲癸酉以諸局百工多亡凡扈從不限吏民皆官之初詔留宰相張琳李處溫與秦晉國王淳守燕處溫聞上入夾山數日命令不通即與弟處能子奭外假怨軍內結都統蕭幹謀立淳遂與諸大臣耶律大石左企弓虞仲文曹勇義康公弼集蕃漢百官諸軍及父老數萬人詣淳府處溫邀張琳至白其事琳曰攝政則可處溫曰天意人心已定請立班耳處溫等請淳受禮淳方出李奭持赭袍被之令百官拜舞山呼淳驚駭再三辭不獲已而從之以處溫守太尉左企弓守司徒曹勇義知樞密院事虞仲文參知政事張琳守太師李處能直樞密院李奭為少府少監提舉翰林醫官李爽陳祕十餘人曾與大計並賜進士及第授官有差蕭幹為北樞密使駙馬都尉蕭旦知樞密院事改怨軍為常勝軍於是肆赦自稱天錫皇帝改元建福降封天祚為湘陰王遂據有燕雲平及上京遼西六路天祚所有沙漠已北西南西北路兩都招討府諸蕃部族而已夏四月辛卯西南面招討使耶律佛頂降金雲內寧邊東勝等州皆降阿疏為金兵所擒金已取西京沙漠以南部族皆降上遂遁於訛莎烈時北部謨葛失贐馬駝食羊五月甲戌都統馬哥收集散亡會于漚里謹丙子以馬哥知北院樞密使事兼都統六月淳寢疾聞上傳檄天德雲內朔武應蔚等州合諸蕃精兵五萬騎約以八月入燕並遣人問勞索衣裘茗藥淳甚驚命南北面大臣議而李處溫蕭幹等有迎秦拒湘之説集蕃漢百官議之從其議者東立惟南面行營都部署耶律寧西立處溫等問故寧曰天祚果能以諸蕃兵大舉奪燕則是天數未盡豈能拒之否則秦湘父子也拒則皆拒自古安有迎子而拒其父者處溫等相顧微笑以寧扇亂軍心欲殺之淳欹枕長歎曰彼忠臣也焉可殺天祚果來吾有死耳復何面目相見耶已而淳死衆乃議立其妻蕭氏為皇太后主軍國事奉遺命迎立天祚次子秦王定為帝太后遂稱制改元德興處溫父子懼禍南通童貫欲挾蕭太后納土于宋北通于金欲為內應外以援立大功自陳蕭太后罵曰誤秦晉國王者皆汝父子悉數其過數十賜死臠其子奭而磔之籍其家得錢七萬緡金玉寶器稱是為宰相數月之間所取也謨葛失以兵來援為金人敗于洪灰水擒其子陀古及其屬阿敵音夏國援兵至亦為金所敗秋七月丁巳朔敵烈部皮室叛烏古部節度使耶律棠古討平之加太子太保乙丑上京毛八十率二千戶降金辛未夏國遣曹價來問起居八月戊戌親遇金軍戰于石輦驛敗績都統蕭特末及其姪撒古被執辛丑會軍于歡撻新查剌金兵追之急棄輜重以遁九月敵烈部叛都統馬哥克之冬十月金兵攻蔚州降十一月乙丑聞金兵至奉聖州遂率衛兵屯于落昆髓秦晉王淳妻蕭德妃五表于金求立秦王不許以徑兵守居庸及金兵臨關崖石自崩戍卒多壓死不戰而潰德妃出古北口趨天德軍十二月知金主撫定南京上遂由掃里關出居四部族詳穩之家三年春正月丁巳奚王回離保僭號稱天復元年命都統馬哥討之甲子初張瑴為遼興軍節度副使民推瑴領州事秦晉王淳既死蕭德妃遣時立愛知平州瑴知遼必亡練兵畜馬籍丁壯為備立愛至瑴弗納金帥粘罕入燕首問平州事於故參知政事康公弼公弼曰瑴狂妄寡謀雖有鄉兵彼何能為示之不疑圖之未晚金人招時立愛赴軍前加瑴臨海軍節度使仍知平州既而又欲以精兵三千先下平州擒張瑴公弼曰若加兵是趣之叛也公弼請自往覘之瑴謂公弼曰遼之八路七路已降獨平州未解甲者防蕭幹耳厚賂公弼而還公弼復粘罕曰彼無足慮金人遂改平州為南京加瑴試中書門下平章事判留守事庚辰宜錦乾顯成川豪懿等州相繼皆降上京盧彥倫叛殺契丹人二月乙酉朔興中府降金來州歸德軍節度使田皓權隰州刺史杜師回權遷州刺史高永昌權潤州刺史張成皆籍所管戶降金丙戌誅蕭德妃降淳為庶人盡釋其黨癸巳興中宜州復城守三月駐蹕于雲內州南夏四月甲申朔以知北院樞密耶律大石戊戌金兵圍輜重于青冢硬寨太保特母哥竊梁王雅里以遁秦王許王諸妃公主從臣皆陷沒庚子梁宋大長公主特里亡歸壬寅金遣人來招癸卯答言請和丙午金兵送族屬輜重東行乃遣兵邀戰于白水濼趙王習泥烈蕭道寧皆被執上遣牌印郎君謀盧瓦送兔紐金印偽降遂西遁雲內駙馬都尉乳奴詣金降己酉金復以書來招答其書壬子金帥書來不許請和是月特母哥挈雅里至上怒不能盡救諸子詰之五月乙卯夏國王李乾順遣使請臨其國庚申軍將耶律敵烈等夜劫梁王雅里奔西北部立以為帝改元神曆辛酉渡河止于金肅軍北回離保為衆所殺六月遣使册李乾順為夏國皇帝秋九月耶律大石自金來歸冬十月復渡河東還居突呂不部梁王雅里歿耶律朮烈繼之十一月朮烈為衆所殺四年春正月上趨都統馬哥軍金人來攻棄營北遁馬哥被執謨葛失來迎贐馬駝羊又率部人防衛時侍從乏糧數日以衣易羊至烏古敵烈部以都點檢蕭乙薛知北院樞密使事封謨葛失為神于越王特母哥降金二月耶律遙設等十人謀叛伏誅夏五月金人既克燕驅燕之大家東徙以燕空城及涿易檀順景薊州與宋以塞盟左企弓康公弼曹勇義虞仲文皆東遷燕民流離道路不勝其苦入平州言於留守張瑴曰宰相左企弓不謀守燕使吾民流離無所安集公今臨巨鎮握強兵盡忠於遼必能使我復歸鄉土人心亦惟公是望瑴遂召諸將領議皆曰聞天祚兵勢復振出沒漠南公若仗義勤王奉迎天祚以圖中興先責左企弓等叛降之罪而誅之盡歸燕民使復其業而以平州歸宋則宋無不接納平州遂為藩鎮矣即後日金人加兵內用平山之軍外得宋為之援又何懼焉瑴曰此大事也不可草草翰林學士李石智而多謀可召與議石至其言與之合乃遣張謙率五百餘騎傳留守令召宰相左企弓曹勇義樞密使虞仲文參知政事康公弼至灤河西岸遣議事官趙祕校往數十罪曰天祚播遷夾山不即奉迎一也勸皇叔秦晉王僭號二也詆訐君父降封湘陰三也天祚遣知閣王有慶來議事而殺之四也檄書始至有迎秦拒湘之議五也不謀守燕而降六也不顧大義臣事于金七也根括燕財取悅于金八也使燕人遷徙失業九也教金人發兵先下平州十也爾有十罪所不容誅左企弓等無以對皆縊殺之仍稱保大三年畫天祚象朝夕謁事必告而後行稱遼官秩六月榜諭燕人復業恆産為常勝軍所占者悉還之燕民既得歸大悅翰林學士李石更名安弼偕故三司使高黨往燕山説宋王安中曰平州帶甲萬餘瑴有文武材可用為屏翰不然將為肘腋之患安中深然之令安弼與黨詣宋宋主詔帥臣王安中詹度厚加安撫與免三年常賦瑴聞之自謂得計秋七月金人屯來州闍母聞平州附宋以二千騎問罪先入營州瑴以精兵萬騎擊敗之宋建平州為泰寧軍以瑴為節度使以安弼黨為徽猷閣待制令宣撫司出銀絹數萬犒賞瑴喜遠迎金人諜知舉兵來襲瑴不得歸奔燕金人克三州始來索瑴王安中諱之索急斬一人貌類者去金人曰非瑴也以兵來取安中不得已殺瑴函其首送金天祚既得林牙耶律大石兵歸又得陰山室韋謨葛失兵自謂得天助再謀出兵復收燕雲大石林牙力諫曰自金人初陷長春遼陽則車駕不幸廣平淀而都中京及陷上京則都燕山及陷中京則幸雲中自雲中而播遷夾山向以全師不謀戰備使舉國漢地皆為金有國勢至此而方求戰非計也當養兵待時而動不可輕舉不從大石遂殺乙薛及坡里括置北南面官屬自立為王率所部西去上遂率諸軍出夾山下漁陽嶺取天德東勝寧邊雲內等州南下武州遇金人戰于奄遏下水復潰直趨山陰八月國舅詳穩蕭撻不也筆硯祗候察刺降金是月金主阿骨打死九月建州降金冬十月納突呂不部人訛哥之妻諳葛以訛哥為本部節度使昭古牙率衆降金金攻興中府降之十一月從行者舉兵亂北護衛太保朮者舍利詳穩牙不里等擊敗之十二月置二總管府
