body:
  text: 遼史卷三十三志第三營衞志下部族下遼起松漠經營撫納竟有唐晉帝王之器典章文物施及潢海之區作史者尚可以故俗語耶舊史有部族志歷代之所無也古者巡守于方岳五服之君各述其職遼之部族實似之故以部族置宮衞行營之後云遼內四部族遙輦九帳族橫帳三父房族國舅帳拔里乙室已族國舅別部太祖二十部二國舅升帳分止十八部五院部其先曰益古凡六營阻午可汗時與弟撒里本領之曰迭剌部傳至太祖以夷離菫即位天贊元年以強大難制析五石烈為五院六爪為六院各置夷離菫會同元年更夷離菫為大王部隸北府以鎮南境大王及都監春夏居五院部之側秋冬居羊門甸石烈四大蔑孤石烈小蔑孤石烈甌昆石烈太宗會同二年以烏古之地水草豐美命居之三年益以海勒水之地為農田乙習本石烈會同二年命以烏古之地六院部隸北府以鎮南境其大王及都監春夏居泰德泉之北秋冬居獨盧金石烈四轄懶石烈阿速石烈斡納撥石烈斡納阿剌石烈會同二年命居烏古三年益以海勒水地乙室部其先曰撒里本阻午可汗之世與其兄益古分營而領之曰乙室部會同二年更夷離菫為大王隸南府其大王及都監鎮駐西南之境司徒居鴛鴦泊閘撒狘居車軸山石烈二阿里答石烈欲主石烈品部其先曰拏女阻午可汗以其營為部太祖更諸部夷離菫為令穩統和中又改節度使隸北府屬西北路招討司司徒居太子墳凡戍軍隸節度使留後戶隸司徒石烈二北哲里只石烈南轄懶石烈楮特部其先曰洼阻午可汗以其營為部隸南府節度使屬西北路招討司司徒居柏坡山及山之側石烈二北石烈南石烈烏隗部其先曰撒里卜與其兄涅勒同營阻午可汗析為二撒里卜為烏隗部涅勒為涅剌部俱隸北府烏隗部節度使屬東北路招討司司徒居徐母山郝里河之側石烈二北石烈南石烈涅剌部其先曰涅勒阻午可汗分其營為部節度使屬西南路招討司居黑山北司徒居郝里河側石烈二北塌里石烈南察里石烈突呂不部其先曰塔古里領三營阻午可汗命分其一與弟航斡為突舉部塔古里得其二更為突呂不部隸北府節度使屬西北路招討司司徒居長春州西石烈二北托不石烈南須石烈突舉部其先曰航斡阻午可汗分營置部隸南府戍於隗烏古部司徒居冗泉側石烈二北石烈南石烈奚王府六部五帳分其先曰時瑟事東遙里十帳部主哲里後逐哲里自立為奚王卒弟吐勒斯立遙輦鮮質可汗討之俘其拒敵者七百戶摭其降者以時瑟鄰睦之故止俘部曲之半餘悉留焉奚勢由是衰矣初為五部曰遙里曰伯德曰奧里曰梅只曰楚里太祖盡降之號五部奚天贊二年有東扒里厮胡損者恃險堅壁於箭笴山以拒命揶揄曰大軍何能為我當飲墮瑰門下矣太祖滅之以奚府給役戶併括諸部隱丁收合流散置墮瑰部因墮瑰門之語為名遂號六部奚命勃魯恩主之仍號奚王太宗即位置宰相常袞各二員聖宗合奧里梅只墮瑰三部為一特置二剋部以足六部之數奚王和朔奴討兀惹敗績籍六部隸北府突呂不室韋部本名大小二黃室韋戶太祖為達馬狘沙里以計降之乃置為二部隸北府節度使屬東北路統軍司戍泰州東北涅剌拏古部與突呂不室韋部同節度使戍泰州東迭剌迭達部本鮮質可汗所俘奚七百戶太祖即位以為十四石烈置為部隸南府節度使屬西南路招討司戍黑山北部民居慶州南乙室奧隗部神冊六年太祖以所俘奚戶置隸南府節度使屬東北路兵馬司楮特奧隗部太祖以奚戶置隸南府節度使屬東京都部署司品達魯虢部太祖以所俘達魯虢部置隸南府節度使屬西南路招討司戍黑山北烏古涅剌部亦曰涅離部太祖取于骨里戶六千神冊六年析為烏古涅剌及圖魯二部俱隸北府節度使屬西南路招討司圖魯部節度使屬東北路統軍司已上太祖以遙輦氏舊部族分置者凡十部增置者八聖宗三十四部撒里葛部奚有三營曰撒里葛曰窈爪曰耨盌爪太祖伐奚乞降願為著帳子弟籍于宮分皆設夷離菫聖宗各置為部改設節度使皆隸南府以備畋獵之役居澤州東窈爪部與撒里葛部同居潭州南耨盌爪部節度使屬東京都部署司訛僕括部與撒里葛三部同居望雲縣東特里特勉部初於八部各析二十戶以戍奚偵候落馬河及速魯河側置二十詳穩聖宗以戶口蕃息置為部設節度使隸南府戍倒塌嶺居橐駝岡稍瓦部初取諸宮及橫帳大族奴隸置稍瓦石烈稍瓦鷹坊也居遼水東掌羅捕飛鳥聖宗以戶口蕃息置部節度使屬東京都部署司曷朮部初取諸宮及橫帳大族奴隸置曷朮石烈曷朮鐵也以冶于海濱柳濕河三黜古斯手山聖宗以戶口蕃息置部屬東京都部署司遙里部居潭利二州間石烈三撒里必石烈北石烈帖魯石烈伯德部松山平州之間太師太保居中京西石烈六啜勒石烈速古石烈腆你石烈迭里石烈旭特石烈悅里石烈楚里部居潭州北奧里部統和十二年以與梅只墮瑰三部民籍數寡合為一部幷上三部本屬奚王府聖宗分置南剋部北剋部統和十二年以奚府二剋分置二部隗衍突厥部聖宗析四闢沙四頗憊戶置以鎮東北女直之境開泰九年節度使奏請置石烈隸北府屬黃龍府都部署司奧衍突厥部與隗衍突厥同涅剌越兀部以涅剌室韋戶置隸北府節度使屬西南面招討司戍黑山北奧衍女直部聖宗以女直戶置隸北府節度使屬西北路招討司戍鎮州境自此至河西部皆俘獲諸國之民初隸諸宮戶口蕃息置部訖於五國皆有節度使乙典女直部聖宗以女直戶置隸南府居高州北斡突盌烏古部聖宗以烏古戶置隸南府節度使屬西南面招討司戍黑山北迭魯敵烈部聖宗以敵烈戶置隸北府節度使屬烏古敵烈統軍司室韋部聖宗以室韋戶置隸北府節度使屬西北路招討司朮哲達魯虢部聖宗以達魯虢戶置隸北府節度使屬東北路統軍司戍境內居境外梅古悉部聖宗以唐古戶置隸北府節度使屬西南面招討司頡的部聖宗以唐古戶置隸北府節度使屬西南面招討司北敵烈部聖宗以敵烈戶置戍隗烏古部匿訖唐古部聖宗置隸北府節度使屬西南面招討司北唐古部聖宗以唐古戶置隸北府節度使屬黃龍府都部署司戍府南南唐古部聖宗置隸北府鶴剌唐古部與南唐古同節度使屬西南面招討司河西部聖宗置隸北府節度使屬東北路統軍司薛特部開泰四年以回鶻戶置隸北府居慈仁縣北伯斯鼻骨德部本鼻骨德戶初隸諸宮聖宗以戶口蕃息置部隸北府節度使屬東北路統軍司戍境內居境外達馬鼻骨德部聖宗以鼻骨德戶置隸南府節度使屬東北路統軍司五國部剖阿里國盆奴里國奧里米國越里篤國越里吉國聖宗時來附命居本土以鎮東北境屬黃龍府都部署司重熙六年以越里吉國人尚海等訴酋帥渾敝貪污罷五國酋帥設節度使以領之已上聖宗以舊部族置者十六增置十八遼國外十部烏古部敵烈八部隗古部回跋部嵓母部吾禿婉部迭剌葛部回鶻部長白山部蒲盧毛𩽆部右十部不能成國附庸於遼時叛時服各有職貢猶唐人之有覊縻州也
