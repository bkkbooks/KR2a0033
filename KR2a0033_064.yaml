body:
  text: 遼史卷六十四表第二皇子表帝官天下王者家焉至于親九族敬五宗其揆一也三代以上封建久長故吳魯燕蔡衛晉鄭太史遷既著世家又列年表不厭其詳自漢以降封建實亡猶有其名長世者登世家自絶者置列傳然王子侯猶可以年表也班固以為文無實併諸侯削年而表世君子韙之自魏以降不帝不世王侯身徙數封朝不謀夕於是列而傳之功不足以垂法罪不足以著戒碌碌然抑又甚焉今摘其功罪傑然者列諸傳親親之恩敬長之義而無他可書者略表見之為皇子表
