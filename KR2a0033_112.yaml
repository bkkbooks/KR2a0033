body:
  text: 遼史卷百十二列傳第四十二逆臣上耶律轄底迭里特耶律察割耶律婁國耶律重元涅魯古耶律滑哥易曰天尊地卑乾坤定矣卑高以陳貴賤位矣貴賤位而後君臣之分定君臣之分定而後天地和天地和而後萬化成五帝三王之治用此道也三代而降臣弒其君者有之子弒其父者有之孔子作春秋以寓王法誅死者於前懼生者於後其慮深遠矣歐陽修作唐書創逆臣傳蓋亦春秋之意也遼叛逆之臣二十有二迹其事則又有甚焉者然豈一朝一夕之故哉列于傳所以公天下之貶以示夫戒云轄底字涅烈袞肅祖孫夷離堇怗剌之子幼黠而辨時險佞者多附之遙輦痕德堇可汗時異母兄罨古只為迭剌部夷離堇故事為夷離堇者得行再生禮罨古只方就帳易服轄底遂取紅袍貂蟬冠乘白馬而出乃令黨人大呼曰夷離堇出矣衆皆羅拜因行柴册禮自立為夷離堇與于越耶律釋魯同知國政及釋魯遇害轄底懼人圖己挈其二子迭里特朔刮奔渤海偽為失明後因毬馬之會與二子奪良馬奔歸國益為姦惡常以巧辭獲免太祖將即位讓轄底轄底曰皇帝聖人由天所命臣豈敢當太祖命為于越及自將伐西南諸部轄底誘剌葛等亂不從者殺之車駕還至赤水城轄底懼與剌葛俱北走至榆河為追兵所獲太祖問曰朕初即位嘗以國讓叔父辭之今反欲立吾弟何也轄底對曰始臣不知天子之貴及陛下即位衛從甚嚴與凡庶不同臣嘗奏事心動始有窺覦之意度陛下英武必不可取諸弟懦弱得則易圖也事若成豈容諸弟乎太祖謂諸弟曰汝輩乃從斯人之言耶迭剌曰謀大事者須用如此人事成亦必去之轄底不復對囚數月縊殺之將刑太祖謂曰叔父罪當死朕不敢赦事有便國者宜悉言之轄底曰迭剌部人衆勢強故多為亂宜分為二以弱其勢子迭里特迭里特字海鄰有膂力善馳射馬躓不仆尤神于醫視人疾若隔紗覩物莫不悉見太祖在潛已加眷遇及即位拜迭剌部夷離堇太祖嘗思鹿醢解酲以山林所有問能取者迭里特曰臣能得之乘內馬逐鹿射其一欲復射馬跌而斃迭里特躍而前弓猶不弛復獲其一帝歡甚曰吾弟萬人敵會帝患心痛召迭里特視之迭里特曰膏肓有瘀血如彈丸然藥不能及必針而後愈帝從之嘔出瘀血痛止帝以其親每加賜賚然知其為人未嘗任以職後從剌葛亂與其父轄底俱縊殺之察割字歐辛明王安端之子善騎射貌恭而心狡人以為懦太祖曰此凶頑非懦也其父安端嘗使奏事太祖謂近侍曰此子目若風駝面有反相朕若獨居無令入門世宗即位于鎮陽安端聞之欲持兩端察割曰太弟忌刻若果立豈容我輩永康王寬厚且與劉哥相善宜往與計安端即與劉哥謀歸世宗及和議成以功封泰寧王會安端為西南面大詳穩察割佯為父惡陰遣人白於帝即召之既至上前泣訴不勝哀帝憫之使領女石烈軍出入禁中數被恩遇帝每出獵察割託手疾不操弓矢但執鍊鎚馳走屢以家之細事聞於上上以為誠察割以諸族屬雜處不克以逞漸徙廬帳迫於行宮右皮室詳穩耶律屋質察其姦邪表列其狀帝不信以表示察割察割稱屋質疾己哽咽流涕帝曰朕固知無此何至泣耶察割時出怨言屋質曰汝雖無是心因我過疑汝勿為非義可也他日屋質又請於帝帝曰察割捨父事我可保無他屋質曰察割於父既不孝於君安能忠帝不納天祿五年七月帝幸太液谷留飲三日察割謀亂不果帝伐周至詳古山太后與帝祭文獻皇帝于行宮羣臣皆醉察割歸見壽安王邀與語王弗從察割以謀告耶律盆都盆都從之是夕同率兵入弒太后及帝因僭位號百官不從者執其家屬至夜閲內府物見碼瑙碗曰此希世寶今為我有詫于其妻妻曰壽安王屋質在吾屬無噍類此物何益察割曰壽安年幼屋質不過引數奴詰旦來朝固不足憂其黨矧斯報壽安屋質以兵圍于外察割尋遣人弒皇后於柩前倉惶出陳壽安遣人諭曰汝等既行弒逆復將若何有夷離堇劃者委兵歸壽安王餘衆望之徐徐而往察割知其不濟乃繫羣官家屬執弓矢脅曰無過殺此曹爾叱令速出時林牙耶律敵獵亦在繫中進曰不有所廢壽安王何以興籍此為辭猶可以免察割曰誠如公言誰當使者敵獵請與罨撒葛同往説之察割從其計壽安王復令敵獵誘察割臠殺之諸子皆伏誅婁國字勉辛文獻皇帝之子天祿五年遙授武定軍節度使及察割作亂穆宗與屋質從林牙敵獵計誘而出之婁國手刃察割改南京留守穆宗湎不恤政事婁國有覬覦之心誘敵獵及羣不逞謀逆事覺按問不服帝曰朕為壽安王時卿數以此事説我今日豈有虛乎婁國不能對及餘黨盡服遂縊於可汗州西谷詔有司擇絶後之地以葬重元小字孛吉只聖宗次子材勇絶人眉目秀朗寡言笑人望而畏太平三年封秦國王聖宗崩欽哀皇后稱制密謀立重元重元以所謀白於上上益重之封為皇太弟歷北院樞密使南京留守知元帥府事重元處戎職未嘗離輦下先是契丹人犯法例須漢人禁勘受枉者多重元奏請五京各置契丹警巡使詔從之賜以金券誓書道宗即位册為皇太叔免拜不名為天下兵馬大元帥復賜金券四頂帽二色袍尊寵所未有清寧九年車駕獵灤水以其子涅魯古素謀與同黨陳國王陳六知北院樞密事蕭胡覩等凡四百餘人誘脅弩手軍陳于帷宮外將戰其黨多悔過效順各自奔潰重元既知失計北走大漠歎曰涅魯古使我至此遂自殺先是重元將舉兵帳前雨赤如血識者謂敗亡之兆子涅魯古涅魯古小字耶魯綰性陰狠興宗一見謂曰此子目有反相重熙十一年封安定郡王十七年進王楚為惕隱清寧三年出為武定軍節度使七年知南院樞密使事説其父重元詐病俟車駕臨問因行弒逆九年秋獵帝用耶律良之計遣人急召涅魯古涅魯古以事泄遽擁兵犯行宮南院樞密使許王仁先等率宿衛士討之涅魯古躍馬突出為近侍詳穩渤海阿厮護衛蘇射殺之滑哥字斯懶隋國王釋魯之子性陰險初蒸其父妾懼事彰與剋蕭臺哂等共害其父歸咎臺哂滑哥獲免太祖即位務廣恩施雖知滑哥凶逆姑示含忍授以惕隱六年滑哥預諸弟之亂事平羣臣議其罪皆謂滑哥不可釋於是與其子痕只俱陵遲而死敕軍士恣取其産帝曰滑哥不畏上天反君弒父其惡不可言諸弟作亂皆此人教之也
