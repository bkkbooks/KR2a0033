body:
  text: 遼史卷五十一志第二十禮志三軍儀皇帝親征儀常以秋冬應敵制變或無時將出師必先告廟乃立三神主祭之曰先帝曰道路曰軍旅刑青牛白馬以祭天地其祭常依獨樹無獨樹即所舍而行之或皇帝服介冑祭諸先帝宮廟乃閱兵將行牝牡麃各一為祭將臨敵結馬尾祈拜天地而後入下城克敵祭天地牲以白黑羊班師以所獲牡馬牛各一祭天地出師以死囚還師以一諜者植柱縛其上于所向之方亂射之矢集如蝟謂之射鬼箭臘儀臘十二月辰日前期一日詔司獵官選獵地其日皇帝皇后焚香拜日畢設圍命獵夫張左右翼司獵官奏成列皇帝皇后升轝敵烈麻都以酒二尊盤𧹞奉進北南院大王以下進馬及衣皇帝降輿祭東畢乘馬入圍中皇太子親王率羣官進酒分兩翼而行皇帝始獲兔羣臣進酒上壽各賜以酒至中食之次親王大臣各進所獲及酒訖賜羣臣飲還宮應曆元年冬漢遣使來賀自是遂以為常儀統和中罷之出軍儀制見兵志禮志四賓儀常朝起居儀昧爽臣僚朝服入朝各依幕次內侍奏班齊先引京官班於三門外當直舍人放起居再拜各祗候次依兩府以下文武官於丹墀內面殿立竪班諸司并供奉官於東西道外相向立定當直閤使副贊放起居再拜各祗候退還幕次公服帝昇殿坐兩府并京官丹墀內聲喏各祗候教坊司同北班起居畢奏事燕京嘉寧殿西京同文殿朝服幞頭袍笏公服紫衫帽正座儀皇帝升殿坐警聲絕契丹漢人殿前班畢各依位侍立次教坊班畢捲退京官班入拜畢揖於右橫街西依位班立次武班入拜畢依位立文班入拜畢依位立北班入起居畢於左橫街東序班立次兩府班入鞠躬通宰臣某官已下起居拜畢引上殿奏事已上六班起居並七拜內有不帶節度使班首止通名亦七拜捲班與常朝同直院有旨入文班留守司三司統軍司制置司謂之京官都部署司宮使副宮使都承以下令史北面主事以下隨駕諸司為武官舘閣大理寺堂後以下御史臺隨駕閑員令史司天臺翰林醫官院為文官天慶二年冬教坊並服袍臣僚接見儀皇帝御座奏見牓子畢臣僚左入鞠躬通文武百僚宰臣某官以下祗候見引面殿鞠躬起居凡七拜引班首出班謝面天顏復位舞蹈五拜鞠躬宣答問制再拜宣訖謝宣諭五拜各祗候畢可矮墩以上引近前問聖躬萬福傳宣問跋涉不易鞠躬引班舍人贊各祗候畢引右上准備宣問其餘臣僚並於右侍立宣答云卿等久居鄉邑來奉乘輿時屬霜寒或云炎蒸諒多勞止卿各平安好想宜知悉問聖體儀皇帝行幸車駕至捺鉢坐御帳臣僚公服問聖躬萬福贊再拜各祗候奉事宣徽以下常服教坊與臣僚同保大元年夏特旨通名再拜不稱宰臣車駕還京儀前期一日宣徽以下橫班諸司閤門並公服於宿帳祗候至日詰旦皇帝乘玉輅閤門宣諭軍民訖導駕時相以下進至內門閤副勘箭畢通事舍人鞠躬奏臣宣放仗禮畢勘箭儀皇帝乘玉輅至內門北南臣僚於輅前對班立勘箭官執雌箭門中立東上閤門使詣車前執雄箭在車左立勾勘箭官進勘箭官揖進至車約五步面車立閤使言受箭行勘勘箭官拜跪受箭舉手勘訖鞠躬奏內外勘同閤使言准敕行勘勘箭官平立退至門中舊位立當胸執箭贊軍將門仗官近前門仗官應聲開門舉聲兩邊齊出並列左右立勘箭官舉右手贊呈箭次贊內出喚仗御箭一隻准敕付左金仗行勘贊合不合應合合合贊同不同應同同同訖勘箭官再進依位立鞠躬自通全銜臣某對御勘箭同退門中立贊其箭謹付閤門使進入事畢其箭授閤使轉付宣徽宋使見皇太后儀宋使賀生辰正旦至日臣僚昧爽入朝使者至幕次臣僚班齊皇太后御殿坐宣徽使押殿前班起居畢捲班次契丹臣僚班起居畢引應坐臣僚上殿就位立其餘臣僚不應坐者退於東面侍立漢人臣僚東洞門入面西鞠躬舍人鞠躬通某以下起居凡七拜畢贊各祗候引應坐臣僚上殿就位立中書令大王西階上殿奏宋使并從人牓子訖就位立其餘臣僚不應坐者退於西面侍立次引宋使副六人於東洞門入丹墀內面殿齊立閤使自東階下受書匣使人捧書匣者皆跪閤使搢笏立受書匣自東階上殿欄內鞠躬奏封全訖授樞密開封宰臣對皇太后讀訖引使副六人東階上殿欄內立使者揖生辰節大使少前使者俛伏跪附起居訖起復位立次引賀皇太后正旦大使附起居如前儀皇太后宣問南朝皇帝聖躬萬福舍人揖生辰大使并皇太后正旦大使少前皆跪唯生辰大使奏來時聖躬萬福皆俛伏興引東階下殿丹墀內面殿齊立引進使引禮物於西洞門入殿前置擔牀控鶴官起居四拜擔牀於東便門出畢揖使副退於東方西面皆鞠躬舍人鞠躬通南朝國信使某官某以下祗候見舞蹈五拜畢不出班奏聖躬萬福再拜揖班首出班謝面天顏訖復位舞蹈五拜畢贊各上殿祗候引各使副西階上殿就位勾從人兩洞門入面殿鞠躬通名贊拜起居四拜畢贊各祗候分班引兩洞門出若宣問使副跋涉不易引西階下殿丹墀內舞蹈五拜畢贊各上殿祗候引西階上殿就位立契丹舍人漢人閤使齊贊拜應坐臣僚并使副皆拜稱萬歲贊各就坐行湯行茶供過人出殿門揖臣僚并使副起鞠躬契丹舍人漢人閤使齊贊皆拜稱萬歲贊各祗候先引宋使副西階下殿西洞門出次揖臣僚出畢報閤門無事皇太后起宋使見皇帝儀宋使賀生辰正旦至日臣僚昧爽入朝使者至幕次奏班齊聲警皇帝升殿坐宣徽使押殿前班起居畢捲班出契丹臣僚班起居畢引應坐臣僚上殿就位立其餘臣僚不應坐者並退於北面侍立次引漢人臣僚北洞門入面殿鞠躬舍人鞠躬通某官某以下起居皆七拜畢引應坐臣僚上殿就位立引首相南階上殿奏宋使并從人牓子就位立臣僚並退於南面侍立教坊入起居畢引南使副北洞門入丹墀內面殿立閤使北階下殿受書匣使人捧書匣者跪閤使搢笏立受於北階上殿欄內鞠躬奏封全訖授樞密開封宰相對皇帝讀訖舍人引使副北階上殿欄內立揖生辰大使少前俛伏跪附起居俛伏興復位立大使俛伏跪奏訖俛伏興退引北階下殿揖使副北方南面鞠躬舍人鞠躬通南朝國信使某官某以下祗候見起居七拜畢揖班首出班謝面天顏舞蹈五拜畢出班謝遠接御筵撫問湯藥舞蹈五拜畢贊各祗候引出歸幕次閤使傳宣賜對衣金帶勾從人以下入見舍人贊班首姓名以下再拜不出班奏聖躬萬福贊再拜稱萬歲贊各祗候引出舍人傳宣賜衣使副并從人服賜衣畢舍人引使副入丹墀內面殿鞠躬舍人贊謝恩拜舞蹈五拜畢贊上殿祗候引使副南階上殿就位立勾從人入贊謝恩拜稱萬歲贊有敕賜宴再拜稱萬歲贊各祗候承受官引北廊下立御牀入大臣進酒皇帝飲酒契丹舍人漢人閤使齊贊拜應坐并侍立臣僚皆拜稱萬歲贊各祗候卒飲贊拜應坐臣僚皆拜稱萬歲贊各就坐行酒親王使相使副共樂曲若宣令飲盡並起立飲訖放琖就位謝贊拜並隨拜稱萬歲贊各就坐次行方茵地坐臣僚等官酒若宣令飲盡贊謝如初殿上酒一行畢贊廊下從人拜稱萬歲贊各就坐若傳宣令飲盡並拜稱萬歲贊各就坐殿上酒三行行茶行殽行饍酒五行候曲終揖廊下從人起贊拜稱萬歲贊各祗候引出曲破臣僚并使副並起鞠躬贊拜應坐臣僚并使副皆拜稱萬歲贊各祗候引使副南階下殿丹墀內舞蹈五拜畢贊各祗候引出次引衆臣僚下殿出畢報閤門無事皇帝起聲蹕曲宴宋使儀昧爽臣僚入朝宋使至幕次皇帝升殿殿前教坊契丹文武班皆如初見之儀宋使副綴翰林學士班東洞門入面西鞠躬舍人鞠躬通文武百僚臣某以下起居七拜謝宣召赴宴致詞訖舞蹈五拜畢贊各上殿祗候舍人引大臣使相臣僚使副及方茵𩽆殿應坐臣僚並於西階上殿就位立其餘不應坐臣僚並於西洞門出勾從人入起居謝賜宴兩廊立如初見之儀二人監琖教坊再拜贊各上殿祗候入御牀大臣進酒舍人閤使贊拜行酒皆如初見之儀次行方茵𩽆殿臣僚酒傳宣飲盡如常儀殿上酒一行畢兩廊從人行酒如初殿上行餅茶畢教坊致語揖臣僚使副并廊下從人皆起立候口號絕揖臣僚等皆鞠躬贊拜殿上應坐并侍立臣僚皆拜稱萬歲贊各就坐次贊廊下從人拜亦如之歇宴揖臣僚起立御牀出皇帝起入閤引臣僚東西階下殿還幕次內賜花承受官引從人出賜花亦如之簪花畢引從人復兩廊位立次引臣僚使副兩洞門入復殿上位立皇帝出閤復坐御牀入揖應坐臣僚使副及侍立臣僚鞠躬贊拜稱萬歲贊各就坐贊兩廊從人亦如之行單茶行酒行膳行果殿上酒九行使相樂曲聲絕揖兩廊從人起贊拜稱萬歲贊各好去承受引出曲破殿上臣僚使副皆起立贊拜稱萬歲贊各祗候引臣僚使副東西階下殿契丹班謝宴出漢人并使副班謝宴舞蹈五拜畢贊各好去引出畢報閤門無事皇帝起賀生辰正旦宋使朝辭太后儀臣僚使副班齊如曲宴儀皇太后升殿坐殿前契丹文武起居上殿畢宰臣奏宋使副從人朝辭牓子畢就位立舍人引使副北洞門入面南鞠躬舍人鞠躬通南朝國信使某官某以下祗候辭再拜不出班奏聖躬萬福再拜出班戀闕致詞訖又再拜贊各上殿祗候舍人引南階上殿就位立引從人贊姓名再拜奏聖躬萬福再拜稱萬歲贊各好去引出殿上揖應坐臣僚并使副就位鞠躬贊拜稱萬歲贊各就坐行湯行茶畢揖臣僚并南使起立與應坐臣僚鞠躬贊拜稱萬歲贊各祗候立引使副六人於欄內拜跪受書匣畢直起立揖少前鞠躬受傳答語訖退於北階下殿丹墀內面殿鞠躬舍人贊各好去引出臣僚出賀生辰正旦宋使朝辭皇帝儀臣僚入朝如常儀宋使至幕次於外賜從人衣物皇帝升殿宣徽契丹文武班起居上殿如曲宴儀中書令奏宋使副并從人朝辭牓子畢臣僚並於南面侍立教坊起居畢舍人引使副六人北洞門入丹墀北方面南鞠躬舍人鞠躬通南朝國信使某官某以下祗候辭再拜起居戀闕如辭皇太后儀贊各祗候平身立揖使副鞠躬宣徽贊有敕使副再拜鞠躬平身立宣徽使贊各賜卿對衣金帶疋段弓箭鞍馬等想宜知悉使副平身立揖大使三人少前俛伏跪搢笏閤門使授別錄賜物過畢俛起復位立揖副使三人受賜亦如之贊謝恩舞蹈五拜贊上殿祗候舍人引使副南階上殿就位立引從人贊謝恩再拜居再拜贊賜宴再拜皆稱萬歲贊各祗候承受引兩廊立御牀入皇帝飲酒舍人閤使贊臣僚使副拜稱萬歲皆如曲宴應坐臣僚拜稱萬歲就坐行酒樂曲方茵兩廊皆如之行殽行茶行饍亦如之行饅頭畢從人起如登位使之儀曲破臣僚使副皆起立拜稱萬歲如辭太后之儀使副下殿舞蹈五拜贊各上殿祗候引北階上殿欄內立揖生辰正旦大使二人少前齊跪受書畢起立揖磬折受起居畢退引北階下殿丹墀內並鞠躬舍人贊各好去引南洞門出次引殿上臣僚南北洞門出畢報閤門無事高麗使入見儀臣僚常服起居應上殿臣僚殿上序立閤門奏牓子引高麗使副面殿立引上露臺拜跪附奏起居訖拜起立閤門傳宣王詢安否使副皆跪大使奏臣等來時詢安引下殿面殿立進奉物入列置殿前控鶴官起居畢引進使鞠躬通高麗國王詢進奉宣徽使殿上贊進奉赴庫馬出擔牀出畢引使副退面西鞠躬舍人鞠躬通高麗國謝恩進奉使某官某以下祗候見舞蹈五拜不出班奏聖躬萬福再拜出班謝面天顏五拜出班謝遠接湯藥五拜贊各祗候使副私獻入列置殿前控鶴官起居引進使鞠躬通高麗國謝恩進奉某官某以下進奉宣徽使殿上贊如初引使副西階上殿序立皇帝不入御牀臣僚伴酒契丹舍人通漢人閤使贊再拜稱萬歲各就坐酒三行肴膳二味若宣令飲盡就位拜稱萬歲贊各就坐肴膳不贊起再拜稱萬歲引下殿舞蹈五拜贊各祗候引出於幕次內別差使臣伴宴起宣賜衣物訖遙謝五拜畢歸舘曲宴高麗使儀臣僚入朝班齊皇帝升殿宣徽教坊控鶴文武班起居皆如常儀謝宣宴如宋使儀贊各上殿祗候契丹臣僚謝宣宴勾高麗使入面南鞠躬舍人鞠躬通高麗國謝恩進奉使某官某以下起居謝宣宴共十二拜贊各上殿祗候臣僚使副就位立大臣進酒契丹舍人通漢人閤使贊上殿臣僚皆拜贊各祗候進酒大臣復位立贊進坐臣僚拜贊各就坐行酒若宣令飲盡贊再拜贊各就坐教坊致語臣僚皆起立口號絕贊再拜贊各就坐凡拜皆稱萬歲曲破臣僚起下殿契丹臣僚謝宴中書令以下謝宴畢引使副謝七拜贊各好去控鶴官門外祗候報閤門無事供奉官捲班出來日問聖體高麗使朝辭儀臣僚起居上殿如常儀閤門奏高麗使朝辭牓子起居戀闕如宋使之儀贊各上殿祗候引西階上殿立契丹舍人贊拜稱萬歲贊各就坐中書令以下伴酒三行肴饍二味皆如初見之儀既謝贊有敕宴五拜贊各好去引出於幕次內別差使臣伴宴畢賜衣物跪受遙謝五拜歸舘西夏國進奉使朝見儀臣僚常朝畢引使者左入至丹墀面殿立引使者上露臺立揖少前拜跪附奏起居訖俛興復位閤使宣問某安否鞠躬聽旨跪奏某安俛伏興退復位引左下至丹墀面殿立禮物右入左出畢閤使鞠躬通某國進奉使姓名候見共一十七拜贊祗候平立有私獻過畢揖使者鞠躬贊進奉收訖贊祗候引左上殿就位立臣僚使者齊聲喏酒三行引使左下至丹墀謝宴五拜畢贊有敕宴五拜祗候引右出禮畢於外賜宴客省伴宴仍賜衣物西夏使朝辭儀常朝畢引使者左入通某國某使祗候辭再拜不出班起居再拜出班戀闕致詞復再拜賜衣物謝恩如常儀若賜宴五拜畢贊好去引右出
