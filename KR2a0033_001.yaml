body:
  text: 遼史卷一本紀第一太祖上太祖大聖大明神烈天皇帝姓耶律氏諱億字阿保機小字啜里只契丹迭剌部霞瀨益石烈鄉耶律彌里人德祖皇帝長子母曰宣簡皇后蕭氏唐咸通十三年生初母夢日墮懷中有娠及生室有神光異香體如三歲兒即能匍匐祖母簡獻皇后異之鞠為己子常匿於別幕塗其面不令他人見三月能行晬而能言知未然事自謂左右若有神人翼衞雖齠齔言必及世務時伯父當國疑輒咨焉既長身長九尺豐上銳下目光射人關弓三百斤為撻馬狘沙里時小黃室韋不附太祖以計降之伐越兀及烏古六奚比沙狘諸部克之國人號阿主沙里唐天復元年歲辛酉痕德菫可汗立以太祖為本部夷離菫專征討連破室韋于厥及奚帥轄剌哥俘獲甚衆冬十月授大迭烈府夷離菫明年秋七月以兵四十萬伐河東代北攻下九郡獲生口九萬五千駝馬牛羊不可勝紀九月城龍化州于潢河之南始建開教寺明年春伐女直下之獲其戶三百九月復攻下河東懷遠等軍冬十月引軍略至薊北俘獲以還先是德祖俘奚七千戶徙饒樂之清河至是創為奚迭剌部分十三縣遂拜太祖于越總知軍國事明年歲甲子三月廣龍化州之東城九月討黑車子室韋唐盧龍軍節度使劉仁恭發兵數萬遣養子趙霸來拒霸至武州太祖諜知之伏勁兵桃山下遣室韋人牟里詐稱其酋長所遣約霸兵會平原既至四面伏發擒霸殲其衆乘勝大破室韋明年七月復討黑車子室韋唐河東節度使李克用遣通事康令德乞盟冬十月太祖以騎兵七萬會克用于雲州宴酣克用借兵以報劉仁恭木瓜澗之役太祖許之易袍馬約為兄弟及進兵擊仁恭拔數州盡徙其民以歸明年二月復擊劉仁恭還襲山北奚破之汴州朱全忠遣人浮海奉書幣衣帶珍玩來聘十一月遣偏師討奚霫諸部及東北女直之未附者悉破降之十二月痕德菫可汗殂羣臣奉遺命請立太祖曷魯等勸進太祖三讓從之元年春正月庚寅命有司設壇于如迂王集會堝燔柴告天即皇帝位尊母蕭氏為皇太后立皇后蕭氏北宰相蕭轄剌南宰相耶律歐里思率羣臣上尊號曰天皇帝后曰地皇后庚子詔皇族承遙輦氏九帳為第十帳二月戊午以從弟迭栗底為迭烈府夷離菫是月征黑車子室韋降其八部夏四月丁未朔唐梁王朱全忠廢其主尋弒之自立為帝國號梁遣使來告劉仁恭子守光囚其父自稱幽州盧龍軍節度使秋七月乙酉其兄平州刺史守奇率其衆數千人來降命置之平盧城冬十月乙巳討黑車子室韋破之二年春正月癸酉朔御正殿受百官及諸國使朝辛巳始置惕隱典族屬以皇弟撒剌為之河東李克用卒子存勗襲遣使弔慰夏五月癸酉詔撒剌討烏丸黑車子室韋秋八月壬子幽州進合歡瓜冬十月己亥朔建明王樓築長城於鎮東海口遣輕兵取吐渾叛入室韋者三年春正月幸遼東二月丁酉朔梁遣郎公遠來聘三月滄州節度使劉守文為弟守光所攻遣人來乞兵討之命皇弟舍利素夷離菫蕭敵魯以兵會守文於北淖口進至橫海軍近淀一鼓破之守光潰去因名北淖口為會盟口夏四月乙卯詔左僕射韓知古建碑龍化州大廣寺以紀功德五月甲申置羊城于炭山之北以通市易冬十月己巳遣鷹軍討黑車子室韋破之西北嗢娘改部族進輓車人四年秋七月戊子朔以后兄蕭敵魯為北府宰相后族為相自此始冬十月烏馬山奚庫支及查剌底鋤勃德等叛討平之五年春正月丙戌朔日有食之丙申上親征西部奚奚阻險叛服不常數招諭弗聽是役所向輒下遂分兵討東部奚亦平之於是盡有奚霫之地東際海南暨白檀西踰松漠北抵潢水凡五部咸入版籍三月次灤河刻石紀功復略地薊州夏四月壬申遣人使梁五月皇弟剌葛迭剌寅底石安端謀反安端妻粘睦姑知之以告得實上不忍加誅乃與諸弟登山刑牲告天地為誓而赦其罪出剌葛為迭剌部夷離菫封粘睦姑為晉國夫人秋七月壬午朔斜離底及諸蕃使來貢八月甲子劉守光僭號幽州稱燕冬十月戊午置鐵冶十一月壬午遣人使梁六年春正月以化葛為惕隱二月戊午親征劉守光三月至自幽州夏四月梁郢王友珪弒父自立秋七月丙午親征朮不姑降之俘獲以數萬計命弟剌葛分兵攻平州八月壬辰上次恩德山皇子李胡生冬十月戊寅剌葛破平州還復與迭剌寅底石安端等反甲申遣人使梁致祭壬辰還次北阿魯山聞諸弟以兵阻道引軍南趨十七濼是日燔柴翼日次七渡河諸弟各遣人謝罪上猶矜憐許以自新是歲以兵討兩冶以所獲僧崇文等五十人歸西樓建天雄寺以居之以示天助雄武七年春正月甲辰朔以用兵免朝晉王李存勗拔幽州擒劉守光甲寅王師次赤水城弟剌葛等乞降上素服乘赭白馬以將軍耶律樂姑轄剌僅阿鉢為御解兵器肅侍衞以受之因加慰諭剌葛等引退上復數遣使撫慰二月甲戌朔梁均王友貞討殺其兄友珪嗣立三月癸丑次蘆水弟迭剌哥圖為奚王與安端擁千餘騎而至紿稱入覲上怒曰爾曹始謀逆亂朕特恕之使改過自新尚爾反覆將不利於朕遂拘之以所部分隸諸軍而剌葛引其衆至乙室堇淀具天子旗鼓將自立皇太后陰遣人諭令避去會弭姑乃懷里陽言車駕且至其衆驚潰掠居民北走上以兵追之剌葛遣其黨寅底石引兵徑趨行宮焚其輜重廬帳縱兵大殺皇后急遣蜀古魯救之僅得天子旗鼓而已其黨神速姑復劫西樓焚明王樓上至土河秣馬休兵若不為意諸將請急追之上曰俟其遠遁人各懷土懷土既切其心必離我軍乘之破之必矣盡以先所獲資畜分賜將士留夷離畢直里姑總政務夏四月戊寅北追剌葛己卯次彌里問諸弟面木葉山射鬼箭厭禳乃執叛人解里向彼亦以其法厭之至達里淀選輕騎追及培只河盡獲其黨輜重生口先遣室韋及吐渾酋長拔剌迪里姑等五人分兵伏其前路命北宰相迪里古為先鋒進擊之剌葛率兵逆戰迪里古以輕兵薄之其弟遏古只臨陣射數十人斃衆莫敢前相拒至晡衆乃潰追至柴河遂自焚其車乘廬帳而去前遇拔剌迪里姑等伏發合擊遂大敗之剌葛奔潰遺其所奪神帳於路上見而拜奠之所獲生口盡縱歸本土其黨庫古只磨朵皆面縛請罪師次札堵河大雨暴漲五月癸丑遣北宰相迪輦率驍騎先渡甲寅奏擒剌葛涅里袞阿鉢於榆河前北宰相蕭實魯寅底石自剄不殊遂以黑白羊祭天地壬戌剌葛涅里袞阿鉢詣行在以索自縛牽羊望拜上還至大嶺時大軍久出輜重不相屬士卒煮馬駒採野菜以為食孳畜道斃者十七八物價十倍器服資貨委棄於楚里河狼藉數百里因更剌葛名暴里丙寅至庫里以青牛白馬祭天地以生口六百馬二千三百分賜大小鶻軍六月辛巳至榆嶺以轄賴縣人掃古非法殘民磔之甲申上登都庵山撫其先奇首可汗遺跡徘徊顧瞻而興歎焉聞獄官涅離擅造大校人不堪其苦有至死者命誅之壬辰次狼河獲逆黨雅里彌里生埋之銅河南軌下放所俘還多為于骨里所掠上怒引輕騎馳擊復遣驍將分道追襲盡獲其衆并掠者庚子次阿敦濼以養子涅里思附諸弟叛以鬼箭射殺之其餘黨六千各以輕重論刑于厥掠生口者三十餘人亦俾贖其罪放歸本部至石嶺西詔收回軍乏食所棄兵仗召北府兵驗而還之以夷離菫涅里袞附諸弟為叛不忍顯戮命自投崖而死秋八月己卯幸龍眉宮轘逆黨二十九人以其妻女賜有功將校所掠珍寶孳畜還主亡其本物者命責償其家不能償者賜以其部曲九月壬戌上發自西樓冬十月庚午駐赤崖戊寅和州回鶻來貢癸未乙室府人迪里古迷骨離部人特里以從逆誅詔羣臣分決滯訟以韓知古錄其事只里姑掌捕亡十一月祠木葉山還次昭烏山省風俗見高年議朝政定吉凶儀十二月戊子燔柴于蓮花濼八年春正月甲辰以曷魯為迭剌部夷離菫忽烈為惕隱于骨里部人特離敏執逆黨怖胡亞里只等十七人來獻上親鞫之辭多連宗室及有脅從者乃杖殺首惡怖胡餘並原釋于越率懶之子化哥屢蓄姦謀上每優容之而反覆不悛召父老羣臣正其罪幷其子戮之分其財以給衞士有司所鞫逆黨三百餘人獄既具上以人命至重死不復生賜宴一日隨其平生之好使為之酒酣或歌或舞或戲射角觝各極其意明日乃以輕重論刑首惡剌葛其次迭剌哥上猶弟之不忍置法杖而釋之以寅底石安端性本庸弱為剌葛所使皆釋其罪前于越赫底里子解里剌葛妻轄剌已實預逆謀命皆絞殺之寅底石妻涅離脅從安端妻粘睦姑嘗有忠告並免因謂左右曰諸弟性雖敏黠而蓄姦稔惡嘗自矜有出人之智安忍兇狠谿壑可塞而貪黷無厭求人之失雖小而可恕謂重如泰山身行不義雖入大惡謂輕於鴻毛昵比羣小謀及婦人同惡相濟以危國祚雖欲不敗其可得乎北宰相實魯妻餘盧覩姑於國至親一旦負朕從于叛逆未置之法而病死此天誅也解里自幼與朕常同寢食眷遇之厚冠於宗屬亦與其父背大恩而從不軌茲可恕乎秋七月丙申朔有司上諸帳族與謀逆者三百餘人罪狀皆棄市上嘆曰致人于死豈朕所欲若止負朕躬尚可容貸此曹恣行不道殘害忠良塗炭生民剽掠財產民間昔有萬馬今皆徒步有國以來所未嘗有實不得已而誅之冬十月甲子朔建開皇殿於明王樓基九年春正月烏古部叛討平之夏六月幽州軍校齊行本舉其族及其部曲男女三千人請降詔授檢校尚書左僕射賜名兀欲給其廪食數日去幽帥周德威納之及詔索之德威語不遜乃議南征冬十月戊申鈎魚于鴨淥江新羅遣使貢方物高麗遣使進寶劍吳越王錢鏐遣滕彥休來貢是歲君基太一神數見詔圖其像神冊元年春二月丙戌朔上在龍化州迭烈部夷離菫耶律曷魯等率百僚請上尊號三表乃允丙申羣臣及諸屬國築壇州東上尊號曰大聖大明天皇帝后曰應天大明地皇后大赦建元神冊初闕地為壇得金鈴因名其地曰金鈴岡壇側滿林曰冊聖林三月丙辰以迭烈部夷離菫曷魯為阿廬朵里于越百僚進秩頒賚有差賜酺三日立子倍為皇太子夏四月乙酉朔晉幽州節度使盧國用來降以為幽州兵馬留後甲辰梁遣郎公遠來賀六月庚寅吳越王遣滕彥休來貢秋七月壬申親征突厥吐渾党項小蕃沙陀諸部皆平之俘其酋長及其戶萬五千六百鎧甲兵仗器服九十餘萬寶貨駝馬牛羊不可勝算八月拔朔州擒節度使李嗣本勒石紀功於青塚南冬十月癸未朔乘勝而東十一月攻蔚新武媯儒五州斬首萬四千七百餘級自代北至河曲踰陰山盡有其地遂改武州為歸化州媯州為可汗州置西南面招討司選有功者領之其圍蔚州敵樓無故自壞衆軍大譟乘之不踰時而破時梁及吳越二使皆在焉詔引環城觀之因賜滕彥休名曰逑呂十二月收山北八軍二年春二月晉新州禆將盧文進殺節度使李存矩來降進攻其城刺史安金全遁以文進部將劉殷為刺史三月辛亥攻幽州節度使周德威以幽幷鎮定魏五州之兵拒于居庸關之西合戰於新州東大破之斬首三萬餘級殺李嗣恩之子武八以后弟阿骨只為統軍實魯為先鋒東出關略燕趙不遇敵而還己未于骨里叛命室魯以兵討之夏四月壬午圍幽州不克六月乙巳望城中有氣如煙火狀上曰未可攻也以大暑霖潦班師留曷魯盧國用守之剌葛與其子賽保里叛入幽州秋八月李存勗遣李嗣源等救幽州曷魯等以兵少而還三年春正月丙申以皇弟安端為大內惕隱命攻雲州及西南諸部二月達旦國來聘癸亥城皇都以禮部尚書康默記充版築使梁遣使來聘晉吳越渤海高麗回鶻阻卜党項及幽鎮定魏潞等州各遣使來貢夏四月乙巳皇弟迭烈哥謀叛事覺知有罪當誅預為營壙而諸戚請免上素惡其弟寅底石妻涅里袞乃曰涅里袞能代其死則從涅里袞自縊壙中幷以奴女古叛人曷魯只生瘞其中遂赦迭烈哥五月乙亥詔建孔子廟佛寺道觀秋七月乙酉于越曷魯薨上震悼久之輟朝三日贈賻有加冬十二月庚子朔幸遼陽故城辛丑北府宰相蕭敵魯薨戊午以于越曷魯弟汙里軫為迭烈部夷離菫蕭阿古只為北府宰相甲子皇孫隈欲生
